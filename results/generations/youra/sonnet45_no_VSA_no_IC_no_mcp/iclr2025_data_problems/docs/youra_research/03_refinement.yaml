# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CurationTransferTaxonomy-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under foundation model training (pre-training → fine-tuning → RLHF), if we apply
    curation heuristics discovered during pre-training to downstream stages, then
    low-level quality filters (deduplication, perplexity-based outlier removal) will
    transfer robustly while high-level strategies (domain mixing, task-specific filters)
    will require stage-specific tuning, because low-level operations address universal
    data hygiene properties independent of stage objectives while high-level strategies
    are objective-dependent.
  alternative_hypothesis_h0: |
    There is no significant difference in downstream task performance between models
    trained with transferred pre-training curation thresholds versus models trained
    with stage-specific tuned thresholds.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Curation Strategy Source"
      type: "categorical"
      operationalization: "Origin of curation thresholds applied to fine-tuning/RLHF data"
      levels:
        - "Transferred" # Pre-training-derived thresholds
        - "Stage-Tuned" # Independently optimized for current stage
        - "Baseline-None" # No curation filtering
    - name: "Curation Technique Category"
      type: "categorical"
      operationalization: "Type of curation operation being tested"
      levels:
        - "Transfer-Stable" # Deduplication, format validation, language detection
        - "Transfer-Sensitive" # Perplexity thresholds, domain ratios, diversity metrics
        - "Non-Transferable" # Task-specific filters, preference alignment criteria
  dependent:
    - name: "Downstream Task Performance"
      type: "continuous"
      operationalization: "Accuracy on standard benchmarks (MMLU, HellaSwag, TruthfulQA)"
      primary: true
    - name: "Performance Delta"
      type: "continuous"
      operationalization: "% difference between Transferred and Stage-Tuned conditions"
      primary: false
  controlled:
    - name: "Model Architecture"
      operationalization: "Fixed architecture (e.g., Llama-7B) across all conditions"
    - name: "Hyperparameters"
      operationalization: "Fixed learning rate, batch size, training steps"
    - name: "Pre-training Data Quality"
      operationalization: "Use same pre-training checkpoint across conditions"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Low-level curation operations (deduplication, outlier removal) address universal data hygiene independent of stage objectives"
      evidence: "Prof. Pax (Exchange 5): 'These features aren't about stage goals—they're about data hygiene, which is universal'"
      falsifier: "If low-level operations show stage-specific optimal thresholds that differ significantly (>10% performance delta when mismatched), then hygiene is NOT universal"
    - step: 2
      description: "Transfer stability correlates with objective-independence - operations tied to stage goals (domain mixing for coverage, task filters for performance) require stage-specific tuning"
      evidence: "Dr. Nova (Exchange 7): Categorization into transfer-stable vs transfer-sensitive based on dependence on stage objectives"
      falsifier: "If high-level strategies transfer as well as low-level ones (within 1% delta), then objective-dependence doesn't predict transfer stability"
    - step: 3
      description: "Applying transferred low-level thresholds to downstream stages yields performance equivalent to stage-tuned thresholds, while transferred high-level strategies degrade performance"
      evidence: "Prof. Vera (Exchange 2): Prediction of >2% gain for transferred filters vs. no filtering, Prof. Rex (Exchange 6): challenge to show transferred > tuned for genuinely transferable operations"
      falsifier: "If transferred low-level thresholds underperform stage-tuned by >1%, or transferred high-level strategies perform equivalently, mechanism fails"
  key_tension: "Distinguishing transfer stability from trivial 'best practices work everywhere' - must show differential transfer behavior across categories"
  evidence_summary: |
    Discussion converged on hypothesis that transfer stability is categorical not universal.
    Evidence will come from systematic ablation showing distinct transfer profiles.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pre-training curation thresholds were optimized (or near-optimal) for pre-training"
    supporting_evidence: "None currently - identified as gap by Prof. Rex (Exchange 6)"
    consequence_if_violated: "Transferring suboptimal thresholds would yield poor baseline, masking true transfer potential"
  - id: "A2"
    assumption: "Distribution shift between pre-training and fine-tuning data doesn't fundamentally change what constitutes an 'outlier'"
    supporting_evidence: "Proposed but not validated - Prof. Rex (Exchange 6) raised as risk"
    consequence_if_violated: "Transferred thresholds could hurt performance if distribution shift redefines outlier boundaries"
  - id: "A3"
    assumption: "Low-level curation operations are truly objective-independent across stages"
    supporting_evidence: "Prof. Pax (Exchange 4/5) reasoning about data hygiene universality"
    consequence_if_violated: "All techniques might show transfer sensitivity, collapsing the taxonomy"
  - id: "A4"
    assumption: "Performance differences are attributable to curation, not confounds (architecture, hyperparameters, data quality)"
    supporting_evidence: "Prof. Vera (Exchange 2) identified required controls"
    consequence_if_violated: "Measured effects could be noise from uncontrolled variables"
  - id: "A5"
    assumption: "Existing benchmarks (MMLU, HellaSwag) are sensitive enough to detect 1-2% performance differences from curation"
    supporting_evidence: "Prof. Vera's success criteria threshold (Exchange 2)"
    consequence_if_violated: "True transfer effects might exist but be undetectable with chosen metrics"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Foundation model training pipelines with sequential stages (pre-training, fine-tuning, RLHF)
    - Language models trained on text corpora
    - Curation techniques with quantifiable thresholds (perplexity cutoffs, deduplication similarity, format rules)
    - Standard supervised fine-tuning and RLHF workflows
  does_not_apply_to: |
    - Single-stage training (no transfer opportunity)
    - Multimodal models (visual/audio curation may have different transfer properties - acknowledged limitation)
    - Curation strategies without clear thresholds (qualitative filtering)
    - Domain-specific models where pre-training and fine-tuning data are from same narrow domain (minimal distribution shift)
  known_limitations: |
    - Experiment focuses on text-based language models
    - Transfer stability may depend on degree of distribution shift (not systematically varied)
    - Taxonomy is proposed categories, not derived from theory
    - Does not address computational cost of curation operations

