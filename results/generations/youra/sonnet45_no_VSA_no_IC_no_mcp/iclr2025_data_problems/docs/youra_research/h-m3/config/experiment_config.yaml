# h-m3 Embedding-Stage Mismatch Experiment Config
experiment:
  hypothesis_id: h-m3
  name: embedding_stage_mismatch
  tier: PoC
  seed: 42

dataset:
  name: databricks/databricks-dolly-15k
  split: train
  cache_dir: data/dolly_15k
  expected_samples: 15015
  subset_sizes: [2000, 5000, 10000]

embedding_models:
  early:
    model_id: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384
    task_instruction: null
  mid:
    model_id: sentence-transformers/all-mpnet-base-v2
    dimension: 768
    task_instruction: null
  late:
    model_id: hkunlp/instructor-large
    dimension: 768
    task_instruction: "Represent the instruction-response pair for diversity-based selection:"

subset_selection:
  algorithm: k_center_greedy
  distance_metric: cosine
  initialization: random
  seed: 42

base_model:
  model_id: meta-llama/Llama-2-7b-hf
  cache_dir: models/llama2_base
  max_seq_length: 512

training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  warmup_steps: 100
  lr_scheduler_type: cosine
  optimizer: adamw
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  seed: 42
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 1
  output_dir: models/

evaluation:
  framework: lm-evaluation-harness
  tasks: [mmlu, hellaswag]
  num_fewshot:
    mmlu: 5
    hellaswag: 10
  batch_size: 8
  device: cuda:0

paths:
  data_dir: data/
  embeddings_dir: data/embeddings/
  subsets_dir: data/subsets/
  models_dir: models/
  results_dir: results/
  analysis_dir: results/analysis/
  figures_dir: results/analysis/figures/

success_criteria:
  stage_mismatch_penalty_threshold: 0.02
  speed_advantage_threshold: 3.0
  quality_bound_threshold: 0.01
