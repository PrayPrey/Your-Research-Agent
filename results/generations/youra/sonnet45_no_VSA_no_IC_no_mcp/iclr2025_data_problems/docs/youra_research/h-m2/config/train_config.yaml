# Fixed training configuration (PoC: GPT-2 355M)
model:
  name: "gpt2"
  max_seq_length: 256

training:
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5
  warmup_steps: 50
  lr_scheduler: "linear"
  optimizer: "adamw"
  seed: 42
  fp16: false
  logging_steps: 25
  save_strategy: "epoch"
  save_total_limit: 1
