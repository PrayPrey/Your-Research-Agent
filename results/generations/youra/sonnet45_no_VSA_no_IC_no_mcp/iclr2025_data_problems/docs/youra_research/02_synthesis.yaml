hypothesis_draft:
  title: "Characterizing Transfer Stability of Data Curation Techniques Across Foundation Model Training Stages"
  hypothesis_id: "H-CurationTransferTaxonomy-v1"
  core_claim: |
    Different curation heuristics exhibit varying degrees of transfer stability across FM
    training stages. Low-level quality filters (deduplication, outlier removal) transfer
    robustly, while high-level strategies (domain mixing, task-specific filters) require
    stage-specific tuning. Transfer stability correlates with objective-independence.
  mechanism: |
    Certain curation operations address universal data hygiene properties (duplicates,
    format errors, statistical outliers) independent of stage objectives (pre-training's
    broad coverage vs fine-tuning's task performance vs RLHF's preference alignment).
    These objective-independent operations transfer because their optimal thresholds
    depend on data quality, not training goals. Objective-dependent strategies fail
    to transfer because their optimal configurations vary with each stage's distinct
    optimization target.
  predictions:
    - P1: "Transferred low-level thresholds perform within 1% of stage-tuned thresholds"
    - P2: "Transferred high-level strategies degrade >5% vs stage-tuned"
    - P3: "Low-level transferred outperforms no-curation baseline by >2%"

variables_summary:
  independent: "Curation Strategy Source (Transferred/Stage-Tuned/Baseline), Curation Technique Category (Transfer-Stable/Sensitive/Non-Transferable)"
  dependent_primary: "Downstream Task Performance (MMLU, HellaSwag accuracy)"
  controlled: "Model architecture, hyperparameters, pre-training data quality"

null_hypothesis:
  h0_statement: |
    There is no significant difference in downstream task performance between models
    trained with transferred pre-training curation thresholds versus models trained
    with stage-specific tuned thresholds.
  statistical_test: "Two-tailed t-test comparing performance distributions"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic characterization of curation transfer behavior creating empirically-grounded taxonomy"
  differentiation_summary: |
    Prior work treats curation as stage-specific optimization (DataComp for pre-training,
    instruction filtering for fine-tuning). This work investigates which curation
    components transfer across stages and which require re-tuning, formalizing
    practitioner intuitions into testable hypotheses.

