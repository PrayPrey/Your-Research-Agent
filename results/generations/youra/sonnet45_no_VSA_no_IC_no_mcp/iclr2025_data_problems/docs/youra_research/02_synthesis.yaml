    - step: "Create 3 fine-tuning datasets: (1) Transferred thresholds, (2) Stage-tuned thresholds, (3) No curation"
    - step: "Fine-tune Llama-2-7B on each dataset with fixed hyperparameters"
    - step: "Evaluate on downstream benchmarks, measure performance delta"
    - step: "Repeat for high-level techniques (domain mixing) and low-level techniques (dedup/perplexity)"
