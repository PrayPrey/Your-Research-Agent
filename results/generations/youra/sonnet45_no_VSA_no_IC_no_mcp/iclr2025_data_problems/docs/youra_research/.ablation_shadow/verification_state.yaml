main_hypothesis:
  id: H-CurationTransferTaxonomy-v1
  title: Characterizing Transfer Stability of Data Curation Techniques Across FM Training Stages
  statement: Under foundation model training (pre-training → fine-tuning → RLHF), if we apply curation heuristics discovered
    during pre-training to downstream stages, then low-level quality filters will transfer robustly while high-level strategies
    will require stage-specific tuning, because low-level operations address universal data hygiene properties independent
    of stage objectives.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: C4/RedPajama (pre-training), Dolly-15k/Alpaca (fine-tuning)
    model: Llama-2-7B or Pythia-6.9B
    optimizer: AdamW
    hyperparameters:
      lr_range: 1e-5 to 5e-5
      batch_size: 32
      epochs: 3
      seeds:
      - 42
      - 43
      - 44
