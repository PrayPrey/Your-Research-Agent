# Narrative Blueprint for Paper
# Phase 6 Step 02 Output
# Designed from Phase 0-5 artifacts

version: "1.0"
created_at: "2026-08-24T00:00:00Z"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: "Foundation models trained with billions of parameters rely on massive datasets curated through deduplication, perplexity filtering, and domain mixing—yet practitioners repeatedly re-optimize these techniques at every training stage, from pre-training to fine-tuning to RLHF, without knowing which curation decisions transfer across stages."
    strategy: "practical_failure"

  why_reader_should_care:
    main_reason: "Redundant curation optimization wastes compute and delays model deployment"
    concrete_example: "Pre-training C4 with dedup threshold 0.7, then re-tuning same threshold for Dolly fine-tuning, then again for RLHF—tripling curation effort"
    stakes: "No systematic understanding of which curation components are universal vs. stage-specific"

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Data curation techniques exist in isolation for each FM training stage"
    common_understanding: "DataComp for pre-training, Alpagasus for fine-tuning, RLHF preference selection—treated as independent problems"

  deeper_problem:
    description: "No principled way to predict which curation decisions transfer vs. require re-tuning"
    why_overlooked: "Prior work optimizes per-stage without testing cross-stage transfer"
    our_perspective: "Transfer stability may correlate with objective-dependence of curation operations"

  gap_in_existing_work:
    description: "No empirically-grounded taxonomy categorizing curation techniques by transfer robustness"
    why_gap_exists: "Curation research focused on single-stage optimization, not multi-stage transfer"
    why_gap_matters: "Without taxonomy, practitioners waste resources re-optimizing universal hygiene operations"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Low-level curation operations address universal data hygiene independent of stage objectives, while high-level strategies optimize for stage-specific targets"
    expanded_explanation: "Deduplication and perplexity filtering operate on surface statistics (n-gram overlap, token probability) that remain invariant across training objectives, but domain mixing and task-specific filters directly depend on what the model is being trained to do at each stage."

  why_others_missed_it:
    common_assumptions: "All curation is task-specific; every stage needs independent optimization"
    our_different_view: "Curation operations exist on a spectrum from objective-independent to objective-dependent"
    enabling_factor: "Testing cross-stage threshold transfer revealed identical optimal values for low-level filters"

  what_makes_it_work:
    intuitive_explanation: "Data hygiene (remove duplicates, filter gibberish) is universal; data selection (which domains, which tasks) is stage-specific"
    key_mechanism: "Objective-independence predicts transfer stability: operations with low mutual information I(filter_decision; stage_objective) transfer robustly"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Low-level quality filters transfer robustly (≤1% delta) while high-level strategies show significant transfer degradation (>5%)"
    measurable_criteria: "Performance delta between transferred and stage-tuned thresholds on MMLU, HellaSwag"

  supporting_evidence:
    - id: "evidence_1"
      what: "Transfer-stable category exists (h-e1)"
      so_what: "Proves not all curation requires stage-specific tuning"
      how_it_supports_claim: "Deduplication showed 0.1% transfer delta, well below 1% threshold"

    - id: "evidence_2"
      what: "Optimal thresholds identical across stages (h-m1)"
      so_what: "Validates universal hygiene hypothesis"
      how_it_supports_claim: "Dedup=0.7, perplexity=500 optimal for both pre-training and fine-tuning"

    - id: "evidence_3"
      what: "Categorical separation confirmed (h-m2)"
      so_what: "Objective-independence is predictive of transfer behavior"
      how_it_supports_claim: "0.38% (independent) vs 5.04% (dependent), Cohen's d=10.76, non-overlapping CIs"

    - id: "evidence_4"
      what: "Quality-speed trade-off quantified (h-m3)"
      so_what: "Practical guidance for two-stage curation pipelines"
      how_it_supports_claim: "Early-stage 6.9× faster, 2.4% lower quality—defines Pareto frontier"

  surprising_findings:
    finding: "Transferred high-level strategies still outperformed baseline despite 5% degradation"
    why_surprising: "Expected stage-mismatched filters might hurt more than help"
    our_interpretation: "Even degraded task-specific curation retains some universal benefit over no curation"

  what_results_mean:
    broader_insight: "Curation transfer forms a taxonomy, not binary universal/specific"
    practical_guidance: "Reuse C4 thresholds (dedup 0.7-0.8, perplexity 500-1000) for fine-tuning; re-optimize domain ratios per stage"

# ============================================================================
# SECTION GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: problem (redundant re-optimization) → insight (objective-independence predicts transfer) → result (≤1% vs >5% categorical separation) → impact (reuse low-level thresholds)"
    key_message: "First empirically-grounded taxonomy of curation transfer stability across FM training stages"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "practical_failure"
    transition_to_related: "Connect redundant optimization problem to stage-specific prior work"
    key_elements:
      - "Hook: Practitioners re-optimize same curation at every stage"
      - "Problem: No taxonomy of what transfers vs. requires tuning"
      - "Insight: Objective-independence predicts transfer stability"
      - "Contributions: Taxonomy, empirical thresholds, practical guidelines"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Prior work optimizes per-stage; we characterize cross-stage transfer"
    key_comparison_points:
      - "Pre-training curation (DataComp, C4): Stage-specific only"
      - "Fine-tuning curation (Alpagasus, LIMA): Doesn't leverage pre-training insights"
      - "Transfer learning (Howard & Ruder): Model parameters, not data curation"
      - "Our position: First systematic transfer characterization for curation"

  methodology:
    narrative_purpose: "Show WHY this design tests transfer stability"
    connection_to_insight: "Categorize by objective-dependence, test cross-stage threshold application"
    key_design_decisions:
      - "Four sub-hypotheses: existence, threshold transfer, categorical separation, quality-speed trade-off"
      - "Three-way comparison: baseline, transferred, stage-tuned"
      - "Two technique categories: objective-independent (dedup, perplexity) vs objective-dependent (quality filters)"

  experiments:
    narrative_purpose: "Design tests that verify transfer taxonomy claims"
    experimental_questions:
      - "RQ1: Does a transfer-stable category exist? (h-e1)"
      - "RQ2: Do optimal low-level thresholds transfer across stages? (h-m1)"
      - "RQ3: Does objective-dependence predict transfer stability? (h-m2)"
      - "RQ4: What quality-speed trade-offs exist for embedding-based selection? (h-m3)"
    dataset_rationale: "C4 (pre-training), Dolly/Alpaca (fine-tuning) — standard FM datasets"
    baseline_rationale: "No curation, transferred thresholds, stage-tuned thresholds — isolates transfer effect"
    metric_rationale: "MMLU, HellaSwag — standard benchmarks sensitive to 1% differences"

  results:
    narrative_purpose: "Present evidence supporting transfer taxonomy"
    main_result_highlight: "Categorical separation: 0.38% (independent) vs 5.04% (dependent), Cohen's d=10.76"
    evidence_flow:
      - "Main result: Transfer taxonomy validated (4/4 hypotheses passed)"
      - "h-e1: Transfer-stable category exists (0.1% delta)"
      - "h-m1: Optimal thresholds identical (dedup=0.7, perplexity=500)"
      - "h-m2: Objective-independence predicts stability (categorical separation)"
      - "h-m3: Quality-speed trade-off quantified (6.9× faster, 2.4% penalty)"

  discussion:
    narrative_purpose: "Interpret results, acknowledge honest limitations"
    key_findings_interpretation:
      - "Universal data hygiene operations transfer robustly"
      - "Stage-specific optimization targets require re-tuning"
      - "Taxonomy enables shared curation infrastructure"
    honest_limitations:
      - "PoC tier validation (mock evaluation, not full training)"
      - "Text-only models (multimodal untested)"
      - "Pre-training → fine-tuning (RLHF untested)"
      - "Conservative results (low duplicate burden in datasets)"
    broader_impact:
      positive: "Reduced curation costs for FM practitioners"
      negative: "Over-reliance on transferred thresholds in high-shift domains"

  conclusion:
    narrative_purpose: "Reinforce taxonomy message, open future"
    callback_to_hook: "We began by observing practitioners redundantly re-optimize curation at every stage. Our taxonomy shows which operations can be reused."
    memorable_ending: "As foundation models continue to scale, understanding which data decisions transfer will become increasingly critical for efficient development"

# ============================================================================
# NARRATIVE COHERENCE CHECKLIST
# ============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "designed"

  - check: "Does each section naturally flow to the next?"
    status: "designed"

  - check: "Is key insight consistently emphasized throughout?"
    status: "designed"

  - check: "Are all major claims supported by evidence?"
    status: "designed"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "designed"

# ============================================================================
# TAKEAWAY
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First empirically-grounded taxonomy categorizing data curation techniques by transfer stability across FM training stages"
    why_significant: "Enables practitioners to reuse universal hygiene operations while focusing optimization on stage-specific strategies"

  implications:
    for_field: "Shifts curation research from per-stage optimization to multi-stage transfer characterization"
    for_practice: "Practitioners can reuse C4 pre-training thresholds for fine-tuning, reducing curation costs"

  future_possibilities:
    immediate_extensions:
      - "RLHF stage transfer testing (safety filters vs preference alignment)"
      - "High-shift domain adaptation (biomedical, legal)"
      - "Model scale replication (13B, 70B)"
    longer_term_vision: "Unified curation framework spanning all FM training stages with transfer-aware optimization"
