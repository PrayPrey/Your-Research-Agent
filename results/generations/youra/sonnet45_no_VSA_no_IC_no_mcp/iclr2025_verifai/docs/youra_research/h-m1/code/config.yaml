dataset:
  name: "openai_humaneval"
  split: "test"
  poc_subset_size: 3

model:
  name: "meta-llama/CodeLlama-7b-hf"
  device: "auto"
  dtype: "float16"

beam_search:
  k: 5
  max_new_tokens: 256
  temperature: 1.0
  do_sample: false

ablation:
  k_values: [3, 5, 10]
  num_problems: 3

gate:
  beam_maintenance: 1.0
  diversity_ratio_min: 0.6

output:
  figures_dir: "figures"
  results_file: "outputs/ablation_results.json"
  log_file: "outputs/mechanism_log.txt"

random_seed: 42
