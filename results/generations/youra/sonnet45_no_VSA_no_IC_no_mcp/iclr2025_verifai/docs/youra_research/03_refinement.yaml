# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Syntax errors dominate CodeLlama-7B HumanEval failures (64-68%) vs type errors (20%)"
      status: "BUILD_ON"
      evidence: "h-m1 failure analysis from .serena/memories/failure_h-m1_run1.md"
    - claim: "Soft logit penalties (-2.0) are insufficient for meaningful constraint enforcement"
      status: "BUILD_ON"
      evidence: "h-m1 showed type error rate INCREASED (84% → 88%) with -2.0 penalty"
    - claim: "Mypy evaluation pipeline (subprocess wrapper, error taxonomy, statistical tests) is robust and reusable"
      status: "BUILD_ON"
      evidence: "h-m1 validation infrastructure worked correctly despite hypothesis failure"
    - claim: "Beam search with custom scoring functions is a standard generation technique"
      status: "BUILD_ON"
      evidence: "Implemented in HuggingFace transformers, widely used in NMT (length normalization, coverage penalty)"
    - claim: "AST parsing in Python is fast enough for real-time validation"
      status: "BUILD_ON"
      evidence: "Python's ast module is optimized for parse speed, ~10-50ms per parse for typical code snippets"
  scope_reduction_percentage: 80
  phase2b_4_instructions: |
    Phase 2B and later phases should BUILD_ON these established claims rather than re-proving them.

    Key established infrastructure to reuse:
    - h-m1's Mypy evaluation pipeline (subprocess wrapper, error taxonomy, statistical tests)
    - h-m1's constraint application pattern (AST extraction, violation detection)
    - Standard beam search implementation (HuggingFace transformers)

    What MUST BE PROVEN (not established):
    - That syntax validity scoring in beam search reduces syntax errors by ≥40%
    - That α=0.7, β=0.3 balances likelihood and validity optimally
    - That compensatory type error increase does not occur
    - That generation quality (pass@1) is maintained

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SyntaxBeam-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under code generation tasks on HumanEval benchmark with CodeLlama-7B, if we apply
    beam search (k=5) with combined scoring (final_score = α * log_likelihood + β * syntax_validity_score,
    where α=0.7, β=0.3, and syntax_validity_score = 1 if ast.parse() succeeds else 0), then syntax
    error rate will drop from 64-68% baseline to ≤40% (≥40% relative reduction), because beam search
    explores multiple candidate paths and validity scoring prunes syntactically invalid beams,
    preventing the model from committing to invalid paths early (which greedy sampling cannot recover from).
  alternative_hypothesis_h0: |
    There is no significant difference in syntax error rate between greedy sampling baseline
    (64-68%) and validity-scored beam search (α=0.7, β=0.3, k=5) on HumanEval-164 with CodeLlama-7B.

