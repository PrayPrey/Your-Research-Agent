experimental_setup:
  dataset:
    name: "HumanEval-164"
    type: "standard"
    source: "OpenAI HumanEval benchmark (164 hand-written Python programming problems)"
    path: "https://github.com/openai/human-eval"
    hypothesis_fit: "HumanEval is the same benchmark used in h-m1 baseline, enabling direct comparison. Syntax error rate (64-68%) is well-established from h-m1 analysis. Problem diversity (nested loops, list comprehensions, recursion, control flow, string manipulation) tests validity scoring under varied syntax patterns."
  model:
    name: "CodeLlama-7B"
    type: "autoregressive language model"
    source: "Meta CodeLlama (7B parameter variant)"
    hypothesis_fit: "Same model as h-m1 baseline (enables direct comparison of greedy sampling vs validity-scored beam search). Small enough to exhibit syntax errors frequently (64-68%) where validity scoring provides value. Large enough to generate coherent code for beam search to work with."
  baselines:
    - name: "Greedy Sampling Baseline"
      method: "CodeLlama-7B with greedy sampling (temperature=0.8, no beam search, no validity scoring)"
      performance: "Syntax error rate 64-68% (h-m1 baseline), Type error rate ~20%, Pass@1 ~30%"
    - name: "h-m1 Type-Constrained Baseline"
      method: "CodeLlama-7B with type constraint weighted logits (penalty_weight=-2.0)"
      performance: "Syntax error rate 88% (WORSE than baseline), Type error rate 84%, Failed due to weak penalty and wrong failure mode target"

