      operationalization: "Maximum generation length fixed at 512 tokens per sample"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Beam search maintains k=5 candidate sequences instead of committing to a single path (greedy sampling)"
      evidence: "Standard beam search theory: parallel exploration allows backtracking from poor early choices"
      falsifier: "If beam search with α=1.0, β=0.0 (no validity scoring) does not outperform greedy sampling, beam exploration alone is insufficient"
    - step: 2
      description: "At each generation step, each beam candidate is scored by combined objective: final_score = α * log_likelihood + β * syntax_validity_score"
      evidence: "Custom scoring functions in beam search are standard (e.g., NMT length normalization); AST parse check provides binary validity signal"
      falsifier: "If validity_score computation (ast.parse() check) introduces >100ms latency per beam step, computational cost becomes prohibitive"
    - step: 3
      description: "Syntactically invalid beams receive lower scores (validity_score=0) and are pruned over time in favor of valid beams (validity_score=1)"
      evidence: "Beam pruning mechanism: lower-scoring beams are dropped when new candidates are added"
      falsifier: "If valid beams (validity_score=1) consistently receive lower log_likelihood than invalid beams, β=0.3 weight is insufficient to overcome likelihood bias"
    - step: 4
      description: "Final generated code is selected from top-scoring beam, which has been validated for syntax correctness throughout generation process"
      evidence: "Unlike greedy sampling (no intermediate validation) or post-generation rejection sampling (expensive), beam validity scoring validates incrementally"
      falsifier: "If top-scoring beam at completion still has syntax errors, validity scoring during generation does not guarantee final validity"
  key_tension: "Balancing model log-likelihood (fluency, coherence) vs syntax validity (correctness). Too much validity weight (β>0.5) sacrifices fluency; too little (β<0.2) fails to constrain syntax."
  evidence_summary: |
    Causal mechanism builds on established facts:
    - h-m1 showed greedy sampling with soft penalties (-2.0) fails (Step 1 justification)
    - Beam search with custom scoring is proven technique (Step 2 justification)
    - AST parsing is computationally feasible (Step 2 feasibility)
    - Beam pruning is standard mechanism (Step 3 justification)

    Key uncertainty: Optimal α/β balance (addressed by 5-problem PoC grid search)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Syntax validity (AST parse success) is a meaningful signal of code correctness"
    supporting_evidence: "h-m1 analysis shows 64-68% syntax errors dominate failures; fixing syntax is necessary (though not sufficient) for pass@1 improvement"
    consequence_if_violated: "If syntax-valid code is frequently semantically incorrect, validity scoring reduces syntax errors but does not improve pass@1 (metric degrades)"
  - id: "A2"
    assumption: "Beam search k=5 is sufficient to explore diverse syntax paths without excessive compute cost"
    supporting_evidence: "Standard NMT uses k=4-10; preliminary estimate ~2-4 hours for HumanEval-164 (acceptable for research)"
    consequence_if_violated: "If k=5 is too small to find valid beams, syntax error rate remains high; if k=5 is too large, compute cost becomes prohibitive (>8 hours)"
  - id: "A3"
    assumption: "α=0.7, β=0.3 balances log-likelihood and validity optimally"
    supporting_evidence: "5-problem PoC gate will validate this via grid search over (0.5,0.5), (0.6,0.4), (0.7,0.3), (0.8,0.2)"
    consequence_if_violated: "If α/β is suboptimal, either syntax errors remain high (β too low) or generation quality degrades (β too high, pass@1 drops >5pp)"
  - id: "A4"
    assumption: "Fixing syntax errors does not cause compensatory increase in type errors"
    supporting_evidence: "h-m1 showed type constraint caused syntax increase (compensatory failure can go both directions); monitoring both error types is critical"
    consequence_if_violated: "If type error rate increases >5pp while syntax errors decrease, we've shifted failure mode rather than solving it"
  - id: "A5"
    assumption: "AST parse checks at each beam step are fast enough (<50ms per check) to avoid computational bottleneck"
    supporting_evidence: "Python ast module is optimized; typical code snippets parse in 10-50ms"
    consequence_if_violated: "If AST parsing introduces >100ms latency per beam step, total generation time becomes prohibitive (>8 hours for HumanEval-164)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Code generation tasks with well-defined syntax (Python, languages with AST parsers)
    - Benchmarks where syntax errors are a dominant failure mode (≥50% of errors)
    - Small-to-medium models (7B parameters) where syntax guidance provides value
    - Tasks where beam search is computationally feasible (problem count × beam width × tokens < 100k forward passes)
  does_not_apply_to: |
    - Semantic correctness (validity scoring only checks syntax, not logic)
    - Large models (GPT-4, Claude) where base syntax accuracy is already high (>90%)
    - Natural language generation (no well-defined syntax to validate)
    - Real-time applications where 2-4 hour generation time is prohibitive
    - Benchmarks where type/semantic errors dominate over syntax errors
  known_limitations: |
    - Variant A (simple parse-check validity) does not capture nuanced syntax correctness (semantically weird but syntactically valid code may score high)
    - Beam search k=5 is arbitrary; optimal beam width may vary by problem complexity
    - α/β tuning is hyperparameter search; optimal weights may differ across benchmarks
    - Computational cost ~2-4 hours for HumanEval-164 (5× slower than greedy sampling)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Beam search (k=5) with α=0.7, β=0.3 scoring reduces syntax error rate from 64-68% baseline to ≤40% on HumanEval-164"
    test_method: "Generate code samples for all 164 HumanEval problems using validity-scored beam search; parse each sample with ast.parse(); compute syntax error rate = (failed parses / total samples) × 100%"
    success_criterion: "Syntax error rate ≤40% (≥40% relative reduction from 64-68% baseline)"
    falsification: "Syntax error rate >50% (less than 25% relative reduction is insufficient improvement)"
  - id: "P2"
    primary: false
    statement: "Type error rate does not increase by >5 percentage points compared to baseline (no compensatory failure)"
    test_method: "Run Mypy type checker on all generated samples (reusing h-m1's evaluation pipeline); compute type error rate = (samples with type violations / total samples) × 100%"
    success_criterion: "Type error rate ≤ baseline + 5pp (e.g., if baseline is 20%, accept up to 25%)"
    falsification: "Type error rate > baseline + 5pp indicates compensatory failure (fixing syntax broke types)"
  - id: "P3"
    primary: false
    statement: "Pass@1 metric (correctness) is maintained within -2pp of baseline"
    test_method: "Execute generated code against HumanEval test cases; compute pass@1 = (problems with ≥1 correct sample / 164 total problems) × 100%"
    success_criterion: "Pass@1 ≥ baseline - 2pp (e.g., if baseline is 30%, accept ≥28%)"
    falsification: "Pass@1 < baseline - 5pp indicates validity scoring sacrificed generation quality unacceptably"

