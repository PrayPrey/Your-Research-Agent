variables:
  independent:
    - name: "Generation Strategy"
      type: "categorical"
      operationalization: "Greedy sampling (baseline) vs Beam search with validity scoring (α=0.7, β=0.3, k=5)"
      levels:
        - "greedy_baseline"
        - "validity_beam_search"
    - name: "Beam Width k"
      type: "categorical"
      operationalization: "Number of beams in beam search (k=3, 5, 10 for ablation study)"
      levels:
        - "k=3"
        - "k=5"
        - "k=10"
    - name: "Scoring Weights α, β"
      type: "categorical"
      operationalization: "Combination of log-likelihood weight α and validity weight β"
      levels:
        - "α=0.5, β=0.5"
        - "α=0.6, β=0.4"
        - "α=0.7, β=0.3"
        - "α=0.8, β=0.2"
  dependent:
    - name: "Syntax Error Rate"
      type: "continuous"
