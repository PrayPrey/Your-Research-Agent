# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Syntax validity as a scoring dimension in beam search for code generation (not hard constraint, not soft penalty, but explicit scoring component)"
  key_innovation: "Targeting the dominant failure mode (syntax 64-68%) identified through h-m1 failure analysis, using beam search validity scoring instead of greedy sampling with penalties"
  differentiation:
    - prior_work: "h-m1 (Type-Constrained Decoding)"
      difference: "h-m1 targeted minority failure mode (type errors 20%) with soft logit penalties (-2.0) on greedy sampling. This work targets majority failure mode (syntax errors 64-68%) with beam search validity scoring (α=0.7, β=0.3)."
    - prior_work: "NeuroLogic Decoding, GeLM (Constrained Decoding)"
      difference: "Prior constrained decoding work focuses on semantic constraints or grammar-based generation. This work uses syntax validity (AST parse success) as a lightweight scoring dimension, not a hard grammar constraint."
    - prior_work: "SYNCHROMESH (Grammar-Based Code Generation)"
      difference: "SYNCHROMESH uses formal grammars to guarantee syntax validity (hard constraint). This work uses validity scoring in beam search (soft guidance), allowing model likelihood to still influence generation."

