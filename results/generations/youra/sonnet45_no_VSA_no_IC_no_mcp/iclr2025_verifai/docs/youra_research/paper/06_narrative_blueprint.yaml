# PART 4: LIMITATIONS & FUTURE WORK
# ═══════════════════════════════════════════════════════════════════════════════

limitations:
  honest_limitations:
    - limitation: "Mock execution (CPU fallback)—quantitative metrics directionally validated but not confirmed on real GPU inference."
      consequence: "Absolute error rates (23.78%) require GPU confirmation; intermediate gates validated with real logic + synthetic data."
      mitigation_if_any: "Rerun h-m4 on GPU with actual CodeLlama-7B (2-3 hours)."

    - limitation: "P2 (type errors) and P3 (pass@1) not measured—secondary predictions inconclusive."
      consequence: "No evidence of compensatory failures (type errors increasing) or functional correctness maintained."
      mitigation_if_any: "Integrate Mypy evaluation (4-6 hours) and HumanEval test execution (6-8 hours)."

    - limitation: "Syntax-only validation—AST parse check doesn't detect semantic errors (e.g., 'result = \"string\" + 5' parses but fails at runtime)."
      consequence: "Upper bound: cannot exceed semantic correctness of base model. Syntactically valid but semantically incorrect code may score high."
      mitigation_if_any: "Extend to type-aware scoring (β_type weight for Mypy), addressed in Variant B future work."

    - limitation: "Small model scope (CodeLlama-7B only)—larger models (GPT-4, Claude) already achieve >90% syntax accuracy."
      consequence: "Diminishing returns on models with already-high baseline accuracy. Target application is resource-constrained settings."
      mitigation_if_any: "Test on CodeLlama-13B, 34B to characterize scaling behavior."

    - limitation: "Computational cost (4.5× greedy runtime)—k=5 beam search takes 4.5min vs ~1min for greedy on HumanEval-164."
      consequence: "Not suitable for latency-sensitive applications (<100ms). Applicable to offline batch generation or IDE autocomplete with acceptable latency."
      mitigation_if_any: "Reduce k (k=3 for 3× overhead) or apply to offline generation only."

  scope_boundaries:
    applies_to: "Code generation with small models (≤13B), Python (AST parseable), syntax-dominated failure modes (≥50% errors), offline/batch generation."
    does_not_apply_to: "Semantic correctness (requires different validation), large models (already accurate), real-time applications (<100ms latency), non-Python languages without fast AST parsing."

