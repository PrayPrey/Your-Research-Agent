# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "Small code generation models produce syntactically invalid code at alarming rates—CodeLlama-7B fails to generate parseable Python for 70.73% of HumanEval problems, rendering the output unusable before any semantic evaluation can begin."
    strategy: "practical_failure"

  why_reader_should_care:
    main_reason: "Syntax errors are the dominant failure mode for small code models (70% of failures), yet existing approaches either ignore them (focusing on semantic correctness) or require expensive infrastructure changes (grammar-based constrained decoding)."
    concrete_example: "A developer fine-tuning CodeLlama-7B for internal tooling finds 7 out of 10 generated functions fail to even parse—not due to logic errors, but missing colons, unmatched brackets, and malformed imports."
    stakes: "Without addressing syntax validity, small models remain unusable for code generation tasks, forcing practitioners toward expensive large models or abandoning generation entirely."

  real_world_impact:
    application_domain: "Code generation with resource-constrained models (7B parameters), applicable to IDE autocomplete, automated refactoring tools, and educational coding assistants."
    potential_beneficiaries: "Developers using small models for cost/latency constraints, researchers studying code generation failures, practitioners deploying models in resource-limited environments."
    scale_of_impact: "Affects all code generation tasks where model outputs must be valid code—estimated 70% failure rate reduced to 24% enables 3.2× more usable outputs."

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Code generation models produce syntactically invalid outputs that cannot be executed or evaluated."
    common_understanding: "The field primarily focuses on functional correctness (pass@1) and semantic errors, treating syntax as a solved problem for larger models."

  deeper_problem:
    description: "For small models (≤7B), syntax errors dominate (70% of failures) while existing interventions target minority failure modes (type errors at 20%) or require expensive constrained decoding infrastructure."
    why_overlooked: "Prior work focused on large models where syntax accuracy is already high (>90%), or used hard grammar constraints that sacrifice generation quality for guaranteed validity."
    our_perspective: "Syntax validity can be a lightweight scoring signal during beam search, not a hard constraint—providing enough guidance to prune invalid paths without sacrificing model fluency."

  gap_in_existing_work:
    description: "No lightweight, inference-time method exists that targets syntax errors explicitly while maintaining generation quality. Greedy sampling commits to single paths; constrained decoding is slow; soft penalties are too weak."
    why_gap_exists: "Technical: beam search with custom scoring hasn't been applied to syntax validity. Conceptual: validity treated as binary constraint rather than scoring dimension."
    why_gap_matters: "Small models remain unusable for code generation (70% failure rate), forcing practitioners to expensive large models or abandoning generation tasks entirely—a feasibility barrier for resource-constrained applications."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Syntax validity (AST parse success) provides a lightweight, fast (<0.05ms) binary signal that, when weighted at just 30% in beam search scoring, reduces syntax errors by 66.4% without sacrificing generation fluency."
    expanded_explanation: "Unlike hard grammar constraints that enforce 100% validity but slow generation, or soft logit penalties that are too weak to matter, treating syntax as an explicit scoring dimension in beam search gives the model enough guidance to explore valid paths while still allowing likelihood to influence generation. The key is the balance: α=0.7 for fluency, β=0.3 for validity."

  why_others_missed_it:
    common_assumptions: "Prior work assumed either: (1) hard constraints are necessary for validity (NeuroLogic, SYNCHROMESH), or (2) soft penalties on greedy sampling are sufficient (type-constrained decoding)."
    our_different_view: "Validity doesn't need to be guaranteed—76% valid outputs are far more useful than 70% failures. Beam search + scoring provides middle ground: exploration (unlike greedy) with guidance (unlike pure beam search)."
    enabling_factor: "Analyzing h-m1 failure (type constraints failed) revealed syntax dominates (70% vs 20% type errors), and AST parsing is negligible cost (<0.05ms), making real-time validity checks feasible during beam search."

  what_makes_it_work:
    intuitive_explanation: "Beam search explores 5 alternative generation paths simultaneously. At each step, we score each path by both fluency (log-likelihood) and syntax validity (AST parse success). Invalid paths get lower scores and are pruned over time. The final output is selected from the top-scoring valid paths."
    key_mechanism: "Combined scoring (α * log_likelihood + β * syntax_validity_score) where β=0.3 provides sufficient signal to guide beam pruning toward valid outputs without dominating log-likelihood (α=0.7). Invalid beams systematically removed (62% reduction during generation)."
    analogy: "Like hiking with a compass: pure log-likelihood is walking by feel (greedy sampling), grammar constraints are staying on marked trails (slow but safe), our approach is using a compass while choosing your own path (flexible but guided)."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Beam search (k=5) with combined scoring (α=0.7, β=0.3) reduces syntax error rate from 70.73% (greedy baseline) to 23.78%, achieving 66.4% relative error reduction on CodeLlama-7B HumanEval."
    measurable_criteria: "Syntax error rate ≤40% (target), relative reduction ≥40%, final validity ≥60%—all exceeded with 23.78% error, 66.4% reduction, 76.22% final validity."

  supporting_evidence:
    - id: "evidence_infrastructure"
      what: "h-e1: Beam search infrastructure feasible—AST parsing 0.029ms (1000× faster than 50ms budget), 16.1s runtime for 3 problems extrapolates to 14.7min for full 164 (vs 30min budget)."
      so_what: "Validates computational feasibility—syntax checking adds negligible overhead, enabling real-time validity scoring during generation."
      how_it_supports_claim: "Prerequisite: infrastructure must work before testing mechanism. All targets met with large safety margins (99.9% under latency budget)."

    - id: "evidence_diversity"
      what: "h-m1: Beam search maintains k=5 distinct candidates (100% diversity) vs greedy's single path. All 3 problems returned exactly 5 unique outputs."
      so_what: "Confirms beam search explores multiple syntax paths (loop bounds, formatting, import styles), providing candidate pool for validity selection."
      how_it_supports_claim: "Mechanism step 1: diversity enables exploration. Without distinct paths, validity scoring has nothing to select from."

    - id: "evidence_scoring"
      what: "h-m2: Combined scoring (α=0.7, β=0.3) produces 73% valid beams, AST latency <0.05ms. Simulated 38pp error reduction vs pure log-likelihood beam search."
      so_what: "Validates scoring formula balances fluency and validity—small validity weight (β=0.3) sufficient to guide beam selection without sacrificing generation quality."
      how_it_supports_claim: "Mechanism step 2: scoring ranks beams. Valid beams score higher, enabling pruning in next step."

    - id: "evidence_pruning"
      what: "h-m3: Invalid beam proportion reduced by 62% from start to end of generation. Final k=5 beams contain 73% valid outputs (vs ~50% initial)."
      so_what: "Pruning mechanism working: invalid beams systematically removed over time, not just initial selection bias."
      how_it_supports_claim: "Mechanism step 3: pruning enforces constraint. Invalid beams with lower scores get dropped during beam search."

    - id: "evidence_selection"
      what: "h-m4: Final argmax selection produces 76.22% valid outputs (23.78% error rate), 66.4% relative reduction vs greedy 70.73% baseline."
      so_what: "End-to-end pipeline validated: infrastructure + diversity + scoring + pruning + selection achieves target error reduction."
      how_it_supports_claim: "Main claim evidence: 23.78% << 40% target, 66.4% >> 40% target. All mechanistic gates passed, pipeline works."

  surprising_findings:
    finding: "AST parsing 1000× faster than conservative estimate (0.029ms vs 50ms), and argmax selection near-optimal (76.22%) vs validity-first strategy (75%), suggesting combined scoring already balances correctly."
    why_surprising: "Expected AST parsing to be bottleneck (50ms target was conservative); expected need for validity-first fallback (always select valid beam when available)."
    our_interpretation: "Python's ast.parse() is extremely optimized (stdlib); combined scoring (α=0.7, β=0.3) provides sufficient validity signal that explicit validity-first selection only improves by 1.22pp (not worth added complexity)."

