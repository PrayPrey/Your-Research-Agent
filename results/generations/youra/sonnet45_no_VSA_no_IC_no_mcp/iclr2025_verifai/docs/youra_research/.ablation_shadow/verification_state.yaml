main_hypothesis:
  id: H-SyntaxBeam-v1
  title: Syntax-Aware Beam Search with Validity Scoring
  statement: Under code generation tasks on HumanEval benchmark with CodeLlama-7B, if we apply beam search (k=5) with combined
    scoring (final_score = α * log_likelihood + β * syntax_validity_score, where α=0.7, β=0.3, and syntax_validity_score =
    1 if ast.parse() succeeds else 0), then syntax error rate will drop from 64-68% baseline to ≤40% (≥40% relative reduction),
    because beam search explores multiple candidate paths and validity scoring prunes syntactically invalid beams, preventing
    the model from committing to invalid paths early (which greedy sampling cannot recover from).
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval-164
    model: CodeLlama-7B
    optimizer: null
    hyperparameters:
      beam_width_k:
      - 3
      - 5
      - 10
      scoring_alpha:
      - 0.5
      - 0.6
      - 0.7
      - 0.8
      scoring_beta:
      - 0.5
      - 0.4
      - 0.3
      - 0.2
      temperature: 0.8
      max_tokens: 512
