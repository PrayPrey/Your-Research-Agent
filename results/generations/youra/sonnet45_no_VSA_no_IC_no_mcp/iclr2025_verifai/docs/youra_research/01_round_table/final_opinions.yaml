  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      **Core Claim:** Syntax-aware beam search with validity scoring can significantly reduce syntax
      errors in code generation by treating syntax validity as a scoring dimension rather than a hard
      constraint or soft penalty.

      **Mechanism:** During beam search, each candidate sequence is scored by combining model
      log-likelihood with syntax validity (proportion of AST parse checks passed). Invalid beams are
      not rejected outright but receive lower scores, allowing the search to explore syntactically
      valid paths preferentially while maintaining generation fluency.

      **Key Predictions:**
      1. Beam search (k=5) with α=0.7, β=0.3 will reduce syntax error rate from 64-68% to ≤40% on HumanEval-164
      2. Type error rate will not increase by >5pp (no compensatory failure)
      3. Pass@1 metric will remain within -2pp of baseline (generation quality maintained)

      **Experimental Approach:** 5-problem PoC gate testing α/β combinations; gate success: ≥1
      combination achieves <45% syntax error rate on 5-problem subset; full run only if gate passes;
      Variant A (simple parse-check) for initial validation, Variant B (learned features) as future
      enhancement.

      **Why This Works:** Targets dominant failure mode (syntax 64-68%) vs h-m1's minority target
      (type 20%); beam search allows exploration vs greedy's committed path; validity scoring balances
      correctness with fluency vs hard constraints or weak penalties; reuses h-m1's robust evaluation
      infrastructure.
    key_points:
      - "Two-stage approach: strong soft penalties during generation + post-generation validation"
      - "Multi-benchmark harvest (HumanEval + MBPP) reduces overfitting risk"
      - "Selective application at high-risk positions reduces compute cost"
      - "Reuses h-m1's evaluation pipeline infrastructure (Mypy, error taxonomy, statistical tests)"

  refiner_critic:
    agent: "Prof. Rex"
