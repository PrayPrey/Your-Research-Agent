# Phase 3 Implementation Tasks: h-m4
# Generated: 2026-08-25
# Hypothesis: Post-hoc experimental validation (MECHANISM)
# Task Budget: FULL tier (30 max)

metadata:
  hypothesis_id: h-m4
  hypothesis_type: MECHANISM
  tier: FULL
  total_budget: 30
  epic_count: 6
  subtask_count: 2
  total_tasks: 8
  generated_at: "2026-08-25T09:07:00Z"

# Data Preparation (Priority: CRITICAL, Execute First)
data_preparation:
  - id: DP-1
    name: "Load h-m1 Knowledge Base"
    description: "Load KB YAML file with (D,B,M) triples for existence checks"
    type: data_preparation
    priority: CRITICAL
    complexity: 3
    estimated_effort: "5 minutes"
    dependencies: []
    acceptance_criteria:
      - "KB loaded from h-m1/data/pwc_cache/kb.yaml"
      - "Triple count verified"
      - "Access method: kb[dataset][benchmark][metric] → bool"

  - id: DP-2
    name: "Load h-m3 Confound Patterns"
    description: "Copy confound pattern database from h-m3 for detection"
    type: data_preparation
    priority: CRITICAL
    complexity: 2
    estimated_effort: "3 minutes"
    dependencies: []
    acceptance_criteria:
      - "15 confound patterns copied from h-m3/src/confound_db.py"
      - "Domain coverage: NLP, Vision, Training"
      - "Pattern format: {name, keywords, description}"

# Environment Setup (Priority: HIGH, Execute Before Implementation)
environment_setup: []

# Epic Tasks (6 total, from Architecture)
epic_tasks:
  - id: A-1
    name: "Hypothesis Generator"
    description: "LLM-based pool generation (100 diverse hypotheses)"
    type: implementation
    priority: HIGH
    complexity: 8
    breakdown:
      api: 3
      templates: 2
      balance: 2
      schema: 1
    estimated_effort: "30 minutes"
    dependencies: []
    acceptance_criteria:
      - "Generate 100 unique hypotheses via LLM API"
      - "Domain balance: ~25 per domain (NLP, Vision, Training, Multimodal)"
      - "Complexity balance: ~33 per level (simple, moderate, complex)"
      - "JSON schema: {id, statement, domain, complexity, intervention, outcome, expected_dbm}"
      - "Ground truth (D,B,M) existence encoded in generation"
    output_files:
      - "src/generator.py"
      - "data/hypothesis_pool.json"

  - id: A-2
    name: "Verification Pipeline"
    description: "KB lookup + confound detection integration"
    type: implementation
    priority: HIGH
    complexity: 7
    breakdown:
      kb_load: 2
      confound_copy: 2
      classify: 2
      interface: 1
    estimated_effort: "25 minutes"
    dependencies: [DP-1, DP-2]
    acceptance_criteria:
      - "Check (D,B,M) triple exists in KB (exact match)"
      - "Flag confounds using h-m3 keyword patterns"
      - "Classification: 'testable' if (DBM exists AND no confounds), else 'not-testable'"
      - "Return classification + reason for each hypothesis"
    output_files:
      - "src/verifier.py"

  - id: A-3
    name: "Experiment Executor"
    description: "Simplified PoC runner (20 experiments)"
    type: implementation
    priority: HIGH
    complexity: 10
    breakdown:
      dataset_load: 3
      control: 2
      treatment: 2
      stats: 2
      mock: 1
    estimated_effort: "40 minutes"
    dependencies: [A-3-ST1, A-3-ST2]
    acceptance_criteria:
      - "Load dataset/model from (D,B,M) triple"
      - "Run control condition (baseline model)"
      - "Run treatment condition (intervention applied)"
      - "Compute p-value using scipy.stats.ttest_ind"
      - "Mock data fallback if real D,B,M fails"
      - "Execution time: <10 minutes for 20 experiments"
    output_files:
      - "src/executor.py"

  - id: A-4
    name: "Statistical Validator"
    description: "Success rate + binomial test + gate check"
    type: implementation
    priority: HIGH
    complexity: 6
    breakdown:
      metrics: 2
      binomial: 2
      gate: 1
      report: 1
    estimated_effort: "20 minutes"
    dependencies: [A-3]
    acceptance_criteria:
      - "Calculate success rate: (# p < 0.05) / 20"
      - "Binomial test vs H0: p=0.50 (random baseline)"
      - "Gate check: success_rate >= 0.65 (MUST_WORK threshold)"
      - "Report: gate status, PoC status, p-value vs baseline"
    output_files:
      - "src/validator.py"

  - id: A-5
    name: "Sampler + Visualizer"
    description: "Random sampling + 4 required figures"
    type: implementation
    priority: MEDIUM
    complexity: 8
    breakdown:
      sampling: 2
      gate_fig: 2
      domain_fig: 2
      pie: 1
      hist: 1
    estimated_effort: "25 minutes"
    dependencies: [A-2, A-4]
    acceptance_criteria:
      - "Random sample k=20 from testable pool (without replacement)"
      - "Figure 1: Gate metrics comparison (mandatory)"
      - "Figure 2: Success rate by domain breakdown"
      - "Figure 3: Classification distribution pie chart"
      - "Figure 4: P-value distribution histogram"
      - "All figures saved to h-m4/figures/"
    output_files:
      - "src/sampler.py"
      - "src/visualizer.py"
      - "figures/*.png"

  - id: A-6
    name: "Pipeline Orchestrator"
    description: "main.py integration + data persistence"
    type: implementation
    priority: HIGH
    complexity: 7
    breakdown:
      flow: 3
      save: 2
      error: 1
      config: 1
    estimated_effort: "20 minutes"
    dependencies: [A-1, A-2, A-3, A-4, A-5]
    acceptance_criteria:
      - "Orchestrate full pipeline: generate → verify → sample → execute → validate"
      - "Save intermediate outputs (hypothesis_pool, testable_pool, sampled, results)"
      - "Error handling: graceful degradation if <20 testable hypotheses"
      - "Config loading from config.py (seeds, thresholds, paths)"
      - "Return final metrics dict"
    output_files:
      - "src/main.py"

# Subtasks (2 total, from Logic Agent - A-3 decomposition)
subtasks:
  - id: A-3-ST1
    parent_epic: A-3
    name: "Dataset/Model Loader"
    description: "Load real or mock datasets for PoC experiments"
    type: implementation
    priority: HIGH
    complexity: 5
    estimated_effort: "15 minutes"
    dependencies: []
    acceptance_criteria:
      - "Load dataset by name (e.g., 'CIFAR-10', 'ImageNet')"
      - "Load model by benchmark (e.g., 'image-classification', 'NLI')"
      - "Mock data fallback: synthetic dataset with known effect size"
      - "Return: (X_train, y_train, X_test, y_test)"
    output_files:
      - "src/data_loader.py"

  - id: A-3-ST2
    parent_epic: A-3
    name: "Control/Treatment Runner"
    description: "Execute control and treatment conditions for PoC experiments"
    type: implementation
    priority: HIGH
    complexity: 5
    estimated_effort: "15 minutes"
    dependencies: [A-3-ST1]
    acceptance_criteria:
      - "Run control: baseline model on dataset (5 trials)"
      - "Run treatment: intervention applied (5 trials)"
      - "Intervention types: hyperparameter change, augmentation, architecture tweak"
      - "Collect results: accuracy/loss per trial"
      - "Return: (control_results, treatment_results)"
    output_files:
      - "src/experiment_runner.py"

# Failsafe Tasks (Optional, Execute if Critical Failures Occur)
failsafe_tasks: []

# Task Execution Order
execution_order:
  phase_1_data:
    - DP-1
    - DP-2
  phase_2_implementation:
    - A-1  # Generator (no dependencies)
    - A-2  # Verifier (needs DP-1, DP-2)
  phase_3_experiments:
    - A-3-ST1  # Loader (for A-3)
    - A-3-ST2  # Runner (needs A-3-ST1)
    - A-3  # Executor (needs subtasks)
    - A-4  # Validator (needs A-3)
  phase_4_visualization:
    - A-5  # Sampler + Visualizer (needs A-2, A-4)
  phase_5_integration:
    - A-6  # Orchestrator (needs all above)

# Validation Checklist
validation:
  gate_condition: "success_rate >= 0.65 (MUST_WORK)"
  poc_condition: "success_rate > 0.50 (better than random)"
  required_outputs:
    - "data/hypothesis_pool.json (100 hypotheses)"
    - "data/testable_pool.json (filtered)"
    - "data/sampled_hypotheses.json (20)"
    - "data/experimental_results.json (p-values)"
    - "figures/gate_metrics_comparison.png"
    - "figures/success_rate_by_domain.png"
    - "figures/classification_distribution.png"
    - "figures/pvalue_distribution.png"
    - "04_validation.md (Phase 4 output)"
  success_criteria:
    - "All 100 hypotheses generated"
    - "All 100 verified (classified)"
    - "20 sampled from testable pool"
    - "20 experiments executed with p-values"
    - "Success rate calculated"
    - "Gate status determined (PASS/FAIL)"
    - "4 figures generated"
