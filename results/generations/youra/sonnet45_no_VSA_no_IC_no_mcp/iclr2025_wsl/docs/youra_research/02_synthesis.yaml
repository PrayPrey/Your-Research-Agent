  datasets: ["Papers With Code Catalog (Jan 2026 snapshot) as KB source", "100 DL hypotheses from recent papers (2024-2026) as test set"]
  baselines: ["Random Classification (50% accuracy)", "Expert Judgment (3-person majority vote, ~80-85% inter-rater reliability)"]

measurement_plan:
  data_collection:
    - source: "Scrape Papers With Code for (Dataset, Benchmark, Metric) triples"
    - source: "Curate 100 DL hypotheses from papers (2024-2026); 50 expert-labeled testable, 50 not testable"
    - source: "Curate 30 labeled confound cases (15 known-confounded, 15 unconfounded) from literature"
  procedure:
    - step: "Build KB from Papers With Code (Jan 2026 snapshot)"
    - step: "Implement formal verification logic: ∃ (D,B,M) such that H testable"
    - step: "Populate confound database from NLP/vision literature (tokenizer-size, resolution-architecture patterns)"
    - step: "System classifies 100 hypotheses as testable/not-testable"
    - step: "Randomly sample 20 hypotheses; actually run experiments to measure p-values"
    - step: "Measure: (# correct classifications) / 20 = system accuracy"
    - step: "Usability test: 10 non-expert users add (D,B,M) triples; measure success rate and time"
    - step: "Confound precision test: system flags confounds on 30 labeled cases; measure precision"
  success_criteria:
    - "P1: System accuracy >75% (vs 50% random, vs 80-85% expert)"
    - "P2: ≥8 out of 10 users succeed in <10 min"
    - "P3: Confound precision >60%"

validation:
  internal_validity:
    - "Control for hypothesis source: all from recent DL papers (2024-2026) to ensure domain relevance"
    - "Control for KB snapshot: fixed Jan 2026 catalog to ensure reproducibility"
    - "Control for expert labeling: 3 independent experts use standardized protocol"
    - "Random sampling for experimental validation: avoid selection bias"
  external_validity:
    - "Generalizability limited to domains with established benchmarks (vision, NLP, generative models)"
    - "KB completeness depends on Papers With Code coverage (may miss obscure datasets)"
    - "Confound patterns identified from literature may not cover novel confounds"
    - "Usability tested on graduate students; may differ for other user groups"

