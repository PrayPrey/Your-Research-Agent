hypothesis_draft:
  title: "Constraint-Satisfiability Verification for DL Hypothesis Testability"
  hypothesis_id: "H-ConstraintSatChecker-v1"
  core_claim: |
    A formal constraint-satisfiability verification system with an extensible knowledge base can accurately classify
    deep learning hypotheses as testable/not-testable (>75% accuracy) using only existing datasets and benchmarks,
    validated against actual experimental outcomes rather than circular expert judgment.
  mechanism: |
    The system constructs a knowledge base of (Dataset, Benchmark, Metric) triples from catalogs like Papers With Code.
    Given hypothesis H, it performs formal verification: ∃ (D,B,M) where M(H_intervention) - M(H_baseline) is measurable
    without human input. The system also flags known confound patterns from literature, preventing "technically correct
    but pragmatically useless" classifications. Post-hoc experimental validation (running actual experiments on sampled
    hypotheses) provides ground truth for system accuracy.
  predictions:
    - P1: "System achieves >75% accuracy on testability classification when validated against experimental outcomes (p < 0.05 results = testable)"
    - P2: "80% of non-expert users successfully add new (D,B,M) triples to KB in <10 minutes"
    - P3: "Confound flagging achieves >60% precision on labeled confounded hypotheses"

variables_summary:
  independent: "Classification Method (constraint-sat-checker vs random vs expert-judgment)"
  dependent_primary: "Testability Classification Accuracy (% correct when validated against experimental p < 0.05 outcomes)"
  controlled: "Hypothesis Source (DL papers 2024-2026), KB Snapshot Date (Jan 2026), Expert Labeling Protocol (3 independent experts)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in testability classification accuracy between the constraint-satisfiability system
    and random classification (50% baseline), when validated against actual experimental outcomes.
  statistical_test: "One-sample proportion test (system accuracy vs 50% null), two-sample test (system vs expert baseline)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Post-hoc experimental validation (actual p < 0.05 results) as ground truth for testability, avoiding circular expert agreement"
  differentiation_summary: |
    Prior work: Papers With Code (static catalog), expert reviews (circular agreement), meta-analyses (retrospective).
    This work: Formal verification system + post-hoc experimental validation + extensible KB + cross-domain confound detection.
    Dr. Nova (Exchange 7) identified post-hoc validation as methodologically novel in meta-research tools.
    Prof. Rex (Exchange 6) demonstrated expert agreement is circular; experimental outcomes are objective ground truth.

