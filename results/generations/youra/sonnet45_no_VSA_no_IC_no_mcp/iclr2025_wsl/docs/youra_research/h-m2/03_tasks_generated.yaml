  # Epic A-2: Verifier Implementation (Complexity: 8)
  - id: A-2
    type: epic
    title: Constraint-Satisfiability Verifier
    description: Implement ∃ (D,B,M) verification logic with keyword extraction
    complexity: 8
    status: NOT_STARTED
    prerequisites:
      - A-1
    deliverables:
      - src/verifier.py
    acceptance_criteria:
      - extract_dbm() extracts (D,B,M) from hypothesis text via keyword matching
      - verify() returns "testable" if ∃ (D,B,M) ∈ KB, else "not_testable"
      - Deterministic behavior (same input → same output)
      - Handles edge cases (empty text, no match found)
    references:
      - 03_architecture.md (Module 2)
      - 03_logic.md (L-1 ConstraintSatisfiabilityVerifier)
      - 02c_experiment_brief.md (pseudo-code lines 88-109)
    implementation_notes:
      - Use case-insensitive keyword matching
      - Extract: check if KB triple's D, B, M all appear in hypothesis text
      - Existence check: exact string match against KB triples
      - Return "not_testable" if extraction fails (conservative)
    complexity_breakdown:
      extraction_logic: 3
      matching_logic: 3
      verification_logic: 2

  # Epic A-3: Evaluation Harness (Complexity: 6)
  - id: A-3
    type: epic
