    callback_to_hook: "We opened with the problem of researchers wasting months on infeasible hypotheses. Our system addresses this via upfront testability verification — 90% accuracy (18/20 experimental validations), 0% false positives, and non-circular ground truth evaluation. The graduate student formulating a fairness hypothesis can now verify dataset constraint satisfaction in minutes, not weeks."

    memorable_ending: "By treating testability as a verifiable predicate rather than expert intuition, we establish a new standard for meta-research tool evaluation: validate against experimental outcomes, not circular consensus. Future work will close the external validity gap (real-world experiments, not PoC), extend KB coverage to 95%+, and demonstrate semantic extraction at scale."

    future_work_vision: "Beyond incremental improvements (multi-source KB, living confound database), the vision is deployment-ready testability verification integrated into research workflow tools (hypothesis management systems, experiment tracking platforms). Partial confidence scoring exposes uncertainty for borderline cases. Real-world experiment execution validates external generalization. The ultimate goal: eliminate 50% post-hoc infeasibility rate through systematic upfront constraint checking."

