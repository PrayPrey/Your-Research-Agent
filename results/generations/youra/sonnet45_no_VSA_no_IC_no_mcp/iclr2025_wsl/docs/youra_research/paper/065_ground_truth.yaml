    source: "045_validated_hypothesis.md Section 5.3"
    verification_status: "SUPPORTED"

  - claim_id: "experimental_ground_truth"
    paper_statement: "First system validating testability against experiments (not expert consensus)"
    actual_evidence: "h-m4: 20 hypotheses tested, p-values measured, 90% success rate"
    source: "045_validated_hypothesis.md Section 8.1"
    verification_status: "NOVEL_CONTRIBUTION"

  - claim_id: "conservative_design"
    paper_statement: "Prioritizes precision (0% FPR) over recall (10%)"
