# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Classification Method"
      type: "categorical"
      operationalization: "System classification (constraint-sat checker) vs Random baseline vs Expert judgment"
      levels: ["constraint-sat-checker", "random-baseline", "expert-judgment"]
  dependent:
    - name: "Testability Classification Accuracy"
      type: "continuous"
      operationalization: "Percentage of hypotheses correctly classified as testable/not-testable when validated against actual experimental outcomes (p < 0.05 results = testable)"
      primary: true
    - name: "KB Update Usability"
      type: "continuous"
      operationalization: "Percentage of non-expert users who successfully add new (D,B,M) triples in <10 minutes"
      primary: false
    - name: "Confound Flagging Precision"
      type: "continuous"
      operationalization: "Percentage of confound flags that match labeled known-confounded hypotheses"
      primary: false
  controlled:
    - name: "Hypothesis Source"
      operationalization: "All hypotheses sampled from recent DL papers (2024-2026) to ensure domain relevance"
    - name: "KB Snapshot Date"
      operationalization: "Fixed catalog from Papers With Code as of January 2026 to ensure reproducibility"
    - name: "Expert Labeling Protocol"
      operationalization: "3 independent experts label each hypothesis as testable/not-testable using standardized criteria"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Knowledge base (KB) construction: Extract (Dataset D, Benchmark B, Metric M) triples from Papers With Code and similar catalogs, storing metadata on compatibility and known confounds"
      evidence: "Prof. Pax Exchange 4 formalized the (D,B,M) triple structure; Prof. Rex Exchange 6 added confound taxonomy requirement"
      falsifier: "If KB extraction fails to capture >80% of well-known datasets/benchmarks in DL, the KB is incomplete and system predictions become unreliable"
    - step: 2
      description: "Formal verification: Given hypothesis H, system checks ∃ (D,B,M) ∈ KB such that H can be expressed as an intervention testable by that triple (M(H_intervention) - M(H_baseline) is measurable)"
      evidence: "Prof. Pax Exchange 4 defined formal satisfiability criteria; Prof. Vera Exchange 2 demanded explicit operationalization"
      falsifier: "If verification logic produces false positives (marks untestable hypotheses as testable) >25% of the time, the formalism is flawed"
    - step: 3
      description: "Confound pattern detection: System flags hypotheses where known confounds (e.g., correlation-not-causation patterns from prior literature) exist in the proposed (D,B,M) mapping"
      evidence: "Dr. Nova Exchange 7 identified cross-domain confound patterns; Prof. Rex Exchange 6 demanded confound flagging to prevent 'technically correct but pragmatically useless' outputs"
      falsifier: "If flagged confounds have <40% precision (majority are false alarms), the confound database adds noise instead of signal"
    - step: 4
      description: "Post-hoc experimental validation: A sample of system-classified 'testable' hypotheses are actually tested; if they yield p < 0.05 results, they were truly testable (ground truth)"
      evidence: "Prof. Rex Exchange 6 proposed post-hoc validation as superior to circular expert agreement"
      falsifier: "If <65% of 'testable' classifications result in successful experiments, the system's predictions don't match reality"
  key_tension: "Trade-off between KB completeness (coverage) and KB accuracy (precision). Broad coverage may include low-quality datasets/benchmarks; narrow coverage may miss valid testability options."
  evidence_summary: |
    Mechanism is grounded in formal verification theory (Prof. Pax Exchange 4) with empirical validation anchor (Prof. Rex Exchange 6).
    KB construction feasibility established via existing catalog infrastructure. Confound detection leverages cross-domain pattern transfer (Dr. Nova Exchange 7).

