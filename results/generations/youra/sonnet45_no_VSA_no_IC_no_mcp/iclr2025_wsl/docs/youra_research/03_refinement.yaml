    1. **Post-Hoc Experimental Validation**: Validates system predictions by running actual experiments (p < 0.05 results = ground truth). No prior work in meta-research tools uses this standard; most rely on expert agreement, which Prof. Rex (Exchange 6) identified as circular.
    2. **Extensible Knowledge Base**: Users can add new (D,B,M) triples in <10 minutes, making the system self-improving as new datasets emerge. Static catalogs become obsolete; this design grows with the field.
    3. **Cross-Domain Confound Pattern Detection**: Confounds from NLP (e.g., tokenizer-size correlation) transfer to vision (resolution-architecture correlation). Dr. Nova (Exchange 7) identified this as reusable research infrastructure.
  differentiation:
    - prior_work: "Papers With Code catalog"
      difference: "Static listing vs. formal verification system with testability classification"
    - prior_work: "Expert-based research proposal reviews"
      difference: "Circular expert agreement vs. post-hoc experimental ground truth validation"
    - prior_work: "Meta-analysis and survey papers"
      difference: "Retrospective synthesis vs. prospective testability prediction before experiments are run"

