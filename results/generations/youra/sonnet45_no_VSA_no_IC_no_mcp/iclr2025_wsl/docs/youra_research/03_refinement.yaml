# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Papers With Code catalog (Jan 2026 snapshot) is sufficiently complete to represent 'existing datasets and benchmarks' in deep learning"
    supporting_evidence: "Papers With Code is a widely-used aggregator covering major DL benchmarks; Prof. Pax Exchange 4 noted catalog completeness as a manageable risk if scope is transparently bounded"
    consequence_if_violated: "System misses valid testability mappings, producing false negatives (classifies testable hypotheses as untestable)"
  - id: "A2"
    assumption: "Actual experimental outcomes (p < 0.05 results) are a valid ground truth for 'testability' classification"
    supporting_evidence: "Prof. Rex Exchange 6 argued post-hoc validation avoids circular expert bias; statistical significance is an objective measure"
    consequence_if_violated: "Validation metric becomes unreliable; system accuracy cannot be objectively measured"
  - id: "A3"
    assumption: "Known confound patterns from literature generalize across DL domains (NLP → Vision, etc.)"
    supporting_evidence: "Dr. Nova Exchange 7 proposed cross-domain confound transfer (e.g., tokenizer-size confound in NLP parallels resolution-architecture confound in vision)"
    consequence_if_violated: "Confound flagging becomes domain-specific only; cross-domain research gains no benefit from confound database"
  - id: "A4"
    assumption: "Non-expert users can learn a standardized (D,B,M) triple format in <10 minutes"
    supporting_evidence: "Dr. Ally Exchange 5 proposed 10-minute usability test; assumption is that YAML/JSON schema with examples is sufficient"
    consequence_if_violated: "KB extensibility fails; system becomes static and obsolete as new datasets emerge"
  - id: "A5"
    assumption: "Random sample of 20 hypotheses (from 100 total) provides sufficient statistical power to validate system accuracy"
    supporting_evidence: "Standard pilot study size; assumes effect size of ~0.5 (system accuracy 75% vs baseline 50%), power ~0.80 at alpha=0.05"
    consequence_if_violated: "Validation study is underpowered; true system performance remains uncertain"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Deep learning research hypotheses in domains with established benchmark catalogs (vision, NLP, generative models)
    - Research contexts where human evaluation is prohibitively expensive or unavailable
    - Constraint-driven research environments (academic labs, independent researchers with limited resources)
    - Hypotheses testable via automated metrics (accuracy, BLEU, FID, perplexity, etc.)
  does_not_apply_to: |
    - Exploratory research where defining testability upfront is premature (early-stage ideation)
    - Domains with no existing benchmark infrastructure (novel modalities, emerging application areas)
    - Hypotheses requiring subjective human judgment as ground truth (e.g., aesthetic quality, ethical alignment)
    - Scenarios where creating new benchmarks is feasible and necessary for scientific progress
  known_limitations: |
    - KB completeness depends on Papers With Code catalog coverage (biased toward popular benchmarks)
    - Confound flagging limited to documented patterns in literature (won't catch novel confounds)
    - Post-hoc validation is resource-intensive; full validation of all classifications is impractical
    - System provides classification, not causal interpretation (researchers still need domain expertise to understand results)

