# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The constraint-satisfiability checker achieves >75% accuracy in testability classification when validated against actual experimental outcomes (20 randomly sampled hypotheses tested for p < 0.05 results)"
    test_method: "Collect 100 DL hypotheses from recent papers (50 expert-labeled 'testable,' 50 'not testable'). System classifies all 100. Randomly sample 20 hypotheses and actually run experiments. Measure: (# correct classifications) / 20"
    success_criterion: "Accuracy > 75% (vs random baseline 50%, vs expert judgment ~80-85%)"
    falsification: "If accuracy < 65%, system does not outperform chance meaningfully; hypothesis is disproven"
  - id: "P2"
    primary: false
    statement: "80% of non-expert users can successfully add a new (D,B,M) triple to the knowledge base in under 10 minutes using the standardized format"
    test_method: "Recruit 10 non-expert users (e.g., graduate students with basic DL knowledge but unfamiliar with the system). Provide YAML/JSON schema + examples. Task: add a new dataset-benchmark-metric triple. Measure: time to completion + correctness"
    success_criterion: "≥8 out of 10 users complete task correctly in <10 minutes"
    falsification: "If <6 out of 10 succeed, the format is not usable by non-experts; extensibility fails"
  - id: "P3"
    primary: false
    statement: "Confound flagging achieves >60% precision on a labeled set of known-confounded hypotheses"
    test_method: "Curate labeled set of 30 hypotheses: 15 known-confounded (from literature where confounds were later discovered), 15 unconfounded. System flags confounds. Measure: precision = (true positives) / (true positives + false positives)"
    success_criterion: "Precision > 60% (vs random flagging ~30-40%)"
    falsification: "If precision < 40%, confound flagging adds more noise than signal; feature should be removed"

