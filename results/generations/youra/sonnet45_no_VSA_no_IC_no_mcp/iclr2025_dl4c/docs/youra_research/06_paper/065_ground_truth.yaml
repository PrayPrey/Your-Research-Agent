    description: "Sample sizes 50/dataset (vs planned 100), SWE-bench exec-human predicted"
    severity: "MEDIUM"
    mitigation: "Empirical SWE-bench collection (100 samples, Docker, 2 weeks)"
    blocks_publication: false

  simulated_human_ratings:
    description: "Heuristic-based (not real expert annotations), κ=0.72 validated"
    severity: "MEDIUM"
    mitigation: "Expert pilot (50 samples, 3 raters, $1.5k)"
    blocks_publication: false

  ai_feedback_inconsistency:
    description: "h-e1 length heuristic vs h-m3 CodeBERT (confounds supervision gain)"
    severity: "HIGH"
    mitigation: "Zero-shot CodeBERT baseline to isolate supervision effect"
    blocks_publication: true

  swebench_data_gaps:
    description: "SWE-bench exec-human predicted (h-m2 ANOVA), AI-human missing (P2 untested)"
    severity: "MEDIUM"
    mitigation: "Empirical collection (100 samples)"
    blocks_publication: true

  python_only:
    description: "All datasets Python, generalization to Java/C++ uncertain"
    severity: "MEDIUM"
    mitigation: "Cross-language replication (Future Work)"
    blocks_publication: false

# ═══════════════════════════════════════════════════════════════
# NOVELTY CLAIMS (For originality audit)
# ═══════════════════════════════════════════════════════════════

novelty:
  claim1:
    statement: "First systematic mapping of feedback orthogonality (exec/AI/human correlations) segmented by task type"
    differentiation:
      - vs_coderl: "CodeRL execution-only, no AI/human comparison"
      - vs_rlaif: "RLAIF AI vs human for text, no code-specific, no execution"
      - vs_humaneval_plus: "HumanEval+ observed hidden gap, no correlation analysis"

  claim2:
    statement: "Mechanism validation: specification completeness → test coverage → exec-human correlation causal chain"
    differentiation:
      - vs_humaneval_plus: "HumanEval+ observed gap but didn't explain mechanism"
      - novel_contribution: "Quantifies spec completeness via missed dimension rate (2.00× effect)"

  claim3:
    statement: "Supervised AI feedback path for code quality (InstructGPT analogy), ρ=0.85"
    differentiation:
      - vs_instructgpt: "InstructGPT RLHF for text, we validate supervised path for code"
      - vs_codereviewer: "CodeReviewer trained on code quality, no AI-human correlation measurement"

