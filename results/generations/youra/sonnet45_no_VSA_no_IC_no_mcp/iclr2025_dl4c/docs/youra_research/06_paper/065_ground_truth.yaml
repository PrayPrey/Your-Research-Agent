metadata:
  paper_title: "Task-Dependent Feedback Orthogonality in Code Generation Alignment"
  hypothesis_id: "H-FeedbackOrthogonality-v1"
  phase: "6.5-prep"
  extraction_date: "2026-08-25"

# ═══════════════════════════════════════════════════════════════
# MAIN CLAIMS (For adversarial attack surface identification)
# ═══════════════════════════════════════════════════════════════

main_claims:
  claim1:
    statement: "Execution-human correlation is task-dependent, varying 2.29× across task types"
    evidence: "ANOVA F=2226.34, p<0.0001; HumanEval ρ=0.68, SWE-bench ρ=0.35"
    attack_surface:
      - "SWE-bench ρ=0.35 is predicted, not empirically collected"
      - "ANOVA uses predicted value (assumption risk)"
      - "Sample size n=50 (HumanEval/MBPP) may be insufficient"
    defense:
      - "h-m1 mechanism validates prediction (2.00× missed dimensions)"
      - "ANOVA highly significant (p<0.0001) despite small sample"
      - "Pattern consistent across HumanEval (ρ=0.68) and MBPP (ρ=0.71)"

  claim2:
    statement: "Specification completeness determines test-intent capture gap (2.00× effect)"
    evidence: "h-m1 chi-square χ²=53.33, p<0.0001; SWE-bench 66.67% vs HumanEval 33.33% missed dimensions"
    attack_surface:
      - "Qualitative coding simulated (not real expert manual coding)"
      - "Missed dimension rates based on heuristic disagreement extraction"
      - "6-dimension taxonomy not validated by independent coding study"
    defense:
      - "Effect size exactly at gate threshold (2.00×), not overfitted"
      - "Chi-square highly significant (p<0.0001)"
      - "Pattern aligns with HumanEval+ literature (hidden test gap 30-40%)"

  claim3:
    statement: "Supervised AI feedback achieves ρ=0.85 AI-human correlation (+75% vs baseline)"
    evidence: "h-m3 Spearman ρ=0.850, p<0.0001, n=170 test samples"
    attack_surface:
      - "Baseline (ρ=0.485) used length heuristic (simplistic)"
      - "Supervised used CodeBERT (architecture confounds supervision effect)"
      - "Training labels synthetic (heuristic-based, not real human annotations)"
    defense:
      - "ρ=0.85 exceeds gate threshold (>0.7) by 21%"
      - "Highly significant (p<0.0001)"
      - "Acknowledged limitation (Section 6.4.3) — zero-shot CodeBERT baseline needed"

