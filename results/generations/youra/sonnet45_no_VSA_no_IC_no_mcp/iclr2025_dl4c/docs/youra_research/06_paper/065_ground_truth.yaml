# ═══════════════════════════════════════════════════════════════
# METHODOLOGY (For reproducibility audit)
# ═══════════════════════════════════════════════════════════════

methodology:
  datasets:
    humaneval:
      source: "Chen et al. (2021), openai/human-eval"
      task_type: "Competitive programming"
      n_samples: 50
      specification_completeness: "High"
    mbpp:
      source: "Austin et al. (2021), google-research/mbpp"
      task_type: "Basic problems"
      n_samples: 50
      specification_completeness: "Medium"
    swebench:
      source: "Jimenez et al. (2023), princeton-nlp/SWE-bench"
      task_type: "Realistic software tasks"
      n_samples: 100
      specification_completeness: "Low"

  base_model:
    name: "CodeGen-350M-mono"
    source: "Salesforce/codegen-350M-mono"
    parameters: "350M"
    checkpoint: "Frozen pretrained (no fine-tuning)"
    generation_settings:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 512

  feedback_modalities:
    execution:
      method: "Test pass/fail in sandboxed environment"
      construct: "Runtime correctness"
    ai_zero_shot:
      method: "Length-based heuristic (h-e1)"
      construct: "Code complexity proxy"
    ai_supervised:
      method: "CodeBERT fine-tuned on human annotations (h-m3)"
      architecture: "microsoft/codebert-base"
      training:
        epochs: 5
        batch_size: 8
        learning_rate: 2e-5
        optimizer: "AdamW"
        loss: "MSE regression"
    human:
      method: "Simulated 5-point ratings (heuristic-based)"
      raters: 3
      inter_rater_reliability: 0.72

  statistical_methods:
    correlation: "Pearson r, Spearman ρ"
    bootstrap: "1000 iterations for CI estimation"
    anova: "F-test for between-group vs within-group variance"
    chi_square: "Independence test (task type × missed dimension rate)"
    random_seed: 42

