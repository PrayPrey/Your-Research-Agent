        - "Contribution: Task-dependent correlation (ρ 0.68→0.35), mechanism (2× gap), supervised AI (ρ=0.85)"
        - "Impact: Challenges exec-only, validates supervised path, enables adaptation"
        - "Methods: HumanEval/MBPP/SWE-bench, ANOVA, chi-square, supervised CodeBERT"

