        - "Main finding: Execution feedback task-dependent, supervised AI viable"
        - "Impact: Challenges execution-only assumption (CodeRL), enables adaptive weighting"
        - "Future: Dimension-specific feedback, cross-language, adaptive routing"

    - section: "00_abstract"
      written_last: true
      key_points:
