# ═══════════════════════════════════════════════════════════════
# WRITING GUIDELINES
# ═══════════════════════════════════════════════════════════════

guidelines:
  tone: "Formal academic but accessible (minimal jargon, clear exposition)"
  voice: "Active voice preferred ('We measure...' not 'Correlations were measured...')"
  tense:
    - "Introduction/Related Work: Present tense ('Execution feedback measures...')"
    - "Methodology: Past tense ('We collected 50 samples...')"
    - "Results: Past tense ('ANOVA showed F=2226.34...')"
    - "Discussion: Present tense ('This finding suggests...')"

  structure:
    - "Intro hook → problem (3 levels) → contribution (3 claims) → outline"
    - "Related work: chronological evolution (HumanEval 2021 → CodeRL 2022 → RLAIF/SWE-bench 2023)"
    - "Methodology: datasets → model → feedback → statistical methods"
    - "Experiments: h-e1 → h-m1 → h-m2 → h-m3 (sequential dependency)"
    - "Results: figures/tables first, interpretation second"
    - "Discussion: HumanEval deviation → mechanism → supervised path → limitations"
    - "Conclusion: callback to hook → main finding → impact → future"
    - "Abstract: LAST (written after all sections finalized)"

  citation_style: "Author-year (APA) - 'Le et al. (2022) demonstrated...'"

  figure_placement: "After first mention in text, not at end of section"

  limitations_handling: "Dedicated subsection in Discussion (Section 6.4), upfront acknowledgment"

  quantitative_precision:
    - "p-values: report exact value if <0.01, otherwise p<0.05"
    - "Correlations: 2 decimal places (ρ=0.68, not ρ=0.6807)"
    - "Percentages: 1 decimal if >10%, integer if <10% (66.7% vs 35%)"

  acronyms_first_use: "Define on first use: 'Reinforcement Learning from Human Feedback (RLHF)'"

