    - section: "02_related_work"
      positioning: true
      key_points:
        - "CodeRL: execution-only RL, no comparison with AI/human"
        - "RLAIF: AI vs human for text, no code-specific, no execution"
        - "HumanEval+: hidden gap observed but mechanism unexplained"
        - "InstructGPT: RLHF for text, we validate supervised path for code"

    - section: "03_methodology"
      foundation: true
      key_points:
        - "Tri-dataset: HumanEval (competitive), MBPP (basic), SWE-bench (realistic)"
        - "Feedback modalities: execution (test pass/fail), AI (CodeBERT), human (5-point)"
        - "Statistical methods: Pearson/Spearman ρ, ANOVA, chi-square, bootstrap"

  group_b_evidence:
    - section: "04_experiments"
      core_results: true
      key_points:
        - "h-e1: Correlation infrastructure (all p<0.05, κ=0.72)"
        - "h-m1: Specification completeness mechanism (2.00× effect, p<0.0001)"
        - "h-m2: Task-dependent variance (ANOVA F=2226.34, p<0.0001)"
        - "h-m3: Supervised AI effectiveness (ρ=0.85, +75% gain)"

    - section: "05_results"
      synthesis: true
      key_points:
        - "Correlation heatmap: HE 0.68 → MBPP 0.71 → SWE 0.35 (exec-human)"
        - "Intent dimension breakdown: SWE-bench misses 2× vs HumanEval"
        - "ANOVA variance decomposition: 2.29× between-task vs within-task"
        - "Supervised AI performance: ρ=0.85 vs baseline ρ=0.485"

    - section: "06_discussion"
      interpretation: true
      key_points:
        - "HumanEval <0.8 interpretation: hidden test gap (HumanEval+ 30-40% drop)"
        - "Mechanism: specification completeness → test coverage → exec-human correlation"
        - "Supervised learning path: InstructGPT analogy for code quality"
        - "Alternative hypothesis (execution-dominance) falsified"

  group_c_closure:
    - section: "07_conclusion"
      callbacks: true
      key_points:
