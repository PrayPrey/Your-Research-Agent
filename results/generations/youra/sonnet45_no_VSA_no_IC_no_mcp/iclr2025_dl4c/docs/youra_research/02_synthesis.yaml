hypothesis_draft:
  title: "Task-Dependent Feedback Orthogonality in Code Generation Alignment"
  hypothesis_id: "H-FeedbackOrthogonality-v1"
  core_claim: |
    Different alignment feedback modalities (execution-based, AI reward models, human ratings) capture orthogonal error dimensions, and this orthogonality structure varies systematically by task type. Execution feedback correlates highly with human feedback (>0.8) on competitive programming tasks where correctness equals spec adherence, but weakly (<0.5) on spec-heavy tasks where tests don't capture unstated requirements. AI feedback maintains medium correlation (0.5-0.7) across task types.
  mechanism: |
    Feedback signals operate through different measurement constructs: execution measures runtime behavior, AI measures pattern likelihood, human measures intent alignment. When task specifications are fully captured by tests (competitive programming), execution feedback becomes a near-perfect proxy for human judgment. When specifications are underspecified (realistic software tasks), execution feedback misses critical intent dimensions that only human feedback captures.
  predictions:
    - P1: "Execution-human correlation varies by task: competitive (>0.8), basic (0.6-0.8), realistic (<0.5)"
    - P2: "AI-human correlation stable across tasks: 0.5-0.7 regardless of task type"
    - P3: "Between-task correlation variance exceeds within-task variance by ≥2× standard deviations"

variables_summary:
  independent: "Task Type (competitive/basic/realistic), Feedback Modality (execution/AI/human)"
  dependent_primary: "Pairwise Feedback Correlation (Pearson r)"
  controlled: "Base model (frozen Codex/CodeGen), sample size (100/dataset), human rater pool"

null_hypothesis:
  h0_statement: |
    There is no significant difference in execution-human or AI-human correlation structure across task types. All pairwise correlations remain within 0.1 of each other across datasets.
  statistical_test: "One-way ANOVA on correlation coefficients across task types, post-hoc Tukey HSD for pairwise differences"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic mapping of feedback orthogonality space (pairwise correlations) segmented by task type for code generation. Reframes alignment comparison from competitive to complementary modalities."
  differentiation_summary: |
    - CodeRL (2022): Execution-only, no modality comparison
    - RLAIF (2023): AI vs human for text, not code, no execution feedback
    - HumanEval+ (2023): Revealed hidden test gap, didn't measure feedback correlations
    Our contribution: Empirical orthogonality atlas showing where each feedback type provides unique signal.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Codex (code-davinci-002)"
    - "CodeGen (Salesforce/codegen-16B-mono)"
  datasets:
    - "HumanEval (competitive programming)"
    - "MBPP (basic problems)"
    - "SWE-bench (realistic software tasks)"
  baselines:
    - "Uniform correlation baseline (null hypothesis: ±0.1 across tasks)"
    - "Execution-dominance baseline (>0.9 across all tasks)"

measurement_plan:
  data_collection:
    - source: "Generate 100 code samples per dataset with frozen base model"
    - source: "Execution feedback: run test suites, record pass/fail"
    - source: "AI feedback: compute reward model scores (CodeT5/CodeBERT fine-tuned)"
    - source: "Human feedback: 3-5 expert raters, 5-point scale, ~30 hours total"
  procedure:
    - step: "Sample 100 problems from HumanEval, MBPP, SWE-bench"
    - step: "Generate code with frozen Codex/CodeGen (greedy decoding)"
    - step: "Execute generated code against test suites, record binary pass/fail"
    - step: "Score code with AI reward model, record continuous score"
    - step: "Human raters score code on 5-point scale (1=broken, 5=perfect)"
    - step: "Compute Pearson correlations (execution-human, AI-human, execution-AI) per dataset"
    - step: "Test H0: ANOVA on correlations across task types, reject if p<0.05"
  success_criteria:
    - "Execution-human correlation on HumanEval >0.8"
    - "Execution-human correlation on SWE-bench <0.5"
    - "AI-human correlation variance across tasks <0.1"
    - "Between-task variance ≥2× within-task variance (bootstrap 95% CI)"

validation:
  internal_validity:
    - "Frozen base model eliminates confound from model variation"
    - "Same human rater pool across all 300 samples eliminates rater drift"
    - "Inter-rater reliability check (Cohen's kappa >0.6) validates human feedback quality"
    - "Bootstrap resampling (1000 iterations) for confidence intervals on correlations"
  external_validity:
    - "Three datasets (HumanEval, MBPP, SWE-bench) cover spectrum of task types"
    - "Python-only limits generalization to other languages"
    - "Function/module-level code limits generalization to project-level"
    - "Correlation study doesn't prove adaptive weighting improves performance (follow-on work)"

