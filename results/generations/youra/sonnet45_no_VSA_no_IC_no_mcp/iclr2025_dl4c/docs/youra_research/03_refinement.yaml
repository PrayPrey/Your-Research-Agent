# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Execution-based feedback for code generation has been studied in isolation (CodeRL 2022)"
      status: "BUILD_ON"
      evidence: "Phase 1 identified CodeRL as prior work using execution-only feedback"
    - claim: "AI vs human feedback comparison exists for general text (RLAIF 2023) but not code"
      status: "BUILD_ON"
      evidence: "Discussion Exchange 3 cited RLAIF as general text, not code-specific"
    - claim: "Code generation models show ceiling effects on HumanEval (~70-80% pass@1)"
      status: "BUILD_ON"
      evidence: "Discussion Exchange 3 referenced known benchmark plateau"
    - claim: "Hidden test performance gap (HumanEval vs HumanEval+) suggests overfitting to visible feedback"
      status: "BUILD_ON"
      evidence: "Discussion Exchange 3 cited ~40% HumanEval+ vs ~70-80% HumanEval"
    - claim: "No systematic comparison of execution/AI/human feedback modalities exists for code generation"
      status: "PROVE_NEW"
      evidence: "Core gap from Phase 1, confirmed as novel contribution in Discussion Exchange 7"
  scope_reduction_percentage: 20
  phase2b_4_instructions: |
    Claims 1-4 are established facts that need citation but not re-validation.
    Focus Phase 2B verification on Claim 5: proving that feedback orthogonality mapping
    (correlation structure across modalities and task types) is genuinely novel and
    empirically sound. Validation should confirm no prior work systematically measured
    pairwise correlations between execution/AI/human feedback on code generation tasks
    segmented by task type (competitive, basic, realistic).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FeedbackOrthogonality-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under code generation tasks with varying specification completeness (competitive programming, basic problems, realistic software tasks),
    if we measure pairwise correlations between execution-based feedback, AI reward model feedback, and human rating feedback on the same generated code samples,
    then execution-human correlation will vary systematically by task type (>0.8 for competitive, 0.6-0.8 for basic, <0.5 for realistic) while AI-human correlation remains stable (0.5-0.7 across all types),
    because execution feedback measures runtime behavior that only proxies human intent when specifications are fully test-capturable, while AI feedback measures learned patterns that partially overlap with intent regardless of specification completeness.
  alternative_hypothesis_h0: |
    There is no significant difference in execution-human or AI-human correlation structure across task types (competitive, basic, realistic). All pairwise correlations remain within 0.1 of each other across datasets.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Task Type"
      type: "categorical"
      operationalization: "Dataset category: HumanEval (competitive), MBPP (basic), SWE-bench (realistic)"
      levels:
        - "competitive"
        - "basic"
        - "realistic"
    - name: "Feedback Modality"
      type: "categorical"
      operationalization: "Feedback signal type: execution (test pass/fail), AI (reward model score), human (5-point rating)"
      levels:
        - "execution"
        - "AI"
        - "human"
  dependent:
    - name: "Pairwise Feedback Correlation"
      type: "continuous"
      operationalization: "Pearson correlation coefficient between two feedback modalities on same code samples, range [-1, 1]"
      primary: true
    - name: "Between-Task Correlation Variance"
      type: "continuous"
      operationalization: "Variance in execution-human correlations across task types, measured as standard deviation squared"
      primary: false
  controlled:
    - name: "Base Code Generation Model"
      operationalization: "Frozen Codex/CodeGen checkpoint used to generate all code samples across all conditions"
    - name: "Sample Size per Dataset"
      operationalization: "Fixed at 100 problems per dataset (HumanEval, MBPP, SWE-bench)"
    - name: "Human Rater Pool"
      operationalization: "Same expert raters (n=3-5) for all 300 samples, with inter-rater reliability check (Cohen's kappa >0.6)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Task specification completeness determines whether tests capture human intent"
      evidence: "Competitive programming tasks have complete test suites (correctness = spec adherence), while realistic software tasks have underspecified requirements where tests miss intent dimensions (Discussion Exchange 7)"
      falsifier: "If manual analysis shows SWE-bench test suites capture ≥90% of human intent dimensions (via qualitative coding of failure modes), specification completeness doesn't vary"
    - step: 2
      description: "Execution feedback correlation with human judgment depends on specification completeness"
      evidence: "When tests fully capture intent (competitive), execution feedback becomes near-perfect proxy for human rating. When tests underspecify intent (realistic), execution misses critical dimensions only humans catch (Discussion Exchange 7 prediction)"
      falsifier: "If execution-human correlation is uniform (±0.1) across all task types, execution feedback is either universally good or bad proxy, not task-dependent"
    - step: 3
      description: "AI feedback measures learned surface patterns that partially overlap with intent regardless of specification"
      evidence: "AI reward models trained on code corpora capture stylistic and structural patterns that correlate moderately with human preferences but don't depend on whether tests are complete (Discussion Exchange 7 prediction of stable 0.5-0.7 correlation)"
      falsifier: "If AI-human correlation varies by >0.3 across task types, AI feedback is task-dependent like execution, not stable"
  key_tension: "If execution feedback turns out to dominate (>0.9 correlation with human) across all task types, the task-dependent orthogonality hypothesis is refuted, but we've learned that execution feedback suffices — still publishable (Discussion Exchange 7)"
  evidence_summary: |
    The causal mechanism is grounded in construct validity: execution measures runtime correctness, AI measures pattern likelihood, human measures intent alignment. The hypothesis predicts these constructs correlate differently depending on whether the task's specification (tests) fully captures intent. Evidence for this comes from known gaps between HumanEval and HumanEval+ (hidden test performance drops ~30-40 percentage points), suggesting tests don't always capture full intent.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Human ratings (5-point scale) accurately measure intent alignment for code correctness"
    supporting_evidence: "Standard practice in code review and human evaluation studies; validated by inter-rater reliability checks (Discussion Exchange 7 mitigation strategy)"
    consequence_if_violated: "If human ratings are unreliable (Cohen's kappa <0.6), correlation measurements are noise, experiment fails"
  - id: "A2"
    assumption: "100 samples per dataset provide sufficient statistical power to detect correlation differences of ≥0.3"
    supporting_evidence: "Power analysis: n=100 gives 80% power to detect r=0.3 difference at α=0.05 (Discussion Exchange 7 mentions sensitivity via bootstrap)"
    consequence_if_violated: "If sample size insufficient, correlations have wide confidence intervals, can't distinguish task-dependent from uniform structure"
  - id: "A3"
    assumption: "Execution feedback (test pass/fail) is a valid measure of functional correctness"
    supporting_evidence: "Foundational assumption in code generation benchmarks (HumanEval, MBPP, SWE-bench all use test-based evaluation)"
    consequence_if_violated: "If tests are buggy or incomplete, execution feedback is invalid — but this would affect all code generation research, not just this study"
  - id: "A4"
    assumption: "AI feedback (reward model trained on code corpora) measures learned patterns distinct from execution correctness"
    supporting_evidence: "Construct validity check in Discussion Exchange 4: AI models learn from static code, not runtime behavior"
    consequence_if_violated: "If AI reward model is secretly execution-based (e.g., trained on test pass/fail labels), modalities aren't orthogonal"
  - id: "A5"
    assumption: "Task type categorization (competitive, basic, realistic) reflects genuine differences in specification completeness"
    supporting_evidence: "HumanEval = competitive programming contests (complete specs), SWE-bench = GitHub issues (underspecified), MBPP = educational problems (intermediate) — established benchmark distinctions"
    consequence_if_violated: "If all three datasets have similar specification completeness, task type is a spurious variable, no reason for correlation structure to vary"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Code generation tasks in Python (all three datasets use Python)
    - Function-level and module-level code generation (HumanEval, MBPP are function-level; SWE-bench is module/file-level)
    - Feedback modalities that can be collected on the same code samples (execution, AI, human)
    - Tasks where specification completeness varies (from fully test-specified to underspecified)
  does_not_apply_to: |
    - Other programming languages (generalization to Java, C++, etc. needs separate validation)
    - Project-level or repository-level code generation (beyond SWE-bench's scope)
    - Real-time interactive coding scenarios (study uses offline batch evaluation)
    - Feedback modalities that can't be collected on same samples (e.g., user telemetry)
  known_limitations: |
    - Human feedback is expensive (300 ratings feasible, 3000 not) — limits statistical power for rare task subtypes
    - Execution feedback requires runnable tests — doesn't apply to partial code snippets or pseudocode
    - AI feedback quality depends on reward model training data — results may not generalize to different reward models
    - Correlation is not causation — showing correlation structure doesn't prove adaptive weighting improves model performance (that's follow-on work)

