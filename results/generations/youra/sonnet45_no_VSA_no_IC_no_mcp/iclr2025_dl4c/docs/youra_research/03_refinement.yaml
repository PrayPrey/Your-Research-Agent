predictions:
  - id: "P1"
    primary: true
    statement: "Execution-human feedback correlation varies by task type: >0.8 for competitive (HumanEval), 0.6-0.8 for basic (MBPP), <0.5 for realistic (SWE-bench)"
    test_method: "Generate 100 code samples per dataset with frozen Codex/CodeGen, collect execution feedback (test pass/fail), human ratings (5-point), compute Pearson correlations per dataset"
    success_criterion: "Correlation structure follows predicted pattern: HumanEval >0.8, MBPP 0.6-0.8, SWE-bench <0.5, with between-task variance ≥2× within-task variance"
    falsification: "If all three correlations fall within ±0.1 of each other, task-dependent structure doesn't exist"
  - id: "P2"
    primary: false
    statement: "AI-human feedback correlation remains stable (0.5-0.7) across all task types, unlike execution-human"
    test_method: "Same experiment as P1, measure AI reward model score vs human rating correlations per dataset"
    success_criterion: "AI-human correlation variance across tasks is <0.1 (stable), while execution-human variance is >0.3 (task-dependent)"
    falsification: "If AI-human correlation varies by >0.3 across tasks, AI feedback is task-dependent like execution"
  - id: "P3"
    primary: false
    statement: "Human rater inter-rater reliability exceeds 0.6 (Cohen's kappa), validating human feedback quality"
    test_method: "Each of 300 samples rated by 3 human raters, compute pairwise Cohen's kappa"
    success_criterion: "Mean Cohen's kappa >0.6 across all sample pairs"
    falsification: "If Cohen's kappa <0.6, human ratings are unreliable, correlations are noise"

