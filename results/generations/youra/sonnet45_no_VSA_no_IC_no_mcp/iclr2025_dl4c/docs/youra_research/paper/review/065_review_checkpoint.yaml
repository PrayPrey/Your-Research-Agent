# ═══════════════════════════════════════════════════════════════════════════════
# PERSONAS CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

personas:
  accuracy_checker:
    name: "Accuracy Checker"
    focus:
      - "Numerical consistency (ρ values, p-values, effect sizes)"
      - "Statistical test matching (ANOVA F, chi-square χ², variance ratio)"
      - "Sample size accuracy (n=50/100/170/730)"
      - "Citation completeness (8 key references)"
      - "Ground truth alignment"
    severity_guidelines:
      FATAL: "Contradictory numbers (ρ=0.68 in Abstract, ρ=0.71 in Results)"
      MAJOR: "Missing statistical support for core claim"
      MINOR: "Typo in citation year (2022 vs 2023)"

  bored_reviewer:
    name: "Bored Reviewer"
    focus:
      - "Abstract clarity (can I understand contribution in 30 seconds?)"
      - "Introduction hook (why should I care?)"
      - "Figure/table informativeness (can I skip text?)"
      - "Conclusion actionability (what should I do with this?)"
      - "Skimmability (bold claims, clear structure)"
    severity_guidelines:
      FATAL: "Abstract unreadable, contribution unclear after full read"
      MAJOR: "Key result buried in paragraph (no figure/table)"
      MINOR: "Section heading vague (Methodology vs Experimental Design)"

  skeptical_expert:
    name: "Skeptical Expert"
    focus:
      - "Contribution novelty (is this really first?)"
      - "Methodological rigor (threats to validity acknowledged?)"
      - "Baseline fairness (zero-shot heuristic vs supervised CodeBERT)"
      - "Limitation honesty (simulated ratings, predicted SWE-bench ρ)"
      - "Overclaiming (strong vs moderate evidence)"
    severity_guidelines:
      FATAL: "Contribution claimed as novel but CodeReviewer (2022) did it"
      MAJOR: "Known limitation (simulated ratings) not acknowledged"
      MINOR: "Phrasing slightly strong ('validates' vs 'suggests')"

