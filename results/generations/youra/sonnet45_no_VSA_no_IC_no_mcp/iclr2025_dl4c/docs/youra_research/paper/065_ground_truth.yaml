# ═══════════════════════════════════════════════════════════════════════════════

limitations:
  - id: "L1"
    limitation: "Proof-of-concept scope (50 samples/dataset, predicted SWE-bench ρ)"
    severity: "MEDIUM"
    acknowledged_in_paper: true
    mitigation: "Scale to 500+ samples, empirical SWE-bench collection"

  - id: "L2"
    limitation: "Simulated human ratings (not expert annotations)"
    severity: "MEDIUM"
    acknowledged_in_paper: true
    mitigation: "Pilot study: 50 samples × 3 experts ($1.5k)"

  - id: "L3"
    limitation: "AI feedback inconsistency (h-e1 heuristic vs h-m3 supervised)"
    severity: "HIGH"
    acknowledged_in_paper: true
    mitigation: "Zero-shot CodeBERT baseline to isolate supervision effect"

  - id: "L4"
    limitation: "Python-only scope"
    severity: "MEDIUM"
    acknowledged_in_paper: true
    mitigation: "Java replication (LeetCode, CodeForces, Apache bugs)"

  - id: "L5"
    limitation: "SWE-bench AI-human data missing (P2 untested)"
    severity: "MEDIUM"
    acknowledged_in_paper: true
    mitigation: "Collect SWE-bench AI-human ρ (GPT-3.5 zero-shot)"

# ═══════════════════════════════════════════════════════════════════════════════
# CONTRIBUTIONS (Claimed novelty must be defensible)
# ═══════════════════════════════════════════════════════════════════════════════

contributions:
  - id: "N1"
    claim: "First systematic mapping of feedback orthogonality (exec/AI/human correlations) across task types"
    novelty_type: "first_mapping"
    defensibility: "HIGH"
    supporting_evidence: "No prior work measured pairwise correlations across modalities AND task types"
    potential_challenge: "RLAIF measured AI-human for text (not code, no execution, no task segmentation)"

  - id: "N2"
    claim: "Specification completeness mechanism validation (2.00× missed dimension gap)"
    novelty_type: "mechanistic_explanation"
    defensibility: "HIGH"
    supporting_evidence: "HumanEval+ observed gap but didn't explain mechanism; we quantify via qualitative coding"
    potential_challenge: "HumanEval+ hinted at incomplete tests (no systematic dimension analysis)"

  - id: "N3"
    claim: "Supervised AI path for code (InstructGPT analogy)"
    novelty_type: "method_transfer"
    defensibility: "MEDIUM"
    supporting_evidence: "CodeReviewer used supervised learning for code review (different task); we apply to alignment feedback"
    potential_challenge: "CodeReviewer (Li et al. 2022) already demonstrated supervised learning for code quality"

