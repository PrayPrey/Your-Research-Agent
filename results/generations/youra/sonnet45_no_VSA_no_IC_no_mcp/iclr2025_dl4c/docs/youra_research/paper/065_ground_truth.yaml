adversarial_review_notes: |
  This ground truth file provides authoritative facts for Phase 6.5 adversarial review.

  Primary challenges to anticipate:
  1. SWE-bench ρ=0.35 predicted (not empirical) — h-m1 mechanism validates prediction but absolute value uncertain
  2. Simulated ratings vs expert annotations — κ=0.72 reliability validates consistency but not expert agreement
  3. AI feedback inconsistency (h-e1 heuristic vs h-m3 CodeBERT) — confounds supervision gain with architecture

  Defensible positions:
  1. Pattern robustness (ANOVA p<0.0001, large effect sizes) survives ±0.1 correlation shifts
  2. Mechanism validation (h-m1 chi-square p<0.0001) supports SWE-bench prediction independently
  3. Supervised learning path (ρ=0.85 > 0.7 gate) validates standalone, baseline comparison secondary

  All claims in 06_paper.md must match this ground truth. Adversarial review should verify:
  - Numerical consistency (no conflicting ρ values)
  - Statistical support for claims (p-values, effect sizes cited)
  - Honest limitation reporting (L1-L5 in Discussion)
  - Citation completeness (8 key references)
