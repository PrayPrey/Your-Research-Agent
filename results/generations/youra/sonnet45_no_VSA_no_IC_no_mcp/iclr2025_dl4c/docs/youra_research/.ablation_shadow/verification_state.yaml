main_hypothesis:
  id: H-FeedbackOrthogonality-v1
  title: Task-Dependent Feedback Orthogonality in Code Generation Alignment
  statement: Under code generation tasks with varying specification completeness (competitive programming, basic problems,
    realistic software tasks), if we measure pairwise correlations between execution-based feedback, AI reward model feedback,
    and human rating feedback on the same generated code samples, then execution-human correlation will vary systematically
    by task type (>0.8 for competitive, 0.6-0.8 for basic, <0.5 for realistic) while AI-human correlation remains stable (0.5-0.7
    across all types), because execution feedback measures runtime behavior that only proxies human intent when specifications
    are fully test-capturable, while AI feedback measures learned patterns that partially overlap with intent regardless of
    specification completeness.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval + MBPP + SWE-bench (tri-dataset)
    model: Codex (code-davinci-002) or CodeGen (Salesforce/codegen-16B-mono)
    optimizer: N/A (no training, correlation study only)
    hyperparameters:
      sample_size_per_dataset: 100
      human_raters: 3-5 experts
      correlation_method: Pearson r
      statistical_test: ANOVA + post-hoc Tukey HSD
      significance_level: 0.05
