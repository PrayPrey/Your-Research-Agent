main_hypothesis:
  id: H-TemporalArchSig-v1
  title: Architectural Components as Temporal Filters in Spurious Correlation Learning
  statement: 'Under stochastic spurious correlations (Waterbirds 85% co-occurrence, CelebA 95% co-occurrence), if we compare
    neural network architectures with different normalization (Batch Normalization vs Layer Normalization) and attention mechanisms
    (ResNet-CBAM, Vision Transformer) during training, then we will observe DISTINCT worst-group accuracy gap trajectories
    when measured against training progress (average accuracy on x-axis), because normalization and attention mechanisms differ
    in how they resolve gradient ambiguity from stochastic spurious correlations. Specifically: BN amplifies early spurious
    learning via batch-level statistics, LN reduces it via instance-level normalization, and attention mechanisms enable mid-training
    correction via global feature aggregation.'
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Waterbirds (primary), CelebA (generalization), CMNIST (boundary test)
    model: ResNet-18 (BN/LN/CBAM variants), ViT-Small/DeiT
    optimizer: SGD
    hyperparameters:
      learning_rate: 0.01
      batch_size: 64
      epochs: 100
      seeds: 10
      initialization: He
