    hypothesis_fit: "Waterbirds and CelebA have stochastic binary spurious correlations (background/gender, 85-95% co-occurrence) with group labels, ideal for worst-group metric. CMNIST has deterministic spurious correlation (color, 90%) to test scope boundary."
  model:
    name: "ResNet-18 (BN / LN / CBAM variants) + ViT-Small (or DeiT)"
    type: "Convolutional (ResNet) + Transformer (ViT)"
    source: "PyTorch torchvision (ResNet), timm library (ViT/DeiT), CBAM implementation from GitHub"
    hypothesis_fit: "ResNet-18 allows clean BN→LN swap (same architecture, different normalization). CBAM grafts attention onto ResNet for ablation. ViT/DeiT provides Transformer comparison with comparable parameter count to ResNet."
  baselines:
    - name: "ResNet-BN (Standard Batch Normalization)"
      method: "Baseline architecture, expected to show early spurious amplification"
    - name: "ResNet-LN (Layer Normalization)"
      method: "Normalization ablation, expected to reduce early spurious amplification"
    - name: "ResNet-CBAM (Channel Attention)"
      method: "Attention ablation, tests if attention enables correction while preserving local receptive fields"
    - name: "ViT-Small / DeiT (Vision Transformer)"
      method: "Global architecture comparison, expected to show mid-training correction (confounded by global receptive field)"

