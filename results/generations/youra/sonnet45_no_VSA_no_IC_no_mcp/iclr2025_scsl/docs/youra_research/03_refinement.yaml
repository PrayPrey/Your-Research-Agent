# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "DNNs learn spurious correlations preferentially over core features (simplicity bias)"
      status: "BUILD_ON"
      evidence: "Geirhos et al. 2020 (Shortcut Learning survey, arXiv:2004.07780), extensively documented across Waterbirds/CelebA/texture-vs-shape experiments"
    - claim: "Worst-group accuracy reveals spurious reliance better than average accuracy"
      status: "BUILD_ON"
      evidence: "Sagawa et al. 2020 (Group DRO, arXiv:1911.08731), Waterbirds: 97% avg vs 72% worst-group"
    - claim: "Temporal learning dynamics exist: unforgettable examples (simple/spurious) learned first, forgettable examples (complex/core) learned later"
      status: "BUILD_ON"
      evidence: "Toneva et al. 2019 (Example Forgetting, arXiv:1812.05159), CIFAR-10: 30% unforgettable examples"
    - claim: "Architectural components (BN, LN, attention) create distinct temporal worst-group gap trajectories on stochastic spurious correlations"
      status: "PROVE_NEW"
      evidence: "No prior systematic temporal-architectural comparison exists (Gap1 identified in Phase 1)"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Established facts (simplicity bias, worst-group metric, temporal dynamics) are background context.
    Phase 2B should focus on PROVING the new claim: architectural components → distinct temporal signatures.
    Do NOT re-verify Sagawa 2020's worst-group metric validity or Toneva 2019's forgetting dynamics.
    DO verify that BN/LN/attention create measurably different gap trajectories.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TemporalArchSig-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under stochastic spurious correlations (Waterbirds 85% co-occurrence, CelebA 95% co-occurrence),
    if we compare neural network architectures with different normalization (Batch Normalization vs Layer Normalization)
    and attention mechanisms (ResNet-CBAM, Vision Transformer) during training,
    then we will observe DISTINCT worst-group accuracy gap trajectories when measured against training progress
    (average accuracy on x-axis), because normalization and attention mechanisms differ in how they resolve
    gradient ambiguity from stochastic spurious correlations. Specifically: BN amplifies early spurious learning
    via batch-level statistics, LN reduces it via instance-level normalization, and attention mechanisms
    enable mid-training correction via global feature aggregation.
  alternative_hypothesis_h0: |
    There is no significant difference in worst-group accuracy gap trajectories (measured vs average accuracy)
    between ResNet-BN, ResNet-LN, ResNet-CBAM, and ViT architectures when trained on datasets with stochastic
    spurious correlations. Temporal learning dynamics are dominated by optimization hyperparameters (learning rate,
    batch size) rather than architectural components.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Architecture Type"
      type: "categorical"
      operationalization: "4 levels: ResNet-BN (Batch Normalization), ResNet-LN (Layer Normalization), ResNet-CBAM (Convolutional Block Attention Module), ViT (Vision Transformer / DeiT)"
      levels: ["ResNet-BN", "ResNet-LN", "ResNet-CBAM", "ViT"]
  dependent:
    - name: "Worst-Group Accuracy Gap"
      type: "continuous"
      operationalization: "Average accuracy - worst-group accuracy, measured at specific training progress checkpoints (e.g., when model reaches 90% average accuracy). Range: 0-100 percentage points. Logged every epoch, smoothed over 5-epoch windows."
      primary: true
    - name: "Gap Convergence Rate"
      type: "continuous"
      operationalization: "Slope of worst-group gap vs epoch, measured from epoch 20-50. Unit: percentage points per epoch. Negative slope indicates gap reduction (correction), positive slope indicates gap increase."
      primary: false
    - name: "Forgetting Events (per example)"
      type: "continuous"
      operationalization: "Number of times each training example is correctly classified at epoch t, misclassified at epoch t+k, then correctly classified again later. Averaged across all examples. Range: 0-10+ events."
      primary: false
  controlled:
    - name: "Learning Rate"
      operationalization: "Constant LR=0.01 (no schedule) for all architectures to isolate architectural effects from optimization dynamics"
    - name: "Batch Size"
      operationalization: "Fixed at 64 for all experiments"
    - name: "Initialization"
      operationalization: "He initialization for all architectures"
    - name: "Random Seed"
      operationalization: "10 seeds (0-9) for statistical power, report mean±std"
    - name: "Dataset Spurious Correlation Type"
      operationalization: "Test on stochastic spurious correlations (Waterbirds 85%, CelebA 95%) vs deterministic (CMNIST 90%) to identify scope boundary"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "BN amplifies early spurious learning: Batch Normalization normalizes activations using batch statistics (mean, variance computed across batch). When spurious correlations exist at batch level (e.g., landbirds disproportionately appear with grass backgrounds within each batch), BN makes these batch-level patterns easier to learn than instance-level core features (bird shape). Early gradients flow preferentially to spurious batch correlations."
      evidence: "Santurkar et al. 2019 (BN smooths loss landscape, arXiv:1805.11604) + Geirhos 2020 (simplicity bias). Novel extension: BN's batch statistics amplify stochastic spurious correlations."
      falsifier: "If ResNet-BN shows statistically indistinguishable worst-group gap from ResNet-LN at 90% average accuracy (p>0.05, effect <3pp across 10 seeds), BN amplification is unsupported."
    - step: 2
      description: "LN reduces early spurious amplification: Layer Normalization normalizes activations per-instance (mean, variance computed within each example's activations), eliminating batch-level spurious signal. Spurious correlations must be learned from instance-level features only, slowing their acquisition relative to BN. Core features compete more evenly with spurious features in early training."
      evidence: "LN vs BN architectural difference (instance vs batch statistics). Novel hypothesis: this difference affects temporal spurious learning dynamics."
      falsifier: "If ResNet-LN shows ≥5pp higher worst-group gap than ResNet-BN at 90% average accuracy, LN reduction hypothesis is falsified."
    - step: 3
      description: "Attention enables mid-training correction: Attention mechanisms (multi-head self-attention in ViT, CBAM in ResNet-CBAM) globally aggregate features across spatial locations (ViT) or channels (CBAM). Once core features begin emerging (epoch 15-30), attention can reweight activations to prioritize core over spurious, enabling gap correction. Local-only architectures (ResNet-BN) lack this global correction mechanism."
      evidence: "Attention mechanism design (global aggregation). Dong et al. 2021 (skip connections prevent rank collapse, arXiv:2103.03404) suggests global processing affects learning dynamics."
      falsifier: "If ViT and ResNet-CBAM show gap convergence slopes (epochs 20-50) within overlapping 95% confidence intervals of ResNet-BN, attention correction hypothesis is unsupported."
  key_tension: "Attention effect is partially confounded: ViT differs from ResNet in receptive field structure (global vs local), parameter count, and optimization dynamics, not just attention. ResNet-CBAM ablation isolates attention better but CBAM is channel-attention not spatial self-attention. Accept: if ResNet-CBAM shows correction, attention contributes; if not, ViT correction is due to global architecture, not attention alone."
  evidence_summary: |
    Step 1 (BN amplification): Builds on Santurkar 2019 (BN smooths landscape) + Geirhos 2020 (simplicity bias). Novel claim: batch statistics amplify stochastic spurious correlations.
    Step 2 (LN reduction): Architectural difference (instance vs batch norm) applied to temporal spurious learning. No direct prior evidence, testable prediction.
    Step 3 (Attention correction): Builds on Dong 2021 (global processing) + attention mechanism design. Confounded by ViT's other differences, ResNet-CBAM ablation provides partial isolation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Worst-group accuracy gap (average - worst-group) is a valid temporal metric for spurious correlation reliance"
    supporting_evidence: "Sagawa et al. 2020 validated worst-group accuracy at convergence. Extension: applying metric every epoch assumes spurious reliance is continuous during training, not binary convergence-only phenomenon."
    consequence_if_violated: "If worst-group gap is dominated by epoch-to-epoch noise (std across epochs > 10pp), temporal curves become uninterpretable. Mitigation: 5-epoch smoothing, validation set measurement."
  - id: "A2"
    assumption: "Stochastic spurious correlations (85-95% co-occurrence) create gradient ambiguity that architectural components resolve differently"
    supporting_evidence: "Geirhos 2020 (simplicity bias affects gradient flow), Toneva 2019 (forgetting events track feature complexity). Novel extension: stochastic vs deterministic spurious correlations differ in gradient ambiguity."
    consequence_if_violated: "If CMNIST (90% deterministic spurious correlation) shows identical temporal signatures as Waterbirds (85% stochastic), gradient ambiguity hypothesis is wrong. Hypothesis scope narrows to 'all spurious correlations' not 'stochastic only'."
  - id: "A3"
    assumption: "Comparison at fixed average accuracy (e.g., 90%) eliminates training-speed confounds between BN and LN"
    supporting_evidence: "BN is known to speed up training (Santurkar 2019). Epoch-based comparison would confound BN's training acceleration with spurious amplification. Accuracy-matched comparison isolates architectural effect."
    consequence_if_violated: "If BN and LN never reach the same average accuracy level (e.g., BN plateaus at 92%, LN at 88%), accuracy-matched comparison fails. Mitigation: use multiple accuracy checkpoints (85%, 90%, 92%) and report gap at each."
  - id: "A4"
    assumption: "Attention effect can be partially isolated via ResNet-CBAM (channel attention) as ablation for ViT (spatial self-attention)"
    supporting_evidence: "CBAM adds attention to ResNet while preserving local receptive field structure. If CBAM shows correction, attention contributes. If not, ViT correction is due to global architecture."
    consequence_if_violated: "If ResNet-CBAM doesn't show ViT-like correction, cannot claim 'attention enables correction.' Must weaken to 'ViT architecture (global structure + attention) enables correction.' This is accepted limitation per Prof. Rex's critique."
  - id: "A5"
    assumption: "Temporal signatures (gap trajectory shapes) generalize across datasets with similar spurious correlation structure (binary, stochastic)"
    supporting_evidence: "Waterbirds and CelebA both have binary spurious features (background/foreground, gender/attribute) with stochastic co-occurrence (85-95%). If signatures are architectural, they should transfer."
    consequence_if_violated: "If architecture ranking reverses from Waterbirds to CelebA (Spearman ρ<0.6), signatures are dataset-specific, not architectural. Hypothesis narrows to 'signatures exist but are dataset-dependent'."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Stochastic spurious correlations (85-95% co-occurrence between spurious feature and label)
    - Binary spurious features (presence/absence of background, gender, color)
    - Supervised learning with group-labeled datasets (Waterbirds, CelebA)
    - Vision tasks (image classification)
    - Architectures: ResNet variants (BN, LN, CBAM), Vision Transformers (ViT/DeiT)
  does_not_apply_to: |
    - Deterministic spurious correlations (100% co-occurrence) — test on CMNIST to confirm boundary
    - Multi-class spurious features (more than 2 spurious categories) — not tested
    - Unsupervised or self-supervised learning — group labels required for worst-group metric
    - NLP tasks — hypothesis focuses on vision architectures
    - Extremely weak spurious correlations (<70% co-occurrence) — gradient signal may be too noisy
  known_limitations: |
    - Attention effect partially confounded: ViT differs from ResNet in multiple ways beyond attention. ResNet-CBAM ablation helps but doesn't fully isolate spatial self-attention (CBAM is channel attention).
    - Optimization confounds: constant LR=0.01 isolates architectural effects but may not reflect real training (where LR schedules are common). Future work: test with realistic schedules.
    - Dataset-specific signatures possible: if Spearman ρ<0.6 between Waterbirds and CelebA, temporal signatures don't generalize. Accept as scope limitation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "BN Amplification: ResNet-BN shows ≥5 percentage point higher worst-group accuracy gap than ResNet-LN when both architectures reach 90% average accuracy on Waterbirds dataset."
    test_method: "Train ResNet-BN and ResNet-LN on Waterbirds for 100 epochs, log worst-group gap and average accuracy every epoch. For each of 10 seeds, identify the epoch where each architecture first reaches 90% average accuracy, record worst-group gap at that epoch. Compute mean gap difference across 10 seeds. Perform paired t-test (α=0.05, two-tailed)."
    success_criterion: "Mean gap difference (BN - LN) ≥ 5 percentage points AND p < 0.05 AND effect size (Cohen's d) ≥ 0.8 (large effect)"
    falsification: "If p > 0.05 OR mean gap difference < 3 percentage points OR effect size < 0.5, BN amplification hypothesis is rejected. Interpretation: normalization type does not significantly affect early spurious learning."
  - id: "P2"
    primary: true
    statement: "Attention Correction: ViT or ResNet-CBAM shows steeper worst-group gap reduction slope (more negative slope, faster correction) from epoch 20-50 compared to ResNet-BN on Waterbirds."
    test_method: "For each architecture and seed, compute linear regression slope of worst-group gap vs epoch for epochs 20-50. Compute mean slope and 95% confidence interval across 10 seeds for each architecture. Compare ViT slope CI and ResNet-CBAM slope CI against ResNet-BN slope CI."
    success_criterion: "ViT or ResNet-CBAM slope CI does NOT overlap with ResNet-BN slope CI AND ViT/CBAM slope is more negative (faster gap reduction) than ResNet-BN slope by ≥ 0.3 percentage points per epoch."
    falsification: "If slope CIs overlap OR ViT/CBAM slope difference < 0.2pp/epoch, attention correction hypothesis is rejected. Interpretation: attention mechanisms do not enable mid-training spurious correction. Weaken claim to 'ViT architecture corrects' if ViT succeeds but CBAM fails (global structure, not attention)."
  - id: "P3"
    primary: false
    statement: "Signature Consistency: Architecture ranking by worst-group gap (at 90% average accuracy) is consistent from Waterbirds to CelebA, measured by Spearman rank correlation ρ > 0.8."
    test_method: "For each architecture, compute mean worst-group gap at 90% average accuracy across 10 seeds on Waterbirds. Rank architectures 1-4 (lowest gap = rank 1 = best). Repeat on CelebA. Compute Spearman rank correlation between Waterbirds ranking and CelebA ranking."
    success_criterion: "Spearman ρ > 0.8 (strong positive correlation), indicating temporal signatures generalize across datasets with similar spurious structure."
    falsification: "If ρ < 0.6 OR ranking reversal occurs (e.g., BN best on Waterbirds, worst on CelebA), signature consistency is rejected. Interpretation: temporal signatures are dataset-specific, not purely architectural. Hypothesis scope narrows to 'signatures exist but depend on dataset characteristics beyond spurious correlation type'."

