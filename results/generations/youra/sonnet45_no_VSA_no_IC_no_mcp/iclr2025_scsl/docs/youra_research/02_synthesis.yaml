hypothesis_draft:
  title: "Architectural Components as Temporal Filters in Spurious Correlation Learning"
  hypothesis_id: "H-TemporalArchSig-v1"
  core_claim: |
    Different neural network architectural components (Batch Normalization, Layer Normalization, attention mechanisms)
    create distinct worst-group accuracy gap trajectories during training on datasets with stochastic spurious
    correlations, because they differ in how they resolve gradient ambiguity from stochastic correlations.
  mechanism: |
    BN amplifies early spurious learning by normalizing batch-level statistics, making batch-level spurious
    correlations easier to learn. LN reduces early spurious amplification by normalizing per-instance,
    eliminating batch-level spurious signal. Attention mechanisms enable mid-training correction by globally
    aggregating features, allowing core features to override early spurious patterns.
  predictions:
    - P1: "ResNet-BN shows ≥5pp higher worst-group gap than ResNet-LN at 90% average accuracy (Waterbirds)"
    - P2: "ViT/ResNet-CBAM shows steeper gap reduction slope (epochs 20-50) than ResNet-BN (Waterbirds)"
    - P3: "Architecture ranking by gap (90% avg accuracy) consistent Waterbirds→CelebA (Spearman ρ>0.8)"

variables_summary:
  independent: "Architecture Type (4 levels: ResNet-BN, ResNet-LN, ResNet-CBAM, ViT)"
  dependent_primary: "Worst-Group Accuracy Gap (avg - worst-group, measured at training progress checkpoints)"
  controlled: "Learning Rate (constant 0.01), Batch Size (64), Initialization (He), Random Seed (10 seeds)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in worst-group accuracy gap trajectories between ResNet-BN, ResNet-LN,
    ResNet-CBAM, and ViT when trained on stochastic spurious correlations. Temporal dynamics are dominated by
    optimization hyperparameters, not architectural components.
  statistical_test: "Paired t-test (α=0.05) for P1, confidence interval non-overlap for P2, Spearman rank correlation for P3"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic temporal comparison of architectural components on spurious correlation learning. Accuracy-matched comparison eliminates training-speed confounds. Novel framing: temporal gap curves as architectural signatures."
  differentiation_summary: |
    Toneva 2019: temporal dynamics, single architecture. Sagawa 2020: worst-group metric, convergence-only.
    Geirhos 2020: architectural differences, qualitative. This work: temporal + architectural + quantitative.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["ResNet-18-BN", "ResNet-18-LN", "ResNet-18-CBAM", "ViT-Small / DeiT"]
  datasets: ["Waterbirds", "CelebA", "CMNIST"]
  baselines: ["ResNet-BN standard training (ERM)"]

measurement_plan:
  data_collection:
    - source: "Waterbirds dataset (Sagawa et al. 2020 GitHub), 5.9k examples, 4 groups (bird type × background)"
    - source: "CelebA dataset (Liu et al. 2015), hair color attribute, gender spurious feature"
    - source: "CMNIST dataset (DomainBed), deterministic color-digit spurious correlation (scope boundary test)"
  procedure:
    - step: "Train each architecture on each dataset for 100 epochs with constant LR=0.01, batch size 64, He init"
    - step: "Log worst-group accuracy and average accuracy every epoch for all 4 groups"
    - step: "Repeat for 10 random seeds (0-9) per architecture-dataset combination"
    - step: "Compute worst-group gap (avg - worst-group) at training progress checkpoints (when avg accuracy reaches 85%, 90%, 95%)"
    - step: "Compute gap convergence slope via linear regression on epochs 20-50"
    - step: "Apply 5-epoch smoothing to reduce measurement noise"
  success_criteria:
    - "P1: BN-LN gap difference ≥5pp at 90% avg accuracy, p<0.05, Cohen's d≥0.8"
    - "P2: ViT/CBAM slope CI non-overlapping with ResNet-BN CI, difference ≥0.3pp/epoch"
    - "P3: Spearman ρ>0.8 for architecture ranking from Waterbirds to CelebA"

validation:
  internal_validity:
    - "Constant LR eliminates optimization schedule confound"
    - "10 seeds provide statistical power for 2pp detectable effect (α=0.05, power=0.80)"
    - "Accuracy-matched comparison eliminates BN training-speed confound"
    - "Multiple datasets (Waterbirds, CelebA, CMNIST) test signature generalization"
  external_validity:
    - "Waterbirds and CelebA have real-world spurious correlations (background, gender)"
    - "Worst-group metric validated by Sagawa et al. 2020 for spurious correlation detection"
    - "Architectures (ResNet, ViT) are standard in computer vision research"

