# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Current ML repositories (HuggingFace, OpenML, UCI) use informal versioning without standardized deprecation protocols"
      status: "BUILD_ON"
      evidence: "Paullada et al. (2021) survey documents this gap; HuggingFace codebase analysis shows no formal deprecation API"

    - claim: "Software ecosystems (NPM, PyPI) have proven deprecation mechanisms via package managers"
      status: "BUILD_ON"
      evidence: "NPM deprecation warnings, Python DeprecationWarning system are established infrastructure"

    - claim: "DAG-based dependency graphs are mathematically well-understood"
      status: "BUILD_ON"
      evidence: "Standard data structure in software engineering; Maven Central uses for dependency resolution"

    - claim: "Python introspection can track import history within a session"
      status: "BUILD_ON"
      evidence: "Python import hooks and sys.modules inspection are documented features"

    - claim: "Context-aware successor graphs for ML datasets improve upon linear version-based succession"
      status: "PROVE_NEW"
      evidence: "Novel claim requiring validation — no existing system models task-conditional succession"

    - claim: "Health metrics can prospectively predict dataset deprecation with ≥ 80% recall"
      status: "PROVE_NEW"
      evidence: "Novel predictive claim requiring longitudinal validation"

    - claim: "Formal deprecation mechanisms increase successor adoption by ≥ 50% over baseline"
      status: "PROVE_NEW"
      evidence: "Novel efficacy claim requiring controlled measurement infrastructure"

  scope_reduction_percentage: 43  # (7 total - 4 BUILD_ON) / 7 * 100 = 43%
  phase2b_4_instructions: |
    Focus Phase 2B-4 implementation on PROVE_NEW claims only:
    - Context-aware graph construction and context inference accuracy
    - Health metric predictive power (prospective validation)
    - Successor adoption measurement infrastructure and efficacy lift

    BUILD_ON claims provide foundation — cite but don't re-implement.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DepGraph-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under ML repository settings with existing deprecation metadata (HuggingFace Datasets Hub),
    if we deploy a three-component formal deprecation system (automated health metrics +
    context-aware successor graphs + instrumented executable policies), then successor
    adoption rates will increase by ≥ 50% relative to baseline informal mechanisms over
    6 months, because the system addresses three distinct failure modes in current practice:
    (1) lack of automated deprecation candidate detection, (2) missing task-specific
    successor mappings, and (3) absence of point-of-use recommendations with adoption tracking.

  alternative_hypothesis_h0: |
    There is no significant difference in dataset successor adoption rates between users
    exposed to formal deprecation mechanisms (health metrics + context graphs + executable
    policies) and users relying on informal deprecation signals (GitHub READMEs, community
    discussion, manual search), measured as adoption lift < 10% over 6 months.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Deprecation Mechanism Type"
      type: "categorical"
      operationalization: "Formal (health metrics + graphs + policies) vs. Informal (status quo)"
      levels:
        - "Formal: Users access datasets via instrumented loader with deprecation warnings + context-aware successor recommendations"
        - "Informal: Users access datasets via standard HuggingFace API with no formal deprecation infrastructure"

  dependent:
    - name: "Successor Adoption Rate"
      type: "continuous"
      operationalization: "Percentage of users loading deprecated dataset D who subsequently load a successor dataset S within 30 days, tracked via instrumented loader telemetry. Range: 0-100%."
      primary: true

    - name: "Health Metric Predictive Accuracy (Precision)"
      type: "continuous"
      operationalization: "Proportion of health-metric-flagged datasets that maintainers actually deprecate within 6 months. Range: 0-1."
      primary: false

    - name: "Health Metric Predictive Accuracy (Recall)"
      type: "continuous"
      operationalization: "Proportion of maintainer-deprecated datasets that were flagged by health metrics. Range: 0-1."
      primary: false

    - name: "Context Inference Accuracy"
      type: "continuous"
      operationalization: "Proportion of deprecation events where inferred user context matches ground-truth task labels. Measured on labeled validation set. Range: 0-1."
      primary: false

  controlled:
    - name: "Repository Platform"
      operationalization: "Fixed to HuggingFace Datasets Hub to control for platform-specific user behaviors and metadata availability"

    - name: "Observation Period"
      operationalization: "Fixed to 6 months prospective measurement to control for temporal effects"

    - name: "Dataset Deprecation Status"
      operationalization: "Only datasets officially marked deprecated by maintainers included in adoption measurement"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Health metrics (usage velocity < 0.3, successor emergence > 3, issue ratio high) automatically surface deprecation candidates, reducing maintainer cognitive burden and increasing deprecation decision consistency."
      evidence: "Software package managers (NPM, PyPI) demonstrate automated deprecation candidate detection improves coverage. Prof. Pax confirmed metrics computable from HuggingFace download logs + GitHub issues."
      falsifier: "If health-metric-flagged datasets show no correlation with maintainer deprecation decisions (precision < 40%), metrics don't capture actual deprecation drivers."

    - step: 2
      description: "Context-aware successor graphs capture task-specific replacement paths (ImageNet → ImageNet-v2 for robustness vs. ImageNet-21k for pretraining), providing more relevant recommendations than linear version-based succession."
      evidence: "Dr. Sage identified this as genuine novelty over single-path succession in software package managers. Automated edge inference from dataset card citations reduces annotation burden (Prof. Pax)."
      falsifier: "If context inference accuracy < 70% or users override inferred context > 50% of the time, context-awareness fails to improve relevance."

    - step: 3
      description: "Executable policies deliver deprecation warnings + successor recommendations at dataset load time (point of use), increasing visibility compared to documentation-only approaches."
      evidence: "Python's DeprecationWarning system demonstrates load-time warnings are feasible and non-intrusive. Prof. Pax confirmed decorator-based implementation straightforward."
      falsifier: "If users bypass warnings > 60% of the time or disable instrumented loaders to avoid friction, executable policies fail."

    - step: 4
      description: "Load-time instrumentation tracks successor adoption events, enabling quantitative measurement of deprecation mechanism efficacy for the first time."
      evidence: "Dr. Nova identified measurement infrastructure as a research contribution. Current baseline unknown because no instrumentation exists (Prof. Rex concern)."
      falsifier: "If instrumentation creates > 10% performance overhead or privacy concerns prevent deployment, measurement infrastructure isn't viable."

  key_tension: "Whether current informal mechanisms (GitHub READMEs, community discussion) already suffice for engaged users, making formal system redundant except for less-active users."
  evidence_summary: |
    Steps 1-3 draw on proven software ecosystem mechanisms (package deprecation, dependency graphs,
    load-time warnings) adapted for ML-specific context (task-conditional succession, health metrics
    from ML metadata). Step 4 is novel measurement infrastructure addressing current baseline gap.
    Key risk: Context inference accuracy and user adoption of instrumented loaders.

