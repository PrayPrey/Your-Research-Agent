# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "HuggingFace download logs and Papers with Code citation data provide sufficient signals for health metric computation"
    supporting_evidence: "Prof. Vera confirmed usage velocity, successor emergence, and issue ratios are computable from existing APIs"
    consequence_if_violated: "If download data is too coarse-grained (e.g., doesn't distinguish tasks) or citation data is incomplete, health metrics lose predictive power"

  - id: "A2"
    assumption: "Python import history introspection can infer user task context with ≥ 70% accuracy"
    supporting_evidence: "Prof. Pax confirmed Python introspection technically feasible. Dr. Nova proposed hybrid approach with explicit fallback for ambiguous cases."
    consequence_if_violated: "If context inference accuracy < 70%, users receive irrelevant successor recommendations, reducing adoption"

  - id: "A3"
    assumption: "Users will adopt instrumented dataset loaders (opt-in wrappers) rather than bypassing them for standard loaders"
    supporting_evidence: "Prof. Pax recommended opt-in approach to avoid maintainer buy-in dependency. Assumes value proposition (better successor recommendations) outweighs adoption friction."
    consequence_if_violated: "If bypass rate > 60% or instrumentation overhead > 10%, measurement infrastructure and policy delivery fail"

  - id: "A4"
    assumption: "Automated edge inference from dataset card citations produces useful successor graphs rather than noisy tangles"
    supporting_evidence: "Prof. Pax identified automated inference as feasibility requirement. Curator validation layer (three-tier governance) provides quality control."
    consequence_if_violated: "If inferred edges have low precision (many false successors), graphs become unusable clutter"

  - id: "A5"
    assumption: "Current informal deprecation mechanisms have low baseline successor discovery rates (< 30%), creating room for improvement"
    supporting_evidence: "Prof. Rex flagged this as critical unknown. Paullada et al. survey documents deprecation gaps, but quantitative baseline unestablished."
    consequence_if_violated: "If baseline is already ≥ 60%, a 50% lift is mathematically impossible or approaching ceiling effects"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ML datasets hosted on platforms with machine-readable metadata (HuggingFace Datasets Hub, OpenML)
    - Datasets with documented deprecation status and potential successors
    - Users accessing datasets via programmable loaders (Python-based ML workflows)
    - Tasks where context can be inferred from import history or explicitly specified (supervised learning, robustness eval, pretraining)

  does_not_apply_to: |
    - Datasets without machine-readable metadata or programmatic loaders (manually downloaded CSVs, archived datasets)
    - Platforms without deprecation metadata infrastructure
    - Non-Python ML workflows (R, Julia, browser-only interfaces)
    - Highly specialized tasks where context inference is ambiguous and no labeled ground truth exists

  known_limitations: |
    - Baseline successor adoption rates unknown — must be established in Phase 1 before testing efficacy lift
    - Context inference accuracy unvalidated — requires labeled user task dataset for validation
    - Assumption that engaged users don't already discover successors via informal channels (GitHub, community) — may overestimate impact for active users
    - Privacy considerations for load-time telemetry — requires opt-in informed consent and anonymization

