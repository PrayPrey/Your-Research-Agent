# Core hypothesis summary (consistent with 03_refinement.yaml)
hypothesis_draft:
  title: "Context-Aware Formal Dataset Deprecation for ML Repositories"
  hypothesis_id: "H-DepGraph-v1"
  core_claim: |
    A three-component formal deprecation system (automated health metrics + context-aware
    successor graphs + instrumented executable policies) improves dataset successor adoption
    rates by ≥ 50% over baseline informal mechanisms, measured prospectively on HuggingFace
    Datasets Hub over 6 months.
  mechanism: |
    Four-step synergistic mechanism: (1) Health metrics automatically surface deprecation
    candidates, reducing maintainer burden. (2) Context-aware graphs provide task-specific
    successor mappings via usage-pattern inference. (3) Executable policies deliver
    recommendations at load time. (4) Instrumentation tracks adoption, enabling quantitative
    measurement for the first time.
  predictions:
    - "P1: Instrumentation achieves < 10% overhead, ≥ 95% telemetry capture, ≥ 100 tracked events over 6 months"
    - "P2: Formal mechanisms increase successor adoption ≥ 50% vs. baseline (statistical significance p < 0.05)"
    - "P3: Health metrics achieve ≥ 60% precision and ≥ 80% recall in prospectively predicting deprecations"

# Variable summary (mirrors 03_refinement.yaml Section 1.2)
variables_summary:
  independent: "Deprecation Mechanism Type (Formal vs. Informal)"
  dependent_primary: "Successor Adoption Rate (0-100%, tracked via instrumented loader telemetry over 30 days)"
  controlled: "Repository platform (HuggingFace), observation period (6 months), dataset deprecation status (maintainer-confirmed)"

# Null hypothesis (mirrors 03_refinement.yaml Section 1.1)
null_hypothesis:
  h0_statement: |
    No significant difference in dataset successor adoption rates between users exposed to
    formal deprecation mechanisms and users relying on informal signals (adoption lift < 10%).
  statistical_test: "Two-sample t-test comparing adoption rates (formal vs. informal groups)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Context-aware successor graphs with usage-pattern-based inference (no explicit user tagging). Measurement infrastructure as research contribution."
  differentiation_summary: |
    Unlike software package managers with single-path succession (NPM: requests → httpx),
    our context-aware graphs model multi-path, task-conditional relationships (ImageNet →
    ImageNet-v2 for robustness vs. ImageNet-21k for pretraining). Unlike Datasheets for
    Datasets (documentation only), we add executable policies and adoption tracking.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: []  # Infrastructure research, no ML models
  datasets:
    - "HuggingFace Datasets Hub metadata + usage logs"
    - "Papers with Code citation data"
    - "GitHub issue tracking data"
  baselines:
    - "Informal deprecation (status quo): README updates, GitHub issues, community discussion"
    - "Linear version-based succession: Git tags without context-aware branching"

# Measurement plan derived from experimental discussion
measurement_plan:
  data_collection:
    - source: "HuggingFace download logs → usage velocity metric"
    - source: "Dataset card cross-references → successor emergence metric, automated edge inference"
    - source: "GitHub API → issue accumulation metric"
    - source: "Instrumented loader telemetry → successor adoption events, context inference accuracy"

  procedure:
    - step: "Month 0: Deploy health metrics, identify top 30 deprecation candidates. Deploy instrumented loaders for formal group, standard loaders for informal control group."
    - step: "Month 1-6: Track maintainer deprecation decisions (prospective validation of P3) and user successor adoption events (P1, P2)."
    - step: "Month 7: Analyze precision/recall of health metrics, adoption lift (formal vs. informal), instrumentation overhead and capture rate."

  success_criteria:
    - "P1: Instrumentation overhead < 10%, telemetry capture ≥ 95%, ≥ 100 events tracked"
    - "P2: Adoption lift ≥ 50% (e.g., baseline 20% → formal 30%), p < 0.05"
    - "P3: Health metric precision ≥ 60%, recall ≥ 80%"

# Validation strategy
validation:
  internal_validity:
    - "Controlled assignment to formal vs. informal groups reduces confounding"
    - "Prospective measurement (health metrics predict future deprecations) avoids retroactive bias"
    - "Instrumentation tracks actual user behavior (adoption events) rather than self-reported intentions"

  external_validity:
    - "HuggingFace Datasets Hub is widely-used platform, findings generalize to similar repositories (OpenML)"
    - "Python-based ML workflows represent majority of dataset access patterns"
    - "Limited generalization to non-Python ecosystems or platforms without programmatic loaders"

# Key insights from the discussion itself
discussion_synthesis:
  key_insights:
    - "Measurement infrastructure (load-time telemetry) is itself a research contribution — enables first-time quantitative tracking of successor adoption"
    - "Context inference via usage patterns (import history) eliminates explicit user tagging friction while maintaining low-friction UX"
    - "Three-tier governance (automation → curation → community) balances scalability and quality for successor graph construction"
    - "Baseline unknown — must empirically measure current informal adoption rates before claiming improvement"

  breakthrough_moments:
    - "Dr. Nova Exchange 7: Reframed hypothesis as two-tiered (infrastructure + mechanism), making measurement capability an explicit contribution"
    - "Prof. Rex Exchange 6: Identified baseline gap as critical — shifted P2 from absolute (30% lift) to relative (50% increase from baseline)"
    - "Dr. Ally Exchange 5: Synthesized three components as synergistic system rather than independent features"

  resolved_tensions:
    - "Governance question (who decides deprecation): Resolved via software package manager model — maintainers control status, community contributes successor mappings"
    - "Context inference friction: Resolved via hybrid approach — automated inference with explicit fallback for ambiguous cases"
    - "Arbitrary threshold concern: Resolved by committing to baseline measurement and relative lift metrics"
