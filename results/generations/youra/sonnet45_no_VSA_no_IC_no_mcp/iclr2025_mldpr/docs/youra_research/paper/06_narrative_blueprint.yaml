# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress full story: Problem (no formal deprecation) → Solution (3-component system) → Validation (PoC-scale mechanisms work) → Limitation (efficacy untested)"
    key_message: "Formal dataset deprecation is feasible (mechanisms validated) but adoption lift requires deployment testing (future work)"
    structure_notes: |
      - Sentence 1: ML repositories lack formal deprecation (cite scale: 60k+ HuggingFace datasets)
      - Sentence 2: Informal mechanisms fail at detection, recommendation, measurement
      - Sentence 3: We present 3-component system (health metrics + context graphs + instrumentation)
      - Sentence 4-5: PoC validation results (88.3% precision, 100% context accuracy, <5% overhead)
      - Sentence 6: Mechanistic validation complete; efficacy testing future work
    avoid:
      - "Claiming adoption improvement (P2 untested)"
      - "Omitting PoC-scale limitation"
      - "Vague contributions ('first system to...' without specifics)"

  introduction:
    narrative_purpose: "Hook (silent dataset rot) → Problem (3 failure modes) → Insight (synergistic 3-component design) → Contributions (mechanistic validation)"
    hook_strategy: "practical_failure (medical imaging dataset shifts without notice)"
    problem_escalation: |
      1. Surface: Repositories lack formal deprecation (HuggingFace README-based)
      2. Deeper: Three distinct failure modes (detection, recommendation, measurement)
      3. Gap: No system combines all three; software package managers are partial template
    insight_preview: "Dataset deprecation requires three synergistic components adapted from software package management but extended for ML-specific needs (usage-driven health, task-aware graphs, load-time telemetry)"
    contributions_framing: |
      Building on this insight, we:
      1. Design 3-component system decomposed into 5 sub-hypotheses (h-e1, h-m1, h-m2, h-m3, h-m4)
      2. Validate mechanisms at PoC scale (all gates passed)
      3. Provide first quantitative infrastructure for adoption measurement (enables future efficacy studies)
    transition_to_related_work: "Our system builds on deprecation patterns from software package managers (Section 2.1) and dataset documentation standards (Section 2.2), but addresses gaps neither domain solves in isolation."

  related_work:
    narrative_purpose: "Show existing work insufficient (software packages, dataset docs, ML repositories) → justify our 3-component approach"
    positioning_strategy: "Position as synthesis across three domains: software package deprecation (provides template but lacks task-awareness), dataset documentation (provides standards but no executable mechanisms), ML repository design (provides platform but no formal deprecation)"
    key_comparison_points:
      - area: "Software Package Deprecation (NPM, PyPI, Maven)"
        limitation_to_highlight: "Linear version succession doesn't capture task-conditional successors (ImageNet→ImageNet-v2 vs ImageNet-21k); semantic versioning doesn't translate to usage-driven dataset lifecycle"
        how_we_differ: "Context-aware successor graphs model task-specific replacement paths; health metrics use velocity/emergence signals rather than version numbers"
      - area: "Dataset Documentation (Datasheets, Data Cards)"
        limitation_to_highlight: "Documentation-only approach requires users to discover and read datasheets; no automated enforcement or point-of-use recommendations"
        how_we_differ: "Executable policies deliver warnings at load time; instrumentation measures adoption rather than relying on manual reporting"
      - area: "ML Repository Design (HuggingFace, OpenML)"
        limitation_to_highlight: "Versioning exists but lacks deprecation-specific infrastructure (health metrics, successor graphs, telemetry)"
        how_we_differ: "First system to integrate all three components; validated on HuggingFace-compatible infrastructure"
    papers_to_discuss:
      - "Datasheets for Datasets (Gebru et al., 2018)"
      - "Data Statements (Bender & Friedman, 2018)"
      - "NPM deprecation mechanism documentation"
      - "Python DeprecationWarning system"
      - "HuggingFace Hub versioning (if documented)"
    avoid:
      - "Unfair critique of Datasheets (it solves documentation, not automation)"
      - "Claiming novelty without acknowledging package manager precedent"
      - "Missing obvious dataset lifecycle work (versioning, provenance)"

  methodology:
    narrative_purpose: "Explain WHY 3-component design solves the 3 failure modes; show sub-hypothesis decomposition enables modular validation"
    connection_to_insight: "Each component targets one failure mode: Health metrics → automated detection (failure mode 1), Context graphs → task-specific recommendations (failure mode 2), Instrumentation → adoption measurement (failure mode 3)"
    key_design_decisions:
      - decision: "Health metric weights (velocity=2.0, emergence=1.5, issue_ratio=1.0, threshold≥2.5)"
        rationale: "Velocity weighted highest because declining usage is strongest deprecation signal; emergence captures successor availability; issue ratio indicates maintenance burden"
        alternatives_considered: "Uniform weights (equal importance), threshold tuning (precision-recall tradeoff), API-based metrics (blocked by integration complexity)"
      - decision: "Pattern-based context inference (exact match, substring, semantic similarity)"
        rationale: "Deterministic patterns enable validation on synthetic data; defer embedding-based inference to production testing"
        alternatives_considered: "Embedding similarity (requires LLM, hard to validate), manual annotation (doesn't scale), usage co-occurrence (requires longitudinal data)"
      - decision: "Decorator-based load-time instrumentation with SHA256 hashing"
        rationale: "Minimal API changes (drop-in replacement for datasets.load_dataset); content hashing enables deduplication and cache coherence"
        alternatives_considered: "Monkey-patching (fragile), separate CLI tool (adoption barrier), server-side tracking (privacy concerns)"
    intuition_building: |
      Figure 1 (System Architecture): Three-layer design showing health metrics → context graphs → instrumentation data flow
      Walkthrough: User loads deprecated dataset → Health metrics flag candidate → Context graph infers task → Recommendation shown → Instrumentation logs adoption outcome
    technical_depth_balance: |
      Main text: Component interfaces, design rationale, integration logic
      Appendix: Implementation details (NetworkX graph algorithms, SQLite schema, async queue design)

  experiments:
    narrative_purpose: "Design experiments that validate each component separately (h-e1, h-m1, h-m2, h-m3, h-m4) then verify integration"
    experimental_questions:
      - question: "Can load-time instrumentation track adoption with <10% overhead and ≥95% capture?"
        experiment: "h-e1 (MUST_WORK): Benchmark overhead on 100 dataset loads, measure capture rate"
        expected_outcome: "Overhead <10%, Capture ≥95%, Events ≥100 over 6mo simulation"
      - question: "Do health metrics achieve ≥60% precision in identifying deprecation candidates?"
        experiment: "h-m1 (MUST_WORK): Simulate 1000 datasets with labeled ground truth, compute precision/recall"
        expected_outcome: "Precision ≥60%, Recall ≥80%"
      - question: "Does context-aware inference achieve ≥70% accuracy on task-specific successors?"
        experiment: "h-m2 (MUST_WORK): Validate pattern matching on synthetic dataset with task labels"
        expected_outcome: "Accuracy ≥70%, Override rate <50%"
      - question: "Can dependency graphs achieve ≥95% impact completeness on schema changes?"
        experiment: "h-m3 (SHOULD_WORK): Build 4-node graph, measure transitive closure coverage"
        expected_outcome: "Impact completeness ≥95%, Schema accuracy ≥80%"
      - question: "Does full telemetry stack maintain ≥95% capture with <10% overhead?"
        experiment: "h-m4 (SHOULD_WORK): Integrate all components, measure end-to-end performance"
        expected_outcome: "Capture ≥95% (CI lower bound), Overhead <10%"
    baseline_rationale: "No formal baselines exist (no prior dataset deprecation systems); compare against performance targets derived from software package manager requirements (NPM deprecation overhead benchmarks)"
    dataset_rationale: "HuggingFace Hub chosen as largest ML dataset repository (60k+ datasets); mock data used for h-m2/h-m3/h-m4 due to API integration complexity; simulated data for h-m1 (1000 datasets with synthetic health signals)"
    metric_rationale: "Precision/recall for health metrics (standard classification metrics); accuracy for context inference (exact match validation); overhead for instrumentation (performance SLA); capture rate for telemetry (data quality requirement)"
    fairness_considerations: |
      PoC scale validation isolates mechanism feasibility from deployment complexity
      Mock data enables controlled testing but requires generalization validation (future work)
      Sub-hypothesis gates (MUST_WORK vs SHOULD_WORK) prioritize critical components

  results:
    narrative_purpose: "Present evidence that each mechanism works (h-e1-h-m4 gates passed) → synthesize into validation of 3-component integration"
    main_result_highlight: "All five sub-hypotheses passed validation gates with metrics exceeding targets (precision 88.3% vs 60%, overhead 0.21% vs 10%), validating mechanistic feasibility"
    result_presentation_order:
      - result: "h-e1: Instrumentation overhead 0.21%, capture 100%"
        purpose: "Establish measurement infrastructure works (enables h-m4 telemetry)"
      - result: "h-m1: Health metrics 88.3% precision, 100% recall"
        purpose: "Validate automated detection (Component 1)"
      - result: "h-m2: Context inference 100% accuracy, 27.95% override"
        purpose: "Validate task-aware recommendations (Component 2)"
      - result: "h-m3: Dependency analysis 100% completeness"
        purpose: "Validate migration planning (supporting infrastructure)"
      - result: "h-m4: Full stack 5% overhead, 100% capture (CI: 99.05%-100%)"
        purpose: "Validate integrated system (Components 1+2+3 together)"
    surprising_result_handling: "Overhead significantly lower than target (0.21% vs 10%): SHA256 hashing amortized via lazy caching, async queue minimizes blocking I/O"
    avoid:
      - "Claiming production-ready without real API testing"
      - "Hiding perfect scores (100% recall/accuracy) without caveat that synthetic data likely optimistic"
      - "Omitting Phase 5 skip (baseline adoption comparison not performed)"

  discussion:
    narrative_purpose: "Interpret mechanistic validation results, acknowledge PoC-scale limits, position efficacy testing as future work"
    key_findings_interpretation: "Validation demonstrates infrastructure layer (measurement + mechanisms) works at PoC scale. Three-component synergy validated: health metrics surface candidates automatically, context graphs personalize recommendations, instrumentation enables outcome measurement. Results exceed targets but generalization to production untested."
    honest_limitations:
      - limitation: "PoC scale (100-500 samples) vs production scale (60k datasets)"
        why_acceptable: "Mechanistic validation goal is feasibility demonstration, not deployment readiness; Phase 4 scopes to mechanism validation explicitly"
        future_mitigation: "Full-scale deployment with real HuggingFace API integration; load testing at 60k-dataset scale"
      - limitation: "Mock/simulated data vs real API data"
        why_acceptable: "Isolates mechanism validation from external dependencies (API rate limits, authentication); patterns derived from software package manager literature ensure realism"
        future_mitigation: "Real HuggingFace API integration; cross-validation on OpenML/UCI datasets"
      - limitation: "Efficacy untested (P2: ≥50% adoption lift claim)"
        why_acceptable: "Phase 5 baseline comparison skipped; mechanistic validation (does it work?) precedes efficacy validation (how well?)"
        future_mitigation: "Controlled experiment with treatment/control groups; longitudinal A/B test on HuggingFace platform"
      - limitation: "Perfect scores (100% recall, 100% accuracy) on synthetic data"
        why_acceptable: "PoC validation on clean synthetic patterns; real-world accuracy expected to regress to 70-95% (stated in results)"
        future_mitigation: "Production validation on real usage patterns; continuous monitoring of metric degradation"
    broader_impact_statement: "Positive: Improves dataset quality signals for practitioners, reduces maintainer burden, enables reproducibility. Negative: Telemetry raises privacy concerns (mitigated via SHA256 hashing, no user PII); automated deprecation could disrupt workflows (mitigated via recommendations, not forced migrations). Equitable: Benefits all HuggingFace users equally; no differential impact by demographic."

  conclusion:
    narrative_purpose: "Reinforce mechanistic validation success, callback to silent-dataset-rot hook, open vision for deployment-scale efficacy testing"
    callback_to_hook: "The medical imaging dataset that shifted without notice now has a solution: automated health metrics detect the shift, context-aware graphs recommend task-specific successors, and load-time instrumentation measures adoption—but deployment requires moving from PoC validation to production-scale efficacy testing."
    memorable_ending: "Formal dataset deprecation is no longer a missing infrastructure gap but a validated mechanism awaiting real-world deployment. The path from mechanistic feasibility to measured efficacy is clear."
    future_work_vision: "Immediate: Phase 5 baseline comparison (measure adoption lift), real API integration (validate generalization). Long-term: Cross-platform deployment (OpenML, Kaggle), community-maintained successor graphs, automated deprecation workflows triggered by health metrics, integration with model deployment pipelines for upstream-downstream dependency tracking."

