gap_id: "Gap1"
gap_title: "Absence of Formal Dataset Deprecation Mechanisms"
gap_description: |
  Current ML repositories (HuggingFace, OpenML, UCI) rely on informal versioning practices.
  Datasets are updated or replaced without formal deprecation notices, version tracking, or
  migration paths for dependent users.

  Missing: No standardized deprecation protocol, no automated notification system for dataset
  consumers when datasets are deprecated/revised/replaced, no systematic approach to document
  why datasets are deprecated or what alternatives exist.

