hypothesis_draft:
  title: "Pilot-Driven Viability Gates for Early Identification of Non-Viable ML Hypotheses"
  hypothesis_id: "H-PilotGates-v1"
  core_claim: |
    A Pilot-Driven Viability Gates framework enables researchers to identify non-viable hypotheses
    (computational overhead >threshold) at the micro-pilot stage (10 samples, <1 hour) with >80% accuracy,
    reducing wasted effort from full implementations.
  mechanism: |
    Incremental empirical validation: measure overhead at 10-sample scale (Gate 1), extrapolate to full-scale
    using scaling factor k, refine prediction with Bayesian updates at 100-sample scale (Gate 2).
    Early-stop decision if predicted overhead >user threshold.
  predictions:
    - P1: "Gate 1 micro-pilot achieves >80% accuracy for identifying non-viable hypotheses vs. full implementation ground truth"
    - P2: "60%+ of non-viable hypotheses stop at Gate 1 (<1 hour) before day-long implementations"
    - P3: "Bayesian updates between Gate 1 and Gate 2 reduce prediction error by >40%"

variables_summary:
  independent: "Viability Gate Stage (Gate 1, Gate 2, Full Dataset)"
  dependent_primary: "Overhead Prediction Accuracy (0-100%)"
  controlled: "Overhead Threshold (user-specified), Hypothesis Type (attention/gradient/etc), Benchmark Dataset (GLUE/ImageNet)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in accuracy between Gate 1 micro-pilot predictions and random guessing (50%)
    for identifying non-viable hypotheses based on computational overhead thresholds.
  statistical_test: "Binomial test for P1 (accuracy vs. 50% null), paired t-test for P3 (error reduction)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First formalized feasibility-first framework treating viability as incremental empirical validation with Bayesian updates"
  differentiation_summary: |
    Differs from: (1) Ablation studies (test variations, not viability gates), (2) Hyperparameter early stopping (optimizes hyperparams, not feasibility),
    (3) Complexity analysis (theoretical Big-O, misses constant factors), (4) h-e1 post-hoc discovery (framework discovers overhead at micro-pilot, not after implementation)

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["Bayesian Overhead Predictor (scipy.stats Gaussian prior/likelihood)"]
  datasets: ["Retrospective ML Projects Corpus (Papers with Code + conference papers with micro-pilot data, target: 30 hypotheses)"]
  baselines: ["Random Guessing (50%)", "Full Implementation First", "Expert Intuition (~60-70%)"]

measurement_plan:
  data_collection:
    - source: "Papers with Code leaderboards for published overhead metrics"
    - source: "ML conference papers (NeurIPS, ICML, ICLR) with ablation study timing data"
    - source: "Extract 10-sample micro-pilot results where available"
  procedure:
    - step: "Identify 30 past hypotheses with published micro-pilot and full-scale overhead (10 low <20%, 10 mid 20-80%, 10 high >80%)"
    - step: "Apply Gate 1 prediction: O_full_pred = O_10 × k (scaling factor)"
    - step: "Compare predicted viability (O_full_pred vs. threshold) to actual viability (O_full vs. threshold)"
    - step: "Compute accuracy = (TP + TN) / 30, where TP = correctly predicted non-viable, TN = correctly predicted viable"
    - step: "For hypotheses with Gate 2 data (100 samples), compute Bayesian update and measure error reduction"
  success_criteria:
    - "P1: Accuracy >80% (binomial test vs. 50% null, p <0.05)"
    - "P2: Filtering rate ≥60% (fraction of non-viable hypotheses stopped at Gate 1)"
    - "P3: Error reduction >40% (paired t-test, p <0.05)"

validation:
  internal_validity:
    - "Control for hypothesis type (attention, gradient, etc.) by stratifying retrospective sample"
    - "Use standardized benchmarks (GLUE, ImageNet) to ensure overhead measurements are comparable"
    - "Blind test: extract micro-pilot data without knowledge of full-scale outcome"
  external_validity:
    - "If retrospective corpus <20 hypotheses, run prospective validation with NEW hypotheses to confirm generalization"
    - "Test scaling factor k across different hypothesis types to validate generalizability"
    - "Apply framework to new research domain (RL, graph learning) beyond NLP/vision"

discussion_synthesis:
  key_insights:
    - "Paradigm shift: feasibility-first (constraints → questions) vs. hypothesis-first (questions → constraints)"
    - "Distinction between scientific feasibility (testable?) and deployment feasibility (practical?). h-e1 was scientifically feasible, deployment infeasible"
    - "Viability as incremental search problem, not one-shot prediction"
  breakthrough_moments:
    - "Exchange 7 (Dr. Nova): Treat feasibility as Bayesian search with viability gates at each scale, not one-shot prediction"
    - "Exchange 8 (Prof. Vera): Operationalized P1 with precise accuracy metric and retrospective validation protocol using 30 past hypotheses"
  resolved_tensions:
    - "Prof. Vera's 'race to the bottom' concern: Framework provides EVIDENCE for ambition achievability, doesn't filter ambitious hypotheses"
    - "Prof. Rex's prediction accuracy critique: Use incremental MEASUREMENT (not pure prediction) with Bayesian updates to refine estimates"
    - "Prof. Pax's technical soundness: Minimum viable tests (10-sample micro-pilots) can predict full-scale viability without full implementation"
