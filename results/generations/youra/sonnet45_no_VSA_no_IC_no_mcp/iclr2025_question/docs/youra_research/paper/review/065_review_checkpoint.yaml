# Phase 6.5 Adversarial Review Checkpoint
# Tracks review progress, convergence, and revision history

version: "1.0"
checkpoint_date: "2026-08-25T00:00:00Z"
paper_version: "06_paper.md"
ground_truth_version: "065_ground_truth.yaml"

# ═══════════════════════════════════════════════════════════
# REVIEW CONFIGURATION
# ═══════════════════════════════════════════════════════════

review_config:
  personas:
    - name: "Accuracy Checker"
      focus: "Verify quantitative claims, statistical tests, baseline comparisons"
      checks_performed: 12

    - name: "Bored Reviewer"
      focus: "Assess engagement, clarity, narrative flow"
      checks_performed: 8

    - name: "Skeptical Expert"
      focus: "Challenge scientific rigor, generalizability, claim support"
      checks_performed: 10

  convergence_criteria:
    fatal_threshold: 0
    major_threshold: 0
    persuasiveness_required: true

  severity_definitions:
    FATAL: "Incorrect metric, unsupported claim, missing baseline, fabricated result"
    MAJOR: "Misleading framing, overstated conclusion, missing limitation, weak baseline"
    MINOR: "Engagement issue, clarity improvement, optional refinement"

