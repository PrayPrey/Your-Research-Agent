  gates:
    - name: "Gate 1"
      sample_size: 10
      purpose: "Micro-pilot overhead measurement and extrapolation"
      decision_criterion: "O_pred = k × O_10, compare to threshold T"

    - name: "Gate 2"
      sample_size: 100
      purpose: "Bayesian posterior refinement"
      decision_criterion: "Posterior mean from Bayesian update"

    - name: "Gate 3"
      sample_size: "full dataset"
      purpose: "Ground truth validation"
      decision_criterion: "Measure actual O_full"

  key_hyperparameters:
    - name: "overhead_threshold"
      value: "10%"
      rationale: "Real-time deployment constraint"

    - name: "correlation_threshold"
      value: 0.7
      rationale: "Minimum r for valid extrapolation"

    - name: "error_reduction_threshold"
      value: "40%"
      rationale: "Bayesian update benefit criterion"

  training_details:
    corpus_size: 32
    stratification: "11 low (<20%), 11 mid (20-80%), 10 high (>80%)"
    data_type: "synthetic"
    validation_type: "proof-of-concept"

