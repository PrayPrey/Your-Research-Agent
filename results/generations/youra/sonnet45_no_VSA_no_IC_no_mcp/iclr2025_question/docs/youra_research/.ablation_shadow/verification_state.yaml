main_hypothesis:
  id: H-PilotGates-v1
  title: Pilot-Driven Viability Gates for Early Identification of Non-Viable ML Hypotheses
  statement: Under ML research contexts where computational overhead thresholds exist (e.g., <10% for deployment), if researchers
    apply Pilot-Driven Viability Gates (incremental empirical validation at 10-sample, 100-sample, full-dataset scales), then
    non-viable hypotheses (overhead >threshold) will be identified at the micro-pilot stage (Gate 1, 10 samples, <1 hour)
    with >80% accuracy, because overhead scales predictably from micro-pilot to full implementation, and Bayesian updates
    refine predictions incrementally.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Retrospective ML Projects Corpus
    model: Bayesian Overhead Predictor
    optimizer: null
    hyperparameters: {}
