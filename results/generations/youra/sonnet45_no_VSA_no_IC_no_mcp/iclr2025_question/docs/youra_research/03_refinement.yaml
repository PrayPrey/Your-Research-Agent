  claims:
    - claim: "Layer-wise logit extraction achieves 100% technical success but 68.65% computational overhead"
      status: "BUILD_ON"
      evidence: "h-e1 Phase 4 FAIL — mechanism worked, deployment failed. Use as baseline for 'what NOT to repeat'"
