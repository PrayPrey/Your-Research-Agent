    Retrospective ML Projects Corpus must exist with ≥30 hypotheses reporting both micro-pilot and full-scale overhead.
    If Papers with Code data insufficient, prospective validation alternative exists (run new micro-pilots).
  sh2_mechanism: |
    Core mechanism: empirical overhead measurement at 10-sample scale extrapolates to full-scale via scaling factor k.
    Test by correlating O_10 vs. O_full across hypotheses. r >0.7 validates predictive scaling.
  sh3_comparison: |
    Framework accuracy (P1) compared to random guessing baseline (50%) and expert intuition (~60-70%).
    Statistical significance via binomial test for P1, paired t-test for P3.
  open_questions:
