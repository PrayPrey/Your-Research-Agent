    - claim: "Standard evaluation metrics (accuracy, F1, BLEU, perplexity) are pre-implemented and validated"
      status: "BUILD_ON"
      evidence: "Phase 1 — scikit-learn, torchmetrics libraries provide established metrics"
  scope_reduction_percentage: 0
  phase2b_4_instructions: |
    No claims require re-verification. Hypothesis tests a NEW methodology (Pilot-Driven Viability Gates),
    not the established facts themselves. The established facts serve as CONTEXT for why the methodology is needed.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-PilotGates-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under ML research contexts where computational overhead thresholds exist (e.g., <10% for deployment),
    if researchers apply Pilot-Driven Viability Gates (incremental empirical validation at 10-sample, 100-sample, full-dataset scales),
    then non-viable hypotheses (overhead >threshold) will be identified at the micro-pilot stage (Gate 1, 10 samples, <1 hour) with >80% accuracy,
    because overhead scales predictably from micro-pilot to full implementation, and Bayesian updates refine predictions incrementally.
  alternative_hypothesis_h0: |
    There is no significant difference in accuracy between Gate 1 micro-pilot predictions and random guessing (50% accuracy baseline)
    for identifying non-viable hypotheses based on computational overhead thresholds.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Viability Gate Stage"
      type: "categorical"
      operationalization: "Which gate stage is used for overhead prediction: Gate 1 (10 samples), Gate 2 (100 samples), or Full (complete dataset)"
      levels: ["Gate 1 (10 samples)", "Gate 2 (100 samples)", "Full Dataset"]
  dependent:
    - name: "Overhead Prediction Accuracy"
      type: "continuous"
      operationalization: "Accuracy of viability prediction: (TP + TN) / Total hypotheses, where TP = correctly predicted non-viable, TN = correctly predicted viable. Range: 0-100%"
      primary: true
    - name: "Time to Viability Decision"
      type: "continuous"
      operationalization: "Wall-clock time from hypothesis conception to viability decision (stop/continue). Measured in hours. Gate 1 target: <1 hour"
      primary: false
    - name: "Prediction Error Reduction"
      type: "continuous"
      operationalization: "Percent reduction in overhead prediction error from Gate 1 to Gate 2: (Error_G1 - Error_G2) / Error_G1 × 100%. Range: 0-100%"
      primary: false
  controlled:
    - name: "Overhead Threshold"
      operationalization: "User-specified threshold for acceptable computational overhead (e.g., 10% for real-time, 200% for offline). Held constant per application domain"
    - name: "Hypothesis Type"
      operationalization: "Category of ML hypothesis (attention mechanism, layer-wise analysis, gradient method). Stratify retrospective validation to control for type-specific scaling"
    - name: "Benchmark Dataset"
      operationalization: "Use standardized benchmarks (GLUE for NLP, ImageNet for vision) to ensure comparability across hypotheses"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Micro-pilot (10 samples) empirically measures overhead O_10, extrapolated to full-scale O_full using scaling factor k"
      evidence: "h-e1 would have shown ~60% overhead at 10-sample scale, predicting 60-70% full-scale (actual: 68.65%)"
      falsifier: "If O_10 does not correlate with O_full (r < 0.5 across 30 hypotheses), extrapolation is invalid"
    - step: 2
      description: "Bayesian update combines Gate 1 prior P(O_full | O_10) with Gate 2 likelihood P(O_100 | O_full) to refine posterior prediction"
      evidence: "Bayesian inference standard practice in uncertainty quantification, reduces prediction variance by incorporating new evidence"
      falsifier: "If posterior prediction error ≥ prior prediction error (no improvement from Gate 2 data), Bayesian update adds no value"
    - step: 3
      description: "Viability decision made by comparing predicted O_full to user threshold T; if predicted O_full > T, hypothesis stops at Gate 1"
      evidence: "h-e1 with predicted 60-70% overhead vs. 10% threshold would stop at Gate 1, saving day-long full implementation"
      falsifier: "If hypotheses stopped at Gate 1 later prove viable (<threshold) in full validation, framework creates false negatives"
  key_tension: "Scaling factor k may vary by hypothesis type (attention vs. gradient methods), requiring type-specific calibration"
  evidence_summary: |
    Step 1: h-e1 empirical data (68.65% overhead) validates that overhead is measurable at small scales
    Step 2: Bayesian methods are established for uncertainty reduction in prediction
    Step 3: Early-stop decision logic is straightforward threshold comparison

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Computational overhead scales predictably from 10-sample micro-pilot to full dataset"
    supporting_evidence: "h-e1 showed consistent KL divergence computation across samples, suggesting linear or near-linear scaling for many operations"
    consequence_if_violated: "If scaling is non-linear (e.g., memory bottlenecks at 100 samples not present at 10), Gate 1 predictions will have high error rate"
  - id: "A2"
    assumption: "Past ML projects report sufficient micro-pilot data for retrospective validation"
    supporting_evidence: "Papers with Code and ML conference papers often include ablation studies with small-sample results"
    consequence_if_violated: "If <20 papers with 10-sample data available, statistical power drops below significance; need prospective validation instead"
  - id: "A3"
    assumption: "Scaling factor k generalizes across hypothesis types within a category"
    supporting_evidence: "Attention mechanisms share computational patterns (O(n²) self-attention), suggesting within-category similarity"
    consequence_if_violated: "If each hypothesis requires unique k, framework needs large training set of past hypotheses to learn per-hypothesis scaling"
  - id: "A4"
    assumption: "Researchers will honestly report negative results from Gate 1 stops"
    supporting_evidence: "Framework design includes incentive: saving time is valuable, early stops prevent wasted effort"
    consequence_if_violated: "If researchers skip Gate 1 or ignore stop signals, framework adoption fails"
  - id: "A5"
    assumption: "Overhead is the dominant feasibility constraint (vs. memory, dataset size, human annotation)"
    supporting_evidence: "h-e1 failed on overhead despite having dataset and metrics; Phase 1 constraints emphasize 'no new data/human eval'"
    consequence_if_violated: "If memory or other constraints dominate, framework needs additional gates beyond overhead measurement"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    ML research hypotheses where:
    - Computational overhead is a critical feasibility constraint (real-time systems, resource-limited deployment)
    - Existing benchmark datasets exist (GLUE, ImageNet, etc.)
    - Overhead can be measured empirically on small samples (<1 hour micro-pilot)
    - User can specify an overhead threshold based on application requirements
  does_not_apply_to: |
    - Hypotheses where overhead is irrelevant (theoretical analysis, offline batch processing with unlimited compute)
    - Hypotheses requiring new datasets or human annotation (framework assumes existing benchmarks)
    - Hypotheses with non-scalable operations (e.g., combinatorial search where 10 samples takes seconds, 100 samples takes days)
  known_limitations: |
    - Requires calibration of scaling factor k per hypothesis type (attention, gradient, etc.)
    - Assumes overhead scales predictably (may fail for memory-bound or I/O-bound operations)
    - Retrospective validation limited by availability of published micro-pilot data
    - Framework provides viability assessment, not hypothesis GENERATION (orthogonal problem)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Gate 1 micro-pilot (10 samples, <1 hour) identifies non-viable hypotheses (overhead >threshold) with >80% accuracy compared to full-scale ground truth"
    test_method: "Retrospective validation using 30 past ML projects with published micro-pilot and full-scale overhead data. Apply Gate 1 prediction to micro-pilot, compare to actual full overhead. Measure accuracy = (TP + TN) / 30"
    success_criterion: "Accuracy >80% (24/30 correct predictions). Null hypothesis: 50% (random guessing). Statistical test: binomial test, p <0.05"
    falsification: "If accuracy ≤60% across 20+ hypotheses, framework fails to beat random + small margin"
  - id: "P2"
    primary: false
    statement: "60%+ of non-viable hypotheses (overhead >threshold) are filtered at Gate 1 (<1 hour investment) before reaching day-long full implementations"
    test_method: "Track viability decisions across retrospective validation set. Count hypotheses stopped at Gate 1 vs. those continuing to Gate 2/3. Measure filtering rate = (Stopped at G1) / (Total non-viable)"
    success_criterion: "Filtering rate ≥60%. If 10 non-viable hypotheses in dataset, ≥6 should stop at Gate 1"
    falsification: "If <40% of non-viable hypotheses stop at Gate 1, framework provides minimal time savings over full implementation"
  - id: "P3"
    primary: false
    statement: "Bayesian overhead updates between Gate 1 (10 samples) and Gate 2 (100 samples) reduce prediction error by >40% compared to Gate 1 alone"
    test_method: "For hypotheses reaching Gate 2, compute prediction error at G1: |O_pred_G1 - O_full| / O_full. Compute error at G2 after Bayesian update: |O_pred_G2 - O_full| / O_full. Measure error reduction: (Error_G1 - Error_G2) / Error_G1"
    success_criterion: "Mean error reduction >40% across ≥10 hypotheses. Paired t-test, p <0.05"
    falsification: "If error reduction <20%, Bayesian updates add complexity without meaningful accuracy gain"

