experimental_setup:
  dataset:
    name: "Retrospective ML Projects Corpus"
    type: "custom"
    source: "Papers with Code leaderboards + conference papers with published micro-pilot data"
    path: "N/A (meta-dataset of published results)"
    hypothesis_fit: |
      Framework validation requires past hypotheses with BOTH micro-pilot (10-sample) and full-scale overhead measurements.
      Papers with Code and ML conference papers (NeurIPS, ICML, ICLR) often report ablation studies with small-sample timing data.
      Target: 30 hypotheses (10 low-overhead <20%, 10 mid 20-80%, 10 high >80%) for balanced evaluation.
  model:
    name: "Bayesian Overhead Predictor"
    type: "statistical model"
    source: "Implemented using scipy.stats Gaussian priors/likelihoods"
    hypothesis_fit: |
      The framework IS the model being tested. No external ML model needed.
      Bayesian predictor takes O_10 as prior mean, updates with O_100 as likelihood, outputs posterior P(O_full).
  baselines:
    - name: "Random Guessing"
      method: "50% accuracy baseline (coin flip for viable/non-viable classification)"
    - name: "Full Implementation First"
      method: "Current practice: implement full hypothesis before checking viability. Time cost: full implementation duration (hours to days)"
    - name: "Expert Intuition"
      method: "Researcher predicts viability based on experience without empirical micro-pilot. Accuracy: unknown, likely 60-70% based on h-e1 anecdote"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First formalized feasibility-first framework treating viability assessment as incremental empirical validation
    rather than one-shot constraint checking or post-hoc discovery (like h-e1).
  key_innovation: |
    Pilot-Driven Viability Gates with Bayesian updates: structured search through sample scales (10 → 100 → full)
    with probabilistic prediction refinement. Combines software engineering gating (fail-fast) with Bayesian inference (uncertainty reduction).
  differentiation:
    - prior_work: "Ablation studies in ML papers"
      difference: "Ablations test hypothesis VARIATIONS, not viability GATES. No formalized stop/continue decision protocol"
    - prior_work: "Hyperparameter search with early stopping"
      difference: "Early stopping optimizes hyperparams, not feasibility. Different objective: maximize accuracy vs. predict overhead"
    - prior_work: "Complexity analysis (Big-O notation)"
      difference: "Big-O is theoretical, doesn't account for constant factors or implementation details. Framework uses empirical measurement"
    - prior_work: "h-e1 post-hoc discovery of 68.65% overhead"
      difference: "h-e1 discovered overhead AFTER full implementation. Framework discovers at micro-pilot BEFORE committing resources"

