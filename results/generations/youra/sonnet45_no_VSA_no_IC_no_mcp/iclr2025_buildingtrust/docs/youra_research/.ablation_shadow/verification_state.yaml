main_hypothesis:
  id: H-FailureRouting-v1
  title: Failure-Type Routing Framework for Automated LLM Diagnosis and Correction
  statement: Under TruthfulQA single-entity factual questions with gold-labeled model failures, automated failure-type routing
    (entity-error → RAG, non-entity-error → COT) based on attention pattern analysis will achieve higher correction success
    rates than mismatched routing, because entity-substitution failures concentrate attention on incorrect entities (low entropy)
    while non-entity failures distribute attention broadly (high entropy).
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA single-entity factual questions subset
    model: GPT-3.5 and Llama-2-7B
    optimizer: N/A (inference only)
    hyperparameters:
      ner_tool: spaCy
      retrieval_corpus: Wikipedia
      sample_size: 100
      entity_error_samples: 50
      non_entity_error_samples: 50
      significance_level: 0.05
      correction_threshold: 20
