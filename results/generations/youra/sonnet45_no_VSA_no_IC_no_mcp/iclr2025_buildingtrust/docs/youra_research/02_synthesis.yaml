hypothesis_draft:
  title: "Failure-Type Routing Framework for Automated LLM Diagnosis and Correction"
  hypothesis_id: "H-FailureRouting-v1"
  core_claim: |
    Automated failure-type routing from benchmark failures to interpretability-based diagnosis
    enables more effective correction than unmatched diagnosis, as demonstrated by attention
    pattern signatures distinguishing entity-substitution errors from other failure types.
  mechanism: |
    Entity-substitution errors concentrate attention on incorrect entity tokens (low entropy),
    while non-entity errors distribute attention broadly (high entropy). Pattern-based classification
    routes failures to matched correction methods (entity-error → RAG retrieval, reasoning-error → COT),
    targeting root causes and improving correction success.
  predictions:
    - P1: "Entity-error attention entropy < non-entity-error entropy (p<0.05, two-sample t-test)"
    - P2: "Entity-error + RAG correction success exceeds entity-error + COT by ≥20 points or ≥50% relative"
    - P3: "Non-entity-error entropy shows no difference vs successful responses (specificity check)"

variables_summary:
  independent: "Failure Type (entity-error vs non-entity-error, gold-labeled), Correction Method (RAG vs COT)"
  dependent_primary: "Attention Entropy over NER-identified entity spans (Shannon entropy), Correction Success Rate (TruthfulQA auto-scoring)"
  controlled: "LLM (GPT-3.5, Llama-2-7B), Benchmark Subset (TruthfulQA single-entity factual), NER Tool (spaCy), Retrieval Corpus (Wikipedia)"

null_hypothesis:
  h0_statement: |
    No significant difference in attention entropy between entity-error and non-entity-error failures,
    and correction success rates do not differ between matched (entity→RAG) and mismatched (entity→COT) routing.
  statistical_test: "Welch's two-sample t-test (unequal variances) for H1, success rate comparison with ≥20 point threshold for H2"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Systematic integration of benchmarks + interpretability + correction into automated diagnostic workflow"
  differentiation_summary: |
    Prior work: Benchmarks (TruthfulQA) produce aggregate scores, interpretability (attention analysis) requires
    manual example selection, correction methods (RAG/COT) applied uniformly.

    This work: Benchmark failures automatically trigger interpretability analysis, attention patterns route to
    matched correction, enabling scale (100s vs 10s examples) and targeting root causes.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["GPT-3.5", "Llama-2-7B"]
  datasets: ["TruthfulQA single-entity factual questions subset"]
  baselines: ["Random Routing (50/50 RAG/COT)", "Aggregate Correction (single method for all)"]

measurement_plan:
  data_collection:
    - source: "TruthfulQA failures from GPT-3.5 and Llama-2-7B on single-entity factual questions"
    - source: "Manual gold labels (N=100 per model: 50 entity-error, 50 non-entity-error)"
    - source: "Attention weights from final prediction token (extracted via model APIs/Transformers library)"
    - source: "NER entity spans via spaCy"
  procedure:
    - step: "Phase 0 - Pre-experiment Validation: Verify NER accuracy ≥90%, Wikipedia coverage ≥90%, run pilot (N=20) to ground P2 threshold"
    - step: "Phase 1 - Pattern Detection (H1): Extract attention for 100 failures per model, calculate entropy over entity spans, run Welch's t-test"
    - step: "Phase 2 - Correction Validation (H2): Apply RAG and COT to 50 entity-errors per model, compare success rates via TruthfulQA auto-scoring"
    - step: "Phase 3 - Specificity Check (P3): Compare non-entity-error entropy to successful TruthfulQA responses (no failure)"
  success_criteria:
    - "H1 p<0.05 with entity-error mean < non-entity-error mean in both models"
    - "H2 RAG-COT difference ≥20 points OR relative ≥50% in both models"
    - "P3 p>0.05 (non-entity-error vs success entropy no difference)"

validation:
  internal_validity:
    - "Multi-model testing (GPT-3.5 + Llama-2-7B) controls for architecture-specific patterns"
    - "Pre-experiment NER and Wikipedia validation checks measurement assumptions (A1, A2)"
    - "Pilot experiment (N=20) grounds P2 threshold in realistic baselines, avoiding post-hoc rationalization"
    - "Controlled variables: single NER tool, single retrieval corpus, subset restriction to single-entity questions"
  external_validity:
    - "Limited generalization: entity-errors only (reasoning errors, knowledge gaps out of scope)"
    - "Single benchmark (TruthfulQA) - FEVER, adversarial datasets unknown"
    - "Two LLM architectures - broader architectural generalization unknown"
    - "Factual knowledge domain (Wikipedia coverage) - non-factual questions out of scope"

