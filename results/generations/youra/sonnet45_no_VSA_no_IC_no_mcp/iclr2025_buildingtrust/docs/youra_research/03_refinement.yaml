# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FailureRouting-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under TruthfulQA single-entity factual questions with gold-labeled model failures,
    if we classify failures as entity-error vs non-entity-error using attention pattern analysis,
    then automated failure-type routing to matched correction methods (entity-error → RAG, reasoning-error → COT)
    will achieve higher correction success rates than mismatched routing,
    because entity-substitution failures concentrate attention on incorrect entities (low entropy)
    while non-entity failures distribute attention broadly (high entropy),
    enabling pattern-based diagnosis that targets root causes.
  alternative_hypothesis_h0: |
    There is no significant difference in attention entropy between entity-error and non-entity-error failures,
    and correction success rates do not differ between matched and mismatched routing strategies.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Failure Type"
      type: "categorical"
      operationalization: "Gold-labeled classification: entity-error vs non-entity-error based on manual inspection of TruthfulQA failures"
      levels: ["entity-error", "non-entity-error"]
    - name: "Correction Method"
      type: "categorical"
      operationalization: "RAG (retrieval-augmented generation from Wikipedia) vs COT (chain-of-thought prompting)"
      levels: ["RAG", "COT"]
  dependent:
    - name: "Attention Entropy"
      type: "continuous"
      operationalization: "Shannon entropy H = -Σ p(i) log p(i) over final-token attention distribution restricted to NER-identified entity spans"
      primary: true
    - name: "Correction Success Rate"
      type: "continuous"
      operationalization: "Percentage of failures corrected successfully as measured by TruthfulQA automatic scoring (0-100%)"
      primary: false
  controlled:
    - name: "LLM Architecture"
      operationalization: "Fixed to GPT-3.5 and Llama-2-7B (two-model validation for robustness)"
    - name: "Benchmark Subset"
      operationalization: "TruthfulQA single-entity factual questions only (excludes multi-entity, reasoning, ambiguous questions)"
    - name: "NER Tool"
      operationalization: "spaCy named entity recognition with ≥90% accuracy validation threshold"
    - name: "Retrieval Corpus"
      operationalization: "Wikipedia with ≥90% coverage verification for entity-error test cases"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Pattern Emergence - Entity-substitution errors concentrate attention on incorrect entity tokens while non-entity errors distribute attention broadly"
      evidence: "Prof. Vera Exchange 2 - proposed attention entropy as mechanism signature. Prof. Pax Exchange 9 - validated theoretical plausibility based on transformer attention behavior"
      falsifier: "If attention entropy shows no difference or opposite direction (entity-errors have higher entropy), mechanism fails"
    - step: 2
      description: "Diagnostic Routing - Attention pattern classification (low vs high entropy) identifies failure type and triggers matched correction method"
      evidence: "Dr. Nova Exchange 1 - proposed automated routing. Prof. Rex Exchange 6 - required narrowing to single-feature classification for testability"
      falsifier: "If entropy-based classification does not correlate with gold-labeled failure types (accuracy <70%), routing mechanism fails"
    - step: 3
      description: "Correction Effectiveness - Matched correction (entity-error → RAG) succeeds more than mismatched (entity-error → COT) due to targeting root cause"
      evidence: "Dr. Nova Exchange 7 - proposed automated correction validation. Prof. Vera Exchange 8 - operationalized as H2 with ≥20 point improvement threshold"
      falsifier: "If RAG vs COT success rate difference <20 points or opposite direction, correction utility claim fails"
  key_tension: "Generalization beyond entity-substitution errors unknown - reasoning errors, knowledge gaps, hybrid failures may have different or no attention signatures"
  evidence_summary: |
    Mechanism chain supported by theoretical plausibility (transformer attention behavior),
    prior discussion consensus on attention entropy as measurable signature,
    and two-hypothesis experimental design (H1 pattern detection + H2 correction validation).
    Falsification criteria specified for each step.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "NER tools (spaCy) accurately identify entity spans in TruthfulQA single-entity factual questions"
    supporting_evidence: "Prof. Pax Exchange 9 - standard entities (France, Paris) well-handled by NER. Prof. Rex Exchange 12 - require ≥90% accuracy validation"
    consequence_if_violated: "Entity-span misidentification introduces measurement noise, potentially washing out entropy signal"
  - id: "A2"
    assumption: "Wikipedia contains correct factual knowledge for TruthfulQA entity-error test cases"
    supporting_evidence: "Prof. Pax Exchange 9 - Wikipedia should suffice for factual questions. Prof. Rex Exchange 12 - require ≥90% coverage verification"
    consequence_if_violated: "RAG correction fails due to missing knowledge rather than wrong diagnosis, invalidating H2 causal test"
  - id: "A3"
    assumption: "Entity-substitution errors and non-entity errors are categorically distinct in single-entity factual questions"
    supporting_evidence: "Prof. Rex Exchange 6 - acknowledged hybrid failures exist, mitigation via subset restriction to unambiguous cases"
    consequence_if_violated: "Binary classification forces ambiguous failures into categories, creating label noise"
  - id: "A4"
    assumption: "Attention patterns generalize across LLM architectures (GPT-3.5 and Llama-2-7B)"
    supporting_evidence: "Prof. Rex Exchange 12 - required multi-model testing for robustness. Different architectures may have different attention behaviors"
    consequence_if_violated: "Results specific to one architecture, limiting generalizability of routing mechanism"
  - id: "A5"
    assumption: "100-sample manual gold labels provide sufficient statistical power for hypothesis testing"
    supporting_evidence: "Prof. Vera Exchange 2 - proposed N=100 (50 entity, 50 non-entity). Standard for two-sample t-tests with medium effect sizes"
    consequence_if_violated: "Insufficient power to detect true differences, Type II error risk"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Entity-substitution errors in single-entity factual questions (e.g., "What is the capital of France?")
    - TruthfulQA benchmark evaluation framework
    - Transformer-based LLMs with accessible attention weights (GPT-3.5, Llama-2-7B tested)
    - Scenarios where NER tools achieve ≥90% entity identification accuracy
    - Knowledge domains covered by Wikipedia (factual entities, geographic, historical)
  does_not_apply_to: |
    - Reasoning errors, knowledge gaps, or hybrid failure types (out of scope for proof-of-concept)
    - Multi-entity questions or complex compositional questions
    - Other benchmarks (FEVER, adversarial datasets) - generalization unknown
    - LLMs without accessible attention mechanisms (API-only models like GPT-4)
    - Non-factual questions (opinion, subjective, ambiguous)
  known_limitations: |
    1. Proof-of-concept limited to one failure type (entity-substitution) on one benchmark (TruthfulQA)
    2. Requires manual gold labels (N=100 per model) - automated labeling is future work
    3. Single-entity subset restriction excludes multi-entity and compositional questions
    4. Two LLM architectures tested - broader architectural generalization unknown
    5. Correction success depends on retrieval corpus quality (Wikipedia coverage assumption)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Entity-substitution errors exhibit significantly lower attention entropy over NER-identified entity spans compared to non-entity errors"
    test_method: "Welch's two-sample t-test on attention entropy distributions (N=100, 50 entity-error, 50 non-entity-error per model)"
    success_criterion: "p < 0.05 with entity-error group mean entropy < non-entity-error group mean entropy, replicated across both GPT-3.5 and Llama-2-7B"
    falsification: "p ≥ 0.05 OR opposite direction (entity-error entropy ≥ non-entity-error entropy) in either model"
  - id: "P2"
    primary: false
    statement: "Matched correction (entity-error → RAG) achieves higher success rate than mismatched correction (entity-error → COT) by ≥20 percentage points or ≥50% relative improvement"
    test_method: "Compare correction success rates on 50 gold-labeled entity-errors per model using TruthfulQA automatic scoring"
    success_criterion: "RAG success rate - COT success rate ≥ 20 points OR (RAG - COT)/COT ≥ 0.50, whichever is more conservative, replicated across both models"
    falsification: "Difference < 20 points AND relative improvement < 50% in either model, OR opposite direction (COT > RAG)"
  - id: "P3"
    primary: false
    statement: "Entity-error vs non-entity-error entropy difference is specific to failures, not general model behavior"
    test_method: "Compare non-entity-error entropy to successful TruthfulQA responses (no failure) - expect no significant difference"
    success_criterion: "p > 0.05 on Welch's t-test comparing non-entity-error entropy vs success-case entropy"
    falsification: "p < 0.05 - would indicate entropy differences reflect general question properties, not failure-specific patterns"

