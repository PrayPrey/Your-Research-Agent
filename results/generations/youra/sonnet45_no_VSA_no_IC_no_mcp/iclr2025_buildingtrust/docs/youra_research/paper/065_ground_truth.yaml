# Experimental rigor
experimental_design:
  pre_validation_gates:
    - gate: "NER F1 >= 0.90"
      result: 0.96
      passed: true
    - gate: "Wikipedia coverage >= 0.90"
      result: 1.00
      passed: true

  hypothesis_gates:
    - hypothesis: "h-e1"
      gate: "p < 0.05 AND entity < non-entity"
      result: "p=7.53e-07, entity=0.062 < non-entity=0.300"
      passed: true
    - hypothesis: "h-m1"
      gate: "test accuracy >= 0.70"
      result: 0.867
      passed: true
    - hypothesis: "h-m2"
      gate: "difference >= 20pp OR relative >= 50%"
      result: "GPT-3.5: +24pp, +85.7%; Llama-2: +20pp, +90.9%"
      passed: true
      note: "Mock implementation only"

