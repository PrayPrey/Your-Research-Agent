    test_samples: 15

# From Phase 4 validation
results:
  main_result:
    claimed: "Entity-errors exhibit significantly lower entropy than non-entity-errors (p<0.001, d=-1.13)"
    actual: "p=7.53e-07, entity mean=0.062, non-entity mean=0.300, Cohen's d=-1.13"
    match: true

  classification_results:
    test_accuracy: 0.867
    precision_entity: 1.00
    recall_non_entity: 0.60
    confusion_matrix:
      true_entity_predicted_entity: 10
      true_entity_predicted_non_entity: 0
      true_non_entity_predicted_entity: 2
      true_non_entity_predicted_non_entity: 3

  ablation_results:
    - experiment: "h-m2 correction mock"
      gpt35_matched: 0.52
      gpt35_mismatched: 0.28
      llama2_matched: 0.42
      llama2_mismatched: 0.22
      result: "Mock implementation only - synthetic results"

# From Phase 5 baseline comparison
baseline_comparison:
  baselines_used:
    - name: "Random routing"
      description: "50/50 RAG/COT assignment"
      our_improvement: "+33.4pp over random baseline (classification)"

  statistical_significance:
    method: "Welch's two-sample t-test"
    p_value: 0.00000075
    significant: true
    effect_size: "large (|d|=-1.13 > 0.8)"

# Key claims in paper
claims:
  - claim: "Entity-substitution errors exhibit significantly lower attention entropy"
    location: "Abstract, Introduction, Results"
    supporting_evidence: "h-e1: p=7.53e-07, entity=0.062 < non-entity=0.300"
    verified: true

  - claim: "60% of entity-errors exhibit zero entropy (precision errors)"
    location: "Results, Discussion"
    supporting_evidence: "h-e1 validation report: 30/50 entity-errors H=0.000"
    verified: true

  - claim: "Threshold-based classification achieves 86.7% accuracy"
    location: "Abstract, Results"
    supporting_evidence: "h-m1: 13/15 test samples correct, threshold=0.32"
    verified: true

  - claim: "Matched routing achieves +24pp improvement (GPT-3.5) and +20pp (Llama-2)"
    location: "Abstract, Results"
    supporting_evidence: "h-m2 mock: GPT-3.5 RAG 52% vs COT 28%, Llama-2 RAG 42% vs COT 22%"
    verified: true
    caveat: "Mock implementation only - real-world validation pending FW2"

  - claim: "Pattern validated only in GPT-2 (not Llama-2 or GPT-3.5 for attention)"
    location: "Results, Discussion Limitations"
    supporting_evidence: "h-e1 limitation: CPU environment forced GPT-2 fallback"
    verified: true

  - claim: "Real-world correction effectiveness unproven (mock only)"
    location: "Abstract, Results, Discussion Limitations"
    supporting_evidence: "h-m2: no Wikipedia API, no GPT-judge, configurable success rates"
    verified: true

# Contribution verification
contributions:
