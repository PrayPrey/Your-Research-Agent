  - limitation: "Mock correction implementation (synthetic results)"
    location: "Abstract, Results (CRITICAL LIMITATION marker), Discussion L2"
    properly_acknowledged: true

  - limitation: "Manual gold labels (N=100, automation deferred)"
    location: "Discussion L3"
    properly_acknowledged: true

  - limitation: "Single failure type (entity-substitution only)"
    location: "Discussion L4"
    properly_acknowledged: true

