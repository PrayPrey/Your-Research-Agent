novelty:
  preserved_novelty: "Bidirectional alignment as interaction-level coupling (correlation), not model-level property. First framework measuring co-adaptation (user learning × AI responsiveness) rather than summing individual metrics."
  key_innovation: "Coupling metric detects asymmetric alignment failures (e.g., responsive AI but users not learning, or users adapting but AI not responsive). Enables user-population-specific evaluation and deployment-time monitoring without new human studies."
  differentiation:
    - prior_work: "RLHF (Ouyang et al. 2022) — measures AI-to-human alignment only (reward model accuracy)"
      difference: "We measure BOTH user-to-AI (reformulation slope) AND AI-to-user (diversity correlation), and test COUPLING as distinct mechanism"
    - prior_work: "Interpretability metrics (user effort, task completion time) — measures human-to-AI alignment in isolation"
      difference: "We measure bidirectional coupling, not isolated metrics. Coupling hypothesis: alignment is multiplicative (correlation), not additive (sum)"
    - prior_work: "Bansal et al. 2021 (user mental models) — measures mental models via explicit user predictions"
      difference: "We infer mental model accuracy from behavioral trace (reformulation slope), measurable on existing logs without explicit user prediction tasks"

