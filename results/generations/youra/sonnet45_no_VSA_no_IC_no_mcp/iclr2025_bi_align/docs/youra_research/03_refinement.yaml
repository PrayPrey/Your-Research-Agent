# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════
# Phase 2B Step 1,3 use this to SKIP re-verification of established claims.

established_facts:
  claims:
    - claim: "User reformulation rate in conversations indicates learning curve"
      status: "BUILD_ON"
      evidence: "Established in HCI literature (Newell & Rosenbloom 1981 learning curve theory). Reformulation is known indicator of uncertainty reduction."
    - claim: "RLHF measures AI-to-human alignment via reward model accuracy and preference prediction"
      status: "BUILD_ON"
      evidence: "InstructGPT (Ouyang et al. 2022), Constitutional AI (Bai et al. 2022) — standard practice in existing work"
    - claim: "Paraphrase detection via SBERT + edit distance is established NLP technique"
      status: "BUILD_ON"
      evidence: "PAWS dataset, ParaBank models — standard practice for reformulation detection"
    - claim: "Bidirectional alignment is distinct from unidirectional AI-to-human or human-to-AI alignment"
      status: "PROVE_NEW"
      evidence: "Gap 1 from Phase 1 — no existing unified bidirectional framework"
    - claim: "Behavioral coupling (correlation between user learning + AI responsiveness) quantifies bidirectional alignment"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis from discussion — requires empirical validation"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    BUILD_ON claims can be cited in implementation without re-derivation.
    PROVE_NEW claims require empirical validation:
    - Test coupling metric (reformulation slope × diversity correlation) predicts helpfulness ratings
    - Compare coupling metric to individual metrics to show COUPLING matters beyond components

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiAlign-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under conversational AI interactions with ≥5 turns, if we measure the coupling strength
    (Pearson correlation) between user learning rate (reformulation slope) and AI policy
    responsiveness (response diversity tracking query diversity), then conversations with
    higher coupling strength will have higher human helpfulness ratings, because bidirectional
    alignment emerges from co-adaptation where users learn AI capabilities AND AI policy
    exhibits responsiveness to user query patterns.
  alternative_hypothesis_h0: |
    There is no significant difference in helpfulness ratings between high-coupling and
    low-coupling conversations when controlling for individual metrics (reformulation slope
    alone and diversity correlation alone).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Coupling Strength (Bidirectional Alignment Metric)"
      type: "continuous"
      operationalization: "Pearson correlation between user reformulation slope and AI diversity correlation per conversation. Range: [-1, 1]"
      levels: []
  dependent:
    - name: "Human Helpfulness Rating"
      type: "continuous"
      operationalization: "Human ratings from HH-RLHF dataset (scale 0-1), averaged per conversation"
      primary: true
    - name: "Task Success Rate"
      type: "categorical"
      operationalization: "Binary: conversation outcome (successful vs. abandoned), from HH-RLHF metadata"
      primary: false
  controlled:
    - name: "Conversation Length"
      operationalization: "Filter conversations to ≥5 turns; include turn count as covariate in regression"
    - name: "User Engagement Decay"
      operationalization: "Stratify by conversation outcome (successful vs. abandoned); test P1 on successful conversations only"
    - name: "Individual Metrics"
      operationalization: "Control for reformulation slope alone and diversity correlation alone in regression to test coupling beyond components"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Users adapt to AI capabilities by learning its response patterns, manifesting as decreased reformulation rate over turns"
      evidence: "Learning curve theory (Newell & Rosenbloom 1981), established HCI principle. User uncertainty reduction → less query rephrasing."
      falsifier: "Reformulation slope does NOT predict task success when controlling for engagement → learning hypothesis fails"
    - step: 2
      description: "AI policy exhibits responsiveness to user query diversity (diverse queries elicit diverse responses), measurable as correlation between query diversity and response diversity"
      evidence: "Response diversity (distinct-n metrics) is computable from static datasets. Responsiveness is POLICY property (not online adaptation) — pre-trained models can have responsive policies."
      falsifier: "Response diversity does NOT correlate with query diversity across conversations → responsiveness hypothesis fails"
    - step: 3
      description: "Bidirectional alignment emerges when user learning AND AI responsiveness are COUPLED (correlated), not merely co-present. High coupling → mutual predictability → higher helpfulness."
      evidence: "Novel hypothesis — if coupling (correlation between Step 1 + Step 2) predicts ratings BEYOND individual components, this validates coupling as distinct mechanism."
      falsifier: "Coupling metric does NOT predict helpfulness beyond individual metrics (reformulation slope + diversity correlation) → coupling hypothesis fails, alignment is additive not multiplicative"
  key_tension: "Is alignment multiplicative (coupling) or additive (sum of individual metrics)? If additive, coupling correlation is spurious."
  evidence_summary: |
    Step 1 established (HCI literature). Step 2 measurable (n-gram diversity). Step 3 novel —
    requires empirical test that coupling predicts outcomes individual metrics miss.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Reformulation rate decrease indicates user learning, not engagement decay"
    supporting_evidence: "Learning curve theory — if users learn, reformulation decreases AND task success increases. Testable by stratifying on outcome."
    consequence_if_violated: "Reformulation slope measures disengagement, not learning → P1 fails on successful conversations"
  - id: "A2"
    assumption: "SBERT semantic similarity + edit distance reliably detects reformulations vs. topic continuity"
    supporting_evidence: "Paraphrase detection (PAWS, ParaBank) — high semantic + low syntactic similarity = reformulation. Topic continuity has high semantic + high syntactic similarity."
    consequence_if_violated: "False positive reformulation detection → noisy slope estimates → weak P1 results"
  - id: "A3"
    assumption: "Response diversity (distinct-n) captures AI policy responsiveness to query diversity"
    supporting_evidence: "Distinct-n is standard diversity metric in NLG (Li et al. 2016). Measuring it conditioned on query diversity isolates responsiveness."
    consequence_if_violated: "Diversity metric measures something other than responsiveness → P2 correlation spurious"
  - id: "A4"
    assumption: "HH-RLHF conversations ≥5 turns have sufficient statistical power for slope estimation"
    supporting_evidence: "Linear regression on 5 data points has weak power but Bayesian slope estimation can handle small samples. Sensitivity analysis required."
    consequence_if_violated: "Slope estimates unreliable → high variance in coupling metric → weak P3 results"
  - id: "A5"
    assumption: "Pearson correlation threshold (0.4) for diversity responsiveness is meaningful, not arbitrary"
    supporting_evidence: "Medium effect size (Cohen 1988). Will validate via sensitivity analysis (test 0.3-0.5 range)."
    consequence_if_violated: "Threshold choice determines P2 outcome → results not robust"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Conversational AI interactions with ≥5 turns in task-oriented or open-ended dialogue settings.
    Applicable to existing datasets: HH-RLHF, Anthropic conversation logs, OpenAI API logs (if accessible).
    Models: LLMs with conversational policies (GPT, Claude, Llama).
  does_not_apply_to: |
    Single-turn Q&A (no learning curve measurable).
    Non-conversational tasks (e.g., classification, translation — no multi-turn adaptation).
    Conversations <5 turns (insufficient data for slope estimation).
    Synthetic or simulated conversations (may not exhibit natural learning patterns).
  known_limitations: |
    - HH-RLHF median length ~3 turns → filter reduces dataset size
    - Coupling metric requires conversations with variance in both reformulation slope AND diversity correlation (low-variance conversations uninformative)
    - No causal intervention (observational study) → correlation, not causation

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Conversations with negative reformulation slope (user learning) have higher task success rates than flat/positive slope conversations, controlling for conversation length and engagement"
    test_method: "Logistic regression: success ~ reformulation_slope + turn_count, on successful conversations only (stratified by outcome to control engagement decay)"
    success_criterion: "Negative coefficient for reformulation_slope, p < 0.05, OR > 1.2 (12% increase in success odds per 0.1 decrease in slope)"
    falsification: "Coefficient NOT negative OR p ≥ 0.05 → reformulation slope does not measure learning"
  - id: "P2"
    primary: false
    statement: "AI response diversity correlates with user query diversity (Pearson r > 0.4) in well-aligned conversations"
    test_method: "Compute query diversity (distinct-1 over query vocabulary) and response diversity (distinct-1 over response vocabulary) per conversation. Pearson correlation on conversations rated helpfulness > median."
    success_criterion: "r > 0.4 AND p < 0.05"
    falsification: "r ≤ 0.4 OR p ≥ 0.05 → AI policy not responsive to query diversity"
  - id: "P3"
    primary: true
    statement: "Conversations where BOTH P1+P2 hold have higher helpfulness ratings than conversations where only one holds, demonstrating coupling matters beyond individual metrics"
    test_method: "Linear regression: helpfulness ~ coupling_strength + reformulation_slope + diversity_correlation + turn_count. Coupling_strength = Pearson(reformulation_slope, diversity_correlation). Test coupling coefficient significance."
    success_criterion: "Positive coefficient for coupling_strength, p < 0.05, controlling for individual metrics → coupling predicts beyond components"
    falsification: "Coupling coefficient NOT significant when controlling for individual metrics → alignment is additive, not multiplicative"

