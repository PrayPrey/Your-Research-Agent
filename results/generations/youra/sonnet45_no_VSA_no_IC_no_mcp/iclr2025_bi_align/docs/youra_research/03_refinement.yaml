experimental_setup:
  dataset:
    name: "HH-RLHF (Anthropic Helpful-Harmless RLHF Dataset)"
    type: "standard"
    source: "https://github.com/anthropics/hh-rlhf"
    path: "{research_folder}/data/hh-rlhf/"
    hypothesis_fit: "Contains 161k human-AI conversations with helpfulness ratings, multi-turn structure, and conversation metadata (outcome, length). Ideal for testing coupling hypothesis on existing data without new annotations."
  model:
    name: "Pre-trained LLMs in HH-RLHF logs (context models, not retrained)"
    type: "Conversational LLMs"
    source: "HH-RLHF dataset responses (frozen model outputs)"
    hypothesis_fit: "Testing hypothesis on static dataset responses — AI policy responsiveness is measurable without retraining or API access."
  baselines:
    - name: "Individual Metrics Only (Reformulation Slope + Diversity Correlation)"
      method: "Linear regression: helpfulness ~ reformulation_slope + diversity_correlation (no coupling term)"
    - name: "Conversation Length Only"
      method: "Linear regression: helpfulness ~ turn_count (tests if length alone explains variance)"
    - name: "Random Baseline"
      method: "Permute helpfulness ratings — if coupling correlation survives permutation test, not spurious"

