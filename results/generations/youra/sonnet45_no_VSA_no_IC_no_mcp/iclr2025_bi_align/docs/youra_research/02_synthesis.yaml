  gap_id: "Gap_1"

hypothesis_draft:
  title: "Bidirectional Alignment via Behavioral Coupling"
  hypothesis_id: "H-BiAlign-v1"
  core_claim: |
    Under conversational AI interactions with ≥5 turns, if we measure the coupling strength
    (Pearson correlation) between user learning rate (reformulation slope) and AI policy
    responsiveness (response diversity tracking query diversity), then conversations with
    higher coupling strength will have higher human helpfulness ratings, because bidirectional
    alignment emerges from co-adaptation where users learn AI capabilities AND AI policy
    exhibits responsiveness to user query patterns.
  mechanism: |
    Bidirectional alignment is the coupling (correlation) between two processes:
    (1) User adaptation: users learn AI response patterns → reformulate queries less over turns
    (2) AI responsiveness: AI policy responds to query diversity → diverse queries elicit diverse responses

    Strong coupling (high correlation between #1 and #2) indicates mutual predictability:
    users who learn faster interact with AI that is more responsive, creating aligned dynamics.
    Weak coupling indicates asymmetric alignment: one party adapts but the other does not.
  predictions:
    - P1: "Negative reformulation slope predicts task success (OR > 1.2, p < 0.05), controlling for length + engagement"
    - P2: "Response diversity correlates with query diversity (r > 0.4, p < 0.05) in high-helpfulness conversations"
    - P3: "Coupling strength predicts helpfulness beyond individual metrics (positive coefficient, p < 0.05)"

variables_summary:
  independent: "Coupling Strength (Pearson correlation between reformulation slope and diversity correlation)"
  dependent_primary: "Human Helpfulness Rating (HH-RLHF scale 0-1)"
  controlled: "Conversation length (≥5 turns filter + turn count covariate), user engagement (stratify by outcome), individual metrics (reformulation slope alone, diversity correlation alone)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in helpfulness ratings between high-coupling and
    low-coupling conversations when controlling for individual metrics (reformulation slope
    alone and diversity correlation alone).
  statistical_test: "Linear regression with coupling term, test coupling coefficient significance"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Bidirectional alignment as interaction-level coupling (correlation), not model-level property. Detects asymmetric alignment failures."
  differentiation_summary: |
    Existing work (RLHF, interpretability metrics) measures AI-to-human OR human-to-AI in isolation.
    This framework measures BOTH and tests COUPLING as distinct mechanism (multiplicative, not additive).
    Enables user-population-specific evaluation and deployment monitoring without new human studies.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["Pre-trained LLMs in HH-RLHF logs (frozen model outputs)"]
  datasets: ["HH-RLHF (161k conversations with helpfulness ratings)"]
  baselines: ["Individual Metrics Only", "Conversation Length Only", "Random Baseline (permutation test)"]

measurement_plan:
  data_collection:
    - source: "HH-RLHF dataset (github.com/anthropics/hh-rlhf)"
    - source: "Filter conversations to ≥5 turns for slope estimation reliability"
  procedure:
    - step: "Extract user queries and AI responses per conversation"
    - step: "Compute reformulation rate: SBERT similarity + edit distance between consecutive queries (high semantic + low syntactic = reformulation)"
    - step: "Compute reformulation slope: linear regression of reformulation rate over turn index"
    - step: "Compute query diversity: distinct-1 metric over query vocabulary per conversation"
    - step: "Compute response diversity: distinct-1 metric over response vocabulary per conversation"
    - step: "Compute diversity correlation: Pearson r between query diversity and response diversity per conversation"
    - step: "Compute coupling strength: Pearson r between reformulation slope and diversity correlation across conversations"
    - step: "Test P1: logistic regression success ~ reformulation_slope + turn_count (on successful conversations)"
    - step: "Test P2: Pearson r(query_diversity, response_diversity) on helpfulness > median conversations"
    - step: "Test P3: linear regression helpfulness ~ coupling_strength + reformulation_slope + diversity_correlation + turn_count"
  success_criteria:
    - "P1: Negative coefficient, p < 0.05, OR > 1.2"
    - "P2: r > 0.4, p < 0.05"
    - "P3: Positive coupling coefficient, p < 0.05, controlling for individual metrics"

validation:
  internal_validity:
    - "Control conversation length (≥5 turns filter + turn count covariate)"
    - "Control engagement decay (stratify by outcome, test P1 on successful conversations only)"
    - "Control topic continuity confound (dual reformulation detection: semantic + syntactic)"
    - "Sensitivity analysis (test P2 threshold range 0.3-0.5, P1 slope range -0.05 to -0.2)"
  external_validity:
    - "Test on multiple datasets (HH-RLHF primary, Anthropic logs secondary if accessible)"
    - "Test across conversation length bins (5-10 turns, 10-20 turns, 20+ turns)"
    - "Permutation test (shuffle helpfulness ratings, verify coupling correlation not spurious)"

discussion_synthesis:
  key_insights:
    - "Bidirectional alignment is coupling (correlation) between user learning + AI responsiveness, not sum of individual metrics"
    - "Coupling hypothesis distinguishes multiplicative (correlation matters) from additive (sum matters) models of alignment"
    - "Asymmetric alignment failures (responsive AI but users not learning, or vice versa) detectable via coupling metric"
  breakthrough_moments:
    - "Dr. Nova's shift from MI growth (temporal dynamics) to behavioral coupling (static data) unlocked feasibility"
    - "Prof. Pax's reframe from 'AI adaptation' to 'AI policy responsiveness' resolved frozen-model barrier"
    - "Dr. Sage's 'alignment as interaction property, not model property' insight elevated significance from methodological to conceptual"
  resolved_tensions:
    - "MI growth infeasible on static data → behavioral coupling (reformulation + diversity) feasible"
    - "Entropy assumptions unclear → operational metrics (paraphrase detection + distinct-n) precise"
    - "API dependency (h-m3 failure) → no external APIs needed, all computation on static datasets"
