main_hypothesis:
  id: H-BenchmarkCoveragePrediction-v1
  title: Benchmark Coverage Prediction from Design Features
  statement: Under the scope of widely-used DL benchmarks (published 2015-2024), if we extract design features from benchmark
    papers (task formulation, evaluation metrics, data modality, dataset characteristics) and cluster them into coverage families
    using unsupervised learning, then coverage families from pre-2023 benchmarks will predict 2023-2024 benchmark adoption
    patterns for novel hypothesis validation with >70% accuracy, because benchmark construction choices create systematic
    constraints on hypothesis testability that persist over time.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Benchmark Paper Corpus + Citation Data
    model: Feature Extraction Pipeline (SciBERT + SentenceBERT + k-means)
    optimizer: null
    hyperparameters:
      publication_year_cutoff: 2022/2023
      benchmark_selection: ≥50 citations
      citation_database: Semantic Scholar API
