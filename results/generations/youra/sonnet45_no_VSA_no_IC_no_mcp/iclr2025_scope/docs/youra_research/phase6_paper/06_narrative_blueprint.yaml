# WRITING GUIDELINES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

writing_guidelines:
  tone: "Clear, precise, evidence-driven. Avoid hype. Lead with quantitative results."

  evidence_presentation:
    - "Every claim backed by metric + figure reference"
    - "Limitations stated honestly (L1-L5) before discussion"
    - "Confidence levels explicit (HIGH/MEDIUM-HIGH/MEDIUM)"
    - "Planned-vs-actual table shows conservative target-setting"

  structure:
    - "Each section <2 pages (9-page total limit)"
    - "Introduction: hook → problem (3 levels) → contribution → roadmap"
    - "Results: primary findings → unexpected findings → planned-vs-actual"
    - "Discussion: mechanism → implications → limitations → future work"
    - "Conclusion: callback → contributions → strongest claims → closing"

  avoid:
    - "Overclaiming: 'we solve benchmark selection' → 'we demonstrate 78% prediction accuracy on pilot study'"
    - "Vague limitations: 'small sample' → 'pilot study (20 benchmarks) vs targeted corpus (100+), rare modalities underrepresented'"
    - "Missing scope boundaries: always specify 'Results hold for X; may not hold for Y'"

  quantitative_emphasis:
    - "Abstract: all 5 quantitative results stated"
    - "Introduction: 78% stat in opening paragraph"
    - "Results: every claim has metric (kappa/similarity/overlap/precision)"
    - "Discussion: numerical comparisons (585% above baseline, +24.7% threshold)"
