# Ground Truth Document - Phase 6 Paper Writing
# Generated: 2026-08-25
# Purpose: Extract verifiable claims from 06_paper.md for Phase 6.5 adversarial review
# This document serves as the "answer key" for reviewers to check paper claims

metadata:
  paper_file: "phase6_paper/06_paper.md"
  validation_sources:
    - "045_validated_hypothesis.md"
    - "h-e1/04_validation.md"
    - "h-m1/04_validation.md"
    - "h-m2/04_validation.md"
    - "h-m3/04_validation.md"
  extraction_date: "2026-08-25"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# QUANTITATIVE CLAIMS (verifiable metrics)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

quantitative_claims:

  - claim_id: "Q1"
    statement: "Coverage families predict citation co-occurrence with 78% accuracy"
    source: "h-m3/04_validation.md"
    evidence:
      metric_name: "Citation overlap (Jaccard similarity)"
      observed_value: 0.7807
      target_value: 0.70
      unit: "proportion (0-1 scale)"
      threshold_type: "≥"
      status: "PASS (+8.1 percentage points)"
    verification:
      file: "h-m3/04_validation.md"
      line_or_section: "Primary Metrics"
      exact_quote: "Citation Overlap (Proposed): 0.7807"

  - claim_id: "Q2"
    statement: "Random baseline achieves 19.61% citation overlap"
    source: "h-m3/04_validation.md"
    evidence:
      metric_name: "Citation overlap (random)"
      observed_value: 0.1961
      baseline_type: "random clustering (shuffled assignments)"
      status: "Baseline"
    verification:
      file: "h-m3/04_validation.md"
      line_or_section: "Baseline Comparison"
      exact_quote: "Citation Overlap (Random Baseline): 0.1961"

  - claim_id: "Q3"
    statement: "Coverage families outperform random by 585%"
    source: "h-m3/04_validation.md"
    evidence:
      calculation: "(0.7807 - 0.1961) / 0.1961 = 2.98 ≈ +298% OR 0.7807 / 0.1961 = 3.98 ≈ +398%"
      note: "Paper states '+585%' which may be absolute improvement (0.7807 vs 0.1961 baseline)"
      verification_needed: "Check exact calculation method in h-m3 results"
    verification:
      file: "h-m3/04_validation.md"
      line_or_section: "Key Findings"
      exact_quote: "Proposed > Baseline: YES ✓"
      discrepancy: "585% calculation method unclear; verify against raw data"

  - claim_id: "Q4"
    statement: "Intra-family similarity 0.748 (threshold 0.60)"
    source: "h-m2/04_validation.md"
    evidence:
      metric_name: "Intra-family similarity (mean pairwise cosine similarity)"
      observed_value: 0.748
      target_value: 0.60
      unit: "cosine similarity (0-1 scale)"
      threshold_type: "≥"
      status: "PASS (+24.7% = (0.748 - 0.60) / 0.60 = 0.247)"
    verification:
      file: "h-m2/04_validation.md"
      line_or_section: "Executive Summary, Gate Metrics"
      exact_quote: "Intra-family similarity: 0.748 (24.7% above threshold)"

  - claim_id: "Q5"
    statement: "Silhouette score 0.334 (threshold 0.30)"
    source: "h-m2/04_validation.md"
    evidence:
      metric_name: "Silhouette score"
      observed_value: 0.334
      target_value: 0.30
      unit: "silhouette score (-1 to +1 scale)"
      threshold_type: ">"
      status: "PASS (+11.3% = (0.334 - 0.30) / 0.30 = 0.113)"
    verification:
      file: "h-m2/04_validation.md"
      line_or_section: "Gate Metrics"
      exact_quote: "Silhouette score: 0.334 (threshold: 0.30)"

  - claim_id: "Q6"
    statement: "Cohen's kappa ≥0.917 for feature extraction"
    source: "h-m1/04_validation.md"
    evidence:
      metric_name: "Cohen's kappa (inter-rater agreement)"
      observed_values:
        task_type_kappa: 0.917
        modality_kappa: 1.000
        metrics_kappa: 1.000
        dataset_size_icc: 1.000
      target_value: 0.80
      unit: "kappa (-1 to +1 scale)"
      threshold_type: ">"
      status: "PASS (all features exceed 0.80)"
    verification:
      file: "h-m1/04_validation.md"
      line_or_section: "Results, Inter-Rater Agreement Scores"
      exact_quote: "task_type_kappa: 0.917, modality_kappa: 1.000, metrics_kappa: 1.000, dataset_size_icc: 1.000"

  - claim_id: "Q7"
    statement: "Citation classification precision 100% (synthetic data)"
    source: "h-e1/04_validation.md"
    evidence:
      metric_name: "Precision (binary classification)"
      observed_value: 1.000
      target_value: 0.85
      unit: "precision (0-1 scale)"
      threshold_type: ">"
      status: "PASS (+15 percentage points)"
      limitation: "Synthetic data only; real-world precision expected 75-85%"
    verification:
      file: "h-e1/04_validation.md"
      line_or_section: "Gate Metrics"
      exact_quote: "Citation Classification Precision: 100.0% (threshold: >85%)"

  - claim_id: "Q8"
    statement: "Modularity score 0.5452 (threshold >0.40)"
    source: "h-m3/04_validation.md"
    evidence:
      metric_name: "Modularity (community detection quality)"
      observed_value: 0.5452
      target_value: 0.40
      unit: "modularity (0-1 scale)"
      threshold_type: ">"
      status: "PASS"
    verification:
      file: "h-m3/04_validation.md"
      line_or_section: "Primary Metrics"
      exact_quote: "Modularity: 0.5452"

  - claim_id: "Q9"
    statement: "4 coverage families identified"
    source: "h-m2/04_validation.md, h-m3/04_validation.md"
    evidence:
      metric_name: "Number of clusters (k-means)"
      observed_value: 4
      cluster_sizes: [5, 8, 3, 4]
      cluster_composition:
        - cluster_0: "Text (translation + LM), n=5"
        - cluster_1: "Image (all tasks), n=8"
        - cluster_2: "Text (QA), n=3"
        - cluster_3: "Audio + Multimodal, n=4"
    verification:
      file: "h-m2/04_validation.md"
      line_or_section: "Cluster Distribution"
      exact_quote: "Cluster distribution: 4 non-singleton clusters (sizes: 5, 8, 3, 4)"

  - claim_id: "Q10"
    statement: "20 benchmarks in pilot study"
    source: "h-m1/04_validation.md, h-m2/04_validation.md"
    evidence:
      metric_name: "Sample size"
      observed_value: 20
      stratification:
        vision: 8
        language: 7
        audio: 3
        multimodal: 2
    verification:
      file: "h-m1/04_validation.md"
      line_or_section: "Study Parameters"
      exact_quote: "Sample Size: 20 benchmarks"

  - claim_id: "Q11"
    statement: "Image benchmarks (Cluster 1) achieve 0.82 similarity"
    source: "h-m2/04_validation.md"
    evidence:
      metric_name: "Intra-cluster similarity (Cluster 1)"
      observed_value: 0.82
      note: "Highest cohesion among all clusters"
    verification:
      file: "h-m2/04_validation.md"
      line_or_section: "Analysis, Per-cluster cosine similarity"
      exact_quote: "Cluster 1: ~0.82 (image classification + segmentation + detection)"

  - claim_id: "Q12"
    statement: "Zero false positives or false negatives (H-E1)"
    source: "h-e1/04_validation.md"
    evidence:
      metric_name: "Confusion matrix"
      true_positives: 52
      true_negatives: 48
      false_positives: 0
      false_negatives: 0
    verification:
      file: "h-e1/04_validation.md"
      line_or_section: "Confusion Matrix"
      exact_quote: "Predicted Other 48 0, Validation 0 52"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# QUALITATIVE CLAIMS (interpretations, mechanisms)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

qualitative_claims:

  - claim_id: "QL1"
    statement: "Modality emerges as primary clustering dimension over task type"
    source: "045_validated_hypothesis.md Section 4.2, h-m2/04_validation.md"
    evidence_type: "unexpected finding"
    support:
      - observation: "h-m2 clustering separated by modality (image/text/audio), not task complexity"
      - interpretation: "Modality determines applicable metrics (mAP for images, BLEU for text)"
      - quantitative_support: "Cluster 1 (all image benchmarks) achieves 0.82 similarity across different tasks (classification/detection/segmentation)"
    confidence: "MEDIUM-HIGH"
    limitation: "Ablation study (modality-only vs task-only features) is future work"
    verification:
      file: "045_validated_hypothesis.md"
      section: "4.2 Unexpected Findings, Finding 2"
      exact_quote: "Observation: h-m2 clustering separated by modality, not task complexity"

  - claim_id: "QL2"
    statement: "Temporal persistence holds for 1-2 year prediction horizons"
    source: "045_validated_hypothesis.md Section 3.4, h-m3/04_validation.md"
    evidence_type: "verified causal step"
    support:
      - mechanism: "Historical train/test split (pre-2023 → 2023-2024) achieves 78% accuracy"
      - falsifier_rejected: "≤50% accuracy would indicate no persistence; observed 78%"
    confidence: "HIGH"
    limitation: "Longer horizons (3-5 years) unverified; paradigm shifts may break patterns"
    verification:
      file: "h-m3/04_validation.md"
      section: "Hypothesis Statement"
      exact_quote: "Historical split: pre-2023 train → 2023-2024 test"

  - claim_id: "QL3"
    statement: "All four causal mechanism steps verified"
    source: "045_validated_hypothesis.md Section 3.3"
    evidence_type: "causal chain validation"
    support:
      step_1: "Construction creates constraints (h-m2: 0.748 similarity)"
      step_2: "Features cluster into families (h-m2: silhouette 0.334)"
      step_3: "Families predict suitability (h-m3: 78.07% overlap)"
      step_4: "Patterns persist temporally (h-m3: 585% above baseline)"
    confidence: "HIGH"
    verification:
      file: "045_validated_hypothesis.md"
      section: "3.3 Verified Causal Chain"
      exact_quote: "All Steps Confirmed"

  - claim_id: "QL4"
    statement: "Coverage family framework reduces selection from weeks to minutes"
    source: "045_validated_hypothesis.md Section 8.1, paper Introduction"
    evidence_type: "practical implication"
    support:
      - current_practice: "Manual benchmark review requires 2-4 weeks per research project"
      - proposed_method: "Automated matching via coverage families (<10 minutes)"
      - mechanism: "SentenceBERT embedding similarity + ranked output"
    confidence: "MEDIUM"
    limitation: "Deployment time estimate not empirically validated; based on system design"
    verification:
      file: "045_validated_hypothesis.md"
      section: "8.1 Recommended Narrative Hook"
      exact_quote: "Researchers spend 2-4 weeks manually reviewing benchmark papers to determine suitability"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LIMITATIONS (scope boundaries)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limitations:

  - limitation_id: "L1"
    statement: "Citation classification validated on synthetic data only"
    source: "h-e1/04_validation.md, 045_validated_hypothesis.md Section 6.1"
    impact: "Real-world precision may drop to 75-85%"
    scope_boundary:
      results_hold_for: "Synthetic citation contexts (template-generated)"
      results_may_not_hold_for: "Real ArXiv citations with complex/ambiguous phrasing"
    mitigation: "PoC demonstrates technical feasibility; real validation is standard next step"
    verification:
      file: "h-e1/04_validation.md"
      section: "Limitations (PoC Scope)"
      exact_quote: "Synthetic Data: Dataset uses template-generated contexts, not real ArXiv citations"

  - limitation_id: "L2"
    statement: "Pilot sample (20 benchmarks) vs targeted corpus (100+)"
    source: "045_validated_hypothesis.md Section 6.1"
    impact: "Coverage families may be incomplete; rare modalities underrepresented"
    scope_boundary:
      results_hold_for: "Major modalities (image/text/audio/multimodal) with ≥50 citations"
      results_may_not_hold_for: "Rare modalities (video/3D/tabular), emerging benchmarks (<50 citations)"
    mitigation: "Stratified coverage across major modalities; scaled validation natural extension"
    verification:
      file: "045_validated_hypothesis.md"
      section: "6.1 Principled Limitations, Limitation 2"
      exact_quote: "Small Sample Size (20 Benchmarks): Pilot sample vs 100+ targeted corpus"

  - limitation_id: "L3"
    statement: "Simulated annotators (algorithmic extraction)"
    source: "h-m1/04_validation.md, 045_validated_hypothesis.md Section 6.1"
    impact: "Human kappa may decrease to 0.70-0.85"
    scope_boundary:
      results_hold_for: "Algorithmic extraction with objective protocols (kappa ≥0.917)"
      results_may_not_hold_for: "Human annotators interpreting ambiguous edge cases"
    mitigation: "Objective decision rules minimize subjective judgment"
    verification:
      file: "h-m1/04_validation.md"
      section: "Threats to Validity, Limitation 1"
      exact_quote: "Simulated Annotators: Both annotators used the same extraction algorithm"

  - limitation_id: "L4"
    statement: "Temporal window (1-2 years) not long-term (3-5 years)"
    source: "045_validated_hypothesis.md Section 6.1"
    impact: "Longer prediction horizons unverified"
    scope_boundary:
      results_hold_for: "1-2 year prediction horizon (covers typical publication cycle)"
      results_may_not_hold_for: "3-5 year long-term prediction, cross-paradigm shifts"
    mitigation: "1-2 years covers typical publication cycle"
    verification:
      file: "045_validated_hypothesis.md"
      section: "6.1 Principled Limitations, Limitation 4"
      exact_quote: "1-2 Year Temporal Window: Pre-2023 → 2023-2024 tested, not 3-5 year gaps"

  - limitation_id: "L5"
    statement: "Unverified ≥50 citation threshold assumption"
    source: "045_validated_hypothesis.md Section 6.1"
    impact: "Applicability to emerging benchmarks (<50 citations) unknown"
    scope_boundary:
      results_hold_for: "Well-established benchmarks (≥50 citations)"
      results_may_not_hold_for: "Emerging benchmarks (<50 citations)"
    mitigation: "Well-established benchmarks represent majority usage"
    verification:
      file: "045_validated_hypothesis.md"
      section: "6.1 Principled Limitations, Limitation 5"
      exact_quote: "Unverified ≥50 Citation Threshold: Threshold assumed, not empirically validated"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EXPERIMENTAL DETAILS (reproducibility)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

experimental_details:

  h_e1_citation_classification:
    dataset:
      type: "Synthetic citation contexts"
      total_samples: 500
      train_test_split: "80/20 (400 train, 100 test)"
      class_balance: "50% validation, 50% other"
      random_seed: 42
    model:
      architecture: "SciBERT (allenai/scibert_scivocab_uncased)"
      parameters: "110M (BERT-base)"
      optimizer: "AdamW"
      learning_rate: "2e-5"
      batch_size: 16
      epochs: 5
      training_time: "559.5 seconds (~9.3 minutes)"
    verification:
      file: "h-e1/04_validation.md"
      section: "Experiment Configuration"

  h_m1_feature_extraction:
    sample:
      size: 20
      stratification:
        vision: 8
        language: 7
        audio: 3
        multimodal: 2
      random_seed: 42
    protocol:
      task_type: "PWC taxonomy (8 categories)"
      metrics: "Regex patterns (9 common metrics)"
      modality: "Decision tree (image > text > audio > multimodal)"
      dataset_size: "Metadata extraction"
    annotators:
      count: 2
      type: "Simulated (algorithmic extraction)"
    verification:
      file: "h-m1/04_validation.md"
      section: "Study Parameters, Implementation Details"

  h_m2_clustering:
    input:
      benchmarks: 20
      feature_source: "h-m1 extracted features"
    embedding:
      model: "SentenceBERT (all-MiniLM-L6-v2)"
      dimensions: 384
      normalization: "L2 normalization"
    clustering:
      algorithm: "K-means"
      k: 4
      random_state: 42
      max_iter: 300
      n_init: 10
    distance_metric: "Cosine similarity"
    verification:
      file: "h-m2/04_validation.md"
      section: "Experimental Setup, Model"

  h_m3_historical_prediction:
    graph:
      type: "Bipartite (benchmarks ↔ methods)"
      benchmarks: 20
      methods: 100  # simulated
    community_detection:
      algorithm: "Louvain modularity optimization"
    temporal_split:
      train: "Pre-2023 benchmark features"
      test: "2023-2024 citation patterns"
    evaluation_metric:
      name: "Citation overlap (Jaccard similarity)"
      formula: "|citations(b1) ∩ citations(b2)| / |citations(b1) ∪ citations(b2)|"
    baseline:
      method: "Random clustering (shuffled assignments)"
    verification:
      file: "h-m3/04_validation.md"
      section: "Experimental Setup, Validation Protocol"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FUTURE WORK (unverified extensions)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

future_work:

  - extension_id: "FW1"
    title: "Real-world citation validation"
    priority: "HIGH"
    proposed: "Annotate 1000+ ArXiv citations, test SciBERT on held-out real data"
    expected: "Precision 75-85%, confirming synthetic overestimation"
    source: "045_validated_hypothesis.md Section 7.1"

  - extension_id: "FW2"
    title: "Task-based clustering ablation"
    priority: "MEDIUM"
    proposed: "Test modality-only vs task-only feature embeddings"
    expected: "Modality-only achieves >80% of full-feature similarity"
    source: "045_validated_hypothesis.md Section 7.1"

  - extension_id: "FW3"
    title: "Rare modality coverage"
    priority: "MEDIUM"
    proposed: "Extend to 100+ benchmarks, add video/3D/tabular"
    expected: "6-8 coverage families (current 4 + video/3D/tabular)"
    source: "045_validated_hypothesis.md Section 7.3"

  - extension_id: "FW4"
    title: "Cross-temporal robustness"
    priority: "MEDIUM"
    proposed: "Test pre-2020 → 2024 (4-year gap)"
    expected: "Overlap ≥60% if persistence holds, <50% if paradigm shifts break prediction"
    source: "045_validated_hypothesis.md Section 7.2"

  - extension_id: "FW5"
    title: "Fine-grained task subclusters"
    priority: "LOW"
    proposed: "Increase k from 4 to 8-12"
    expected: "Task-based subclusters within modality families"
    source: "045_validated_hypothesis.md Section 7.3"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# ADVERSARIAL REVIEW INSTRUCTIONS (Phase 6.5)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

adversarial_review_guidance:

  check_quantitative_claims:
    - "Cross-reference each Q1-Q12 metric against source validation files"
    - "Verify exact numbers match (no rounding errors or transcription mistakes)"
    - "Check threshold logic: ≥, >, <, ≤ used correctly"
    - "Validate improvement calculations (e.g., +585% claim in Q3)"

  check_qualitative_claims:
    - "Verify QL1-QL4 interpretations are supported by quantitative evidence"
    - "Check confidence levels (HIGH/MEDIUM-HIGH/MEDIUM) match evidence strength"
    - "Ensure 'unexpected finding' claims (QL1) are genuinely surprising given Phase 2A hypothesis"

  check_limitations:
    - "Verify all L1-L5 limitations are stated honestly in paper"
    - "Check scope boundaries ('Results hold for X; may not hold for Y') are explicit"
    - "Ensure limitations are not buried—should appear in Abstract, Discussion, Conclusion"

  check_overclaims:
    - "Flag any claim exceeding evidence (e.g., 'we solve benchmark selection' vs 'we demonstrate 78% accuracy on pilot')"
    - "Check generalization statements against scope boundaries"
    - "Verify temporal claims (1-2 years validated) not overstated as 'long-term'"

  check_coherence:
    - "Verify abstract quantitative results (5 metrics) match Section 5 results"
    - "Check Introduction hook (78% stat, 2-4 weeks) matches Conclusion callback"
    - "Ensure Related Work differentiation table aligns with Contributions claims"

  check_figures:
    - "Verify all figure references (Fig 2-9) correspond to actual files in h-{e1,m1,m2,m3}/figures/"
    - "Check figure captions match results reported in text"
    - "Ensure required figures (gate_metrics.png for all hypotheses) exist"

  check_citations:
    - "Verify all [^N] footnote references exist in 06_references.bib"
    - "Check benchmark citations (ImageNet, COCO, SQuAD, etc.) have correct years and venues"
    - "Ensure method citations (SciBERT, Louvain, SentenceBERT) are accurate"
