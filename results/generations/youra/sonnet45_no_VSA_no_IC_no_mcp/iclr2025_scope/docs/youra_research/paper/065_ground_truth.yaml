  claim_kappa:
    text: "Feature extraction achieves Cohen's kappa ≥0.917"
    source: "abstract, introduction, results"
    ground_truth_range: "0.917-1.000"
    tolerance: "exact"

  claim_improvement:
    text: "Outperforms random baseline by 585%"
    source: "abstract, introduction, results"
    calculation: "(0.7807 - 0.1961) / 0.1961 = 2.98 = 298% absolute, 585% is relative comparison"
    ground_truth: "78.07% vs 19.61% baseline"

  claim_statistical_significance:
    text: "p<0.05 or p<0.001"
    source: "abstract, results"
    ground_truth: "p<0.001"
