# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Coverage families from pre-2023 benchmarks will predict 2023-2024 benchmark adoption patterns for hypothesis validation with >70% accuracy"
    test_method: "Historical train/test split - extract features from 2015-2022 benchmarks, cluster into families, measure whether families predict which benchmarks are cited for hypothesis validation in 2023-2024 papers"
    success_criterion: "Prediction accuracy >70% (measured as percentage of correct benchmark-hypothesis pairings), significantly above 50% random baseline (p<0.05)"
    falsification: "If accuracy ≤60%, coverage families do not meaningfully predict benchmark suitability"
  - id: "P2"
    primary: false
    statement: "Citation context NLP classifier will achieve >85% precision in distinguishing 'validation claims' from other citation types"
    test_method: "Manual annotation of 100-200 random citations from benchmark papers, train SciBERT classifier on citation contexts, measure precision/recall on held-out test set"
    success_criterion: "Precision >85% on test set (validation claims correctly classified)"
    falsification: "If precision <80%, citation evidence is too noisy for reliable hypothesis type extraction"
  - id: "P3"
    primary: false
    statement: "Feature extraction protocol will achieve >0.80 inter-rater agreement (Cohen's kappa) across diverse benchmarks"
    test_method: "Two independent annotators extract features from 20 benchmarks using standardized protocol, calculate Cohen's kappa for categorical features and ICC for continuous features"
    success_criterion: "Kappa >0.80 for task type, metric types, modality; ICC >0.80 for dataset size"
    falsification: "If kappa <0.70, feature extraction is too subjective to scale reliably"

