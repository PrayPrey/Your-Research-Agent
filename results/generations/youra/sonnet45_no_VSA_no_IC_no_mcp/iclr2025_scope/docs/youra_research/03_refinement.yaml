    Focus verification on: citation classification precision, feature extraction agreement, historical prediction accuracy

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkCoveragePrediction-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under the scope of widely-used DL benchmarks (published 2015-2024), if we extract design features from benchmark papers (task formulation, evaluation metrics, data modality, dataset characteristics) and cluster them into coverage families using unsupervised learning, then coverage families from pre-2023 benchmarks will predict 2023-2024 benchmark adoption patterns for novel hypothesis validation with >70% accuracy, because benchmark construction choices create systematic constraints on hypothesis testability that persist over time.
  alternative_hypothesis_h0: |
    There is no significant relationship between benchmark design features (extracted from papers) and future benchmark suitability for hypothesis validation. Coverage families from pre-2023 data will predict 2023-2024 adoption patterns with ≤50% accuracy (random baseline).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "benchmark_design_features"
      type: "categorical"
      operationalization: "Extracted from benchmark papers: task type (Papers with Code taxonomy), evaluation metric types (accuracy/F1/BLEU/etc), data modality (vision/language/multimodal/audio/tabular), dataset size (number of examples)"
      levels:
        - "task_type"
        - "metric_types"
        - "data_modality"
        - "dataset_characteristics"
    - name: "coverage_family_assignment"
      type: "categorical"
      operationalization: "Cluster label from unsupervised learning (k-means on feature embeddings), assigned to each benchmark"
      levels: []  # Determined by clustering (k value TBD)
  dependent:
    - name: "prediction_accuracy"
      type: "continuous"
      operationalization: "Percentage of correct predictions: whether 2023-2024 hypothesis types match predicted coverage families from 2022 features (range 0-100%, target >70%)"
      primary: true
    - name: "citation_classification_precision"
      type: "continuous"
      operationalization: "Precision of NLP classifier distinguishing 'validation claims' from other citation types (range 0-1, target >0.85)"
      primary: false
    - name: "feature_extraction_agreement"
      type: "continuous"
      operationalization: "Inter-rater reliability (Cohen's kappa) for manual feature extraction protocol (range -1 to 1, target >0.80)"
      primary: false
  controlled:
    - name: "publication_year_cutoff"
      operationalization: "Train/test split at 2022/2023 boundary to ensure historical validation"
    - name: "benchmark_selection"
      operationalization: "Include only benchmarks with ≥50 citations to ensure sufficient usage data"
    - name: "citation_database"
      operationalization: "Use Semantic Scholar API for consistent citation data across benchmarks"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Benchmark construction choices (task formulation, metrics, modality) create explicit constraints on what can be measured"
      evidence: "Prof. Pax argument - image classification benchmark cannot validate sequence generation hypothesis because metrics don't measure sequential coherence"
      falsifier: "If benchmarks with different task types validate identical hypothesis categories (>50% overlap), constraints are not task-dependent"
    - step: 2
      description: "Design features cluster into coverage families through unsupervised learning on feature embeddings"
      evidence: "Dr. Nova proposal - benchmarks with similar design signatures should group together"
      falsifier: "If clustering produces families with <60% intra-family similarity, design features don't meaningfully group benchmarks"
    - step: 3
      description: "Coverage families predict hypothesis suitability by matching hypothesis requirements to family constraints"
      evidence: "Dr. Ally synthesis - benchmarks in same family should validate similar hypothesis types"
      falsifier: "If benchmarks in same family validate completely different hypothesis types (<50% overlap), families don't predict suitability"
    - step: 4
      description: "Historical patterns persist over time, enabling future prediction from past design features"
      evidence: "Dr. Nova historical validation - 2022 features predict 2023-2024 adoption patterns"
      falsifier: "If historical prediction accuracy ≤50% (random baseline), design constraints don't persist or don't predict adoption"
  key_tension: "Prof. Rex circular reasoning concern - are we discovering coverage patterns or just describing existing usage? Historical train/test split addresses this by requiring pure prediction."
  evidence_summary: |
    Mechanism combines theoretical constraints (task/metric/modality define measurability) with empirical validation (historical prediction accuracy). If design features truly create persistent constraints, pre-2023 clustering should predict post-2023 adoption.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Citation context analysis can reliably distinguish 'validation claims' from 'baseline mentions' using NLP"
    supporting_evidence: "Dr. Ally proposal - use SciBERT + dependency parsing to classify citation contexts"
    consequence_if_violated: "If precision <85%, validation evidence is contaminated with non-validation mentions, breaking retrospective analysis"
  - id: "A2"
    assumption: "Feature extraction from papers can be standardized with objective protocols achieving >0.80 inter-rater agreement"
    supporting_evidence: "Prof. Pax feasibility check - use Papers with Code taxonomy + regex patterns for metrics"
    consequence_if_violated: "If kappa <0.80, feature extraction is too subjective to scale to 100 benchmarks"
  - id: "A3"
    assumption: "Design constraints persist over time (2022 features predict 2023-2024 patterns)"
    supporting_evidence: "Dr. Nova mechanism - benchmark construction principles remain stable across years"
    consequence_if_violated: "If prediction accuracy ≤50%, design features don't persist or research trends shift too rapidly"
  - id: "A4"
    assumption: "Coverage families capture meaningful groupings (≥60% intra-family similarity)"
    supporting_evidence: "Clustering assumption - similar design features create similar constraints"
    consequence_if_violated: "If families show <60% similarity, clustering doesn't capture real coverage patterns"
  - id: "A5"
    assumption: "Existing benchmarks have sufficient citation data (≥50 citations) for reliable pattern analysis"
    supporting_evidence: "Controlled variable - only include well-used benchmarks"
    consequence_if_violated: "If benchmarks have <50 citations, insufficient data for hypothesis type extraction"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Widely-used DL benchmarks published 2015-2024 with ≥50 citations. Applicable to benchmarks with published papers describing design choices (task, metrics, data). Covers vision, language, multimodal, audio, and tabular domains where Papers with Code taxonomy provides standardized task categories.
  does_not_apply_to: |
    Benchmarks without published papers (informal datasets shared via GitHub only). Newly-created benchmarks (<50 citations). Private/proprietary benchmarks. Benchmarks from pre-2015 (before modern DL era). Benchmarks outside Papers with Code taxonomy coverage.
  known_limitations: |
    Historical validation limited to 2-3 year window (2022→2023-2024). Citation analysis depends on Semantic Scholar API coverage. Feature extraction requires manual ground truth validation (20 benchmarks). Coverage families may not generalize to future paradigm shifts (e.g., if transformers → entirely new architecture class).

