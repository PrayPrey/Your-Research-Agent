hypothesis_draft:
  title: "Benchmark Coverage Prediction from Design Features"
  hypothesis_id: "H-BenchmarkCoveragePrediction-v1"
  core_claim: |
    Benchmark design features (task formulation, evaluation metrics, data modality, dataset characteristics) extracted from published papers predict future benchmark suitability for novel hypothesis validation with >70% accuracy, validated through historical train/test split where pre-2023 features predict 2023-2024 adoption patterns.
  mechanism: |
    Benchmark construction choices create systematic constraints on hypothesis testability. Task formulation defines measurable space (classification ≠ generation ≠ retrieval). Metrics define success criteria (accuracy vs BLEU vs recall@k). Modality defines applicable domains (vision vs language vs multimodal). These constraints persist over time, enabling prediction from historical design features.
  predictions:
    - P1: "Coverage families predict 2023-2024 adoption with >70% accuracy (historical validation)"
    - P2: "Citation NLP classifier achieves >85% precision on validation claims"
    - P3: "Feature extraction protocol achieves >0.80 inter-rater agreement"

variables_summary:
  independent: "benchmark_design_features (task type, metric types, data modality, dataset characteristics) + coverage_family_assignment (cluster labels from unsupervised learning)"
  dependent_primary: "prediction_accuracy (percentage correct predictions, target >70%)"
  controlled: "publication_year_cutoff (2022/2023 train/test split), benchmark_selection (≥50 citations), citation_database (Semantic Scholar API)"

null_hypothesis:
  h0_statement: |
    There is no significant relationship between benchmark design features and future benchmark suitability. Coverage families from pre-2023 data predict 2023-2024 adoption with ≤50% accuracy (random baseline).
  statistical_test: "Chi-square test for categorical prediction accuracy, comparing observed vs expected (50% random baseline)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First predictive tool for benchmark suitability (not descriptive taxonomy). Historical validation breaks circular reasoning. Citation context classification separates validation from baseline mentions. Coverage gap discovery reveals hypothesis types with zero existing support."
  differentiation_summary: |
    Prior work: Benchmark taxonomies organize descriptively (Papers with Code), citation studies measure popularity, recommendation systems use user behavior.
    Our contribution: Predict future suitability from inherent design features, enable hypothesis feasibility pre-checks, discover coverage gaps.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "SciBERT (citation context classification)"
    - "SentenceBERT (feature embeddings)"
    - "k-means clustering (coverage families)"
  datasets:
    - "ArXiv benchmark papers (2015-2024)"
    - "Semantic Scholar citation data"
    - "Papers with Code taxonomy"
  baselines:
    - "Random baseline (50% accuracy)"
    - "Name-based matching (keyword overlap)"
    - "Citation count ranking (popularity only)"

measurement_plan:
  data_collection:
    - source: "ArXiv API - benchmark papers (identify via 'dataset' keyword + Papers with Code registry)"
    - source: "Semantic Scholar API - citation contexts for each benchmark"
    - source: "Papers with Code API - standardized task taxonomy"
  procedure:
    - step: "Extract design features from 2015-2022 papers using objective protocol (task type from PWC taxonomy, metrics via regex, modality from categories, size from tables)"
    - step: "Cluster features into coverage families using k-means on SentenceBERT embeddings"
    - step: "Classify 2023-2024 citation contexts using SciBERT (validation claims vs other mentions)"
    - step: "Measure prediction accuracy: do 2022 families predict 2023-2024 validation citations?"
    - step: "Validate classifier precision (100-200 manual annotations) and feature extraction agreement (20 benchmarks, 2 annotators, Cohen's kappa)"
  success_criteria:
    - "Prediction accuracy >70% (P1 primary)"
    - "Citation classifier precision >85% (P2)"
    - "Feature extraction kappa >0.80 (P3)"
    - "All thresholds must be met for hypothesis validation"

validation:
  internal_validity:
    - "Historical train/test split eliminates circular reasoning (pure prediction, not description)"
    - "Citation context classification reduces noise (validation claims only, not all mentions)"
    - "Inter-rater agreement ensures feature extraction objectivity (protocol refinement until kappa >0.80)"
    - "Multiple historical splits (2020/2021-2022, 2021/2022-2023) verify temporal stability"
  external_validity:
    - "Generalization to future years (2024-2025) can be tested prospectively"
    - "Cross-domain validity (vision/language/audio) tested by stratified analysis within coverage families"
    - "Benchmark popularity control (≥50 citations) ensures sufficient data but may limit generalization to new benchmarks"
    - "Papers with Code taxonomy coverage limits applicability to benchmarks outside taxonomy"

discussion_synthesis:
