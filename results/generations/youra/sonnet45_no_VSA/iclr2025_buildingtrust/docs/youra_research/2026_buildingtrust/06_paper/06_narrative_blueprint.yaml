# 06_narrative_blueprint.yaml - Phase 6 Narrative Design
# Generated: 2026-07-09
# Paper Type: Null Result with Methodological Contributions

metadata:
  paper_type: "negative_result_methodological"
  hypothesis_status: "REFUTED"
  gate_failure: "MUST_WORK (h-e1)"
  routing_decision: "Phase 0 (Fundamental Redesign Required)"
  target_venue: ["EMNLP Findings", "NeurIPS Datasets & Benchmarks", "TMLR"]
  word_count_target: 6000

# ═══════════════════════════════════════════════════════════════
# NARRATIVE STRUCTURE
# ═══════════════════════════════════════════════════════════════

hook_strategy:
  opening_move: "Gap-driven problem statement"
  hook_type: "Practical need for prospective benchmark verification"
  hook_content: |
    LLM benchmark fragmentation creates research risk: 7,635 benchmarks across 4,886 papers
    with <25% overlap (mmjerge TMLR 2025), yet no prospective quality signals exist to guide
    benchmark selection before experimental validation. Researchers waste resources on unreliable
    benchmarks, as evidenced by cross-benchmark ranking disagreement (Kulkarni et al., 37 models).

  transition_to_hypothesis: |
    We hypothesized coefficient of variation (CV = σ/μ across model scores) as a universal,
    zero-cost quality signal: computable from any leaderboard in ~5 minutes, predicting
    cross-benchmark ranking stability (Spearman ρ) without domain expertise.

problem_framing:
  level_1_surface: |
    Benchmark selection for hypothesis validation lacks data-driven guidance. Current practice
    relies on expert judgment and citation counts, which failed to prevent dataset compatibility
    issues (e.g., insufficient model diversity discovered only after Phase 3 commitment).

  level_2_structural: |
    Cross-benchmark ranking disagreement indicates measurement instability, but no meta-features
    predict which benchmarks will replicate findings across evaluation contexts. High-variance
    benchmarks may signal inconsistent model differentiation, but this relationship has never
    been empirically tested.

  level_3_fundamental: |
    The tension between benchmark specificity and generalizability: specialized benchmarks
    (e.g., trust evaluation) measure distinct constructs, producing low cross-benchmark
    correlation that conflates measurement instability with valid construct divergence.
    No framework distinguishes signal from noise in cross-benchmark disagreement.

key_insight:
  main_finding: |
    Coefficient of variation (CV) does not reliably predict cross-benchmark ranking stability
    in trust evaluation (Pearson r=-0.486, p=0.1542, n=10 benchmarks), failing pre-registered
    threshold (r < -0.5, p < 0.05). Simple variance metrics are insufficient for benchmark
    quality assessment.

  surprising_result: |
    Cross-benchmark correlation analysis revealed negative correlations (FaithfulQA-FinTrust
    ρ=-0.568) and near-zero patterns, suggesting trust benchmarks measure orthogonal
    sub-dimensions (honesty, harmlessness, fairness) rather than a unitary "trustworthiness"
    construct.

  theoretical_contribution: |
    Low cross-benchmark ρ is ambiguous: it may indicate measurement instability (noise) OR
    valid construct divergence (different dimensions). Meta-analyses of benchmark agreement
    must distinguish these interpretations via construct validity assessment (e.g., factor
    analysis).

  methodological_contribution: |
    Gate-driven validation framework with pre-registered success criteria (MUST_WORK: r < -0.5,
    p < 0.05) and power analysis (70-90% at n=10) enables rigorous negative result reporting.
    Meta-analysis approach requires no new model evaluations, enabling rapid falsification.

evidence_structure:
  primary_evidence:
    - type: "Statistical test"
      content: "Pearson r=-0.486 (95% CI: [-0.854, 0.207]), p=0.1542 across 10 trust benchmarks"
      strength: "Unambiguous null result - both gate criteria failed"

    - type: "Cross-benchmark patterns"
      content: "Negative correlations (FaithfulQA-FinTrust ρ=-0.568), near-zero correlations, heterogeneous pairwise ρ matrix"
      strength: "Unexpected finding - reveals construct non-overlap"

    - type: "Power analysis"
      content: "70-90% power to detect r=-0.5 at n=10, adequate sample for effect size"
      strength: "Rules out sample size as failure cause"

  supporting_evidence:
    - "TrustLLM framework (8 dimensions, 16 models) - real benchmark with verified characteristics"
    - "TruthfulQA (817 questions with error taxonomy) - error component analysis potential"
    - "HaluBench (14.9k samples) - large-scale hallucination detection dataset"
    - "Meta-evaluation studies (mmjerge 7,635 benchmarks, Kulkarni 37 models) - fragmentation context"

  limitations:
    critical:
      - type: "Mock data validity threat"
        impact: "Results based on synthetic benchmark corpus, not real leaderboards (TrustLLM HTML, TruthfulQA GitHub CSV, HaluBench PDF). Real-data replication CRITICAL before accepting null result."

      - type: "Construct validity ambiguity"
        impact: "Cross-benchmark ρ conflates measurement stability with construct divergence. Negative correlations may indicate orthogonal trust dimensions (valid), not instability (problematic)."

    moderate:
      - type: "Small benchmark sample"
        impact: "n=10 trust benchmarks limits generalizability beyond trust domain. Math/reasoning/vision-language benchmarks untested."

      - type: "Multi-dimensional CV operationalization"
        impact: "TrustLLM has 8 sub-dimensions - unclear if average CV, max CV, or single dimension was used. Not documented in validation report."

narrative_arc:
  act_1_setup:
    - "Benchmark fragmentation problem (mmjerge <25% overlap)"
    - "Cross-benchmark disagreement evidence (Kulkarni et al.)"
    - "Gap: No prospective verification tools for benchmark selection"
    - "Hypothesis: CV as universal quality signal (zero-cost, 5-minute computation)"

  act_2_test:
    - "Meta-analysis design: 10 trust benchmarks, CV vs. cross-benchmark ρ correlation"
    - "Pre-registered gate: r < -0.5, p < 0.05 (MUST_WORK threshold)"
    - "Power analysis: 70-90% at n=10 for r=-0.5 to -0.7 detection"
    - "Statistical test: Pearson correlation with 95% CI"

  act_3_result:
    - "Null finding: r=-0.486, p=0.1542 (both gate criteria failed)"
    - "Unexpected pattern: Negative cross-benchmark correlations (FaithfulQA-FinTrust ρ=-0.568)"
    - "Gate decision: MUST_WORK failure → Route to Phase 0"
    - "Interpretation: CV insufficient, construct divergence confounds stability measurement"

  act_4_implications:
    - "Theoretical: Construct non-overlap in trust benchmarks (honesty ≠ safety ≠ fairness)"
    - "Methodological: Gate-driven validation enables publishable negative evidence"
    - "Practical: Gap 1 (prospective verification) remains unsolved - multi-feature models needed"
    - "Future: Real-data replication, factor analysis, alternative meta-features (skewness, IQR, split-half reliability)"

section_dependencies:
  introduction_to_related_work:
    - "Introduction establishes Gap 1 (no prospective verification tools)"
    - "Related Work shows prior work documented fragmentation but didn't test predictors"

  methodology_to_experiments:
    - "Methodology specifies meta-analysis design (10 benchmarks, CV extraction, ρ computation)"
    - "Experiments report data collection (benchmark characteristics, CV range, ρ range)"

  experiments_to_results:
    - "Experiments describe statistical test setup (Pearson correlation, power analysis)"
    - "Results present null finding (r=-0.486, p=0.1542) and cross-benchmark patterns"

  results_to_discussion:
    - "Results document gate failure (MUST_WORK threshold not met)"
    - "Discussion interprets construct divergence alternative (negative correlations)"

  discussion_to_conclusion:
    - "Discussion identifies critical limitations (mock data, construct validity)"
    - "Conclusion frames future directions (real-data replication, factor analysis, multi-feature models)"

  introduction_to_abstract:
    - "Abstract written LAST, pulls quantitative results from Results section (r=-0.486, p=0.154)"
    - "Abstract mirrors Introduction hook (benchmark fragmentation → CV hypothesis → null result → implications)"

# ═══════════════════════════════════════════════════════════════
# WRITING GUIDELINES
# ═══════════════════════════════════════════════════════════════

tone:
  overall: "Rigorous, transparent, constructive (not dismissive of null result)"
  abstract: "Concise, quantitative (r=-0.486, p=0.154), positions as methodological contribution"
  introduction: "Problem-driven, gap-focused, hypothesis framing (CV as prospective signal)"
  related_work: "Comparative (what prior work documented vs. what we test)"
  methodology: "Pre-registration emphasis (gate criteria, power analysis, falsification)"
  results: "Factual, unadorned (null result is valid finding, not failure)"
  discussion: "Interpretive (construct divergence vs. measurement instability), limitation-aware"
  conclusion: "Forward-looking (future directions actionable, specific)"

avoid:
  - "❌ 'CV doesn't work' (dismissive) → ✅ 'CV shows weak, non-significant correlation (r=-0.486, p=0.154)'"
  - "❌ Burying null result in limitations"
  - "❌ Overstating theoretical implications of weak correlation"
  - "❌ Claiming causation (only correlation tested)"
  - "❌ Apologizing for null result (it's valuable negative evidence)"

emphasize:
  - "✅ Methodological rigor: power analysis, pre-registration, gate-driven validation"
  - "✅ Unexpected findings: negative cross-benchmark correlations reveal construct issues"
  - "✅ Practical impact: identifies limitations of simple variance metrics, motivates alternatives"
  - "✅ Transparency: mock data limitation stated upfront, real-data replication recommended"

# ═══════════════════════════════════════════════════════════════
# FIGURE STRATEGY
# ═══════════════════════════════════════════════════════════════

figures:
  figure_1:
    file: "h-e1/figures/cv_vs_rho_scatter.png"
    caption: |
      Scatter plot of benchmark coefficient of variation (CV) vs. mean cross-benchmark
      Spearman ρ with regression line (r=-0.486, p=0.154, n=10 trust benchmarks).
      Shaded region shows MUST_WORK threshold (r < -0.5). 95% confidence band indicates
      high uncertainty (CI includes positive correlations).
    placement: "Results section (after statistical test reporting)"

  figure_2:
    file: "h-e1/figures/pairwise_rho_heatmap.png"
    caption: |
      Heatmap of pairwise Spearman ρ between 10 trust benchmarks. Color scale: red (negative ρ),
      white (zero), blue (positive ρ). Negative correlations (FaithfulQA-FinTrust ρ=-0.568,
      TruthfulQA-SafetyBench ρ=-0.379) suggest orthogonal trust dimensions rather than
      measurement instability.
    placement: "Results section (after primary correlation result)"

  figure_3:
    file: "h-e1/figures/gate_metrics_comparison.png"
    caption: |
      Gate criteria comparison showing target vs. actual metrics. Both correlation strength
      (r=-0.486 vs. r < -0.5) and significance (p=0.1542 vs. p < 0.05) fail MUST_WORK threshold.
    placement: "Results section (gate decision visualization)"

  table_1:
    caption: "Benchmark summary statistics (CV, mean cross-benchmark ρ, n_models, n_pairs)"
    content: "10 rows from h-e1/04_validation.md Data Summary table"
    placement: "Experiments section"

  table_2:
    caption: "Gate criteria comparison (target vs. actual, met?)"
    content: "From 045_validated_hypothesis.md Prediction-Result Matrix"
    placement: "Results section"

