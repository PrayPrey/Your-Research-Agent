hypothesis_draft:
  title: "Benchmark Score Variance Predicts Cross-Benchmark Stability"
  hypothesis_id: "H-BenchmarkVarianceStability-v1"
  core_claim: |
    Benchmark coefficient of variation (CV = σ/μ) correlates negatively (r < -0.5) with mean cross-benchmark ranking agreement (Spearman ρ) across trust benchmarks,
    indicating that high score variance predicts low stability.
  mechanism: |
    High CV arises from heterogeneous task difficulty, unstable capability measurement, or small effective sample size. This produces noise-sensitive rankings
    that depend on which items dominate evaluation. Such rankings fail to replicate across benchmarks sampling different item distributions, yielding low ρ.
  predictions:
    - P1: "Pearson r(CV, mean_ρ) < -0.5, p < 0.05 across 5-10 trust benchmarks"
    - P2: "Top CV tertile shows d > 0.5 lower mean_ρ than bottom CV tertile"
    - P3: "FAVABENCH (h-e1 failure) exhibits CV > 75th percentile (retrospective validation)"

variables_summary:
  independent: "Benchmark Coefficient of Variation (CV = σ/μ of model scores)"
  dependent_primary: "Mean Cross-Benchmark Spearman ρ (average correlation with other benchmarks)"
  controlled: "n-models ≥ 10, benchmark age, model overlap ≥ 5 shared models"

null_hypothesis:
  h0_statement: |
    Benchmark coefficient of variation is uncorrelated with cross-benchmark stability (r ≥ -0.5 or p ≥ 0.05).
    Variance is cosmetic and does not predict ranking consistency.
  statistical_test: "Pearson correlation test (scipy.stats.pearsonr)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First predictive meta-feature for benchmark quality: CV computable from any leaderboard in 5 minutes, zero domain expertise required."
  differentiation_summary: |
    mmjerge/Kulkarni documented fragmentation but didn't predict reliability. We provide prospective risk scoring before Phase 3 commitment.
    h-e1 Run 3 post-hoc diagnosis vs. our prospective CV-based verification.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: []
  datasets: ["TrustLLM leaderboards", "HaluBench leaderboards", "TruthfulQA leaderboards", "FinTrust leaderboards", "MultiTrust leaderboards"]
  baselines: ["Random variance null model (shuffled scores)"]

measurement_plan:
  data_collection:
    - source: "Extract leaderboard tables from published papers (TrustLLM Table 4-5, HaluBench supplement, TruthfulQA GitHub, FinTrust paper, MultiTrust documented sources)"
  procedure:
    - step: "For each benchmark: Extract model names and scores from leaderboard"
    - step: "Compute CV = σ/μ where σ = std(scores), μ = mean(scores)"
    - step: "For each benchmark pair with ≥5 shared models: Compute Spearman ρ on shared model rankings"
    - step: "For each benchmark: Average pairwise ρ values to get mean_ρ"
    - step: "Run Pearson correlation test: r, p = pearsonr(CV_values, mean_ρ_values)"
  success_criteria:
    - "r < -0.5 (negative moderate-to-strong correlation)"
    - "p < 0.05 (statistical significance)"
    - "Statistical power ≥ 70% (achieved with n=5-10 at r=-0.5 to -0.7)"

validation:
  internal_validity:
    - "Control for confounds: benchmark age (years since publication), n-models (≥10 filter), model overlap (≥5 shared)"
    - "Use coefficient of variation (CV) for metric-scale normalization (handles AUROC vs. F1 vs. accuracy differences)"
    - "Require ≥5 shared models for ρ computation to ensure statistical reliability"
  external_validity:
    - "Trust benchmarks (TrustLLM, HaluBench, etc.) represent widely-cited state-of-the-art; generalizability to other domains requires replication"
    - "Temporal validation not included (all benchmarks 2020-2025); future work should test on post-2025 benchmarks"
    - "Retrospective validation (FAVABENCH h-e1 failure) provides real-world grounding but n=1 is anecdotal"

discussion_synthesis:
  key_insights:
    - "Reframed Gap 1 from 'build verification tool' to 'test if variance predicts reliability'—meta-science contribution"
    - "Power analysis revealed original group comparison (high vs. low CV) was underpowered (17-36%); switched to correlation test (70-90% power)"
    - "CV as universal meta-feature: no domain expertise, no benchmark-specific engineering, computable from any leaderboard"
  breakthrough_moments:
    - "Prof. Vera's power analysis (Exchange 7): Exposed 17% power at d=0.5, n=6. Led to correlation test redesign achieving 70-90% power."
    - "Prof. Pax's scoping (Exchange 4): Narrowed from 7,635 benchmarks (infeasible) to 5-10 trust benchmarks (LIGHT tier feasible)."
    - "Dr. Ally's mechanism synthesis (Exchange 5): Connected high variance → noise-sensitive rankings → cross-benchmark instability causal chain."
  resolved_tensions:
    - "Ambitious scope (mmjerge's 7,635 benchmarks) vs. LIGHT tier feasibility: Resolved by scoping to 5-10 trust benchmarks with public leaderboards."
    - "Statistical power vs. interpretability: Resolved by using correlation test (continuous variables) but reporting tertile comparison (d > 0.5) post-hoc for interpretability."
    - "Causation vs. correlation: Resolved by framing as EXISTENCE hypothesis (pattern detection), deferring mechanistic explanation to future H-M studies."
