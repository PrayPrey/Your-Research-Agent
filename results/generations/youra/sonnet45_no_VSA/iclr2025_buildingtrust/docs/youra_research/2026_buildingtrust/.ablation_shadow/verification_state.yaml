main_hypothesis:
  id: H-BenchmarkVarianceStability-v1
  title: Benchmark Score Variance Predicts Cross-Benchmark Stability
  statement: Under trust benchmark evaluation with multi-model leaderboards (TrustLLM, HaluBench, TruthfulQA, FinTrust, MultiTrust,
    n≥10 models each), if benchmark coefficient of variation (CV = σ/μ across model scores) is computed and compared with
    mean cross-benchmark ranking agreement (Spearman ρ), then CV correlates negatively with ρ (Pearson r < -0.5, p < 0.05),
    because high score variance indicates inconsistent model differentiation, reducing benchmark reliability as a stable ranking
    instrument.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Trust Benchmark Leaderboard Corpus (TrustLLM, HaluBench, TruthfulQA, FinTrust, MultiTrust)
