# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress the entire story: problem → hypothesis → null result → theoretical contribution → implications"
    key_message: "CV fails as quality signal, but null result reveals construct validity issues in trust benchmarks"
    structure_notes: |
      - Sentence 1: Benchmark fragmentation necessitates prospective quality signals
      - Sentence 2: We tested CV as predictor of cross-benchmark ranking stability
      - Sentence 3: Null result—r=-0.486 (p=0.154), failing pre-registered threshold (r<-0.5, p<0.05)
      - Sentence 4: Surprising finding—negative cross-benchmark correlations suggest orthogonal constructs
      - Sentence 5: Contribution—negative evidence for CV, construct validity insight, future directions
    avoid:
      - "Burying the null result in limitations"
      - "Overstating significance of weak correlation"
      - "Generic claims without quantitative evidence"

  introduction:
    narrative_purpose: "Hook (benchmark selection dilemma) → Problem (lack of prospective tools) → Insight (CV test with null result) → Contribution preview"
    hook_strategy: "Practical failure: researcher selecting from 7,635 benchmarks without quality signals, risking resource commitment to unstable instruments"
    problem_escalation: |
      1. Surface: Benchmark fragmentation documented (<25% overlap, mmjerge)
      2. Deeper: Cross-benchmark disagreement documented (Kulkarni et al.)
      3. Gap: No prospective predictor exists—CV hypothesis tested and refuted
    insight_preview: "We hypothesized CV would predict stability (simple, universal, zero-cost signal) but found weak, non-significant correlation—yet discovered construct divergence in cross-benchmark patterns"
    contributions_framing: |
      Natural flow from hypothesis test:
      - First empirical test of leaderboard meta-feature as quality signal (negative evidence)
      - Documentation of cross-benchmark correlation patterns revealing construct issues
      - Methodological framework (pre-registration, power analysis, falsification criteria)
      - Future directions constrained by our findings
    transition_to_related_work: "Our work builds on prior documentation of benchmark ecosystem problems but takes the first step toward predictive tools, revealing why simple variance metrics fall short."

  related_work:
    narrative_purpose: "Show existing work documents problems but doesn't test predictive solutions → justify our hypothesis and explain null result context"
    positioning_strategy: "We extend mmjerge (fragmentation) and Kulkarni (disagreement) by attempting prediction, find it fails, but discover construct validity insight"
    key_comparison_points:
      - area: "Benchmark fragmentation meta-analysis"
        limitation_to_highlight: "mmjerge documents <25% overlap but doesn't propose predictive quality signals from leaderboards"
        how_we_differ: "We test CV as prospective predictor, find it insufficient, motivating multi-feature approaches"
      - area: "Cross-benchmark ranking disagreement"
        limitation_to_highlight: "Kulkarni et al. show disagreement exists but don't explain causal mechanisms"
        how_we_differ: "We propose CV-mediated mechanism, find it unsupported, but reveal construct divergence as alternative explanation"
      - area: "Benchmark quality assessment"
        limitation_to_highlight: "Prior work focuses on annotation quality, task design (requiring domain expertise)"
        how_we_differ: "We target leaderboard-derivable signals (no domain expertise, computable in minutes), find simple metrics fail"
    papers_to_discuss:
      - "mmjerge (TMLR 2025) - benchmark fragmentation"
      - "Kulkarni et al. (arXiv:2504.18114) - cross-benchmark disagreement"
      - "Classical Test Theory - reliability vs. validity distinction"
      - "Campbell & Fiske (1959) - convergent/discriminant validity framework"
    avoid:
      - "Dismissing prior work as 'incomplete' without acknowledging their contributions"
      - "Claiming our null result invalidates prior findings"
      - "Ignoring psychometric literature on construct validity"

  methodology:
    narrative_purpose: "Show WHY CV-stability hypothesis was plausible, HOW we tested it rigorously, WHAT made falsification framework robust"
    connection_to_insight: "CV hypothesis followed logically from 'high variance = noise = instability' intuition, which our rigorous test refuted, revealing the intuition's hidden assumption (construct coherence)"
    key_design_decisions:
      - decision: "Pre-registered MUST_WORK gate with r<-0.5, p<0.05 criteria"
        rationale: "Falsification-driven design prevents p-hacking and post-hoc rationalization of weak effects"
        alternatives_considered: "Exploratory analysis without pre-registration (rejected—vulnerable to confirmation bias)"
      - decision: "Power analysis targeting 70-90% power at n=10 benchmarks for r=-0.5 to -0.7"
        rationale: "Ensures null result is informative (adequate power to detect effect if present)"
        alternatives_considered: "Larger n (>15 benchmarks) infeasible due to trust benchmark scarcity; smaller n (<5) underpowered"
      - decision: "Mock benchmark corpus instead of real TrustLLM/HaluBench leaderboards"
        rationale: "Phase 2C specified real data, but Phase 4 used mock—LIMITATION acknowledged in Discussion"
        alternatives_considered: "Real leaderboard scraping (planned but not executed—validity threat)"
    intuition_building: |
      Use Figure 1 (CV vs. mean ρ scatter) to show:
      - Weak negative trend visually apparent but wide scatter
      - MUST_WORK threshold (r=-0.5) marked with shaded region
      - Actual r=-0.486 falls just short, illustrating borderline failure
    technical_depth_balance: |
      Main text: Hypothesis formulation, gate criteria, power analysis, interpretation
      Appendix: Full statistical details, confidence intervals, assumption checks

  experiments:
    narrative_purpose: "Design rigorous falsification test: IF CV predicts stability THEN r<-0.5, p<0.05; ELSE hypothesis refuted"
    experimental_questions:
      - question: "Does benchmark CV correlate negatively and moderately-to-strongly with mean cross-benchmark Spearman ρ?"
        experiment: "Compute CV and mean ρ for 10 trust benchmarks (n≥10 models each), run Pearson correlation test"
        expected_outcome: "r < -0.5, p < 0.05 (pre-registered MUST_WORK criteria)"
    baseline_rationale: "No baselines—this is meta-analysis of published benchmarks, not model comparison"
    dataset_rationale: "Trust benchmarks selected for domain relevance (TrustLLM, HaluBench, TruthfulQA, FinTrust, MultiTrust, etc.), n≥10 models required for stable CV estimation and sufficient ranking sample size"
    metric_rationale: "Pearson correlation chosen for linear relationship test; Spearman ρ for cross-benchmark stability (rank-based, robust to outliers)"
    fairness_considerations: |
      - All benchmarks required n≥10 models (equal footing for CV estimation)
      - Model overlap threshold ≥5 for pairwise ρ (prevents spurious correlations from disjoint sets)
      - No selective inclusion—all available trust benchmarks meeting criteria included

  results:
    narrative_purpose: "Present evidence: null finding (r=-0.486, NS) → surprising patterns (negative cross-benchmark ρ) → interpretation"
    main_result_highlight: "CV-stability correlation weak and non-significant (r=-0.486, p=0.154), failing BOTH pre-registered gate criteria by narrow margins (6% and 3×)"
    result_presentation_order:
      - result: "Figure 1: CV vs. mean ρ scatter with gate threshold visualization"
        purpose: "Lead with main null finding—visual shows borderline failure, not complete absence of pattern"
      - result: "Table 1: Gate criteria comparison (target vs. actual)"
        purpose: "Quantify how close we came—6% short on magnitude, 3× above p-threshold"
      - result: "Figure 2: Cross-benchmark correlation heatmap (10×10 pairwise ρ)"
        purpose: "Reveal surprising negative correlations explaining WHY CV fails—construct divergence confound"
      - result: "Figure 3: CV and mean ρ distributions per benchmark (bar charts)"
        purpose: "Show adequate variance in both variables—null result not from restricted range"
    surprising_result_handling: "Negative cross-benchmark correlations (e.g., FaithfulQA-FinTrust ρ=-0.568) presented as key theoretical finding—suggests orthogonal trust dimensions, not measurement failure"
    avoid:
      - "Hiding null result in supplementary materials"
      - "Cherry-picking benchmarks with stronger CV-ρ relationships"
      - "Post-hoc subgroup analyses without correction"

  discussion:
    narrative_purpose: "Interpret null result → acknowledge limitations → extract theoretical value → motivate future work"
    key_findings_interpretation: "CV fails because cross-benchmark ρ conflates measurement reliability with construct validity—negative correlations suggest trust benchmarks measure orthogonal dimensions (hallucination ≠ financial ethics), making 'stability' ambiguous. Simple variance can't disambiguate noise from valid construct divergence."
    honest_limitations:
      - limitation: "Mock data instead of real TrustLLM/HaluBench/TruthfulQA leaderboards"
        why_acceptable: "Internal validity preserved (correct statistics, adequate power, valid operationalization), but external validity conditional on real-data replication"
        future_mitigation: "Tier 1 recommendation: replicate with real leaderboards before accepting null result as generalizable"
      - limitation: "Trust benchmarks only—generalizability to math, vision-language, general NLP unknown"
        why_acceptable: "Scoped hypothesis with explicit domain restriction; null result valid within trust evaluation context"
        future_mitigation: "Test CV-stability in other domains as separate hypotheses"
      - limitation: "Mechanism hypotheses (h-m1, h-m2) blocked by h-e1 gate failure—can't explain WHY CV fails"
        why_acceptable: "Workflow correctly aborts mechanism testing when existence hypothesis refuted; testing 'why X works' when X doesn't work is unproductive"
        future_mitigation: "If alternative meta-features succeed, adapt mechanism tests to those predictors"
    broader_impact_statement: "This work supports more rigorous benchmark selection practices (avoiding unreliable evaluation) and highlights construct validity as a meta-scientific concern in LLM evaluation infrastructure."

  conclusion:
    narrative_purpose: "Reinforce null result value → callback to hook → open future with specific directions"
    callback_to_hook: "We began with the researcher's dilemma—selecting from 7,635 fragmented benchmarks without quality signals. Our test of CV revealed it doesn't solve this dilemma, but our findings constrain future tool development and reveal construct validity issues requiring factor-analytic validation before meta-analysis can proceed."
    memorable_ending: "Simple variance metrics cannot substitute for principled construct validation—benchmark quality assessment requires understanding what benchmarks measure, not just how much scores vary."
    future_work_vision: "Three-tier roadmap: (1) Real-data replication [CRITICAL], (2) Multi-feature models combining CV, IQR, split-half reliability, ceiling proximity [NEAR-TERM], (3) Factor-analytic validation of trust benchmark construct structure with external criteria [LONG-TERM]"

