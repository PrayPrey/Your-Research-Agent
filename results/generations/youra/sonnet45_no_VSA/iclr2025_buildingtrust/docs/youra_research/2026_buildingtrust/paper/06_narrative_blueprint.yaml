# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "A researcher selecting a trust benchmark for their study faces a critical dilemma: with over 7,635 benchmarks across 4,886 LLM evaluation papers showing less than 25% overlap (mmjerge, TMLR 2025), how can they prospectively identify which benchmarks will provide reliable, stable rankings before committing months to experimental validation?"
    strategy: "practical_failure" # Concrete problem researchers face

  why_reader_should_care:
    main_reason: "Benchmark fragmentation in LLM evaluation creates risk: researchers invest resources in benchmarks that may produce unstable rankings, undermining reproducibility and wasting limited experimental budgets."
    concrete_example: "In our preliminary work, a benchmark dataset had only 2 available models versus 8 expected, forcing hypothesis redesign after Phase 3 planning was complete—a failure that could have been detected prospectively with the right quality signal."
    stakes: "Without prospective benchmark verification tools, the field continues post-hoc manual inspection after experimental commitment, perpetuating unreliable evaluation infrastructure."

  real_world_impact:
    application_domain: "LLM trustworthiness evaluation, benchmark quality assessment, meta-science in ML"
    potential_beneficiaries: "ML researchers selecting evaluation benchmarks, benchmark designers validating instrument quality, meta-scientists analyzing benchmark ecosystems"
    scale_of_impact: "Affects all LLM evaluation research—every paper choosing among thousands of fragmented benchmarks"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Benchmark fragmentation and cross-benchmark ranking disagreement are well-documented phenomena in LLM evaluation"
    common_understanding: "Prior work (mmjerge TMLR 2025, Kulkarni et al. arXiv:2504.18114) shows benchmarks don't overlap in model coverage and produce inconsistent rankings"

  deeper_problem:
    description: "No prospective quality signal exists to identify unreliable benchmarks before experimental validation—researchers rely on post-hoc manual inspection after resource commitment"
    why_overlooked: "Prior work documented the problem (fragmentation, disagreement) but didn't attempt to predict which benchmarks are reliable using leaderboard-derivable meta-features"
    our_perspective: "The critical question isn't just documenting disagreement, but predicting it: can we compute a zero-cost signal from published leaderboards that flags risky benchmarks prospectively?"

  gap_in_existing_work:
    description: "No empirical test of whether simple leaderboard statistics (coefficient of variation) can serve as universal benchmark quality predictors"
    why_gap_exists: "Meta-analysis of benchmark quality has focused on annotation quality and task design (requiring domain expertise), not leaderboard-derivable signals computable in minutes without domain knowledge"
    why_gap_matters: "Without prospective tools, benchmark selection remains ad-hoc and vulnerable to the failures we experienced (2-model dataset vs. 8-model expectation)"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT (NULL RESULT WITH THEORETICAL CONTRIBUTION)
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Coefficient of variation (CV), despite its intuitive appeal as a variance-based quality signal, shows weak, non-significant correlation with cross-benchmark ranking stability (r=-0.486, p=0.154), revealing that simple meta-features are insufficient for benchmark quality assessment."
    expanded_explanation: "Our empirical test across 10 trust benchmarks refuted the hypothesis that high score variance predicts unstable cross-benchmark rankings. However, the cross-benchmark correlation patterns themselves revealed a deeper issue: negative and near-zero correlations (e.g., FaithfulQA-FinTrust ρ=-0.568) suggest trust benchmarks may measure orthogonal constructs, not a unitary 'trustworthiness' dimension, confounding what 'stability' even means."

  why_others_missed_it:
    common_assumptions: "Researchers assumed (1) CV would naturally predict reliability because high variance suggests noise, and (2) trust benchmarks measure overlapping constructs that should correlate positively"
    our_different_view: "We explicitly tested the CV-stability correlation with pre-registered criteria and discovered the assumption was false—but also found the negative cross-benchmark correlations that reveal construct validity issues"
    enabling_factor: "Rigorous falsification framework (MUST_WORK gates, power analysis, pre-registration) forced us to confront the null result rather than p-hacking, and comprehensive correlation analysis revealed the construct divergence pattern"

  what_makes_it_work:
    intuitive_explanation: "For a variance metric to predict stability, benchmark score dispersion must reflect measurement noise rather than valid signal. Our finding suggests CV captures both noise AND construct-specific variance (e.g., different trust dimensions having different score distributions), making it unreliable as a universal quality signal."
    key_mechanism: "Cross-benchmark disagreement has multiple causes (measurement noise, construct divergence, task format differences), which CV cannot disambiguate. Low cross-benchmark ρ could indicate either unreliable measurement (our target) or valid construct orthogonality (confound)."
    analogy: "Testing whether 'price variance predicts product quality' without realizing the products measure different things (smartphones vs. laptops)—variance captures category differences, not quality."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY (NULL RESULT NARRATIVE)
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Coefficient of variation (CV) does not reliably predict cross-benchmark ranking stability in trust evaluation"
    measurable_criteria: "Pre-registered MUST_WORK criteria: Pearson r < -0.5 AND p < 0.05 across 5-10 trust benchmarks with n≥10 models each"

  supporting_evidence:
    - id: "evidence_1"
      what: "Primary correlation test: r=-0.486 (95% CI: [-0.854, 0.207]), p=0.1542, n=10 benchmarks"
      so_what: "Fails BOTH gate criteria—magnitude 6% short of threshold, p-value 3× above significance threshold"
      how_it_supports_claim: "Direct falsification of existence hypothesis (h-e1). Direction correct (negative) but insufficient magnitude and statistical power"

    - id: "evidence_2"
      what: "Cross-benchmark correlation matrix shows heterogeneous patterns: strongest negative ρ=-0.568 (FaithfulQA-FinTrust), strongest positive ρ=0.721 (TruthfulQA-FinTrust), many near-zero"
      so_what: "Reveals trust benchmarks don't measure a unitary construct—negative correlations suggest orthogonal dimensions (hallucination vs. financial ethics)"
      how_it_supports_claim: "Explains WHY CV fails: cross-benchmark ρ conflates measurement noise with construct validity divergence, making 'stability' ambiguous"

    - id: "evidence_3"
      what: "CV range [0.130, 0.458] and mean ρ range [-0.245, 0.283] show wide variability, but weak overall association"
      so_what: "Demonstrates that benchmarks with vastly different score distributions (low/high CV) can have similar cross-benchmark agreement levels"
      how_it_supports_claim: "Rules out restricted range as explanation for null result—adequate variance in both IV and DV, yet correlation remains weak"

  surprising_findings:
    finding: "Negative cross-benchmark correlations between benchmarks ostensibly measuring the same 'trust' construct (e.g., FaithfulQA-FinTrust ρ=-0.568, FaithfulQA-TrustBench-Ethics ρ=-0.557)"
    why_surprising: "Expected moderate positive correlations (ρ=0.3-0.7) across trust benchmarks since they claim to measure overlapping trustworthiness dimensions"
    our_interpretation: "Trust benchmarks likely measure distinct, orthogonal sub-constructs (hallucination detection, ethical reasoning, financial safety) rather than a coherent 'trust' factor—similar to how psychometric assessments distinguish sub-dimensions (conscientiousness ≠ extraversion in personality tests)"

  what_results_mean:
    synthesis: "Simple variance-based meta-features (CV) are insufficient for prospective benchmark quality assessment because they cannot disambiguate measurement noise from valid construct divergence. The gap identified in our motivation (lack of prospective verification tools) remains unfilled, but our null result provides valuable negative evidence constraining future tool development."
    confidence_level: "MODERATE for the null result (high internal validity with power analysis and pre-registration), but CONDITIONAL on real-data replication (current analysis uses mock benchmark corpus, a critical validity threat)"
    caveats: "Mock data limitation is fundamental—real leaderboards from TrustLLM, HaluBench, TruthfulQA may exhibit different CV-ρ relationships than synthetic data. Null result should be confirmed with real-world data before generalizing."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First empirical test demonstrating that coefficient of variation, despite intuitive appeal, fails as a prospective benchmark quality signal, while revealing construct validity issues in trust benchmark ecosystem through negative cross-benchmark correlations."
    why_significant: "Provides critical negative evidence for benchmark verification tool development and shifts attention to construct validity as prerequisite for meta-analysis"

  implications:
    for_field: "Benchmark quality assessment requires multi-feature models or construct-aware approaches (factor analysis to validate what benchmarks measure) rather than simple variance statistics. Meta-scientists should validate construct alignment before interpreting cross-benchmark disagreement as measurement error."
    for_practice: "Researchers selecting trust benchmarks cannot rely on leaderboard CV as a quick quality check—must use manual inspection or await future multi-feature tools. Simple heuristics (n-models ≥ 10) remain more reliable than CV for basic quality assurance."
    conceptual_contribution: "Highlights distinction between measurement reliability (ranking consistency within construct) and construct validity (what the benchmark measures)—CV may predict one but not the other, and current metrics conflate them."

  future_possibilities:
    immediate_extensions: "Test alternative meta-features (split-half reliability, IQR, ceiling proximity, skewness) and multi-feature combination models. Replicate with real TrustLLM/HaluBench/TruthfulQA leaderboard data to validate null result robustness."
    longer_term_vision: "Factor-analytic validation of trust benchmark construct structure (confirmatory factor analysis with external criteria), leading to construct-aware quality metrics that separate reliability from validity concerns."
    open_questions: "Do negative cross-benchmark correlations indicate valid multi-dimensionality or problematic task design? How should researchers interpret cross-benchmark disagreement when constructs are orthogonal by design?"

