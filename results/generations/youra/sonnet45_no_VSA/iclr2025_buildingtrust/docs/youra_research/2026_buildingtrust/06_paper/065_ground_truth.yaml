# Purpose: Ground truth for adversarial review to identify overclaims, logical gaps, unsupported assertions

metadata:
  paper_id: "H-BenchmarkVarianceStability-v1"
  paper_type: "null_result_methodological"
  hypothesis_status: "REFUTED"
  gate_failure: "MUST_WORK (h-e1)"
  section_count: 8  # Abstract, Introduction, Related Work, Methodology, Experiments, Results, Discussion, Conclusion
  total_word_count: ~6000
  figures: 3
  tables: 3

# ═══════════════════════════════════════════════════════════════
# CORE CLAIMS (for adversarial verification)
# ═══════════════════════════════════════════════════════════════

primary_claims:
  claim_1_null_result:
    statement: "Coefficient of variation (CV) does not reliably predict cross-benchmark ranking stability (Pearson r=-0.486, p=0.1542)"
    evidence_location: "Results Section, Figure 1, Table 3"
    supporting_data:
      - "Pearson r=-0.486 (95% CI: [-0.854, 0.207])"
      - "p-value=0.1542 (3× higher than threshold p<0.05)"
      - "Sample size n=10 trust benchmarks"
      - "Power analysis: 70-90% for detecting r=-0.5 to -0.7"
    strength: "STRONG - unambiguous null result, both gate criteria failed"
    potential_overclaim: "None identified - result is conservative"

  claim_2_gate_failure:
    statement: "Both MUST_WORK gate criteria failed: correlation magnitude (r=-0.486 vs. r<-0.5) and significance (p=0.1542 vs. p<0.05)"
    evidence_location: "Results Section, Table 3, Figure 3"
    supporting_data:
      - "Pre-registered threshold: r<-0.5, p<0.05"
      - "Actual: r=-0.486 (6% short), p=0.1542"
      - "Gate decision: MUST_WORK failure → Phase 0"
    strength: "STRONG - pre-registration prevents post-hoc threshold adjustment"
    potential_overclaim: "None identified - criteria were pre-specified"

  claim_3_negative_correlations:
    statement: "Cross-benchmark correlation analysis revealed negative correlations (FaithfulQA-FinTrust ρ=-0.568, TruthfulQA-SafetyBench ρ=-0.379)"
    evidence_location: "Results Section, Table 2, Figure 2"
    supporting_data:
      - "6 benchmark pairs with negative ρ"
      - "FaithfulQA-FinTrust ρ=-0.568 (strongest negative)"
      - "TrustLLM-Safety vs SafetyBench ρ=-0.268 (both safety benchmarks)"
    strength: "STRONG - directly observable in correlation matrix"
    potential_overclaim: "MEDIUM - interpretation as 'construct divergence' vs 'measurement instability' requires factor analysis (not performed)"

  claim_4_construct_divergence:
    statement: "Trust benchmarks may measure orthogonal sub-dimensions (honesty, harmlessness, fairness) rather than unitary construct"
    evidence_location: "Discussion Section 6.1 Interpretation 2"
    supporting_data:
      - "Negative correlations between conceptually distinct benchmarks"
      - "TruthfulQA-FinTrust ρ=0.721 (positive within truthfulness cluster)"
      - "Campbell & Fiske (1959) multitrait-multimethod framework"
    strength: "MODERATE - plausible interpretation but requires empirical validation"
    potential_overclaim: "HIGH - factor analysis needed to confirm multi-dimensional structure; currently speculative"

  claim_5_methodological_contribution:
    statement: "Gate-driven validation framework with pre-registration enables rigorous null result reporting"
    evidence_location: "Methodology Section 3.3, Discussion Section 6.3"
    supporting_data:
      - "Pre-registered success criteria (r<-0.5, p<0.05)"
      - "Power analysis (70-90%)"
      - "Open data/code availability"
    strength: "STRONG - methodological template is demonstrable"
    potential_overclaim: "LOW - claim is about methodology, not findings"

# ═══════════════════════════════════════════════════════════════
# CRITICAL LIMITATIONS (for checking transparency)
# ═══════════════════════════════════════════════════════════════

acknowledged_limitations:
  limitation_1_mock_data:
    statement: "Analysis used mock benchmark corpus rather than real leaderboards"
    location: "Methodology Section 3.6, Discussion Section 6.2.1, Conclusion Tier 1"
    severity: "CRITICAL"
    impact_on_conclusions: "Null result may be mock data artifact; real-data replication REQUIRED"
    transparency_rating: "EXCELLENT - flagged in Methodology, Discussion, and Conclusion"
    mitigation_proposed: "Tier 1 real leaderboard replication (1 week)"

  limitation_2_construct_validity:
    statement: "Cross-benchmark ρ conflates measurement stability with construct divergence"
    location: "Discussion Section 6.2.2"
    severity: "FUNDAMENTAL"
    impact_on_conclusions: "Hypothesis may have tested wrong dependent variable"
    transparency_rating: "EXCELLENT - discussed as alternative interpretation"
    mitigation_proposed: "Tier 3 factor analysis (1 month)"

  limitation_3_multidimensional_cv:
    statement: "TrustLLM has 8 sub-dimensions; CV operationalization choice (overall score) is arbitrary"
    location: "Methodology Section 3.2.1, Discussion Section 6.2.3"
    severity: "MODERATE"
    impact_on_conclusions: "Sensitivity to operationalization choice unknown"
    transparency_rating: "GOOD - acknowledged but not fully explored"
    mitigation_proposed: "Tier 2 sensitivity analysis (2 days)"

  limitation_4_sample_size:
    statement: "n=10 trust benchmarks limits generalizability beyond trust domain"
    location: "Discussion Section 6.2.4, Conclusion Tier 4"
    severity: "MODERATE"
    impact_on_conclusions: "Domain restriction acknowledged; math/reasoning/vision benchmarks untested"
    transparency_rating: "EXCELLENT - domain restriction stated in scope"
    mitigation_proposed: "Tier 4 domain replication (3 months)"

