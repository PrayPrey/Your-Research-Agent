# ═══════════════════════════════════════════════════════════════
# UNSUPPORTED ASSERTIONS (to flag for Phase 6.5)
# ═══════════════════════════════════════════════════════════════

unsupported_assertions:
  assertion_1_construct_divergence:
    statement: "Trust benchmarks measure orthogonal sub-dimensions (honesty, harmlessness, fairness)"
    supporting_evidence: "Negative cross-benchmark correlations (FaithfulQA-FinTrust ρ=-0.568)"
    counter_evidence: "No factor analysis performed; alternative explanation (measurement noise) not ruled out"
    classification: "PLAUSIBLE_SPECULATION"
    recommendation: "Reframe as 'may indicate' rather than definitive claim; flag need for factor analysis"
    current_framing: "Paper uses 'may measure' (Discussion 6.1 Interpretation 2) - APPROPRIATE"

  assertion_2_cv_sources_heterogeneous:
    statement: "High CV may arise from legitimate score spread, heterogeneous difficulty, noise, or small sample"
    supporting_evidence: "Logical reasoning, no empirical decomposition"
    counter_evidence: "No item-level analysis performed to distinguish variance sources"
    classification: "PLAUSIBLE_SPECULATION"
    recommendation: "Acknowledge as hypothesis, not validated mechanism"
    current_framing: "Paper presents as 'could explain failure' (Discussion 6.1 Interpretation 1) - APPROPRIATE"

  assertion_3_threshold_effect_possibility:
    statement: "CV may predict instability only at extremes (e.g., CV>0.4) but not across full range"
    supporting_evidence: "None - post-hoc speculation"
    counter_evidence: "No quartile analysis or threshold testing performed"
    classification: "SPECULATION"
    recommendation: "Flag as post-hoc rationalization risk; defer to Tier 2 future work"
    current_framing: "Paper presents as 'plausibly' (Discussion 6.1) and defers to Tier 2 - APPROPRIATE"

