# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Benchmark fragmentation exists across LLM evaluation studies (<25% overlap, mmjerge TMLR 2025)"
      status: "BUILD_ON"
      evidence: "mmjerge meta-analysis of 7,635 benchmarks across 4,886 papers"
    - claim: "Cross-benchmark ranking disagreement documented (Kulkarni et al., 37 models, 6 metric sets)"
      status: "BUILD_ON"
      evidence: "Evaluating Evaluation Metrics paper (arXiv:2504.18114)"
    - claim: "Score variance (σ²) across models is computable from published leaderboards"
      status: "BUILD_ON"
      evidence: "Standard descriptive statistic, no novel methodology required"
    - claim: "Benchmark variance predicts cross-benchmark stability (negative correlation)"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis - no prior work tests this relationship"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Phase 2B-4 (Experiment Design) should:
    - Treat benchmark fragmentation and metric heterogeneity as established context
    - Focus experiment design on testing the NEW variance-stability correlation (r < -0.5)
    - No need to re-validate that cross-benchmark disagreement exists
    - Validate that CV computation from leaderboards is feasible (extraction from papers)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkVarianceStability-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under trust benchmark evaluation with multi-model leaderboards (TrustLLM, HaluBench, TruthfulQA, FinTrust, MultiTrust, n≥10 models each),
    if benchmark coefficient of variation (CV = σ/μ across model scores) is computed and compared with mean cross-benchmark ranking agreement (Spearman ρ),
    then CV correlates negatively with ρ (Pearson r < -0.5, p < 0.05),
    because high score variance indicates inconsistent model differentiation, reducing benchmark reliability as a stable ranking instrument.
  alternative_hypothesis_h0: |
    Benchmark coefficient of variation is uncorrelated with cross-benchmark stability (Pearson r ≥ -0.5 or p ≥ 0.05);
    variance is cosmetic and does not predict ranking consistency across benchmarks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Benchmark Coefficient of Variation (CV)"
      type: "continuous"
      operationalization: "CV = σ/μ where σ = standard deviation of model scores within benchmark, μ = mean score. Range: [0, ∞), typically 0.1-0.5 for LLM benchmarks."
  dependent:
    - name: "Mean Cross-Benchmark Spearman ρ"
      type: "continuous"
      operationalization: "For each benchmark, compute pairwise Spearman rank correlation with all other benchmarks (using ≥5 shared models). Average ρ values to get mean stability. Range: [-1, 1], expected [0.3, 0.9]."
      primary: true
  controlled:
    - name: "Number of Models Evaluated"
      operationalization: "Include only benchmarks with n≥10 models to ensure stable CV estimation and sufficient ranking samples."
    - name: "Benchmark Age"
      operationalization: "Years since publication (2020-2025 range). Control for maturity confound (newer benchmarks may have fewer model evaluations)."
    - name: "Model Overlap Threshold"
      operationalization: "Require ≥5 shared models between benchmark pairs when computing ρ. Filters out spurious correlations from disjoint model sets."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "High benchmark score variance (CV) arises from heterogeneous task difficulty, unstable capability measurement, or small effective sample size."
      evidence: "Benchmarks with wide score dispersion indicate either (a) mix of trivial and impossible items producing noisy signals, or (b) capability being measured varies across contexts, or (c) few discriminative items amplify noise."
      falsifier: "If high-CV benchmarks have uniform task difficulty and large item pools, this step fails."
    - step: 2
      description: "Noise-sensitive benchmarks produce model rankings that depend on which noise-amplifying items dominate the evaluation."
      evidence: "If ranking changes based on random item sampling or evaluation context, the benchmark lacks stable construct validity."
      falsifier: "If high-CV benchmarks show stable rankings across item subsets, this mechanism is wrong."
    - step: 3
      description: "Unstable within-benchmark rankings fail to replicate across benchmarks sampling different item/context distributions, producing low cross-benchmark ρ."
      evidence: "If Benchmark A's ranking is noise-driven, it won't correlate with Benchmark B's ranking (which samples different noise patterns)."
      falsifier: "If high-CV benchmarks still show ρ > 0.7 with other benchmarks, variance doesn't predict instability."
  key_tension: "Correlation ≠ causation. A skeptic could argue variance and instability are both caused by a third factor (e.g., task complexity) rather than variance causing instability. We frame this as EXISTENCE (pattern detection), not MECHANISM (causal proof)."
  evidence_summary: |
    The causal chain predicts that benchmarks with high variance have noisy signals, leading to context-dependent rankings that don't generalize across benchmarks.
    This is testable via the primary prediction (r < -0.5) without requiring mechanistic proof of why variance arises.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Published leaderboards report model scores on the same evaluation protocol (no cherry-picked subsets or different configurations)."
    supporting_evidence: "Standard academic practice is to report full leaderboard. Papers with selective reporting are excluded from analysis."
    consequence_if_violated: "If leaderboards use different evaluation protocols per model, CV conflates protocol variance with inherent benchmark variance, inflating false positives."
  - id: "A2"
    assumption: "Spearman ρ computed on ≥5 shared models between benchmark pairs is a valid stability proxy."
    supporting_evidence: "Spearman rank correlation is standard for comparing rankings. Requiring ≥5 shared models ensures statistical reliability (minimum sample for correlation test)."
    consequence_if_violated: "If ρ computed on tiny overlaps (<5 models) is noisy, cross-benchmark stability estimates become unreliable, reducing power."
  - id: "A3"
    assumption: "Trust benchmarks (TrustLLM, HaluBench, etc.) represent a meaningful domain for generalizing about LLM benchmark quality."
    supporting_evidence: "These are widely-cited benchmarks in trustworthiness research. If the variance-stability pattern holds here, it likely generalizes to other evaluation domains."
    consequence_if_violated: "If trust benchmarks are atypical (e.g., all high-variance by design), the pattern may not apply to general LLM evaluation."
  - id: "A4"
    assumption: "Coefficient of variation (CV = σ/μ) normalizes across different benchmark metrics (AUROC, F1, accuracy, etc.)."
    supporting_evidence: "CV is scale-invariant. Dividing by mean handles metric range differences (e.g., accuracy 0-100 vs. AUROC 0-1)."
    consequence_if_violated: "If CV doesn't normalize properly (e.g., for multi-dimensional benchmarks), we may need metric-specific variance measures."
  - id: "A5"
    assumption: "Benchmark pairs with <50% model overlap still provide valid cross-benchmark ρ estimates (via ≥5 shared models filter)."
    supporting_evidence: "Even partial model overlap (≥5 shared) allows rank correlation computation. Full overlap (100%) would artificially inflate ρ."
    consequence_if_violated: "If shared model sets introduce selection bias (only certain model types overlap), ρ estimates may not reflect true benchmark stability."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Trust benchmarks with published multi-model leaderboards (n ≥ 10 models)
    - LLM evaluation contexts where model ranking stability matters (hypothesis validation, benchmark selection)
    - Benchmarks reporting single-dimensional scores or aggregated overall scores
    - Academic research settings where leaderboard data is publicly available
  does_not_apply_to: |
    - Benchmarks with <10 model evaluations (insufficient sample for stable CV estimation)
    - Domain-specific benchmarks where ranking disagreement is expected by design (e.g., task-specific vs. general-purpose)
    - Multi-modal benchmarks (vision-language) where score variance may have different interpretations
    - Proprietary benchmarks without public leaderboards (no extractable CV data)
  known_limitations: |
    - Small benchmark sample (n=5-10) limits statistical power; results may not generalize beyond trust evaluation domain
    - Multi-dimensional benchmarks (TrustLLM's 8 dimensions) require operationalization choice (average CV vs. primary dimension)
    - Retrospective validation (h-e1 Run 3 case) is n=1 anecdote, not statistical proof
    - Confounds (benchmark age, model overlap) controlled but not eliminated

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Pearson correlation between benchmark CV and mean cross-benchmark Spearman ρ is negative and moderate-to-strong (r < -0.5) with statistical significance (p < 0.05) across 5-10 trust benchmarks."
    test_method: "Extract CV and compute mean_ρ for each of 5-10 trust benchmarks (TrustLLM, HaluBench, TruthfulQA, FinTrust, MultiTrust). Run Pearson correlation test using scipy.stats.pearsonr()."
    success_criterion: "r < -0.5 AND p < 0.05. Statistical power: 70-90% at n=5-10 for r=-0.5 to -0.7."
    falsification: "If r ≥ -0.5 OR p ≥ 0.05, variance does not predict stability; H₀ is retained."
  - id: "P2"
    primary: false
    statement: "Benchmarks in the top CV tertile (high variance) exhibit lower mean cross-benchmark ρ than bottom CV tertile (low variance) with Cohen's d > 0.5."
    test_method: "Split benchmarks into tertiles by CV. Compute mean_ρ for top vs. bottom tertiles. Calculate Cohen's d = (mean_ρ_low_CV - mean_ρ_high_CV) / pooled_SD."
    success_criterion: "d > 0.5 (medium-large effect per Zieliński thresholds). This is descriptive (post-hoc), not primary gate."
    falsification: "If d < 0.5, the variance-stability relationship is weak even if correlation r < -0.5 holds (possibly linear but small effect)."
  - id: "P3"
    primary: false
    statement: "FAVABENCH (h-e1 Run 3 PARTIAL failure, 2 models vs. 8 expected) exhibits higher CV than TrustLLM/TruthfulQA, validating that high CV flags risky benchmarks."
    test_method: "Impute FAVABENCH CV from published error rates (if available) or model performance variance. Compare to TrustLLM/TruthfulQA CVs. Test if FAVABENCH falls in top quartile."
    success_criterion: "FAVABENCH CV > 75th percentile of TrustLLM/TruthfulQA CVs. This is retrospective validation (n=1), not statistical test."
    falsification: "If FAVABENCH CV is low (bottom quartile), our tool would NOT have flagged it as risky—hypothesis fails retrospective smoke test."

