# Core Hypothesis
core_statement: |
  Data augmentations that violate semantic constraints (producing invalid/ambiguous class labels)
  degrade per-class test accuracy on affected classes compared to no augmentation or semantically
  valid augmentations. This effect exhibits dose-response behavior: higher augmentation frequency
  → stronger degradation.

# Specific Instantiation for MNIST
specific_claim: |
  Horizontal flip augmentation on MNIST introduces label noise for asymmetric digits {2,3,5,6,7,9}
  (flipped versions are non-canonical), causing measurable test accuracy degradation on those classes
  compared to baseline (no augmentation) or positive control (rotation ±15°). Symmetric digits {0,1,8}
  are unaffected. Degradation magnitude correlates with flip probability (dose-response).

# Mechanism
causal_mechanism:
  step_1: "Horizontal flip mirrors MNIST digits, producing non-canonical images for asymmetric classes"
  step_2: "Flipped asymmetric digits appear ambiguous/wrong but retain original labels during training"
  step_3: "Model trained on semantically invalid examples exhibits reduced test accuracy on affected classes"
  step_4: "Degradation magnitude correlates with augmentation frequency (p=0.3 → small, p=0.9 → large)"

# Testable Predictions
predictions:
  prediction_1:
    description: "Per-class differential effect"
    claim: "Asymmetric digit accuracy decreases under flip vs baseline; symmetric digit accuracy stable"
    metric: "Per-class test accuracy, grouped by symmetry"
    threshold: "Wilcoxon p < 0.05, Cohen's d ≥ 0.5 for asymmetric degradation"
    falsification: "If asymmetric accuracy NOT significantly lower, or symmetric digits degrade equally → rejected"

  prediction_2:
    description: "Dose-response relationship"
    claim: "Asymmetric digit degradation increases monotonically with flip probability"
    metric: "Spearman correlation between flip prob {0.3, 0.5, 0.9} and asymmetric accuracy"
    threshold: "Spearman ρ significantly negative (p < 0.05)"
    falsification: "If no monotonic relationship observed → mechanism questioned"

  prediction_3:
    description: "Positive control validation"
    claim: "Rotation ±15° does NOT degrade asymmetric digits (isolates semantic vs general aug effects)"
    metric: "Per-class test accuracy under rotation vs baseline"
    threshold: "No significant differential effect on asymmetric vs symmetric digits"
    falsification: "If rotation also harms asymmetric digits → not semantic-specific effect"

# Novelty
novelty:
  what_is_new:
    - "First explicit test of whether 'standard' augmentations can harm accuracy due to semantic invalidity"
    - "Establishes general principle: augmentation effectiveness depends on semantic validity"
    - "Quantifies dose-response relationship between semantic violation frequency and degradation"
    - "Methodological contribution: demonstrates need for domain-aware augmentation selection"

  what_is_different:
    - "Existing work applies horizontal flip without semantic validation"
    - "PyTorch official examples avoid flip for MNIST without explanation"
    - "This work makes semantic invalidity hypothesis explicit and tests it rigorously"

  generalizability: |
    Principle applies to any domain with semantic constraints: medical imaging (anatomical orientation),
    traffic signs (directional arrows), text recognition (character chirality). Provides template for
    validating augmentation schemes in new domains.

# Scope & Boundaries
scope:
  covers:
    - "Semantic validity of horizontal flip on MNIST digit classification"
    - "Per-class accuracy effects (not just overall metrics)"
    - "Dose-response between augmentation frequency and degradation"

  does_not_cover:
    - "Other augmentation types (vertical flip, cutout, mixup) — out of scope"
    - "Other datasets beyond MNIST — MNIST is case study"
    - "Model architectures beyond standard CNNs"
    - "Optimal augmentation selection algorithms — diagnostic, not prescriptive"

  known_limitations:
    - "Effect size may be small (1-2% degradation) — scientifically meaningful but modest on MNIST"
    - "MNIST is relatively easy (99% baseline) — effects may be stronger on harder datasets"
    - "Controlled lab setting — real-world may use ensembles/mixup that mitigate label noise"

# Experimental Design Summary
experiment_design:
  dataset: "MNIST (60k train, 10k test, 10 classes, 28×28 grayscale)"

  model: "Standard CNN (2 conv layers [32,64 filters], MaxPool, Dropout [0.25,0.5], 2 FC [128→10])"

  conditions:
    - "Baseline: ToTensor + Normalize only"
    - "Flip30: RandomHorizontalFlip(p=0.3) + Normalize"
    - "Flip50: RandomHorizontalFlip(p=0.5) + Normalize"
    - "Flip90: RandomHorizontalFlip(p=0.9) + Normalize"
    - "Rotation: RandomRotation(±15°) + Normalize"

  training:
    optimizer: "Adam (lr=0.001)"
    batch_size: 64
    epochs: 30
    early_stopping: "5 epochs patience on validation accuracy"
    loss: "CrossEntropyLoss"

  evaluation:
    metric: "Per-class test accuracy (10 classes)"
    grouping: "Symmetric {0,1,8} vs Asymmetric {2,3,5,6,7,9}"
    statistical_test: "Wilcoxon signed-rank (paired, n=5 seeds, α=0.05)"
    effect_size: "Cohen's d ≥ 0.5 for asymmetric degradation"
    correlation: "Spearman ρ for dose-response"

  compute:
    time_estimate: "~3 hours sequential, ~45 min with 4-core parallelization"
    hardware: "CPU sufficient (no GPU required)"

