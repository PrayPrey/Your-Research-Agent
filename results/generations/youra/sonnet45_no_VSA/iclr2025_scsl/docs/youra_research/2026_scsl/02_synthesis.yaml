# Phase 2A Output: Research Synthesis
# Consolidated findings from 7-exchange Tikitaka discussion

timestamp: 2026-07-11T00:00:00Z
phase: Phase 2A-Dialogue
session_type: Multi-Perspective Research Dialogue
exchanges_count: 7
convergence_achieved: true

# Variables
variables:
  independent:
    - name: "Augmentation Type"
      levels: ["None (baseline)", "HorizontalFlip(p)", "Rotation(±15°)"]
      description: "Data augmentation applied during training"

    - name: "Flip Probability"
      levels: [0.0, 0.3, 0.5, 0.9]
      description: "Probability of applying horizontal flip augmentation"

    - name: "Random Seed"
      levels: [42, 123, 456, 789, 1011]
      description: "Random seed for initialization and data shuffling (n=5)"

  dependent:
    - name: "Per-Class Test Accuracy"
      range: "[0.0, 1.0]"
      unit: "proportion correct (0-100%)"
      description: "Test accuracy for each of 10 MNIST digit classes"

    - name: "Symmetric Digit Accuracy"
      definition: "mean({class_0, class_1, class_8})"
      description: "Average test accuracy for horizontally symmetric digits"

    - name: "Asymmetric Digit Accuracy"
      definition: "mean({class_2, class_3, class_5, class_6, class_7, class_9})"
      description: "Average test accuracy for horizontally asymmetric digits"

    - name: "Accuracy Gap"
      definition: "symmetric_accuracy - asymmetric_accuracy"
      description: "Difference between symmetric and asymmetric digit performance"

  control:
    - name: "Model Architecture"
      value: "Standard CNN (2 conv [32,64], MaxPool, Dropout, 2 FC [128→10])"

    - name: "Training Epochs"
      value: 30
      note: "With early stopping (5 epochs patience)"

    - name: "Optimizer"
      value: "Adam (lr=0.001, default betas)"

    - name: "Batch Size"
      value: 64

    - name: "Loss Function"
      value: "CrossEntropyLoss"

# Key Assumptions
assumptions:
  semantic_invalidity:
    statement: "Horizontally flipped asymmetric digits {2,3,5,6,7,9} are visually non-canonical"
    justification: "Flipped '3' appears as backward '3' (invalid digit), not a different valid class"
    testable: false
    note: "Assumption validated by visual inspection, not empirically tested in this work"

  label_preservation:
    statement: "Augmented images retain original labels (flip of '3' still labeled '3')"
    justification: "Standard augmentation pipeline behavior in PyTorch transforms"
    testable: false
    note: "Implementation detail, verified by code inspection"

  learnable_signal:
    statement: "Despite label noise, model can still learn from valid training examples"
    justification: "Label noise literature shows partial learning possible under noise"
    testable: true
    test: "If all augmented examples were invalid, accuracy would collapse to random (~10%)"

  symmetry_partition:
    statement: "Digits cleanly partition into symmetric {0,1,8} and asymmetric {2,3,5,6,7,9}"
    justification: "Mathematical property: horizontal reflection preserves shape for symmetric digits"
    testable: false
    note: "Geometric fact, not empirical claim"

  rotation_validity:
    statement: "Rotation ±15° preserves semantic validity (tilted digits remain recognizable)"
    justification: "MNIST includes natural handwriting variation in angle; ±15° within that range"
    testable: true
    test: "If rotation harms accuracy equally across all classes → assumption violated"

# Null Hypothesis
null_hypotheses:
  H0_1:
    statement: "No significant difference in asymmetric digit accuracy between baseline and flip conditions"
    statistical_form: "H0: μ_asymmetric(flip) = μ_asymmetric(baseline)"
    test: "Wilcoxon signed-rank test, α=0.05, n=5 seeds"
    rejection_criterion: "p < 0.05 AND Cohen's d ≥ 0.5"

  H0_2:
    statement: "No dose-response relationship between flip probability and asymmetric digit degradation"
    statistical_form: "H0: Spearman ρ(flip_prob, asymmetric_accuracy) = 0"
    test: "Spearman rank correlation, α=0.05"
    rejection_criterion: "p < 0.05 AND ρ significantly negative"

  H0_3:
    statement: "Symmetric and asymmetric digits degrade equally under horizontal flip"
    statistical_form: "H0: Δ_symmetric(flip-baseline) = Δ_asymmetric(flip-baseline)"
    test: "Wilcoxon test on accuracy gap differences"
    rejection_criterion: "Differential effect detected (p < 0.05)"

