main_hypothesis:
  id: h-s1
  title: Semantic Validity Hypothesis for Data Augmentation
  statement: 'Data augmentations that violate semantic constraints (producing invalid/ambiguous class labels) degrade per-class
    test accuracy on affected classes compared to no augmentation or semantically valid augmentations. This effect exhibits
    dose-response behavior: higher augmentation frequency → stronger degradation.'
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: MNIST (60k train, 10k test, 10 classes, 28×28 grayscale)
    model: Standard CNN (2 conv [32,64 filters], MaxPool, Dropout [0.25,0.5], 2 FC [128→10])
    optimizer: Adam (lr=0.001, default betas)
    hyperparameters:
      batch_size: 64
      epochs: 30
      early_stopping_patience: 5
      seeds:
      - 42
      - 123
      - 456
      - 789
      - 1011
      loss: CrossEntropyLoss
