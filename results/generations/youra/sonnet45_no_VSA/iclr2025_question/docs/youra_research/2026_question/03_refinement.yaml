  gap_title: Preserving Creative Capabilities While Detecting Hallucinations
  execution_mode: UNATTENDED
  discussion_exchanges: 18
  convergence_reason: All 6 convergence criteria met (SPECIFIC, MECHANISM, PREDICTIONS,
    NOVELTY, FEASIBILITY, OBJECTIONS)
established_facts:
  claims:
  - claim: CCP achieves +0.05-0.10 ROC-AUC improvement over logit baselines on biography
      generation
    status: BUILD_ON
    evidence: '[arxiv:2403.04696] experimental results'
  - claim: AGSER demonstrates F1 improvements of +0.154 to +0.368 over SelfCheckGPT
      on factual benchmarks
    status: BUILD_ON
    evidence: '[arxiv:2501.09997] evaluation across 12 model-dataset settings'
  - claim: Product aggregation outperforms mean/min in factual domains
    status: BUILD_ON
    evidence: '[arxiv:2403.04696] ablation studies'
  scope_reduction_percentage: 0
  phase2b_4_instructions: Build on established CCP/AGSER factual performance; focus
    verification on creative domain transfer and ontology sensitivity claims.
core_statement:
  hypothesis_id: H-OntologyStress-v1
  confidence_level: 0.8
  core_hypothesis_statement: Under creative text generation (metaphorical/speculative
    content), if CCP-based hallucination detection is applied with fixed thresholds
    calibrated for factual domains, then claim-type mass ratio (ρ_j) will degrade
    >0.15 AND diversity metrics will drop ≥15%, because CCP's NLI-based conditioning
    and product aggregation embed implicit factual-ontology assumptions that misalign
    with creative semantics.
  alternative_hypothesis_h0: Existing hallucination detectors (CCP, AGSER) do NOT
    exhibit measurable performance degradation (ROC-AUC drop <0.05, ρ_j shift ≤0.05,
    diversity loss <5%) or increased false-positive rates on creative text compared
    to factual text.
variables:
  independent:
  - name: task_ontology
    type: categorical
    operationalization: factual (TruthfulQA biographies) vs. creative (WritingPrompts
      stories)
    levels:
    - factual_biography
    - creative_fiction
  - name: detection_mechanism
    type: categorical
    operationalization: CCP vs. AGSER vs. HAD (taxonomy-trained)
    levels:
    - CCP
    - AGSER
    - HAD
  - name: aggregation_function
    type: categorical
    operationalization: product vs. log-sum-exp vs. mean for claim-level scores
    levels:
    - product
    - log_sum_exp
    - mean
  dependent:
  - name: claim_type_mass_ratio
    type: continuous
    operationalization: Median ρ_j = (entail+contradict mass) / (total top-K mass)
    primary: true
  - name: ROC_AUC
    type: continuous
    operationalization: ROC-AUC for hallucination detection on factual benchmarks
    primary: false
  - name: diversity_loss
    type: continuous
    operationalization: Percentage drop in Self-BLEU and embedding dispersion
    primary: true
  - name: metaphor_false_positive_ratio
    type: continuous
    operationalization: False-positive concentration on metaphor spans vs. literal
      spans
    primary: false
  controlled:
  - name: base_LLM
    operationalization: Same model (GPT-3.5, Llama3-8B) across conditions
  - name: decoding_temperature
    operationalization: Fixed at 0.7 across experiments
  - name: prompt_formulation
    operationalization: Standardized prompts from existing benchmarks
causal_mechanism:
  mechanism_type: ontology_mismatch_cascade
  causal_chain:
  - step: 1
    description: Ontology Shift
    detail: Creative text contains metaphors/counterfactuals where factual verifiability
      is inappropriate
  - step: 2
    description: Denominator Instability
    detail: NLI misclassifies metaphoric alternatives as neutral (not entail/contradict),
      decreasing ρ_j
  - step: 3
    description: Product Aggregation Amplification
    detail: Correlated low-probability creative tokens compound multiplicatively,
      depressing claim scores
  - step: 4
    description: Detection Failure
    detail: False-positive clustering on metaphors and diversity suppression
  moderators:
  - NLI context window
  - aggregation function choice
  confounds:
  - NLI model domain bias
  - claim decomposition variance
  link_function_requirement: Monotonic regression of ROC-AUC degradation on ρ_j shift
    (R² > 0.6)
testable_predictions:
  predictions:
  - id: P1
    statement: Median ρ_j will drop by >0.15 in creative corpora vs. biographies
    success_criterion: Δρ_j > 0.15 AND monotonic link to ROC-AUC (R² > 0.6)
    failure_criterion: Δρ_j ≤ 0.05 OR no monotonic relationship
    measurement_approach: Compare median ρ_j on TruthfulQA biographies vs. WritingPrompts
      samples
  - id: P2
    statement: Lag-1 CCP autocorrelation will exceed 0.4 in fiction, causing aggregation
      fragility
    success_criterion: Mean lag-1 autocorr > 0.4 in fiction (vs. <0.2 in biography)
      AND permutation ΔROC-AUC > 0.03
    failure_criterion: Autocorrelation <0.3 OR permutation effect <0.01
    measurement_approach: Measure intra-claim CCP correlation, run permutation controls
  - id: P3
    statement: AGSER shows ≥15% AUC drop on creative tasks while HAD remains within
      ±5% Span F1
    success_criterion: AGSER ΔAUC ≥0.15 AND HAD Δ Span F1 ≤0.05 AND metaphor FP concentration
      ≥2×
    failure_criterion: Both degrade similarly OR HAD shows no robustness
    measurement_approach: Apply both detectors to paired factual/creative prompts,
      measure span-level performance
experimental_design:
  phases:
  - phase: Phase 1
    title: Ontology Stress Characterization
    description: Measure ρ_j, autocorrelation, decomposition stability across factual/creative
      domains
    deliverables:
    - ρ_j degradation report
    - autocorrelation statistics
    - decomposition variance analysis
  - phase: Phase 2
    title: Comparative Mechanism Testing
    description: Apply CCP/AGSER/HAD to paired tasks, measure performance and false-positive
      patterns
    deliverables:
    - ROC-AUC comparison table
    - metaphor false-positive analysis
  - phase: Phase 3
    title: Aggregation Ablation
    description: Replace product with log-sum-exp/mean, test calibration and diversity
      preservation
    deliverables:
    - Calibration curves
    - diversity metrics comparison
  datasets:
    factual:
    - TruthfulQA biographies
    - HotpotQA
    creative:
    - WritingPrompts
    - OpenStoryGen
  models:
  - GPT-3.5
  - GPT-4
  - Llama3-8B
  - Mistral-7B
  compute_requirements: NVIDIA A100 40GB
  timeline_estimate: 4-5 weeks total
novelty_positioning:
  primary_novelty: First operationalization of 'creativity preservation' as measurable
    constraint in hallucination detection
  paradigm_contribution: Reframes hallucination detection from universal factuality
    to task-conditional epistemic regulation
  field_impact: Opens research directions in automatic ontology inference and attention
    reweighting by epistemic intent
feasibility_assessment:
  technical_feasibility: HIGH
  benchmarks_available: true
  baselines_published: true
  new_annotation_required: false
  compute_accessible: true
  risk_mitigation: Null result (no harm found) is publishable; pivot to calibration
    focus if ρ_j shift small
