# Phase 6 Narrative Blueprint
# Date: 2026-07-09
# Paper Type: Methodological Critique + Negative Result (Option 3)
# Hypothesis: h-e1 (Ontology-Dependent Hallucination Detection) - FAILED at MUST_WORK gate

metadata:
  paper_type: "Replication Study + Methodological Critique"
  target_venue: "NLP/ML Conference (EMNLP, ACL, ICLR)"
  word_target: "8 pages (conference format) + unlimited appendix"
  expected_contributions:
    - "Replication failure documentation (CCP paper)"
    - "Root cause analysis: NLI calibration gap SNLI/MNLI → factual verification"
    - "Methodological requirements for hallucination detection reproducibility"
  hypothesis_status: "FAILED at gate 1/9 (MUST_WORK)"
  route_decision: "Phase 2A return recommended, but proceeding with paper on methodological insights"

# --- NARRATIVE ARC DESIGN ---

hook_strategy:
  opening_type: "provocative_claim"
  claim: "The CCP hallucination detection method (arxiv:2403.04696) claims +0.05-0.10 ROC-AUC improvement on biography generation. We could not reproduce the baseline, observing ρ_j values 50× lower than expected across all domains."
  why_compelling: "Reproducibility is critical crisis in ML/NLP - exposes hidden implementation details papers omit"
  narrative_frame: "transparency_over_novelty"
  reader_question_seeded: "What went wrong, and what does this teach us about evaluating hallucination detectors?"

problem_framing:
  level_1_surface:
    question: "Can NLI-based hallucination detection (CCP) distinguish factual from creative text?"
    initial_answer: "Unknown - requires empirical validation"

  level_2_obstacle:
    question: "What prevents valid hypothesis testing?"
    obstacle: "Measurement validity failure: ρ_j metric produces values 50× lower than expected"
    evidence: "Median ρ_j = 0.0354 (factual), 0.0103 (creative) vs expected 0.75-0.85"

  level_3_fundamental:
    question: "Why does measurement fail?"
    root_cause: "NLI model trained on SNLI/MNLI (semantic similarity) does not generalize to factual verification (claim-context consistency)"
    broader_implication: "Hallucination detection papers often lack implementation details (raw ρ_j distributions, NLI calibration diagnostics, claim decomposition methodology)"

key_insight:
  statement: "Measurement validity is a prerequisite for hypothesis testing. When ρ_j is 50× lower than expected across ALL domains, you cannot distinguish 'hypothesis is wrong' from 'measurement is broken.'"
  mechanism: "DeBERTa-v3-base NLI assigns ~90% probability mass to 'neutral' class for claim-context pairs, collapsing the claim-type mass ratio"
  novelty: "First work to document NLI calibration failure for factual verification tasks, despite SNLI/MNLI SOTA performance"
  theoretical_advance: "Identifies task-domain gap (semantic similarity ≠ factual verification) as distinct from traditional domain shift"

evidence_structure:
  primary_claim: "CCP ρ_j metric implementation produces values 50× lower than paper claims"
  supporting_claims:
    - id: "C1"
      statement: "ρ_j values uniformly low across factual AND creative domains"
      evidence: "Median ρ_j factual = 0.0354, creative = 0.0103 (no statistical separation, p=1.0)"
      strength: "quantitative"

    - id: "C2"
      statement: "NLI model assigns majority mass to neutral class"
      evidence: "NLI distribution heatmap shows ~80-90% neutral probability across both domains"
      strength: "quantitative"

    - id: "C3"
      statement: "Autocorrelation hypothesis refuted by dataset structure confound"
      evidence: "Factual autocorr (0.264) > Creative autocorr (0.046) due to TruthfulQA repeated entities vs WritingPrompts diverse narratives"
      strength: "quantitative + mechanistic explanation"

    - id: "C4"
      statement: "Literature supports NLI calibration issues as common bottleneck"
      evidence: "Himal-Badu: attention r<0.1; Shaguns26: 95% recall only after threshold tuning 50%→30%"
      strength: "literature_triangulation"

  negative_result_framing:
    position: "Constructive failure - exposes hidden assumptions in hallucination detection research"
    what_we_learned:
      - "NLI model selection is critical (SNLI/MNLI ≠ factual verification)"
      - "Claim decomposition method affects measurement (sentences ≠ logical claims)"
      - "Baseline replication must precede domain transfer experiments"
    alternative_explanation: "CCP paper may use domain-adapted NLI models or alternative claim extraction not documented in paper"

counterarguments_preempted:
  - objection: "Maybe your implementation is just wrong"
    response: "We followed CCP paper equations exactly, used proven DeBERTa-v3-base NLI model (same as cavaquinho/HallucinoGenAI implementations), and replicated standard NLI inference patterns. Gap is in undocumented implementation details."

  - objection: "Negative results aren't publishable"
    response: "Transparent replication failures improve field reproducibility standards. We provide actionable recommendations: NLI calibration diagnostics, claim decomposition validation, reproducibility checklists."

  - objection: "Why not just fix it and move on?"
    response: "Documenting failure modes prevents others from repeating costly mistakes. We identify THREE prerequisite validations (NLI calibration, claim decomposition, baseline replication) future work must address."

# --- SECTION STRUCTURE ---

section_01_introduction:
  narrative_role: "Set stakes + hook reader with provocative failure"
  key_beats:
    - "Hallucination detection critical for LLM deployment"
    - "CCP paper claims improvements but lacks implementation details"
    - "Our replication attempt: ρ_j 50× lower than expected"
    - "Contribution: Root cause analysis + methodological requirements"
  length_target: "1.5 pages"
  figures: []

section_02_related_work:
  narrative_role: "Position within hallucination detection + reproducibility literature"
  key_beats:
    - "Hallucination detection methods: NLI-based (CCP, AGSER), semantic entropy, self-consistency"
    - "Reproducibility challenges in NLP/ML (Belz et al. 2021, Dodge et al. 2019)"
    - "NLI domain adaptation: SNLI/MNLI → FEVER/HotpotQA"
    - "Gap: No systematic CCP replication studies exist"
  length_target: "1.5 pages"
  figures: []

section_03_methodology:
  narrative_role: "Demonstrate methodological rigor (transparency as contribution)"
  key_beats:
    - "CCP mechanism: NLI-based conditioning → claim-type mass ratio ρ_j"
    - "Implementation: DeBERTa-v3-base NLI, NLTK sentence tokenization, product aggregation"
    - "Datasets: TruthfulQA (factual), WritingPrompts (creative)"
    - "Metrics: ρ_j, autocorrelation, Krippendorff's α, statistical tests"
    - "Reproducibility: Fixed seeds, configuration saved, code public"
  length_target: "2 pages"
  figures:
    - "Figure 1: CCP mechanism diagram (NLI inference → ρ_j computation)"

section_04_experiments:
  narrative_role: "Present failure + quantitative evidence"
  key_beats:
    - "Experimental setup: 792 factual + 817 creative samples"
    - "Gate metrics: Δρ_j = -0.0250 (threshold >0.15), p=1.0 (nonsignificant)"
    - "Failure mode: Values 50× lower than expected (0.01-0.04 vs 0.75-0.85)"
    - "NLI distribution analysis: Neutral-class dominance confirmed"
  length_target: "1.5 pages"
  figures:
    - "Figure 2: ρ_j distribution comparison (factual vs creative) - violin plot"
    - "Figure 3: NLI score distribution heatmap (shows neutral dominance)"

section_05_results:
  narrative_role: "Diagnose root cause + rule out alternative explanations"
  key_beats:
    - "Root cause hierarchy: (1) NLI calibration (primary), (2) Claim decomposition (contributory), (3) Context pairing (requires ablation)"
    - "Evidence for H1 (out-of-distribution gap): Literature triangulation (Himal-Badu, Shaguns26) + uniform degradation across domains"
    - "Autocorrelation confound: Dataset structure (TruthfulQA repeated entities) not hallucination behavior"
    - "What this teaches: Baseline validation on original domain BEFORE domain transfer"
  length_target: "2 pages"
  figures:
    - "Figure 4: Autocorrelation comparison (lag 1-10) - line plot"

section_06_discussion:
  narrative_role: "Broader implications + future work directions"
  key_beats:
    - "Reproducibility gap: CCP paper lacks raw ρ_j distributions, NLI calibration details, claim decomposition methodology"
    - "Field-wide issue: Hallucination detection papers optimize for novelty over reproducibility"
    - "Recommendations for authors: (1) Report raw metric distributions, (2) Document NLI calibration, (3) Validate claim decomposition inter-annotator agreement, (4) Public code with unit tests"
    - "Future work: NLI fine-tuning on FEVER/HotpotQA, claim decomposition comparison (NLTK vs LLM vs Spacy), baseline replication"
  length_target: "1.5 pages"
  figures: []

section_07_conclusion:
  narrative_role: "Close loop - callback to hook + actionable takeaway"
  key_beats:
    - "Callback: We set out to test ontology-dependent hallucination detection. Measurement validity failure prevented hypothesis testing."
    - "Lesson learned: Replicate baseline on original domain BEFORE extending to new domains"
    - "Contribution: First systematic documentation of NLI calibration failure for factual verification"
    - "Call to action: Field must improve reproducibility standards (checklists, raw metrics, public code)"
  length_target: "0.5 pages"
  figures: []

section_00_abstract:
  narrative_role: "Distill entire paper to 250 words (written LAST)"
  key_beats:
    - "Problem: CCP hallucination detection claims improvements but lacks reproducibility"
    - "Method: Replication attempt on TruthfulQA (factual) vs WritingPrompts (creative)"
    - "Result: ρ_j 50× lower than expected (0.01-0.04 vs 0.75-0.85) across both domains"
    - "Root cause: NLI model (SNLI/MNLI training) does not generalize to factual verification"
    - "Contribution: Methodological requirements for hallucination detection (NLI calibration, claim decomposition, baseline validation)"
    - "Impact: Improves reproducibility standards for hallucination detection research"
  length_target: "250 words"
  figures: []

# --- COHERENCE MECHANISMS ---

recurring_motifs:
  - motif: "measurement_validity_gates_hypothesis_testing"
    where_appears: ["Introduction", "Results", "Discussion", "Conclusion"]
    payoff: "Transparent failure → methodological humility → improved field standards"

  - motif: "50x_magnitude_gap"
    where_appears: ["Abstract", "Introduction", "Experiments", "Discussion"]
    payoff: "Quantitative anchor for 'something is fundamentally wrong' claim"

  - motif: "task_domain_gap_not_traditional_domain_shift"
    where_appears: ["Related Work", "Results", "Discussion"]
    payoff: "Theoretical contribution: SNLI/MNLI semantic similarity ≠ factual verification"

transitions_between_sections:
  intro_to_related:
    bridge: "To understand why CCP replication failed, we first survey existing hallucination detection methods and reproducibility challenges."

  related_to_method:
    bridge: "Building on proven NLI architectures (cavaquinho, HallucinoGenAI), we implemented CCP following paper equations."

  method_to_experiments:
    bridge: "We applied this implementation to paired factual/creative datasets to test the ontology-mismatch hypothesis."

  experiments_to_results:
    bridge: "The gate failure (ρ_j 50× too low) prompted root cause analysis across four competing explanations."

  results_to_discussion:
    bridge: "These findings expose a broader reproducibility gap in hallucination detection research."

  discussion_to_conclusion:
    bridge: "Returning to our initial question: measurement validity must precede hypothesis testing."

callbacks_to_hook:
  - location: "Results (root cause identified)"
    callback_text: "Recall our provocative claim: ρ_j 50× lower than expected. The culprit: NLI training distribution mismatch."

  - location: "Conclusion (final paragraph)"
    callback_text: "We began by asking whether CCP degrades on creative text. We end with a methodological requirement: validate your measurement before testing your hypothesis."

# --- WRITING CONSTRAINTS ---

style_guidelines:
  tone: "Constructive transparency (not defensive, not apologetic)"
  voice: "First-person plural ('We implemented...', 'Our findings...')"
  jargon_level: "Assume NLP/ML conference audience (explain ρ_j, assume NLI familiarity)"
  negative_result_framing: "Failure as contribution - what we learned matters"

quantitative_anchors:
  - "50× lower (0.01-0.04 vs 0.75-0.85)" # Magnitude gap
  - "p = 1.0000" # No statistical separation
  - "Cohen's d = -0.0635" # Negligible effect
  - "~90% neutral class probability" # NLI calibration failure
  - "Krippendorff's α = 0.75" # Claim decomposition reliability

avoid:
  - "Our implementation might be wrong" (defensive - undermines contribution)
  - "CCP paper authors are at fault" (accusatory - burns bridges)
  - "This is just a negative result" (dismissive - misses methodological value)
  - "Future work will fix this" (vague - provide concrete recommendations instead)

emphasize:
  - "Transparent documentation prevents repetition of costly mistakes"
  - "Methodological rigor as contribution (reproducibility checklist)"
  - "Root cause hierarchy (NLI calibration > claim decomposition > context pairing)"
  - "Actionable recommendations for field (what papers should report)"

