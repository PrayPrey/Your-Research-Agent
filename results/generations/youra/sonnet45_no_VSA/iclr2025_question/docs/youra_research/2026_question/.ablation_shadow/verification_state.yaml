main_hypothesis:
  id: H-OntologyStress-v1
  title: Ontology-Sensitive Hallucination Detection Under Creative Text Generation
  statement: Under creative text generation (metaphorical/speculative content), if CCP-based hallucination detection is applied
    with fixed thresholds calibrated for factual domains, then claim-type mass ratio (ρ_j) will degrade >0.15 AND diversity
    metrics will drop ≥15%, because CCP's NLI-based conditioning and product aggregation embed implicit factual-ontology assumptions
    that misalign with creative semantics.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA biographies (factual) vs WritingPrompts (creative)
    model: GPT-3.5, GPT-4, Llama3-8B, Mistral-7B
    optimizer: null
    hyperparameters:
      temperature: 0.7
      nli_model: standard pre-trained
      aggregation_function: product (primary), log-sum-exp, mean (ablations)
