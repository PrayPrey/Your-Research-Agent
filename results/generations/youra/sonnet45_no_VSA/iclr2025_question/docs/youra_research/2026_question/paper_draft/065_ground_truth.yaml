# Phase 6.5 Ground Truth Claims
# Date: 2026-07-09
# Paper: Replication Failure of CCP Hallucination Detection Method
# Purpose: Extract falsifiable claims for adversarial review validation

metadata:
  paper_title: "A Replication Study of Constrained Category Probability: Measurement Validity Failures in NLI-Based Hallucination Detection"
  paper_type: "Methodological Critique + Negative Result"
  hypothesis_status: "FAILED at MUST_WORK gate (1/9)"
  extraction_date: "2026-07-09"
  adversarial_review_target: "Phase 6.5"

# --- PRIMARY QUANTITATIVE CLAIMS ---

quantitative_claims:
  - claim_id: "QC1"
    statement: "ρ_j values observed were 50× lower than expected: median 0.0354 (factual), 0.0103 (creative) vs expected 0.75-0.85"
    section: "Abstract, Introduction, Experiments (Section 4.2)"
    evidence_type: "direct_measurement"
    validation_method: "Experimental data in h-e1/code/results/metrics_summary.json"
    data_source: "792 factual samples (TruthfulQA), 817 creative samples (WritingPrompts)"
    statistical_test: "Wilcoxon rank-sum (p=1.0000, Cohen's d=-0.0635)"
    adversarial_strength: "HIGH"
    falsification_test: "Re-run experiment with same configuration (seed=42, DeBERTa-v3-base, NLTK tokenization) → should reproduce ρ_j within ±0.005"
    potential_objections:
      - "Implementation error (our code is wrong)"
      - "Dataset sampling bias (TruthfulQA/WritingPrompts atypical)"
      - "Expected range (0.75-0.85) is incorrect inference from CCP paper"
    rebuttal:
      - "Implementation validated via static + runtime checks (Section 4.1); follows proven architectures (cavaquinho)"
      - "Both datasets are standard benchmarks with official evaluation code; 817 samples sufficient for distribution estimation"
      - "Expected range inferred from CCP paper's +0.05-0.10 ROC-AUC claims; ρ_j should be >0.70 for hallucination detection to work"

  - claim_id: "QC2"
    statement: "No statistical separation between factual and creative domains: Δρ_j = -0.0250 (wrong direction), p = 1.0000 (nonsignificant)"
    section: "Experiments (Section 4.2, Table 1)"
    evidence_type: "statistical_test"
    validation_method: "Wilcoxon rank-sum test on ρ_j distributions"
    data_source: "Same as QC1"
    adversarial_strength: "HIGH"
    falsification_test: "Effect direction should be positive (creative > factual) if hypothesis correct; we observe negative"
    potential_objections:
      - "Statistical test choice (Wilcoxon) inappropriate"
      - "Sample size insufficient (817 per domain)"
      - "Hypothesis prediction (Δρ_j > 0.15) too stringent"
    rebuttal:
      - "Wilcoxon is standard non-parametric test for comparing medians; does not assume Gaussian distributions"
      - "817 samples >> 100 minimum for median estimation (80% power at α=0.05 for d=0.5)"
      - "Δρ_j > 0.15 is 20% relative decrease from baseline ρ_j=0.75; practically significant for hallucination detection"

  - claim_id: "QC3"
    statement: "NLI model assigns ~90% probability mass to neutral class: mean P(neutral)=0.910 (factual), 0.967 (creative)"
    section: "Experiments (Section 4.4, Table 3)"
    evidence_type: "direct_measurement"
    validation_method: "Mean NLI class probabilities from DeBERTa-v3-base outputs"
    data_source: "All claim-context pairs from h-e1 experiment"
    adversarial_strength: "HIGH"
    falsification_test: "Re-run NLI inference with same model → should reproduce neutral-class dominance"
    potential_objections:
      - "DeBERTa-v3-base misconfigured (wrong model weights)"
      - "Softmax outputs not properly normalized"
      - "Context pairing introduces artificial neutral bias"
    rebuttal:
      - "Model loaded via HuggingFace transformers standard API; checksum verified"
      - "Softmax normalization built into CrossEncoder library; sums to 1.0 for all samples"
      - "Full-text context pairing follows cavaquinho implementation pattern; alternative windowing requires ablation study"

  - claim_id: "QC4"
    statement: "Autocorrelation hypothesis refuted: factual lag-1 autocorr (0.264) > creative (0.046), opposite to prediction"
    section: "Experiments (Section 4.5, Table 4)"
    evidence_type: "direct_measurement + mechanistic_explanation"
    validation_method: "Pearson correlation on consecutive CCP scores within samples"
    data_source: "Claim sequences from h-e1 experiment"
    adversarial_strength: "HIGH"
    falsification_test: "Pattern inverted relative to hypothesis (creative > factual predicted, factual > creative observed)"
    potential_objections:
      - "Autocorrelation metric inappropriate for this task"
      - "Lag-1 insufficient (should measure lag-2, lag-3)"
      - "Prediction (creative > 0.4, factual < 0.2) too stringent"
    rebuttal:
      - "Autocorrelation standard for measuring sequential dependence; used in time series analysis"
      - "Table 4 shows inverted pattern across lags 1-10; not a lag-1 artifact"
      - "Threshold (0.4 vs 0.2) designed to detect strong vs weak dependence; observed inversion (0.264 vs 0.046) is qualitative not threshold-driven"

  - claim_id: "QC5"
    statement: "Claim decomposition reliability established: Krippendorff's α = 0.75 > 0.7 threshold"
    section: "Experiments (Section 4.1)"
    evidence_type: "reliability_metric"
    validation_method: "Inter-method agreement for NLTK sentence tokenization"
    data_source: "Claim boundaries across h-e1 samples"
    adversarial_strength: "MEDIUM"
    falsification_test: "Re-compute α with same tokenization → should reproduce within ±0.05"
    potential_objections:
      - "α measures consistency not validity (sentences ≠ logical claims)"
      - "No comparison with alternative methods (LLM extraction, Spacy)"
      - "0.75 is borderline (just above 0.7 threshold)"
    rebuttal:
      - "Acknowledged in Section 5.3.2: α measures consistency, not validity; claim quality requires method comparison"
      - "Limitation acknowledged in Section 6.4 (L3); future work prioritizes method comparison"
      - "0.75 is solid acceptable range (0.7-0.8 = tentative agreement per Krippendorff); we do not claim high agreement (>0.8)"

# --- ROOT CAUSE CLAIMS ---

root_cause_claims:
  - claim_id: "RC1"
    statement: "Primary root cause: out-of-distribution generalization gap from SNLI/MNLI semantic similarity to factual verification"
    section: "Results (Section 5.2)"
    evidence_type: "mechanistic_explanation + literature_triangulation"
    validation_method: "Converging evidence from (1) uniform degradation across domains, (2) independent literature (Himal-Badu, Shaguns26), (3) sanity check failure on known examples"
    adversarial_strength: "MEDIUM"
    falsification_test: "IF alternative NLI models (RoBERTa-large-MNLI, TRUE) produce similar neutral-class dominance THEN H1 supported; IF not THEN model-specific issue"
    potential_objections:
      - "No ablation study testing alternative NLI models"
      - "Literature triangulation (GitHub repos) not peer-reviewed"
      - "Sanity check on 10 examples insufficient (small sample)"
    rebuttal:
      - "Acknowledged in Section 6.4 (L2); alternative models listed as future work (Section 6.5.1)"
      - "GitHub implementations (cavaquinho 1183 stars, HallucinoGenAI proven at scale) are production-validated; findings corroborate task-domain gap hypothesis"
      - "Sanity check intended as diagnostic not statistical test; shows model fails on simplest cases (correct vs incorrect answers)"

  - claim_id: "RC2"
    statement: "Contributory factors: claim decomposition quality (sentences ≠ logical propositions) and context pairing (full-text vs windowed)"
    section: "Results (Section 5.3, 5.4)"
    evidence_type: "mechanistic_explanation + plausibility_argument"
    validation_method: "Plausible mechanisms identified but NO ablation studies performed → requires future work"
    adversarial_strength: "LOW"
    falsification_test: "Ablation study comparing NLTK vs LLM vs Spacy extraction; full-text vs ±1/±2/±3 sentence windows"
    potential_objections:
      - "No empirical evidence for contributory role (just speculation)"
      - "Claim decomposition reliability (α=0.75) contradicts quality concerns"
      - "Context lengths (15-40 tokens) too short for truncation/dilution"
    rebuttal:
      - "Acknowledged as limitation (Section 6.4 L3, L4); explicitly framed as 'requires ablation to quantify' (Section 5.3.3, 5.4.3)"
      - "α measures consistency not validity; consistently extracted sentences may still fail to capture logical propositions"
      - "Truncation unlikely but attention dilution plausible; SNLI/MNLI training uses local pairs, factual verification requires long-range consistency"

  - claim_id: "RC3"
    statement: "Temperature/calibration unlikely to explain 50× magnitude gap (calibration typically improves 5-20%, not 50×)"
    section: "Results (Section 5.5)"
    evidence_type: "mechanistic_reasoning + magnitude_argument"
    validation_method: "Literature on calibration techniques (Guo et al. 2017) shows marginal improvements; 50× gap requires probability mass shift from 0.9→0.1 (implausible)"
    adversarial_strength: "MEDIUM"
    falsification_test: "Apply temperature scaling to NLI outputs → if ρ_j improves to 0.70-0.85 range, H4 supported; if remains <0.10, ruled out"
    potential_objections:
      - "No empirical test of calibration (ECE, reliability curves not measured)"
      - "Temperature scaling could shift neutral→entailment/contradiction more than expected"
      - "Dismisses H4 without evidence"
    rebuttal:
      - "Acknowledged as limitation (Section 6.4 L5); ECE measurement listed as future work but low priority"
      - "Magnitude argument: shifting 0.90→0.10 neutral mass requires T ~ 0.1, extreme relative to typical T=1-3 values in calibration literature"
      - "Not dismissed; ranked as 'unlikely primary cause' in root cause hierarchy (Section 5.6); contributory role acknowledged if combined with NLI fine-tuning"

# --- METHODOLOGICAL CLAIMS ---

methodological_claims:
  - claim_id: "MC1"
    statement: "CCP paper lacks critical implementation details: raw ρ_j distributions, NLI calibration diagnostics, claim decomposition methodology, context pairing strategies"
    section: "Discussion (Section 6.1)"
    evidence_type: "documentation_gap_analysis"
    validation_method: "Systematic review of CCP paper [arxiv:2403.04696] identifying missing details"
    adversarial_strength: "HIGH"
    falsification_test: "CCP paper authors provide implementation details → if match our implementation, strengthens claim; if differ, explains replication failure"
    potential_objections:
      - "Details may be in supplementary materials (not checked)"
      - "Standard practices may be assumed (don't need explicit documentation)"
      - "Authors may have provided code after paper publication"
    rebuttal:
      - "CCP paper has no supplementary materials on arXiv; no public code repository found via GitHub search"
      - "Reproducibility requires self-contained papers (Dodge et al. 2019); 'standard practices' vary across implementations (cavaquinho vs HallucinoGenAI use different aggregation functions)"
      - "Checked arXiv, GitHub, HuggingFace as of 2026-07-09; no official implementation available"

  - claim_id: "MC2"
    statement: "Measurement validity is prerequisite for hypothesis testing: cannot distinguish 'hypothesis wrong' from 'measurement broken' when ρ_j 50× outside expected range"
    section: "Introduction, Results (Section 5.7.2), Conclusion"
    evidence_type: "methodological_principle"
    validation_method: "Logical argument + analogy to microscope calibration"
    adversarial_strength: "HIGH"
    falsification_test: "None (methodological principle, not empirical claim)"
    potential_objections:
      - "Expected range (0.75-0.85) may be incorrect → measurement not actually broken"
      - "Hypothesis refutation still valid if measurement methodology is correct"
      - "Conflates implementation errors with measurement validity"
    rebuttal:
      - "Expected range inferred from CCP paper's +0.05-0.10 ROC-AUC claims; ρ_j must be >0.70 for hallucination detection to discriminate (otherwise all samples near 0.0)"
      - "Hypothesis refutation requires measurement in valid range; if both factual AND creative fail (no separation), cannot test domain-specific hypothesis"
      - "Implementation validated (Section 4.1); measurement validity ≠ implementation correctness; refers to whether metric captures intended construct (claim-type probability mass)"

  - claim_id: "MC3"
    statement: "Task-domain gap distinct from traditional domain shift: SNLI/MNLI semantic similarity ≠ factual verification, even when source task accuracy is high (92.38% SNLI)"
    section: "Results (Section 5.7.1)"
    evidence_type: "theoretical_distinction"
    validation_method: "Conceptual analysis: semantic similarity (sentence paraphrase) vs factual verification (claim-context consistency)"
    adversarial_strength: "MEDIUM"
    falsification_test: "Fine-tune DeBERTa-v3-base on FEVER/HotpotQA → if ρ_j improves to 0.70-0.85, task-domain gap confirmed; if not, alternative explanation needed"
    potential_objections:
      - "SNLI/MNLI contain factual entailment examples (not just paraphrase)"
      - "Task-domain gap vs domain shift distinction is semantic, not substantive"
      - "No empirical evidence for gap (just theoretical claim)"
    rebuttal:
      - "SNLI/MNLI contain some factual examples but majority are short-form semantic similarity (Bowman et al. 2015 analysis shows <30% require world knowledge)"
      - "Distinction is substantive: domain shift keeps task constant (NLI on medical vs news text); task-domain gap changes task objective (semantic similarity → factual verification)"
      - "Empirical signature observed: model SOTA on source task (92.38% SNLI) yet catastrophic failure on target (neutral-class dominance); consistent with task mismatch not domain vocabulary shift"

  - claim_id: "MC4"
    statement: "Baseline replication must precede domain transfer experiments to avoid conflating 'method doesn't work as described' with 'hypothesis is wrong'"
    section: "Discussion (Section 6.2, Practice 3), Conclusion"
    evidence_type: "methodological_recommendation"
    validation_method: "Lesson learned from failure mode analysis"
    adversarial_strength: "HIGH"
    falsification_test: "None (methodological recommendation, not empirical claim)"
    potential_objections:
      - "Adds overhead to research timeline (replication before extension)"
      - "Baseline replication may not catch all issues (e.g., domain-specific calibration needs)"
      - "Assumes baseline claims are reproducible (circular if they're not)"
    rebuttal:
      - "Overhead prevents costlier mistakes (our 4-week experiment produced no hypothesis test due to measurement failure; 1-week baseline validation would have caught issue)"
      - "Baseline replication catches measurement validity issues (ρ_j 50× too low); domain-specific calibration is EXTENSION not baseline"
      - "If baseline not reproducible, that IS the finding (replication failure documented as contribution, not bug)"

# --- RECOMMENDATIONS ---

recommendations:
  - rec_id: "R1"
    statement: "Hallucination detection papers should report raw metric distributions (min, median, max, variance), not just aggregate ROC-AUC"
    section: "Discussion (Section 6.3.1)"
    rationale: "Aggregate metrics hide measurement validity issues; our ρ_j 50× too low but still produces ranking"
    implementation: "Table with ρ_j statistics per dataset; NLI probability distributions over {contradiction, entailment, neutral}"
    adversarial_strength: "HIGH"
    potential_objections:
      - "Adds space burden to papers (already page-limited)"
      - "Raw distributions are dataset-specific (low generalizability)"
    rebuttal:
      - "Can be in appendix or supplementary materials; critical for reproducibility"
      - "Dataset-specific distributions enable readers to assess whether method achieves expected range on their own datasets"

  - rec_id: "R2"
    statement: "Validate NLI calibration on known factual verification examples (correct vs incorrect answers) before claiming hallucination detection improvements"
    section: "Discussion (Section 6.3.2)"
    rationale: "Off-the-shelf NLI models (SNLI/MNLI trained) may not generalize to factual verification; sanity check catches this"
    implementation: "Test NLI on 50-100 known entailment/contradiction examples from target domain; report P(entail|correct), P(contradict|incorrect)"
    adversarial_strength: "HIGH"
    potential_objections:
      - "Sanity check may not reflect full dataset complexity"
      - "Known examples may be cherry-picked (easy cases)"
    rebuttal:
      - "Sanity check is minimal validation not comprehensive test; full experiment tests complexity"
      - "Use stratified sampling from benchmark (TruthfulQA questions across categories); avoids cherry-picking"

  - rec_id: "R3"
    statement: "Document claim decomposition methodology with inter-method agreement (Krippendorff's α) and quality examples"
    section: "Discussion (Section 6.3.3)"
    rationale: "Claim quality affects ρ_j denominator stability; method comparison enables readers to assess bottleneck"
    implementation: "Report method used (NLTK/LLM/Spacy/manual), α between methods, 5-10 example claims with context"
    adversarial_strength: "MEDIUM"
    potential_objections:
      - "Inter-method agreement expensive (requires LLM extraction or manual annotation)"
      - "Examples may not be representative"
    rebuttal:
      - "LLM extraction via GPT-3.5 is cheap (<$1 for 100 samples); α computation is standard metric"
      - "Random sampling + manual inspection of 10 examples provides qualitative check; not claiming statistical representativeness"

  - rec_id: "R4"
    statement: "Provide public code repository with baseline replication notebook and unit tests on known examples"
    section: "Discussion (Section 6.3.4)"
    rationale: "CVS Health UQLM demonstrates feasibility (1183 stars, production-ready); absence of CCP code prevented implementation comparison"
    implementation: "GitHub repo with requirements.txt, one-command reproduction, unit tests on manually verified examples"
    adversarial_strength: "HIGH"
    potential_objections:
      - "Code maintenance burden (library version updates)"
      - "Proprietary models/data may prevent full reproducibility"
    rebuttal:
      - "Pin library versions (requirements.txt) + Docker for long-term stability; UQLM shows this is feasible"
      - "Open-source models (DeBERTa-v3-base, Llama-3-8B) + public datasets (TruthfulQA, FEVER) sufficient for hallucination detection research"

# --- ADVERSARIAL REVIEW PREPARATION ---

expected_objections:
  - objection_id: "O1"
    statement: "How do you know your implementation is correct if you can't reproduce baseline?"
    section_referenced: "Introduction, Conclusion"
    rebuttal: "Implementation validated via (1) static analysis (Section 4.1), (2) proven architecture patterns (cavaquinho, HallucinoGenAI), (3) runtime validation (no errors). Gap is in undocumented details (NLI fine-tuning, claim extraction method) not implementation correctness."
    strength: "STRONG"

  - objection_id: "O2"
    statement: "Why publish a negative result instead of fixing the issues and re-running?"
    section_referenced: "Introduction, Discussion (Section 6.2)"
    rebuttal: "Transparent failures prevent field-wide repetition of costly mistakes. We provide actionable recommendations (NLI fine-tuning on FEVER, claim method comparison, baseline validation protocol) that transform gate failure into methodological contribution."
    strength: "STRONG"

  - objection_id: "O3"
    statement: "Did you contact CCP authors for implementation details before claiming reproducibility failure?"
    section_referenced: "Discussion (Section 6.4 L7)"
    rebuttal: "Standard practice (Dodge et al. 2019, Belz et al. 2021) requires papers be self-contained for reproducibility. CCP paper has no public repository; our contribution documents the gap. Future researchers can use our findings + author clarification (if provided) to succeed."
    strength: "MEDIUM"

  - objection_id: "O4"
    statement: "Only tested one NLI model (DeBERTa-v3-base) - maybe others work fine?"
    section_referenced: "Discussion (Section 6.4 L2)"
    rebuttal: "Acknowledged as limitation; alternative models (RoBERTa-large-MNLI, TRUE) listed as future work (Section 6.5.1 Tier 1 Step 2). DeBERTa-v3-base chosen as SOTA on SNLI/MNLI (92.38% accuracy); if SOTA fails, weaker models unlikely to succeed."
    strength: "MEDIUM"

  - objection_id: "O5"
    statement: "Claim decomposition reliability (α=0.75) contradicts quality concerns - if reliable, why is quality a problem?"
    section_referenced: "Results (Section 5.3.2)"
    rebuttal: "α measures consistency (sentence boundaries reproducible), not validity (sentences capture logical claims). Explained in Section 5.3.2: 'α measures consistency, not validity; sentences may be consistently segmented but still fail to capture logical propositions.'"
    strength: "STRONG"

  - objection_id: "O6"
    statement: "Expected ρ_j range (0.75-0.85) is just your inference from CCP paper - maybe you inferred wrong?"
    section_referenced: "Experiments (Section 4.2)"
    rebuttal: "Inference based on CCP paper's +0.05-0.10 ROC-AUC claims over baselines. ROC-AUC improvements require ρ_j to discriminate correct vs incorrect samples (if all samples near 0.0, no ranking). Additionally, literature (cavaquinho, HallucinoGenAI) expects P(entail)+P(contradict) > 0.5 for NLI-based detection to work."
    strength: "MEDIUM"

# --- FALSIFIABILITY TESTS ---

falsifiability_tests:
  - test_id: "FT1"
    claim_tested: "QC1, QC2 (ρ_j 50× too low, no domain separation)"
    test_procedure: "Re-run h-e1 experiment with same configuration (seed=42, DeBERTa-v3-base, NLTK, TruthfulQA/WritingPrompts)"
    expected_outcome_if_claim_true: "ρ_j within ±0.005 of reported values (0.0354 factual, 0.0103 creative); p=1.0000 ±0.01"
    expected_outcome_if_claim_false: "ρ_j substantially different (e.g., 0.70-0.85 as expected) OR domain separation (p<0.05)"
    cost: "1 hour compute (A100 GPU) + environment setup"
    difficulty: "LOW"

  - test_id: "FT2"
    claim_tested: "QC3 (neutral-class dominance ~90%)"
    test_procedure: "Extract NLI probability distributions from DeBERTa-v3-base on claim-context pairs"
    expected_outcome_if_claim_true: "Mean P(neutral) = 0.91 ±0.05 (factual), 0.97 ±0.05 (creative)"
    expected_outcome_if_claim_false: "Mean P(neutral) < 0.5 (balanced probabilities across classes)"
    cost: "30 minutes (NLI inference)"
    difficulty: "LOW"

  - test_id: "FT3"
    claim_tested: "RC1 (out-of-distribution generalization gap)"
    test_procedure: "Fine-tune DeBERTa-v3-base on FEVER (5000 examples) → re-run h-e1"
    expected_outcome_if_claim_true: "ρ_j improves to 0.70-0.85 range on factual domain after fine-tuning"
    expected_outcome_if_claim_false: "ρ_j remains <0.10 even after fine-tuning (alternative root cause needed)"
    cost: "1-2 weeks (fine-tuning + re-experiment)"
    difficulty: "MEDIUM"

  - test_id: "FT4"
    claim_tested: "RC2 (claim decomposition contributory)"
    test_procedure: "Compare ρ_j distributions for NLTK vs GPT-3.5 extraction vs Spacy dependency parsing"
    expected_outcome_if_claim_true: "ρ_j varies significantly across methods (e.g., GPT-3.5 produces 0.20-0.40 vs NLTK 0.01-0.04)"
    expected_outcome_if_claim_false: "ρ_j similar across methods (<0.05 difference) → claim decomposition not contributory"
    cost: "3-5 days (LLM API calls + re-metric computation)"
    difficulty: "MEDIUM"

  - test_id: "FT5"
    claim_tested: "MC3 (task-domain gap SNLI/MNLI→factual verification)"
    test_procedure: "Test alternative NLI models (RoBERTa-large-MNLI, TRUE factuality model) → measure neutral-class mass"
    expected_outcome_if_claim_true: "All SNLI/MNLI-trained models show neutral dominance; TRUE (factual-specific) does not"
    expected_outcome_if_claim_false: "Alternative models achieve ρ_j>0.70 → DeBERTa-v3-base specific issue, not task-domain gap"
    cost: "1 week (model testing)"
    difficulty: "LOW-MEDIUM"

