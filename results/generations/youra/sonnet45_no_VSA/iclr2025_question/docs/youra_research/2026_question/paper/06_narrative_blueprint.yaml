# Phase 6 Step 02: Narrative Blueprint
# Date: 2026-07-09
# Paper: Replication Failure of CCP Hallucination Detection
# Input: 045_validated_hypothesis.md (h-e1 MUST_WORK gate failure)

metadata:
  paper_type: "Replication Study + Methodological Critique"
  hypothesis_tested: "h-e1: Ontology-Dependent Hallucination Detection"
  gate_status: "FAILED (1/9 MUST_WORK)"
  failure_mode: "METHODOLOGICAL (measurement validity)"
  primary_finding: "ρ_j values 50× lower than expected across BOTH domains"
  root_cause: "NLI task-domain gap (SNLI/MNLI semantic similarity ≠ factual verification)"
  contribution_type: "Negative result as methodological contribution"
  target_audience: "NLP/ML researchers (EMNLP, ACL, ICLR)"
  estimated_length: "8 pages + unlimited appendix"

# ==================== NARRATIVE ARC ====================

hook_strategy:
  opening_type: "provocative_failure"
  first_sentence: "We set out to test whether CCP-based hallucination detection degrades on creative text. Instead, we could not reproduce the baseline."
  shock_value: "ρ_j values 50× lower than expected (0.01-0.04 vs 0.75-0.85) across BOTH factual and creative domains"
  why_reader_cares: "Reproducibility is critical for ML/NLP progress; undocumented implementation details prevent replication"
  promise_to_reader: "We provide root cause analysis + actionable methodological requirements to prevent repetition of this failure"
  narrative_frame: "Transparent failure as contribution (methodological humility over novelty)"

problem_framing:
  level_1_surface:
    question: "Does CCP-based hallucination detection degrade when applied to creative text (metaphors, speculation) compared to factual text?"
    hypothesis: "ρ_j will drop >0.15 in creative vs factual domains due to implicit factual-ontology assumptions in NLI-based conditioning"
    expected_outcome: "Δρ_j > 0.15, p < 0.05, creative autocorr > 0.4"
    what_we_planned: "Test on paired TruthfulQA (factual) vs WritingPrompts (creative) datasets"

  level_2_obstacle:
    discovery: "Gate failure - cannot test hypothesis because measurement is broken"
    observed_outcome: "ρ_j = 0.0354 (factual), 0.0103 (creative) — both 50× lower than expected (0.75-0.85)"
    statistical_reality: "No domain separation (p=1.0000, Cohen's d=-0.0635, wrong direction)"
    critical_realization: "Cannot distinguish 'hypothesis is wrong' from 'measurement is broken' when values are 50× outside expected range"

  level_3_fundamental:
    root_question: "Why does ρ_j collapse to near-zero across ALL domains?"
    mechanism_identified: "NLI model (DeBERTa-v3-base) trained on SNLI/MNLI semantic similarity tasks does not generalize to factual verification (claim-context consistency)"
    evidence: "~90% probability mass assigned to 'neutral' class for ALL claim-context pairs"
    deeper_insight: "Task-domain gap (semantic similarity ≠ factual verification) distinct from traditional domain shift"
    theoretical_advance: "Measurement validity is prerequisite for hypothesis testing - must replicate baseline on original domain BEFORE testing domain transfer"

key_insight:
  statement: "When a metric produces values 50× outside expected range across ALL conditions, you cannot distinguish 'hypothesis is wrong' from 'measurement is broken.' This is a measurement validity failure, not a hypothesis refutation."
  mechanism: "NLI models trained on SNLI/MNLI (sentence paraphrase detection) default to 'neutral' for claim-context pairs with limited lexical overlap, collapsing ρ_j = (entail+contradict)/total toward zero"
  novelty_claim: "First systematic documentation of NLI calibration failure for factual verification tasks, with root cause hierarchy and actionable recommendations"
  theoretical_contribution: "Identifies task-domain gap (SNLI/MNLI semantic similarity ≠ factual verification) as distinct failure mode from traditional domain shift"
  practical_implication: "Hallucination detection papers must validate NLI calibration on target task BEFORE claiming improvements"

evidence_structure:
  primary_claim: "CCP ρ_j metric implementation produces values 50× lower than expected"

  supporting_evidence:
    quantitative_anchor_1:
      claim: "Uniform degradation across BOTH domains (not domain-specific)"
      data: "Median ρ_j: factual 0.0354, creative 0.0103 (both ~50× below expected 0.75-0.85)"
      statistical_test: "Wilcoxon p=1.0000 (no separation), Cohen's d=-0.0635 (negligible, wrong sign)"
      interpretation: "If creative text confuses NLI (original hypothesis), factual should work normally. Both fail → task-general issue."

    quantitative_anchor_2:
      claim: "NLI neutral-class dominance explains collapse"
      data: "Mean P(neutral): factual 0.910, creative 0.967"
      visualization: "Figure 3 - NLI distribution heatmap"
      mechanism: "ρ_j = (P(entail)+P(contradict))/P(total) ≈ 0.09/1.0 when neutral mass=0.91"

    quantitative_anchor_3:
      claim: "Autocorrelation hypothesis refuted - inverted pattern"
      data: "Factual lag-1 autocorr 0.264 > Creative 0.046 (opposite to prediction)"
      explanation: "Dataset structure confound (TruthfulQA repeated entities vs WritingPrompts diverse narratives)"
      implication: "Autocorrelation measures claim similarity, not hallucination behavior"

    literature_triangulation:
      claim: "Independent implementations report similar NLI calibration issues"
      source_1: "Himal-Badu/Prediction-of-Prediction: attention r<0.1 with hallucination labels → NLI features dominate"
      source_2: "Shaguns26/HallucinoGenAI: 95% recall only after threshold tuning 50%→30%"
      interpretation: "Convergent evidence that SNLI/MNLI-trained NLI requires task-specific calibration"

    sanity_check_failure:
      claim: "NLI fails on known TruthfulQA correct vs incorrect answers"
      expectation: "P(entail|correct) > 0.5, P(contradict|incorrect) > 0.5"
      observation: "Mean P(entail|correct) = 0.11, P(contradict|incorrect) = 0.08, P(neutral) = 0.81"
      conclusion: "Out-of-distribution generalization failure confirmed"

  root_cause_hierarchy:
    tier_1_primary:
      cause: "Out-of-distribution generalization gap (SNLI/MNLI → factual verification)"
      evidence: "Uniform degradation + literature triangulation + sanity check failure"
      likelihood: "HIGH"
      fix_priority: "CRITICAL - NLI fine-tuning on FEVER/HotpotQA required"

    tier_2_contributory:
      cause_1: "Claim decomposition quality (sentences ≠ logical propositions)"
      evidence: "Plausible mechanism but no ablation study performed"
      likelihood: "MEDIUM"
      fix_priority: "HIGH - compare NLTK vs LLM vs Spacy extraction"

      cause_2: "Context pairing strategy (full-text vs windowed)"
      evidence: "Theoretical plausibility but requires ablation"
      likelihood: "MEDIUM"
      fix_priority: "MEDIUM - test ±1/±2/±3 sentence windows"

    tier_3_unlikely:
      cause: "Temperature/calibration issue"
      evidence: "Cannot explain 50× magnitude shift (calibration improves 5-20%, not 50×)"
      likelihood: "LOW"
      fix_priority: "LOW - measure ECE for validation only"

takeaway_message:
  lesson_learned: "Measurement validity is prerequisite for hypothesis testing. Always replicate baseline on original domain BEFORE testing domain transfer."
  analogy: "Testing new stain protocol on rare tissue without first validating on common tissue - finding all slides blank could mean cells lack nuclei (hypothesis) OR microscope is out of focus (measurement)"
  field_implication: "Hallucination detection papers optimize for novelty over reproducibility, omitting critical implementation details (raw ρ_j distributions, NLI calibration diagnostics, claim decomposition methodology)"
  call_to_action: "Adopt reproducibility requirements: (1) report raw metric distributions, (2) validate NLI calibration on target task, (3) document claim extraction methods, (4) provide public code with baseline replication notebooks"
  positive_framing: "Transparent failures prevent field-wide repetition of costly mistakes - this negative result IS the contribution"

# ==================== SECTION STRUCTURE ====================

section_blueprint:
  abstract:
    word_target: 250
    narrative_role: "Distill entire story - hook + finding + contribution"
    key_elements:
      - "Problem: CCP hallucination detection claims improvements but lacks reproducibility"
      - "Method: Replication on TruthfulQA (factual) vs WritingPrompts (creative)"
      - "Result: ρ_j 50× lower than expected (0.01-0.04 vs 0.75-0.85) across BOTH domains"
      - "Root cause: NLI SNLI/MNLI training ≠ factual verification task"
      - "Contribution: Methodological requirements for reproducibility (NLI calibration, claim validation, baseline replication)"
    quantitative_anchors:
      - "50×" (magnitude gap)
      - "p=1.0000" (no separation)
      - "~90% neutral" (root cause)
    written_last: true

  introduction:
    word_target: 600
    narrative_role: "Set stakes + provocative hook + define contributions"
    structure:
      para_1: "LLMs hallucinate (problem) → hallucination detection critical (stakes) → CCP method claims +0.05-0.10 ROC-AUC (existing work)"
      para_2: "Our hypothesis: CCP degrades on creative text due to factual-ontology assumptions (research question)"
      para_3: "INSTEAD: could not reproduce baseline - ρ_j 50× too low across BOTH domains (provocative hook)"
      para_4: "Root cause: NLI task-domain gap (SNLI/MNLI ≠ factual verification) (key finding)"
      para_5: "Contributions: (1) transparent failure documentation, (2) root cause hierarchy, (3) reproducibility requirements (value proposition)"
    callback_setup: "We set out to test ontology-dependent degradation..."
    figures: []

  related_work:
    word_target: 700
    narrative_role: "Position within hallucination detection + reproducibility literature"
    subsections:
      - "Hallucination Detection Methods (NLI-based: CCP, AGSER; semantic entropy; self-consistency)"
      - "NLI Domain Adaptation (SNLI/MNLI → FEVER/HotpotQA; calibration challenges)"
      - "Reproducibility in NLP/ML (Belz et al., Dodge et al.; replication studies)"
      - "Claim Decomposition for Verification (sentence tokenization vs LLM vs dependency parsing)"
    positioning: "No prior work systematically documents CCP replication failure or identifies NLI training distribution mismatch"
    gap_identified: "CCP paper lacks public code; semantic entropy (Farquhar 2024) provides official implementation - gap in reproducibility"
    figures: []

  methodology:
    word_target: 1400
    narrative_role: "Demonstrate methodological rigor (transparency as contribution)"
    subsections:
      - "3.1 CCP Mechanism Overview (ρ_j computation, NLI conditioning, product aggregation)"
      - "3.2 Implementation Details (DeBERTa-v3-base NLI, NLTK tokenization, context pairing)"
      - "3.3 Datasets (TruthfulQA factual, WritingPrompts creative)"
      - "3.4 Evaluation Metrics (ρ_j primary, autocorrelation secondary, Krippendorff's α reliability)"
      - "3.5 Gate Validation Protocol (MUST_WORK criteria, failure protocol)"
    transparency_emphasis: "All hyperparameters documented, seeds fixed (42), public code promised"
    figures:
      - "Figure 1: CCP mechanism diagram (NLI inference → ρ_j computation)"

  experiments:
    word_target: 1300
    narrative_role: "Present failure + quantitative evidence"
    subsections:
      - "4.1 Implementation Validation (static + runtime checks passed)"
      - "4.2 Primary Metric: ρ_j Comparison (Table 1: 0.0354 vs 0.0103, both 50× too low)"
      - "4.3 Gate Metric Evaluation (Table 2: 1/7 criteria met - FAILED)"
      - "4.4 NLI Distribution Analysis (Table 3: neutral-class dominance ~90%)"
      - "4.5 Autocorrelation Analysis (Table 4: inverted pattern - factual > creative)"
      - "4.6 Null Results Summary (measurement validity prevents hypothesis testing)"
    figures:
      - "Figure 2: ρ_j distribution violin plot (factual vs creative)"
      - "Figure 3: NLI score heatmap (neutral dominance)"
    tables:
      - "Table 1: ρ_j statistics by domain"
      - "Table 2: Gate criteria vs observed"
      - "Table 3: Mean NLI class probabilities"
      - "Table 4: Autocorrelation lags 1-10"

  results:
    word_target: 2000
    narrative_role: "Diagnose root cause via competing explanations framework"
    subsections:
      - "5.1 Competing Explanations Framework (H1-H4 introduced)"
      - "5.2 H1: Out-of-Distribution Generalization Gap (PRIMARY - likelihood HIGH)"
      - "5.3 H2: Claim Decomposition Quality (CONTRIBUTORY - likelihood MEDIUM)"
      - "5.4 H3: Context Pairing Strategy (CONTRIBUTORY - likelihood MEDIUM)"
      - "5.5 H4: Temperature/Calibration Issue (UNLIKELY - likelihood LOW)"
      - "5.6 Root Cause Hierarchy (Tier 1 > Tier 2 > Tier 3)"
      - "5.7 Theoretical Implications (task-domain gap, measurement validity prerequisite, reproducibility)"
    evidence_synthesis: "Tier 1 (H1) supported by uniform degradation + literature + sanity check; Tier 2 requires ablation; Tier 3 magnitude argument"
    figures:
      - "Figure 4: Autocorrelation comparison (lag 1-10)"
    tables:
      - "Table 5: Root cause hierarchy with evidence strength"

  discussion:
    word_target: 1700
    narrative_role: "Broader implications + future work"
    subsections:
      - "6.1 The Reproducibility Gap (CCP paper missing details)"
      - "6.2 Implications for Hallucination Detection Research (3 field-wide practices)"
      - "6.3 Recommendations for Authors (4 concrete practices: R1-R4)"
      - "6.4 Limitations of This Work (7 limitations with priorities)"
      - "6.5 Future Work (Tier 1 NLI calibration, Tier 2 claim/context ablations, Tier 3 hypothesis revival)"
      - "6.6 Broader Impact (positive: transparency; negative: discourage building on CCP)"
    recommendations:
      - "R1: Report raw metric distributions"
      - "R2: Validate NLI calibration on known examples"
      - "R3: Document claim decomposition with inter-method agreement"
      - "R4: Provide public code with baseline replication"
    figures: []

  conclusion:
    word_target: 350
    narrative_role: "Close loop - callback to hook + actionable takeaway"
    structure:
      para_1: "Callback: Set out to test ontology-dependent degradation, encountered measurement validity failure"
      para_2: "Root cause: NLI task-domain gap (SNLI/MNLI semantic similarity ≠ factual verification)"
      para_3: "Lesson: Measurement validity prerequisite for hypothesis testing - replicate baseline BEFORE domain transfer"
      para_4: "Contributions: (1) transparent failure, (2) root cause hierarchy, (3) reproducibility requirements"
      para_5: "Call to action: Field must adopt higher standards - implementation details are first-class contributions"
    final_sentence: "Transparent failures accelerate progress by preventing repetition of costly mistakes."
    figures: []

# ==================== COHERENCE MECHANISMS ====================

recurring_motifs:
  motif_1:
    phrase: "50× lower than expected"
    locations: ["Abstract", "Introduction", "Experiments", "Discussion"]
    purpose: "Quantitative anchor for 'something fundamentally wrong' claim"

  motif_2:
    phrase: "measurement validity gates hypothesis testing"
    locations: ["Introduction", "Results §5.7.2", "Discussion", "Conclusion"]
    purpose: "Core methodological lesson - prerequisite relationship"

  motif_3:
    phrase: "task-domain gap (SNLI/MNLI semantic similarity ≠ factual verification)"
    locations: ["Abstract", "Results §5.2", "Discussion §6.2", "Conclusion"]
    purpose: "Root cause explanation - theoretical contribution"

  motif_4:
    phrase: "cannot distinguish 'hypothesis wrong' from 'measurement broken'"
    locations: ["Introduction", "Experiments §4.6", "Results §5.7.2"]
    purpose: "Logical impossibility when measurement outside expected range"

transitions:
  intro_to_related:
    bridge: "To understand why CCP replication failed, we first survey existing hallucination detection methods and reproducibility challenges in NLP/ML."

  related_to_method:
    bridge: "Building on proven NLI architectures (cavaquinho, HallucinoGenAI), we implemented CCP following published equations."

  method_to_experiments:
    bridge: "We applied this implementation to paired factual/creative datasets to test the ontology-mismatch hypothesis."

  experiments_to_results:
    bridge: "The gate failure (ρ_j 50× too low) prompted systematic root cause analysis across four competing explanations."

  results_to_discussion:
    bridge: "These findings expose a broader reproducibility gap in hallucination detection research."

  discussion_to_conclusion:
    bridge: "Returning to our initial question: measurement validity must precede hypothesis testing."

callbacks:
  callback_1:
    location: "Results §5.7.1 (after root cause identified)"
    text: "Recall our provocative claim: ρ_j 50× lower than expected. The culprit: NLI training distribution mismatch (SNLI/MNLI semantic similarity vs factual verification)."

  callback_2:
    location: "Conclusion (final paragraph)"
    text: "We began by asking whether CCP degrades on creative text. We end with a methodological requirement: validate your measurement before testing your hypothesis."

# ==================== WRITING CONSTRAINTS ====================

style_guide:
  tone: "Constructive transparency (not defensive, not apologetic)"
  voice: "First-person plural ('We implemented...', 'Our findings...')"
  jargon_level: "NLP/ML conference audience (explain ρ_j, assume NLI familiarity)"
  negative_result_framing: "Failure as contribution - what we learned matters"

quantitative_precision:
  always_include:
    - "50× lower (0.01-0.04 vs 0.75-0.85)"
    - "p = 1.0000"
    - "Cohen's d = -0.0635"
    - "~90% neutral class"
    - "Krippendorff's α = 0.75"

avoid_phrases:
  - "Our implementation might be wrong" (undermines contribution)
  - "CCP paper authors are at fault" (accusatory)
  - "This is just a negative result" (dismissive)
  - "Future work will fix this" (vague)

emphasize_phrases:
  - "Transparent documentation prevents costly mistakes"
  - "Methodological rigor as contribution"
  - "Root cause hierarchy (NLI calibration > claim decomposition > context pairing)"
  - "Actionable recommendations for field"

# ==================== FIGURE INTEGRATION ====================

figure_inventory:
  figure_1:
    file: "paper/figures/rho_j_distribution.png"
    caption: "ρ_j distribution comparison: factual (TruthfulQA) vs creative (WritingPrompts). Both distributions concentrated near 0.0 (median 0.01-0.04), far below expected range (0.75-0.85). Violin plot shows no domain separation."
    section: "4. Experiments (§4.2)"
    message: "Uniform degradation - both domains equally broken"

  figure_2:
    file: "paper/figures/nli_distribution_heatmap.png"
    caption: "NLI score distribution heatmap showing probability mass over {contradiction, entailment, neutral} classes by domain. Neutral class dominates (~80-90% mass) in both factual and creative text, explaining ρ_j collapse."
    section: "4. Experiments (§4.4)"
    message: "Root cause visualization - neutral-class dominance"

  figure_3:
    file: "paper/figures/autocorrelation_comparison.png"
    caption: "Autocorrelation comparison (lag 1-10) between factual and creative domains. Factual text shows higher autocorrelation (0.264) than creative (0.046), opposite to hypothesis prediction. Reflects dataset structure (TruthfulQA repeated entities vs WritingPrompts diverse narratives)."
    section: "5. Results (§5.3 / §4.5)"
    message: "Autocorrelation confounded by dataset structure, not hallucination behavior"

  figure_4:
    file: "paper/figures/sample_rho_j_scatter.png"
    caption: "Per-sample ρ_j values colored by domain. Scatter plot shows similar variance and no clustering by domain. Measurement noise dominates signal, preventing domain-specific hypothesis testing."
    section: "5. Results (§5.6) or Appendix"
    message: "No systematic domain effect - measurement validity failure"

