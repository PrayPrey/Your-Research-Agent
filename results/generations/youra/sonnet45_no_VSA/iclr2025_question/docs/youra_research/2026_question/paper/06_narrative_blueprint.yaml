# ==================== GROUND TRUTH EXTRACTION PLAN ====================

ground_truth_extraction:
  purpose: "Extract falsifiable claims for Phase 6.5 adversarial review"
  categories:
    quantitative:
      - "QC1: ρ_j 50× lower (direct measurement)"
      - "QC2: No domain separation (statistical test)"
      - "QC3: Neutral-class dominance (NLI outputs)"
      - "QC4: Autocorrelation inverted (lag analysis)"
      - "QC5: Krippendorff's α reliability (inter-method)"

    root_cause:
      - "RC1: OOD generalization gap (literature triangulation)"
      - "RC2: Claim decomposition contributory (plausibility)"
      - "RC3: Temperature unlikely (magnitude argument)"

    methodological:
      - "MC1: CCP paper lacks implementation details (documentation gap)"
      - "MC2: Measurement validity prerequisite (logical principle)"
      - "MC3: Task-domain gap vs domain shift (theoretical distinction)"
      - "MC4: Baseline replication before transfer (methodological recommendation)"

  adversarial_strength:
    high: "Quantitative anchors (QC1-QC5), methodological principles (MC2, MC4)"
    medium: "Root cause explanations (RC1-RC3), theoretical claims (MC3)"
    low: "Contributory factors without ablation (RC2)"

  falsifiability_tests:
    - "FT1: Re-run h-e1 → should reproduce ρ_j within ±0.005"
    - "FT2: Extract NLI distributions → should confirm neutral ~90%"
    - "FT3: Fine-tune on FEVER → if ρ_j improves to 0.70-0.85, RC1 confirmed"
    - "FT4: Compare NLTK vs LLM extraction → if ρ_j differs >0.05, RC2 confirmed"
    - "FT5: Test alternative NLI models → if all show neutral dominance, task-domain gap confirmed"

