experiment:
  id: "h-e1"
  name: "Structural Documentation Completeness Correlation"
  type: "EXISTENCE"
  gate_type: "MUST_WORK"

data_collection:
  target_n: 1000
  min_submissions: 5
  date_range:
    start: "2019-01-01"
    end: "2024-12-31"

feature_engineering:
  documentation_files:
    env_files:
      - "requirements.txt"
      - "environment.yml"
      - "Pipfile"
    dockerfiles:
      - "Dockerfile"
  pinned_deps_threshold: 0.5

analysis:
  random_seed: 42
  spearman:
    alpha: 0.01
    target_rho: 0.3
  logistic_regression:
    max_iter: 1000
    target_or: 1.5
  bootstrap:
    n_iterations: 1000
    confidence_level: 0.95

visualization:
  dpi: 300
  figure_format: "png"
  style: "seaborn-v0_8"
