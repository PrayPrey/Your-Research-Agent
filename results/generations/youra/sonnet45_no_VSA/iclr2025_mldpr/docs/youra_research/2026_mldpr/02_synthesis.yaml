synthesis:
  emerged_consensus:
    - theme: "Foundation Hypothesis Shift"
      consensus: |
        Shift from causal mechanism modeling to prevalence measurement as foundation.
        Prof. Vera established falsifiable prevalence hypothesis (≤40% vs ≥70% compliance)
        with explicit power calculation (N=150 → 100 after Prof. Pax feasibility check).
      rationale: "Prior failures (h-e1 run 2) show foundation must be established before mechanisms"

    - theme: "Sampling Frame Correction"
      consensus: |
        Use HuggingFace Datasets Hub instead of Papers with Code to avoid h-da2's
        sampling error (frameworks vs datasets) and external API dependency failure.
      evidence: "Oreamuno 2024 used HuggingFace successfully, local datasets library available"

    - theme: "Temporal Alignment Protocol"
      consensus: |
        3-tier fallback for T0 definition: (1) GitHub release tag, (2) first dataset
        commit, (3) repo creation date. Missingness coded as governance proxy.
      rationale: "h-da2 taught us artificial dates cause 100% T0 extraction failure"

    - theme: "Measurement Simplification"
      consensus: |
        Use 3-component DCS subset from Rondina 2025 rubric instead of full 14
        components to avoid multicollinearity (h-e1 run 2 VIF >5 lesson).
      components: ["Data collection context", "Preprocessing transparency", "Licensing clarity"]

    - theme: "Mechanism Test Adaptation"
      consensus: |
        Replace 60-day RCT with cross-sectional activity-DCS correlation due to
        Phase 4 timeline constraints (~2-4 weeks). Prof. Pax established feasibility.
      trade_off: "Correlation not causation - RCT design documented for future work"

  key_disagreements_resolved:
    - topic: "Sample Size"
      positions:
        prof_vera: "N=150 for stratification capability"
        prof_pax: "N=100 sufficient (power=0.75), lower implementation cost"
      resolution: "N=100 accepted (still powered, faster execution)"

    - topic: "Sampling Platform"
      positions:
        prof_vera: "Papers with Code (PwC) for dataset-paper linkage"
        prof_pax: "HuggingFace to avoid h-da2's external API failure"
      resolution: "HuggingFace primary, PwC pilot can validate in parallel if needed"

    - topic: "DCS Complexity"
      positions:
        prof_vera: "Full 14-component for factor analysis validation"
        prof_pax: "3-component MVP for 8-hour coding budget"
      resolution: "3-component MVP, full rubric expansion in Phase 2+ if MVP succeeds"

  design_decisions:
    - decision: "Falsifiable prevalence hypothesis as foundation"
      rationale: "h-e1 run 2 showed mechanism tests fail without established foundation"
      gate: "MUST_WORK: 95% CI upper < 60% compliance"

    - decision: "HuggingFace as sampling frame"
      rationale: "Local API (no Wayback dependency), proven in Oreamuno 2024"
      implementation: "datasets library + GitHub API"

    - decision: "DCS_3 measurement at T0 + 90 days"
      rationale: "Temporal precedence (novelty) + feasibility (manual coding 8h)"
      validation: "Inter-rater reliability κ ≥ 0.70 required"

    - decision: "Cross-sectional mechanism proxy"
      rationale: "60-day RCT infeasible in Phase 4 timeline"
      future_work: "RCT protocol documented for Phase 6 Discussion"

  prior_failure_learnings_applied:
    - failure: "h-da2 run 1"
      lesson: "Sample correct population, use real temporal metadata, avoid single-point API failure"
      application: "HuggingFace datasets (not frameworks), GitHub tags (not artificial dates), local library (not Wayback)"

    - failure: "h-e1 run 1"
      lesson: "Semantic embeddings ≠ clustering quality"
      application: "Direct documentation measurement (DCS_3), no proxy metrics"

    - failure: "h-e1 run 2"
      lesson: "N=100 insufficient with multicollinearity, foundation before mechanisms"
      application: "3-component DCS (low correlation), prevalence before causal test"

    - failure: "h-m-integrated run 1"
      lesson: "Predict effect direction correctly"
      application: "Activity → higher DCS (positive correlation predicted)"

    - failure: "h-m1 & h-m3 limitations"
      lesson: "Verify data availability before Phase 4"
      application: "HuggingFace metadata confirmed, GitHub API confirmed, Rondina rubric published"

