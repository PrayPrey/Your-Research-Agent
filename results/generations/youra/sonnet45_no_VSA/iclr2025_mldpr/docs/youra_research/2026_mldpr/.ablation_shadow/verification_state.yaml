main_hypothesis:
  id: h-doc-prevalence
  title: ML Dataset Documentation Gap - Prevalence and Community Pressure Mechanism
  statement: Among ML dataset repositories on HuggingFace created 2022–2024 with ≥10 stars, ≤40% achieve a Documentation Completeness
    Score (DCS_3) ≥ 80% within 90 days of first release, demonstrating a significant framework-to-practice compliance gap
    despite the existence of standardized documentation frameworks.
  defined_in: 03_refinement.yaml
