    dataset: HuggingFace Datasets Hub
    model: Documentation Completeness Score (DCS_3)
    optimizer: null
    hyperparameters:
      sampling_frame: 2022-2024, ≥10 stars
      target_n: 100
      stratification: by year
      measurement_timepoint: T0 + 90 days
