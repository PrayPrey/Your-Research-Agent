  exchange_count: 2
  discussion_log: "discussion_log.md"

hypothesis:
  id: "h-doc-prevalence"
  title: "ML Dataset Documentation Gap - Prevalence and Community Pressure Mechanism"
  version: 1

  core_statement: |
    Among ML dataset repositories on HuggingFace created 2022–2024 with ≥10 stars,
    ≤40% achieve a Documentation Completeness Score (DCS_3) ≥ 80% within 90 days
    of first release, demonstrating a significant framework-to-practice compliance
    gap despite the existence of standardized documentation frameworks.

  mechanism: |
    Repository community engagement drives documentation quality. Repositories with
    higher activity levels (commits/month, contributors, issue responsiveness) exhibit
    significantly higher DCS_3 scores (Spearman ρ ≥ 0.30, p < 0.05), suggesting
    documentation gaps arise from lack of community pressure rather than framework
    inadequacy.

  variables:
    independent:
      - name: "repository_period"
        type: "categorical"
        values: ["2022", "2023", "2024"]
      - name: "platform"
        type: "categorical"
        values: ["HuggingFace"]
      - name: "visibility_threshold"
        type: "numeric"
        value: 10
        unit: "stars"

    dependent_primary:
      name: "DCS_3"
      type: "numeric"
      range: [0.0, 3.0]
      threshold: 2.4
      components:
        - "Data collection context documentation"
        - "Preprocessing transparency"
        - "Licensing clarity"

    mechanism_variables:
      - name: "commits_per_month"
        type: "numeric"
        unit: "count"
      - name: "unique_contributors"
        type: "numeric"
        unit: "count"
      - name: "median_issue_response_time"
        type: "numeric"
        unit: "days"

    temporal:
      - name: "T0"
        definition: "First release tag OR first dataset commit OR repo creation"
        priority: ["release_tag", "dataset_commit", "repo_creation"]
      - name: "T_plus_90"
        definition: "90 days post-T0 (DCS measurement window)"

  assumptions:
    - id: "sampling_validity"
      statement: "HuggingFace datasets 2022-2024 represent contemporary ML dataset publishing"
      criticality: "high"

    - id: "dcs_proxy"
      statement: "3-component subset adequately captures documentation completeness"
      evidence: "Rondina 2025 factor analysis"
      criticality: "medium"

    - id: "temporal_alignment"
      statement: "GitHub metadata provides sufficient temporal precision for T0"
      fallback_tiers: 3
      criticality: "high"

    - id: "activity_proxy"
      statement: "Cross-sectional correlation is valid proxy for community pressure"
      limitation: "Correlation not causation - RCT deferred to future work"
      criticality: "medium"

    - id: "measurement_stability"
      statement: "DCS remains stable within 90-day window"
      criticality: "medium"

  null_hypotheses:
    existence:
      H0: "≥70% of sampled repositories achieve DCS_3 ≥ 2.4 within 90 days"
      H1: "≤40% achieve compliance"

    mechanism:
      H0: "Spearman ρ (activity, DCS_3) ≤ 0.10 or p ≥ 0.05"
      H1: "ρ ≥ 0.30 and p < 0.05"

  predictions:
    - id: "prevalence_quantitative"
      type: "point_estimate"
      value: 0.35
      confidence_interval: [0.26, 0.44]
      gate_criterion: "CI upper bound < 0.60"

    - id: "component_breakdown"
      type: "distribution"
      components:
        data_context: 0.25
        preprocessing: 0.40
        licensing: 0.50
      note: "Based on Rondina 2025 empirical findings"

    - id: "mechanism_correlation"
      type: "correlation"
      statistic: "Spearman_rho"
      range: [0.35, 0.45]
      p_value: "< 0.01"
      control_variable: "repository_age"

    - id: "temporal_pattern"
      type: "time_series"
      comparison: "T_plus_30 vs T_plus_90"
      expected_change: "< 5%"
      interpretation: "Documentation front-loaded, not iteratively improved"

  novelty:
    - contribution: "Temporal Precedence Validation"
      description: |
        First study to measure documentation at T0 + 90 days, establishing temporal
        precedence for "documentation at release" vs "current state"
      baseline: "Rondina 2025, Oreamuno 2024 used cross-sectional snapshots"

    - contribution: "Feasibility-Grounded Design"
      description: |
        First hypothesis to explicitly learn from 6 prior implementation failures
        in this pipeline (h-da2, h-e1 runs 1-2, h-m-integrated, h-m1, h-m3)
      validation: "Implementation-validated before hypothesis formation"

    - contribution: "Community Pressure Mechanism Test"
      description: |
        First empirical test of voluntary adoption inertia using observable activity
        proxies instead of unobservable incentive structures
      bridges: "Documentation studies + software engineering process metrics"

  scope:
    in_scope:
      - "ML dataset repositories on HuggingFace (2022-2024, ≥10 stars)"
      - "Documentation completeness at T0 + 90 days"
      - "3-component DCS measurement"
      - "Cross-sectional activity-DCS correlation"

    out_of_scope:
      - "Other platforms (Papers with Code, OpenML, Zenodo)"
      - "Full 14-component Rondina rubric (Phase 2 expansion)"
      - "Longitudinal tracking (>90 days)"
      - "Randomized intervention (RCT for causality)"
      - "Enforcement mechanism testing"
      - "Framework comparison (Model Cards vs Datasheets)"

    exclusions:
      - "Code repositories without dataset artifacts"
      - "Private/restricted datasets"
      - "Repositories with <10 stars"
      - "Pre-2022 repositories"

experimental_design:
  study_type: "Cross-sectional observational with retrospective temporal validation"

  sample:
    platform: "HuggingFace Datasets Hub"
    sampling_frame: "All dataset repos created 2022-01-01 to 2024-12-31, ≥10 stars"
    target_n: 100
    power_analysis:
      power: 0.75
      alpha: 0.05
      effect_size: "0.70 vs 0.40 proportion difference"
    stratification: "By year (2022, 2023, 2024) to control temporal trends"

  data_collection:
    repository_metadata:
      source: "datasets library + GitHub API"
      variables:
        - "creation_date"
        - "stars"
        - "contributors"
        - "commits"
        - "issues"
        - "first_release_tag_timestamp"

    dcs_3_measurement:
      timing: "T0 + 90 days"
      method: "Clone repo at specific commit, assess 3 components"
      inter_rater_reliability:
        sample_size: "20% dual-coded"
        threshold: "κ ≥ 0.70"

    activity_metrics:
      source: "GitHub API (automated)"
      variables:
        - "commits_per_month (first 90 days)"
        - "unique_contributors (first 90 days)"
        - "median_issue_response_time (if ≥5 issues)"

  analysis_plan:
    existence_test:
      method: "Binomial proportion test (one-sample, two-tailed)"
      hypotheses:
        H0: "π ≥ 0.70"
        H1: "π < 0.70"
      gate: "Reject H0 if 95% CI upper bound < 0.60"

    component_breakdown:
      method: "Chi-square goodness-of-fit"
      expected: "Uniform 33% per component"

    mechanism_test:
      method: "Spearman correlation + partial correlation (control: repo age)"
      gate: "ρ ≥ 0.30, p < 0.05 (one-tailed)"

    robustness_checks:
      - "Sensitivity to T0 definition (release tag vs commit vs creation)"
      - "Stratification by year (temporal trend check)"

  validation_gates:
    must_work:
      name: "Existence"
      criterion: "95% CI upper bound for compliance rate < 60%"

    should_work:
      name: "Mechanism"
      criterion: "ρ ≥ 0.30, p < 0.05, persists in partial correlation"

