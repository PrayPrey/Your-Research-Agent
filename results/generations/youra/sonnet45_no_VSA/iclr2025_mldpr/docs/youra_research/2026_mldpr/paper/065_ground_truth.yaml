future_work:
  fw1:
    title: "Production Deployment with Real Data"
    motivation: "Synthetic data limitation requires empirical validation"
    research_question: "Do real-world compliance rates match synthetic estimates (7% ± 5%)?"
    approach: "HuggingFace Hub API sampling + GitHub API + manual DCS coding (N=120)"
    expected_outcome: "Validate 7% compliance rate and ρ = 0.951 correlation OR detect deviation"
    timeline: "2-3 weeks"
    priority: "HIGH"

  fw2:
    title: "Causal Mechanism Test via Longitudinal Analysis"
    motivation: "Cross-sectional correlation cannot establish directionality"
    research_question: "Does commit velocity at time t predict DCS improvement from t to t+30?"
    approach: "Lagged regression: DCS(t+30) ~ commits(t) + DCS(t) + age"
    expected_outcome: "Establish temporal precedence for commits → documentation"
    timeline: "4 weeks"
    priority: "HIGH"

  fw3:
    title: "Multi-Platform Replication Study"
    motivation: "Single platform limits generalizability"
    research_question: "Is 7% compliance HuggingFace-specific or field-wide?"
    approach: "DCS_3 protocol on N=100 each from Papers with Code, OpenML, Zenodo"
    expected_outcome: "Determine if crisis is platform-specific or field-wide"
    timeline: "6 weeks"
    priority: "MEDIUM"

  fw4:
    title: "Licensing Template Intervention RCT"
    motivation: "Licensing weakest component despite mechanical simplicity"
    research_question: "Does automated licensing reminder improve compliance at T+30?"
    approach: "A/B test: treatment (license template prompt) vs. control (standard upload), N=200"
    expected_outcome: "Test if low-friction intervention improves licensing compliance"
    timeline: "3 months"
    priority: "MEDIUM"

