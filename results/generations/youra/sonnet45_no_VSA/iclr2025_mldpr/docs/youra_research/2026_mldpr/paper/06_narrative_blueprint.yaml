# ============================================================================
# FIGURE-NARRATIVE MAPPING
# ============================================================================

figure_story:
  fig_1_scatter_commits_dcs:
    narrative_role: "Visual proof of main mechanism claim"
    placement_cue: "After stating ρ = 0.951 in Results section"
    caption_elements: "Scatterplot showing commits/month vs. DCS_3 score. Strong positive correlation (Spearman ρ = 0.951, p < 10^-50). Each point represents one repository (N=100)."

  fig_2_correlation_matrix:
    narrative_role: "Show mechanism specificity (commits high, others near zero)"
    placement_cue: "After discussing null results for contributors/issues"
    caption_elements: "Correlation matrix heatmap: activity metrics vs. DCS_3. Only commits/month shows strong correlation; contributors and issue response show no relationship."

  fig_3_partial_correlation:
    narrative_role: "Demonstrate robustness to age confound"
    placement_cue: "After stating partial ρ = 0.951"
    caption_elements: "Comparison of raw vs. age-controlled partial correlation. Effect persists even when controlling for repository age (partial ρ = 0.951)."

  fig_4_component_correlations:
    narrative_role: "Show commits correlate with ALL components (not just overall DCS)"
    placement_cue: "Optional—Results section if space permits"
    caption_elements: "Commits/month correlation with individual DCS components. All three components (data context, preprocessing, licensing) show positive correlation with commit activity."

# ============================================================================
# CROSS-SECTION TRANSITIONS
# ============================================================================

transition_strategy:
  intro_to_related:
    bridge: "Standardized documentation frameworks exist and have been validated in controlled settings—so why is adoption so low? To understand this paradox, we review prior work on framework design, empirical documentation studies, and community engagement in open-source projects."

  related_to_method:
    bridge: "Prior studies measured documentation quality at current state, leaving temporal precedence unvalidated. We address this gap through retrospective temporal analysis measuring compliance at T0+90 days, combined with activity correlation tests to identify mechanisms."

  method_to_experiments:
    bridge: "Our methodology enables two hypothesis tests: (H-E1) documentation gap exists at hypothesized severity, and (H-M1) community pressure correlates with quality. We describe sampling, measurement protocols, and statistical gates for each."

  experiments_to_results:
    bridge: "We report results in order of hypothesis dependencies: existence validation (H-E1) establishes that a gap exists, then mechanism analysis (H-M1) identifies commit velocity as the driver."

  results_to_discussion:
    bridge: "Our findings—7% compliance and near-perfect commit correlation—raise three questions: Why is compliance worse than expected? Why is licensing the weakest component? Why do only commits (not contributors or issues) correlate with documentation?"

  discussion_to_conclusion:
    bridge: "These interpretations converge on a unified explanation: documentation gaps arise not from framework inadequacy or awareness deficit, but from lack of workflow integration during active development."

