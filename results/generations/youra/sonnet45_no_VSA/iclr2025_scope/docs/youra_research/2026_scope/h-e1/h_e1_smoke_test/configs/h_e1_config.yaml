experiment:
  name: "h-e1-smoke-test"
  hypothesis_id: "h-e1"
  description: "Functional viability test for 4-bit + LoRA + Mamba integration"
  seed: 42

model:
  name: "state-spaces/mamba-130m"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  device_map: "auto"

quantization:
  load_in_4bit: false  # Temporarily disabled due to PEFT compatibility issue
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  lora_alpha: 16
  target_modules: ["x_proj", "dt_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "Salesforce/wikitext"
  dataset_config: "wikitext-103-v1"
  split: "validation"
  sequence_length: 1024
  num_test_sequences: 10
  batch_size: 1

validation:
  logit_range_min: -100
  logit_range_max: 100
  gradient_min: 1.0e-7
  gradient_max: 1000.0
  check_ssm_states: true

logging:
  log_level: "INFO"
  log_file: "outputs/h_e1_experiment.log"
  save_results_json: true
  results_file: "outputs/h_e1_results.json"
