data_preparation:
- acceptance_criteria:
  - Dataset cached at ~/.cache/torch/datasets/cifar-10-batches-py/
  - Verification len(test_dataset) == 10000
  - Image size 32×32 RGB verified
  complexity: 3
  deliverables:
  - data/setup_cifar10.py
  dependencies: []
  description: Download CIFAR-10, verify 10,000 test samples, cache locally
  id: D-1
  status: pending
  title: CIFAR-10 Dataset Setup
- acceptance_criteria:
  - Pretrained weights cached
  - Final FC layer adapted to 10 classes
  - Model loads successfully
  complexity: 3
  deliverables:
  - data/setup_resnet18.py
  dependencies: []
  description: Download pretrained ResNet-18, adapt for CIFAR-10 (1000 → 10 classes)
  id: D-2
  status: pending
  title: ResNet-18 Model Setup
environment_setup:
- acceptance_criteria:
  - All dependencies pinned
  - Random seeds fixed (42 for all)
  - CUDA deterministic mode enabled
  complexity: 2
  deliverables:
  - requirements.txt
  - setup_env.py
  dependencies: []
  description: Create requirements.txt, verify Python ≥3.9, PyTorch ≥2.0, set random
    seeds
  id: ENV-1
  status: pending
  title: Environment Configuration
epic_tasks:
- acceptance_criteria:
  - Decorator runs probes at import time
  - Shape validation supports symbolic batch dimension
  - Device/dtype checks functional
  - Caching reduces overhead to <1s on subsequent imports
  complexity: 16
  deliverables:
  - contracts/validator.py
  - contracts/probes.py
  - contracts/cache.py
  - contracts/exceptions.py
  dependencies: []
  description: Implement decorator-based structural validation with shape/dtype/device
    probes and caching mechanism
  id: A-1
  status: pending
  title: Contract Library Core
  type: epic
- acceptance_criteria:
  - 200 structural defects extracted (50 per category)
  - All defects sourced from Jiang et al. corpus (no synthetic)
  - Injection verified (defects cause failures in no-contract mode)
  complexity: 14
  deliverables:
  - defects/corpus.py
  - defects/injector.py
  - defects/catalog.json
  dependencies: []
  description: Filter Jiang et al. 348-defect corpus for structural defects, create
    catalog.json with 200 defect specifications, implement monkey-patching injectors
  id: A-2
  status: pending
  title: Defect Corpus Preparation
  type: epic
- acceptance_criteria:
  - Sanity check achieves ≥70% accuracy
  - Median failure time logged for 50 defect samples
  - Execution-only detection rate measured
  complexity: 12
  deliverables:
  - baselines/sanity_check.py
  - baselines/no_contracts.py
  - baselines/execution_only.py
  dependencies:
  - A-2
  description: Implement three baseline conditions - ResNet-18 + CIFAR-10 sanity check,
    no-contract time-to-failure, execution-only detection
  id: A-3
  status: pending
  title: Baseline Experiments
  type: epic
- acceptance_criteria:
  - All 200 defects tested with contracts
  - Detection stage logged (import vs. forward vs. training)
  - Execution time ≤10s verified
  - False positive rate <5% verified
  complexity: 15
  deliverables:
  - experiments/run_contracts.py
  - experiments/measure_detection.py
  - experiments/measure_false_positives.py
  - results/detection_rates.csv
  - results/execution_times.csv
  - results/false_positives.csv
  dependencies:
  - A-1
  - A-2
  description: Apply contracts to ResNet-18 + CIFAR-10, run 200 defect injections,
    measure detection rate, execution time, false positives
  id: A-4
  status: pending
  title: Contract Validation Experiments
  type: epic
- acceptance_criteria:
  - Detection rate point estimate calculated
  - 95% CI computed with lower bound check
  - Statistical power >0.8 verified
  - Gate decision logic implemented
  complexity: 11
  deliverables:
  - experiments/analyze_results.py
  - results/analysis.json
  dependencies:
  - A-4
  description: Calculate detection rate with 95% CI, perform hypothesis test (H0 detection
    ≤60%, H1 detection ≥80%), implement gate decision logic
  id: A-5
  status: pending
  title: Statistical Analysis Pipeline
  type: epic
- acceptance_criteria:
  - All exceptions include expected vs. actual values
  - Messages suggest fixes
  - Median actionability score ≥4
  complexity: 9
  deliverables:
  - contracts/exceptions.py
  - contracts/error_messages.py
  - experiments/measure_error_quality.py
  dependencies:
  - A-1
  description: Implement actionable error formatting with expected vs. actual values,
    fix suggestions, and quality assessment
  id: A-6
  status: pending
  title: Error Message System
  type: epic
failsafe:
- acceptance_criteria:
  - Generate 04_validation.md on failure
  - Include error logs and partial results
  - Gate decision FAIL documented
  complexity: 3
  deliverables:
  - experiments/generate_minimal_report.py
  dependencies:
  - A-5
  description: If primary pipeline fails, generate minimal validation report with
    error logs
  id: FAIL-1
  status: pending
  title: Minimal Validation Report Generator
