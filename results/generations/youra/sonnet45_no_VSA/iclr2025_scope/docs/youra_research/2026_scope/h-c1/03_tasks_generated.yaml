    description: "All 7 code files generated (corpus_loader, ensemble, runner, metrics, plots, config, run_experiment)"
    expected: 7
  - id: VERIFY-2
    description: "data/results.csv contains 1044 rows (348 defects × 3 strategies)"
    expected: 1044
  - id: VERIFY-3
    description: "3 visualizations generated (fnr_comparison, coverage_by_type, execution_time)"
    expected: 3
  - id: VERIFY-4
    description: "04_validation.md contains gate verdict section"
    expected: true
  - id: VERIFY-5
    description: "FNR reduction ≥30% (MUST_WORK gate satisfied)"
    expected: "≥0.30"

# Risk Mitigation
risks:
  - id: RISK-1
    description: "Validator interference (state mutation)"
    mitigation: "Deep copy model before validation, verify idempotency via unit tests"
    probability: low
    impact: high
  - id: RISK-2
    description: "Defect corpus mislabeling (invalid ground truth)"
    mitigation: "Manual review of 10% sample (35 defects), cross-check with h-e1 logs"
    probability: medium
    impact: high
  - id: RISK-3
    description: "Execution timeout (incomplete results)"
    mitigation: "ThreadPoolExecutor with timeout, record TIMEOUT as separate category"
    probability: low
    impact: medium

