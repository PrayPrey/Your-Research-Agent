# Implementation Task List: h-c1 Combined Contract Validation Framework
# Generated: 2026-07-11
# Tier: LIGHT (44 complexity points total)
# Structure: 7 Epic tasks (C-1 through C-7) with 15 subtasks

hypothesis_id: h-c1
tier: LIGHT
total_complexity: 44
epic_count: 7
subtask_count: 15

# Epic Tasks (6 implementation + 1 validation)
epic_tasks:
  - id: C-1
    title: "Defect Corpus Loader"
    type: data_preparation
    complexity: 4
    description: "Load and stratify Jiang et al. 348-defect corpus with ground truth inference"
    dependencies: []
    deliverables:
      - "code/data/corpus_loader.py"
      - "Unit tests for stratification logic"
    subtasks:
      - id: L-1-1
        title: "CSV Reader"
        description: "Load CSV with pandas, validate schema"
        estimated_effort: 1
      - id: L-1-2
        title: "Ground Truth Inference"
        description: "Infer structural_detectable and metamorphic_detectable from defect_type"
        estimated_effort: 1
      - id: L-1-3
        title: "Stratification"
        description: "Group by defect_type, return summary counts"
        estimated_effort: 1
      - id: L-1-4
        title: "Unit Tests"
        description: "Test stratification logic, schema validation"
        estimated_effort: 1

  - id: C-2
    title: "Ensemble Validator"
    type: core_logic
    complexity: 8
    description: "Parallel validation wrapper combining h-m1 + h-m2 with timeout and deduplication"
    dependencies: []
    deliverables:
      - "code/validators/ensemble.py"
      - "Unit tests for parallel execution and deduplication"
    subtasks:
      - id: L-2-1
        title: "ThreadPoolExecutor Setup"
        description: "Initialize executor with 4 workers, implement timeout handling"
        estimated_effort: 2
      - id: L-2-2
        title: "Validator Wrappers"
        description: "Wrap h-m1 and h-m2 validators to catch exceptions and return violations"
        estimated_effort: 2
      - id: L-2-3
        title: "Deduplication Logic"
        description: "Identify and merge violations from both sources (source='both')"
        estimated_effort: 2
      - id: L-2-4
        title: "Integration Tests"
        description: "Test parallel execution, timeout scenarios, deduplication edge cases"
        estimated_effort: 2

  - id: C-3
    title: "Three-Strategy Experiment Runner"
    type: core_logic
    complexity: 7
    description: "Run structural-only, metamorphic-only, and combined validation on full corpus"
    dependencies: [C-1, C-2]
    deliverables:
      - "code/experiments/runner.py"
      - "data/results.csv"
    subtasks:
      - id: L-3-1
        title: "Strategy Router"
        description: "Implement routing logic for three validation strategies"
        estimated_effort: 2
      - id: L-3-2
        title: "Per-Defect Recording"
        description: "Record defect_id, strategy, detected, execution_time for each test"
        estimated_effort: 2
      - id: L-3-3
        title: "CSV Output"
        description: "Save results to data/results.csv (1044 rows: 348 defects × 3 strategies)"
        estimated_effort: 2
      - id: L-3-4
        title: "Progress Logging"
        description: "Log progress every 50 defects, handle exceptions gracefully"
        estimated_effort: 1

  - id: C-4
    title: "Statistical Analyzer"
    type: analysis
    complexity: 6
    description: "Calculate FNR, bootstrap 95% CI, and McNemar test"
    dependencies: [C-3]
    deliverables:
      - "code/analysis/metrics.py"
      - "Unit tests for statistical calculations"
    subtasks:
      - id: L-4-1
        title: "FNR Calculation"
        description: "Compute FNR = missed_detectable / total_detectable per strategy"
        estimated_effort: 2
      - id: L-4-2
        title: "Bootstrap CI"
        description: "1000-iteration bootstrap for 95% confidence intervals"
        estimated_effort: 2
      - id: L-4-3
        title: "McNemar Test"
        description: "Paired comparison (Combined vs each baseline), report p-value"
        estimated_effort: 2

  - id: C-5
    title: "Visualization Generator"
    type: visualization
    complexity: 5
    description: "Generate FNR comparison, coverage by type, and execution time plots"
    dependencies: [C-4]
    deliverables:
      - "code/visualization/plots.py"
      - "visualizations/fnr_comparison.png"
      - "visualizations/coverage_by_type.png"
      - "visualizations/execution_time.png"
    subtasks:
      - id: L-5-1
        title: "FNR Comparison Plot"
        description: "Bar chart with 95% CI error bars, 30% threshold line"
        estimated_effort: 2
      - id: L-5-2
        title: "Coverage by Defect Type"
        description: "Stacked bar chart for structural/behavioral/mixed/composition"
        estimated_effort: 2
      - id: L-5-3
        title: "Execution Time Plot"
        description: "Box plot comparing execution time across strategies"
        estimated_effort: 1

  - id: C-6
    title: "Main Orchestrator"
    type: core_logic
    complexity: 5
    description: "End-to-end experiment script with config loading and logging"
    dependencies: [C-1, C-2, C-3, C-4, C-5]
    deliverables:
      - "code/run_experiment.py"
      - "code/config.py"
    subtasks:
      - id: L-6-1
        title: "Config Loading"
        description: "Load VALIDATION, EXPERIMENT, ANALYSIS, VISUALIZATION config dicts"
        estimated_effort: 1
      - id: L-6-2
        title: "Experiment Pipeline"
        description: "Orchestrate corpus load → validation → analysis → visualization"
        estimated_effort: 2
      - id: L-6-3
        title: "Logging Setup"
        description: "Configure logging with timestamps, progress indicators"
        estimated_effort: 1
      - id: L-6-4
        title: "End-to-End Test"
        description: "Run on 10-defect subset, verify all outputs generated"
        estimated_effort: 1

  - id: C-7
    title: "Validation Report Generator"
    type: validation
    complexity: 9
    description: "Generate 04_validation.md with gate verdict, statistical results, visualizations"
    dependencies: [C-6]
    deliverables:
      - "04_validation.md"
      - "Gate verdict (PASS/FAIL)"
    subtasks:
      - id: L-7-1
        title: "Results Summary"
        description: "Extract FNR reduction, detection rates, execution times"
        estimated_effort: 2
      - id: L-7-2
        title: "Statistical Reporting"
        description: "Report bootstrap CIs, McNemar p-values, effect sizes"
        estimated_effort: 2
      - id: L-7-3
        title: "Gate Evaluation"
        description: "Evaluate MUST_WORK gate (≥30% FNR reduction), render verdict"
        estimated_effort: 2
      - id: L-7-4
        title: "Visualization Embedding"
        description: "Embed 3 plots into markdown report with captions"
        estimated_effort: 2
      - id: L-7-5
        title: "Coverage Analysis"
        description: "Break down detection rate by defect type (structural/behavioral/mixed/composition)"
        estimated_effort: 1

