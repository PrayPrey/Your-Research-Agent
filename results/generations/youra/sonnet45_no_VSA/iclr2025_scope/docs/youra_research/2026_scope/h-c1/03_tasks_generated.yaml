# Pre-validation Checklist
pre_validation_checks:
  - id: CHECK-1
    description: "Verify h-m1 validator is importable and functional"
    command: "python -c 'from h-m1.code.contracts.validator import validate_structural'"
  - id: CHECK-2
    description: "Verify h-m2 validator is importable and functional"
    command: "python -c 'from h-m2.code.contracts.metamorphic import validate_metamorphic'"
  - id: CHECK-3
    description: "Verify h-e1 corpus exists and has 348 rows"
    command: "wc -l docs/youra_research/h-e1/data/defect_corpus.csv"
  - id: CHECK-4
    description: "Verify scipy is installed (for McNemar test)"
    command: "python -c 'import scipy.stats'"
  - id: CHECK-5
    description: "Verify matplotlib is installed (for visualizations)"
    command: "python -c 'import matplotlib.pyplot'"

# Post-implementation Checklist
