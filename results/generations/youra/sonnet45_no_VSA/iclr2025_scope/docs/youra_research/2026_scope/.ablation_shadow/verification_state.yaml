main_hypothesis:
  id: H-APIContracts-v1
  title: API Contract Validation Framework for ML Reproducibility
  statement: Under ML reengineering workflows (computer vision focus), if researchers validate library behavioral assumptions
    via executable API contracts at environment-setup time, then environment-stage API defects reduce by ≥30% relative to
    version-pinning + CI baseline (≥25% marginal reduction over CI-only), with ≥5-hour earlier detection (lifecycle shift
    from training-stage to environment-stage), because contracts proactively intercept assumption violations through composition-level
    invariants (structural, metamorphic, cross-library) that execute in ≤10 seconds before any training begins.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Jiang et al. 348-Defect Corpus + Live GitHub Repos (≥1K stars CV repos)
    model: API contract validation framework (not model architecture)
    optimizer: N/A (tooling hypothesis)
    hyperparameters:
      contractability_threshold: 0.4
      false_positive_threshold: 0.05
      marginal_detection_threshold: 0.25
      lifecycle_shift_hours: 5
      version_stability_range: ±2 minor versions
