core_statement:
  hypothesis_id: "H-APIContracts-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under ML reengineering workflows (computer vision focus), if researchers validate library behavioral
    assumptions via executable API contracts at environment-setup time, then environment-stage API defects
    reduce by ≥30% relative to version-pinning + CI baseline (≥25% marginal reduction over CI-only), with
    ≥5-hour earlier detection (lifecycle shift from training-stage to environment-stage), because contracts
    proactively intercept assumption violations through composition-level invariants (structural, metamorphic,
    cross-library) that execute in ≤10 seconds before any training begins.
  alternative_hypothesis_h0: |
    There is no significant difference in environment-stage API defect rate or time-to-detection between
    version-pinning + CI-only and version-pinning + CI + API contracts.

