causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Contracts validate documented structural invariants (return types, tensor shapes, non-null outputs) at import time"
      evidence: "HuggingFace pattern: version checks → dummy batch validation. PyTorch: torch.cuda.is_available()"
      falsifier: "If contracts pass but structural violations still occur, documentation is incomplete"
    - step: 2
      description: "Contracts enforce metamorphic mathematical properties (softmax sums, dropout identity) via lightweight probes"
      evidence: "Property-based testing principles; mathematical invariants are version-stable"
      falsifier: "If version changes violate metamorphic properties, library behavior changed undocumented"
    - step: 3
      description: "Cross-library composition-level contracts validate binding assumptions (device placement, tensor layout consistency)"
      evidence: "Many API defects arise from cross-library interactions (Torch + CUDA + Transformers version triads)"
      falsifier: "If contracts detect single-library issues but miss composition failures, coverage is incomplete"
    - step: 4
      description: "Early detection shifts failure discovery from training-stage (hours into experiment) to environment-stage (seconds at setup)"
      evidence: "68% of reproducibility defects surface during training (Jiang et al.) — lifecycle shift is measurable"
      falsifier: "If time-to-detection does not reduce, contracts are not intercepting upstream causes"
  key_tension: "Contracts target structural/metamorphic invariants (≤10s CPU) but many semantic drift cases require full inference to detect"
  evidence_summary: |
    Evidence supports mechanism for environment-stage API defects (46% of environment defects per Jiang et al.).
    Contracts won't detect training-stage stochasticity or arbitrary semantic drift — scope is bounded.

