scope:
  applies_to: |
    - ML reengineering workflows using popular external libraries (PyTorch, HuggingFace, JAX)
    - Environment-stage and interface/API assumption violations
    - Structural invariants (return types, shapes, non-null), metamorphic properties (mathematical guarantees), composition-level binding assumptions
    - Computer vision domain (Jiang et al. empirical base), likely generalizes to NLP/RL but requires validation
  does_not_apply_to: |
    - Training-stage stochasticity, convergence degradation, floating-point nondeterminism
    - Arbitrary semantic drift requiring full inference or domain knowledge
    - Performance defects without structural/metamorphic signature
    - Libraries without documented behavioral invariants
    - Custom user code (unless contracts written for internal interfaces)
  known_limitations: |
    - Cannot guarantee final model accuracy or training convergence
    - Auto-generation quality depends on documentation precision
    - Cross-library interaction contracts require manual curation
    - Baseline comparison: 75% of repos have no CI, so "marginal value" is relative to weak status quo

