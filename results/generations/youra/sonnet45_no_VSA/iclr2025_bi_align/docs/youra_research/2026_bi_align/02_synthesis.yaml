  datasets:
    - "80-sample test set: 20 Safe (PersonaChat, DailyDialog), 20 OOM-risk (WildChat full-batch), 20 Throughput-risk (streaming datasets), 20 Dual-risk (WildChat P99 + large batch)"
    - "Ground truth: H-E1/H-E3 known failures + 10 deliberate failure experiments (5 OOM-only, 5 Dual-risk)"
  baselines:
    - "VeritasEst-only + 20-batch timing heuristic"
    - "Single-regression unified predictor"
    - "Dual-axis routing (proposed)"

measurement_plan:
  data_collection:
    - source: "3-iteration stratified profiling per dataset-model config"
    - source: "10-iteration full traces for ground truth validation"
    - source: "48 controlled configs (16 models × 5 optimizers × 3 datasets) for orthogonality testing"
  procedure:
    - step: "Implement segment simulator wrapper around Kang et al. factorization with VeritasEst BFC allocator simulation"
    - step: "Profile each config: {1st iteration, post-optimizer.step, P50/P75/P95/P99 length bins} to compute MSI"
    - step: "Instrument SAT via NVML (GPU utilization) + PyTorch dataloader queue depth + P95/Median batch time"
    - step: "Validate MSI: compare 3-iteration MSI vs 10-iteration ground truth, compute median/95th percentile error"
    - step: "Test orthogonality: compute Pearson correlation between MSI and epoch-time degradation across 48 configs"
    - step: "Comparative evaluation: run 3 baselines on 80-sample test set, measure macro-F1, compute improvement"
  success_criteria:
    - "MSI median error ≤10% (CNNs), ≤15% (transformers), 95th percentile ≤25%"
    - "Pearson |r(MSI, epoch_time)| < 0.3 under natural workloads"
    - "Macro-F1 improvement ≥20% over VeritasEst+timing baseline with p<0.05"

validation:
  internal_validity:
    - "Stratified sampling protocol ensures representative length distribution (P50/P75/P95/P99 bins)"
    - "Allocator simulation via VeritasEst BFC reconstructs segment-level memory (not tensor sums)"
    - "Synthetic jitter falsification isolates SAT contamination from benign system noise"
    - "Deliberate failure experiments (5 OOM, 5 Dual-risk) balance ground truth across 4 classes"
  external_validity:
    - "Multi-architecture validation (8 transformers + 8 CNNs) tests generalization beyond VeritasEst's CNN-only scope"
    - "Multi-optimizer validation (5 optimizers) covers standard training regimes (SGD, Adam, AdamW, Lion, Adafactor)"
    - "Held-out 80-sample test set includes H-E1/H-E3 known failures + 17 unseen datasets"
    - "Contingency thresholds (≤15% error for transformers, r<0.5 if orthogonality weakens) ensure robustness"

discussion_synthesis:
  key_insights:
    - "H-E3 failure revealed orthogonality: SAT-only missed OOM because memory and throughput are independent failure modes"
    - "Segment-level simulation (VeritasEst) is non-negotiable for memory prediction; tensor sums fail under Adam optimizer"
    - "Stratified sampling addresses M_act variance (activation memory depends on sequence length distribution)"
    - "Four-quadrant routing provides actionable diagnosis beyond binary safe/unsafe: OOM→batch size, Throughput→data loading, Dual→both"
  breakthrough_moments:
