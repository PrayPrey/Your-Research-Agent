hypothesis_draft:
  title: "Dual-Axis Lightweight Dataset Training Accessibility Profiler"
  hypothesis_id: "H-DualAccessibility-v1"
  core_claim: |
    A lightweight dual-axis profiler combining segment-level MSI (memory stress via allocator simulation) and GPU-normalized SAT (throughput variance) can classify dataset training accessibility into four quadrants (Safe, OOM-risk, Throughput-risk, Dual-risk) from N=3 stratified iterations, achieving ≥20% macro-F1 improvement over VeritasEst-only + empirical timing baseline.
  mechanism: |
    OOM and throughput failures arise from orthogonal system bottlenecks (segment memory exhaustion vs data loading stalls). By measuring both axes independently from stratified 3-iteration profiling—MSI via VeritasEst-style allocator simulation over Kang et al. factorization, SAT via GPU-utilization-normalized batch time variance—we enable 4-quadrant diagnostic routing that provides actionable mitigation strategies (batch size reduction for OOM, data loading optimization for throughput, both for dual-risk).
  predictions:
    - "P1: Dual-axis achieves ≥20% macro-F1 improvement over baseline on 4-class accessibility task (80-sample test set)"
    - "P2: MSI from 3 stratified iterations predicts 10-iteration segment peak with ≤10% median error (≤15% for transformers)"
    - "P3: Pearson correlation between MSI and epoch-time degradation <0.3 across natural workloads (orthogonality)"

variables_summary:
  independent: "Profiling Strategy (categorical: Dual-axis vs VeritasEst-only+timing vs Single-regression)"
  dependent_primary: "Macro-F1 Score on 4-class accessibility classification (range 0-1)"
  controlled: "Stratified sampling protocol (fixed), Ground truth method (10-iteration traces), System configuration (identical)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in accessibility classification accuracy between dual-axis routing (MSI+SAT) and a simpler baseline combining VeritasEst OOM prediction with 20-batch empirical timing heuristics.
  statistical_test: "Bootstrap hypothesis test on macro-F1 difference"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First lightweight dual-failure-mode predictor with validated geometric framework (4-quadrant accessibility space) enabling actionable diagnostic routing"
  differentiation_summary: |
    Prior work addresses OOM (VeritasEst) or throughput (empirical profiling) in isolation. H-E3 demonstrated SAT-only predictor fails (50% accuracy) because memory and throughput are orthogonal. Our approach combines segment-level MSI + mechanism-instrumented SAT with statistical orthogonality validation (|r|<0.3) and comparative evaluation (≥20% macro-F1 improvement bar).

