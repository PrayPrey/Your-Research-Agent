scope:
  # What IS validated
  validated_scope:
    architectures:
      - "ResNet-18 (11.7M params, 8 residual blocks)"
      - "ResNet-34 (21.8M params, 16 residual blocks)"
    optimizers:
      - "Adam (β₁=0.9, β₂=0.999, lr=1e-4)"
      - "AdamW (β₁=0.9, β₂=0.999, lr=1e-4, weight_decay=0.01)"
      - "SGD (lr=0.1, momentum=0.9)"
    input_type: "Fixed-length (CIFAR-10-scale 32×32×3 images)"
    data_source: "Synthetic (torch.randn)"
    batch_size: 64
    validation_configs: 4

  # What is NOT validated (out of scope)
  unvalidated_scope:
    architectures:
      - "Transformers: BERT, GPT-2, T5, DistilBERT, RoBERTa, ALBERT, DeBERTa, ViT (0/8 tested)"
    input_type: "Variable-length sequences (attention O(n²) scaling)"
    data_source: "Real datasets (CIFAR-10, ImageNet, WMT-14)"
    sampling_strategy: "Stratified length-bin sampling (P50/P75/P95/P99)"
    statistical_power: "n=48 for >95% power (only n=4 tested)"
    dataloader_overhead: "Multiprocessing workers, prefetching, augmentation"

  # Deferred claims
  deferred_claims:
    - "Dual-axis integration (memory + throughput) → h-e2 incomplete"
    - "Gradient checkpointing compatibility → unvalidated"
    - "Flash Attention compatibility → unvalidated"
    - "Distributed training (data/model parallelism) → out of scope"

