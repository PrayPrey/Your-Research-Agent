# ═══════════════════════════════════════════════════════════════════════════════
# MAIN CLAIMS (For Adversarial Review Verification)
# ═══════════════════════════════════════════════════════════════════════════════

main_claims:
  - id: "claim_1"
    claim: "Post-optimizer 3-iteration sampling achieves 2.6% median error, 52% reduction vs VeritasEst (5.46%)"
    section: "abstract, introduction, results"
    evidence_type: "experimental"
    evidence_location: "sections/05_results.md, Table 1"
    supporting_data:
      - "ResNet-18+Adam: 0.62% error"
      - "ResNet-34+Adam: 0.00% error"
      - "ResNet-18+SGD: 4.60% error"
      - "ResNet-34+SGD: 6.40% error"
      - "Median across 4 configs: 2.6%"
    confidence: "HIGH"
    scope: "CNNs with fixed-length inputs only (ResNet-18/34)"
    validation_status: "VALIDATED"

  - id: "claim_2"
    claim: "Optimizer-specific accuracy: Adam 0.6% vs SGD 6.4% (10× difference)"
    section: "introduction, results, discussion"
    evidence_type: "experimental"
    evidence_location: "sections/05_results.md, Section 5.4"
    supporting_data:
      - "Adam average: 0.31% error (ResNet-18: 0.62%, ResNet-34: 0.00%)"
      - "SGD average: 5.5% error (ResNet-18: 4.60%, ResNet-34: 6.40%)"
      - "10× accuracy difference"
    confidence: "MEDIUM"
    scope: "ResNet-18/34 only, mechanism investigation pending"
    validation_status: "VALIDATED"
    open_questions:
      - "Why does SGD achieve higher error despite smaller workspace?"
      - "Does SGD momentum buffer allocate at different timing?"

  - id: "claim_3"
    claim: "Post-optimizer timing captures Adam workspace allocations (m_t, v_t buffers)"
    section: "introduction, methodology, results"
    evidence_type: "mechanistic"
    evidence_location: "sections/05_results.md, Section 5.2 (Memory Timeline)"
    supporting_data:
      - "ResNet-18+Adam: 130MB (forward) → 175MB (backward) → 280MB (post-optimizer)"
      - "150MB allocation during optimizer.step()"
      - "Consistent with 2× parameter memory for Adam (m_t + v_t buffers)"
    confidence: "HIGH"
    scope: "Demonstrated for Adam optimizer, ResNet-18/34 architectures"
    validation_status: "VALIDATED"

  - id: "claim_4"
    claim: "All tested configurations achieve <7% error, P95 error 6.1%"
    section: "abstract, results"
    evidence_type: "experimental"
    evidence_location: "sections/05_results.md, Section 5.3"
    supporting_data:
      - "4/4 configurations below 10% threshold"
      - "Max error: 6.4% (ResNet-34+SGD)"
      - "P95 error: 6.1%"
    confidence: "HIGH"
    scope: "4 configurations tested (ResNet-18/34 × Adam/SGD)"
    validation_status: "VALIDATED"

