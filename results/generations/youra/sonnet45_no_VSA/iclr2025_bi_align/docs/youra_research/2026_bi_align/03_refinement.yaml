# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "OOM and throughput failures are orthogonal because they arise from independent system bottlenecks: segment memory exhaustion (gradient buffers + optimizer states during backprop) vs data loading stalls (CPU→GPU pipeline causing GPU idle)"
      evidence: "H-E3 failure demonstrated orthogonality: SAT profiling missed WildChat OOM (training memory) while correctly identifying PersonaChat as stable (inference throughput). VeritasEst [2025] showed segment memory != tensor totals due to allocator fragmentation."
      falsifier: "If Pearson correlation between MSI and epoch-time degradation exceeds |r|=0.5 across natural workloads, axes are NOT orthogonal but measure shared latent computational load"
    - step: 2
      description: "Segment-level MSI from stratified 3-iteration sampling accurately predicts full training memory peak because structural components (M_param, M_opt) are invariant and M_act variance is captured by length-quantile stratification"
      evidence: "VeritasEst demonstrated 2-iteration sufficiency for optimizer state stabilization. Kang et al. showed M_act depends on input shapes (sequence length), addressable via P50/P75/P95/P99 sampling."
      falsifier: "If median MSI error exceeds 10% (or 15% for transformers) when validated against 10-iteration ground truth, stratified sampling is insufficient"
    - step: 3
      description: "GPU-normalized SAT (P95/Median batch time × GPU utilization fraction) causally predicts throughput degradation because high variance under high GPU utilization indicates data loading bottlenecks, while low utilization indicates non-accessibility system noise"
      evidence: "Synthetic jitter falsification: injecting dataloader sleep() should increase SAT only if GPU utilization drops, proving SAT measures accessibility not benign variance"
      falsifier: "If high SAT (>1.5) does not predict ≥15% epoch-time degradation with ≥80% precision when GPU utilization <90%, SAT is contaminated"
    - step: 4
      description: "Four-quadrant routing provides actionable mitigation strategies because OOM requires batch size reduction (memory constraint) while throughput failures require data loading optimization (I/O constraint), and dual-risk datasets need both"
      evidence: "H-E1 WildChat required BOTH fixes: OOM from large batch → reduce to 8, timeout from streaming → pre-download locally. Single-axis predictors provide failure yes/no but not diagnostic WHY."
      falsifier: "If dual-axis routing does not reduce false-safe misclassifications by ≥20% compared to baseline, complexity is unjustified"
  key_tension: "Orthogonality assumption is empirically testable but may fail under certain workload conditions (e.g., memory-intensive models with inherent throughput bottlenecks). Contingency: if r=0.3-0.5, reframe as 'practical independence' with demonstration that mitigation strategies remain distinct."
  evidence_summary: |
    Evidence combines: (1) H-E3 failure showing SAT-only missed OOM, (2) VeritasEst segment-level accuracy (5.46% median error), (3) Kang et al. factorization (8.7% MAPE), (4) H-E1 demonstrating need for dual mitigation. All components have prior validation; novelty is in integration.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Segment memory peak from 3-iteration stratified sampling generalizes to full 10-iteration traces within ≤10% error (≤15% for transformers)"
    supporting_evidence: "VeritasEst demonstrated 2-iteration optimizer state stabilization; stratification addresses M_act variance via length quantiles"
    consequence_if_violated: "MSI becomes unreliable predictor, dual-axis routing loses memory-risk accuracy. Mitigation: extend to 5-iteration sampling or add confidence intervals"
  - id: "A2"
    assumption: "OOM (memory) and throughput (I/O) failures are statistically orthogonal (Pearson |r|<0.3) under natural training workloads"
    supporting_evidence: "H-E3 empirical observation: WildChat OOM without throughput variance, PersonaChat stable despite lower SAT"
    consequence_if_violated: "Dual-axis framing collapses into single latent 'difficulty' factor. Mitigation: reframe as unified score with multi-factor analysis"
  - id: "A3"
    assumption: "GPU-normalized SAT (adjusted for utilization) isolates accessibility-related throughput variance from benign system noise"
    supporting_evidence: "Synthetic jitter falsification protocol validates causal link between SAT and GPU idle time"
    consequence_if_violated: "SAT produces false positives (predicting slow when actually safe). Mitigation: multi-source decomposition (CUDA event timing, dataloader queue depth)"
  - id: "A4"
    assumption: "Ground truth labels (Safe, OOM-risk, Throughput-risk, Dual-risk) can be reliably obtained via 10-iteration full traces + deliberate failure experiments"
    supporting_evidence: "H-E1/H-E3 provide partial ground truth; deliberate OOM/Dual-risk experiments (5 each) complete 4-class distribution"
    consequence_if_violated: "Test set contamination biases evaluation. Mitigation: use held-out datasets unseen during profiler development"
  - id: "A5"
    assumption: "Allocator simulation (BFC) generalizes from VeritasEst's CNN validation to transformer architectures with gradient accumulation"
    supporting_evidence: "BFC is PyTorch's standard allocator; gradient accumulation modifies lifetime but not allocator logic"
    consequence_if_violated: "Transformer MSI error exceeds 15%, requiring architecture-specific calibration. Mitigation: pre-register contingency threshold, scope to 'validated architectures'"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Standard training scenarios (SGD, Adam, AdamW, Lion, Adafactor optimizers)
    - CNN and transformer architectures without exotic memory patterns (standard BERT, GPT-2, T5, LLaMA, ResNet, ViT)
    - Single-GPU training or data-parallel multi-GPU (not model-parallel or pipeline-parallel)
    - Datasets where accessibility issues arise from memory (batch size) or throughput (data loading) constraints
    - Training-time failures (OOM, epoch-time degradation ≥15%), not inference-time issues
  does_not_apply_to: |
    - Mixture-of-Experts (MoE) models with dynamic routing (allocator patterns may differ)
    - Flash Attention or other memory-efficient attention variants (Kang et al. factorization not validated)
    - Model-parallel or pipeline-parallel training (segment memory fragmentation differs)
    - Convergence failures (loss divergence, NaN gradients) - orthogonal failure mode
    - Hardware-specific issues (GPU memory errors, PCIe bandwidth limits)
    - Streaming datasets where P95 length cannot be determined without full loading
  known_limitations: |
    - Ground truth bias: Initial test set includes limited OOM-only and Dual-risk examples (mitigated by deliberate failure experiments)
    - Allocator generalization: VeritasEst validated on CNNs; transformer validation needed (contingency: ≤15% error acceptable)
    - Orthogonality variance: r<0.3 may not hold universally (contingency: r=0.3-0.5 acceptable if mitigation strategies remain distinct)
    - Sampling cost: 3-iteration profiling still requires running model (faster than full training but not zero-cost)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Dual-axis routing (MSI+SAT) achieves ≥20% macro-F1 improvement over VeritasEst-only + 20-batch timing baseline on 4-class accessibility classification (80-sample test set)"
    test_method: "Comparative evaluation: implement 3 baselines (A=dual-axis, B=VeritasEst+timing, C=single-regression), measure macro-F1 on held-out test set with known labels (20 Safe, 20 OOM-risk, 20 Throughput-risk, 20 Dual-risk)"
    success_criterion: "Macro-F1(A) - Macro-F1(B) ≥ 0.20, with statistical significance p<0.05 via bootstrap test"
    falsification: "If improvement <0.15, complexity of dual-axis is unjustified; if <0.10, simplify to single-regression"
  - id: "P2"
    primary: false
    statement: "MSI computed from 3 stratified iterations (1st, post-optimizer, P50/P75/P95/P99 batches) predicts 10-iteration segment peak memory with ≤10% median relative error (≤15% for transformers)"
    test_method: "Run 48 configs (16 models × 5 optimizers × 3 datasets) with both 3-iteration profiling and 10-iteration ground truth; compute median absolute percentage error"
    success_criterion: "Median error ≤10% for CNNs, ≤15% for transformers (8 architectures), 95th percentile error ≤25%"
    falsification: "If median >15% or 95th percentile >30%, stratified sampling is insufficient; extend to 5-iteration or add confidence intervals"
  - id: "P3"
    primary: false
    statement: "Pearson correlation between segment-accurate MSI and epoch-time degradation (≥15% slowdown) is <0.3 across natural workloads, demonstrating statistical orthogonality"
    test_method: "Compute (MSI, epoch_time_degradation) pairs for 48 configs under fixed-length and long-tail length regimes; calculate Pearson r"
    success_criterion: "|r| < 0.3 for natural workloads (fixed + long-tail); |r| can increase under synthetic jitter (data loading contamination)"
    falsification: "If r>0.5 under natural workloads, axes are not orthogonal; reframe as unified accessibility score with multi-factor decomposition"

