novelty:
  preserved_novelty: "First lightweight dual-failure-mode predictor combining segment-level memory simulation with mechanism-instrumented throughput profiling. Prior work addresses OOM OR throughput in isolation; none combine orthogonal axes for 4-quadrant diagnostic routing."
  key_innovation: "Validated geometric framework treating (MSI, SAT) as independent axes in accessibility space, enabling actionable failure-mode diagnosis (OOM→batch reduction, Throughput→data optimization, Dual→both) rather than binary safe/unsafe classification"
  differentiation:
    - prior_work: "VeritasEst (2025) - CPU-based OOM prediction via segment simulation"
      difference: "VeritasEst predicts memory-only (no throughput); requires full model trace; binary OOM yes/no. Our approach adds SAT axis for throughput failures and provides 4-class diagnostic routing from 3-iteration lightweight profiling."
    - prior_work: "Kang et al. (2025) - Multimodal memory factorization"
      difference: "Kang predicts peak memory via tensor factorization but not allocator-level segments (DNNMem failure mode); no throughput profiling; no accessibility classification. We use their factorization as input to allocator simulation and combine with SAT for dual-axis routing."
    - prior_work: "H-E3 SAT-based classification"
      difference: "H-E3 used SAT-only (50% accuracy failure); missed orthogonal OOM mode. Our approach combines MSI (memory) + SAT (throughput) as validated independent axes with statistical orthogonality proof."

