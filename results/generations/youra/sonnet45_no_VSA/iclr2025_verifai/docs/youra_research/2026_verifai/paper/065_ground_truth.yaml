limitations:
  l1_mock_validation:
    description: Mock validation with stochastic discharge rates, not real SMT solvers
    impact: Quantitative metrics are upper bounds requiring real-verifier validation
    acceptability: H-E1/H-M1 mock results align with AutoSpec+ real results; standard for mechanism validation
  l2_benchmark_diversity:
    description: ACSL-by-Example function-level algorithms only
    impact: Results may not generalize to production-scale systems code
    acceptability: Focus on methodological innovation (information gradient, taxonomy), not deployment tool
  l3_deterministic_only:
    description: Concurrent/nondeterministic programs excluded from scope
    impact: Cross-verifier transfer may fail for concurrency primitives
    acceptability: Sequential verification is large, important domain; concurrency is separate research challenge
  l4_zero_shot:
    description: No task-specific fine-tuning
    impact: Fine-tuned models may exceed 70% discharge
    acceptability: Demonstrates generalizability; fine-tuning is orthogonal engineering optimization
  l5_tool_specific_idioms:
    description: 15.1% degradation due to tool-specific idioms resisting 8-primitive abstraction
    impact: Perfect transfer impossible with minimal taxonomy
    acceptability: 84.9% retention is substantial for minimal, reusable taxonomy
surprising_findings:
  staged_refinement_failure:
