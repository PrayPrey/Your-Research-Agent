# =============================================================================
# H-E1: Verifier-Feedback-Driven Specification Synthesis
# Minimal PoC Configuration (EXISTENCE Hypothesis)
# =============================================================================

experiment:
  name: "h-e1-verifier-feedback-poc"
  type: "existence"
  seed: 42
  output_dir: "docs/youra_research/h-e1"

# -----------------------------------------------------------------------------
# LLM Configuration
# -----------------------------------------------------------------------------
llm:
  # Model selection
  model: "claude-opus-4-5"
  provider: "anthropic"

  # API settings
  api_key_env: "ANTHROPIC_API_KEY"
  timeout_seconds: 60
  max_retries: 3
  retry_backoff_base: 2.0

  # Rate limiting
  rate_limit:
    requests_per_second: 1.0
    burst_size: 5

  # Generation parameters
  generation:
    temperature: 0.7
    max_tokens: 4096
    top_p: 0.9

  # Refinement parameters
  refinement:
    temperature: 0.5
    max_tokens: 4096
    top_p: 0.9

# -----------------------------------------------------------------------------
# Verifier Configuration (Frama-C/WP)
# -----------------------------------------------------------------------------
verifier:
  executable: "frama-c"
  version: "29.0"

  wp:
    timeout_per_vc: 10
    timeout_global: 300
    solvers: ["alt-ergo", "z3"]
    memory_model: "Typed"
    strategy: "wp"
    split: true

# -----------------------------------------------------------------------------
# Refinement Loop Configuration
# -----------------------------------------------------------------------------
refinement:
  max_iterations: 10

  early_stopping:
    enabled: true
    no_improvement_threshold: 3

  convergence:
    target_discharge_rate: 100.0
    min_acceptable_rate: 50.0

  checkpoint:
    enabled: true
    save_every_iteration: true
    checkpoint_dir: "docs/youra_research/h-e1/code/results/checkpoints"

  feedback_dimensions:
    - "witness"
    - "obligation"
    - "dependency"

# -----------------------------------------------------------------------------
# Dataset Configuration
# -----------------------------------------------------------------------------
dataset:
  primary:
    name: "FM-bench-verified"
    source: "huggingface"
    identifier: "fm-universe/FM-bench-verified"
    cache_dir: ".cache/datasets"

  benchmark:
    size: 10
    selection_strategy: "diverse"
    complexity_range: ["simple", "moderate"]
    programs: []

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level: "INFO"

  console:
    enabled: true
    level: "INFO"

  file:
    enabled: true
    level: "DEBUG"
    path: "docs/youra_research/h-e1/code/results/experiment.log"

  iteration_logs:
    enabled: true
    format: "json"
    path: "docs/youra_research/h-e1/code/results/iteration_logs/{program_id}.json"

# -----------------------------------------------------------------------------
# Evaluation Configuration
# -----------------------------------------------------------------------------
evaluation:
  primary_metrics:
    - name: "proof_discharge_rate"
      target: 50.0
      higher_is_better: true

  figures:
    output_dir: "docs/youra_research/h-e1/figures"
    dpi: 300
    format: "png"

    plots:
      - name: "gate_metrics_comparison"
        type: "bar"
        required: true
      - name: "iteration_progress"
        type: "line"
        required: true
      - name: "feedback_heatmap"
        type: "heatmap"
        required: true
      - name: "convergence_histogram"
        type: "histogram"
        required: true
