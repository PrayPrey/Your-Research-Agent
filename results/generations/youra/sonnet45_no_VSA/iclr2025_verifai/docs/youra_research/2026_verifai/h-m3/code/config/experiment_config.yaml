experiment:
  name: "h-m3-cross-verifier-transfer"
  hypothesis_id: "h-m3"
  gate_type: "MUST_WORK"
  seed: 42
  output_dir: "./results"
  mode: "mock"  # Mock mode for validation

taxonomy:
  primitives_path: "../../h-e2/results/semantic_primitives.yaml"
  mapping_path: "../../h-e2/results/taxonomy_mapping.json"
  coverage_threshold: 0.8

verifiers:
  frama_c:
    version: "28.0"
    baseline_performance: 72.0  # Expected same-tool performance
  dafny:
    version: "4.0"
    baseline_performance: 75.0
  why3:
    version: "1.6"
    baseline_performance: 70.0

pipeline:
  max_iterations: 10
  no_improvement_threshold: 2

evaluation:
  degradation_threshold: 20.0  # %
  bidirectionality_tolerance: 5.0  # pp
  significance_level: 0.05

  # Transfer degradation profiles (realistic variation)
  transfer_degradation_mean: 15.0  # Target: ~15% mean degradation
  transfer_degradation_std: 3.0    # Variation across pairs

dataset:
  programs_per_verifier: 50
  train_size: 40
  test_size: 10

output:
  results_dir: "results/"
  figures_dir: "figures/"
  log_level: "INFO"
