# ═══════════════════════════════════════════════════════════════
# SECTION 2: Novelty Justification
# ═══════════════════════════════════════════════════════════════

novelty:
  core_novelty: |
    First demonstration of verifier-as-teacher for specification synthesis (vs. existing work on code generation).
    Novel semantic normalization layer enables cross-verifier transfer via abstraction of tool-specific feedback.
    Information-theoretic decomposition of feedback into Witness/Structure/Dependency dimensions reframes
    verifier-LLM interaction as an information theory problem, not just a tooling problem.

  vs_prior_work:
    - prior: "PropertyGPT (119 cites)"
      limitation: "RAG-based property generation for domain-specific smart contracts; requires similar-contract knowledge base"
      our_advance: "No domain-specific knowledge base; learns from verifier feedback directly via co-evolutionary refinement"

    - prior: "Astrogator (12 cites)"
      limitation: "Intermediate formal query language requires expert-written queries"
      our_advance: "Eliminates expert bottleneck; LLM generates directly in formal language guided by verifier feedback"

    - prior: "AutoSpec (5 stars)"
      limitation: "LLM+Frama-C integration demonstrated but no cross-verifier transfer or information-theoretic analysis"
      our_advance: "Semantic normalization for cross-tool portability + formalized feedback dimension taxonomy"

    - prior: "Verification-in-loop for code generation (70% of approaches from Phase 1)"
      limitation: "Assumes specifications exist; focuses only on code verification"
      our_advance: "Applies verification-in-loop to specification synthesis itself, addressing earlier bottleneck"

  paradigm_shift: |
    Reframes the formal methods + LLM integration problem: instead of assuming specs exist and focusing
    on code verification, tackles where specs come from. Demonstrates verifier feedback as a structured
    learning signal that systematically improves specification quality beyond retrieval or templating.

