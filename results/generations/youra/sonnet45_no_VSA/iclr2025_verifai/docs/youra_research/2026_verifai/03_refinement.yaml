# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

mechanism:
  core_mechanism: |
    Structured verifier feedback provides semantic supervision by exposing the gap between
    current specification and verifiable correctness. The three informational dimensions
    (Witness, Structure, Dependency) encode complementary repair signals:
    - Witness Instantiation: Concrete counterexamples show WHERE specs fail
    - Logical Structure: Proof obligations show WHAT needs to be proven
    - Dependency Preservation: Failure localization shows WHY proofs fail

    The LLM uses these signals to iteratively refine specifications through staged progression
    (types → pre → post → inv), where each stage has automated validation (type checker,
    contract checker, prover). The semantic normalization layer abstracts tool-specific feedback
    into universal repair primitives (category + obligation slice + witness), enabling transfer
    across verifiers.

  intermediate_steps:
    - step: 1
      description: "LLM generates initial formal specification in target language (Dafny/ACSL)"
    - step: 2
      description: "Verifier attempts proof and returns structured feedback (witness + obligations + dependencies)"
    - step: 3
      description: "Semantic normalization layer abstracts feedback into repair primitives"
    - step: 4
      description: "LLM refines specification based on normalized feedback signals"
    - step: 5
      description: "Repeat steps 2-4 until proof discharge or iteration budget exhausted"

  moderating_factors:
    - factor: "Program Complexity"
      effect: "More complex programs (e.g., nondeterministic behavior, external dependencies) may require more iterations or fail to converge"
    - factor: "Verifier Completeness"
      effect: "Incomplete automated provers may timeout on valid specs, requiring verification budget constraints"
    - factor: "Feedback Richness"
      effect: "Performance scales with preserved informational dimensions (Witness > Structure > Dependency)"

