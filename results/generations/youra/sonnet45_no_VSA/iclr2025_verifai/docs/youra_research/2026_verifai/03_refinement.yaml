# SECTION 5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  included:
    - "Function-level and module-level C programs with deterministic behavior"
    - "Verifiers: Frama-C WP plugin, Dafny, Why3"
    - "Specification languages: ACSL, Dafny contracts, Why3 annotations"
    - "Programs with verifiable safety and functional properties"

  excluded:
    - "Programs with heavy external library dependencies (unverifiable components)"
    - "Highly nondeterministic or concurrent programs (convergence issues)"
    - "Domain-specific languages without mature verifier ecosystems"
    - "Real-time or embedded system constraints (out of scope for formal verification focus)"

  limitations:
    - "Cross-domain transfer (systems → mathematics → contracts) may show >40% degradation"
    - "Verifier incompleteness may cause timeouts on valid specs; requires verification budget constraints"
    - "Semantic normalization's causal structure preservation requires empirical validation"
    - "Mutation kill rate is proxy for semantic strength, not true logical monotonicity"

  future_work:
    - "Extend to concurrent programs with rely-guarantee reasoning"
    - "Investigate cross-domain transfer with adaptive normalization layers"
    - "Explore fine-tuning LLMs on verifier feedback for improved repair quality"
    - "Apply to low-resource programming languages with limited verification tool maturity"

