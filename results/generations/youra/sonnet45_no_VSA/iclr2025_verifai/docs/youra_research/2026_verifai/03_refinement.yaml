# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-VerifierTeacher-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under formal specification synthesis for programs with verifiable properties,
    if LLMs receive structured verifier feedback decomposed into three informational dimensions
    (Witness Instantiation, Logical Structure, Dependency Preservation) and iterate through
    staged refinement (types → preconditions → postconditions → invariants),
    then the synthesized specifications will achieve ≥80% proof discharge rate within ≤10 iterations
    and demonstrate cross-verifier portability via semantic normalization,
    because structured feedback encodes semantic constraints that guide specification refinement
    more effectively than unstructured iteration or single-shot synthesis.
  alternative_hypothesis_h0: |
    There is no significant difference in proof discharge rate or specification strength between
    verifier-driven iterative refinement and compute-matched single-shot LLM synthesis
    with self-consistency sampling.

