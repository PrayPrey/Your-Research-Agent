# SECTION 4: Experimental Design
# ═══════════════════════════════════════════════════════════════

experimental_design:
  dataset:
    source: "Verified C programs with gold ACSL annotations"
    examples: "Frama-C tutorial examples, Juliet benchmark verified subset, academic verification benchmarks"
    size: "≥100 programs with varying complexity (function-level to module-level)"
    split: "70% development, 30% held-out test"

  conditions:
    - condition_id: "C_Full"
      name: "Full Structured Feedback"
      description: "Tag + Obligation Slice + Witness Instance"
    - condition_id: "B_Obligation"
      name: "Tag + Obligation Slice"
      description: "Semantic category + proof obligation context"
    - condition_id: "A_Tag"
      name: "Tag Only"
      description: "Category label (e.g., 'missing precondition')"
    - condition_id: "Raw"
      name: "Raw Error Messages"
      description: "Unstructured verifier output"
    - condition_id: "SingleShot"
      name: "Single-Shot Baseline"
      description: "Compute-matched self-consistency sampling"

  procedure:
    - "For each program, initialize with natural language description of intended behavior"
    - "Run iterative refinement loop (≤10 iterations) with assigned feedback condition"
    - "Record proof discharge rate, mutation kill rate, iterations to convergence"
    - "For cross-verifier evaluation: train on Frama-C, test on Dafny and Why3"
    - "Enforce compute budgets: equal total tokens + verifier wall-clock time per program"

  baselines:
    - name: "Zero-shot LLM"
      description: "Single-pass specification generation without feedback"
    - name: "Non-expert human specs"
      description: "Specifications written by programmers without formal methods expertise"
    - name: "Compute-matched single-shot"
      description: "All budget spent on self-consistency sampling in one iteration"

  metrics:
    primary: "Proof Discharge Rate (%)"
    secondary:
      - "Mutation Kill Rate (% relative to gold spec)"
      - "Iterations to Convergence"
      - "Cross-Verifier Performance Retention (%)"
      - "Implication Check Results (synthesized ⇒ gold, gold ⇒ synthesized)"

