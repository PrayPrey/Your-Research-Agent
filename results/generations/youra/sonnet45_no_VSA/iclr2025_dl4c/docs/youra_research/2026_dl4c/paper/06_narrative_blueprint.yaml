# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  # ─────────────────────────────────────────────────────────────────────────────
  # ABSTRACT
  # ─────────────────────────────────────────────────────────────────────────────
  abstract:
    narrative_purpose: "Compress the entire story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "Proxy validation is prerequisite to multi-objective RL; not all quality dimensions are equally measurable."
    structure_notes: |
      - Sentence 1-2: Code generation models pass tests but produce inefficient code (Becker 19% slowdown). Multi-dimensional rewards (CodeBLEU, efficiency, style) proposed but not pre-validated.
      - Sentence 3: We present a four-stage validation pipeline testing measurement reliability, conditional independence, generalization, and optimization constraints.
      - Sentence 4-5: PoC validation: CodeBLEU demonstrates reliability (CV=1.39%, d=4.51, ρ=0.949); efficiency metrics require hardware instrumentation (PoC CV=6.22% vs literature 2-3% with perf counters).
      - Sentence 6: Establishes construct validation as prerequisite for proxy-based optimization, preventing wasted compute on unmeasurable signals.
    avoid:
      - "Citations in abstract"
      - "Vague claims like 'significant improvement' without numbers"
      - "Undefined acronyms (spell out RL, CV, etc. on first use or avoid)"

  # ─────────────────────────────────────────────────────────────────────────────
  # INTRODUCTION
  # ─────────────────────────────────────────────────────────────────────────────
  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"

    hook_strategy: "Surprising statistic (CodeBLEU CV=1.39% vs runtime CV=6.22%, 24% over threshold) establishes tension: not all proxies equal."

    problem_escalation: |
      1. Surface: Code models achieve high pass@k but produce inefficient code (Becker: 19% slowdown despite correctness).
      2. Deeper: Existing work (CodeRL, CURE, CodeUltraFeedback) adopts auxiliary metrics (CodeBLEU, runtime, style) without pre-validation. If proxies are noisy/redundant, RL optimizes false signals.
      3. Gap: No systematic framework for testing proxy construct validity BEFORE optimization. Reward engineering is heuristic art, not validated methodology.

    insight_preview: "We reframe proxy adoption as measurement theory problem: test reliability (CV ≤5%), discriminability (Cohen's d ≥0.8), cross-platform stability (Spearman ρ ≥0.8) BEFORE RL training. Key finding: structural metrics (CodeBLEU) are deterministic; efficiency metrics need hardware instrumentation."

    contributions_framing: |
      Building on this insight, we make three contributions:

      1. **Methodological**: Four-stage validation pipeline (reliability → conditional independence → generalization → optimization)
         as reusable framework for proxy validation in RL reward design.

      2. **Empirical**: PoC validation demonstrates CodeBLEU measurement reliability (CV=1.39%, d=4.51, ρ=0.949) and identifies
         efficiency measurement prerequisites (hardware performance counters for CV ~2-3%, not PoC synthetic wall-clock model).

      3. **Practical**: Scoped gate design allows partial validation (≥1 proxy pass = continue with reduced set),
         preventing all-or-nothing failures. Negative results (proxy fails Stage 1) are publishable and prevent wasted compute.

    transition_to_related_work: "Our work bridges measurement theory from psychometrics (construct validity, reliability testing) with ML reward design for code generation. We now review existing proxy-based optimization approaches and their validation practices (or lack thereof)."

  # ─────────────────────────────────────────────────────────────────────────────
  # RELATED WORK
  # ─────────────────────────────────────────────────────────────────────────────
  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our four-stage pipeline"

    positioning_strategy: |
      Our work is unique in applying construct validation from measurement theory to RL reward design.
      Existing work bundles proxies post-hoc; we test them pre-hoc. Position as methodological innovation,
      not just empirical contribution.

    key_comparison_points:
      - area: "Execution-based RL for code (CodeRL, CURE, DRIVE-RLVR)"
        limitation_to_highlight: "Use execution-only rewards. Becker (2025) shows this produces 19% slower code despite passing tests."
        how_we_differ: "We validate multi-dimensional proxies (structural similarity, efficiency, style) to address this gap—but only AFTER testing measurement reliability."

      - area: "Proxy-based alignment (CodeUltraFeedback, SEAlign, CodePRM)"
        limitation_to_highlight: "Adopt auxiliary metrics (CodeBLEU, execution feedback, PR-style scores) without pre-validation. No measurement reliability testing (CV, Cohen's d, Spearman ρ)."
        how_we_differ: "We introduce four-stage validation pipeline testing construct validity BEFORE optimization. Scoped gates prevent wasted compute on noisy proxies."

      - area: "Code generation evaluation (CodeBLEU, RepoBench, ExeDS)"
        limitation_to_highlight: "Validate correlation with human judgment (Chen et al. 2021: CodeBLEU vs developer ratings). Stop at correlation, not measurement reliability."
        how_we_differ: "We extend to stability testing: intra-implementation CV, inter-complexity-class Cohen's d, cross-hardware Spearman ρ. Reliability ≠ validity."

      - area: "Multi-objective RL (Lei Chen et al. 2025: MSRL for chart-to-code)"
        limitation_to_highlight: "Demonstrate multi-granularity rewards break SFT plateau. Do not test conditional independence (are proxies redundant after controlling for execution?)."
        how_we_differ: "Our Stage 2 (h-e2) tests hierarchical regression: Outcome ~ Execution + Proxy. If ΔR² < 0.03, proxy is conditionally redundant."

    papers_to_discuss:
      - "Becker et al. (2025): AI-generated code 19% slower — motivates efficiency dimension"
      - "CodeRL (Le et al. 2022): Foundational execution-based RL"
      - "CURE (NeurIPS 2025): Co-evolving coder + tester, but no pre-validation"
      - "CodeUltraFeedback (Weyssow et al. 2024): RLHF with LLM-as-judge, no measurement testing"
      - "Chen et al. (2021): CodeBLEU-human judgment correlation (we extend to reliability)"
      - "Lei Chen et al. (2025): Multi-granularity rewards for chart-to-code (shows multi-objective can work)"
      - "COFFE (2025): CPU instruction counting for efficiency measurement (our efficiency proxy design)"

    avoid:
      - "Criticizing prior work unfairly (e.g., 'they failed to...' when it wasn't their goal)"
      - "Missing CodeRL/CURE as they are RL-for-code baselines everyone knows"
      - "Listing every code generation paper—focus on proxy-based optimization and measurement validation"

  # ─────────────────────────────────────────────────────────────────────────────
  # METHODOLOGY
  # ─────────────────────────────────────────────────────────────────────────────
  methodology:
    narrative_purpose: "Explain WHY four-stage pipeline solves proxy validation problem"

    connection_to_insight: |
      Key insight: Proxy validation is compositional (different dimensions have different measurement profiles).
      Four-stage pipeline addresses this by testing each proxy independently through increasing rigor:
      Stage 1 (measurement reliability), Stage 2 (conditional independence), Stage 3 (cross-domain generalization),
      Stage 4 (optimization constraints). Early-stage failures prevent wasted investment in later stages.

    key_design_decisions:
      - decision: "Stage 1 uses three criteria (CV ≤5%, Cohen's d ≥0.8, Spearman ρ ≥0.8) instead of single threshold"
        rationale: "CV tests intra-implementation stability (same code measured 5 times); Cohen's d tests inter-complexity-class separation (O(n) vs O(n²)); Spearman ρ tests cross-hardware generalization (AWS vs local GPU). All three required for construct validity."
        alternatives_considered: "Single correlation threshold (e.g., Pearson r > 0.7 with human judgment). Rejected: correlation ≠ reliability. A metric can correlate with humans but be noisy (high CV)."

      - decision: "Scoped MUST_WORK gate: ≥1 proxy validates = PASS (not all-or-nothing)"
        rationale: "Partial validation is scientifically valid. If CodeBLEU passes but runtime fails, proceed with CodeBLEU-only optimization. Prevents binary failure where one noisy proxy blocks entire hypothesis."
        alternatives_considered: "All proxies must validate (strict gate). Rejected: Too brittle. Efficiency measurement difficulty (need perf counters) shouldn't block structural similarity validation."

      - decision: "PoC uses synthetic data (500 solutions simulated) before real infrastructure"
        rationale: "Validates methodology (gate logic, statistical framework, visualization) without 1000+ GPU hour investment. Numerical claims are provisional; methodology transfers to real validation."
        alternatives_considered: "Real CodeLlama-7B + HumanEval upfront. Rejected: Too expensive if methodology fails. Two-phase approach (PoC methodology → real validation) reduces risk."

    intuition_building: |
      **Figure 1** (workflow diagram): Four-stage pipeline as funnel: Stage 1 filters noisy proxies → Stage 2 tests independence → Stage 3 checks generalization → Stage 4 optimizes. Each stage acts as checkpoint, preventing wasted compute.

      **Example walkthrough**: CodeBLEU enters Stage 1 → CV=1.39% (PASS ≤5%) → Cohen's d=4.51 (PASS ≥0.8) → Spearman ρ=0.949 (PASS ≥0.8) → Proceeds to Stage 2. Runtime proxy enters Stage 1 → CV=6.22% (FAIL >5%) → Stops, flagged for hardware counter re-implementation.

    technical_depth_balance: |
      Main paper: Statistical framework overview (CV, Cohen's d, Spearman ρ definitions), scoped gate logic, PoC validation results.
      Appendix: Full statistical derivations, per-problem breakdown, PoC simulation code, threshold sensitivity analysis.

  # ─────────────────────────────────────────────────────────────────────────────
  # EXPERIMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  experiments:
    narrative_purpose: "Design experiments that test Stage 1 validation (h-e1) with PoC synthetic data"

    experimental_questions:
      - question: "Does CodeBLEU demonstrate measurement reliability (CV ≤5%, Cohen's d ≥0.8, Spearman ρ ≥0.8)?"
        experiment: "500 synthetic solutions × 5 repeated measurements → compute intra-implementation CV. Controlled complexity tasks (O(n) vs O(n²)) → compute inter-class Cohen's d. Cross-platform simulation → compute Spearman ρ."
        expected_outcome: "CodeBLEU PASS all criteria (deterministic computation predicts CV ≈0-2%, large effect size d >0.8)."

      - question: "Does PoC runtime efficiency proxy (synthetic wall-clock model) meet CV ≤5% threshold?"
        experiment: "Same 500 solutions × 5 reps with synthetic Gaussian noise (σ = 5% of mean) → compute CV."
        expected_outcome: "Marginal result (literature suggests real perf counters achieve CV ~2-3%, but PoC synthetic noise may differ)."

      - question: "Does multi-criteria gate logic function correctly (discriminate PASS vs FAIL)?"
        experiment: "Evaluate 3 proxies × 3 criteria → gate verdict (≥1 proxy full-pass = scoped PASS)."
        expected_outcome: "Gate returns PARTIAL PASS with CodeBLEU validated, runtime flagged for real hardware validation."

    baseline_rationale: "No baselines—this is a measurement validation study, not model comparison. We test proxies against statistical thresholds (CV ≤5%, d ≥0.8, ρ ≥0.8), not other models."

    dataset_rationale: "PoC uses synthetic data (500 solutions simulated) to validate methodology before infrastructure investment. Real validation (Phase 4 full-scale) would use CodeLlama-7B on HumanEval (164 problems)."

    metric_rationale: |
      - **Coefficient of Variation (CV)**: Standard reliability metric in measurement theory. CV = σ/μ × 100%. Threshold: CV ≤5% (high reliability, acceptable for RL optimization).
      - **Cohen's d**: Effect size for inter-group separation. d = (μ₁ - μ₂) / σ_pooled. Threshold: d ≥0.8 (large effect per Cohen's conventions). Tests whether metric distinguishes complexity classes.
      - **Spearman ρ**: Rank correlation for cross-platform stability. ρ = rank correlation coefficient. Threshold: ρ ≥0.8 (strong monotonic relationship). Tests generalization across hardware.

    fairness_considerations: |
      Not applicable (no model comparison). Statistical thresholds (CV ≤5%, d ≥0.8, ρ ≥0.8) are from standard measurement theory and social science practice.
      Sensitivity analysis (Appendix) tests threshold robustness (e.g., CV ≤3% vs ≤5% vs ≤7%).

  # ─────────────────────────────────────────────────────────────────────────────
  # RESULTS
  # ─────────────────────────────────────────────────────────────────────────────
  results:
    narrative_purpose: "Present evidence that validates CodeBLEU and identifies runtime measurement prerequisites"

    main_result_highlight: "**CodeBLEU demonstrates measurement reliability** with CV=1.39% (72% below threshold), Cohen's d=4.51 (5.6× above threshold), Spearman ρ=0.949. PoC runtime proxy marginally fails CV (6.22% vs 5.0%, 24% over), but literature suggests real perf counters achieve 2-3%."

    result_presentation_order:
      - result: "Table 1: Gate Metrics Comparison (3 proxies × 3 criteria)"
        purpose: "Lead with comprehensive view: CodeBLEU passes all, runtime partially fails, PR-style fails (expected). Establishes '1/3 proxies validated' finding upfront."

      - result: "Figure 1: Gate Metrics Bar Chart (CV, Cohen's d, Spearman ρ vs thresholds)"
        purpose: "Visual contrast: CodeBLEU bars far exceed thresholds, runtime marginally misses CV, PR-style far below. Supports compositional validation insight."

      - result: "Subsection 5.1: CodeBLEU Reliability Analysis"
        purpose: "Deep dive on validated proxy: Why CV so low (deterministic computation)? Why d so high (structural complexity separation)? Why ρ near-perfect (platform-invariant)?"

      - result: "Subsection 5.2: Runtime Proxy Marginal Failure Analysis"
        purpose: "Explain surprising finding (6.22% vs 5.0%). Present competing explanations: (1) PoC synthetic noise mismatch [most likely], (2) threshold too strict [medium], (3) fundamental instability [low]. Cite COFFE (2025) literature for real perf counter performance."

      - result: "Subsection 5.3: Scoped Gate Verdict"
        purpose: "Gate logic demonstrates discriminative power: 1/3 full-pass → scoped PASS → hypothesis continues with CodeBLEU. Validates 'test before optimize' principle."

    surprising_result_handling: "Runtime proxy marginal failure (24% over threshold) is surprising because we expected clear pass/fail. Subsection 5.2 presents three competing explanations with plausibility rankings and cites COFFE literature. Conclude: most likely PoC artifact, recommend real validation with perf counters."

    avoid:
      - "Table 1 shows metrics, Figure 1 shows comparison (no interpretation) — every result gets 'so what' analysis"
      - "Cherry-picking: Report ALL proxies including PR-style failure (expected, placeholder implementation)"
      - "Hiding negative results: Runtime failure is prominently discussed, not buried"

  # ─────────────────────────────────────────────────────────────────────────────
  # DISCUSSION
  # ─────────────────────────────────────────────────────────────────────────────
  discussion:
    narrative_purpose: "Interpret PoC results, acknowledge limitations, position contributions"

    key_findings_interpretation: |
      The h-e1 PoC successfully validates the four-stage pipeline's methodology (gate logic functional, statistical framework correct,
      visualization generates). CodeBLEU validation is high-confidence (deterministic computation predicts near-zero CV; observed 1.39%
      consistent). Runtime proxy failure is low-confidence (PoC synthetic noise artifact; literature shows real perf counters achieve
      2-3% CV). The scoped gate design (≥1 proxy = PASS) allows partial validation, preventing all-or-nothing failure.

      **Theoretical implication**: Proxy validation is compositional. Structural metrics (AST-based) have favorable measurement properties
      (deterministic, platform-invariant). Efficiency metrics require specialized instrumentation (hardware performance counters, not
      wall-clock time). Style metrics require training data (SWE-bench, CodeBERT fine-tuning). This heterogeneity justifies independent
      validation per proxy, not bundled testing.

    honest_limitations:
      - limitation: "All results from PoC synthetic data (500 simulated solutions), not real CodeLlama-7B generation on HumanEval."
        why_acceptable: "PoC goal is methodology validation (does gate logic work? statistical framework compute correctly?). Numerical claims (CV=1.39%) are provisional pending real validation. Two-phase approach (PoC → real) reduces risk of 1000+ GPU hour investment on flawed methodology."
        future_mitigation: "Phase 4 full-scale validation: CodeLlama-7B + HumanEval (164 problems) + perf hardware counters. Expected to confirm CodeBLEU CV ~0-2%, runtime CV ~2-3% (passing threshold)."

      - limitation: "Only 1/3 proxies validated; multi-objective hypothesis proceeds with single proxy (CodeBLEU)."
        why_acceptable: "Scoped gate design allows partial validation. Single validated proxy sufficient for h-e2 (conditional independence testing). Efficiency and style proxies can be re-validated in parallel with h-e2 execution."
        future_mitigation: "Re-test runtime proxy with real perf counters (Linux perf stat -e instructions). Implement PR-style proxy with SWE-bench training. If both validate, upgrade to triple-objective optimization (execution + CodeBLEU + efficiency + style)."

      - limitation: "Runtime proxy failure attributed to PoC design, not empirically confirmed."
        why_acceptable: "COFFE (2025) literature reports instruction-count CV ~2-3% with perf counters. PoC used random Gaussian noise (σ=5%) which doesn't match real hardware counter behavior. Inference is reasonable but requires validation."
        future_mitigation: "Ablation study: Compare PoC synthetic noise model vs real perf measurements on same 50 HumanEval problems. Measure actual CV, confirm COFFE's 2-3% claim."

    broader_impact_statement: |
      **Positive**: Four-stage validation pipeline prevents wasted compute on unmeasurable proxies, reducing environmental impact
      (carbon footprint from unnecessary GPU training). Methodological contribution transfers beyond code generation: image quality
      proxies (FID, IS), text generation (BLEU, BERTScore), RL reward design in general.

      **Risks**: If efficiency metrics prove unmeasurable (even with perf counters), field may abandon performance optimization,
      accepting Becker's 19% slowdown as unavoidable. However, COFFE literature suggests efficiency IS measurable with proper
      instrumentation—our work provides validation framework to confirm.

      **Equity**: Open-source pipeline implementation (ProxyMetricPoC on GitHub) levels playing field. Academic labs without
      1000 GPU hour budgets can PoC-validate proxies before infrastructure investment.

  # ─────────────────────────────────────────────────────────────────────────────
  # CONCLUSION
  # ─────────────────────────────────────────────────────────────────────────────
  conclusion:
    narrative_purpose: "Reinforce 'test before optimize' message + open future directions"

    callback_to_hook: |
      We opened by observing that structural similarity (CodeBLEU) achieves CV=1.39% while runtime measurements exhibit 24% higher
      variance than acceptable—revealing that not all proxy metrics are created equal. Our four-stage validation pipeline addresses
      this heterogeneity by testing each proxy independently, filtering unreliable signals before RL training. This converts reward
      engineering from heuristic art to scientifically validated methodology.

    memorable_ending: "Before optimizing for multi-dimensional code quality, we must first validate that quality dimensions are measurable. Our work establishes the prerequisite—now the field can optimize with confidence."

    future_work_vision: |
      **Immediate**: Complete h-e2 (conditional independence testing): Does CodeBLEU explain ≥3% additional variance in developer
      acceptance after controlling for execution? If yes, proceed to h-m1 (constrained multi-objective RL). Re-validate runtime proxy
      with real perf counters.

      **Medium-term**: Extend pipeline to other quality dimensions: modularity (function decomposition), maintainability (cyclomatic
      complexity), documentation (docstring coverage). Test whether compositional validation generalizes beyond structural/efficiency/style.

      **Long-term**: Validated multi-dimensional code generation system deployed in production (GitHub Copilot, Cursor):
      execution (hard constraint) + CodeBLEU (structural) + CPU instruction count (efficiency) → code that's correct, readable, AND fast.
      Measure impact on developer revision cycles (time-to-merge, PR acceptance rates).

