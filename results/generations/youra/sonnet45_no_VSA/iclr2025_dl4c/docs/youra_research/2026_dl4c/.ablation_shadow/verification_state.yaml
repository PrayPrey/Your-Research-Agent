main_hypothesis:
  id: H-ProxyValidation-v1
  title: Validated Proxies Enable Pareto-Dominant Multi-Objective Code Generation
  statement: Under code generation tasks with existing test suites (HumanEval, SWE-bench, MBPP), if models are trained via
    constrained multi-objective RL using validated proxy metrics (those passing measurement reliability, conditional independence,
    and cross-domain generalization stages), then they will achieve ≥5% improvement in downstream developer acceptance outcomes
    (edit distance to accepted solutions, PR acceptance rates) while maintaining per-task execution pass rates within 5% of
    baseline, because validated proxies capture non-redundant quality dimensions (structural similarity, runtime efficiency,
    style conformity) that influence developer acceptance beyond execution correctness alone.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval (164), MBPP (500), SWE-bench Lite (300)
    model: CodeLlama-7B-Instruct (same checkpoint across conditions)
    optimizer: PPO with Lagrangian relaxation for constraints
    hyperparameters:
      learning_rate_range: 1e-6 to 5e-5
      batch_size: 32
      training_steps: 50000 (early stopping on validation)
      seeds: '[42, 123, 456, 789, 1011]'
      lagrangian_penalty_init: 1.0
      constraint_threshold: 0.05
  baseline_comparison:
