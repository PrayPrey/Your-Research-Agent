# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Execution correctness is necessary but insufficient for code quality"
      status: "BUILD_ON"
      evidence: "Becker et al. (2025) empirically found AI-generated code 19% slower despite passing tests"

    - claim: "Multi-dimensional rewards can break optimization plateaus"
      status: "BUILD_ON"
      evidence: "Lei Chen et al. (2025) demonstrated multi-granularity rewards (textual + visual) outperform single-objective SFT"

    - claim: "CodeBLEU correlates with human judgment of code quality"
      status: "BUILD_ON"
      evidence: "Chen et al. (2021) validated CodeBLEU against developer assessments in original HumanEval paper"

    - claim: "Constrained RL is technically feasible for multi-objective optimization"
      status: "BUILD_ON"
      evidence: "Lagrangian relaxation and rejection-based methods are standard in OpenRLHF and prior multi-objective RL literature"

    - claim: "Proxy metrics beyond execution predict developer acceptance with validated measurement"
      status: "PROVE_NEW"
      evidence: "This is the core hypothesis to be tested via four-stage validation pipeline"

    - claim: "Validated proxies yield Pareto-dominant improvements under constrained RL"
      status: "PROVE_NEW"
      evidence: "Primary hypothesis requiring empirical validation"

  scope_reduction_percentage: 67
  phase2b_4_instructions: |
    Focus verification on:
    1. Proxy conditional independence (Stage 2 validation)
    2. Cross-domain generalization stability (Stage 3 validation)
    3. Per-task execution constraint satisfaction during RL (Stage 4)
    4. Pareto dominance demonstration with ≥5% secondary improvement

    Do NOT re-verify:
    - Basic RL feasibility (established via prior work)
    - CodeBLEU-human judgment correlation (established)
    - Multi-dimensional reward existence proof (established via Lei Chen et al.)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ProxyValidation-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under code generation tasks with existing test suites (HumanEval, SWE-bench, MBPP),
    if models are trained via constrained multi-objective RL using validated proxy metrics
    (those passing measurement reliability, conditional independence, and cross-domain generalization stages),
    then they will achieve ≥5% improvement in downstream developer acceptance outcomes
    (edit distance to accepted solutions, PR acceptance rates) while maintaining per-task execution
    pass rates within 5% of baseline,
    because validated proxies capture non-redundant quality dimensions (structural similarity, runtime efficiency,
    style conformity) that influence developer acceptance beyond execution correctness alone.

  alternative_hypothesis_h0: |
    After controlling for execution correctness, proxy metrics (CodeBLEU, normalized runtime ratio,
    learned PR-style score) do NOT explain significant additional variance (ΔR² < 0.03, p > 0.01)
    in behavioral outcomes (edit distance, PR acceptance, hidden test performance), OR constrained
    multi-objective models do NOT achieve ≥5% improvement in secondary metrics while maintaining
    per-task execution regressions ≤5%.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training Condition"
      type: "categorical"
      operationalization: "RL training configuration"
      levels:
        - "Execution-Only (Condition A): Unit test pass/fail reward only"
        - "Sequential Optimization (Condition B): Execution training followed by preference fine-tuning"
        - "Constrained Multi-Objective (Condition C): Simultaneous optimization with validated proxies and per-task execution constraint"

    - name: "Proxy Dimension"
      type: "categorical"
      operationalization: "Secondary reward signal type (ablation factor)"
      levels:
        - "CodeBLEU (structural quality)"
        - "Normalized Runtime Ratio (efficiency)"
        - "Learned PR-Style Score (conformity)"

  dependent:
    - name: "Edit Distance to Accepted Solution"
      type: "continuous"
      operationalization: "Levenshtein distance between generated code and human-accepted PR diff (SWE-bench)"
      primary: true

    - name: "PR Acceptance Rate"
      type: "continuous"
      operationalization: "Percentage of generated solutions matching acceptance patterns from SWE-bench training data (0-100%)"
      primary: false

    - name: "Hidden Test Pass Rate"
      type: "continuous"
      operationalization: "Percentage passing held-out test cases not used during training (HumanEval hidden split, 0-100%)"
      primary: false

    - name: "Execution Pass Rate (Visible Tests)"
      type: "continuous"
      operationalization: "pass@k on visible test suite (HumanEval/SWE-bench/MBPP, 0-100%)"
      primary: false

    - name: "Proxy Metric Scores"
      type: "continuous"
      operationalization: "CodeBLEU score (0-1), normalized runtime ratio (vs reference), style conformity score (0-1)"
      primary: false

  controlled:
    - name: "Base Model Checkpoint"
      operationalization: "Same pretrained model initialization across all conditions"

    - name: "Hardware Environment"
      operationalization: "Containerized execution with deterministic seeds, fixed GPU/CPU allocation"

    - name: "Benchmark Distribution"
      operationalization: "Fixed train/test splits for HumanEval, MBPP, SWE-bench"

    - name: "Per-Task Execution Constraint"
      operationalization: "≤5% pass rate regression per problem monitored during training"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Validated proxies (CodeBLEU, efficiency, style) capture quality dimensions orthogonal to execution correctness"
      evidence: "Conditional independence test: proxies explain ≥3% additional variance in behavioral outcomes after controlling for execution pass rate, with effect persisting within perfect-execution stratum (Prof. Vera Exchange 6, Prof. Rex Exchange 14)"
      falsifier: "If proxy effects vanish within 100%-correct solutions stratum (ΔR² < 0.03 in stratified regression), proxies are conditionally redundant"

    - step: 2
      description: "Constrained multi-objective RL simultaneously optimizes validated proxies while enforcing per-task execution safety"
      evidence: "Lagrangian relaxation enforces execution as hard constraint with per-problem pass rate monitoring (Prof. Pax Exchange 15, Prof. Vera Exchange 10)"
      falsifier: "If >10% of problems show >5% pass rate regression, constraint enforcement fails"

    - step: 3
      description: "Multi-objective optimization yields Pareto improvements: secondary metrics improve without execution degradation"
      evidence: "Fractional factorial ablation tests whether interaction effects exist (≥5% variance) or objectives are additive (Prof. Rex Exchange 9, Dr. Sage Exchange 12)"
      falsifier: "If Condition C (multi-objective) does not dominate Condition A (execution-only) and B (sequential) on Pareto frontier, added complexity is unjustified"

    - step: 4
      description: "Improved proxy metrics translate to higher downstream developer acceptance outcomes"
      evidence: "Hierarchical regression establishes predictive link from proxies to behavioral outcomes (edit distance, PR acceptance); temporal generalization confirms stability (Dr. Sage Exchange 12)"
      falsifier: "If improvements disappear on temporally held-out benchmarks (post-2023 SWE-bench), proxies optimize artifacts not enduring quality"

  key_tension: "Whether proxy effects represent genuine quality dimensions or are conditionally redundant signals that only matter when execution is imperfect (Prof. Rex's stratified independence critique, Exchange 14)"

  evidence_summary: |
    Causal chain supported by: (1) Becker et al. finding of 19% slowdown despite correctness,
    (2) Lei Chen et al. multi-granularity reward success, (3) SWE-bench PR acceptance providing
    behavioral outcome labels, (4) CodeBLEU validation against human judgment (Chen et al. 2021),
    (5) Standard constrained RL techniques (Lagrangian, rejection-based) proving feasibility.

    Key empirical tests: conditional independence within perfect-execution stratum (Step 1),
    per-task constraint monitoring (Step 2), Pareto dominance vs baselines (Step 3),
    temporal generalization on post-cutoff data (Step 4).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "CodeBLEU captures structural quality independent of execution correctness"
    supporting_evidence: "Chen et al. (2021) validated CodeBLEU against human judgments; however, Prof. Pax noted correlation with reference similarity may not generalize to hidden tests (Exchange 8)"
    consequence_if_violated: "If CodeBLEU is just a smoother surrogate for pass@k (partial correlation vanishes), it contributes no independent signal and should be dropped from optimization"

  - id: "A2"
    assumption: "Runtime measurements under containerized conditions reliably distinguish complexity classes"
    supporting_evidence: "Normalized runtime ratios used in competitive programming; however, Prof. Rex demands CV ≤5% and inter-class Cohen's d ≥ 0.8 validation (Exchange 14)"
    consequence_if_violated: "If measurement noise swamps signal (CV >5%) or complexity classes overlap (d <0.8), efficiency reward shapes noise not genuine algorithmic improvement"

  - id: "A3"
    assumption: "Learned PR-style signals generalize across repositories and capture domain-general quality"
    supporting_evidence: "SWE-bench spans 12 diverse Python repos; however, Prof. Pax requires cross-repo validation with ≤20% ensemble disagreement (Exchange 15)"
    consequence_if_violated: "If style signals collapse under leave-cluster-out validation or show high disagreement on quality features, they encode repository-specific artifacts not generalizable preference"

  - id: "A4"
    assumption: "Developer acceptance is influenced by multiple quality dimensions beyond execution correctness"
    supporting_evidence: "Becker et al. (2025) empirical finding: 19% slowdown despite correctness suggests unmet dimensions; however, requires formal causal model validation (Prof. Rex Exchange 14)"
    consequence_if_violated: "If formal SEM/hierarchical regression shows execution alone explains all variance in acceptance (proxies add ΔR² < 0.03), multi-dimensional hypothesis collapses to execution-sufficiency"

  - id: "A5"
    assumption: "Interaction effects between quality dimensions exist and are detectable"
    supporting_evidence: "Lei Chen et al. showed multi-granularity rewards break plateaus; however, requires fractional factorial test showing ≥5% interaction variance (Prof. Vera Exchange 10)"
    consequence_if_violated: "If interaction terms explain <5% additional variance, objectives are additive and multi-objective coupling is unnecessary complexity — simplify to additive model"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Code generation tasks with existing execution-testable benchmarks (HumanEval, MBPP, SWE-bench)
    - Python programming language (primary benchmark coverage)
    - Tasks where execution correctness is measurable via unit tests or integration tests
    - Domains with behavioral outcome labels (PR acceptance, edit distance to human revisions)
    - Constrained optimization scenarios where execution correctness is non-negotiable (≤5% per-task regression)

  does_not_apply_to: |
    - Programming languages without execution benchmarks (markup, natural language)
    - Open-ended code generation without test infrastructure (creative coding, exploratory programming)
    - Tasks requiring new benchmark creation or synthetic data generation (violates feasibility constraints)
    - Domains without behavioral outcome data (no PR history, no accepted solution references)
    - Scenarios tolerating execution degradation for other quality improvements (execution is hard constraint)

  known_limitations: |
    - Benchmark dependence: Findings may not generalize beyond Python or execution-testable tasks
    - Temporal validity: Style/efficiency preferences may shift over time (mitigated via temporal hold-out)
    - Domain specificity: PR-style signals may be repository-specific (addressed via cross-repo validation)
    - Measurement precision: Efficiency signals subject to hardware noise (requires CV ≤5% validation)
    - Proxy selection: Only three candidates tested (CodeBLEU, efficiency, style); other dimensions unexplored

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

testable_predictions:
  - id: "P1"
    primary: true
    prediction: "At least ONE proxy (CodeBLEU, normalized runtime ratio, or learned PR-style) will survive all four validation stages"
    success_criteria: |
      Stage 1 (Reliability): Measurement CV ≤5%, Cohen's d ≥ 0.8 between complexity classes, Spearman ρ ≥ 0.8 cross-hardware
      Stage 2 (Independence): ΔR² ≥ 0.03 in hierarchical regression after controlling for execution, effect persists within 100%-correct stratum
      Stage 3 (Generalization): Cross-repo validation R² drops <50%, ensemble disagreement ≤20% on quality features
      Stage 4 (Optimization): Per-task execution regression ≤5% during RL training
    metric: "Proxy validation pass count (0-3 proxies)"
    falsifiability_test: "If ALL proxies fail Stage 2 conditional independence (effects vanish in perfect-execution stratum), hypothesis simplifies to execution-sufficiency"

  - id: "P2"
    primary: false
    prediction: "Constrained multi-objective models (Condition C) achieve ≥5% improvement in secondary metrics while maintaining per-task execution within 5% of baseline"
    success_criteria: |
      - Edit distance reduced by ≥5% vs Condition A (execution-only) on SWE-bench test set
      - PR acceptance rate improved by ≥5 percentage points
      - ≤10% of problems show >5% pass rate regression
      - Improvements persist on temporally held-out SWE-bench issues (post-2023)
    metric: "Pareto dominance: percentage improvement in secondary metrics without violating execution constraint"
    falsifiability_test: "If Condition C does not dominate Conditions A and B on Pareto frontier (no secondary improvement OR execution regression >5% for >10% of problems), multi-objective optimization provides no benefit"

  - id: "P3"
    primary: false
    prediction: "Either interaction effects explain ≥5% variance (synergy detected) OR effects are additive (<5% interaction variance, simplifying model)"
    success_criteria: |
      Path A (Synergy): Fractional factorial shows 2-way interactions (p < 0.01), ΔR² ≥ 0.05
      Path B (Additive): Additive model R² within 2% of interaction model R²
    metric: "Interaction variance percentage (ΔR² from factorial design)"
    falsifiability_test: "Inconsistent interaction patterns across benchmarks (significant on HumanEval, nonsignificant on SWE-bench) indicate measurement artifacts not true structure"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: Verification Approaches
# ═══════════════════════════════════════════════════════════════

verification_approaches:
  analytical:
    - method: "Hierarchical Regression Analysis"
      description: "Test conditional independence via stratified regression within correctness bands"
      applicable_to: ["P1-Stage2", "P2"]

    - method: "Structural Equation Modeling (SEM)"
      description: "Validate formal causal DAG: Execution/CodeBLEU/Efficiency/Style → Developer Acceptance"
      applicable_to: ["P1-Stage2", "Assumption A4"]

    - method: "Cross-Validation (Leave-Cluster-Out)"
      description: "Train on repo subset A, test on disjoint B; verify ≤50% R² drop and ≤20% ensemble disagreement"
      applicable_to: ["P1-Stage3", "Assumption A3"]

    - method: "Fractional Factorial Design"
      description: "2³ ablation (efficiency × CodeBLEU × style) to test main effects vs interaction terms"
      applicable_to: ["P3", "Assumption A5"]

  empirical:
    - method: "Calibration Studies"
      description: "50 HumanEval problems, 10 solutions × 5 runs each; measure CV, Cohen's d, Spearman ρ"
      applicable_to: ["P1-Stage1", "Assumption A2"]

    - method: "Controlled Asymptotic Benchmarks"
      description: "50 synthetic tasks with known O(n), O(n log n), O(n²) optimal solutions; test empirical complexity slope shifts"
      applicable_to: ["P1-Stage4", "Assumption A2"]

    - method: "Constrained RL Training"
      description: "Implement Lagrangian relaxation with per-problem pass rate monitoring; train 3 conditions (A/B/C) on HumanEval/MBPP/SWE-bench"
      applicable_to: ["P2", "P3"]

    - method: "Temporal Hold-Out Validation"
      description: "Evaluate on post-2023 SWE-bench issues to test temporal generalization"
      applicable_to: ["P2", "Assumption A4"]

  baseline_comparisons:
    - baseline: "Execution-Only (Condition A)"
      purpose: "Tests whether proxies add value beyond execution correctness"
      implementation: "CodeRL or CURE with unit test reward only"

    - baseline: "Sequential Optimization (Condition B)"
      purpose: "Tests benefit of simultaneous vs staged optimization"
      implementation: "Execution training followed by preference fine-tuning"

    - baseline: "Per-Proxy Ablations"
      purpose: "Tests individual proxy contributions (execution+CodeBLEU, execution+efficiency, execution+style)"
      implementation: "Three single-proxy conditions in factorial design"

# ═══════════════════════════════════════════════════════════════
# SECTION 4: Critical Risks
# ═══════════════════════════════════════════════════════════════

critical_risks:
  - risk_id: "R1"
    risk_description: "Proxies fail conditional independence test (effects vanish within perfect-execution stratum)"
    linked_assumption: "A1, A4"
    mitigation: "Built-in fail-safe: Drop non-independent proxies, continue with validated subset; negative result still publishable"
    severity: "High"
    likelihood: "Medium"

  - risk_id: "R2"
    risk_description: "Efficiency measurements too noisy (CV >5%) to reliably distinguish complexity classes"
    linked_assumption: "A2"
    mitigation: "Calibration study (Stage 1) identifies this BEFORE RL training; if failed, drop efficiency from optimization"
    severity: "Medium"
    likelihood: "Medium"

  - risk_id: "R3"
    risk_description: "Learned PR-style signals do not generalize across repositories"
    linked_assumption: "A3"
    mitigation: "Cross-repo validation (Stage 3) catches this; if failed, switch to domain-specific ensemble approach"
    severity: "Medium"
    likelihood: "Low"

  - risk_id: "R4"
    risk_description: "Per-task execution constraints violated (>10% of problems show >5% regression)"
    linked_assumption: "None (implementation risk)"
    mitigation: "Tighter Lagrangian penalty coefficients, per-problem constraint monitoring during training"
    severity: "Critical"
    likelihood: "Low"

  - risk_id: "R5"
    risk_description: "Temporal generalization fails (improvements disappear on post-2023 data)"
    linked_assumption: "A4"
    mitigation: "Indicates proxies optimize benchmark artifacts; pivot to investigating domain boundaries rather than claiming universal improvement"
    severity: "High"
    likelihood: "Medium"

