# ═══════════════════════════════════════════════════════════════════════════════
# METHODOLOGICAL CONTRIBUTIONS
# ═══════════════════════════════════════════════════════════════════════════════

methodological_contributions:
  - id: "contrib_1_four_stage_pipeline"
    title: "Four-Stage Validation Pipeline"
    description: |
      Stage 1: Measurement Reliability (CV ≤5%, Cohen's d ≥0.8, Spearman ρ ≥0.8)
      Stage 2: Conditional Independence (hierarchical regression ΔR² ≥0.03)
      Stage 3: Cross-Domain Generalization (leave-cluster-out validation, R² drop <50%)
      Stage 4: Optimization Constraints (per-task execution safety, ≤5% regression)
    section_reference: "Section 3.1"
    novelty_claim: "First systematic application of psychometric construct validity testing (CV, Cohen's d, Spearman ρ) to code generation proxy metrics before RL optimization"
    verification_method: "Compare with prior work (CodeRL, CURE, CodeUltraFeedback) to confirm no prior four-stage validation framework exists"
    confidence: "HIGH (methodological framework validated in PoC)"

  - id: "contrib_2_scoped_gate_design"
    title: "Scoped MUST_WORK Gate"
    description: "≥1 proxy validates → PARTIAL PASS with reduced proxy set (prevents all-or-nothing failure)"
    section_reference: "Section 3.1 (Stage 1 Implementation), Section 4.4.1"
    novelty_claim: "Allows partial validation (1/3 proxies) as scientifically valid continuation path; negative results (proxy failures) are publishable findings"
    verification_method: "Test gate with varying proxy validation counts (0/3, 1/3, 2/3, 3/3) and verify continuation logic"
    confidence: "HIGH (gate logic implemented and tested in PoC)"

  - id: "contrib_3_poc_methodology_validation"
    title: "Proof-of-Concept Two-Phase Validation Strategy"
    description: "Phase 1 (PoC): Validate statistical framework with synthetic data (~2 min runtime, no GPU). Phase 2 (Real): Full-scale validation with CodeLlama-7B + HumanEval + perf counters (~100 GPU hours)."
    section_reference: "Section 4.2.1"
    novelty_claim: "Risk-reduction strategy: validate methodology before infrastructure investment, reducing barrier for resource-constrained labs"
    verification_method: "Compare PoC computational cost (~2 min CPU) vs real validation cost (~100 GPU hours) to confirm efficiency claim"
    confidence: "HIGH (PoC execution cost verified)"

  - id: "contrib_4_cpu_instruction_counting"
    title: "CPU Instruction Counting for Efficiency Measurement"
    description: "Use Linux perf hardware performance counters (perf stat -e instructions) instead of wall-clock time to isolate program-dependent instruction count from hardware-dependent scheduling noise"
    section_reference: "Section 3.1 (Key Design Decisions), Section 4.2.3"
    novelty_claim: "Adopts COFFE (2025) methodology for code generation domain; demonstrates why wall-clock CV >5% while perf-based CV ~2-3%"
    verification_method: "Compare wall-clock CV vs perf-based CV on same code samples; confirm Patterson & Hennessy CPU time equation rationale"
    confidence: "MEDIUM (COFFE citation unverified; methodology sound but requires empirical confirmation)"

