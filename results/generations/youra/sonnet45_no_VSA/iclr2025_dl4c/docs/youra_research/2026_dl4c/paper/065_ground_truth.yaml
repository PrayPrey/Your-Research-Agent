# LIMITATIONS ACKNOWLEDGED
# ═══════════════════════════════════════════════════════════════════════════════

limitations_acknowledged:
  - id: "limit_1_poc_synthetic_data"
    limitation: "All results from PoC use synthetic data (500 simulated solutions), not real CodeLlama-7B generation on HumanEval"
    why_acceptable: "PoC validates methodology (gate logic, statistical framework) before 1,000+ GPU hour investment. Two-phase approach reduces risk."
    mitigation_plan: "Phase 4 full-scale validation: CodeLlama-7B + HumanEval + perf counters. Expected timeline: 2-4 weeks."
    section_reference: "Section 6.3.1"
    reviewer_verification: "Check if numerical claims (CV=1.39%, d=4.51) are qualified as provisional pending real validation"

  - id: "limit_2_partial_proxy_validation"
    limitation: "Only 1/3 proxies (CodeBLEU) validated; runtime requires hardware instrumentation, PR-style requires training infrastructure"
    why_acceptable: "Scoped gate design allows partial validation as scientifically valid. Single validated proxy sufficient for h-e2 (conditional independence testing)."
    mitigation_plan: "Re-test runtime with real perf counters in parallel with h-e2 execution. Defer PR-style to post-publication unless efficiency fails."
    section_reference: "Section 6.3.2"
    reviewer_verification: "Check if downstream hypotheses (h-e2, h-m1) acknowledge reduced statistical power from single-proxy testing"

  - id: "limit_3_runtime_failure_attribution"
    limitation: "Runtime proxy failure (CV=6.22%) attributed to PoC synthetic noise mismatch, not empirically confirmed"
    why_acceptable: "COFFE (2025) literature reports perf-based CV ~2-3%; Patterson & Hennessy CPU time equation provides theoretical grounding"
    mitigation_plan: "Ablation study: Compare PoC synthetic noise vs real perf measurements on 50 HumanEval problems. Measure actual CV."
    section_reference: "Section 6.3.3"
    reviewer_verification: "Check if COFFE (2025) citation is verifiable and reports claimed CV ~2-3%"

  - id: "limit_4_single_language"
    limitation: "All validation is Python-specific (HumanEval dataset, CodeBLEU Python AST parser). May not generalize to C++, Java, JavaScript."
    why_acceptable: "Python is dominant in ML/AI code generation research (HumanEval, MBPP standard). Multi-language validation is natural extension, not prerequisite."
    mitigation_plan: "Extend to HumanEval-X (multi-language). Test if CV/Cohen's d/Spearman ρ thresholds hold across languages."
    section_reference: "Section 6.3.4"
    reviewer_verification: "Check if abstract/introduction clarify Python-specific scope or claim broader generalization"

  - id: "limit_5_poc_infrastructure_gap"
    limitation: "PoC uses simulated cross-platform measurements (Gaussian noise σ=3%), not real AWS GPU vs local GPU comparison"
    why_acceptable: "Tests Spearman ρ computation and visualization logic without dual-platform infrastructure. Real validation pending."
    mitigation_plan: "Deploy on AWS g4dn.xlarge + local GPU; measure actual cross-platform CV and Spearman ρ for all proxies."
    section_reference: "Section 3.1 (Data Generation Protocol), Section 4.2.2"
    reviewer_verification: "Check if Spearman ρ results (0.949) are clearly marked as simulated, not real dual-platform measurements"

