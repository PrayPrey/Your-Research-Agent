# ═══════════════════════════════════════════════════════════════════════════════
# CORE CLAIMS (FALSIFIABLE)
# ═══════════════════════════════════════════════════════════════════════════════

core_claims:
  - id: "claim_1_codebleu_cv"
    statement: "CodeBLEU achieves coefficient of variation (CV) = 1.39%, which is 72% below the 5.0% threshold for measurement reliability."
    section_reference: "Section 5.2.1"
    evidence_type: "quantitative_measurement"
    verification_method: "Recompute CV from 500 solutions × 5 repetitions using CodeBLEU implementation"
    falsification_criteria: "CV >5% or margin below threshold <50%"
    confidence_level: "MEDIUM (PoC synthetic data; real validation pending)"

  - id: "claim_2_codebleu_cohens_d"
    statement: "CodeBLEU demonstrates large effect size (Cohen's d = 4.51) when discriminating O(n) vs O(n²) solutions, exceeding the 0.8 threshold by 5.6×."
    section_reference: "Section 5.2.2"
    evidence_type: "statistical_effect_size"
    verification_method: "Compare O(n) and O(n²) solution groups on controlled complexity tasks; compute pooled Cohen's d"
    falsification_criteria: "d <0.8 or d <3.0 (substantially lower than claimed 4.51)"
    confidence_level: "MEDIUM (PoC synthetic data; real validation pending)"

  - id: "claim_3_codebleu_spearman"
    statement: "CodeBLEU exhibits near-perfect cross-platform rank stability (Spearman ρ = 0.949), exceeding the 0.8 threshold."
    section_reference: "Section 5.2.3"
    evidence_type: "rank_correlation"
    verification_method: "Measure CodeBLEU on two platforms (AWS GPU vs local GPU); compute Spearman rank correlation"
    falsification_criteria: "ρ <0.8 or ρ <0.85 (substantially lower than claimed 0.949)"
    confidence_level: "MEDIUM (PoC simulated cross-platform; real dual-platform validation pending)"

  - id: "claim_4_runtime_cv_marginal_fail"
    statement: "Runtime efficiency proxy (PoC wall-clock model) marginally fails CV threshold with CV = 6.22%, which is 24% over the 5.0% threshold."
    section_reference: "Section 5.3.1"
    evidence_type: "quantitative_measurement"
    verification_method: "Recompute CV from runtime measurements (PoC synthetic or real perf counters)"
    falsification_criteria: "CV ≤5.0% (contradicts marginal failure claim) or CV >10% (substantially worse than claimed)"
    confidence_level: "LOW (PoC synthetic noise model; real perf validation required)"

  - id: "claim_5_runtime_perf_cv"
    statement: "Literature (COFFE 2025) demonstrates that CPU instruction counting via Linux perf hardware counters achieves CV ~2-3%, well within the 5% threshold."
    section_reference: "Section 1 (Introduction), Section 5.3.2"
    evidence_type: "literature_citation"
    verification_method: "Verify COFFE (2025) citation exists and reports CV ~2-3%; alternatively test with real perf measurements"
    falsification_criteria: "COFFE paper not found, or reports CV >5%, or real perf measurements yield CV >5%"
    confidence_level: "LOW (UNVERIFIED citation; COFFE (2025) not located in bibliography verification)"

  - id: "claim_6_compositional_validation"
    statement: "Proxy validation is compositional: structural metrics (CodeBLEU) have deterministic properties (CV ~0-2%), while efficiency metrics require hardware instrumentation (perf counters) to achieve comparable reliability."
    section_reference: "Section 1 (Introduction), Section 6.2.1"
    evidence_type: "theoretical_insight"
    verification_method: "Test structural vs efficiency metrics on same dataset; confirm CV gap (structural <2%, wall-clock >5%, perf-based 2-3%)"
    falsification_criteria: "Wall-clock runtime achieves CV ≤5% without perf counters, OR perf-based runtime fails to achieve CV ≤5%"
    confidence_level: "MEDIUM (partially supported by PoC; requires real hardware validation)"

  - id: "claim_7_scoped_gate_partial_pass"
    statement: "The scoped MUST_WORK gate returns PARTIAL PASS when ≥1 proxy validates all three criteria (CV ≤5%, Cohen's d ≥0.8, Spearman ρ ≥0.8), allowing hypothesis continuation with reduced proxy set."
    section_reference: "Section 5.5.1"
    evidence_type: "methodological_framework"
    verification_method: "Test gate logic with 3 proxies (CodeBLEU, Runtime, PR-style); verify 1/3 validation triggers PARTIAL PASS"
    falsification_criteria: "Gate returns FAIL when 1/3 proxies validate, OR gate accepts proxies failing any criterion"
    confidence_level: "HIGH (gate logic validated in PoC implementation)"

  - id: "claim_8_becker_slowdown"
    statement: "Becker et al. (2025) demonstrated that AI-generated code runs 19% slower than human-written solutions despite passing all unit tests."
    section_reference: "Section 1 (Introduction), Section 2 (Related Work)"
    evidence_type: "literature_citation"
    verification_method: "Verify Becker et al. (2025) citation (arXiv:2507.09089) reports 19% slowdown finding"
    falsification_criteria: "Becker paper not found, does not report 19% slowdown, or finding is for different code quality dimension"
    confidence_level: "HIGH (citation verified in bibliography with Semantic Scholar ID)"

