# ADVERSARIAL REVIEW TARGETS (PHASE 6.5)
# ═══════════════════════════════════════════════════════════════════════════════

adversarial_review_targets:
  high_priority:
    - target_id: "adv_1_coffe_citation"
      claim: "COFFE (2025) demonstrates CPU instruction counting achieves CV ~2-3%"
      attack_surface: "COFFE (2025) citation marked as UNVERIFIED in bibliography; unable to locate paper"
      test_method: "Search arXiv, Semantic Scholar, Google Scholar for 'COFFE 2025 CPU instruction counting'; verify claim or request author clarification"
      failure_impact: "HIGH - If COFFE doesn't exist or doesn't report CV ~2-3%, runtime efficiency measurement rationale weakens"
      section_reference: "Section 1, Section 5.3.2, Bibliography line 163-169"

    - target_id: "adv_2_poc_to_real_gap"
      claim: "PoC synthetic results (CV=1.39%, d=4.51) will transfer to real validation with CodeLlama-7B on HumanEval"
      attack_surface: "All quantitative claims are PoC synthetic; real validation could yield substantially different values"
      test_method: "Challenge: What if real CodeBLEU CV is 3-4% (still passing but 2-3× higher)? What if Cohen's d is 2.0 (still passing but 50% lower)?"
      failure_impact: "MEDIUM - Numerical claims change but qualitative findings (CodeBLEU passes, runtime needs perf) likely hold"
      section_reference: "Section 5 (all results), Section 6.3.1 (limitations)"

    - target_id: "adv_3_cv_threshold_justification"
      claim: "CV ≤5% threshold is appropriate for code generation proxy metrics"
      attack_surface: "5% threshold from general measurement theory; not empirically validated for code generation domain"
      test_method: "Challenge: What if code generation tolerates higher variance (CV ≤7-10%)? Runtime proxy CV=6.22% might be acceptable."
      failure_impact: "MEDIUM - Threshold sensitivity analysis needed; could change runtime proxy from FAIL to PASS"
      section_reference: "Section 3.1 (Stage 1 Implementation), Section 4.3.1"

  medium_priority:
    - target_id: "adv_4_conditional_independence_assumption"
      claim: "CodeBLEU will explain ≥3% additional variance in developer acceptance after controlling for execution (h-e2 hypothesis)"
      attack_surface: "No empirical test yet; h-e2 is future work, not validated in this paper"
      test_method: "Challenge: What if CodeBLEU explains <3% variance (ΔR² <0.03)? Proxy is conditionally redundant."
      failure_impact: "MEDIUM - Would invalidate multi-objective hypothesis; but paper correctly positions h-e2 as future work"
      section_reference: "Section 1 (Contributions), Section 6.6.1 (Future Work)"

    - target_id: "adv_5_becker_generalization"
      claim: "Becker et al.'s 19% slowdown finding justifies efficiency proxy development"
      attack_surface: "Becker finding is for specific code generation model/dataset; may not generalize to all LLM-generated code"
      test_method: "Check Becker et al. (2025) paper scope: Which models tested? Which tasks? Does 19% slowdown generalize?"
      failure_impact: "LOW - Becker finding is motivation, not core validation claim; even if limited scope, efficiency measurement remains scientifically interesting"
      section_reference: "Section 1 (Introduction), Bibliography"

  low_priority:
    - target_id: "adv_6_pr_style_placeholder"
      claim: "PR-style proxy can be trained on SWE-bench data to measure style conformity"
      attack_surface: "Proxy is placeholder (random scores); training infrastructure not implemented; no evidence training will yield reliable metric"
      test_method: "Challenge: What if trained PR-style model has CV >10% due to SWE-bench label noise? Style dimension may be fundamentally noisy."
      failure_impact: "LOW - Paper clearly states PR-style is placeholder; failure doesn't affect CodeBLEU or runtime validation"
      section_reference: "Section 3.1 (Three-Proxy System), Section 5.4"

    - target_id: "adv_7_python_language_generalization"
      claim: "Four-stage pipeline generalizes to multi-language code generation"
      attack_surface: "All validation is Python-specific; no evidence yet that thresholds hold for C++, Java, JavaScript"
      test_method: "Challenge: What if C++ CodeBLEU CV is 8% due to template complexity? Language-specific thresholds may be needed."
      failure_impact: "LOW - Paper acknowledges Python-specific scope (Section 6.3.4); multi-language is future work, not core claim"
      section_reference: "Section 6.3.4, Section 6.6.2"

