  - check: "Is the paper interesting, not just correct?"
    status: "verified"
    note: "Surprising finding (A1 violation strengthens claim), counterintuitive simplicity (2 features vs GNNs), memorable insight (inspect vs run to understand), practical impact (100× speedup), honest limitations (NormFree failure with clear cause)."

