# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Hypothesis Statement
# ═══════════════════════════════════════════════════════════════

core_hypothesis:
  statement: |
    Lightweight statistical features—normalization layer type counts and convolution-to-linear parameter-mass ratio—
    enable architecture family classification (CNN vs Transformer vs Hybrid) from checkpoint files without forward passes,
    achieving >80% accuracy on held-out model families with scale-stable features and strong inter-family separation.

  causal_mechanism: |
    Architecture families impose structural constraints that manifest as weight-space signatures:
    1. CNNs use BatchNorm (spatial statistics for image data), Transformers use LayerNorm (token-wise normalization)
    2. CNNs allocate parameters to convolutional kernels (local receptive fields), Transformers to large linear projections (global context)
    3. These signatures are extractable via checkpoint inspection without model instantiation or forward passes

  key_variables:
    independent:
      - "Architecture family (CNN / Transformer / Hybrid)"
    dependent:
      - "Classification accuracy"
      - "Intra-family coefficient of variation (CV)"
      - "Inter-family Cohen's d effect size"
    controlled:
      - "Model size (multi-scale validation)"
      - "Family diversity (leave-one-family-out)"
      - "Ground truth labels (TIMM naming + structural validation)"
    measured_features:
      - "Normalization counts (BN_count, LN_count, GN_count, No_norm_flag)"
      - "Parameter-mass ratio R = conv_params / (conv_params + linear_params_no_head)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - assumption: "TIMM model naming conventions align with structural definitions"
    validation_plan: "Validate on 10-model sample via architecture inspection (expected >90% alignment)"
  - assumption: "Normalization layer choice reflects architectural paradigm, not just training convention"
    validation_plan: "Test violation rate — must be ≤15% per class"
  - assumption: "Parameter-mass ratio is scale-invariant within families"
    validation_plan: "Test intra-family CV across ResNet-{18,34,50,101,152} — must be <0.15"
  - assumption: "Linear classifier sufficient for feature discrimination"
    validation_plan: "Logistic regression test — if fails, features insufficient (no MLP rescue allowed)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Null Hypothesis
# ═══════════════════════════════════════════════════════════════

null_hypothesis:
  statement: |
    Statistical features (normalization counts, parameter-mass ratio) do NOT achieve significantly better
    than random classification (33.3% for 3-way task) on held-out architecture families.
  acceptance_threshold: "Accuracy ≤50% on ≥2 out of 3 held-out families"

