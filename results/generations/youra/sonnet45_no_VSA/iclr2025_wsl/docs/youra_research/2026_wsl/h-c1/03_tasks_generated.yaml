    type: epic
    title: Failure Mode Analysis
    description: |
      Implement FailureModeAnalyzer to characterize misclassifications.
      - Generate confusion matrix (4×4 for edge families)
      - Plot feature distributions (edge vs baseline)
      - Identify systematic error patterns
      - Document failure hypotheses and proposed extensions
      - Save to results/failure_analysis.md

      Module: src/failure_analyzer.py
      Methods: generate_confusion_matrix(), analyze_per_family_failures(),
               compute_feature_distributions(), save_failure_report()
    acceptance_criteria:
      - FailureModeAnalyzer class implemented
      - Confusion matrix generated and saved as PNG
      - Feature distributions plotted (box plots, edge vs baseline)
      - Systematic patterns documented (e.g., "All NormFree misclassified as CNN")
      - Failure report saved to results/failure_analysis.md
    complexity: 14
    prerequisites: [C1-4]
    assignee: User
    archon_id: null

  - id: C1-5-1
    type: subtask
    parent: C1-5
    title: Generate confusion matrix
    description: |
      Create confusion matrix for edge case families.
      - Use sklearn.metrics.confusion_matrix(y_true, y_pred)
      - Visualize as heatmap (matplotlib/seaborn)
      - Save to results/confusion_matrix.png
    acceptance_criteria:
      - 4×4 confusion matrix generated
      - Heatmap saved as PNG
    complexity: 4
    prerequisites: [C1-4]
    assignee: User
    archon_id: null

  - id: C1-5-2
    type: subtask
    parent: C1-5
    title: Plot feature distributions
    description: |
      Compare edge case vs baseline feature distributions.
      - Plot 5 features (bn_count, ln_count, gn_count, no_norm_flag, param_mass_ratio)
      - Use box plots or violin plots
      - Edge cases vs baseline models (from h-m3)
      - Save to results/feature_distributions.png
    acceptance_criteria:
