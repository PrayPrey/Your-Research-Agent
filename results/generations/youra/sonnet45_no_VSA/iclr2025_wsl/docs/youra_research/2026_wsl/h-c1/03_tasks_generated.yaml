    description: |
      Write detailed failure report to results/failure_analysis.md.
      - Confusion matrix summary
      - Per-family failure breakdown
      - Feature distribution observations
      - Systematic patterns
      - Proposed extensions (e.g., "Add GroupNorm count")
    acceptance_criteria:
