    type: epic
    title: Gate Decision and Validation Report
    description: |
      Implement GateDecisionMaker to evaluate SHOULD_WORK gate and generate report.
      - Evaluate P1: Overall accuracy ≥70%
      - Evaluate P2: ≥3/4 families pass 70%
      - Generate gate decision (PASS/DOCUMENT)
      - Generate recommendation based on failure patterns
      - Save to 04_validation.md

      Module: src/gate_decision.py
      Methods: evaluate_gate(), generate_recommendation()
    acceptance_criteria:
      - GateDecisionMaker class implemented
      - Gate decision computed (PASS/DOCUMENT)
      - Recommendation generated
      - Validation report saved to results/04_validation.md
    complexity: 8
    prerequisites: [C1-4, C1-5]
    assignee: User
    archon_id: null

  - id: C1-6-1
    type: subtask
    parent: C1-6
    title: Implement gate evaluation logic
    description: |
      Create evaluate_gate() to check SHOULD_WORK thresholds.
      - P1: overall_accuracy ≥ 0.70
      - P2: count(family_accuracy ≥ 0.70) ≥ 3
      - Return gate_decision: "PASS" or "DOCUMENT"
    acceptance_criteria:
      - Gate logic implemented
      - Returns PASS/DOCUMENT decision
    complexity: 2
    prerequisites: [C1-4]
    assignee: User
    archon_id: null

