# Phase 2A Output: Hypothesis Refinement
# Generated from: discussion_log.md Final Assessments
# Date: 2026-07-10

hypothesis_id: h-c1
hypothesis_title: "Confidence-Calibrated Iteration Control for Agentic Code Generation"
version: 1
source_gap: GAP-001

# Core hypothesis statement
core_statement: |
  Calibrated confidence, implemented via temperature-scaled log-probability gating,
  enables adaptive iteration control that reduces execution attempts by 20-40% on
  code generation benchmarks while preserving pass@k accuracy.

# Causal mechanism
causal_mechanism: |
  Temperature scaling post-processes model logits to produce calibrated confidence scores.
  These scores gate the agent's decision to (1) submit code directly, (2) self-critique
  before submission, or (3) request execution feedback. Thresholds are set via conformal
  calibration to bound false negative rates.

# Variables
variables:
  independent:
    - name: "Temperature Scaling"
      type: "categorical"
      values: ["None", "Learned on validation split"]
    - name: "Gating Policy"
      type: "categorical"
      values: ["Fixed iteration schedule", "Confidence-based gating"]

  dependent:
    - name: "pass@1"
      type: "continuous"
      unit: "percentage"
      expected_range: [80, 95]
    - name: "execution_attempts"
      type: "continuous"
      unit: "count per problem"
      expected_range: [1, 5]
    - name: "wall_clock_time"
      type: "continuous"
      unit: "seconds per problem"
      expected_range: [5, 30]

  control:
    - name: "problem_difficulty"
      type: "categorical"
      values: ["easy", "medium", "hard"]
    - name: "code_length"
      type: "continuous"
      unit: "tokens"

# Key assumptions
key_assumptions:
  - assumption: "Calibrated log-probability (length-normalized) correlates monotonically with empirical code correctness"
    testable: true
    test_method: "Spearman rank correlation between confidence bins and pass rate"
  - assumption: "Marginal benefit from self-critique decreases with initial confidence"
    testable: true
    test_method: "Regression: Δpass ~ confidence + difficulty"
  - assumption: "Temperature fitted on round-0 generations generalizes to post-critique generations"
    testable: true
    test_method: "Per-round ECE measurement without refitting"

# Null hypothesis
null_hypothesis: |
  Temperature scaling improves calibration (reduces ECE) but does NOT improve
  execution efficiency or pass@k when used as a gating control signal.

# Testable predictions
predictions:
  - id: P1
    statement: "Confidence bins show monotonic relationship with pass rate"
    metric: "Spearman rank correlation ≥ 0.7"
    success_criteria: "ρ ≥ 0.7 with p < 0.05"

  - id: P2
    statement: "Marginal critique benefit decreases with initial confidence"
    metric: "Regression coefficient (confidence → Δpass) < 0"
    success_criteria: "β < 0 with p < 0.05"

  - id: P3
    statement: "Gated+Scaled reduces execution attempts while preserving accuracy"
    metric: "20-40% execution reduction, Δpass@1 ≤ 2%"
    success_criteria: "Execution attempts reduced by 20-40%, pass@1 within 2% of baseline"

# Novelty
novelty:
  primary: |
    First integration of temperature scaling for intermediate control flow
    (not just final prediction) in agentic code generation.
  secondary: |
    Meta-level contribution: Calibrated confidence as general resource allocation
    signal for agent systems (code generation is instantiation).
  tertiary: |
    Bridges model-heavy (CODESIM) and execution-heavy (OpenCodeInterpreter)
    paradigms via confidence-based routing.

# Scope and boundaries
scope:
  datasets: ["MBPP (primary)", "HumanEval (generalization)"]
  models: ["Open-weight: Code Llama, StarCoder2, DeepSeek-Coder"]
  task_type: "Function-level code generation"
  exclusions:
    - "Project-level code generation"
    - "Code editing tasks"
    - "API-only models (GPT-4, Claude)"

# Experimental setup
experimental_setup:
  design: "2×2 factorial (Temperature Scaling × Gating Policy)"
  data_split:
    train: "60%"
    calibration: "20%"
    validation: "20%"
  metrics:
    - "pass@1"
    - "execution attempts"
    - "wall-clock time"
    - "cost-adjusted utility"
  validation_gates:
    - "Monotonicity check (confidence → correctness)"
    - "Marginal benefit regression"
    - "Full ablation study"

# Related work and baselines
baselines:
  - name: "OpenCodeInterpreter"
    type: "execution-heavy"
    description: "No confidence modeling, iterate until tests pass"
  - name: "CODESIM"
    type: "model-heavy"
    description: "Pure simulation, no execution until final submission"

calibration_methods:
  - "UniCR: Temperature scaling + conformal risk control"
  - "QaTS: Quantile-adaptive temperature scaling"
  - "ATS: Adaptive temperature scaling (token-level)"

# Phase 2B readiness
phase2b_readiness:
  hypothesis_type: "EMPIRICAL"
  must_work_gate: "Monotonicity validation (confidence → correctness)"
  determines_success_gate: "20-40% execution reduction with Δpass@1 ≤ 2%"
  feasibility: "Open-weight models, existing benchmarks, no new data collection"

# Established facts from discussion
established_facts:
  - "Temperature scaling reduces ECE (58.3% on h-e1)"
  - "Multi-turn refinement outperforms single-shot (CODESIM 95.1%)"
  - "Model-based self-critique reduces tool calls (2× fewer - Structural Verification)"
  - "Execution feedback is lightweight (test pass/fail, no profiling)"
  - "HumanEval approaching saturation (95.1% SOTA)"

# Objections addressed
objections_addressed:
  - objection: "Calibration may not predict behaviorally relevant correctness"
    response: "Monotonicity validation experiment gates full study"
    persona: "Prof. Rex"

  - objection: "Gating may not be justified over fixed schedules"
    response: "Marginal benefit regression tests Δpass ~ confidence"
    persona: "Prof. Rex"

  - objection: "Cost savings may only appear under unrealistic assumptions"
    response: "Cost-adjusted utility metric across cost ratios R=1× to 10×"
    persona: "Prof. Rex"

  - objection: "Calibration and self-critique effects are entangled"
    response: "2×2 factorial design disentangles effects"
    persona: "Prof. Vera"

  - objection: "Logit access unavailable in production APIs"
    response: "Use open-weight models for proof of concept"
    persona: "Prof. Pax"

  - objection: "Dataset size insufficient for per-round calibration"
    response: "MBPP primary (974 problems), pool rounds if needed"
    persona: "Prof. Pax"
