# Phase 2A Output: Hypothesis Synthesis
# Source: Tikitaka Discussion (7 exchanges, 6 personas)
# Date: 2026-07-10

gap_id: GAP-001
gap_title: "Confidence-Calibrated Submit/Refine Decision Mechanisms"
hypothesis_id: h-c1
hypothesis_version: 1

# Synthesis from multi-perspective discussion
synthesis:
  core_insight: |
    Calibration is not just for post-hoc validation—it can serve as an active
    control mechanism for computational resource allocation in agentic systems.

  key_innovation: |
    First integration of temperature scaling for intermediate control flow
    decisions (when to self-critique vs. execute) rather than only final
    prediction confidence.

  bridging_paradigms: |
    Combines model-heavy approach (CODESIM: simulation-driven planning) with
    execution-heavy approach (OpenCodeInterpreter: iterate until tests pass)
    via confidence-based routing.

# Discussion evolution
discussion_flow:
  exchange_1:
    persona: "Dr. Nova (Creative Novelty Explorer)"
    contribution: |
      Proposed three novel angles: (1) Inverse overhead engineering via
      confidence-gated execution, (2) Cross-domain transfer from h-e1
      temperature scaling success, (3) Zero-profiling multi-turn via hybrid
      confidence ladder.

  exchange_2:
    persona: "Prof. Vera (Rigorous Validation Architect)"
    contribution: |
      Demanded 2×2 factorial design to disentangle calibration from self-critique
      effects. Defined three disconfirmation criteria. Required per-round
      calibration validation.

  exchange_3:
    persona: "Prof. Pax (Feasibility & Reality Checker)"
    contribution: |
      Validated mechanism (temperature scaling is sound), identified logit
      access problem (requires open-weight models), proposed three-way data
      split to avoid overfitting.

  exchange_4:
    persona: "Prof. Rex (Hypothesis Stress-Test Master)"
    contribution: |
      Challenged unstated assumptions: demanded monotonic confidence→correctness
      mapping, marginal benefit regression, cost-sensitive utility analysis.
      Rejected heuristic thresholds.

  exchange_5:
    persona: "Dr. Sage (Research Impact Evaluator)"
    contribution: |
      Positioned as systems integration paper, identified real-world scenarios
      (formal verification, databases), framed as meta-level contribution
      beyond code generation.

  exchange_6:
    persona: "Dr. Ally (Hypothesis Strengthening Champion)"
    contribution: |
      Synthesized all critiques into refined hypothesis with validation gates,
      conformal quantiles for thresholds, cost-adjusted metrics.

  exchange_7:
    persona: "Dr. Nova (Final Synthesis)"
    contribution: |
      Elevated to domain-general principle: calibrated confidence as resource
      allocation signal for agentic systems (code generation is instantiation).

# Critical decisions made
decisions:
  experimental_design:
    choice: "2×2 factorial (Temperature Scaling × Gating Policy)"
    rationale: "Disentangles calibration effect from self-critique effect"
    alternative_rejected: "Single-arm treatment (would confound effects)"

  primary_benchmark:
    choice: "MBPP (974 problems)"
    rationale: "Larger dataset for robust calibration, more comprehensive tests"
    alternative_rejected: "HumanEval as primary (only 164 problems, too small for per-round calibration)"

  model_choice:
    choice: "Open-weight models (Code Llama, StarCoder2, DeepSeek-Coder)"
    rationale: "Logit access required for temperature scaling"
    alternative_rejected: "API-only models (no logit access)"

  threshold_method:
    choice: "Conformal quantiles (pre-registered α=0.05, β=0.20)"
    rationale: "Principled, avoids hyperparameter tuning on test set"
    alternative_rejected: "Fixed heuristic bands (0.9, 0.7, 0.5 - arbitrary)"

# Validation gates (sequential)
validation_gates:
  gate_1:
    name: "Monotonicity Validation"
    test: "Spearman rank correlation between confidence bins and empirical pass rate"
    success_criteria: "ρ ≥ 0.7 with p < 0.05"
    failure_action: "STOP - calibration not behaviorally meaningful"

  gate_2:
    name: "Marginal Benefit Regression"
    test: "Regression: Δpass ~ confidence + difficulty"
    success_criteria: "Coefficient(confidence) < 0 with p < 0.05"
    failure_action: "STOP - gating not justified"

  gate_3:
    name: "Full Ablation Study"
    test: "2×2 factorial on MBPP, generalization check on HumanEval"
    success_criteria: "20-40% execution reduction, Δpass@1 ≤ 2%"
    failure_action: "Report negative result, analyze failure modes"

# Objections raised and resolved
objections:
  - objection: "Calibration may reduce ECE without predicting correctness"
    raised_by: "Prof. Rex"
    resolution: "Monotonicity validation (Gate 1) tests behavioral relevance"
    status: "RESOLVED"

  - objection: "Self-critique and calibration effects entangled"
    raised_by: "Prof. Vera"
    resolution: "2×2 factorial isolates calibration contribution"
    status: "RESOLVED"

  - objection: "Execution savings may be trivial compared to inference cost"
    raised_by: "Prof. Rex"
    resolution: "Cost-adjusted utility metric across cost ratios R=1× to 10×"
    status: "RESOLVED"

  - objection: "Logit access unavailable in production APIs"
    raised_by: "Prof. Pax"
    resolution: "Open-weight models for proof of concept, API integration as future work"
    status: "RESOLVED (scoped)"

  - objection: "Dataset too small for per-round calibration"
    raised_by: "Prof. Pax"
    resolution: "MBPP primary (974 problems), pool rounds if needed"
    status: "RESOLVED"

# Emergent themes
themes:
  confidence_as_control:
    description: "Calibrated confidence moves from descriptive (post-hoc validation) to prescriptive (active control signal)"
    supporting_quotes:
      - "Current work treats calibration as post-hoc validation. We're proposing calibration as an active control mechanism."
      - "No one has asked: Can we use calibrated confidence to dynamically adjust iteration depth within a single problem?"

  domain_generality:
    description: "Calibration-based gating as general pattern for agentic systems (not code-specific)"
    supporting_quotes:
      - "This is the same trade-off in theorem proving, robotics, multi-modal agents, scientific discovery."
      - "If we prove this works, we've validated a general principle that other agentic systems can adopt."

  resource_allocation:
    description: "Meta-level contribution: when should agents think harder vs. act faster?"
    supporting_quotes:
      - "The impact story isn't 'save money on test execution.' It's about when agents should think harder vs. act faster."
      - "LLM confidence, when properly calibrated, is a valid signal for compute allocation."

# Convergence summary
convergence:
  exchange_count: 7
  personas_activated: 6
  criteria_met:
    - "SPECIFIC: Clear core claim stated"
    - "MECHANISM: How it works explained"
    - "PREDICTIONS: 3 testable predictions with criteria"
    - "NOVELTY: What's new articulated (intermediate control flow)"
    - "FEASIBILITY: Mechanism valid, dataset sufficient, models available"
    - "OBJECTIONS: All major criticisms addressed with concrete resolutions"

  consensus_points:
    - "Temperature scaling is validated methodology (58.3% ECE reduction on h-e1)"
    - "2×2 factorial design necessary to isolate effects"
    - "Monotonicity validation is critical gate (confidence must predict correctness)"
    - "MBPP primary, HumanEval generalization (dataset size trade-off)"
    - "Open-weight models required (logit access constraint)"
