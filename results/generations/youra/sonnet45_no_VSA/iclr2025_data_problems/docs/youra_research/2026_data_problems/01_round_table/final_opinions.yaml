# Phase 2A Final Opinions
# Source: 7-exchange Tikitaka discussion
# Date: 2026-07-10

gap_id: GAP-001
hypothesis_id: h-c1

# Final persona assessments
final_opinions:
  dr_nova:
    icon: "🔭"
    name: "Dr. Nova"
    title: "Creative Novelty Explorer"
    verdict: "ENTHUSIASTICALLY SUPPORT"
    final_statement: |
      This is exactly the kind of paradigm shift I look for. We're not just
      adding calibration to code generation—we're demonstrating that confidence
      can be an active control signal for computational resource allocation.
      The domain-general principle (calibration→gating→resource allocation)
      has potential far beyond code generation. If we validate this on code
      benchmarks, we unlock a research direction for agentic systems across
      domains.
    key_contributions:
      - "Proposed hybrid confidence ladder (inverse overhead engineering)"
      - "Cross-domain transfer framing from h-e1 success"
      - "Elevated to meta-level: confidence as general resource allocation signal"

  prof_vera:
    icon: "🔬"
    name: "Prof. Vera"
    title: "Rigorous Validation Architect"
    verdict: "SUPPORT WITH CONDITIONS MET"
    final_statement: |
      The hypothesis is now falsifiable. The 2×2 factorial design cleanly
      disentangles calibration from self-critique effects. The three validation
      gates (monotonicity, marginal benefit regression, full ablation) provide
      clear disconfirmation criteria. Per-round calibration drift is testable.
      Conformal quantiles eliminate heuristic threshold tuning. If these
      conditions are executed as designed, this meets my standards.
    key_contributions:
      - "Demanded 2×2 factorial design to isolate effects"
      - "Defined three disconfirmation criteria"
      - "Required pre-registered metrics and threshold derivation"
    conditions:
      - "Execute monotonicity check before full ablation"
      - "Pre-register confidence metric (length-normalized log-probability)"
      - "Lock conformal thresholds before HumanEval test evaluation"

  dr_sage:
    icon: "🎯"
    name: "Dr. Sage"
    title: "Research Impact Evaluator"
    verdict: "SUPPORT - PUBLISHABLE IF EXECUTED CLEANLY"
    final_statement: |
      This is a systems integration paper with clear novelty: calibrated
      confidence for intermediate control flow, not just final predictions.
      The real-world impact story is compelling (formal verification, databases,
      multi-modal agents). Publishable at NeurIPS/ICML systems track or DL4C
      workshop if ablation is clean and monotonicity validation succeeds.
      The follow-up direction (learned iteration policies using calibration
      as oracle) positions this as foundational work.
    key_contributions:
      - "Positioned as systems integration, not methods innovation"
      - "Identified real-world scenarios where execution cost is high"
      - "Framed as enabling learned iteration policies (future work)"
    publication_targets:
      - "NeurIPS (systems track)"
      - "ICML (systems track)"
      - "DL4C workshop (specialized venue)"

  prof_pax:
    icon: "⚙️"
    name: "Prof. Pax"
    title: "Feasibility & Reality Checker"
    verdict: "FEASIBLE WITH SCOPE CONSTRAINTS"
    final_statement: |
      The mechanism is valid (temperature scaling is sound), but implementation
      constraints are real. Logit access requires open-weight models (limits
      generalizability to APIs). Dataset size requires using MBPP as primary
      (HumanEval too small for robust per-round calibration). Three-way split
      prevents overfitting. The landmines are identified and mitigated. This
      can work within the scoped boundaries.
    key_contributions:
      - "Validated mechanism (temperature scaling mathematically sound)"
      - "Identified logit access constraint (open-weight models only)"
      - "Proposed three-way split (Train/Cal/Val) to avoid overfitting"
    constraints_accepted:
      - "Open-weight models only (Code Llama, StarCoder2, DeepSeek-Coder)"
      - "MBPP primary, HumanEval generalization (dataset size trade-off)"
      - "Function-level tasks only (not project-level code generation)"

  dr_ally:
    icon: "🛡️"
    name: "Dr. Ally"
    title: "Hypothesis Strengthening Champion"
    verdict: "STRONGLY SUPPORT - ALL CRITIQUES ADDRESSED"
    final_statement: |
      Every major objection has been addressed with concrete refinements.
      Monotonicity validation gates the study (addresses Rex's causality concern).
      Marginal benefit regression tests gating justification. Cost-adjusted
      utility addresses real-world relevance. Conformal quantiles replace
      heuristic thresholds. This is a dramatically stronger hypothesis than
      the initial proposal. Ready for Phase 2B verification protocol design.
    key_contributions:
      - "Synthesized all critiques into refined hypothesis v2"
      - "Added validation gates (monotonicity → marginal benefit → ablation)"
      - "Integrated conformal quantiles, cost-adjusted metrics"
    refinements_applied:
      - "Added monotonicity validation as Gate 1 (stop if fails)"
      - "Added marginal benefit regression (test gating justification)"
      - "Added cost-adjusted utility metric (R=1× to 10× cost ratios)"
      - "Replaced heuristic thresholds with conformal quantiles"

  prof_rex:
    icon: "🔍"
    name: "Prof. Rex"
    title: "Hypothesis Stress-Test Master"
    verdict: "CONCERNS ADDRESSED - PROCEED WITH CAUTION"
    final_statement: |
      The refined hypothesis addresses my core concerns. Monotonicity validation
      ensures calibration is behaviorally relevant (not just descriptively
      accurate). Marginal benefit regression tests whether gating is justified.
      Cost-sensitive utility analysis identifies where this method provides
      net value. Conformal quantiles eliminate heuristic tuning. But I remain
      cautious: if monotonicity validation fails (confidence doesn't predict
      correctness), the entire approach collapses. Gate 1 is make-or-break.
    key_contributions:
      - "Demanded monotonic confidence→correctness mapping"
      - "Required marginal benefit regression (Δpass ~ confidence)"
      - "Pushed for cost-sensitive utility (realistic compute assumptions)"
    remaining_concerns:
      - "Monotonicity validation is critical - if it fails, entire approach invalid"
      - "Per-round calibration drift may invalidate single-temperature assumption"
      - "Cost savings may only materialize when execution is unrealistically expensive"
    what_would_convince:
      - "Spearman ρ ≥ 0.7 between confidence bins and pass rate"
      - "Regression coefficient (confidence → Δpass) significantly negative"
      - "Net utility positive for realistic cost ratios (R ≤ 3×)"

# Consensus points
consensus:
  agreed_upon:
    - statement: "Temperature scaling is validated methodology (58.3% ECE reduction on h-e1)"
      unanimity: true

    - statement: "2×2 factorial design necessary to disentangle calibration from self-critique"
      unanimity: true

    - statement: "Monotonicity validation is critical gate (confidence must predict correctness)"
      unanimity: true

    - statement: "MBPP primary, HumanEval generalization (dataset size constraint)"
      unanimity: true

    - statement: "Open-weight models required (logit access for temperature scaling)"
      unanimity: true

  areas_of_tension:
    - topic: "Real-world cost assumptions"
      positions:
        - persona: "Prof. Rex"
          view: "Execution savings may only matter when execution >> inference cost"
        - persona: "Dr. Sage"
          view: "Formal verification, databases have naturally high execution costs"
      resolution: "Cost-adjusted utility metric across R=1× to 10× identifies win regions"

    - topic: "Generalizability beyond open-weight models"
      positions:
        - persona: "Prof. Pax"
          view: "Logit access constraint limits to proof-of-concept scope"
        - persona: "Dr. Nova"
          view: "Proof of principle enables future API-based variants"
      resolution: "Accept as scoped proof-of-concept, API integration as future work"

# Hypothesis readiness
readiness_assessment:
  phase2b_ready: true
  hypothesis_quality: "HIGH"
  testability: "EXCELLENT (clear disconfirmation criteria)"
  novelty: "SIGNIFICANT (intermediate control flow via calibration)"
  feasibility: "VALIDATED (mechanism sound, datasets available, models accessible)"
  impact_potential: "HIGH (domain-general principle for agentic systems)"

  risks_identified:
    - risk: "Monotonicity validation may fail"
      severity: "CRITICAL"
      mitigation: "Gate 1 stops study if confidence doesn't predict correctness"

    - risk: "Per-round calibration drift may invalidate single temperature"
      severity: "MEDIUM"
      mitigation: "Testable via per-round ECE, pool rounds if needed"

    - risk: "Cost savings may only appear for unrealistic cost ratios"
      severity: "MEDIUM"
