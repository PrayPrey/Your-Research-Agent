# Next phase preparation
phase2b_inputs:
  must_work_gate: "Monotonicity validation (Spearman ρ ≥ 0.7)"
  determines_success_gate: "20-40% execution reduction with Δpass@1 ≤ 2%"
  experimental_design: "2×2 factorial (Temperature Scaling × Gating Policy)"
  primary_metrics: ["pass@1", "execution_attempts", "wall_clock_time", "cost_adjusted_utility"]
  validation_sequence: ["monotonicity_check", "marginal_benefit_regression", "full_ablation"]
