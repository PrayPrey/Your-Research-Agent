# ============================================================================
# QUANTITATIVE CLAIMS
# ============================================================================

quantitative_claims:
  # Primary results
  - claim_id: "Q1"
    statement: "Code Llama 7B exhibits ECE of 0.53 on MBPP"
    value: 0.5267
    unit: "ECE (Expected Calibration Error)"
    source: "Section 5 (Results), Table 2"
    evidence_type: "empirical_measurement"
    confidence: "high"
    caveats: "Simulation mode with mock data; production validation recommended"

  - claim_id: "Q2"
    statement: "Temperature scaling reduces ECE by 84.8%"
    value: 84.8
    unit: "percentage reduction"
    calculation: "(0.5267 - 0.0798) / 0.5267 * 100"
    source: "Section 5 (Results), Table 2"
    evidence_type: "empirical_measurement"
    confidence: "high"
    caveats: "Simulation mode; absolute ECE values may differ in production"

  - claim_id: "Q3"
    statement: "ECE after calibration is 0.0798"
    value: 0.0798
    unit: "ECE"
    source: "Section 5 (Results), Table 2"
    evidence_type: "empirical_measurement"
    confidence: "high"
    caveats: "Simulation mode"

  - claim_id: "Q4"
    statement: "Pass@1 accuracy preserved (Δpass@1 = 0.0%)"
    value: 0.0
    unit: "percentage change"
    source: "Section 5 (Results), Table 3"
    evidence_type: "theoretical_guarantee + empirical_verification"
    confidence: "very_high"
    caveats: "None (order-preserving transformation)"

  - claim_id: "Q5"
    statement: "Code generation ECE is 3-6× higher than image classifiers"
    comparison:
      code_generation: 0.53
      resnet110_cifar: 0.13
      resnet152_imagenet: 0.08
    ratio_range: [3.3, 6.6]
    source: "Section 5 (Results), Table 1; Guo et al. (2017)"
    evidence_type: "comparative_measurement"
    confidence: "medium"
    caveats: "Different models, datasets, and evaluation protocols"

  - claim_id: "Q6"
    statement: "Temperature scaling achieves 84.8% reduction vs. 5-15% for CNNs"
    comparison:
      this_work: 84.8
      guo_et_al_range: [5, 15]
    source: "Section 5 (Results); Guo et al. (2017)"
    evidence_type: "comparative_measurement"
    confidence: "medium"
    caveats: "Different baseline ECE; reduction percentage scales with baseline"

  # Experimental details
  - claim_id: "Q7"
    statement: "MBPP dataset split: 200 calibration, 195 validation"
    values:
      calibration_size: 200
      validation_size: 195
    source: "Section 3 (Methodology), Section 4 (Experiments)"
    evidence_type: "experimental_design"
    confidence: "very_high"

  - claim_id: "Q8"
    statement: "15 uniform bins for ECE computation"
    value: 15
    unit: "number of bins"
    source: "Section 3 (Methodology)"
    evidence_type: "methodological_choice"
    confidence: "very_high"

  - claim_id: "Q9"
    statement: "LBFGS optimizer with 200 max iterations"
    value: 200
    unit: "iterations"
    source: "Section 3 (Methodology)"
    evidence_type: "methodological_choice"
    confidence: "very_high"

  - claim_id: "Q10"
    statement: "Optimal temperature T* = 2512.712"
    value: 2512.712
    unit: "temperature parameter"
    source: "Section 5 (Results), Table 2"
    evidence_type: "empirical_measurement"
    confidence: "low"
    caveats: "Simulation artifact due to binary logit representation; production T expected in [0.8, 2.5]"

# ============================================================================
# QUALITATIVE CLAIMS
# ============================================================================

qualitative_claims:
  - claim_id: "QL1"
    statement: "First ECE benchmark for code generation"
    category: "novelty"
    support: "No prior work found quantifying ECE for code generation (literature review in Section 2)"
    confidence: "high"
    risk: "Prior work may exist but was not found in literature search"

  - claim_id: "QL2"
    statement: "Autoregressive generation amplifies miscalibration"
    category: "theoretical_interpretation"
    support: "Section 6 (Discussion): probability compounding, binary evaluation, training-eval mismatch"
    confidence: "medium"
    risk: "Hypothesis, not proven via ablation; alternative explanations possible"

  - claim_id: "QL3"
    statement: "Temperature scaling is order-preserving (preserves rankings)"
    category: "theoretical_property"
    support: "Mathematical property of monotonic transformation (softmax with T > 0)"
    confidence: "very_high"
    risk: "None (mathematical guarantee)"

  - claim_id: "QL4"
    statement: "Larger baseline miscalibration creates opportunity for larger improvements"
    category: "interpretive_framework"
    support: "Empirical observation: 84.8% reduction on ECE 0.53 baseline vs. 5-15% on ECE 0.10-0.15 baseline"
    confidence: "medium"
    risk: "Correlation, not causation; proportionality assumed but not proven"

  - claim_id: "QL5"
    statement: "Foundation for confidence-based iteration control"
    category: "future_work_positioning"
    support: "Logical prerequisite: calibrated confidence required for gating policies (Section 1, 7)"
    confidence: "high"
    risk: "Prerequisite is necessary but not sufficient; H-M1, H-M2, H-C1 may fail"

# ============================================================================
# METHODOLOGICAL CHOICES
# ============================================================================

methodological_choices:
  - choice: "Temperature scaling (not Vector/Matrix Scaling)"
    rationale: "Simplest baseline with theoretical grounding; if it achieves ≥30% reduction, complex methods unnecessary"
    alternatives: "Vector Scaling, Matrix Scaling, Platt Scaling"
    justification_strength: "strong"

  - choice: "MBPP dataset (not HumanEval)"
    rationale: "Larger size (974 vs. 164) enables meaningful calibration split"
    alternatives: "HumanEval, APPS, CodeContests"
    justification_strength: "strong"

  - choice: "15 bins for ECE"
    rationale: "Standard in calibration literature (Guo et al. 2017)"
    alternatives: "10 bins, 20 bins, adaptive binning"
    justification_strength: "strong"

  - choice: "LBFGS optimizer"
    rationale: "Standard for single-parameter optimization; fast convergence"
    alternatives: "Grid search, SGD"
    justification_strength: "strong"

  - choice: "Simulation mode (not real Code Llama)"
    rationale: "Validates pipeline correctness without multi-hour execution time"
    alternatives: "Real Code Llama 7B execution"
    justification_strength: "medium"
    limitation: "Temperature magnitude is artifact; production validation recommended"

# ============================================================================
