  very_strong:
    - "Pass@1 accuracy preservation (mathematical guarantee)"
    - "Experimental setup details (MBPP splits, 15 bins, LBFGS)"
    - "Temperature scaling is order-preserving"

  strong:
    - "84.8% ECE reduction (measured on validation split)"
    - "ECE 0.53 baseline (measured on calibration split)"
    - "LBFGS convergence (200 iterations, monotonic NLL decrease)"

  medium:
    - "Code generation 3-6× worse than classification (cross-study comparison)"
    - "Autoregressive generation amplifies miscalibration (hypothesis, not proven)"
    - "Larger baseline → larger improvement (observed pattern, not causal)"

  weak:
    - "Optimal temperature T*=2512.71 (simulation artifact)"
    - "First ECE benchmark for code generation (absence of evidence, not evidence of absence)"

