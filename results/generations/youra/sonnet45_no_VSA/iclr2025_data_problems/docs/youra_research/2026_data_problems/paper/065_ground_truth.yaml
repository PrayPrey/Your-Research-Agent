    metric: "ECE reduction percentage"
    their_result: "5-15% (CNNs on CIFAR-100, ImageNet)"
    our_result: "84.8% (Code Llama on MBPP)"
    comparison_type: "same_metric_different_tasks"
    confounds:
      - "Different baseline ECE (0.10-0.15 vs. 0.53)"
      - "Different models (CNNs vs. LLMs)"
      - "Different tasks (classification vs. generation)"
