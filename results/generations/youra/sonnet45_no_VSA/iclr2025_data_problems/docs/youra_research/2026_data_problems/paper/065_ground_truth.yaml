  - limitation: "Simulation mode with mock data"
    impact: "Temperature magnitude (T*=2512.71) is artifact"
    mitigation: "Run full experiment with real Code Llama 7B"
    disclosure_location: "Section 3 (Methodology), Section 5 (Results), Section 6 (Discussion L1)"
    severity: "medium"

  - limitation: "Single model (Code Llama 7B)"
    impact: "ECE 0.53 may be model-specific, not universal for code generation"
    mitigation: "Replicate on StarCoder2, DeepSeek-Coder"
    disclosure_location: "Section 6 (Discussion L2)"
    severity: "medium"

  - limitation: "Single dataset (MBPP)"
    impact: "Calibration characteristics may differ for complex tasks (APPS, CodeContests)"
    mitigation: "Validate on HumanEval (Phase 5), APPS, CodeContests"
    disclosure_location: "Section 6 (Discussion L3)"
    severity: "low"

  - limitation: "Single calibration method (temperature scaling)"
    impact: "Cannot claim temperature scaling is optimal"
    mitigation: "Ablation study comparing Vector/Matrix Scaling"
    disclosure_location: "Section 6 (Discussion L4)"
    severity: "low"

