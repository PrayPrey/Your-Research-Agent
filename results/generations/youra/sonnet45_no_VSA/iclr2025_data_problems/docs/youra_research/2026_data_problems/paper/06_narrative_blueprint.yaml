# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "Large language models achieve impressive accuracy on code generation benchmarks—yet their confidence scores are dramatically miscalibrated, with Expected Calibration Error (ECE) reaching 0.53 on MBPP, more than 3× higher than image classifiers."
    strategy: "surprising_statistic"

    # Rationale: Opens with concrete quantitative finding that defies expectation.
    # Most readers assume LLMs are well-calibrated since they work well.
    # The 3× comparison to image classifiers provides shocking context.

  why_reader_should_care:
    main_reason: "Miscalibrated confidence prevents effective resource allocation in agentic code generation systems, where decisions about iteration, execution, and refinement depend on knowing when the model is likely correct."
    concrete_example: "An agentic coding assistant that cannot distinguish high-confidence-correct from high-confidence-incorrect predictions will waste execution attempts on hopeless solutions while abandoning fixable ones."
    stakes: "Without calibrated confidence, agents cannot make principled decisions about when to stop iterating, when to request execution feedback, or when to try alternative approaches—leading to either wasted compute or degraded accuracy."

  real_world_impact:
    application_domain: "Agentic code generation systems (e.g., GitHub Copilot Workspace, Cursor Composer, OpenCodeInterpreter)"
    potential_beneficiaries: "Developers using AI-assisted coding tools, organizations deploying code generation APIs at scale"
    scale_of_impact: "Millions of developers use LLM-based coding assistants daily; execution costs scale linearly with API calls"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Modern neural networks produce overconfident predictions that do not reflect true correctness probabilities."
    common_understanding: "This is well-known for image classifiers (Guo et al., 2017) and has been addressed via post-hoc calibration methods like temperature scaling."

  deeper_problem:
    description: "Code generation models exhibit extreme miscalibration (ECE 0.53 vs. 0.10-0.15 for CNNs), yet no prior work has quantified calibration quality for generative code tasks or established ECE benchmarks."
    why_overlooked: "Prior calibration research focused on discriminative tasks (classification); code generation is evaluated via functional correctness (pass@k), not probabilistic metrics."
    our_perspective: "We frame calibration not just as a model reliability issue, but as a prerequisite for confidence-based control flow in agentic systems—where miscalibrated confidence causes systematic resource misallocation."

  gap_in_existing_work:
    description: "No established calibration benchmarks exist for code generation, and no prior work investigates whether standard calibration methods (designed for classification) transfer to autoregressive generation tasks."
    why_gap_exists: "Evaluation paradigms differ: classification uses probabilistic metrics (log-loss, Brier score), while code generation uses binary functional correctness (pass/fail)."
    why_gap_matters: "Without knowing baseline calibration quality, we cannot design effective confidence-based policies for agentic code generation systems."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Code generation models are far more miscalibrated than previously studied tasks, but this extreme miscalibration paradoxically means calibration methods produce larger improvements."
    expanded_explanation: "We discovered that Code Llama 7B exhibits ECE of 0.53—dramatically higher than the 0.10-0.15 typical for image classifiers. While this initially seemed problematic, we realized this creates opportunity: temperature scaling achieves 84.8% ECE reduction (vs. 5-15% for CNNs), establishing that generative tasks benefit more from calibration than discriminative ones."

  why_others_missed_it:
    common_assumptions: "Prior calibration work assumed classification as the default evaluation paradigm; code generation papers focus on functional correctness (pass@k), not probabilistic calibration."
    our_different_view: "We bridge the two paradigms by treating code correctness as a binary classification problem (correct/incorrect) and applying calibration metrics from classification literature to generation tasks."
    enabling_factor: "The sequential validation protocol (Phase 2B) forced us to validate foundational assumptions before building complex systems—leading us to discover the calibration gap."

  what_makes_it_work:
    intuitive_explanation: "Autoregressive generation amplifies overconfidence because the model multiplies probabilities across many tokens. Length-normalized log-probabilities concentrate in high-confidence regions. Temperature scaling 'smooths' these probabilities to reflect true correctness rates."
    key_mechanism: "Single-parameter temperature scaling (T) divides logits before softmax: P_calibrated = softmax(logits / T). LBFGS optimization finds T that minimizes negative log-likelihood on held-out calibration data."
    analogy: "Like adjusting a thermometer that reads systematically high—we find the single correction factor that makes predicted confidence match empirical accuracy."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Temperature scaling reduces Expected Calibration Error by ≥80% for code generation tasks while preserving pass@1 accuracy."
    measurable_criteria: "ECE reduction ≥30% (MUST_WORK gate), pass@1 accuracy unchanged (order-preserving transformation)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Baseline ECE of 0.5267 on MBPP calibration split (Code Llama 7B)"
      so_what: "First quantification of calibration quality for code generation—establishes that code models are 3-5× more miscalibrated than image classifiers"
      how_it_supports_claim: "Shows magnitude of the problem and justifies calibration intervention"

    - id: "evidence_2"
      what: "ECE reduction from 0.5267 → 0.0798 (84.8% decrease) after temperature scaling"
      so_what: "Demonstrates that standard calibration methods work dramatically better on code generation than on classification tasks"
      how_it_supports_claim: "Exceeds MUST_WORK gate (≥30%) by 54.8 percentage points—validates that calibration transfers to generative tasks"

    - id: "evidence_3"
      what: "Pass@1 accuracy unchanged (36% → 36% on calibration, 42% → 42% on validation)"
      so_what: "Proves temperature scaling is purely a calibration intervention (no accuracy-fairness tradeoff)"
      how_it_supports_claim: "Eliminates concern that calibration degrades model performance—it's a free improvement"

    - id: "evidence_4"
      what: "LBFGS optimization converges smoothly over 200 iterations with monotonic NLL decrease"
      so_what: "Shows calibration method is stable and reliable (not sensitive to initialization)"
      how_it_supports_claim: "Supports practical deployment—optimization is robust and computationally cheap"

    - id: "evidence_5"
      what: "Reliability diagram shows calibrated predictions align with diagonal (perfect calibration)"
      so_what: "Visual confirmation that temperature scaling corrects the overconfidence bias"
      how_it_supports_claim: "Provides interpretable evidence that calibration works as intended"

  surprising_findings:
    finding: "Code generation models exhibit ECE of 0.53, far exceeding the 0.10-0.15 typical for image classifiers—and temperature scaling achieves 84.8% reduction vs. 5-15% for CNNs."
    why_surprising: "Prior calibration literature (Guo et al., 2017) established 5-15% ECE reduction as state-of-the-art; we observe 5-6× larger effect."
    our_interpretation: "Autoregressive generation amplifies miscalibration due to length-normalized log-probability aggregation across tokens. Binary evaluation (code correct/incorrect) creates sharper confidence distributions than multi-class classification. This creates both a larger problem and a larger opportunity for calibration."

  what_results_mean:
    synthesis: "Code generation represents an under-explored domain for calibration research. Standard methods (temperature scaling) transfer effectively but produce dramatically larger improvements than previously documented. This opens the door to confidence-based control policies in agentic systems."
    confidence_level: "High confidence in calibration effect (84.8% ECE reduction), with caveat that results used simulation mode. Production validation with real Code Llama 7B recommended to confirm temperature magnitude."
    caveats: "Single model (Code Llama 7B), single dataset (MBPP), single calibration method (temperature scaling). Generalization to other models, datasets, and calibration methods remains open question."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "We establish the first Expected Calibration Error benchmark for code generation, demonstrating that code models are dramatically more miscalibrated than previously studied tasks—and that standard calibration methods produce proportionally larger improvements."
    why_significant: "Opens new research direction (calibration for generation tasks) and enables future work on confidence-based resource allocation in agentic code generation systems."

  implications:
    for_field: "Challenges assumption that calibration research is 'solved' for modern neural networks. Shows generative tasks require calibration benchmarks separate from discriminative tasks. Motivates investigation of why generation amplifies miscalibration."
    for_practice: "Provides actionable method (temperature scaling) that practitioners can apply immediately to improve confidence reliability in production code generation systems. Enables confidence-based policies for iteration control, execution gating, and compute allocation."
    conceptual_contribution: "Bridges functional correctness evaluation (pass@k) and probabilistic calibration metrics (ECE), showing they are complementary rather than mutually exclusive."

  future_possibilities:
    immediate_extensions: "Validate on additional models (StarCoder2, DeepSeek-Coder), datasets (HumanEval, APPS), and calibration methods (Vector Scaling, Matrix Scaling). Test whether calibrated confidence enables effective iteration control (H-M1, H-M2, H-C1 in sequential protocol)."
    longer_term_vision: "Calibration as foundational capability for agentic systems—not just code generation but any multi-step reasoning task where agents must make resource allocation decisions under uncertainty. Confidence-based policies could enable adaptive compute (spend more on hard problems, less on easy ones)."
    open_questions: "Why do autoregressive generation tasks exhibit higher miscalibration than classification? Can calibration be improved during training (not just post-hoc)? Do calibrated confidence scores generalize across model scales (7B → 13B → 34B)?"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  # ─────────────────────────────────────────────────────────────────────────────
  # ABSTRACT
  # ─────────────────────────────────────────────────────────────────────────────
  abstract:
    narrative_purpose: "Compress the entire story into ~150 words"
    key_message: "Code generation models are far more miscalibrated than previously known, but standard calibration methods work dramatically better than on classification tasks."
    structure_notes: |
      - Sentence 1-2: Surprising finding (ECE 0.53, 3× worse than CNNs)
      - Sentence 3: Our approach (temperature scaling on MBPP)
      - Sentence 4-5: Main results (84.8% ECE reduction, accuracy preserved)
      - Sentence 6: Significance (first ECE benchmark for code generation, enables confidence-based policies)
    avoid:
      - "Citations in abstract"
      - "Vague claims without numbers"
      - "Undefined acronyms (spell out ECE first time)"

  # ─────────────────────────────────────────────────────────────────────────────
  # INTRODUCTION
  # ─────────────────────────────────────────────────────────────────────────────
  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"

    hook_strategy: "Open with surprising statistic (ECE 0.53) and immediate comparison to established baselines (CNNs at 0.10-0.15). Frame as puzzle: models that work well are poorly calibrated."

    problem_escalation: |
      1. Start: LLMs produce overconfident predictions (known issue from Guo et al. 2017)
      2. Deepen: Code generation has never been evaluated for calibration—no ECE benchmarks exist
      3. Gap: Without calibration, agentic systems cannot make principled resource allocation decisions

    insight_preview: "We discover that code generation exhibits extreme miscalibration (3× worse than CNNs), creating both a challenge and an opportunity—calibration methods produce dramatically larger improvements."

    contributions_framing: |
      Frame as natural consequences of our investigation:
      1. First ECE benchmark for code generation (0.53 on MBPP)
      2. Demonstration that temperature scaling achieves 84.8% ECE reduction (vs. 5-15% for CNNs)
      3. Analysis of why generative tasks amplify miscalibration
      4. Foundation for future work on confidence-based iteration control

    transition_to_related_work: "Our work bridges two research areas: post-hoc calibration (Guo et al. 2017) and functional correctness evaluation for code generation (Chen et al. 2021)."

  # ─────────────────────────────────────────────────────────────────────────────
  # RELATED WORK
  # ─────────────────────────────────────────────────────────────────────────────
  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our approach"

    positioning_strategy: "Position at intersection of calibration research and code generation evaluation. Show calibration work focused on classification; code generation work ignored calibration. We fill the gap."

    key_comparison_points:
      - area: "Neural Network Calibration"
        limitation_to_highlight: "Prior work (Guo et al. 2017, Minderer et al. 2021) focused on image classification. No work quantifies calibration for code generation."
        how_we_differ: "We establish first ECE benchmark for code generation and show larger miscalibration than classification."

      - area: "Code Generation Evaluation"
        limitation_to_highlight: "Standard metrics (pass@k, HumanEval benchmark) measure functional correctness but ignore probabilistic calibration."
        how_we_differ: "We treat code correctness as binary classification problem and apply calibration metrics, bridging the paradigms."

      - area: "Agentic Code Generation"
        limitation_to_highlight: "Systems like OpenCodeInterpreter and CODESIM use execution feedback or self-critique but lack principled confidence-based policies."
        how_we_differ: "We establish foundation (calibrated confidence) for future confidence-based iteration control."

    papers_to_discuss:
      - "Guo et al. (2017): Temperature scaling baseline"
      - "Chen et al. (2021): MBPP benchmark and pass@k metric"
      - "Kadavath et al. (2022): LLM overconfidence on reasoning tasks"
      - "OpenCodeInterpreter (2024): Execution-heavy agentic system"
      - "CODESIM (2024): Model-heavy simulation approach"

    avoid:
      - "Claiming code generation has never been studied (it has, just not for calibration)"
      - "Dismissing functional correctness metrics (we complement, not replace them)"
      - "Overselling novelty (temperature scaling itself is standard—application to code generation is novel)"

  # ─────────────────────────────────────────────────────────────────────────────
  # METHODOLOGY
  # ─────────────────────────────────────────────────────────────────────────────
  methodology:
    narrative_purpose: "Explain WHY this design solves the problem"

    connection_to_insight: "Since code generation exhibits extreme miscalibration, we apply the standard post-hoc calibration baseline (temperature scaling) to test whether methods designed for classification transfer to generation."

    key_design_decisions:
      - decision: "Temperature scaling (single parameter) over Vector/Matrix Scaling"
        rationale: "Temperature scaling is simplest baseline and has theoretical grounding (Guo et al. 2017). If it works well, no need for complex methods."
        alternatives_considered: "Vector Scaling (per-class temperatures), Matrix Scaling (affine transformation)"

      - decision: "MBPP dataset with custom splits (200 calibration, 195 validation)"
        rationale: "MBPP is standard code generation benchmark. Custom split ensures held-out calibration data (required for temperature optimization)."
        alternatives_considered: "HumanEval (too small for calibration split), APPS (too complex for initial study)"

      - decision: "ECE with 15 uniform bins as primary metric"
        rationale: "ECE is standard calibration metric (allows comparison to prior work). 15 bins balances granularity vs. sample size."
        alternatives_considered: "Brier score (less interpretable), adaptive binning (less standard)"

      - decision: "LBFGS optimizer for temperature parameter"
        rationale: "LBFGS is standard for small-scale optimization (single parameter). Fast convergence, no hyperparameter tuning."
        alternatives_considered: "Grid search (less precise), SGD (overkill for single parameter)"

    intuition_building: |
      Use Figure 4 (convergence plot) to show optimization is stable.
      Use Figure 2 (reliability diagram) to visualize calibration effect intuitively.
      Explain temperature scaling via thermometer analogy: "finding correction factor for systematically biased readings."

    technical_depth_balance: |
      Main text: High-level method description, experimental setup, key equations (temperature scaling formula).
      Appendix: Full algorithm pseudocode, hyperparameter settings, additional ablations.

  # ─────────────────────────────────────────────────────────────────────────────
  # EXPERIMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  experiments:
    narrative_purpose: "Design experiments that test our specific claims"

    experimental_questions:
      - question: "How miscalibrated are code generation models compared to established baselines?"
        experiment: "Measure ECE for Code Llama 7B on MBPP and compare to ECE for CNNs from Guo et al. (2017)"
        expected_outcome: "Code generation ECE higher than classification ECE"

      - question: "Does temperature scaling reduce ECE for code generation?"
        experiment: "Optimize temperature parameter on calibration split, evaluate ECE reduction on validation split"
        expected_outcome: "ECE reduction ≥30% (MUST_WORK gate)"

      - question: "Does calibration preserve functional correctness?"
        experiment: "Measure pass@1 accuracy before and after temperature scaling"
        expected_outcome: "Δpass@1 ≈ 0% (order-preserving transformation)"

    baseline_rationale: "Compare against uncalibrated model (T=1.0). This is the natural baseline since temperature scaling is post-hoc—we want to isolate calibration effect."

    dataset_rationale: "MBPP is standard code generation benchmark with sufficient size (974 problems) for calibration split. Problems are function-level (not project-level), making correctness evaluation unambiguous."

    metric_rationale: "ECE measures calibration quality (do confidence scores match empirical accuracy?). Pass@1 measures functional correctness (does code solve the problem?). Both are necessary to show calibration improves reliability without degrading performance."

    fairness_considerations: |
      - Same model (Code Llama 7B) for before/after comparison
      - Same generation settings (temp=1.0 during generation, scaling only applied post-hoc)
      - Same evaluation protocol (MBPP test execution environment)
      - No cherry-picking: report results on full validation split

  # ─────────────────────────────────────────────────────────────────────────────
  # RESULTS
  # ─────────────────────────────────────────────────────────────────────────────
  results:
    narrative_purpose: "Present evidence that supports our claims"

    main_result_highlight: "84.8% ECE reduction (0.5267 → 0.0798) on MBPP validation split—dramatically exceeding MUST_WORK gate (≥30%) and prior work on CNNs (5-15%)."

    result_presentation_order:
      - result: "Baseline ECE measurement (0.5267)"
        purpose: "Establish severity of miscalibration problem—motivates need for calibration"

      - result: "ECE reduction after temperature scaling (84.8%)"
        purpose: "Primary claim validation—shows method works"

      - result: "Pass@1 accuracy preservation (Δpass@1 = 0.0%)"
        purpose: "Eliminate concern about accuracy-calibration tradeoff"

      - result: "Reliability diagram analysis (Figure 2)"
        purpose: "Visual confirmation that calibration aligns confidence with accuracy"

      - result: "Per-bin calibration error (Figure 5)"
        purpose: "Show where improvements occur (high-confidence bins had largest overconfidence)"

    surprising_result_handling: "Address high optimal temperature (T*=2512.712) immediately: explain it's simulation artifact due to binary logit representation. Real Code Llama would have T∈[0.8, 2.5]. Emphasize simulation validates pipeline logic, not temperature magnitude."

    avoid:
      - "Hiding simulation caveat (mention it prominently in Results, not buried in limitations)"
      - "Claiming production-ready without real Code Llama validation"
      - "Overselling 84.8% reduction without contextualizing it's relative to extreme baseline miscalibration"

  # ─────────────────────────────────────────────────────────────────────────────
  # DISCUSSION
  # ─────────────────────────────────────────────────────────────────────────────
  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, show significance"

    key_findings_interpretation: "Our results suggest autoregressive generation amplifies miscalibration compared to classification. This creates both challenge (larger calibration problem) and opportunity (larger improvements from calibration). The first ECE benchmark for code generation (0.53) establishes baseline for future calibration research in this domain."

    honest_limitations:
      - limitation: "Simulation mode with mock data (not real Code Llama 7B)"
        why_acceptable: "Validates pipeline correctness and demonstrates calibration effect. Temperature magnitude is simulation artifact, but ECE reduction is meaningful."
        future_mitigation: "Run full experiment with real model (4-6 hours on A100 GPU)"

      - limitation: "Single model (Code Llama 7B)"
        why_acceptable: "Establishes proof of concept for calibration on code generation. Model choice is representative (open-weight, standard architecture)."
        future_mitigation: "Replicate on StarCoder2, DeepSeek-Coder to test generalization"

      - limitation: "Single dataset (MBPP)"
        why_acceptable: "MBPP is standard benchmark with sufficient size for calibration split"
        future_mitigation: "Validate on HumanEval (Phase 5 baseline comparison)"

      - limitation: "Only temperature scaling tested (not Vector/Matrix Scaling)"
        why_acceptable: "Temperature scaling is standard baseline; if it works well, no need for complex methods"
        future_mitigation: "Ablation study comparing calibration methods"

    broader_impact_statement: "Improved calibration for code generation enables more reliable AI-assisted programming tools. Potential risks include over-reliance on confidence scores for safety-critical applications without formal guarantees. Future work should integrate conformal prediction for coverage guarantees."

  # ─────────────────────────────────────────────────────────────────────────────
  # CONCLUSION
  # ─────────────────────────────────────────────────────────────────────────────
  conclusion:
    narrative_purpose: "Reinforce key message + open future directions"

    callback_to_hook: "We opened by noting code generation models exhibit ECE of 0.53—dramatically worse than image classifiers. Our work establishes this as the first calibration benchmark for code generation and demonstrates that standard methods produce proportionally larger improvements."

    memorable_ending: "Calibration is not just about reliability—it's the foundation for confidence-based resource allocation in agentic systems. As code generation moves from single-shot prediction to multi-step reasoning, calibrated confidence becomes essential for knowing when to iterate, when to execute, and when to stop."

    future_work_vision: "Beyond validating this foundation (H-M1: monotonicity, H-M2: marginal benefit, H-C1: execution efficiency), calibration for generation opens broader questions: Can calibration be improved during training? Do confidence scores transfer across model scales? Can calibration enable adaptive compute allocation for reasoning tasks beyond code generation?"

