    Key narrative choices:
    1. Open with surprise (ECE 0.53, 3× worse than CNNs) — grabs attention
    2. Frame as bridge between two research areas (calibration + code generation) — positions novelty
    3. Emphasize larger effect size (84.8% vs. 5-15%) — differentiates from prior work
    4. Acknowledge simulation honestly but confidently — builds trust
    5. Connect to future vision (agentic systems) — shows broader impact

