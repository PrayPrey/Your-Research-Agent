# OBJECTIONS ADDRESSED
# ═══════════════════════════════════════════════════════════════

objections_addressed:

  difficulty_confound:
    objection: "Hard prompts fail on ALL dimensions → spurious coupling"
    raised_by: "Prof. Rex (Round 1)"
    resolution:
      - "Partial correlation controlling for model confidence scores"
      - "Difficulty-stratified analysis (measure coupling within quartiles)"
      - "Rejection criterion: partial phi ≥ 0.25 after controlling for difficulty"
    addressed_by: "Dr. Ally (Round 1), Prof. Vera (Round 2)"
    status: "RESOLVED"

  sample_size_adequacy:
    objection: "GPT-4 90% accuracy on TruthfulQA → only 81 failures → insufficient for pairwise tests"
    raised_by: "Prof. Rex (Round 1)"
    resolution:
      - "Power analysis: 500 instances × 20% failure rate = 100 failures per dimension"
      - "Expected overlap: random = 20, observed ≥ 30 needed for phi = 0.3 at p < 0.05"
      - "Verified achievable with MMTrustEval framework"
    addressed_by: "Prof. Vera (Round 2)"
    status: "RESOLVED"

  cross_model_generalization:
    objection: "If GPT-4 and Claude 3 show different coupling patterns, claim fails"
    raised_by: "Prof. Rex (Round 1)"
    resolution:
      - "Reframed from 'universal coupling' to 'model-specific fingerprints'"
      - "Different patterns become FEATURE not BUG (architectural signatures)"
      - "Mantel test r < 0.7 becomes success criterion (distinctiveness)"
    addressed_by: "Dr. Nova (Round 2), Dr. Sage (Round 2)"
    status: "RESOLVED → REFRAMED"

  cross_benchmark_complexity:
    objection: "TruthfulQA questions ≠ AdvBench prompts → 'same input' requirement impossible"
    raised_by: "Prof. Pax (Round 1)"
    resolution:
      - "Within-benchmark coupling using MMTrustEval (same 500 instances, 5 dimensions)"
      - "Cross-benchmark coupling becomes Phase 2 extension (conditional on Phase 1 success)"
      - "Avoids semantic clustering artifacts"
    addressed_by: "Dr. Ally (Round 1), Prof. Pax (Round 2)"
    status: "RESOLVED"

  causality_direction:
    objection: "Even if coupling found, we don't know WHY (shared vulnerability vs difficulty correlation)"
    raised_by: "Prof. Rex (Round 1)"
    resolution:
      - "Difficulty control via partial correlation (partial phi ≥ 0.25)"
      - "Qualitative validation: examine high-coupling instances for shared features"
      - "If random instances, coupling flagged as potential noise"
    addressed_by: "Prof. Rex (Round 2)"
    status: "PARTIALLY RESOLVED (observational study, no causal intervention)"

