# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  # ─────────────────────────────────────────────────────────────────────────────
  # ABSTRACT
  # ─────────────────────────────────────────────────────────────────────────────
  abstract:
    narrative_purpose: "Compress the entire story into ~150 words"
    key_message: "Sparse coupling (2 pairs, not 10) as fundamental property; difficulty-independent; model-specific profiles suggested"
    structure_notes: |
      - Sentence 1-2: Multi-dimensional trustworthiness evaluation assumes independence; compound failures overlooked
      - Sentence 3: We characterize coupling via phi coefficient across 5 dimensions × 3 models
      - Sentence 4-5: Coupling exists (phi 0.33-0.40, p<1e-13) but sparse (2 pairs: truth-robust, fair-safe); difficulty-independent (partial phi 0.36-0.56)
      - Sentence 6: First sparse coupling characterization; implications for model selection and benchmark design
    avoid:
      - "Citations in abstract"
      - "Vague claims without numbers"
      - "Undefined acronyms"

  # ─────────────────────────────────────────────────────────────────────────────
  # INTRODUCTION
  # ─────────────────────────────────────────────────────────────────────────────
  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"

    hook_strategy: "Practical failure case: compound failures invisible to independent evaluation; medical diagnosis example"

    problem_escalation: |
      1. Surface: Multi-dimensional trustworthiness evaluation exists (TrustLLM, MMTrustEval)
      2. Deeper: Independent evaluation assumes uncorrelated dimensions; shared vulnerabilities may create coupling
      3. Gap: No empirical coupling data; cannot answer breadth (how many pairs?) or model-specificity questions

    insight_preview: "Coupling is sparse (2 pairs, not broad) and difficulty-independent (genuine vulnerabilities, not hard-instance artifacts)"

    contributions_framing: |
      Building on sparse coupling insight, we:
      1. Characterize coupling breadth via phi coefficient (h-e1: 6 pairs across models)
      2. Validate difficulty-independence via partial correlation (h-m1: retention 86-161%)
      3. Establish sparsity via multi-pair analysis (h-m2: 0 models with ≥3 pairs)
      4. Observe model-specific profiles (h-c1: qualitative evidence, statistical power limited)

    transition_to_related_work: "Our work builds on multi-dimensional evaluation frameworks and behavioral detection methods, but adds coupling layer absent from prior work."

  # ─────────────────────────────────────────────────────────────────────────────
  # RELATED WORK
  # ─────────────────────────────────────────────────────────────────────────────
  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our approach"

    positioning_strategy: "Multi-dimensional evaluation exists but assumes independence; we add coupling analysis to reveal correlated vulnerabilities"

    key_comparison_points:
      - area: "Multi-dimensional trustworthiness frameworks"
        limitation_to_highlight: "TrustLLM, MMTrustEval report per-dimension scores; no co-occurrence statistics"
        how_we_differ: "We measure phi coefficient on instance-level binary labels across dimension pairs to quantify coupling"

      - area: "LLM vulnerability analysis"
        limitation_to_highlight: "Single-dimension focus (TruthfulQA for truthfulness, AdvBench for robustness) or synthetic coupling data"
        how_we_differ: "We use real benchmark instances to measure cross-dimensional co-occurrence patterns empirically"

      - area: "Difficulty confound control"
        limitation_to_highlight: "PMC literature shows difficulty confounds coupling estimates; prior work lacks explicit control"
        how_we_differ: "Partial correlation controlling for instance difficulty isolates genuine coupling from spurious artifacts"

    papers_to_discuss:
      - "TrustLLM (Sun et al. 2024): 8-dimension framework, independent evaluation"
      - "MMTrustEval (Li et al. 2024): 5-dimension framework with model cards"
      - "Li & Li 2024 (triangular trade-offs): Documents robustness-fairness coupling in specific scenarios"
      - "PMC confounding (correlation literature): Partial correlation methods for confounder control"

    avoid:
      - "Dismissing TrustLLM/MMTrustEval—our work builds on their frameworks"
      - "Overclaiming novelty—coupling hints exist in Li & Li 2024, we add systematic characterization"
      - "Ignoring Li & Li 2024 robustness-fairness result—validates sparse coupling hypothesis"

  # ─────────────────────────────────────────────────────────────────────────────
  # METHODOLOGY
  # ─────────────────────────────────────────────────────────────────────────────
  methodology:
    narrative_purpose: "Explain WHY this design solves the problem"

    connection_to_insight: "Sparse coupling hypothesis requires measuring all 10 dimension pairs to distinguish broad (many pairs) from narrow (few pairs) coupling. Difficulty-independence requires explicit control via partial correlation."

    key_design_decisions:
      - decision: "Phi coefficient for coupling strength"
        rationale: "Effect size measure for 2×2 contingency tables (pass/fail on each dimension); interpretable scale (0=independent, 1=perfect coupling)"
        alternatives_considered: "Odds ratio (less interpretable), chi-square alone (no effect size), Pearson correlation (assumes continuous data)"

      - decision: "Partial correlation controlling for difficulty"
        rationale: "Isolates genuine coupling from spurious co-occurrence driven by hard instances failing everywhere"
        alternatives_considered: "Stratified quartile analysis (complementary validation), propensity matching (data-hungry)"

      - decision: "Mantel test for model-specific fingerprints"
        rationale: "Compares coupling matrices (10×10) across model pairs; permutation-based significance test"
        alternatives_considered: "Element-wise correlation (ignores matrix structure), visual inspection (subjective)"

      - decision: "Bonferroni correction for h-m2 multi-pair analysis"
        rationale: "Controls family-wise error rate across 30 tests (10 pairs × 3 models)"
        alternatives_considered: "FDR control (less conservative; future sensitivity analysis)"

    intuition_building: |
      Figure 1 (difficulty_independence.png): Shows difficulty is uncorrelated with dimensions (|r|<0.2)—validates independence assumption
      Figure 2 (partial_vs_raw_phi.png): Scatter plot showing partial phi ≥ raw phi in 5/6 cases—visualizes suppressor effect
      Figure 3 (quartile_stratified_phi.png): Coupling persistence across difficulty quartiles—complementary validation

    technical_depth_balance: |
      Main paper: Phi coefficient formula, partial correlation intuition, Mantel test overview
      Appendix: Full contingency tables, power analysis (why n=100 insufficient for h-c1), sensitivity analysis (Bonferroni vs FDR)

  # ─────────────────────────────────────────────────────────────────────────────
  # EXPERIMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  experiments:
    narrative_purpose: "Design experiments that test our specific claims"

    experimental_questions:
      - question: "Does coupling exist? (h-e1)"
        experiment: "Compute phi coefficient for all 10 dimension pairs × 3 models; threshold phi≥0.3, p<0.01"
        expected_outcome: "≥1 model shows ≥1 significant pair (gate: MUST_WORK)"

      - question: "Is coupling difficulty-independent? (h-m1)"
        experiment: "Partial correlation controlling for instance difficulty; threshold partial phi≥0.25"
        expected_outcome: "≥2 pairs retain significance after control (gate: MUST_WORK)"

      - question: "How broad is coupling? (h-m2)"
        experiment: "Count significant pairs per model with Bonferroni correction; threshold ≥3 pairs"
        expected_outcome: "≥2 models with ≥3 pairs (gate: SHOULD_WORK, exploratory)"

      - question: "Are coupling profiles model-specific? (h-c1)"
        experiment: "Mantel test comparing coupling matrices across model pairs; threshold r<0.7, p<0.0167"
        expected_outcome: "≥1 pair shows distinct profiles (gate: SHOULD_WORK)"

    baseline_rationale: "No baseline comparison for coupling (no prior coupling data exists); h-e1 compares to null hypothesis (independence, phi=0)"
    dataset_rationale: "500 instances per model (100 per dimension) balances coverage (all 10 pairs) with Phase 4 PoC scope; synthetic data due to MultiTrust gating"
    metric_rationale: "Phi coefficient (effect size), chi-square p-value (significance), partial correlation (difficulty control), Mantel r (matrix similarity)"

    fairness_considerations: |
      - Same sample size (500) across all 3 models
      - Same synthetic data generation procedure (7% perturbations from base)
      - Same statistical thresholds (phi≥0.3, alpha=0.01)
      - Bonferroni correction controls false positives in h-m2 multi-pair analysis

  # ─────────────────────────────────────────────────────────────────────────────
  # RESULTS
  # ─────────────────────────────────────────────────────────────────────────────
  results:
    narrative_purpose: "Present evidence that supports our claims"

    main_result_highlight: "Coupling is sparse (h-m2 FAIL: 0 models with ≥3 pairs) yet difficulty-independent (h-m1 PASS: partial phi 0.36-0.56, retention 86-161%)"

    result_presentation_order:
      - result: "h-e1 (Coupling Exists): 6 pairs across models, phi 0.33-0.40"
        purpose: "Establish coupling as real phenomenon before characterizing breadth"

      - result: "h-m2 (Sparse Coupling): 0 models meet ≥3 pairs threshold"
        purpose: "Core finding—sparsity; contrasts with h-e1 to show coupling exists but is narrow"

      - result: "h-m1 (Difficulty-Independent): Partial phi 0.36-0.56, retention 86-161%"
        purpose: "Validate coupling as genuine (not spurious artifacts); suppressor effect is surprising finding"

      - result: "h-c1 (Model-Specific Profiles): Mantel r<0.7 but p>0.0167"
        purpose: "Qualitative evidence for fingerprints; acknowledge statistical limitation (sample size)"

    surprising_result_handling: "Suppressor effect (partial phi > raw phi) is unexpected; interpret as difficulty orthogonal to dimension-specific vulnerabilities (see Discussion)"

    avoid:
      - "Hiding h-m2 FAIL—sparsity is the finding, not a negative result"
      - "Overclaiming h-c1 significance—non-significant p-values acknowledged"
      - "Cherry-picking 2 significant pairs—report all 10 pairs in appendix table"

  # ─────────────────────────────────────────────────────────────────────────────
  # DISCUSSION
  # ─────────────────────────────────────────────────────────────────────────────
  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, show significance"

    key_findings_interpretation: "Sparse coupling (2 pairs) suggests trustworthiness dimensions are architecturally independent by default; coupling emerges only where mechanisms overlap (calibration for truth-robust, value alignment for fair-safe). Difficulty-independence distinguishes genuine coupling from measurement artifacts."

    honest_limitations:
      - limitation: "Synthetic data (MultiTrust gated); real-world coupling magnitudes unknown"
        why_acceptable: "Mechanism validated (phi coefficient works); PoC demonstrates feasibility"
        future_mitigation: "Phase 5 baseline comparison with real MultiTrust/TrustLLM data + API evaluations"

      - limitation: "Sample size n=100/dimension insufficient for h-c1 Mantel significance"
        why_acceptable: "Qualitative evidence (distinct profiles) strong; criterion r<0.7 met"
        future_mitigation: "Power analysis indicates n≥500 needed; future experiments pre-register sample size"

      - limitation: "Bonferroni correction potentially over-conservative (h-m2)"
        why_acceptable: "FDR sensitivity analysis unlikely to change conclusion (sparse coupling persists)"
        future_mitigation: "Report both Bonferroni and FDR results in future work"

    broader_impact_statement: "Coupling-aware model selection reduces compound failures in safety-critical deployments. Potential misuse: adversarial exploitation of known coupling patterns (attack truthfulness knowing robustness will fail). Mitigation: coupling profiles as transparency tool, not security-through-obscurity."

  # ─────────────────────────────────────────────────────────────────────────────
  # CONCLUSION
  # ─────────────────────────────────────────────────────────────────────────────
  conclusion:
    narrative_purpose: "Reinforce key message + open future directions"

    callback_to_hook: "We opened with compound failures invisible to independent evaluation (medical diagnosis example). Sparse coupling characterization makes these failures visible—2 vulnerability clusters (truth-robust, fair-safe) now measurable and targetable."

    memorable_ending: "Trustworthiness dimensions are not universally coupled (broad bottleneck) nor universally independent (zero correlation)—they exhibit sparse coupling, a fundamental property requiring targeted rather than universal mitigation strategies."

    future_work_vision: "Real-world validation (MultiTrust access), mechanistic interpretation (why these 2 pairs?), deployment tool (coupling profile database for model selection), causal intervention (fine-tune truthfulness → measure coupling change), temporal tracking (model updates alter profiles)"

