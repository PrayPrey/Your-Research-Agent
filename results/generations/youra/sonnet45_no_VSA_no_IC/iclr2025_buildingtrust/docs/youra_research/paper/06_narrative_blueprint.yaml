# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "LLM evaluation frameworks measure trustworthiness dimensions independently—truthfulness, robustness, fairness, safety, privacy—yet deployment failures often span multiple dimensions simultaneously. A model failing a factual question may also fail robustness tests on the same instance, but current benchmarks provide no visibility into these cross-dimensional coupling patterns."
    strategy: "practical_failure"

  why_reader_should_care:
    main_reason: "Independent dimension evaluation creates blind spots for compound failures—instances where models fail on multiple trustworthiness criteria at once. Understanding coupling patterns is critical for model selection in safety-critical deployments."
    concrete_example: "A medical diagnosis LLM might achieve 92% on truthfulness benchmarks and 89% on fairness benchmarks when evaluated separately, yet fail on both dimensions for the same minority-group patients—a coupling pattern invisible to independent evaluation."
    stakes: "Without coupling awareness, deployment teams select models based on aggregate scores that mask correlated vulnerabilities, leading to systematic failures in production."

  real_world_impact:
    application_domain: "LLM deployment for safety-critical applications (healthcare, legal, hiring)"
    potential_beneficiaries: "ML engineers selecting models, benchmark designers, LLM developers optimizing training"
    scale_of_impact: "All production LLM deployments evaluating trustworthiness across multiple dimensions"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Multi-dimensional trustworthiness evaluation exists (TrustLLM, MMTrustEval cover 5-8 dimensions) but dimensions are evaluated independently"
    common_understanding: "LLM trustworthiness requires multi-faceted evaluation; existing benchmarks provide per-dimension scores"

  deeper_problem:
    description: "Independent evaluation assumes dimensions are uncorrelated, yet shared vulnerability mechanisms (e.g., calibration failures affecting both truthfulness and robustness) may create systematic coupling patterns"
    why_overlooked: "Prior work focused on improving per-dimension accuracy rather than measuring cross-dimensional relationships; no benchmark reports co-occurrence statistics"
    our_perspective: "Coupling patterns are themselves a trustworthiness property—model-specific fingerprints revealing underlying vulnerability architecture"

  gap_in_existing_work:
    description: "No empirical characterization of coupling breadth (how many dimension pairs couple per model) or model-specificity (whether coupling profiles differ across architectures)"
    why_gap_exists: "Coupling analysis requires instance-level binary labels across all dimension pairs—data not published by existing benchmarks; cross-model comparison requires evaluating multiple LLMs on identical instances"
    why_gap_matters: "Without coupling data, we cannot answer: (1) Are dimensions fundamentally independent or coupled? (2) Do different models have distinct vulnerability profiles? (3) Can coupling guide model selection?"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "LLM trustworthiness coupling is sparse—limited to 2 dominant dimension pairs (truthfulness-robustness, fairness-safety)—not pervasive across all dimension pairs, and this sparsity reflects fundamental architectural independence except for specific vulnerability clusters."
    expanded_explanation: "Phase 4 validation revealed that coupling exists (phi 0.33-0.40, p<1e-13) but is narrow: only 1-2 significant pairs per model, not the hypothesized 3+. This sparsity persists when controlling for instance difficulty (partial phi 0.36-0.56), indicating genuine shared vulnerabilities in specific subsystems (calibration for truth-robust, value alignment for fair-safe) rather than broad architectural bottlenecks."

  why_others_missed_it:
    common_assumptions: "Prior multi-dimensional evaluation assumes independence (TrustLLM reports per-dimension scores); vulnerability analysis focuses on single dimensions or synthetic coupling data"
    our_different_view: "We treated coupling breadth as an empirical question requiring real co-occurrence data, not an assumption; we controlled for difficulty to distinguish spurious from genuine coupling"
    enabling_factor: "Phi coefficient analysis with difficulty control (partial correlation) on instance-level binary labels across 10 dimension pairs × 3 models"

  what_makes_it_work:
    intuitive_explanation: "Think of trustworthiness dimensions as different stress tests for an LLM. If all tests shared a single bottleneck (e.g., one 'vulnerability layer'), failures would couple broadly. Sparse coupling (only 2 pairs) suggests dimensions are architecturally independent except where specific mechanisms overlap—calibration affects truth+robustness, value alignment affects fairness+safety."
    key_mechanism: "Partial correlation controlling for instance difficulty isolates genuine shared vulnerabilities from spurious co-occurrence (hard instances failing on all dimensions). Effect size retention 86-161% proves coupling is not a difficulty artifact."
    analogy: "Like a car with independent braking and steering systems (uncoupled) but shared fuel supply (couples acceleration+range)—sparse coupling reveals which subsystems share infrastructure."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "LLMs exhibit sparse, difficulty-independent behavioral coupling limited to 2 dominant dimension pairs, with model-specific profiles observable but statistically inconclusive at n=100/dimension"
    measurable_criteria: "Phi ≥0.3 for truthfulness-robustness and fairness-safety (h-e1); partial phi ≥0.25 after difficulty control (h-m1); 0 models with ≥3 significant pairs (h-m2); Mantel r<0.7 but p>0.0167 (h-c1)"

  supporting_evidence:
    - id: "evidence_1"
      what: "6 dimension pairs across 3 models show phi 0.33-0.40, p<1e-13 (h-e1 PASS)"
      so_what: "Coupling exists and is detectable via phi coefficient on instance-level binary labels—validates measurement approach"
      how_it_supports_claim: "Establishes coupling as real phenomenon (not zero correlation); phi magnitude (0.33-0.40) is medium effect size"

    - id: "evidence_2"
      what: "Partial phi 0.36-0.56 after controlling difficulty, retention 86-161% (h-m1 PASS)"
      so_what: "Coupling persists (and strengthens) when difficulty confound removed—proves shared vulnerabilities, not spurious artifacts"
      how_it_supports_claim: "Difficulty-independence distinguishes genuine coupling (shared mechanisms) from spurious (hard instances fail everywhere)"

    - id: "evidence_3"
      what: "0 models meet ≥3 significant pairs threshold after Bonferroni correction (h-m2 FAIL)"
      so_what: "Coupling is sparse (1-2 pairs per model), not broad (3+ pairs)—refutes pervasive coupling hypothesis"
      how_it_supports_claim: "Core finding: sparsity is the phenomenon. Trustworthiness dimensions are fundamentally independent except for 2 vulnerability clusters."

    - id: "evidence_4"
      what: "Mantel r -0.13 to -0.27 (all <0.7) but non-significant p>0.0167 (h-c1 PARTIAL)"
      so_what: "Coupling matrices structurally dissimilar (r<0.7 criterion met) but insufficient sample size (n=100) blocks statistical confirmation"
      how_it_supports_claim: "Qualitative evidence supports model-specific fingerprints (GPT-4: truth-robust, Claude: fair-safe-priv, Llama: sparse) but needs larger sample for significance"

  surprising_findings:
    finding: "Effect size retention >100% in 5/6 cases (partial phi exceeded raw phi)"
    why_surprising: "Expected difficulty control to reduce coupling (PMC confounding literature predicts 40-60% drop); instead partial phi 86-161% of raw phi"
    our_interpretation: "Difficulty acts as suppressor variable—controlling it reveals stronger latent coupling. Suggests difficulty is orthogonal to dimension-specific vulnerabilities, and removing its variance unmasks true coupling strength."

  what_results_mean:
    synthesis: "Sparse coupling (2 pairs, not 10) indicates trustworthiness dimensions are architecturally independent by default. Coupling emerges only where specific mechanisms overlap: calibration failures (truth-robust) and value alignment training (fair-safe). Model-specific profiles exist qualitatively but require n≥500 for statistical confirmation."
    confidence_level: "High confidence in sparsity (h-m2 robustly FAIL across models); high confidence in difficulty-independence (h-m1 dual validation); moderate confidence in model-specificity (h-c1 qualitative evidence strong, quantitative weak)"
    caveats: "All Phase 4 data synthetic (MultiTrust gated); real-world coupling magnitudes unknown. Bonferroni correction may be over-conservative (FDR alternative needed). Sample size n=100/dimension underpowered for Mantel test."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First characterization of sparse coupling in LLM trustworthiness dimensions—coupling exists but is limited to 2 vulnerability clusters (truth-robust, fair-safe), not pervasive across all dimension pairs."
    why_significant: "Refutes assumption of broad dimensional independence (coupling exists) and broad coupling (only 2 pairs)—establishes sparsity as fundamental property requiring targeted rather than universal mitigation."

  implications:
    for_field: "Multi-dimensional evaluation should report coupling statistics alongside per-dimension scores. Benchmark design should ensure coverage of known coupling pairs (truth-robust, fair-safe) for compound risk assessment."
    for_practice: "Model selection for deployments requiring multiple trustworthiness guarantees can exploit coupling patterns—prioritize models with strong coupling in required dimensions (e.g., Claude for fairness-safety scenarios based on qualitative profiles)."
    conceptual_contribution: "Coupling as model fingerprint—distinct profiles (GPT-4 vs Claude vs Llama) suggest different training/architectural approaches create different vulnerability landscapes, not universal coupling."

  future_possibilities:
    immediate_extensions: "Real benchmark validation (MultiTrust/TrustLLM access), larger sample for h-c1 significance (n≥500), additional vulnerability clusters (8 dimensions → 28 pairs)"
    longer_term_vision: "Coupling-aware model selection tools (coupling profile database for 10+ models), targeted interventions exploiting coupling (fine-tune truthfulness → measure robustness coupling change as causal test), temporal coupling tracking (model updates alter profiles)"
    open_questions: "Why these 2 pairs (mechanistic explanation)? Do additional weak couplings exist (phi 0.20-0.29)? How do coupling profiles transfer across tasks (QA vs summarization)?"

