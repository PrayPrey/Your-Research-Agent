# ═══════════════════════════════════════════════════════════════
# Phase 2A Output: Hypothesis Refinement
# Generated: 2026-08-19
# Source: Phase 2A Tikitaka Discussion (Self-Contained Loop)
# ═══════════════════════════════════════════════════════════════

hypothesis_id: "h-c1"
version: "1.0"
status: "refined"
phase: "2A-Dialogue"
source_gap: "Gap 1 (P0) - Empirical Co-Occurrence Data"

# ═══════════════════════════════════════════════════════════════
# CORE HYPOTHESIS
# ═══════════════════════════════════════════════════════════════

core_statement: |
  LLMs exhibit model-specific behavioral coupling patterns across trustworthiness
  dimensions (truthfulness, robustness, fairness, safety, privacy), measurable via
  co-occurrence analysis on existing multi-dimensional benchmarks using only API
  access, without requiring internal model states or synthetic data.

reframed_contribution: |
  From "universal coupling discovery" to "model-specific coupling fingerprints" -
  architectures/training approaches manifest distinct coupling signatures, enabling
  evidence-based model selection for deployment.

# ═══════════════════════════════════════════════════════════════
# CAUSAL MECHANISM
# ═══════════════════════════════════════════════════════════════

mechanism:
  description: |
    When LLMs fail on one trustworthiness dimension (e.g., truthfulness), they exhibit
    statistically significant co-occurrence of failures on other dimensions (e.g.,
    robustness, fairness) due to shared underlying behavioral vulnerabilities. These
    coupling patterns are NOT universal but model-specific, reflecting architectural
    and training differences.

  behavioral_manifestation: |
    Coupling originates from shared failure modes in how models process and respond
    to certain input patterns. These failures are observable in model outputs (binary
    pass/fail labels on benchmark instances) without needing internal representations.

  model_specificity: |
    Different architectures (transformer variants), training data distributions, RLHF
    strategies, and pre-training objectives create model-specific vulnerability landscapes.
    GPT-4 may couple truthfulness-robustness strongly (both fail on adversarial factual
    questions) while Claude 3 couples truthfulness-fairness (both fail on biased knowledge
    retrieval).

# ═══════════════════════════════════════════════════════════════
# VARIABLES
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Model Identity"
      values: ["GPT-4", "Claude 3", "Llama 3"]
      rationale: "Representative of major LLM families with different architectures/training"

    - name: "Trustworthiness Dimension Pairs"
      values: "10 pairs from 5 dimensions"
      dimensions: ["truthfulness", "robustness", "fairness", "safety", "privacy"]
      rationale: "Cover core trustworthiness landscape from MMTrustEval framework"

    - name: "Instance Difficulty"
      operationalization: "Model confidence scores (logit probabilities)"
      rationale: "Control for confound that hard prompts fail on all dimensions"

  dependent:
    - name: "Coupling Strength"
      measure: "Phi coefficient"
      interpretation: "Effect size of co-occurrence (phi ≥ 0.3 = medium effect)"

    - name: "Coupling Significance"
      measure: "Chi-square p-value"
      interpretation: "Statistical evidence against independence (p < 0.01 threshold)"

    - name: "Cross-Model Coupling Similarity"
      measure: "Mantel test r"
      interpretation: "Fingerprint distinctiveness (r < 0.7 = distinct profiles)"

  control:
    - "Instance difficulty (partial correlation or stratified analysis)"
    - "Benchmark framework (fixed: MMTrustEval)"
    - "Sample size (fixed: 500 instances)"

# ═══════════════════════════════════════════════════════════════
# ASSUMPTIONS
# ═══════════════════════════════════════════════════════════════

assumptions:
  - id: "A1"
    statement: "Behavioral coupling is real"
    details: "Co-occurrence of failures reflects shared vulnerabilities, not random overlap"
    criticality: "HIGH"
    validation: "Test via difficulty control (partial correlation)"

  - id: "A2"
    statement: "Difficulty is measurable"
    details: "Model confidence scores validly proxy instance difficulty"
    criticality: "MEDIUM"
    validation: "Compare with human difficulty ratings if available"

  - id: "A3"
    statement: "Sample size is adequate"
    details: "500 instances × 20% failure rate provides sufficient co-failures for phi = 0.3 detection at 80% power"
    criticality: "HIGH"
    validation: "Power analysis confirms expected overlap ≥ 25 co-failures"

  - id: "A4"
    statement: "MMTrustEval is representative"
    details: "Framework's 5-dimensional evaluation validly captures trustworthiness landscape"
    criticality: "MEDIUM"
    validation: "Cross-validate with other benchmarks in Phase 2 extension"

  - id: "A5"
    statement: "API outputs are sufficient"
    details: "Internal states/attention weights not necessary to observe coupling"
    criticality: "HIGH"
    validation: "TrustScore (19 cit) demonstrated API-only behavioral detection works"

# ═══════════════════════════════════════════════════════════════
# NULL HYPOTHESIS
# ═══════════════════════════════════════════════════════════════

null_hypotheses:
  - id: "H0_independence"
    statement: "Within-Model Independence"
    description: "All trustworthiness dimension pairs exhibit weak coupling (phi < 0.2) for each model"
    rejection_criterion: "≥1 model shows ≥1 dimension pair with phi ≥ 0.3, p < 0.01"

  - id: "H0_homogeneity"
    statement: "Cross-Model Homogeneity"
    description: "Coupling matrices are identical across models (Mantel test r > 0.9)"
    rejection_criterion: "Mantel test r < 0.7 for ≥1 model pair"

  - id: "H0_difficulty"
    statement: "Difficulty Confound"
    description: "All observed coupling disappears when controlling for instance difficulty (partial phi < 0.2)"
    rejection_criterion: "Partial phi ≥ 0.25 after controlling for confidence scores"

# ═══════════════════════════════════════════════════════════════
# TESTABLE PREDICTIONS
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    name: "Coupling Exists"
    expected: "≥2 models show ≥3 dimension pairs with phi ≥ 0.3, p < 0.01"
    success_criterion: "Coupling detected in multiple models across multiple dimension pairs"
    measurement:
      - "Phi coefficient (effect size)"
      - "Chi-square test (significance)"
    falsification: "All dimension pairs show phi < 0.3 OR p > 0.05 for all tests"

  - id: "P2"
    name: "Model-Specific Fingerprints"
    expected: "Coupling matrices differ across models (Mantel test r < 0.7 for ≥1 model pair)"
    success_criterion: "Models exhibit distinct coupling profiles"
    measurement: "Mantel test for coupling matrix similarity"
    falsification: "All model pairs show Mantel r > 0.9 (identical patterns)"

  - id: "P3"
    name: "Difficulty-Independent"
    expected: "Partial phi ≥ 0.25 for ≥2 dimension pairs after controlling for model confidence"
    success_criterion: "Coupling persists when difficulty confound is removed"
    measurement: "Partial correlation controlling for confidence scores"
    falsification: "All partial phi < 0.2 (coupling was spurious difficulty correlation)"

# ═══════════════════════════════════════════════════════════════
# NOVELTY
# ═══════════════════════════════════════════════════════════════

novelty:
  claims:
    - "First coupling signature characterization across trustworthiness dimensions"
    - "First model comparison via coupling profiles (not just aggregate scores)"
    - "Deployment-critical framing: coupling as transparency metric and model selection criterion"

  prior_work_gaps:
    - gap: "Gap 1 (P0) - Empirical co-occurrence data"
      how_addressed: "Directly measures co-failures on multiple dimensions"
    - gap: "Multi-dimensional evaluation exists but dimensions independent"
      how_addressed: "Adds coupling layer to existing frameworks (MMTrustEval)"
    - gap: "Behavioral detection exists but single-dimension"
      how_addressed: "Extends to cross-dimensional coupling patterns"

  contributions:
    - "Coupling as model fingerprint (architectural/training signature)"
    - "Recommender system mathematics applied to trustworthiness evaluation"
    - "Compound risk quantification (failures on A + B simultaneously)"

# ═══════════════════════════════════════════════════════════════
# SCOPE & BOUNDARIES
# ═══════════════════════════════════════════════════════════════

scope:
  included:
    models: ["GPT-4", "Claude 3", "Llama 3"]
    dimensions: ["truthfulness", "robustness", "fairness", "safety", "privacy"]
    sample_size: 500
    evaluation_mode: "API-only (no internal states)"
    analysis: ["phi coefficient", "chi-square", "Mantel test", "partial correlation"]

  excluded:
    - "Layer-specific mechanisms (avoids h-m1 failure)"
    - "Synthetic data generation (avoids h-m1 failure)"
    - "Human evaluation/annotation (pipeline constraint)"
    - "Cross-benchmark semantic clustering (Phase 2 extension, conditional)"
    - "Causal intervention experiments (observational coupling only)"

  generalization_claims:
    - "Model-specific coupling fingerprints (NOT universal coupling)"
    - "Representative model families tested, but not all models"
    - "MMTrustEval benchmark instances, but not all possible inputs"

# ═══════════════════════════════════════════════════════════════
# EXPERIMENTAL SETUP
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  phase1_proof_of_concept:
    data_collection:
      - "Use MMTrustEval framework to evaluate 500 instances × 3 models"
      - "Obtain binary failure labels (pass/fail) for 5 dimensions per instance per model"
      - "Extract model confidence scores (logit probabilities) for difficulty control"

    analysis:
      - "Construct 10 pairwise 2×2 contingency tables per model (5 dimensions = 10 pairs)"
      - "Calculate phi coefficient (effect size) and chi-square (significance) for each pair"
      - "Perform Mantel test to compare coupling matrices across model pairs"
      - "Compute partial phi coefficients controlling for confidence scores"

    success_thresholds:
      tier1_full_success:
        criteria:
          - "≥2 models show ≥3 dimension pairs with phi ≥ 0.3, p < 0.01"
          - "Mantel test shows r < 0.7 between ≥1 model pair"
          - "Partial phi ≥ 0.25 for ≥2 dimension pairs"
        interpretation: "Coupling is real, model-specific, deployment-relevant"

      tier2_partial_success:
        criteria:
          - "≥1 model shows ≥1 dimension pair with phi ≥ 0.3, p < 0.01"
          - "Coupling survives difficulty control (partial phi ≥ 0.25)"
        interpretation: "Coupling exists but may not generalize widely - still publishable"

      tier3_negative_result:
        criteria:
          - "No dimension pairs show phi ≥ 0.3, OR all coupling disappears when controlling for difficulty"
        interpretation: "Dimensions are behaviorally independent - refutes coupling hypothesis but answers research question"

  phase2_extension_conditional:
    trigger: "Only proceed if Phase 1 achieves Tier 1 or Tier 2 success"
    method: "Cross-benchmark coupling using embedding-based semantic clustering (TruthfulQA × AdvBench)"
    goal: "Validate coupling patterns transfer across benchmark types"

