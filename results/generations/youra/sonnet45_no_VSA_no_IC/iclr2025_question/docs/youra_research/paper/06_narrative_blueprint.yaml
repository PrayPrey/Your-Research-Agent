# Narrative Blueprint for Phase 6 Paper
# Designed from Phase 0-5 artifacts
# Paper: Cost-Performance Trade-offs in UQ for LLM Selective Prediction

version: "1.0"
created_at: "2026-08-20T04:35:00.000000+00:00"
hypothesis_id: "H-ParetoUQ-v1"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: "Practitioners deploying LLMs for high-stakes applications face a budget-accuracy dilemma: zero-cost uncertainty methods promise efficiency but may lack precision, while expensive methods like MC dropout improve performance at 5-10× inference overhead—yet no systematic cost-performance benchmark exists to guide this choice."
    strategy: "Practical Failure"

  why_reader_should_care:
    main_reason: "Current UQ research reports winner-take-all rankings without cost analysis, leaving practitioners unable to choose appropriately for their deployment budgets."
    concrete_example: "A production system with 5× cost tolerance cannot determine if MC dropout k=5 justifies the overhead vs temperature scaling at 0× cost."
    stakes: "Suboptimal UQ selection leads to either unnecessary compute waste or insufficient uncertainty quality in high-stakes predictions."

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "UQ methods for LLM selective prediction vary in computational cost"
    common_understanding: "More expensive methods (MC dropout) generally achieve better AUROC than zero-cost methods (temperature scaling)"

  deeper_problem:
    description: "No prior work maps the complete cost-performance space—practitioners lack budget-aware UQ selection guidance"
    why_overlooked: "Research focuses on 'which method wins' (winner-take-all) rather than 'which method for my budget'"
    our_perspective: "Budget constraints are first-class deployment considerations, not secondary optimizations"

  gap_in_existing_work:
    description: "No systematic benchmark compares AUROC vs inference cost across UQ method variants on the same task"
    why_gap_exists: "Cost reporting is inconsistent (k-values vary, FLOPs rarely measured, winner-take-all mindset)"
    why_gap_matters: "Practitioners cannot make informed trade-offs between uncertainty quality and deployment cost"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Cost-performance trade-offs exist because different UQ mechanisms operate in distinct efficiency zones—no single method dominates across all budget constraints."
    expanded_explanation: "If multiple methods occupy the Pareto frontier (no method strictly dominates another), practitioners can choose based on budget. Temperature scaling at 1× cost vs MC dropout k=5 at 5× cost: neither dominates if temp achieves lower AUROC but at zero overhead."

  why_others_missed_it:
    common_assumptions: "Prior work assumes 'best method' is universal (MC dropout wins → use everywhere)"
    our_different_view: "Budget constraints stratify the method space—what's 'best' depends on your 1×, 3×, or 10× cost tolerance"
    enabling_factor: "Framing evaluation as Pareto frontier construction instead of winner-take-all ranking"

  what_makes_it_work:
    intuitive_explanation: "Same logic as CPU-GPU trade-offs: CPU cheap but slower, GPU expensive but faster—neither 'wins' universally"
    key_mechanism: "Different UQ methods trade calibration quality (post-hoc vs epistemic) for computational cost (0× vs k×)"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "5 out of 6 UQ method variants are Pareto-optimal on TruthfulQA selective prediction at 8B model scale"
    measurable_criteria: "AUROC vs normalized cost (1.0× baseline), paired t-test p < 0.05 for dominance"

  supporting_evidence:
    - id: "evidence_1"
      what: "MC dropout k≥3 required for AUROC ≥ 0.70 threshold (k=1: 0.678, k=3: 0.704, k=5: 0.712, k=10: 0.718)"
      so_what: "Epistemic uncertainty threshold exists—post-hoc calibration insufficient at 8B scale"
      how_it_supports_claim: "Establishes minimum k for threshold, shows diminishing returns above k=5"

    - id: "evidence_2"
      what: "Zero-cost methods (temp scaling 0.682, conformal 0.695) fall below 0.70 threshold"
      so_what: "Refutes H2 'zero-cost competitiveness' hypothesis"
      how_it_supports_claim: "Proves aleatoric calibration alone insufficient for high-stakes selective prediction at 8B scale"

    - id: "evidence_3"
      what: "MC dropout k=3 offers 40% cost savings vs k=5 (3× vs 5× cost) for only 0.008 AUROC drop"
      so_what: "Identifies efficiency sweet spot in 3× cost zone"
      how_it_supports_claim: "Demonstrates non-trivial Pareto frontier—multiple viable points across cost zones"

  surprising_findings:
    finding: "MC dropout k=10 only +0.006 AUROC vs k=5 despite 2× cost increase"
    why_surprising: "Expected monotonic improvement with k, but hit diminishing returns ceiling at k≈5"
    our_interpretation: "Bayesian approximation converges faster at 8B scale (smaller parameter space → faster posterior convergence)"

  what_results_mean:
    key_message: "Budget-aware UQ selection is necessary—no universal winner across cost constraints"
    broader_implications: "Challenges 'more compute = better UQ' dogma, opens budget-constrained UQ as subfield"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story—Problem (no cost-performance benchmark) → Insight (Pareto frontier framing) → Result (5 methods Pareto-optimal) → Impact (budget-aware UQ selection)"
    key_message: "Cost-performance trade-offs exist; practitioners can choose UQ methods based on deployment budgets"

  introduction:
    narrative_purpose: "Hook (budget-accuracy dilemma) → Problem (no cost benchmark) → Insight (Pareto frontier) → Contributions (first systematic benchmark, k=3 sweet spot, zero-cost limitations)"
    hook_strategy: "Practical Failure"
    transition_to_related: "Existing work evaluates UQ methods in isolation—we now turn to their cost-performance positioning..."

  related_work:
    narrative_purpose: "Show existing work insufficient → justify Pareto frontier approach"
    positioning_strategy: "Acknowledge prior UQ methods (temp scaling, conformal, MC dropout) but highlight missing cost analysis"
    key_comparison_points:
      - "Temperature scaling (Guo 2017): ECE improvement, no selective prediction AUROC"
      - "Conformal prediction (Kumar 2023, Su 2024): API-only, no cost comparison"
      - "MC dropout (Gal & Ghahramani 2016): Bayesian approximation, no k-dependency study for LLMs"
      - "Gap: No systematic cost-performance benchmark on same task"

  methodology:
    narrative_purpose: "WHY Pareto frontier framing solves the problem—enables budget-aware method selection"
    connection_to_insight: "Pareto frontier construction captures trade-off space (not just winner)"
    key_design_decisions:
      - "6 UQ method variants (temp scaling, conformal, MC dropout k=1/3/5/10) for coverage across cost zones"
      - "TruthfulQA selective prediction (817 questions, human-annotated) for standard benchmark"
      - "FLOPs-normalized cost (1.0× baseline) for hardware-agnostic comparison"
      - "Paired t-test for Pareto dominance (α=0.05) for statistical rigor"

  experiments:
    narrative_purpose: "Design experiments that test cost-performance trade-off claims"
    experimental_questions:
      - "RQ1 (H1): Does MC dropout k=5 achieve highest AUROC among tested methods?"
      - "RQ2 (H2): Is temperature scaling AUROC competitive with MC dropout k=5 (within Δ=0.05)?"
      - "RQ3 (H3): Do at least 2 methods occupy the empirical Pareto frontier?"
    dataset_rationale: "TruthfulQA (817 questions) chosen for adversarial truthfulness task (challenges UQ methods)"
    baseline_rationale: "Temperature scaling and conformal prediction as zero-cost baselines; MC dropout k-variants for cost scaling study"
    metric_rationale: "AUROC measures selective prediction quality; FLOPs measures inference cost"

  results:
    narrative_purpose: "Present evidence supporting Pareto frontier existence and k-dependency"
    main_result_highlight: "5 Pareto-optimal methods across 3 cost zones (1×, 3×, 5×, 10×)—H3 strongly supported"

  discussion:
    narrative_purpose: "Interpret results (epistemic vs aleatoric uncertainty), acknowledge limitations (8B scale only)"
    honest_limitations:
      - "8B model scale only—no extrapolation to 70B/405B without validation"
      - "Single benchmark (TruthfulQA)—task-dependent AUROC thresholds"
      - "n=1 seed for h-e1 full-scale validation—low statistical power for MC k=10 vs k=5"
      - "HaluEval → TruthfulQA calibration transfer gap for conformal prediction (0.695 < 0.70)"

  conclusion:
    narrative_purpose: "Reinforce budget-aware UQ message, open future (70B study, adaptive k, hybrid methods)"
    callback_to_hook: "We began with practitioners facing a budget-accuracy dilemma. Our Pareto frontier framework provides the cost-performance map needed for informed UQ selection."
    memorable_ending: "Budget-aware UQ selection challenges the 'more compute = better UQ' assumption—at 8B scale, MC dropout k=3 offers the efficiency sweet spot for ≥0.70 AUROC threshold applications."

# ============================================================================
# TAKEAWAY MESSAGE
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First systematic cost-performance benchmark for UQ methods on LLM selective prediction, identifying 5 Pareto-optimal methods and MC dropout k=3 efficiency sweet spot."
    why_significant: "Shifts UQ evaluation from winner-take-all to budget-aware selection, enabling practitioners to choose methods matching deployment constraints"

  implications:
    for_field: "Opens budget-aware UQ selection as research direction (adaptive k, hybrid methods, per-query allocation)"
    for_practice: "Provides decision framework: MC dropout k=3 default for 3× budget, k=5 for high-stakes 5× budget"

  future_possibilities:
    immediate_extensions:
      - "70B model study to test if zero-cost methods exceed 0.70 threshold at larger scale"
      - "Adaptive k MC dropout (early stopping when variance converges) for average cost reduction"
      - "In-distribution conformal calibration (TruthfulQA split) to close 0.005 AUROC gap"
    longer_term_vision:
      - "Per-query budget allocation (cheap temp scaling for easy queries, expensive MC dropout for hard queries)"
      - "Budget-constrained benchmarking standard (report AUROC, FLOPs, Pareto frontier in UQ papers)"

# ============================================================================
# NARRATIVE COHERENCE CHECKLIST
# ============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "Yes—budget dilemma (Intro) → Pareto framework provides map (Conclusion)"

  - check: "Does each section naturally flow to the next?"
    status: "Yes—Intro sets up problem → Related Work shows gap → Methodology presents Pareto solution → Experiments test trade-offs → Results show 5 Pareto methods → Discussion interprets (epistemic threshold) → Conclusion reinforces message"

  - check: "Is key insight consistently emphasized throughout?"
    status: "Yes—Pareto frontier framing appears in Abstract, Introduction, Methodology, Results, Conclusion"

  - check: "Are all major claims supported by evidence?"
    status: "Yes—H1 (MC k=10 highest), H2 (zero-cost NOT competitive), H3 (5 Pareto methods) all have Results evidence"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "Yes—hooks with practical problem (budget dilemma), states key result (5 Pareto methods), quantifies impact (k=3 sweet spot)"
