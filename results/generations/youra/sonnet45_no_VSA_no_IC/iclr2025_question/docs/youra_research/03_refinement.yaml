# SECTION 1.5: Null Hypothesis (H0)
# ═══════════════════════════════════════════════════════════════

null_hypothesis:
  h0_statement: |
    There is no cost-performance trade-off among single-forward-pass UQ methods on TruthfulQA
    selective prediction. A single method (e.g., MC dropout k=5) strictly dominates all others
    by achieving both:
    (1) Statistically higher AUROC (paired t-test p < 0.05)
    (2) Equal or lower inference cost (FLOPs ≤ other methods)

    This would collapse the Pareto frontier to one optimal point, making budget-aware UQ selection unnecessary.

  statistical_test: "Paired t-test (two-tailed) comparing AUROC distributions across methods, α = 0.05, n=3 seeds per method"

  rejection_criteria: |
    **Reject H0 if ANY of the following hold:**

    1. **H3 confirmed:** Pareto set contains ≥2 methods where neither dominates the other
       (i.e., method A has higher AUROC but higher cost, method B has lower AUROC but lower cost,
       with statistically significant AUROC difference p < 0.05).

       Example: temp scaling = (1.0×, 0.68±0.02) and MC dropout k=5 = (5.0×, 0.73±0.02),
       paired t-test p = 0.001 → both Pareto-optimal → H0 rejected.

    2. **H2 confirmed AND H1 confirmed:** Temp scaling achieves AUROC within Δ=0.05 of MC dropout k=5
       (|AUROC_temp - AUROC_mc5| ≤ 0.05) AND MC dropout k=5 has highest AUROC overall.

       This proves zero-cost methods are competitive despite not being optimal → trade-off exists → H0 rejected.

    **Fail to reject H0 if:**
    - Only one method is Pareto-optimal (e.g., MC dropout k=5 dominates all others with both
      higher AUROC AND equal/lower cost).
    - All methods have statistically indistinguishable AUROC (overlapping 95% CIs) → no method
      can be distinguished as superior → Pareto frontier collapses to noise.

