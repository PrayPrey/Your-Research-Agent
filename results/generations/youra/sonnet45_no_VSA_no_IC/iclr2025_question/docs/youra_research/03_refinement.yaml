  - id: "H2"
    statement: "Temperature scaling achieves AUROC within Δ=0.05 of MC dropout k=5 (zero-cost method competitive with 5× cost method)"
    measurement_protocol: "Compute |AUROC_temp - AUROC_mc5| using mean values over 3 seeds. Check if difference ≤ 0.05 (absolute AUROC points)."
    success_criteria: "|AUROC_temp - AUROC_mc5| ≤ 0.05"
    type: "surprising" # Challenges 'more compute = better UQ' dogma
    falsifiable: true
    falsification_consequence: "LOW - If |AUROC_temp - AUROC_mc5| > 0.05, temp scaling is NOT competitive → MC dropout's 5× cost is justified for applications requiring high AUROC. This is a negative result but still valuable: practitioners need MC dropout for high-stakes selective prediction."

  - id: "H3"
    statement: "At least 2 UQ methods lie on the empirical Pareto frontier (no single method dominates all others)"
    measurement_protocol: "For each method i, compute (cost_i, AUROC_i). Method i is Pareto-optimal if no method j exists where (cost_j ≤ cost_i AND AUROC_j > AUROC_i with paired t-test p < 0.05). Count |Pareto set| ≥ 2."
    success_criteria: "|{i | i is Pareto-optimal AND ∀j ≠ i, NOT (cost_j ≤ cost_i AND AUROC_j - AUROC_i > 0 with p < 0.05)}| ≥ 2"
    type: "core_novelty" # Core claim of Pareto frontier existence
    falsifiable: true
    falsification_consequence: "HIGH - If only 1 method is Pareto-optimal (e.g., MC dropout k=5 dominates all others), Pareto frontier collapses to single winner → budget-aware UQ selection is unnecessary. Core novelty claim fails. However, this is still a valuable negative result: 'Comprehensive benchmark shows MC dropout k=5 is universally optimal for TruthfulQA selective prediction.'"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: Novelty Assessment
# ═══════════════════════════════════════════════════════════════

novelty:
  what_is_new: |
    **1. First Systematic Cost-Performance Benchmark for UQ on TruthfulQA:**

    Prior work tested individual UQ methods (Yang et al. 2023: selective QA on TruthfulQA;
    Su et al. 2024: conformal prediction; Guo et al. 2017: temperature scaling) but NO prior
    study systematically compares AUROC vs inference cost across multiple single-pass methods
    on the same benchmark.

    **2. Pareto Frontier Framing for Practitioner-Facing UQ Selection:**

    Instead of declaring "Method X wins", we map the complete trade-off space. This enables
    budget-aware method selection: practitioners see exact cost vs accuracy trade-offs and
    choose based on deployment constraints. Current literature treats method comparison as
    winner-take-all horse races (Zhang et al. 2020: Mix-n-Match ensemble comparison; no cost analysis).

    **3. Empirical Test of "Zero-Cost Competitiveness" Hypothesis:**

    H2 explicitly tests whether temp scaling (0× cost) achieves AUROC within Δ=0.05 of MC dropout k=5 (5× cost).
    If TRUE, this challenges the field's implicit "more compute = better UQ" assumption. No prior work
    directly tests this cost-efficiency hypothesis on LLM selective prediction.

    **4. Cross-Dataset Generalization Test (HaluEval → TruthfulQA):**

    Calibrating on HaluEval and testing on TruthfulQA directly addresses DQ4 (cross-dataset AUROC ≥ 0.65).
    Lin et al. 2025 studied domain-shift conformal prediction but NOT in the LLM selective prediction context.
    Our setup tests whether calibration transfers across related-but-distinct tasks (hallucination detection
    vs truthfulness QA).

  comparison_to_prior_work: |
    **Yang et al. 2023 (16 citations):**
    - Tested TruthfulQA selective QA with uncertainty estimates
    - Showed "significantly higher accuracy" using selective prediction
    - **Gap:** No cost analysis, no multi-method comparison, no AUROC vs cost curves

    **Su et al. 2024 (74 citations):**
    - Introduced API-only conformal prediction (no logit access)
    - Outperformed logit-based baselines
    - **Gap:** Tested on single dataset, no cost-performance comparison with other methods

    **Zhang et al. 2020 (293 citations):**
    - Compared ensemble/compositional calibration methods
    - Introduced kernel-density ECE estimator
    - **Gap:** Not LLM-focused, no selective prediction application, no inference cost analysis

    **Guo et al. 2017 (9294 citations):**
    - Seminal temperature scaling paper
    - Demonstrated modern NNs poorly calibrated
    - **Gap:** Focused on calibration metrics (ECE), not selective prediction AUROC or cost trade-offs

    **Our Contribution:**
    - **First** to systematically benchmark AUROC vs cost for 6 UQ method variants (temp scaling,
      conformal prediction, MC dropout k=1,3,5,10) on TruthfulQA selective prediction
    - **First** to frame UQ method selection as Pareto frontier optimization (practitioner-facing)
    - **First** to empirically test "zero-cost competitiveness" hypothesis (H2) in LLM context
    - **First** to validate cross-dataset generalization (HaluEval → TruthfulQA) for conformal prediction

  paradigm_shift_potential: |
    **IF H2 is confirmed (temp scaling AUROC within Δ=0.05 of MC dropout k=5):**

    This would challenge the implicit assumption that "better UQ requires more compute." Temperature
    scaling achieves competitive performance at 0× inference overhead, making MC dropout's 5× cost
    unjustified for many applications. Paradigm shift: practitioners default to zero-cost methods
    (temp scaling, conformal prediction) unless they need the marginal AUROC improvement from MC dropout.

    **IF H3 is confirmed (≥2 methods Pareto-optimal):**

    This validates budget-aware UQ selection as a new subfield. Current research focuses on "which
    method is best?" (winner-take-all). Our result would shift focus to "which method is best FOR
    MY BUDGET?" Opening research directions:
    - Adaptive UQ budgeting: dynamically switch methods based on query difficulty
    - Cost-aware ensemble methods: combine cheap + expensive UQ for hybrid efficiency
    - Budget-constrained benchmarking: standardize cost reporting in UQ papers

