    validation_method: "Phase 0 pre-check: empirically measure Llama-3.1-8B-Instruct accuracy on TruthfulQA before proceeding. If <45%, hypothesis is NOT testable at 8B scale."
    impact_if_violated: "CRITICAL - insufficient signal for UQ methods to demonstrate value. Would invalidate entire experiment at 8B scale. Mitigation: document limitation and recommend ≥70B model follow-up."

  - assumption: "HaluEval calibration set is representative enough for conformal prediction to generalize to TruthfulQA"
    validity: "MEDIUM"
    validation_method: "Cross-dataset generalization is explicitly tested (DQ4). If conformal prediction AUROC degrades significantly vs temp scaling, this assumption is violated."
    impact_if_violated: "MEDIUM - conformal prediction may fail to transfer across task distributions (hallucination detection ≠ truthfulness QA). This is a scientifically valuable negative result if observed."

  - assumption: "Human-annotated TruthfulQA labels provide reliable ground truth (not GPT-judge artifacts)"
    validity: "HIGH"
    validation_method: "Official TruthfulQA dataset uses human consensus annotations (Lin et al. 2021). GPT-judge metrics are for automated evaluation only, not ground truth."
    impact_if_violated: "LOW - dataset is foundational in LLM evaluation community (911 GitHub stars, widely cited). If labels were unreliable, prior work (Yang et al. 2023) would have reported issues."

  - assumption: "FLOPs count accurately reflects inference cost (wall-clock time may vary with hardware/batching)"
    validity: "HIGH"
    validation_method: "FLOPs is hardware-agnostic and deterministic. Wall-clock time varies with GPU type, batch size, memory bandwidth. We normalize to 1.0× baseline (single forward pass FLOPs)."
    impact_if_violated: "LOW - practitioner deployment costs include latency (wall-clock), not just FLOPs. Mitigation: report both FLOPs and wall-clock time in supplementary materials."

  - assumption: "Statistical significance (paired t-test, p < 0.05, n=3 seeds) is sufficient for reproducibility"
    validity: "MEDIUM"
    validation_method: "Standard in ML research (3 random seeds is common practice). Larger n would improve confidence but increases compute cost ~linearly."
    impact_if_violated: "MEDIUM - small n=3 may miss rare failure modes. Mitigation: if results show high variance (std > 0.03 AUROC), increase to n=5 seeds for critical comparisons."

  - assumption: "Low-star implementation repos (LofreeCP: 9 stars, dropwise: 8 stars) are correct implementations of papers"
    validity: "LOW"
    validation_method: "Validate against paper specifications. Su et al. 2024 specifies nonconformity = sample_frequency × semantic_similarity. If repo deviates, implement manually from paper."
    impact_if_violated: "LOW - repos are starting points, not dependencies. Mitigation: cross-check implementation against paper pseudo-code before trusting results."

