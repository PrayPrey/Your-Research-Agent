# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  narrative: |
    **Mechanism: Cost-Performance Trade-offs in Uncertainty Quantification**

    Different UQ methods achieve calibration through fundamentally different mechanisms:

    1. **Temperature Scaling (0× cost):** Post-hoc calibration via single learnable parameter T.
       Scales logits by 1/T before softmax, optimized on validation set. Zero inference overhead
       because T is applied once after model forward pass. Limitation: assumes monotonic relationship
       between confidence and correctness (may fail if base model has complex miscalibration patterns).

    2. **Conformal Prediction (0× cost):** Distribution-free coverage via nonconformity scores.
       Uses calibration set to compute score thresholds (sample frequency × semantic similarity per Su et al. 2024).
       Zero inference overhead because calibration is one-time setup. Limitation: requires calibration
       set from same/similar distribution as test set (HaluEval → TruthfulQA transfer may degrade).

    3. **MC Dropout (k× cost):** Bayesian approximation via stochastic forward passes. Enables dropout
       at inference, samples k predictions, computes variance/entropy as uncertainty. Cost scales linearly
       with k. Advantage: captures model uncertainty directly (epistemic uncertainty). Limitation: k=1
       degrades to deterministic baseline, k>10 becomes expensive for 2-5× budget constraint.

    **Why Pareto frontier emerges:**

    If temp scaling achieves AUROC 0.68 at 0× cost but MC dropout k=5 achieves 0.73 at 5× cost,
    neither dominates: temp scaling is cheaper, MC dropout is more accurate. Practitioners choose
    based on deployment budget. If temp scaling achieved 0.73 at 0× cost, it would dominate MC dropout
    entirely (H3 would fail). The existence of ≥2 Pareto-optimal methods proves cost-performance trade-offs exist.

  diagram: |
    ┌────────────────────────────────────────────────────────────────┐
    │ UQ Method Selection → Inference Cost & Calibration Quality    │
    └────────────────────────────────────────────────────────────────┘
                            │
          ┌─────────────────┼─────────────────┐
          │                 │                 │
          ▼                 ▼                 ▼
    ┌──────────┐    ┌──────────────┐   ┌──────────────┐
    │ Temp     │    │ Conformal    │   │ MC Dropout   │
    │ Scaling  │    │ Prediction   │   │ (k samples)  │
    │ (0× cost)│    │ (0× cost)    │   │ (k× cost)    │
    └──────────┘    └──────────────┘   └──────────────┘
          │                 │                 │
          │ Post-hoc        │ Nonconformity   │ Bayesian
          │ logit/T         │ scores from     │ variance
          │ calibration     │ calib. set      │ across k passes
          │                 │                 │
          ▼                 ▼                 ▼
    ┌────────────────────────────────────────────────┐
    │ Uncertainty Score per TruthfulQA Question      │
    └────────────────────────────────────────────────┘
                            │
                            ▼
    ┌────────────────────────────────────────────────┐
    │ Rank by Uncertainty → Selective Prediction     │
    │ (reject high-uncertainty queries)              │
    └────────────────────────────────────────────────┘
                            │
                            ▼
    ┌────────────────────────────────────────────────┐
    │ AUROC = f(correct vs incorrect classification) │
    │ Cost = FLOPs normalized to 1.0× baseline       │
    └────────────────────────────────────────────────┘
                            │
                            ▼
    ┌────────────────────────────────────────────────┐
    │ Pareto Frontier: {(cost_i, AUROC_i) |          │
    │   no method j has cost_j ≤ cost_i AND          │
    │   AUROC_j > AUROC_i with p < 0.05}             │
    └────────────────────────────────────────────────┘

  logical_chain:
    - step: 1
      action: "Select UQ method (temp scaling, conformal prediction, or MC dropout k={1,3,5,10})"
      inputs: ["Model: Llama-3.1-8B-Instruct", "Calibration: HaluEval", "Test: TruthfulQA"]
      outputs: ["UQ_method choice"]

    - step: 2
      action: "Apply UQ method to TruthfulQA questions"
      inputs: ["UQ_method", "TruthfulQA questions (817)"]
      outputs: ["Uncertainty scores per question", "Inference cost (FLOPs)"]

    - step: 3
      action: "Rank questions by uncertainty score, compute AUROC for selective prediction"
      inputs: ["Uncertainty scores", "Human-annotated labels (correct/incorrect)"]
      outputs: ["AUROC_selective_prediction", "inference_cost_normalized"]

    - step: 4
      action: "Repeat for all UQ methods, aggregate over 3 random seeds"
      inputs: ["6 UQ methods × 3 seeds"]
      outputs: ["Mean AUROC ± std", "Mean cost ± std per method"]

    - step: 5
      action: "Construct Pareto frontier from (cost, AUROC) pairs"
      inputs: ["6 methods with (cost_i, AUROC_i)"]
      outputs: ["Pareto set = methods where no other method dominates (paired t-test p < 0.05)"]

    - step: 6
      action: "Test hypotheses H1/H2/H3"
      inputs: ["Pareto set", "AUROC values", "Statistical tests"]
      outputs: ["H1: MC k=5 highest AUROC?", "H2: |AUROC_temp - AUROC_mc5| ≤ 0.05?", "H3: |Pareto| ≥ 2?"]

