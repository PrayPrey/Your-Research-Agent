scope:
  what_is_included:
    - "Single-forward-pass UQ methods (temp scaling, conformal prediction, MC dropout k≤10)"
    - "TruthfulQA selective prediction task (817 human-annotated questions)"
    - "Llama-3.1-8B-Instruct model (fixed architecture, no scaling study)"
    - "AUROC metric for selective prediction quality"
    - "FLOPs-based inference cost (normalized to 1.0× baseline)"
    - "Cross-dataset generalization test (HaluEval calibration → TruthfulQA test)"

  what_is_excluded:
    - "Ensemble methods (>10× cost, outside 2-5× budget constraint from primary research question)"
    - "Spectral normalization (Phase 1 Gap 1 - unstudied for LLMs, no implementation evidence)"
    - "Model scale dependency study (Phase 1 Gap 2 - deferred to future work, would require ≥70B models)"
    - "Multiple-choice TruthfulQA (MC1, MC2 tasks - focus on generative QA only)"
    - "Token-level UQ methods (Phase 1 ROUTE_TO_0 failure - don't predict correctness at small scale)"
    - "HaluEval as test set (used only for calibration, TruthfulQA is primary evaluation)"

  limitations:
    - "8B model scale only - if Phase 0 baseline accuracy <45%, hypothesis NOT testable at this scale"
    - "Single benchmark (TruthfulQA) - generalization to other truthfulness/factuality benchmarks unknown"
    - "HaluEval calibration may not transfer to TruthfulQA (cross-dataset generalization is explicitly tested)"
    - "n=3 random seeds - small sample size, high-variance results may require n=5 for confidence"
    - "Low-star implementation repos (LofreeCP: 9 stars, dropwise: 8 stars) - must validate against paper specs"

  boundary_conditions:
    - condition: "Phase 0 baseline accuracy ≥ 45%"
      consequence_if_violated: "STOP experiment, document limitation: hypothesis requires ≥70B models"

    - condition: "All methods achieve AUROC ≥ 0.60 (above random baseline 0.50 + noise margin)"
      consequence_if_violated: "Document: TruthfulQA selective prediction too challenging for current single-pass UQ methods"

    - condition: "Conformal prediction AUROC not catastrophically degraded vs temp scaling (difference <0.15)"
      consequence_if_violated: "Document: HaluEval → TruthfulQA calibration transfer fails for conformal prediction"

# ═══════════════════════════════════════════════════════════════
# SECTION 5: Experimental Setup Summary
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  phase_0_baseline_check:
    objective: "Validate 8B model has sufficient signal for UQ methods (accuracy ≥ 45%)"
    protocol: |
      1. Load Llama-3.1-8B-Instruct from HuggingFace (meta-llama/Llama-3.1-8B-Instruct)
      2. Evaluate on TruthfulQA using official evaluation script (sylinrl/TruthfulQA repo)
      3. Report accuracy with 95% binomial confidence interval
      4. **Decision rule:** If accuracy ≥ 45%, proceed to Phase 1. If <45%, STOP and document limitation.
    expected_outcome: "Accuracy ≥ 45% (relaxed from 50% to account for adversarial TruthfulQA design)"

  phase_1_main_experiment:
    objective: "Compare 6 UQ methods on TruthfulQA selective prediction (AUROC vs cost)"

    methods:
      - name: "temperature_scaling"
        implementation: "gpleiss/temperature_scaling (1172 stars) or probkit/probmetrics (68 stars, modern)"
        calibration: "Optimize T on HaluEval validation set (minimize NLL or ECE)"
        inference_cost: "1.0× (post-hoc, no inference overhead)"

      - name: "conformal_prediction"
        implementation: "SU-JIAYUAN/LofreeCP (9 stars, EMNLP'24) - validate against Su et al. 2024 paper spec"
        calibration: "Compute nonconformity scores (sample_frequency × semantic_similarity) on HaluEval"
        inference_cost: "1.0× (post-calibration, per-query cost is single forward pass)"

      - name: "mc_dropout_k1"
        implementation: "aryanator/dropwise (8 stars) or manual (enable dropout at inference, sample k=1)"
        calibration: "None (deterministic, equivalent to baseline)"
        inference_cost: "1.0× (k=1 is single forward pass)"

      - name: "mc_dropout_k3"
        implementation: "Same as k=1, sample k=3 forward passes"
        calibration: "None (epistemic uncertainty from variance)"
        inference_cost: "3.0× ± 0.1× (3 forward passes)"

      - name: "mc_dropout_k5"
        implementation: "Same as k=1, sample k=5 forward passes"
        calibration: "None"
        inference_cost: "5.0× ± 0.1×"

      - name: "mc_dropout_k10"
        implementation: "Same as k=1, sample k=10 forward passes"
        calibration: "None"
        inference_cost: "10.0× ± 0.1× (exceeds 2-5× budget but included as upper bound)"

    datasets:
      calibration: "HaluEval (~10k samples) - for temp scaling and conformal prediction only"
      test: "TruthfulQA (817 questions, human-annotated truthfulness labels)"

    evaluation_protocol: |
      For each UQ method and each random seed (seeds: 42, 123, 456):
        1. Apply method to TruthfulQA test set (never touched during calibration)
        2. Compute uncertainty score per question
        3. Rank questions by uncertainty (high uncertainty → reject in selective prediction)
        4. Compute AUROC: True Positive = correctly predicted & accepted, False Positive = incorrectly predicted & accepted
        5. Measure inference cost: FLOPs count normalized to single forward pass = 1.0×

      Aggregate: Mean AUROC ± std, Mean cost ± std over 3 seeds per method

    statistical_tests: "Paired t-test (two-tailed, α=0.05) for pairwise AUROC comparisons"

  phase_2_analysis:
    objective: "Construct Pareto frontier and test H1/H2/H3"

    pareto_frontier_construction: |
      For each method i, compute (cost_i, AUROC_i) = (mean_cost, mean_AUROC) over 3 seeds.

      Method i is Pareto-optimal IF:
        ∀ method j ≠ i, NOT (cost_j ≤ cost_i AND AUROC_j > AUROC_i with paired t-test p < 0.05)

      Pareto set = {i | i is Pareto-optimal}

    hypothesis_tests:
      - id: "H1"
        test: "MC dropout k=5 ranks #1 by AUROC (paired t-test vs all others, p < 0.05)"
        pass_criteria: "AUROC_mc5 > max(AUROC_temp, AUROC_conf, AUROC_mc1, AUROC_mc3, AUROC_mc10) with p < 0.05"

      - id: "H2"
        test: "Temperature scaling AUROC within Δ=0.05 of MC dropout k=5"
        pass_criteria: "|AUROC_temp - AUROC_mc5| ≤ 0.05"

      - id: "H3"
        test: "Pareto set contains ≥2 methods with statistically distinct AUROCs"
        pass_criteria: "|Pareto set| ≥ 2 AND pairwise t-tests show p < 0.05 between any two Pareto methods"
