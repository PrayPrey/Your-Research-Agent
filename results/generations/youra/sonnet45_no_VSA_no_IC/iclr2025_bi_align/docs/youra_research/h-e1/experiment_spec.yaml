---
# Experiment Specification: Contract-Based Phase Transition Validation
# Hypothesis: h-e1
# Phase: 2C - Experiment Design
# Date: 2026-08-20

experiment_id: h-e1-contract-validation
hypothesis_id: h-e1
experiment_type: proof_of_concept
tier: 1

# Objective
objective: >
  Demonstrate that three-layer contract validation (schema + pattern + composition)
  can be implemented for research pipeline phase transitions and detects constraint
  violations that schema-only validation misses.

# Research Question
research_question: >
  Can contract-based validation at phase boundaries detect constraint violations
  that schema-only validation cannot express?

# Variables
variables:
  independent:
    name: "Validation approach"
    levels:
      - schema_only
      - schema_pattern
      - full_contract

  dependent:
    name: "Constraint violation detection rate"
    unit: "percentage"
    range: [0, 1]

  controlled:
    - "Pipeline architecture (Phase 0-6.5)"
    - "Feasibility constraints (4 fixed)"
    - "Test case distribution (5 valid, 15 violations)"

# Dataset
dataset:
  name: "Adversarial Phase Boundary Test Suite"
  type: custom
  source: generated

  size:
    total: 20
    valid: 5
    violations: 15

  violation_breakdown:
    schema: 5
    pattern: 5
    contract: 5

  constraints_tested:
    - C1: "No synthetic data"
    - C2: "No human evaluation"
    - C3: "Real standard datasets only"
    - C4: "No new benchmarks"

  storage_path: "tests/phase_boundary_validation/test_cases.yaml"

  test_case_schema:
    id: string
    name: string
    violation_type: enum[schema, pattern, contract, none]
    constraint_violated: enum[C1, C2, C3, C4, none]
    phase2a_output: dict
    expected_detection:
      schema: boolean
      pattern: boolean
      contract: boolean

# Implementation Architecture
architecture:
  layers:
    layer1_schema:
      name: "Schema Validation"
      library: "Pydantic v2.8.0 BaseModel"
      mechanism: "Type annotations + Field() descriptors"
      coverage: "Structure, types, required fields"

    layer2_pattern:
      name: "Pattern Validation"
      library: "Pydantic field_validator decorators"
      mechanism: "Regex patterns + custom predicates"
      coverage: "4 feasibility constraint patterns"

    layer3_contract:
      name: "Contract Validation"
      library: "contractme v2.2.0"
      mechanism: "@precondition/@postcondition decorators"
      coverage: "Cross-field relationships, state invariants"

  phase_boundary: "Phase 2A Output → Phase 2B Input"

  models:
    - Phase2AOutput (schema only)
    - Phase2AOutputWithPatterns (schema + pattern)
    - Phase2AOutputWithContracts (schema + pattern + contract)

# Baseline Experiments
baselines:
  baseline_a:
    name: "Schema-Only Validation"
    implementation: "Pydantic BaseModel validation"
    expected_performance:
      detects: ["type errors", "missing fields"]
      misses: ["constraint keywords", "compositional failures"]
      detection_rate: 0.30

  baseline_b:
    name: "Schema + Pattern Validation"
    implementation: "Pydantic + field_validator"
    expected_performance:
      detects: ["schema violations", "keyword patterns (C1, C2)"]
      misses: ["cross-field constraints (C3, C4)"]
      detection_rate: 0.60

# Proposed Method
proposed:
  name: "Full Contract Validation"
  implementation: "Schema + Pattern + Contract (contractme)"
  expected_performance:
    detects: ["all violation types"]
    misses: ["edge cases not in test suite"]
    detection_rate: 0.95
    improvement_over_baseline_a: 2.17

# Metrics
metrics:
  primary:
    name: "Detection Rate Improvement"
    formula: "(Contract_DR - SchemaOnly_DR) / SchemaOnly_DR × 100%"
    success_threshold: 50
    unit: "percentage"

  secondary:
    false_positive_rate:
      formula: "False Positives / Total Valid Cases"
      threshold: 0.10
      unit: "rate"

    execution_overhead:
      formula: "Contract_Time - Schema_Time"
      threshold: 100
      unit: "milliseconds"

    contract_complexity:
      formula: "Lines of Contract Code / Boundaries"
      threshold: 50
      unit: "LOC"

  tertiary:
    layer_breakdown:
      description: "Violations detected by each layer"
      dimensions: [schema, pattern, contract]

# Experimental Procedure
procedure:
  steps:
    step01:
      name: "Environment Setup"
      actions:
        - "Install pydantic==2.8.0"
        - "Install contractme==2.2.0"
        - "Install pytest"
        - "Create test directory structure"
      duration: "15 minutes"

    step02:
      name: "Generate Test Suite"
      actions:
        - "Generate 5 valid test cases"
        - "Generate 5 schema violation cases"
        - "Generate 5 pattern violation cases"
        - "Generate 5 contract violation cases"
        - "Tag with ground truth labels"
      duration: "2 hours"

    step03:
      name: "Implement Validation Layers"
      actions:
        - "Create Phase2AOutput schema"
        - "Add field_validator patterns"
        - "Add contractme decorators"
      duration: "6 hours"

    step04:
      name: "Run Baseline Experiments"
      actions:
        - "Test schema-only validation"
        - "Test schema + pattern validation"
        - "Measure detection rates"
      duration: "1 hour"

    step05:
      name: "Run Contract Validation"
      actions:
        - "Test full contract validation"
        - "Measure detection rates"
        - "Compute improvement"
      duration: "1 hour"

    step06:
      name: "Compute Metrics"
      actions:
        - "Calculate detection rates per layer"
        - "Calculate improvement percentage"
        - "Measure false positive rate"
        - "Profile execution overhead"
      duration: "1 hour"

    step07:
      name: "Analyze Results"
      actions:
        - "Compare detection rates"
        - "Identify constraint-specific patterns"
        - "Document examples"
      duration: "1 hour"

    step08:
      name: "Document Findings"
      actions:
        - "Write 04_validation.md"
        - "Create detection rate table"
        - "Document layer breakdown"
      duration: "1 hour"

# Success Criteria
success_criteria:
  gate_type: MUST_WORK

  primary:
    condition: "improvement >= 50%"
    action_if_pass: "Continue to Phase 5 baseline comparison"
    action_if_fail: "ABORT - contracts don't help"

  secondary:
    - condition: "false_positive_rate < 10%"
    - condition: "execution_overhead < 100ms"
    - condition: "contract_loc < 50 per boundary"

  failure_threshold: 20
  failure_action: "ABORT"

# File Structure
file_structure:
  tests:
    - "tests/phase_boundary_validation/__init__.py"
    - "tests/phase_boundary_validation/conftest.py"
    - "tests/phase_boundary_validation/test_cases.yaml"
    - "tests/phase_boundary_validation/test_schema_only.py"
    - "tests/phase_boundary_validation/test_schema_pattern.py"
    - "tests/phase_boundary_validation/test_contract_validation.py"
    - "tests/phase_boundary_validation/generate_test_cases.py"

  source:
    - "src/validation/__init__.py"
    - "src/validation/schemas.py"
    - "src/validation/patterns.py"
    - "src/validation/contracts.py"
    - "src/validation/constants.py"

  experiments:
    - "experiments/h_e1_contract_validation.py"

# Dependencies
dependencies:
  python_version: ">=3.11"

  packages:
    - name: pydantic
      version: "==2.8.0"
      purpose: "Schema and pattern validation"

    - name: contractme
      version: "==2.2.0"
      purpose: "Contract-based validation (preconditions/postconditions)"

    - name: pytest
      version: ">=7.0"
      purpose: "Test framework"

    - name: pyyaml
      version: ">=6.0"
      purpose: "Test case loading"

# Risk Mitigation
risks:
  R1_pattern_completeness:
    mitigation: "Start with 4 constraints only, use mutation testing"
    detection: "Track validation pass rate vs ground-truth"

  R3_schema_enforcement:
    mitigation: "Use Pydantic strict mode, add explicit coercion validators"
    detection: "Test with malformed inputs"

  R5_validation_overhead:
    mitigation: "Profile each layer, cache compiled patterns"
    detection: "Measure overhead as secondary metric"

# Expected Outcomes
expected_outcomes:
  quantitative:
    schema_only_detection: 0.30
    schema_pattern_detection: 0.60
    full_contract_detection: 0.95
    improvement_percentage: 217

  qualitative:
    - "Contracts can be specified for workflow phase boundaries"
    - "Contracts catch violations schema misses (compositional failures)"
    - "Implementation is feasible with existing libraries"

  failure_modes:
    - "Contract specification too complex (>50 LOC)"
    - "Execution overhead >100ms"
    - "False positive rate >10%"

# Next Steps
next_steps:
  immediate:
    - "Proceed to Phase 3: Implementation Planning"
    - "Create PRD for contract validation framework"
    - "Create Architecture document"
    - "Create PRP (Project Requirements Plan)"
    - "Initialize Archon tasks"

  post_validation:
    - "Run adversarial test suite (Phase 4)"
    - "Compute detection rates (Phase 4.5)"
    - "Write validation report (Phase 4.5)"
    - "Update hypothesis status based on gate criteria"

# References
references:
  implementations:
    pydantic_validators:
      url: "https://docs.pydantic.dev/latest/concepts/validators/"
      description: "Field and model validators"

    contractme:
      url: "https://pypi.org/project/contractme/2.2.0/"
      description: "Design-by-contract for Python"

    workflow_validation:
      source: "Flowspec workflow-schema-validation.md"
      description: "YAML workflow validation patterns"

# Metadata
metadata:
  created_at: '2026-08-20'
  created_by: phase2c-experiment-design
  version: 1
  status: complete
