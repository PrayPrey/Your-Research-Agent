main_hypothesis:
  id: H-ContractValidation-v1
  title: Contract-Based Phase Transition Validation for Research Workflows
  statement: Under research workflows with feasibility constraints (no new benchmarks, no synthetic data, no human evaluation),
    if phase transitions enforce contract-based validation (typed schemas + constraint patterns + compositional contracts
    with preconditions/postconditions/invariants), then downstream failures (Phase 4/5) from constraint violations will reduce
    by >80% compared to schema-only validation, because contracts catch compositional failures that schema validation alone
    cannot detect.
  defined_in: 03_refinement.yaml
