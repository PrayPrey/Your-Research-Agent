    consequence_if_violated: "Overhead outweighs benefit, approach impractical"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Research workflows with:
    - Sequential multi-phase structure (Phase 0→1→...→N)
    - Explicit feasibility constraints enforceable via pattern matching
    - Structured output formats (YAML/JSON schemas)
    - Typed interfaces between phases
  does_not_apply_to: |
    - Ad-hoc research without structured workflows
    - Workflows with unconstrained natural language outputs
    - Single-phase monolithic research processes
    - Workflows where all constraint checking requires human judgment
  known_limitations: |
    - Contract specification overhead requires automation or significant manual effort
    - Incomplete contracts may miss violations (requires adversarial testing)
    - Semantic constraint checking limited to pattern matching (no full NLU)
    - Effectiveness depends on output schema enforcement quality

