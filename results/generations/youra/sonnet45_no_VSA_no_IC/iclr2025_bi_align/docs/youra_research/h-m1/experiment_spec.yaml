---
# Experiment Specification: Contract Specification Forces Constraint Checking
# Hypothesis: h-m1
# Phase: 2C - Experiment Design
# Date: 2026-08-20

experiment_id: h-m1-contract-expressiveness
hypothesis_id: h-m1
experiment_type: proof_of_concept
tier: 1

# Objective
objective: >
  Demonstrate that contract-based validation (icontract preconditions/postconditions)
  forces explicit checking of feasibility constraints that schema-only validation
  (Pydantic typed fields) cannot express.

# Research Question
research_question: >
  Do explicit contracts force constraint checking that schema-only approaches
  leave implicit? Measured by: constraint coverage percentage (contracts vs schema).

# Variables
variables:
  independent:
    name: "Validation approach"
    levels:
      - schema_only
      - contract_based

  dependent:
    name: "Constraint coverage"
    unit: "percentage"
    range: [0, 1]

  controlled:
    - "Four feasibility constraints (C1-C4)"
    - "Phase boundaries (2A→2B, 2B→2C, 2C→3)"
    - "Test input structure (5 validation test cases)"

# Dataset
dataset:
  name: "Constraint Coverage Matrix"
  type: programmatic-api
  source: generated

  size:
    total: 5
    violations: 4
    valid: 1

  test_cases:
    - TC-M1-01: "C1 Synthetic Data Detection"
    - TC-M1-02: "C2 Human Evaluation Detection"
    - TC-M1-03: "C3 Cross-Field Constraint"
    - TC-M1-04: "C4 State-Based Validation"
    - TC-M1-05: "Valid Input (No Violations)"

  constraints_tested:
    - C1: "No synthetic data (keyword pattern)"
    - C2: "No human evaluation (keyword blacklist)"
    - C3: "Standard dataset membership (cross-field)"
    - C4: "No new benchmarks (state-based)"

  storage_path: "tests/h_m1/test_cases.yaml"

# Implementation Architecture
architecture:
  baseline:
    name: "Schema-Only Validation"
    library: "Pydantic BaseModel"
    mechanism: "Type annotations + Field() + Literal[]"
    coverage: "Structure, types, enums"
    file: "src/validation/schemas.py"

  proposed:
    name: "Contract-Based Validation"
    library: "icontract preconditions/postconditions"
    mechanism: "@require/@ensure decorators"
    coverage: "Keyword patterns, cross-field, state-based"
    file: "src/validation/contracts.py"

  shared_constants:
    file: "src/validation/constants.py"
    content:
      - STANDARD_DATASETS: "Set of known standard datasets"
      - EXISTING_BENCHMARKS: "Set of allowed benchmarks"

# Baseline Experiments
baselines:
  schema_only:
    name: "Schema-Only Validation"
    implementation: "Pydantic BaseModel with Field() constraints"
    expected_performance:
      can_express: ["Type checking", "Required fields", "Literal enums"]
      cannot_express: ["Keyword patterns", "Cross-field", "State-based"]
      coverage: 0.0  # Expected 0-1 of 4 constraints (0-25%)

# Proposed Method
proposed:
  name: "Contract-Based Validation"
  implementation: "icontract @require/@ensure decorators"
  expected_performance:
    can_express: ["All schema checks", "Keyword patterns", "Cross-field", "State-based"]
    cannot_express: []
    coverage: 1.0  # 4 of 4 constraints (100%)
    gap: 0.75  # 75 percentage points

# Metrics
metrics:
  primary:
    name: "Constraint Coverage"
    formula: "(Constraints Explicitly Checked / Total Constraints) × 100%"
    success_threshold:
      contract_coverage: 1.0
      schema_coverage: 0.5
    unit: "percentage"

  secondary:
    expressiveness_gap:
      formula: "Contract Coverage - Schema Coverage"
      threshold: 0.75
      unit: "percentage points"

    execution_behavior:
      checks:
        - "Do contract violations halt execution?"
        - "Are violation messages descriptive?"

    implementation_complexity:
      formula: "Lines of Contract Code"
      threshold: 50
      unit: "LOC"

# Experimental Procedure
procedure:
  steps:
    step01:
      name: "Implement Schema-Only Baseline"
      actions:
        - "Define Phase2AOutputSchemaOnly with Pydantic"
        - "Attempt to express C1-C4 using Field() and Literal[]"
        - "Document which constraints schema CANNOT express"
      duration: "1 day"

    step02:
      name: "Implement Contract-Based Validation"
      actions:
        - "Define Phase2AOutputWithContracts"
        - "Add @require/@ensure for each of C1-C4"
        - "Verify contracts trigger ViolationError on breach"
      duration: "1 day"

    step03:
      name: "Create Test Suite"
      actions:
        - "Create TC-M1-01 through TC-M1-05 in YAML"
        - "Tag with known ground truth (violates C1, C2, C3, or C4)"
      duration: "0.5 days"

    step04:
      name: "Run Coverage Experiment"
      actions:
        - "Feed each test case to schema-only validator"
        - "Feed each test case to contract-based validator"
        - "Count detection: schema vs contract"
        - "Generate coverage report"
      duration: "0.5 days"

    step05:
      name: "Verify Success Criteria"
      actions:
        - "Contract coverage ≥ 100% (4/4)"
        - "Schema coverage < 50% (<2/4)"
        - "Document findings in 04_validation.md"
      duration: "1 day"

# Success Criteria
success_criteria:
  gate_type: MUST_WORK

  primary:
    condition: "contract_coverage >= 1.0 AND schema_coverage < 0.5"
    action_if_pass: "Validates h-m1, proceed to h-m2"
    action_if_fail: "PIVOT - redefine constraints to be more semantic"

  secondary:
    - condition: "expressiveness_gap >= 0.75"
    - condition: "contract_loc < 50"

  failure_threshold: 0.5
  failure_action: "PIVOT"

# File Structure
file_structure:
  tests:
    - "tests/h_m1/__init__.py"
    - "tests/h_m1/test_cases.yaml"
    - "tests/h_m1/run_coverage_test.py"

  source:
    - "src/validation/__init__.py"
    - "src/validation/schemas.py"
    - "src/validation/contracts.py"
    - "src/validation/constants.py"

# Dependencies
dependencies:
  python_version: ">=3.11"

  packages:
    - name: pydantic
      version: ">=2.0"
      purpose: "Schema validation baseline"

    - name: icontract
      version: ">=2.0"
      purpose: "Contract-based validation (preconditions/postconditions)"

    - name: pytest
      version: ">=7.0"
      purpose: "Test framework"

    - name: pyyaml
      version: ">=6.0"
      purpose: "Test case loading"

# Risk Mitigation
risks:
  R1_icontract_pydantic_integration:
    likelihood: low
    impact: high
    mitigation: "Use h-e1 implementation as template"
    detection: "Unit tests for integration"

  R2_schema_unexpected_expressiveness:
    likelihood: medium
    impact: medium
    mitigation: "Strictly limit baseline to Field() and Literal[] (no field_validator)"
    detection: "Code review of baseline implementation"

  R3_constraint_ambiguity:
    likelihood: low
    impact: low
    mitigation: "Use constraint definitions from h-e1 validation"
    detection: "Ground truth labels in test cases"

# Expected Outcomes
expected_outcomes:
  quantitative:
    schema_coverage: 0.0  # 0 of 4 constraints
    contract_coverage: 1.0  # 4 of 4 constraints
    expressiveness_gap: 1.0  # 100 percentage points

  qualitative:
    - "Contracts force explicit checking schema leaves implicit"
    - "Design-by-Contract enables constraint enforcement"
    - "Validates causal mechanism step 1 of main hypothesis"

  failure_modes:
    - "Schema unexpectedly expresses 2+ constraints (gap < 50%)"
    - "Contract cannot express compositional constraint"

# Next Steps
next_steps:
  immediate:
    - "Proceed to Phase 3: Implementation Planning"
    - "Create PRD for constraint coverage experiment"
    - "Create Architecture document"
    - "Create PRP (Project Requirements Plan)"
    - "Initialize Archon tasks"

  post_validation:
    - "Run coverage experiment (Phase 4)"
    - "Verify success criteria (Phase 4.5)"
    - "Write validation report (Phase 4.5)"
    - "Update hypothesis status based on gate criteria"

# References
references:
  implementations:
    icontract:
      url: "https://github.com/Parquery/icontract"
      description: "Design-by-contract for Python with @require/@ensure"

    pydantic_constraints:
      url: "https://docs.pydantic.dev/latest/concepts/fields/"
      description: "Field-level constraints (min_length, pattern, etc.)"

    h_e1_validation:
      source: "h-e1/04_validation.md"
      description: "Contract framework existence validated"

# Metadata
metadata:
  created_at: '2026-08-20'
  created_by: phase2c-experiment-design
  version: 1
  status: complete
