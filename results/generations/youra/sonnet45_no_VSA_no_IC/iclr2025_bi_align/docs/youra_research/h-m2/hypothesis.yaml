# Hypothesis h-m2: Multi-Layer Validation Detection
# ═══════════════════════════════════════════════════════════════════
# Extracted from: docs/youra_research/02b_verification_plan.md
# Date: 2026-08-20
# ═══════════════════════════════════════════════════════════════════

id: h-m2
type: MECHANISM
gate: SHOULD_WORK
status: READY

# ───────────────────────────────────────────────────────────────────
# Core Statement
# ───────────────────────────────────────────────────────────────────

statement: |
  Under contract-based validation with three layers (schema + pattern + composition),
  if all layers execute at phase boundaries, then constraint violations missed by
  schema-only are detected because pattern matching catches semantic violations and
  compositional contracts catch cross-phase dependencies.

rationale: |
  Tests causal step 2 - multi-layer architecture detecting what single layer misses.
  Core mechanism hypothesis proving validation layers are complementary, not redundant.

# ───────────────────────────────────────────────────────────────────
# Variables
# ───────────────────────────────────────────────────────────────────

variables:
  independent:
    name: Validation architecture
    type: categorical
    levels:
      - single-layer (schema-only)
      - three-layer (schema + pattern + contract)

  dependent:
    primary:
      name: Boundary violation detection rate
      type: continuous
      unit: percentage
      operationalization: "Violations detected / total violations × 100%"

  controlled:
    - name: Constraint violation patterns
      value: "Fixed set with known ground truth (30 adversarial test cases)"

# ───────────────────────────────────────────────────────────────────
# Success Criteria
# ───────────────────────────────────────────────────────────────────

success_criteria:
  primary:
    metric: Detection rate gap
    threshold: "≥40 percentage points"
    comparison: "three-layer > schema-only"

  secondary:
    metric: Pattern layer semantic detection
    threshold: "≥80%"
    scope: "C1/C2 violations only"

# ───────────────────────────────────────────────────────────────────
# Verification Protocol
# ───────────────────────────────────────────────────────────────────

verification:
  steps:
    1: "Create 30 adversarial test cases: 10 schema, 10 semantic, 10 compositional"
    2: "Run through schema-only validation, record detection rate"
    3: "Run through three-layer validation, record detection rate"
    4: "Verify three-layer catches ≥95% while schema catches ≤50%"

  expected_baseline: "Schema-only: 40% (10/25 violations)"
  expected_proposed: "Three-layer: 100% (25/25 violations)"

# ───────────────────────────────────────────────────────────────────
# Dependencies
# ───────────────────────────────────────────────────────────────────

dependencies:
  prerequisite:
    - h-m1: "Contracts must force checking (VALIDATED)"

  enables:
    - h-m3: "Early detection prevents downstream failures"

# ───────────────────────────────────────────────────────────────────
# Failure Response
# ───────────────────────────────────────────────────────────────────

failure_response:
  action: EXPLORE
  rationale: "Diagnose which layer failing, refine patterns"
  fallback: "Document limitation, proceed to h-m3 if primary met"

# ───────────────────────────────────────────────────────────────────
# Source References
# ───────────────────────────────────────────────────────────────────

source:
  phase2a: "causal_mechanism.steps[1]"
  phase2b: "02b_verification_plan.md section 2.2"
  prediction: "P2 (multi-layer detection)"
