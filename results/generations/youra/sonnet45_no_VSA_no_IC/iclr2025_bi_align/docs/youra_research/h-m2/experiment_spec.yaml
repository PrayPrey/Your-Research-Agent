# Experiment Specification: h-m2 Multi-Layer Validation Detection
# ═══════════════════════════════════════════════════════════════════
# Source: docs/youra_research/h-m2/02c_experiment_brief.md
# Date: 2026-08-20
# Level: 1.5 (Detailed specification)
# ═══════════════════════════════════════════════════════════════════

experiment:
  id: h-m2
  name: "Multi-Layer Validation Detection"
  type: MECHANISM
  phase: "2C - Experiment Design"
  level: 1.5

# ───────────────────────────────────────────────────────────────────
# Research Objective
# ───────────────────────────────────────────────────────────────────

objective:
  question: "Does three-layer validation achieve higher detection rates than single-layer schema validation alone?"
  goal: "Validate that multi-layer validation architecture (schema → pattern → contract) detects constraint violations through complementary mechanisms"

# ───────────────────────────────────────────────────────────────────
# Dataset
# ───────────────────────────────────────────────────────────────────

dataset:
  type: custom
  name: "Adversarial Test Suite for Phase Boundary Validation"
  source: "Generated test cases with known ground-truth constraint violations"

  size:
    total: 30
    distribution:
      valid: 5
      schema_violations: 10
      pattern_violations: 10
      compositional_violations: 5

  constraints_covered:
    C1_no_synthetic: 3  # pattern layer
    C2_no_human_eval: 3  # pattern layer
    C3_standard_dataset: 2  # contract layer
    C4_no_new_benchmarks: 3  # contract layer

  preparation:
    existing_infrastructure:
      - "tests/phase_boundary_validation/generate_test_cases.py"
      - "tests/phase_boundary_validation/test_cases.yaml (20 existing)"
    required_updates:
      - "Extend from 20 to 30 cases (add 10 schema violations)"
      - "Balance distribution: 10/10/5/5"
      - "Ensure each constraint (C1-C4) has ≥2 test cases"

# ───────────────────────────────────────────────────────────────────
# Baseline
# ───────────────────────────────────────────────────────────────────

baseline:
  name: "Schema-Only Validation"
  implementation: "Pydantic BaseModel with typed fields only"

  included:
    - "Type checking (str, int, List[str])"
    - "Literal enums"
    - "Field constraints (min_length, min_items)"

  excluded:
    - "@field_validator decorators (pattern layer)"
    - "@model_validator decorators (contract layer)"
    - "Semantic or cross-field checks"

  expected_performance:
    schema_violations: "100% (10/10)"
    pattern_violations: "0% (0/10)"
    contract_violations: "0% (0/5)"
    overall: "40% (10/25)"

# ───────────────────────────────────────────────────────────────────
# Proposed Method
# ───────────────────────────────────────────────────────────────────

proposed:
  name: "Three-Layer Validation Architecture"

  layers:
    layer1_schema:
      implementation: "Pydantic BaseModel"
      checks:
        - "Type checking"
        - "Required fields"
        - "Literal enums"

    layer2_pattern:
      implementation: "@field_validator"
      checks:
        - "Keyword blacklists for C1 (synthetic data)"
        - "Keyword blacklists for C2 (human evaluation)"
        - "Regex pattern matching"

    layer3_contract:
      implementation: "@ensure postconditions"
      checks:
        - "Cross-field constraints for C3 (standard dataset membership)"
        - "State-based validation for C4 (benchmark whitelist)"
        - "Compositional logic across multiple fields"

  execution_order: "Schema → Pattern → Contract (fail-fast)"

  expected_performance:
    after_layer1: "40% (10/25)"
    after_layer2: "80% (20/25)"
    after_layer3: "100% (25/25)"
    gap: "60 percentage points (exceeds ≥40pp threshold)"

# ───────────────────────────────────────────────────────────────────
# Metrics
# ───────────────────────────────────────────────────────────────────

metrics:
  primary:
    name: "Detection Rate Gap"
    formula: "(three_layer_detection_rate - schema_only_detection_rate)"
    unit: "percentage points"
    success_threshold: "≥40 pp"

  secondary:
    layer_specific:
      - "Schema layer: schema violations detected / total schema violations"
      - "Pattern layer: pattern violations detected / total pattern violations"
      - "Contract layer: contract violations detected / total contract violations"

    constraint_specific:
      - "C1 detection rate (pattern layer)"
      - "C2 detection rate (pattern layer)"
      - "C3 detection rate (contract layer)"
      - "C4 detection rate (contract layer)"

    false_positive:
      name: "False Positive Rate"
      formula: "Valid cases incorrectly rejected / total valid cases"
      target: "0%"

# ───────────────────────────────────────────────────────────────────
# Success Criteria
# ───────────────────────────────────────────────────────────────────

success:
  primary:
    condition: "Detection gap ≥40pp"
    required: true

  secondary:
    - condition: "Pattern layer ≥80% on semantic violations (C1/C2)"
      required: false
    - condition: "Contract layer 100% on compositional violations (C3/C4)"
      required: false
    - condition: "False positive rate = 0%"
      required: false

  gate_verdicts:
    PASS: "Primary + Secondary all met"
    PARTIAL_PASS: "Primary met, Secondary ≥60% (document limitation, proceed to h-m3)"
    FAIL: "Primary not met (<40pp gap)"

# ───────────────────────────────────────────────────────────────────
# Implementation
# ───────────────────────────────────────────────────────────────────

implementation:
  existing_infrastructure:
    - "src/validation/schemas.py"
    - "src/validation/patterns.py"
    - "src/validation/contracts.py"
    - "src/validation/constants.py"

  new_components:
    - "tests/h_m2/test_cases_h_m2.yaml"
    - "experiments/h_m2_multilayer_validation.py"
    - "experiments/utils/h_m2_validator.py"

  complexity:
    tier: 0  # Proof-of-Concept
    effort_hours: "2-3"
    risk: LOW
    rationale: "All validation layers already implemented (h-m1)"

# ───────────────────────────────────────────────────────────────────
# Execution Steps
# ───────────────────────────────────────────────────────────────────

procedure:
  step1_preparation:
    - "Run generate_test_cases.py to create 30-case suite"
    - "Manual review: verify ground-truth expected_detection labels"
    - "Save to tests/phase_boundary_validation/test_cases_h_m2.yaml"

  step2_baseline:
    - "Load 30 test cases"
    - "For each: run schema-only validation"
    - "Record: {detected: boolean, layer: null}"
    - "Calculate baseline detection rate"

  step3_three_layer:
    - "Load same 30 test cases"
    - "For each: run three-layer validation"
    - "Record: {detected: boolean, layer: schema|pattern|contract}"
    - "Calculate three-layer detection rate"

  step4_per_layer:
    - "Compute layer-specific detection for each violation type"
    - "Verify: Pattern layer catches ≥80% of C1/C2"
    - "Verify: Contract layer catches 100% of C3/C4"

  step5_validation:
    - "Compute detection gap"
    - "Check primary criterion: gap ≥ 40pp"
    - "Check secondary criterion: pattern layer ≥ 80% on C1/C2"

# ───────────────────────────────────────────────────────────────────
# Deliverables
# ───────────────────────────────────────────────────────────────────

deliverables:
  phase4_implementation:
    - "tests/h_m2/test_cases_h_m2.yaml"
    - "experiments/h_m2_multilayer_validation.py"
    - "experiments/utils/h_m2_validator.py"

  phase4_validation:
    - "docs/youra_research/h-m2/04_validation.md"

  artifacts:
    - "Detection rate plots (bar chart)"
    - "Confusion matrix (expected vs actual per layer)"

# ───────────────────────────────────────────────────────────────────
# Timeline
# ───────────────────────────────────────────────────────────────────

timeline:
  total_duration_hours: 8
  breakdown:
    test_suite_extension: 2
    experiment_implementation: 3
    execution_and_analysis: 2
    documentation: 1

# ───────────────────────────────────────────────────────────────────
# Risks
# ───────────────────────────────────────────────────────────────────

risks:
  R1_pattern_detection_low:
    likelihood: LOW
    impact: MEDIUM
    mitigation: "Add synonym expansion for C1/C2 keywords"

  R2_test_suite_imbalanced:
    likelihood: MEDIUM
    impact: HIGH
    mitigation: "Adversarial review: ask 'what edge case would fool this layer?'"

  R3_ground_truth_labels_incorrect:
    likelihood: LOW
    impact: CRITICAL
    mitigation: "Independent verification, spot-check with human inspection"

  R4_false_positives:
    likelihood: LOW
    impact: MEDIUM
    mitigation: "Validate all 5 valid cases pass before full experiment"
