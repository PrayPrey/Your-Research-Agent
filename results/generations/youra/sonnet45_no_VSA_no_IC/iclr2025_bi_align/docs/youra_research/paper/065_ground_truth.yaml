hypothesis_id: "H-ContractValidation-v1"

# ═══════════════════════════════════════════════════════════════
# QUANTITATIVE CLAIMS (Must be verifiable from validation reports)
# ═══════════════════════════════════════════════════════════════

quantitative_claims:
  primary_results:
    - claim: "100% downstream failure reduction"
      source: "h-m3 validation report, 045_validated_hypothesis.md Section 2.4"
      evidence: "20/20 violations caught at boundaries → 0/20 Phase 4/5 failures (contract-based) vs 0/20 caught → 20/20 failures (schema-only)"
      verification: "Table 5 in Results section"

    - claim: "100 percentage point expressiveness gap"
      source: "h-m1 validation report, 045_validated_hypothesis.md Section 2.2"
      evidence: "Contracts: 4/4 constraints (100%), Schema: 0/4 constraints (0%)"
      verification: "Table 2 in Results section"

    - claim: "48 percentage point detection gap"
      source: "h-m2 validation report, 045_validated_hypothesis.md Section 2.3"
      evidence: "Three-layer: 22/25 (88%), Schema-only: 10/25 (40%)"
      verification: "Table 3 in Results section"

  secondary_metrics:
    - claim: "25 LOC implementation cost for contract layer"
      source: "h-e1 validation report"
      evidence: "Contract layer implementation measured at 25 lines of code"
      verification: "Table 1 in Results section"

    - claim: "<1ms execution overhead"
      source: "h-e1 validation report"
      evidence: "0.01ms per validation measured"
      verification: "Table 1 in Results section"

    - claim: "0% false positive rate"
      source: "h-e1, h-m3 validation reports"
      evidence: "0/80 valid hypotheses rejected"
      verification: "Table 1 and Table 5 in Results section"

    - claim: "80% recall on keyword constraints (C1/C2)"
      source: "h-m2 validation report"
      evidence: "C1: 4/5 (80%), C2: 4/5 (80%)"
      verification: "Table 4 in Results section"

# ═══════════════════════════════════════════════════════════════
# QUALITATIVE CLAIMS (Must be supported by experimental evidence)
# ═══════════════════════════════════════════════════════════════

qualitative_claims:
  mechanism:
    - claim: "Contracts force explicit checking schema cannot perform"
      evidence: "h-m1 demonstrated 100% contract coverage vs 0% schema coverage on C1-C4 constraints"
      falsification_test: "If schema could express C1-C4, expressiveness gap would be <75pp"

    - claim: "Layers are complementary, not redundant"
      evidence: "h-m2 layer-wise breakdown: schema 10, pattern +8, contract +4 (cumulative, not overlapping)"
      falsification_test: "If redundant, adding layers would show diminishing returns, not additive contributions"

    - claim: "Early detection prevents propagation"
      evidence: "h-m3 showed 100% boundary detection → 0% Phase 4/5 failures vs 0% boundary → 100% Phase 4/5 failures"
      falsification_test: "If violations propagated despite boundary detection, failure reduction would be <80%"

  novelty:
    - claim: "First application of Design-by-Contract to research automation"
      evidence: "Phase 1 research found no prior work applying DbC to research pipeline phase transitions"
      verification: "Related Work section cites DbC for code (Meyer 1988, C++26) but not workflows"

    - claim: "Three-layer architecture (schema + pattern + contract)"
      evidence: "No existing multi-level validation combines schema, keyword patterns, and compositional contracts for research workflows"
      verification: "Related Work differentiates from Great Expectations (data quality), anomaly IDS (network security)"

# ═══════════════════════════════════════════════════════════════
# SCOPE AND LIMITATIONS (Honest bounds on claims)
# ═══════════════════════════════════════════════════════════════

scope_boundaries:
  validated_under:
    - "4 feasibility constraints (C1-C4): synthetic data, human eval, standard datasets, new benchmarks"
    - "Research workflows with typed phase interfaces (Pydantic schemas)"
    - "Placeholder hypothesis content (minimal artifact fidelity)"
    - "Adversarial test suite (30 cases) + 100-case placeholder corpus"

  not_validated_for:
    - "Substantive research content (placeholder-only testing, external validity unproven)"
    - "Constraint types beyond C1-C4 (temporal, probabilistic, resource constraints)"
    - "Production ML pipelines (only research automation tested)"
    - "Auto-generated contracts (manual specification only)"

  acknowledged_limitations:
    - limitation: "Placeholder content, not real research"
      impact: "External validity to production workflows unproven"
      mitigation: "Phase 5 baseline comparison (deferred) will validate on real executions"

    - limitation: "Pattern layer 80% recall (synonym gaps)"
      impact: "12% of semantic violations missed at boundaries"
      mitigation: "LLM-based semantic layer (future work) can achieve 95%+ recall"

    - limitation: "Manual contract specification (7 LOC per constraint)"
      impact: "Does not scale to 10+ constraints without automation"
      mitigation: "Auto-generation research (future work)"

    - limitation: "Only 4 constraint types tested"
      impact: "Generalization to temporal, probabilistic constraints unproven"
      mitigation: "Extension to training pipelines (future work)"

# ═══════════════════════════════════════════════════════════════
# EXPERIMENTAL SETUP (Verifiable design choices)
# ═══════════════════════════════════════════════════════════════

experimental_design:
  hypotheses:
    - id: "h-e1"
      type: "EXISTENCE"
      gate: "MUST_WORK"
      result: "PASS"
      criterion: ">50% detection improvement"
      measured: "200% improvement (33% → 100%)"

    - id: "h-m1"
      type: "MECHANISM"
      gate: "MUST_WORK"
      result: "PASS"
      criterion: "≥75pp expressiveness gap"
      measured: "100pp gap (0% schema, 100% contract)"

    - id: "h-m2"
      type: "MECHANISM"
      gate: "SHOULD_WORK"
      result: "PASS"
      criterion: "≥40pp detection gap"
      measured: "48pp gap (40% schema-only, 88% three-layer)"

    - id: "h-m3"
      type: "MECHANISM + PRIMARY"
      gate: "MUST_WORK"
      result: "PASS"
      criterion: "≥80% failure reduction (P1)"
      measured: "100% reduction (20/20 → 0/20 failures)"

  datasets:
    - name: "Adversarial test suite"
      size: "30 cases"
      purpose: "Measure per-layer detection rates (h-m2)"
      composition: "10 structural, 10 semantic, 10 compositional violations"

    - name: "Placeholder hypothesis corpus"
      size: "100 cases"
      purpose: "Measure downstream failure rates (h-m3)"
      composition: "80 valid, 20 with embedded violations (5 per constraint type)"

  baselines:
    - name: "Schema-only"
      definition: "Pydantic BaseModel with typed fields, no validators"
      rationale: "Isolates pure schema expressiveness"

    - name: "No validation"
      definition: "Direct phase execution without boundary checks"
      rationale: "Upper bound on failure rates"

