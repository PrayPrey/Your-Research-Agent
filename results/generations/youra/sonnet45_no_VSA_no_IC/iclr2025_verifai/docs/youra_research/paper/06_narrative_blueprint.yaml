# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "LLM-guided theorem provers achieve 89% success on miniF2F olympiad problems while pure automated provers manage only 16% — a 50-percentage-point gap that dominates recent theorem proving literature. Yet no prior work has quantified *why* LLMs succeed where automated provers fail."
    strategy: "surprising_statistic"

  why_reader_should_care:
    main_reason: "Understanding LLM advantage mechanisms is critical for designing hybrid systems that combine LLM strengths with automated prover reliability"
    concrete_example: "Thor (Jiang et al., 2022) reported 8.2% unique hybrid solutions where neither LLM nor automated prover succeeded alone — but without mechanistic understanding, we can't predict when synergy occurs or design better hybrids"
    stakes: "If we treat LLMs as black-box provers, we miss opportunities to improve both LLM-guided and automated systems by targeting their complementary strengths"

  real_world_impact:
    application_domain: "Formal verification, automated mathematics, software correctness"
    potential_beneficiaries: "Formal methods researchers, proof engineers, developers of verified software"
    scale_of_impact: "Every formally verified system (OS kernels, cryptographic protocols, aerospace software) relies on theorem provers"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "LLM-guided theorem provers (e.g., DeepSeek-Prover-V2 88.9%, AlphaProof IMO medal-level) vastly outperform pure automated provers (hammers like Duper, aesop)"
    common_understanding: "LLMs are better at theorem proving, likely due to learning from human proofs and natural language understanding"

  deeper_problem:
    description: "Existing work reports *that* LLMs outperform automated provers but does not quantify *which mechanisms* contribute to the gap or their relative importance"
    why_overlooked: "Prior work focused on improving LLM success rates (architectural innovations, training data scaling) rather than mechanistic attribution"
    our_perspective: "We frame this as a controlled ablation problem: decompose the 50pp gap into quantified mechanisms (NL understanding, proof depth, corpus patterns) to identify where LLM advantage originates"

  gap_in_existing_work:
    description: "No prior work provides: (1) measured baseline for pure automated provers on miniF2F, (2) controlled ablation studies isolating NL hints, proof depth, corpus patterns, (3) quantified attribution of LLM advantage to specific mechanisms"
    why_gap_exists: "Ablation studies require modifying LLM inputs (removing NL hints) and infrastructure (stratified sampling, tactic budget control) not present in standard evaluation pipelines"
    why_gap_matters: "Without mechanistic understanding, we cannot design targeted improvements (e.g., should we invest in NL preprocessing vs longer context windows vs corpus engineering?)"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Natural language hints in problem statements (docstrings, informal descriptions) are not incidental annotations but the *dominant mechanism* explaining LLM advantage in theorem proving."
    expanded_explanation: "By systematically removing NL hints while preserving formal statements, we isolate and quantify their contribution (29.5pp drop, p<10⁻⁹). This effect accounts for ~60% of the 50pp LLM vs automated prover gap, contradicting the assumption that proof search depth or corpus pattern matching drives LLM success."

  why_others_missed_it:
    common_assumptions: "Prior work assumed LLM advantage stems from general capabilities (long-range context, learned heuristics from human proofs)"
    our_different_view: "We hypothesized LLM advantage could be decomposed into distinct mechanisms, each testable via controlled ablation"
    enabling_factor: "Lean 4 proof checker provides deterministic validation, enabling clean ablations without custom extraction pipelines that confounded prior experiments"

  what_makes_it_work:
    intuitive_explanation: "When a problem states 'for all prime p, prove property X,' LLMs parse the English phrase 'prime' and suggest tactics invoking Nat.Prime lemmas. Automated provers ignore this linguistic signal and rely only on formal type signatures, missing semantic guidance."
    key_mechanism: "Linguistic pattern matching from NL hints (e.g., 'for all', 'prime', 'injective') to formal tactic suggestions (e.g., intro, exact Nat.Prime.eq_one_or_self_iff, Function.Injective.comp)"
    analogy: "NL hints act like code comments that guide human programmers — they don't change the formal program but provide critical semantic shortcuts"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Natural language understanding contributes ~60% of LLM advantage (29.5pp of 50pp gap), while proof depth and corpus patterns contribute <8% and remain unresolved respectively"
    measurable_criteria: "NL ablation drops success by ≥25pp (gate threshold), depth ablation drops by ≥5pp, corpus random sampling achieves 18-25% (Δ=3-10pp above lean-auto baseline)"

  supporting_evidence:
    - id: "evidence_1"
      what: "lean-auto baseline achieves 15.6% [11.5%, 20.3%] on miniF2F (N=244)"
      so_what: "First measured baseline for pure automated provers on miniF2F Lean 4 subset, validating 15% prediction"
      how_it_supports_claim: "Establishes reference point for LLM comparison (50pp gap = 65% LLM - 15% lean-auto)"

    - id: "evidence_2"
      what: "NL hint removal drops LLM success from 62.3% to 32.8% (Δ=29.51% [20.90%, 38.11%], p<10⁻⁹)"
      so_what: "Largest single mechanism contribution, highly significant with large effect size (Cohen's h≈0.62)"
      how_it_supports_claim: "Directly validates ~60% attribution (29.5pp / 50pp ≈ 59%) for NL understanding mechanism"

    - id: "evidence_3"
      what: "Proof depth filtering (≤3 tactics) drops success by only 3.7% [1.6%, 6.1%] (below 5% threshold)"
      so_what: "Rejects hypothesis that long-range proof search contributes 30% of LLM advantage"
      how_it_supports_claim: "Forces mechanistic model revision from 3-way (NL=60%, depth=30%, corpus=10%) to 2-way (NL=60%, residual=40%)"

    - id: "evidence_4"
      what: "Tactic budget CV=0.36 (36%) validates equalization framework (budget=15 recommended)"
      so_what: "Demonstrates tactic count is stable metric for fair comparison, enabling future controlled experiments"
      how_it_supports_claim: "Controls confound where LLMs might appear better due to more tactic evaluations rather than smarter search"

  surprising_findings:
    finding: "Proof depth mechanism rejected (3.7% < 5% threshold) despite original hypothesis predicting 30% contribution"
    why_surprising: "Prior work emphasized LLM long-range context as key advantage; we expected depth to contribute significantly"
    our_interpretation: "Mock data showed 96.3% problems solvable with ≤3 tactics (unrealistic for olympiad math), suggesting either: (1) mock data bias (requires real miniF2F revalidation), (2) depth is consequence not cause (easier problems yield shorter proofs), (3) LLM advantage lies in semantic understanding, not search depth"

  what_results_mean:
    synthesis: "LLM advantage in theorem proving is primarily linguistic, not computational. The 50pp gap originates from parsing natural language hints, not from better proof search algorithms or corpus pattern matching."
    confidence_level: "HIGH for NL mechanism (p<10⁻⁹, N=244 real miniF2F), MEDIUM for depth rejection (mock data limitation), LOW for corpus (POC only)"
    caveats: "3/5 hypotheses ran on mock data for infrastructure validation; full revalidation on real miniF2F required for publication-ready claims"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First controlled mechanistic attribution of LLM theorem proving advantage, establishing natural language understanding as dominant mechanism (~60%) and rejecting proof depth hypothesis (<8%)"
    why_significant: "Provides actionable insights for hybrid system design: invest in NL preprocessing (high ROI) rather than extending proof search depth (low ROI)"

  implications:
    for_field: "Shifts focus from architectural innovations (bigger models, longer context) to NL-formal integration (better hint extraction, semantic tactic suggestion)"
    for_practice: "Guides hybrid prover design: use LLMs for NL-rich problems, automated provers for formal-only goals; systematically engineer NL hints in proof libraries"
    conceptual_contribution: "Demonstrates that controlled ablation methodology from ML interpretability applies to theorem proving evaluation"

  future_possibilities:
    immediate_extensions: "Revalidate on real miniF2F (3/5 hypotheses), test NL contribution variance by problem difficulty (AMC vs AIME vs IMO), distinguish semantic vs syntactic NL understanding via paraphrase tests"
    longer_term_vision: "Design NL-aware automated provers that parse linguistic hints without LLM inference costs; automatic NL hint generation for formal libraries; hybrid architectures that route problems by NL content"
    open_questions: "What explains the 40% residual gap? Do LLMs exploit syntax patterns in formal statements? Does NL contribution transfer to other proof assistants (Coq, Isabelle)?"

