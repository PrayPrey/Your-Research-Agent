# INTERPRETATION BOUNDARIES (claims NOT made in paper)
# ═══════════════════════════════════════════════════════════════════════════════

not_claimed:
  - claim: "NL understanding is 60% of LLM capability"
    correction: "NL understanding is 60% of LLM *advantage over automated provers* (29.5pp / 50pp gap)"

  - claim: "Depth mechanism does not contribute to LLM advantage"
    correction: "Depth mechanism contributes <8% (rejected at 5% threshold on mock data, may contribute 10-20% on real miniF2F)"

  - claim: "Results apply to all theorem provers"
    correction: "Results specific to miniF2F Lean 4 (lean-auto vs LeanCopilot); cross-prover transfer (Coq, Isabelle) requires validation"

  - claim: "LLMs do not use proof depth"
    correction: "Proof depth filtering shows small effect (3.7%); LLMs may use depth but it's not primary advantage mechanism"

  - claim: "Results are publication-ready"
    correction: "60% ready (H-E1, H-M1, H-C1 on real data); full paper requires H-M1/M2/M3 real miniF2F revalidation"

