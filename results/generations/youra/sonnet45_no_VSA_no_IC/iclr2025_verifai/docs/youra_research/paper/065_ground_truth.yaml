# ═══════════════════════════════════════════════════════════════════════════════
# METHODOLOGY DETAILS (for reproducibility verification)
# ═══════════════════════════════════════════════════════════════════════════════

methodology:
  dataset:
    name: "miniF2F Lean 4 test subset"
    n_problems: 244
    difficulty: "Olympiad-level (AMC, AIME, IMO)"
    proof_checker: "Lean 4.0 RC (deterministic binary validation)"

  configurations:
    lean_auto:
      backend: "Duper"
      type: "automated hammer"
      timeout_sec: 300
      mathlib_version: "Lean 4 compatible"

    llm_leancopilot:
      sampling_budget: 32
      timeout_sec: 300
      mathlib_version: "Lean 4 compatible (same as lean-auto)"

  ablation_methods:
    nl_stripping:
      method: "Remove all docstrings and inline comments"
      preserves: "Formal statement structure (type signatures, theorem bodies)"
      removes: "Natural language hints (e.g., '-- For all prime p...')"

    depth_filtering:
      method: "Post-hoc stratification by tactic count"
      threshold: "≤3 tactics (shallow subset)"
      comparison: "Paired McNemar test (same problem, different depth strata)"

  statistical_tests:
    paired_comparisons: "McNemar χ² for H-M1, H-M2"
    independent_comparisons: "Chi-squared for H-M3 vs H-E1"
    confidence_intervals: "Bootstrap BCa method, 10,000 resamples"
    alpha: 0.05
    effect_size: "Cohen's h for proportions"

