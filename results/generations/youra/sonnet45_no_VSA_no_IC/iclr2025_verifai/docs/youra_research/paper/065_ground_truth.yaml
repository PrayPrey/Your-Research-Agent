gate_thresholds:
  h_e1_baseline:
    metric: "success_rate"
    range: [10, 25]
    unit: "percent"
    rationale: "Lower bound for trivial problems (`rfl` alone), upper bound conservative for hammers"

  h_m1_nl_mechanism:
    metric: "delta_success_rate"
    threshold: 25
    unit: "percentage points"
    operator: ">="
    and_significance: "p < 0.05"
    rationale: "Validates 60% contribution (30pp / 50pp ≈ 60%)"

  h_m2_depth_mechanism:
    metric: "delta_success_rate"
    threshold: 5
    unit: "percentage points"
    operator: ">="
    and_significance: "p < 0.05"
    rationale: "Minimum effect to validate 30% contribution claim"

  h_m3_corpus_mechanism:
    metric: "success_rate"
    range: [18, 25]
    unit: "percent"
    rationale: "Δ=3-10pp above lean-auto baseline (validates 10% contribution)"

  h_c1_tactic_budget:
    metric: "cv"
    threshold: 1.0
    operator: "<="
    rationale: "Low variance validates stable control metric"

