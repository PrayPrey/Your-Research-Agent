main_hypothesis:
  id: H-MechanisticBaseline-v1
  title: Mechanistic Dissection of LLM Theorem Proving Advantage
  statement: 'LLM-guided theorem proving (LeanCopilot) achieves 65% vs 15% for pure automated provers (lean-auto) on miniF2F
    Lean 4 subset (N≥50), with gap explained by: (1) NL understanding 60%, (2) proof depth 30%, (3) corpus patterns 10%'
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: miniF2F Lean 4 subset (N≥50)
    model: LeanCopilot (LLM-guided) vs lean-auto (hammers)
    optimizer: Not applicable (theorem proving)
    hyperparameters:
      tactic_budget: 10
      timeout: 300
      mathlib_version: Lean 4 compatible
  baseline_comparison:
    status: NOT_STARTED
    gate:
      type: DETERMINES_SUCCESS
      satisfied: null
      result: null
