# Dataset Specification for H-E1
# lean-auto Baseline Measurement

hypothesis_id: h-e1
generated: 2026-08-20

dataset:
  name: miniF2F Lean 4 Test Set
  type: standard
  source: google-deepmind/miniF2F
  repository: https://github.com/google-deepmind/miniF2F
  version: alphaproof-eval

  size:
    total: 244
    split: test
    validation_available: 244

  problem_sources:
    AMC: ~73  # 30% - American Mathematics Competition
    AIME: ~98  # 40% - American Invitational Mathematics Exam
    IMO: ~73  # 30% - International Mathematical Olympiad

  characteristics:
    domain: formal_mathematics
    difficulty: olympiad_level
    formalization: Lean 4
    verification_status: fully_verified
    unprovable_statements: 0  # Fixed in v2

  preprocessing:
    infrastructure:
      - Clone google-deepmind/miniF2F
      - Checkout AlphaProof evaluation version
      - Verify Lean 4.15.0+ compatibility
      - Build mathlib dependencies (lake build)

    loading:
      - Parse Minif2f/Test.lean for theorem statements
      - Extract 244 theorem names
      - No premise selection (zero-shot)

    excluded: []  # All 244 problems included

  metadata_extraction:
    source_stratification: optional
    extraction_method: filename_or_docstring
    fields:
      - problem_id
      - source (AMC/AIME/IMO)
      - formal_statement
      - natural_language_docstring

baseline_configuration:
  prover: lean-auto
  version: ">=1.0"
  lean_version: "4.15.0"

  settings:
    auto.smt: false
    auto.tptp: false
    auto.native: true
    trace.auto: true
    trace.auto.mono: true

  premise_selection: none  # Zero-shot baseline
  atp_backend: Duper  # For proof reconstruction

  resources:
    timeout: 300  # seconds per problem
    tactic_budget: unlimited  # Measured, not constrained
    memory: 16384  # MB per worker
    cpu_cores: 8  # Per worker
    workers: 8  # Parallel execution

metrics:
  primary:
    - name: success_rate
      definition: problems_solved / 244
      target_range: [0.10, 0.25]
      predicted: 0.15

  secondary:
    - name: tactic_count
      definition: ATP evaluations per solved problem
      purpose: H-C1 budget setting
      extraction: lean-auto trace logs

    - name: solve_time
      definition: wall-clock seconds to proof
      range: [0, 300]

    - name: failure_modes
      categories:
        - timeout
        - error
        - type_checking_failure

logging:
  per_problem:
    - problem_id
    - source
    - outcome
    - wall_clock_time
    - tactic_evaluation_count
    - proof_term_size
    - atp_backend_used

  aggregate:
    - success_rate
    - confidence_interval_95
    - mean_solve_time
    - median_solve_time
    - mean_tactic_count
    - median_tactic_count
    - timeout_count
    - error_count

expected_outcomes:
  success_rate:
    point_estimate: 0.15
    ci_95: [0.105, 0.195]
    solved_count: 37
    timeout_count: 200
    error_count: 7

  tactic_count:
    mean: 9.2
    median: 7.0
    cv: 0.48
    range: [1, 50]

  stratification_by_source:
    AMC: 0.20
    AIME: 0.14
    IMO: 0.10

validation:
  pilot_run:
    size: 20
    expected_solves: [2, 5]
    purpose: infrastructure_validation

  reproducibility:
    rerun_subset: 24  # 10% of 244
    match_rate: 1.00  # Deterministic

  quality_gates:
    error_rate_max: 0.05
    tactic_count_cv_max: 1.00
    infrastructure_stability: pilot_validates

references:
  - lean-auto paper (Qian et al. 2025)
  - miniF2F benchmark (Zheng et al. 2021)
  - miniF2F-v2 corrections (Roozbeh et al. 2026)
  - AlphaProof evaluation (DeepMind 2024)
