core_statement:
  hypothesis_id: "H-MechanisticBaseline-v1"
  confidence_level: 0.78 # High feasibility (0.82) + strong novelty (0.85) - moderate implementation complexity (0.70) = 0.79 average → rounded to 0.78

  core_hypothesis_statement: |
    Under miniF2F Olympiad-level formal mathematics benchmark (Lean 4 subset, N≥50 problems),
    if we compare LLM-guided theorem proving (LeanCopilot) against pure automated provers (lean-auto hammers) with controlled tactic evaluation budgets (10 evaluations/problem),
    then LLM-guided approaches achieve significantly higher success rates (predicted: 65% vs 15%, Δ=50 percentage points),
    because LLMs exploit three distinct mechanisms: (1) natural language hint understanding (contributing 60% of the gap via linguistic pattern matching from problem statements), (2) long-range proof search capability (contributing 30% via context maintenance across 5-10 tactic steps where hammers timeout at depth 3), and (3) Mathlib corpus pattern matching (contributing 10% via learned human proof tactic distributions).

  alternative_hypothesis_h0: |
    There is no significant difference (Δ ≤ 10 percentage points) in miniF2F success rates between LLM-guided theorem proving and pure automated provers when controlling for tactic evaluation budgets. Alternative explanation: Any observed differences are due to generic search heuristics unrelated to natural language understanding, proof depth, or corpus patterns.

