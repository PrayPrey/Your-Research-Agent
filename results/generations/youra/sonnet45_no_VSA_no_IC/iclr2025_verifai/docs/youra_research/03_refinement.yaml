# SECTION 1.5: Novelty Assessment
# ═══════════════════════════════════════════════════════════════

novelty:
  core_novelty_claim: |
    First work to quantitatively attribute LLM theorem proving advantage to specific mechanisms via controlled ablation study. Prior work (Thor, DeepSeek-V2, Numina-Lean-Agent) reports aggregate success rates but does NOT decompose WHY LLMs outperform automated provers into measurable contributions from natural language understanding (60%), long-range proof search (30%), and corpus pattern matching (10%).

  related_work_comparison:
    - work: "Thor (Jiang et al., 2022)"
      contribution: "Hybrid LLM+hammer architecture, 57% on PISA, 8.2% unique hybrid solutions"
      limitation: "'39%' baseline ambiguous (LM-only or prover-only unclear), no mechanistic decomposition"
      our_advance: "Establishes unambiguous prover-only baseline via lean-auto measurement AND decomposes gap via three-way ablation"

    - work: "DeepSeek-Prover-V2 (2025)"
      contribution: "SOTA 88.9% on miniF2F-test via RL subgoal decomposition"
      limitation: "No non-LLM baseline reported, no mechanistic analysis of why RL helps"
      our_advance: "Provides baseline comparison AND mechanistic attribution (NL/depth/corpus) applicable to any LLM approach including RL"

    - work: "RLMEval (Poiroux et al., 2025)"
      contribution: "Research-level benchmark (613 problems, 10.3% success)"
      limitation: "No baseline comparison, no mechanistic decomposition of difficulty factors"
      our_advance: "Difficulty stratification reveals which problem types favor LLMs vs hammers"

    - work: "MiniF2F (Zheng et al., 2021)"
      contribution: "Standard benchmark (244 problems), deterministic evaluation protocol"
      limitation: "Establishes benchmark but doesn't measure pure prover baselines"
      our_advance: "Uses miniF2F as testbed while filling baseline gap identified in Gap 3"

  incremental_vs_breakthrough: "INCREMENTAL_PLUS"
  justification: |
    Incremental: Builds on existing benchmarks (miniF2F), tools (lean-auto, LeanCopilot), and prior findings (Thor's synergy, DeepSeek-V2 SOTA).
    Plus: Introduces mechanistic dissection methodology via ablation study. Converts 'LLMs are better' observation into 'LLMs are better BECAUSE of X(60%), Y(30%), Z(10%)' scientific claim with falsifiable predictions.

