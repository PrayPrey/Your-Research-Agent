variables:
  independent:
    - name: "Prover Configuration"
      type: "categorical"
      operationalization: "Type of theorem proving system used: (1) lean-auto (hammers only), (2) LeanCopilot-full (LLM with NL hints + all depths), (3) LeanCopilot-no-NL (NL comments removed), (4) LeanCopilot-shallow (proofs ≤3 tactics only), (5) Random-Mathlib (random tactic sampling)"
      levels: ["lean-auto", "LLM-full", "LLM-no-NL", "LLM-shallow", "Random-Mathlib"]

    - name: "Tactic Evaluation Budget"
      type: "continuous"
      operationalization: "Number of tactic evaluations allowed per problem. Fixed at 10 for all LLM/random configs. lean-auto uses measured baseline (avg evaluations @ 300s timeout)."
      levels: null

    - name: "Problem Difficulty Stratum (post-stratified)"
      type: "categorical"
      operationalization: "Problem source category from miniF2F metadata: AMC (American Mathematics Competitions), AIME (American Invitational Mathematics Examination), IMO (International Mathematical Olympiad). Used for stratified analysis if metadata available."
      levels: ["AMC", "AIME", "IMO"]

  dependent:
    - name: "Proof Success Rate"
      type: "continuous"
      operationalization: "Percentage of miniF2F problems successfully proved (Lean 4 proof checker validation, binary outcome: valid/invalid). Range: 0-100%. Primary outcome metric."
      primary: true

    - name: "Tactic Evaluation Efficiency"
      type: "continuous"
      operationalization: "Success rate divided by average tactic evaluations per problem. Measures 'problems solved per tactic evaluation'. Secondary metric for search efficiency analysis."
      primary: false

    - name: "Wall-Clock Time per Problem"
      type: "continuous"
      operationalization: "Average seconds spent per problem (timeout capped at 300s). Used for latency analysis but NOT primary comparison metric (confounded by LLM inference time)."
      primary: false

  controlled:
    - name: "Mathlib Version"
      operationalization: "Same Mathlib theorem library version for all configurations (ensures fair premise selection access). Fixed to version compatible with miniF2F Lean 4 subset."

    - name: "miniF2F Problem Set"
      operationalization: "Lean 4 ported subset from facebookresearch/miniF2F fork. All configurations run on identical problem set (N≥50 verified)."

    - name: "Timeout Budget"
      operationalization: "Wall-clock timeout of 300 seconds per problem (fallback to prevent infinite loops). Applies to all configurations."

    - name: "Lean 4 Proof Checker"
      operationalization: "All proof validation uses Lean 4 proof checker (deterministic binary validation: valid/invalid). No custom extraction mechanisms."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Mechanism Description
# ═══════════════════════════════════════════════════════════════

mechanism:
  causal_chain: |
    1. Natural Language Understanding Mechanism (60% of gap):
       - miniF2F problems include informal NL hints in comments/docstrings
       - LLMs parse English mathematical descriptions ("for all prime p...")
       - Linguistic patterns map to formal tactic suggestions (e.g., "prime" → `Nat.Prime` lemmas)
       - Hammers ignore NL hints, rely only on formal statement structure
       - Ablation test: Remove NL comments → predicted drop from 65% to 35% (Δ=30%)

    2. Long-Range Proof Search Mechanism (30% of gap):
       - Olympiad problems require multi-step proofs (5-10 tactic chains)
       - LLMs maintain context across proof steps via transformer architecture
       - Hammers use breadth-first search with depth limits (timeout at depth 3)
       - Long proofs require backtracking + context memory (LLM strength, hammer weakness)
       - Ablation test: Filter to shallow proofs (≤3 tactics) → predicted drop from 65% to 50% (Δ=15%)

    3. Mathlib Corpus Pattern Matching Mechanism (10% of gap):
       - LLMs trained on human-written Mathlib proofs
       - Learn which tactics frequently succeed together (e.g., `rw` → `simp` sequences)
       - Random sampling from Mathlib distribution provides stochastic baseline
       - Hammers use deterministic heuristics (no corpus learning)
       - Control test: Random Mathlib sampling → predicted 20% vs lean-auto 15% (Δ=5%)

    Mechanistic Integration:
    - Three mechanisms are independent and additive (60% + 30% + 10% = 100% of gap)
    - Each testable via ablation/control (remove NL, filter depth, random corpus)
    - Falsification criteria defined per mechanism (Δ < threshold rejects contribution claim)

  key_assumptions:
    - assumption: "miniF2F Lean 4 subset is representative of full benchmark"
      justification: "Pilot study on N≥50 problems. Acknowledge potential bias toward easier problems if ported subset differs in difficulty distribution. Mitigation: Report difficulty stratification if metadata available."

    - assumption: "NL hints are separable from formal statements"
      justification: "Lean 4 stores NL in comments/docstrings, separate from formal code. 10-problem pilot verifies ablation doesn't break type-checking."

    - assumption: "Tactic evaluation budget equalizes search depth"
      justification: "Measure lean-auto's average evaluations @ 300s timeout, then match LLM budget. Controls for search depth despite inference latency differences."

    - assumption: "Mathlib corpus is representative for random sampling"
      justification: "Acknowledged corpus bias. Random sampling used as THIRD baseline for triangulation, not sole comparison. Tests whether corpus patterns alone explain gap."

    - assumption: "Lean proof checker is deterministic ground truth"
      justification: "Binary validation (valid/invalid) eliminates extraction rate bottleneck. h-e1 failed due to custom extraction (49.5%), Lean checker is deterministic."

  testability_criteria:
    - criterion: "NL contribution falsifiable"
      test: "IF (LLM-full success - LLM-no-NL success) < 10%, THEN reject '60% contribution' claim"

    - criterion: "Depth contribution falsifiable"
      test: "IF (LLM-full success - LLM-shallow success) < 5% OR > 30%, THEN reject '30% contribution' claim"

    - criterion: "Corpus contribution falsifiable"
      test: "IF Random-Mathlib success < 15% OR > 30%, THEN reject '10% contribution' claim"

    - criterion: "Overall framework falsifiable"
      test: "IF all prover configurations achieve ±5% success within difficulty strata, THEN reject entire attribution framework (difficulty alone determines outcome)"

