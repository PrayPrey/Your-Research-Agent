# SECTION 4: Experimental Design Skeleton
# ═══════════════════════════════════════════════════════════════

experimental_design:
  dataset: "miniF2F Lean 4 subset (facebookresearch/miniF2F fork, N≥50 problems)"

  configurations:
    - name: "Baseline-Hammer"
      tool: "lean-auto"
      config: "Default hammer interface, timeout=300s"
      tactic_budget: "Measured empirically (avg evaluations @ 300s)"
      predicted_success: "15%"

    - name: "SOTA-LLM"
      tool: "LeanCopilot"
      config: "Full NL hints, all proof depths, tactic_budget=10"
      predicted_success: "65%"

    - name: "Ablation-NL"
      tool: "LeanCopilot"
      config: "NL comments removed (preprocessed miniF2F), tactic_budget=10"
      predicted_success: "35% (Δ=30% from full)"

    - name: "Ablation-Depth"
      tool: "LeanCopilot"
      config: "Post-hoc filter to proofs ≤3 tactics, tactic_budget=10"
      predicted_success: "50% (Δ=15% from full)"

    - name: "Control-Corpus"
      tool: "Random Mathlib sampler (custom implementation)"
      config: "Uniform sampling from Mathlib proof corpus, tactic_budget=10"
      predicted_success: "20% (Δ=5% above lean-auto)"

  measurement_protocol: |
    For each config in [Baseline, SOTA, Abl-NL, Abl-Depth, Control]:
        For each problem in miniF2F_Lean4_subset:
            result = run_prover(config, problem, tactic_budget=10, timeout=300s)
            log(
                problem_id = problem.id,
                config = config.name,
                success = result.proved,  # Lean checker validation
                tactic_count = result.evaluations,
                wall_time = result.duration,
                stratum = problem.difficulty  # AMC/AIME/IMO if metadata exists
            )

        # Compute success rates
        overall_success = count_proved(config) / count_total()

        # Stratified analysis (if metadata available)
        IF problem_metadata_exists:
            success_AMC = count_proved(config, stratum='AMC') / count_total('AMC')
            success_AIME = count_proved(config, stratum='AIME') / count_total('AIME')
            success_IMO = count_proved(config, stratum='IMO') / count_total('IMO')

  statistical_tests:
    - test: "McNemar's test (paired binary outcomes)"
      purpose: "Compare success rates between configurations on same problem set"

    - test: "Chi-square test for independence"
      purpose: "Test config × stratum interaction (whether LLM advantage varies by difficulty)"

    - test: "Effect size: Δ% with 95% confidence intervals"
      purpose: "Quantify ablation effects (NL, depth, corpus) with uncertainty bounds"

