# Empirical Mathlib tactic distribution (nullary tactics only for POC)
# Source: LeanDojo (2023), filtered for parameterless tactics
tactic_distribution:
  simp: 0.60      # Most common simplifier (nullary)
  rfl: 0.25       # Reflexivity
  intro: 0.05     # Single intro
  intros: 0.04    # Multiple intros
  constructor: 0.03  # Constructor application
  omega: 0.02     # Integer arithmetic solver
  ring: 0.01      # Ring solver (can be nullary)

proof_search:
  budget: 15
  timeout_seconds: 300
  goal_selection: random

evaluation:
  workers: 8
  dataset_size: 244
