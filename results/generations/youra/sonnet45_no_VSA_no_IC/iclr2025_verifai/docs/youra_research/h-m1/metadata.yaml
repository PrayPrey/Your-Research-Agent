# Hypothesis Metadata: h-m1
# NL Hint Ablation

hypothesis_id: h-m1
parent_hypothesis: H-MechanisticBaseline-v1
type: MECHANISM
gate: MUST_WORK
priority: HIGH
generated_at: 2026-08-20T04:17:00Z
archon_task_id: 100fc27f-e71c-43b4-abd4-fd896677e021

# Hypothesis Statement
statement: |
  NL hint removal drops LLM success by 25-35 percentage points
  (tests 60% contribution claim)

short_name: NL Hint Ablation
keywords:
  - natural language
  - ablation study
  - theorem proving
  - LeanCopilot
  - miniF2F

# Predicted Outcomes
predicted_effect:
  baseline_success_rate: 0.65  # with NL hints
  ablated_success_rate: 0.35   # without NL hints
  delta: 0.30                  # 30 percentage points
  effect_size_cohens_h: 0.63   # large effect

falsification_criteria:
  threshold: 0.10  # Δ < 10% → reject hypothesis
  statistical_test: mcnemar
  alpha: 0.05
  power: 0.80

# Gate Decision Rules
gate_decision:
  PASS:
    conditions:
      - delta >= 0.25
      - p_value < 0.05
    implication: "NL mechanism confirmed, proceed to Phase 3"

  FAIL:
    conditions:
      - delta < 0.10
      - p_value >= 0.05
    implication: "Reject 60% NL contribution claim, revise main hypothesis"

  INCONCLUSIVE:
    conditions:
      - delta >= 0.10 and delta < 0.25
    implication: "Weaker effect than predicted, re-evaluate attribution percentages"

# Dataset
dataset:
  name: miniF2F-v2c
  type: standard  # Real, established benchmark
  source: HuggingFace
  repository: roozbeh-yz/miniF2F_v2
  config: v2c
  split: test
  size: 244
  format: Lean 4 theorem declarations
  characteristics:
    problem_sources:
      - AMC (American Mathematics Competition)
      - AIME (American Invitational Mathematics Exam)
      - IMO (International Mathematical Olympiad)
    difficulty: olympiad-level
    verification_status: fully_verified
    provability: all_provable
    nl_hints: docstrings_and_comments

# Experimental Design
experimental_design:
  conditions:
    baseline:
      name: NL-Intact
      description: Original miniF2F-v2c with docstrings/comments
      preprocessing: none
    ablated:
      name: NL-Removed
      description: Lean files with docstrings/comments stripped
      preprocessing:
        - strip_docstrings
        - strip_inline_comments
        - preserve_theorem_structure

  pilot_validation:
    required: true
    sample_size: 20
    go_no_go_criteria:
      - type_check_failures <= 3
      - delta >= 0.05

  evaluation:
    prover: LeanCopilot
    model: ReProver
    tactic: search_proof
    sampling_budget: 32
    timeout_seconds: 300
    parallelization: 8

# Metrics
metrics:
  primary:
    - name: success_rate_delta
      definition: baseline_success_rate - ablated_success_rate
      predicted_value: 0.30
      unit: percentage_points

  secondary:
    - name: avg_tactics_per_proof
      definition: mean number of tactics in successful proofs
      purpose: test proof depth confound
    - name: timeout_rate
      definition: percentage of problems hitting 300s limit
      purpose: diagnostic
    - name: error_type_distribution
      definition: breakdown of failure modes
      purpose: diagnostic

# Statistical Analysis
statistical_analysis:
  test: mcnemar
  description: Paired comparison (same 244 problems, two conditions)
  null_hypothesis: delta = 0
  alternative_hypothesis: delta >= 0.25
  alpha: 0.05
  power: 0.80
  confidence_interval: 0.95
  bootstrap_resamples: 10000

# Dependencies
dependencies:
  prerequisites: []  # Independent from H-E1
  downstream: []     # No blocking dependencies

# Risk Assessment
risks:
  - id: RISK-001
    description: Type-check failures after NL removal
    probability: 0.30
    impact: HIGH
    mitigation: 20-problem pilot before full run
    fallback: Pivot to external Mathlib docs removal

  - id: RISK-002
    description: No measurable effect (Δ < 10%)
    probability: 0.20
    impact: HIGH
    mitigation: Accept falsification, report negative result
    implication: Revise main hypothesis (NL contributes <30%)

  - id: RISK-003
    description: Confound (NL removal also removes semantic type info)
    probability: 0.40
    impact: MEDIUM
    mitigation: Manual inspection of 20 ablated examples
    diagnostic: IF type signatures preserved AND success drops → NL effect is real

  - id: RISK-004
    description: GPU availability
    probability: 0.30
    impact: LOW
    mitigation: Queue overnight, request dedicated allocation

# Infrastructure
infrastructure:
  compute:
    gpu: 1x NVIDIA A5000 (24GB VRAM) or equivalent
    cpu_cores: 32
    ram_gb: 128
    storage_gb: 50

  software:
    lean_version: 4.17.0
    mathlib: latest compatible with miniF2F-v2c
    leancopilot: main branch
    reprover: bundled with LeanCopilot
    python_version: 3.9+
    python_packages:
      - datasets
      - numpy
      - scipy
      - matplotlib

  estimated_runtime:
    pilot_hours: 2.5
    full_hours: 41
    analysis_hours: 1
    total_days: 2

# Phase Progression
phase_status:
  phase_2a: COMPLETED
  phase_2b: COMPLETED
  phase_2c: COMPLETED  # This metadata file marks completion
  phase_3: PENDING
  phase_4: PENDING

# Outputs
expected_outputs:
  phase_2c:
    - 02c_experiment_brief.md
    - dataset_spec.yaml
    - evaluation_protocol.md
    - implementation_notes.md
    - metadata.yaml
    - README.md

  phase_3:
    - 03_prd.md
    - 03_architecture.md
    - 03_logic.md
    - 03_config.md
    - archon_tasks.yaml

  phase_4:
    - code/
    - 04_validation.md
    - 04_implementation_summary.md
    - baseline_results.jsonl
    - ablated_results.jsonl
    - comparison_stats.json
    - visualizations/

