  mechanism1:
    name: "Natural Language Understanding"
    contribution: "60% of performance gap"
    causal_path: "NL hint → LLM linguistic processing → relevant tactic suggestion → higher success"
    test_method: "Remove NL comments from Lean 4 statements"
    predicted_delta: "65% → 35% (Δ=30%)"
    falsification: "IF Δ < 10%, reject NL contribution claim"

  mechanism2:
    name: "Long-Range Proof Search"
    contribution: "30% of performance gap"
    causal_path: "Multi-step proof requirement → LLM context maintenance → hammer timeout → LLM advantage"
    test_method: "Filter to proofs requiring ≤3 tactics only"
    predicted_delta: "65% → 50% (Δ=15%)"
    falsification: "IF Δ < 5% OR Δ > 30%, reject depth contribution claim"

  mechanism3:
    name: "Mathlib Corpus Pattern Matching"
    contribution: "10% of performance gap"
    causal_path: "Human proof corpus → LLM learns tactic co-occurrence → stochastic sampling beats deterministic"
    test_method: "Random sampling from Mathlib tactic distribution"
    predicted_delta: "Random 20% vs lean-auto 15% (Δ=5%)"
    falsification: "IF Random < 15% OR > 30%, reject corpus contribution claim"

