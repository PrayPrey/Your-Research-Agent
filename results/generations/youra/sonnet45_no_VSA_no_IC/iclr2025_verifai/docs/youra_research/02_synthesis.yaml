falsification_framework:
  global_null: "IF all prover configs achieve ±5% success within difficulty strata, THEN reject entire attribution framework"

  per_mechanism_null:
    nl_hypothesis:
      h0: "NL hints contribute <15% of gap"
      h1: "NL hints contribute ~60% of gap"
      test: "LLM-no-NL ablation Δ"
      reject_h0_if: "Δ ≥ 25%"
      reject_h1_if: "Δ < 10%"

    depth_hypothesis:
      h0: "Proof depth is irrelevant OR dominant (>50% contribution)"
      h1: "Proof depth contributes ~30% of gap"
      test: "LLM-shallow filtering Δ"
      reject_h0_if: "10% ≤ Δ ≤ 20%"
      reject_h1_if: "Δ < 5% OR Δ > 30%"

    corpus_hypothesis:
      h0: "Mathlib patterns are useless OR explain entire gap"
      h1: "Mathlib patterns contribute ~10% of gap"
      test: "Random-Mathlib vs lean-auto Δ"
      reject_h0_if: "18% ≤ Random ≤ 25%"
      reject_h1_if: "Random < 15% OR Random > 30%"

