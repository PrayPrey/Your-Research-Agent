    verdict_justification: |
      Hypothesis is feasible IF pilots pass (NL ablation, tactic budget, metadata).
      Fallbacks defined (pivot to informal docs, use median budget, aggregate results).
      CONDITIONAL on completing pilots before full experiment (blockers: gates 1 & 2).

  dr_ally:
    name: "Dr. Ally"
    title: "Hypothesis Strengthening Champion"
    icon: "🛡️"
    verdict: "SUPPORT"
    confidence: 0.82

    key_contribution: |
      Bridged feasibility concerns with three-baseline triangulation design.
