    verdict_justification: |
      Three-baseline design strengthens mechanistic claim via triangulation.
      Corpus bias acknowledged and mitigated (third baseline for triangulation, not sole comparison).
      Refinements (timeout scaling, per-minute metric) address Prof. Pax's confounds.

  prof_rex:
    name: "Prof. Rex"
    title: "Hypothesis Stress-Test Master"
    icon: "🔍"
    verdict: "CONDITIONAL_SUPPORT"
    confidence: 0.72

    key_contribution: |
      Stress-tested via pre-registration demand, ablation robustness checks, metric confounds.
      Exchange 6: Challenged assumption that random sampling WILL achieve 20% (could be 5%, flipping story).
