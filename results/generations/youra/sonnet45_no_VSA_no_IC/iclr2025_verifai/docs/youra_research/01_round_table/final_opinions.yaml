    reasoning: |
      Mechanistic story depends on unmeasured baselines — pre-register predictions before experiments.
      If random sampling achieves 5% (not 20%), then "stochastic > deterministic" claim is falsified.
      NL ablation must test whether LLMs use proof state reasoning or just pattern-match problem statements.
      Tactic evaluation count (not timeout) is correct fairness metric (addresses latency confound).

    remaining_concerns: |
      Pre-registration CRITICAL — without it, predictions are post-hoc rationalization.
      NL ablation may not test what we think: if LLMs pattern-match statements (not comments), removing comments has no effect.
