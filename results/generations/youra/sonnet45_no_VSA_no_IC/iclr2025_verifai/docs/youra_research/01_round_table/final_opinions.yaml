  support_count: 6 # 4 SUPPORT + 2 CONDITIONAL_SUPPORT (all lean toward proceeding with pilots)
  dissent_count: 0

  synthesis: |
    All 6 personas support proceeding to Phase 2B with pilot studies as first implementation tasks.

    STRONG SUPPORT (0.80-0.85): Dr. Nova, Prof. Vera, Dr. Ally
    → Mechanistic dissection is novel and testable. Feasibility concerns are addressable via pilots.

    MODERATE SUPPORT (0.72-0.75): Dr. Sage, Prof. Rex
    → Significance depends on mechanistic percentages holding. Pre-registration required.

    CONDITIONAL SUPPORT (0.70): Prof. Pax
    → Feasibility gates (NL ablation, tactic budget, metadata) MUST pass before full experiment.

    KEY INSIGHT: None oppose hypothesis itself — concerns are about execution details (pilots, pre-registration, subset bias).
    All concerns have mitigation strategies (fallbacks defined, caveats acknowledged).

  recommendation: "PROCEED_TO_PHASE2B_WITH_PILOTS"

  rationale: |
    Hypothesis is well-formed: clear predictions, falsification criteria, mechanistic story.
    Infrastructure verified: lean-auto, LeanCopilot, miniF2F Lean 4 subset exist.
    Critical pilots defined: NL ablation (10 problems), tactic budget (20 problems), metadata check, depth measurement.

    Phase 2B first tasks:
    1. Verify Lean 4 subset size (N≥50)
    2. NL ablation pilot (blocker gate 1)
    3. Tactic budget baseline (blocker gate 2)
    4. Pre-register predictions (Prof. Vera + Prof. Rex demand)
    5. Metadata check (optional enhancement for stratification)

    If gates 1&2 pass → full experiment.
    If gate 1 fails → pivot to informal docs ablation.
    If gate 2 variance too high → use median budget.
    If metadata absent → aggregate results only.
