      If all configs succeed equally within strata (±5%), difficulty alone determines outcome (falsifies entire framework).

    verdict_justification: |
      Core hypothesis (establish baseline, test mechanisms) is sound.
      BUT mechanistic story needs harder tests: pre-register, ablate NL hints robustly, measure tactic-count.
      CONDITIONAL on passing stress tests (pre-registration, NL ablation validity, subset bias analysis).

