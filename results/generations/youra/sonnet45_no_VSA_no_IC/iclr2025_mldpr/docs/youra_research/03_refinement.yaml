  model:
    name: "Binary field presence detection parser"
    type: "Automated metadata extraction pipeline"
    source: "Custom implementation: API clients (openml-python, datasets library) + web scraper (BeautifulSoup for UCI) + parsing rules (regex, keyword matching, schema validation)"
    hypothesis_fit: "Automated detection eliminates human annotation (avoiding h-e1 synthetic rater failure), enables 10k+ scale analysis (avoiding h-m5 small-sample failure), produces binary outcomes (present/absent) for objective measurement."

  baselines:
