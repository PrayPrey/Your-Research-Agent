# SECTION 5: Phase 2B Readiness
# ═══════════════════════════════════════════════════════════════

phase2b_readiness:
  status: "READY"

  sh1_existence: |
    Platform friction-reduction features (automated extraction, templates, validation, API) must be measurable from public documentation and verifiable via feature testing.
    Binary field presence detection must distinguish valid entries from empty placeholders using explicit parsing rules.
    10,000+ dataset sample must be extractable from 3 platforms within 2-week timeframe without rate limiting or access barriers.

  sh2_mechanism: |
    Friction-reduction mechanism: Platforms with higher friction scores (0-4) enable lower cognitive/time cost for optional metadata entry, increasing voluntary completion rates for valuable-but-not-required fields.
    Enforcement mechanism: Required fields show high presence (~90%) regardless of friction score due to platform-level enforcement.
    Test: Correlation between friction score and optional field presence rates (P1), plus required field consistency across platforms (P2), plus within-platform API vs manual comparison (P3).

  sh3_comparison: |
    Cross-platform comparison: OpenML (friction=2) vs HuggingFace (friction=3) vs UCI (friction=0).
    Baseline comparison: Observed presence rates vs uniform null hypothesis (~40-50% for optional fields) and Yang 2024 heterogeneity benchmark.
    Within-platform comparison: HuggingFace API uploads vs manual web form uploads (controls for platform-level confounds).

  open_questions:
    - "Does friction-reduction effect persist when controlling for platform age, funding, and community size? (Requires multivariate analysis or matched-pair design beyond current scope.)"
    - "Which specific friction-reduction feature (extraction, templates, validation, API) has strongest effect? (Requires feature-level analysis, current study uses composite friction score.)"
    - "How do temporal dynamics affect completeness? Does friction reduction accelerate initial completion or sustain long-term maintenance? (Requires longitudinal study, excluded to avoid temporal confounds.)"
    - "Can we build causal proof via controlled experiment? (Would require platform cooperation to A/B test friction features, beyond observational study scope.)"

