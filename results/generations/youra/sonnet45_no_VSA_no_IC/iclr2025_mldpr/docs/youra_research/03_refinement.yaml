# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FrictionMetadata-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the scope of ML dataset repositories (OpenML, HuggingFace Datasets, UCI ML Repository) with 10,000+ datasets analyzed,
    if platforms implement higher friction-reduction scores (0-4 scale: automated field extraction + pre-filled templates + validation feedback + programmatic API access),
    then optional metadata fields (preprocessing code, data source URLs, collection dates) exhibit significantly higher presence rates (60%+ for friction=3-4 vs <15% for friction=0),
    because friction reduction enables voluntary completion through tooling/automation while required field enforcement maintains ~90% presence regardless of friction level, serving different completeness mechanisms.
  alternative_hypothesis_h0: |
    There is no significant difference in optional metadata field presence rates between platforms with high friction-reduction scores (3-4) versus low friction-reduction scores (0-1), with all platforms showing similar optional field presence rates (~40-50%) regardless of UX design.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Platform Friction-Reduction Score"
      type: "categorical"
      operationalization: "0-4 integer scale: sum of binary features (automated extraction: 0/1, pre-filled templates: 0/1, validation feedback: 0/1, API access: 0/1). Measured via platform documentation review and feature inspection."
      levels: ["0 (UCI)", "2 (OpenML)", "3 (HuggingFace)"]
  dependent:
    - name: "Optional Metadata Field Presence Rate"
      type: "continuous"
      operationalization: "Percentage (0-100%) of datasets with field present per platform, calculated as: (datasets with field present) / (total datasets analyzed) * 100. Measured for 3 optional fields: preprocessing_code, data_source_url, collection_date. Binary presence detection via parsing rules."
      primary: true
    - name: "Required Metadata Field Presence Rate"
      type: "continuous"
      operationalization: "Percentage (0-100%) of datasets with field present per platform, calculated for 2 required fields: license, version. Expected ~90% across all platforms (control variable to validate enforcement mechanism)."
      primary: false
  controlled:
    - name: "Dataset Selection Stratification"
      operationalization: "Stratified random sampling proportional to platform size: OpenML ~20k datasets, HuggingFace ~60k datasets, UCI ~600 datasets. Total sample ~10,000+ datasets ensures statistical power while maintaining platform representativeness."
    - name: "Temporal Snapshot"
      operationalization: "Single timepoint data extraction (2026-08-19) to eliminate temporal drift confounds. No longitudinal comparison."
    - name: "Field Definition Consistency"
      operationalization: "Cross-platform field mapping via explicit normalization protocol: map OpenML XML tags, HuggingFace YAML keys, UCI HTML table columns to 6 unified target fields (dependencies, version, data_source_url, preprocessing_code, license, collection_date)."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Platform implements friction-reduction features (automated extraction, templates, validation, API) that lower cognitive/time cost of metadata entry"
      evidence: "Batzner 2026 automated converters enabled 22k+ entries; Yang 2024 shows template sections completed more than free-form sections"
      falsifier: "If platforms with templates show LOWER completion than platforms without templates, mechanism fails"
    - step: 2
      description: "Dataset creators encounter lower friction when documenting optional fields, increasing voluntary completion rates for valuable-but-not-required metadata"
      evidence: "Yang 2024 completion heterogeneity suggests tooling access varies; Reid 2023 shows lack of templates leads to fragmented documentation"
      falsifier: "If manual-entry datasets show EQUAL completion to automated-entry datasets within same platform, mechanism fails"
    - step: 3
      description: "Cumulative effect: platforms with higher friction-reduction scores exhibit higher optional field presence rates in aggregate metadata, while required fields remain high (~90%) due to enforcement mechanism"
      evidence: "Enforcement works for must-haves (predicted ~90% required field presence); friction reduction predicts optional field variance"
      falsifier: "If required field presence varies significantly by friction score (e.g., 60% on low-friction vs 90% on high-friction), enforcement/friction distinction fails"
  key_tension: "Correlation does not prove causation — friction score may correlate with platform age, funding, community size. Within-platform comparison (HF API vs manual upload) provides stronger causal evidence but still limited to one platform."
  evidence_summary: |
    Batzner 2026 demonstrates friction reduction enables large-scale voluntary contribution (22k+ entries).
    Yang 2024 shows completion heterogeneity patterns consistent with tooling access variability.
    Reid 2023 illustrates fragmentation consequences of high-friction documentation (no templates).
    Mechanism is plausible and supported by multi-domain evidence, but causal proof requires controlled experiment (out of scope for observational study).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Binary field presence detection (present/absent) via parsing rules is sufficiently accurate proxy for metadata completeness quality"
    supporting_evidence: "Yang 2024 used automated subsection detection for 7.4k datasets; Batzner 2026 automated converters for 22k+ entries. Both prove binary detection feasible."
    consequence_if_violated: "If parsing rules misclassify empty placeholders as 'present' or miss valid entries as 'absent', presence rates are unreliable. Mitigation: explicit parsing rules (e.g., preprocessing_code present if >50 chars + language keywords OR file extension .py/.R/.ipynb)."

  - id: "A2"
    assumption: "Friction-reduction features (automated extraction, templates, validation, API) are measurable from platform documentation without user studies"
    supporting_evidence: "Features are publicly documented (HuggingFace dataset card templates, OpenML API docs, UCI web forms). Binary presence (has feature: yes/no) is objective."
    consequence_if_violated: "If feature availability differs from actual user experience (e.g., API exists but is unusable), friction score inaccurate. Mitigation: verify features via actual API testing, not just documentation review."

  - id: "A3"
    assumption: "Cross-platform schema normalization (OpenML XML → HuggingFace YAML → UCI HTML) is feasible for 6 target fields without semantic loss"
    supporting_evidence: "Batzner 2026 normalized 22k+ heterogeneous evaluation records; Strecker 2026 mapped metadata across 8 repositories. Finite platform set (3) makes manual mapping tractable."
    consequence_if_violated: "If platforms define 'preprocessing_code' differently (OpenML: transformation steps, HF: code snippets, UCI: methodology text), comparison is invalid. Mitigation: explicit semantic mapping documented in methodology."

  - id: "A4"
    assumption: "10,000+ dataset sample provides sufficient statistical power to detect presence rate differences of 20+ percentage points"
    supporting_evidence: "Yang 2024 detected heterogeneity patterns in 7.4k datasets; 10k+ sample exceeds that scale. Power analysis: n=10,000, α=0.05, effect size d=0.5 → power >0.99 for detecting 20%+ difference."
    consequence_if_violated: "If true effect size is <10 percentage points, sample may lack power. Mitigation: focus on predicted large effects (60% vs <15% for P1) rather than marginal differences."

  - id: "A5"
    assumption: "Platforms' current friction-reduction features are stable over the measurement timepoint (not undergoing major UX redesign)"
    supporting_evidence: "Single-timepoint snapshot (2026-08-19) assumes features are stable. HuggingFace dataset cards documented since 2021; OpenML API stable for years; UCI web forms unchanged."
    consequence_if_violated: "If platform undergoes major UX change during data collection (e.g., HF deploys new template system mid-measurement), results inconsistent. Mitigation: complete data extraction within 2-week window, verify no major platform updates occurred."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ML dataset repositories with public APIs or web-scrapable metadata (OpenML, HuggingFace Datasets, UCI ML Repository)
    - Datasets uploaded by individual creators or small teams (not institutional archives with dedicated metadata staff)
    - Metadata fields relevant to reproducibility and reuse (dependencies, versioning, provenance, preprocessing, licensing, temporal info)
    - Observational cross-platform comparison at single timepoint (2026-08-19 snapshot)
    - Correlation analysis linking friction scores to presence rates (not causal proof via controlled experiment)

  does_not_apply_to: |
    - Domain-specific repositories with unique metadata requirements (genomics databases like GEO, astronomical data archives)
    - Enterprise or institutional data catalogs with mandatory metadata policies and dedicated curation staff
    - Longitudinal studies of metadata evolution over time (temporal drift explicitly excluded to avoid confounds)
    - Causal claims about friction reduction CAUSING higher completion (correlation only, confounds acknowledged)
    - User behavior modeling or qualitative studies of creator motivations (quantitative presence rates only)

  known_limitations: |
    1. **Correlation vs causation:** Cannot definitively prove friction reduction causes higher completion without controlled experiment. Platform-level confounds (age, funding, community culture) may contribute.
    2. **Binary detection granularity:** Presence/absence does not capture quality (e.g., vague dependency spec "Python 3.x" vs precise "Python 3.8.5, scikit-learn==0.24.2"). Both count as "present."
    3. **Cross-platform semantic mapping:** Field definitions may differ (OpenML "transformation" vs HF "preprocessing code" vs UCI "methodology"). Normalization introduces interpretation.
    4. **Snapshot temporality:** Single timepoint misses dynamics (datasets updated over time, platforms evolve features). Results reflect state at 2026-08-19 only.
    5. **Sample representativeness:** Stratified sampling may undersample rare dataset types (e.g., extremely large datasets, niche domains, deprecated datasets).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Platforms with higher friction-reduction scores (HuggingFace friction=3/4) exhibit ≥45 percentage point higher presence rates for optional metadata fields (preprocessing_code, data_source_url, collection_date) compared to platforms with lower friction scores (UCI friction=0/4), with HuggingFace showing 60%+ presence and UCI showing <15% presence."
    test_method: "Cross-platform comparison via binary automated field detection. Extract metadata from 10,000+ datasets (stratified sample: ~7,000 HF, ~2,500 OpenML, ~500 UCI proportional to platform sizes). Calculate presence rate per field per platform: (datasets with field present) / (total datasets) * 100. Compare HF (friction=3) vs UCI (friction=0) for 3 optional fields."
    success_criterion: "HuggingFace shows ≥60% presence for at least 2 of 3 optional fields (preprocessing_code, data_source_url, collection_date) AND UCI shows <15% presence for same fields. Difference ≥45 percentage points with p<0.05 via chi-squared test."
    falsification: "If UCI shows ≥50% presence for optional fields OR HuggingFace shows <30% presence, prediction fails. If difference <20 percentage points, effect too small to attribute to friction mechanism."

  - id: "P2"
    primary: false
    statement: "Required metadata fields (license, version) exhibit ~90% presence rates across ALL platforms (OpenML, HuggingFace, UCI) regardless of friction-reduction score, demonstrating enforcement mechanism effectiveness independent of UX tooling."
    test_method: "Cross-platform comparison for required fields. Calculate presence rates for license and version fields across all 3 platforms. If enforcement works, all platforms should show high presence (80-95%) regardless of friction score (OpenML=2, HF=3, UCI=0)."
    success_criterion: "All 3 platforms (OpenML, HuggingFace, UCI) show 80-95% presence for both license AND version fields. No significant difference (p>0.10) between platforms for required fields, demonstrating enforcement mechanism dominates over friction for must-haves."
    falsification: "If any platform shows <70% presence for license or version, enforcement assumption fails. If presence rates vary by friction score (e.g., HF 95% vs UCI 70%), enforcement/friction distinction is invalid."

  - id: "P3"
    primary: false
    statement: "Within HuggingFace datasets, those uploaded via programmatic API (datasets library) show ≥20 percentage point higher metadata completeness scores compared to those uploaded via manual web form, isolating friction-reduction effect within a single platform and controlling for platform-level confounds."
    test_method: "Within-HuggingFace comparison. Identify upload method via dataset metadata (API uploads often have programmatic metadata patterns: auto-generated README, API-specific fields). Compare completeness scores (average presence across 6 target fields) for API-uploaded datasets vs web-form-uploaded datasets. Sample ~1,000 datasets per upload method."
    success_criterion: "API-uploaded datasets show ≥70% average completeness (mean presence across 6 fields) vs ≤50% for web-form-uploaded datasets. Difference ≥20 percentage points with p<0.05 via t-test on aggregated completeness scores."
    falsification: "If web-form-uploaded datasets show ≥65% completeness OR API-uploaded datasets show <55% completeness, within-platform friction effect is negligible. If difference <10 percentage points, effect too weak to support mechanism."

