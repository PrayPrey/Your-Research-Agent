dataset:
  name: Waterbirds
  type: standard
  source: WILDS benchmark
  version: v1.0

  access:
    method: wilds.get_dataset('waterbirds', download=True)
    cache_path: ~/.wilds/waterbirds_v1.0/
    license: Open (academic use)
    citation: |
      Sagawa et al. 2020 (Distributionally Robust Neural Networks)
      Koh et al. 2021 (WILDS: A Benchmark of in-the-Wild Distribution Shifts)

  splits:
    train:
      size: 4795
      correlation: 0.90
    validation:
      size: 1199
      correlation: 0.90
    test:
      size: 5794
      correlation: 0.50
      note: PRIMARY EVALUATION SET

  structure:
    task: binary_classification
    classes:
      - id: 0
        name: waterbird
      - id: 1
        name: landbird

    backgrounds:
      - id: 0
        name: water
      - id: 1
        name: land

    groups:
      - id: 0
        composition: waterbird + water
        type: majority
        train_samples: ~3498
        train_proportion: 0.90
        description: Spurious-aligned (waterbird on water background)

      - id: 1
        composition: waterbird + land
        type: minority
        train_samples: ~184
        train_proportion: 0.10
        description: Spurious-conflict (waterbird on land background)

      - id: 2
        composition: landbird + water
        type: minority
        train_samples: ~467
        train_proportion: 0.10
        description: Spurious-conflict (landbird on water background)

      - id: 3
        composition: landbird + land
        type: majority
        train_samples: ~3626
        train_proportion: 0.90
        description: Spurious-aligned (landbird on land background)

  spurious_correlation:
    description: Background feature spuriously correlates with class label
    training_correlation: 0.90
    test_correlation: 0.50
    spurious_feature: background (water vs land)
    core_feature: bird type (waterbird vs landbird)

  image_properties:
    resolution:
      original: variable
      preprocessed: 224x224
    format: RGB
    channels: 3
    normalization:
      method: ImageNet
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  metadata:
    access_method: dataset.metadata_array
    columns:
      - index: 0
        name: y
        description: Class label (0=waterbird, 1=landbird)
      - index: 1
        name: background
        description: Background type (0=water, 1=land)
      - index: 2
        name: group
        description: Group ID (0-3, class × background)

  verification:
    total_samples: 11788
    train_size: 4795
    val_size: 1199
    test_size: 5794
    group_count: 4
    minority_groups: [1, 2]
    majority_groups: [0, 3]

  download:
    automatic: true
    size_mb: ~50
    url: https://worksheets.codalab.org/rest/bundles/0x505cecf4964f429eab910f1f1394c94f/contents/blob/
    requires_registration: false
