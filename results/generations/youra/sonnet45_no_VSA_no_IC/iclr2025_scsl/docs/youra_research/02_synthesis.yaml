hypothesis_draft:
  title: "Gradient Abnormality Detection and Spatial Regularization for Spurious Correlation Mitigation"
  hypothesis_id: "H-GradAbn-v1"
  core_claim: |
    Gradient abnormality metrics (GAIA zero-deflation, channel-wise variance) detect minority group samples (spurious reliance) without prior knowledge of the spurious feature. Spatial gradient regularization guided by GradCAM difference maps improves worst-group accuracy by penalizing gradient divergence in automatically identified spurious regions.
  mechanism: |
    1. Model learns spurious shortcut (land→landbird, water→waterbird)
    2. Minority samples (waterbird-land) create conflict between spurious (land→landbird) and core (waterbird)
    3. Conflict causes gradient scattering (dense, noisy gradients instead of sparse, smooth)
    4. GAIA metrics quantify scattering → unsupervised minority detection
    5. Spatial masking (majority GradCAM - minority GradCAM) isolates spurious regions
    6. Regularizing gradients in spurious regions during training forces model to rely on core features
  predictions:
    - P1: "Minority GAIA-Z ≥ Majority+0.2 (p<0.01)"
    - P2: "GAIA divergence correlates with WGA (ρ>0.7)"
    - P3: "Background augmentation reduces GAIA-Z by ≥30%"
    - P4: "MNIST toy: color-only regularization WGA ≥ Baseline+10%"
    - P5: "Waterbirds: spatial regularization WGA ≥ GroupDRO+5%"

variables_summary:
  independent: "Training correlation rate (80%/90%/95%), Test group (majority/minority)"
  dependent_primary: "GAIA-Z score (zero-deflation ratio), Worst-group accuracy"
  controlled: "Model architecture (ResNet-50), Training hyperparameters (SGD, lr=0.001), Image complexity (Waterbirds only)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in gradient abnormality scores between majority and minority group samples.
    Spatial gradient regularization does not improve worst-group accuracy beyond baseline.
  statistical_test: "Two-sample t-test (P1), Pearson correlation (P2), Paired t-test (P3, P4, P5)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First application of GAIA gradient abnormality to minority group detection (extends OOD→spurious). First gradient-based regularization for spurious mitigation. Automatic spurious localization via GradCAM difference."
  differentiation_summary: |
    vs. Adebayo 2022: Use abnormality (process) not attribution (result)
    vs. GAIA 2023: Extend to subpopulation shift, add mitigation
    vs. SPROD 2025: Gradient space (not prototype space), mitigation included
    vs. SCER 2025: Gradient space (not embedding space), complementary
    vs. GroupDRO: No group annotations, diagnostic + mitigation

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["ResNet-50 (Waterbirds, CelebA)", "ResNet-18 (MNIST toy)"]
  datasets: ["Waterbirds (primary)", "MNIST+Color (toy validation)", "CelebA (generalization)"]
  baselines: ["GroupDRO", "JTT", "SCER (estimated, code unavailable)"]

measurement_plan:
  data_collection:
    - source: "Waterbirds test set (4795 samples, 4 groups)"
    - source: "MNIST+Color synthetic (10k test, 2 classes × 2 colors = 4 groups)"
    - source: "CelebA test set (gender groups)"
  procedure:
    - step: "Train baseline model, compute GAIA-Z/GAIA-A for all test samples"
    - step: "Statistical test: t-test comparing minority vs majority scores (P1)"
    - step: "Train 10 models with varying correlation, measure WGA + GAIA divergence, compute Pearson ρ (P2)"
    - step: "Augment 100 minority samples (background swap), measure GAIA-Z reduction (P3)"
    - step: "MNIST toy: train 4 conditions, measure WGA (P4)"
    - step: "Waterbirds spatial regularization: train with GradCAM masking + adaptive penalty, measure WGA vs GroupDRO (P5)"
  success_criteria:
    - "P1: minority GAIA-Z ≥ majority+0.2, p<0.01"
    - "P2: ρ>0.7, p<0.05"
    - "P3: GAIA-Z reduction ≥30%"
    - "P4: WGA ≥ Baseline+10%"
    - "P5: WGA ≥ GroupDRO+5%"

validation:
  internal_validity:
    - "Control for image complexity (Waterbirds only, avoid wild images)"
    - "Per-class normalization (avoid class imbalance confound)"
    - "Multiple random seeds (3 seeds per condition for statistical robustness)"
    - "Minority classification check (≥60% accuracy for spatial masking validity)"
  external_validity:
    - "Generalization across spurious types (background → gender → color)"
    - "Generalization across architectures (ResNet-50 → ViT-B-16 if time permits)"
    - "Comparison to multiple baselines (GroupDRO, JTT, not just one)"

discussion_synthesis:
  key_insights:
    - "Gradient abnormality unifies OOD detection (GAIA) and spurious detection (ours) under single framework"
    - "Spatial masking via GradCAM difference provides automatic spurious localization without feature engineering"
    - "Three decision gates (MNIST toy, Waterbirds detection, Waterbirds mitigation) enable early pivot if assumptions fail"
    - "SCER code unavailability blocks Tier 1 claim but does not prevent Tier 2 contribution (gradient-based alternative)"
    - "Implementation fixes (percentile normalization, minority classification check) address Prof. Rex's critical flaws"
  critical_dependencies:
    - dependency: "P1 validation (minority abnormality)"
      consequence_if_fails: "Hypothesis false at most basic level. Abandon gradient approach."
    - dependency: "P4 validation (MNIST toy WGA)"
      consequence_if_fails: "Mitigation mechanism broken. Pivot to detection-only contribution (Tier 3)."
    - dependency: "A1 validation (minority accuracy ≥60%)"
      consequence_if_fails: "Spatial masking invalid. Fall back to global regularization (lower WGA expectation)."
  timeline_estimate: "4-5 weeks (MNIST 4 days, Waterbirds detection 3 days, Waterbirds mitigation 2 weeks, CelebA optional 1 week)"
