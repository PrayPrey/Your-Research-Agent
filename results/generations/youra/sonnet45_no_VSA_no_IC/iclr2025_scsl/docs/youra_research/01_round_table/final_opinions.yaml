  prof_rex:
    icon: "🔍"
    name: "Prof. Rex"
    title: "Hypothesis Stress-Test Master"
    verdict: "MODERATE"
    assessment: |
      Identified 3 critical flaws: (1) GradCAM difference assumes minority correctly classified (circular reasoning risk), (2) Adaptive penalty may be majority-biased (mean-based calibration), (3) Detection success ≠ mitigation success (missing mechanistic link). All addressed via implementation fixes (minority filtering, percentile normalization, spurious alignment metric). Remaining concerns: conditional OOD argument untested, spatial masking validity, SCER comparison absence.
    key_contributions:
      - "Exposed 3 critical flaws before execution: GradCAM circularity, adaptive penalty bias, detection-mitigation gap"
      - "Proposed implementation fixes: filter to correctly classified minority (Flaw #1), percentile normalization (Flaw #2), spurious alignment metric (Flaw #3)"
      - "Defined what survives peer review: all fixes implemented → strong paper, without fixes → risky/uncertain"
    concerns:
      - concern: "Conditional OOD argument potentially circular (minority is OOD because gradients abnormal, gradients abnormal because OOD)"
        mitigation: "Activation clustering (t-SNE) in Phase 2B to validate minority representation as 'between-class'"
      - concern: "Spatial masking validity depends on minority accuracy ≥60%"
        mitigation: "Empirical check in Phase 2B Step 1, fallback to global regularization"
      - concern: "SCER code unavailable — cannot rigorously compare"
        mitigation: "Position as complementary (not competitive), accept Tier 2 ceiling"

consensus_hypothesis:
  synthesized_by: "Dr. Ally"
  exchanges_to_convergence: 12
  statement: |
    Gradient abnormality, measured via GAIA-style metrics, detects spurious feature reliance on minority groups without requiring prior knowledge of the spurious feature. Spatial gradient regularization, guided by GradCAM difference maps, mitigates spurious reliance and improves worst-group accuracy.

    Core Mechanism: Models trained on spurious correlations exhibit gradient scattering on minority groups (waterbird-land) because the spurious shortcut (land→landbird) conflicts with the core feature (waterbird appearance). This conflict manifests as:
    - Dense gradients (zero-deflation abnormality) instead of sparse
    - Noisy channel-wise weights (channel-average abnormality) instead of smooth distributions

    Detection uses this abnormality as an unsupervised diagnostic. Mitigation penalizes gradient divergence in automatically identified spurious regions (high majority attribution, low minority attribution) during training, forcing the model to rely on core features instead.

  testable_predictions:
    - "P1: Minority groups show GAIA-Z scores ≥0.2 higher than majority groups (p<0.01)"
    - "P2: GAIA divergence correlates with worst-group accuracy across models (ρ>0.7)"
    - "P3: Background augmentation reduces GAIA scores by ≥30% for minority samples"
    - "P4 (MNIST toy): Color-only regularization WGA ≥ Baseline+10%"
    - "P5 (Waterbirds): Spatial regularization WGA ≥ GroupDRO+5%"

  novel_contributions:
    - "First application of gradient abnormality to minority group detection (extends GAIA from OOD to spurious)"
    - "Spatial gradient regularization as complement to embedding-based methods (SCER)"
    - "Automatic spurious localization via GradCAM difference maps (no feature engineering)"

  feasibility_assessment:
    timeline: "4-5 weeks with 3 decision gates (Week 1: MNIST toy, Week 2: Waterbirds detection, Week 3-4: Waterbirds mitigation)"
    computational_budget: "~250 GPU-hours (manageable on single GPU over 10 days)"
    tools_available: "MNIST, Waterbirds datasets, GAIA metrics, GradCAM implementation, GroupDRO/JTT code"
    contingency_plans: "Pivot to detection-only if mitigation fails, global regularization if spatial masking fails"

