personas:
  dr_nova:
    icon: "🔭"
    name: "Dr. Nova"
    title: "Creative Novelty Explorer"
    verdict: "STRONG"
    assessment: |
      Extending GAIA's gradient abnormality framework from OOD detection to spurious correlation detection is genuinely novel. The spatial masking via GradCAM difference maps provides automatic spurious localization without prior knowledge. Unifying distribution shift (OOD) and subpopulation shift (spurious) under a single gradient dynamics framework is conceptually significant.
    key_contributions:
      - "Proposed gradient abnormality extension from GAIA (OOD) to minority groups (spurious)"
      - "Introduced spatial masking via GradCAM difference (majority - minority gradients)"
      - "Reframed discovery-driven approach: mechanism follows empirical observation, not assumption"
    concerns: []

  prof_vera:
    icon: "🔬"
    name: "Prof. Vera"
    title: "Rigorous Validation Architect"
    verdict: "STRONG"
    assessment: |
      The hypothesis is highly testable with three clear falsifiable predictions: (1) minority groups show gradient abnormality, (2) GAIA metrics correlate with worst-group accuracy, (3) augmentation causally affects abnormality. The MNIST toy experiment provides controlled validation before real-world benchmarks. Three decision gates ensure early failure detection. Experimental rigor is excellent.
    key_contributions:
      - "Designed 3 falsifiable predictions with statistical tests (P1: t-test p<0.01, P2: Pearson ρ>0.7, P3: ≥30% reduction)"
