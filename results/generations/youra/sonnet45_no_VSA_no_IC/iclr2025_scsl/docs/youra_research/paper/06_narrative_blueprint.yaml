# NARRATIVE ARC
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

narrative_arc:
  act_1_setup:
    sections: ["01_introduction", "02_related_work"]
    goal: "Establish problem (spurious WGA gap), prior work limitations (attribution fails, methods require annotations), our approach (gradient abnormality + spatial regularization)."

  act_2_method:
    sections: ["03_methodology"]
    goal: "Explain detection pipeline (GradCAM → GAIA-Z → statistical test), causality test (background swap), mitigation algorithm (spatial regularization with adaptive penalty)."

  act_3_validation:
    sections: ["04_experiments", "05_results"]
    goal: "Present synthetic validation (h-e1, h-m-integrated) proving methodology correctness, PoC mitigation (h-m-mitigate MNIST) showing effectiveness."

  act_4_reflection:
    sections: ["06_discussion", "07_conclusion"]
    goal: "Interpret synthetic vs real validation tradeoffs, position contribution (Tier 3 methodology validated, Tier 2 pending real experiments), specify future work (GPU fix + 70-90h experiments)."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# SECTION-LEVEL STORY ARCS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

section_arcs:
  introduction:
    hook: "Gradient attribution ineffectiveness (Adebayo 2022 user study)"
    problem_escalation: "Concrete (Waterbirds WGA gap) → General (unknown spurious detection) → Fundamental (detection-mitigation gap)"
    contribution_preview: "4 contributions: detection methodology, causality validation, mitigation framework, unified gradient-based approach"

  related_work:
    subsections:
      - title: "Spurious Correlation Benchmarks"
        key_papers: ["Waterbirds (Sagawa 2020)", "CelebA", "Spawrious (Lynch 2023)"]
        gap: "Benchmarks exist but detection methods require known spurious features"

      - title: "Robust Learning Methods"
        key_papers: ["GroupDRO (294 GitHub stars)", "JTT (72 stars)", "SCER (Park 2025)"]
        gap: "GroupDRO needs annotations, JTT two-stage, SCER embedding-only (we operate on gradients)"

      - title: "Gradient Attribution for Spurious Detection"
        key_papers: ["Adebayo 2022 (109 cites)", "GAIA 2023 (16 cites)", "SPROD 2025 (4 cites)"]
        gap: "GAIA for OOD only, SPROD post-hoc, Adebayo shows attribution fails — we use abnormality not attribution"

  methodology:
    subsections:
      - title: "Detection Pipeline"
        algorithm: "GradCAM extraction → GAIA-Z computation (zero-deflation) → Welch's t-test"
        novelty: "First application of GAIA to minority groups within ID distribution"

      - title: "Causality Test"
        algorithm: "SegFormer background swap → paired t-test (original vs augmented GAIA-Z)"
        novelty: "Validates spurious conflict mechanism (Step 2 of causal chain)"

      - title: "Spatial Regularization"
        algorithm: "GradCAM difference map → percentile threshold → gradient variance penalty → adaptive λ scaling"
        novelty: "First gradient-based regularization for spurious mitigation (SCER uses embeddings)"

  experiments:
    design_rationale: "Synthetic validation proves code correctness + mechanism plausibility. PoC (MNIST) validates mitigation effectiveness. Real Waterbirds deferred (GPU incompatibility)."

    subsections:
      - experiment: "h-e1 (Detection)"
        setup: "5794 synthetic gradients (60% vs 30% near-zero rates), matching Waterbirds test set size"
        metrics: "GAIA-Z divergence, Welch's t-test, Cohen's d"

      - experiment: "h-m-integrated (Mechanism)"
        setup_1: "2 synthetic models (50%, 90% correlation), correlation-WGA-GAIA analysis"
        setup_2: "100 synthetic minority samples, background swap intervention"
        setup_3: "Minority accuracy check (≥60% threshold)"
        metrics: "Pearson ρ, paired t-test, classification accuracy"

      - experiment: "h-m-mitigate (Mitigation PoC)"
        setup: "MNIST+Color 10% subsample, 2 epochs, ERM vs Spatial Regularization"
        metrics: "WGA, average accuracy"

  results:
    presentation_order:
      - "h-e1: Divergence 0.30 (p<0.0001, d=198.75) — detection works"
      - "h-m-integrated Exp1: |ρ|=0.975 (p<0.001) — divergence correlates with WGA"
      - "h-m-integrated Exp2: 39.4% GAIA-Z reduction (p<0.001, d=2.96) — causality validated"
      - "h-m-integrated Exp3: 68% minority accuracy — GradCAM validity confirmed"
      - "h-m-mitigate: +23pp WGA (78% vs 55%), +1pp avg acc — mitigation effective on toy"

    interpretation_framework: "Synthetic validation proves methodology works (code correct, statistical tests valid). PoC proves mitigation feasible (toy dataset). Real validation pending infrastructure fix."

  discussion:
    subsections:
      - title: "Synthetic vs Real Validation Tradeoffs"
        argument: "Synthetic = unit test for hypothesis (isolates mechanism). Real = integration test (complex confounds). Synthetic proves pipeline CAN work; real proves hypothesis IS true."

      - title: "GPU Incompatibility Blocker"
        technical_detail: "PyTorch 2.0 supports sm_37-sm_86, not H100's sm_90. Requires PyTorch 2.1+ upgrade or CPU training (~70-90h)."

      - title: "MNIST Effectiveness Interpretation"
        hypothesis: "Toy dataset (color spurious) simpler than real (background). Full Waterbirds may show smaller improvement."

      - title: "Contribution Positioning"
        tier_3: "Methodology validated (detection + mitigation pipelines work)."
        tier_2_path: "Real Waterbirds experiments (detection + mitigation + GroupDRO comparison)."

  conclusion:
    summary_structure:
      - "Problem: Attribution fails for unknown spurious, methods require annotations"
      - "Approach: Gradient abnormality detection + spatial regularization"
      - "Validation: Synthetic experiments + MNIST PoC prove methodology"
      - "Limitations: Real validation pending (GPU fix + 70-90h experiments)"
      - "Future: Immediate (Waterbirds), Extensions (multi-dataset, joint regularization)"

    callback_to_hook: "We showed gradient abnormality CAN differentiate minority patterns when mechanism holds (synthetic validation). Next: does real data exhibit this mechanism? (Waterbirds pending)."

