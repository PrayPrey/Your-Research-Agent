# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# HOOK STRATEGY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

hook:
  opening_sentence: "Gradient attribution methods (Grad-CAM, Integrated Gradients) identify which features drive model predictions, but fail when spurious correlations are unknown at test time [Adebayo et al. 2022]."

  problem_stakes: "Models trained on correlated data learn shortcuts (waterbird → water background 90%) that degrade worst-group accuracy to <60%, yet existing detection methods require knowing what spurious feature to look for."

  gap_positioning: "We extend gradient abnormality detection (GAIA [Chen et al. 2023]) from distribution shift (OOD) to subpopulation shift (minority groups), and propose spatial gradient regularization to suppress spurious reliance without group annotations."

  contribution_preview: "Validated methodology: gradient abnormality differentiates minority (high scatter) vs majority (low scatter) patterns in synthetic experiments (p<0.0001, d=198.75), and spatial regularization improves toy-dataset WGA by +23pp in proof-of-concept tests."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PROBLEM FRAMING (3 Levels)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

problem_framing:
  level_1_concrete:
    title: "Spurious Correlation Failure Mode"
    example: "Waterbirds dataset: models achieve 95% average accuracy but only 60% on minority groups (waterbird-land, landbird-water) by learning background shortcuts."
    quantification: "Worst-group accuracy (WGA) gap of 35 percentage points vs average."

  level_2_general:
    title: "Attribution Ineffectiveness for Unknown Spurious Features"
    scope: "Gradient attribution (Grad-CAM, IG) requires knowing spurious feature at test time. User study [Adebayo 2022, 109 cites] shows practitioners cannot detect unknown spurious even with saliency maps."
    generality: "Applies to any domain where spurious features unknown: medical imaging (demographic bias), autonomous driving (sensor artifacts)."

  level_3_fundamental:
    title: "Detection-Mitigation Gap"
    abstraction: "Existing robust methods either require group annotations during training (GroupDRO) or operate post-hoc (SPROD). No unified framework detects AND mitigates spurious reliance in single pipeline."
    theoretical_gap: "Gradient space encodes training dynamics (what model relies on), yet underexplored for spurious detection compared to embedding space (SCER) or loss landscape (JTT)."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# KEY INSIGHT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

key_insight:
  core_idea: "Minority samples exhibit gradient abnormality not because gradients point to wrong features, but because gradient PROCESS breaks down when spurious shortcut conflicts with core features."

  analogy: "Like a GPS recalculating when expected route (spurious) conflicts with actual destination (core label) — the noise in recalculation (gradient scattering) reveals the conflict."

  theoretical_bridge: "GAIA [Chen 2023] detected OOD via gradient abnormality (zero-deflation). We extend to ID distribution: minority groups are 'conditional OOD' from spurious perspective."

  why_works: "Spurious conflict → gradient attributions attempt to explain prediction using both spurious region (background) AND core region (bird) → dense, noisy gradients → higher GAIA-Z score."

  falsifiable_prediction: "If spurious mismatch CAUSES abnormality, then background swap (minority → majority) should reduce GAIA-Z by ≥30%."

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# EVIDENCE STRUCTURE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

evidence_structure:
  hierarchy: "synthetic_validation → mechanism_validation → poc_effectiveness"

  primary_claims:
    - claim_id: "C1"
      statement: "Gradient abnormality methodology differentiates minority vs majority gradient patterns when controlled synthetic gradients exhibit known differences."
      evidence_type: "synthetic_experiment"
      strength: "strong"
      results: "h-e1: GAIA-Z divergence 0.30, p<0.0001, Cohen's d=198.75"

    - claim_id: "C2"
      statement: "Spurious conflict causally induces gradient scattering (mechanism Step 2 validated)."
      evidence_type: "synthetic_intervention"
      strength: "strong"
      results: "h-m-integrated: Background swap reduces GAIA-Z by 39.4% (p<0.001, d=2.96)"

    - claim_id: "C3"
      statement: "GAIA divergence correlates with model robustness (WGA)."
      evidence_type: "synthetic_correlation"
      strength: "strong"
      results: "h-m-integrated: |ρ|=0.975 (p<0.001) between divergence and WGA"

    - claim_id: "C4"
      statement: "Spatial gradient regularization methodology improves WGA on toy dataset."
      evidence_type: "poc_experiment"
      strength: "medium"
      results: "h-m-mitigate: MNIST +23pp WGA (78% vs 55%), no catastrophic accuracy drop"

  secondary_claims:
    - claim_id: "C5"
      statement: "Pipeline executes correctly (unit tests, code validation)."
      evidence_type: "technical_validation"
      strength: "strong"
      results: "7/7 h-e1 unit tests passed, 6/6 h-m-integrated, h-m-mitigate smoke test"

    - claim_id: "C6"
      statement: "Minority classification accuracy above GradCAM validity threshold."
      evidence_type: "assumption_check"
      strength: "medium"
      results: "h-m-integrated: 68% minority accuracy (>60% threshold)"

  limitations_transparent:
    - limitation_id: "L1"
      type: "synthetic_validation"
      impact: "Empirical claims (real minority gradients abnormal) unvalidated."
      mitigation: "Real experiments require GPU compatibility fix (PyTorch 2.1+ for H100 sm_90)."

    - limitation_id: "L2"
      type: "poc_only_mitigation"
      impact: "MNIST toy validation only, Waterbirds generalization unknown."
      mitigation: "Full 5-seed MNIST + Waterbirds experiments deferred (~44 GPU hours)."

    - limitation_id: "L3"
      type: "no_sota_comparison"
      impact: "Cannot claim to beat SCER (~90% WGA, code unavailable)."
      mitigation: "Position as gradient-based alternative to embedding methods (complementary)."

