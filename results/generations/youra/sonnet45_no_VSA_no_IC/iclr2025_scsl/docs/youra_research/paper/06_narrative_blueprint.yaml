  reproducibility:
    - "All hyperparameters in tables (lr, epochs, batch size, λ_init, percentile)"
    - "Seed specified (42 for all experiments)"
    - "Statistical tests named (Welch's t-test, Pearson correlation, paired t-test)"
    - "Code release plan (GitHub repo with synthetic validation, real experiments when complete)"

