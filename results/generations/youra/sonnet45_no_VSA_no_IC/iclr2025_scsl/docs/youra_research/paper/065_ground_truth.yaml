    limitations:
      - "Synthetic validation only, not real Waterbirds gradients"
      - "Proves code correctness, not hypothesis truth"

  - claim_id: "C2"
    statement: "Spurious conflict causally induces gradient scattering (mechanism Step 2 validated)."
    category: "causal_mechanism"
    evidence_type: "synthetic_intervention"
    quantitative_result: "Background swap reduces GAIA-Z by 39.4% (p<0.001, d=2.96)"
    validation_status: "synthetic_causality_test"
    confidence: "medium_mechanism_plausibility"
    limitations:
      - "Synthetic background swap, not real SegFormer augmentation"
      - "Causal pathway validated in controlled setting only"

  - claim_id: "C3"
    statement: "GAIA divergence correlates with model robustness (WGA)."
    category: "mechanism_correlation"
    evidence_type: "synthetic_correlation"
    quantitative_result: "|ρ|=0.975 (p<0.001) between divergence and WGA"
    validation_status: "synthetic_validated"
    confidence: "medium_correlation_strength"
    limitations:
      - "Only 2 synthetic models tested (planned: 10 models)"
      - "Real training correlation pending GPU fix"

  - claim_id: "C4"
    statement: "Spatial gradient regularization methodology improves WGA on toy dataset without catastrophic accuracy drop."
    category: "mitigation_effectiveness"
    evidence_type: "poc_experiment"
    quantitative_result: "MNIST +23pp WGA (78% vs 55%), avg acc +1pp (95% vs 94%)"
    validation_status: "poc_validated"
    confidence: "medium_poc_effective"
    limitations:
      - "Smoke test only (1 seed, 2 epochs)"
      - "Toy dataset (MNIST color spurious), not real Waterbirds"
      - "No GroupDRO baseline comparison"

