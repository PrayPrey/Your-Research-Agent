core_claims:
  - claim_id: "C1"
    statement: "Gradient abnormality pipeline (GradCAM → GAIA-Z → statistical testing) differentiates minority vs majority gradient patterns when synthetic gradients exhibit controlled near-zero rate differences."
    category: "detection_methodology"
    evidence_type: "synthetic_experiment"
    quantitative_result: "GAIA-Z divergence 0.30, p<0.0001, Cohen's d=198.75"
    validation_status: "synthetic_validated"
