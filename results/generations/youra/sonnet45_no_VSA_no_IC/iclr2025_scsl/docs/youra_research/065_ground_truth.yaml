# FUTURE VALIDATION ROADMAP (For Tier 2 Upgrade)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

future_validation_roadmap:
  immediate:
    - task: "PyTorch 2.1+ upgrade for H100 sm_90 support"
      estimated_time: "1-2 days (dependency testing)"
      blocker: "CUDA toolkit upgrade (11.8 → 12.1+), pytorch-grad-cam compatibility check"

    - task: "h-e1 real Waterbirds detection"
      estimated_time: "10-15 hours (300 epochs ResNet-50, H100)"
      expected_result: "GAIA divergence ≥0.2 on real gradients (if hypothesis holds)"
      fallback: "If divergence <0.1 → gradient abnormality hypothesis false, pivot to detection-only or abandon"

    - task: "h-m-integrated real Waterbirds mechanism"
      estimated_time: "20-30 hours (2 models × 100 epochs + augmentation pipeline)"
      expected_result: "Real augmentation reduces GAIA-Z by ≥30%, |ρ|>0.7 correlation"
      fallback: "If fails → mechanism doesn't generalize to real data"

    - task: "h-m-mitigate full MNIST (5 seeds × 50 epochs)"
      estimated_time: "4 hours (H100)"
      expected_result: "WGA improvement 15-20pp (smaller than smoke test, still >10% threshold)"
      fallback: "If <5% → smoke test was outlier, methodology weaker than expected"

  tier2_validation:
    - task: "Waterbirds full experiment + GroupDRO baseline"
      estimated_time: "40 hours (hyperparameter search + 3 methods × 5 seeds × 300 epochs)"
      expected_result: "WGA ≥ GroupDRO+5% (competitive), avg acc drop ≤2%"
      fallback: "If WGA <GroupDRO → detection-only contribution (Tier 3)"

    - task: "Multi-dataset generalization (CelebA, UrbanCars)"
      estimated_time: "60 hours (2 datasets × 30h each)"
      expected_result: "GAIA divergence ≥0.15 on 2/3 datasets → general approach"
      fallback: "If 1/3 → Waterbirds-specific, limits applicability"

  tier1_validation_blocked:
    - task: "SCER reproduction for comparison"
      blocker: "Code unavailable (Park et al. 2025 arXiv:2511.04401)"
      status: "UNLIKELY without code release"

