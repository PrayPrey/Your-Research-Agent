# CONTRIBUTION POSITIONING (Reviewers Should Assess Against This)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

contribution_positioning:
  current_tier: "tier3_methodology"
  tier3_justification: "Pipeline correctness validated (synthetic + PoC). Code paths work, statistical tests accurate, mechanism plausible. Empirical claims pending."

  tier2_requirements:
    - "Real Waterbirds detection results (GAIA divergence on real gradients ≥0.2, p<0.01)"
    - "Real Waterbirds mitigation results (WGA ≥ GroupDRO+5% OR competitive performance)"
    - "Multi-dataset generalization (CelebA, UrbanCars)"
    - "Full statistical rigor (5-seed experiments, bootstrap significance tests)"

  tier1_requirements:
    - "Beat current SOTA (~90% WGA, SCER estimated)"
    - "Requires SCER reproduction (code unavailable) OR new SOTA baseline"
    - status: "UNLIKELY without SCER code"

  acceptable_critique_targets:
    - "Synthetic validation scope (real validation pending)"
    - "PoC-only mitigation (toy dataset, no Waterbirds)"
    - "No GroupDRO comparison (competitive positioning unknown)"
    - "Single-seed smoke test (no statistical significance)"
    - "SCER code unavailable (cannot claim Tier 1)"

  unacceptable_critique_targets:
    - "Pipeline correctness (7/7 unit tests passed, synthetic validation successful)"
    - "Statistical methodology (gate logic validated, effect sizes correct)"
    - "Code implementation (modular, reproducible, config-driven)"
    - "Transparency (limitations explicitly acknowledged in paper)"

