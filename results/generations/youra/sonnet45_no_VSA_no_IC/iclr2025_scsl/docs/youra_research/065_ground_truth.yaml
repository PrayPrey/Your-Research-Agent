# ADVERSARIAL REVIEW INSTRUCTIONS (Phase 6.5)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

adversarial_review_instructions:
  scope: "Methodology paper (Tier 3 contribution: pipeline correctness validated)"

  accept_if:
    - "Synthetic validation proves pipeline works (code correct, statistical tests valid)"
    - "PoC mitigation demonstrates methodology feasible (MNIST smoke test)"
    - "Transparency: limitations explicitly acknowledged (synthetic-only, PoC scope)"
    - "Clear path to empirical validation (GPU fix + 70-90h experiments)"
    - "Novelty: first gradient abnormality for minority detection, first spatial gradient regularization"

  reject_if:
    - "Paper claims real Waterbirds effectiveness without empirical validation"
    - "Paper claims Tier 1 (SOTA) without SCER comparison"
    - "Paper hides synthetic validation scope (title/abstract misleading)"
    - "Code implementation fundamentally flawed (unit tests failed)"
    - "Statistical methodology incorrect (gate logic errors)"

  major_revision_if:
    - "Contribution positioning unclear (detection vs mitigation vs unified)"
    - "Synthetic validation rationale insufficient (why not just run real experiments?)"
    - "PoC scope not clearly distinguished from full experiments"
    - "GPU blocker explanation missing or unconvincing"

  minor_revision_if:
    - "Writing clarity issues (synthetic validation qualifiers missing in some sections)"
    - "Figure/table captions incomplete"
    - "Related work missing key citations"
    - "Code availability statement unclear"

  questions_to_ask:
    - "What does synthetic validation actually prove? (Answer: methodology correctness, not empirical claims)"
    - "Why PoC instead of full MNIST? (Answer: Phase 4 focus methodology validation, not benchmarking)"
    - "Why not fix GPU before submission? (Answer: PyTorch upgrade risk + time constraints)"
    - "Can you claim Tier 2 without real validation? (Answer: No, positioned as Tier 3 methodology)"
    - "What if real validation fails? (Answer: Pivot to detection-only or abandon approach)"
