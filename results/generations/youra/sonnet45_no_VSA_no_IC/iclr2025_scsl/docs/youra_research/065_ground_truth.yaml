# ACKNOWLEDGED LIMITATIONS (Transparent in Paper)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

limitations:
  - id: "L1"
    title: "Synthetic Validation Only (h-e1, h-m-integrated)"
    description: "All detection and mechanism validation uses controlled synthetic data, not real Waterbirds gradients."
    impact: "Empirical claims (real minority gradients abnormal) unvalidated."
    mitigation: "PyTorch 2.1+ upgrade for H100 sm_90 support OR CPU training (~30-50h)."
    transparency_in_paper: "Title/abstract/results explicitly state 'synthetic validation'."

  - id: "L2"
    title: "PoC-Only Mitigation (h-m-mitigate)"
    description: "MNIST toy validation only (2 epochs, 10% data, 1 seed), no Waterbirds."
    impact: "Toy dataset effectiveness may not generalize to complex spurious features."
    mitigation: "Full MNIST (5 seeds × 50 epochs, 4h) + Waterbirds full experiment (40h)."
    transparency_in_paper: "Results section labels MNIST as 'proof-of-concept' with scope caveats."

  - id: "L3"
    title: "No GroupDRO Baseline Comparison"
    description: "Cannot claim competitive WGA without direct comparison."
    impact: "Mitigation competitive positioning unknown."
    mitigation: "Waterbirds 3-method comparison (ERM, GroupDRO, Spatial Reg)."
    transparency_in_paper: "Discussion Section 6.6 explicitly states no baseline comparison."

  - id: "L4"
    title: "Single-Seed PoC (h-m-mitigate)"
    description: "No statistical significance testing (bootstrap requires 5+ seeds)."
    impact: "Smoke test shows methodology works, robustness across seeds unknown."
    mitigation: "Full MNIST 5-seed experiment (~4 hours)."
    transparency_in_paper: "Results section notes '1 seed, 2 epochs' with no significance test."

  - id: "L5"
    title: "GradCAM Validity Assumption (A1) Untested on Real Data"
    description: "Synthetic minority accuracy 68%, real unknown."
    impact: "If real minority accuracy <60%, spatial masking may fail."
    mitigation: "Empirical check in real Waterbirds training, fallback to global regularization."
    transparency_in_paper: "Methodology section lists A1 as key assumption requiring validation."

  - id: "L6"
    title: "Hyperparameter Sensitivity (λ_init, percentile)"
    description: "Optimal hyperparameters dataset-dependent."
    impact: "No universal defaults, requires 3×3 grid search."
    mitigation: "Adaptive lambda scaling reduces sensitivity (implemented)."
    transparency_in_paper: "Discussion Section 6.6 notes L6 with planned hyperparameter search."

  - id: "L7"
    title: "SCER Baseline Unavailable"
    description: "Cannot reproduce SCER (~90% WGA estimated) for comparison."
    impact: "Cannot claim to beat SOTA."
    mitigation: "Position as Tier 2 'gradient-based alternative to embedding methods'."
    transparency_in_paper: "Discussion Section 6.6 explicitly states SCER code unavailable."

