experimental_setup:
  dataset:
    name: "Waterbirds (primary), MNIST+Color (toy validation), CelebA (generalization)"
    type: "standard (Waterbirds, CelebA), synthetic (MNIST+Color)"
    source: "Waterbirds via Wilds benchmark (pip install wilds), MNIST via torchvision, CelebA via Wilds"
    path: "Waterbirds: wilds.get_dataset('waterbirds'), MNIST: torchvision.datasets.MNIST, CelebA: wilds.get_dataset('celebA')"
    hypothesis_fit: "Waterbirds: canonical spurious correlation benchmark (background-class), 4 groups (2 majority, 2 minority), group annotations for evaluation. MNIST+Color: controlled spurious (color), known ground truth for validation. CelebA: different spurious type (gender), tests generalization."
  model:
    name: "ResNet-50 (Waterbirds, CelebA), ResNet-18 (MNIST toy)"
    type: "Standard CNN backbone"
    source: "torchvision.models.resnet50(pretrained=True) for Waterbirds/CelebA, torchvision.models.resnet18() for MNIST"
    hypothesis_fit: "ResNet standard for Waterbirds/CelebA evaluation (all baselines use it). Enables direct comparison to GroupDRO, JTT, SPROD results."
  baselines:
    - name: "GroupDRO"
      method: "Distributionally robust optimization, minimizes worst-group loss. Requires group annotations during training."
      source: "github.com/kohpangwei/group_DRO (294 stars)"
      performance: "Waterbirds WGA ~85-88% (from Sagawa et al. 2020)"
    - name: "JTT (Just Train Twice)"
      method: "Two-stage: identify misclassified samples in stage 1, upsample in stage 2. No group annotations during training."
      source: "github.com/anniesch/jtt (72 stars)"
      performance: "Waterbirds WGA ~88% (from Liu et al. 2021)"
    - name: "SCER (Embedding Regularization)"
      method: "Regularizes embedding space to suppress spurious features. Theoretical WGA bounds."
      source: "arXiv:2511.04401 (Park et al. 2025) — code NOT available"
      performance: "Estimated WGA ~90% from paper (cannot reproduce directly)"

