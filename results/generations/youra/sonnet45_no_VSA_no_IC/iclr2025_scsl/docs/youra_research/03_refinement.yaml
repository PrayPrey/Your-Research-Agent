novelty:
  preserved_novelty: "First application of gradient abnormality (GAIA framework) to minority group detection within ID distribution. First gradient-based regularization for spurious mitigation. Automatic spurious localization via GradCAM difference maps without feature engineering."
  key_innovation: "Extends GAIA from distribution shift (ID vs OOD) to subpopulation shift (majority vs minority). Spatial masking discovers spurious regions automatically by comparing majority/minority gradient patterns. Unified framework: same abnormality mechanism for both OOD and spurious detection."
  differentiation:
    - prior_work: "Adebayo 2022 — Gradient attribution fails for unknown spurious"
      difference: "We use gradient ABNORMALITY (process disruption), not gradient ATTRIBUTION (result interpretation). GAIA-style metrics detect minority groups without knowing spurious feature."
    - prior_work: "GAIA 2023 — Gradient abnormality for OOD detection"
      difference: "We extend to subpopulation shift (minority groups) within ID distribution. Add mitigation (spatial regularization), not just detection."
    - prior_work: "SPROD 2025 — Prototype refinement for SP-OOD detection"
      difference: "We operate on gradient space (not prototype space). Provide mitigation (regularization), not just detection. Complementary approaches."
    - prior_work: "SCER 2025 — Embedding regularization for WGA"
      difference: "We operate on gradient space (not embedding space). Spatial masking via GradCAM (not embedding constraints). Complementary intervention points."
    - prior_work: "GroupDRO, JTT — Robust learning methods"
      difference: "GroupDRO requires group annotations. JTT two-stage, we single-stage. We provide diagnostic (gradient abnormality) + mitigation."

