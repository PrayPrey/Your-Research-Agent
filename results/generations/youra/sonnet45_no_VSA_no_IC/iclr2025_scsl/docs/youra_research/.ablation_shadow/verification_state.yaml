main_hypothesis:
  id: H-GradAbn-v1
  title: Gradient Abnormality Detection and Spatial Regularization for Spurious Correlation Mitigation
  statement: Under deep neural networks trained on datasets with spurious correlations (e.g., Waterbirds with 90% background-class
    correlation), if we compute gradient abnormality metrics (GAIA zero-deflation, channel-wise variance) for test samples,
    then minority group samples (waterbird-land, landbird-water) will exhibit significantly higher abnormality scores than
    majority group samples (waterbird-water, landbird-land), because spurious reliance creates gradient scattering when the
    spurious shortcut conflicts with core features in minority samples.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Waterbirds (primary), MNIST+Color (toy), CelebA (generalization)
    model: ResNet-50 (Waterbirds/CelebA), ResNet-18 (MNIST toy)
    optimizer: SGD
    hyperparameters:
      lr: 0.001
      batch_size: 128
      epochs: 100
      seeds: 3
