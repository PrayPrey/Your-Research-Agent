# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FeedbackEfficiency-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under small model capacity constraints (350M-1B parameters) and existing code generation benchmarks (HumanEval, MBPP),
    if we train models with execution feedback at varying granularity levels (binary pass/fail, error-type vocabulary, error+stack-trace),
    then lightweight feedback (binary or error-type) achieves ≥80% relative retention of rich feedback gains AND ≥8 pp absolute improvement over supervised fine-tuning baseline,
    because small models have limited representational capacity to utilize high-dimensional supervision signals, and lower-granularity feedback provides concentrated, noise-reduced learning signals.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@1 performance between models trained with binary feedback versus error-type feedback versus error+stack-trace feedback, controlling for training compute and model capacity.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Feedback Granularity Level"
      type: "categorical"
      operationalization: "Three levels: (1) Binary pass/fail only, (2) Error-type vocabulary (top-5 Python exceptions), (3) Error-type + stack trace depth"
      levels: ["binary", "error_type", "error_trace"]
    - name: "Model Size"
      type: "categorical"
      operationalization: "Two model capacities: 350M parameters and 1B parameters"
      levels: ["350M", "1B"]
    - name: "Benchmark Type"
      type: "categorical"
      operationalization: "HumanEval (algorithm-focused, 164 problems) vs MBPP (entry-level, 974 problems)"
      levels: ["HumanEval", "MBPP"]
  dependent:
    - name: "Pass@1 Improvement"
      type: "continuous"
      operationalization: "Percentage point improvement over SFT baseline (e.g., 40% → 48% = +8 pp)"
      primary: true
    - name: "Feedback Efficiency"
      type: "continuous"
      operationalization: "Pass@1 improvement divided by bits-per-problem (pp gain / bits). Example: +8 pp with 1 bit/prob = 8 gain/bit"
      primary: false
    - name: "Pass@10 Improvement"
      type: "continuous"
      operationalization: "Percentage point improvement in pass@10 metric (at least 1 of 10 samples passes)"
      primary: false
  controlled:
    - name: "Training Compute Budget"
      operationalization: "Fixed 3-5 GPU-hours per model run on A100 40GB"
    - name: "Error Distribution"
      operationalization: "Natural error distribution from baseline model generations (no synthetic balancing)"
    - name: "Evaluation Harness"
      operationalization: "BigCode evaluation harness for deterministic test execution"
    - name: "Base Model"
      operationalization: "Same pretrained checkpoint for all conditions (e.g., CodeGen-350M-mono, StarCoder-1B)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Small models have limited representational capacity to compress high-dimensional feedback (e.g., full stack traces with file/line/context) into actionable gradients during training."
      evidence: "McAndrews 2026 shows execution feedback >> pipeline complexity for 1-3B models. CoCoS and RLVR studies use simpler reward signals (accumulated trajectory, unit test outcomes) for <1B models, not variable-level traces."
      falsifier: "If 350M and 1B models show HIGHER efficiency (gain-per-bit) with error+trace vs binary feedback, capacity limits do not constrain high-dimensional signal utilization."
    - step: 2
      description: "Low-granularity feedback (binary pass/fail, error-type only) concentrates supervision signal into fewer dimensions, reducing noise-to-signal ratio in gradient updates."
      evidence: "Information-theoretic argument: Binary feedback (1 bit/prob) forces model to extract maximum information from each bit. Error-type (2.3 bits) adds semantic categories but not overwhelming detail. Trace (5.6 bits) may introduce irrelevant file path / line number noise."
      falsifier: "If all three feedback types show statistically identical performance when controlling for information budget (bits-per-problem), granularity is irrelevant — only total information matters."
    - step: 3
      description: "Benchmark test coverage quality moderates feedback granularity requirements: comprehensive tests (HumanEval) enable binary sufficiency, weaker coverage (MBPP) benefits from error-type semantic hints."
      evidence: "EvalPlus demonstrated HumanEval tests are insufficient (80× expansion needed). If MBPP has even weaker coverage (measured via branch %), error types provide proxy for 'what test would have caught this' signal."
      falsifier: "If measured test coverage for HumanEval and MBPP differs by <10% branch coverage, OR coverage does not correlate (r < 0.4) with feedback-type advantage, test coverage hypothesis is not causal."
  key_tension: "Information density vs noise tradeoff — richer feedback provides more bits but may exceed small model capacity to extract useful gradients, resulting in noisy learning. Finding optimal granularity requires empirical efficiency frontier."
  evidence_summary: |
    Step 1: Capacity limits supported by small model literature (CoCoS, RLVR use simple rewards).
    Step 2: Information-theoretic concentration principle (fewer dims = less noise) is theoretical, requires empirical validation.
    Step 3: Test coverage causation is hypothesized from EvalPlus but NOT directly validated — P3 addresses this via coverage measurement.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Natural error distributions (as generated by baseline models) are representative of deployment error patterns"
    supporting_evidence: "Baseline models (SFT on code corpora) generate realistic code with realistic failure modes. Frequency analysis on 1000 samples can validate representativeness."
    consequence_if_violated: "If deployment errors differ significantly from training errors (e.g., rare edge cases dominate production), feedback granularity optimized for training distribution may underperform in practice."
  - id: "A2"
    assumption: "Bits-per-problem is a valid proxy for information content in feedback signals"
    supporting_evidence: "Information theory: entropy of categorical distribution = log₂(vocabulary size). Error-type vocabulary of 5 ≈ 2.3 bits. Stack trace adds depth buckets (10 levels) ≈ 3.3 bits."
    consequence_if_violated: "If semantic meaning (not entropy) drives learning, bit-counting is misleading. For example, 1 bit of 'error vs correct' may carry more semantic value than 3 bits of 'stack trace depth'."
  - id: "A3"
    assumption: "Branch coverage is a valid proxy for test suite quality"
    supporting_evidence: "Standard software engineering metric. Higher branch coverage generally indicates more thorough testing of code paths."
    consequence_if_violated: "If semantic test quality (edge case detection, assertion diversity) matters more than coverage percentage, branch coverage won't explain feedback-type advantages. Would need additional metrics (mutation testing, assertion types)."
  - id: "A4"
    assumption: "SFT baseline represents 'no execution feedback' condition fairly"
    supporting_evidence: "SFT trains on (problem description, reference solution) pairs without test outcomes. Standard baseline in code generation literature (CodeRL, CoCoS, RLVR all use SFT as baseline)."
    consequence_if_violated: "If SFT implicitly learns execution patterns from training corpus (e.g., common error patterns in code comments), baseline may already contain weak execution feedback signal, compressing observed gains."
  - id: "A5"
    assumption: "Model capacity saturation does not occur on HumanEval/MBPP for 350M-1B models"
    supporting_evidence: "Current SOTA on MBPP for 1B models ~60-70% (from CoCoS, RLVR papers), leaving headroom. HumanEval harder, more headroom."
    consequence_if_violated: "If 1B models hit ~70% ceiling on MBPP regardless of feedback type, ceiling effects obscure feedback differences. Mitigation: use HumanEval Pro (harder benchmark) if saturation observed."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Small language models (350M-1B parameters)
    - Python code generation tasks
    - Algorithm-focused benchmarks (HumanEval-style) and entry-level benchmarks (MBPP-style)
    - Execution feedback from unit test outcomes (pass/fail, error messages, stack traces)
    - Single-GPU training budgets (A100 40GB, 3-5 hours per run)
  does_not_apply_to: |
    - Large models (>3B parameters) — capacity constraints may not bind
    - Non-Python domains (SQL, shell scripts, etc.) — error type taxonomies differ
    - Benchmarks without executable test suites (natural language to pseudocode)
    - Production deployment with real-time feedback constraints (study assumes batch training)
    - Extremely small models (<100M parameters) — may lack basic code generation capability
  known_limitations: |
    - Test coverage measurement via branch coverage is a proxy, not a complete metric of test quality
    - Natural error distributions may be skewed toward frequent errors (TypeError), undertrained rare types
    - 2-size validation (350M, 1B) may miss phase transitions at other scales (e.g., 150M, 500M)
    - Single-benchmark evaluation per model run (no multi-task training tested)
    - No compositional feedback (combining multiple granularity types simultaneously)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Binary feedback achieves dual-threshold sufficiency: ≥8 pp absolute improvement over SFT baseline AND ≥80% relative retention of error-type feedback gains on HumanEval"
    test_method: "Train 350M and 1B models with binary vs error-type feedback on HumanEval. Measure pass@1. Check: (binary - SFT) ≥ 8 pp AND (binary - SFT) / (error-type - SFT) ≥ 0.8"
    success_criterion: "Both conditions met: Absolute ≥8 pp AND Relative ≥80%. Example: SFT=40%, error-type=52% (+12 pp), binary must achieve ≥48% (+8 pp absolute) AND ≥49.6% (+9.6 pp = 80% of 12 pp)"
    falsification: "Binary achieves <48% absolute (below absolute floor) OR <80% relative retention (below retention threshold)"
  - id: "P2"
    primary: false
    statement: "Feedback efficiency (pass@1 improvement per bit) decreases with granularity: Binary > Error-type > Error+trace"
    test_method: "Compute efficiency = (pass@1 - SFT baseline) / bits-per-problem for each feedback type. Binary uses 1 bit, error-type 2.3 bits, error+trace 5.6 bits"
    success_criterion: "Efficiency ranking holds: Binary ≥ 7 pp/bit, Error-type = 4-6 pp/bit, Error+trace = 2-3 pp/bit (monotonic decrease confirms diminishing returns)"
    falsification: "Ranking violated (e.g., error+trace shows higher efficiency than binary) OR efficiencies statistically indistinguishable (no diminishing returns)"
  - id: "P3"
    primary: false
    statement: "Test coverage differences between HumanEval and MBPP explain ≥60% of variance in feedback-type advantage (error-type gain over binary)"
    test_method: "Measure branch coverage for all HumanEval and MBPP problems using coverage.py. Compute per-problem (error-type gain - binary gain). Correlate with coverage score. R² ≥ 0.6 indicates coverage explains variance"
    success_criterion: "Pearson correlation r ≥ 0.77 (R² ≥ 0.6) between problem-level coverage and feedback-type advantage"
    falsification: "Correlation r < 0.63 (R² < 0.4) OR HumanEval and MBPP coverage differ by <10 pp on average (insufficient variance to test hypothesis)"

