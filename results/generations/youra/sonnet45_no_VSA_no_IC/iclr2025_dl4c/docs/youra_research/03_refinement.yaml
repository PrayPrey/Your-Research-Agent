# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "HumanEval + MBPP"
    type: "standard"
    source: "HumanEval: OpenAI (Austin et al. 2021, 164 problems). MBPP: Google (974 problems)"
    path: "HumanEval: https://github.com/openai/human-eval | MBPP: https://github.com/google-research/google-research/tree/master/mbpp"
    hypothesis_fit: "HumanEval provides algorithm-focused problems with comprehensive test suites (hypothesized to enable binary feedback sufficiency). MBPP provides entry-level problems with weaker test coverage (hypothesized to benefit from error-type feedback). Testing both benchmarks validates coverage-granularity hypothesis."
  model:
    name: "CodeGen-350M-mono + StarCoder-1B (or similar small code LLMs)"
    type: "Pretrained code generation models"
    source: "CodeGen (Salesforce), StarCoder (BigCode), or phi-2 (Microsoft) — publicly available"
    hypothesis_fit: "350M and 1B parameter models fit 'small model' scope. Both sizes avoid capacity saturation on MBPP (current SOTA ~60-70% for 1B) while testing non-linear capacity-feedback relationship."
  baselines:
    - name: "Supervised Fine-Tuning (SFT)"
      method: "Train on (problem description, reference solution) pairs without execution feedback. Standard baseline in code LLM alignment."
    - name: "Error-Type Feedback"
      method: "Train with execution outcomes + top-5 Python exception types (TypeError, NameError, IndexError, ValueError, AttributeError) identified via frequency×impact analysis on baseline model generations."
    - name: "Error+Trace Feedback"
      method: "Train with execution outcomes + error types + stack trace depth buckets (10 levels: 0-1 frames, 2-3, ... 18-20+). Tests upper bound of granularity."

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Establishes execution feedback granularity as an efficiency optimization problem (gain-per-bit) rather than a capability maximization problem (richest signal available). No prior work systematically studies granularity tradeoffs for small models <1B parameters."
  key_innovation: "Dual-threshold evaluation (absolute + relative gain) prevents weak-but-technically-sufficient results. Efficiency metric (pp-gain / bits-per-problem) provides new lens for comparing alignment methods beyond raw performance. Causal test of coverage-granularity relationship via measured branch coverage (not assumed)."
  differentiation:
    - prior_work: "CodeRL+ (Jiang et al. 2025) - Variable-level execution semantics for alignment"
      difference: "CodeRL+ focuses on RICHER feedback (variable traces) for larger models. This work explores MINIMAL sufficient feedback for small models, opposite direction."
    - prior_work: "CoCoS (Cho et al. 2025) - 1B model self-correction with RL + execution feedback"
      difference: "CoCoS uses accumulated trajectory rewards (opaque about granularity). This work explicitly ablates granularity levels (binary, error-type, trace) and measures efficiency."
    - prior_work: "Feedback Over Form (McAndrews 2026) - Execution feedback >> pipeline complexity at 1-3B scale"
      difference: "McAndrews compares feedback vs NO feedback. This work assumes feedback is valuable, asks WHICH feedback granularity is optimal. Complements rather than contradicts."

