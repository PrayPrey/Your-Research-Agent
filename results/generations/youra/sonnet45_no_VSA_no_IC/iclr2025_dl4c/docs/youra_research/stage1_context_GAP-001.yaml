gap_id: GAP-001
gap_title: Optimal Execution Feedback Granularity for Small Models
gap_description: |
  Multiple papers explore execution feedback (CodeRL+, CoCoS, DebugRepair), but granularity varies:
  binary pass/fail (CodeRL), variable-level traces (CodeRL+), runtime evidence (DebugRepair).
  No systematic study on optimal granularity for <1B models.

  Missing: Empirical comparison of feedback granularity (pass/fail only vs + error messages
  vs + stack traces vs + variable traces) specifically for lightweight models (<1B params)
  on HumanEval/MBPP.

  Potential Impact: Could determine minimal sufficient feedback signal for small model alignment,
  reducing infrastructure complexity while maintaining effectiveness.

