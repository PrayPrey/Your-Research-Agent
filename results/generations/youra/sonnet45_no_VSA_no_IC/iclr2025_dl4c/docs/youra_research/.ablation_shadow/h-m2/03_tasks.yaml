implementation:
- architecture_ref: Section 3.1
  complexity: 8
  config_ref: Section 5.1
  dependencies:
  - DATA-3
  description: Create dynamics_logger.py with DynamicsLogger class (batch logging,
    epoch logging, JSON persistence, schema validation)
  estimated_time: 2h
  id: EPIC-A1
  logic_ref: Algorithm A-4
  subtasks:
  - A1-1: DynamicsLogger class skeleton with __init__, data schema
  - A1-2: log_batch() method with metrics validation
  - A1-3: log_epoch() method with current_epoch flush
  - A1-4: save() method with atomic JSON write + error handling
  title: Implement DynamicsLogger module
  type: epic
  validation:
  - Unit test: log_batch accumulates metrics
  - Unit test: log_epoch triggers save
  - Unit test: JSON schema matches spec
  - Edge case: IOError handled gracefully
- architecture_ref: Section 3.3
  complexity: 6
  dependencies:
  - DATA-3
  description: Add compute_gradient_variance() and compute_gradient_norm() functions
    to train.py
  estimated_time: 1.5h
  id: EPIC-A2
  logic_ref: Algorithm A-1
  subtasks:
  - A2-1: compute_gradient_variance(model) with param.grad.std() aggregation
  - A2-2: compute_gradient_norm(model) with L2 norm computation
  - A2-3: Handle None gradients (return -1.0 sentinel)
  title: Implement gradient variance and norm computation
  type: epic
  validation:
  - Unit test: synthetic tensors match manual calculation
  - Unit test: None gradients return -1.0
  - Unit test: LoRA-only parameters filtered correctly
- architecture_ref: Section 3.2
  complexity: 10
  config_ref: Section 4
  dependencies:
  - DATA-3
  description: Create rewards.py with compute_error_trace_reward(), stack depth parsing,
    bucket mapping
  estimated_time: 2.5h
  id: EPIC-A3
  logic_ref: Algorithm A-2
  subtasks:
  - A3-1: parse_stack_depth(traceback) with line count extraction
  - A3-2: Bucket mapping with bisect.bisect_right() (10 buckets)
  - A3-3: compute_error_trace_reward() with error_type (2.3b) + depth (3.3b) components
  - A3-4: Integration test with sandbox ExecutionResult
  title: Implement error+trace reward function
  type: epic
  validation:
  - Unit test: all rewards in [0.0, 1.0]
  - Unit test: traceback=None → depth=0
  - Unit test: unknown error_type → error_reward=0.0
  - Integration test: real HumanEval problem execution
- architecture_ref: Section 3.3
  complexity: 12
  dependencies:
  - EPIC-A1
  - EPIC-A2
  description: Create GRPOTrainerWithDynamics subclass in train.py with hooks in training_step()
    and evaluation_loop()
  estimated_time: 3h
  id: EPIC-A4
  logic_ref: Algorithm A-4
  subtasks:
  - A4-1: GRPOTrainerWithDynamics class skeleton with dynamics_logger parameter
  - A4-2: Override training_step() to inject gradient variance logging after backward()
  - A4-3: Override evaluation_loop() to add per-epoch HumanEval evaluation
  - A4-4: 'Integration test: training loop with dynamics logging enabled'
  title: Extend GRPOTrainer with dynamics logging hooks
  type: epic
  validation:
  - Training completes without crashes
  - Dynamics JSON updated after each epoch
  - Gradient variance logged every batch
  - Eval metrics logged every epoch
- architecture_ref: Section 5
  complexity: 7
  config_ref: Section 3
  dependencies:
  - DATA-3
  description: Generate binary_350m.yaml, binary_1b.yaml, error_type_350m.yaml, error_type_1b.yaml,
    error_trace_350m.yaml, error_trace_1b.yaml
  estimated_time: 1.5h
  id: EPIC-A5
  subtasks:
