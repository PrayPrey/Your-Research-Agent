main_hypothesis:
  id: H-FeedbackEfficiency-v1
  title: Feedback Granularity Efficiency Frontier for Small Code LLMs
  statement: Under small model capacity constraints (350M-1B parameters), lightweight feedback signals (binary pass/fail or
    error-type vocabulary) achieve ≥80% of the performance gains from richer feedback (error messages + stack traces) while
    using 2-10× fewer information bits per training example, because small models have limited representational capacity to
    utilize high-dimensional supervision signals.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval + MBPP
    model: CodeGen-350M-mono + StarCoder-1B
    optimizer: Adam
    hyperparameters:
      training_compute: 3-5 GPU-hours per run on A100 40GB
      error_distribution: Natural (from baseline generations)
      evaluation_harness: BigCode
      base_checkpoint: Same pretrained for all conditions
