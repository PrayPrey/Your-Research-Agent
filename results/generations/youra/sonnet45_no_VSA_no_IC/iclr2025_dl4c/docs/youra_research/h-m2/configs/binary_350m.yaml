# h-m2: Binary Feedback Dynamics (350M)

experiment_id: h-m2_binary_350m
feedback_type: binary

model:
  name: Salesforce/codegen-350M-mono
  lora_r: 16
  lora_alpha: 32
  precision: fp16

training:
  algorithm: grpo
  epochs: 5
  batch_size: 4
  samples_per_problem: 4
  learning_rate: 2.0e-7
  kl_penalty: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  steps: 50
  log_interval: 50
  save_interval: 100

logging:
  dynamics_log: logs/binary_350m_dynamics.json
  checkpoint_dir: checkpoints/binary_350m
  save_every_epoch: true
  log_batch_metrics: true

dataset:
  name: openai_humaneval
  cache_path: /home/PrayPrey/.cache/huggingface/datasets/openai_humaneval

execution_sandbox:
  timeout: 3.0
  binary_rewards:
    pass: 1.0
    fail: 0.0
  error_type_rewards:
    SyntaxError: 0.0
    TypeError: 0.2
    NameError: 0.4
    ValueError: 0.6
    AssertionError: 0.8
    Pass: 1.0
    Timeout: 0.0
    OtherError: 0.0

generation:
  max_new_tokens: 512
  temperature: 1.0
  top_p: 0.95
  do_sample: true
