environment_setup:
- dependencies: []
  description: Initialize directory tree (code/, configs/, outputs/, data/)
  estimated_hours: 0.25
  id: M2-ENV-1
  priority: P0
  title: Create h-m2/code directory structure
- dependencies:
  - M2-ENV-1
  description: Install transformers==4.36.0, sentence-transformers==2.2.2, torch==2.1.0,
    datasets==2.14.0, scipy==1.11.0
  estimated_hours: 0.5
  id: M2-ENV-2
  priority: P0
  title: Install dependencies
- dependencies:
  - M2-ENV-2
  description: Download hotpot_dev_distractor_v1.json from http://curtis.ml.cmu.edu/datasets/hotpot/
  estimated_hours: 0.25
  id: M2-ENV-3
  priority: P0
  title: Download HotpotQA dev set
- dependencies:
  - M2-ENV-2
  description: Cache meta-llama/Llama-2-7b-hf and sentence-transformers/contriever-base-msmarco
  estimated_hours: 0.5
  id: M2-ENV-4
  priority: P0
  title: Download Llama-2-7B and Contriever models
epic_tasks:
- breakdown:
  - M2-1.1: Implement HotpotQADataset class (filter_bridge_questions, __getitem__)
  - M2-1.2: Implement Contriever passage embedding (embed_batch, embed_dataset)
  - M2-1.3: Save/load embedding cache (pickle format, validate dimensions)
  - M2-1.4: Test pipeline on 100-question subset
  complexity: 9
  dependencies:
  - M2-ENV-3
  - M2-ENV-4
  description: Filter HotpotQA bridge questions, embed passages, save cache
  estimated_hours: 4
  id: M2-1
  priority: P0
  title: Dataset preprocessing pipeline
- breakdown:
  - M2-2.1: Implement MMRDiversityScorer.__init__ (lambda_param validation)
  - M2-2.2: Implement compute_mmr_score (relevance - diversity formula)
  - M2-2.3: Implement select_diverse_passages (greedy loop, budget tracking)
  - M2-2.4: Unit tests (lambda=1.0 collapse, empty selected set edge case)
  complexity: 12
  dependencies:
  - M2-ENV-2
  description: Implement greedy MMR selection with cosine similarity
  estimated_hours: 5
  id: M2-2
  priority: P0
  title: MMR diversity module
- breakdown:
  - M2-3.1: Define ProvenanceCacheConfig dataclass (tier_allocation_query/high/low)
  - M2-3.2: Implement assign_tier (query → tier 0, top-5 relevance → tier 1, rest
      → tier 2)
  - M2-3.3: Implement evict_to_budget skeleton (abstract select_passages_for_tier)
  - M2-3.4: Test tier assignment logic with mock provenance map
  complexity: 11
  dependencies:
  - M2-ENV-2
  description: Implement ProvenanceCache base with tier assignment and budget allocation
  estimated_hours: 5
  id: M2-3
  priority: P0
  title: Cache base class (tiered eviction framework)
- breakdown:
  - M2-4.1: Implement ProvenanceCacheDiversity subclass
  - M2-4.2: Integrate MMRDiversityScorer in select_passages_for_tier
  - M2-4.3: Implement tier-aware diversity scoring (separate MMR per tier)
  - M2-4.4: Test diversity variant retains ≥3 unique passages
  complexity: 10
  dependencies:
  - M2-2
  - M2-3
  description: Subclass with MMR passage selection within tiers
  estimated_hours: 4.5
  id: M2-4
  priority: P0
  title: Diversity cache variant (ProvenanceCacheFull)
- breakdown:
  - M2-5.1: Implement ProvenanceCacheRelevance subclass
  - M2-5.2: Implement select_passages_for_tier (sort by relevance descending)
  - M2-5.3: Test relevance-only variant vs diversity variant (same budget)
  complexity: 8
  dependencies:
  - M2-3
  description: Subclass with pure relevance sorting (no MMR)
  estimated_hours: 3.5
  id: M2-5
  priority: P0
  title: Relevance-only cache variant (ablation baseline)
- breakdown:
  - M2-6.1: Implement HotpotQAEvaluator.run_inference (batch processing, checkpoints)
  - M2-6.2: Implement compute_f1 (HotpotQA normalization, token overlap)
  - M2-6.3: Implement compute_exact_match (normalized string equality)
  - M2-6.4: Implement statistical_test (paired t-test, effect size, CI)
  - M2-6.5: Save predictions JSON, metrics JSON
  complexity: 14
  dependencies:
  - M2-1
  - M2-4
  - M2-5
  - M2-ENV-4
  description: Inference loop, F1/EM metrics, statistical tests
  estimated_hours: 6
  id: M2-6
  priority: P0
  title: Evaluation harness
- breakdown:
  - M2-7.1: Implement AblationRunner.lambda_sweep (λ ∈ {0.3, 0.5, 0.7, 0.9})
  - M2-7.2: Implement diversity_metric_sweep (embedding/entity/lexical Jaccard)
  - M2-7.3: Implement tier_budget_sweep (50/40/10, 60/30/10, 70/20/10)
  - M2-7.4: Save ablation results JSON
  complexity: 13
  dependencies:
  - M2-6
  description: Lambda sweep, diversity metric comparison, tier budget variants
  estimated_hours: 5.5
  id: M2-7
  priority: P1
  title: Ablation orchestration
- breakdown:
  - M2-8.1: Implement main.py (load configs, datasets, models)
  - M2-8.2: Integrate logging (progress, time/question, cache stats)
  - M2-8.3: Implement checkpoint recovery (resume from failures)
  - M2-8.4: Error handling (timeout, OOM, invalid predictions)
  complexity: 10
  dependencies:
  - M2-6
  description: Orchestrate data loading, inference, evaluation, results
  estimated_hours: 4.5
  id: M2-8
  priority: P0
  title: Main experiment script
failsafe_tasks:
- dependencies:
  - M2-4
  - M2-5
  description: If GPU unavailable, run mock inference on CPU (10-question subset,
    simulated MMR)
  estimated_hours: 2
  id: M2-FAIL-1
  priority: P2
  title: Mock inference fallback
- dependencies:
  - M2-1
  description: If Contriever fails, use pre-computed embeddings from h-m1 (TF-IDF
    proxy)
  estimated_hours: 1.5
  id: M2-FAIL-2
  priority: P2
  title: Pre-embedded passage cache fallback
- dependencies:
  - M2-6
  description: If t-test assumptions violated (non-normal diffs), use Wilcoxon signed-rank
    test
  estimated_hours: 1
  id: M2-FAIL-3
  priority: P2
  title: Statistical test robustness check
