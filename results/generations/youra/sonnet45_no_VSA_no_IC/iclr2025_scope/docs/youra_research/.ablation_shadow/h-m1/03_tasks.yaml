epics:
- complexity: 6
  description: Clone H2O baseline, install dependencies, download Llama-2-7B and Contriever
    models
  id: A-1
  subtasks:
  - complexity: 1
    description: git clone https://github.com/FMInference/H2O.git
    id: A-1.1
    title: Clone H2O baseline repository
  - complexity: 1
    description: Install torch, transformers, datasets, matplotlib, scipy
    id: A-1.2
    title: Install Python dependencies
  - complexity: 2
    description: Download meta-llama/Llama-2-7b-hf from HuggingFace with auth token
    id: A-1.3
    title: Download Llama-2-7B model
  - complexity: 2
    description: Download facebook/contriever-msmarco from HuggingFace
    id: A-1.4
    title: Download Contriever model
  title: Environment Setup and Model Download
- complexity: 8
  description: Load and preprocess LongBench single-hop QA tasks
  id: A-2
  subtasks:
  - complexity: 2
    description: Load 4 tasks (narrativeqa, qasper, triviaqa, multifieldqa_en) from
      HuggingFace
    id: A-2.1
    title: Load LongBench dataset
  - complexity: 2
    description: Left-padding, truncate to 4096 max length
    id: A-2.2
    title: Tokenize with Llama-2 tokenizer
  - complexity: 2
    description: 'Structure as {''input'': question, ''context'': document, ''answers'':
      list}'
    id: A-2.3
    title: Format dataset samples
  - complexity: 2
    description: Test on 10-sample subset, verify token counts
    id: A-2.4
    title: Validate dataset loading
  title: LongBench Dataset Loader
- complexity: 10
  description: Implement passage chunking, retrieval, and scoring
  id: A-3
  subtasks:
  - complexity: 3
    description: 512-token windows with 128-token overlap
    id: A-3.1
    title: Passage chunking logic
  - complexity: 3
    description: Encode query and passages, compute cosine similarity
    id: A-3.2
    title: Dense retrieval with Contriever
  - complexity: 2
    description: Min-max scaling to [0,1] per query
    id: A-3.3
    title: Score normalization
  - complexity: 2
    description: Verify top-K retrieval works correctly
    id: A-3.4
    title: Test retrieval on sample subset
  title: Contriever Retrieval Pipeline
- complexity: 14
  description: Implement FullKV, H2O, and Random cache policies
  id: A-4
  subtasks:
  - complexity: 2
    description: Baseline with cache_budget_ratio=1.0
    id: A-4.1
    title: FullKVCache (no eviction)
  - complexity: 2
    description: Accumulate attention scores per token across generation steps
    id: A-4.2
    title: H2OCache - attention tracking
  - complexity: 3
    description: Three-tier eviction (sink + heavy-hitter + recent)
    id: A-4.3
    title: H2OCache - eviction logic
  - complexity: 3
    description: Random token eviction at 25% budget
    id: A-4.4
    title: RandomCache eviction
  - complexity: 4
    description: Validate eviction behavior on 10-sample subset
    id: A-4.5
    title: Test all 3 baselines
  title: Baseline Cache Implementations
- complexity: 12
  description: Implement provenance-aware tiered eviction
  id: A-5
  subtasks:
  - complexity: 3
    description: Map token_idx to (type, relevance_score) from retrieval
    id: A-5.1
    title: Provenance metadata registration
  - complexity: 4
    description: 'Tier 0: query, Tier 1: high-rel (top 50% budget), Tier 2: low-rel
      (remaining)'
    id: A-5.2
    title: Three-tier eviction algorithm
  - complexity: 3
    description: Budget distribution across query/high-rel/low-rel tiers
    id: A-5.3
    title: Tier allocation logic
  - complexity: 2
    description: Validate tiering on 10-sample subset
    id: A-5.4
    title: Test ProvenanceCache
  title: ProvenanceCache Implementation
- complexity: 9
  description: Integrate 4 cache policies with Llama-2-7B generation
  id: A-6
  subtasks:
  - complexity: 3
    description: Hook cache eviction into Llama-2 attention layers
    id: A-6.1
    title: Integrate cache policies with model
  - complexity: 3
    description: Greedy decoding, max_new_tokens=100, checkpoint every 50 samples
    id: A-6.2
    title: Generation loop with checkpointing
  - complexity: 2
    description: Track retained_tokens, evicted_tokens, cache_hit_rate
    id: A-6.3
    title: Collect cache statistics
  - complexity: 1
    description: Test all 4 conditions before full evaluation
    id: A-6.4
    title: Run PoC on 10-sample subset
  title: Generation Harness
- complexity: 11
  description: Compute F1 scores, statistical tests, and generate validation report
  id: A-7
  subtasks:
  - complexity: 3
    description: Token-level overlap with normalization (remove articles, punctuation)
    id: A-7.1
    title: F1 score computation
  - complexity: 2
    description: Two-tailed t-test (ProvenanceCache vs H2O), alpha=0.05
    id: A-7.2
    title: Statistical testing
  - complexity: 3
    description: Gate metrics chart + optional figures (cache budget curve, per-task
      breakdown)
    id: A-7.3
    title: Generate visualizations
  - complexity: 3
    description: PASS/FAIL verdict, key findings, figure references
    id: A-7.4
    title: Write 04_validation.md
  title: Evaluation and Reporting
failsafe_tasks:
- complexity: 1
  description: Switch to CPU execution if GPU memory insufficient
  id: F-1
  title: GPU OOM fallback
- complexity: 1
  description: Reimplement H2O from pseudo-code if FMInference/H2O has compatibility
    issues
  id: F-2
  title: H2O integration fallback
- complexity: 1
  description: Resume from checkpoint if evaluation crashes mid-run
  id: F-3
  title: Checkpoint recovery
summary:
  budget_tier: 2.5
  estimated_gpu_hours: 6-8
  estimated_implementation_hours: 8-10
  failsafe_tasks: 3
  total_complexity: 70
  total_epics: 7
  total_subtasks: 28
