main_hypothesis:
  id: H-ProvenanceCache-v1
  title: Provenance-Aware KV Cache Management for RAG-Based Long-Context QA
  statement: Under RAG-based long-context QA tasks (LongBench multi-doc QA, 8k-32k tokens), if we implement provenance-aware
    KV cache eviction with diversity-aware scoring (query tokens prioritized → diverse high-relevance passages → diverse low-relevance
    passages for contrastive evidence → redundant passages evicted), then answer accuracy at restrictive cache budgets (10-25%
    retention) will improve by ≥10% relative to uniform eviction baselines (H2O, StreamingLLM), because retrieval relevance
    scores and passage diversity jointly predict attention concentration and reasoning utility during answer generation.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: LongBench Multi-Doc QA Subset
    model: Llama-2-7B
    optimizer: N/A (inference-only study)
    hyperparameters:
