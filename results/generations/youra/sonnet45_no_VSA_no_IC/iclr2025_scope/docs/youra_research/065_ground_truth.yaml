# ═══════════════════════════════════════════════════════════════
# CAUSAL MECHANISMS (VALIDATED VS REFUTED)
# ═══════════════════════════════════════════════════════════════

causal_mechanisms:
  validated:
    - mechanism: "Retrieval relevance scores correlate with attention weights"
      evidence: "h-e1: Contriever ρ=0.612, BM25 ρ=0.391"
      implication: "Dense retrieval embeddings predict reasoning utility"

    - mechanism: "Tiered eviction (query > high-rel > low-rel) outperforms uniform attention-based eviction"
      evidence: "h-m1: +6.16% F1 gain on single-hop QA"
      implication: "Provenance metadata (query/passage boundaries) predicts cache utility"

    - mechanism: "Passage diversity preserves contrastive evidence for multi-hop reasoning"
      evidence: "h-m2: +14.71% F1 gain from MMR diversity (λ=0.5) on multi-hop QA"
      implication: "Multi-hop QA is coverage problem (diverse evidence span), not ranking problem (top-k relevance)"

    - mechanism: "Combined tiered + diversity-aware policy synthesizes provenance + diversity signals"
      evidence: "h-m4: +15.35% F1 gain, exceeding ≥10% target by 5.35 points"
      implication: "Integration of tiering and diversity outperforms individual components"

  refuted:
    - mechanism: "Query complexity (word count, entity density) predicts query-token attention concentration"
      evidence: "h-m3: p=0.954, no significance, wrong direction (complex > simple)"
      alternative_hypothesis: "Attention concentration outcome-dependent (reasoning success), not syntax-dependent"
      fallback: "Uniform query tier allocation (10% budget)"

