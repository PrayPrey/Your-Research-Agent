# NOVELTY CLAIMS (DEFENSIBLE VS VULNERABLE)
# ═══════════════════════════════════════════════════════════════

novelty_claims:
  defensible:
    - claim: "First KV cache eviction method conditioned on retrieval provenance metadata"
      evidence: "Literature review shows H2O/StreamingLLM/DynamicKV use uniform eviction, no RAG-specific methods"
      prior_work_gap: "No prior work exploits passage boundaries + relevance scores for cache decisions"

    - claim: "First application of MMR diversity to cache eviction (vs retrieval ranking)"
      evidence: "MMR (Carbonell & Goldstein 1998) used for retrieval ranking, not cache retention"
      extension: "Adapts MMR from top-k diverse retrieval to memory-constrained diverse retention"

    - claim: "Empirical validation that semantic retrieval (Contriever) predicts attention 57% stronger than lexical (BM25)"
      evidence: "h-e1: ρ=0.612 vs ρ=0.391, statistically significant"
      contribution: "First correlation study between retrieval scores and attention weights in RAG"

  vulnerable:
    - claim: "Query complexity adaptive tiering"
      status: "REFUTED in h-m3"
      paper_handling: "Transparently reported failure, explained fallback (uniform allocation)"
      adversarial_risk: "LOW — paper does not claim success on h-m3"

