# Dataset Specification for H-E1 Experiment

hypothesis_id: h-e1
dataset_type: standard
status: specified

# Primary Dataset
dataset:
  name: LongBench Multi-Doc QA
  source: HuggingFace
  repository: THUDM/LongBench
  url: https://huggingface.co/datasets/THUDM/LongBench
  version: latest
  license: MIT

# Task Selection
tasks:
  - name: hotpotqa
    type: multi-hop QA
    sample_count: 200
    avg_length: 9584
    language: en

  - name: 2wikimqa
    type: multi-hop QA
    sample_count: 200
    avg_length: 8969
    language: en

  - name: musique
    type: multi-hop QA
    sample_count: 200
    avg_length: 11214
    language: en

# Total Statistics
total_samples: 600
total_tokens_approx: 5900000
context_length_range:
  min: 8000
  max: 15000
  average: 9922

# Data Format
input_format:
  input: "Question text"
  context: "Long concatenated passages (separated by \\n\\n)"
  answers: ["Answer 1", "Answer 2"]
  length: "Character count"
  dataset: "Task name"
  _id: "Unique identifier"

# Preprocessing Steps
preprocessing:
  passage_segmentation:
    method: split_on_double_newline
    delimiter: "\n\n"
    expected_passages_per_question: 10-30

  query_complexity_labeling:
    simple_threshold:
      word_count_max: 10
      entity_density_max: 0.3
    complex_threshold:
      word_count_min: 10
      entity_density_min: 0.3
    entity_extraction: spacy_en_core_web_sm

  answer_correctness:
    exact_match: true
    f1_threshold: 0.5
    tokenization: nltk_word_tokenize

# Retrieval Configuration
retrieval:
  bm25:
    library: rank_bm25
    parameters:
      k1: 1.5
      b: 0.75
      top_k: 10
    tokenization: nltk_word_tokenize

  contriever:
    model: facebook/contriever-msmarco
    max_sequence_length: 512
    batch_size: 64
    top_k: 10
    embedding_dim: 768

# Validation Checks
validation:
  - check: dataset_download_complete
    expected_files: 3

  - check: passage_count_range
    min_passages: 10
    max_passages: 50

  - check: retrieval_scores_valid
    score_range_bm25: [0, 100]
    score_range_contriever: [-1, 1]

  - check: no_missing_data
    required_fields: [input, context, answers, _id]

# Storage Paths
output_paths:
  raw_data: data/longbench_raw/
  preprocessed: data/preprocessed/
  retrieval_results: data/retrieval/
  cache: data/cache/

# Cache Files
cache_files:
  preprocessed_dataset: preprocessed_longbench_h-e1.pkl
  bm25_scores: bm25_retrieval_scores.pkl
  contriever_scores: contriever_retrieval_scores.pkl
  entity_labels: query_complexity_labels.pkl

# Quality Metrics
quality_checks:
  passage_segmentation_accuracy:
    method: manual_inspection
    sample_size: 10

  retrieval_coverage:
    target: 100%
    metric: questions_with_k_passages

  label_distribution:
    simple_queries_percent: 30-50
    complex_queries_percent: 50-70
    correct_answers_percent: 40-60

# Notes
notes: |
  - LongBench multi-doc QA tasks require reasoning over multiple passages
  - Dual-retriever setup (BM25 + Contriever) validates correlation robustness
  - Real standard dataset (no synthetic data) ensures scientific validity
  - Sample size (600 questions) statistically powered for correlation analysis
  - Expected passage count per question: 15-25 (varies by LongBench context construction)
