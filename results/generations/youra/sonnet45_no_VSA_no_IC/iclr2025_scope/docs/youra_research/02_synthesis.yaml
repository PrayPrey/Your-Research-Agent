measurement_plan:
  data_collection:
    - source: "LongBench multi-doc QA subset (standardized benchmark)"
    - source: "Attention weights extracted via PyTorch hooks during inference"
    - source: "Retrieval scores from BM25 + DPR/Contriever retrievers"
  procedure:
    - step: "Pilot 1 (1-2 GPU-hours): Attention analysis - measure correlation between retrieval scores and attention weights, stratified by query complexity and answer correctness"
    - step: "Pilot 2 (5-8 GPU-hours): Single-hop provenance caching - test tiered eviction on single-hop QA subset vs H2O/FullKV baselines"
    - step: "Full Experiment (15-20 GPU-hours): Multi-hop + diversity-aware eviction on full LongBench multi-doc QA, test ProvenanceCache vs 4 baselines at 4 cache budgets (10%, 25%, 50%, 75%)"
  success_criteria:
    - "Pilot 1: Spearman ρ > 0.3 for relevance-attention correlation (both BM25 and semantic retriever)"
    - "Pilot 2: ≥5% accuracy gain at 25% budget on single-hop questions"
    - "Full Experiment: ≥10% relative accuracy gain at 25% budget, robust across question types, statistical significance p < 0.05"

validation:
  internal_validity:
    - "Controlled variables: retriever type, model architecture, question type stratification, query complexity"
    - "Baseline controls: FullKV (upper bound), Random (lower bound), H2O/StreamingLLM (state-of-the-art)"
    - "Ablation studies: Diversity vs relevance-only, query-anchoring vs uniform tiering"
  external_validity:
    - "Multi-retriever validation (BM25 + semantic) tests robustness to retriever choice"
    - "Cache budget range (10-75%) covers extreme to practical operating points"
    - "Stratified analysis by question type (single-hop vs multi-hop) tests mechanism components"

discussion_synthesis:
  key_insights:
    - "RAG creates semantic structure (query vs passage vs generated tokens) that uniform cache methods ignore"
    - "Diversity-aware eviction preserves contrastive evidence, addressing concern that low-relevance passages might be critical for ruling out wrong answers"
    - "Query complexity adaptation (entity density, word count) handles ambiguous queries where simple tiering fails"
    - "Three-tier pilot sequence validates assumptions cheaply before expensive full experiment"
  breakthrough_moments:
    - "Exchange 3 (Dr. Sage): Identified real gap - no prior RAG-conditioned cache analysis despite 878-citation H2O paper and production RAG deployments"
    - "Exchange 5 (Dr. Ally): Synthesized tiered eviction + pilot sequence, transforming open-ended idea into controlled measurement study"
    - "Exchange 7 (Dr. Nova): Diversity-aware refinement addressed Prof. Rex's negative evidence concern, achieving convergence"
  resolved_tensions:
    - "Negative evidence concern (Prof. Rex): Resolved via diversity-aware scoring (MMR principle) that retains diverse low-relevance passages"
    - "Query ambiguity concern (Prof. Rex): Resolved via query complexity adaptation (entity density, word count stratification)"
    - "Multi-hop dependency concern (Prof. Pax): Partially resolved via co-retention heuristic, acknowledged as remaining risk with mitigation (qualitative failure analysis)"
