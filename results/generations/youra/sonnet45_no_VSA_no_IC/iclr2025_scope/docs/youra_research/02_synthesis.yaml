  statistical_test: "Two-tailed t-test (n ≥ 100 questions per condition)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First analysis of KV cache strategies conditioned on retrieval provenance metadata. Diversity-aware provenance scoring synthesizes relevance + diversity + query complexity."
  differentiation_summary: |
    Augments existing methods (H2O attention-based, StreamingLLM sliding window) with retrieval-specific
    signals unavailable in static long-document tasks. Exploits semantic structure that RAG creates.

clarity:
