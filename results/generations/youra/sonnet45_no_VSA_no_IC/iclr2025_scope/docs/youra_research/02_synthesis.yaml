hypothesis_draft:
  title: "Provenance-Aware KV Cache Management for RAG-Based Long-Context QA"
  hypothesis_id: "H-ProvenanceCache-v1"
  core_claim: |
    Provenance-aware KV cache eviction with diversity-aware scoring improves answer accuracy
    at restrictive cache budgets (10-25% retention) by ≥10% relative to uniform eviction
    baselines (H2O, StreamingLLM) on RAG-based long-context QA tasks (LongBench multi-doc).
  mechanism: |
    Four-step causal chain:
    1. Retrieval relevance scores correlate with attention concentration (validated via Pilot 1)
    2. Diverse passage retention preserves contrastive evidence for multi-hop reasoning (MMR principle)
    3. Query tokens serve as attention anchors for simple queries (stratified validation)
    4. Integrated provenance policy (Tier 0: query + top-1, Tier 1: diverse passages, Tier 2: redundant)
       synthesizes signals to outperform uniform baselines
  predictions:
    - P1: "≥10% relative accuracy gain at 25% cache budget vs H2O baseline (primary)"
    - P2: "Diversity-aware scoring outperforms pure relevance-based on multi-hop questions (≥5% gain)"
    - P3: "Retrieval scores correlate with attention weights (Spearman ρ > 0.3)"

variables_summary:
  independent: "Cache eviction strategy (FullKV, H2O, StreamingLLM, ProvenanceCache, Random) × Cache budget (10%, 25%, 50%, 75%)"
  dependent_primary: "Answer accuracy (exact match or F1 on LongBench multi-doc QA)"
  controlled: "Retriever type (BM25 + DPR/Contriever), model (Llama-2-7B), question type stratification (single-hop vs multi-hop), query complexity"

null_hypothesis:
