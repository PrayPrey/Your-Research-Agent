# H-M3 Experiment Configuration

# Dataset
dataset:
  name: LongBench
  subsets:
    - hotpotqa
    - 2wikimqa
    - musique
  min_samples_per_stratum: 100

# Complexity Classification
complexity:
  thresholds:
    simple_word_count: 10
    simple_entity_density: 0.3
  spacy_model: en_core_web_sm

# Model
model:
  name: meta-llama/Llama-2-7b-hf
  torch_dtype: float16
  attn_implementation: eager  # Required for attention extraction
  max_length: 4096
  max_new_tokens: 64

# Attention Extraction
attention:
  target_layer: -1  # Last layer
  aggregation: mean_heads  # Average across heads
  query_token_tracking: true

# Statistical Testing
stats:
  test:
    type: two_sample_t_test
    alternative: greater  # simple > complex
    alpha: 0.05
  bootstrap:
    n_samples: 1000
    seed: 42

# PoC Settings
poc:
  max_samples: 200  # Total samples to process (100 per stratum)
  enable_mock_mode: false  # Set true for testing without GPU
