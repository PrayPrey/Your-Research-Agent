        threshold: 30
        status: "PASS"
      - cell: "ResNet-CIFAR100"
        count: 200
        threshold: 30
        status: "PASS"
      - cell: "ResNet-TinyImageNet"
        count: 120
        threshold: 30
        status: "PASS"
    splits:
      train: 1484  # 70%
      validation: 318  # 15%
      test: 318  # 15%

  experimental_results:
    experiment_1_coverage_audit:
      objective: "Validate dataset diversity (≥30 models/cell, ≥70% coverage)"
      result: "PASS (72.2% coverage, 2120 models, all critical cells PASS)"
      key_metrics:
        coverage: "72.2%"
        total_models: 2120
        critical_cells: "3/3 PASS"

    experiment_2_cka_feasibility:
      objective: "Validate architecture subspace compatibility before VAE training"
      result: "PASS (same-task 0.82 > 0.6, diff-task 0.14 < 0.4)"
      key_metrics:
        same_task_median: 0.8184
        diff_task_median: 0.1423
        gate_decision: "PASS"

    experiment_3_vae_training:
      objective: "Demonstrate hierarchical VAE training converges smoothly"
      result: "PASS (83% reconstruction loss reduction, no gradient explosions)"
      key_metrics:
        epochs: 10
        reconstruction_loss_reduction: "83% (4.11 → 0.70)"
        contrastive_loss_reduction: "74% (0.94 → 0.24)"
        kl_stable: "0.53 (no posterior collapse)"
        gradient_max_norm: "<5.0 (no explosions)"

    experiment_4_wcss_clustering:
      objective: "Test primary hypothesis (same-task tighter clustering than random)"
      result: "PASS (WCSS ratio 0.495, p<0.000001, Cohen's d=1.45)"
      key_metrics:
        wcss_ratio: 0.495
        p_value: "<0.000001"
        cohen_d: 1.45
        effect_size_interpretation: "LARGE (>0.8 threshold)"
        hypothesis_decision: "REJECT H0 (accept H1: task structure dominates)"

    experiment_5_reconstruction:
      objective: "Validate pooling preserves task information (accuracy >60%)"
      result: "MARGINAL (68% accuracy, 2pp below 70% target, exceeds 60% acceptable)"
      key_metrics:
        accuracy: 0.68
        target_threshold: 0.70
        acceptable_threshold: 0.60
        random_baseline: 0.11
        status: "MARGINAL (acceptable for PoC, insufficient for production)"

  limitations_documented:
    critical_blockers:
      L1_mock_dataset:
        description: "PoC used synthetic data (27 .pt files + 5 SANE dirs) instead of real Zenodo ModelZooDataset"
        impact: "External validity threatened (CKA/WCSS may be inflated)"
        mitigation: "Priority 1 validation (4 days, $50 GPU) — download real dataset, re-run CKA + WCSS"
        acceptance_criteria: "CKA same-task >0.6 AND WCSS Cohen's d >0.5 on real data"
        publication_risk: "BLOCKER for Tier 1 venues (NeurIPS, ICML, ICLR)"

      L4_reduced_training:
        description: "10 epochs (PoC) vs 200 planned — reconstruction accuracy marginal (0.68 vs 0.70)"
        impact: "Reconstruction accuracy 2pp below target (marginal, acceptable for PoC)"
        mitigation: "Priority 2 validation (7 days, $700 GPU) — full 200-epoch training"
        acceptance_criteria: "Reconstruction accuracy ≥0.70"
        fallback: "Set Transformer pooling (learnable aggregation) if full training insufficient"

    deferred_tests:
      L5_architecture_token_ablation:
        description: "No ablation study removing architecture-type tokens (Section 3.2.3)"
        impact: "Cannot quantify Transformer contribution (mechanism claim weakened)"
        mitigation: "Priority 3 validation (2 days, $50 GPU) — retrain without arch tokens"
        acceptance_criteria: "If degradation ≥15pp, tokens critical; if <5%, simplify to pooling-only"

      P3_zero_shot_transfer:
        description: "Adversarial metadata test deferred (secondary prediction)"
        impact: "Cannot claim zero-shot transfer >90% accuracy"
        mitigation: "Extension 2 (3-4 days, $50 GPU) — 100 corrupted models, zero-shot test"
        acceptance_criteria: "Accuracy >90% AND >10pp higher than metadata baseline"

    principled_scope:
      L7_generative_excluded:
        reason: "GANs/Diffusion encode sampling procedures, not discriminative functions"
        scope: "Discriminative classifiers only (CNNs, Transformers, RNNs, MLPs)"
        future_work: "Task-space reformulation for generative models (6-12 months)"

      L8_editing_excluded:
        reason: "Lossy pooling discards neuron-level details (requires invertible encoders)"
        scope: "Inference tasks only (task prediction, architecture classification)"
        future_work: "Invertible normalizing flows for fine-grained editing (3-6 months)"

  unexpected_findings:
    finding_1_large_effect_size:
      observation: "Cohen's d=1.45 >> planned d=0.5 (190% larger)"
      competing_explanations:
        - "Task structure stronger than expected (supports hypothesis)"
        - "Mock dataset artifact (threatens validity)"
        - "Architecture family selection bias (CNN/ResNet dominate 68%)"
      recommended_test: "Priority 1 real dataset validation"

    finding_2_high_cka:
      observation: "Same-task CKA 0.82 exceeds threshold by 36% (vs planned 0.6)"
      competing_explanations:
        - "Task structure dominates architecture variance (supports hypothesis)"
        - "Mock dataset artifact (threatens validity)"
        - "NFN encoders better than expected (mechanism refinement)"
      recommended_test: "Priority 1 real dataset validation"

    finding_3_marginal_reconstruction:
      observation: "Reconstruction accuracy 0.68, 2pp below target 0.70"
      competing_explanations:
        - "Early stopping artifact (10 epochs vs 200 planned) [LIKELY]"
        - "Pooling information loss (mechanism limitation)"
        - "Decoder architecture underfitting (implementation issue)"
      recommended_test: "Priority 2 full-scale training"

