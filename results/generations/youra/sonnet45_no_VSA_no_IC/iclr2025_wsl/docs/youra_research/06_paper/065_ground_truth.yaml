# Phase 6.5 Ground Truth
# Generated: 2026-08-20
# Source: 06_paper.md (merged manuscript)
# Purpose: Adversarial review input (Phase 6.5 agents validate claims against this ground truth)

ground_truth:
  paper_metadata:
    title: "Hierarchical Weight Space Embeddings for Cross-Architecture Model Property Inference"
    word_count: 12556
    sections: 8  # Abstract, Intro, Related, Method, Experiments, Results, Discussion, Conclusion
    references: 30  # 06_references.bib
    figures_planned: 7  # Coverage heatmap, CKA matrix, training curves, WCSS violin plots, per-task breakdown, architecture pairs, confusion matrix
    tables: 5  # Coverage matrix, CKA results, training losses, WCSS bootstrap, reconstruction accuracy

  validated_core_claims:
    claim_1:
      statement: "Task-level functional constraints create architecture-invariant structural features in weight distributions at layer-summary level"
      evidence_type: "PRIMARY (WCSS clustering test)"
      statistical_support:
        metric: "WCSS ratio (same-task / random)"
        threshold: "<1.0"
        actual_value: 0.495
        p_value: "<0.000001"
        effect_size: "Cohen's d=1.45 (large)"
        status: "VALIDATED"
      source_sections: ["5.4 WCSS Clustering Test", "6.1.3 Step 3: Hierarchical Pooling"]

    claim_2:
      statement: "Same-task different-architecture models cluster more tightly than random baseline clusters"
      evidence_type: "PRIMARY (bootstrap hypothesis test)"
      statistical_support:
        mean_same_task_wcss: 180.11
        mean_random_wcss: 364.04
        wcss_ratio: 0.495
        p_value: "<0.000001"
        cohen_d: 1.45
        confidence_interval_95: "[175.2, 192.6]"
        status: "VALIDATED (reject H0, accept H1)"
      source_sections: ["5.4.1 Bootstrap Test Statistics", "Table 4"]

    claim_3:
      statement: "Architecture subspaces are metrically compatible (CKA same-task >0.6, diff-task <0.4)"
      evidence_type: "SECONDARY (feasibility gate)"
      statistical_support:
        same_task_cka_median: 0.8184
        same_task_cka_threshold: ">0.6"
        diff_task_cka_median: 0.1423
        diff_task_cka_threshold: "<0.4"
        welch_t_test_p_value: "<0.0001"
        status: "VALIDATED (both thresholds exceeded)"
      source_sections: ["5.2 CKA Feasibility Gate", "Table 2"]

    claim_4:
      statement: "Hierarchical pooling preserves task-relevant information (reconstruction accuracy >60%)"
      evidence_type: "SECONDARY (information preservation)"
      statistical_support:
        reconstruction_accuracy: 0.68
        acceptable_threshold: ">0.60"
        target_threshold: ">0.70"
        random_baseline: 0.11
        improvement_over_random: "+56.9pp"
        status: "MARGINAL (2pp below target, exceeds acceptable)"
      source_sections: ["5.5 Reconstruction Task Accuracy", "Table 5"]

  dataset_statistics:
    total_models: 2120
    architectures: ["CNN-small", "CNN-large", "ResNet-18", "ResNet-34", "MLP", "ViT"]
    architecture_counts:
