      ResNet: 685
      MLP: 285
      ViT: 225
    tasks: ["CIFAR-10", "CIFAR-100", "TinyImageNet", "MNIST", "FashionMNIST", "SVHN", "USPS", "STL10", "EuroSAT"]
    coverage_percentage: 72.2  # 26/36 cells with ≥30 models
    critical_cells_status:
