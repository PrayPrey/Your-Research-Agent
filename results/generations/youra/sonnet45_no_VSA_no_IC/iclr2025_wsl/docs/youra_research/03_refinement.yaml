  sh3_comparison: |
    Compare against: (1) Architecture-conditioned MLP (architecture-blind baseline),
    (2) ProbeGen (architecture-specific SOTA), (3) SANE (homogeneous sequential baseline).
    Success criterion: Outperform all three on heterogeneous task prediction with p<0.01.
    Adversarial metadata test (P3) demonstrates unique weight-based information.
  open_questions:
