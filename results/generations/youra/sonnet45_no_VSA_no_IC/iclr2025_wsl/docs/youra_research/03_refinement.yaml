established_facts:
  claims:
    - claim: "NFN (Neural Functional Networks) achieves permutation equivariance for MLPs/CNNs"
      status: "BUILD_ON"
      evidence: "Zhou et al. 2023 (NFN paper), 93-star GitHub implementation demonstrates working equivariant weight processing"
    - claim: "UNF (Universal Neural Functionals) extends equivariance to arbitrary single architectures"
      status: "BUILD_ON"
      evidence: "Zhou et al. 2024, 45 citations, 56-star implementation handles RNNs/Transformers"
    - claim: "Task arithmetic enables model editing via weight-space operations on shared-base models"
      status: "BUILD_ON"
      evidence: "Ilharco et al. 2022, 1161 citations, mergekit production library (7291 stars)"
    - claim: "Heterogeneous model zoo populations improve weight generation but lack unified representation"
      status: "PROVE_NEW"
      evidence: "Falk et al. 2025 identifies gap, no existing method for cross-architecture embeddings"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Phase 4 implementation should build on established NFN/UNF equivariance
    techniques (reuse existing codebases) rather than re-deriving equivariant
    layer theory. The novel contribution is the hierarchical composition across
    architectures, not the within-architecture equivariance itself.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-HierarchicalWeightEmbedding-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under heterogeneous model zoos (ModelZooDataset, SANE, ViTModelZoo) containing
    CNNs, Transformers, RNNs, and MLPs trained on overlapping task sets, if we train
    a hierarchical variational autoencoder with architecture-type-aware tokenization
    and three-level supervision (coarse labels → contrastive learning → zero-shot transfer),
    then same-task different-architecture models will cluster more tightly (measured via
    within-cluster sum of squares) than different-task same-architecture models,
    because task-level functional constraints and training-induced regularities create
    architecture-invariant structural features in weight distributions that persist across
    computational primitives (convolution vs attention vs recurrence).
  alternative_hypothesis_h0: |
    There is no significant difference in embedding space clustering tightness between
    same-task different-architecture model pairs and different-task same-architecture
    model pairs. Any observed clustering is attributable to architecture-specific weight
    patterns rather than task-invariant structure.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Architecture Family Pair"
      type: "categorical"
      operationalization: "Which two architecture types are compared (e.g., CNN-Transformer, CNN-RNN, Transformer-RNN)"
      levels: ["CNN-Transformer", "CNN-RNN", "CNN-MLP", "Transformer-RNN", "Transformer-MLP", "RNN-MLP"]
    - name: "Task Match Condition"
      type: "categorical"
      operationalization: "Whether model pairs share the same task label (ImageNet classifier) or different tasks (ImageNet vs CIFAR-10)"
      levels: ["Same-Task", "Different-Task"]
  dependent:
    - name: "Embedding Clustering Tightness"
      type: "continuous"
      operationalization: "Within-cluster sum of squares (WCSS) for model pairs in hierarchical VAE latent space, normalized by between-cluster variance. Lower WCSS = tighter clustering. Range: [0, ∞), typical values 0.1-2.0"
      primary: true
    - name: "CKA Representation Similarity"
      type: "continuous"
      operationalization: "Centered Kernel Alignment score between architecture-specific encoder outputs for model pairs. Range: [0, 1], where >0.6 indicates strong similarity"
      primary: false
    - name: "Zero-Shot Task Prediction Accuracy"
      type: "continuous"
      operationalization: "Percentage of correctly predicted task labels on held-out unlabeled models using trained hierarchical encoder. Range: [0%, 100%]"
      primary: false
  controlled:
    - name: "Model Zoo Composition"
      operationalization: "Use fixed model zoo splits from ModelZooDataset + SANE to ensure reproducibility. Require ≥30 models per architecture-task cell (verified via dataset audit)"
    - name: "Training Hyperparameters"
      operationalization: "Fix VAE latent dimension D=512, Transformer layers L=6, contrastive margin m=0.3 across all experiments to isolate architecture/task effects"
    - name: "Encoder Initialization"
      operationalization: "Initialize architecture-specific encoders with pretrained NFN (for CNNs) and UNF (for Transformers/RNNs) weights to control for representation quality"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Task-level functional constraints (e.g., ImageNet classification requires 1000-way discriminative features) impose architectural invariants on weight distributions — specific filters/attention patterns emerge regardless of whether implemented via convolution or self-attention"
      evidence: "Observation from mergekit: task arithmetic works across same-base models despite architectural variations (depth, width). Discussion exchange 3 (Dr. Sage) noted that task vectors encode task-specific directions in weight space."
      falsifier: "If CKA similarity for same-task different-architecture models is ≤0.4 (random-level), task constraints do not induce architecture-invariant structure"
    - step: 2
      description: "Architecture-specific equivariant encoders (NFN for CNNs, UNF for Transformers) map raw weights to intermediate representations that preserve local symmetries (neuron permutations within layers) while exposing task-relevant features"
      evidence: "NFN paper (Zhou 2023) demonstrates successful task prediction from CNN weights. UNF paper (Zhou 2024) extends to arbitrary architectures. Both use Schur's lemma for equivariance guarantees."
      falsifier: "If NFN/UNF encoders fail to predict tasks better than chance (e.g., <55% accuracy on 10-class dataset), architecture-specific encoders do not extract task signal"
    - step: 3
      description: "Permutation-invariant pooling over neuron clusters (Level 2) collapses local weight details into layer-level summaries that retain task-relevant structure while discarding architecture-specific implementation details (e.g., exact conv kernel shapes)"
      evidence: "Discussion exchange 4 (Prof. Pax): hierarchical VAE resolves equivariance-expressivity tradeoff by preserving micro-level symmetries, sacrificing them at macro-level for cross-architecture comparison"
      falsifier: "If reconstruction from layer summaries degrades task performance by >30%, pooling loses critical information and cross-architecture alignment fails"
    - step: 4
      description: "Transformer sequence modeling over layer tokens (Level 3) discovers relational structure between layer types across architectures (e.g., CNN conv layers functionally analogous to Transformer MLP blocks), enabling cross-architecture bridge without hand-designed alignment"
      evidence: "SANE paper demonstrates sequential weight processing. Discussion exchange 7 (Dr. Nova) framed this as 'Transformers for Model Zoos' — self-attention naturally discovers cross-architecture correspondences."
      falsifier: "If removing architecture-type token embeddings does not degrade clustering performance, Transformer is not learning architecture-aware relational structure"
  key_tension: "Equivariance preservation (neuron-level symmetries) vs expressivity (cross-architecture generalization) — hierarchical design trades local equivariance for global coverage"
  evidence_summary: |
    Causal chain supported by: (1) Task arithmetic success on shared-base models
    (Ilharco 2022), (2) NFN/UNF equivariant encoding theory (Zhou 2023-2024),
    (3) Hierarchical VAE design precedent in vision/NLP multimodal learning,
    (4) SANE sequential processing architecture. Key assumption: task constraints
    dominate architecture-specific noise at coarse-grained (layer-level) scale.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Model zoos contain sufficient cross-architecture coverage (≥30 models per architecture-task cell) for statistical validity"
    supporting_evidence: "ModelZooDataset (NeurIPS 2022) + SANE extensions (Falk 2025) target heterogeneous populations, but exact coverage unknown until dataset audit"
    consequence_if_violated: "Statistical tests underpowered, clustering results may reflect sampling noise rather than genuine task structure. Mitigation: treat sparse samples as robustness test (natural experiment)"
  - id: "A2"
    assumption: "Task labels from model zoo metadata are accurate and granular enough to define meaningful task clusters"
    supporting_evidence: "ModelZooDataset uses controlled training, SANE uses verified task annotations"
    consequence_if_violated: "Supervised labels introduce noise, contrastive learning discovers spurious correlations. Mitigation: validate via zero-shot transfer to unlabeled models (breaks label dependency)"
  - id: "A3"
    assumption: "Permutation-invariant pooling (Level 2) retains sufficient task-relevant information despite discarding neuron-level details"
    supporting_evidence: "Deep Sets (Zaheer 2017) shows sum/mean pooling preserves set-level structure; hierarchical VAEs in vision maintain reconstruction quality"
    consequence_if_violated: "Cross-architecture alignment fails because critical information is lost in pooling. Mitigation: measure reconstruction task accuracy degradation (accept if <30%)"
  - id: "A4"
    assumption: "Training-induced regularities (augmentation strategies, optimization dynamics) are orthogonal to task-induced structure, or at least separable"
    supporting_evidence: "None — identified as potential confound by Prof. Rex (Exchange 6)"
    consequence_if_violated: "Clustering reflects training procedures rather than tasks, invalidating task-invariance claim. Mitigation: explicit ablation comparing same-task different-procedure vs different-task same-procedure"
  - id: "A5"
    assumption: "Architecture families (CNN, Transformer, RNN, MLP) are metrically compatible — cross-architecture alignment is mathematically feasible"
    supporting_evidence: "None — requires empirical validation via CKA+UMAP feasibility gates (Prof. Pax Exchange 4, Prof. Rex Exchange 6)"
    consequence_if_violated: "No linear or nonlinear alignment exists, cross-architecture bridge is infeasible. Mitigation: CKA gate in Phase 1 (if CKA same-task <0.6, stop and reject hypothesis)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Discriminative function approximators (CNNs, Transformers, RNNs, MLPs) trained
    on supervised classification tasks (ImageNet, CIFAR-10, WMT, etc.) with standard
    architectures from model zoos (ModelZooDataset, SANE, ViTModelZoo). Applicable
    to model property inference tasks: task prediction, architecture-type classification,
    performance estimation, training data identification.
  does_not_apply_to: |
    Generative models (GANs, Diffusion models) whose weights encode sampling procedures
    rather than discriminative functions — identified boundary condition (Prof. Pax
    Exchange 4, Prof. Rex Exchange 6). Fine-grained weight editing operations (task
    arithmetic, model merging) requiring invertible encoders — explicitly deferred to
    future work (Dr. Nova Exchange 7). Models with <10 layers (insufficient sequential
    structure for Transformer Level 3). Proprietary models without weight access.
  known_limitations: |
    1. Dataset coverage: requires ≥30 models per architecture-task cell for statistical
       validity (Assumption A1). Sparse cells treated as robustness test, not hard blocker.
    2. Lossy pooling: Level 2 permutation-invariant pooling discards neuron-level details,
       limiting applicability to editing tasks (Prof. Rex Exchange 6, Dr. Nova Exchange 7).
    3. Training procedure confound: augmentation strategies may create more structure than
       task labels (Assumption A4), requiring ablation to disentangle.
    4. Scope limited to discriminative models: generative models excluded pending task-space
       reformulation (Prof. Pax Exchange 4).

