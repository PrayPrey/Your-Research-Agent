experimental_setup:
  dataset:
    name: "ModelZooDataset + SANE + ViTModelZoo (Heterogeneous Splits)"
    type: "standard"
    source: "ModelZooDataset (NeurIPS 2022 Dataset Track), SANE (ICML 2024), ViTModelZoo (2025)"
    path: "https://github.com/ModelZoos/ModelZooDataset, https://github.com/HSG-AIML/SANE, https://github.com/ModelZoos/ViTModelZoo"
    hypothesis_fit: |
      Provides heterogeneous architecture populations (CNNs, Transformers, RNNs, MLPs)
      with controlled task annotations. SANE extends to inhomogeneous zoos addressing
      the gap identified by Falk et al. (2025). Pre-Phase 1 dataset audit verifies
      ≥30 models per architecture-task cell for statistical validity (Assumption A1).
  model:
    name: "Hierarchical VAE with Architecture-Type-Aware Tokenization"
    type: "Variational Autoencoder (3-level hierarchy)"
    source: "Custom architecture combining NFN (github.com/AllanYangZhou/nfn), UNF (github.com/AllanYangZhou/universal_neural_functional), and Transformer sequence modeling"
    hypothesis_fit: |
      Level 1 (NFN/UNF): Preserves local neuron-permutation equivariance within architectures.
      Level 2 (pooling): Collapses to layer summaries, sacrifices local equivariance for
      cross-architecture compatibility. Level 3 (Transformer): Handles variable-length
      sequences, discovers relational structure via self-attention. Three-level supervision
      (coarse labels → contrastive → zero-shot) breaks circularity (Prof. Vera Exchange 2).
  baselines:
    - name: "Architecture-Conditioned MLP Baseline"
      method: "Flatten all weights, concatenate with one-hot architecture-type encoding, train MLP to predict tasks"
    - name: "ProbeGen (Architecture-Specific)"
      method: "Deep linear probe generators (Kahana et al. 2024) applied separately per architecture family"
    - name: "SANE (Homogeneous Sequential Processing)"
      method: "SANE sequential weight encoder trained on homogeneous (single-architecture) zoos"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First demonstration that task-level functional constraints create architecture-invariant
    structure in weight distributions, enabling cross-architecture model property inference
    on heterogeneous unlabeled collections. Compositional meta-space design exploits
    heterogeneity as signal rather than treating it as obstacle (paradigm shift from
    NFN/UNF homogeneous-only methods).
  key_innovation: |
    Hierarchical equivariance tradeoff: preserve local neuron-permutation symmetries
    (micro-level) while sacrificing them for cross-architecture generalization (macro-level).
    Operationalized via 3-level VAE (architecture-specific encoders → pooling → Transformer).
    Framed as "Transformers for Model Zoos" — treating architectures as sequences, analogous
    to BERT/GPT for code corpora (Dr. Sage Exchange 3).
  differentiation:
    - prior_work: "NFN (Zhou et al. 2023) - Permutation Equivariant Neural Functionals"
      difference: "NFN limited to homogeneous MLPs/CNNs. We extend to heterogeneous collections via hierarchical pooling and sequence modeling, explicitly trading local equivariance for global coverage."
    - prior_work: "UNF (Zhou et al. 2024) - Universal Neural Functionals"
      difference: "UNF handles any single architecture via automatic equivariant layer construction. We compose multiple architecture-specific UNFs into unified cross-architecture meta-space via learned bridge."
    - prior_work: "Task Arithmetic (Ilharco et al. 2022)"
      difference: "Task arithmetic requires shared base model (all models descend from same pretrained checkpoint). We enable cross-architecture transfer without shared ancestry by discovering task-invariant structure."
    - prior_work: "SANE (ICML 2024) - Scalable Weight Space Learning"
      difference: "SANE processes homogeneous zoos sequentially. We extend to heterogeneous zoos via architecture-type-aware tokenization and explicit cross-family alignment."

