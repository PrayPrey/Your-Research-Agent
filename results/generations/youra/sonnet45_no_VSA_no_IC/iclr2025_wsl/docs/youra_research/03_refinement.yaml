predictions:
  - id: "P1"
    primary: true
    statement: "Same-task different-architecture model pairs cluster more tightly (lower WCSS) than different-task same-architecture pairs when embedded via hierarchical VAE"
    test_method: "Bootstrap hypothesis test (n=100 resamples) comparing WCSS distributions for same-task vs different-task pairs across all architecture family combinations"
    success_criterion: "Mean WCSS(same-task) < Mean WCSS(different-task) with p < 0.01 (two-tailed test). Effect size Cohen's d > 0.5 (medium)"
    falsification: "If p ≥ 0.01 or effect size d < 0.2, task structure does not significantly influence cross-architecture clustering — hypothesis refuted"
  - id: "P2"
    primary: false
    statement: "CKA representation similarity between architecture-specific encoders exceeds 0.6 for same-task pairs and remains below 0.4 for different-task pairs (feasibility validation)"
    test_method: "Compute CKA scores on held-out validation set (100 same-task pairs, 100 different-task pairs) after training architecture-specific encoders (NFN, UNF)"
    success_criterion: "Median CKA(same-task) > 0.6 AND Median CKA(different-task) < 0.4"
    falsification: "If same-task CKA < 0.5 or different-task CKA > 0.5, architecture subspaces are not metrically compatible — proceed to nonlinear bridge or reject mechanism"
  - id: "P3"
    primary: false
    statement: "Zero-shot task prediction on adversarially mislabeled Hugging Face models (100% corrupted metadata) achieves >90% accuracy, proving weights encode information inaccessible to text-based inference"
    test_method: "Collect 100 models, corrupt all metadata (swap descriptions, rename checkpoints), train hierarchical encoder on clean model zoo, test on corrupted models without metadata access"
    success_criterion: "Task prediction accuracy > 90% on adversarially corrupted models, AND >10 percentage points higher than best metadata-based baseline"
    falsification: "If accuracy < 85% or metadata baseline matches weight-based accuracy (within 5pp), weights do not provide unique information over metadata — reduced contribution claim"

