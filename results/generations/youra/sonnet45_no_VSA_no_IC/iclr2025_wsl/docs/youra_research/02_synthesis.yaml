measurement_plan:
  data_collection:
    - source: "ModelZooDataset + SANE + ViTModelZoo heterogeneous splits"
    - source: "Hugging Face Hub API for web-scraped models (100 models with adversarially corrupted metadata)"
  procedure:
    - step: "Pre-Phase 1: Dataset audit (verify ≥30 models per architecture-task cell)"
    - step: "Phase 1: Train architecture-specific encoders (NFN, UNF), compute CKA+UMAP feasibility metrics"
    - step: "Phase 2: Train hierarchical VAE with three-level supervision (coarse → contrastive → zero-shot)"
    - step: "Phase 3: Clustering tightness evaluation (bootstrap test n=100, p<0.01 threshold)"
    - step: "Phase 4: Zero-shot transfer to adversarially mislabeled models (>90% accuracy criterion)"
    - step: "Ablation: Remove architecture-type tokens, test training procedure vs task effects"
  success_criteria:
