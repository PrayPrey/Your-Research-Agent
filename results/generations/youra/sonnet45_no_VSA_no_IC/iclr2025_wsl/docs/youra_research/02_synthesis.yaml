hypothesis_draft:
  title: "Hierarchical Weight Space Embeddings for Cross-Architecture Model Property Inference"
  hypothesis_id: "H-HierarchicalWeightEmbedding-v1"
  core_claim: |
    Neural network weight distributions encode task-invariant and training-procedure-invariant
    structural regularities that persist across architecture families (CNNs, Transformers, RNNs, MLPs),
    enabling cross-architecture model property inference on heterogeneous unlabeled collections via
    hierarchical weight space embeddings.
  mechanism: |
    A hierarchical variational autoencoder processes weights through three levels:
    (1) architecture-specific equivariant encoders (NFN for CNNs, UNF for Transformers/RNNs)
    preserve local neuron-permutation symmetries,
    (2) permutation-invariant pooling collapses neuron clusters into layer summaries
    while sacrificing fine-grained equivariance,
    (3) a Transformer models layer sequences to handle heterogeneous architecture lengths
    and discover cross-architecture relational structure via self-attention.

    Training uses three-level supervision: coarse task labels bootstrap initial clustering,
    contrastive triplet loss discovers latent sub-task structure, zero-shot transfer validates
    generalization to unlabeled models.
  predictions:
    - P1: "Same-task different-architecture models cluster more tightly (lower WCSS) than different-task same-architecture models (p<0.01, bootstrap n=100)"
    - P2: "CKA representation similarity for same-task pairs >0.6, different-task pairs <0.4"
    - P3: "Zero-shot task prediction on adversarially mislabeled models achieves >90% accuracy despite 100% corrupted metadata"

variables_summary:
  independent: "Architecture Family Pair (CNN-Transformer, CNN-RNN, etc.), Task Match Condition (Same-Task vs Different-Task)"
  dependent_primary: "Embedding Clustering Tightness (WCSS normalized by between-cluster variance)"
  controlled: "Model Zoo Composition (≥30 models per architecture-task cell), Training Hyperparameters (D=512, L=6, m=0.3), Encoder Initialization (pretrained NFN/UNF)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in embedding space clustering tightness between
    same-task different-architecture model pairs and different-task same-architecture
    model pairs. Clustering reflects architecture-specific patterns, not task-invariant structure.
  statistical_test: "Two-tailed bootstrap hypothesis test comparing WCSS distributions"
  significance_level: 0.01

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    Hierarchical equivariance tradeoff: preserve local neuron-permutation symmetries (micro-level)
    while sacrificing them for cross-architecture generalization (macro-level). Operationalized
    via 3-level VAE. First demonstration that task constraints induce architecture-invariant
    weight structure, enabling zero-shot cross-architecture inference.
  differentiation_summary: |
    NFN/UNF handle single architectures. Task arithmetic requires shared base models.
    SANE processes homogeneous zoos. We enable cross-architecture transfer on heterogeneous
    unlabeled collections by discovering task-invariant structure across computational primitives.

