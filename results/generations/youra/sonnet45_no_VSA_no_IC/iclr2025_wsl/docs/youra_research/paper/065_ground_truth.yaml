# ============================================================
# ADVERSARIAL REVIEW CHECKLIST (Phase 6.5 Protocol)
# ============================================================

adversarial_review_targets:
  quantitative_claims:
    - "WCSS ratio 0.495 — verify bootstrap test implementation, check for data leakage between train/test"
    - "Cohen's d=1.45 — verify effect size calculation, check pooled standard deviation formula"
    - "p<0.000001 — verify t-test assumptions (normality, homoscedasticity), check for p-hacking"
    - "CKA 0.82 — verify CKA formula implementation (linear kernel, centering), check for architectural confounds"
    - "Reconstruction accuracy 0.68 — verify linear probe training (no overfitting), check for label leakage"

  causal_claims:
    - "Step 1 (task constraints impose invariants) — alternative explanation: architecture selection bias (CNNs + ResNets both convolutional)"
    - "Step 2 (NFN encoders preserve task info) — alternative: task signal from metadata leakage (file naming conventions)"
    - "Step 3 (pooling preserves structure) — alternative: marginal reconstruction (0.68) suggests 30% information loss"
    - "Step 4 (Transformer discovers correspondences) — UNVALIDATED (no ablation study)"

  scope_boundaries:
    - "Check if excluded architectures (RNNs, GNNs) would break mechanism"
    - "Check if excluded tasks (NLP, RL) would change conclusions"
    - "Check if excluded granularity (neuron-level) invalidates applications"

  limitations:
    - "L1 (mock dataset) — CRITICAL THREAT, Priority 1 validation required"
    - "L4 (reduced training) — Marginal reconstruction threatens zero-shot transfer claims"
    - "L5 (no ablation) — Cannot claim Transformer contribution without evidence"

  unexpected_findings:
    - "Finding 1 (d=1.45 >> 0.5) — Mock artifact hypothesis most plausible, requires real dataset validation"
    - "Finding 2 (CKA 0.82 >> 0.6) — Consistent with Finding 1 artifact, same mitigation"
    - "Finding 3 (reconstruction 0.68 vs 0.70) — Early stopping likely, full training expected to resolve"

attack_vectors:
    statistical:
      - "Bootstrap test may underestimate variance if 30 iterations insufficient"
      - "Effect size may be inflated by architecture family imbalance (68% CNNs/ResNets)"
      - "CKA similarity may be driven by task-correlated confounds (dataset size, training epochs)"

    causal:
      - "Task structure may be proxy for training procedure (optimizer, augmentation) rather than functional constraints"
      - "Architecture subspace compatibility may reflect shared primitives (convolution) not task-invariant features"
      - "Transformer Level 3 may be redundant (pooling-only achieves same clustering)"

    scope:
      - "Generative models excluded but claim generalizes to 'weight space learning' (overstated scope)"
      - "Fine-grained editing excluded but applications mention 'task vectors' (misleading applicability)"
      - "Vision tasks only but claim 'task constraints dominate' (domain-specific vs universal principle)"

    external_validity:
      - "Mock dataset critically threatens all quantitative claims (CKA 0.82, d=1.45)"
      - "Synthetic models may embed task signals via unrealistic distributions (clean decision boundaries)"
      - "Real dataset validation (Priority 1) REQUIRED before publication"
