# Phase 6.5: Ground Truth Extraction for Adversarial Review
# Generated: 2026-08-20
# Purpose: Extract verifiable claims from 06_paper.md for attack-defense cycle

paper_metadata:
  title: "Hierarchical Variational Autoencoders for Cross-Architecture Weight Space Learning"
  venue: "ICML 2026 (target)"
  primary_hypothesis: "Task-level functional constraints create architecture-invariant structural features in weight distributions"
  extraction_date: "2026-08-20"

# ============================================================
# QUANTITATIVE CLAIMS (Primary Attack Surface)
# ============================================================

quantitative_results:
  primary_finding:
    claim: "Same-task different-architecture models cluster 49.5% as tightly as random baseline"
    metric: "Within-Cluster Sum of Squares (WCSS) ratio"
    value: 0.495
    comparison: "Same-task clusters vs random baseline clusters"
    statistical_test:
      p_value: "<0.000001"
      significance_level: "6 orders of magnitude below α=0.01 threshold"
      effect_size:
        cohens_d: 1.45
        threshold: 0.8  # large effect threshold
        interpretation: "Large effect (>>0.8), exceeds planned medium effect (0.5) by 190%"
      hypothesis_test:
        null_hypothesis: "Same-task WCSS ≥ random WCSS (no task structure)"
        alternative: "Same-task WCSS < random WCSS (task structure present)"
        decision: "REJECT H0 at α=0.01 level"

    bootstrap_statistics:
      iterations: 30
      same_task_mean_wcss: 180.11
      random_baseline_mean_wcss: 364.04
      same_task_std_dev: 23.45
      random_baseline_std_dev: 28.67
      confidence_interval_95: "[175.2, 192.6]"

    per_task_breakdown:
      - task: "CIFAR-10"
        wcss_ratio: 0.42
        cohens_d: 1.68
      - task: "CIFAR-100"
        wcss_ratio: 0.48
        cohens_d: 1.52
      - task: "TinyImageNet"
        wcss_ratio: 0.51
        cohens_d: 1.38
      - task: "MNIST"
        wcss_ratio: 0.45
        cohens_d: 1.61
      - task: "FashionMNIST"
        wcss_ratio: 0.53
        cohens_d: 1.29
      - task: "SVHN"
        wcss_ratio: 0.47
        cohens_d: 1.54
      - task: "USPS"
        wcss_ratio: 0.58
        cohens_d: 1.12
      - task: "STL10"
        wcss_ratio: 0.50
        cohens_d: 1.42
      - task: "EuroSAT"
        wcss_ratio: 0.52
        cohens_d: 1.35

  secondary_findings:
    cka_feasibility_gate:
      same_task_different_arch:
        median: 0.8184
        mean: 0.7956
        std_dev: 0.0834
        min: 0.6203
        max: 0.9421
        threshold: 0.6
        margin: "+36% above threshold"
      different_task:
        median: 0.1423
        mean: 0.1689
        std_dev: 0.0756
        min: 0.0312
        max: 0.3018
        threshold: 0.4
        margin: "-64% below threshold"
      statistical_test:
        test: "Welch's t-test"
        p_value: "<0.0001"
        interpretation: "Distributions do not overlap, task structure dominates"

    reconstruction_task_accuracy:
      accuracy: 0.68
      random_baseline: 0.11
      improvement_over_random: "+56.9 percentage points"
      target_threshold: 0.70
      acceptable_threshold: 0.60
      status: "Marginal (2pp below target, exceeds acceptable)"
      per_task_accuracy:
        - task: "MNIST"
          accuracy: 0.82
        - task: "CIFAR-100"
          accuracy: 0.58
        - task: "TinyImageNet"
          accuracy: 0.64
        - task: "EuroSAT"
          accuracy: 0.75

    coverage_audit:
      total_models: 2120
      architectures: 4
      tasks: 9
      cells_with_30_models: 26
      total_cells: 36
      coverage_percentage: 72.2
      threshold: 70.0
      status: "PASS"
      critical_cells:
        - cell: "CNN-CIFAR10"
          count: 250
          threshold_multiple: 8.3
        - cell: "ResNet-CIFAR100"
          count: 200
          threshold_multiple: 6.7
        - cell: "ResNet-TinyImageNet"
          count: 120
          threshold_multiple: 4.0

    training_convergence:
      epochs: 10  # PoC scale
      planned_epochs: 200  # full-scale
      reconstruction_loss_reduction: "83% (4.11 → 0.70)"
      contrastive_loss_reduction: "74% (0.94 → 0.24)"
      kl_loss_final: 0.53
      task_classification_loss_reduction: "83% (0.46 → 0.08)"
      gradient_explosions: false
      max_gradient_norm: "<5.0 across all epochs"

# ============================================================
# CAUSAL CLAIMS (Mechanism Validation)
# ============================================================

causal_mechanism:
  four_step_chain:
    step1:
      claim: "Task constraints impose architectural invariants on weight distributions"
      evidence: "CKA same-task 0.82 >> threshold 0.6"
      validation_status: "VALIDATED"
      falsifier_avoided: "If task constraints did not impose invariants, same-task CKA would be ≤0.4"

    step2:
      claim: "NFN encoders preserve task-relevant features while preserving neuron permutation equivariance"
      evidence: "Reconstruction task accuracy 0.68 >> random baseline 0.11"
      validation_status: "VALIDATED"
      falsifier_avoided: "If NFN encoders failed to extract task signal, accuracy would be <55%"

    step3:
      claim: "Hierarchical pooling preserves task-relevant structure despite discarding neuron-level details"
      evidence: "WCSS clustering validated (d=1.45), reconstruction accuracy 0.68"
      validation_status: "VALIDATED (marginal on reconstruction)"
      falsifier_avoided: "If pooling destroyed critical information, accuracy would drop <50% and WCSS clustering would fail"
      caveat: "Reconstruction accuracy 2pp below target (0.68 vs 0.70)"

    step4:
      claim: "Transformer discovers relational correspondences between layer types across architectures"
      evidence: "WCSS clustering success (implies Transformer contribution)"
      validation_status: "INFERRED (not directly tested)"
      falsifier_deferred: "Architecture token ablation (Priority 3) required to quantify contribution"
      acceptance_criterion: "If degradation ≥15pp, Transformer critical; if <5pp, redundant"

  hierarchical_design_principle:
    claim: "Trading local equivariance (neuron-level symmetries) for global expressivity (cross-architecture generalization) enables cross-architecture weight space learning"
    operationalization:
      level1: "Architecture-specific equivariant encoders (NFN) preserve neuron permutation symmetries"
      level2: "Permutation-invariant pooling collapses neuron-level details to layer summaries"
      level3: "Transformer sequence modeling discovers relational structure across architectures"
    validation: "Three-level mechanism validated via CKA gate (L1), WCSS clustering (L2+L3), reconstruction accuracy (L2)"

# ============================================================
# SCOPE BOUNDARIES (Defense Perimeter)
# ============================================================

scope_boundaries:
  included:
    architectures:
      - "CNN (convolutional neural networks)"
      - "ResNet (residual networks)"
      - "MLP (multi-layer perceptrons)"
      - "ViT (Vision Transformers)"
    tasks:
      - "CIFAR-10"
      - "CIFAR-100"
      - "TinyImageNet"
      - "MNIST"
      - "FashionMNIST"
      - "SVHN"
      - "USPS"
      - "STL10"
      - "EuroSAT"
    model_types: "Discriminative classifiers (supervised learning)"
    granularity: "Layer-summary scale (pooled statistics, not neuron-level)"

  excluded_principled:
    generative_models:
      excluded: ["GANs", "Diffusion models", "VAE generators"]
      reason: "Encode sampling procedures rather than discriminative functions"
      future_work: "Task-space reformulation treating generation as inverse-classification"

    fine_grained_editing:
      excluded: ["Task arithmetic", "Model merging", "Neuron-level weight editing"]
      reason: "Lossy pooling discards neuron-level details required for invertible encoders"
      future_work: "Replace mean pooling with invertible normalizing flows"

    shallow_models:
      excluded: "Models <10 layers"
      reason: "Insufficient sequential structure for Transformer Level 3"

# ============================================================
# LIMITATIONS (Acknowledged Weaknesses)
# ============================================================

limitations:
  critical:
    L1_mock_dataset:
      severity: "CRITICAL — Blocks publication"
      description: "PoC used synthetic data (27 .pt files + 5 SANE directories) instead of real Zenodo ModelZooDataset downloads"
      threat_to_validity:
        external_validity: "CKA scores may be inflated (synthetic models embed task signals cleanly)"
        effect_size: "WCSS Cohen's d=1.45 may shrink on real data (still likely >0.8)"
        publication_risk: "Reviewers will require real dataset validation for Tier 1 venues"
      mitigation:
        priority: 1
        action: "Download full ModelZooDataset from Zenodo, re-run CKA gate + WCSS test"
        timeline: "4 days (2 days dataset download + 2 days recomputation)"
        resource: "1×V100 GPU ($50 AWS p3.2xlarge)"
        acceptance_criteria: "CKA same-task >0.6 AND WCSS Cohen's d >0.5 on real data"

    L4_reduced_training:
      severity: "MARGINAL — Affects reconstruction only"
      description: "10 epochs (PoC) vs 200 epochs (planned full-scale)"
      threat_to_validity:
        primary_hypothesis: "Unaffected (WCSS clustering validated on 10-epoch checkpoint)"
        reconstruction: "Marginal 68% vs target 70%"
      mitigation:
        priority: 2
        action: "Full 200-epoch training on 2×V100 GPUs"
        timeline: "7 days GPU training"
        resource: "2×V100 ($700 AWS p3.8xlarge)"
        acceptance_criteria: "Reconstruction accuracy ≥0.70"
        fallback: "Replace mean pooling with Set Transformer (learnable aggregation)"

    L5_no_ablation:
      severity: "MECHANISM REFINEMENT"
      description: "No architecture token ablation to quantify Transformer (Level 3) contribution"
      threat_to_validity:
        mechanism_claim: "Cannot claim 'Transformer discovers cross-architecture correspondences' without ablation"
        magnitude: "Clustering success implies contribution, but unverified"
      mitigation:
        priority: 3
        action: "Retrain hierarchical VAE without architecture-type tokens, measure clustering degradation"
        timeline: "2 days (reuse trained NFN encoders)"
        resource: "1×V100 ($50 AWS p3.2xlarge)"
        acceptance_criteria: "If degradation ≥15pp, tokens critical; if <5pp, redundant (simplify to pooling-only)"

  documented_scope_boundaries:
    L7_generative_excluded:
      description: "GANs/Diffusion models excluded (encode sampling procedures, not discriminative functions)"
      impact: "Scope limited to discriminative architectures"
      mitigation: "Future work: task-space reformulation for generative models"
      validity_threat: false

    L8_fine_grained_excluded:
      description: "Task arithmetic/merging excluded (lossy pooling discards neuron-level details)"
      impact: "Inference-only application (task prediction, architecture classification)"
      mitigation: "Future work: invertible normalizing flows for editing"
      validity_threat: false

# ============================================================
# UNEXPECTED FINDINGS (Attack Surface for Competing Explanations)
# ============================================================

unexpected_findings:
  finding1_large_effect_size:
    observation: "Cohen's d=1.45 >> planned 0.5 (190% larger)"
    competing_explanations:
      explanation1:
        hypothesis: "Task structure stronger than expected"
        support: "Functional constraints impose architectural invariants more powerfully than literature predicts"
        implication: "Strengthens novelty claim — task-invariant structure more robust than prior work"
        likelihood: "Plausible (task arithmetic reports d~0.5-0.7 on same-base models)"

      explanation2:
        hypothesis: "Mock dataset artifact"
        threat: "Synthetic models embed task signals more cleanly than real checkpoints"
        implication: "Effect size may shrink on real dataset (d=1.45 → d=0.7-1.0)"
        evidence: "Coverage audit notes 'synthetic data mimicking ModelZooDataset distributions'"
        likelihood: "Higher probability — requires Priority 1 real dataset validation"

      explanation3:
        hypothesis: "Architecture family selection bias"
        threat: "CNNs and ResNets dominate dataset (68%), both use convolution primitives"
        implication: "Effect size inflated by architecture sampling, may decrease with balanced ViT/RNN coverage"
        likelihood: "Moderate — architectural diversity already present (4 families)"

  finding2_high_cka:
    observation: "Same-task CKA 0.82 exceeds threshold 0.6 by 36%"
    competing_explanations:
      explanation1:
        hypothesis: "Architecture subspaces exceptionally compatible"
        support: "Task structure dominates architecture variance even at neuron-embedding level"
        implication: "Validates Assumption A5 — cross-architecture bridge feasible"

      explanation2:
        hypothesis: "Mock dataset artifact"
        threat: "Synthetic models may embed task signals via unrealistic weight distributions"
        implication: "CKA may drop to 0.6-0.7 range on real checkpoints (still above threshold)"
        evidence: "Consistent with Finding 1 artifact hypothesis"

      explanation3:
        hypothesis: "NFN encoders preserve task info better than expected"
        support: "DeepSets-style aggregation (Zaheer 2017) more effective than Zhou et al. 2023 suggests"
        implication: "Mechanism refinement — equivariant encoding preserves task-relevant features while discarding noise"

  finding3_marginal_reconstruction:
    observation: "Reconstruction accuracy 0.68 vs target 0.70 (2pp below)"
    competing_explanations:
      explanation1:
        hypothesis: "Early stopping artifact"
        support: "10 epochs vs 200 planned, reconstruction loss still descending at epoch 10"
        implication: "Full training expected to reach 0.70-0.75 accuracy"
        evidence: "Training curves show no plateau at epoch 10"
        likelihood: "Highly plausible — Priority 2 validation addresses this"

      explanation2:
        hypothesis: "Pooling information loss"
        threat: "Mean pooling fundamentally discards 30% of task-relevant neuron-level structure"
        implication: "Architectural limitation, not training artifact"
        likelihood: "Moderate — reconstruction accuracy 0.68 (not 0.80+) suggests non-trivial loss"

      explanation3:
        hypothesis: "Decoder architecture underfitting"
        threat: "Shared MLP decoder may need task-specific heads or deeper architecture"
        implication: "Implementation issue, not mechanism failure"
        likelihood: "Lower — decoder architecture follows standard VAE design"

