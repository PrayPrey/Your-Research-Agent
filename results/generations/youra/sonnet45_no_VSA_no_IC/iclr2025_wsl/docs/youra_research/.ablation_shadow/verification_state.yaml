main_hypothesis:
  id: H-HierarchicalWeightEmbedding-v1
  title: Hierarchical Weight Space Embeddings for Cross-Architecture Model Property Inference
  statement: Under heterogeneous model zoos (ModelZooDataset, SANE, ViTModelZoo) containing CNNs, Transformers, RNNs, and
    MLPs trained on overlapping task sets, if we train a hierarchical variational autoencoder with architecture-type-aware
    tokenization and three-level supervision (coarse labels → contrastive learning → zero-shot transfer), then same-task different-architecture
    models will cluster more tightly (measured via within-cluster sum of squares) than different-task same-architecture models,
    because task-level functional constraints and training-induced regularities create architecture-invariant structural features
    in weight distributions that persist across computational primitives (convolution vs attention vs recurrence).
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: ModelZooDataset + SANE + ViTModelZoo (Heterogeneous Splits)
    model: Hierarchical VAE with Architecture-Type-Aware Tokenization
    optimizer: Adam
    hyperparameters:
      latent_dim: 512
      transformer_layers: 6
      contrastive_margin: 0.3
