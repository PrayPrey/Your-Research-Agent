# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Execution feedback (unit test pass/fail) provides ground-truth correctness signals"
      status: "BUILD_ON"
      evidence: "CodeRL, RLTF both demonstrate this; execution is deterministic"
    - claim: "AI feedback (Self-Refine) provides semantically rich but potentially incorrect suggestions"
      status: "BUILD_ON"
      evidence: "Self-Refine analysis shows 94% of failures from bad feedback (33% wrong location + 61% wrong fix)"
    - claim: "RLTF's fine-grained error localization improves over episode-level rewards"
      status: "BUILD_ON"
      evidence: "RLTF ablations show fine-grained feedback contributes largest boost"
    - claim: "Execution-Verified AI Feedback (EVAF) can achieve high fidelity + high semantic richness"
      status: "PROVE_NEW"
      evidence: "Novel synthesis from discussion; no prior work implements this combination"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Build on established execution feedback methods (CodeRL/RLTF).
    Prove new: EVAF gating mechanism and its superiority on semantic-error-prone problems.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EVAF-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under post-training alignment of code generation models using CodeT5-770M on
    HumanEval/MBPP benchmarks, if we apply Execution-Verified AI Feedback (EVAF)—
    where AI-generated code critiques are filtered through unit test execution
    before being used as training signals—then EVAF will achieve significantly
    higher pass@1 than pure execution feedback on problems where the baseline
    model primarily fails due to semantic errors (incorrect logic rather than
    syntax/runtime errors), because EVAF combines ground-truth verification
    (filtering out hallucinated AI suggestions) with rich semantic guidance
    (explaining WHY code is wrong), addressing the orthogonal dimensions of
    signal fidelity and semantic richness that neither pure approach satisfies alone.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@1 between EVAF and Exec-Fine
    feedback strategies on semantic-error-prone code generation problems
    (OR = 1.0, 95% CI includes 1.0).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Feedback Strategy"
      type: "categorical"
      operationalization: "Training signal source and verification method"
      levels:
        - "Exec-Coarse: CodeRL-style episode-level test pass/fail reward"
        - "Exec-Fine: RLTF-style line-level error localization"
        - "AI-Only: Self-Refine distilled to training (no execution gating)"
        - "EVAF: AI feedback filtered through execution verification"
  dependent:
    - name: "pass@k"
      type: "continuous"
      operationalization: "Probability of generating correct code within k attempts, k ∈ {1, 5, 10}"
      primary: true
    - name: "Accept Rate"
      type: "continuous"
      operationalization: "Fraction of AI suggestions accepted after execution gating (EVAF only)"
      primary: false
  controlled:
    - name: "Base Model"
      operationalization: "CodeT5-770M with published weights"
    - name: "Training Budget"
      operationalization: "24 hours on 8×V100 GPUs"
    - name: "Evaluation Protocol"
      operationalization: "bigcode-evaluation-harness with nucleus sampling p=0.95, temp=0.6"
    - name: "Benchmarks"
      operationalization: "HumanEval (164 problems), MBPP (500 test), APPS (5000 test)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 6
  steps:
    - step: 1
      description: "AI feedback generator produces semantically rich code critique (variable naming, algorithm suggestions, design patterns)"
      evidence: "Self-Refine demonstrates AI can generate actionable feedback improving code quality"
      falsifier: "AI feedback contains no actionable suggestions (empty or generic feedback)"
    - step: 2
      description: "Some AI suggestions are incorrect due to hallucination (~61% wrong fix rate per Self-Refine)"
      evidence: "Self-Refine failure analysis: 33% wrong location + 61% wrong fix = 94% from bad feedback"
      falsifier: "AI feedback is nearly always correct (>90% accuracy), making verification unnecessary"
    - step: 3
      description: "Execution gating applies AI suggestion tentatively and runs unit tests"
      evidence: "Standard unit test execution; technically straightforward"
      falsifier: "Unit tests are too slow or unavailable for iterative gating"
    - step: 4
      description: "Suggestions that break tests are rejected; suggestions maintaining/improving correctness are accepted"
      evidence: "Binary accept/reject based on test outcomes; deterministic"
      falsifier: "Test suite is too sparse to catch regressions (false accept rate >50%)"
    - step: 5
      description: "Filtered feedback retains semantic richness while achieving high fidelity"
      evidence: "Novel claim; supported by logic (subset of high-fidelity + subset of rich feedback)"
      falsifier: "Accept rate <10% (most rich feedback filtered out) OR accept rate >90% (gating not selective)"
    - step: 6
      description: "Model learns both WHAT to fix (from execution signal) and HOW to fix it (from semantic guidance)"
      evidence: "Combines strengths of RLTF (localization) and Self-Refine (explanation)"
      falsifier: "No improvement over pure execution feedback on semantic-error problems"
  key_tension: "Accept rate trade-off: too aggressive filtering loses richness; too permissive loses fidelity"
  evidence_summary: |
    The mechanism combines established methods (execution feedback from RLTF, AI feedback from
    Self-Refine) in a novel verification pipeline. Key novel claim is that gating preserves
    useful semantic content while filtering errors, which requires empirical validation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Baseline error type distribution (syntactic vs semantic) is stable across training"
    supporting_evidence: "Error types determined by problem structure, not model state"
    consequence_if_violated: "Stratification becomes invalid mid-training; need dynamic re-stratification"
  - id: "A2"
    assumption: "AI feedback errors are detectable via test execution (correctness-affecting)"
    supporting_evidence: "Focus on functional correctness; style/design suggestions excluded from gating"
    consequence_if_violated: "Verification cannot filter bad semantic suggestions about non-functional aspects"
  - id: "A3"
    assumption: "Filtered AI feedback volume is sufficient for learning (accept rate 20-60%)"
    supporting_evidence: "Empirical; must monitor during training"
    consequence_if_violated: "EVAF degenerates to pure execution feedback if accept rate <10%"
  - id: "A4"
    assumption: "HumanEval/MBPP test suites are sufficient to catch regressions"
    supporting_evidence: "Standard benchmarks; ~7 tests/problem average"
    consequence_if_violated: "False accepts lead to learning from incorrect AI suggestions"
  - id: "A5"
    assumption: "CodeT5-770M has sufficient capacity to benefit from richer feedback signals"
    supporting_evidence: "RLTF shows gains with fine-grained feedback on same model"
    consequence_if_violated: "Smaller models may not have capacity to utilize semantic guidance"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Post-training alignment (not pre-training)
    - Code generation tasks with automated test execution
    - Models with sufficient instruction-following capability for feedback generation
    - Benchmarks with adequate test coverage (HumanEval, MBPP, APPS)
  does_not_apply_to: |
    - Pre-training from scratch
    - Code tasks without automated verification (documentation, comments)
    - Style/design feedback (only correctness-affecting feedback can be verified)
    - Models too small for coherent feedback generation
  known_limitations: |
    - Execution gating only works for correctness-affecting suggestions
    - Test suite completeness limits verification quality
    - AI feedback generator quality bounds maximum improvement
    - Computational overhead: 2x inference (generate + verify) plus test execution

