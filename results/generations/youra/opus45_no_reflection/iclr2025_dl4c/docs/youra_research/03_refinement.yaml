novelty:
  preserved_novelty: |
    EVAF is a novel method that combines execution verification with AI feedback,
    achieving high fidelity and high semantic richness simultaneously.
  key_innovation: |
    The fidelity × richness decomposition: execution and AI feedback are not competitors
    but operate along orthogonal dimensions. EVAF uses execution as a gating mechanism
    for AI feedback rather than as an alternative to it.
  differentiation:
    - prior_work: "CodeRL/RLTF"
      difference: "These use pure execution feedback; lack semantic richness explaining WHY code is wrong"
    - prior_work: "Self-Refine"
      difference: "Uses pure AI feedback at test-time; lacks fidelity guarantee (61% wrong fix rate)"
    - prior_work: "CodeT"
      difference: "Uses LLM-generated tests for ranking; doesn't use AI feedback for training signals"

