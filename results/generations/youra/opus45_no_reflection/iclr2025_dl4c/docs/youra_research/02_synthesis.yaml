hypothesis_draft:
  title: "Execution-Verified AI Feedback for Code Generation"
  hypothesis_id: "H-EVAF-v1"
  core_claim: |
    Execution-Verified AI Feedback (EVAF) achieves higher pass@k than either pure
    execution feedback or pure AI feedback on semantic-error-prone code generation
    problems, by combining ground-truth verification with rich semantic guidance.
  mechanism: |
    EVAF uses AI feedback generation (Self-Refine style) followed by execution gating:
    1. Generate AI critique with semantically rich suggestions
    2. Apply suggestions tentatively and run unit tests
    3. Accept only suggestions that maintain/improve test pass rate
    4. Use filtered feedback as training signal via RL

    This achieves high fidelity (verified through execution) AND high semantic richness
    (AI explains WHY code is wrong), addressing orthogonal dimensions that neither
    pure execution nor pure AI feedback satisfies alone.
  predictions:
    - P1: "EVAF > Exec-Fine on semantic-error-prone problems (OR ≥ 1.5, p < 0.05)"
    - P2: "EVAF > AI-Only on semantic-error-prone problems (p < 0.05)"
    - P3: "Exec-Fine ≈ EVAF on syntactic-error-prone problems (non-inferiority)"

variables_summary:
  independent: "Feedback Strategy (4 levels: Exec-Coarse, Exec-Fine, AI-Only, EVAF)"
  dependent_primary: "pass@k (k ∈ {1, 5, 10}) on HumanEval, MBPP, APPS"
  controlled: "Base model (CodeT5-770M), training budget (24h on 8×V100), evaluation protocol (bigcode-evaluation-harness)"

