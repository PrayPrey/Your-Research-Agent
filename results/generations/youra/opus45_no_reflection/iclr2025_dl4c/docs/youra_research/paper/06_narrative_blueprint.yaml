  experiment_status: "FAILED_INCOMPLETE"
  completion_rate: 53%
  hypothesis_id: "H-EVAF-v1"

# ============================================================================
# NARRATIVE DESIGN
# ============================================================================

hook_strategy:
  type: "tension_resolution"
  opening: |
    AI feedback promises semantic richness but suffers from 61% wrong-fix rate.
    Execution feedback ensures correctness but provides no explanatory guidance.
    These approaches have been developed in isolation — what if we combined them?

  hook_sentence: |
    "Large language models can explain code errors in rich detail, but their explanations
    are wrong more often than right — we propose using execution as a truth filter for
    AI-generated feedback."

problem_framing:
  level_1_surface: |
    Code generation models produce incorrect code. Post-training alignment can improve them.
    Current methods use either execution signals (test pass/fail) or AI feedback (LLM critique).

  level_2_deeper: |
    Execution feedback is binary and provides no semantic guidance about WHY code fails.
    AI feedback is rich but unreliable — Self-Refine analysis shows 94% of failures stem
    from bad feedback (33% wrong location + 61% wrong fix).

  level_3_gap: |
    No method combines execution's fidelity with AI's semantic richness. These dimensions
    are orthogonal — high fidelity does not imply low richness. A gating mechanism could
    filter AI suggestions through execution verification, retaining only verified insights.

key_insight:
  statement: |
    Execution feedback and AI feedback operate on orthogonal dimensions: fidelity vs richness.
    Rather than choosing between them, EVAF uses execution as a filter to verify AI suggestions,
    potentially achieving both high fidelity AND high semantic richness.

  novelty: |
    Prior work treats execution and AI feedback as competing alternatives. EVAF treats
    execution as a verification layer for AI feedback — a complementary rather than
    competing relationship.

  theoretical_basis: |
    If AI suggestions are filtered through unit test execution before use as training signals,
    the surviving suggestions should combine execution's correctness guarantee with AI's
    explanatory content.

evidence_narrative:
  structure: "honest_negative"

  what_we_built:
    - "Complete EVAF implementation: 7 modules covering data loading, model wrappers, execution gating, metrics, visualization"
    - "Integration of CodeT5-770M (baseline) + CodeLlama-7b-Instruct (feedback generator)"
    - "Sandboxed test execution with 3.0s timeout"

  what_failed:
    - "Experiment crashed at 53% completion (87/164 HumanEval problems)"
    - "No accept rate or performance metrics measurable"
    - "Root cause: likely GPU memory exhaustion during CodeLlama inference"

  what_remains_unknown:
    - "Whether accept rate falls in viable 20-60% range"
    - "Whether filtered feedback improves model learning"
    - "Comparative performance vs Exec-Fine and AI-Only baselines"

  what_we_learned:
    - "EVAF architecture is implementable with existing tools"
    - "Infrastructure stability is prerequisite for any experimental validation"
    - "Need: checkpointing, memory optimization, smaller batch sizes"

section_goals:
  abstract:
    role: "Honest summary of negative result"
    must_include:
      - "EVAF concept and motivation"
      - "Experiment incomplete (53%)"
      - "No conclusions about effectiveness"
      - "Implementation available for future work"

  introduction:
    role: "Hook → Problem → Insight → Preview (but temper expectations)"
    must_include:
      - "Non-generic hook about feedback quality trade-off"
      - "Three-level problem framing"
      - "EVAF concept introduction"
      - "Honest preview: implementation complete, validation failed"

  related_work:
    role: "Position EVAF in execution vs AI feedback landscape"
    must_include:
      - "CodeRL, RLTF (execution feedback)"
      - "Self-Refine, RefineCoder (AI feedback)"
      - "Gap: no controlled comparison exists"
      - "Hybrid approaches (CodeT)"

  methodology:
    role: "Describe EVAF mechanism and implementation"
    must_include:
      - "Fidelity × Richness framework"
      - "Execution gating algorithm"
      - "Implementation architecture (7 modules)"
      - "Experimental design (inference-only PoC)"

  experiments:
    role: "Describe what was attempted"
    must_include:
      - "HumanEval dataset (164 problems)"
      - "CodeT5-770M baseline generation"
      - "CodeLlama-7b-Instruct feedback generation"
      - "Sandboxed test execution protocol"

  results:
    role: "Report negative/incomplete outcome honestly"
    must_include:
      - "Experiment progress: 87/164 (53%)"
      - "Failure point: EVAF gating phase"
      - "No metrics available (accept rate, pass@1)"
      - "Implementation artifacts created"

  discussion:
    role: "Analyze failure and implications"
    must_include:
      - "Root cause analysis (GPU OOM hypothesis)"
      - "What this does NOT tell us (mechanism not disproven)"
      - "Infrastructure requirements for future validation"
      - "Theoretical framework remains plausible"

  conclusion:
    role: "Callback to hook, honest future work"
    must_include:
      - "Original question unanswered"
      - "Implementation contribution"
      - "Concrete next steps"
      - "Call for infrastructure hardening"

