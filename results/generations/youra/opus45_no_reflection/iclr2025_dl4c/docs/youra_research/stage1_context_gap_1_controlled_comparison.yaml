github_repos:
  - url: "https://github.com/salesforce/CodeRL"
    description: "Official CodeRL implementation (execution feedback)"
  - url: "https://github.com/madaan/self-refine"
    description: "Official Self-Refine implementation (AI feedback)"
  - url: "https://github.com/Zyq-scut/RLTF"
    description: "Official RLTF implementation (fine-grained execution feedback)"

archon_queries:
  - "reinforcement learning code generation execution feedback"
  - "execution feedback AI feedback code alignment"

exa_search_terms:
  - "CodeRL execution feedback code generation"
  - "Self-Refine LLM iterative code refinement"

round_table_folder: "/home/PrayPrey/YouRA_results_new_4_opus45_no_reflection/TEST_dl4c/docs/youra_research/01_round_table"

research_context:
  primary_question: |
    Does execution feedback (test pass/fail signals, compiler errors, runtime traces)
    outperform AI-generated feedback (LLM critique, code review simulation) for
    post-training alignment of code generation models?

  key_metrics:
    - "pass@1"
    - "pass@10"
    - "sample efficiency (feedback iterations)"

  benchmarks:
    - "HumanEval"
    - "MBPP"
    - "APPS"

  base_models:
    - "CodeT5"
    - "CodeGEN"
