# NARRATIVE COHERENCE CHECKS
# ═══════════════════════════════════════════════════════════════

coherence_checks:
  hook_to_results: >
    Introduction hook claims "5× more stable" → Results Section confirms with
    CAB slope 0.00090506 vs MOHAWK slope 0.00452495

  methodology_to_experiments: >
    Methodology defines unified framework → Experiments confirm H-E1 validates both objectives

  results_to_conclusion: >
    Results show bounded CAB drift → Conclusion reinforces as objective selection criterion

  limitations_honest: >
    Discussion explicitly states: PoC only, single teacher, F1 unverified
