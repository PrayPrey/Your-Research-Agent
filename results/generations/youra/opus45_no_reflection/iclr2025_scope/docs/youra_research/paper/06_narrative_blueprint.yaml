# ═══════════════════════════════════════════════════════════════

strongest_claims:
  - claim: "Unified framework enables fair comparison of MOHAWK and CAB objectives"
    evidence: "H-E1 PASS"
    confidence: "HIGH"
    section: "methodology"

  - claim: "CAB produces hidden states with 5× lower drift slope than MOHAWK"
    evidence: "H-M2: CAB 9.05e-04, MOHAWK 4.52e-03"
    confidence: "HIGH"
    section: "results"

  - claim: "Phi-1.5 has hard 2048 token context limit due to fixed positional embeddings"
    evidence: "H-M1: IndexError at >2048"
    confidence: "HIGH"
    section: "experiments"

# ═══════════════════════════════════════════════════════════════
# CLAIMS TO AVOID (NOT PAPER-READY)
# ═══════════════════════════════════════════════════════════════

claims_to_avoid:
  - claim: "Token-level achieves ≥3 F1 pts advantage at 16K"
    reason: "H-M3 FAIL, PoC only"
    status: "REMOVED"

  - claim: "Token-level achieves ≥5 F1 pts advantage at 32K"
    reason: "H-M3 FAIL, cannot test beyond 2048"
    status: "REMOVED"

  - claim: "Crossover point exists at 8K-16K"
    reason: "Cannot test without full training"
    status: "REMOVED"

