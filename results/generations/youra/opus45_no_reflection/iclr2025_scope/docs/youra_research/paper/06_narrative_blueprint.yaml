# Phase 6 Narrative Blueprint
# Narrative-First Paper Design for ICML 2025 Submission
# Generated: 2026-08-18

metadata:
  hypothesis_id: "H-LenDistill-v1"
  title: "Token-Level Distillation Produces More Stable Representations Across Sequence Lengths"
  target_venue: "ICML 2025"
  max_pages: 8

# ═══════════════════════════════════════════════════════════════
# NARRATIVE ARC
# ═══════════════════════════════════════════════════════════════

narrative_arc:
  # Opening hook - NOT generic "X is important"
  hook:
    strategy: "Mechanistic Discovery + Quantified Finding"
    opening_sentence: >
      While matrix-level distillation faithfully captures attention patterns at training lengths,
      token-level alignment produces representations 5× more stable across sequence lengths—a
      mechanistic advantage suggesting superior generalization potential.
    tension: >
      Converting quadratic Transformers to linear-time architectures promises computational
      savings, but the choice of distillation objective fundamentally affects length generalization.
    why_not_generic: >
      Leads with quantified result (5x stability), not vague importance claim. Immediately
      differentiates from prior work by framing as objective comparison rather than method proposal.

  # Problem framing - three levels
  problem_framing:
    surface_problem: >
      Transformers scale quadratically with sequence length, making long-context processing
      prohibitively expensive. Distillation to linear-time architectures (Mamba, SSMs) offers
      a solution.
    deeper_problem: >
      Existing distillation methods use different supervision signals—matrix-level (attention maps)
      vs token-level (Q/K projections)—without understanding which generalizes better beyond
      training lengths.
    gap: >
      No controlled comparison exists between distillation objective types across sequence lengths.
      MOHAWK demonstrates matrix-level success at 2K; CAB shows token-level efficiency; neither
      tests length extrapolation under identical conditions.

  # Key insight - experiment verified
  key_insight:
    statement: >
      Token-level distillation (Q/K→B/C alignment) produces hidden states with 5× lower drift
      slope across sequence lengths compared to matrix-level distillation (attention map matching).
    mechanism: >
      Token-level supervision is position-agnostic (aligns individual projections), while matrix-level
      supervision captures position-position relationships that change with sequence length.
    evidence_source: "H-M2 linear regression: CAB slope 0.00090506, MOHAWK slope 0.00452495"
    confidence: "HIGH"

  # Evidence narrative
  evidence_structure:
    setup: >
      We construct a unified framework implementing both MOHAWK (matrix-level) and CAB (token-level)
      objectives in a single Phi-Mamba codebase.
    test_design: >
      Measure hidden state drift (L2 + cosine) across sequence lengths (512-2048) for both methods.
      Analyze drift slope as function of length.
    key_result: >
      CAB drift slope 5× lower than MOHAWK. CAB drift ratio bounded at 1.34; MOHAWK drift unbounded.
    limitation_frame: >
      Phi-1.5 teacher has hard 2048 token limit (fixed positional embeddings), preventing direct
      supervision at 16K-32K. F1 advantage requires full training (1.5B tokens) not completed in PoC.

  # Closing callback
  conclusion_callback: >
    The 5× stability gap suggests token-level distillation may be preferred when target lengths
    exceed training distribution—a principled criterion for objective selection.

# ═══════════════════════════════════════════════════════════════
# SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    role: "Compress full story in 4-6 sentences"
    must_include:
      - "5× stability gap quantified"
      - "Token-level vs matrix-level comparison frame"
      - "Scope limitation (PoC, 2048 token boundary)"
    word_target: 150

  introduction:
    role: "Hook → Problem → Insight → Preview"
    subsections:
      - name: "Opening hook"
        goal: "Quantified finding leads, not generic importance"
      - name: "Problem framing"
        goal: "Surface → Deeper → Gap progression"
      - name: "Key insight preview"
        goal: "State mechanistic claim with evidence source"
      - name: "Contributions"
        goal: "As story, not bullet list"
    word_target: 800-1000
    figures: []

  related_work:
    role: "Show existing work insufficient → justify our approach"
    subsections:
      - name: "Transformer-to-SSM distillation"
        papers: ["MOHAWK", "CAB", "MambaInLlama", "T2MD"]
        gap: "No length extrapolation comparison"
      - name: "Length generalization"
        papers: ["ALiBi", "RoPE", "Position interpolation"]
        gap: "Focus on attention, not distillation objective"
      - name: "Hybrid architectures"
        papers: ["Nemotron-H", "Kimi Linear"]
        gap: "Architecture-focused, not objective-focused"
    word_target: 600-800

  methodology:
    role: "WHY this design solves the problem"
    subsections:
      - name: "Problem formulation"
        goal: "Define distillation objective types formally"
      - name: "Unified framework"
        goal: "Single codebase enables fair comparison"
        evidence: "H-E1 PASS"
      - name: "Drift measurement"
        goal: "Define hidden state drift metric (L2 + cosine)"
        evidence: "H-M2 methodology"
      - name: "Key design decisions"
        goal: "Why Phi-1.5 teacher, why Phi-Mamba target, why C4 data"
    word_target: 1000-1200
    figures:
      - id: "fig_5"
        purpose: "SSM gate entropy comparison"

  experiments:
    role: "Design experiments that test our specific claims"
    subsections:
      - name: "Experimental questions"
        questions:
          - "Do token-level and matrix-level objectives produce different drift patterns?"
          - "Does Phi-1.5 have length extrapolation limits?"
          - "Can unified framework fairly compare both objectives?"
      - name: "Datasets"
        dataset: "C4 (streaming)"
        rationale: "Standard pretraining corpus, same tokenizer"
      - name: "Models"
        teacher: "Phi-1.5 (1.3B)"
        student: "Phi-Mamba (modified Mamba-2)"
      - name: "Metrics"
        primary: "Hidden state drift slope"
        secondary: "Drift ratio, cosine similarity"
    word_target: 800-1000

  results:
    role: "Present evidence supporting claims"
    subsections:
      - name: "Main result: 5× drift slope difference"
        data: "CAB slope 0.00090506, MOHAWK slope 0.00452495"
        interpretation: "Token-level fundamentally more length-invariant"
        evidence: "H-M2 gate PASS"
      - name: "Teacher context limit discovery"
        data: "IndexError at position 2049"
        interpretation: "Phi-1.5 cannot supervise beyond 2048 tokens"
        evidence: "H-M1 gate PASS"
      - name: "Bounded vs unbounded drift"
        data: "CAB ratio 1.34 (bounded), MOHAWK increasing"
        interpretation: "CAB maintains quality, MOHAWK degrades"
    word_target: 1000-1200
    figures:
      - id: "fig_1"
        purpose: "Primary: Drift vs length plot"
      - id: "fig_2"
        purpose: "Supporting: Per-layer heatmap"
      - id: "fig_4"
        purpose: "Supporting: Drift difference"

  discussion:
    role: "Interpret results, acknowledge limits"
    subsections:
      - name: "Key findings interpretation"
        points:
          - "5× stability suggests generalization advantage"
          - "Position-agnostic supervision transfers better"
      - name: "Honest limitations"
        points:
          - "PoC training only (1M tokens, not 1.5B)"
          - "Single teacher model (Phi-1.5)"
          - "F1 advantage not verified"
          - "Simulated student approximation"
      - name: "Broader impact"
        point: "Principled objective selection criterion for distillation"
    word_target: 400-600

  conclusion:
    role: "Callback to hook, open future"
    subsections:
      - name: "Summary"
        callback: "Return to 5× stability claim, reinforce mechanism"
      - name: "Future work"
        directions:
          - "Full 1.5B token training for F1 verification"
          - "RoPE-based teachers (Llama, Mistral) for true 16K-32K"
          - "Hybrid objectives (MOHAWK + CAB)"
    word_target: 300-400

