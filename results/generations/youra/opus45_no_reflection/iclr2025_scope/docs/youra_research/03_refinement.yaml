# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LenDistill-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the setting of distilling a pretrained Transformer (Phi-1.5) into a Mamba-based
    architecture (Phi-Mamba) for long-context NLU tasks, if we compare token-level distillation
    objectives (CAB-style Q/K→C/B alignment) versus matrix-level objectives (MOHAWK-style
    attention map matching), then token-level objectives achieve superior F1 retention at
    extrapolated sequence lengths (≥16K) while matrix-level objectives achieve comparable or
    better performance at in-distribution lengths (≤4K), because token-level representations
    capture the functional structure of attention that generalizes to unseen lengths, whereas
    matrix-level objectives overfit to specific attention values that degrade under length
    extrapolation.
  alternative_hypothesis_h0: |
    There is no significant difference in F1 retention between token-level and matrix-level
    distillation objectives across sequence lengths (4K, 16K, 32K). The interaction term
    (Objective Type × Sequence Length) is not statistically significant at p<0.05.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "distillation_objective_type"
      type: "categorical"
      operationalization: "Type of alignment objective used during distillation training"
      levels:
        - "matrix_level"   # MOHAWK Stage 1: minimize ||TeacherMixer - StudentMixer||
        - "token_level"    # CAB: align (Q,K) → (C,B) via MLP bridge
    - name: "sequence_length"
      type: "categorical"
      operationalization: "Maximum sequence length during distillation and evaluation"
      levels:
        - "4K"   # In-distribution (2x Phi-1.5 training length)
        - "16K"  # Moderate extrapolation (8x training length)
        - "32K"  # Aggressive extrapolation (16x training length)
  dependent:
    - name: "f1_retention_ratio"
      type: "continuous"
      operationalization: "Student F1 / Teacher F1 on LongBench single-document QA, range [0,1]"
      primary: true
    - name: "hidden_state_drift"
      type: "continuous"
      operationalization: "Mean L2 distance between teacher attention output and student Mamba output per layer"
      primary: false
    - name: "perplexity_retention"
      type: "continuous"
      operationalization: "Teacher PPL / Student PPL on held-out C4 validation"
      primary: false
  controlled:
    - name: "source_model"
      operationalization: "Phi-1.5 (1.3B parameters) for all conditions"
    - name: "target_architecture"
      operationalization: "Phi-Mamba with MOHAWK modifications (multi-head SSM, no Δ, open gates)"
    - name: "training_data"
      operationalization: "C4 dataset, same tokenizer (Phi tokenizer)"
    - name: "training_budget"
      operationalization: "1.5B tokens per condition"
    - name: "evaluation_benchmark"
      operationalization: "LongBench single-document QA subset"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Training Distribution Bound: Phi-1.5 was trained on 2048-length sequences; attention patterns at 16K-32K are extrapolations beyond training distribution"
      evidence: "Phi-1.5 documentation states 2048 max training length"
      falsifier: "If Phi-1.5 demonstrates reliable attention at 32K (low entropy, structured patterns), this step is weakened"
    - step: 2
      description: "Representation Robustness: Token-level Q/K projections encode local attention 'intent' that transfers across lengths; full attention maps at extrapolated lengths contain extrapolation noise"
      evidence: "CAB paper shows token-level alignment requires O(L) vs O(L²) for maps; local representations are length-invariant"
      falsifier: "If attention maps at 32K are as structured as at 4K (similar entropy), map-based transfer should work equally"
    - step: 3
      description: "Objective-Task Match: Token-level alignment transfers robust local representations; matrix-level alignment captures both signal and noise, with noise dominating at extrapolated lengths"
      evidence: "MOHAWK's matrix alignment explicitly minimizes ||TeacherMixer - StudentMixer|| which includes noise"
      falsifier: "If matrix-level distillation includes noise filtering (e.g., top-k attention), it may match token-level"
  key_tension: "Whether attention at extrapolated lengths contains any structured signal, or is purely degenerate"
  evidence_summary: |
    The mechanism is grounded in: (1) Phi-1.5's training length limit creates out-of-distribution
    extrapolation at 16K-32K; (2) CAB's design explicitly avoids attention map materialization;
    (3) MOHAWK's Stage 1 directly optimizes attention map matching. The chain predicts that
    token-level objectives are more robust under length extrapolation.

