key_assumptions:
  - id: "A1"
    assumption: "Phi-1.5 attention at 32K is not fully degenerate (contains some structured signal)"
    supporting_evidence: "Language models often exhibit reasonable extrapolation to 2-4x training length"
    consequence_if_violated: "Both distillation methods fail equally; hypothesis is vacuously true"
  - id: "A2"
    assumption: "Modified Mamba-2 (Phi-Mamba) can faithfully learn to approximate attention patterns"
    supporting_evidence: "MOHAWK demonstrates successful attention-to-SSM transfer at 2K length"
    consequence_if_violated: "Architecture is the bottleneck, not distillation objective"
  - id: "A3"
    assumption: "1.5B tokens per condition is sufficient for distillation convergence"
    supporting_evidence: "CAB uses 200M-4B tokens; MOHAWK uses 3B; 1.5B is within range"
    consequence_if_violated: "Results may show noise rather than true objective differences"
  - id: "A4"
    assumption: "LongBench single-doc QA performance generalizes to other long-context tasks"
    supporting_evidence: "LongBench is a standard benchmark used across prior work"
    consequence_if_violated: "Conclusions limited to single-doc QA task type"
  - id: "A5"
    assumption: "Token-level and matrix-level objectives can be fairly compared using same training setup"
    supporting_evidence: "Both can use same Phi-Mamba architecture and C4 data"
    consequence_if_violated: "Confounds from implementation differences may affect results"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Transformer-to-Mamba distillation for language modeling
    - Pre-trained Transformers with limited context windows (e.g., 2-4K)
    - Target lengths of 4K-32K tokens
    - English NLU tasks (LongBench evaluated)
  does_not_apply_to: |
    - Vision or multimodal distillation (T2MD covers this separately)
    - From-scratch SSM training (not distillation)
    - Very long sequences (>32K) where both methods may fail
    - Non-English languages (not evaluated)
  known_limitations: |
    - Single source model (Phi-1.5) limits generalizability
    - C4 training data may not match LongBench evaluation domain
    - Hybrid objectives (combining matrix + token) not tested in main hypothesis
    - Results may not transfer to Mamba-1 or other SSM variants

