gap_id: "gap1"
gap_title: "Systematic Comparison of Distillation Methods Across Sequence Lengths"
gap_description: |
  Multiple distillation methods exist (MOHAWK, CAB, T2MD, MambaInLlama) but are evaluated
  on different benchmarks, sequence lengths, and source models. No unified comparison exists.
  Missing: Head-to-head comparison on identical source model using LongBench/SCROLLS
  at varying sequence lengths (4K, 8K, 16K, 32K).
