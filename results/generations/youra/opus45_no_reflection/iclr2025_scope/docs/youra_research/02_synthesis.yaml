hypothesis_draft:
  title: "Length-Dependent Distillation Objectives for Transformer-to-Mamba Conversion"
  hypothesis_id: "H-LenDistill-v1"
  core_claim: |
    Token-level distillation objectives (CAB-style Q/K→C/B alignment) enable Mamba to
    generalize to longer sequences (beyond teacher's training distribution) more effectively
    than matrix-level objectives (MOHAWK-style attention map matching), because token-level
    representations capture functional attention structure that extrapolates, whereas
    matrix-level objectives overfit to specific attention values that degrade at unseen lengths.
  mechanism: |
    1. Training Distribution Bound: Phi-1.5 trained on 2048-length sequences creates
       extrapolation challenge at 16K-32K
    2. Representation Robustness: Token-level Q/K projections are length-invariant;
       attention maps become noisy at extrapolated lengths
    3. Objective-Task Match: Token-level alignment transfers robust local representations;
       matrix-level captures noise alongside signal at long lengths
  predictions:
    - P1: "At 4K: Matrix-level ≥ Token-level (within 2 F1 points)"
    - P2: "At 16K: Token-level > Matrix-level by ≥3 F1 points"
    - P3: "At 32K: Token-level > Matrix-level by ≥5 F1 points"

variables_summary:
  independent: "Distillation objective type (matrix-level vs token-level) × Sequence length (4K, 16K, 32K)"
  dependent_primary: "F1 retention ratio (student/teacher) on LongBench single-doc QA"
  controlled: "Source model (Phi-1.5), target architecture (Phi-Mamba), data (C4), budget (1.5B tokens/condition)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in F1 retention between token-level and matrix-level
    distillation objectives across sequence lengths. The interaction term (Objective Type ×
    Sequence Length) is not statistically significant at p<0.05.
  statistical_test: "2×3 factorial ANOVA with planned contrasts for predictions P1-P3"
  significance_level: 0.05

novelty_assessment:
