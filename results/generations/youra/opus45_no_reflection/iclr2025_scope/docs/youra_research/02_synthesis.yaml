  key_innovation: "First controlled comparison of distillation objective types across sequence lengths"
  differentiation_summary: |
    Prior work (MOHAWK, CAB) each validates their approach in isolation at single lengths.
    This work provides the first systematic comparison under controlled conditions, testing
    whether optimal objective depends on target sequence length.

