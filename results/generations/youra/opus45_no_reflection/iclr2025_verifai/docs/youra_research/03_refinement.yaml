# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ActionableSpec-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under LLM-based iterative code repair on standard benchmarks (HumanEval, MBPP),
    if verification signals provide higher Actionable Specificity—decomposed into
    Localization (AS_loc), State Exposure (AS_state), and Causal Context (AS_causal)—
    then single-attempt repair success rates increase, because informationally richer
    feedback enables the model to localize bugs and infer correct fixes.
  alternative_hypothesis_h0: |
    There is no significant difference in repair success rates between verification
    signal types when controlling for error category. Repair success is determined
    solely by error category, and AS components have no predictive power
    (β_loc = β_state = β_causal = 0).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Verification Signal Type"
      type: "categorical"
      operationalization: "6-condition factorial: C1 (full trace), C2 (truncated), C3 (value-masked), C4 (error message), C5 (static analysis), C6 (syntax error)"
      levels: ["C1_full_trace", "C2_truncated", "C3_value_masked", "C4_error_message", "C5_static_analysis", "C6_syntax_error"]
    - name: "AS_loc (Localization)"
      type: "categorical"
      operationalization: "Binary: 1 if error location (file:line) provided, 0 otherwise"
      levels: [0, 1]
    - name: "AS_state (State Exposure)"
      type: "continuous"
      operationalization: "Count of variable values exposed in feedback signal"
    - name: "AS_causal (Causal Context)"
      type: "continuous"
      operationalization: "Execution steps (trace depth) between variable assignment and failure"
  dependent:
    - name: "Single-Attempt Repair Success"
      type: "binary"
      operationalization: "1 if repaired code passes all tests on first attempt, 0 otherwise"
      primary: true
    - name: "Multi-Attempt Time-to-Success"
      type: "continuous"
      operationalization: "Number of attempts until repair succeeds (censored at 3)"
      primary: false
  controlled:
    - name: "Error Category"
      operationalization: "4 levels: syntax, type, runtime, logic"
    - name: "Problem Difficulty"
      operationalization: "Random effect in mixed-effects model"
    - name: "LLM Model"
      operationalization: "Fixed (GPT-4 or Claude 3.5), temperature=0"
    - name: "Random Seed"
      operationalization: "Fixed seed for reproducibility"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Test execution generates verification signal with varying AS levels"
      evidence: "Standard pytest/unittest output; Python trace module for runtime traces"
      falsifier: "If signals cannot be reliably generated with controlled AS levels"
    - step: 2
      description: "LLM receives signal and parses localization, state, and causal information"
      evidence: "LLMs can process structured error messages [DebugRepair 2026]"
      falsifier: "If LLM cannot extract AS components from signal text"
    - step: 3
      description: "Higher AS enables more precise bug localization and correction inference"
      evidence: "TyFlow [2025] shows structured type info improves correctness"
      falsifier: "If repair success is independent of AS level within error categories"
    - step: 4
      description: "Targeted repair attempt succeeds at higher rate with higher AS"
      evidence: "DebugRepair [2026] shows traces > messages; How Many Tries [2026] shows 4.9-17.1pp improvement"
      falsifier: "If regression coefficients β_loc, β_state, β_causal ≈ 0"
  key_tension: "Quantity vs quality of information—too much trace data may overwhelm context (optimal length hypothesis)"
  evidence_summary: |
    Prior work establishes that runtime traces outperform error messages (DebugRepair)
    and type constraints improve correctness (TyFlow). This hypothesis decomposes the
    mechanism into measurable AS components to explain WHY different signals work.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "AS components are independently measurable from signal text"
    supporting_evidence: "Localization (regex for file:line), state exposure (count variables), causal context (count trace lines)"
    consequence_if_violated: "Cannot operationalize AS; must fall back to categorical signal types"
  - id: "A2"
    assumption: "LLMs can effectively use AS information when present"
    supporting_evidence: "DebugRepair [2026], TyFlow [2025] demonstrate LLM use of structured feedback"
    consequence_if_violated: "Hypothesis false—AS has no effect"
  - id: "A3"
    assumption: "Error category confound can be controlled via stratification"
    supporting_evidence: "Standard statistical practice; mixed-effects models handle nested structure"
    consequence_if_violated: "Cannot isolate AS effect from error difficulty"
  - id: "A4"
    assumption: "Single-attempt success is meaningful metric (debugging decay limits multi-attempt value)"
    supporting_evidence: "Debugging Decay [2025] shows 60-80% loss after 2-3 attempts"
    consequence_if_violated: "Need to emphasize multi-attempt survival analysis instead"
  - id: "A5"
    assumption: "Results generalize across LLM models"
    supporting_evidence: "Partial—prior work uses various models with similar patterns"
    consequence_if_violated: "Report model-specific coefficients, acknowledge generalization limits"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Python code generation/repair tasks
    - Standard benchmarks: HumanEval (164 problems), MBPP (500 problems)
    - Single-function repair with unit test feedback
    - Modern LLMs (GPT-4, Claude 3.5, similar capability)
  does_not_apply_to: |
    - Multi-file refactoring or architectural changes
    - Languages without runtime trace support
    - Benchmarks without test oracles (subjective correctness)
    - Models significantly weaker than GPT-4
  known_limitations: |
    - Single LLM tested (may not generalize across models)
    - Python-specific (trace mechanisms differ by language)
    - Academic benchmarks (may not reflect production code complexity)
    - API cost limits sample size for exploratory analyses

