# Narrative Blueprint - Phase 6 Paper Writing
# Story-First Design for ICML 2025 Format
# Research Type: NEGATIVE RESULT (Boundary Condition Discovery)

metadata:
  generated_at: "2026-08-19"
  paper_type: "negative_result"
  format: "ICML2025"
  main_hypothesis_id: "H-ActionableSpec-v1"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "paradox_reveal"
  opening_line: "The most difficult errors to repair are precisely the ones that provide the least actionable feedback."
  paradox: "Assertion errors constitute 53% of benchmark failures and have the lowest repair success (~45%), yet their error messages contain near-zero extractable state information."
  hook_type: "counterintuitive_observation"
  avoids: "Generic 'X is important' opening"

# ============================================================================
# PROBLEM FRAMING (3 Levels)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: "LLM-based code repair shows variable success rates across error types"
    evidence: "4.9-17.1pp improvement from self-repair (How Many Tries 2026)"

  level_2_deeper:
    statement: "Prior work shows richer feedback improves repair, but doesn't explain WHY"
    evidence: "DebugRepair shows traces > messages; TyFlow shows type constraints help"

  level_3_gap:
    statement: "No framework exists to measure and predict feedback informativeness across error types"
    evidence: "Our novel Actionable Specificity decomposition (AS_loc, AS_state, AS_causal)"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  statement: "Actionable Specificity operationalization reveals a hidden boundary condition: the theoretical promise of 'richer feedback enables better repair' holds only when that richness is extractable."

  experiment_verified: true
  evidence: "H-E1: 49.5% extraction rate vs 95% target; AS_state = 2.7% on assertion-dominated sample"

  mechanism: "Assertion errors produce output like 'AssertionError' without file:line traceback frames, creating fundamental mismatch between error types that need actionable feedback and those that provide it."

  contribution_type: "boundary_condition_discovery"

# ============================================================================
# NARRATIVE ARC
# ============================================================================

narrative_arc:
  act_1_setup:
    sections: ["introduction", "related_work"]
    goal: "Establish the AS framework as principled approach to understanding feedback effectiveness"
    tension: "Will AS decomposition explain why different signals work?"

  act_2_method:
    sections: ["methodology", "experiments"]
    goal: "Operationalize AS with concrete extraction patterns; design existence test"
    design_principle: "Simple regex extraction to establish feasibility bounds"

  act_3_evidence:
    sections: ["results", "discussion"]
    goal: "Present negative result as methodological contribution"
    key_finding: "Extraction fails on assertion-dominated benchmarks"
    reframe: "Boundary condition discovery, not framework failure"

  act_4_closure:
    sections: ["conclusion", "abstract"]
    goal: "Position work as foundational for future research"
    callback_to_hook: "The paradox is explained: assertion errors lack extractable structure"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_role: "Compress full story in 4-6 sentences"
    must_include:
      - "AS decomposition framework"
      - "Key quantitative result (49.5% extraction, 2.7% AS_state)"
      - "Boundary condition: assertion-dominated benchmarks"
      - "Methodological contribution framing"

  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    subsections:
      - name: "Opening hook"
        content: "Paradox of assertion errors"
      - name: "Problem framing"
        content: "Three levels culminating in gap"
      - name: "Key insight preview"
        content: "AS framework and boundary condition"
      - name: "Contributions"
        content: "As story, not list"

  related_work:
    narrative_role: "Show existing work insufficient → justify our approach"
    structure: "Group by approach type, show each misses AS decomposition"
    categories:
      - "Self-repair methods (How Many Tries, CodeCoR)"
      - "Trace-based debugging (DebugRepair, Self-Debug)"
      - "Type-guided generation (TyFlow)"
      - "Feedback informativeness (gap we fill)"

  methodology:
    narrative_role: "WHY this design solves the problem"
    subsections:
      - name: "AS Framework Definition"
        content: "AS_loc, AS_state, AS_causal decomposition"
      - name: "Operationalization"
        content: "Regex extraction patterns"
      - name: "Signal Generation"
        content: "6 conditions (C1-C6)"
      - name: "Design Rationale"
        content: "Simplest operationalization to establish bounds"

  experiments:
    narrative_role: "Design experiments that test our specific claims"
    subsections:
      - name: "Research Questions"
        content: "RQ1: Is AS measurable? RQ2: Does ordering hold?"
      - name: "Dataset"
        content: "HumanEval + MBPP (664 problems)"
      - name: "Evaluation Protocol"
        content: "600 signals, extraction rate metrics"

  results:
    narrative_role: "Present evidence supporting claims"
    subsections:
      - name: "Main Results"
        content: "49.5% extraction rate; breakdown by component"
      - name: "Error Type Analysis"
        content: "53.4% assertion errors → near-zero state extraction"
      - name: "Ordering Verification"
        content: "C1≥C2≥C3≥C4 preserved despite low absolute values"
    figures:
      - "extraction_rate_bar.png"
      - "extraction_heatmap.png"

  discussion:
    narrative_role: "Interpret results, acknowledge limits"
    subsections:
      - name: "Key Findings"
        content: "Boundary condition discovery; why regex fails on assertions"
      - name: "Limitations"
        content: "Single operationalization; single benchmark family"
      - name: "Implications"
        content: "Future AS research must stratify by error type"

  conclusion:
    narrative_role: "Callback to hook, open future"
    subsections:
      - name: "Summary"
        content: "AS framework reveals extraction boundary"
      - name: "Future Work"
        content: "LLM-based extraction; pytest --tb=long; traceback-rich subsets"

# ============================================================================
# EVIDENCE STRUCTURE
# ============================================================================

evidence_structure:
  primary_claims:
    - claim: "AS extraction via regex achieves only 49.5% coverage on HumanEval/MBPP"
      evidence: "600 signals analyzed, 297 with valid extraction"
      confidence: "HIGH"
      section: "results"

    - claim: "Assertion errors (53.4% of failures) produce <3% extractable state information"
      evidence: "AS_state = 2.7% on assertion-dominated sample"
      confidence: "HIGH"
      section: "results"

    - claim: "AS ordering (C1≥C2≥C3≥C4) holds even under low extraction"
      evidence: "Ordering verified on 49.5% extracted subset"
      confidence: "MEDIUM"
      section: "results"

  negative_result_framing:
    what_failed: "Regex-based AS extraction on assertion-dominated benchmarks"
    why_informative: "Reveals boundary condition for AS framework applicability"
    methodological_contribution: "Documents what researchers should check before designing feedback mechanisms"

# ============================================================================
# PAPER FORMAT CONSTRAINTS
# ============================================================================

format:
  style: "ICML2025"
  max_main_pages: 8
  target_word_counts:
    abstract: 150
    introduction: 900
    related_work: 700
    methodology: 1100
    experiments: 900
    results: 1100
    discussion: 500
    conclusion: 350
    total: 5700

# ============================================================================
# KEY CITATIONS
# ============================================================================

key_citations:
  - id: "howmanytries2026"
    used_for: "Self-repair baseline, assertion error difficulty"

  - id: "debugrepair2026"
    used_for: "Traces > messages prior work"

  - id: "tyflow2025"
    used_for: "Type constraints improve correctness"

  - id: "debuggingdecay2025"
    used_for: "60-80% capability loss justifies single-attempt metric"

  - id: "codecor2025"
    used_for: "Multi-agent SOTA baseline"
