# H-E1 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: AS Components Are Measurable (EXISTENCE)
# Budget: LIGHT (15 epics max)

metadata:
  hypothesis_id: h-e1
  hypothesis_type: EXISTENCE
  tier: LIGHT
  total_epics: 5
  overall_complexity: MEDIUM
  gate_type: MUST_WORK

epics:
  - id: A-1
    name: Data Pipeline
    description: Load HumanEval+MBPP, generate buggy code, run pytest, stratified sample 100 failures
    complexity: 12
    breakdown: "4+3+3+2 (Module_Size+Dependencies+Algorithm+Integration)"
    priority: P0
    subtasks:
      - id: L-1-1
        name: load_datasets
        description: HF datasets.load_dataset for HumanEval + MBPP
      - id: L-1-2
        name: generate_buggy_code
        description: LLM call, temp=0.7, prompt for intentional bug
      - id: L-1-3
        name: run_pytest_capture
        description: subprocess pytest, capture stderr as error/trace
      - id: L-1-4
        name: sample_failures
        description: error-type stratified sampling, seed=42

  - id: A-2
    name: Signal Generation
    description: Implement 6 condition variants (truncate/mask/error-only/syntax)
    complexity: 8
    breakdown: "3+2+2+1"
    priority: P0
    subtasks:
      - id: L-2-1
        name: truncate_trace + mask_values
        description: frame-limit and value-masking transforms
      - id: L-2-2
        name: extract_error_only
        description: last error line via regex
      - id: L-2-3
        name: extract_syntax_error
        description: SyntaxError-specific line extraction
      - id: L-2-4
        name: generate_signal_variants
        description: assemble dict of 6 conditions per failure

  - id: A-3
    name: AS Extractors
    description: Regex-based extract_AS_loc/state/causal + ASComponents dataclass
    complexity: 7
    breakdown: "2+1+3+1"
    priority: P0
    subtasks:
      - id: L-3-1
        name: ASComponents dataclass
        description: fields + is_valid
      - id: L-3-2
        name: compile regex patterns
        description: FILE_LINE, VARIABLE_VALUE, TRACEBACK_FRAME
      - id: L-3-3
        name: extract_AS_loc
        description: binary file:line detection
      - id: L-3-4
        name: extract_AS_state
        description: var=value counting w/ false-positive filter
      - id: L-3-5
        name: extract_AS_causal
        description: frame count via TRACEBACK_FRAME_PATTERN
      - id: L-3-6
        name: extract_all_components
        description: wraps all three into ASComponents
      - id: L-3-7
        name: edge case handling
        description: multi-file / nested exception traces

  - id: A-4
    name: Evaluation + Metrics
    description: Extraction rate, ordering check, correlation matrix
    complexity: 6
    breakdown: "2+2+1+1"
    priority: P0
    subtasks:
      - id: L-4-1
        name: compute_extraction_rate
        description: per-component + overall rate over 600 signals
      - id: L-4-2
        name: verify_ordering
        description: mean AS_state comparison C1>C2>C3>C4
      - id: L-4-3
        name: compute_correlation_matrix
        description: np.corrcoef over 3 component arrays
      - id: L-4-4
        name: results aggregation
        description: build results_by_condition dict from raw extractions
      - id: L-4-5
        name: CSV export
        description: dump per-signal ASComponents + metrics to results/
      - id: L-4-6
        name: PoC gate check
        description: rate>=0.95 and ordering==True -> pass/fail print

  - id: A-5
    name: Visualization + PoC Gate
    description: 4 figures, CSV export, pass/fail summary
    complexity: 5
    breakdown: "2+1+1+1"
    priority: P0
    subtasks:
      - id: L-5-1
        name: plot_extraction_rate_bar
        description: mandatory gate figure
      - id: L-5-2
        name: plot_component_boxplots
        description: AS_loc/state/causal by C1-C6
      - id: L-5-3
        name: plot_extraction_heatmap
        description: components x conditions success matrix
      - id: L-5-4
        name: plot_correlation_matrix
        description: 3x3 heatmap of Pearson r
      - id: L-5-5
        name: main() orchestration
        description: wire evaluate.py pipeline end-to-end

summary:
  total_epics: 5
  total_subtasks: 26
  complexity_distribution:
    very_high: 0
    high: 0
    medium: 1
    low: 4
  ready_for_phase4: true
