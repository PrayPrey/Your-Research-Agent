hypothesis_draft:
  title: "Actionable Specificity: Decomposing Feedback Effectiveness for LLM Code Repair"
  hypothesis_id: "H-ActionableSpec-v1"
  core_claim: |
    Verification signal effectiveness in LLM code repair is mediated by Actionable
    Specificity (AS), decomposed into three measurable components: Localization,
    State Exposure, and Causal Context. Higher AS leads to higher repair success
    because informationally richer feedback enables targeted bug localization and
    correction inference.
  mechanism: |
    1. Verification signal generated from failed test execution
    2. Signal encodes AS components: location (file:line), variable states, execution trace
    3. LLM parses AS information to localize bug and infer correction
    4. Higher AS → more precise localization → higher single-attempt repair success
    Key tension: Optimal AS level may exist (too much trace data overwhelms context)
  predictions:
    - P1: "AS components collectively predict repair success (p < 0.05 for model comparison)"
    - P2: "Full trace outperforms error message by ≥5pp on assertion errors"
    - P3: "Value-masked trace outperforms syntax baseline by ≥5pp (structure helps)"
    - P4: "Non-monotonic dose-response: optimal trace length ~20-50 lines"

variables_summary:
  independent: "Verification signal type (6 conditions: full trace, truncated, value-masked, error message, static analysis, syntax error)"
  dependent_primary: "Single-attempt repair success (binary: 0/1)"
  controlled: "Error category (4 levels), problem difficulty (random effect), LLM model, temperature"

null_hypothesis:
  h0_statement: |
    Repair success is independent of AS components. Error category alone determines
    repair success. β_loc = β_state = β_causal = 0 in the logistic regression model.
  statistical_test: "Likelihood ratio test: full model vs error-category-only model"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Actionable Specificity framework—first decomposition of feedback effectiveness into measurable components"
  differentiation_summary: |
    Prior work (DebugRepair, TyFlow, How Many Tries) measured WHAT signals work.
    This hypothesis explains WHY by decomposing signals into AS components and
    quantifying their relative importance via regression coefficients.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["GPT-4", "Claude 3.5 Sonnet"]
  datasets: ["HumanEval (164 problems)", "MBPP (500 problems)"]
  baselines: ["Single-shot generation", "Error message only (C4)", "Static analysis (C5)"]

measurement_plan:
  data_collection:
    - source: "HumanEval benchmark"
      method: "Generate initial code, run tests, capture 6 signal variants per failure"
    - source: "MBPP benchmark"
      method: "Same pipeline as HumanEval"
  procedure:
    - step: "Generate initial code with LLM (temperature=0)"
    - step: "Run pytest, capture failure output"
    - step: "Generate 6 signal variants (C1-C6) per failure"
    - step: "For each variant, attempt single-attempt repair"
    - step: "Record success/failure, compute AS metrics"
    - step: "Repeat for multi-attempt analysis (up to 3 attempts)"
  success_criteria:
    - "P1: Likelihood ratio test p < 0.05"
    - "P2: C1 > C4 by ≥5pp with p < 0.05 on assertion errors"
    - "P3: C3 > C6 by ≥5pp with p < 0.05"
    - "P4: Significant quadratic term (β_AS² < 0)"

validation:
  internal_validity:
    - "Within-problem comparison: same problem, 6 signal conditions"
    - "Error category stratification: control for difficulty differences"
    - "Fixed LLM and temperature: eliminate model variance"
    - "Random seed: reproducibility"
  external_validity:
    - "Two benchmarks: HumanEval + MBPP"
    - "Multiple error categories: syntax, type, runtime, logic"
    - "Limitation: single LLM, results may not generalize"

discussion_synthesis:
  key_insights:
    - "Signal effectiveness is not monolithic—AS decomposes it into measurable components"
    - "Causal context (traces) may matter more than raw state exposure (variable values)"
    - "Optimal information level may exist—too much trace can overwhelm context"
    - "Error category is a confound that must be controlled, not a variable of interest"
  breakthrough_moments:
    - "Exchange 3: Dr. Sage reframed from 'which signal' to 'why signals work'"
    - "Exchange 5: Dr. Ally proposed AS formula as objective operationalization"
    - "Exchange 7: Dr. Nova proposed manipulation check (signal variants) for causality"
    - "Exchange 13: Dr. Nova proposed learning AS weights from data (empirical finding)"
  resolved_tensions:
    - "AS operationalization: use observable signal properties, no new rubrics"
    - "Effect sizes: anchored to prior work (5pp minimum from How Many Tries)"
    - "Multi-attempt confound: address via survival analysis, cap at 3 attempts"
    - "Static analysis strawman: corrected to include localization (AS_loc=1)"
