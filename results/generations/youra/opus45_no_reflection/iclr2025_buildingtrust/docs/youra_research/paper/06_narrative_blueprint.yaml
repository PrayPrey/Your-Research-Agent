# Narrative Blueprint for Paper
# Phase 6 Step 2 - Narrative Design
# Generated: 2026-08-18

# NOTE: This paper documents methodology and preliminary findings.
# Experimental results are INCONCLUSIVE due to simulated ASR data.
# Paper framed as "methodology paper" with honest limitations.

narrative_type: "methodology_paper_with_preliminary_results"
data_status: "INCONCLUSIVE - mock ASR data, 3/12 models evaluated"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "unification_of_fragmented_literature"
  opening_sentence: >
    Three research communities—factuality evaluation, adversarial robustness,
    and calibration—have independently developed metrics that may share a
    common underlying signal, yet no unified framework connects them.

  problem_statement: >
    Models that detect their own errors (factuality) and resist adversarial
    perturbations (robustness) appear to share internal properties, but this
    connection remains unquantified and unexplored.

  why_now: >
    With the proliferation of LLM deployments in high-stakes domains,
    understanding what makes a model reliable across multiple dimensions
    is critical for safe deployment.

# ============================================================================
# PROBLEM FRAMING (3 Levels)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: "LLMs fail in two ways: generating falsehoods and succumbing to adversarial inputs."
    examples:
      - "GPT-4 produces confident but incorrect medical advice"
      - "TextFooler manipulates sentiment classifiers with synonym substitution"

  level_2_deeper:
    statement: "Both failure modes stem from overconfident predictions on uncertain inputs."
    insight: >
      A model that knows its uncertainty could flag both factual errors and
      adversarial examples. This suggests calibration as a shared mechanism.

  level_3_gap:
    statement: "No empirical work has quantified whether factuality and robustness correlate via calibration."
    gap: >
      Error detection literature focuses on detection accuracy; robustness
      literature focuses on attack success rates; calibration literature
      focuses on confidence-accuracy alignment. None connect all three.

    our_contribution: >
      We propose and validate a methodology to test whether calibration
      quality (ECE) mediates the correlation between factuality (TruthfulQA MC1)
      and adversarial robustness (1-ASR on TextFooler).

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  one_sentence: >
    Calibration quality may serve as a shared internal signal that enables
    both factuality error detection and adversarial robustness.

  mechanism: >
    Well-calibrated models produce confidence scores aligned with accuracy.
    This alignment allows the model to (1) detect its own factual errors via
    uncertainty and (2) flag adversarial inputs as uncertain.

  prediction: >
    If calibration mediates both behaviors, then:
    P1: MC1 and (1-ASR) correlate positively (r > 0.5)
    P2: ECE mediates ≥30% of the correlation
    P3: Temperature scaling improves both metrics

  verification_status: "UNVERIFIED - requires real experimental data"

# ============================================================================
# EVIDENCE STRUCTURE
# ============================================================================

evidence_structure:
  experimental_setup:
    models: "12 open-weight LLMs (Llama-2, Llama-3, Mistral, FLAN-T5, Phi)"
    factuality_metric: "TruthfulQA MC1 accuracy"
    robustness_metric: "1 - Attack Success Rate on TextFooler"
    calibration_metric: "Expected Calibration Error (ECE)"

  analysis_pipeline:
    - step: "Evaluate all models on TruthfulQA MC1"
      status: "3/12 models completed"
    - step: "Run TextFooler attacks on SST-2"
      status: "NOT COMPLETED - ASR simulated"
    - step: "Compute Pearson correlation with bootstrap CI"
      status: "COMPLETED with mock data"
    - step: "Partial correlation controlling for scale"
      status: "COMPLETED with mock data"
    - step: "ECE mediation analysis"
      status: "NOT STARTED"

  current_results:
    correlation: "r = -0.999 (ARTIFACT of simulation formula)"
    p_value: "0.034"
    models_evaluated: 3
    validity: "INVALID - ASR values simulated, not measured"

# ============================================================================
# SECTION NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_role: "Compress full story with honest limitations"
    key_points:
      - "State hypothesis: calibration mediates factuality-robustness correlation"
      - "Describe methodology: 12-model evaluation, correlation analysis"
      - "Report current status: pipeline validated, full results pending"
      - "Honest framing: preliminary work, methodology contribution"

  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    structure:
      - "Opening hook: Unification of fragmented communities"
      - "Problem level 1: Two failure modes (falsehoods, adversarial)"
      - "Problem level 2: Shared mechanism (overconfidence)"
      - "Problem level 3: Gap (no empirical connection)"
      - "Our contribution: Methodology to test calibration mediation"

  related_work:
    narrative_role: "Show prior work insufficient, justify approach"
    clusters:
      - name: "Factuality and Truthfulness"
        papers: ["TruthfulQA (Lin 2022)", "TruthEval (Khatun 2024)", "NL-ITI (Hoscilowicz 2024)"]
        gap: "Focus on detection, not correlation with robustness"
      - name: "Adversarial Robustness"
        papers: ["TextFooler (Jin 2019)", "BERT-Attack", "AdvGLUE"]
        gap: "Focus on attack success, not calibration connection"
      - name: "Calibration"
        papers: ["Guo 2017", "Minderer 2021", "Temperature scaling"]
        gap: "Focus on confidence-accuracy, not joint factuality-robustness"

  methodology:
    narrative_role: "WHY this design solves the problem"
    key_decisions:
      - decision: "Use TruthfulQA MC1 for factuality"
        rationale: "Established benchmark, probes factual knowledge"
      - decision: "Use TextFooler for robustness"
        rationale: "Word-level perturbation, standard in NLP adversarial"
      - decision: "Use ECE for calibration"
        rationale: "Directly measures confidence-accuracy alignment"
      - decision: "12+ diverse models"
        rationale: "Statistical power, cross-family generalization"

  experiments:
    narrative_role: "Design experiments that test specific claims"
    questions:
      - "Q1: Does correlation exist? (P1)"
      - "Q2: Does calibration mediate? (P2)"
      - "Q3: Does intervention work? (P3)"

  results:
    narrative_role: "Present evidence supporting claims"
    framing: "Honest: pipeline validated, results preliminary"
    what_to_show:
      - "Pipeline functionality demonstration"
      - "Preliminary 3-model results (with caveats)"
      - "Figures (clearly labeled as based on simulated data)"

  discussion:
    narrative_role: "Interpret results, acknowledge limits"
    key_points:
      - "Pipeline validated: methodology sound"
      - "Results inconclusive: need real TextFooler attacks"
      - "Limitations: mock data, 3/12 models, no mediation analysis"
      - "Path forward: specific next steps"

  conclusion:
    narrative_role: "Callback to hook, open future"
    structure:
      - "Recall unification goal"
      - "State methodology contribution"
      - "Acknowledge incomplete validation"
      - "Future: complete evaluation, test mechanism"

# ============================================================================
# HONEST LIMITATIONS (Must Include)
# ============================================================================

limitations:
  critical:
    - limitation: "ASR values simulated, not measured"
      impact: "All correlation results invalid"
      mitigation: "Run real TextFooler attacks"

    - limitation: "Only 3/12 models evaluated"
      impact: "Insufficient statistical power"
      mitigation: "Complete 12-model evaluation"

  acceptable:
    - limitation: "Correlational, not causal"
      framing: "Foundation for causal investigation"

    - limitation: "Word-level perturbations only"
      framing: "TextFooler is standard; future work: distributional"

    - limitation: "Open-weight models only"
      framing: "Logprobs required; proprietary APIs could extend"

# ============================================================================
# PAPER FRAMING
# ============================================================================

paper_framing:
  type: "methodology_paper"
  contribution: >
    We propose a methodology to test whether calibration quality mediates
    the correlation between LLM factuality and adversarial robustness.
    Our evaluation pipeline is validated; full experimental results pending.

  honest_status: >
    This paper presents preliminary work. The hypothesis remains untested
    due to incomplete data collection. We contribute a validated methodology
    and identify specific next steps for completion.

  publication_readiness: "NOT READY - requires real experimental data"
