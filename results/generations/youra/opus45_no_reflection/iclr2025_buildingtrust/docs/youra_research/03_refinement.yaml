  - id: "P2"
    primary: true
    statement: "Calibration quality (ECE) mediates at least 30% of the detection-robustness correlation"
    test_method: "Baron-Kenny mediation analysis with Sobel test"
    success_criterion: "Indirect effect accounts for > 30% of total effect, Sobel p < 0.05"
    falsification: "Adding ECE to regression does not improve R² by > 10%"
  - id: "P3"
    primary: false
    statement: "Temperature scaling (calibration intervention) improves both factuality and robustness"
    test_method: "Before/after comparison on 2-3 models after optimizing temperature for ECE"
    success_criterion: "Delta(MC1) > 0 AND Delta(1-ASR) > 0 for at least 2/3 tested models"
    falsification: "No model shows improvement in both metrics after temperature scaling"

