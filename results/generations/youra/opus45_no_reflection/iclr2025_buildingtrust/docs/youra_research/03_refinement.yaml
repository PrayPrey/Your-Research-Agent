# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Calibration quality produces reliable uncertainty estimates"
      evidence: "Minderer et al. (2021): Architecture determines calibration; well-calibrated models have confidence aligned with accuracy"
      falsifier: "Models with low ECE show unreliable confidence-accuracy alignment"
    - step: 2
      description: "Reliable uncertainty estimates enable better error detection"
      evidence: "SPOC (Zhao et al., 2025): Verify-then-revise relies on confidence for self-correction"
      falsifier: "Calibrated models show no advantage in error detection tasks"
    - step: 3
      description: "Reliable uncertainty estimates enable better robustness"
      evidence: "Theoretical: adversarial inputs should produce high uncertainty in well-calibrated models"
      falsifier: "Calibrated models show same ASR as miscalibrated models"
  key_tension: "Calibration may be necessary but not sufficient; other factors (architecture, training) may dominate"
  evidence_summary: |
    The mechanism proposes calibration as the shared internal signal. Models with
    better calibration produce more trustworthy confidence estimates, which serve
    dual purposes: (1) enabling the model to "know when it's wrong" (error detection),
    and (2) flagging adversarial inputs as uncertain (robustness). This creates the
    behavioral correlation between factuality and robustness metrics.

