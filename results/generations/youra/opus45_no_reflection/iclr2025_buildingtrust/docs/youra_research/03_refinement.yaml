# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CalibRobust-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the scope of open-weight LLMs evaluated on word-level adversarial perturbations,
    if a model exhibits higher factuality error detection accuracy (TruthfulQA MC1),
    then it will demonstrate higher adversarial robustness (1 - ASR on TextFooler),
    because calibration quality (lower ECE) provides a shared internal signal that
    enables both error detection and robustness.
  alternative_hypothesis_h0: |
    There is no significant correlation (r < 0.3) between factuality error detection
    accuracy (TruthfulQA MC1) and adversarial robustness (1 - ASR) after controlling
    for model scale. Calibration does not mediate any observed relationship.

