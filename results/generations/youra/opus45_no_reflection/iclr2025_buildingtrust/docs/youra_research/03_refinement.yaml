# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "ECE reliably measures calibration quality across models and datasets"
    supporting_evidence: "ECE is standard metric in calibration literature (Guo et al., 2017)"
    consequence_if_violated: "Mediation analysis would be invalid; need alternative calibration metric"
  - id: "A2"
    assumption: "TruthfulQA MC1 captures factuality-related error detection capability"
    supporting_evidence: "TruthfulQA designed specifically to test truthfulness and avoidance of falsehoods"
    consequence_if_violated: "Need different benchmark for error detection construct"
  - id: "A3"
    assumption: "TextFooler ASR represents meaningful adversarial robustness"
    supporting_evidence: "TextFooler is standard benchmark in adversarial NLP literature"
    consequence_if_violated: "Findings may not generalize to other perturbation types"
  - id: "A4"
    assumption: "Correlation between models represents meaningful relationship, not spurious confound"
    supporting_evidence: "Within-family analysis controls for training data; scale regression controls for capacity"
    consequence_if_violated: "Hidden confound explains correlation without calibration mechanism"
  - id: "A5"
    assumption: "Open-weight models are representative of LLMs generally"
    supporting_evidence: "Open-weight models include diverse architectures (encoder-decoder, decoder-only)"
    consequence_if_violated: "Findings may not generalize to proprietary models"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Open-weight LLMs (Llama, Mistral, FLAN-T5, Phi families)
    - Word-level adversarial perturbations (TextFooler, BERT-Attack)
    - Factuality error detection on TruthfulQA and HaluEval benchmarks
    - Models where logprobs can be extracted for calibration measurement
  does_not_apply_to: |
    - Proprietary API models (GPT-4, Claude) where logprobs unavailable
    - Character-level or sentence-level perturbations
    - Distributional shift robustness (domain transfer)
    - Vision-language models or other modalities
  known_limitations: |
    - Correlational evidence, not causal proof
    - Temperature scaling intervention provides quasi-causal support only
    - Limited to English language benchmarks
    - Attention head analysis (Level 3) limited to models with NL-ITI data

