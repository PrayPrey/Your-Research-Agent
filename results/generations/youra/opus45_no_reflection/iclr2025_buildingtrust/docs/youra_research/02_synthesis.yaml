hypothesis_draft:
  title: "Calibration-Mediated Correlation Between Factuality and Robustness in LLMs"
  hypothesis_id: "H-CalibRobust-v1"
  core_claim: |
    In open-weight LLMs, factuality error detection accuracy positively correlates
    with word-level adversarial robustness, mediated by calibration quality. Models
    with better calibration (lower ECE) produce more reliable confidence estimates,
    enabling both error detection and robustness through a shared internal signal.
  mechanism: |
    1. Calibration quality produces reliable uncertainty estimates
    2. Reliable uncertainty enables better error detection (knowing when wrong)
    3. Reliable uncertainty enables better robustness (flagging adversarial inputs)

    The mechanism proposes that well-calibrated models have confidence aligned with
    accuracy, allowing them to identify both factual errors and adversarial inputs
    through elevated uncertainty.
  predictions:
    - P1: "Cross-model correlation r > 0.5 between TruthfulQA MC1 and (1 - ASR)"
    - P2: "ECE mediates > 30% of the detection-robustness correlation"
    - P3: "Temperature scaling improves both metrics in at least 2/3 tested models"

variables_summary:
  independent: "Model identity (categorical), model scale (log params)"
  dependent_primary: "Adversarial robustness (1 - ASR on TextFooler)"
  controlled: "Perturbation type (TextFooler), benchmark versions (fixed)"

null_hypothesis:
  h0_statement: |
    There is no significant correlation (r < 0.3) between factuality error detection
    accuracy and adversarial robustness after controlling for model scale. Calibration
    (ECE) does not explain any observed relationship between these metrics.
  statistical_test: "Pearson correlation with bootstrap CI, mediation analysis with Sobel test"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical framework connecting factuality benchmarks to robustness metrics via calibration mechanism"
  differentiation_summary: |
    Prior work treats error detection (ARES, FactSelfCheck), robustness (TextFooler),
    and calibration (Minderer et al.) as separate research tracks. This hypothesis
    proposes calibration as the unifying mechanism that predicts both factuality
    and robustness, creating actionable insights for practitioners.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
