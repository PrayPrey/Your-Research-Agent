measurement_plan:
  data_collection:
    - source: "TruthfulQA MC1 via lm-evaluation-harness"
    - source: "TextFooler ASR via TextAttack on SST-2 (1000 samples)"
    - source: "ECE computed from model logprobs with 10 equal-frequency bins"
  procedure:
    - step: "Run TruthfulQA MC1 on all models, extract logprobs"
    - step: "Compute ECE from TruthfulQA probability outputs"
    - step: "Apply TextFooler to SST-2, compute ASR per model"
    - step: "Temperature scaling: grid search T in [0.5, 2.0], optimize ECE"
    - step: "Re-run metrics with optimal temperature for intervention test"
  success_criteria:
    - "P1: r > 0.5, p < 0.05, bootstrap 95% CI excludes 0.3"
    - "P2: Indirect effect > 30% of total, Sobel p < 0.05"
    - "P3: 2/3 models show improvement in both metrics after temp scaling"

