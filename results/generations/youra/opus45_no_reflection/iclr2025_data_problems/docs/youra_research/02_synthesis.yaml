hypothesis_draft:
  title: "Architecture-Aware Data Attribution: Attention Structure Determines Method Efficiency"
  hypothesis_id: "H-ArchAttr-v1"
  core_claim: |
    Transformer attention structure (encoder bidirectional vs decoder causal) systematically
    affects data attribution efficiency-accuracy trade-offs, with different approximation
    methods (EK-FAC, TracIn, TRAK) favoring different architectures due to how their
    assumptions interact with attention-induced Hessian curvature patterns.
  mechanism: |
    1. Encoder-only models (BERT) have bidirectional attention creating dense O(n²) gradient dependencies
    2. Decoder-only models (GPT-2) have causal attention creating block-diagonal-ish gradient structure
    3. EK-FAC's Kronecker factorization assumption fits causal structure better (lower approximation error)
    4. TracIn's gradient-only approach benefits from encoder's denser gradient signal
    5. TRAK's random projections are architecture-agnostic by design
  predictions:
    - P1: "EK-FAC achieves higher accuracy on GPT-2 than BERT at matched compute"
    - P2: "TracIn achieves higher accuracy on BERT than GPT-2 at matched compute"
    - P3: "TRAK shows minimal architecture variance (<2% AUC difference)"

variables_summary:
  independent: "Architecture type (encoder-only vs decoder-only), Attribution method (TRAK, EK-FAC, TracIn), Compute budget (gradient computations per query)"
  dependent_primary: "Mislabeled detection AUC on SST-2 with 5% injected label noise"
  controlled: "Model size (~110-125M params), layer count (12), dataset (SST-2), training procedure"

null_hypothesis:
  h0_statement: |
    There is no significant difference in efficiency-accuracy trade-offs across
    encoder-only (BERT) and decoder-only (GPT-2) architectures for any of the three
    attribution methods at matched compute budgets.
  statistical_test: "Paired t-test across random seeds (5 seeds per configuration)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First matched cross-architecture comparison with predictive theory based on attention-curvature-approximation interaction"
  differentiation_summary: |
    Prior work evaluated methods on single architectures (EK-FAC on decoder-only,
    TRAK on encoder-only). We provide the first systematic matched comparison and
    propose a predictive framework for method selection based on architecture properties.

