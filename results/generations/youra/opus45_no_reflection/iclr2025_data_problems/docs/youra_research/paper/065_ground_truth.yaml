# Quantitative claims that can be verified
quantitative_claims:

  # Attention sparsity (H-M1)
  - claim_id: "Q1"
    section: "Results"
    claim: "Attention sparsity differs by 98.8% between architectures"
    ground_truth:
      bert_upper_sparsity: 0.0118
      gpt2_upper_sparsity: 1.0
      difference: 0.9882
    source: "h-m1/04_validation.md"
    tolerance: 0.01

  # Hessian eigenvalue (H-M2)
  - claim_id: "Q2"
    section: "Results"
    claim: "GPT-2 has 11x higher top Hessian eigenvalue than BERT"
    ground_truth:
      bert_top_eigenvalue: 0.0455
      gpt2_top_eigenvalue: 0.502
      ratio: 11.03
      relative_diff: 0.9093
    source: "h-m2/04_validation.md"
    tolerance: 0.05

  # TRAK invariance (P3)
  - claim_id: "Q3"
    section: "Results"
    claim: "TRAK <1% AUC difference at all compute budgets"
    ground_truth:
      proj_64_diff: 0.0056
      proj_256_diff: 0.0011
      proj_1024_diff: 0.0042
      max_diff: 0.0056
    source: "h-m4/04_validation.md"
    threshold: 0.01

  # TracIn BERT advantage (P2)
  - claim_id: "Q4"
    section: "Results"
    claim: "TracIn shows ~3% BERT advantage at low compute"
    ground_truth:
      checkpoint_1_bert: 0.979
      checkpoint_1_gpt2: 0.949
      diff_pct: 3.03
      p_value: 0.26
    source: "h-m4/04_validation.md"
    note: "Directionally supported, not statistically significant"

  # EK-FAC minimal difference (P1)
  - claim_id: "Q5"
    section: "Results"
    claim: "EK-FAC shows only 0.27% difference"
    ground_truth:
      bert_auc: 0.941
      gpt2_auc: 0.944
      diff_pct: 0.27
      p_value: 0.90
    source: "h-m4/04_validation.md"
    note: "Not significant, contrary to predicted advantage"

