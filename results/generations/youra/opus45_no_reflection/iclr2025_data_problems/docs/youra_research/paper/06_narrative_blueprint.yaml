# Part 1: Hook & Motivation
hook:
  opening_statement:
    content: "When practitioners choose a data attribution method, does it matter whether they're explaining BERT or GPT-2? We show that it depends on the method: TRAK is architecture-agnostic (<1% AUC difference), while TracIn favors encoders and the expected EK-FAC advantage for decoders does not materialize."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Practitioners need guidance on which attribution method to use across different architectures; wrong choice wastes compute or degrades attribution quality"
    concrete_example: "A team debugging a GPT-2 model might choose EK-FAC expecting better decoder performance, but our results show this advantage doesn't exist"
    stakes: "Without architecture-aware method selection, practitioners either waste compute on suboptimal methods or get unreliable attributions"

  real_world_impact:
    application_domain: "ML debugging, data quality assessment, model interpretability"
    potential_beneficiaries: "ML practitioners, model developers, AI safety researchers"
    scale_of_impact: "Anyone using gradient-based attribution on transformers"

problem_framing:
  surface_problem:
    description: "Data attribution methods have different computational costs and accuracy characteristics"
    common_understanding: "Methods like TRAK, EK-FAC, and TracIn make different approximations, leading to different trade-offs"

  deeper_problem:
    description: "Whether these trade-offs interact with model architecture is unknown"
    why_overlooked: "Prior work evaluated methods on single architectures; EK-FAC on decoders, TRAK on encoders"
    our_perspective: "Attention structure (bidirectional vs causal) fundamentally affects gradient flow and Hessian curvature, which should interact with approximation assumptions"

  gap_in_existing_work:
    description: "No systematic matched cross-architecture comparison of attribution method performance"
    why_gap_exists: "Requires controlled experiments with matched model sizes across architectures"
    why_gap_matters: "Practitioners have no guidance on architecture-method selection"

# Part 2: The Insight
key_insight:
  aha_moment:
    one_sentence: "TRAK's random projection mechanism provides robust cross-architecture attribution (<1% difference), while curvature-dependent methods show architecture-specific patterns."
    expanded_explanation: "By projecting high-dimensional gradients to a fixed random subspace, TRAK averages out architecture-specific gradient patterns. TracIn's gradient dot-product captures richer information with bidirectional attention. EK-FAC's Kronecker assumption is more robust than predicted."

  why_others_missed_it:
    common_assumptions: "Methods were assumed to perform consistently across architectures"
    our_different_view: "Attention structure creates fundamentally different gradient flow patterns that interact with approximation methods"
    enabling_factor: "Matched 12-layer models (BERT-base, GPT-2) with same training procedure"

  what_makes_it_work:
    intuitive_explanation: "TRAK's random projection is like averaging - it smooths out architecture-specific patterns. TracIn's dot-product preserves gradient structure, benefiting from BERT's dense gradients."
    key_mechanism: "Attention sparsity (1.2% vs 100%) propagates through backprop, creating 11x Hessian eigenvalue difference"
    analogy: "Random projection is like taking a photo from many angles and averaging - individual perspectives differ, but the average is consistent"

# Part 3: Evidence Story
evidence_narrative:
  main_claim:
    statement: "Transformer attention structure creates measurable differences in attribution method performance, with TRAK showing architecture-invariance while TracIn and EK-FAC show architecture-dependent patterns"
    measurable_criteria: "TRAK <1% AUC difference; TracIn BERT advantage ~3%; EK-FAC minimal difference (~0.3%)"

  supporting_evidence:
    - id: "evidence_1"
      what: "TRAK achieves <1% AUC difference across BERT and GPT-2 at all compute budgets"
      so_what: "Practitioners can use TRAK regardless of architecture"
      how_it_supports_claim: "Confirms P3 prediction of architecture-invariance"

    - id: "evidence_2"
      what: "GPT-2 has 11x higher top Hessian eigenvalue than BERT (0.502 vs 0.046)"
      so_what: "Explains why curvature-dependent methods might behave differently"
      how_it_supports_claim: "Validates causal mechanism step 2"

    - id: "evidence_3"
      what: "Attention sparsity differs by 98.8% (BERT 1.2%, GPT-2 100%)"
      so_what: "Quantifies the fundamental structural difference driving downstream effects"
      how_it_supports_claim: "Validates causal mechanism step 1"

    - id: "evidence_4"
      what: "TracIn shows ~3% BERT advantage at low compute"
      so_what: "Gradient dot-product benefits from dense bidirectional gradients"
      how_it_supports_claim: "Directionally supports P2 prediction"

  surprising_findings:
    finding: "EK-FAC does NOT show the predicted GPT-2 advantage (only 0.27% difference)"
    why_surprising: "Prior work suggested Kronecker factorization fits causal structure better"
    our_interpretation: "EK-FAC's Kronecker approximation is more robust to attention structure than theoretical analysis suggested"

  what_results_mean:
    synthesis: "For cross-architecture work, use TRAK. For encoder-only work, consider TracIn. EK-FAC works equally well on both."
    confidence_level: "High for TRAK invariance (P3 confirmed); Medium for TracIn/EK-FAC (directional, needs more seeds)"
    caveats: "Results on SST-2 mislabeled detection; 2-seed experiments provide directional but not statistical proof for P1/P2"

# Part 4: Broader Impact
takeaway:
  main_contribution:
    one_sentence: "First systematic demonstration that TRAK provides robust cross-architecture attribution, enabling architecture-agnostic data debugging."
    why_significant: "Provides actionable guidance for practitioners choosing attribution methods"

  implications:
    for_field: "Opens research into architecture-aware attribution method design"
    for_practice: "Practitioners can confidently use TRAK across architectures; TracIn for encoder-only pipelines"
    conceptual_contribution: "Random projection provides architecture-agnosticism; curvature-aware methods show architecture-specific patterns"

  future_possibilities:
    immediate_extensions: "Test on larger models (1B+), more tasks, encoder-decoder architectures (T5)"
    longer_term_vision: "Architecture-aware attribution selection algorithms that automatically choose optimal methods"
    open_questions: "Does TRAK invariance hold at higher projection dimensions? Does the pattern hold for instruction-tuned models?"

