gap_id: "gap1_architecture_comparison"
gap_title: "Systematic Architecture Comparison for Data Attribution"
gap_description: |
  No systematic study compares efficiency-accuracy trade-offs across encoder/decoder/encoder-decoder
  architectures for data attribution methods. EK-FAC evaluates decoder-only (52B), TRAK evaluates
  BERT and CLIP separately, but no unified head-to-head comparison exists.
