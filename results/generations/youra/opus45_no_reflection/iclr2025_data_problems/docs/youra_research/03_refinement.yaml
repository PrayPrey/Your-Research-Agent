key_assumptions:
  - id: "A1"
    assumption: "Matched layer count (12) is sufficient to control for depth effects"
    supporting_evidence: "Standard practice in transformer comparison studies"
    consequence_if_violated: "Observed differences could be due to depth rather than attention structure"
  - id: "A2"
    assumption: "SST-2 mislabeled detection generalizes to other attribution benchmark tasks"
    supporting_evidence: "SST-2 is standard sentiment benchmark; mislabeled detection is common IF evaluation"
    consequence_if_violated: "Results may not transfer to other tasks like data cleaning or proponent detection"
  - id: "A3"
    assumption: "5% label noise injection rate is representative"
    supporting_evidence: "Common rate in mislabeled detection literature (Koh & Liang 2017)"
    consequence_if_violated: "Higher/lower noise rates may show different architecture effects"
  - id: "A4"
    assumption: "Implementation quality is equivalent across methods and architectures"
    supporting_evidence: "Using established libraries (kronfluence, trak) with documented correctness"
    consequence_if_violated: "Implementation bugs could create spurious architecture differences"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Encoder-only (BERT-style) and decoder-only (GPT-style) transformer architectures
    - Text classification tasks where both architectures can be applied
    - Model sizes in the 100M-200M parameter range
    - Gradient-based data attribution methods (TRAK, EK-FAC, TracIn)
  does_not_apply_to: |
    - Encoder-decoder architectures (T5) — deferred to secondary analysis due to layer count confound
    - Vision transformers — different attention patterns, different tasks
    - Models larger than 1B parameters — compute constraints
    - Non-gradient attribution methods (e.g., activation-based)
  known_limitations: |
    - Layer count matching limits architecture choices (e.g., can't compare BERT-large to GPT-2-small)
    - Text classification may not represent all attribution use cases
    - Results may not generalize to instruction-tuned or RLHF models

