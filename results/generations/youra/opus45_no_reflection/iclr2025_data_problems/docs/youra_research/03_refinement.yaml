    - name: "Architecture Type"
      type: "categorical"
      operationalization: "Encoder-only (BERT-base) vs Decoder-only (GPT-2)"
      levels: ["encoder-only", "decoder-only"]
    - name: "Attribution Method"
      type: "categorical"
      operationalization: "TRAK, EK-FAC, or TracIn implementation"
      levels: ["TRAK", "EK-FAC", "TracIn"]
    - name: "Compute Budget"
      type: "continuous"
