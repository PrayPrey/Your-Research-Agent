    - name: "Dataset"
      operationalization: "SST-2 sentiment classification with 5% synthetic label noise"
    - name: "Training Procedure"
      operationalization: "Same optimizer (AdamW), learning rate schedule, and epochs"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Attention pattern structure differs between encoder (bidirectional) and decoder (causal)"
      evidence: "Architectural definition — bidirectional attention computes O(n²) attention weights, causal computes O(n²/2)"
      falsifier: "Would be falsified if attention patterns don't affect gradient computation — unlikely given autograd"
    - step: 2
      description: "Different attention structures create different Hessian curvature patterns"
      evidence: "Grosse et al. noted causal structure creates block-diagonal-ish attention Jacobians"
      falsifier: "Would be falsified if Hessian structure is architecture-invariant — test via Hessian spectrum analysis"
    - step: 3
      description: "Attribution approximation methods make different assumptions about curvature"
      evidence: "EK-FAC assumes Kronecker factorization; TRAK uses random projections; TracIn ignores curvature"
      falsifier: "Would be falsified if approximation assumptions are architecture-independent in practice"
    - step: 4
      description: "Architecture-approximation interaction determines efficiency-accuracy trade-off"
      evidence: "Core hypothesis — to be validated empirically"
      falsifier: "Falsified if <5% relative accuracy difference across architectures OR Pareto curves overlap"
  key_tension: "Whether random projections (TRAK) are truly architecture-agnostic or show subtle differences"
  evidence_summary: |
    The mechanism is grounded in: (1) architectural definitions of attention patterns,
    (2) Grosse et al.'s observation about EK-FAC fitting causal structure, and
    (3) the mathematical properties of each approximation method.

