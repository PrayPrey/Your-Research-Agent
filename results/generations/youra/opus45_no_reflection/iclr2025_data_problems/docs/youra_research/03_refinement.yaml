# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ArchAttr-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under matched architectures (BERT-base 12L vs GPT-2 12L, ~110-125M params) and
    text classification tasks (SST-2 mislabeled detection), if we compare TRAK, EK-FAC,
    and TracIn attribution methods, then decoder-only GPT-2 will show better efficiency-accuracy
    trade-offs for EK-FAC, encoder-only BERT will show better trade-offs for TracIn, and
    TRAK will show minimal architecture variance, because attention structure interacts
    differently with each method's approximation mechanism.
  alternative_hypothesis_h0: |
    There is no significant difference in efficiency-accuracy trade-offs across
    encoder-only (BERT) and decoder-only (GPT-2) architectures for any of the three
    attribution methods (TRAK, EK-FAC, TracIn) at matched compute budgets.

