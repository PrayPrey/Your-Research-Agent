predictions:
  - id: "P1"
    primary: true
    statement: "EK-FAC achieves statistically significantly higher mislabeled detection AUC on decoder-only GPT-2 than on encoder-only BERT at matched compute budgets"
    test_method: "Run EK-FAC (kronfluence) on both architectures at 3 compute levels; compare AUC with paired t-test"
    success_criterion: "p < 0.05 for GPT-2 > BERT difference; effect size Cohen's d > 0.3"
    falsification: "p > 0.05 OR Cohen's d < 0.3 OR BERT > GPT-2"
  - id: "P2"
    primary: false
    statement: "TracIn achieves statistically significantly higher mislabeled detection AUC on encoder-only BERT than on decoder-only GPT-2 at matched compute budgets"
    test_method: "Run TracIn on both architectures at 3 checkpoint counts; compare AUC with paired t-test"
    success_criterion: "p < 0.05 for BERT > GPT-2 difference; effect size Cohen's d > 0.3"
    falsification: "p > 0.05 OR Cohen's d < 0.3 OR GPT-2 > BERT"
  - id: "P3"
    primary: false
    statement: "TRAK shows no statistically significant architecture difference in mislabeled detection AUC at matched compute budgets"
    test_method: "Run TRAK on both architectures at 3 projection dimensions; compare AUC with paired t-test"
    success_criterion: "p > 0.05 (no significant difference) AND absolute AUC difference < 2%"
    falsification: "p < 0.05 AND absolute AUC difference > 5%"

