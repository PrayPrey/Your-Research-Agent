    key_message: "Foundation models caused measurable phase transition in benchmark dynamics"
    constraints:
      - "No citations"
      - "No undefined acronyms"
      - "Include one striking result"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Connect temporal dynamics gap to existing static analyses"
    word_target: "~800-1000"

  related_work:
