# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: "The rise of foundation models didn't just change what AI can do—it transformed how we measure progress. In April 2019 and March 2021, the benchmark ecosystem underwent two statistically significant structural breaks, coinciding with GPT-3 and ViT adoption."
    strategy: "counterintuitive_finding"
    rationale: "Lead with concrete timing tied to well-known models; position as first quantitative evidence of phase transition"

  why_reader_should_care:
    main_reason: "Benchmark choice shapes what problems researchers pursue; understanding ecosystem dynamics is essential for meta-scientific understanding of AI progress"
    concrete_example: "Emergent-capability benchmarks (MMLU, BIG-Bench, HumanEval) now capture 26.5% of researcher attention vs 7.5% pre-2021"
    stakes: "Without understanding these dynamics, we cannot distinguish genuine AI progress from benchmark artifact"

# ============================================================================
# PROBLEM FRAMING (THREE LEVELS)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Benchmark concentration in ML research has been documented but only through 2020"
    common_understanding: "Koch et al. (2021) showed Gini ~0.6-0.7 and elite institution dominance"

  deeper_problem:
    description: "Foundation models may have caused a structural break in benchmark dynamics, but no quantitative evidence exists"
    why_overlooked: "Prior work used static snapshots; no time-series analysis with change-point detection"
    our_perspective: "Treat benchmark usage as a dynamic system that can exhibit phase transitions"

  gap_in_existing_work:
    description: "No methodology exists to detect and characterize structural breaks in benchmark concentration dynamics"
    why_gap_exists: "Requires combining time-series analysis (PELT) with bibliometric methods"
    why_gap_matters: "Cannot understand foundation model impact without temporal analysis"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Foundation model emergence caused a measurable structural break in ML benchmark concentration, driven by researcher attention shift rather than modality fragmentation"
    expanded_explanation: |
      Using PELT change-point detection on 84 months of benchmark usage data, we identify two
      structural breaks (2019-04, 2021-03) with BIC improvement of 17.13 over monotonic trend.
      The mechanism is attention reallocation: emergent benchmark share increased from 7.53% to
      26.54% (χ²=1025, p<10⁻²²⁴). Critically, modalities never had unified dynamics to
      fragment—CV-NLP correlation was -0.13 pre-2020.

  why_others_missed_it:
    common_assumptions: "Assumed benchmark dynamics follow monotonic trends; assumed modality dynamics were unified"
    our_different_view: "Applied phase transition framework from physics/economics to bibliometric data"
    enabling_factor: "Seven years of Papers With Code data (2018-2024) combined with PELT algorithm"

  what_makes_it_work:
    intuitive_explanation: "Foundation models created demand for new evaluation paradigms; the benchmark ecosystem restructured to meet that demand"
    key_mechanism: "Supply-side (19x benchmark creation acceleration) + Demand-side (+19% attention shift) = Phase transition signal"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Foundation model emergence caused a statistically significant phase transition in benchmark concentration dynamics"
    measurable_criteria: "PELT detects change points in 2019-2022 window; BIC improves over monotonic model"

  supporting_evidence:
    - id: "evidence_1"
      what: "Two PELT-detected change points (2019-04, 2021-03)"
      so_what: "First quantitative evidence of structural breaks in benchmark usage"
      how_it_supports_claim: "Confirms phase transition exists with timing aligned to foundation model milestones"
      source: "h-e1"

    - id: "evidence_2"
      what: "85.13% of emergent benchmarks created post-2020 with 19x acceleration"
      so_what: "Supply-side response to foundation model capabilities was dramatic"
      how_it_supports_claim: "Shows mechanism step 2: new benchmarks created for emergent capabilities"
      source: "h-m2"

    - id: "evidence_3"
      what: "Researcher attention shifted +19% to emergent benchmarks (χ²=1025, p<10⁻²²⁴)"
      so_what: "Behavior change is statistically unambiguous"
      how_it_supports_claim: "Shows mechanism step 3: attention reallocation"
      source: "h-m3"

    - id: "evidence_4"
      what: "Traditional benchmarks persist with 11.7% share and 47k papers"
      so_what: "Ecosystem restructured but didn't abandon established evaluation"
      how_it_supports_claim: "Shows mechanism step 4: persistence with reduced dominance"
      source: "h-m4"

  surprising_findings:
    - finding: "CV-NLP Gini correlation was -0.131 pre-2020, not >0.6 as hypothesized"
      why_surprising: "Phase transition framework assumed unified baseline dynamics"
      our_interpretation: "Modalities were always independent; foundation models restructured rather than fragmented the ecosystem"
      source: "h-m5"

  what_results_mean:
    for_understanding: "Foundation models triggered ecosystem-wide restructuring detectable as statistical phase transition"
    for_practice: "Benchmark selection should account for this structural shift"
    for_field: "Meta-scientific analysis of AI progress requires dynamic, not static, methods"

# ============================================================================
# BROADER IMPACT / TAKEAWAY
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First quantitative evidence that foundation model emergence caused a phase transition in ML benchmark concentration dynamics"
    why_significant: "Transforms speculation about foundation model impact into measurable phenomenon"

  implications:
    for_field: "Meta-scientific studies of AI progress need temporal dynamics, not snapshots"
    for_practice: "Practitioners should understand that benchmark ecosystems can undergo structural breaks"

  future_possibilities:
    immediate_extensions: "Test whether multimodal foundation models (CLIP, Flamingo) drove CV-NLP correlation increase post-2021"
    longer_term_vision: "Develop predictive models for benchmark ecosystem dynamics"

