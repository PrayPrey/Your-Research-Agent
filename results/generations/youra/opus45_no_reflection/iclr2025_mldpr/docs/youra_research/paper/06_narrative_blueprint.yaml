      - decision: "Papers With Code data source"
        rationale: "Most comprehensive benchmark usage database with temporal coverage"
    word_target: "~1000-1200"

  experiments:
    narrative_purpose: "Design experiments that test our specific claims"
    experimental_questions:
      - "RQ1: Does aggregate Gini exhibit structural breaks in 2019-2022?"
      - "RQ2: Did foundation papers have exceptional impact?"
      - "RQ3: Did emergent benchmark creation accelerate post-2020?"
      - "RQ4: Did researcher attention shift from traditional to emergent benchmarks?"
      - "RQ5: Did modality dynamics diverge post-2021?"
    dataset_rationale: "Papers With Code 2018-2024 provides task-dataset-metric triplets"
    baseline_rationale: "Monotonic trend (null hypothesis) vs segmented model"
    word_target: "~800-1000"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "Two change points detected with BIC Δ=17.13"
    structure:
      - "Phase transition signal (h-e1)"
      - "Mechanism verification chain (h-m1 through h-m4)"
      - "Modality analysis finding (h-m5 refutation)"
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    key_findings_interpretation:
      - "Phase transition is restructuring, not fragmentation"
      - "Modalities were always independent"
    honest_limitations:
      - "h-m1 used mock citation data due to API timeout"
      - "PWC data may not generalize to all ML research"
      - "Monthly resolution is approximate"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Callback to hook, open future"
    callback_to_hook: "Return to 'how we measure progress' theme"
    future_directions:
      - "Test multimodal foundation model synchronization hypothesis"
      - "Extend analysis pre-2018 for earlier transitions"
      - "Portfolio churn analysis (original P4)"
    word_target: "~300-400"

