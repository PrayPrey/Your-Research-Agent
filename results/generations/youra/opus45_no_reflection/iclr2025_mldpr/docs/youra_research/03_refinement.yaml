predictions:
  - id: "P1"
    primary: true
    statement: "PELT/Bai-Perron detects a statistically significant change point in aggregate Gini coefficient time series within the 2019-2022 window"
    test_method: "Apply PELT algorithm to monthly aggregate Gini series 2018-2024"
    success_criterion: "Change point detected at α=0.05 significance level within 2019-2022"
    falsification: "No change point detected in 2019-2022, or single monotonic trend fits better than segmented model"
  - id: "P2"
    primary: false
    statement: "Post-2021 Pearson correlation between CV and NLP Gini series drops below 0.4 from pre-2020 baseline of >0.6"
    test_method: "Compute rolling-window Pearson correlations, compare pre-2020 vs post-2021 windows"
    success_criterion: "Pre-2020 r > 0.6; Post-2021 r < 0.4; difference significant via Fisher z-test"
    falsification: "Correlation remains above 0.5 in both periods, or does not significantly decrease"
  - id: "P3"
    primary: false
    statement: "Monthly Gini velocity for text-modality benchmarks exceeds image-modality by >2 standard deviations post-2021"
    test_method: "Compute monthly Gini derivative per modality; compare distributions post-2021"
    success_criterion: "Mean text-modality velocity > mean image-modality velocity + 2σ"
    falsification: "Velocity difference not significant or in opposite direction"
  - id: "P4"
    primary: false
    statement: "Portfolio churn (Top-50 benchmark turnover) significantly increases post-2020 compared to pre-2020"
    test_method: "Compute monthly churn = 1 - Jaccard(Top50_t, Top50_{t-1}); compare periods via t-test"
    success_criterion: "Post-2020 mean churn > pre-2020 mean churn at α=0.05"
    falsification: "Churn rates not significantly different or decrease post-2020"

