# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkPhaseTransition-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the condition of measuring ML benchmark usage patterns (2018-2024) using Papers With Code data,
    if the foundation model paradigm shift (2020-2021) represents a genuine structural change in research
    evaluation practices, then we will observe: (a) a statistically significant change point in aggregate
    Gini coefficient time series, (b) divergent concentration trajectories across input modalities, and
    (c) elevated benchmark portfolio churn, because foundation models redirect researcher attention toward
    emergent-capability benchmarks while fragmenting the previously unified benchmark ecosystem.
  alternative_hypothesis_h0: |
    Benchmark concentration 2018-2024 follows a single monotonic trend with no structural break;
    modality-specific patterns remain correlated (r > 0.5); foundation model emergence had no
    detectable effect on concentration dynamics or portfolio churn.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "time_period"
      type: "categorical"
      operationalization: "pre-2020 vs post-2021 based on foundation model emergence"
      levels: ["pre_2020", "post_2021"]
    - name: "benchmark_modality"
      type: "categorical"
      operationalization: "Input modality from Papers With Code task categories"
      levels: ["text", "image", "tabular", "multimodal"]
  dependent:
    - name: "gini_coefficient"
      type: "continuous"
      operationalization: "Gini coefficient of benchmark usage distribution, range [0,1]"
      primary: true
    - name: "concentration_velocity"
      type: "continuous"
      operationalization: "First derivative of Gini coefficient (monthly delta)"
      primary: false
    - name: "portfolio_churn"
      type: "continuous"
      operationalization: "1 - Jaccard(Top50_t, Top50_{t-1}), range [0,1]"
      primary: false
  controlled:
    - name: "publication_volume"
      operationalization: "Normalize metrics by monthly paper count per modality"
    - name: "benchmark_age"
      operationalization: "Separate analysis for incumbent (pre-2020) vs new (post-2020) benchmarks"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Foundation models (GPT-3, BERT successors, ViT) emerge 2019-2021"
      evidence: "GPT-3 (2020), ViT (2020), BERT variants proliferated 2019-2021"
      falsifier: "No significant foundation model papers identifiable in 2019-2021"
    - step: 2
      description: "New benchmarks created to test emergent capabilities (MMLU, BIG-Bench, HumanEval)"
      evidence: "MMLU (2020), BIG-Bench (2022), HumanEval (2021) - all post-foundation model"
      falsifier: "No emergent-capability benchmarks created post-2020"
    - step: 3
      description: "Researcher attention shifts toward emergent-capability benchmarks"
      evidence: "Observable via increased paper count on MMLU/BIG-Bench leaderboards"
      falsifier: "Paper counts on new benchmarks remain low relative to traditional"
    - step: 4
      description: "Traditional benchmarks (ImageNet, CIFAR) persist but with reduced relative dominance"
      evidence: "Observable via decreased share in total benchmark usage"
      falsifier: "Traditional benchmarks maintain or increase dominance share"
    - step: 5
      description: "Net effect: Phase transition from uniform concentration to modality-differentiated dynamics"
      evidence: "Observable via divergent Gini trajectories across modalities"
      falsifier: "Modality Gini trajectories remain correlated (r > 0.5)"
  key_tension: "Whether foundation model effects are genuine structural change or artifact of publication volume growth"
  evidence_summary: |
    Koch et al. (2021) established baseline concentration patterns 2015-2020.
    Foundation model timeline (GPT-3: 2020, ViT: 2020) aligns with hypothesized change point.
    New benchmark creation (MMLU, BIG-Bench, HumanEval) observable in Papers With Code.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Papers With Code data accurately represents ML benchmark usage patterns"
    supporting_evidence: "PWC is primary source for Koch et al. (2021); 932★ repo with daily dumps"
    consequence_if_violated: "Results may not generalize to full ML research community"
  - id: "A2"
    assumption: "Task-dataset-metric triplet is appropriate unit for measuring benchmark usage"
    supporting_evidence: "More precise than paper-dataset pairs; captures actual evaluation contexts"
    consequence_if_violated: "Concentration metrics may be miscalibrated"
  - id: "A3"
    assumption: "Input modality classification from PWC task categories is accurate"
    supporting_evidence: "PWC uses expert-curated task hierarchies"
    consequence_if_violated: "Modality-specific analysis may have misclassification noise"
  - id: "A4"
    assumption: "Monthly temporal resolution is sufficient to detect structural breaks"
    supporting_evidence: "PELT/Bai-Perron designed for time series with this granularity"
    consequence_if_violated: "Change points may be missed or falsely detected"
  - id: "A5"
    assumption: "Publication volume growth is separable from concentration effects"
    supporting_evidence: "Gini normalizes within-period; volume normalization as robustness check"
    consequence_if_violated: "Cannot distinguish volume-driven from structure-driven changes"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ML benchmark usage patterns captured by Papers With Code (2018-2024)
    - Task communities with sufficient Papers With Code representation (CV, NLP, tabular)
    - Benchmarks with task-dataset-metric triplets in PWC schema
  does_not_apply_to: |
    - Research communities not represented in Papers With Code
    - Benchmarks without Papers With Code evaluation tables
    - Pre-2018 patterns (data availability constraint)
    - Non-ML benchmark domains (systems, security, etc.)
  known_limitations: |
    - Papers With Code data starts 2018; Koch 2015-2017 baseline from their published results
    - Multimodal classification may be noisy (CLIP benchmarks span CV and NLP)
    - Does not capture industry/proprietary benchmark usage

