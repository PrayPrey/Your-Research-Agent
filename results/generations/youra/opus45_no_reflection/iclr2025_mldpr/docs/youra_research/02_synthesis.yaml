hypothesis_draft:
  title: "Foundation Model Phase Transition in Benchmark Concentration"
  hypothesis_id: "H-BenchmarkPhaseTransition-v1"
  core_claim: |
    Foundation model emergence (2020-2021) created a structural break in ML benchmark
    concentration patterns, observable through change points in Gini time series,
    divergent modality-specific trajectories, and elevated portfolio churn.
  mechanism: |
    Foundation models (GPT-3, BERT successors, ViT) emerge 2019-2021, creating new
    benchmarks for emergent capabilities (MMLU, BIG-Bench, HumanEval). Researcher
    attention shifts toward these benchmarks, causing text-modality concentration to
    increase while traditional benchmarks (ImageNet, CIFAR) persist with reduced
    relative dominance. Net effect: phase transition from uniform concentration to
    modality-differentiated dynamics.
  predictions:
    - P1: "PELT detects change point in aggregate Gini within 2019-2022 window (α=0.05)"
    - P2: "CV-NLP Gini correlation drops from >0.6 (pre-2020) to <0.4 (post-2021)"
    - P3: "Text-modality Gini velocity exceeds image-modality by >2σ post-2021"
    - P4: "Portfolio churn significantly increases post-2020 vs pre-2020"

variables_summary:
  independent: "Time period (pre-2020 vs post-2021), benchmark modality (text/image/tabular/multimodal)"
  dependent_primary: "Gini coefficient of benchmark usage distribution"
  controlled: "Publication volume (normalized), benchmark age (incumbent vs new)"

null_hypothesis:
  h0_statement: |
    Benchmark concentration 2018-2024 follows a single monotonic trend with no
    structural break; modality-specific patterns remain correlated (r > 0.5);
    foundation model emergence had no detectable effect on concentration dynamics
    or portfolio churn.
  statistical_test: "PELT change-point detection, Fisher z-test for correlations, t-test for churn"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Churn-concentration matrix and Gini velocity metrics for dynamic ecosystem analysis"
  differentiation_summary: |
    Koch et al. (2021) provided static snapshots of concentration 2015-2020.
    This work introduces: (1) velocity metrics (Gini derivative), (2) churn-concentration
    matrix for ecosystem dynamics, (3) modality-based rather than aggregate analysis,
    (4) phase transition hypothesis testing with PELT change-point detection.

