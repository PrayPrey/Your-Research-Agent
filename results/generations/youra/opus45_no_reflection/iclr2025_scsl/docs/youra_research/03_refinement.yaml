      status: "BUILD_ON"
      evidence: "Liu et al. (2021) - Just Train Twice"
    - claim: "Gradient starvation causes some features to receive diminishing gradient signal"
      status: "BUILD_ON"
      evidence: "Pezeshki et al. (2020) - Gradient Starvation"
    - claim: "Emergence uniformity across samples indicates spurious features"
      status: "PROVE_NEW"
      evidence: "Novel claim derived from discussion synthesis"
    - claim: "CV threshold can distinguish spurious from core features"
      status: "PROVE_NEW"
      evidence: "Proposed metric requiring experimental validation"
    - claim: "Single-run dynamic gradient regularization improves worst-group accuracy"
      status: "PROVE_NEW"
      evidence: "Core hypothesis to be tested"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    The first three claims (BUILD_ON) are established and do not require proof experiments.
    Phase 2B should focus verification on the three PROVE_NEW claims, especially:
