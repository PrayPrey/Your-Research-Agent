# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Detection - Train linear probes on CLIP features at epoch checkpoints. Compute coefficient of variation (CV) of accuracy improvement rates across 5 random 20% sample subsets."
      evidence: "Shah et al. (2020) showed features emerge sequentially; probes can track this."
      falsifier: "If probe accuracies do not increase monotonically during training, the measurement method is invalid."
    - step: 2
      description: "Classification - Features with CV < 0.15 are classified as likely spurious (learned uniformly); CV > 0.2 as likely core (learned differentially across subgroups)."
      evidence: "Novel insight: spurious features should be learned uniformly because they correlate with labels regardless of subgroup."
      falsifier: "If CV distributions for known spurious and core features overlap completely, the threshold cannot separate them."
    - step: 3
      description: "Intervention - Apply continuous gradient penalty λ*(grad·probe_direction)² to low-CV feature directions during training, forcing reliance on high-CV discriminative features."
      evidence: "Gradient regularization is established; the novelty is targeting based on emergence uniformity."
      falsifier: "If worst-group accuracy does not improve or average accuracy drops >5pp, the intervention fails."
  key_tension: "Whether CV threshold generalizes across datasets or requires per-dataset tuning"
  evidence_summary: |
    The mechanism builds on established simplicity bias (Shah et al.) and gradient starvation
    (Pezeshki et al.) findings, adding the novel insight that emergence *uniformity*
    (not just timing) distinguishes spurious from core features. The intervention uses
    standard gradient regularization techniques applied dynamically.

