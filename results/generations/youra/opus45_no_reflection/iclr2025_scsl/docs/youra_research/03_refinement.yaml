key_assumptions:
  - id: "A1"
    assumption: "Spurious features emerge uniformly across training samples; core features emerge differentially across implicit groups"
    supporting_evidence: "Implied by simplicity bias (spurious = simple = learned quickly by all samples)"
    consequence_if_violated: "CV cannot distinguish feature types; method fails"
  - id: "A2"
    assumption: "Linear probes on pretrained features capture relevant feature emergence patterns"
    supporting_evidence: "Linear probes are standard for measuring representation quality"
    consequence_if_violated: "Nonlinear learning phases may be missed; alternative probing needed"
  - id: "A3"
    assumption: "CV threshold (0.15) can distinguish spurious from core features with reasonable accuracy"
    supporting_evidence: "Proposed based on discussion; requires empirical validation"
    consequence_if_violated: "Threshold needs recalibration or adaptive selection"
  - id: "A4"
    assumption: "Gradient regularization in probe directions effectively suppresses feature learning"
    supporting_evidence: "Spectral regularization literature; adversarial direction regularization"
    consequence_if_violated: "Alternative intervention mechanisms needed"
  - id: "A5"
    assumption: "CLIP features encode relevant visual concepts for Waterbirds/CelebA/ColoredMNIST"
    supporting_evidence: "CLIP trained on diverse web images; benchmarks use common visual concepts"
    consequence_if_violated: "Need alternative feature extractors (DINOv2, ImageNet-pretrained)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Image classification tasks with spurious correlations where:
    - Spurious features are simpler than core features
    - Standard benchmarks with known group structure (for evaluation)
    - Pretrained feature extractors can capture relevant visual concepts
  does_not_apply_to: |
    - Tasks where core and spurious features have similar complexity
    - Non-image modalities (NLP, tabular) without adaptation
    - Datasets without any spurious correlations
  known_limitations: |
    - Requires pretrained feature extractor (CLIP or similar)
    - CV threshold may require tuning for new domains
    - Assumes probe directions align with actual feature learning directions

