    2. Testing gradient regularization effectiveness
    3. Demonstrating single-run improvement over two-stage methods

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EUR-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the Waterbirds/CelebA/ColoredMNIST benchmarks where spurious correlations cause
    poor worst-group performance, if we identify features by their emergence uniformity
    (low variance in probe learning rates across sample subsets, CV < 0.15) and apply
    gradient regularization proportional to uniformity, then worst-group accuracy improves
    by ≥5 percentage points over ERM, because uniform emergence indicates the feature is
    spuriously correlated with labels rather than discriminative.
  alternative_hypothesis_h0: |
    There is no significant difference in worst-group accuracy between EUR (Emergence
    Uniformity Regularization) and standard ERM training on spurious correlation benchmarks.

