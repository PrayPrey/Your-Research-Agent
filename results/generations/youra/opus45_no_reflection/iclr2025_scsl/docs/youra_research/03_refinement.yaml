# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    This work introduces emergence uniformity as a novel signal for spuriousness detection.
    Unlike prior work that uses absolute timing (what emerges first), we use variance in
    emergence rates across sample subsets (what emerges uniformly).
  key_innovation: |
    Single-run dynamic gradient regularization based on CV of probe trajectories.
    No two-stage training required; intervention is continuous during training.
  differentiation:
    - prior_work: "JTT (Liu et al., 2021)"
      difference: "JTT requires two-stage training; EUR is single-run with continuous regularization"
    - prior_work: "LfF (Nam et al., 2020)"
      difference: "LfF trains separate biased/debiased networks; EUR uses single network with dynamic penalty"
    - prior_work: "Simplicity Bias (Shah et al., 2020)"
      difference: "Shah proves simplicity bias exists; EUR exploits it by detecting uniform emergence"

