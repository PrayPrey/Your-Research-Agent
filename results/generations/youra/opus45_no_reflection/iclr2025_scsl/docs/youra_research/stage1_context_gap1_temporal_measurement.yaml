# Stage 1 Context - Gap 1: Explicit Temporal Measurement
gap_id: "gap1_temporal_measurement"
gap_title: "Explicit Temporal Measurement of Feature Learning Order"
gap_description: |
  Existing methods (JTT, LfF) use indirect proxies (misclassification, loss values) to infer
  that spurious features are learned first. No direct measurement of when specific features
  emerge during training. Methods to explicitly track feature learning order during training
  are missing. Metrics like feature probe accuracy at checkpoints or gradient-based attribution
  over epochs.

