hypothesis_draft:
  title: "Emergence Uniformity Regularization (EUR) for Annotation-Free Worst-Group Robustness"
  hypothesis_id: "H-EUR-v1"
  core_claim: |
    Spurious features emerge uniformly across training samples (low CV in probe accuracy
    trajectories) while core features emerge differentially across implicit groups (high CV).
    By applying gradient regularization to low-CV feature directions, worst-group accuracy
    improves without requiring group annotations.
  mechanism: |
    1. Detection: Train linear probes on CLIP features at checkpoints; compute CV of accuracy
       improvement rates across random sample subsets
    2. Classification: CV < 0.15 = likely spurious; CV > 0.2 = likely core
    3. Intervention: Gradient penalty λ*(grad·probe_direction)² for low-CV features
  predictions:
    - P1: "≥5 pp worst-group improvement on Waterbirds over ERM"
    - P2: "≥3 pp worst-group improvement on CelebA over ERM"
    - P3: "≥3 pp worst-group improvement on ColoredMNIST over ERM"
    - P4: "Average accuracy drop ≤2 pp across all datasets"

variables_summary:
  independent: "Gradient regularization strength λ ∈ {0, 0.01, 0.1, 1.0}; CV threshold ∈ {0.1, 0.15, 0.2}"
  dependent_primary: "Worst-group accuracy (%)"
  controlled: "Dataset, Architecture (ResNet-50), Optimizer (SGD), Feature extractor (CLIP ViT-B/16)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in worst-group accuracy between EUR (Emergence
    Uniformity Regularization) and standard ERM training on spurious correlation benchmarks.
  statistical_test: "Two-sample t-test or Mann-Whitney U on worst-group accuracies"
