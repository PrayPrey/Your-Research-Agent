    - source: "Five random 20% sample subsets for CV computation"
    - source: "Worst-group and average accuracy on test set"
  procedure:
    - step: "Initialize ResNet-50 with ImageNet weights"
    - step: "Extract CLIP ViT-B/16 features for all training samples"
    - step: "Train linear probes on multiple visual concepts every 5 epochs"
    - step: "Compute CV of accuracy improvement rates across 5 random subsets"
    - step: "Classify features as spurious (CV < 0.15) or core (CV > 0.2)"
    - step: "Apply gradient regularization λ*(grad·probe_direction)² to low-CV features"
    - step: "Evaluate worst-group and average accuracy on test set"
  success_criteria:
