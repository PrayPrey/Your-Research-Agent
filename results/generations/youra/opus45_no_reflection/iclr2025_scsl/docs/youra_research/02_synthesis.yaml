  key_innovation: "Emergence uniformity (not timing) as spuriousness signal; single-run dynamic regularization"
  differentiation_summary: |
    JTT requires two-stage training; EUR is single-run.
    LfF trains separate biased/debiased networks; EUR uses single network with dynamic penalty.
    Shah et al. proves simplicity bias; EUR exploits it via emergence uniformity detection.

