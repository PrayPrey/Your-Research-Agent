seed: 42

data:
  data_dir: "./data/waterbirds"
  download_url: "https://nlp.stanford.edu/data/dro/waterbird_complete95_forest2water2.tar.gz"
  splits: ["train", "val", "test"]

features:
  clip_model: "ViT-B/16"
  device: "cuda"
  batch_size: 100
  feature_dim: 512
  cache_path: "./data/features_cache.npz"

cv_probe:
  n_subsets: 5
  subset_frac: 0.2
  n_epochs: 10
  c_range: [0.001, 100.0]
  solver: "lbfgs"
  max_iter: 1000

evaluate:
  auc_threshold: 0.75

output:
  figures_dir: "./figures"
  results_path: "./results.yaml"
