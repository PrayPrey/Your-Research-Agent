  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      The discussion converged on Emergence Uniformity Regularization (EUR), a method that
      exploits the observation that spurious features are learned uniformly across training
      samples while core features show differential learning rates across implicit groups.

      The core insight: spurious features are simple and learned uniformly, while core
      features are complex and learned at different rates for different subgroups. CV of
      probe accuracy trajectories across random sample subsets identifies spurious features
      without annotations.

      The intervention is continuous gradient regularization: features with low CV (< 0.15)
      receive gradient penalties proportional to their projection onto the probe direction.
      This forces the network to rely on high-CV discriminative features.

      Testable immediately on existing benchmarks using existing metrics.
    key_points:
      - "EUR: Emergence Uniformity Regularization"
      - "CV < 0.15 = spurious; CV > 0.2 = core"
      - "Gradient penalty λ*(grad·probe_direction)² for intervention"
      - "Ready for immediate testing on Waterbirds/CelebA/ColoredMNIST"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      Remaining concerns that require ablation studies:
      1. CV threshold (0.15) was proposed but not validated empirically
      2. CLIP feature extractor may encode spurious correlations from web pretraining
      3. Regularization strength λ calibration may be dataset-specific

      Mitigation strategy: ablation studies on (1) CV threshold range [0.1, 0.2],
      (2) multiple pretrained extractors (CLIP, DINOv2, ImageNet), (3) λ values
      [0.01, 0.1, 1.0] across all three datasets.
    key_points:
      - "CV threshold needs empirical validation"
      - "Test multiple feature extractors beyond CLIP"
      - "λ calibration ablation required"

