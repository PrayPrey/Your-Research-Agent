# Narrative Blueprint for EUR Paper
# Phase 6 Step 02: Narrative Design
# Generated: 2026-08-19

metadata:
  paper_type: "negative_result_with_insight"
  primary_contribution: "methodological_clarification"
  target_venue: "ICML 2025"

# ═══════════════════════════════════════════════════════════════
# HOOK DESIGN
# ═══════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "We set out to detect spurious features by their emergence uniformity — and discovered why this elegant idea fails on pretrained models."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Pretrained models are ubiquitous; understanding their limitations for spurious detection matters"
    concrete_example: "CLIP features show AUC=0.0 for distinguishing spurious from core features via CV"
    stakes: "Methods assuming pretrained features capture emergence dynamics will fail"

  anti_patterns_avoided:
    - "Deep learning has achieved remarkable success..."
    - "Spurious correlations are an important problem..."

# ═══════════════════════════════════════════════════════════════
# PROBLEM FRAMING (Three Levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "Models learn spurious correlations causing poor worst-group accuracy"
    common_understanding: "Standard benchmarks show ~70% WGA for ERM on Waterbirds"

  deeper_problem:
    description: "Detecting spurious features without group annotations remains challenging"
    why_overlooked: "Most methods require two-stage training or oracle group labels"
    our_perspective: "Feature emergence dynamics could provide annotation-free signal"

  gap_in_existing_work:
    description: "No method exploits emergence uniformity for spurious detection"
    why_gap_exists: "Simplicity bias literature describes WHAT emerges first, not variance across samples"
    why_gap_matters: "Uniform emergence (low CV) could theoretically indicate spuriousness"

# ═══════════════════════════════════════════════════════════════
# KEY INSIGHT (Experiment-Verified)
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Emergence uniformity is a training-time phenomenon that cannot be recovered from frozen pretrained representations"
    expanded_explanation: |
      CLIP features, having already learned both spurious (background) and core (bird_type) concepts,
      show no differential probe dynamics. The emergence has already happened — we cannot observe
      it post-hoc. CV on frozen features measures noise, not signal.

  why_others_missed_it:
    common_assumptions: "Pretrained features preserve learning dynamics information"
    our_different_view: "Pretrained features are end-states; dynamics are lost"
    enabling_factor: "Direct empirical test with CV measurement on CLIP probes"

  what_makes_it_work:
    intuitive_explanation: "You can't measure how fast someone learned by looking at their final exam score"
    key_mechanism: "CLIP trained on 400M images — background and bird_type are elementary concepts, fully saturated"

# ═══════════════════════════════════════════════════════════════
# EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "CV on frozen CLIP features does NOT distinguish spurious from core features"
    measurable_criteria: "AUC for CV-based classification"
    result: "AUC = 0.0 (threshold: ≥0.75)"

  supporting_evidence:
    - id: "evidence_1"
      what: "CV(background) = 0.0393, CV(bird_type) = 0.0360"
      so_what: "Near-identical values; zero discriminative signal"
      how_it_supports_claim: "No threshold can separate these overlapping distributions"

    - id: "evidence_2"
      what: "Probe accuracy saturates at ~100% for all C values"
      so_what: "No learning dynamics to measure; features already learned"
      how_it_supports_claim: "CV measures noise when trajectories are flat"

    - id: "evidence_3"
      what: "Direction opposite of expected (CV_spurious > CV_core)"
      so_what: "Not even a weak signal in correct direction"
      how_it_supports_claim: "Difference is within noise margin; no real pattern"

  surprising_findings:
    finding: "AUC exactly 0.0 (worse than random), not just below threshold"
    why_surprising: "Expected partial signal even if weak"
    our_interpretation: "Complete feature saturation eliminates any emergence-based signal"

# ═══════════════════════════════════════════════════════════════
# BROADER IMPACT
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "Emergence uniformity detection requires training-time measurement, not post-hoc probing"
    why_significant: "Clarifies necessary conditions for emergence-based spurious detection"

  implications:
    for_field: "Future work on emergence-based detection must use unfrozen, training-time features"
    for_practice: "Pretrained feature probing evaluates representation quality, not learning dynamics"

  future_possibilities:
    immediate_extensions:
      - "Train CNN from scratch; measure CV during actual epochs"
      - "Layer-wise probing on intermediate CLIP layers (before saturation)"
      - "Loss landscape curvature as alternative signal"
    longer_term_vision: "If training-time emergence uniformity works, integrate into single-run training pipeline"

# ═══════════════════════════════════════════════════════════════
# SECTION-LEVEL GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story: hypothesis, negative result, key insight, future direction"
    key_message: "Emergence uniformity cannot be measured on frozen pretrained features"
    word_target: 150

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Prior work on simplicity bias and training dynamics..."
    subsections:
      - "Opening hook (negative result framing)"
      - "Problem: spurious correlations, annotation-free detection"
      - "Proposed insight: emergence uniformity"
      - "Preview: why it fails on pretrained models"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Build on simplicity bias; differentiate from JTT/LfF"
    key_comparison_points:
      - "Simplicity Bias (Shah et al.) — describes what emerges first"
      - "JTT (Liu et al.) — early errors as proxy, but two-stage"
      - "DFR (Kirichenko et al.) — shows pretrained features sufficient for SOTA"
      - "Gradient Starvation (Pezeshki et al.) — feature learning dynamics"

  methodology:
    narrative_purpose: "Show WHY this design tests emergence uniformity"
    connection_to_insight: "CV of probe trajectories should capture emergence variance"
    key_design_decisions:
      - "CLIP ViT-B/16 for feature extraction"
      - "C-sweep as epoch proxy"
      - "5 random subsets for CV computation"
      - "AUC as classification metric"

  experiments:
    narrative_purpose: "Design tests that verify detection capability"
    experimental_questions:
      - "Can CV distinguish spurious from core features?"
      - "What AUC does CV-based classification achieve?"
      - "Do probe trajectories show differential dynamics?"

  results:
    narrative_purpose: "Present negative evidence clearly"
    main_result_highlight: "AUC = 0.0; hypothesis refuted"
    figures:
      - "cv_distribution.png — overlapping CVs"
      - "roc_curve.png — diagonal ROC"
      - "trajectories.png — flat curves"

  discussion:
    narrative_purpose: "Interpret failure, attribute root cause"
    honest_limitations:
      - "Only H-E1 tested; intervention mechanism not evaluated"
      - "Single dataset (Waterbirds), single extractor (CLIP)"
      - "C-sweep may not be valid epoch proxy"
    root_cause: "Feature saturation in pretrained models"

  conclusion:
    narrative_purpose: "Callback to hook; future directions"
    callback_to_hook: "The elegant idea fails on pretrained models — but may work during training"
    future_work:
      - "Training-time CV measurement"
      - "Alternative feature extractors"
      - "Loss-based emergence signals"

# ═══════════════════════════════════════════════════════════════
# NARRATIVE COHERENCE CHECKLIST
# ═══════════════════════════════════════════════════════════════

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES — both address 'elegant idea fails on pretrained models'"

  - check: "Does each section naturally flow to the next?"
    status: "YES — problem → prior work → our test → results → interpretation → future"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES — feature saturation / training-time vs post-hoc"

  - check: "Are all major claims supported by evidence?"
    status: "YES — AUC=0.0, CV values, flat trajectories"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES — negative result with clear mechanistic insight"
