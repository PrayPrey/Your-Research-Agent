tasks:
  # Setup Task (Priority 94)
  - id: S-1
    title: Environment Setup
    type: setup
    priority: 94
    description: |
      Install required packages for H-M4 baseline comparison experiment.
      Dependencies: torch, transformers, datasets, sklearn, matplotlib, numpy
    reference_files:
      - file: 03_prd.md
        section: Dependencies
    acceptance_criteria:
      - All packages installed
      - Llama-3-8B-Instruct model accessible
      - H-M1 cache and H-M3 code accessible

  # Epic Tasks (Priority 93-50)
  - id: B-1
    title: Reuse H-M3 Probe
    type: implementation
    priority: 93
    complexity: 8
    description: |
      Import probe.py/data.py from H-M3, retrain probe identically (seed=42, C=1e-3).
      Return validation scores and labels.
    reference_files:
      - file: 03_architecture.md
        section: "## B-1"
      - file: 03_logic.md
        section: "## B-1 + reuse: ProbeReuse"
      - file: 03_config.md
        section: "## B-1: Reuse H-M3 Probe"
    acceptance_criteria:
      - Probe retrained with same hyperparameters as H-M3
      - probe.evaluate() returns AUROC ~0.885
      - Returns probe_scores array shape (1700,)

  - id: B-2
    title: Model Loading
    type: implementation
    priority: 92
    complexity: 5
    description: |
      Load Llama-3-8B-Instruct with fp16, device_map='auto'.
      Set pad_token = eos_token, model.eval().
    reference_files:
      - file: 03_architecture.md
        section: "## Modules"
      - file: 03_config.md
        section: "## B-2: Model Loading"
    acceptance_criteria:
      - Model loads successfully on GPU
      - Tokenizer configured correctly
      - Model in eval mode

  - id: B-3
    title: Generation Loop
    type: implementation
    priority: 91
    complexity: 10
    description: |
      Generate over 1700 validation questions with output_scores=True.
      Return per-example scores tensor [gen_len, vocab] and generated_ids.
    reference_files:
      - file: 03_architecture.md
        section: "## Modules"
      - file: 03_logic.md
        section: "## B-3/B-4/B-5: Generation + Baseline Metrics"
      - file: 03_config.md
        section: "## B-3: Generation Loop"
    acceptance_criteria:
      - Generation completes for all 1700 samples
      - output_scores captured per token
      - Generated text decoded correctly

  - id: B-4
    title: Token Entropy Computation
    type: implementation
    priority: 90
    complexity: 6
    description: |
      Compute mean per-token entropy from generation logits.
      Formula: H_t = -Σ(p_t(i) * log(p_t(i)))
      Negate for confidence direction (higher = more confident).
    reference_files:
      - file: 03_logic.md
        section: "## B-3/B-4/B-5"
      - file: 03_config.md
        section: "## B-4: Token Entropy Computation"
    acceptance_criteria:
      - Entropy computed per generated sequence
      - Returns entropy_scores array shape (1700,)
      - Negated for confidence direction

  - id: B-5
    title: Sequence NLL Computation
    type: implementation
    priority: 89
    complexity: 6
    description: |
      Compute average negative log-likelihood from generation logits.
      Gather log-probs of generated tokens, mean, negate.
    reference_files:
      - file: 03_logic.md
        section: "## B-3/B-4/B-5"
      - file: 03_config.md
        section: "## B-5: Sequence NLL Computation"
    acceptance_criteria:
      - NLL computed per generated sequence
      - Returns nll_scores array shape (1700,)
      - Negated for confidence direction

  - id: B-6
    title: Correctness Labeling
    type: implementation
    priority: 88
    complexity: 6
    description: |
      Compute exact-match labels from live generation output vs gold answers.
      Must recompute fresh (not reuse H-M1/H-M3 cached labels).
    reference_files:
      - file: 03_logic.md
        section: "## B-6/B-7"
      - file: 03_config.md
        section: "## B-6: Correctness Labeling"
    acceptance_criteria:
      - Labels computed from current generation (not cached)
      - Returns labels array shape (1700,)
      - Binary 0/1 values

  - id: B-7
    title: AUROC + Delta Computation
    type: implementation
    priority: 87
    complexity: 5
    description: |
      Compute AUROC for probe, entropy, NLL methods.
      Calculate deltas and check gate (>= 0.05).
    reference_files:
      - file: 03_logic.md
        section: "## B-6/B-7"
      - file: 03_config.md
        section: "## B-7: AUROC + Delta Computation"
    acceptance_criteria:
      - AUROC computed for all 3 methods
      - Deltas calculated correctly
      - Gate check passes if delta >= 0.05

  - id: B-8
    title: Visualization Suite
    type: implementation
    priority: 86
    complexity: 7
    description: |
      Generate 4 figures: gate bar chart, ROC overlay, confidence distributions, scatter plot.
      Save to figures/ directory.
    reference_files:
      - file: 03_architecture.md
        section: "## Modules"
      - file: 03_config.md
        section: "## B-8: Visualization Suite"
    acceptance_criteria:
      - All 4 figures generated
      - Gate threshold line visible on bar chart
      - ROC curves overlay all 3 methods

  - id: B-9
    title: End-to-End Orchestration
    type: implementation
    priority: 85
    complexity: 6
    description: |
      Wire run.py::main() to execute full pipeline.
      Save results.json with AUROCs, deltas, gate status.
    reference_files:
      - file: 03_architecture.md
        section: "## Orchestrator"
      - file: 03_config.md
        section: "## B-9: End-to-End Orchestration"
    acceptance_criteria:
      - Pipeline runs end-to-end
      - results.json contains all metrics
      - Gate pass/fail reported

  # Subtasks (Priority 49-2)
  - id: L-B1-1
    title: ProbeReuse Subtask
    type: subtask
    parent_epic: B-1
