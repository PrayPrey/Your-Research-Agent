      All must happen in same generation pass.
    reference_files:
      - file: 03_logic.md
        section: "## B-3/B-4/B-5"
    acceptance_criteria:
      - Single pass computes all 3: entropy, NLL, labels
      - Scores aligned index-wise

  # Checkpoint Task (Priority 1)
  - id: CP-1
    title: Phase 4 Validation Checkpoint
    type: checkpoint
    priority: 1
    description: |
      Gate validation checkpoint for H-M4.
      Pass condition: Probe AUROC - Token Entropy AUROC >= 0.05
      Pass condition: Probe AUROC - Seq NLL AUROC >= 0.05
    gate:
      type: SHOULD_WORK
      metrics:
        - name: delta_entropy
          threshold: 0.05
          operator: ">="
        - name: delta_nll
          threshold: 0.05
          operator: ">="
    acceptance_criteria:
      - Both deltas >= 0.05
      - Probe AUROC >= 0.88
