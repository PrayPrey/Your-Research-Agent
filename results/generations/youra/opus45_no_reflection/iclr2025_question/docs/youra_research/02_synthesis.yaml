hypothesis_draft:
  title: "CorrectnessProbe: Single-Pass Factual Correctness Prediction via Hidden State Probing"
  hypothesis_id: "H-CorrectnessProbe-v1"
  core_claim: |
    A linear probe trained on middle-layer (60% depth) hidden states can predict
    factual correctness with AUROC >= 0.75, matching multi-sample semantic entropy
    methods while requiring only single-pass inference.
  mechanism: |
    Middle transformer layers encode semantic knowledge representation before
    task-specific output formatting. This knowledge state is distinct from output
    softmax confidence and correlates with factual correctness. A linear probe
    can extract this correctness signal from mean-pooled hidden states.
  predictions:
    - P1: "Middle layer (60%) achieves highest AUROC (inverted-U pattern)"
    - P2: "Early layers (12.5%) AUROC < 0.60 (insufficient semantic content)"
    - P3: "Probe exceeds token entropy by >= 5 AUROC points"
    - P4: "Probe within 3 points of 5-sample semantic entropy"
    - P5: "Confident-wrong detection AUROC > 0.60"
    - P6: "TruthfulQA transfer AUROC >= 0.70"

variables_summary:
  independent: "Layer depth (8 levels: 0.125-1.0), Probe architecture (linear vs MLP)"
  dependent_primary: "Correctness AUROC (binary correct/incorrect classification)"
  controlled: "Model (Llama-3-8B), Training data (TriviaQA), Generation (greedy, 50 tokens)"

null_hypothesis:
  h0_statement: |
    Hidden state probes achieve correctness prediction AUROC no better than
    output-level uncertainty measures (token entropy, sequence probability).
    Middle-layer hidden states contain no additional correctness signal.
  statistical_test: "Permutation test for pairwise AUROC comparisons"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Direct correctness prediction bypasses uncertainty estimation"
  differentiation_summary: |
    SEP (Kossen, 2024) predicts semantic entropy; we predict correctness directly.
    Token entropy uses output distribution; we use hidden states with richer signal.
    Multi-sample SE requires 5-20 samples; we achieve similar AUROC in one pass.

