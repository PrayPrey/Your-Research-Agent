    primary: true
    statement: "Middle layer (60% depth) achieves highest correctness AUROC, exhibiting inverted-U pattern across layers"
    test_method: "Train probes at 8 layer depths, compare AUROC with confidence intervals"
    success_criterion: "L_60% AUROC > L_100% and L_60% AUROC > L_25% (statistically significant)"
    falsification: "Final layer (L_100%) achieves highest AUROC"
  - id: "P2"
    primary: false
    statement: "Early layers (12.5% depth) have insufficient semantic content for correctness prediction"
    test_method: "Evaluate L_12.5% probe AUROC"
    success_criterion: "L_12.5% AUROC < 0.60"
    falsification: "L_12.5% AUROC > 0.65"
  - id: "P3"
    primary: true
    statement: "Hidden state probe outperforms output-level baselines (token entropy, sequence probability)"
    test_method: "Compare probe AUROC to token entropy and sequence probability baselines"
    success_criterion: "Probe AUROC exceeds token entropy by >= 5 AUROC points"
    falsification: "Probe AUROC <= token entropy baseline"
  - id: "P4"
    primary: true
    statement: "Hidden state probe achieves comparable performance to multi-sample semantic entropy"
    test_method: "Compare probe AUROC to 5-sample semantic entropy baseline"
    success_criterion: "Probe AUROC within 3 points of 5-sample SE with 5x lower compute"
    falsification: "Gap > 5 AUROC points"
  - id: "P5"
    primary: true
    statement: "Probe detects confident-but-wrong errors better than random"
    test_method: "Stratified evaluation on wrong-confident subset (low softmax entropy, incorrect answer)"
    success_criterion: "AUROC > 0.60 on wrong-confident subset"
    falsification: "AUROC <= 0.55 on wrong-confident subset"
  - id: "P6"
    primary: false
    statement: "Probe transfers from TriviaQA to TruthfulQA distribution"
    test_method: "Train on TriviaQA, evaluate on TruthfulQA"
    success_criterion: "TruthfulQA AUROC >= 0.70"
    falsification: "TruthfulQA AUROC < 0.65"

