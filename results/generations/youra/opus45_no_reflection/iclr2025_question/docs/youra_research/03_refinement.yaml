      method: "5-sample semantic entropy using Kuhn et al. (2023) method"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Direct correctness prediction bypasses uncertainty estimation"
  key_innovation: |
    First work to train probes for direct factual correctness prediction rather than uncertainty estimation.
    SEP (Kossen, 2024) predicts semantic entropy (an uncertainty measure); we predict ground-truth accuracy.
    This reframes the problem: instead of "estimate uncertainty, then infer correctness," we go directly to
    "hidden states → correctness."
  differentiation:
    - prior_work: "Semantic Entropy Probes (Kossen, 2024)"
      difference: "SEP predicts SE; we predict correctness directly. Different training signal, different use case."
    - prior_work: "Token entropy methods (Fadeeva, 2024)"
      difference: "Token entropy uses output distribution; we use internal hidden states with richer signal."
    - prior_work: "Multi-sample Semantic Entropy (Kuhn, 2023)"
      difference: "SE requires 5-20 samples; we achieve similar AUROC with single pass."

