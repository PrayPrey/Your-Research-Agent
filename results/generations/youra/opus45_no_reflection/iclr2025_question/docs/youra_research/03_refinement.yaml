# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Hidden states correlate with semantic entropy"
      status: "BUILD_ON"
      evidence: "Kossen et al. (2024) SEP paper demonstrated 0.85+ correlation"
    - claim: "Token entropy correlates weakly with correctness"
      status: "BUILD_ON"
      evidence: "Prior work shows ~0.65 AUROC baseline"
    - claim: "Multi-sample semantic entropy achieves ~0.80 AUROC on QA tasks"
      status: "BUILD_ON"
      evidence: "Kuhn et al. (2023) Nature paper"
    - claim: "Middle layers encode semantic knowledge before output formatting"
      status: "BUILD_ON"
      evidence: "Logit lens work (nostalgebraist, 2020), residual stream analysis"
    - claim: "Direct correctness prediction from hidden states outperforms uncertainty proxies"
      status: "PROVE_NEW"
      evidence: "Novel claim - requires experimental validation"
  scope_reduction_percentage: 80
  phase2b_4_instructions: |
    Focus experimental effort on PROVE_NEW claims. BUILD_ON claims provide foundation
    but do not require re-validation. The novel contribution is demonstrating that
    hidden states predict correctness directly, not just uncertainty.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CorrectnessProbe-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the scope of factual QA tasks with objective ground-truth answers,
    if we train a linear probe on middle-layer (60% depth) hidden states from a transformer LLM,
    then the probe will predict factual correctness with AUROC >= 0.75,
    because middle-layer representations encode semantic knowledge before task-specific output formatting compresses this information.
  alternative_hypothesis_h0: |
    Hidden state probes achieve correctness prediction AUROC no better than output-level
    uncertainty measures (token entropy, sequence probability). Middle-layer hidden states
    contain no additional correctness signal beyond the output distribution.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Layer Depth"
      type: "categorical"
      operationalization: "Proportion of model depth (layers extracted / total layers)"
      levels: [0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875, 1.0]
    - name: "Probe Architecture"
      type: "categorical"
      operationalization: "Classifier type trained on hidden states"
      levels: ["linear", "2-layer-mlp"]
  dependent:
    - name: "Correctness AUROC"
      type: "continuous"
      operationalization: "Area Under ROC Curve for binary correct/incorrect prediction"
      primary: true
    - name: "Stratified AUROC"
      type: "continuous"
      operationalization: "AUROC computed on subsets: correct-confident, correct-uncertain, wrong-confident, wrong-uncertain"
      primary: false
    - name: "Calibration Error"
      type: "continuous"
      operationalization: "Expected Calibration Error (ECE) between probe confidence and empirical accuracy"
      primary: false
  controlled:
    - name: "Model Architecture"
      operationalization: "Fixed to Llama-3-8B-Instruct"
    - name: "Training Data"
      operationalization: "Fixed to TriviaQA train split (95K examples)"
    - name: "Generation Parameters"
      operationalization: "Greedy decoding, max 50 new tokens"
    - name: "Hidden State Aggregation"
      operationalization: "Mean pooling over generated tokens"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM receives question and generates answer through forward pass"
      evidence: "Standard autoregressive generation"
      falsifier: "N/A - established mechanism"
    - step: 2
      description: "Middle layers (L ≈ 0.6 × depth) encode semantic knowledge representation, capturing both local token confidence and global coherence signals"
      evidence: "Logit lens work shows middle layers contain semantic representations; SEP paper shows hidden states correlate with semantic entropy"
      falsifier: "If early or final layers outperform middle layers, this step fails"
    - step: 3
      description: "Linear probe learns mapping from L-layer hidden states to correctness probability"
      evidence: "Linear probes successfully extract semantic entropy (Kossen et al., 2024)"
      falsifier: "If probe training fails to converge or achieves random performance"
    - step: 4
      description: "Probe output correlates with ground-truth correctness because hidden states encode knowledge confidence distinct from output softmax confidence"
      evidence: "Requires experimental validation - core novel claim"
      falsifier: "If probe AUROC <= token entropy baseline, hidden states add no signal"
  key_tension: "Whether hidden states encode 'knowledge confidence' or just 'model confidence' (confidence vs. correctness)"
  evidence_summary: |
    SEP paper (Kossen, 2024) demonstrates hidden states predict semantic entropy with 0.85+ correlation.
    Logit lens work shows middle layers encode semantic concepts before output formatting.
    Our claim extends this: hidden states predict correctness directly, not just uncertainty.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Hidden states are accessible via forward hooks during inference"
    supporting_evidence: "Standard PyTorch/HuggingFace feature, used by SEP paper"
    consequence_if_violated: "Implementation impossible - not a real risk"
  - id: "A2"
    assumption: "Exact-match correctness labels approximate true factual correctness"
    supporting_evidence: "Standard evaluation in QA literature; TriviaQA, NQ designed for this"
    consequence_if_violated: "Probe learns format matching, not correctness - mitigate by testing on F1 overlap and TruthfulQA"
  - id: "A3"
    assumption: "Middle-layer representations generalize across QA question types"
    supporting_evidence: "Implicit in transfer learning literature; representations should be task-general"
    consequence_if_violated: "Probe overfits to TriviaQA question distribution - test on TruthfulQA, NQ"
  - id: "A4"
    assumption: "Linear probe has sufficient capacity to capture correctness signal"
    supporting_evidence: "SEP used linear probes successfully; add MLP ablation if linear fails"
    consequence_if_violated: "Linear probe underperforms - test MLP variant"
  - id: "A5"
    assumption: "Signal is consistent across answer lengths and question difficulties"
    supporting_evidence: "Requires stratified analysis to verify"
    consequence_if_violated: "Probe only works on easy questions - report difficulty-stratified results"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Factual QA tasks with objective ground-truth answers
    - Benchmarks: TriviaQA, Natural Questions, TruthfulQA, FEVER
    - Transformer-based LLMs with accessible hidden states (Llama, Mistral, etc.)
    - Single-turn question-answering (not multi-turn dialogue)
  does_not_apply_to: |
    - Procedural tasks requiring step-by-step reasoning (GSM8K, MATH)
    - Open-ended generation without ground truth (creative writing)
    - Multi-turn dialogue where correctness depends on conversation history
    - Models without accessible hidden states (API-only models like GPT-4)
  known_limitations: |
    - Tested on single model family (Llama-3) - cross-architecture generalization not validated
    - Exact-match labels may penalize correct answers with different phrasing
    - Training requires labeled QA data - not applicable to unlabeled domains
    - Probe learned on English QA - may not transfer to other languages

