# ═══════════════════════════════════════════════════════════════
# NARRATIVE STRUCTURE
# ═══════════════════════════════════════════════════════════════

hook:
  strategy: "Problem inversion"
  opening_sentence: "Large language models confidently produce both correct answers and plausible-sounding fabrications — and their output probabilities cannot reliably distinguish between the two."
  tension: "Output confidence ≠ correctness. What if the model already knows when it's wrong?"
  pivot: "We show hidden states encode a correctness signal absent from output distributions."

problem_framing:
  level_1_surface: "LLMs hallucinate — high-confidence wrong answers erode user trust"
  level_2_deeper: "Output-level uncertainty (token entropy) weakly correlates with correctness (~0.62 AUROC)"
  level_3_gap: "Multi-sample methods (semantic entropy) improve accuracy but cost 5-20x compute; no efficient single-pass alternative exists"

key_insight:
  statement: "Middle-layer hidden states encode a 'knowledge confidence' signal distinct from output-level token confidence — a linear probe extracts this signal with 0.88 AUROC using a single forward pass."
  mechanism: "Middle layers (50-60% depth) represent semantic content before output formatting compresses it for next-token prediction."
  evidence_summary: "Inverted-U layer pattern confirms middle-layer peak; +26 AUROC points over token entropy."

contribution_narrative:
  framing: "story"
  contributions:
    - "We demonstrate that hidden states predict factual correctness directly, not just uncertainty"
    - "We identify optimal extraction at 50-60% depth via systematic layer sweep"
    - "We achieve semantic-entropy-level AUROC (0.88) with 5-20x less compute"

