hypothesis_draft:
  title: "BiDPO: Bidirectional Direct Preference Optimization via Agency-Preserving Auxiliary Objectives"
  hypothesis_id: "H-BiDPO-v1"
  core_claim: |
    Adding a length-normalized collaboration score as an auxiliary objective to DPO
    (L_BiDPO = L_DPO + lambda * L_agency) yields models that Pareto-dominate standard
    DPO on the MT-Bench x TruthfulQA frontier, because agency-preserving responses
    transfer capability to users, improving multi-turn dialogue quality.
  mechanism: |
    1. Collaboration score extracts implicit agency signals (reasoning, uncertainty, engagement)
    2. L_agency penalizes low collaboration scores, creating gradient pressure
    3. Agency-preserving responses transfer capability (how, not just what)
    4. Improved capability transfer yields better multi-turn benchmark performance
  predictions:
    - P1: "BiDPO (lambda=0.5) achieves MT-Bench >= DPO + 0.3 points"
    - P2: "MT-Bench gains exceed TruthfulQA gains (multi-turn > single-turn)"
    - P3: "Pareto-optimal lambda* exists where both metrics improve vs DPO"

variables_summary:
  independent: "Lambda (agency weight) in {0.0, 0.25, 0.5, 0.75, 1.0}"
  dependent_primary: "MT-Bench score (GPT-4 judge, 1-10)"
  controlled: "Model (Mistral-7B), data (HH-RLHF), DPO config (beta=0.1)"

null_hypothesis:
  h0_statement: |
    Agency signals extracted from response text provide no incremental optimization
    benefit beyond preference labels. All lambda > 0 configurations perform <= DPO
    (lambda=0) on both MT-Bench and TruthfulQA benchmarks.
  statistical_test: "Paired t-test across 3 seeds, BiDPO(lambda*) vs DPO"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First operationalization of bidirectional alignment as training signal using implicit signals from existing data"
  differentiation_summary: |
    DPO/RLHF methods are unidirectional (AI-to-human only). Multi-objective extensions
    (MODPO, PAMA, GAPO) address helpfulness vs harmlessness but not agency preservation.
    BiDPO introduces the human-to-AI direction via collaboration score heuristics.

