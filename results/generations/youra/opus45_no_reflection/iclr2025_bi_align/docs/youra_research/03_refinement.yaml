# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "DPO provides closed-form preference optimization without reward model"
      status: "BUILD_ON"
      evidence: "Rafailov et al. 2023, 10120 citations, foundational method"
    - claim: "Multi-objective DPO is stable (MODPO demonstrates margin-based extensions work)"
      status: "BUILD_ON"
      evidence: "MODPO, PAMA, GAPO papers show multi-objective extensions don't destabilize training"
    - claim: "Intent-aligned AI may deplete human agency"
      status: "BUILD_ON"
      evidence: "Mitelut et al. 2023, theoretical argument we aim to validate empirically"
    - claim: "Agency-preservation auxiliary objectives improve alignment beyond preference optimization"
      status: "PROVE_NEW"
      evidence: "Core hypothesis - no prior empirical validation exists"
  scope_reduction_percentage: 75
  phase2b_4_instructions: |
    BUILD_ON claims (DPO mechanics, multi-objective stability, agency depletion theory) can be cited
    without re-verification. PROVE_NEW claim (BiDPO improvement) is the experimental target.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiDPO-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard alignment training conditions (Mistral-7B, HH-RLHF dataset),
    if we add a length-normalized collaboration score as an auxiliary objective to DPO
    (L_BiDPO = L_DPO + lambda * L_agency),
    then models will Pareto-dominate standard DPO on MT-Bench x TruthfulQA frontier,
    because agency-preserving responses (explanations, uncertainty acknowledgment, engagement)
    transfer capability to users, improving multi-turn dialogue quality.
  alternative_hypothesis_h0: |
    Agency signals extracted from response text provide no incremental optimization benefit
    beyond preference labels. All lambda > 0 configurations perform <= DPO (lambda=0) on
    both MT-Bench and TruthfulQA benchmarks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Lambda (agency objective weight)"
      type: "categorical"
      operationalization: "Weight of L_agency term in BiDPO loss"
      levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  dependent:
    - name: "MT-Bench Score"
      type: "continuous"
      operationalization: "GPT-4 judge score (1-10 scale), mean across 8 categories"
      primary: true
    - name: "TruthfulQA MC1 Accuracy"
      type: "continuous"
      operationalization: "Multiple choice accuracy on TruthfulQA benchmark"
      primary: false
  controlled:
    - name: "Base model"
      operationalization: "Mistral-7B-Instruct-v0.2 (fixed)"
    - name: "Training data"
      operationalization: "HH-RLHF full training split (~160K pairs)"
    - name: "DPO hyperparameters"
      operationalization: "beta=0.1, lr=5e-7, 1 epoch, TRL DPOTrainer"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Collaboration score (collab_score_v2) extracts implicit agency signals from response text via pattern matching for reasoning traces, uncertainty acknowledgment, and engagement invitations"
      evidence: "Heuristic patterns based on HCI research on collaborative dialogue"
      falsifier: "If collab_score correlates >0.7 with preference labels, signal is redundant"
    - step: 2
      description: "L_agency = 1 - collab_score penalizes responses lacking collaborative markers, creating gradient pressure toward agency-preserving outputs"
      evidence: "Multi-objective DPO (MODPO) demonstrates auxiliary losses can be combined stably"
      falsifier: "If training becomes unstable or loss doesn't decrease, mechanism fails"
    - step: 3
      description: "Agency-preserving responses transfer capability (how, not just what) to users, enabling better follow-up questions and continued dialogue"
      evidence: "Mitelut et al. 2023 theoretical argument + HCI research on explanation quality"
      falsifier: "If MT-Bench multi-turn scores don't improve more than single-turn, transfer mechanism unsupported"
    - step: 4
      description: "Improved capability transfer leads to higher MT-Bench scores (multi-turn quality) while maintaining or improving TruthfulQA (factual accuracy)"
      evidence: "Prediction based on causal chain; to be validated experimentally"
      falsifier: "If MT-Bench <= DPO for all lambda > 0, mechanism doesn't produce claimed effect"
  key_tension: "Collaboration signals may capture verbosity/style rather than genuine agency preservation"
  evidence_summary: |
    Mechanism combines established DPO stability with novel agency-extraction heuristics.
    Theoretical grounding from Mitelut et al. + HCI research on collaborative dialogue.
    Key risk: heuristic validity requires pre-training correlation check.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Collaboration score heuristics capture genuine agency-preservation signals"
    supporting_evidence: "Patterns derived from HCI research on explanation and collaboration"
    consequence_if_violated: "L_agency optimizes for superficial patterns, not agency"
  - id: "A2"
    assumption: "Agency signals are sufficiently orthogonal to preference labels"
    supporting_evidence: "Pre-training correlation check will verify; if >0.7, use orthogonalized score"
    consequence_if_violated: "BiDPO reduces to weighted DPO, no novel contribution"
  - id: "A3"
    assumption: "MT-Bench GPT-4 judge evaluates genuine quality, not just style similarity"
    supporting_evidence: "MT-Bench validated against human preferences in original paper"
    consequence_if_violated: "Improvement reflects GPT-4 aesthetic preferences, not user utility"
  - id: "A4"
    assumption: "Mistral-7B results generalize to other model sizes"
    supporting_evidence: "Standard assumption in DPO literature; not directly tested"
    consequence_if_violated: "Findings limited to 7B scale"
  - id: "A5"
    assumption: "HH-RLHF preference patterns remain relevant for current alignment objectives"
    supporting_evidence: "HH-RLHF widely used in recent DPO research (2023-2024)"
    consequence_if_violated: "Results may not transfer to more recent preference data"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Text-based LLM alignment using preference optimization
    - Mistral-7B-Instruct-v0.2 specifically
    - HH-RLHF and similar preference datasets with full response text
    - English language responses
  does_not_apply_to: |
    - Multimodal models (image, audio)
    - Non-English languages
    - Synthetic preference data
    - Models significantly smaller (<1B) or larger (>70B) than tested
  known_limitations: |
    - Heuristic collaboration score is domain-specific to English dialogue
    - MT-Bench uses GPT-4 judge, potential circularity with OpenAI training
    - Single model architecture (Mistral) tested
    - Training limited to 1 epoch

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "BiDPO with lambda=0.5 achieves higher MT-Bench score than standard DPO (lambda=0)"
    test_method: "Compare mean MT-Bench scores (3 seeds) between BiDPO-0.5 and DPO"
    success_criterion: "MT-Bench improvement >= 0.3 points (1-10 scale)"
    falsification: "If MT-Bench(BiDPO-0.5) <= MT-Bench(DPO) + 0.3 across all seeds"
  - id: "P2"
    primary: false
    statement: "BiDPO shows larger gains on MT-Bench (multi-turn) than TruthfulQA (single-turn)"
    test_method: "Compare relative improvement: (BiDPO - DPO) / DPO for both benchmarks"
    success_criterion: "Relative MT-Bench gain > relative TruthfulQA gain"
    falsification: "If TruthfulQA improvement exceeds or equals MT-Bench improvement"
  - id: "P3"
    primary: false
    statement: "There exists lambda* > 0 that Pareto-dominates DPO on MT-Bench x TruthfulQA"
    test_method: "Plot Pareto frontier for lambda in {0.0, 0.25, 0.5, 0.75, 1.0}"
    success_criterion: "At least one lambda > 0 improves both MT-Bench and TruthfulQA vs lambda=0"
    falsification: "All lambda > 0 degrade at least one metric relative to DPO"

