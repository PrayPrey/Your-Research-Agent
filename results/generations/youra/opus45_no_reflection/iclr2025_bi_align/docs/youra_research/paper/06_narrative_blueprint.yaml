# Narrative Blueprint for BiDPO Paper
# Phase 6 Step 2: Narrative Design
# Generated: 2026-08-18

metadata:
  paper_title: "BiDPO: Learning Agency-Preserving Signals in Preference Data (A Negative Result)"
  main_hypothesis: "H-BiDPO-v1"
  narrative_strategy: "negative_result_framing"
  target_venue: "ICML 2025"

# ============================================================================
# OPENING HOOK
# ============================================================================

hook:
  strategy: "cautionary_tale"
  opening_sentence: >
    Can auxiliary training objectives teach language models to preserve user agency?
    We tested this intuition—and found a cautionary gap between training-time signals
    and generation-time behaviors.

  hook_type: "question_then_twist"
  avoids:
    - "X is increasingly important..."
    - "Large language models have achieved..."
    - "Recent advances in..."

  connects_to_conclusion: true
  callback_phrase: "the training-generation gap"

# ============================================================================
# PROBLEM FRAMING (3 Levels)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: "Standard alignment optimizes for human preferences but may inadvertently deplete user agency"
    audience_hook: "Anyone who has noticed LLMs give confident answers without explaining reasoning"
    observable_symptom: "Models optimize for preference without preserving explanatory signals"

  level_2_deeper:
    statement: "Preference data contains implicit agency signals (explanations, uncertainty markers, engagement cues) that are orthogonal to 'which response is better'"
    technical_insight: "Human raters prefer helpful responses, but helpfulness ≠ agency-preservation"
    gap_identification: "No training objective explicitly captures agency-preserving patterns"

  level_3_fundamental:
    statement: "Training-time auxiliary signals may not transfer to generation-time behavioral changes"
    research_question: "Can multi-objective DPO with agency-preserving losses improve downstream behavior?"
    our_contribution: "We demonstrate the mechanism works (orthogonal signals, stable training) but the downstream effect is null at PoC scale"

# ============================================================================
# KEY INSIGHT (Experiment-Verified)
# ============================================================================

key_insight:
  one_sentence: >
    Agency-like signals exist orthogonally in preference data (r=-0.026) and can be integrated
    into DPO training without destabilization, but PoC-scale training does not transfer to
    statistically significant generation-time improvements (p=0.247).

  components:
    - claim: "Orthogonal signal extraction"
      evidence: "r=-0.026 between collaboration score and preference labels"
      source: "h-e1"
    - claim: "Stable multi-objective training"
      evidence: "Loss decreased 0.929→0.918, zero NaN/Inf"
      source: "h-m1"
    - claim: "No generation-time transfer (negative result)"
      evidence: "p=0.247, d=0.016"
      source: "h-m2"

  why_surprising: "Standard assumption is that training-time optimization transfers to test-time behavior"
  why_valuable: "Informs future work on auxiliary objectives for alignment"

# ============================================================================
# EVIDENCE NARRATIVE STRUCTURE
# ============================================================================

evidence_narrative:
  story_arc: "Build mechanism → Test mechanism → Report failure point"

  act_1_setup:
    title: "Mechanism Validation"
    sections: ["methodology"]
    goal: "Establish that BiDPO is technically sound"
    key_results:
      - "Collaboration score is orthogonal to preference (h-e1)"
      - "Multi-objective training is stable (h-m1)"

  act_2_test:
    title: "Downstream Evaluation"
    sections: ["experiments", "results"]
    goal: "Test if training signal transfers to generation"
    key_results:
      - "BiDPO vs DPO generation comparison"
      - "Statistical significance testing"
      - "Effect size analysis"

  act_3_resolution:
    title: "Interpretation & Implications"
    sections: ["discussion", "conclusion"]
    goal: "Explain the negative result, identify next steps"
    key_points:
      - "Training-generation gap at PoC scale"
      - "Possible causes: scale, λ, heuristics"
      - "Value of negative results in alignment research"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    word_target: "~800-1000"
    must_establish:
      - "Why agency preservation matters for AI alignment"
      - "Gap in current DPO objectives"
      - "Our contribution (negative result with positive components)"
    must_avoid:
      - "Overpromising results that don't hold"
      - "Burying the negative result"

  related_work:
    narrative_role: "Position our work within multi-objective DPO literature"
    word_target: "~600-800"
    must_cover:
      - "DPO foundations"
      - "Multi-objective extensions (MODPO, PAMA, GAPO)"
      - "Agency/collaboration in human-AI interaction"
    must_distinguish:
      - "Our novel agency-preserving objective"
      - "Our negative result contribution"

  methodology:
    narrative_role: "Explain BiDPO design and why it should work"
    word_target: "~1000-1200"
    must_explain:
      - "Collaboration score heuristics (collab_score_v2)"
      - "BiDPO loss function (L_DPO + λL_agency)"
      - "Why orthogonality matters"
      - "Training setup"
    figures: ["scatter.png", "training_loss_curves.png"]

  experiments:
    narrative_role: "Design experiments that test mechanism chain"
    word_target: "~800-1000"
    experimental_questions:
      - "E1: Is collaboration score orthogonal to preference? (h-e1)"
      - "E2: Is BiDPO training stable? (h-m1)"
      - "E3: Does BiDPO improve generation-time agency? (h-m2)"
    must_justify:
      - "Why these experiments test the causal chain"
      - "Dataset and model choices"
      - "Evaluation metrics"

  results:
    narrative_role: "Present evidence honestly, highlight both success and failure"
    word_target: "~1000-1200"
    structure:
      - "E1 results: Orthogonality PASSED"
      - "E2 results: Training stability PASSED"
      - "E3 results: Generation transfer FAILED"
    figures: ["gate_bar.png", "training_loss_curves.png", "score_comparison_bar.png", "score_distributions.png"]
    must_include:
      - "Statistical significance values"
      - "Effect sizes"
      - "Confidence intervals where applicable"

  discussion:
    narrative_role: "Interpret the negative result, explore causes"
    word_target: "~400-600"
    must_address:
      - "Why did training signal not transfer?"
      - "Alternative explanations (scale, λ, heuristics)"
      - "Limitations of PoC-scale experiments"
      - "What this means for multi-objective alignment"
    honest_limitations:
      - "Single model architecture"
      - "Single λ value"
      - "Heuristic-based score"
      - "PoC scale only"

  conclusion:
    narrative_role: "Callback to hook, open future work"
    word_target: "~300-400"
    must_include:
      - "Summary of validated components"
      - "Summary of failure point"
      - "Clear future work directions"
      - "Callback to opening question"
    callback_example: >
      "The gap between training-time signals and generation-time behavior
      suggests that auxiliary objectives require more than gradient pressure—
      they need sufficient training duration and carefully tuned weighting."

  abstract:
    narrative_role: "Compress full story with actual numbers"
    word_target: "~150"
    must_include:
      - "Research question (agency preservation in alignment)"
      - "Method (BiDPO = L_DPO + λL_agency)"
      - "Positive findings (orthogonality r=-0.026, training stable)"
      - "Negative finding (generation p=0.247, d=0.016)"
      - "Contribution (negative result informs future work)"

# ============================================================================
# CLAIMS HIERARCHY
# ============================================================================

claims:
  strong_claims: # High-confidence, paper-ready
    - claim: "Collaboration score provides orthogonal training signal"
      evidence: "r=-0.026 (h-e1)"
      section: "results"
    - claim: "Multi-objective DPO with agency loss is training-stable"
      evidence: "Loss ↓ 1.2%, zero NaN/Inf (h-m1)"
      section: "results"

  moderate_claims: # Require hedging
    - claim: "PoC-scale BiDPO does not improve generation-time agency"
      evidence: "p=0.247, d=0.016 (h-m2)"
      hedge: "at PoC scale; full-scale behavior unknown"
      section: "results"

  exploratory_claims: # Future work
    - claim: "Full-scale training may show different results"
      status: "untested"
      section: "discussion"

# ============================================================================
# FIGURES PLACEMENT
# ============================================================================

figure_placement:
  methodology:
    - figure: "scatter.png"
      purpose: "Show orthogonality visually"
      reference: "Figure 1"

  results:
    - figure: "gate_bar.png"
      purpose: "Orthogonality gate verification"
      reference: "Figure 2a"
    - figure: "training_loss_curves.png"
      purpose: "Training stability demonstration"
      reference: "Figure 2b"
    - figure: "score_comparison_bar.png"
      purpose: "Generation comparison (key negative result)"
      reference: "Figure 3a"
    - figure: "score_distributions.png"
      purpose: "Distribution overlap (explains null effect)"
      reference: "Figure 3b"

# ============================================================================
# TONE GUIDANCE
# ============================================================================

tone:
  overall: "Honest, methodologically rigorous, constructively negative"
  avoid:
    - "Overselling partial results"
    - "Hiding negative findings"
    - "Defensive language"
    - "Excessive hedging that obscures findings"
  embrace:
    - "Clear statement of what worked and what didn't"
    - "Constructive framing of negative results"
    - "Specific future work suggestions"
    - "Appropriate confidence calibration"
