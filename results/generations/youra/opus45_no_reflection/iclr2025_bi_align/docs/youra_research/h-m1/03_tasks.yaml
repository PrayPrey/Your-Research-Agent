  phase_2_parallel: [M-2, M-3, M-4]
  phase_3_sequential: [M-5, M-6, M-7]
  phase_4_final: [M-8]

gate_criteria:
  primary: "Training completes without NaN/Inf"
  secondary: "Loss decreases monotonically (trend)"
