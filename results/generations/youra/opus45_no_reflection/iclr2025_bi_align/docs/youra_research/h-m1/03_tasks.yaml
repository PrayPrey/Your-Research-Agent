    complexity: 7
    breakdown: [2, 1, 1, 3]
    files:
      - visualize.py
    dependencies: [M-5]
    status: NOT_STARTED

  - id: M-8
    name: End-to-end orchestration + gate check
    description: run_experiment.py, results.json, PoC gate evaluation
    complexity: 8
    breakdown: [2, 3, 1, 2]
