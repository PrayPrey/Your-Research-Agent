gap_id: "gap3"
gap_title: "Weight-Space Methods for Model Behavior Prediction"
gap_description: |
  Current State: Existing work focuses on accuracy/generalization prediction.
  Limited work on predicting model behaviors (failure modes, adversarial robustness,
  OOD performance) from weights.

  Missing Piece: Methods that decode behavioral properties (not just accuracy)
  from weight inspection.

  Potential Impact: Would enable model auditing, safety verification, and
  capability prediction without inference.

