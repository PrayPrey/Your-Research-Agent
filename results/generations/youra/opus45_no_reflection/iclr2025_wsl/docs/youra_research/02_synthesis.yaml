hypothesis_draft:
  title: "Behavioral Fingerprinting via Weight-Space Neural Functionals"
  hypothesis_id: "H-BehavioralFingerprint-v1"
  core_claim: |
    Permutation-equivariant neural functionals (NF-Layers) can learn to predict structured
    behavioral profiles—specifically class-wise accuracy distributions—from neural network
    weights alone, enabling cross-metric behavioral transfer.
  mechanism: |
    NF-Layers' equivariant aggregation captures functionally salient weight directions
    (those that disproportionately affect output behavior per Meynent et al.'s Jacobian-alignment
    analysis). A low-dimensional embedding bottleneck forces compression to shared behavioral
    factors that transfer across behavioral metrics.
  predictions:
    - P1: "NF-Layer embeddings explain ΔR² > 0.05 (p < 0.05) more variance in class-wise accuracy than stratified baseline"
    - P2: "Embedding distance correlates with confusion matrix similarity (r ≥ 0.30)"
    - P3: "Full NF-Layer outperforms pointwise NF-Layer (ablation confirms cross-layer structure matters)"

variables_summary:
  independent: "Weight representation method (NF-Layer vs. SANE vs. stratified baseline vs. pointwise ablation)"
  dependent_primary: "Class-wise accuracy prediction R²"
  controlled: "Model architecture (fixed CNN), dataset (CIFAR-10), hyperparameter holdout, seed variation"

null_hypothesis:
  h0_statement: |
    Class-wise accuracy profiles are fully predictable from overall accuracy + per-class baseline difficulty.
    NF-Layer behavioral embeddings add no additional explanatory power beyond this stratified baseline.
  statistical_test: "Paired t-test across 10 cross-validation folds"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Structured behavioral prediction with cross-metric transfer validation"
  differentiation_summary: |
    Prior work (Zhou et al., SANE) predicts scalar properties (accuracy, generalization gap).
    We predict structured behavioral profiles (class-wise accuracy) and validate generalization
    via cross-metric transfer to confusion matrix similarity—never done before.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

