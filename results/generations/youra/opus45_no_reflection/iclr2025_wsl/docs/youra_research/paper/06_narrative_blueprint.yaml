# Narrative Blueprint for Phase 6 Paper Writing
# Generated: 2026-08-19
# Pipeline: YouRA Phase 6

metadata:
  hypothesis_id: "H-BehavioralFingerprint-v1"
  paper_type: "negative_result_with_positive_foundation"
  target_venue: "ICML2025"
  word_target: "~6000 main text"

# ==============================================================================
# HOOK STRATEGY
# ==============================================================================

hook:
  strategy: "surprising_quantification"
  opening_hook: |
    Model accuracy is not the whole story: when we analyze CNN model zoos,
    67.6% of class-wise behavioral variance remains unexplained by overall
    accuracy—yet extracting this signal from weights remains an open challenge.
  why_compelling: |
    Readers expect accuracy to dominate model behavior. The 13.5× threshold
    exceedance establishes that behavioral fingerprints exist, while the
    mechanism failure creates immediate tension worth resolving.
  avoid: "Generic 'deep learning is important' opening"

# ==============================================================================
# PROBLEM FRAMING (Three Levels)
# ==============================================================================

problem_framing:
  level_1_surface:
    statement: "Model zoos contain thousands of trained models, but we lack methods to predict HOW models behave beyond scalar accuracy"
    reader_expectation: "Isn't accuracy enough?"

  level_2_deeper:
    statement: "Different models fail on different classes in distinct patterns—these behavioral fingerprints could enable model selection, debugging, and understanding"
    tension: "If behavioral structure exists, can we extract it from weights alone?"

  level_3_gap:
    statement: "Prior work (SANE, weight statistics) achieves R²>0.9 for scalar accuracy, but class-wise behavioral profiles remain unpredicted"
    our_contribution: "We quantify behavioral variance existence (67.6%) and test whether simple weight features capture it (they don't)"

# ==============================================================================
# KEY INSIGHT
# ==============================================================================

key_insight:
  statement: |
    In CNN model zoos, models develop distinct behavioral fingerprints—
    class-specific accuracy patterns unexplainable by overall accuracy.
    However, this behavioral structure is not trivially extractable from
    weight statistics; more expressive representations may be required.
  evidence_backing:
    - "Residual variance ratio = 0.6758 (13.5× above 0.05 threshold)"
    - "Vehicle classes (automobile, truck) show highest behavioral variance"
    - "Weight statistics R² = -0.08 vs baseline R² = 0.12"
  why_novel: "First quantification of behavioral variance in model zoos + negative result on extraction"

# ==============================================================================
# EVIDENCE NARRATIVE
# ==============================================================================

evidence_narrative:
  structure: "existence_then_mechanism"

  phase_1_existence:
    claim: "Behavioral variance exists in model zoos"
    experiment: "H-E1: Variance decomposition on 193 Small CNN Zoo models"
    key_result: "67.6% residual variance unexplained by overall accuracy + class difficulty"
    figure: "gate_metric.png / variance_decomposition.png"

  phase_2_mechanism:
    claim: "Simple weight statistics capture this variance"
    experiment: "H-M1: Ridge regression on 25 weight features"
    key_result: "FAILED: ΔR² = -0.20 (weight features worse than baseline)"
    figure: "gate_comparison.png"
    interpretation: "Behavioral information may require learned representations, not scalar statistics"

# ==============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ==============================================================================

sections:
  abstract:
    role: "Compress full story"
    must_include:
      - "67.6% residual variance finding"
      - "Weight statistics negative result"
      - "Open challenge framing"
    word_target: 150

  introduction:
    role: "Hook → Problem → Insight → Preview"
    narrative_arc:
      - "Hook: 67.6% variance unexplained (surprising)"
      - "Problem: Accuracy dominates, but behavior matters"
      - "Gap: No class-wise prediction from weights"
      - "Preview: We quantify existence + test mechanism"
    word_target: 900

  related_work:
    role: "Show why existing work is insufficient"
    structure:
      - "Model zoos and weight-space learning"
      - "Property prediction from weights (scalar focus)"
      - "Behavioral understanding (gap in class-wise)"
    positioning: "Prior work predicts accuracy; we target behavioral profiles"
    word_target: 700

  methodology:
    role: "WHY this design solves the problem"
    structure:
      - "Behavioral variance decomposition (H-E1)"
      - "Weight statistics probe (H-M1)"
      - "Stratified baseline design"
    key_decisions:
      - "Use residual variance ratio to isolate behavioral signal"
      - "5 statistics × 5 layers = 25-feature probe"
      - "Ridge regression for stability on small sample"
    word_target: 1100

  experiments:
    role: "Test specific claims"
    structure:
      - "Dataset: Small CNN Zoo (193 models, CIFAR-10)"
      - "Evaluation: 10-fold CV for variance, 80/20 for probes"
      - "Metrics: Residual ratio, per-class R²"
    rationale: "Standard model zoo with stored predictions enables confusion analysis"
    word_target: 900

  results:
    role: "Present evidence"
    structure:
      - "Existence: 67.6% residual variance (PASS)"
      - "Mechanism: Weight probe R² = -0.08 (FAIL)"
      - "Per-class analysis: Vehicle classes highest variance"
      - "Anomaly: Class 4 (deer) R² = -2.74"
    interpretation: "Behavioral fingerprints exist but extraction via simple statistics fails"
    word_target: 1100

  discussion:
    role: "Interpret + acknowledge limits"
    structure:
      - "What the existence result means"
      - "Why mechanism failed (sample size? feature expressivity?)"
      - "Limitations: n=193, undertrained models, simple features"
      - "Implications for weight-space learning"
    word_target: 500

  conclusion:
    role: "Callback to hook + future"
    structure:
      - "Summary: Behavioral fingerprints exist, extraction is open"
      - "Future: Full zoo (n≈30k), NF-Layer architectures, non-linear probes"
    callback: "Return to 67.6% finding as established fact"
    word_target: 350

# ==============================================================================
# CLAIMS HIERARCHY
# ==============================================================================

claims:
  primary:
    - claim: "Class-wise accuracy profiles exhibit substantial unexplained variance"
      evidence: "Residual ratio = 0.68 > 0.05"
      confidence: HIGH
      section: results

  secondary:
    - claim: "Vehicle classes show highest behavioral variance"
      evidence: "automobile σ²=0.163, truck σ²=0.127"
      confidence: MEDIUM
      section: results

    - claim: "Simple weight statistics insufficient for class-wise prediction"
      evidence: "R² = -0.08 < baseline R² = 0.12"
      confidence: MEDIUM
      section: results

  limitations:
    - "Small sample (n=193 vs recommended n≈30k)"
    - "Simple statistics tested, not learned representations"
    - "Undertrained models (mean accuracy 18.7%)"

# ==============================================================================
# FIGURE STRATEGY
# ==============================================================================

figures:
  main_text:
    - id: "fig1"
      source: "h-e1/figures/variance_decomposition.png"
      caption: "Variance decomposition shows 67.6% residual (unexplained by accuracy + class difficulty)"
      section: results

    - id: "fig2"
      source: "h-e1/figures/per_class_variance.png"
      caption: "Per-class behavioral variance: vehicle classes (automobile, truck) highest"
      section: results

    - id: "fig3"
      source: "h-m1/figures/gate_comparison.png"
      caption: "Weight statistics vs baseline R²: mechanism FAIL"
      section: results

  appendix:
    - id: "figA1"
      source: "h-e1/figures/accuracy_heatmap.png"
      caption: "193×10 class-wise accuracy matrix"

# ==============================================================================
# CITATION PRIORITIES
# ==============================================================================

citations:
  essential:
    - "Zhou et al. 2023 - NF-Layers (permutation equivariance)"
    - "Schürholt et al. 2024 - SANE (scalable weight representations)"
    - "Unterthiner et al. 2020 - Small CNN Zoo (dataset)"
    - "Meynent et al. 2025 - Behavioral loss (motivation)"

  supporting:
    - "Han et al. 2026 - Weight Space Learning Survey"
    - "Herrmann et al. 2024 - RNN weight representations"
