# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Weight matrices encode behavioral information beyond aggregate accuracy"
      evidence: "Meynent et al. (2025) show behavioral loss captures directions MSE misses; Herrmann et al. (2024) show RNN weights encode task identity"
      falsifier: "If all behavioral variance is explained by overall accuracy, weights encode no additional behavioral information"
    - step: 2
      description: "NF-Layer's equivariant aggregation captures cross-layer weight correlations relevant to per-class behavior"
      evidence: "Zhou et al. (2023) NF-Layer Eq. 2 shows cross-layer coupling terms (b, c terms) aggregate adjacent layer information"
      falsifier: "If pointwise NF-Layer (d term only) equals full NF-Layer, cross-layer terms add no value"
    - step: 3
      description: "Low-dimensional embedding bottleneck forces compression to shared behavioral factors"
      evidence: "Standard representation learning principle; 16-dim << 10×10 confusion matrix"
      falsifier: "If 16-dim embedding performs worse than direct 10-dim per-class prediction, bottleneck hurts"
    - step: 4
      description: "Shared behavioral factors transfer to unseen behavioral metrics"
      evidence: "If embeddings capture general functional saliency (Jacobian-alignment), they should correlate with confusion similarity"
      falsifier: "If confusion correlation r < 0.30 despite good class-wise R², transfer fails"
  key_tension: "Whether behavioral structure is general (transfers to unseen metrics) or task-specific (only predicts training objective)"
  evidence_summary: |
    Prior work establishes that (1) weight-space encodes behavioral information beyond accuracy (Meynent, Herrmann),
    (2) NF-Layers capture equivariant structure (Zhou), and (3) model zoos contain behavioral diversity (SANE, RNN zoos).
    The novel claim is that these combine to enable cross-metric behavioral transfer.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Class-wise accuracy profiles vary meaningfully across models in the zoo"
    supporting_evidence: "Model zoos contain hyperparameter and seed variation; different models should fail on different classes"
    consequence_if_violated: "If all models fail/succeed on same classes, behavioral prediction collapses to accuracy prediction"
  - id: "A2"
    assumption: "NF-Layer architecture scales to Small CNN Zoo model sizes (~12k parameters)"
    supporting_evidence: "Zhou et al. (2023) demonstrate NF-Layers on CNNs with similar parameter counts"
    consequence_if_violated: "Would need architecture modification; computational feasibility at risk"
  - id: "A3"
    assumption: "Confusion matrices are derivable from stored evaluation data in model zoos"
    supporting_evidence: "Model zoos store per-model predictions; confusion matrices = predictions × ground truth"
    consequence_if_violated: "Would need to re-evaluate models, violating no-new-data constraint"
  - id: "A4"
    assumption: "16-dim embedding is sufficient to capture behavioral structure"
    supporting_evidence: "Herrmann et al. (2024) use 16-dim embeddings for RNN behavior encoding"
    consequence_if_violated: "May need larger embedding; hyperparameter search required"
  - id: "A5"
    assumption: "Behavioral transfer (accuracy → confusion) is meaningful measure of generalization"
    supporting_evidence: "Confusion matrices capture error patterns not reducible to accuracy; correlation indicates shared structure"
    consequence_if_violated: "Alternative transfer metrics needed (CKA, sample agreement)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - CNN models from model zoos (Small CNN Zoo)
    - Fixed architecture settings (same network structure across models)
    - CIFAR-10 10-class classification task
    - Models trained with varying hyperparameters and random seeds
  does_not_apply_to: |
    - LLMs or transformer architectures (NF-Layers designed for MLP/CNN)
    - Cross-architecture prediction (e.g., ResNet → VGG)
    - OOD or adversarial behavior prediction (no such data in existing zoos)
    - Models with fundamentally different architectures (heterogeneous zoos)
  known_limitations: |
    - Behavioral definition constrained to class-wise accuracy profiles (not OOD, not adversarial)
    - Cross-metric transfer tested only on confusion matrices (one transfer metric)
    - Embedding dimension (16) is arbitrary; may require tuning
    - Results may not generalize to larger models (ResNet-18+) without additional validation

