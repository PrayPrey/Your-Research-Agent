# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "NF-Layer behavioral embeddings explain significantly more variance in class-wise accuracy profiles than the stratified baseline"
    test_method: "10-fold cross-validation on Small CNN Zoo; compare R² of NF-Layer embedding vs. stratified baseline (overall accuracy + per-class difficulty)"
    success_criterion: "ΔR² > 0.05 with p < 0.05 (paired t-test across folds)"
    falsification: "ΔR² ≤ 0.05 or p ≥ 0.05 indicates no significant improvement over baseline"
  - id: "P2"
    primary: false
    statement: "Embedding distance correlates with confusion matrix similarity despite never being trained on confusion matrices"
    test_method: "Compute pairwise embedding distances and confusion matrix cosine similarities; measure Pearson correlation"
    success_criterion: "r ≥ 0.30 with p < 0.01"
    falsification: "r < 0.30 indicates behavioral embedding does not generalize beyond training objective"
  - id: "P3"
    primary: false
    statement: "Full NF-Layer outperforms pointwise NF-Layer, confirming cross-layer structure matters"
    test_method: "Ablation: compare full NF-Layer (all terms in Eq. 2) vs. pointwise NF-Layer (d_i W_{jk} only)"
    success_criterion: "Full NF-Layer R² > Pointwise NF-Layer R² with p < 0.05"
    falsification: "If pointwise equals full, cross-layer aggregation adds no value for behavioral prediction"

