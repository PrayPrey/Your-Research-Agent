predictions:
  - id: "P1"
    primary: true
    statement: "The second derivative of worst-group accuracy (d²WGA/dt²) shows a statistically significant negative peak during the first 50% of training on Waterbirds, CelebA, and ColoredMNIST"
    test_method: "Train ResNet-50 with dense checkpoints (every epoch), compute WGA, apply 5-epoch smoothing, compute second derivative, test for significant negative peak via t-test against zero"
    success_criterion: "Statistically significant (p<0.05) negative peak in d²WGA/dt² in first 50% of training for at least 2/3 benchmarks"
    falsification: "If d²WGA/dt² shows no significant negative peak, or peak occurs after 50% of training, hypothesis is falsified"
  - id: "P2"
    primary: false
    statement: "The crystallization effect persists under constant learning rate training"
    test_method: "Repeat P1 experiment with constant LR (no decay)"
    success_criterion: "Significant negative d²WGA/dt² peak still present with constant LR"
    falsification: "If effect disappears with constant LR, crystallization is LR-schedule artifact, not intrinsic"
  - id: "P3"
    primary: false
    statement: "Crystallization zone timing is benchmark-relative, appearing at 20-40% of total training duration"
    test_method: "Normalize epoch to percentage of total training; measure when d²WGA/dt² peak occurs"
    success_criterion: "Peak occurs within 20-40% range for all three benchmarks"
    falsification: "If peak timing varies wildly (e.g., 10% vs 70%), relative timing claim is falsified"

