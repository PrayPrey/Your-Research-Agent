# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ShortcutCrystallization-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard SGD training on spurious-correlation benchmarks (Waterbirds, CelebA,
    ColoredMNIST), if we track worst-group accuracy across training epochs, then we will
    observe a localized training phase (the "Shortcut Crystallization Zone") where classifier
    reliance on spurious features accelerates, because simplicity bias creates initial spurious
    feature advantage and gradient starvation amplifies this through self-reinforcing feedback.
  alternative_hypothesis_h0: |
    There is no localized acceleration in worst-group accuracy decline during training;
    the decline rate is constant throughout training (linear decay pattern).

