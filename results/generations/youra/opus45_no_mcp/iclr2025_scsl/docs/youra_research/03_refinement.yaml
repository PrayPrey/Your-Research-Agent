# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Simplicity bias causes early spurious feature advantage"
      evidence: "Shah et al. 2020 — DNNs learn linearly-separable features first"
      falsifier: "If spurious features NOT more separable early in training"
    - step: 2
      description: "Gradient starvation amplifies spurious feature dominance"
      evidence: "Pezeshki et al. 2021 — dominant features suppress minority feature gradients"
      falsifier: "If minority feature gradient magnitude does NOT decrease relative to spurious"
    - step: 3
      description: "Feedback loop becomes self-reinforcing at crystallization point"
      evidence: "Proposed — cumulative effect creates phase transition"
      falsifier: "If no acceleration detected in WGA decline (constant decay rate)"
    - step: 4
      description: "Post-crystallization, classifier commits to spurious features"
      evidence: "Kirichenko et al. 2023 — features learned but classifier weighting favors spurious"
      falsifier: "If classifier weights shift back toward core features without intervention"
  key_tension: "Whether crystallization is sharp phase transition or gradual regime shift"
  evidence_summary: |
    The mechanism chains established findings (simplicity bias → gradient starvation) with
    a novel temporal characterization (crystallization zone). Steps 1-2 are literature-backed;
    steps 3-4 are the novel claims requiring experimental validation.

