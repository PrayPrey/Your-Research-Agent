# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Supervised image classification with spurious correlations
    - SGD-based training (with or without momentum)
    - Standard vision architectures (ResNet, ViT)
    - Benchmarks with group annotations (Waterbirds, CelebA, ColoredMNIST)
  does_not_apply_to: |
    - Unsupervised or self-supervised learning
    - Non-SGD optimizers (Adam behavior may differ)
    - NLP tasks (CivilComments deferred to future work)
    - Datasets without spurious correlation structure
  known_limitations: |
    - Smoothing window choice requires sensitivity analysis
    - Three benchmarks may not establish universal claims
    - ResNet-50/ViT-B/16 tested; other architectures not verified

