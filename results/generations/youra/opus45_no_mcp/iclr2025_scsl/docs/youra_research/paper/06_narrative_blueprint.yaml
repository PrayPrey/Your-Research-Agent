# Purpose: Story-first narrative design for ICML paper

metadata:
  generated_at: '2026-08-19T09:00:00Z'
  hypothesis_id: H-ShortcutCrystallization-v1
  paper_title: "When Do Shortcuts Crystallize? Detecting Irreversible Feature Commitment in Deep Neural Networks"

# =============================================================================
# NARRATIVE HOOK STRATEGY
# =============================================================================

hook:
  strategy: "timing_question"
  opening_sentence: "When does a neural network's reliance on spurious correlations become irreversible?"
  hook_type: "provocative_question"
  avoids: "Generic 'X is important' opening"

  elaboration: |
    Deep neural networks learn shortcuts—spurious correlations that fail under distribution shift.
    We know they prefer simple features (Shah et al. 2020), and that gradient starvation amplifies
    this preference (Pezeshki et al. 2021). But WHEN does this preference lock in? We identify a
    "Crystallization Zone"—a narrow training window at 15-40% of training where classifier
    commitment to shortcuts accelerates and becomes irreversible.

# =============================================================================
# PROBLEM FRAMING (3 LEVELS)
# =============================================================================

problem_framing:
  level_1_surface:
    description: "DNNs fail on minority groups due to spurious correlations"
    evidence: "Waterbirds WGA ~60-75% under ERM"
    familiar_to_reader: true

  level_2_deeper:
    description: "Shortcuts emerge from simplicity bias and gradient starvation"
    evidence: "Shah 2020, Pezeshki 2021"
    what_reader_learns: "WHY shortcuts persist"

  level_3_gap:
    description: "Unknown WHEN shortcuts become irreversible during training"
    evidence: "No prior temporal characterization exists"
    what_we_contribute: "Crystallization Zone detection method"

  transition_to_insight: |
    Existing work describes what shortcuts are and why they persist, but not when
    the classifier commits to them. This temporal blind spot prevents timing-aware interventions.

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  one_sentence: |
    Classifier commitment to spurious features is not gradual but localized: a "Crystallization Zone"
    at 15-40% of training where second derivative of worst-group accuracy shows significant acceleration.

  why_surprising: "Prior work treats shortcut learning as monotonic; we show it has distinct phases"

  experiment_verified: true
  verification_evidence:
    - "H-M3: 100% detection rate across 5 seeds"
    - "H-M2: Commitment maintained (probe accuracy 0.9468)"
    - "H-E1: Crystallization detected at epoch 3 (peak_epoch)"

  actionable_implication: "Intervention timing can be optimized—act before crystallization locks in shortcuts"

# =============================================================================
