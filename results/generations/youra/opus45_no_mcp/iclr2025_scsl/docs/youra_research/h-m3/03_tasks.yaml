# H-M3 Implementation Tasks
# Second Derivative Crystallization Detection Method Validation
# Generated: 2026-08-19
# Tier: FULL (MECHANISM hypothesis)
# Budget: 30 max | Actual: 15 tasks (8 epics + 7 subtasks)

hypothesis_id: H-M3
hypothesis_type: MECHANISM
tier: FULL
budget_max: 30
task_count: 15

epic_tasks:
  - id: A-1
    name: Config module
    description: DetectionConfig dataclass with benchmark/seed/window params
    complexity: 5
    complexity_breakdown: "2+1+1+1 (Module_Size + Dependencies + Algorithm + Integration)"
    output_file: h-m3/code/config.py
    subtasks: []

  - id: A-2
    name: Real curve loader
    description: Extract WGA from H-E1 .pt checkpoints, inspect keys, handle missing
    complexity: 9
    complexity_breakdown: "3+2+3+1"
    output_file: h-m3/code/data.py
    subtasks:
      - id: A-2.1
        name: Checkpoint key inspection
        description: Detect WGA storage key in .pt files (wga, worst_group_acc, etc.)
      - id: A-2.2
        name: Multi-epoch curve assembly
        description: Load all epoch checkpoints and assemble WGA array

  - id: A-3
    name: Synthetic curve generator
    description: Seeded realistic WGA curves per benchmark with crystallization dip
    complexity: 8
    complexity_breakdown: "3+1+3+1"
    output_file: h-m3/code/data.py
    subtasks:
      - id: A-3.1
        name: Sigmoid-with-dip curve shape
        description: Generate realistic WGA trajectory with crystallization point

  - id: A-4
    name: Smoothing + 2nd derivative
    description: uniform_filter1d + double np.gradient with unit tests
    complexity: 6
    complexity_breakdown: "2+1+2+1"
    output_file: h-m3/code/detector.py
    subtasks: []

  - id: A-5
    name: Peak detection
    description: find_peaks with prominence, SNR calc, strongest-peak selection
    complexity: 8
    complexity_breakdown: "2+2+3+1"
    output_file: h-m3/code/detector.py
    subtasks: []

  - id: A-6
    name: Sensitivity + aggregation
    description: Multi-window run, window robustness, cross-seed/benchmark stats, gate eval
    complexity: 11
    complexity_breakdown: "3+3+3+2"
    output_file: h-m3/code/analyzer.py
    subtasks:
      - id: A-6.1
        name: Window robustness computation
        description: Calculate % of windows detecting same peak within tolerance
      - id: A-6.2
        name: Gate evaluation logic
        description: Check detection_rate>0.8, variance<5, snr>2.0

  - id: A-7
    name: Visualization suite
    description: 6 required figures (gate metrics, WGA derivatives, heatmap, etc.)
    complexity: 9
    complexity_breakdown: "3+1+2+3"
    output_file: h-m3/code/visualize.py
    subtasks:
      - id: A-7.1
        name: Detection heatmap
        description: Seeds x Benchmarks heatmap showing detected peak epochs
      - id: A-7.2
        name: SNR distribution plot
        description: Box plot of SNR values across conditions

  - id: A-8
    name: run.py integration
    description: Wire pipeline end-to-end, JSON/YAML output, orchestration
    complexity: 7
    complexity_breakdown: "2+3+1+1"
    output_file: h-m3/code/run.py
    subtasks: []

summary:
  epic_count: 8
  subtask_count: 7
  total_tasks: 15
  complexity_distribution:
    very_high: 0
    high: 0
    medium: 4  # A-2, A-3, A-6, A-7
    low: 4     # A-1, A-4, A-5, A-8

gate_condition: "Detection method validates with >80% reliability across random seeds. Peak timing variance <5 epochs."

output_files:
  - h-m3/code/config.py
  - h-m3/code/data.py
  - h-m3/code/detector.py
  - h-m3/code/analyzer.py
  - h-m3/code/visualize.py
  - h-m3/code/run.py
