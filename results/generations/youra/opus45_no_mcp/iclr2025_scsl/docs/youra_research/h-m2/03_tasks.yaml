gate_criteria:
  primary:
    condition: "spurious_acc[final] >= spurious_acc[crystallization] - 0.02"
    description: "Spurious probe accuracy does NOT decrease post-crystallization"
    pass_action: "PASS - Classifier committed to spurious features"
    fail_action: "FAIL - EXPLORE late reversal possibility"
  secondary:
    condition: "core_acc[final] < 0.85"
    description: "Core probe accuracy remains suppressed"
    pass_action: "Full commitment confirmed"
    fail_action: "Commitment confirmed, but core features recovered"

dependencies:
  h_m1:
    - checkpoints/epoch_*.pt
    - outputs/crystallization_epoch.yaml (or detector results)
  h_e1:
    - crystallization detection results
  external:
    - torch>=1.10.0
    - wilds>=2.0.0
    - matplotlib>=3.4.0
