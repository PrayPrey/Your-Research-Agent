hypothesis_draft:
  title: "Shortcut Crystallization Zone: Temporal Dynamics of Spurious Feature Dominance"
  hypothesis_id: "H-ShortcutCrystallization-v1"
  core_claim: |
    Under standard SGD training on spurious-correlation benchmarks, there exists a localized
    training phase (the "Shortcut Crystallization Zone") where the classifier's reliance on
    spurious features accelerates, detectable via second-derivative analysis of worst-group accuracy.
  mechanism: |
    Simplicity bias (Shah 2020) creates initial spurious feature advantage because spurious
    features are often more linearly separable. Gradient starvation (Pezeshki 2021) amplifies
    this through feedback — dominant features receive more gradient signal, further suppressing
    minority features. The crystallization point marks when this feedback becomes self-reinforcing
    and the classifier commits to the spurious solution.
  predictions:
    - P1: "d²(WGA)/d(epoch)² shows significant negative peak in first 50% of training (primary)"
    - P2: "Effect persists under constant learning rate (not LR schedule artifact)"
    - P3: "Peak timing is benchmark-relative at 20-40% of training duration"

variables_summary:
  independent: "Training epoch, LR schedule (constant/decay), Benchmark (Waterbirds/CelebA/ColoredMNIST)"
  dependent_primary: "Worst-group accuracy (WGA) and its second derivative d²WGA/dt²"
  controlled: "Architecture (ResNet-50), batch size (128), optimizer (SGD+momentum)"

null_hypothesis:
  h0_statement: |
    There is no localized acceleration in worst-group accuracy decline during training.
    The decline rate is constant throughout training (linear decay pattern), and no
    statistically significant negative peak exists in the second derivative of WGA.
  statistical_test: "One-sample t-test of d²WGA/dt² minimum against zero"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Temporal characterization framework — moving from static 'what' to dynamic 'when'"
  differentiation_summary: |
    Prior work describes WHAT (simplicity bias) and WHY (gradient starvation) but not WHEN
    shortcuts crystallize. This hypothesis quantifies temporal dynamics and proposes second
    derivative of WGA as detection method. Enables precisely-timed interventions vs. post-hoc corrections.

