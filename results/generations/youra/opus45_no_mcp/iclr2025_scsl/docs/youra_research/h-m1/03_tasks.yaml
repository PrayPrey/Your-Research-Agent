# Tasks: H-M1 Gradient Starvation Mechanism
# Generated: 2026-08-19
# Hypothesis Type: MECHANISM
# Budget Tier: FULL (≤30 tasks)

metadata:
  hypothesis_id: h-m1
  hypothesis_type: MECHANISM
  budget_tier: FULL
  total_max: 30
  epic_count: 8
  subtask_count: 22
  total_tasks: 30

epic_tasks:
  M-1:
    name: "Port h-e1 base modules"
    description: "Copy model.py, data.py, evaluate.py, detector.py unchanged; extend config.py"
    complexity: 4
    breakdown: "1+1+1+1"
    dependencies: []
    files:
      - h-m1/code/model.py
      - h-m1/code/data.py
      - h-m1/code/evaluate.py
      - h-m1/code/detector.py
      - h-m1/code/config.py
    subtasks:
      M-1-1:
        name: "Copy model.py"
        description: "Copy h-e1/code/model.py to h-m1/code/model.py"
      M-1-2:
        name: "Copy data.py"
        description: "Copy h-e1/code/data.py to h-m1/code/data.py"
      M-1-3:
        name: "Copy evaluate.py"
        description: "Copy h-e1/code/evaluate.py to h-m1/code/evaluate.py"
      M-1-4:
        name: "Copy detector.py"
        description: "Copy h-e1/code/detector.py to h-m1/code/detector.py"

  M-2:
    name: "GradientTracker implementation"
    description: "Backward hook on model.fc, per-group norm ratio, epoch aggregation"
    complexity: 9
    breakdown: "2+2+3+2"
    dependencies: [M-1]
    files:
      - h-m1/code/gradient_tracker.py
    subtasks:
      M-2-1:
        name: "GradientTracker class"
        description: "__init__ with model.fc hook registration"
      M-2-2:
        name: "Gradient hook"
        description: "_gradient_hook captures grad_output[0]"
      M-2-3:
        name: "Group ratio computation"
        description: "compute_group_gradient_ratio: minority_norm / majority_norm"
      M-2-4:
        name: "Epoch logging"
        description: "log_epoch_gradients aggregates batch ratios"

  M-3:
    name: "Training loop integration"
    description: "Wire GradientTracker into train_one_epoch/train, collect per-batch ratios"
    complexity: 8
    breakdown: "2+2+2+2"
    dependencies: [M-1, M-2]
    files:
      - h-m1/code/train.py
    subtasks:
      M-3-1:
        name: "Extend train_one_epoch"
        description: "Add tracker param, call compute_group_gradient_ratio after backward"
      M-3-2:
        name: "Extend train()"
        description: "Instantiate GradientTracker, pass to train_one_epoch"
      M-3-3:
        name: "Epoch gradient logging"
        description: "Call tracker.log_epoch_gradients after each epoch"
      M-3-4:
        name: "Return gradient history"
        description: "Add gradient_history to train() return dict"

  M-4:
    name: "Inflection detection"
    description: "compute_inflection_epoch: smoothing + derivative + first-50% search"
    complexity: 7
    breakdown: "2+1+3+1"
    dependencies: [M-2, M-3]
    files:
      - h-m1/code/inflection.py
    subtasks:
      M-4-1:
        name: "Smoothing"
        description: "Apply rolling window to gradient ratio series"
      M-4-2:
        name: "First derivative"
        description: "Compute d(ratio)/dt using np.gradient"
      M-4-3:
        name: "Inflection detection"
        description: "Find max |d/dt| acceleration in first 50% of training"

  M-5:
    name: "Correlation analysis"
    description: "Pearson r/p between gradient ratio and WGA series, temporal precedence check"
    complexity: 8
    breakdown: "2+2+2+2"
    dependencies: [M-4]
    files:
      - h-m1/code/inflection.py
    subtasks:
      M-5-1:
        name: "Pearson correlation"
        description: "correlate_with_wga using scipy.stats.pearsonr"
      M-5-2:
        name: "Temporal precedence"
        description: "Check inflection_epoch <= wga_peak_epoch"
      M-5-3:
        name: "Gate pass check"
        description: "r > 0.7 AND inflection_epoch < 50% epochs"

  M-6:
    name: "Gate evaluation"
    description: "Combine inflection + crystallization peak, apply gate thresholds"
    complexity: 6
    breakdown: "1+1+2+2"
    dependencies: [M-4, M-5]
    files:
      - h-m1/code/run.py
    subtasks:
      M-6-1:
        name: "Collect metrics"
        description: "Gather inflection_epoch, wga_peak_epoch, r, p_value"
      M-6-2:
        name: "Apply gate criteria"
        description: "PASS if r > 0.7 AND inflection < 50% epochs"

  M-7:
    name: "Visualization suite"
    description: "4 required figures including mandatory gate metrics comparison"
    complexity: 9
    breakdown: "3+2+2+2"
    dependencies: [M-3, M-5]
    files:
      - h-m1/code/visualize.py
      - h-m1/figures/
    subtasks:
      M-7-1:
        name: "Gradient ratio timeline"
        description: "plot_gradient_ratio_timeline with inflection marked"
      M-7-2:
        name: "WGA-gradient overlay"
        description: "plot_wga_gradient_overlay dual-axis plot"
      M-7-3:
        name: "Per-group gradient norms"
        description: "plot_per_group_gradient_norms line plot"
      M-7-4:
        name: "Gate metrics comparison"
        description: "plot_gate_metrics_comparison (REQUIRED for gate)"

  M-8:
    name: "Run orchestration"
    description: "run.py: train -> detect -> correlate -> visualize -> gate report"
    complexity: 6
    breakdown: "1+2+2+1"
    dependencies: [M-1, M-2, M-3, M-4, M-5, M-6, M-7]
    files:
      - h-m1/code/run.py
    subtasks:
      M-8-1:
        name: "Main function"
        description: "Orchestrate full pipeline"
      M-8-2:
        name: "Gate result output"
        description: "Print PASS/FAIL with metrics"

complexity_distribution:
  very_high_18_20: []
  high_14_17: []
  medium_9_13: [M-2, M-7]
  low_4_8: [M-1, M-3, M-4, M-5, M-6, M-8]

gate_criteria:
  type: MUST_WORK
  pass_condition: "r > 0.7 AND inflection_epoch < 50% of training epochs"
  fail_action: "EXPLORE alternative mechanism (loss landscape analysis)"

validation_checklist:
  - "GradientTracker registers hook correctly"
  - "Per-group gradient norms computed accurately"
  - "Inflection detection finds correct epoch"
  - "Correlation analysis produces valid r/p"
  - "All 4 figures generated"
  - "Gate criteria evaluated and reported"
