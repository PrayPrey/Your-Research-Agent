hypothesis_draft:
  title: "Structural Inductive Biases in Weight Embeddings for Property Prediction"
  hypothesis_id: "H-WeightStructure-v1"
  core_claim: |
    Progressively adding structural inductive biases to weight embeddings
    (layer-awareness → permutation alignment → permutation equivariance)
    improves accuracy prediction performance on the Model Zoo benchmark,
    because each bias captures increasingly sophisticated weight-space
    regularities that encode accuracy-relevant information.
  mechanism: |
    1. Layer-wise processing preserves per-layer statistics correlated with functionality
    2. Permutation alignment removes symmetry-induced variance
    3. Permutation equivariance operates directly on symmetry-reduced representations
  predictions:
    - P1: "Layer-wise > Flatten+MLP by Δr > 0.1"
    - P2: "Layer-wise+GRB > Layer-wise by Δr > 0.05"
    - P3: "NFN > Layer-wise+GRB by Δr > 0.05"

variables_summary:
  independent: "Embedding method (4 levels: Flatten+MLP, Layer-wise, Layer-wise+GRB, NFN)"
  dependent_primary: "Pearson correlation with ground-truth accuracy"
  controlled: "Dataset (Model Zoo), train/test split (80/20), regressor architecture (MLP)"

null_hypothesis:
  h0_statement: |
    There is no significant difference between Layer-wise+GRB and NFN.
    Alignment preprocessing suffices; architectural equivariance provides
    no additional benefit for property prediction.
  statistical_test: "Paired t-test"
  significance_level: 0.05

