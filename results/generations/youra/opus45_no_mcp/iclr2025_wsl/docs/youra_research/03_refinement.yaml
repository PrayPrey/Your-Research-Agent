causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Layer-wise processing preserves per-layer statistics that correlate with layer functionality"
      evidence: "Hyper-Representations and StatNN show layer-level features are predictive"
      falsifier: "If Layer-wise performs equal to or worse than Flatten+MLP"
    - step: 2
      description: "Permutation alignment (GRB) removes symmetry-induced variance, revealing functional equivalence"
      evidence: "Git Re-Basin shows aligned models enable meaningful weight-space operations"
      falsifier: "If Layer-wise+GRB performs equal to or worse than Layer-wise"
    - step: 3
      description: "Permutation equivariance (NFN) directly operates on symmetry-reduced representations"
      evidence: "NFN processes weights respecting permutation symmetries by design"
      falsifier: "If NFN performs equal to or worse than Layer-wise+GRB"
  key_tension: "Alignment preprocessing may suffice, making architectural equivariance unnecessary complexity"
  evidence_summary: |
    Each step adds one structural inductive bias. The ablation design isolates
    the contribution of each bias. Prior work shows each component works in isolation;
    the question is whether they compose and which provides the most benefit.

