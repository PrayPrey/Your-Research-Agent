# Narrative Blueprint for Phase 6 Paper
# Generated: 2026-08-19
# Source: 045_validated_hypothesis.md (PRIMARY), 03_refinement.yaml

# ═══════════════════════════════════════════════════════════════
# HOOK DESIGN
# ═══════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "We ask a simple question: does respecting neural network structure improve weight embedding quality? Our systematic ablation reveals that simply preserving layer boundaries yields a 30% improvement in accuracy prediction correlation—suggesting that structural inductive biases are as important in weight space as they are in input space."
    strategy: "Counterintuitive Finding"

  why_reader_should_care:
    main_reason: "Weight embeddings are foundational for model selection, editing, and analysis"
    concrete_example: "Practitioners selecting from 60,000+ pretrained models need embeddings that predict performance"
    stakes: "Poor embeddings waste compute on unsuitable models; good embeddings enable efficient model selection"

# ═══════════════════════════════════════════════════════════════
# PROBLEM FRAMING (3 Levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "Neural network weights encode functional properties, but extracting useful embeddings is challenging"
    common_understanding: "Most approaches flatten weights, losing architectural structure"

  deeper_problem:
    description: "Flattening destroys layer-level information that correlates with functionality"
    why_overlooked: "Simple flattening is computationally convenient"
    our_perspective: "Layer boundaries encode functional abstraction levels (edge detectors → semantic features)"

  gap_in_existing_work:
    description: "No systematic comparison of embedding methods on property prediction with consistent metrics"
    why_gap_exists: "Prior work evaluated methods on different datasets with incompatible metrics"
    why_gap_matters: "Cannot determine which structural biases provide meaningful improvement"

# ═══════════════════════════════════════════════════════════════
# KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Preserving per-layer statistics during weight embedding improves accuracy prediction correlation by Δr=0.1262 over naive flattening."
    expanded_explanation: |
      Each layer in a neural network learns different levels of abstraction. Early layers
      detect edges; late layers encode semantic features. Layer-wise statistics (mean, std,
      min, max) preserve this functional hierarchy, while flattening destroys it. The effect
      is substantial: 30% relative improvement with p<0.001 across 5 random seeds.

  why_others_missed_it:
    common_assumptions: "Flattening preserves all information (just reorders it)"
    our_different_view: "Ordering encodes structure; structure encodes function"
    enabling_factor: "Systematic ablation ladder isolating one structural bias at a time"

  what_makes_it_work:
    intuitive_explanation: "Layer-wise encoding respects that 'conv1 mean' and 'fc3 mean' have different meanings"
    key_mechanism: "Per-layer statistics correlate with layer functionality"

# ═══════════════════════════════════════════════════════════════
# EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Layer-wise encoding significantly outperforms Flatten+MLP for accuracy prediction"
    measurable_criteria: "Δr > 0.1 with p < 0.05"
    actual_result: "Δr=0.1262, p=0.0002, 5/5 seeds improved"

  supporting_evidence:
    - id: "E1"
      what: "Dataset variance σ=15.62% validates benchmark difficulty"
      so_what: "Confirms CIFAR-10 Model Zoo is non-trivial benchmark"
      how_it_supports_claim: "Effect size meaningful on challenging benchmark"

    - id: "E2"
      what: "Layer-wise r=0.547 vs Flatten r=0.421"
      so_what: "30% relative improvement from respecting layer boundaries"
      how_it_supports_claim: "Direct evidence of structural bias benefit"

    - id: "E3"
      what: "All 5 seeds show improvement (100% consistency)"
      so_what: "Not cherry-picked; robust across random initialization"
      how_it_supports_claim: "Statistical robustness of finding"

  surprising_findings:
    - finding: "Effect size exceeds threshold by 26% margin (Δr=0.1262 vs 0.1)"
      why_surprising: "Conservative threshold might have been too low"
      our_interpretation: "Structural information is more predictive than anticipated"

# ═══════════════════════════════════════════════════════════════
# HONEST LIMITATIONS (from 045_validated_hypothesis.md)
# ═══════════════════════════════════════════════════════════════

honest_limitations:
  - limitation: "Single dataset evaluation (CIFAR-10 Model Zoo)"
    why_acceptable: "Established benchmark; generalization is explicit future work"
    suggested_framing: "We validate on CIFAR-10 Model Zoo, leaving cross-dataset generalization to future work"

  - limitation: "Git Re-Basin alignment not fully evaluated (H-M2)"
    why_acceptable: "CPU resource limitation documented; code verified correct"
    suggested_framing: "Git Re-Basin alignment at 61K scale exceeded computational budget"

  - limitation: "2-step ablation instead of planned 4-step"
    why_acceptable: "Partial results still valuable; documents practical scaling limits"
    suggested_framing: "We complete two of four planned ablation steps"

# ═══════════════════════════════════════════════════════════════
# BROADER IMPACT / TAKEAWAY
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First systematic ablation quantifying structural inductive bias contribution in weight embeddings"
    why_significant: "Provides principled guidance for embedding method design"

  implications:
    for_field: "Establishes benchmark methodology for weight embedding comparison"
    for_practice: "Layer-wise encoding should be default over naive flattening"

  future_possibilities:
    immediate_extensions: "GPU-accelerated GRB, cross-architecture evaluation"
    longer_term_vision: "Universal weight embedding for model selection at scale"

# ═══════════════════════════════════════════════════════════════
# SECTION-LEVEL GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words"
    key_message: "Layer-wise encoding improves accuracy prediction by 30% over flattening"
    must_include: ["Δr=0.1262", "p<0.001", "61K models", "layer-wise beats flatten"]

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "Counterintuitive Finding"
    transition_to_related: "Connect to weight space learning literature"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify ablation"
    positioning_strategy: "Prior work evaluated methods in isolation; we provide unified comparison"
    key_comparison_points:
      - "Hyper-Representations: single method, no property prediction benchmark"
      - "NFN: equivariant but not compared to simpler alternatives"
      - "Git Re-Basin: alignment for merging, not embedding"

  methodology:
    narrative_purpose: "WHY this design solves the problem"
    connection_to_insight: "Ablation ladder isolates structural bias contribution"
    key_design_decisions:
      - "Layer-wise statistics: mean, std, min, max per layer"
      - "Fixed regressor head: MLP with 64 hidden units"
      - "5-seed evaluation for statistical robustness"

  experiments:
    narrative_purpose: "Design tests that verify specific claims"
    experimental_questions:
      - "Q1: Does dataset have sufficient variance for meaningful evaluation?"
      - "Q2: Does layer-wise encoding outperform flatten baseline?"
      - "Q3: Does alignment preprocessing add further benefit?"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "Layer-wise achieves r=0.547 vs Flatten r=0.421 (Δr=0.1262, p=0.0002)"
    figure_highlights:
      - "scatter_layerwise.png: Predicted vs actual for Layer-wise"
      - "scatter_flatten.png: Predicted vs actual for Flatten"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    honest_limitations:
      - "Single dataset"
      - "Alignment not fully evaluated"
      - "2 of 4 ablation steps completed"
    future_directions:
      - "GPU-accelerated alignment"
      - "Cross-architecture evaluation"

  conclusion:
    narrative_purpose: "Callback to hook, open future"
    callback_to_hook: "Simple structural bias (layer boundaries) yields substantial improvement"
    future_work_vision: "Universal weight embeddings for model selection"

