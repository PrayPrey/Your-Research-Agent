# H-M3 Implementation Tasks
# Type: MECHANISM | Tier: FULL | Budget: 30 tasks max

hypothesis_id: h-m3
hypothesis_type: MECHANISM
tier: FULL
total_budget: 30
actual_total: 18

data_preparation:
  - id: DP-1
    name: "Reuse H-M2 data loaders"
    description: "Import load_task_loader from h_m2.code.data for GSM8K and NQ datasets"
    complexity: low
    points: 0
    status: reuse

epic_tasks:
  - id: E-1
    name: "Implement LoRA Effective Rank Measurement"
    description: "Create rank.py with extract_lora_matrices, compute_effective_rank, compute_model_effective_rank"
    complexity: high
    points: 4
    file: code/rank.py
    dependencies: []
    subtasks:
      - id: E-1.1
        name: "extract_lora_matrices function"
        description: "Walk peft-wrapped model to extract lora_A, lora_B matrices"
        points: 1
      - id: E-1.2
        name: "compute_effective_rank via SVD"
        description: "SVD of delta_W = lora_B @ lora_A, cumsum threshold"
        points: 2
      - id: E-1.3
        name: "compute_model_effective_rank aggregation"
        description: "Aggregate across target modules, return dict"
        points: 1

  - id: E-2
    name: "Implement Generalization Gap Evaluation"
    description: "Create evaluate.py with evaluate_accuracy and compute_generalization_gap"
    complexity: medium
    points: 2
    file: code/evaluate.py
    dependencies: [E-1]
    subtasks:
      - id: E-2.1
        name: "evaluate_accuracy function"
        description: "Exact-match accuracy over dataloader"
        points: 1
      - id: E-2.2
        name: "compute_generalization_gap function"
        description: "Train/test accuracy and gap calculation"
        points: 1

  - id: E-3
    name: "Implement Correlation Analysis"
    description: "Create correlate.py with compute_sharpness_rank_correlation and check_gate"
    complexity: medium
    points: 2
    file: code/correlate.py
    dependencies: [E-1, E-2]
    subtasks:
      - id: E-3.1
        name: "compute_sharpness_rank_correlation"
        description: "Spearman correlation between sharpness and effective rank"
        points: 1
      - id: E-3.2
        name: "check_gate function"
        description: "Verify rho > 0.5 threshold for MUST_WORK gate"
        points: 1

  - id: E-4
    name: "Implement Visualization"
    description: "Create visualize.py with scatter plot and regression line"
    complexity: low
    points: 1
    file: code/visualize.py
    dependencies: [E-3]

  - id: E-5
    name: "Create Configuration Module"
    description: "Create config.py with LORA_CONFIG, RANK_CONFIG, GATE_THRESHOLD"
    complexity: low
    points: 1
    file: code/config.py
    dependencies: []

  - id: E-6
    name: "Implement Main Experiment Runner"
    description: "Create run_experiment.py orchestrating finetune→sharpness→rank→correlate→visualize"
    complexity: high
    points: 4
    file: code/run_experiment.py
    dependencies: [E-1, E-2, E-3, E-4, E-5]
    subtasks:
      - id: E-6.1
        name: "Per-task finetune loop"
        description: "Reuse finetune_on_task from h_m2"
        points: 1
      - id: E-6.2
        name: "Sharpness measurement integration"
        description: "Reuse measure_task_sharpness from h_m2"
        points: 1
      - id: E-6.3
        name: "Multi-seed aggregation"
        description: "Run 3 seeds, aggregate results"
        points: 1
      - id: E-6.4
        name: "Results output and gate check"
        description: "Save experiment_results.json with gate status"
        points: 1

checkpoint:
  - id: CP-1
    name: "Validation Checkpoint"
    description: "Run full experiment, verify Spearman rho > 0.5"
    complexity: medium
    points: 2
    dependencies: [E-6]

summary:
  data_preparation: 1 (reuse)
  epic_tasks: 6
  subtasks: 11
  checkpoint: 1
  total_points: 18
  within_budget: true
