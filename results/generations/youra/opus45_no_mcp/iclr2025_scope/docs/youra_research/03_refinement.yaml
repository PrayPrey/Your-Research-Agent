# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Conversion from Transformer to Mamba/SSM architectures
    - LoRA-based efficient fine-tuning (rank 8-64 typical range)
    - Tasks in NLP domain with measurable accuracy
    - Models in 1B-7B parameter range
  does_not_apply_to: |
    - Full fine-tuning (all parameters updated)
    - Vision or multimodal architectures
    - Extremely small (<100M) or large (>70B) models
    - Tasks without clear accuracy metrics (generation quality)
  known_limitations: |
    - Retrieval density operationalization may be imperfect
    - State dimension selection affects results
    - Limited to English-language benchmarks tested

