gap_id: "GAP-1"
gap_title: "Systematic Task Adaptation Study Under Architecture Conversion"
gap_description: |
  No systematic study quantifies how task-specific adaptation (via LoRA/adapters)
  behaves when models are converted from quadratic attention to sub-quadratic
  architectures (Mamba, linear attention, hybrid). Existing work evaluates
  converted models on standard benchmarks but lacks controlled experiments
  comparing adaptation performance pre/post conversion.
