# Phase 6 Narrative Blueprint
# Generated: 2026-08-19
# Purpose: Story structure guiding all section generation

metadata:
  hypothesis_id: "H-EntropyConsistency-v1"
  source_artifacts:
    - "045_validated_hypothesis.md"
    - "03_refinement.yaml"
    - "02b_verification_plan.md"
    - "01_targeted_research.md"
  paper_type: "ICML 2025"

# ==============================================================================
# HOOK DESIGN
# ==============================================================================

hook:
  opening_statement:
    content: "Semantic consistency dramatically outperforms token entropy for hallucination detection—achieving AUROC 0.81 versus 0.65—yet combining these seemingly complementary signals yields no improvement at proof-of-concept scale."
    strategy: "Counterintuitive Finding"

  why_reader_should_care:
    main_reason: "LLM hallucination detection is critical for safe deployment; understanding which signals work (and which don't combine as expected) directly impacts practical system design"
    concrete_example: "Multi-sample consistency achieves Cohen's d=1.19 effect size, while token entropy shows only d=0.47, fundamentally changing which uncertainty signal practitioners should prioritize"
    stakes: "Deploying hallucination detection with wrong signal priority wastes resources on suboptimal approaches"

# ==============================================================================
# PROBLEM FRAMING (Three Levels)
# ==============================================================================

problem_framing:
  surface_problem:
    description: "LLMs generate plausible-sounding but factually incorrect outputs (hallucinations)"
    common_understanding: "Uncertainty quantification can help detect when models are likely to hallucinate"

  deeper_problem:
    description: "Token-level entropy and semantic consistency are studied separately; their relative effectiveness and complementarity is unknown"
    why_overlooked: "Prior work (Kuhn et al. 2023, Manakul et al. 2023) focused on individual signals without systematic comparison"
    our_perspective: "These signals may capture orthogonal failure modes (internal confusion vs. output instability) and could complement each other"

  gap_in_existing_work:
    description: "No systematic AUROC comparison of entropy vs. consistency on same benchmark with same model; no test of whether combination improves prediction"
    why_gap_exists: "Research communities worked independently on entropy-based vs. consistency-based methods"
    why_gap_matters: "Practitioners need empirical guidance on which signal to prioritize"

# ==============================================================================
# KEY INSIGHT (Experiment-Verified)
# ==============================================================================

key_insight:
  aha_moment:
    one_sentence: "Semantic consistency alone is sufficient for strong hallucination detection (AUROC=0.81), and linear fusion with entropy provides no additional benefit at PoC scale."
    expanded_explanation: |
      Our experiments reveal a clear hierarchy: consistency dramatically outperforms entropy (0.81 vs 0.65 AUROC).
      The moderate negative correlation (r=-0.54) between signals suggests partial redundancy rather than orthogonality.
      At N=20, optimal fusion weights collapsed to pure consistency (α=0, β=0.1), indicating entropy adds noise rather than signal.

  why_others_missed_it:
    common_assumptions: "Entropy and consistency were assumed complementary because they measure different things (internal state vs. output behavior)"
    our_different_view: "Complementarity in theory doesn't guarantee complementarity in practice; empirical combination testing is essential"
    enabling_factor: "Systematic comparison on same TriviaQA subset with identical evaluation protocol"

  what_makes_it_work:
    intuitive_explanation: "When a model 'knows' an answer, all samples converge; when hallucinating, samples diverge. This behavioral signal is more directly predictive than internal logit uncertainty."
    key_mechanism: "Pairwise embedding cosine similarity across 10 samples, averaged to consistency score"

# ==============================================================================
# EVIDENCE NARRATIVE
# ==============================================================================

evidence_narrative:
  main_claim:
    statement: "Semantic consistency achieves AUROC=0.81 (Cohen's d=1.19) for hallucination detection on TriviaQA, significantly outperforming token entropy (AUROC=0.65, d=0.47)"
    measurable_criteria: "Statistical significance (p<0.05), effect size comparison, AUROC difference"

  supporting_evidence:
    - id: "E1_existence"
      what: "Both metrics computable with 100% success rate"
      so_what: "Pipeline is technically feasible and robust"
      how_it_supports_claim: "Validates measurement approach before analysis"

    - id: "E2_entropy_correlation"
      what: "Entropy correlates with correctness (p=0.0246, AUROC=0.65)"
      so_what: "Entropy has signal, but moderate effect size (d=0.47)"
      how_it_supports_claim: "Establishes baseline for comparison"

    - id: "E3_consistency_superiority"
      what: "Consistency achieves AUROC=0.81 (p=0.0083, d=1.19)"
      so_what: "Large effect size indicates practically meaningful signal"
      how_it_supports_claim: "Core finding—consistency dramatically outperforms entropy"

    - id: "E4_fusion_failure"
      what: "Linear fusion shows no improvement over consistency alone"
      so_what: "Signals are not complementary at PoC scale; combination strategy needs rethinking"
      how_it_supports_claim: "Important negative result with practical implications"

  surprising_findings:
    - finding: "Optimal fusion weights collapsed to α=0, β=0.1 (pure consistency)"
      why_surprising: "Expected complementary signals; instead, entropy was noise"
      our_interpretation: "Small sample size (N=20) and moderate correlation (r=-0.54) prevented fusion benefit from manifesting"

    - finding: "Consistency beats entropy by 16pp AUROC"
      why_surprising: "Prior literature (Kuhn et al. 2023) emphasized entropy-based methods"
      our_interpretation: "For factual QA with ground-truth, behavioral consistency is more directly predictive than internal uncertainty"

# ==============================================================================
# BROADER IMPACT
# ==============================================================================

takeaway:
  main_contribution:
    one_sentence: "First systematic comparison showing consistency dramatically outperforms entropy for hallucination detection on TriviaQA"
    why_significant: "Redirects practitioner attention to the more effective signal"

  implications:
    for_field: "Motivates investigation of non-linear combination strategies and larger-scale fusion studies"
    for_practice: "Practitioners should prioritize consistency-based detection over entropy-based methods for factual QA"

  future_possibilities:
    immediate_extensions: "Larger N (≥500) to test fusion properly; cross-dataset validation (NQ, TruthfulQA)"
    longer_term_vision: "Adaptive combination strategies; difficulty-stratified detection; larger model evaluation"

# ==============================================================================
# SECTION-LEVEL GOALS
# ==============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words"
    key_message: "Consistency (AUROC=0.81) outperforms entropy (0.65); fusion provides no improvement at PoC scale"
    word_target: 150

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "Counterintuitive Finding"
    transition_to_related: "Position our systematic comparison against siloed prior work"
    word_target: 900

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Prior work studied signals separately; we provide first direct comparison"
    key_comparison_points:
      - "Kuhn et al. (2023) Semantic Entropy: entropy-focused, no consistency"
      - "Manakul et al. (2023) SelfCheckGPT: consistency-focused, no entropy comparison"
      - "Xiong et al. (2023) Verbalized Confidence: model self-report baseline"
    word_target: 700

  methodology:
    narrative_purpose: "Show WHY this design tests complementarity"
    connection_to_insight: "Multi-sample generation + dual measurement enables direct comparison"
    key_design_decisions:
      - "10 samples per question at temperature 0.7"
      - "Token entropy from softmax distributions"
      - "Consistency via embedding cosine similarity"
      - "Linear fusion with grid-searched weights"
    word_target: 1100

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Can both metrics be reliably computed? (H-E1)"
      - "Does entropy correlate with correctness? (H-M1)"
      - "Does consistency correlate with correctness? (H-M2)"
      - "Does fusion improve over single metrics? (H-M3)"
    word_target: 900

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "Consistency AUROC=0.81 vs Entropy AUROC=0.65; Fusion=0.81 (no improvement)"
    figure_references:
      - "ROC curves for entropy and consistency"
      - "Consistency distribution by correctness"
      - "Entropy-consistency scatter"
    word_target: 1100

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    honest_limitations:
      - "Small sample size (N=20 for H-M2, H-M3)"
      - "Single model (Llama-2-7B-chat)"
      - "Single dataset (TriviaQA)"
    word_target: 500

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "The surprising dominance of consistency over entropy fundamentally changes which signal practitioners should prioritize—and our fusion failure points to deeper questions about signal complementarity"
    word_target: 350

