# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Combination Method"
      type: "categorical"
      operationalization: "Method used to derive uncertainty score"
      levels:
        - "entropy_only"
        - "consistency_only"
        - "linear_fusion"
        - "quadrant_classification"
  dependent:
    - name: "Hallucination Prediction AUROC"
      type: "continuous"
      operationalization: "Area under ROC curve for predicting correctness (range 0.5-1.0)"
      primary: true
    - name: "Expected Calibration Error (ECE)"
      type: "continuous"
      operationalization: "Calibration metric, lower is better (range 0.0-1.0)"
      primary: false
    - name: "Quadrant Accuracy"
      type: "continuous"
      operationalization: "Accuracy within each entropy-consistency quadrant"
      primary: false
  controlled:
    - name: "Model"
      operationalization: "Llama-2-7B-chat (instruction-tuned, HuggingFace)"
    - name: "Samples per Question"
      operationalization: "10 samples generated per question"
    - name: "Sampling Temperature"
      operationalization: "0.7 for all generation"
    - name: "Correctness Threshold"
      operationalization: "Exact match OR F1 > 0.5 with reference answer"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Token Entropy Measurement: Compute entropy from token logit distributions for each generated response, quantifying internal model uncertainty"
      evidence: "Standard entropy formula applied to softmax probabilities"
      falsifier: "If entropy is constant regardless of question difficulty, step fails"
    - step: 2
      description: "Semantic Consistency Measurement: Generate N samples, compute pairwise semantic similarity (embedding cosine or NLI), average to get consistency score"
      evidence: "SelfCheckGPT methodology (Manakul et al., 2023)"
      falsifier: "If consistency score doesn't vary with hallucination rate, step fails"
    - step: 3
      description: "Signal Combination: Combine inverse entropy and consistency via linear fusion (α·(1-entropy) + β·consistency) or quadrant classification"
      evidence: "Novel combination strategy being tested"
      falsifier: "If combined score doesn't improve prediction, hypothesis fails"
    - step: 4
      description: "Hallucination Prediction: Use unified score to predict correctness; evaluate against ground-truth labels from benchmark"
      evidence: "AUROC/ECE evaluation on TriviaQA/NQ/TruthfulQA"
      falsifier: "If AUROC improvement < 2pp and not at ceiling, hypothesis fails"
  key_tension: "Whether signals are truly complementary or redundant"
  evidence_summary: |
    Entropy captures internal uncertainty (model "doesn't know").
    Consistency captures output stability (model "can't reliably generate").
    Prior work studies them separately; combination is the novel contribution.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Token entropy is accessible (model provides logits)"
    supporting_evidence: "Open-source models like Llama expose logits"
    consequence_if_violated: "Cannot compute entropy; must use alternative uncertainty proxy"
  - id: "A2"
    assumption: "Semantic similarity captures meaning equivalence adequately"
    supporting_evidence: "NLI models and embedding similarity are well-validated"
    consequence_if_violated: "Consistency metric becomes unreliable"
  - id: "A3"
    assumption: "Ground-truth labels in benchmarks are reliable"
    supporting_evidence: "TriviaQA/NQ are established with verified answers"
    consequence_if_violated: "Evaluation is noisy, may require larger sample sizes"
  - id: "A4"
    assumption: "Entropy and consistency are sufficiently uncorrelated"
    supporting_evidence: "Theoretically different signals (internal vs. output)"
    consequence_if_violated: "Combination provides no benefit over single metric"
  - id: "A5"
    assumption: "Results generalize across question difficulty levels"
    supporting_evidence: "Benchmarks contain varied difficulty"
    consequence_if_violated: "Must stratify results by difficulty"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Instruction-tuned LLMs with logit access
    - Factual QA tasks with ground-truth labels
    - Single-turn question answering
  does_not_apply_to: |
    - API-only models without logit access (GPT-4, Claude)
    - Open-ended generation without ground truth
    - Multi-turn dialogue or reasoning chains
  known_limitations: |
    - Tested on single model family (Llama-2-7B-chat)
    - Results may not transfer to larger models or different architectures
    - Requires multiple samples per question (computational overhead)

