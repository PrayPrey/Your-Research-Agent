# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Token entropy correlates with model uncertainty"
      status: "BUILD_ON"
      evidence: "Standard result in uncertainty quantification literature"
    - claim: "Semantic clustering improves over token-level entropy"
      status: "BUILD_ON"
      evidence: "Kuhn et al. (2023) semantic entropy paper"
    - claim: "Multi-sample consistency detects hallucinations"
      status: "BUILD_ON"
      evidence: "Manakul et al. (2023) SelfCheckGPT paper"
    - claim: "ECE is measurable on QA benchmarks"
      status: "BUILD_ON"
      evidence: "Guo et al. (2017) calibration paper"
    - claim: "Combination of entropy and consistency is optimal"
      status: "PROVE_NEW"
      evidence: "No prior systematic study on same benchmarks"
  scope_reduction_percentage: 80
  phase2b_4_instructions: |
    Established facts (BUILD_ON) do not require re-verification.
    Focus verification on the PROVE_NEW claim: whether combination outperforms single metrics.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EntropyConsistency-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under QA task conditions with pretrained instruction-tuned LLMs,
    if we combine token-level entropy and semantic consistency into a single hallucination prediction score,
    then prediction accuracy (AUROC) improves by ≥2 percentage points over the best single metric,
    because entropy and consistency capture complementary failure modes (internal confusion vs. output instability).
  alternative_hypothesis_h0: |
    There is no significant difference in AUROC between the combined entropy-consistency metric
    and the best single metric (entropy alone or consistency alone) on QA benchmarks.

