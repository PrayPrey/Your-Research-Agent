hypothesis_draft:
  title: "Complementary Entropy-Consistency Hallucination Detection"
  hypothesis_id: "H-EntropyConsistency-v1"
  core_claim: |
    Combining token-level entropy and semantic consistency into a unified hallucination
    prediction score outperforms either metric alone on QA benchmarks, because these
    signals capture complementary failure modes: entropy measures internal model confusion
    while consistency measures output stability.
  mechanism: |
    1. Token entropy quantifies how uncertain the model was during generation (flat logit distribution = high entropy = uncertainty)
    2. Semantic consistency quantifies whether the model produces similar answers across samples (low similarity = low consistency = instability)
    3. High entropy indicates "the model doesn't know" (internal state)
    4. Low consistency indicates "the model can't reliably generate" (output behavior)
    5. Combined signal captures both failure modes simultaneously
  predictions:
    - P1: "Linear fusion achieves ≥2pp AUROC improvement over best single metric on TriviaQA"
    - P2: "ECE improves by ≥0.02 with combined metric"
    - P3: "Results replicate on Natural Questions and TruthfulQA"

variables_summary:
  independent: "Combination method (entropy_only, consistency_only, linear_fusion, quadrant_classification)"
  dependent_primary: "Hallucination prediction AUROC (range 0.5-1.0)"
  controlled: "Model (Llama-2-7B-chat), samples (10), temperature (0.7), correctness threshold (EM or F1>0.5)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in AUROC between the combined entropy-consistency
    metric and the best single metric (entropy alone or consistency alone) on QA benchmarks
    with ground-truth correctness labels.
  statistical_test: "Paired bootstrap comparison or McNemar's test"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic combination of entropy and consistency on standard QA benchmarks; novel 'complementary failure modes' theoretical framing"
  differentiation_summary: |
    Prior work (Kuhn et al., Manakul et al.) studies entropy and consistency separately.
    No published study combines them on the same benchmarks with fair comparison.
    The quadrant-based analysis (2x2 split) is a novel interpretability lens.

