discussion_synthesis:
  key_insights:
    - "Entropy and consistency probe different failure modes (internal vs. output)"
    - "Interaction structure (quadrants) may be more interpretable than continuous fusion"
    - "Both methods already require multi-sampling, so combination adds no overhead"
  breakthrough_moments:
