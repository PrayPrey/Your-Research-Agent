# ══════════════════════════════════════════════════════════════════
# HOOK DESIGN
# ══════════════════════════════════════════════════════════════════

hook:
  strategy: "counterintuitive_finding"
  opening_statement:
    content: "The most-studied benchmarks may be teaching models the wrong lessons: we find that models trained on high-popularity datasets exhibit generalization gaps 21 percentage points larger than those trained on less-popular alternatives."
    strategy: "surprising_statistic_plus_paradox"

  why_reader_should_care:
    main_reason: "If popular benchmarks induce worse generalization, the field's primary progress indicators are unreliable"
    concrete_example: "A ResNet-18 achieving 95% on CIFAR-10 drops to 76% on CINIC-10, while SVHN-trained models maintain or improve accuracy on held-out data"
    stakes: "Deployment failures, misguided architectural choices, wasted research investment"

# ══════════════════════════════════════════════════════════════════
# PROBLEM FRAMING (3 Levels)
# ══════════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "Models trained on benchmark datasets often fail when deployed on real-world data"
    common_understanding: "Domain shift and distribution mismatch cause performance drops"

  deeper_problem:
    description: "Popular benchmarks receive disproportionate optimization investment (7.56x more papers), potentially creating dataset-specific artifacts"
    why_overlooked: "Researchers assume benchmark quality improves with usage"
    our_perspective: "Popularity may be a liability, not an asset—more optimization → more overfitting to benchmark-specific patterns"

  gap_in_existing_work:
    description: "No systematic study linking cross-repository dataset popularity to generalization failure"
    why_gap_exists: "Recht et al. studied single dataset; D'Amour et al. provided theory without popularity quantification"
    why_gap_matters: "Cannot diagnose whether benchmark choice itself contributes to deployment failures"

# ══════════════════════════════════════════════════════════════════
# KEY INSIGHT
# ══════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "High-popularity datasets (CIFAR-10) exhibit generalization gaps to held-out same-domain datasets that are 21 percentage points larger than low-popularity datasets (SVHN), despite identical training protocols and architectures."
    expanded_explanation: "The correlation is substantial and directionally unambiguous. Popular benchmarks attract 7.56x more optimization papers, suggesting a co-evolution effect. However, the mechanism is not texture bias—modern architectures actually show LOWER texture bias than legacy ones."
    verification_status: "EXPERIMENT_VERIFIED"

  why_others_missed_it:
    common_assumptions: "Benchmark quality improves with usage; more research attention = better understanding"
    our_different_view: "More optimization may create benchmark-specific shortcuts rather than generalizable features"
    enabling_factor: "Cross-repository analysis combining OpenML run-rates with arXiv paper counts"

  what_makes_it_work:
    intuitive_explanation: "Heavily optimized benchmarks are like overtrained test-takers—they ace the specific test but fail when questions change slightly"
    key_mechanism: "Research investment differential creates dataset-specific optimization pressure (mechanism step 1 verified; step 2 texture bias falsified)"

# ══════════════════════════════════════════════════════════════════
# EVIDENCE NARRATIVE
# ══════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "High-popularity datasets induce larger generalization gaps than low-popularity same-domain alternatives"
    measurable_criteria: "21.21 pp gap difference (CIFAR 18.86% vs SVHN -2.35%)"

  supporting_evidence:
    - id: "evidence_1"
      what: "21.21 percentage point gap difference between high-use (CIFAR-10) and low-use (SVHN) datasets"
      so_what: "The effect is substantial—not a marginal statistical artifact but a dramatic difference in real-world reliability"
      how_it_supports_claim: "Directly demonstrates popularity-gap correlation on canonical dataset pairs"
      hypothesis: "h-e1"
      status: "PASS"

    - id: "evidence_2"
      what: "7.56x more optimization papers for high-use datasets (p=0.027)"
      so_what: "Popular datasets receive nearly an order of magnitude more research attention"
      how_it_supports_claim: "Confirms first mechanism step: popularity drives research investment"
      hypothesis: "h-m1"
      status: "PASS"

    - id: "evidence_3"
      what: "ResNet-18 shows LOWER texture bias (0.126) than VGG-11 (0.161)"
      so_what: "The obvious mechanism (texture bias via optimization) is wrong—skip connections may improve generalization"
      how_it_supports_claim: "Rules out texture bias as causal pathway; narrows future investigation"
      hypothesis: "h-m2"
      status: "FAIL (valuable negative result)"

  surprising_findings:
    - finding: "Modern architectures (ResNet) show lower texture bias than legacy (VGG)"
      why_surprising: "Geirhos et al. (2019) found texture bias prevalent; we expected optimization to amplify it"
      our_interpretation: "Skip connections and batch normalization may preserve shape information; architectural innovation trumps optimization pressure at CIFAR scale"

# ══════════════════════════════════════════════════════════════════
# TAKEAWAY / BROADER IMPACT
# ══════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First systematic demonstration that benchmark popularity correlates with larger generalization failures, with partial mechanism verification"
    why_significant: "Challenges assumption that well-established benchmarks are reliable progress indicators"

  implications:
    for_field: "Researchers should consider benchmark popularity when interpreting results; diverse benchmark testing is essential"
    for_practice: "Practitioners should validate on unpopular same-domain data before deployment"

  future_possibilities:
    immediate_extensions: "Test alternative artifact types (spurious correlations, background features), extend to NLP/tabular domains"
    longer_term_vision: "Develop popularity-aware benchmark selection guidelines; automatic artifact detection tools"

# ══════════════════════════════════════════════════════════════════
# SECTION-LEVEL GOALS
# ══════════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words with quantitative highlights"
    key_message: "Popularity paradox: most-studied benchmarks teach worst lessons"
    word_target: 150

  introduction:
    narrative_purpose: "Hook → Problem (3 levels) → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    key_points:
      - "Open with popularity paradox and 21.21 pp statistic"
      - "Frame problem in three levels (surface → deeper → gap)"
      - "Preview key insight and contributions"
    transition_to_related: "Existing work documents single-dataset failures but lacks cross-repository popularity analysis"
    word_target: 900

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our cross-repository approach"
    positioning_strategy: "BUILD_ON"
    key_comparison_points:
      - "Recht et al. (2019): single dataset, no popularity analysis"
      - "D'Amour et al. (2020): theory without empirical quantification"
      - "Geirhos et al. (2019): texture bias we test and refute at CIFAR scale"
    word_target: 700

  methodology:
    narrative_purpose: "Show WHY this design tests the co-evolution hypothesis"
    connection_to_insight: "Cross-repository popularity metrics + paired held-out datasets + mechanism tests"
    key_design_decisions:
      - "Run-rate as popularity proxy (normalizes for dataset age)"
      - "CIFAR-10/CINIC-10 and SVHN/SVHN-Extra as canonical pairs"
      - "ResNet-18 vs VGG-11 for mechanism test (texture bias)"
      - "arXiv paper counts for optimization investment"
    word_target: 1100

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Q1 (h-e1): Do high-popularity datasets show larger gaps?"
      - "Q2 (h-m1): Do popular datasets attract more optimization research?"
      - "Q3 (h-m2): Does texture bias explain the mechanism?"
    word_target: 900

  results:
    narrative_purpose: "Present evidence supporting (and falsifying) claims"
    main_result_highlight: "21.21 pp gap difference confirms existence; 7.56x research differential confirms step 1; texture bias mechanism falsified"
    figures:
      - "fig_1: gap_comparison.png (main result)"
      - "fig_3: optimization_ratio.png (mechanism step 1)"
      - "fig_6: texture_bias_comparison.png (mechanism step 2 failure)"
    word_target: 1100

  discussion:
    narrative_purpose: "Interpret results, explain negative finding, acknowledge limits"
    key_points:
      - "Interpret texture bias reversal (skip connections help generalization)"
      - "Alternative mechanism hypotheses (spurious correlations, test set leakage)"
      - "Honest limitations (2 dataset pairs, single-run PoC, vision-only)"
    honest_limitations:
      - "Two dataset pairs only"
      - "PoC statistical rigor (single run for h-e1)"
      - "Mechanism incomplete (texture bias falsified)"
    word_target: 500

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "Return to popularity paradox—the solution may lie in diversifying benchmark portfolios"
    future_directions:
      - "Alternative artifact types"
      - "Multi-domain validation (NLP, tabular)"
      - "Full ImageNet-scale replication"
    word_target: 350

