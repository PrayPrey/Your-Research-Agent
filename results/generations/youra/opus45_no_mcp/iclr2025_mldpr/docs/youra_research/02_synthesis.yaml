hypothesis_draft:
  title: "Benchmark Co-Evolution and Generalization Gap"
  hypothesis_id: "H-BenchmarkCoEvolution-v1"
  core_claim: |
    Models trained on high-popularity benchmark datasets exhibit larger generalization gaps
    when tested on held-out same-domain datasets, compared to models trained on low-popularity
    datasets from the same domain. This is caused by ecosystem co-evolution: popular benchmarks
    attract architecture/hyperparameter search that optimizes for dataset-specific artifacts
    rather than domain-general features.
  mechanism: |
    1. Popular benchmarks attract intensive architecture search → optimized for benchmark specifics
    2. Dataset-specific optimization creates features that exploit artifacts → underspecification
    3. Held-out datasets lack these artifacts → performance drop
  predictions:
    - P1: "High-use datasets show larger generalization gaps than low-use same-domain datasets (d > 0.3)"
    - P2: "Modern architectures show larger gaps than legacy architectures on popular datasets"
    - P3: "Pretrained models show larger gaps than random-init models on popular datasets"

variables_summary:
  independent: "Dataset popularity (run-rate quartile), Architecture era (modern/legacy), Pretraining status"
  dependent_primary: "Generalization gap (in-domain accuracy - held-out accuracy)"
  controlled: "Domain pairing, dataset size, dataset age, model capacity"

