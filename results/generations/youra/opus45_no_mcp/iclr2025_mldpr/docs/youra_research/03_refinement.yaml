# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Individual benchmark datasets can exhibit overfitting patterns"
      status: "BUILD_ON"
      evidence: "Recht et al. (2019) demonstrated 10-15% accuracy drops on ImageNetV2"
    - claim: "Underspecification causes benchmark performance to fail in deployment"
      status: "BUILD_ON"
      evidence: "D'Amour et al. (2020) theoretical framework"
    - claim: "Cross-repository popularity-generalization correlation exists"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis - no prior systematic study"
    - claim: "Ecosystem co-evolution explains mechanism"
      status: "PROVE_NEW"
      evidence: "Novel framing requiring mechanism test"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    Build on established facts (Recht, D'Amour) without re-proving.
    Focus verification on: popularity-gap correlation across repositories,
    mechanism test via architecture era comparison.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkCoEvolution-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under conditions where domain pairing uses established taxonomies (OpenML task types + modality)
    and controlling for dataset size and age, IF models are trained on high-popularity datasets
    (top quartile by run-rate) compared to low-popularity datasets (bottom quartile) from the same domain,
    THEN the generalization gap to held-out same-domain test sets will be significantly larger
    (Cohen's d > 0.3), BECAUSE high-popularity datasets have been over-optimized by the ML
    architecture and hyperparameter search ecosystem (benchmark co-evolution effect).
  alternative_hypothesis_h0: |
    There is no significant difference in generalization gap between models trained on
    high-popularity vs low-popularity datasets from the same domain when controlling for
    dataset size, age, and intrinsic difficulty.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "dataset_popularity"
      type: "categorical"
      operationalization: "Quartile by run-rate (runs per year since creation) from OpenML API"
      levels: ["high (Q4)", "low (Q1)"]
    - name: "architecture_era"
      type: "categorical"
      operationalization: "Modern (ResNet-era, 2015+) vs Legacy (VGG-era, pre-2015)"
      levels: ["modern", "legacy"]
    - name: "pretraining_status"
      type: "categorical"
      operationalization: "ImageNet pretrained vs random initialization"
      levels: ["pretrained", "random_init"]
  dependent:
    - name: "generalization_gap"
      type: "continuous"
      operationalization: "accuracy_in_domain - accuracy_held_out (percentage points)"
      primary: true
    - name: "gap_effect_size"
      type: "continuous"
      operationalization: "Cohen's d comparing high-use vs low-use conditions"
      primary: false
  controlled:
    - name: "domain_pairing"
      operationalization: "Same OpenML task type + same modality (image/tabular/text)"
    - name: "dataset_size"
      operationalization: "Include as covariate in regression"
    - name: "dataset_age"
      operationalization: "Use run-rate instead of raw run count"
    - name: "model_capacity"
      operationalization: "Match parameter count when comparing architectures"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Popular benchmarks attract intensive architecture/hyperparameter search"
      evidence: "Observable: top-performing ImageNet models undergo extensive NAS"
      falsifier: "If low-use datasets receive equal architecture search investment"
    - step: 2
      description: "Dataset-specific optimization creates features that exploit benchmark artifacts"
      evidence: "Texture bias studies (Geirhos 2019) show artifact exploitation"
      falsifier: "If optimized features remain domain-general"
    - step: 3
      description: "Held-out same-domain datasets lack these specific artifacts"
      evidence: "Recht et al. ImageNetV2 distribution matching still shows 10-15% drop"
      falsifier: "If held-out datasets contain same artifacts"
  key_tension: "Distinguishing ecosystem co-evolution from simple capacity overfitting requires architecture era comparison"
  evidence_summary: |
    Recht et al. (2019) provides direct evidence for step 3.
    D'Amour et al. (2020) provides theoretical grounding for step 2.
    Architecture search literature supports step 1.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "OpenML run-rate is valid proxy for dataset popularity"
    supporting_evidence: "Run count correlates with citation counts in ML papers"
    consequence_if_violated: "Need alternative popularity metric (downloads, citations)"
  - id: "A2"
    assumption: "Same task type + modality constitutes 'same domain'"
    supporting_evidence: "Standard practice in transfer learning literature"
    consequence_if_violated: "Need finer-grained domain taxonomy"
  - id: "A3"
    assumption: "Generalization gap is causally influenced by popularity, not confounded"
    supporting_evidence: "Three-condition design controls for main confounds"
    consequence_if_violated: "Correlation but not causation"
  - id: "A4"
    assumption: "Dataset pairs (CIFAR/CINIC, SVHN/SVHN-Extra) are valid same-domain pairs"
    supporting_evidence: "Explicitly designed as distribution-matched pairs"
    consequence_if_violated: "Results may not generalize to arbitrary pairs"
  - id: "A5"
    assumption: "Architecture differences reflect design-time optimization, not capacity"
    supporting_evidence: "Capacity matching controls for parameter count"
    consequence_if_violated: "Cannot distinguish mechanism from capacity effects"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Image classification datasets in OpenML/HuggingFace
    - Standard supervised learning architectures (CNNs, ResNets)
    - Single-task evaluation (not multi-task or meta-learning)
  does_not_apply_to: |
    - Reinforcement learning benchmarks
    - Generative model evaluation
    - Private/proprietary datasets not in public repositories
    - Domains with insufficient dataset pairs (e.g., medical imaging)
  known_limitations: |
    - Survivorship bias: unpopular datasets in repositories are still notable
    - Single modality (vision) may not generalize to NLP/audio
    - Run-rate metric sensitivity to repository-specific practices

