main_hypothesis:
  id: H-ErrorGatedFeedback-v1
  confidence: 0.75
  core_statement: 'Under controlled RL fine-tuning of code LLMs, if fine-grained execution

    feedback is applied only to errors with reliable source localization

    (U_line category), then training sample efficiency improves compared

    to unconditional fine-grained application, because gating reduces

    noisy credit assignment from unreliably-localized errors.

    '
  h0_statement: 'There is no significant difference in sample efficiency or final accuracy

    between error-type-gated and unconditional fine-grained feedback application.

    '
sub_hypotheses:
  h-e1:
    type: EXISTENCE
    title: Error-Type Gating Improves Sample Efficiency
    statement: 'Under controlled RL fine-tuning on APPS, if fine-grained feedback is

      applied only to U_line errors, then training reaches 30% pass@1 >10%

      faster than unconditional application.

      '
