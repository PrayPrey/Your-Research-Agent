    - check: "Efficiency claim should be qualified as 'PoC scale'"
      reason: "CodeT5-small, 500 steps only"
      pass_if: "Paper mentions PoC/proof-of-concept qualification"

  underclaiming:
    - check: "H-M2 accuracy gap (100% vs 20%) should be highlighted"
      reason: "Strongest evidence, p<1e-73"
      pass_if: "Emphasized in methodology/results"

