# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_insight"
  opening_line: "Not all execution feedback is created equal: fine-grained rewards that pinpoint the exact error location can backfire when that localization is unreliable."

  why_effective:
    - "Challenges conventional wisdom that more granular = better"
    - "Accessible to practitioners who've debugged misleading tracebacks"
    - "Sets up the technical contribution naturally"

  hook_to_insight_bridge: |
    Current RL methods for code LLMs apply fine-grained feedback uniformly,
    but Python tracebacks vary dramatically in accuracy by exception type.
    SyntaxError points to the exact buggy token; RuntimeError often points
    to a symptom line far from the root cause.

# ============================================================================
# PROBLEM FRAMING (3 LEVELS)
# ============================================================================

problem_framing:
  surface_level:
    statement: "RL fine-tuning of code LLMs uses execution feedback, but training efficiency varies"
    audience_familiar: true

  deeper_level:
    statement: "Fine-grained feedback improves over binary rewards by localizing credit, but applies uniformly regardless of localization reliability"
    evidence: "RLTF shows multi-granularity works; VeRPO shows aggregation matters"

  gap_level:
    statement: "No prior work conditions feedback granularity on error-type-specific localization reliability"
    why_matters: "Unreliable localization = gradient noise at wrong tokens = slower convergence"
    evidence: "U_line errors: 100% traceback accuracy; U_ignore errors: 20% accuracy (H-M2)"

# ============================================================================
# KEY INSIGHT (EXPERIMENT-VERIFIED)
# ============================================================================

key_insight:
  one_sentence: "Error type determines traceback reliability, which determines whether fine-grained feedback helps or hurts"

  expanded: |
    U_line errors (SyntaxError, NameError, TypeError, etc.) have 100% traceback accuracy—
    the reported line is the actual bug location. U_ignore errors (RuntimeError, RecursionError,
    MemoryError, etc.) have only 20% accuracy—tracebacks point to symptoms, not causes.
    Applying token-level penalties at misleading locations injects gradient noise.
    Gating fine-grained feedback to U_line-only improves signal-to-noise by 4.61%.

  verification_evidence:
    h_m2: "100% vs 20% localization accuracy, chi-square p=9.57e-74"
    h_m3: "U_line concentration 1.594 vs U_ignore 1.398, p=4.98e-14"
    h_m4: "SNR improvement +4.61%, direction confirmed"
    h_e1: "fine_gated reaches 30% pass@1; baseline does not"

# ============================================================================
# NARRATIVE ARC
# ============================================================================

narrative_arc:
  intro_hook: "Fine-grained feedback can backfire"
  intro_problem: "Localization reliability varies by error type"
  intro_solution_preview: "Gate by error type to preserve benefit, avoid noise"

  method_insight_connection: "RLTF categorizes errors as U_line/U_ignore; we leverage this for gating"
  method_why_this_design: "Binary gating is simplest; matches categorical reliability difference"

  results_story: "Mechanism confirmed at each causal step → efficiency gain demonstrated"
  results_key_evidence:
    - "Localization accuracy gap: 100% vs 20% (motivates gating)"
    - "Gradient concentration difference: 1.594 vs 1.398 (confirms noise injection)"
    - "SNR improvement: +4.61% (validates gating reduces noise)"
    - "Efficiency gain: fine_gated reaches threshold, baseline does not"

  discussion_interpretation: "Credit assignment reliability framing extends beyond this specific method"

  conclusion_callback: "Return to hook: gating converts 'backfiring' fine-grained feedback to beneficial"

# ============================================================================
