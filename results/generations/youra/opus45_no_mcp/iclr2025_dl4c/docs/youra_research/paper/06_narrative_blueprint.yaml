      - "Insight: error type determines traceback accuracy (100% vs 20%)"
      - "Method: gate fine-grained to U_line errors only"
      - "Results: 4.61% SNR improvement, efficiency gain in PoC"
      - "Limitation: PoC scale, requires full validation"

  introduction:
    word_target: 900
    narrative_role: "Hook → Problem → Insight → Preview"
    must_include:
