      - "H-M2: 100% vs 20% accuracy (localization varies)"
      - "H-M3: 1.594 vs 1.398 concentration (noise injection)"
      - "H-M4: +4.61% SNR (gating helps)"
      - "H-E1: efficiency gain (end-to-end validation)"
    figures: ["concentration_boxplot.png (fig_12)", "snr_comparison.png (fig_16)", "gate_metrics_comparison.png (fig_1)"]

  discussion:
