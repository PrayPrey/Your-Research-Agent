# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Multi-granularity feedback (coarse+fine+adaptive) outperforms single-signal approaches"
      status: "BUILD_ON"
      evidence: "RLTF Table 3 ablation; combined beats coarse-only and fine-only"
    - claim: "Dense rewards can backfire due to aggregation bias"
      status: "BUILD_ON"
      evidence: "VeRPO cardinality bias analysis (Equation 6)"
    - claim: "Error-type-gated fine-grained feedback improves efficiency"
      status: "PROVE_NEW"
      evidence: "No paper tests conditional application by error type"
    - claim: "Error distribution shifts during training toward reliably-localizable types"
      status: "PROVE_NEW"
      evidence: "Hypothesis based on training dynamics; needs empirical validation"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims (multi-granularity advantage, aggregation bias) are established.
    Focus verification on PROVE_NEW claims: error-type gating and distribution shift.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ErrorGatedFeedback-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under controlled RL fine-tuning of code LLMs (same model, dataset, compute budget),
    if fine-grained execution feedback is applied only to errors with reliable source localization
    (U_line category errors where traceback provides accurate line numbers),
    then training sample efficiency improves compared to unconditional fine-grained application,
    because gating reduces noisy credit assignment from unreliably-localized errors.
  alternative_hypothesis_h0: |
    There is no significant difference in sample efficiency or final accuracy between
    error-type-gated and unconditional fine-grained feedback application.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "feedback_gating_strategy"
      type: "categorical"
      operationalization: "Which errors receive fine-grained (line-level) reward penalties"
      levels:
        - "coarse_only"
        - "fine_always"
        - "fine_gated"
        - "fine_gated_compensate"
  dependent:
    - name: "sample_efficiency"
      type: "continuous"
      operationalization: "Training steps to reach 30% pass@1 on APPS test split"
      primary: true
    - name: "final_accuracy"
      type: "continuous"
      operationalization: "pass@1 and pass@10 at training convergence"
      primary: false
    - name: "gradient_concentration"
      type: "continuous"
      operationalization: "Ratio of gradient norm at error-line tokens to non-error tokens"
      primary: false
  controlled:
    - name: "base_model"
      operationalization: "CodeT5-large, identical initialization across conditions"
    - name: "dataset"
      operationalization: "APPS train split (5000 problems)"
    - name: "compute_budget"
      operationalization: "Fixed number of gradient updates per condition"
    - name: "coarse_reward"
      operationalization: "Applied identically across all conditions (RLTF Eq. 3)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Fine-grained feedback applies reward penalties to tokens at error line locations"
      evidence: "RLTF Equations 4-5, error localization via traceback parsing"
      falsifier: "Error localization systematically fails (>50% wrong line attribution)"
    - step: 2
      description: "Error localization reliability varies by error type (U_line vs U_ignore)"
      evidence: "RLTF categorizes errors; U_ignore includes IndentationError where line unreliable"
      falsifier: "U_ignore errors have comparable localization accuracy to U_line"
    - step: 3
      description: "Unreliable localization causes misassigned credit (gradients at wrong tokens)"
      evidence: "Theoretical: wrong penalty location = wrong gradient signal"
      falsifier: "Gradient concentration shows no difference between U_line and U_ignore errors"
    - step: 4
      description: "Gating removes noisy credit assignments, improving gradient signal-to-noise"
      evidence: "Information theory: filtering noise improves signal quality"
      falsifier: "Fine-gated shows equal or worse gradient concentration than Fine-always"
  key_tension: "Effect size depends on U_ignore frequency (~10-15% of errors); may be too small to detect"
  evidence_summary: |
    RLTF demonstrates multi-granularity feedback improves over single-signal approaches.
    VeRPO shows aggregation strategy matters (cardinality bias). Neither tests whether
    conditional application by error type improves over unconditional.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "RLTF error categorization (U_line/U_global/U_ignore) accurately reflects localization reliability"
    supporting_evidence: "RLTF paper Appendix B describes categorization; based on Python exception types"
    consequence_if_violated: "Gating based on U_line would not actually separate reliable from unreliable localization"
  - id: "A2"
    assumption: "Error type distribution shifts during training (more U_line errors later)"
    supporting_evidence: "Training dynamics: early syntax errors, later logic errors at specific lines"
    consequence_if_violated: "Phase interaction (P3) prediction would fail; overall effect still possible"
  - id: "A3"
    assumption: "Gradient signal-to-noise at error tokens correlates with training efficiency"
    supporting_evidence: "Standard RL theory: noisy gradients slow convergence"
    consequence_if_violated: "P4 (gradient concentration) would not explain P1 (efficiency)"
  - id: "A4"
    assumption: "U_ignore errors occur frequently enough to affect training (~10-15%)"
    supporting_evidence: "Prof. Pax estimate based on APPS error analysis"
    consequence_if_violated: "Effect size too small to detect statistically"
  - id: "A5"
    assumption: "RLTF codebase accurately implements described reward scheme"
    supporting_evidence: "Open-source code matches paper equations; verified in code review"
    consequence_if_violated: "Replication fails due to implementation bugs"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - RL fine-tuning of code LLMs using execution feedback
    - Single-file Python code generation tasks (APPS, MBPP)
    - Error types with traceback information (compile-time and runtime errors)
  does_not_apply_to: |
    - Pre-training or SFT stages (no execution feedback)
    - Multi-file or repository-level code generation (SWE-bench)
    - Languages without traceback-style error reporting
    - Purely logic errors without exceptions (tests fail but no traceback)
  known_limitations: |
    - Tests only on APPS dataset; MBPP may show different patterns
    - Uses CodeT5-large; larger models may have different learning dynamics
    - Gating is binary (apply/don't apply); continuous weighting unexplored

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Fine-gated reaches 30% pass@1 >10% faster than Fine-always on APPS"
    test_method: "Compare training steps to reach 30% pass@1 threshold across conditions"
    success_criterion: "(Steps_fine_always - Steps_fine_gated) / Steps_fine_always > 0.10"
    falsification: "Fine-gated requires equal or more steps than Fine-always (ratio <= 0)"
  - id: "P2"
    primary: false
    statement: "Error type distribution shifts toward U_line during training"
    test_method: "Plot U_ignore fraction at training checkpoints; compare first vs last quartile"
    success_criterion: "U_ignore fraction decreases by >5 percentage points"
    falsification: "U_ignore fraction stable or increases during training"
  - id: "P3"
    primary: false
    statement: "Fine-gated advantage increases in second half of training"
    test_method: "Compare efficiency gap (Fine-always vs Fine-gated) at epoch 2 vs epoch 4"
    success_criterion: "Efficiency gap at epoch 4 > efficiency gap at epoch 2"
    falsification: "Efficiency gap constant or decreasing over training"
  - id: "P4"
    primary: false
    statement: "Fine-gated shows higher gradient concentration at error-line tokens"
    test_method: "Compute gradient_error_line / gradient_other for U_line errors across conditions"
    success_criterion: "Fine-gated ratio > Fine-always ratio (p<0.05)"
    falsification: "Fine-gated ratio <= Fine-always ratio"

