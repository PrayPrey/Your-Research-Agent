hypothesis_draft:
  title: "Error-Type-Gated Fine-Grained Execution Feedback for Code RL"
  hypothesis_id: "H-ErrorGatedFeedback-v1"
  core_claim: |
    Applying fine-grained execution feedback only to errors with reliable source
    localization (U_line category) improves training sample efficiency compared
    to unconditional application, because gating reduces noisy credit assignment
    from unreliably-localized errors.
  mechanism: |
    Fine-grained feedback assigns credit to specific tokens (the error line).
    When error localization is unreliable (U_ignore errors like IndentationError),
    credit is misassigned, adding noise to gradients. Gating by error type
    filters unreliable assignments, improving gradient signal-to-noise ratio.
    This is framed as "reliable credit assignment" in RL terms.
  predictions:
    - P1: "Fine-gated reaches 30% pass@1 >10% faster than Fine-always on APPS"
    - P2: "Error type distribution shifts toward U_line during training"
    - P3: "Fine-gated advantage increases in second half of training"
    - P4: "Fine-gated shows higher gradient concentration at error-line tokens"

variables_summary:
  independent: "Feedback gating strategy (coarse_only, fine_always, fine_gated, fine_gated_compensate)"
  dependent_primary: "Sample efficiency - training steps to reach 30% pass@1"
  controlled: "Base model (CodeT5-large), dataset (APPS), compute budget, coarse reward scheme"

null_hypothesis:
  h0_statement: |
    There is no significant difference in sample efficiency or final accuracy
    between error-type-gated and unconditional fine-grained feedback application.
  statistical_test: "Paired t-test across seeds; compare steps-to-threshold"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Error-type-gated application of fine-grained feedback based on localization reliability"
  differentiation_summary: |
    RLTF applies all feedback types unconditionally. VeRPO addresses cardinality bias in
    aggregation but not localization reliability. RLEF uses textual feedback in prompts.
    No prior work tests conditional application based on error type as a credit assignment
    reliability signal.

