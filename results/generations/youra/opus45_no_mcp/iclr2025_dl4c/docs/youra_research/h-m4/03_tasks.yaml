# H-M4 Implementation Tasks
# Gating Removes Noise, Improves Signal
# Type: MECHANISM | Budget: FULL (max 30 tasks)
# Actual: 6 epics, 23 subtasks

hypothesis_id: h-m4
hypothesis_type: MECHANISM
budget_tier: FULL
max_tasks: 30
actual_tasks: 23
epics: 6

tasks:
  A-1:
    name: "Config setup"
    description: "h-m4 config.py, sys.path wiring to h-m3"
    complexity: 3
    status: pending
    subtasks:
      - id: L-1-1
        name: "H_M4_Config dataclass"
        description: "bootstrap/permutation params"
      - id: L-1-2
        name: "sys.path wiring"
        description: "insert h-m3/code before imports"
      - id: L-1-3
        name: "dirs bootstrap"
        description: "os.makedirs(output_dir/figures_dir)"

  A-2:
    name: "SNR analysis core"
    description: "compute_policy_snr, compare_policies"
    complexity: 8
    status: pending
    subtasks:
      - id: L-2-1
        name: "SNRResult dataclass"
        description: "signal/noise aggregates"
      - id: L-2-2
        name: "extract_signal_noise"
        description: "parse H-M3 result dict"
      - id: L-2-3
        name: "compute_policy_snr"
        description: "aggregate signals/noises to SNR"
      - id: L-2-4
        name: "compare_policies"
        description: "compute both policies"

  A-3:
    name: "Statistical tests"
    description: "bootstrap_snr_ci, permutation_test"
    complexity: 7
    status: pending
    subtasks:
      - id: L-3-1
        name: "bootstrap_snr_ci"
        description: "resample signals/noises, compute SNR"
      - id: L-3-2
        name: "permutation_test"
        description: "shuffle combined, compare diff"
      - id: L-3-3
        name: "compute_improvement"
        description: "percentage calculation"
      - id: L-3-4
        name: "summary dict"
        description: "aggregate all stats into results"

  A-4:
    name: "Visualization suite"
    description: "4 required figures"
    complexity: 8
    status: pending
    subtasks:
      - id: L-4-1
        name: "plot_snr_comparison"
        description: "bar chart with CI error bars"
      - id: L-4-2
        name: "plot_snr_bootstrap_distribution"
        description: "boxplot of bootstrap samples"
      - id: L-4-3
        name: "plot_signal_noise_scatter"
        description: "scatter by error type"
      - id: L-4-4
        name: "plot_error_type_contribution"
        description: "stacked contribution"

  A-5:
    name: "End-to-end pipeline"
    description: "run_experiment.py orchestration"
    complexity: 5
    status: pending
    subtasks:
      - id: L-5-1
        name: "model/tokenizer load"
        description: "AutoModel/AutoTokenizer"
      - id: L-5-2
        name: "sample collection"
        description: "call H-M3 collect_stratified_samples"
      - id: L-5-3
        name: "analysis + stats + figures"
        description: "wire A-2, A-3, A-4"
      - id: L-5-4
        name: "dump metrics.json"
        description: "results output"

  A-6:
    name: "Validation run"
    description: "execute pipeline, verify PoC criteria"
    complexity: 4
    status: pending
    subtasks:
      - id: L-6-1
        name: "execute run_experiment.main()"
        description: "full pipeline"
      - id: L-6-2
        name: "verify PoC criteria"
        description: "SNR_gated > SNR_always, p < 0.05"
      - id: L-6-3
        name: "verify figures exist"
        description: "4 files in figures_dir"
      - id: L-6-4
        name: "verify metrics.json schema"
        description: "required keys present"

success_criteria:
  poc:
    - "Code runs without error"
    - "SNR_fine_gated > SNR_fine_always"
    - "p < 0.05 (permutation test)"
  full:
    - "All PoC criteria met"
    - "95% CI non-overlapping"
    - "All 4 required figures generated"
    - "Improvement > 5%"

dependencies:
  h-m3:
    modules:
      - "sample_builder.py: NoiseSample, collect_stratified_samples"
      - "noise_analysis.py: measure_sample_noise, run_noise_analysis"
      - "config.py: H_M3_Config, SEED, MODEL_NAME"
  h-m1:
    modules:
      - "gradient_analysis.py: extract_token_gradients (via H-M3)"
