# Phase 3 Tasks: H-M1 (Gradient Concentration Analysis)
# Type: MECHANISM | Tier: FULL | Max: 30 tasks | Actual: 8 epics, 24 subtasks

metadata:
  hypothesis_id: h-m1
  hypothesis_type: MECHANISM
  tier: FULL
  max_tasks: 30
  actual_epics: 8
  actual_subtasks: 24
  generated_at: '2026-08-19'
  source_documents:
    prd: 03_prd.md
    architecture: 03_architecture.md
    logic: 03_logic.md
    config: 03_config.md

epics:
  - id: A-1
    name: Token-Line Mapping
    description: Map CodeT5 tokens to source code line numbers for gradient attribution
    complexity: 8
    complexity_breakdown: "2+2+3+1"
    dependencies: []
    files:
      - h-m1/code/gradient_analysis.py
    subtasks:
      - id: L-1-1
        name: line_splitter
        description: Split code preserving line boundaries
      - id: L-1-2
        name: per_line_tokenize
        description: Tokenize each line, track offsets
      - id: L-1-3
        name: aggregate_mapping
        description: Combine into single token list with line info

  - id: A-2
    name: Gradient Extraction
    description: Extract per-token gradients via PyTorch autograd
    complexity: 12
    complexity_breakdown: "3+3+4+2"
    dependencies: [A-1]
    files:
      - h-m1/code/gradient_analysis.py
    subtasks:
      - id: L-2-1
        name: gradient_setup
        description: Zero grads, enable grad tracking
      - id: L-2-2
        name: policy_loss
        description: Weighted policy gradient loss computation
      - id: L-2-3
        name: gradient_extraction
        description: Extract embedding gradients per token
      - id: L-2-4
        name: line_aggregation
        description: Sum gradients per source line

  - id: A-3
    name: Concentration Metrics
    description: Calculate concentration_ratio and within_2_lines_pct metrics
    complexity: 8
    complexity_breakdown: "2+2+3+1"
    dependencies: [A-2]
    files:
      - h-m1/code/gradient_analysis.py
    subtasks:
      - id: L-3-1
        name: concentration_ratio
        description: Compute error_line / other_lines gradient ratio
      - id: L-3-2
        name: within_lines_pct
        description: Compute fraction of gradient within ±2 lines
      - id: L-3-3
        name: success_check
        description: Combined criterion evaluation (ratio > 1.0 AND within > 0.80)

  - id: A-4
    name: Sample Collection
    description: Generate 500 failing samples with parseable tracebacks
    complexity: 10
    complexity_breakdown: "3+2+3+2"
    dependencies: []
    files:
      - h-m1/code/sample_collector.py
    reuses:
      - h-e1/code/model.py
      - h-e1/code/data.py
      - h-e1/code/reward.py
    subtasks:
      - id: L-4-1
        name: sample_generation
        description: Model generation loop over APPS problems
      - id: L-4-2
        name: execution_filtering
        description: Filter for failing samples with traceback
      - id: L-4-3
        name: traceback_validation
        description: Ensure parseable error line number
      - id: L-4-4
        name: error_type_stratification
        description: Categorize and filter by U_line/U_ignore

  - id: A-5
    name: Error Type Stratification
    description: Run separate analysis for U_line, U_ignore, and random baseline
    complexity: 6
    complexity_breakdown: "2+2+1+1"
    dependencies: [A-3, A-4]
    files:
      - h-m1/code/gradient_analysis.py
    subtasks:
      - id: L-5-1
        name: sample_loop
        description: Iterate analyze_single_sample over all samples
      - id: L-5-2
        name: stats_aggregation
        description: Compute mean, std, CI, t-test
      - id: L-5-3
        name: stratified_grouping
        description: Group by error type and re-analyze each group

  - id: A-6
    name: Statistical Tests
    description: One-sample t-test and confidence intervals for verdict
    complexity: 5
    complexity_breakdown: "2+1+1+1"
    dependencies: [A-5]
    files:
      - h-m1/code/gradient_analysis.py
    subtasks:
      - id: L-6-1
        name: t_test
        description: One-sample t-test H0: mean(ratio) <= 1.0
      - id: L-6-2
        name: confidence_intervals
        description: 95% CI for concentration_ratio and within_2_pct

  - id: A-7
    name: Visualization
    description: Generate 4 required figures
    complexity: 7
    complexity_breakdown: "2+2+2+1"
    dependencies: [A-5]
    files:
      - h-m1/code/visualization.py
    outputs:
      - h-m1/figures/gradient_comparison.png
      - h-m1/figures/concentration_histogram.png
      - h-m1/figures/line_gradient_heatmap.png
      - h-m1/figures/error_type_comparison.png
    subtasks:
      - id: L-7-1
        name: core_figures
        description: gradient_comparison (required) + histogram
      - id: L-7-2
        name: analysis_figures
        description: heatmap + error_type comparison

  - id: A-8
    name: Main Runner
    description: Orchestration script with verdict logic
    complexity: 6
    complexity_breakdown: "2+1+2+1"
    dependencies: [A-4, A-5, A-6, A-7]
    files:
      - h-m1/code/run_analysis.py
    outputs:
      - h-m1/results/analysis_results.json
      - h-m1/results/verdict.txt
    subtasks:
      - id: L-8-1
        name: orchestration
        description: Load models, call analysis functions
      - id: L-8-2
        name: verdict_output
        description: Write results JSON, return PASS/FAIL verdict

summary:
  total_epics: 8
  total_subtasks: 24
  complexity_distribution:
    very_high: 0  # 18-20
    high: 0       # 14-17
    medium: 4     # 9-13 (A-2, A-4)
    low: 4        # 4-8 (A-1, A-3, A-5, A-6, A-7, A-8)
  total_complexity: 62
  within_budget: true  # 8 epics, 24 subtasks < 30 max

  reused_from_h_e1:
    - h-e1/code/reward.py
    - h-e1/code/data.py
    - h-e1/code/model.py
    - h-e1/code/config.py

success_criteria:
  primary:
    metric: mean_concentration_ratio
    operator: ">"
    threshold: 1.0
    target_pct: 0.80  # >80% of samples
  secondary:
    metric: mean_within_2_lines_pct
    operator: ">"
    threshold: 0.80
    target_pct: 0.80  # >80% of samples
  statistical:
    test: one_sample_t_test
    null_hypothesis: "mean(ratio) <= 1.0"
    alpha: 0.05
