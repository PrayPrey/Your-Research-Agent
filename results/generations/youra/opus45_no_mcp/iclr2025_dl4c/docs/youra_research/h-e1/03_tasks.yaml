# Implementation Tasks: h-e1
# Generated: 2026-08-19
# Hypothesis: Error-Type Gating Improves Sample Efficiency
# Type: EXISTENCE (PoC) | Tier: LIGHT | Max Tasks: 15

metadata:
  hypothesis_id: h-e1
  hypothesis_type: EXISTENCE
  tier: LIGHT
  total_tasks: 8
  epic_range: [4, 8]
  complexity_total: 62

tasks:
  - id: A-1
    name: Data Pipeline
    description: Load APPS dataset (5K train, 5K test), tokenize with CodeT5 tokenizer
    complexity: 6
    dependencies: []
    files:
      - h-e1/code/data.py
    subtasks:
      - Load APPS from HuggingFace (codeparrot/apps)
      - Implement tokenization with max lengths (512 input, 256 output)
      - Create DataLoader with batch_size=8
      - Add preprocessing for problem prompts

  - id: A-2
    name: Sandbox Execution
    description: Safe code execution with test case runner and timeout
    complexity: 9
    dependencies: []
    files:
      - h-e1/code/reward.py
    subtasks:
      - Implement Docker/subprocess sandbox
      - Add 30-second timeout per test case
      - Capture stdout/stderr and tracebacks
      - Handle memory limits (512MB)

  - id: A-3
    name: Error Classification
    description: Classify traceback errors as U_line or U_ignore
    complexity: 5
    dependencies: [A-2]
    files:
      - h-e1/code/reward.py
    subtasks:
      - Define U_LINE_ERRORS set
      - Define U_IGNORE_ERRORS set
      - Implement classify_error() function
      - Implement parse_traceback_line() function

  - id: A-4
    name: Gated Reward Calculator
    description: Compute per-token rewards with error-type gating
    complexity: 8
    dependencies: [A-3]
    files:
      - h-e1/code/reward.py
    subtasks:
      - Implement compute_gated_reward() for fine_always mode
      - Implement compute_gated_reward() for fine_gated mode
      - Add gating activation logging
      - Verify reward tensor shapes

  - id: A-5
    name: Model + PPO Core
    description: CodeT5-large with policy/value heads and PPO step
    complexity: 12
    dependencies: []
    files:
      - h-e1/code/model.py
    subtasks:
      - Load CodeT5-large from HuggingFace
      - Add ValueHead module
      - Implement forward pass for logits
      - Implement ppo_step with clipped objective
      - Add entropy bonus calculation

  - id: A-6
    name: Training Loop
    description: Run PPO training for both conditions (fine_always, fine_gated)
    complexity: 10
    dependencies: [A-1, A-4, A-5]
    files:
      - h-e1/code/train.py
    subtasks:
      - Implement run_condition() function
      - Add checkpoint saving at 1K step intervals
      - Log training metrics (loss, reward, pass@1)
      - Run sequential: fine_always then fine_gated

  - id: A-7
    name: Evaluation + Threshold Tracking
    description: Compute pass@1 and track steps to 30% threshold
    complexity: 7
    dependencies: [A-2, A-5]
    files:
      - h-e1/code/evaluate.py
    subtasks:
      - Implement compute_pass_at_1() on full test set
      - Implement track_steps_to_threshold()
      - Save evaluation results to JSON

  - id: A-8
    name: Visualization
    description: Generate 4 required figures for experiment results
    complexity: 5
    dependencies: [A-6, A-7]
    files:
      - h-e1/code/visualize.py
    subtasks:
      - Gate metrics comparison bar chart (required)
      - Training curves (pass@1 vs steps)
      - Error distribution pie chart
      - Efficiency ratio horizontal bar

execution_order:
  phase_1_parallel: [A-1, A-2, A-5]
  phase_2_sequential: [A-3, A-4]
  phase_3_sequential: [A-6, A-7]
  phase_4_final: [A-8]

validation:
  task_count: 8
  within_epic_range: true
  within_max_tasks: true
  dependencies_valid: true
