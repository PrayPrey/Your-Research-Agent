hypothesis_draft:
  title: "Orthogonality of Static Analysis and Execution Feedback in LLM Code Generation"
  hypothesis_id: "H-StaticExecOrthogonality-v1"
  core_claim: |
    Combined static analysis and execution feedback improves LLM code generation
    more than either feedback type alone because they capture orthogonal error
    classes: static analysis catches structural errors (types, syntax, undefined
    references) while execution catches behavioral errors (wrong logic, edge cases).
  mechanism: |
    1. LLM generates code with potential errors
    2. Static analysis (pylint/mypy) detects structural issues visible in code text
    3. Execution feedback (tests) detects behavioral issues only visible at runtime
    4. Combined feedback provides orthogonal signals, enabling fixes for both error classes
    5. Result: Δ_combined > max(Δ_static, Δ_exec)
  predictions:
    - P1: "Combined pass@1 exceeds max of individual conditions (p < 0.05)"
    - P2: "Static-only reduces more pylint errors than exec-only"
    - P3: "Exec-only reduces more test failures than static-only"

variables_summary:
  independent: "Feedback type (4 levels: none, static-only, exec-only, combined)"
  dependent_primary: "pass@1 on HumanEval+/MBPP+"
  controlled: "Base LLM, temperature (0.0), max iterations (5), prompt template"

null_hypothesis:
  h0_statement: |
    There is no significant difference between combined feedback improvement and
    the maximum of individual feedback improvements. Formally:
    Δ_combined = max(Δ_static, Δ_exec)
    This would indicate feedback sources are redundant with one subsuming the other.
  statistical_test: "One-tailed t-test or bootstrap confidence interval"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic 2×2 factorial decomposition of feedback types with quantitative orthogonality test"
  differentiation_summary: |
    Prior work either uses single feedback type (Self-Refine, Static Analysis Feedback Loop)
    or combines without isolating contributions (Helping LLMs Improve Code Generation).
    Our 2×2 factorial design on HumanEval+/MBPP+ with additive improvement model is novel.

