  r2:
    source: A2
    description: LLM cannot incorporate feedback effectively
    severity: High
    affected:
    - h-m3
    - h-m4
    mitigation: Use established Self-Refine prompts; PIVOT to CoT if needed
  r3:
    source: A3
    description: Benchmarks lack error diversity
    severity: Medium
    affected:
    - all
    mitigation: Use both HumanEval+ and MBPP+ (563 problems total)
  r4:
    source: A4
    description: Combined feedback causes LLM confusion
    severity: High
    affected:
    - h-m3
    - h-m4
    mitigation: Clear prompt structure; PIVOT to sequential if combined < max
  r5:
    source: A5
    description: Results don't generalize to other models
    severity: Medium
    affected:
    - all
    mitigation: Document as limitation; suggest future multi-model study
