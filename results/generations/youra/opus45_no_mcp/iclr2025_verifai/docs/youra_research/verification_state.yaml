main_hypothesis:
  id: H-StaticExecOrthogonality-v1
  title: Static-Execution Feedback Orthogonality
  statement: 'Under iterative code refinement using Self-Refine on HumanEval+/MBPP+,

    combined static+execution feedback achieves pass@k improvement exceeding

    the maximum of individual improvements (Δ_combined > max(Δ_static, Δ_exec)).

    '
  h0: 'No significant difference between combined and max of individuals

    (Δ_combined = max(Δ_static, Δ_exec)), indicating redundancy.

    '
  confidence: 0.75
  status: IN_VERIFICATION
