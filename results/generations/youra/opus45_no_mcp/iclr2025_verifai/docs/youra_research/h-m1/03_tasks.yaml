# H-M1 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: Static Analysis Detects Structural Errors
# Type: MECHANISM | Tier: FULL | Budget: 30 tasks max

hypothesis_id: h-m1
hypothesis_type: MECHANISM
tier: FULL
total_task_budget: 30
actual_task_count: 10

complexity_assessment:
  overall_tier: 1
  rationale: "Analysis experiment extending validated H-E1 infrastructure. No ML training, no new model architectures. Primary work is error categorization logic."
  distribution:
    very_high: 0
    high: 0
    medium: 2
    low: 6
    trivial: 2

tasks:
  - id: A-1
    name: Copy base infrastructure
    description: "Copy static_analysis.py, exec_analysis.py, generate.py from h-e1/code/ unchanged"
    complexity: 3
    breakdown: "1+1+1+0 (minimal logic, file copy)"
    subtasks:
      - L-1-1: "Copy 3 H-E1 modules unchanged"
    dependencies: []
    status: not_started

  - id: A-2
    name: Config setup
    description: "Create config.py with ExperimentConfig dataclass, structural_gate=0.60"
    complexity: 3
    breakdown: "1+1+1+0 (simple dataclass)"
    subtasks:
      - L-2-1: "config.py with structural_gate=0.60"
    dependencies: []
    status: not_started

  - id: A-3
    name: STRUCTURAL_ERROR_CODES dict
    description: "Define pylint+mypy code-to-category mapping in structural_errors.py"
    complexity: 4
    breakdown: "2+0+2+0 (constant definition)"
    subtasks:
      - L-3-1: "STRUCTURAL_ERROR_CODES dict per FR-03"
    dependencies: []
    status: not_started

  - id: A-4
    name: categorize_static_errors
    description: "Parse pylint:/mypy: prefixed error strings into structural/other categories"
    complexity: 8
    breakdown: "3+2+3+0 (string parsing + categorization)"
    subtasks:
      - L-4-1: "categorize_static_errors + has_structural_error functions"
    dependencies:
      - A-3
    status: not_started

  - id: A-5
    name: coverage.py
    description: "compute_structural_coverage, error_category_distribution, per_benchmark_breakdown"
    complexity: 9
    breakdown: "3+3+2+1 (filter-reduce aggregation)"
    subtasks:
      - L-5-1: "compute_structural_coverage (filter test-failing, ratio calc)"
      - L-5-2: "error_category_distribution (count per category)"
      - L-5-3: "per_benchmark_breakdown (split by humaneval/mbpp)"
      - L-5-4: "Edge case: empty failing set returns 0.0"
    dependencies:
      - A-4
    status: not_started

  - id: A-6
    name: evaluate.py gate
    description: "Gate check against 0.60 threshold, returns {passed, metric, threshold, message}"
    complexity: 3
    breakdown: "1+1+1+0 (threshold comparison)"
    subtasks:
      - L-6-1: "evaluate_gate function per FR-05"
    dependencies: []
    status: not_started

  - id: A-7
    name: run_analysis.py pipeline
    description: "ProcessPoolExecutor over 563 problems, integrate all modules, save results"
    complexity: 12
    breakdown: "4+4+2+2 (parallelized pipeline orchestration)"
    subtasks:
      - L-7-1: "process_one per-problem worker"
      - L-7-2: "main orchestration (load, pool, aggregate)"
      - L-7-3: "Integrate coverage/evaluate modules"
      - L-7-4: "Save results.json + error handling"
    dependencies:
      - A-1
      - A-2
      - A-5
      - A-6
    status: not_started

  - id: A-8
    name: visualize.py
    description: "3 figures: gate bar chart, category pie, per-benchmark bar"
    complexity: 7
    breakdown: "3+2+1+1 (matplotlib standard patterns)"
    subtasks:
      - L-8-1: "gate_metrics.png + category_breakdown.png"
      - L-8-2: "per_benchmark.png"
    dependencies: []
    status: not_started

  - id: A-9
    name: Mechanism verification
    description: "verify_mechanism() assertions: structural errors detected, categories valid"
    complexity: 5
    breakdown: "2+1+2+0 (assertion checks)"
    subtasks:
      - L-9-1: "verify_mechanism assertion checks"
      - L-9-2: "Spot-check first 10 problems' category labels"
    dependencies:
      - A-4
    status: not_started

  - id: A-10
    name: End-to-end run + results
    description: "Execute full pipeline, validate outputs (results.json, 3 figures, gate result)"
    complexity: 6
    breakdown: "2+2+1+1 (integration test)"
    subtasks:
      - L-10-1: "Execute pipeline over 563 problems"
      - L-10-2: "Validate outputs (results.json schema, gate outcome, 3 figures)"
    dependencies:
      - A-7
      - A-8
      - A-9
    status: not_started

execution_order:
  phase_1_parallel:
    - A-1
    - A-2
    - A-3
    - A-6
    - A-8
  phase_2_sequential:
    - A-4
    - A-5
  phase_3_integration:
    - A-7
    - A-9
  phase_4_validation:
    - A-10

gate_condition:
  metric: structural_coverage
  threshold: 0.60
  comparison: ">"
  pass_action: "Mark H-M1 as COMPLETED, proceed to H-M2"
  fail_action: "EXPLORE alternative static analysis tools (ruff, pyright)"

output_files:
  - h-m1/code/config.py
  - h-m1/code/structural_errors.py
  - h-m1/code/coverage.py
  - h-m1/code/evaluate.py
  - h-m1/code/run_analysis.py
  - h-m1/code/visualize.py
  - h-m1/code/static_analysis.py
  - h-m1/code/exec_analysis.py
  - h-m1/code/generate.py
  - h-m1/code/outputs/results.json
  - h-m1/figures/gate_metrics.png
  - h-m1/figures/category_breakdown.png
  - h-m1/figures/per_benchmark.png
