# Narrative Blueprint for Paper
# Phase 6 Step 02: Narrative Design
# Generated: 2026-08-19

version: "1.0"
hypothesis_id: "H-StaticExecOrthogonality-v1"

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "When an LLM generates code that fails tests, developers reach for two distinct feedback signals: static analysis errors and test failure messages. But do these signals catch the same bugs, or fundamentally different ones?"
    strategy: "Puzzle/Paradox"

  why_reader_should_care:
    main_reason: "Understanding feedback orthogonality determines whether combining signals yields additive or redundant improvement"
    concrete_example: "Prior work combines static+execution feedback but never quantifies whether they detect overlapping or distinct error classes"
    stakes: "If redundant, combining is wasted compute; if orthogonal, missing either leaves bugs unfixed"

# =============================================================================
# PROBLEM FRAMING (3 levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "LLM code generation errors persist despite multiple feedback-driven refinement approaches"
    common_understanding: "Both static analysis and test execution improve code quality"

  deeper_problem:
    description: "No prior work quantifies whether static and execution feedback detect the same or different error classes"
    why_overlooked: "Papers combine both or test one; controlled comparison absent"
    our_perspective: "Error class orthogonality is the key to understanding combined benefit"

  gap_in_existing_work:
    description: "No quantitative measurement of feedback signal overlap"
    why_gap_exists: "Combining was assumed beneficial without decomposing contributions"
    why_gap_matters: "Without orthogonality data, cannot predict combined improvement magnitude"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Static analysis (pylint/mypy) and execution feedback (test failures) detect categorically orthogonal error classes with Jaccard similarity = 0.0"
    expanded_explanation: "We measured error set overlap across 542 code generation problems. Zero intersection exists between static-detected and execution-detected errors. Static analysis catches structural issues (types, syntax, undefined variables); execution catches behavioral issues (wrong output, runtime exceptions). They operate on fundamentally different code properties."

  why_others_missed_it:
    common_assumptions: "Assumed some overlap (e.g., undefined variable causes both static error and runtime crash)"
    our_different_view: "At the category level, detection mechanisms are orthogonal"
    enabling_factor: "First systematic measurement using Jaccard similarity on standardized benchmarks"

  what_makes_it_work:
    intuitive_explanation: "Static tools analyze code text; tests execute code behavior—different inputs, different outputs"
    key_mechanism: "pylint/mypy detect errors visible in syntax/types; test harness detects errors only visible at runtime"

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Static and execution feedback detect orthogonal error classes"
    measurable_criteria: "Jaccard similarity < 0.3 between error sets"
    actual_result: "Jaccard = 0.0 (complete orthogonality)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Jaccard similarity = 0.0 across 542 problems"
      so_what: "Proves feedback types target completely different errors"
      how_it_supports_claim: "Directly measures orthogonality claim"

    - id: "evidence_2"
      what: "Static analysis detects structural errors in 98.6% of test-failing code"
      so_what: "Shows static analysis provides strong standalone signal"
      how_it_supports_claim: "Confirms static analysis catches a distinct, prevalent error class"

    - id: "evidence_3"
      what: "265 problems have static-only errors, 0 have exec-only errors in canonical solutions"
      so_what: "Error distribution skewed but non-overlapping"
      how_it_supports_claim: "Reinforces categorical distinction between error types"

  surprising_findings:
    - finding: "Near-zero behavioral error rate (0.3%) in static-clean canonical code"
      why_surprising: "Expected >40% based on orthogonality assumption"
      our_interpretation: "Canonical solutions are designed to pass; need LLM-generated code for proper test"

    - finding: "Complete orthogonality (Jaccard exactly 0.0)"
      why_surprising: "Some overlap expected at fine granularity"
      our_interpretation: "Detection mechanisms operate on orthogonal code properties (structure vs behavior)"

# =============================================================================
# TAKEAWAY / BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First quantitative evidence that static and execution feedback detect categorically orthogonal error classes in LLM code generation"
    why_significant: "Provides theoretical foundation for combining feedback signals"

  implications:
    for_field: "Justifies research into combined feedback approaches; explains why combining should help"
    for_practice: "Practitioners should use both feedback types, not choose one"

  future_possibilities:
    immediate_extensions: "Test combined improvement magnitude (H-M3/H-M4); test on actual LLM-generated code"
    longer_term_vision: "Optimal feedback signal composition for iterative refinement"

# =============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "Static and execution feedback are orthogonal (Jaccard=0.0); this justifies combined approaches"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "Puzzle: same bugs or different?"
    problem_levels: "surface (errors persist) → deeper (no orthogonality measurement) → gap (can't predict combined benefit)"
    transition_to_related: "To understand this gap, we review existing feedback approaches..."

  related_work:
    narrative_purpose: "Show existing work doesn't quantify orthogonality → justify our study"
    positioning_strategy: "Prior work shows each feedback type works; none measures overlap"
    key_comparison_points:
      - area: "Static Analysis Feedback"
        papers: ["Static Analysis as Feedback Loop (2508.14419)"]
        limitation: "Shows static works; no execution comparison"
      - area: "Execution Feedback"
        papers: ["Self-Refine (2303.17651)", "CodeRL"]
        limitation: "Shows execution works; no static comparison"
      - area: "Combined Approaches"
        papers: ["Helping LLMs Improve Code Generation (2412.14841)"]
        limitation: "Combines both; doesn't decompose contributions"

  methodology:
    narrative_purpose: "Show WHY this design measures orthogonality"
    connection_to_insight: "To measure orthogonality, we need error sets from both sources on same problems"
    key_design_decisions:
      - decision: "Use EvalPlus benchmarks (HumanEval+/MBPP+)"
        rationale: "80x/35x more tests than originals; comprehensive behavioral coverage"
      - decision: "pylint + mypy for static analysis"
        rationale: "Standard Python linters covering type and syntax errors"
      - decision: "Jaccard similarity for orthogonality"
        rationale: "Standard set-overlap metric; 0 = no overlap, 1 = identical"

  experiments:
    narrative_purpose: "Design experiments to test orthogonality claim"
    experimental_questions:
      - "RQ1: Do static and execution feedback detect overlapping error classes?"
      - "RQ2: What is the coverage of static analysis on test-failing code?"
      - "RQ3: What is the behavioral error rate in static-clean code?"
    dataset_rationale: "HumanEval+ (164) + MBPP+ (399) = 563 problems with extended test suites"
    baseline_rationale: "N/A - measurement study, not method comparison"
    metric_rationale: "Jaccard similarity, structural coverage rate, behavioral error rate"

  results:
    narrative_purpose: "Present evidence supporting orthogonality claim"
    main_result_highlight: "Jaccard = 0.0 (complete orthogonality)"
    evidence_order:
      - "H-E1: Jaccard similarity measurement"
      - "H-M1: Structural coverage analysis"
      - "H-M2: Behavioral rate measurement + limitation"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    key_findings_interpretation:
      - "Orthogonality proven stronger than expected (complete separation)"
      - "Static analysis dominates in this dataset (structural errors more common)"
    honest_limitations:
      - limitation: "Used canonical solutions, not LLM-generated code"
        why_acceptable: "Orthogonality still valid; behavioral rate needs LLM code"
      - limitation: "H-M3/H-M4 (combined improvement) not tested"
        why_acceptable: "Foundational orthogonality proven; improvement test is future work"
      - limitation: "Single dataset (HumanEval+/MBPP+)"
        why_acceptable: "Standard benchmarks; generalization is future work"
    broader_impact: "Supports development of combined feedback systems; no negative societal impact identified"

  conclusion:
    narrative_purpose: "Callback to hook, reinforce message, open future"
    callback_to_hook: "Return to puzzle: we now know they catch different bugs (Jaccard=0.0)"
    future_work:
      - "Test combined improvement on LLM-generated code (H-M3/H-M4)"
      - "Multi-model study (GPT-4, CodeLlama, DeepSeek)"
      - "Cross-language validation"
    memorable_ending: "Understanding feedback orthogonality is the first step toward optimal signal composition for iterative code refinement"

