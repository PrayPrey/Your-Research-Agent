# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Static analysis and execution feedback capture different error classes"
    supporting_evidence: "pylint/mypy detect type/syntax issues; tests detect runtime/logic issues"
    consequence_if_violated: "Combined feedback would show redundant improvement (max, not additive)"
  - id: "A2"
    assumption: "LLMs can effectively incorporate feedback from either source"
    supporting_evidence: "Self-Refine demonstrates feedback-driven refinement works"
    consequence_if_violated: "No improvement in any condition, invalidating the study"
  - id: "A3"
    assumption: "HumanEval+/MBPP+ contain both structural and behavioral error opportunities"
    supporting_evidence: "These benchmarks test diverse programming problems"
    consequence_if_violated: "Results may not generalize; only one error class present"
  - id: "A4"
    assumption: "Combining feedback does not confuse the LLM (no interference)"
    supporting_evidence: "Prompt design can separate feedback types clearly"
    consequence_if_violated: "Combined < max, indicating negative interaction"
  - id: "A5"
    assumption: "The chosen LLM is representative of modern code generation models"
    supporting_evidence: "GPT-4/CodeLlama-70B are widely used and studied"
    consequence_if_violated: "Results may not generalize to other models"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - LLM code generation with iterative refinement
    - Python code generation tasks
    - HumanEval+ and MBPP+ benchmark problems
    - Self-Refine style generate-feedback-refine loops
  does_not_apply_to: |
    - One-shot code generation without refinement
    - Languages other than Python (future work)
    - Real-time code completion (latency constraints)
    - Extremely long programs (beyond typical benchmark lengths)
  known_limitations: |
    - Results may not generalize beyond tested LLM (GPT-4 or CodeLlama-70B)
    - Feedback prompt formatting may affect results
    - HumanEval+ and MBPP+ patterns may differ

