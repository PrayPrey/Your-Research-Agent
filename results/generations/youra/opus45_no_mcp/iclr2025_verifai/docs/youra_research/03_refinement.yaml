      operationalization: "Proportion of initial errors eliminated by feedback (0-1)"
      primary: false
    - name: "Refinement Efficiency"
      type: "continuous"
      operationalization: "Number of iterations to reach solution (1-5)"
      primary: false
  controlled:
    - name: "Base LLM"
      operationalization: "Fixed model (GPT-4 or CodeLlama-70B) across all conditions"
    - name: "Temperature"
      operationalization: "Set to 0.0 for deterministic generation"
    - name: "Max Iterations"
      operationalization: "Fixed at 5 iterations per problem"
    - name: "Prompt Template"
      operationalization: "Identical prompt structure; only feedback content varies"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM generates initial code with potential structural and behavioral errors"
      evidence: "Established baseline error rates on HumanEval+/MBPP+"
      falsifier: "LLM generates perfect code requiring no refinement"
    - step: 2
      description: "Static analysis (pylint/mypy) detects structural errors (type mismatches, undefined variables, unreachable code)"
      evidence: "pylint/mypy tools produce categorized error reports"
      falsifier: "Static analyzers fail to detect any errors, or detect same errors as execution"
    - step: 3
      description: "Execution feedback (test results) detects behavioral errors (wrong output, runtime exceptions, edge case failures)"
      evidence: "evalplus test harness provides pass/fail with error messages"
      falsifier: "Test failures correlate perfectly with static analysis findings"
    - step: 4
      description: "Combined feedback provides orthogonal information, enabling LLM to fix both error classes"
      evidence: "Combined improvement exceeds max of individual improvements"
      falsifier: "Combined improvement equals or is less than max of individuals"
  key_tension: "Whether static and execution feedback catch different vs overlapping error classes"
  evidence_summary: |
    Prior work shows both feedback types independently improve code generation.
    The mechanism proposes they target different error classes: static catches
    structural issues visible in syntax/types, execution catches behavioral
    issues only visible at runtime. If orthogonal, combining them should yield
    additive benefits.

