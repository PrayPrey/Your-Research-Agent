# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Feedback Type"
      type: "categorical"
      operationalization: "Type of feedback provided during Self-Refine iteration"
      levels:
        - "none (baseline)"
        - "static-only (pylint + mypy)"
        - "exec-only (test results)"
        - "combined (static + execution)"
  dependent:
    - name: "pass@1"
      type: "continuous"
      operationalization: "Proportion of problems solved on first attempt after refinement (0-1)"
      primary: true
    - name: "Error Reduction Rate"
