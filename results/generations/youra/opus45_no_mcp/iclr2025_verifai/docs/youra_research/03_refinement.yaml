# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Static analysis feedback improves LLM code generation quality"
      status: "BUILD_ON"
      evidence: "Static Analysis as Feedback Loop (2508.14419) shows 40%→13% security issues"
    - claim: "Execution feedback improves LLM code generation"
      status: "BUILD_ON"
      evidence: "CodeRL, RLPF, StepCoder all demonstrate execution feedback effectiveness"
    - claim: "Iterative refinement paradigm works for code generation"
      status: "BUILD_ON"
      evidence: "Self-Refine (2303.17651) shows ~20% improvement"
    - claim: "Static and execution feedback are orthogonal (fix different error classes)"
      status: "PROVE_NEW"
      evidence: "No prior controlled comparison exists"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Focus verification on the orthogonality claim (PROVE_NEW).
    Existing claims about static/execution feedback effectiveness can be taken as established.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-StaticExecOrthogonality-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under iterative code refinement using Self-Refine on HumanEval+/MBPP+,
    if we provide combined static+execution feedback versus single-source feedback,
    then the combined condition achieves pass@k improvement that exceeds the maximum
    of individual improvements (Δ_combined > max(Δ_static, Δ_exec)),
    because static analysis captures structural errors (pylint/mypy detectable)
    while execution captures behavioral errors (test failures) - orthogonal signal classes.
  alternative_hypothesis_h0: |
    There is no significant difference between combined feedback improvement and the
    maximum of individual feedback improvements (Δ_combined = max(Δ_static, Δ_exec)),
    indicating feedback sources are redundant with one subsuming the other.

