# H-E1 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: SSI Discriminates Contamination Status (EXISTENCE)
# Budget: LIGHT tier (max 15 tasks)

metadata:
  hypothesis_id: h-e1
  hypothesis_type: EXISTENCE
  tier: LIGHT
  total_max: 15
  epic_count: 5
  subtask_count: 9
  total_tasks: 14

epics:
  - id: E-1
    name: Data Pipeline
    complexity: 10
    category: medium
    description: MMLU load, contamination sampling, paraphrase gen, prompt formatting
    subtasks:
      - id: C-1-1
        name: MMLU loaders
        description: load_mmlu(), sample_contamination_subset() - HF dataset + level-based sampling
      - id: C-1-2
        name: Paraphrase + prompt
        description: generate_paraphrases() (rule-based synonym swap, k=20), format_mmlu_prompt()

  - id: E-2
    name: Model + LoRA fine-tuning
    complexity: 14
    category: high
    description: Load Mistral-7B, LoRA config, contamination injection x3 variants
    subtasks:
      - id: L-E2-1
        name: load_base_model + get_answer_token_ids
        description: Load Mistral-7B BF16, resolve A/B/C/D token ids
      - id: L-E2-2
        name: build_lora_config
        description: LoraConfig(rank=16, alpha=32, target_modules q/v_proj)
      - id: L-E2-3
        name: inject_contamination data prep + training loop
        description: Tokenize, concat general+contamination, LoRA train loop
      - id: L-E2-4
        name: inject_contamination run x3 variants
        description: Call with frac 0.0/0.10/0.50, return 3 PeftModel instances

  - id: E-3
    name: SSI computation
    complexity: 9
    category: medium
    description: Confidence extraction, variance-based SSI batch scoring
    subtasks:
      - id: C-3-1
        name: Confidence extraction
        description: extract_confidence() - softmax over answer-token logits (A/B/C/D)
      - id: C-3-2
        name: SSI batch scoring
        description: compute_ssi(), compute_ssi_batch() - variance across paraphrase confidences

  - id: E-4
    name: Train orchestration
    complexity: 8
    category: low
    description: Wire data/model/ssi, run full experiment, persist scores
    subtasks: []

  - id: E-5
    name: Evaluation + visualization
    complexity: 9
    category: medium
    description: AUC, Cohen's d, 5 required plots, gate check
    subtasks:
      - id: C-5-1
        name: Metrics + plots
        description: evaluate_ssi_discrimination() (AUC, Cohen's d) + 5 required plots

budget_summary:
  epic_tasks: 5
  subtasks: 9
  total: 14
  max_allowed: 15
  within_budget: true

gate_criteria:
  primary:
    metric: AUC
    target: 0.7
    description: Binary classification of clean vs contaminated
  secondary:
    metric: Cohen's d
    target: 0.5
    description: Effect size between SSI distributions
  decision:
    pass: Proceed to H-M1 (mechanism hypotheses)
    fail: ABANDON SSI approach
