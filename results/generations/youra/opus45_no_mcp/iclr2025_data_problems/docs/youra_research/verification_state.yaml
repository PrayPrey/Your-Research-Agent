main_hypothesis:
  id: H-SSI-v1
  title: Semantic Saturation Index for Paraphrase-Resistant Contamination Detection
  statement: 'Under standard foundation model evaluation settings, if a model was trained on benchmark items (verbatim or
    paraphrased), then it will exhibit significantly higher Semantic Saturation Index (SSI = inverse confidence variance across
    paraphrases) on those items compared to clean models, because training exposure creates robust semantic representations
    that generalize uniformly across phrasing variations.

    '
  confidence: 0.8
  source_file: 03_refinement.yaml
