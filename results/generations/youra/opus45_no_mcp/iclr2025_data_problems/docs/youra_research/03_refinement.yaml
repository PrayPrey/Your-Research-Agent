# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-SSI-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under standard foundation model evaluation settings, if a model was trained
    on benchmark items (verbatim or paraphrased), then it will exhibit significantly
    higher Semantic Saturation Index (SSI = inverse confidence variance across
    paraphrases) on those items compared to clean models, because training exposure
    creates robust semantic representations that generalize uniformly across
    phrasing variations.
  alternative_hypothesis_h0: |
    There is no significant difference in SSI between clean and contaminated
    models on the same benchmark items.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "contamination_status"
      type: "categorical"
      operationalization: "Model training condition"
      levels: ["clean", "verbatim_contaminated", "paraphrase_contaminated"]
    - name: "contamination_level"
      type: "continuous"
      operationalization: "Percentage of benchmark items in training data (0-100%)"
  dependent:
    - name: "semantic_saturation_index"
      type: "continuous"
      operationalization: "SSI = 1 / variance(confidence across K paraphrases); higher = more saturated"
      primary: true
    - name: "discrimination_auc"
      type: "continuous"
      operationalization: "AUC for binary classification (clean vs contaminated) using SSI"
      primary: false
    - name: "accuracy_contribution"
      type: "continuous"
      operationalization: "Item-level contribution to benchmark score"
      primary: false
  controlled:
    - name: "model_architecture"
      operationalization: "Mistral-7B base model for all variants"
    - name: "paraphrase_generation_method"
      operationalization: "Multi-method: T5-paraphrase, GPT-4, rule-based synonym"
    - name: "benchmark_difficulty"
      operationalization: "MMLU category stratification"
    - name: "paraphrase_count"
      operationalization: "K=20 paraphrases per benchmark item"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Training includes benchmark items in various phrasings"
      evidence: "Controlled fine-tuning on known percentage of MMLU items"
      falsifier: "If contamination injection fails (model doesn't learn items)"
    - step: 2
      description: "Model develops robust semantic representation for contaminated concepts"
      evidence: "Learning theory: diverse training creates invariant representations"
      falsifier: "If model shows high variance despite diverse training"
    - step: 3
      description: "Representation invariance manifests as uniform confidence across paraphrases"
      evidence: "Neural networks generalize from training distribution"
      falsifier: "If confidence variance independent of training diversity"
    - step: 4
      description: "SSI captures invariance as contamination signal"
      evidence: "SSI = 1/variance; lower variance = higher SSI"
      falsifier: "If SSI doesn't discriminate clean from contaminated (AUC < 0.6)"
  key_tension: "Does the mechanism hold for sophisticated paraphrase-based contamination?"
  evidence_summary: |
    The mechanism is grounded in learning theory: models trained on diverse phrasings
    develop representations invariant to surface form. SSI captures this invariance.
    Validated through controlled contamination experiment.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Paraphrasers generate sufficiently diverse variations"
    supporting_evidence: "Multi-method approach (T5, GPT-4, rule-based) + pilot validation"
    consequence_if_violated: "Paraphrase quality confound: variance measures paraphrase naturalness, not contamination"
  - id: "A2"
    assumption: "Model confidence is meaningful (calibration)"
    supporting_evidence: "Use calibrated probabilities, not raw logits"
    consequence_if_violated: "SSI measures overconfidence, not contamination"
  - id: "A3"
    assumption: "Effect size detectable at practical contamination levels"
    supporting_evidence: "Power analysis to determine minimum detectable level"
    consequence_if_violated: "Method only works for extreme contamination (>50%)"
  - id: "A4"
    assumption: "Mechanism generalizes across model scales"
    supporting_evidence: "Test on 7B; validate on 13B if resources allow"
    consequence_if_violated: "Need scale-specific normalization"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Open-weight foundation models with accessible confidence scores
    - Standard NLP benchmarks (MMLU, GSM8K, HumanEval)
    - Models where logit/probability extraction is possible
  does_not_apply_to: |
    - Closed API models without logprobs access
    - Multimodal benchmarks (images, audio)
    - Models with extreme miscalibration
  known_limitations: |
    - Domain transfer: thresholds may need per-benchmark calibration
    - Partial contamination: intermediate SSI values harder to interpret
    - Computational cost: 6M+ forward passes for full benchmark analysis

