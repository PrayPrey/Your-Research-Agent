hypothesis_draft:
  title: "Semantic Saturation Index for Paraphrase-Resistant Contamination Detection"
  hypothesis_id: "H-SSI-v1"
  core_claim: |
    Under standard FM evaluation settings, if a model was trained on benchmark items
    (verbatim or paraphrased), then it will exhibit significantly higher SSI
    (lower confidence variance across paraphrases) on those items, because training
    exposure creates representations invariant to phrasing.
  mechanism: |
    1. Training includes benchmark items in various phrasings
    2. Model develops robust semantic representation for those concepts
    3. Representation invariance manifests as uniform confidence across paraphrases
    4. SSI = 1/variance captures this invariance as contamination signal
  predictions:
    - P1: "SSI discriminates clean vs. contaminated (AUC > 0.7)"
    - P2: "SSI correlates with contamination level (r > 0.6)"
    - P3: "High-SSI items predict accuracy contribution"

variables_summary:
  independent: "Contamination status (clean/verbatim/paraphrase) and level (0-100%)"
  dependent_primary: "Semantic Saturation Index (SSI = 1/variance of confidence)"
  controlled: "Model architecture (Mistral-7B), paraphrase method (multi-method), K=20"

null_hypothesis:
  h0_statement: |
    There is no significant difference in SSI between clean and contaminated
    models on the same benchmark items.
  statistical_test: "Two-sample t-test for mean SSI; AUC for classification"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Exploits paraphrase uniformity as detection signal (inverts the problem)"
  differentiation_summary: |
    Prior work (n-gram, DCQ) tries to match surface forms or probe item-by-item.
    SSI measures the CONSEQUENCE of paraphrase training: semantic saturation.
    First method that is paraphrase-resistant, scalable, and continuous.

