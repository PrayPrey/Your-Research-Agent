# H-M4 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: SSI Captures Invariance as Contamination Signal
# Tier: FULL (MECHANISM) | Budget: 30 max | Used: 18

metadata:
  hypothesis_id: h-m4
  hypothesis_type: MECHANISM
  tier: FULL
  total_budget: 30
  tasks_used: 18
  epics: 9

epics:
  - id: A-1
    name: Load H-M1 Checkpoints + Paraphrase Bank
    description: Verify 5 checkpoint paths load; confirm 14,042x20 paraphrase availability
    complexity: 4
    subtasks:
      - id: A-1.1
        name: Verify checkpoint paths for 5 contamination levels
        complexity: 1
      - id: A-1.2
        name: Load and validate paraphrase bank (14,042 items)
        complexity: 1
      - id: A-1.3
        name: Confirm K=20 paraphrases per item
        complexity: 1
      - id: A-1.4
        name: Handle missing 5%/20% checkpoints (flag or train)
        complexity: 1

  - id: A-2
    name: Wire SSI Module
    description: Import/adapt h-m1/code/ssi.py unchanged into h-m4/code
    complexity: 2
    subtasks:
      - id: A-2.1
        name: Copy ssi.py from h-m1/code
        complexity: 1
      - id: A-2.2
        name: Verify compute_ssi_batch interface
        complexity: 1

  - id: A-3
    name: Implement LabelBuilder
    description: Per-checkpoint contaminated/clean label array from contamination_ids
    complexity: 3
    subtasks:
      - id: A-3.1
        name: Create labels.py module
        complexity: 1
      - id: A-3.2
        name: Implement build_labels function
        complexity: 1
      - id: A-3.3
        name: Test with known contamination_ids
        complexity: 1

  - id: A-4
    name: Implement AUC Evaluation
    description: roc_auc_score per checkpoint (5 runs)
    complexity: 3
    subtasks:
      - id: A-4.1
        name: Create evaluate.py module
        complexity: 1
      - id: A-4.2
        name: Implement compute_auc function
        complexity: 1
      - id: A-4.3
        name: Test AUC computation
        complexity: 1

  - id: A-5
    name: Implement Pearson + Cohen's d
    description: Mean SSI per level -> pearsonr; d between 0pct/50pct SSI
    complexity: 3
    subtasks:
      - id: A-5.1
        name: Implement compute_pearson_by_level
        complexity: 1
      - id: A-5.2
        name: Reuse cohens_d from h-m3
        complexity: 1
      - id: A-5.3
        name: Test correlation metrics
        complexity: 1

  - id: A-6
    name: Gate Logic + Config
    description: verify_gate PASS/PARTIAL/FAIL, Config dataclass
    complexity: 2
    subtasks:
      - id: A-6.1
        name: Implement verify_gate function
        complexity: 1
      - id: A-6.2
        name: Create Config dataclass
        complexity: 1

  - id: A-7
    name: Build run_experiment Pipeline
    description: Loop 5 checkpoints x 14,042 items x 20 paraphrases, aggregate results
    complexity: 7
    subtasks:
      - id: A-7.1
        name: Implement main experiment loop
        complexity: 3
      - id: A-7.2
        name: Add batched inference logic
        complexity: 2
      - id: A-7.3
        name: Aggregate results across checkpoints
        complexity: 2

  - id: A-8
    name: Visualization Suite
    description: 4 required figures (distribution, ROC, scatter, gate bar)
    complexity: 4
    subtasks:
      - id: A-8.1
        name: Implement plot_ssi_distribution_by_level
        complexity: 2
      - id: A-8.2
        name: Implement plot_roc_curve
        complexity: 1
      - id: A-8.3
        name: Implement plot_correlation_scatter and plot_gate_bar
        complexity: 1

  - id: A-9
    name: Run Full Experiment + Write Results
    description: Execute pipeline end-to-end, validate against gate thresholds
    complexity: 5
    subtasks:
      - id: A-9.1
        name: Execute full experiment run
        complexity: 2
      - id: A-9.2
        name: Write mechanism_results.json
        complexity: 1
      - id: A-9.3
        name: Validate gate thresholds and report
        complexity: 2

dependencies:
  h-m1:
    - ssi.py (SSI computation)
    - data.py (MMLU loading, contamination sampling)
    - checkpoints (5 contamination levels)
  h-m3:
    - correlation.py (cohens_d function)
  h-e1:
    - paraphrase bank (14,042 x 20)

success_criteria:
  primary:
    metric: AUC
    threshold: "> 0.7"
    description: SSI-based contamination classification
  secondary:
    - metric: Pearson r
      threshold: "> 0.6"
      description: Contamination % vs mean SSI correlation
    - metric: Cohen's d
      threshold: "> 0.5"
      description: Effect size between clean and contaminated

gate:
  type: SHOULD_WORK
  pass: Both primary and secondary met
  partial: Primary met, secondary not met
  fail: Primary not met -> EXPLORE alternative metric
