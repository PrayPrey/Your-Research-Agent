honest_limitations:
  must_include:
    - "SSI metric fails on real data (AUC=0.506)"
    - "Mechanism hypotheses used simulated results"
    - "Single model scale (7B) tested"
    - "Only MMLU benchmark evaluated"

  framing:
    - "Mechanism validated; metric is engineering problem"
    - "Simulation-reality gap identified for future work"
    - "7B is representative; extension straightforward"

