version: "1.0"
created_at: "2026-08-19T14:05:00Z"
hypothesis_id: H-SSI-v1
research_type: honest_negative_result

hook:
  strategy: "mechanism_validated_metric_failed"
  opening: >
    Paraphrasing defeats contamination detection. Models trained on rephrased benchmarks
    evade n-gram filters while achieving 85.9% on MMLU. We ask: does contamination leave
    a behavioral signature that survives paraphrasing? The answer reveals a validated
    mechanism but an inadequate metric.

  avoid:
    - "LLM benchmarking is important"
    - "Contamination is a known problem"
    - Generic problem statements

problem_framing:
  level_1_surface: >
    N-gram overlap (13-gram) is industry standard for contamination detection but
    trivially bypassed by paraphrasing (Rethinking Benchmark, 2311.04850).

  level_2_deeper: >
    Quiz-based methods (DCQ) detect memorization but don't scale and provide only
    binary outputs. No existing method offers scalable, continuous-valued,
    paraphrase-resistant contamination detection.

  level_3_gap: >
    The fundamental question: does contamination produce representation-level changes
    detectable via behavioral signatures, regardless of surface form?

key_insight:
  statement: >
    Contamination creates representation invariance (MPS diff 0.065, d=0.52) that
    manifests as confidence uniformity (r=-0.517). The mechanism is validated.
    However, SSI=1/variance amplifies noise rather than signal (AUC=0.506).

  implication: >
    The underlying phenomenon is real and measurable. The metric formulation—not
    the theory—fails. This guides future metric design away from simple inverse
    transforms.

evidence_structure:
  mechanism_chain:
    - step: 1
      claim: "Contamination injection works"
      evidence: "h-m1: 31.1% accuracy gain at 50% contamination"
      status: VERIFIED

    - step: 2
      claim: "Training creates representation invariance"
      evidence: "h-m2: MPS difference 0.065, Cohen's d=0.52"
      status: VERIFIED

    - step: 3
      claim: "Invariance manifests as confidence uniformity"
      evidence: "h-m3: r=-0.517, d=0.58"
      status: VERIFIED

    - step: 4
      claim: "SSI captures invariance as detection signal"
      evidence: "h-m4: AUC=0.506, r=-0.164"
      status: FAILED

  primary_contribution: >
    First empirical demonstration that contamination creates detectable representation
    invariance and confidence uniformity—a validated mechanism chain (Steps 1-3).

  negative_result: >
    SSI = 1/variance fails as a practical detector (AUC=0.506). Within-group variance
    exceeds between-group signal; inverse transform amplifies noise floor.

section_goals:
  introduction:
    narrative_role: "Hook + Problem + Insight + Preview"
    key_points:
      - Paraphrasing defeats existing detection
      - Behavioral signatures may persist
      - We validate mechanism but show metric fails
    callback_to: null

  related_work:
    narrative_role: "Show existing work insufficient, justify our approach"
    key_points:
      - N-gram methods fail on paraphrases
      - Quiz-based methods don't scale
      - Embedding density fails in high-D
      - Our approach: measure behavioral consequence

  methodology:
    narrative_role: "WHY this design solves the problem"
    key_points:
      - Controlled contamination via LoRA fine-tuning
      - Multi-method paraphrase generation (T5, GPT-4, rule-based)
      - SSI formulation and rationale
      - Mechanism decomposition into testable steps

  experiments:
    narrative_role: "Design experiments that test specific claims"
    key_points:
      - MMLU benchmark, Mistral-7B
      - 5 contamination levels (0-50%)
      - K=20 paraphrases per item
      - Sequential hypothesis testing (h-e1 through h-m4)

  results:
    narrative_role: "Present evidence supporting/refuting claims"
    key_points:
      - Mechanism Steps 1-3 PASS
      - Step 4 (SSI metric) FAILS
      - Real-data experiment exposes simulation bias
      - SSI distributions overlap completely

  discussion:
    narrative_role: "Interpret results, acknowledge limits"
    key_points:
      - Mechanism validated, metric inadequate
      - Simulation-reality gap documented
      - Future work: entropy-based metrics
      - Single scale limitation

  conclusion:
    narrative_role: "Callback to hook, open future"
    key_points:
      - Return to paraphrase evasion problem
      - Mechanism chain is novel contribution
      - Metric formulation is fixable engineering problem
    callback_to: "hook.opening"

  abstract:
    narrative_role: "Compress full story"
    key_points:
      - Problem (paraphrase evasion)
      - Approach (SSI, confidence variance)
      - Results (mechanism validated, metric fails)
      - Significance (guides future detection methods)

