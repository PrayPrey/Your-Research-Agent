# H-M2 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: Training Develops Robust Semantic Representations
# Type: MECHANISM (FULL tier - 30 task budget)
# Total Tasks: 29

metadata:
  hypothesis_id: h-m2
  hypothesis_type: MECHANISM
  tier: FULL
  budget: 30
  used: 29
  gate_type: SHOULD_WORK

epics:
  M2-1:
    name: Paraphrase Generation Pipeline
    description: T5-paraphrase + rule-based fallback, K=5 bank, cache to disk
    complexity: 12
    subtasks:
      - id: M2-1-1
        name: Load T5 paraphraser
        description: Load Vamsi995/T5_Paraphrase_Paws model and tokenizer
        complexity: 2
      - id: M2-1-2
        name: Paraphrase generation function
        description: Generate K paraphrases per item using T5
        complexity: 3
      - id: M2-1-3
        name: Rule-based fallback
        description: Synonym substitution fallback for paraphrase diversity
        complexity: 2
      - id: M2-1-4
        name: Paraphrase bank caching
        description: Build and cache paraphrase_bank.json to disk
        complexity: 3

  M2-2:
    name: Augmented Dataset Construction
    description: Reuse H-M1 sampling; build verbatim & augmented training sets
    complexity: 5
    subtasks:
      - id: M2-2-1
        name: Sample contamination IDs
        description: Reuse sample_contamination_ids at 10% level
        complexity: 1
      - id: M2-2-2
        name: Build verbatim training set
        description: Verbatim-only dataset (1404 samples)
        complexity: 2
      - id: M2-2-3
        name: Build augmented training set
        description: Original + 3 paraphrases per item (5616 samples)
        complexity: 2

  M2-3:
    name: Verbatim Baseline Training
    description: Reuse inject_contamination, epoch-matched compute (12 epochs)
    complexity: 8
    subtasks:
      - id: M2-3-1
        name: Load base model
        description: Load Mistral-7B-v0.1 with LoRA config
        complexity: 2
      - id: M2-3-2
        name: Train verbatim model
        description: Fine-tune on verbatim-only data, 12 epochs
        complexity: 4
      - id: M2-3-3
        name: Verbatim model checkpoint
        description: Save trained model for evaluation
        complexity: 2

  M2-4:
    name: Paraphrase-Augmented Training
    description: Reuse inject_contamination on augmented set (3 epochs)
    complexity: 8
    subtasks:
      - id: M2-4-1
        name: Load base model (fresh)
        description: Load fresh Mistral-7B-v0.1 with LoRA config
        complexity: 2
      - id: M2-4-2
        name: Train paraphrase model
        description: Fine-tune on augmented data, 3 epochs
        complexity: 4
      - id: M2-4-3
        name: Paraphrase model checkpoint
        description: Save trained model for evaluation
        complexity: 2

  M2-5:
    name: Representation Extraction
    description: Hidden state extraction + mean pooling, batched, both models
    complexity: 14
    subtasks:
      - id: M2-5-1
        name: Extract representation function
        description: Last-layer hidden state, mean-pooled
        complexity: 3
      - id: M2-5-2
        name: Batch extraction
        description: Batched extraction for efficiency
        complexity: 3
      - id: M2-5-3
        name: Extract verbatim representations
        description: Extract for 1000 items + 5 paraphrases from verbatim model
        complexity: 4
      - id: M2-5-4
        name: Extract paraphrase representations
        description: Extract for 1000 items + 5 paraphrases from paraphrase model
        complexity: 4

  M2-6:
    name: Similarity Computation
    description: Cosine similarity, MPS per item, eval-subset orchestration
    complexity: 5
    subtasks:
      - id: M2-6-1
        name: Cosine similarity function
        description: Compute pairwise cosine similarity
        complexity: 2
      - id: M2-6-2
        name: MPS computation
        description: Mean Paraphrase Similarity per item
        complexity: 2
      - id: M2-6-3
        name: Evaluate invariance
        description: Compute MPS array for all eval items
        complexity: 1

  M2-7:
    name: Statistical Mechanism Verification
    description: t-test, Cohen's d, mechanism_active logging, cross-seed aggregation
    complexity: 8
    subtasks:
      - id: M2-7-1
        name: Statistical test
        description: Independent t-test between MPS distributions
        complexity: 2
      - id: M2-7-2
        name: Effect size computation
        description: Cohen's d effect size
        complexity: 2
      - id: M2-7-3
        name: Mechanism verification
        description: Check thresholds, log [MECHANISM CHECK]
        complexity: 2
      - id: M2-7-4
        name: Cross-seed aggregation
        description: Aggregate results across 3 seeds
        complexity: 2

  M2-8:
    name: Visualization
    description: Distribution histogram, box plot, optional t-SNE
    complexity: 5
    subtasks:
      - id: M2-8-1
        name: MPS distribution plot
        description: Histogram/density of MPS for both conditions
        complexity: 2
      - id: M2-8-2
        name: MPS box plot
        description: Side-by-side comparison by condition
        complexity: 2

  M2-9:
    name: Experiment Orchestration
    description: Wire 3-seed loop, checkpointing, results JSON persistence
    complexity: 8
    subtasks:
      - id: M2-9-1
        name: Config loading
        description: Load and validate experiment configuration
        complexity: 1
      - id: M2-9-2
        name: Multi-seed loop
        description: Orchestrate experiment across 3 seeds
        complexity: 3
      - id: M2-9-3
        name: Results persistence
        description: Save mechanism_results.json
        complexity: 2

success_criteria:
  primary:
    mechanism_active: true
    mps_difference: "> 0.05"
  secondary:
    effect_size: "> 0.3"
    p_value: "< 0.05"
    reproducibility: "3/3 seeds"
  gate:
    type: SHOULD_WORK
    pass: "Proceed to H-M3"
    fail: "EXPLORE alternative mechanisms"

dependencies:
  base_hypothesis: h-m1
  reused_functions:
    - load_mmlu
    - sample_contamination_ids
    - build_training_dataset
    - format_mmlu_prompt
    - load_base_model
    - build_lora_config_m1
    - inject_contamination
    - format_training_example
  new_dependencies:
    - Vamsi995/T5_Paraphrase_Paws
    - scipy.stats
