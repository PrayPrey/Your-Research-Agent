# H-M1 Implementation Tasks
# Generated: 2026-08-19
# Hypothesis: Contamination Injection Creates Training Exposure
# Type: MECHANISM
# Budget: 18/30 (FULL tier)

metadata:
  hypothesis_id: h-m1
  hypothesis_type: MECHANISM
  tier: FULL
  total_budget: 30
  tasks_used: 18
  epic_count: 8
  subtask_count: 10

epic_tasks:
  - id: M-1
    name: Data pipeline extension
    description: Reuse load_mmlu; add test-set contamination sampling (5 levels), prompt formatting
    complexity: 8
    complexity_breakdown: 2+2+2+2
    category: LOW
    module: data.py
    dependencies: [h-e1/code/data.py]
    subtasks: []

  - id: M-2
    name: LoRA config extension
    description: Extend H-E1 LoRA to 4 target modules per PRD FR-2.2
    complexity: 4
    complexity_breakdown: 1+1+1+1
    category: LOW
    module: model.py
    dependencies: [h-e1/code/model.py]
    subtasks: []

  - id: M-3
    name: Contamination injection orchestration
    description: Train 5 levels x 3 seeds = 15 model variants via reused inject_contamination
    complexity: 15
    complexity_breakdown: 3+4+4+4
    category: HIGH
    module: model.py, train.py
    dependencies: [M-1, M-2]
    subtasks:
      - id: L-M3-1
        name: build_lora_config_m1
        description: Extend H-E1 LoRA to 4 target modules
      - id: L-M3-2
        name: inject_contamination seed handling
        description: Add set_seed() before Trainer init
      - id: L-M3-3
        name: train_all_variants outer loop
        description: 5 levels x 3 seeds orchestration
      - id: L-M3-4
        name: Checkpoint management
        description: Save/load 15 adapters to disk

  - id: M-4
    name: Full test-set evaluation
    description: Evaluate 14,042 items per variant, extract per-item correctness
    complexity: 12
    complexity_breakdown: 3+3+3+3
    category: MEDIUM
    module: evaluate.py
    dependencies: [M-3]
    subtasks:
      - id: L-M4-1
        name: evaluate_full_test_set
        description: Batch inference on 14,042 items
      - id: L-M4-2
        name: compute_item_accuracy
        description: Contaminated vs clean split, effect_size

  - id: M-5
    name: Item-level accuracy aggregation
    description: Split contaminated/clean, compute effect_size per level/seed
    complexity: 8
    complexity_breakdown: 2+2+2+2
    category: LOW
    module: evaluate.py
    dependencies: [M-4]
    subtasks: []

  - id: M-6
    name: Mechanism verification
    description: mechanism_active check, monotonic trend check, cross-seed aggregation
    complexity: 9
    complexity_breakdown: 2+2+3+2
    category: MEDIUM
    module: mechanism.py
    dependencies: [M-5]
    subtasks:
      - id: C-M6-1
        name: verify_contamination_mechanism
        description: Check contaminated_acc > clean_acc at all levels
      - id: C-M6-2
        name: verify_monotonic_trend
        description: Check effect_size increases with contamination level

  - id: M-7
    name: Visualization
    description: 3 required figures (line, bar, distribution)
    complexity: 6
    complexity_breakdown: 2+1+1+2
    category: LOW
    module: visualize.py
    dependencies: [M-6]
    subtasks: []

  - id: M-8
    name: Experiment orchestration
    description: Wire full seed x level loop, persist results JSON, logging
    complexity: 10
    complexity_breakdown: 3+3+2+2
    category: MEDIUM
    module: train.py
    dependencies: [M-1, M-2, M-3, M-4, M-5, M-6, M-7]
    subtasks:
      - id: C-M8-1
        name: run_experiment main loop
        description: Orchestrate seed x level training and evaluation
      - id: C-M8-2
        name: Results persistence
        description: Save mechanism_results.json with all metrics

complexity_distribution:
  very_high: 0
  high: 1
  medium: 3
  low: 4

success_criteria:
  primary:
    metric: mechanism_active
    target: true
    description: contaminated_acc > clean_acc at ALL non-zero levels
  secondary:
    metric: monotonic_trend
    target: true
    description: effect_size increases with contamination level
  tertiary:
    metric: effect_size
    target: ">0.05"
    description: At least 5% accuracy gain on contaminated items

gate:
  type: MUST_WORK
  pass_action: Proceed to H-M2
  fail_action: PIVOT contamination injection procedure
