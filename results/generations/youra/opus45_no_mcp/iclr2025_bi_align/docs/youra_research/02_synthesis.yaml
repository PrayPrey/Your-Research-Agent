measurement_plan:
  data_collection:
    - source: "Model outputs with logprobs on benchmark tasks"
  procedure:
    - step: "Generate model responses with logprobs for each benchmark task"
    - step: "Compute calibration score: mean(token_logprobs) / num_tokens"
    - step: "Label calibration inversion: P(wrong) > P(correct) + 0.1"
    - step: "Cluster tasks by calibration patterns (k-means, k=3)"
    - step: "Annotate tasks with pre-registered bidirectional features"
    - step: "Compute correlation between clusters and features"
  success_criteria:
    - "Silhouette score > 0.3 for meaningful clusters"
    - "r(cluster, bidirectional_features) > 0.4"
    - "r(cluster, control_features) < 0.2"
    - "Cohen's d > 0.3 between inversion and non-inversion tasks"

validation:
