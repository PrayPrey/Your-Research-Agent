hypothesis_draft:
  title: "Calibration Inversion as Behavioral Marker for Bidirectional Task Classification"
  hypothesis_id: "H-BiDir-Cal-v1"
  core_claim: |
    RLHF-trained models exhibit systematic calibration inversion (high confidence on incorrect answers)
    specifically on tasks requiring bidirectional human-AI adaptation. This pattern can be used to
    classify existing benchmark tasks by directionality without manual annotation.
  mechanism: |
    RLHF reward modeling conflates "producing correct output" with "output requiring user-state modeling."
    Both receive similar annotator approval signals, so the reward model learns a single combined signal.
    On tasks requiring bidirectional adaptation (understanding user beliefs/context), models lack the
    specialized training signal and become confidently incorrect - exhibiting calibration inversion.
  predictions:
    - P1: "Calibration inversion tasks (P(wrong) > P(correct) + 0.1) cluster non-randomly (silhouette > 0.3)"
    - P2: "Inversion clusters correlate with bidirectional features (r > 0.4, Cohen's d > 0.3)"
    - P3: "Correlation survives controlling for length, topic, format, difficulty (partial r > 0.3)"

variables_summary:
  independent: "Calibration cluster membership (empirically derived from model behavior)"
  dependent_primary: "Correlation with bidirectional feature checklist score"
  controlled: "Task length, topic, format, estimated difficulty"

null_hypothesis:
  h0_statement: |
    Calibration inversion is randomly distributed across tasks, OR correlates equally with
    control features (length, topic, format) as with bidirectional features.
  statistical_test: "ANOVA for between-group variance; Pearson correlation with confidence intervals"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Behavioral detection of bidirectional tasks via calibration patterns - no manual annotation"
  differentiation_summary: |
    Prior work (Shen et al. 2024) established theoretical framework but left task classification unsolved.
    We provide first empirical operationalization using model behavior (calibration inversion) as signal.
    This transforms bidirectional alignment from theoretical concept to measurable task property.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

