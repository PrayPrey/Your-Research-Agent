# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Tasks showing calibration inversion (P(wrong) > P(correct) + 0.1) will cluster non-randomly"
    test_method: "K-means clustering on calibration scores; validate with silhouette score"
    success_criterion: "Silhouette score > 0.3; clusters are separable"
    falsification: "Silhouette score < 0.2 indicates no meaningful clustering"
  - id: "P2"
    primary: false
    statement: "Inversion cluster tasks will score higher on bidirectional feature checklist than non-inversion tasks"
    test_method: "Compare mean bidirectional feature score (0-3) between clusters"
    success_criterion: "Cohen's d > 0.3; r(cluster, features) > 0.4"
    falsification: "Cohen's d < 0.2 or r < 0.2 indicates no meaningful difference"
  - id: "P3"
    primary: false
    statement: "The correlation between inversion clusters and bidirectional features survives controlling for confounds"
    test_method: "Stratify by difficulty quartile; compute partial correlation controlling for length, topic, format"
    success_criterion: "Partial r > 0.3 after controls; effect present in all difficulty quartiles"
    falsification: "Partial r < 0.15 indicates confound explains the effect"

