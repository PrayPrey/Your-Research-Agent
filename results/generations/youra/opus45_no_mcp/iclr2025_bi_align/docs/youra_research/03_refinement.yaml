# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Bidirectional alignment framework is theoretically established"
      status: "BUILD_ON"
      evidence: "Shen et al. 2024 (arXiv:2406.09264) established theoretical framework from 400+ paper review"
    - claim: "RLHF models exhibit miscalibration patterns"
      status: "BUILD_ON"
      evidence: "Documented in RLHF literature; models show overconfidence on certain task types"
    - claim: "Existing benchmarks lack directionality classification"
      status: "PROVE_NEW"
      evidence: "TruthfulQA, ETHICS, HHH have no directionality metadata - our contribution fills this gap"
    - claim: "Calibration inversion correlates with bidirectional task features"
      status: "PROVE_NEW"
      evidence: "Core hypothesis - tasks with P(wrong) > P(correct) will correlate with bidirectional features"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    Focus verification on PROVE_NEW claims. BUILD_ON claims can be referenced without re-verification.
    The theoretical framework (Shen et al.) and RLHF miscalibration are established foundations.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiDir-Cal-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under existing RLHF benchmarks (TruthfulQA, ETHICS, HHH),
    if we cluster tasks by calibration inversion patterns (where models show high confidence on incorrect answers),
    then these clusters will correlate significantly with theoretically-expected bidirectional task features (r > 0.4),
    because RLHF's reward modeling conflates "correct output" with "user-state-modeling-required output."
  alternative_hypothesis_h0: |
    There is no significant correlation between calibration inversion clusters and bidirectional task features,
    OR the correlation with bidirectional features does not exceed correlation with control features (length, topic, format).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "calibration_cluster_membership"
      type: "categorical"
      operationalization: "Tasks clustered by calibration patterns: high-cal-correct, low-cal-correct, inversion"
      levels: ["high_calibration_correct", "low_calibration_correct", "calibration_inversion"]
  dependent:
    - name: "bidirectional_feature_correlation"
      type: "continuous"
      operationalization: "Pearson correlation between cluster membership and bidirectional feature score (0-3)"
      primary: true
    - name: "effect_size"
      type: "continuous"
      operationalization: "Cohen's d between inversion cluster and non-inversion tasks on bidirectional features"
      primary: false
  controlled:
    - name: "task_length"
      operationalization: "Number of tokens in task prompt, binned into quartiles"
    - name: "topic_category"
      operationalization: "Benchmark-provided topic labels (misconceptions, ethics, helpfulness)"
    - name: "format_type"
      operationalization: "Multiple choice vs open-ended response format"
    - name: "estimated_difficulty"
      operationalization: "Mean accuracy across all test models (proxy for difficulty)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "RLHF training optimizes models for annotator approval signals"
      evidence: "Standard RLHF training objective (Ouyang et al. 2022)"
      falsifier: "If RLHF models don't optimize for annotator preference at all"
    - step: 2
      description: "Annotator approval conflates 'correct answer' with 'answer requiring user-state modeling'"
      evidence: "Annotators rate both high without distinguishing; reward model learns combined signal"
      falsifier: "If reward models clearly separate correctness from user-modeling dimensions"
    - step: 3
      description: "Models learn single reward signal for both dimensions, missing bidirectional nuance"
      evidence: "Single scalar reward doesn't distinguish adaptation direction"
      falsifier: "If models show evidence of separate internal representations for these dimensions"
    - step: 4
      description: "On tasks requiring bidirectional adaptation, models show miscalibrated confidence"
      evidence: "Models are confidently wrong when user-state modeling was required but not explicitly rewarded"
      falsifier: "If calibration is uniform across all task types regardless of bidirectionality"
  key_tension: "Whether the reward conflation is the CAUSE of miscalibration or merely correlated"
  evidence_summary: |
    The mechanism explains why RLHF models might systematically fail on bidirectional tasks:
    the reward signal doesn't distinguish between "correct output" and "output that required
    modeling the user's state," so models optimize for surface correctness without the
    deeper adaptation required for bidirectional tasks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Calibration scores are reliably measurable from model logprobs"
    supporting_evidence: "Standard technique in calibration literature; logprobs available from open models"
    consequence_if_violated: "Cannot compute inversion metric; need alternative confidence measure"
  - id: "A2"
    assumption: "Bidirectional features can be identified from task text alone"
    supporting_evidence: "Three features defined: user-belief-reference, context-dependent, hedged-answer"
    consequence_if_violated: "Would need human annotation or richer context; increases cost"
  - id: "A3"
    assumption: "Open RLHF models are representative of RLHF behavior generally"
    supporting_evidence: "Llama-2-Chat, Mistral-Instruct use standard RLHF training"
    consequence_if_violated: "Findings may not generalize to closed models; scope limitation"
  - id: "A4"
    assumption: "Task difficulty can be estimated via cross-model accuracy"
    supporting_evidence: "Standard proxy; tasks hard for all models are likely intrinsically difficult"
    consequence_if_violated: "Difficulty confound might not be fully controlled"
  - id: "A5"
    assumption: "Bidirectional feature base rate is in informative range (20-80%)"
    supporting_evidence: "To be validated in preliminary analysis"
    consequence_if_violated: "Test becomes uninformative if most/few tasks have features"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - RLHF-trained instruction-following language models
    - Existing benchmarks with clear correctness labels (TruthfulQA, ETHICS, HHH)
    - Models that provide access to output logprobs
  does_not_apply_to: |
    - Base models without RLHF fine-tuning
    - Benchmarks without ground truth correctness criteria
    - Closed models without logprob access (scope limitation, not exclusion)
  known_limitations: |
    - Cross-model generalization limited to open RLHF models
    - Feature extraction is text-based only (no multimodal)
    - May not capture all forms of bidirectionality

