# H-M2 Implementation Tasks
# Hypothesis: Annotator Approval Conflates Correctness with User-State Modeling
# Tier: LIGHT (analysis extending H-M1)
# Total Tasks: 14

metadata:
  hypothesis_id: h-m2
  hypothesis_type: MECHANISM
  tier: LIGHT
  total_tasks: 14
  gate_type: SHOULD_WORK
  pass_condition: "high_conf_rate_difference < 0.15 OR conflation_score > 0.85"
  created_at: "2026-08-19"

task_breakdown:
  setup: 1
  data_preparation: 1
  implementation: 10
  validation: 2

tasks:
  # Setup
  - id: T-01
    epic: A-1
    name: "Setup project structure"
    description: "Create h-m2/code/ directory structure with data/, analysis/, viz/, outputs/"
    complexity: 1
    category: setup
    dependencies: []

  # Data Preparation
  - id: T-02
    epic: A-1
    name: "Implement loader.py"
    description: "Load H-M1 results.json, validate schema (task_id, task_type, confidence_* keys)"
    complexity: 2
    category: data_preparation
    dependencies: [T-01]
    input: "h-m1/code/outputs/results.json"
    output: "Validated per_task list with 2212 records"

  # Core Analysis Implementation
  - id: T-03
    epic: A-2
    name: "Implement threshold_sweep.py"
    description: "High-conf rate calculation across thresholds [0.5, 0.6, 0.7, 0.8, 0.9]"
    complexity: 2
    category: implementation
    dependencies: [T-02]

  - id: T-04
    epic: A-3
    name: "Implement group_compare.py"
    description: "Type A vs Type B rate comparison, chi-square test, gate pass/fail logic"
    complexity: 3
    category: implementation
    dependencies: [T-02]

  - id: T-05
    epic: A-3
    name: "Implement gate check logic"
    description: "gate_pass = (rate_diff < 0.15) or (conflation_score > 0.85)"
    complexity: 2
    category: implementation
    dependencies: [T-04]

  - id: T-06
    epic: A-4
    name: "Implement feature_breakdown.py"
    description: "Per-feature high-conf rates using H-M1 task_classifier.compute_bidir_features"
    complexity: 3
    category: implementation
    dependencies: [T-02]
    note: "Requires joining task_id with original task text from H-E1 data"

  - id: T-07
    epic: A-5
    name: "Implement model_consistency.py"
    description: "Per-model analysis using MODEL_KEY_MAP for 3 models"
    complexity: 2
    category: implementation
    dependencies: [T-02]

  - id: T-08
    epic: A-5
    name: "Implement consistency_score"
    description: "Std dev of rate_difference across models, same_gate_pass check"
    complexity: 2
    category: implementation
    dependencies: [T-07]

  # Visualization
  - id: T-09
    epic: A-6
    name: "Plot gate_metrics.png"
    description: "Bar chart comparing high-conf rate Type A vs Type B"
    complexity: 1
    category: implementation
    dependencies: [T-04]

  - id: T-10
    epic: A-6
    name: "Plot sensitivity_curve.png"
    description: "Line plot of rate_difference vs threshold"
    complexity: 1
    category: implementation
    dependencies: [T-03]

  - id: T-11
    epic: A-6
    name: "Plot feature_heatmap.png"
    description: "Heatmap of per-feature high-conf rates"
    complexity: 2
    category: implementation
    dependencies: [T-06]

  - id: T-12
    epic: A-6
    name: "Plot cross_model_scatter.png"
    description: "Scatter plot of rate_difference per model"
    complexity: 1
    category: implementation
    dependencies: [T-07]

  # Orchestration & Validation
  - id: T-13
    epic: A-7
    name: "Implement run_analysis.py"
    description: "Orchestrator wiring all modules, writes metrics.json with gate result"
    complexity: 2
    category: validation
    dependencies: [T-03, T-04, T-05, T-06, T-07, T-08, T-09, T-10, T-11, T-12]
    output: "outputs/metrics.json, figures/*.png"

  - id: T-14
    epic: A-7
    name: "Run analysis and validate gate"
    description: "Execute run_analysis.py, verify gate_pass in metrics.json"
    complexity: 1
    category: validation
    dependencies: [T-13]
    success_criteria: "gate_pass = true OR explore_reason documented"

complexity_summary:
  total_complexity: 25
  distribution:
    low_1_2: 10
    medium_3: 3
    high_4_5: 0
    very_high_6_plus: 0
  tier_compliance: "LIGHT tier compliant (14 tasks < 15 max)"

dependencies_graph: |
  T-01 → T-02 → T-03 → T-10
                ↓
          T-04 → T-05 → T-09
                ↓
          T-06 → T-11
                ↓
          T-07 → T-08 → T-12
                ↓
          T-13 → T-14
