  h-m4:
    type: MECHANISM
    title: Bidirectional Tasks Show Miscalibrated Confidence
    statement: 'Under the reward conflation mechanism, if tasks require bidirectional adaptation,

      then models show miscalibrated confidence (high confidence on wrong answers),

      because the specialized training signal is missing.

      '
