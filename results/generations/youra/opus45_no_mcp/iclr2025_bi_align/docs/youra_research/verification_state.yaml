      secondary: Clusters show distinct calibration profiles
    failure_response: ABANDON - No systematic pattern exists
    source: Phase 2A SH1, Prediction P1
    version: 1
    completed: true
  h-m1:
    type: MECHANISM
    title: RLHF Optimizes for Annotator Approval
    statement: 'Under standard RLHF training, if we analyze the reward signal, then models optimize

      for annotator approval (not correctness alone), because annotator ratings conflate

      multiple dimensions.

      '
    status: COMPLETED
    gate:
      type: MUST_WORK
      satisfied: true
