    type: MECHANISM
    title: Models Learn Single Reward Signal Missing Bidirectional Nuance
    statement: 'Under single scalar reward training, if models receive one combined signal for

      correctness and user-modeling, then they miss bidirectional adaptation nuance,

      because the training objective doesn''t distinguish.

      '
