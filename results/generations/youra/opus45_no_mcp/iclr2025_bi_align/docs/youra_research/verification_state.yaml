sub_hypotheses:
  h-e1:
    type: EXISTENCE
    title: Calibration Inversion Clusters Exist Systematically
    statement: 'Under RLHF benchmark evaluation, if we compute calibration scores across all tasks,

      then tasks showing calibration inversion (P(wrong) > P(correct) + 0.1) will cluster

      non-randomly (silhouette > 0.3), because systematic model behavior patterns exist.

      '
    status: COMPLETED
    gate:
      type: MUST_WORK
      satisfied: true
      result: PASS
      silhouette_score: 0.6016
      best_k: 2
      threshold: 0.3
    prerequisites: []
    experiment_design:
      status: COMPLETED
      file: 02c_experiment_brief.md
    implementation_planning:
      status: COMPLETED
      completed_at: '2026-08-19T06:15:00+00:00'
