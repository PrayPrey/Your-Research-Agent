  h-m2:
    type: MECHANISM
    title: Annotator Approval Conflates Correctness with User-State Modeling
    statement: 'Under annotator rating behavior, if annotators rate both "correct output" and

      "output requiring user-state modeling" high without distinguishing, then the

      reward model learns a combined signal, because the rating scale doesn''t differentiate.

      '
    status: COMPLETED
    gate:
      type: SHOULD_WORK
