risks:
  r1:
    id: R1
    source_assumption: A1
    description: Calibration scores unreliable/noisy
    severity: HIGH
    affected_hypotheses:
    - h-e1
    - h-m4
    mitigation: Use length-normalized log probabilities; test multiple aggregation methods
  r2:
    id: R2
    source_assumption: A2
    description: Bidirectional features hard to identify from text
    severity: MEDIUM
    affected_hypotheses:
    - h-m4
    mitigation: Pre-register three proxy features with objective definitions
  r3:
    id: R3
    source_assumption: A3
    description: Open models not representative
    severity: MEDIUM
    affected_hypotheses:
    - h-m1
    - h-m2
    - h-m3
    - h-m4
    mitigation: Use models from multiple organizations (Meta, Mistral)
  r4:
    id: R4
    source_assumption: A4
    description: Difficulty confound not controlled
    severity: MEDIUM
    affected_hypotheses:
    - h-m4
    mitigation: Stratify analysis by difficulty quartiles
  r5:
