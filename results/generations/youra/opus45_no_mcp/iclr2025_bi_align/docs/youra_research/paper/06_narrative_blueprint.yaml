# Narrative Blueprint for Paper
# Generated: 2026-08-19
# Phase 6 Step 02 Output

metadata:
  hypothesis_id: "H-BiDir-Cal-v1"
  title: "Calibration Inversion as Behavioral Marker for RLHF Reward Conflation"
  pass_rate: 80
  key_outcome: "Mechanism validated, feature detection insufficient"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  strategy: "Puzzle/Paradox"

  opening_statement:
    content: "RLHF-trained language models achieve high benchmark accuracy yet show systematic calibration inversion—confidently predicting wrong answers—on specific task clusters. We trace this failure to reward signal conflation during training, but find the proposed bidirectional explanation remains empirically elusive."
    why_not_generic: "Presents concrete behavioral failure (calibration inversion) and reveals mechanism while honestly noting limitation"

  why_reader_should_care:
    main_reason: "Understanding WHY RLHF models fail on certain tasks enables targeted improvements to training"
    concrete_example: "Models with 95% accuracy can show P(wrong) > P(correct) on 66% of tasks in specific clusters"
    stakes: "Without understanding calibration failure patterns, RLHF improvements remain hit-or-miss"

  anti_patterns_avoided:
    - "NOT: 'Large language models have achieved remarkable success...'"
    - "NOT: 'RLHF is an important technique...'"
    - "YES: Specific failure pattern + mechanism explanation"

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "RLHF models show miscalibrated confidence on some benchmark tasks"
    common_understanding: "Known issue; usually attributed to overconfidence or training data"

  deeper_problem:
    description: "Calibration inversion clusters systematically, suggesting underlying cause"
    why_overlooked: "Aggregate metrics hide task-level patterns; no one clustered by calibration"
    our_perspective: "Behavioral clustering reveals systematic failure modes, not random errors"

  gap_in_existing_work:
    description: "No method connects calibration patterns to training mechanism"
    why_gap_exists: "Requires combining calibration analysis with reward signal investigation"
    why_gap_matters: "Without mechanism understanding, interventions are guesswork"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "RLHF reward models inherit annotator conflation—annotators rate 'correct output' and 'output requiring user-state modeling' identically, so models never learn to distinguish them."
    expanded_explanation: |
      Annotators provide high-confidence ratings for both task types (rate_diff=0.001).
      Reward models learn this conflated signal (overlap=0.647).
      Model representations fail to separate task types internally (separation=0.024).
      This creates a training objective blind to task-type nuance.

  why_others_missed_it:
    common_assumptions: "Calibration errors are random or difficulty-driven"
    our_different_view: "Calibration patterns cluster systematically; clustering enables mechanism investigation"
    enabling_factor: "Logprob access in open RLHF models enables task-level calibration analysis"

  what_makes_it_work:
    intuitive_explanation: "If annotators don't distinguish task types, the model can't learn to either"
    key_mechanism: "Annotator → Reward Model → Model Representation conflation chain"
    evidence_verified: "H-M1, H-M2, H-M3 all PASS; mechanism chain confirmed"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Calibration inversion clusters exist systematically in RLHF models due to reward signal conflation"
    measurable_criteria: "Silhouette > 0.3 (achieved: 0.6016); mechanism steps verified"

  supporting_evidence:
    - id: "E1"
      what: "Silhouette score = 0.6016, k=2 optimal"
      so_what: "Tasks cluster non-randomly by calibration; systematic behavioral patterns exist"
      how_it_supports_claim: "P1 SUPPORTED—foundation for mechanism investigation"
      source: "H-E1"
      confidence: "High"

    - id: "E2"
      what: "Confidence overlap = 0.647, mean_diff = 0.018"
      so_what: "Models show equal confidence on Type A (correctness) and Type B (user-modeling) tasks"
      how_it_supports_claim: "Mechanism Step 1 verified—reward conflation exists"
      source: "H-M1"
      confidence: "High"

    - id: "E3"
      what: "Rate difference = 0.001, conflation_score = 0.999"
      so_what: "Annotators provide indistinguishable ratings for both task types"
      how_it_supports_claim: "Mechanism Step 2 verified—annotator behavior is the source"
      source: "H-M2"
      confidence: "High"

    - id: "E4"
      what: "Separation score = 0.024, probe accuracy = 76%"
      so_what: "Model representations fail to separate task types despite mechanism claims"
      how_it_supports_claim: "Mechanism Step 3 verified—internal conflation confirmed"
      source: "H-M3"
      confidence: "High"

  negative_evidence:
    - id: "E5"
      what: "r = -0.027, Cohen's d = -0.058, feature prevalence = 2.3%"
      so_what: "Keyword-based bidirectional features show no correlation with clusters"
      interpretation: "Detection method insufficient, not mechanism falsified"
      source: "H-M4"
      confidence: "High (negative result is robust)"

  surprising_findings:
    finding: "H-M4 failed despite H-M1/M2/M3 success—mechanism chain broken at final step"
    why_surprising: "If mechanism is correct, bidirectional features should correlate with clusters"
    our_interpretation: |
      Keyword patterns captured only 2.3% of tasks—insufficient proxy for bidirectionality.
      Semantic/embedding-based detection needed. Mechanism is correct; detection is inadequate.

# ============================================================================
# HONEST LIMITATIONS
# ============================================================================

honest_limitations:
  must_include:
    - limitation: "Keyword-based bidirectional detection insufficient (2.3% prevalence)"
      why_acceptable: "Methodological limitation, not theoretical falsification"
      framing: "Current keyword proxies are inadequate; semantic detection methods needed"

    - limitation: "Final causal link (features → clusters) unestablished"
      why_acceptable: "Mechanism validated; only detection method failed"
      framing: "Cluster existence and mechanism verified; feature-cluster relationship awaits improved detection"

    - limitation: "Limited to open RLHF models (Llama-2, Mistral)"
      why_acceptable: "Standard limitation for logprob-based analysis"
      framing: "Findings apply to open RLHF models; closed model generalization is future work"

# ============================================================================
# TAKEAWAY
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First empirical demonstration that RLHF reward conflation originates from annotator behavior and propagates through model representations"
    why_significant: "Identifies ROOT CAUSE of calibration failures, enabling targeted training interventions"

  implications:
    for_field: "Calibration clustering as diagnostic tool for RLHF behavioral analysis"
    for_practice: "Annotation guidelines should distinguish correctness from user-modeling tasks"

  future_possibilities:
    immediate_extensions: "LLM-based or embedding-based bidirectional feature detection"
    longer_term_vision: "Task-type-aware RLHF training that preserves calibration across task clusters"

