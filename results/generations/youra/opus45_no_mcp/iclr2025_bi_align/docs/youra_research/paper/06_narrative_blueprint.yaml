    word_target: "~800-1000"

  results:
    narrative_purpose: "Present evidence: 4/5 hypotheses pass; mechanism verified"
    main_result_highlight: "Silhouette=0.6016 (clusters exist) + overlap=0.647 + rate_diff=0.001 + separation=0.024"
    negative_result: "H-M4 FAIL: r=-0.027, feature prevalence=2.3%"
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret: mechanism works, detection doesn't"
    honest_limitations:
      - "Keyword features insufficient"
      - "Open models only"
      - "Dataset composition may lack bidirectional variation"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Callback: systematic failures have systematic causes; detection is next step"
    callback_to_hook: "The calibration paradox has a mechanism explanation—fixing detection is the next frontier"
    word_target: "~300-400"

