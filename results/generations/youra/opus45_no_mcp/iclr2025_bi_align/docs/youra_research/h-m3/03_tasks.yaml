# Implementation Tasks: H-M3
# Hypothesis: Models Learn Single Reward Signal Missing Bidirectional Nuance
# Date: 2026-08-19
# Tier: FULL (max 30 tasks)

metadata:
  hypothesis_id: "H-M3"
  type: "MECHANISM"
  tier: "FULL"
  total_tasks: 21
  max_allowed: 30

epics:
  - id: E1
    name: "Data Loading"
    complexity: 2
    tasks:
      - id: T1.1
        name: "Load H-M1 task classifications"
        description: "Read cached task type labels (TypeA/TypeB) from H-M1 results"
        complexity: 1
        dependencies: []
      - id: T1.2
        name: "Prepare prompts for extraction"
        description: "Format 2212 task prompts for model input"
        complexity: 1
        dependencies: [T1.1]

  - id: E2
    name: "Model Setup"
    complexity: 3
    tasks:
      - id: T2.1
        name: "Load Llama-2-7B-Chat"
        description: "Load primary model with output_hidden_states=True"
        complexity: 1
        dependencies: []
      - id: T2.2
        name: "Load Llama-2-13B-Chat"
        description: "Load validation model 1"
        complexity: 1
        dependencies: []
      - id: T2.3
        name: "Load Mistral-7B-Instruct"
        description: "Load validation model 2"
        complexity: 1
        dependencies: []

  - id: E3
    name: "Hidden State Extraction"
    complexity: 4
    tasks:
      - id: T3.1
        name: "Implement batch extraction"
        description: "Create function to extract last-layer, last-token hidden states"
        complexity: 2
        dependencies: [T2.1]
      - id: T3.2
        name: "Extract Llama-7B hidden states"
        description: "Run extraction for all 2212 prompts (batch_size=8)"
        complexity: 1
        dependencies: [T1.2, T3.1]
      - id: T3.3
        name: "Extract Llama-13B hidden states"
        description: "Run extraction for validation model 1"
        complexity: 1
        dependencies: [T2.2, T3.1]
      - id: T3.4
        name: "Extract Mistral-7B hidden states"
        description: "Run extraction for validation model 2"
        complexity: 1
        dependencies: [T2.3, T3.1]

  - id: E4
    name: "Separation Analysis"
    complexity: 3
    tasks:
      - id: T4.1
        name: "Implement separation score"
        description: "Compute intra/inter-type cosine similarities"
        complexity: 2
        dependencies: []
      - id: T4.2
        name: "Compute separation for all models"
        description: "Calculate separation_score for each model's hidden states"
        complexity: 1
        dependencies: [T3.2, T3.3, T3.4, T4.1]
      - id: T4.3
        name: "Statistical significance test"
        description: "Permutation test for separation significance"
        complexity: 1
        dependencies: [T4.2]

  - id: E5
    name: "Linear Probe"
    complexity: 2
    tasks:
      - id: T5.1
        name: "Implement linear probe"
        description: "Train LinearSVC with 5-fold CV on hidden states"
        complexity: 1
        dependencies: []
      - id: T5.2
        name: "Compute probe accuracy for all models"
        description: "Run linear probe on each model's hidden states"
        complexity: 1
        dependencies: [T3.2, T3.3, T3.4, T5.1]

  - id: E6
    name: "Visualization"
    complexity: 2
    tasks:
      - id: T6.1
        name: "Generate t-SNE plot"
        description: "Create 2D visualization of hidden states colored by task type"
        complexity: 1
        dependencies: [T3.2]
      - id: T6.2
        name: "Generate gate metrics chart"
        description: "Bar chart comparing separation score to threshold"
        complexity: 1
        dependencies: [T4.2, T5.2]

  - id: E7
    name: "Results Export"
    complexity: 2
    tasks:
      - id: T7.1
        name: "Generate results.json"
        description: "Export all metrics in structured JSON format"
        complexity: 1
        dependencies: [T4.2, T5.2]
      - id: T7.2
        name: "Generate summary report"
        description: "Create human-readable summary of findings"
        complexity: 1
        dependencies: [T7.1]

  - id: E8
    name: "Gate Evaluation"
    complexity: 2
    tasks:
      - id: T8.1
        name: "Evaluate gate condition"
        description: "Check if sep < 0.1 OR probe < 0.6"
        complexity: 1
        dependencies: [T4.2, T5.2]
      - id: T8.2
        name: "Cross-model consistency check"
        description: "Verify results consistent across all 3 models"
        complexity: 1
        dependencies: [T8.1]

summary:
  total_tasks: 21
  by_epic:
    E1_data_loading: 2
    E2_model_setup: 3
    E3_hidden_extraction: 4
    E4_separation: 3
    E5_linear_probe: 2
    E6_visualization: 2
    E7_results: 2
    E8_gate_eval: 2
  complexity_total: 21
  within_budget: true  # 21 <= 30
