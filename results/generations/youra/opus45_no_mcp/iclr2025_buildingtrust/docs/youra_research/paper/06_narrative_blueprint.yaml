# Phase 6 Narrative Blueprint
# Generated: 2026-08-19
# Purpose: Guide coherent paper generation across story groups

narrative_design:
  hook_strategy:
    type: "mechanism_first"
    opening: "LLMs can 'self-read' their own uncertainty signals"
    hook_sentence: |
      When large language models reason step-by-step, they generate hedging markers
      that correlate with more calibrated confidence judgments—suggesting models can
      leverage their own in-context uncertainty signals.
    avoid:
      - "Calibration is important for AI safety"
      - "LLMs are increasingly deployed"
      - Generic importance statements

  problem_framing:
    surface_level: "LLM confidence is poorly calibrated—models are overconfident when wrong"
    deeper_level: "Standard prompting doesn't expose model uncertainty during generation"
    gap_level: |
      No systematic study isolates HOW CoT improves calibration—whether through
      meaningful uncertainty signals or trivial token-count artifacts

  key_insight:
    statement: |
      CoT prompting produces reasoning chains containing epistemic hedging markers
      (may, could, however) that negatively correlate with verbalized confidence
      (r=-0.315, p<1e-16), demonstrating uncertainty signal integration.
    evidence_basis:
      - "H-M4: Spearman r=-0.315, n=664, p=9.22e-17"
      - "H-M2: 82% hedging presence rate"
      - "H-M3: 100% positional ordering compliance"
    so_what: |
      This validates the "self-reading" mechanism: models adjust confidence based on
      uncertainty markers they generated in prior tokens.

  evidence_structure:
    mechanism_chain:
      - step: 1
        claim: "CoT produces multi-step reasoning"
        evidence: "H-M1: 100% reasoning rate, 4.49 mean steps"
        section: "Results"
      - step: 2
        claim: "Reasoning contains hedging markers"
        evidence: "H-M2: 82% presence, top markers: may (787), could (619)"
        section: "Results"
      - step: 3
        claim: "Markers precede confidence in sequence"
        evidence: "H-M3: 100% CoT-then-confidence, 100% markers precede"
        section: "Methods"
      - step: 4
        claim: "Hedging correlates with lower confidence"
        evidence: "H-M4: r=-0.315, p<1e-16"
        section: "Main Result"

  claims_hierarchy:
    primary:
      claim: "Hedging markers negatively correlate with verbalized confidence"
      confidence: "VERY_HIGH"
      evidence_strength: "Statistical: r=-0.315, p<1e-16, n=664"
    secondary:
      - claim: "CoT reliably produces multi-step reasoning"
        confidence: "VERY_HIGH"
        evidence: "100% rate vs 0% baseline"
      - claim: "Reasoning chains contain epistemic uncertainty markers"
        confidence: "HIGH"
        evidence: "82% presence rate"
      - claim: "Structural ordering ensures marker availability"
        confidence: "VERY_HIGH"
        evidence: "100% compliance"
    deferred:
      - claim: "Super-additive ECE improvement over single interventions"
        status: "INCONCLUSIVE"
        reason: "H-E1 ran in mock mode; awaiting real API execution"

  limitations_framing:
    honest_limitations:
      - limitation: "Single model tested (GPT-3.5-turbo)"
        framing: "Demonstrates mechanism; multi-model replication is future work"
      - limitation: "Correlational evidence only"
        framing: "Direction and significance support mechanism; intervention study proposed"
      - limitation: "P1 super-additivity untested"
        framing: "Mechanism validated; direct ECE comparison is confirmatory"
    scope_boundaries:
      applies_to:
        - "Instruction-tuned chat models"
        - "Multiple-choice QA tasks"
        - "Constrained output formats"
      does_not_apply_to:
        - "Base completion models"
        - "Open-ended generation"
        - "High-temperature sampling"

section_goals:
  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    word_target: "~800-1000"
    must_contain:
      - "Opening hook on self-reading mechanism"
      - "Three-level problem framing"
      - "Key insight preview"
      - "Contributions as narrative, not list"
    callbacks_to: null

  related_work:
    narrative_role: "Show existing work insufficient → justify our approach"
    word_target: "~600-800"
    must_contain:
      - "LLM calibration landscape"
      - "CoT prompting for reasoning"
      - "Confidence elicitation methods"
      - "Gap: no mechanism isolation"
    transitions:
      to_methodology: "Existing work studies components in isolation; we systematically isolate the mechanism"

  methodology:
    narrative_role: "WHY this design solves the problem"
    word_target: "~1000-1200"
    must_contain:
      - "Connection to key insight"
      - "5-condition experimental design"
      - "Mechanism verification protocol"
      - "Sub-hypothesis decomposition"
    key_figures:
      - "Architecture diagram (if available)"

  experiments:
    narrative_role: "Design experiments that test our specific claims"
    word_target: "~800-1000"
    must_contain:
      - "Experimental questions tied to claims"
      - "Dataset rationale (TruthfulQA)"
      - "Metric definitions (ECE, Spearman r)"
      - "Sub-hypothesis breakdown"

  results:
    narrative_role: "Present evidence supporting claims"
    word_target: "~1000-1200"
    must_contain:
      - "Mechanism chain table (4 steps verified)"
      - "Hedging-confidence scatter plot description"
      - "Statistical significance reporting"
      - "Planned-vs-actual comparison"
    key_figures:
      - "scatter_regression.png"
      - "marker_frequency.png"

  discussion:
    narrative_role: "Interpret results, acknowledge limits"
    word_target: "~400-600"
    must_contain:
      - "Self-reading interpretation"
      - "Alternative explanations addressed"
      - "Honest limitations"
      - "Practical implications"

  conclusion:
    narrative_role: "Callback to hook, open future"
    word_target: "~300-400"
    must_contain:
      - "Echo opening hook"
      - "Summary of validated mechanism"
      - "Future work: multi-model, intervention study"
    callbacks_to: "introduction"

  abstract:
    narrative_role: "Compress full story"
    word_target: "~150"
    written_last: true
    must_contain:
      - "Problem (1 sentence)"
      - "Approach (1 sentence)"
      - "Key finding with numbers (2 sentences)"
      - "Implication (1 sentence)"

key_figures:
  main_figure:
    id: "fig1_scatter"
    source: "h-m4/figures/scatter_regression.png"
    description: "Hedging count vs confidence with regression line"
    section: "Results"
    caption_template: |
      Relationship between hedging marker count and verbalized confidence.
      Spearman r=-0.315 (p<1e-16, n=664). Each point represents one CoT+confidence
      output; markers include 'may', 'could', 'however', etc.

  supporting_figures:
    - id: "fig2_markers"
      source: "h-m2/figures/marker_frequency.png"
      description: "Top 15 hedging marker frequencies"
      section: "Results"
    - id: "fig3_mechanism"
      description: "Mechanism chain diagram (generate if needed)"
      section: "Methods"

tables:
  main_table:
    id: "tab1_mechanism"
    description: "Mechanism verification summary"
    columns: ["Step", "Claim", "Hypothesis", "Evidence", "Status"]
    rows:
      - ["1", "CoT produces reasoning", "H-M1", "100% rate, 4.49 steps", "VERIFIED"]
      - ["2", "Reasoning contains hedging", "H-M2", "82% presence", "VERIFIED"]
      - ["3", "Markers precede confidence", "H-M3", "100% ordering", "VERIFIED"]
      - ["4", "Hedging correlates with confidence", "H-M4", "r=-0.315", "VERIFIED"]

cross_section_coherence:
  introduction_to_results: "Hook claims should match validated findings exactly"
  methods_to_results: "Every metric defined must appear in results"
  discussion_to_limitations: "All limitations mentioned must be honest per blueprint"
  conclusion_to_introduction: "Must callback to opening hook"

checkpoint:
  narrative_design_complete: true
  created_at: "2026-08-19T04:00:00Z"
