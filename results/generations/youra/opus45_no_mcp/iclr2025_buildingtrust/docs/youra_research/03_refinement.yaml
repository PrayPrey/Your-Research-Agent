# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "ECE and Brier Score are standard, well-validated calibration metrics"
      status: "BUILD_ON"
      evidence: "Guo et al. 2017, universally adopted in calibration literature"
    - claim: "Chain-of-thought prompting improves reasoning accuracy"
      status: "BUILD_ON"
      evidence: "Wei et al. 2022, replicated across multiple studies"
    - claim: "LLMs can verbalize confidence scores via prompting"
      status: "BUILD_ON"
      evidence: "Lin et al. 2022, Xiong et al. 2023"
    - claim: "CoT+confidence combination produces super-additive calibration gains"
      status: "PROVE_NEW"
      evidence: "No systematic ablation exists; this is the core hypothesis"
    - claim: "Reasoning chain characteristics correlate with appropriate confidence"
      status: "PROVE_NEW"
      evidence: "Mechanism hypothesis; requires P2 validation"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims (ECE validity, CoT basics, confidence elicitation) should be assumed.
    Focus verification on PROVE_NEW claims: super-additivity effect and mechanism correlation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CoTCalibration-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under multiple-choice QA tasks (TruthfulQA, MMLU), if chain-of-thought prompting
    is combined with explicit confidence verbalization, then Expected Calibration Error
    (ECE) will be at least 0.03 lower than the better single intervention (CoT-only or
    confidence-only), because reasoning chain generation surfaces uncertainty signals
    that inform more calibrated confidence judgments.
  alternative_hypothesis_h0: |
    There is no significant difference in ECE between the CoT+confidence condition
    and the better of CoT-only or confidence-only conditions (null: ΔECE < 0.03).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "prompting_strategy"
      type: "categorical"
      operationalization: "Prompt template applied before model inference"
      levels:
        - "baseline (direct answer only)"
        - "cot_only (chain-of-thought then answer)"
        - "confidence_only (answer with confidence)"
        - "cot_plus_confidence (CoT, answer, confidence)"
        - "token_padding_control (filler + answer + confidence)"
  dependent:
    - name: "expected_calibration_error"
      type: "continuous"
      operationalization: "15-bin ECE, range [0,1], lower is better"
      primary: true
    - name: "adaptive_calibration_error"
      type: "continuous"
      operationalization: "ACE with adaptive binning, range [0,1]"
      primary: false
    - name: "brier_score"
      type: "continuous"
      operationalization: "Mean squared error of confidence vs correctness, range [0,1]"
      primary: false
    - name: "accuracy"
      type: "continuous"
      operationalization: "Proportion of correct answers, range [0,1]"
      primary: false
  controlled:
    - name: "temperature"
      operationalization: "Fixed at 0 for deterministic outputs"
    - name: "model_family"
      operationalization: "Tested across GPT and Llama families for generalization"
    - name: "dataset"
      operationalization: "Tested on TruthfulQA and MMLU for domain transfer"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "CoT prompting forces explicit reasoning articulation in the output"
      evidence: "Wei et al. 2022 established CoT produces step-by-step reasoning"
      falsifier: "Model fails to produce multi-step reasoning with CoT prompt"
    - step: 2
      description: "Reasoning chain reveals uncertainty indicators (hedging, alternatives, qualifications)"
      evidence: "Observable in generated text; hypothesis predicts correlation with confidence"
      falsifier: "CoT outputs show no linguistic uncertainty markers regardless of item difficulty"
    - step: 3
      description: "Uncertainty indicators are present in context when confidence is subsequently verbalized"
      evidence: "Sequential generation ensures prior tokens are in context"
      falsifier: "Model attention analysis shows confidence ignores prior reasoning"
    - step: 4
      description: "Confidence estimate incorporates uncertainty signals, producing better calibration"
      evidence: "P1 test: ECE improvement in combined condition"
      falsifier: "P1 fails: combined condition shows no improvement over single interventions"
  key_tension: "Whether observed correlations reflect genuine 'self-reading' or simpler token-count effects"
  evidence_summary: |
    The mechanism is supported by: (1) established CoT reasoning generation, (2) prior work
    on verbalized confidence extraction, (3) the architectural fact that prior tokens are
    in-context during generation. The token-padding control tests whether mechanism is
    meaningful or simply a token-count artifact.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Verbalized confidence can be reliably extracted from model outputs"
    supporting_evidence: "Xiong et al. 2023 showed >95% extraction success with constrained prompts"
    consequence_if_violated: "Systematic extraction failures could bias ECE estimates"
  - id: "A2"
    assumption: "ECE is a valid measure of calibration quality for this setting"
    supporting_evidence: "Standard metric since Guo et al. 2017; ACE as robustness check"
    consequence_if_violated: "Findings might not reflect true calibration; mitigated by multiple metrics"
  - id: "A3"
    assumption: "CoT and confidence verbalization can be cleanly isolated in prompts"
    supporting_evidence: "Prompt design explicitly separates components"
    consequence_if_violated: "Interaction effects confounded with prompt artifacts"
  - id: "A4"
    assumption: "Effects generalize across model families if tested on multiple"
    supporting_evidence: "Testing GPT and Llama families provides initial generalization evidence"
    consequence_if_violated: "Findings may be model-specific rather than general"
  - id: "A5"
    assumption: "TruthfulQA and MMLU provide representative coverage of QA calibration"
    supporting_evidence: "Widely used benchmarks; one adversarial, one general"
    consequence_if_violated: "Results may not transfer to other QA domains"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Multiple-choice QA tasks with clear correct answers
    - LLMs capable of following CoT and confidence prompts
    - Settings where confidence can be numerically extracted (0-100%)
    - Instruction-tuned chat models (GPT-3.5-turbo, Llama-2-chat)
  does_not_apply_to: |
    - Open-ended generation tasks without clear correctness criteria
    - Models that cannot follow structured prompts (base models without instruction tuning)
    - Tasks requiring subjective or stylistic evaluation
    - Real-time deployment where CoT latency is prohibitive
  known_limitations: |
    - Token-padding control tests for trivial explanation but cannot prove specific mechanism
    - "Self-reading" interpretation remains correlational, not causal
    - Two model families provide initial generalization but not comprehensive coverage
    - Results on chat models may not transfer to completion models

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "CoT+confidence yields ECE at least 0.03 lower than the better of CoT-only or confidence-only on TruthfulQA"
    test_method: "Compare mean ECE across conditions with bootstrap 95% CI"
    success_criterion: "ECE(CoT+Conf) ≤ min(ECE(CoT), ECE(Conf)) - 0.03"
    falsification: "ECE(CoT+Conf) > min(ECE(CoT), ECE(Conf)) - 0.03 or not significantly different"
  - id: "P2"
    primary: false
    statement: "Hedging markers in CoT (e.g., 'might', 'possibly', 'alternatively') correlate with lower verbalized confidence"
    test_method: "Compute Spearman correlation between hedging marker count and confidence score in CoT+conf condition"
    success_criterion: "r > 0.2 (moderate positive correlation between uncertainty markers and lower confidence)"
    falsification: "r ≤ 0 (no correlation or negative correlation)"
  - id: "P3"
    primary: false
    statement: "Calibration improvement transfers from TruthfulQA to MMLU"
    test_method: "Compare ECE improvement ratio (ΔECE_TruthfulQA / ΔECE_MMLU)"
    success_criterion: "Ratio within 0.7-1.3 (consistent effect across domains)"
    falsification: "Ratio outside 0.5-2.0 range or improvement only on one dataset"

