hypothesis_draft:
  title: "CoT + Verbalized Confidence for Super-Additive Calibration"
  hypothesis_id: "H-CoTCalibration-v1"
  core_claim: |
    Chain-of-thought prompting combined with explicit confidence verbalization
    produces calibration improvements (measured by ECE) that exceed what either
    technique achieves alone. The combined approach is hypothesized to produce
    super-additive gains because reasoning articulation surfaces uncertainty
    signals that inform the subsequent confidence judgment.
  mechanism: |
    1. CoT prompting generates explicit reasoning chains
    2. Reasoning chains contain uncertainty markers (hedging, alternatives)
    3. These markers are in-context when confidence is verbalized
    4. The model's confidence incorporates these signals
    5. Result: better-calibrated confidence-accuracy relationship
  predictions:
    - P1: "ECE(CoT+Conf) ≤ min(ECE(CoT), ECE(Conf)) - 0.03"
    - P2: "Hedging markers correlate with lower confidence (r > 0.2)"
    - P3: "Effect transfers across TruthfulQA and MMLU (ratio 0.7-1.3)"

variables_summary:
  independent: "Prompting strategy: baseline, CoT-only, confidence-only, CoT+confidence, token-padding"
  dependent_primary: "Expected Calibration Error (ECE), 15-bin, range [0,1]"
  controlled: "Temperature=0, tested across 2 model families, 2 datasets"

null_hypothesis:
  h0_statement: |
    There is no significant difference in ECE between the CoT+confidence condition
    and the better of CoT-only or confidence-only conditions (ΔECE < 0.03).
  statistical_test: "Bootstrap confidence interval comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic ablation quantifying calibration budget breakdown"
  differentiation_summary: |
    Prior work (Tian 2023, Xiong 2023) evaluated prompting strategies or confidence
    elicitation methods individually. This study provides the first controlled
    comparison isolating CoT and confidence components with a token-padding control
    to rule out trivial explanations.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

