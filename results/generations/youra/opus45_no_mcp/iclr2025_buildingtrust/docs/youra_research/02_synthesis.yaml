    - step: "Extract confidence scores using regex pattern 'Confidence: (\\d+)%'"
    - step: "Compute accuracy (correctness of selected answer)"
    - step: "Compute ECE, ACE, Brier Score per condition"
    - step: "Extract hedging markers from CoT reasoning chains"
