gate:
  type: MUST_WORK
  conditions:
    - metric: cot_reasoning_rate
      operator: ">"
      threshold: 0.90
    - metric: rate_difference
      operator: ">"
      threshold: 0.50
    - metric: mean_step_count
      operator: ">"
      threshold: 2.0

outputs:
