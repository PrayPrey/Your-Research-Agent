experiment:
  name: "h-m3-pattern-transfer"
  hypothesis_id: "h-m3"
  version: "1.0"
  random_seed: 42

data:
  source: "codeforces"
  n_problems: 50
  rating_range: [1200, 1800]
  min_solve_count: 1000
  min_test_cases: 15
  test_split_ratio: 0.5
  cache_dir: "data/"
  baseline_code_temperature: 0.7

agent:
  model: "gpt-4-turbo-2024-04-09"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2048
  n_iterations: 10
  api_key_env: "OPENAI_API_KEY"

baselines:
  random:
    n_mutations_per_problem: 20
    mutation_types: ["rename_var", "change_operator", "modify_constant"]
  revealed_only:
    model: "gpt-4-turbo-2024-04-09"
    temperature: 0.7
    n_iterations: 10

analysis:
  permutation_test_samples: 1000
  significance_level: 0.05
  early_stopping:
    enabled: true
    min_problems: 30
    p_threshold: 0.2

output:
  results_dir: "results/"
  plots_dir: "results/plots/"
  checkpoint_file: "results/checkpoint.json"
  validation_report: "04_validation.md"
