# ═══════════════════════════════════════════════════════════════
# Key Insights for Phase 2B
# ═══════════════════════════════════════════════════════════════

phase2b_insights:
  strengths:
    - "Three independent metrics provide triangulation (if one fails, others remain)"
    - "Label-free predictions (P1, P3) reduce dependency on manual annotation"
    - "Two-phase validation design (50 → 200 problems) balances rigor with efficiency"
    - "Open-source commitment ensures reproducibility"
  weaknesses_to_monitor:
    - "Manual error labeling for P2 depends on inter-annotator agreement (kappa > 0.7)"
    - "Codeforces test quality variance requires manual review of curated subset"
    - "Framework bypassed if agents generate correct code on first attempt (no debugging to measure)"
  recommended_focus_areas:
    - "Validate error taxonomy via pilot annotation study (10 problems, 2-3 annotators)"
    - "Curate Codeforces subset with strict quality filtering (solve_count > 1000, manual review)"
    - "Implement permutation testing baselines for all three metrics before agent evaluation"

# ═══════════════════════════════════════════════════════════════
# Discussion Artifacts
# ═══════════════════════════════════════════════════════════════

discussion_artifacts:
  consensus_mechanisms:
    - "Root cause identification (one fix → multiple passing tests)"
    - "Error pattern clustering (similar errors fixed consecutively)"
    - "Transfer learning (held-out tests pass without seeing error messages)"
  rejected_approaches:
    - approach: "Git commit trajectory extraction"
      reason: "Too noisy - commits don't map cleanly to debugging steps (Prof. Pax, Exchange 4)"
    - approach: "Model-based judges for code quality"
      reason: "High variance in subjective assessments (Prof. Pax, Exchange 4)"
    - approach: "Assume universal error difficulty ordering"
      reason: "Syntax errors not always easier than logic errors (Prof. Rex, Exchange 6)"
  accepted_constraints:
    - "Minimum 15+ test cases per problem (excludes HumanEval, MBPP)"
    - "Execution-based metrics only (no subjective assessment)"
    - "Statistical significance threshold p < 0.05 (or p < 0.10 for Phase 1 exploratory)"
