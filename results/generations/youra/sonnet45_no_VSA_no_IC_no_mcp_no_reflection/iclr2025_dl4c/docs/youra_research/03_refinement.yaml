established_facts:
  claims:
    - claim: "Existing code generation benchmarks (HumanEval, MBPP) measure isolated function completion, not multi-turn agent workflows"
      status: "BUILD_ON"
      evidence: "Consensus across personas (Dr. Sage, Prof. Pax) - acknowledged as known limitation in field"
    - claim: "pass@k metrics measure generation success rate but not agent-specific capabilities like iterative improvement"
      status: "BUILD_ON"
      evidence: "Gap identified in Phase 1 research, validated by Dr. Sage and Prof. Vera"
    - claim: "Multi-test benchmarks (LeetCode, Codeforces) exist with 10+ test cases per problem"
      status: "BUILD_ON"
      evidence: "Prof. Pax verified availability of Codeforces (publicly available, 15+ test cases/problem)"
  scope_reduction_percentage: 0
  phase2b_4_instructions: |
