# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-StrategicDebug-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under multi-test code generation benchmarks (Codeforces problems with 15+ test cases),
    if agents are evaluated on strategic debugging ability (measured via fix-impact-ratio,
    error clustering, and predictive fixing), then high-performing agents will demonstrate
    measurable superiority in root cause identification and transfer learning compared to
    baseline random sampling approaches, because strategic debugging requires conceptual
    understanding of code structure and error patterns rather than brute-force iteration.
  alternative_hypothesis_h0: |
    There is no significant difference in fix-impact-ratio, error clustering coefficient,
    or held-out test pass rate between agents and random baseline approaches. All observed
    improvements are within statistical noise (p >= 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Agent Architecture"
      type: "categorical"
      operationalization: "Type of code generation agent tested"
      levels:
        - "GPT-4 (baseline)"
        - "GPT-4 with memory module"
        - "GPT-4 with explicit error analysis prompt"
  dependent:
    - name: "Fix-Impact-Ratio"
      type: "continuous"
      operationalization: "Number of test cases passing per code modification (ratio = Δpassing_tests / num_modifications)"
      primary: true
    - name: "Error Clustering Coefficient"
      type: "continuous"
      operationalization: "Measure of consecutive fixing of similar error types (coefficient = observed_clustering / expected_random, range 0-1)"
      primary: false
    - name: "Held-Out Test Pass Rate Slope"
      type: "continuous"
      operationalization: "Rate of held-out test passing per iteration, compared to random baseline (slope ratio = agent_slope / random_slope)"
      primary: false
  controlled:
    - name: "Problem Difficulty"
      operationalization: "Filter Codeforces problems by solve count (>1000 solves) and community rating"
    - name: "Test Case Quality"
      operationalization: "Exclude problems with duplicate test cases or poor coverage via community ratings"
    - name: "Temperature/Sampling"
      operationalization: "Fixed temperature=0.7 for all agents to control randomness"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Agent receives multiple test case failures simultaneously and must identify which errors share root causes vs. which are independent bugs."
      evidence: "Dr. Nova's implicit curriculum discovery concept - agents must cluster errors by conceptual similarity without pre-labeled taxonomy"
      falsifier: "If agents address errors in arbitrary order uncorrelated with error type similarity, root cause identification is not occurring"
    - step: 2
      description: "Agent prioritizes fixes based on identified root causes, targeting modifications that resolve multiple test failures (high fix-impact-ratio)."
      evidence: "Prof. Vera's Prediction 1 - high-performing agents should show fix-impact-ratio > 2.0 vs baseline ~1.0"
      falsifier: "If fix-impact-ratio does not differ significantly from random baseline (p >= 0.05), strategic prioritization is not measurable"
    - step: 3
      description: "Agent applies learned patterns from revealed test failures to predict and fix held-out test failures without seeing their error messages (transfer learning)."
      evidence: "Prof. Vera's Prediction 3 - held-out test pass rate should increase faster than random baseline (slope > 1.5×)"
      falsifier: "If held-out test pass rate matches random permutation baseline, no transfer learning is occurring"
  key_tension: "Error type clustering (Step 1) requires manual labeling for validation, creating measurement circularity risk if annotation agreement is low (kappa < 0.7)"
  evidence_summary: |
    Mechanism supported by three independent, execution-based measurements (no model-based
    judges required). Prof. Pax validated technical feasibility. Prof. Rex identified
    labeling circularity risk, mitigated by pilot annotation study with inter-annotator
    agreement check.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Error types (syntax, runtime, logic, edge case) exhibit within-problem clustering signal detectable via annotation or embedding similarity"
    supporting_evidence: "Prof. Rex's acceptance contingent on inter-annotator agreement (kappa > 0.7) for manual labels"
    consequence_if_violated: "Prediction 2 (error clustering) becomes unmeasurable; fall back to Predictions 1 & 3 only"
  - id: "A2"
    assumption: "Codeforces test suites are of sufficient quality (non-duplicate, good coverage) after filtering by solve count >1000"
    supporting_evidence: "Prof. Pax's quality filtering strategy using community ratings"
    consequence_if_violated: "Fix-impact-ratio becomes noisy; need additional curation or benchmark switch"
  - id: "A3"
    assumption: "50% held-out test methodology isolates transfer learning signal from information-based improvement"
    supporting_evidence: "Prof. Vera's design - agents never see held-out error messages, so passing them requires pattern transfer"
    consequence_if_violated: "Prediction 3 conflates learning with test case informativeness; need different held-out strategy"
  - id: "A4"
    assumption: "Three agent architectures (GPT-4, GPT-4+memory, GPT-4+error-prompt) exhibit sufficient variance in strategic debugging ability"
    supporting_evidence: "Dr. Ally's expectation that memory-augmented agents should outperform baseline"
    consequence_if_violated: "All architectures show similar performance; need to test more diverse architectures or hypothesis is falsified"
  - id: "A5"
    assumption: "Phase 1 validation (50 problems) provides sufficient statistical power to detect differences (p < 0.05)"
    supporting_evidence: "Dr. Ally's two-phase design - validate on 50, scale to 200 if validated"
    consequence_if_violated: "Increase Phase 1 problem count or accept higher p-value threshold (p < 0.10)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Code generation tasks with multiple test cases per problem (10+ test cases),
    where error feedback is execution-based (not human-labeled). Applicable to
    competitive programming problems (Codeforces, LeetCode), algorithm challenges,
    and potentially GitHub issue solving if test suites are available.
  does_not_apply_to: |
    Single-test benchmarks (HumanEval with 1 test/problem), tasks requiring subjective
    code quality assessment (style, maintainability), or problems where test cases are
    poorly designed (duplicates, incomplete coverage). Also excludes tasks with <10
    test cases (insufficient signal for clustering or held-out methodology).
  known_limitations: |
    - Measurement requires problems with pedagogically diverse test cases (not guaranteed in Codeforces)
    - Error type taxonomy (Prediction 2) depends on manual labeling quality
    - Framework measures debugging ability, not generation quality — agents that generate
      correct code on first attempt bypass the framework entirely
    - Limited to execution-based metrics; does not capture code efficiency or maintainability

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "High-performing agents demonstrate root cause identification by achieving fix-impact-ratio > 2.0 (one code modification resolves 2+ test failures on average), while baseline agents show ratio ~1.0."
    test_method: "Run agents on 50 Codeforces problems with 15+ test cases. For each code modification, count Δpassing_tests. Calculate mean fix-impact-ratio per agent."
    success_criterion: "At least one architecture shows fix-impact-ratio > 2.0 AND statistically significant difference from baseline (p < 0.05 via t-test or Mann-Whitney U)"
    falsification: "All architectures show fix-impact-ratio <= 1.5 OR no significant difference from baseline (p >= 0.05)"
  - id: "P2"
    primary: false
    statement: "Agents with conceptual understanding fix similar error types consecutively (error clustering coefficient > 0.3), while baseline agents show random ordering (coefficient ~0.0)."
    test_method: "Manually label error types for 50 problems × 15 test cases (750 labels). Measure clustering coefficient = observed_consecutive_same_type / expected_random. Validate with inter-annotator agreement (Cohen's kappa > 0.7)."
    success_criterion: "At least one architecture shows clustering coefficient > 0.3 AND statistically significant difference from random baseline (p < 0.05 via permutation test)"
    falsification: "All architectures show clustering coefficient < 0.2 OR kappa < 0.7 (unreliable labels) OR no significant difference from random baseline"
  - id: "P3"
    primary: false
    statement: "Agents exhibit transfer learning by passing held-out test cases (50% held out, error messages not shown) at rate > 1.5× random baseline slope."
    test_method: "Reveal 50% of test failures to agent. Track held-out test pass rate per iteration. Compare agent's slope (held_out_passing_rate vs iteration) to random code mutation baseline slope."
    success_criterion: "At least one architecture shows held-out slope > 1.5× random baseline slope AND statistically significant difference (p < 0.05 via permutation test with 1000 random mutation samples)"
    falsification: "All architectures show held-out slope <= 1.2× random baseline OR no significant difference (p >= 0.05)"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "Codeforces Competitive Programming Problems (Curated Subset)"
    type: "standard"
    source: "Codeforces.com (publicly available)"
    path: "Phase 4 will curate subset - filter by solve_count > 1000 AND rating 1200-1800 (intermediate difficulty)"
    hypothesis_fit: |
      Codeforces problems provide 15-50 test cases per problem with diverse error types
      (syntax, runtime, logic, edge cases). High solve counts indicate quality test suites.
      Publicly available, no licensing issues. Intermediate difficulty (1200-1800 rating)
      ensures problems are non-trivial but solvable by current LLMs.
  model:
    name: "GPT-4 Turbo (baseline), GPT-4 with memory module, GPT-4 with error analysis prompt"
    type: "Large Language Models (code generation variants)"
    source: "OpenAI API (GPT-4), custom memory/prompt wrappers"
    hypothesis_fit: |
      GPT-4 is state-of-the-art for code generation. Memory module tests whether
      retaining past error information improves strategic debugging. Explicit error
      analysis prompt tests whether prompting for root cause identification is sufficient.
      Three architectures provide variance needed to validate framework's discriminative power.
  baselines:
    - name: "Random Sampling Baseline"
      method: "Sample from GPT-4 output distribution repeatedly without error feedback (temperature=0.7)"
    - name: "Sequential Trial-and-Error Baseline"
      method: "Address test failures one-by-one in order without clustering or prioritization"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Evaluation framework for strategic debugging ability in code generation agents - not measurable with existing pass@k or HumanEval-style benchmarks"
  key_innovation: |
    Shifts evaluation paradigm from "did it pass the test?" to "how efficiently did it debug?"
    Three-metric framework (fix-impact-ratio, error clustering, predictive fixing) operationalizes
    "agentic capability" in measurable, execution-based terms without requiring new benchmarks or
    human evaluation.
  differentiation:
    - prior_work: "HumanEval, MBPP - single-attempt pass@k metrics"
      difference: "Measures iterative improvement and strategic debugging, not just correctness"
    - prior_work: "LeetCode-based benchmarks - total test pass rate"
      difference: "Analyzes *how* tests are passed (root cause identification, transfer learning) not just final pass rate"
    - prior_work: "Model-based judges for code quality (GPT-4 as judge)"
      difference: "Uses execution-based metrics only, no subjective assessment - higher reliability (Prof. Pax's concern addressed)"

