# ═══════════════════════════════════════════════════════════════
# SECTION 5: Risks & Mitigations (From Prof. Rex's Concerns)
# ═══════════════════════════════════════════════════════════════

risks:
  - risk_id: "R1"
    description: "Inter-annotator agreement < 0.7 for error type labels (Prediction 2)"
    severity: "MEDIUM"
    likelihood: "MEDIUM"
    mitigation: |
      Pilot annotation on 10 problems with 2-3 annotators. If kappa < 0.7, either
      (a) refine error taxonomy with clearer definitions and examples, or
      (b) skip Prediction 2 in Phase 1 and focus on label-free Predictions 1 & 3.
    fallback: "Focus on Predictions 1 & 3 only (both label-free, execution-based)"
  - risk_id: "R2"
    description: "Codeforces test suite quality variance (duplicate tests, poor coverage)"
    severity: "MEDIUM"
    likelihood: "LOW"
    mitigation: |
      Filter by solve_count > 1000 and community rating. Manually review 10 sample
      problems to validate quality before full curation.
    fallback: "Switch to LeetCode (proprietary but higher quality) or reduce problem count and increase manual review"
  - risk_id: "R3"
    description: "All agent architectures show similar performance (no variance to detect)"
    severity: "HIGH"
    likelihood: "LOW"
    mitigation: |
      Include diverse architectures: baseline GPT-4, memory-augmented, error-prompted,
      potentially open-source models (CodeLlama, StarCoder) if needed for variance.
    fallback: "Hypothesis is falsified - strategic debugging ability is not architecturally dependent OR framework lacks discriminative power"
  - risk_id: "R4"
    description: "Phase 1 (50 problems) lacks statistical power (p >= 0.05 despite real effects)"
    severity: "MEDIUM"
    likelihood: "LOW"
    mitigation: |
      Dr. Ally's two-phase design - if Phase 1 shows trends (p < 0.10 but not < 0.05),
      proceed to Phase 2 (200 problems) for higher power.
    fallback: "Accept p < 0.10 threshold for Phase 1 exploratory validation"

