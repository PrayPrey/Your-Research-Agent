# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "We measure HOW agents debug (fix-impact-ratio 3.90 vs 1.07), find two-stage mechanism works (clustering → prioritization) but transfer fails"
    structure_notes: |
      S1: Problem (benchmarks measure outcome, not process)
      S2: Our approach (fix-impact-ratio framework)
      S3-4: Main results (ratio 3.90, clustering 1.909, transfer FAILED)
      S5-6: Insight (feedback loop, not learning system) + significance (new evaluation dimension)
    avoid:
      - "Citations"
      - "'Remarkable success of LLMs'"
      - "Vague claims like 'substantial improvement'"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"
    hook_strategy: "Puzzle + counterintuitive finding: 'pass@k measures whether but not how' + 'clustering works but transfer fails'"
    problem_escalation: |
      1. Surface: existing benchmarks measure correctness (pass@k)
      2. Deeper: multi-test scenarios expose debugging efficiency invisible to pass@k
      3. Gap: no metrics for strategic vs sequential debugging process
    insight_preview: "Fix-impact-ratio discriminates strategies (ratio > 2.0 strategic, ≈ 1.0 sequential); experiments reveal clustering+prioritization work but transfer fails — strategic debugging is feedback loop, not learning"
    contributions_framing: |
      "Building on this insight, we contribute:
      (1) Fix-impact-ratio framework with three execution-based metrics
      (2) Experimental validation: two-stage mechanism verified (d=3.07), transfer falsified
      (3) Theoretical clarification: strategic debugging = feedback loop, not autonomous prediction"
    transition_to_related_work: "Our framework extends existing benchmarks (HumanEval, LeetCode) by measuring debugging process..."

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "We EXTEND correctness benchmarks (HumanEval/MBPP) with process metrics, COMPLEMENT execution-feedback approaches (RL training), DIFFER from model-based judges (execution-based, no subjective assessment)"
    key_comparison_points:
      - area: "Code generation benchmarks (HumanEval, MBPP, LeetCode)"
        limitation_to_highlight: "Measure final pass rate, not iterative debugging process — pass@k captures 'whether' not 'how'"
        how_we_differ: "We measure debugging trajectory: fix-impact-ratio (tests per modification), clustering coefficient (pattern recognition), held-out slope (generalization attempt)"
      - area: "Execution feedback in RL (RLEF, CodeRL)"
        limitation_to_highlight: "Use feedback for training, don't measure improvement patterns as evaluation metric"
        how_we_differ: "We measure strategic behavior during debugging (clustering, prioritization) as evaluation framework, orthogonal to training method"
      - area: "SWE-bench (GitHub issue solving)"
        limitation_to_highlight: "Evaluates issue resolution success, not debugging efficiency if test suites available"
        how_we_differ: "Our framework could extend to SWE-bench when test suites exist — measure how efficiently agents pass tests, not just whether they solve issue"
    papers_to_discuss:
      - "HumanEval (Chen et al.) — foundational correctness benchmark we extend"
      - "Execution feedback in code generation — complementary training approach"
      - "LeetCode-based benchmarks — use multi-test structure but measure total pass rate"
    avoid:
      - "Dismissing prior work unfairly"
      - "Missing HumanEval/MBPP (field standards)"
      - "Over-claiming novelty (acknowledge execution feedback exists in RL context)"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem (measures strategic debugging process)"
    connection_to_insight: "Framework operationalizes 'strategic debugging' via three metrics testing feedback-loop stages: clustering (error pattern recognition), fix-impact-ratio (prioritization efficiency), held-out slope (transfer attempt)"
    key_design_decisions:
      - decision: "Fix-impact-ratio = Δpassing_tests / num_modifications (continuous ratio, not binary pass/fail)"
        rationale: "Captures multi-test fixes vs single-test fixes — strategic agents resolve root causes (ratio > 2.0), sequential agents address one failure at a time (ratio ≈ 1.0)"
        alternatives_considered: "Binary 'root cause fix' labels (requires manual annotation, circular). Total pass rate (conflates debugging efficiency with problem difficulty)."
      - decision: "Clustering coefficient = observed_consecutive_same_type / expected_random (permutation test baseline)"
        rationale: "Detects pattern recognition in fix sequence — agents cluster similar errors (coefficient > 0.3) vs random ordering (≈ 0.0). Permutation test controls for problem-specific error distributions."
        alternatives_considered: "Manual error type labels (kappa risk, circularity). Embedding-based similarity (no ground truth for validation)."
      - decision: "50% revealed / 50% held-out test split with slope ratio measurement"
        rationale: "Isolates transfer learning — agents never see held-out error messages, passing them requires pattern generalization. Slope ratio (agent / random) controls for test difficulty."
        alternatives_considered: "Leave-one-out (too noisy per problem). Full held-out (no revealed tests for clustering). Slope ratio provides normalized metric across problems."
    intuition_building: |
      Figure 1 (fix-impact distribution): histogram showing strategic (mean 3.90) vs baseline (mean 1.07) clearly separated
      Walkthrough: Agent sees tests 1,3,5 fail with 'index error' → clusters as shared root cause → one fix passes all three (fix-impact = 3) → repeat
    technical_depth_balance: |
      Main paper: metric definitions, experimental protocol, result interpretation (WHY design choices)
      Appendix: implementation details (error type taxonomy, permutation test procedure, statistical tests)

  experiments:
    narrative_purpose: "Design experiments that test our specific claims (P1: ratio discriminates, P2: clustering exists, P3: transfer works)"
    experimental_questions:
      - question: "Does fix-impact-ratio discriminate strategic from sequential debugging?"
        experiment: "h-e1: controlled trajectories with known clustering (strategic) vs random ordering (baseline), measure ratio separation + effect size"
        expected_outcome: "Strategic ratio > 2.0, baseline ≈ 1.0, p<0.05, large effect size (d > 0.8)"
      - question: "Do agents cluster errors by type?"
        experiment: "h-m1: mock agents with clustering_strength parameter, measure coefficient vs random permutation baseline"
        expected_outcome: "Clustering coefficient > 0.3, p<0.05 (permutation test), agent > random"
      - question: "Does clustering enable prioritization of high-impact fixes?"
        experiment: "h-m2: compare proposed (cluster-based) vs baseline (random) agents, measure proportion of high-impact fixes (Δpassing ≥ 2)"
        expected_outcome: "Proposed > baseline, p<0.05 (directional test), 2× improvement"
      - question: "Do agents transfer patterns to held-out tests?"
        experiment: "h-m3: pattern memory module, 50% revealed/held-out split, measure held-out slope (agent vs random)"
        expected_outcome: "Agent slope > 1.5× random, p<0.05 — ACTUAL: FAILED (ratio 0.82, p=0.504)"
    baseline_rationale: "Random sampling (no error feedback) and sequential trial-and-error (address failures one-by-one) represent non-strategic approaches — establish discriminative power of metrics"
    dataset_rationale: "Mock synthetic problems (sum, max, array ops) with controlled error types (syntax, runtime, logic, edge case) — validate metric sensitivity before real Codeforces deployment"
    metric_rationale: "All execution-based (no model judges, no subjective assessment) — fix-impact-ratio (efficiency), clustering coefficient (pattern recognition), held-out slope (generalization attempt)"
    fairness_considerations: |
      Same problem difficulty (mock data, controlled parameters)
      Same iteration budget (max_iterations=10)
      Same evaluation protocol (permutation tests, 1000 samples, p<0.05 threshold)

  results:
    narrative_purpose: "Present evidence supporting claims (P1/P2 supported with large effects, P3 refuted cleanly)"
    main_result_highlight: "Fix-impact-ratio achieves 3.6× separation (3.90 vs 1.07) with Cohen's d=3.07 (very large effect) — metric has strong discriminative power"
    result_presentation_order:
      - result: "h-e1 fix-impact-ratio discrimination (strategic 3.90 vs baseline 1.07, p=0.0001, d=3.07)"
        purpose: "Establish core metric works — validates framework's foundational measurement capability (P1)"
      - result: "h-m1 clustering coefficient (agent 1.909 vs random 0.950, p=0.001, 2× baseline)"
        purpose: "Show agents cluster errors by type — validates mechanism Step 1 (error pattern recognition)"
      - result: "h-m2 prioritization efficiency (42.5% vs 19.8% high-impact fixes, 2.15× improvement)"
        purpose: "Show clustering enables prioritization — validates mechanism Step 2 (root cause targeting)"
      - result: "h-m3 transfer learning failure (slope ratio 0.82 < 1.5, p=0.504, 0% pattern usage)"
        purpose: "Clear negative result — establishes scope boundary (feedback loop, not learning system)"
    surprising_result_handling: "Transfer failure surprising given clustering success — interpreted as evidence strategic debugging requires error messages (post-hoc clustering) vs prediction without feedback (pre-emptive transfer), different capabilities"
    avoid:
      - "Hiding h-m3 failure (honest reporting critical)"
      - "Table dumping without interpretation"
      - "Over-claiming generalization (mock implementation, not real GPT-4)"

  discussion:
    narrative_purpose: "Interpret results (two-stage mechanism confirmed, transfer refuted), acknowledge limits (mock validation), show significance (new evaluation dimension)"
    key_findings_interpretation: "Validated two-stage mechanism (clustering → prioritization) explains strategic debugging within test-feedback loops. Transfer failure clarifies scope: framework evaluates iterative debugging with error access, not autonomous code understanding. Feedback-dependent improvement ≠ pattern-based generalization."
    honest_limitations:
      - limitation: "Transfer learning mechanism failed (Pattern prediction doesn't work)"
        why_acceptable: "Core contribution (framework + two-stage mechanism) remains valid — transfer was secondary prediction, its failure refines theoretical understanding"
        future_mitigation: "Test alternative transfer designs (few-shot learning, oracle patterns) to distinguish pattern quality vs fundamental limitation (FW1, FW2)"
      - limitation: "Mock implementation (Not real GPT-4 or Codeforces)"
        why_acceptable: "Phase 4 validated metrics work (discriminative power on controlled data) — whether production agents possess strategic behavior is separate question"
        future_mitigation: "Replicate with real OpenAI API + curated Codeforces subset (FW3) to confirm ecological validity"
      - limitation: "Causal chain incomplete (Only 2 of 3 mechanism steps verified)"
        why_acceptable: "Partial mechanism (clustering → prioritization) provides coherent explanation for feedback-based debugging even without transfer"
        future_mitigation: "Investigate why transfer failed (pattern quality analysis FW1, oracle pattern test FW2)"
      - limitation: "Scope limited to multi-test problems (15+ test cases, balanced error types)"
        why_acceptable: "Scope boundaries principled — clustering requires diverse errors, statistical power requires sufficient tests"
        future_mitigation: "Test framework on <10 test case problems (FW6) to identify lower bound for clustering signal"
    broader_impact_statement: "Framework enables measuring debugging efficiency — beneficial for agent development (identify architectural improvements), no foreseeable negative societal impacts (evaluation tool, not deployment system). Ecological validity unverified (mock agents), production deployment would require real-world validation."

  conclusion:
    narrative_purpose: "Reinforce key message (feedback loop, not learning) + open future (real-world validation, alternative transfer designs)"
    callback_to_hook: "We opened with the puzzle: benchmarks measure whether but not how. Our framework reveals how agents debug — clustering errors (2× random), prioritizing fixes (ratio 3.90 vs 1.07), but failing to transfer patterns (ratio 0.82) — strategic debugging is a feedback loop, not a learning system."
    memorable_ending: "As agents move from single-attempt generation to iterative problem-solving, understanding *how* they improve matters as much as *whether* they succeed. Fix-impact-ratio opens this measurement dimension."
    future_work_vision: "Immediate: validate with real GPT-4 + Codeforces to confirm ecological validity. Longer-term: multi-capability benchmark suite (debugging efficiency, test coverage, code efficiency) beyond correctness paradigm. Open question: can any pattern-based mechanism enable transfer, or is predictive debugging fundamentally information-limited without test execution?"

