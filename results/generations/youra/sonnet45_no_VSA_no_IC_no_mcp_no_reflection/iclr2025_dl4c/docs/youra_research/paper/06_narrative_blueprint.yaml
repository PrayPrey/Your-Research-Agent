# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      Current code generation benchmarks measure *whether* agents produce correct code
      (HumanEval pass@k), but not *how* they debug failing code. We introduce fix-impact-ratio,
      a metric that discriminates strategic debugging (ratio 3.90: one fix resolves 3-4 test
      failures by targeting root causes) from sequential trial-and-error (ratio 1.07: one fix
      per failure).
    strategy: "puzzle_plus_counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Existing benchmarks miss a critical dimension of agentic capability: debugging efficiency"
    concrete_example: "An agent may pass 95% of tests but achieve this through 100 random modifications (inefficient) or 10 strategic root-cause fixes (efficient) — current metrics can't distinguish these"
    stakes: "Without debugging-process metrics, we can't measure or improve agents' iterative problem-solving ability, limiting progress toward autonomous software development"

  real_world_impact:
    application_domain: "LLM-based code generation agents for competitive programming, GitHub issue solving, automated debugging"
    potential_beneficiaries: "ML researchers designing agent architectures, practitioners deploying code generation tools"
    scale_of_impact: "Extends to any multi-test programming task where agents iterate with execution feedback"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Code generation benchmarks (HumanEval, MBPP) measure outcome (did the code pass?) but not process (how efficiently did the agent debug?)"
    common_understanding: "pass@k metrics suffice for evaluating code generation capability"

  deeper_problem:
    description: "Agentic debugging requires strategic behavior (identify root causes, prioritize high-impact fixes) invisible to pass@k — agents may succeed through brute-force iteration without conceptual understanding"
    why_overlooked: "Single-attempt benchmarks (1-5 tests per problem) don't require iterative debugging; multi-test scenarios (15+ tests) expose strategic vs sequential behavior but existing work focuses on final pass rate, not debugging trajectory"
    our_perspective: "Debugging efficiency reveals conceptual understanding — clustering errors by type (2× random rate) and prioritizing multi-test fixes (ratio 3.90 vs 1.07) indicate strategic debugging distinct from trial-and-error"

  gap_in_existing_work:
    description: "No execution-based metrics quantify *how* agents debug — existing work measures *whether* they succeed (correctness) but not debugging process (efficiency, pattern recognition, transfer learning)"
    why_gap_exists: "Competitive programming benchmarks (Codeforces, LeetCode) report total pass rate; HumanEval/MBPP use single-attempt pass@k; SWE-bench evaluates GitHub issue resolution without debugging-process metrics"
    why_gap_matters: "Can't distinguish strategic debugging (conceptual understanding) from sequential trial-and-error (brute force) — limits ability to design/evaluate agents with true iterative problem-solving capability"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Strategic debugging operates as a feedback loop (error → cluster → prioritize → fix → repeat), not a learning system (observe → extract → predict → generalize) — agents cluster errors and prioritize fixes effectively within revealed test feedback but fail to transfer patterns to unseen test cases."
    expanded_explanation: |
      Experiments validate a two-stage mechanism: (1) agents cluster errors by shared characteristics
      at 2× random rate (coefficient 1.909 vs 0.950, p=0.001), then (2) prioritize fixes targeting
      larger clusters, achieving 2.15× higher proportion of high-impact fixes (42.5% vs 19.8%).
      However, pattern-based transfer to held-out tests failed (slope ratio 0.82 < 1.5, 0% pattern usage),
      revealing strategic debugging is feedback-dependent, not predictive.

  why_others_missed_it:
    common_assumptions: "Clustering errors suggests 'conceptual understanding' → should enable transfer learning to predict failures on unseen tests without error messages"
    our_different_view: "Post-hoc clustering (analyzing revealed error messages) requires different capability than predictive transfer (anticipating failure modes without observations) — clustering enables prioritization within feedback loop but doesn't generalize to unseen cases"
    enabling_factor: "Held-out test methodology (50% revealed, 50% withheld) exposed transfer failure — agents passed held-out tests at random rate (slope 0.0006) despite successful clustering on revealed tests"

  what_makes_it_work:
    intuitive_explanation: "When agents see error messages like 'test 3 failed: index out of range' and 'test 8 failed: index out of range', they cluster these as shared root cause and fix both with one modification (high-impact fix). This works for revealed tests but doesn't enable predicting test 15 will fail without executing it first."
    key_mechanism: "Clustering coefficient measures consecutive fixing of same-type errors (observed > expected_random). Fix-impact-ratio measures tests passed per modification (strategic > 2.0, sequential ≈ 1.0). Held-out slope measures pattern transfer to unseen tests (agents ≈ random, no transfer)."
    analogy: "Like debugging a car: strategic mechanic groups similar symptoms (all dashboard lights off → battery issue), fixes root cause. But can't predict unseen failures without new symptoms — clustering past errors ≠ predicting future ones."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Fix-impact-ratio framework discriminates strategic from sequential debugging with large effect size; agents demonstrate two-stage mechanism (clustering → prioritization) but not transfer learning"
    measurable_criteria: "P1: fix-impact-ratio > 2.0 (strategic) vs ≈ 1.0 (sequential), p<0.05 | P2: clustering coefficient > 0.3, p<0.05 | P3: held-out slope ratio > 1.5× baseline (FALSIFIED)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Fix-impact-ratio achieves 3.6× separation: strategic 3.90 vs baseline 1.07, Cohen's d=3.07 (very large effect), p=0.0001"
      so_what: "Metric has strong discriminative power — can clearly detect strategic behavior when present"
      how_it_supports_claim: "Validates P1 (Prediction 1 from Phase 2A): ratio > 2.0 threshold met, establishes framework's core measurement capability"

    - id: "evidence_2"
      what: "Agent clustering coefficient 1.909 vs random 0.950 (2.01× baseline), p=0.001, 50 problems, 986 fixes"
      so_what: "Agents demonstrably group same-type errors consecutively at twice random rate — pattern recognition in debugging behavior confirmed"
      how_it_supports_claim: "Validates P2 and causal mechanism Step 1: clustering enables agents to recognize shared root causes, driving high fix-impact-ratio"

    - id: "evidence_3"
      what: "Root cause prioritization achieves 42.5% high-impact fixes (Δpassing ≥ 2) vs baseline 19.8%, 2.15× improvement"
      so_what: "Prioritizing clustered errors yields fixes passing multiple tests simultaneously — practical efficiency gain over sequential debugging"
      how_it_supports_claim: "Validates causal mechanism Step 2: clustering → prioritization works, explaining how agents achieve high fix-impact-ratio"

    - id: "evidence_4"
      what: "Transfer learning FAILED: h-m3 slope ratio 0.82 < threshold 1.5, p=0.504 (not significant), 0% pattern usage, agent slope 0.0006 vs random 0.0008"
      so_what: "Clear negative result — pattern extraction worked but application to held-out tests failed, agent worse than random"
      how_it_supports_claim: "REFUTES P3 (Prediction 3): strategic debugging limited to revealed test feedback, doesn't extend to predictive generalization — refines understanding from 'learning system' to 'feedback loop'"

  surprising_findings:
    finding: "Transfer learning failed (h-m3) despite clustering success (h-m1) — agents cluster errors at 2× random rate but can't transfer patterns to held-out tests"
    why_surprising: "Phase 2C experiment brief predicted clustering demonstrates 'conceptual understanding' → should enable pattern transfer to unseen tests"
    our_interpretation: "Clustering operates on error messages (post-hoc: 'these 3 failures are syntax errors'), transfer requires predicting without observations (pre-emptive: 'test 15 will fail'). Different capabilities — pattern recognition ≠ causal modeling of code behavior."

  what_results_mean:
    synthesis: "Strategic debugging is a two-stage feedback loop (clustering → prioritization) effective within revealed test execution, not a three-stage learning system (clustering → prioritization → transfer). Framework measures iterative debugging with error access, not autonomous code understanding."
    confidence_level: "HIGH for two-stage mechanism (h-e1/h-m1/h-m2 all PASS, large effect sizes, p<0.05). LOW for generalization beyond revealed tests (h-m3 FAIL, clear negative result)."
    caveats: "All experiments used mock agents (not real GPT-4 API) and synthetic datasets (not real Codeforces). Metric sensitivity validated on controlled data; ecological validity (whether production agents exhibit strategic behavior) unverified."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First execution-based framework measuring *how* agents debug (fix-impact-ratio, clustering, prioritization) rather than *whether* they succeed (pass@k), revealing strategic debugging works as feedback loop, not learning system."
    why_significant: "Enables benchmark design beyond HumanEval correctness paradigm to evaluate iterative debugging capability — critical for autonomous agent development"

  implications:
    for_field: "Shifts evaluation paradigm from outcome metrics (pass@k) to process metrics (debugging efficiency). Opens research direction: designing agents with stronger clustering/prioritization mechanisms, understanding limits of pattern transfer."
    for_practice: "Framework applicable to multi-test scenarios (competitive programming, GitHub issue solving if test suites available). Practitioners can measure debugging efficiency improvements from architectural changes (memory modules, error-analysis prompts)."
    conceptual_contribution: "Clarifies 'agentic capability' in code generation: clustering+prioritization (feedback-based improvement) distinct from transfer learning (autonomous prediction). Refines understanding of what makes agents 'strategic'."

  future_possibilities:
    immediate_extensions: "Validate with real GPT-4 API + Codeforces (confirm mock results generalize). Test alternative transfer mechanisms (few-shot learning, meta-learning). Extend to SWE-bench if test suites available."
    longer_term_vision: "Benchmark suite evaluating multiple agent capabilities (debugging efficiency, test coverage, code efficiency) beyond correctness. Framework for designing agents with verified strategic debugging ability."
    open_questions: "Can pattern quality improvements enable transfer? Is transfer fundamentally information-limited (can't predict without execution)? Do production agents exhibit clustering behavior at same rates as mock validation?"

