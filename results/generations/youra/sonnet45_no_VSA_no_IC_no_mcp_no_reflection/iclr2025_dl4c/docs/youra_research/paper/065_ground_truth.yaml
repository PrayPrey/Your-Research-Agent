# ═══════════════════════════════════════════════════════════════════════════
# VERIFIED MECHANISM
# ═══════════════════════════════════════════════════════════════════════════

causal_mechanism:
  verified_stages:
    - stage: 1
      name: "Error Clustering"
      status: "VERIFIED"
      evidence: "h-m1: coefficient 1.909, p=0.001"
      description: "Agents group same-type errors consecutively at 2× random rate"

    - stage: 2
      name: "Root Cause Prioritization"
      status: "VERIFIED"
      evidence: "h-m2: 42.5% vs 19.8% high-impact fixes, 2.15× improvement"
      description: "Clustering enables prioritization of multi-test fixes"

    - stage: 3
      name: "Pattern Transfer"
      status: "FALSIFIED"
      evidence: "h-m3: slope ratio 0.82 < 1.5, p=0.504, 0% pattern usage"
      description: "Pattern memory failed to enable transfer to held-out tests"

  interpretation:
    working_mechanism: "Two-stage feedback loop: clustering → prioritization"
    falsified_mechanism: "Three-stage learning system: clustering → prioritization → transfer"
    theoretical_refinement: "Strategic debugging = feedback loop (post-hoc clustering on error messages), not learning system (predictive transfer without execution)"

# ═══════════════════════════════════════════════════════════════════════════
# HONEST LIMITATIONS
# ═══════════════════════════════════════════════════════════════════════════

limitations:
  - limitation: "Mock implementation (not real GPT-4 API or Codeforces)"
    severity: "HIGH"
    why_acceptable: "Phase 4 validated metric sensitivity (metrics *can* detect strategic behavior when engineered). Ecological validity (whether production agents exhibit it) is separate question for future work."
    mitigation: "Replicate with real OpenAI API + curated Codeforces subset (FW3)"

  - limitation: "Causal chain incomplete (Stage 3 falsified)"
    severity: "MEDIUM"
    why_acceptable: "Two-stage mechanism (clustering → prioritization) is self-contained and verified. Falsified Stage 3 refines theoretical understanding (feedback loop vs learning system)."
    mitigation: "Investigate pattern quality (FW1), test oracle patterns (FW2), alternative transfer designs (FW7)"

  - limitation: "Scope limited to multi-test problems (15+ test cases)"
    severity: "LOW"
    why_acceptable: "Scope boundaries principled — clustering requires error diversity, statistical power requires sufficient tests. Framework complements HumanEval (1-5 tests) by addressing multi-test scenarios."
    mitigation: "Test framework on <10 test problems to identify lower bound (FW6)"

  - limitation: "Dataset generalization unknown (synthetic data, balanced error types)"
    severity: "MEDIUM"
    why_acceptable: "Metrics designed domain-agnostic (fix patterns, consecutive ordering). Controlled validation establishes PoC; real-world replication confirms generalization."
    mitigation: "Replicate on real Codeforces with unknown error distributions (FW3, FW5)"

# ═══════════════════════════════════════════════════════════════════════════
# FUTURE WORK (GROUNDED IN RESULTS)
# ═══════════════════════════════════════════════════════════════════════════

future_work:
  from_untested_explanations:
    - id: "FW1"
      question: "Is transfer failure due to pattern quality (low coverage/precision) or fundamental limitation?"
      motivation: "h-m3 measured transfer outcomes (slope ratio) but not pattern quality metrics"
      experiment: "Measure pattern coverage (% revealed failures matched) and precision (% pattern predictions correct on held-out tests)"
      expected_outcome: "If patterns show low coverage (<50%) or precision (<30%), improving extraction enables transfer. If quality high (>70%), transfer is fundamentally information-limited."

    - id: "FW2"
      question: "Can oracle (human-labeled) error patterns enable transfer?"
      motivation: "h-m3 used auto-extracted patterns; oracle patterns test whether transfer works with perfect pattern quality"
      experiment: "Provide high-quality human-labeled patterns, measure held-out slope with oracle patterns vs auto-extracted"
      expected_outcome: "If slope ratio > 1.5 with oracle patterns, limitation is pattern extraction quality. If ratio < 1.5 even with oracle, transfer is fundamentally hard."

  from_unverified_assumptions:
    - id: "FW3"
      question: "Do real GPT-4 agents exhibit clustering at coefficient > 0.3 rates on Codeforces?"
      assumption: "A4 (architecture variance), A2 (Codeforces quality) UNVERIFIED due to mock implementation"
      experiment: "Replicate h-e1, h-m1, h-m2 with OpenAI API (GPT-4-turbo, GPT-4+memory, GPT-4+error-prompt) on curated Codeforces subset (solve_count > 1000, manual quality review)"
      success_criterion: "Clustering coefficient > 0.3, fix-impact-ratio > 2.0, p < 0.05 on real data"

  from_scope_extensions:
    - id: "FW5"
      question: "Does framework work on real Codeforces with unknown error distributions?"
      scope: "Mock data used balanced error types (25% each); real distributions may be skewed"
      experiment: "Test framework on Codeforces problems with unknown error distributions (may be 80% logic, 5% syntax/runtime/edge_case)"
      expected_challenge: "Clustering coefficient likely lower if error diversity low, but fix-impact-ratio should remain stable (measures fix patterns independent of error distribution)"

    - id: "FW6"
      question: "Does framework work on <10 test case problems?"
      scope: "15+ tests used; HumanEval has 1-5 tests per problem"
      experiment: "Test on curated low-test-count dataset (5-10 tests per problem)"
      expected_challenge: "Clustering coefficient may drop below 0.3 threshold (insufficient signal), but fix-impact-ratio should still discriminate (strategic 2-3 tests per mod vs baseline 1 test per mod)"

    - id: "FW7"
      question: "Can alternative transfer mechanisms (few-shot, meta-learning) succeed where pattern memory failed?"
      scope: "Current pattern memory (extract → apply) failed; alternative designs untested"
      experiment: "Test few-shot learning (agent sees 2-3 examples of error+fix, applies to held-out), meta-learning (learn strategy from Problem 1-40, apply to 41-50), causal modeling (simulate tests without execution)"
      expected_outcome: "May still fail if predictive debugging is information-theoretically limited (can't predict without execution), but worth testing"

