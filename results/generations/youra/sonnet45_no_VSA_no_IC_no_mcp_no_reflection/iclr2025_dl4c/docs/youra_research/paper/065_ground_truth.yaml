# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 6 Paper Generation
#
# Purpose: Provide verifiable claims and evidence for adversarial review validation

version: "1.0.0"
created_at: "2026-08-28T12:30:00Z"
paper_file: "06_paper.md"
hypothesis_id: "H-StrategicDebug-v1"

# ═══════════════════════════════════════════════════════════════════════════
# CORE CLAIMS
# ═══════════════════════════════════════════════════════════════════════════

core_claims:
  # Prediction 1 (SUPPORTED)
  - id: "P1"
    statement: "Fix-impact-ratio discriminates strategic debugging (ratio > 2.0) from sequential (ratio ≈ 1.0) with large effect size"
    status: "SUPPORTED"
    evidence:
      - source: "h-e1/04_validation.md"
        metric: "Fix-Impact-Ratio"
        strategic_value: 3.90
        baseline_value: 1.07
        statistical_test: "t-test, p=0.0001, Cohen's d=3.07"
        conclusion: "3.6× separation, very large effect size (d > 0.8 threshold)"
      - source: "Figure 1 (fix_impact_distribution.png)"
        description: "Histogram showing clearly separated distributions"
    limitations:
      - "Mock implementation (not real GPT-4 or Codeforces)"
      - "Controlled trajectories (known clustering vs random ordering)"

  # Prediction 2 (SUPPORTED)
  - id: "P2"
    statement: "Agents cluster errors by type at 2× random rate (clustering coefficient > 0.3)"
    status: "SUPPORTED"
    evidence:
      - source: "h-m1/04_validation.md"
        metric: "Clustering Coefficient"
        agent_value: 1.909
        random_value: 0.950
        ratio: "2.01×"
        statistical_test: "Permutation test (1000 samples), p=0.001"
        conclusion: "Clustering coefficient 1.909 >> threshold 0.3, highly significant"
      - source: "50 problems, 986 fixes analyzed"
        description: "Sufficient sample size for statistical power"
    limitations:
      - "Mock agents with clustering_strength=0.5 parameter"
      - "Balanced error types (25% each: syntax/runtime/logic/edge_case), may not reflect real distributions"

  # Mechanism Stage 2 (SUPPORTED)
  - id: "M2"
    statement: "Root cause prioritization yields 2.15× higher proportion of high-impact fixes (42.5% vs 19.8%)"
    status: "SUPPORTED"
    evidence:
      - source: "h-m2/04_validation.md"
        metric: "High-Impact Proportion (Δpassing ≥ 2)"
        proposed_value: "42.5%"
        baseline_value: "19.8%"
        improvement: "2.15×"
        statistical_test: "Directional test, p < 0.05"
        conclusion: "Cluster-based prioritization significantly more effective than random"
      - source: "Figure 2 (proportion_comparison.png)"
        description: "Bar chart with 95% CI, clear separation"
    limitations:
      - "Mock baseline/proposed agents with controlled fix_success_rate parameters"

  # Prediction 3 (REFUTED)
  - id: "P3"
    statement: "Pattern transfer to held-out tests enables slope ratio > 1.5×"
    status: "REFUTED"
    evidence:
      - source: "h-m3/04_validation.md"
        metric: "Held-Out Test Slope Ratio"
        agent_slope: 0.0006
        random_slope: 0.0008
        slope_ratio: 0.82
        threshold: 1.5
        statistical_test: "p=0.504 (not significant)"
        pattern_usage_rate: "0%"
        conclusion: "Transfer learning FAILED — agent worse than random, pattern memory extracted patterns but didn't apply them"
      - source: "Figure 4 (cumulative_tests.png)"
        description: "Held-out curves: agent overlaps random baseline, no transfer signal"
    theoretical_interpretation: "Strategic debugging is feedback loop (requires error messages) not learning system (autonomous prediction)"

