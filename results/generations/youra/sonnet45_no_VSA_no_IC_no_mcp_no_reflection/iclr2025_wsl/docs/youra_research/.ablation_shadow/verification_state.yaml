main_hypothesis:
  id: H-WeightOrthogonality-v1
  title: Orthogonal Expressivity of Weight-Processing Backbones
  statement: Under the domain of neural network weight-space learning, if we process weights with multiple backbone architectures
    (transformer, equivariant GNN, MLP) that target orthogonal structural properties (global dependencies, permutation symmetry,
    local patterns), then combining their learned representations will significantly outperform individual backbones on weight-to-property
    prediction and anomaly detection tasks (>5% on property prediction, >10% on backdoor detection), because each architecture
    captures complementary aspects of weight structure that individual backbones miss.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: timm Model Zoo + Backdoor Benchmark
    model: Transformer, Equivariant GNN, MLP backbones
    optimizer: Same optimizer/schedule for all backbones
    hyperparameters:
      parameter_matching: Capacity-matched architectures
      training_procedure: Consistent across backbones
      weight_tokenization: Layer-wise processing
