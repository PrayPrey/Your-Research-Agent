# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Backbone Architecture Configuration"
      type: "categorical"
      operationalization: "Which backbone(s) used: (A) Transformer only, (B) Equivariant GNN only, (C) MLP only, (D) Transformer+GNN concatenation"
      levels: ["Transformer", "Equivariant GNN", "MLP", "Transformer+GNN Combined"]
    - name: "Weight Perturbation Type"
      type: "categorical"
      operationalization: "Symmetry-preserving (permute within layer) vs symmetry-breaking (permute across layers)"
      levels: ["Within-Layer Permutation", "Across-Layer Permutation", "No Perturbation"]
  dependent:
    - name: "Property Prediction Accuracy"
      type: "continuous"
      operationalization: "Accuracy (%) predicting model test accuracy from weights, range 0-100, measured on held-out model zoo"
      primary: true
    - name: "Backdoor Detection Accuracy"
      type: "continuous"
      operationalization: "Accuracy (%) detecting backdoored models, range 0-100, measured on existing backdoor dataset"
      primary: false
    - name: "Reconstruction Error Correlation"
      type: "continuous"
      operationalization: "Pearson correlation of reconstruction errors between backbone pairs, range -1 to 1"
      primary: false
  controlled:
    - name: "Architecture Capacity"
      operationalization: "Match parameter counts across backbones (~same model size)"
    - name: "Training Procedure"
      operationalization: "Same optimizer, learning rate schedule, epochs for all backbones"
    - name: "Input Preprocessing"
      operationalization: "Layer-wise weight tokenization applied consistently"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Each backbone architecture's inductive bias aligns with specific weight-space structural properties"
      evidence: "Transformers use self-attention (global dependencies), GNNs use message-passing (locality + graph structure), MLPs have limited receptive field (local patterns only). Architectural priors established in discussion."
      falsifier: "If all backbones show identical attention/receptivity patterns regardless of architecture type"
    - step: 2
      description: "During weight embedding learning, each backbone preferentially captures its aligned property while underperforming on others"
      evidence: "GNN should maintain accuracy on within-layer permutations (symmetry-preserving) but degrade on across-layer permutations; Transformer should degrade similarly on both (no permutation prior)"
      falsifier: "If GNN shows no symmetry differential (<10% gap) or Transformer shows unexpected differential (>20% gap)"
    - step: 3
      description: "The captured properties are orthogonal, leading to low correlation in reconstruction errors"
      evidence: "What Transformer fails to reconstruct (local permutation patterns), GNN succeeds at; vice versa for global patterns. Correlation <0.7 indicates orthogonality."
      falsifier: "If reconstruction error correlation >0.7 between backbones"
    - step: 4
      description: "Concatenating orthogonal embeddings provides complementary information, improving downstream task performance"
      evidence: "Backdoor detection benefits from BOTH local pattern detection (GNN) and global behavior anomaly detection (Transformer). Complementary failure modes reduce worst-case errors."
      falsifier: "If combined embeddings achieve <5% improvement on property prediction OR <10% improvement on backdoor detection"
  key_tension: "Dimensionality vs Structure Preservation - layer-wise processing may lose cross-layer dependencies, but discussion consensus is that most weight-space properties are layer-local"
  evidence_summary: |
    Mechanism grounded in established architectural priors (Transformers = global, GNNs = local+symmetry). Symmetry preservation measurable via perturbation tests. Orthogonality testable via reconstruction error correlation. Complementarity demonstrated via concatenation experiments.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Layer-wise weight processing preserves sufficient structure for hypothesis testing"
    supporting_evidence: "Model stitching work (Lenc & Vedaldi, 2015) shows layers can be analyzed semi-independently; most weight-space properties (permutation, kernel structure) are layer-local"
    consequence_if_violated: "If cross-layer dependencies dominate, layer-wise processing loses signal; would require full-network processing (dimensionality infeasible)"
  - id: "A2"
    assumption: "Property taxonomy (permutation, locality/globality, frequency) is architecture-independent and exhaustive"
    supporting_evidence: "Grounded in mathematical theory (permutation equivariance proven), graph theory (locality vs global), signal processing (frequency content)"
    consequence_if_violated: "Missing properties could explain negative results; taxonomy incompleteness misattributed to hypothesis failure"
  - id: "A3"
    assumption: "Architecture capacity differences are controllable by parameter matching"
    supporting_evidence: "Standard practice in architecture comparison; discussed as control variable"
    consequence_if_violated: "Complementarity could be capacity effect, not structural orthogonality"
  - id: "A4"
    assumption: "Existing backdoor datasets represent realistic weight anomalies"
    supporting_evidence: "Backdoor detection discussed as high-impact application with existing datasets"
    consequence_if_violated: "Backdoor detection gains may not generalize to other anomaly types"
  - id: "A5"
    assumption: "Synthetic networks with known structure provide valid ground truth"
    supporting_evidence: "Two-stage validation (synthetic → real) discussed; synthetic tests as proof-of-concept"
    consequence_if_violated: "Negative results on synthetic may not reflect real-world performance"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Weight-space learning tasks on neural network models
    - Pre-trained models from standard model zoos (timm, HuggingFace)
    - Tasks requiring weight-to-property prediction or anomaly detection
    - Architectures with identifiable layer structure (CNNs, MLPs, Transformers)
  does_not_apply_to: |
    - Architectures without clear layer boundaries (e.g., Neural ODEs, some RNNs)
    - Extremely large models where layer-wise processing is computationally prohibitive
    - Tasks requiring full end-to-end model execution (not weight-based)
  known_limitations: |
    - Layer-wise processing loses some cross-layer dependencies
    - Taxonomy limited to three properties (permutation, locality/globality, frequency)
    - Scalability demonstrated on mid-size models (ResNet50-scale), not billion-parameter LLMs
    - Backdoor detection as primary application; other anomaly types require additional validation

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Concatenated embeddings from Transformer + Equivariant GNN will achieve >5% accuracy improvement over best single backbone on model property prediction task (predicting test accuracy from weights)"
    test_method: "Train three systems: (A) Transformer→embedding→predictor, (B) GNN→embedding→predictor, (C) Concatenate[A_emb, B_emb]→predictor. Measure accuracy on held-out model zoo. Success if C > max(A,B) + 5%."
    success_criterion: "C_accuracy > max(A_accuracy, B_accuracy) + 5 percentage points on held-out model zoo"
    falsification: "If C_accuracy < max(A_accuracy, B_accuracy) + 5%, orthogonality claim is FALSE"
  - id: "P2"
    primary: false
    statement: "Equivariant GNN will show symmetry differential: maintains accuracy on within-layer permutations (P_within ≈ P_original), degrades >30% on across-layer permutations (P_across << P_original). Plain Transformer shows <10% difference between perturbations."
    test_method: "Apply (1) within-layer weight permutations, (2) across-layer permutations to test models. Measure prediction accuracy for each backbone under each perturbation. Calculate differential: |P_within - P_across|."
    success_criterion: "GNN: |P_within - P_across| > 30 percentage points. Transformer: |P_within - P_across| < 10 percentage points."
    falsification: "If GNN shows <30% differential OR Transformer shows >10% differential, equivariance claim is FALSE"
  - id: "P3"
    primary: false
    statement: "Reconstruction error correlation between Transformer and GNN embeddings will be <0.7, indicating orthogonal failure modes"
    test_method: "Train autoencoders: Transformer→embedding→reconstruct weights, GNN→embedding→reconstruct weights. For each test model, compute reconstruction error per weight. Calculate Pearson correlation of error vectors between backbones."
    success_criterion: "Pearson correlation(Transformer_errors, GNN_errors) < 0.7 across test set"
    falsification: "If correlation >0.7, errors are not orthogonal — backbones capture similar information"

