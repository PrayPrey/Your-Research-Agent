    - claim: "Weight-processing backbones capture orthogonal structural properties"
      status: "PROVE_NEW"
      evidence: "Core hypothesis - requires empirical validation"
    - claim: "Complementarity enables >5-10% improvement on anomaly detection"
      status: "PROVE_NEW"
      evidence: "Testable prediction - needs experimental proof"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Build on established symmetries and architectural priors. Focus verification on:
    1. Orthogonality claim (complementarity test)
    2. Symmetry differential (equivariance test)
