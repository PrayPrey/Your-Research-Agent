hypothesis_draft:
  title: "Orthogonal Expressivity of Weight-Processing Backbones"
  hypothesis_id: "H-WeightOrthogonality-v1"
  core_claim: |
    Weight-processing backbone architectures (transformers, equivariant GNNs, MLPs) capture orthogonal structural properties of neural network weight spaces, defined by mathematically-grounded dimensions: permutation equivariance, locality vs. global dependencies, and spectral frequency content. Combining their embeddings enables detection of anomalies that individual backbones miss.
  mechanism: |
    Each architecture's inductive biases align with specific weight-space properties. Equivariant GNNs preserve permutation structure through message-passing respecting graph symmetries. Transformers capture long-range dependencies through global attention. MLPs have limited receptive field for local patterns. These preferential alignments lead to orthogonal embeddings (reconstruction error correlation <0.7), enabling complementarity when concatenated.
  predictions:
    - P1: "Concatenated Transformer+GNN embeddings achieve >5% improvement over best single backbone on model property prediction"
    - P2: "Equivariant GNN shows >30% symmetry differential (within-layer vs across-layer permutations); Transformer <10%"
    - P3: "Reconstruction error correlation between Transformer and GNN <0.7, indicating orthogonal failure modes"

