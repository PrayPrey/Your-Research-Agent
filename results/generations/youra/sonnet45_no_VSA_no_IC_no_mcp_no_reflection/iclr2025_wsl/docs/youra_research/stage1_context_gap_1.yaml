gap_id: gap_1
gap_title: "Comparative Expressivity Analysis of Weight-Processing Backbones"
gap_description: |
  Multiple backbone architectures have been proposed for weight-space learning (plain MLPs,
  transformers, equivariant GNNs, neural functionals), but systematic comparative analysis
  of their expressivity and generalization capabilities is scattered across different research
  communities. Missing: unified theoretical and empirical framework comparing expressivity
  bounds, generalization performance, and computational efficiency across different
  weight-processing backbone architectures on standardized benchmarks.
