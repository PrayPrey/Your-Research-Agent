# ═══════════════════════════════════════════════════════════════
# KNOWN LIMITATIONS (For adversarial attack preparation)
# ═══════════════════════════════════════════════════════════════

known_limitations:
  dataset:
    - "Small scale (100 models, 70 train)"
    - "Vision models only (ResNet, ViT, EfficientNet, ConvNeXt from timm)"
    - "ImageNet pretraining only (no domain transfer)"
    - "Balanced families (25 models each) but limited within-family diversity"

  task:
    - "Coarse-grained family classification (4 classes)"
    - "No within-family discrimination (ResNet-50 vs ResNet-101)"
    - "No property prediction (test accuracy regression)"
    - "No backdoor detection (anomaly task)"

  methodology:
    - "Gate threshold (60%) set without pilot study"
    - "Single random seed (42) for experiments"
    - "Capacity mismatch (baseline 200K, transformer 2M params)"
    - "No bootstrap confidence intervals reported (added retrospectively)"

  generalization:
    - "No NLP transformer weights tested"
    - "No RL policy weights tested"
    - "No diffusion model weights tested"
    - "No billion-parameter LLM weights (exceeds fixed-length padding)"

