    public: true

  code_availability:
    status: "placeholder"
    note: "Code repository link to be added"

  hyperparameters:
    optimizer: "AdamW"
    learning_rate: 1e-4
    weight_decay: 1e-5
    batch_size: 32
    max_epochs: 50
    early_stopping_patience: 10
    dropout: 0.1
    gradient_clip_max_norm: 1.0
    scheduler: "CosineAnnealingLR"
    scheduler_T_max: 50
    scheduler_eta_min: 1e-6

  model_architecture:
    baseline_mlp:
      layers: [256, 128, 4]
      activation: "ReLU"
      input_features: "3 * num_layers (mean/std/norm per layer)"

    weight_transformer:
      d_model: 256
      nhead: 8
      num_encoder_layers: 6
      dim_feedforward: 1024
      dropout: 0.1
      max_token_length: 4096
      positional_encoding: "sinusoidal"
      pooling: "global_mean"

  random_seeds:
    pytorch: 42
    numpy: 42
    python: 42

  evaluation_protocol:
    split_ratios: [0.70, 0.15, 0.15]
    stratified: true
    primary_metric: "test_accuracy"
    secondary_metrics: ["train_accuracy", "val_accuracy", "per_family_accuracy", "confusion_matrix"]

# ═══════════════════════════════════════════════════════════════
# ADVERSARIAL ATTACK VECTORS (Known weaknesses)
# ═══════════════════════════════════════════════════════════════

attack_vectors:
  statistical_power:
    - "70 training samples → limited statistical power"
    - "15 test samples → confidence intervals wide (±4.2%)"
    - "Single random seed → no variance estimate"

  baseline_comparison:
    - "Capacity mismatch (200K vs 2M params) confounds comparison"
    - "Baseline uses different input representation (statistics vs tokens)"
    - "No intermediate baseline (e.g., LSTM, 1D CNN) tested"

  tokenization_strategy:
    - "Fixed length (4096) may truncate large layers or waste space on small layers"
    - "Flattening loses 2D spatial structure in convolutional kernels"
    - "Per-layer normalize may lose cross-layer scale relationships"

  generalization_claims:
    - "No evidence for NLP/RL/diffusion models"
    - "No evidence for within-family discrimination"
    - "No evidence for property prediction or backdoor detection"
    - "Speculation about transformer benefits on larger datasets not tested"

  h_m1_failure:
    - "GNN 20% differential below 30% gate (though above 0%)"
    - "PoC implementation shortcuts (linear layers vs EGNN)"
    - "Small dataset (30 models) and short training (10 epochs)"
    - "Directional evidence exists but magnitude insufficient"

