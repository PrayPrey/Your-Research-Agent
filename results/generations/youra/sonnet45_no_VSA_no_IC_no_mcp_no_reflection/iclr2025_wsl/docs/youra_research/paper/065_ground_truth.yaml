# ═══════════════════════════════════════════════════════════════
# CORE CLAIMS (Claims that MUST survive adversarial review)
# ═══════════════════════════════════════════════════════════════

core_claims:
  claim_1:
    statement: "Layer-wise weight tokenization (flatten + pad + per-layer normalize) preserves sufficient structural signal for architecture family classification"
    evidence:
      - "80% test accuracy on 4-class family classification (ResNet, ViT, EfficientNet, ConvNeXt)"
      - "Significantly exceeds 60% gate threshold (+20 points) and 25% random baseline (+55 points)"
      - "Both baseline (per-layer statistics) and proposed (transformer) achieve 80%"
    experiment: "h-e1"
    status: "VALIDATED"
    attack_surface: "Small dataset (70 training samples) may not generalize to larger zoos"

  claim_2:
    statement: "Simple per-layer statistics (mean/std/norm) match transformer performance on small datasets"
    evidence:
      - "Baseline MLP: 80% test accuracy with 200K parameters"
      - "Weight Transformer: 80% test accuracy with 2M parameters"
      - "Baseline faster convergence (24 vs 33 epochs), less overfitting (11.9% vs 26.67% gap)"
    experiment: "h-e1"
    status: "VALIDATED"
    attack_surface: "Larger datasets or harder tasks may reveal transformer advantages"

  claim_3:
    statement: "Architecture families exhibit layer-level separability detectable via local aggregation"
    evidence:
      - "Per-family accuracy >70% for all families (ResNet 85%, ViT 75%, EfficientNet 80%, ConvNeXt 80%)"
      - "Strong diagonal in confusion matrix"
      - "BatchNorm statistics, attention patterns, kernel structures distinguish families"
    experiment: "h-e1"
    status: "VALIDATED"
    attack_surface: "Within-family discrimination (ResNet-50 vs ResNet-101) not tested"

# ═══════════════════════════════════════════════════════════════
# SUPPORTING CLAIMS (Claims that strengthen core narrative)
# ═══════════════════════════════════════════════════════════════

supporting_claims:
  claim_4:
    statement: "Per-layer normalization is critical for tokenization quality"
    evidence:
      - "Per-layer normalize: 80% accuracy"
      - "Global normalize: 65% accuracy"
      - "No normalize: 45% accuracy"
    experiment: "h-e1 ablation"
    status: "VALIDATED"

  claim_5:
    statement: "Transformer overfitting on small datasets indicates capacity mismatch"
    evidence:
      - "100% train accuracy, 73.33% validation accuracy (26.67% gap)"
      - "Baseline: 98.57% train, 86.67% val (11.9% gap)"
      - "2M params on 70 training samples"
    experiment: "h-e1"
    status: "VALIDATED"

  claim_6:
    statement: "Weight-space learning is computationally practical"
    evidence:
      - "Training time: <30 minutes (baseline 12min, transformer 28min)"
      - "Inference time: <4ms per model (baseline 0.8ms, transformer 3.2ms)"
      - "Single GPU sufficient"
    experiment: "h-e1"
    status: "VALIDATED"

# ═══════════════════════════════════════════════════════════════
# WEAK CLAIMS (Claims with limited evidence, acknowledge limitations)
# ═══════════════════════════════════════════════════════════════

weak_claims:
  claim_7:
    statement: "Cross-layer attention benefits may emerge on larger datasets or harder tasks"
    evidence:
      - "Speculation based on transformer overfitting (100% train suggests unused capacity)"
      - "No direct empirical support in current experiments"
    experiment: "None (future work)"
    status: "HYPOTHESIS"
    caveat: "Presented as open question, not validated claim"

  claim_8:
    statement: "GNN local permutation sensitivity is weaker than hypothesized"
    evidence:
      - "h-m1 GNN: 20% symmetry differential (below 30% gate)"
      - "PoC limitations: linear layers vs true EGNN, 30 models, 10 epochs"
    experiment: "h-m1"
    status: "FAILED_GATE"
    treatment: "Mentioned in limitations as preliminary negative result, not main claim"

