# ═══════════════════════════════════════════════════════════════
# HOOK STRATEGY
# ═══════════════════════════════════════════════════════════════

hook:
  opening_move: "CONCRETE_EXAMPLE"
  concrete_example: |
    Consider two pretrained vision models: ResNet-50 and ViT-Base. Without executing either model,
    can we predict their test accuracy on ImageNet just from their weight tensors? Can we detect
    if one was backdoored during training? Weight-space learning enables models-as-data paradigm,
    where neural network weights themselves become inputs to meta-learning systems.

  problem_statement: |
    Processing neural network weights as data requires preserving architectural signal while handling
    high dimensionality. A ResNet-50 has 25M parameters across 100+ layers with varying shapes.
    How do we tokenize this structure for sequence models without losing layer-specific patterns?

  gap_identification: |
    Prior work in weight-space learning lacks systematic validation of tokenization strategies.
    Do layer-wise embeddings preserve sufficient signal for property prediction? Or do cross-layer
    dependencies dominate, requiring full-network processing?

  contribution_preview: |
    We validate that layer-wise weight tokenization (flatten + pad + per-layer normalize) preserves
    sufficient structural signal for architecture family classification, achieving 80% accuracy
    on timm Model Zoo. Surprisingly, simple per-layer statistics match transformer performance
    on small datasets, suggesting family-level discriminability doesn't require deep cross-layer modeling.

# ═══════════════════════════════════════════════════════════════
# PROBLEM FRAMING (Three Levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  level_1_immediate:
    question: "Does layer-wise weight tokenization preserve sufficient signal for property prediction?"
    why_matters: "Validates foundational assumption for weight-space transformers and meta-learning"
    current_gap: "No systematic evaluation of tokenization quality beyond post-hoc task performance"

  level_2_domain:
    question: "How do different weight-processing backbones (MLP, Transformer, GNN) capture structural properties?"
    why_matters: "Informs architecture choice for model zoos, backdoor detection, neural architecture search"
    current_gap: "Comparative analysis scattered across different tasks without controlled experiments"

  level_3_field:
    question: "Can we treat model weights as first-class data modality like images or text?"
    why_matters: "Enables model synthesis, transfer learning without fine-tuning, model zoo search"
    current_gap: "Weight-space learning lacks standardized benchmarks and tokenization protocols"

# ═══════════════════════════════════════════════════════════════
# KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  core_claim: |
    Layer-wise weight tokenization preserves sufficient structural signal for architecture family
    classification without requiring cross-layer attention, as evidenced by simple per-layer statistics
    matching transformer performance (both 80% accuracy) on small datasets.

  why_non_obvious: |
    Conventional wisdom suggests transformers' cross-layer attention should outperform local statistics.
    However, on 100-model datasets, architecture families exhibit strong layer-level separability
    (BatchNorm statistics, kernel sizes, attention patterns) detectable without global reasoning.

  mechanism_summary: |
    Weight distributions encode architectural priors. Different families (ResNet, ViT, EfficientNet,
    ConvNeXt) have distinct statistical fingerprints:
    - ResNet: BatchNorm layers with residual connections (bimodal weight distributions)
    - ViT: Attention weights with low-rank structure (sparse patterns)
    - EfficientNet: Depthwise separable convolutions (factorized kernels)
    - ConvNeXt: Layer-scaled residuals (scaled weight norms)
    These patterns are detectable via per-layer aggregation (mean/std/norm) without cross-layer modeling.

  empirical_support:
    - "80% test accuracy on 4-class family classification (vs 25% random, 60% gate threshold)"
    - "Baseline MLP (per-layer stats) matches Transformer (cross-layer attention) performance"
    - "Both models exceed gate by +20 percentage points, validating tokenization strategy"

  limitation_acknowledgment: |
    Small dataset size (100 models, 70 train) may favor shallow models. Cross-layer reasoning
    benefits may emerge on larger datasets or harder tasks (property prediction, backdoor detection).

