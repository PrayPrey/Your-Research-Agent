    Mention in Limitations: "Preliminary experiments with equivariant GNN backbones showed
    weaker local permutation sensitivity (20% differential) than hypothesized (30% gate).
    This may reflect PoC implementation shortcuts (simplified linear layers vs true EGNN)
    or indicate weight-space tasks favor global invariance over local equivariance.
    Further investigation with proper EGNN implementation on larger datasets is needed."

  figures_to_include: ["h-e1 gate metrics", "h-e1 training curves", "h-e1 confusion matrix"]
  figures_to_exclude: ["h-m1 symmetry differential (gate failed)"]

  claims_validated: ["Layer-wise tokenization preserves signal", "80% accuracy on family classification"]
  claims_unvalidated: ["Orthogonal backbone complementarity", "GNN local sensitivity"]

  future_work_framing: |
    Frame h-m1 failure as "open question for community" rather than "our negative result":
