# ═══════════════════════════════════════════════════════════════
# WRITING GUIDELINES
# ═══════════════════════════════════════════════════════════════

writing_guidelines:
  tone: "Balanced honest reporting - celebrate h-e1 success, acknowledge h-m1 failure in limitations"

  what_to_emphasize:
    - "80% accuracy validation (strong positive result)"
    - "Baseline competitiveness (methodological rigor)"
    - "Tokenization strategy (flatten + pad + normalize - reusable pattern)"

  what_to_downplay:
    - "h-m1 failure (mention in limitations as 'preliminary GNN results showed weaker differential than hypothesized')"
    - "Transformer overfitting (acknowledge but don't overinterpret)"

  what_to_avoid:
    - "Claiming complementarity (h-m1 failed, h-c1 not tested)"
    - "Overclaiming cross-layer benefits (baseline matched transformer)"
    - "Publishing h-m1 negative result (PoC limitations too severe)"

  uncertainty_language:
    use_when:
      - "Discussing why baseline matched transformer (dataset size hypothesis, not proven)"
      - "Speculating on when cross-layer attention helps (no data)"
      - "Generalizing beyond timm Model Zoo (vision models only)"
    examples:
      - "may reflect small dataset size"
      - "suggests layer-level patterns dominate"
      - "preliminary evidence indicates"

  quantitative_precision:
    - "Always report confidence intervals for test accuracy (bootstrapped)"
    - "Report train/val/test splits explicitly (70/15/15)"
    - "State random seed (42) for reproducibility"

  reproducibility_checklist:
    - "Dataset loading code (timm.create_model)"
    - "Tokenization pseudo-code (flatten + pad + normalize)"
    - "Hyperparameters (lr=1e-4, batch=32, epochs=50)"
    - "Model architecture (d_model=256, nhead=8, num_layers=6)"
    - "Checkpoint links (if publishing)"

