hypothesis_id: h-c1
type: CONDITION
gate: MUST_WORK
statement: High-confidence expert responses (≥4/5 confidence) achieve >70% agreement within ±1 year for major benchmarks (ImageNet, GLUE, SQuAD) when surveyed about saturation timing

# Phase tracking
phases:
  phase2c_experiment_design:
    status: COMPLETED
    date: 2026-08-28
    outputs:
      - 02c_experiment_brief.md

  phase3_implementation_planning:
    status: NOT_STARTED
    date: null
    outputs: []

  phase4_coding_validation:
    status: NOT_STARTED
    date: null
    outputs: []

# Experiment metadata
experiment:
  dataset:
    type: custom
    source: expert_survey
    format: csv_json
    sample_size: 100-150 total responses
    sample_size_high_confidence: 30+ per benchmark

  benchmarks:
    - ImageNet
    - GLUE
    - SQuAD

  success_criteria:
    primary:
      metric: agreement_rate
      threshold: 0.70
      description: "≥70% of high-confidence responses within ±1 year of modal date"

    secondary:
      metric: sample_size
      threshold: 30
      description: "≥30 high-confidence responses per benchmark"

    tertiary:
      metric: fleiss_kappa
      threshold: 0.60
      description: "Fleiss' kappa >0.60 (substantial agreement)"

  baselines:
    - name: null_hypothesis
      description: Random agreement baseline
      expected_performance: "<30% agreement (chance level)"

    - name: raw_agreement
      description: Simple majority agreement (no confidence weighting)
      expected_performance: "50-60% agreement"

    - name: fleiss_kappa
      description: Chance-adjusted agreement for multiple raters
      expected_performance: "κ=0.65-0.75 (substantial agreement)"

  implementation:
    tier: 2
    task_count: 24
    estimated_effort_hours: 31
    calendar_time_weeks: 3-4
    task_breakdown:
      data_preparation: 7
      environment_setup: 3
      core_implementation: 9
      validation: 5

# Gate logic
gate_logic:
  pass_condition: "agreement_rate > 0.70 AND sample_size >= 30 AND fleiss_kappa > 0.60"
  fail_condition: "agreement_rate < 0.50"
  pass_action: "Proceed to H-M1 (score convergence detection) with validated ground truth"
  fail_action: "PIVOT to citation-based validation (SOTA mention decay in published papers)"
  partial_action: "Use ImageNet validation for vision, citation-based for NLP"

# Dependencies
dependencies:
  prerequisites: []
  blocks:
    - H-M1
    - H-M2
    - H-M3
  parent_hypothesis: H-E1

# Research metadata
research:
  assumption_validated: A1
  assumption_statement: "Expert consensus on saturation dates exists and is measurable (>70% high-confidence agreement within ±1 year)"

  contribution_if_pass:
    - "Ground truth dataset: expert consensus saturation dates for ImageNet/GLUE/SQuAD"
    - "Methodological validation: expert consensus can serve as validation anchor for automated detection"

  contribution_if_fail:
    - "Benchmark lifecycle blindspot revealed: ML community lacks shared understanding of saturation timing"
    - "Motivates automated detection infrastructure (community cannot manually coordinate transitions)"

  limitations:
    - "Survey bias: response bias, recency bias, survivorship bias"
    - "Generalization: limited to 3 benchmarks (ImageNet, GLUE, SQuAD)"
    - "Temporal validity: retrospective consensus (2026) may differ from real-time consensus (2019-2020)"

# Version tracking
version: 1
modification_attempt: 0
created_at: 2026-08-28
updated_at: 2026-08-28
