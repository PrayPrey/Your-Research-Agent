  key_innovation: "Rotation infrastructure layer—automated saturation detection with time-boxed validity periods (treating benchmarks as consumables, not monuments)"
  differentiation_summary: |
    Linzen (2022 est.) DESCRIBES saturation problem. Hendrycks (2019) proposes ALTERNATIVE benchmarks.
    This work proposes ROTATION MECHANISMS—the missing infrastructure layer between problem documentation
    and alternative paradigms. Novel contribution analogous to NPM versioning conventions or clinical trial
    pre-registration (field-shaping infrastructure, not just measurement tool).

