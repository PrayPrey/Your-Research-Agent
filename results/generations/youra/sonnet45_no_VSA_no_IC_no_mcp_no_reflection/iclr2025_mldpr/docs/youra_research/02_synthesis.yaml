hypothesis_draft:
  title: "Automated Benchmark Saturation Detection via Dual-Metric Thresholds for Predictable Rotation Infrastructure"
  hypothesis_id: "H-BenchmarkSaturationDetection-v1"
  core_claim: |
    Under active benchmark leaderboards (Papers With Code, 2018-2024), dual-metric saturation
    detection (score convergence <0.5% std for 6mo + velocity decay <0.1/mo for 6mo) aligns
    with high-confidence expert consensus (±1 year, >70% agreement) and predicts community
    migration (>50% citation drop within 6 months), because saturation is a measurable syndrome
    with leading indicators that precede paradigm shifts by >6 months.
  mechanism: |
    Saturation unfolds in three stages: (1) Score convergence as architectural exploration plateaus
    (remaining gains require exponentially more effort), (2) Improvement velocity decay as monthly
    performance gains drop below threshold (<0.1/mo), (3) Saturation signals appear 6-12 months
    BEFORE community migration, enabling predictive rotation windows. Temporal decomposition
    distinguishes internal exhaustion (precedes paradigm shifts) from external disruption
    (follows paradigm shifts).
  predictions:
    - P1: "Historical validation: ≥2/3 benchmarks (ImageNet, GLUE, SQuAD) align with expert consensus (>70% agreement within ±1 year)"
    - P2: "Forward prediction: 'Main results' citations drop >50% within 6mo post-saturation, MNIST control <20%"
    - P3: "Temporal decomposition: ≥60% of detected saturations occur >6mo before paradigm shifts (GPT-3/ViT/LLaMA)"

variables_summary:
  independent: "Saturation detection method (dual-metric vs. score-only vs. velocity-only baselines)"
  dependent_primary: "Expert consensus alignment (% benchmarks within ±1 year of median expert response, high-confidence ≥4/5 only)"
  controlled: "Repository (Papers With Code), domain (vision + NLP), survey sample (50+ researchers, stratified by seniority/domain)"

null_hypothesis:
  h0_statement: |
    There is no significant alignment between algorithmically detected saturation dates
    and expert consensus saturation dates (alignment <50% within ±1 year, or expert
    consensus weak with <50% agreement).
  statistical_test: "Cohen's Kappa (inter-rater agreement between algorithmic detection and expert consensus)"
  significance_level: 0.05

novelty_assessment:
