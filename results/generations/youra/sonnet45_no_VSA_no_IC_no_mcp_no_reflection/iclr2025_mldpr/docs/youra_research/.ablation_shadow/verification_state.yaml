main_hypothesis:
  id: H-BenchmarkSaturationDetection-v1
  title: Automated Benchmark Saturation Detection via Dual-Metric Thresholds for Predictable Rotation Infrastructure
  statement: Under active benchmark leaderboard conditions (Papers With Code, 2018-2024), IF we detect saturation using dual
    metrics—score convergence (std top-5 <0.5% for 6 months) AND improvement velocity decay (<0.1 improvement/month for 6
    months)—THEN detected saturation dates align with high-confidence expert consensus (±1 year, >70% agreement among responses
    rated ≥4/5 confidence), BECAUSE saturation is a multi-metric syndrome with observable leading indicators that precede
    paradigm shifts by >6 months, indicating internal benchmark exhaustion independent of external disruptions.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Papers With Code Leaderboard Snapshots (ImageNet, GLUE, SQuAD, 2018-2024)
    model: Saturation Detection Algorithm (Dual-Metric Threshold)
    optimizer: N/A
    hyperparameters:
      score_convergence_threshold: 0.5
      velocity_decay_threshold: 0.1
      rolling_window_months: 6
      expert_confidence_threshold: 4
      alignment_tolerance_years: 1
