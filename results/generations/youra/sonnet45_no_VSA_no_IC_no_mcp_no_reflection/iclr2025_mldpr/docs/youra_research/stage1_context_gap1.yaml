gap_id: "gap1"
gap_title: "Lack of Standardized Benchmark Rotation Mechanisms"
gap_description: |
  Leaderboard analysis (Linzen 2022 estimated) identifies benchmark dataset overuse and
  saturation problems. Robustness benchmarking (Hendrycks 2019) proposes alternative
  evaluation paradigms. However, no standardized mechanisms exist for rotating deprecated
  benchmarks out of active use or transitioning research communities to new evaluation frameworks.

  Missing pieces:
  - Quantitative metrics for benchmark saturation (e.g., convergence of leaderboard scores, diminishing returns)
  - Automated rotation policies (time-boxed validity periods, performance threshold triggers)
  - Community coordination protocols for benchmark transitions
  - Backward compatibility strategies when benchmarks are deprecated

