# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Benchmark overuse and saturation documented in ML community"
      status: "BUILD_ON"
      evidence: "Linzen et al. (2022 est.) survey identifies leaderboard saturation problem"
    - claim: "Historical benchmarks show diminishing returns over time"
      status: "BUILD_ON"
      evidence: "ImageNet top-5 error: 6.7%→2.3% (2015-2017), then 2.3%→1.8% (2017-2020); GLUE: 15-point improvements (2018-2019), <2-point (2020-2022)"
    - claim: "Alternative evaluation paradigms proposed but not systematically adopted"
      status: "BUILD_ON"
      evidence: "Hendrycks & Dietterich (2019) robustness benchmarks exist without rotation framework"
    - claim: "Saturation detection via multi-metric thresholds is novel infrastructure"
      status: "PROVE_NEW"
      evidence: "No existing work proposes automated rotation mechanisms—Linzen describes problem, Hendrycks proposes alternatives, this work proposes detection + rotation infrastructure"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Build on established facts (benchmark overuse documented, historical diminishing returns visible,
    alternative paradigms exist). Focus Phase 2B validation on PROVE_NEW claim: automated saturation
    detection aligns with expert consensus and predicts community migration. Do NOT re-validate that
    benchmarks get overused—accept as established, test the detection mechanism.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkSaturationDetection-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under active benchmark leaderboard conditions (Papers With Code, 2018-2024),
    IF we detect saturation using dual metrics—score convergence (std top-5 <0.5% for 6 months)
    AND improvement velocity decay (<0.1 improvement/month for 6 months)—
    THEN detected saturation dates align with high-confidence expert consensus (±1 year,
    >70% agreement among responses rated ≥4/5 confidence),
    BECAUSE saturation is a multi-metric syndrome with observable leading indicators that
    precede paradigm shifts by >6 months, indicating internal benchmark exhaustion
    independent of external disruptions.
  alternative_hypothesis_h0: |
    There is no significant alignment between algorithmically detected saturation dates
    and expert consensus saturation dates (alignment <50% within ±1 year, or expert
    consensus weak with <50% agreement).

