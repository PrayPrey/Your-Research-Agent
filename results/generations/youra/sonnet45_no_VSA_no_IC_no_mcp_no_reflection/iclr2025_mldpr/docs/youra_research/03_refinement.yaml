# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Saturation Detection Method"
      type: "categorical"
      operationalization: "Dual-metric (score convergence + velocity decay) vs. single-metric baselines"
      levels:
        - "dual-metric (score std <0.5% for 6mo AND velocity <0.1/mo for 6mo)"
        - "score-only (std <0.5% for 6mo)"
        - "velocity-only (<0.1/mo for 6mo)"
  dependent:
    - name: "Expert Consensus Alignment"
      type: "continuous"
      operationalization: "Percentage of benchmarks where detected saturation date within ±1 year of median expert response (high-confidence ≥4/5 only), range 0-100%"
      primary: true
    - name: "Citation Drop Post-Saturation"
      type: "continuous"
      operationalization: "Percentage decrease in 'main results' citations 6 months post-detected saturation vs. 6 months pre-saturation, range 0-100%"
      primary: false
    - name: "Temporal Lead Time"
      type: "continuous"
      operationalization: "Months between detected saturation and external paradigm shift event (GPT-3, ViT, LLaMA), positive = saturation precedes shift"
      primary: false
  controlled:
    - name: "Benchmark Repository"
      operationalization: "Limit to Papers With Code (consistent data format, leaderboard snapshots 2018+)"
    - name: "Benchmark Domain"
      operationalization: "Include vision (ImageNet) + NLP (GLUE) to test cross-domain generalization"
    - name: "Survey Sample"
      operationalization: "50+ ML researchers, stratified by seniority (junior/senior) and domain (vision/NLP)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Leaderboard scores converge as architectural exploration plateaus—remaining performance gains require exponentially more effort (diminishing returns)"
      evidence: "ImageNet 2015-2017 rapid convergence (6.7%→2.3%), then 2017-2020 slow creep (2.3%→1.8%); GLUE 15-point→<2-point improvements"
      falsifier: "If score variance remains high (std >1%) despite age, no convergence signal exists"
    - step: 2
      description: "Improvement velocity decays measurably—monthly performance gains drop below threshold (<0.1/mo) as optimization space exhausts"
      evidence: "GLUE velocity: 15-point/year (2018-2019) → <2-point/year (2020-2022), SuperGLUE submission frequency dropped 40% (2020-2022)"
      falsifier: "If velocity remains above threshold despite convergence, decay is not predictive"
    - step: 3
      description: "Saturation signals appear BEFORE community migration to alternative benchmarks—providing 6-12 month predictive window"
      evidence: "Temporal hypothesis: saturation detection predicts citation drop >50% within 6 months; saturations occur >6mo before paradigm shifts (GPT-3/ViT/LLaMA)"
      falsifier: "If saturations cluster AFTER paradigm shifts, they're lagging indicators of external disruption, not leading indicators of internal exhaustion"
  key_tension: "Correlation vs. causation—does saturation cause migration, or do paradigm shifts cause both saturation appearance and migration?"
  evidence_summary: |
    Historical evidence (ImageNet/GLUE diminishing returns) supports convergence + velocity decay.
    Temporal decomposition (E3) critical to distinguish internal saturation from external disruption.
    Control condition (MNIST—saturated but retained for ablations) tests whether citation drop
    isolates primary research migration vs. total abandonment.

