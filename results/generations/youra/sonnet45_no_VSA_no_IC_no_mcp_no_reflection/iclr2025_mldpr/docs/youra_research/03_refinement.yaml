predictions:
  - id: "P1"
    primary: true
    statement: "Dual-metric saturation detection on historical benchmarks (ImageNet, GLUE, SQuAD, 2018-2024) aligns with high-confidence expert consensus (≥2/3 benchmarks, >70% agreement within ±1 year)"
    test_method: "Expert survey (50+ researchers, 'When saturated?' + 'Confidence 1-5'), filter ≥4/5 responses, compute median ±IQR, compare with detected saturation dates"
    success_criterion: "≥2/3 benchmarks align, expert consensus >70% agreement within ±1 year"
    falsification: "If <2/3 align OR expert consensus weak (<50% agreement), saturation is not robustly measurable via dual metrics"
  - id: "P2"
    primary: false
    statement: "Forward monitoring on 3 active benchmarks (2024-2025) predicts 'main results' citation drop >50% within 6 months post-detected saturation, while MNIST control (saturated but retained for ablations) shows <20% drop"
    test_method: "Track citations in published papers (6mo pre- vs. 6mo post-saturation), classify 'main results' vs. 'ablation study' usage"
    success_criterion: ">50% drop in 'main results' citations for saturated benchmarks, <20% drop for MNIST control"
    falsification: "If drop <30% OR control shows equivalent drop, mechanism doesn't isolate primary research migration from total abandonment"
  - id: "P3"
    primary: false
    statement: "Detected saturations occur >6 months BEFORE external paradigm shift events (GPT-3 2020, ViT 2021, LLaMA 2023), indicating internal benchmark exhaustion precedes external disruptions"
    test_method: "Temporal analysis: compare saturation detection dates with paradigm shift adoption dates (measured by citation surge in published papers)"
    success_criterion: "≥60% of detected saturations occur >6mo before paradigm shift adoption"
    falsification: "If saturations cluster POST-shift (<3mo lag), they're artifacts of paradigm change, not intrinsic benchmark exhaustion"

