# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Expert consensus on saturation dates exists and is measurable (>70% high-confidence agreement within ±1 year)"
    supporting_evidence: "ImageNet saturation timing likely has community consensus around 2017-2020 window (ResNets plateau → ViT arrival)"
    consequence_if_violated: "Ground truth validation collapses—must pivot to citation-based validation (SOTA mention decay in published papers)"
  - id: "A2"
    assumption: "Saturation is internal to benchmark (architectural exploration exhaustion), not purely driven by external paradigm shifts"
    supporting_evidence: "Temporal hypothesis: saturation signals precede paradigm shifts by >6 months (E3 test)"
    consequence_if_violated: "Mechanism spuriously correlates with unrelated trends—saturation detector becomes lag indicator, not lead predictor"
  - id: "A3"
    assumption: "Papers With Code leaderboard snapshots (2018+) preserve sufficient historical data for retrospective validation"
    supporting_evidence: "PWC archives major benchmarks, submission timestamps available for recent entries"
    consequence_if_violated: "Historical validation limited to post-2020 data, pre-2020 benchmarks excluded, sample size reduced"
  - id: "A4"
    assumption: "'Main results' citations distinguish primary research usage from ablation/diagnostic usage"
    supporting_evidence: "Papers typically declare benchmark used for 'main evaluation' vs. 'ablation study' in methods section"
    consequence_if_violated: "Citation drop metric conflates primary migration with total abandonment—MNIST control addresses this"
  - id: "A5"
    assumption: "Conference policies can incentivize rotation infrastructure adoption without enforcement mechanisms"
    supporting_evidence: "Analogous to data/code availability statements—NeurIPS Benchmark Track could mandate rotation criteria disclosure"
    consequence_if_violated: "Infrastructure remains unused—contribution becomes academic exercise without real-world impact"

