# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Active benchmark leaderboards with public submission histories (Papers With Code, 2018+).
    Benchmarks in vision (ImageNet) and NLP (GLUE, SQuAD) domains.
    Scenarios where expert consensus on saturation timing exists (testable via survey).
    Research communities with observable citation patterns (papers declare benchmark usage).
  does_not_apply_to: |
    Private/internal benchmarks without public leaderboards (no submission data).
    Pre-2018 benchmarks with incomplete leaderboard snapshot preservation.
    Domains where architecture similarity is critical but metadata unavailable (excluded from MVP).
    Benchmarks without community consensus on saturation (e.g., niche tasks with <50 papers).
  known_limitations: |
    - Historical validation partial (pre-2020 data gaps acknowledged)
    - Architecture homogeneity metric excluded (metadata unavailable)
    - No enforcement mechanism (contribution is detection + signaling, not governance)
    - Governance gaps (vetting replacement benchmarks, community coordination protocols)
    - Assumes expert consensus exists—if weak (<50% agreement), fallback to citation validation

