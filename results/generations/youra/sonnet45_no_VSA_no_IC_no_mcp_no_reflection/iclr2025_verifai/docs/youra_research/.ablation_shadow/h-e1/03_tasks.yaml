epic_tasks:
  A-1:
    complexity: 8
    dependencies: []
    description: Load HumanEval, add Pydantic annotations, save 100 extended problems
    module: DatasetExtender
    name: Dataset Extension
    outputs:
    - data/humaneval_pydantic/*.json (100 files)
    priority: P0
    subtasks:
      A-1-1:
        description: datasets.load_dataset('openai_humaneval')
        effort: 1
        name: Load dataset
      A-1-2:
        description: problems[:100]
        effort: 1
        name: Slice subset
      A-1-3:
        description: Extract types from prompt
        effort: 1
        name: Parse signature
      A-1-4:
        description: Format Pydantic boilerplate
        effort: 1
        name: Template fill
      A-1-5:
        description: Combine template + prompt
        effort: 1
        name: Prepend
      A-1-6:
        description: Write to output_dir
        effort: 1
        name: Save JSON
      A-1-7:
        description: Aggregate results
        effort: 1
        name: Collect list
      A-1-8:
        description: Return extended problems
        effort: 1
        name: Return
  A-2:
    complexity: 9
    dependencies:
    - A-1
    description: Configure Anthropic API, batch generate 100 programs, handle retries
    module: LLMGenerator
    name: LLM Code Generation
    outputs:
    - outputs/generated_code/*.py (100 files)
    priority: P0
    subtasks:
      A-2-1:
        description: Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])
        effort: 1
        name: Client init
      A-2-2:
        description: Build request dict
        effort: 1
        name: Message format
      A-2-3:
        description: client.messages.create(...)
        effort: 1
        name: API call
      A-2-4:
        description: Parse response.content[0].text
        effort: 1
        name: Extract text
      A-2-5:
        description: Write .py to disk
        effort: 1
        name: Save file
      A-2-6:
        description: time.sleep(6) for 10 req/min
        effort: 1
        name: Rate limit
      A-2-7:
        description: 3x exponential backoff
        effort: 1
        name: Retry logic
      A-2-8:
        description: Process all 100 problems
        effort: 1
        name: Batch loop
      A-2-9:
        description: Collect file paths
        effort: 1
        name: Return paths
  A-3:
    complexity: 10
    dependencies:
    - A-2
    description: Integrate Pyre, parse JSON output, batch process 100 files
    module: PyreExtractor
    name: Constraint Extraction
    outputs:
    - outputs/constraints/*.json (100 files)
    priority: P0
    subtasks:
      A-3-1:
        description: Load source .py
        effort: 1
        name: Read file
      A-3-10:
        description: Aggregate constraints
        effort: 1
        name: Return list
      A-3-2:
        description: ast.parse(source)
        effort: 1
        name: Parse AST
      A-3-3:
        description: Traverse ClassDef nodes
        effort: 1
        name: Find BaseModel
      A-3-4:
        description: Check @validator decorators
        effort: 1
        name: Find validators
      A-3-5:
        description: Parse decorator args
        effort: 1
        name: Extract field
      A-3-6:
        description: Get assertion expression
        effort: 1
        name: Parse assert
      A-3-7:
        description: ast.unparse(assert.test)
        effort: 1
        name: Unparse predicate
      A-3-8:
        description: Traverse FunctionDef nodes
        effort: 1
        name: Find functions
      A-3-9:
        description: Parse annotations
        effort: 1
        name: Extract types
  A-4:
    complexity: 7
    dependencies:
    - A-3
    description: Z3 satisfiability checks, compute quality rate
    module: Z3Validator
    name: Constraint Validation
    outputs:
    - outputs/quality_checks/*.json (100 files)
    priority: P1
    subtasks:
      A-4-1:
        description: Z3 Solver()
        effort: 1
        name: Init solver
      A-4-2:
        description: Extract var/op/val
        effort: 1
        name: Parse predicate
      A-4-3:
        description: Determine Int/Real/Bool
        effort: 1
        name: Infer type
      A-4-4:
        description: Declare variable
        effort: 1
        name: Create Z3 var
      A-4-5:
        description: Predicate to Z3 expression
        effort: 1
        name: Convert expr
      A-4-6:
        description: solver.check() == sat
        effort: 1
        name: Check sat
      A-4-7:
        description: True if satisfiable
        effort: 1
        name: Return bool
  A-5:
    complexity: 11
    dependencies:
    - A-3
    - A-4
    description: Compute extraction/quality rates, generate 4 figures, save outputs
    module: MetricsEngine + Visualizer
    name: Metrics & Visualization
    outputs:
    - outputs/metrics.json
    - figures/gate_metrics.png
    - figures/success_by_complexity.png
    - figures/constraint_types.png
    - figures/failure_modes.png
    priority: P0
    subtasks:
      A-5-1:
        description: Iterate results, count with constraints
        effort: 1
        name: Count programs
      A-5-10:
        description: Write metrics.json
        effort: 1
        name: Save metrics
      A-5-11:
        description: Return metrics dict
        effort: 1
        name: Return dict
      A-5-2:
        description: Sum constraint lists
        effort: 1
        name: Count constraints
      A-5-3:
        description: Sum quality checks
        effort: 1
        name: Count quality
      A-5-4:
        description: extraction_rate = (count/100)*100
        effort: 1
        name: Compute extraction
      A-5-5:
        description: quality_rate = (nontrivial/total)*100
        effort: 1
        name: Compute quality
      A-5-6:
        description: PASS if rate >= 90 else FAIL
        effort: 1
        name: Evaluate gate
      A-5-7:
        description: 'Bar chart: target vs actual'
        effort: 1
        name: Plot gate metrics
      A-5-8:
        description: 'Bar chart: LOC bins vs success'
        effort: 1
        name: Plot by complexity
      A-5-9:
        description: 'Pie chart: constraint types'
        effort: 1
        name: Plot distribution
failsafe_buffer:
  allocation: 11
  purpose: Reserve for Phase 4 unexpected complexity
metadata:
  allocated: 45
  epic_count: 5
  failsafe: 11
  hypothesis_id: h-e1
  tier: 1
  total_budget: 56
success_criteria:
  gate:
    metric: extraction_success_rate
    on_fail: PIVOT to neural constraint extraction
    threshold: 90.0
    type: MUST_WORK
  poc_pass:
  - Code executes without fatal errors
  - extraction_success_rate >= 90.0
  - constraint_quality_rate > 80.0
  - 4 figures generated
validation_checkpoints:
- checkpoint: After A-1
  criteria: 100 JSON files in data/humaneval_pydantic/
- checkpoint: After A-2
  criteria: 100 Python files in outputs/generated_code/
- checkpoint: After A-3
  criteria: 100 JSON files in outputs/constraints/
- checkpoint: After A-5
  criteria: metrics.json exists with gate_result field
