main_hypothesis:
  id: H-IncrementalSMT-v1
  title: Incremental SMT Verification for LLM Code Repair
  statement: Under iterative LLM code repair workflows in statically-typed languages, if incremental SMT verification is used
    (re-verifying only modified functions + dependencies), then verification time reduces by 2-5x compared to batch re-verification,
    because unchanged code portions skip redundant constraint checking.
