# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-IncrementalSMT-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under iterative LLM code repair workflows in statically-typed languages,
    if incremental SMT verification is used (re-verifying only modified functions + dependencies),
    then verification time reduces by 2-5x compared to batch re-verification,
    because unchanged code portions skip redundant constraint checking.
  alternative_hypothesis_h0: |
    There is no significant difference in verification time between incremental
    and batch SMT approaches for LLM code repair (speedup < 1.5x).

