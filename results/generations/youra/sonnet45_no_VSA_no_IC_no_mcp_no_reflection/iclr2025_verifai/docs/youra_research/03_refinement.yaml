causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "LLM generates typed code → static analyzer extracts SMT constraints from type annotations"
      evidence: "Exchange 10 - Prusti/Pyre reliably extract from typed languages"
      falsifier: "Static analyzer fails to extract usable constraints (< 90% extraction success)"
    - step: 2
      description: "Incremental SMT uses dependency analysis → identifies which constraints invalidate after code modification"
      evidence: "Exchange 4 - Z3 push/pop contexts enable incremental solving; Exchange 12 - dependency cone determines re-check scope"
      falsifier: "Dependency analysis misses indirect dependencies → false negatives in verification"
    - step: 3
      description: "Only invalidated constraints re-verified → unchanged code portions skipped → wall-clock time reduced"
      evidence: "Exchange 5 - Repair locality (80%+ touch 1-3 lines) ensures small invalidation cone"
      falsifier: "Invalidation cone touches > 70% of codebase → speedup < 1.5x (no practical benefit)"
  key_tension: "Speedup magnitude depends on repair locality vs dependency spread - LLM code may have broader dependencies than human code"
  evidence_summary: |
    Mechanism relies on repair locality (established in program repair literature) +
    incremental SMT capability (established Z3 feature). New claim is that these combine
    effectively for LLM-generated typed code to achieve practical speedup.

