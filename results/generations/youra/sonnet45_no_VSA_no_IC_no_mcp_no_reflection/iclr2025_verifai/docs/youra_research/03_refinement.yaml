key_assumptions:
  - id: "A1"
    assumption: "LLM-generated code in typed languages has extractable static analysis constraints"
    supporting_evidence: "Exchange 10 - Type annotations provide structured contracts for Prusti/Pyre"
    consequence_if_violated: "Cannot extract SMT constraints → entire approach fails"
  - id: "A2"
    assumption: "LLM repair modifications are typically localized (1-3 functions)"
    supporting_evidence: "Exchange 5 - Neural repair literature shows 80%+ repairs touch 1-3 lines"
    consequence_if_violated: "Broad modifications → large invalidation cone → minimal speedup"
  - id: "A3"
    assumption: "Dependency analysis accurately identifies invalidated constraints"
    supporting_evidence: "Exchange 10 - Conservative over-approximation maintains soundness"
    consequence_if_violated: "Missed dependencies → false negatives → unsound verification"
  - id: "A4"
    assumption: "Static analyzer overhead (constraint extraction) is small relative to SMT solving time"
    supporting_evidence: "General knowledge - SMT solving is computationally expensive relative to AST parsing"
    consequence_if_violated: "Extraction time dominates → incremental approach provides no speedup"
  - id: "A5"
    assumption: "LLM code doesn't use heavy dynamic features that block static analysis"
    supporting_evidence: "Exchange 10 - Scoped to typed subsets, ban eval/exec/metaprogramming"
    consequence_if_violated: "Static analysis fails → cannot extract constraints → approach inapplicable"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Statically-typed languages (Rust, typed Python with Pydantic)
    - Iterative repair workflows where LLM fixes specific bugs (not general generation)
    - Programs 10-500 LOC
    - Code modifications touching 1-3 functions per iteration
  does_not_apply_to: |
    - Dynamic languages without type annotations (JavaScript, Ruby)
    - Full program generation from scratch (no repair iteration)
    - Code using heavy dynamic features (eval, exec, reflection, metaprogramming)
    - Massive refactorings that restructure entire codebase
  known_limitations: |
    - Cold start problem (Exchange 12): First iteration sees no speedup
    - Dependency spread (Exchange 4): If modifications touch 50-70% of code, speedup minimal
    - Static analysis constraints may be incomplete (sound but not complete verification)

