hypothesis_draft:
  title: "Incremental SMT Verification for LLM Code Repair"
  hypothesis_id: "H-IncrementalSMT-v1"
  core_claim: |
    Incremental SMT-based verification reduces verification time for LLM-generated
    code repairs in statically-typed languages by 2-5x compared to batch verification,
    enabling practical iterative refinement workflows with formal correctness guarantees.
  mechanism: |
    Causal chain: (1) Typed LLM code → static analyzer extracts SMT constraints,
    (2) Incremental SMT identifies invalidated constraints via dependency analysis,
    (3) Only modified functions + dependencies re-verified → speedup from skipping unchanged code.
  predictions:
    - P1: "2-5x wall-clock speedup (100 programs, typed Python, 1-2 repair iterations)"
    - P2: "Speedup scales with codebase size (100 LOC = 2x, 500 LOC ≥ 5x)"
    - P3: "Conservative dependency analysis maintains soundness (zero false negatives)"

variables_summary:
  independent: "Verification Strategy (batch vs incremental)"
  dependent_primary: "Wall-Clock Verification Time (seconds)"
  controlled: "Program size (10-50 LOC), repair scope (1-2 functions), language (typed Python)"

