# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      Parameter-efficient fine-tuning methods like LoRA have revolutionized adaptation of large language models,
      but their success relies on an implicit assumption: that the base model architecture already supports the target task.
      When this assumption breaks, even the most sophisticated fine-tuning fails catastrophically.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Architecture-task compatibility is a prerequisite for parameter-efficient fine-tuning, not something PEFT can fix"
    concrete_example: "A state-space model trained for generation can achieve 81% accuracy on sentiment classification but performs 12 percentage points BELOW random baseline on paraphrase detection"
    stakes: "Without architectural alignment checks, researchers waste compute on doomed fine-tuning experiments"

  real_world_impact:
    application_domain: "Efficient foundation model deployment across diverse tasks"
    potential_beneficiaries: "ML practitioners adapting sub-quadratic models for production use"
    scale_of_impact: "Affects all applications requiring task-specific adaptation of non-transformer architectures"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Sub-quadratic architectures like state-space models offer efficiency advantages over transformers but lack established fine-tuning protocols"
    common_understanding: "LoRA works for transformers; unclear if it transfers to SSMs"

  deeper_problem:
    description: "Architectural mechanisms (causal vs bidirectional) impose hard constraints on which tasks a model can learn, independent of parameter efficiency"
    why_overlooked: "PEFT literature focuses on transformers where architecture supports most NLP tasks"
    our_perspective: "LoRA adapts representations, but cannot add capabilities absent in base architecture"

  gap_in_existing_work:
    description: "No systematic evaluation of architectural prerequisites for PEFT success across architecture families"
    why_gap_exists: "Transformer dominance means architectural diversity hasn't been stress-tested"
    why_gap_matters: "As sub-quadratic models proliferate, practitioners need to know when PEFT will fail"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Zero-shot evaluation reveals architectural incompatibility before fine-tuning investment, serving as a critical 'proof-of-concept' gate"
    expanded_explanation: |
      We discovered that causal state-space models fail bidirectional reasoning tasks at zero-shot evaluation,
      achieving below-random accuracy on paraphrase detection despite excelling at sentiment classification.
      This failure pattern signals architectural mismatch that no amount of parameter-efficient fine-tuning can overcome.

  why_others_missed_it:
    common_assumptions: "Most PEFT research assumes transformer architecture where bidirectional attention enables all task types"
    our_different_view: "Tested PEFT transfer to architecturally distinct model class (causal SSMs) exposing implicit architectural assumptions"
    enabling_factor: "Systematic gating strategy that validates base model capabilities before fine-tuning"

  what_makes_it_work:
    intuitive_explanation: "Just as you can't train a one-armed person to juggle, you can't fine-tune a unidirectional model to compare text bidirectionally"
    key_mechanism: "Causal SSMs process text left-to-right without cross-attention; paraphrase detection requires symmetric comparison of two sequences simultaneously"
    analogy: "Architecture defines capabilities; fine-tuning specializes within those capabilities"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Causal state-space models exhibit task-dependent zero-shot compatibility: they exceed random baselines on generation-aligned tasks but fail below-random on bidirectional reasoning tasks"
    measurable_criteria: "QQP accuracy <50% (12pp below random) while SST-2 accuracy >50% (31pp above random) at p<0.001"

  supporting_evidence:
    - id: "evidence_1"
      what: "Mamba-130M achieves 38% accuracy on QQP vs 50% random baseline (p=0.003)"
      so_what: "Below-random performance indicates systematic bias incompatible with task structure"
      how_it_supports_claim: "Demonstrates architectural failure for bidirectional comparison tasks"

    - id: "evidence_2"
      what: "Same model achieves 81% accuracy on SST-2 vs 50% random baseline (p<0.001)"
      so_what: "Model has genuine language understanding for generation-aligned classification"
      how_it_supports_claim: "Isolates failure to architectural constraint, not checkpoint quality"

    - id: "evidence_3"
      what: "MNLI accuracy (35%) marginally exceeds 3-way random baseline (33.3%)"
      so_what: "Entailment requires similar bidirectional reasoning as paraphrase detection"
      how_it_supports_claim: "Consistent pattern of failure on tasks requiring symmetric comparison"

  surprising_findings:
    finding: "The same pretrained checkpoint simultaneously excels and fails catastrophically depending on task structure"
    why_surprising: "Expected gradual performance degradation, not binary success/failure pattern"
    our_interpretation: "Architectural capabilities are discrete: either the mechanism exists (bidirectional reasoning) or it doesn't"

  what_results_mean:
    synthesis: "Architecture-task alignment is a binary gate for PEFT applicability, not a continuous spectrum"
    confidence_level: "High confidence (p<0.01 for QQP failure, statistically significant margin)"
    caveats: "Limited to one SSM architecture (Mamba) and three GLUE tasks; broader generalization requires additional experiments"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "We demonstrate that zero-shot evaluation serves as a critical architectural compatibility gate before parameter-efficient fine-tuning, preventing wasted compute on structurally impossible tasks"
    why_significant: "Establishes principled workflow for validating PEFT applicability across diverse architectures"

  implications:
    for_field: "PEFT research must account for architectural constraints; techniques are not architecture-agnostic"
    for_practice: "Practitioners should validate base model capabilities via zero-shot evaluation before investing in fine-tuning infrastructure"
    conceptual_contribution: "Introduces 'architectural capability' as distinct from 'learned knowledge' in transfer learning"

  future_possibilities:
    immediate_extensions: "Test bidirectional SSM variants (RWKV-v5) to validate refined hypothesis; develop task-architecture compatibility taxonomy"
    longer_term_vision: "Automated architecture selection based on task requirements; hybrid models combining SSM efficiency with targeted bidirectional layers"
    open_questions: "Can architectural augmentation (e.g., adding cross-attention heads) enable PEFT for incompatible tasks?"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  # ─────────────────────────────────────────────────────────────────────────────
  # ABSTRACT
  # ─────────────────────────────────────────────────────────────────────────────
  abstract:
    narrative_purpose: "Compress the entire story into ~150 words"
    key_message: "Architecture compatibility gates PEFT success; zero-shot evaluation reveals this before fine-tuning"
    structure_notes: |
      - Sentence 1-2: PEFT assumes architectural alignment
      - Sentence 3: Tested LoRA on causal SSM (Mamba) vs transformer baseline
      - Sentence 4-5: Zero-shot reveals task-dependent compatibility (38% QQP vs 81% SST-2)
      - Sentence 6: Zero-shot evaluation as architectural gate prevents wasted compute
    avoid:
      - "No citations in abstract"
      - "Exact numerical details (save for main result: QQP 38% vs 50% baseline)"
      - "Vague claims about 'efficiency' or 'improvements'"

  # ─────────────────────────────────────────────────────────────────────────────
  # INTRODUCTION
  # ─────────────────────────────────────────────────────────────────────────────
  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"

    hook_strategy: "Counterintuitive finding: same model excels and fails catastrophically on different tasks"

    problem_escalation: |
      1. Start: PEFT enables efficient adaptation, widely successful on transformers
      2. Deepen: Success assumes base architecture supports target task
      3. Gap: No systematic validation of architectural prerequisites across model families

    insight_preview: "Zero-shot evaluation exposes architectural mismatches before fine-tuning investment"

    contributions_framing: |
      We contribute:
      1. First systematic study of PEFT transfer from transformers to state-space models
      2. Empirical demonstration that causal SSMs fail bidirectional tasks at zero-shot (QQP: -12pp below random)
      3. Validation of zero-shot evaluation as architectural compatibility gate
      4. Task-architecture compatibility framework for future PEFT research

    transition_to_related_work: "We build on PEFT literature for transformers and emerging work on sub-quadratic architectures"

  # ─────────────────────────────────────────────────────────────────────────────
  # RELATED WORK
  # ─────────────────────────────────────────────────────────────────────────────
  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our approach"

    positioning_strategy: "PEFT methods assume transformer architecture; sub-quadratic models lack systematic PEFT evaluation"

    key_comparison_points:
      - area: "Parameter-Efficient Fine-Tuning"
        limitation_to_highlight: "Exclusively transformer-focused; no cross-architecture validation"
        how_we_differ: "Test PEFT transfer to architecturally distinct model class (causal SSMs)"
      - area: "State-Space Models"
        limitation_to_highlight: "Evaluated for generation/long-context tasks; classification underexplored"
        how_we_differ: "Systematic GLUE evaluation exposing bidirectional task failures"
      - area: "Transfer Learning"
        limitation_to_highlight: "Focuses on domain shift; assumes architectural compatibility"
        how_we_differ: "Identify architectural alignment as prerequisite for fine-tuning success"

    papers_to_discuss:
      - "LoRA (Hu et al., 2021)"
      - "Mamba (Gu & Dao, 2023)"
      - "S4 (Gu et al., 2022)"
      - "GPT-2 (Radford et al., 2019)"
      - "GLUE benchmark (Wang et al., 2018)"

    avoid:
      - "Dismissing prior PEFT work (it's valid for transformers)"
      - "Overclaiming SSM limitations (failure is task-specific)"
      - "Missing established baselines"

  # ─────────────────────────────────────────────────────────────────────────────
  # METHODOLOGY
  # ─────────────────────────────────────────────────────────────────────────────
  methodology:
    narrative_purpose: "Explain WHY this experimental design tests architectural compatibility"

    connection_to_insight: "Zero-shot evaluation isolates architectural capability from learned knowledge"

    key_design_decisions:
      - decision: "Zero-shot evaluation as EXISTENCE gate (no LoRA tested)"
        rationale: "If base model fails at zero-shot, LoRA cannot add missing architectural capabilities"
        alternatives_considered: "Full LoRA experiment would waste compute on structurally impossible task"

      - decision: "Three GLUE tasks (MNLI, QQP, SST-2) covering different reasoning types"
        rationale: "Mix of bidirectional (QQP, MNLI) and generation-aligned (SST-2) tasks isolates failure mode"
        alternatives_considered: "Full GLUE would dilute signal; these three tasks sufficient to demonstrate pattern"

      - decision: "Mamba-130M as SSM representative"
        rationale: "Publicly available checkpoint with documented architecture"
        alternatives_considered: "Larger models would increase compute without changing architectural constraints"

    intuition_building: |
      Causal SSM processes: "Question 1 [SEP] Question 2" → left-to-right encoding
      At decision point: Q2 representation sees Q1, but Q1 cannot see Q2
      Paraphrase requires symmetric comparison: both questions must inform each other
      Architectural mismatch → systematic failure

    technical_depth_balance: |
      Main text: Experimental design, results interpretation, architectural analysis
      Appendix: Detailed hyperparameters, full result tables, error analysis

  # ─────────────────────────────────────────────────────────────────────────────
  # EXPERIMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  experiments:
    narrative_purpose: "Design experiments that test architectural compatibility hypothesis"

    experimental_questions:
      - question: "Does Mamba-130M demonstrate non-random zero-shot performance on GLUE tasks?"
        experiment: "Evaluate on 100 samples per task (MNLI, QQP, SST-2)"
        expected_outcome: "Task-dependent: generation-aligned tasks succeed, bidirectional tasks fail"

    baseline_rationale: "Random baselines (50% for binary, 33.3% for 3-way) define architectural failure threshold"
    dataset_rationale: "GLUE provides standardized tasks with diverse linguistic phenomena"
    metric_rationale: "Accuracy sufficient for zero-shot gate; no need for F1/precision/recall at this stage"

    fairness_considerations: |
      - Same pretrained checkpoint (state-spaces/mamba-130m-hf)
      - Deterministic evaluation (seed 42)
      - No prompt engineering or few-shot examples (true zero-shot)
      - Public datasets with established baselines

  # ─────────────────────────────────────────────────────────────────────────────
  # RESULTS
  # ─────────────────────────────────────────────────────────────────────────────
  results:
    narrative_purpose: "Present evidence that architectural compatibility varies by task structure"

    main_result_highlight: "QQP accuracy 38% vs 50% random baseline (12pp deficit, p=0.003) while SST-2 achieves 81% (31pp surplus, p<0.001)"

    result_presentation_order:
      - result: "Task-level accuracy comparison (Table 1, Figure 1)"
        purpose: "Establish binary pattern: bidirectional tasks fail, generation-aligned tasks succeed"
      - result: "Statistical significance tests (binomial)"
        purpose: "Confirm failures/successes are not sampling noise"
      - result: "Qualitative failure analysis (example predictions)"
        purpose: "Illustrate mechanism of QQP failure"

    surprising_result_handling: "MNLI marginal success (35% vs 33.3%) suggests 3-way classification partially masks bidirectional failure"

    avoid:
      - "Hiding QQP failure or downplaying its significance"
      - "Overclaiming generalization beyond tested tasks"
      - "Suggesting LoRA could fix architectural mismatch"

  # ─────────────────────────────────────────────────────────────────────────────
  # DISCUSSION
  # ─────────────────────────────────────────────────────────────────────────────
  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, propose future work"

    key_findings_interpretation: "Architectural capabilities are prerequisites for PEFT; zero-shot evaluation reveals compatibility"

    honest_limitations:
      - limitation: "Single SSM architecture tested (Mamba)"
        why_acceptable: "Architectural constraint (causality) applies to all causal SSMs (S4, H3)"
        future_mitigation: "Test bidirectional SSM variants (RWKV-v5)"

      - limitation: "Only three GLUE tasks evaluated"
        why_acceptable: "Sufficient to demonstrate architectural failure pattern"
        future_mitigation: "Expand to full GLUE and generation tasks"

      - limitation: "100 samples per task (not full validation sets)"
        why_acceptable: "Statistical significance achieved; larger samples would confirm pattern"
        future_mitigation: "Full dataset evaluation for comprehensive study"

    broader_impact_statement: "Reduces wasted compute by identifying doomed fine-tuning experiments early; no negative societal impacts anticipated"

  # ─────────────────────────────────────────────────────────────────────────────
  # CONCLUSION
  # ─────────────────────────────────────────────────────────────────────────────
  conclusion:
    narrative_purpose: "Reinforce key message + open future directions"

    callback_to_hook: "Just as initial assumption of architectural alignment enables PEFT success on transformers, validating that assumption via zero-shot evaluation prevents catastrophic failures on misaligned architectures"

    memorable_ending: "The future of efficient adaptation lies not just in parameter-efficient methods, but in architectural awareness"

    future_work_vision: "Develop task-architecture compatibility taxonomy; explore hybrid models combining SSM efficiency with targeted bidirectional mechanisms; automate architecture selection based on task requirements"

