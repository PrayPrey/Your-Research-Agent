      The hypothesis addresses a genuine gap (PEFT portability across architectures) that the
      field has implicitly ignored. Even a "negative result" (basic LoRA works fine) is
      scientifically valuable because it challenges assumptions. The scoped version is
      immediately testable and opens future directions (Fisher-guided discovery if basic
