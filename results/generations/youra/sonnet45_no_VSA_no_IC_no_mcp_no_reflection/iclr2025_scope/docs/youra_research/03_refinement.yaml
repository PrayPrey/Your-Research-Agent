# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  mechanism_description: |
    Neural network fine-tuning adapts pretrained representations to downstream tasks
    by updating parameters that transform task-specific inputs/outputs. LoRA achieves
    this efficiently by injecting low-rank weight updates ΔW = BA (rank r << d) into
    linear layers. In transformers, LoRA applied to Q/K/V attention projections modifies
    attention patterns. In state-space models, input/output projections transform data
    entering/exiting the recurrent state dynamics.

    The proposed mechanism hypothesizes that input/output transformation layers serve
    as architecture-independent adaptation surfaces. While transformers use attention
    and Mamba uses state-space recurrence, both ultimately project inputs to hidden
    representations and hidden representations to outputs. Adapting these projection
    layers (not the core mechanism - attention or recurrence) should enable task
    specialization without disrupting architectural inductive biases.

    Freezing recurrent components (Mamba's A,B,C matrices) preserves the long-range
    dependency modeling that makes state-space models efficient. Freezing attention
    (transformer's Q/K/V weights) would similarly preserve attention patterns. By
    constraining adaptation to peripheral projections, both architectures retain their
    core strengths while specializing to downstream tasks through learnable low-rank
    transformations.

  testable_predictions:
    - prediction_id: "P1"
      statement: "Mamba LoRA (input/output only) achieves ≥95% of GPT-2 LoRA average accuracy on GLUE tasks"
      measurement: "Average accuracy across MNLI, QQP, SST-2"
      success_threshold: "Mamba ≥95% of GPT-2 LoRA performance"
      failure_threshold: "Mamba <85% of GPT-2 LoRA performance"
    - prediction_id: "P2"
      statement: "Mamba LoRA parameter count is within 10% of GPT-2 LoRA parameter count"
      measurement: "Trainable parameter count (millions)"
      success_threshold: "Ratio 0.9-1.1"
      failure_threshold: "Ratio <0.7 or >1.3"
    - prediction_id: "P3"
      statement: "Both architectures outperform zero-shot baselines with statistical significance"
      measurement: "Paired t-test comparing LoRA vs zero-shot across 3 seeds"
      success_threshold: "p<0.05 for both architectures"
      failure_threshold: "p≥0.05 for either architecture"

  sensitivity_factors:
    - factor: "LoRA Rank Selection"
      impact: "Higher ranks (16) may improve performance but reduce efficiency; lower ranks (4) may underfit"
      mitigation: "Test ranks {4,8,16} to establish robustness of findings"
    - factor: "Task Type"
      impact: "Classification tasks (GLUE) may differ from generation tasks where recurrent state dynamics matter more"
      mitigation: "Explicitly scope claims to classification; acknowledge generation as future work"
    - factor: "Checkpoint Availability"
      impact: "Mamba-130M pretrained checkpoint must be publicly accessible and compatible with standard libraries"
      mitigation: "Verify checkpoint availability before committing to hypothesis; fallback to alternative SSM if needed"

