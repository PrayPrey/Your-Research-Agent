# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LoRA-SSM-Transfer-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under classification task fine-tuning scenarios using pretrained language models,
    if low-rank adaptation (LoRA rank-8) is applied only to input/output projection
    layers of state-space models (Mamba-130M) while freezing recurrent components (A,B,C matrices),
    then downstream task performance will match transformer LoRA performance (≥95% of GPT-2-117M LoRA accuracy),
    because adaptation surfaces in neural architectures can be architecture-independent
    despite different underlying mechanisms (attention vs state-space recurrence).
  alternative_hypothesis_h0: |
    There is no significant difference in downstream task adaptation performance
    between LoRA applied to transformer architectures (GPT-2) and LoRA applied to
    state-space model architectures (Mamba) when both use frozen recurrent/attention
    components and adapt only input/output projections.

