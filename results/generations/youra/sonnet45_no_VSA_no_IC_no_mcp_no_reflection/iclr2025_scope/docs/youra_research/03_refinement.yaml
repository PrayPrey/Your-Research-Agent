# SECTION 2: Novelty & Related Work
# ═══════════════════════════════════════════════════════════════

novelty_and_related_work:
  novelty_claim: |
    First systematic comparison of parameter-efficient fine-tuning (LoRA) across
    transformer and state-space model architectures. Current PEFT literature focuses
    exclusively on transformers; sub-quadratic models are under-explored. This work
    challenges the implicit assumption that different architectural mechanisms
    (attention vs state-space recurrence) require fundamentally different adaptation
    strategies.

  what_is_new:
    - "Architecture-agnostic PEFT evaluation framework comparing transformers and state-space models"
    - "Empirical validation that input/output projections serve as universal adaptation surfaces"
    - "Demonstration that recurrent components can remain frozen during adaptation without performance loss"

  what_builds_on_existing:
    - "LoRA methodology from Hu et al. (low-rank adaptation for efficient fine-tuning)"
    - "State-space model architecture from Mamba/S4 papers (discretization formulation)"
    - "GLUE benchmark suite for standardized evaluation"

  related_work_gaps:
    - "No prior work systematically compares PEFT across architecture families"
    - "State-space model fine-tuning is under-documented in literature"
    - "Existing PEFT research assumes transformer-specific mechanisms (attention patterns)"

  differentiators:
    - "Focus on architecture-independence rather than architecture-specific optimization"
    - "Conservative approach (frozen recurrence) vs aggressive adaptation (all parameters)"
    - "Immediate testability with existing checkpoints and benchmarks"

