# ═══════════════════════════════════════════════════════════════
# Hypothesis Evolution Summary
# ═══════════════════════════════════════════════════════════════

hypothesis_evolution:
  initial_direction: |
    Dr. Nova proposed architecture-aware adaptation discovery via meta-learning. Key idea:
    instead of forcing LoRA onto state-space models, use calibration to discover where each
    architecture "wants" to be adapted (transformers → attention layers, state-space models →
    discretization matrices). Gradient variance during short calibration phase identifies
    high-sensitivity parameters. Heterogeneous architectures with per-layer adaptation signatures.

  critical_challenges:
    - challenge: "Theoretical soundness of gradient-based discovery"
      raised_by: "Prof. Pax (Exchange 3)"
      concern: "Gradient magnitude is noisy, may not reflect long-term adaptation utility. Adapting A,B,C matrices could break inductive biases."
    - challenge: "Contribution logic catch-22"
      raised_by: "Dr. Sage (Exchange 5), Prof. Rex (Exchange 6)"
      concern: "If Stage 1 (simple LoRA) succeeds, no novelty. If fails, unclear if due to architecture or implementation. Breadth requirements violate feasibility constraints."
    - challenge: "Checkpoint availability and resource constraints"
      raised_by: "Prof. Rex (Exchange 6)"
      concern: "Testing 3+ architectures at >1B scale requires checkpoints that don't exist. Mamba-130M availability unverified. Fisher Information needs pretrained model."

  refinements_applied:
    - iteration: 1
      persona: "Prof. Pax (Exchange 3)"
      change: "Simplify to LoRA on input/output projections only, freeze recurrent components"
      rationale: "Test basic PEFT transfer before adding meta-learning complexity"
    - iteration: 2
      persona: "Dr. Ally (Exchange 4)"
      change: "Two-stage approach: simple baseline (Stage 1) → discovery (Stage 2 if Stage 1 fails)"
      rationale: "Bridge novelty and feasibility; use Fisher Information instead of gradient variance"
    - iteration: 3
      persona: "Prof. Rex (Exchange 6)"
      change: "Scope down to minimally viable hypothesis: basic LoRA transfer test only"
      rationale: "Eliminate catch-22, satisfy feasibility constraints, focus on answerable question"
    - iteration: 4
      persona: "Dr. Ally (Exchange 7)"
      change: "Final synthesis: GPT-2-117M vs Mamba-130M, GLUE tasks, LoRA rank-8, 3 seeds"
      rationale: "Proven-available resources, clear contribution (first systematic PEFT comparison across architectures)"

  final_consensus: |
    Parameter-efficient fine-tuning via LoRA (rank-8 on input/output projections, frozen recurrence)
    transfers from transformers to state-space models, achieving ≥95% of transformer LoRA performance
    on GLUE classification tasks. This demonstrates PEFT portability across architecture families
    despite different mechanisms (attention vs state-space recurrence). Testable immediately with
    existing checkpoints and benchmarks. No synthetic data, no human annotation, no new rubrics.

# ═══════════════════════════════════════════════════════════════
# Key Insights & Arguments
# ═══════════════════════════════════════════════════════════════

key_insights:
  - insight: "Input/output projections as architecture-independent adaptation surfaces"
    support: "Dr. Ally (Exchange 4), Dr. Ally (Exchange 7)"
    rationale: |
      While transformers use attention and state-space models use recurrence, both have
      peripheral layers that transform inputs to hidden states and hidden states to outputs.
      These projections can be adapted without disrupting core architectural mechanisms.
      Freezing recurrence (A,B,C) preserves long-range dependencies; freezing attention
      preserves attention patterns. Adaptation happens at transformation boundaries.

  - insight: "PEFT literature has implicit transformer-specific bias"
    support: "Dr. Sage (Exchange 5), Dr. Ally (Exchange 7)"
    rationale: |
      Current PEFT research focuses exclusively on transformers (LoRA on Q/K/V, prefix tuning,
      prompt tuning). Sub-quadratic models are under-explored. Implicit assumption that different
      mechanisms require different adaptation strategies. Testing this assumption is scientifically
      valuable even if result is "basic LoRA works fine."

  - insight: "Feasibility constraints force brutal scoping"
    support: "Prof. Rex (Exchange 6)"
    rationale: |
      Ambitious multi-architecture, multi-scale experiments violate "testable immediately with
      existing resources" constraint. Checkpoint availability is a hard barrier. Pretrained
      linear attention models >1B parameters don't exist. Must work within proven-available
      resources: GPT-2-117M, Mamba-130M, GLUE benchmarks.

  - insight: "Simpler hypothesis can still have genuine novelty"
    support: "Dr. Ally (Exchange 7)"
    rationale: |
      "First systematic comparison" is valid contribution even with simple method. Novelty lies
      in question asked, not complexity of technique. Establishing that PEFT is architecture-
      agnostic opens entire research direction (sub-quadratic model adaptation). Negative result
      (PEFT fails for Mamba) would also be valuable discovery.

# ═══════════════════════════════════════════════════════════════
# Rejected Alternatives & Why
# ═══════════════════════════════════════════════════════════════

rejected_alternatives:
  - alternative: "Architecture-aware discovery via gradient variance calibration"
    proposed_by: "Dr. Nova (Exchange 1)"
    rejected_reason: |
      Theoretical concerns (gradient noise), mechanistic concerns (breaking discretization
      matrices), catch-22 logic (if simple baseline works, discovery is unnecessary). Adds
      complexity without validating whether basic PEFT even fails first.

  - alternative: "Fisher Information-guided parameter discovery"
    proposed_by: "Dr. Ally (Exchange 4)"
    rejected_reason: |
      Requires pretrained checkpoints (Mamba availability unverified), adds Stage 2 complexity,
      inherits catch-22 problem (only needed if Stage 1 fails, but Stage 1 failure ambiguous).
      Salvaged as future work if basic hypothesis shows adaptation gap.

  - alternative: "Multi-architecture, multi-scale validation (3+ architectures, >1B params)"
    proposed_by: "Dr. Sage (Exchange 5)"
    rejected_reason: |
      Violates feasibility constraints. Pretrained checkpoints for linear attention, RWKV at
      1B+ scale don't exist or aren't publicly available. Requires massive compute budget.
      Cannot be tested "immediately using existing real datasets and existing benchmarks."

  - alternative: "Heterogeneous architectures with per-layer adaptation signatures"
    proposed_by: "Dr. Nova (Exchange 1)"
    rejected_reason: |
      Adds confounds before validating core mechanism. Test on homogeneous architectures first
      (pure transformer vs pure state-space). Heterogeneous models are follow-up research.

