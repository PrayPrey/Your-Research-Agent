main_hypothesis:
  id: H-QualityScaling-v1
  title: Data Quality as Compute Efficiency Multiplier in Foundation Model Scaling Laws
  statement: Under foundation model pretraining conditions, if data quality Q(D) is increased through systematic curation
    (deduplication, filtering, mixing), then model performance at fixed compute budget improves following a predictable tradeoff
    surface, because Q(D) acts as a compute efficiency multiplier where higher quality data reduces compute required to reach
    target performance.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: C4 (Colossal Clean Crawled Corpus)
    model: GPT-2 architecture (decoder-only transformer)
    optimizer: AdamW with fixed learning rate schedule
    hyperparameters:
      model_sizes:
      - 1B
      - 7B
      - 30B
      batch_size: fixed per scale
      learning_rate: Chinchilla-optimal schedule
      training_seeds: 3
