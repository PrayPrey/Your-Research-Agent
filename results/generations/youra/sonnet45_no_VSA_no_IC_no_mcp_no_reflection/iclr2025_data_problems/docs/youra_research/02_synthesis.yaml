hypothesis_draft:
  title: "Data Quality as Compute Efficiency Multiplier in Foundation Model Scaling Laws"
  hypothesis_id: "H-QualityScaling-v1"
  core_claim: |
    Foundation model performance follows a data-compute tradeoff where data quality Q(D) acts as a compute efficiency multiplier, with higher Q(D) reducing compute required to reach target performance.
  mechanism: |
    Data curation increases information density per token → higher gradient signal per example → same performance achievable with fewer tokens (less compute). Q(D) operationalized as learnable weighted combination of measurable proxies (dedup ratio, domain diversity, perplexity, token efficiency).
  predictions:
    - P1: "Iso-performance curves in (compute, Q(D)) space are convex with >15% compute reduction per Q(D) std dev increase"
    - P2: "Q(D) explains >20% performance variance beyond model size and compute in regression"
    - P3: "Systematic quality variations produce power-law performance changes in log-log plots (R² > 0.85)"

variables_summary:
  independent: "Data Quality Q(D) (composite score: weighted dedup + diversity + perplexity + efficiency), Training Compute (FLOPs)"
  dependent_primary: "Validation Loss (bits-per-token)"
  controlled: "Model architecture (GPT-2), Model size (fixed per condition), Optimizer hyperparams (AdamW, fixed LR schedule)"

null_hypothesis:
  h0_statement: |
    There is no consistent relationship between data quality metrics Q(D) and model performance beyond what is explained by total data quantity. Data curation effects are random or domain-specific without generalizable patterns.
  statistical_test: "Regression analysis: Loss ~ α·log(params) + β·log(compute) + γ·Q(D) + ε. Test γ significance and ΔR²."
  significance_level: 0.01

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First formal theory treating data quality as compute efficiency multiplier in FM scaling laws with operationalized Q(D) and predictive tradeoff surface"
  differentiation_summary: |
    - Chinchilla: Assumes uniform quality. We add Q(D) parameter for tradeoff prediction.
    - Data-centric AI: Qualitative. We provide quantitative scaling framework.
    - Filtering studies: Ad-hoc. We provide theoretical foundation.

