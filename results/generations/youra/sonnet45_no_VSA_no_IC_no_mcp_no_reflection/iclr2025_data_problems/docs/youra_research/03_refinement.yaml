# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Neural scaling laws predict performance from model size and compute (Chinchilla, Kaplan et al.)"
      status: "BUILD_ON"
      evidence: "Established literature - foundational scaling law papers"
    - claim: "Data-centric AI emphasizes quality over quantity"
      status: "BUILD_ON"
      evidence: "Emerging consensus in ML community (no formal theory yet)"
    - claim: "Data quality affects FM performance, but relationship is not formalized"
      status: "PROVE_NEW"
      evidence: "This is the core hypothesis claim to test"
  scope_reduction_percentage: 33
  phase2b_4_instructions: |
    BUILD_ON claims: Reference existing scaling law literature as foundation. No need to re-prove compute/model scaling.
    PROVE_NEW claim: Focus validation on data quality Q(D) as efficiency multiplier. This is the novel contribution requiring empirical evidence.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-QualityScaling-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under foundation model pretraining conditions, if data quality Q(D) is increased through systematic curation (deduplication, filtering, mixing), then model performance at fixed compute budget improves following a predictable tradeoff surface, because Q(D) acts as a compute efficiency multiplier where higher quality data reduces compute required to reach target performance.
  alternative_hypothesis_h0: |
    There is no consistent relationship between data quality metrics Q(D) and model performance beyond what is explained by total data quantity. Data curation effects are random or domain-specific without generalizable patterns.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Data Quality Q(D)"
      type: "continuous"
      operationalization: "Composite score: Q(D) = w1·dedup_ratio + w2·domain_diversity + w3·avg_perplexity_score + w4·token_efficiency, weights learned from validation"
      levels: []
    - name: "Training Compute Budget"
      type: "continuous"
      operationalization: "Total FLOPs allocated to training run (6ND formula: 6 × num_params × num_tokens)"
      levels: []
  dependent:
    - name: "Model Performance (Loss)"
      type: "continuous"
      operationalization: "Validation loss on held-out set, measured in bits-per-token or cross-entropy"
      primary: true
    - name: "Downstream Task Performance"
      type: "continuous"
      operationalization: "Average accuracy across MMLU, HellaSwag, ARC benchmark suite"
      primary: false
  controlled:
    - name: "Model Architecture"
      operationalization: "Fixed transformer architecture (GPT-2 style decoder-only) across all experiments"
    - name: "Model Size"
      operationalization: "Fixed parameter count per experimental condition (1B, 7B, or 30B)"
    - name: "Optimizer Hyperparameters"
      operationalization: "Fixed learning rate schedule, batch size, optimizer (AdamW) across runs"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Data curation (deduplication, filtering, mixing) increases information density per token by removing redundancy and balancing domain coverage"
      evidence: "Information theory: compression removes redundancy, rate-distortion theory predicts quality-quantity tradeoffs"
      falsifier: "If deduplicated data does not reduce token-to-token predictability (measured by entropy), mechanism fails"
    - step: 2
      description: "Higher information density means each training token provides more 'bits of learning' - model extracts more gradient signal per example"
      evidence: "Analogous to compressed sensing: fewer high-quality measurements suffice. Expected from learning theory on sample efficiency"
      falsifier: "If gradient magnitude or Fisher information does not increase with Q(D), mechanism fails"
    - step: 3
      description: "More gradient signal per token means same performance target reachable with fewer tokens (less compute), creating Q(D) as compute multiplier"
      evidence: "Direct consequence of steps 1-2. Empirically testable via iso-performance curves"
      falsifier: "If compute required to reach fixed performance does not decrease with Q(D), mechanism fails"
  key_tension: "Assumes quality dimensions (dedup, diversity, perplexity) combine linearly without interactions. Non-linear effects across scales could break scalar Q(D) formulation."
  evidence_summary: |
    Mechanism grounded in information theory (compression, rate-distortion) and learning theory (sample efficiency). Each step falsifiable through measurable proxies (entropy, gradient magnitude, compute-to-performance curves). Key risk: stationarity assumption may not hold across scales and domains.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Data quality can be reduced to a scalar Q(D) via learnable linear combination of measurable metrics"
    supporting_evidence: "Analogous to model capacity reduction to parameter count. PCA/weighted combo common in ML for dimensionality reduction."
    consequence_if_violated: "If quality dimensions interact non-linearly, scalar Q(D) fails to predict performance. Would need multi-dimensional quality vector."
  - id: "A2"
    assumption: "Q(D) weights (w1, w2, w3, w4) are stationary across model scales (1B to 100B parameters)"
    supporting_evidence: "Scaling laws assume similar properties hold across scales. But this is an empirical question."
    consequence_if_violated: "Would need scale-dependent Q(D) formulations. Theory still valid but more complex (Q_1B(D) ≠ Q_100B(D))."
  - id: "A3"
    assumption: "Tradeoff surface between Q(D) and compute is convex (diminishing returns to both)"
    supporting_evidence: "Standard assumption in optimization. Matches observed diminishing returns in compute scaling."
    consequence_if_violated: "If non-convex (e.g., quality suddenly becomes worthless above threshold), resource allocation strategy changes."
  - id: "A4"
    assumption: "Existing benchmarks (MMLU, HellaSwag, ARC) are sensitive enough to detect Q(D) effects"
    supporting_evidence: "These benchmarks used in Chinchilla and other scaling studies. Known to correlate with pretraining quality."
    consequence_if_violated: "Would need more sensitive evaluation metrics. But downstream tasks should reflect pretraining data quality."
  - id: "A5"
    assumption: "Quality improvements via curation (dedup, filtering) do not introduce systematic biases that degrade held-out performance"
    supporting_evidence: "Assumes curation is distribution-preserving. Needs validation."
    consequence_if_violated: "If aggressive filtering creates train-test mismatch, apparent Q(D) gains are artifacts. Would need bias-aware quality metrics."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Decoder-only transformer language models (GPT-family architectures)
    - Pretraining phase (not fine-tuning or alignment)
    - Web-scale text datasets (C4, Pile, RedPajama family)
    - Model scales 1B-100B parameters (beyond BERT-size, below GPT-4 scale)
    - English language primarily (due to benchmark availability)
  does_not_apply_to: |
    - Encoder-only or encoder-decoder architectures (may have different quality sensitivities)
    - Fine-tuning or RLHF phases (quality definition differs for instruction/preference data)
    - Multimodal pretraining (text+vision requires separate quality theory)
    - Models below 1B parameters (may not exhibit scaling law behavior)
    - Non-English languages without established benchmarks
  known_limitations: |
    - Q(D) weights require per-domain fitting (code vs language vs mixed)
    - Stationarity across scales is assumption requiring validation
    - Theory does not specify optimal curation strategy, only predicts tradeoffs
    - Limited to existing measurable quality proxies (dedup, perplexity, diversity)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Iso-performance curves in (compute, Q(D)) space are convex: achieving fixed target loss requires less compute at higher Q(D), with diminishing returns"
    test_method: "Train models at grid of (compute budget, quality level) combinations. Plot curves connecting points with same final loss. Check convexity."
    success_criterion: "Curves are convex (second derivative positive) for at least 2 out of 3 target loss values tested. Compute reduction >15% when Q(D) increases by 1 std dev."
    falsification: "If curves are concave or irregular, tradeoff relationship does not hold. If compute reduction <5%, effect is negligible."
  - id: "P2"
    primary: false
    statement: "Data quality Q(D) explains >20% of performance variance beyond model size and compute in regression analysis"
    test_method: "Fit regression: Loss ~ α·log(params) + β·log(compute) + γ·Q(D) + ε. Measure R² improvement when adding Q(D) term."
    success_criterion: "ΔR² > 0.20 when Q(D) added to model-only and compute-only baseline. γ coefficient statistically significant (p < 0.01)."
    falsification: "If ΔR² < 0.05, quality is negligible factor. If γ not significant, relationship is noise."
  - id: "P3"
    primary: false
    statement: "Systematic quality variations (deduplication level, filter threshold) produce power-law performance changes when plotted log-log"
    test_method: "Vary single quality dimension (e.g., dedup ratio: 0%, 50%, 80%, 95%) while holding others constant. Train to same compute budget. Plot log(quality metric) vs log(loss)."
    success_criterion: "Log-log plot is approximately linear (R² > 0.85) indicating power-law relationship. Holds for at least 2 out of 3 quality dimensions tested."
    falsification: "If relationship is non-monotonic or non-linear in log-log space, power-law assumption invalid."

