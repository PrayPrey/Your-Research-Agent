# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "Training a 7B parameter language model costs millions of dollars in compute, yet foundation model developers routinely train on datasets where 30-40% of tokens are duplicates—paying full price for data that teaches nothing new."
    strategy: "practical_failure" # Waste of resources at massive scale

  why_reader_should_care:
    main_reason: "Foundation model scaling laws predict compute-optimal configurations, but treat all data tokens as equivalent. This ignores that data quality Q(D) could dramatically reduce compute requirements to reach target performance."
    concrete_example: "GPT-3 used fuzzy deduplication heuristics; Chinchilla optimized N-D ratios but assumed uniform data quality. No one has quantified the compute-quality tradeoff surface."
    stakes: "Billions in training costs, environmental impact of massive compute, and democratization barriers. If 20% quality improvement reduces compute 15%, a $10M training run becomes $8.5M."

  real_world_impact:
    application_domain: "Foundation model pretraining at billion-parameter scale"
    potential_beneficiaries: "ML practitioners, research labs, industry deploying LLMs"
    scale_of_impact: "Every foundation model training run (GPT, LLaMA, Gemini, etc.)"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Data quality matters for foundation model performance"
    common_understanding: "Everyone knows clean, diverse data improves models. GPT-3, Gopher, LLaMA all emphasize curation."

  deeper_problem:
    description: "Quality is treated as a binary (good/bad) or a heuristic (fuzzy dedup), not a measurable, continuous variable that interacts with compute budgets"
    why_overlooked: "Chinchilla scaling laws focused on N (params) and D (tokens) as continuous dimensions but left Q(D) as implicit. No operational definition existed."
    our_perspective: "We treat Q(D) as a fourth scaling dimension alongside N, D, C—measurable via deduplication ratio, domain diversity, perplexity, and token efficiency."

  gap_in_existing_work:
    description: "No quantitative framework for measuring data quality's effect on information density, and no evidence for compute-quality tradeoff curves"
    why_gap_exists: "Scaling law research inherited compute-only framing from Kaplan et al. Data-centric AI stayed qualitative (Ng). No one bridged them."
    why_gap_matters: "Without Q(D) measurement, practitioners can't make principled curation vs compute tradeoffs. You can't optimize what you don't measure."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Data quality Q(D) is measurable through deduplication, diversity, perplexity, and efficiency metrics, and strongly correlates (r=0.78) with information density—the 'bits of learning' per token."
    expanded_explanation: "We operationalize Q(D) as a composite metric and show it explains 61% of information density variance (R²=0.61) on controlled C4 subsets. Deduplication emerges as strongest predictor (r=0.72), validating GPT-3's empirical emphasis but providing quantitative grounding."

  why_others_missed_it:
    common_assumptions: "Prior work assumed quality was too dataset-specific or subjective to quantify universally. Scaling laws focused on N and D as 'clean' measurables."
    our_different_view: "We hypothesized that information-theoretic quality (entropy, redundancy) could proxy for downstream-agnostic quality and tested it empirically."
    enabling_factor: "Controlled experimental design: 12 C4 subsets with systematic quality variations (3 levels per dimension) enabled correlation analysis."

  what_makes_it_work:
    intuitive_explanation: "Duplicate tokens carry zero new information. Low-diversity corpora repeat concepts. High-perplexity data is noisy. Token efficiency captures signal density. Combine them → you measure 'information per token.'"
    key_mechanism: "Higher information density means each training step extracts more gradient signal. Model learns same patterns with fewer tokens, reducing compute for target performance."
    analogy: "Compressed sensing: fewer high-quality measurements suffice. Nutrition: 2000 calories of vegetables ≠ 2000 calories of sugar."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Q(D) metrics are measurable, reproducible, and correlate strongly with information density"
    measurable_criteria: "All 4 Q(D) components achieve r > 0.5, p < 0.01, CV < 10% across independent resamples"

  supporting_evidence:
    - id: "evidence_1"
      what: "All four Q(D) components (dedup, diversity, perplexity, efficiency) correlate r > 0.5 with information density (h-e1 PASS)"
      so_what: "Validates that Q(D) is not a single-factor phenomenon—all four dimensions contribute non-redundantly"
      how_it_supports_claim: "Multi-component validation proves Q(D) is robust, not an artifact of one metric"

    - id: "evidence_2"
      what: "Deduplication ratio strongest predictor (r=0.72, p=0.001), domain diversity second (r=0.65)"
      so_what: "Quantifies what practitioners knew heuristically (GPT-3 used fuzzy dedup, Pile emphasized diversity)"
      how_it_supports_claim: "Provides evidence-based ranking of quality dimensions for resource allocation"

    - id: "evidence_3"
      what: "Composite Q(D) achieves r=0.78, R²=0.61—explains 61% of information density variance"
      so_what: "205% above original prediction (20%). Effect size large enough to matter practically."
      how_it_supports_claim: "Exceeding prediction threshold increases confidence in scaling law integration feasibility"

    - id: "evidence_4"
      what: "Reproducibility: CV < 10% for all metrics across 3 independent C4 resamples"
      so_what: "Q(D) measurement is stable—not sample-dependent noise"
      how_it_supports_claim: "Low variance required for Q(D) to be useful in production settings"

  surprising_findings:
    finding: "Token efficiency weakest component (r=0.53 vs expected r~0.7) and composite Q(D) only +8% better than best single metric (dedup alone)"
    why_surprising: "Expected token efficiency (compression-based) to be strongest given information theory framing. Expected composite to show strong non-linear advantage."
    our_interpretation: "C4 already pre-filtered for length (efficiency ceiling effect). Quality dimensions near-linear suggests simple weighted average sufficient—good for practical deployment."

  what_results_mean:
    synthesis: "We have validated an operational Q(D) measurement framework suitable for scaling law research. h-e1 (correlation) passed with high confidence; h-m1 (causal mechanism) failed at PoC scale but code validated."
    confidence_level: "HIGH for measurement framework (h-e1); LOW for causal chain (h-m1 PoC insufficient, h-m2/h-c1 blocked)"
    caveats: "Web text only (C4). Scale-dependent effects: PoC showed 0.89% entropy reduction vs 20% threshold, suggesting quality effects emerge at >1B tokens. Compute efficiency claim untested."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First quantitative framework for measuring data quality in foundation model scaling laws, validated on 120GB of controlled C4 subsets with four non-redundant quality dimensions."
    why_significant: "Bridges data-centric AI (qualitative quality emphasis) and scaling laws (quantitative N-D-C relationships). Enables principled compute-quality tradeoff decisions."

  implications:
    for_field: "Researchers can now test compute efficiency hypotheses rigorously. Extends Chinchilla with Q(D) dimension. Opens path to L(N, D, Q(D), C) scaling law unification."
    for_practice: "Practitioners get evidence-based curation priorities: dedup > diversity > perplexity > efficiency. Can measure Q(D) before/after curation to estimate value."
    conceptual_contribution: "Operationalizes 'data quality' via information density proxy. Shifts quality from subjective judgment to measurable engineering parameter."

  future_possibilities:
    immediate_extensions: "Complete h-m1 at full scale (900 GPU-hours), validate causal mechanism (curation → density increase). Test h-m2 compute-quality tradeoff curves."
    longer_term_vision: "Unified scaling law L(N, D, Q(D), C) with Pareto-optimal resource allocation. Quality-aware data markets. Automated curation policies optimizing $/performance."
    open_questions: "Does Q(D) transfer to code/science domains? Are weights scale-invariant (1B-100B)? Optimal curation strategy given budget constraints?"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress the entire story into ~150 words - prioritize measurement framework validation over causal claims"
    key_message: "We provide first operational Q(D) metric validated on controlled experiments"
    structure_notes: |
      - Sentence 1-2: Billions wasted on duplicate tokens, no Q(D) measurement in scaling laws
      - Sentence 3: Four-component Q(D) metric (dedup, diversity, perplexity, efficiency)
      - Sentence 4-5: r=0.78 correlation, R²=0.61, dedup strongest (r=0.72)
      - Sentence 6: Enables future compute-quality tradeoff research
    avoid:
      - "Claiming compute efficiency multiplier (h-m2 untested)"
      - "Overstating causality (h-m1 PoC failed)"
      - "Ignoring partial validation status"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"

    hook_strategy: "practical_failure - $millions wasted on duplicate tokens at scale"

    problem_escalation: |
      1. Surface: Everyone knows quality matters (GPT-3 dedup, Pile diversity)
      2. Deeper: Quality treated as binary/heuristic, not measurable continuous variable
      3. Gap: No quantitative framework for Q(D) in scaling laws, can't optimize curation vs compute

    insight_preview: "Data quality is measurable via information density, and deduplication ratio is strongest predictor"

    contributions_framing: |
      Building on this insight, we:
      1. Define operational Q(D) metric (4 components)
      2. Validate correlation with information density (12 controlled C4 subsets)
      3. Provide evidence-based curation priority ranking
      [Note: Frame as measurement contribution, NOT complete scaling law - honest about h-m1/h-m2 gaps]

    transition_to_related_work: "Our work bridges data-centric AI's qualitative emphasis and scaling law theory's quantitative rigor."

  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our approach"

    positioning_strategy: "We quantify what prior work treats heuristically (GPT-3 dedup) or theoretically (Chinchilla N-D, ignores Q)"

    key_comparison_points:
      - area: "Scaling Laws (Chinchilla, Kaplan)"
        limitation_to_highlight: "Assume uniform data quality - all tokens equivalent in L(N,D) formulation"
        how_we_differ: "We add Q(D) as measurable fourth dimension with 4-component operationalization"

      - area: "Data Curation (GPT-3, Pile, LLaMA)"
        limitation_to_highlight: "Heuristic approaches (fuzzy dedup, manual domain selection) without quantitative validation"
        how_we_differ: "Empirical correlation study on controlled subsets - r=0.72 for dedup validates GPT-3 emphasis"

      - area: "Data-Centric AI (Ng et al.)"
        limitation_to_highlight: "Qualitative quality emphasis - 'quality over quantity' without operational metric"
        how_we_differ: "Information-theoretic Q(D) definition with reproducible measurement (CV<10%)"

    papers_to_discuss:
      - "Chinchilla (Hoffmann 2022) - baseline scaling law"
      - "GPT-3 (Brown 2020) - fuzzy dedup heuristic"
      - "The Pile (Gao 2020) - diversity emphasis"
      - "C4 Dataset (Raffel 2020) - corpus used"
      - "Data-Centric AI overview"

    avoid:
      - "Claiming we solve compute efficiency (h-m2 untested)"
      - "Overclaiming causality"
      - "Ignoring that Pile/GPT-3 practitioners were right empirically"

  methodology:
    narrative_purpose: "Explain WHY this design solves the problem - focus on measurement framework validation"

    connection_to_insight: "If Q(D) affects information density, we need: (1) operational Q(D) definition, (2) controlled quality variations, (3) density measurement, (4) correlation analysis"

    key_design_decisions:
      - decision: "Four-component Q(D) (dedup, diversity, perplexity, efficiency)"
        rationale: "Cover different information-theoretic quality dimensions: redundancy, coverage, noise, signal density"
        alternatives_considered: "Single metric (dedup only) insufficient - we test all 4 independently"

      - decision: "12 C4 subsets with systematic quality variations (3 levels per dimension)"
        rationale: "Controlled experiments isolate each quality factor's effect - enable correlation analysis"
        alternatives_considered: "Natural dataset comparison confounds quality dimensions"

      - decision: "Information density via token entropy + n-gram redundancy + semantic diversity"
        rationale: "Downstream-agnostic quality proxy - doesn't require task-specific benchmarks"
        alternatives_considered: "Task performance (MMLU) tests h-m2 hypothesis, not h-e1 correlation"

    intuition_building: |
      Figure 1 will show four scatter plots (one per Q(D) component vs info density)
      - Visual correlation strength (r values)
      - All positive slopes (monotonic)
      - Dedup tightest clustering (strongest r)

    technical_depth_balance: |
      Main text: Q(D) definitions, correlation results, reproducibility
      Appendix: Entropy computation details, MinHash LSH algorithm, statistical test procedures

  experiments:
    narrative_purpose: "Design experiments that test our specific claims - EXISTENCE proof, not full scaling law"

    experimental_questions:
      - question: "Do Q(D) components correlate r>0.5 with information density?"
        experiment: "h-e1: 12 C4 subsets, compute Q(D) + density, Pearson/Spearman tests"
        expected_outcome: "All 4 components pass threshold (h-e1 MUST_WORK gate)"

      - question: "Does curation causally increase density?"
        experiment: "h-m1: Train on curated vs baseline, measure entropy/Fisher change"
        expected_outcome: ">20% entropy reduction, >15% Fisher increase [FAILED at PoC scale]"

      - question: "How reproducible is Q(D) measurement?"
        experiment: "3 independent C4 resamples, compute CV for each component"
        expected_outcome: "CV < 10% for production use"

    baseline_rationale: "Random baseline (r~0) validates null hypothesis. Single-metric Q(D) tests composite advantage."
    dataset_rationale: "C4 most common pretraining corpus (GPT-3, T5, LLaMA) - web-scale text representative"
    metric_rationale: "Entropy/redundancy information-theoretic. Semantic diversity (embedding-based) captures concept coverage."

    fairness_considerations: |
      - Same GPT-2 model for all perplexity scores
      - Same sampling protocol for all 12 subsets
      - Same entropy computation (Shannon formula)
      - 3 independent resamples for reproducibility test

  results:
    narrative_purpose: "Present evidence that supports measurement framework claims - honest about h-m1 failure"

    main_result_highlight: "All four Q(D) components correlate r>0.5 (h-e1 PASS). Dedup strongest (r=0.72). Composite r=0.78, R²=0.61."

    result_presentation_order:
      - result: "Table 1: Correlation matrix (4 Q(D) components vs info density)"
        purpose: "Lead with primary success - all components pass gate"

      - result: "Figure 1: Scatter plots showing positive correlations"
        purpose: "Visual confirmation of monotonic relationships"

      - result: "Figure 2: Reproducibility (CV bars, 10% threshold line)"
        purpose: "Establish measurement stability"

      - result: "Table 2: h-m1 PoC results (0.89% entropy, -20.84% Fisher)"
        purpose: "Honest negative result - scale-dependent effects"

    surprising_result_handling: "h-m1 Fisher opposite direction (-20.84% vs +15% expected). Hypothesis: (a) PoC scale artifact, (b) easier data reduces gradients, (c) diagonal FIM approximation insufficient. Full experiment needed."

    avoid:
      - "Hiding h-m1 PoC failure"
      - "Claiming compute efficiency (h-m2 blocked)"
      - "Overselling R²=0.61 as complete theory"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, show significance - HONEST about partial validation"

    key_findings_interpretation: "We validated Q(D) measurement framework (h-e1 HIGH confidence). Causal mechanism (h-m1) and compute tradeoff (h-m2) require full-scale experiments. This is a measurement tool, not complete scaling law."

    honest_limitations:
      - limitation: "Web text only (C4) - generalization to code/science unknown"
        why_acceptable: "C4 most common pretraining corpus - validates where it matters most"
        future_mitigation: "Test on The Stack (code), arXiv (science), mC4 (multilingual)"

      - limitation: "h-m1 PoC failed (0.89% vs 20% threshold) - causal mechanism untested"
        why_acceptable: "Scale-dependent effects (PoC 0.005% of spec). Code validated, full experiment budgeted (900 GPU-hours)."
        future_mitigation: "Execute 9 conditions × 50GB × 50k steps as specified"

      - limitation: "Correlation not causation - h-m2 compute tradeoff curves blocked"
        why_acceptable: "Measurement framework is standalone contribution. Causality future work."
        future_mitigation: "Complete h-m1 → h-m2 → h-c1 hypothesis chain"

      - limitation: "Fisher information unstable (opposite direction)"
        why_acceptable: "Entropy still valid density proxy (r=0.78). Fisher optional, not required."
        future_mitigation: "Validate Fisher at full scale or replace with gradient norm"

    broader_impact_statement: "Positive: Reduces training costs/environmental impact via better curation. Negative: Could amplify biases if quality metrics favor certain demographics. Mitigation: Fairness-aware Q(D) extensions."

  conclusion:
    narrative_purpose: "Reinforce key message + open future directions - callback to wasted compute hook"

    callback_to_hook: "We opened with billions wasted on duplicate tokens. We close with a measurement tool that quantifies that waste: dedup ratio r=0.72 → you can now estimate value of curation investments."

    memorable_ending: "Foundation model scaling laws have long optimized N and D. With validated Q(D) measurement, we can now optimize the third dimension—data quality itself."

    future_work_vision: |
      Immediate: Complete h-m1 full-scale experiment, validate causal mechanism
      Medium-term: h-m2 compute-quality tradeoff curves, h-c1 scale-invariance tests
      Long-term: Unified L(N, D, Q(D), C) scaling law with Pareto-optimal resource allocation

