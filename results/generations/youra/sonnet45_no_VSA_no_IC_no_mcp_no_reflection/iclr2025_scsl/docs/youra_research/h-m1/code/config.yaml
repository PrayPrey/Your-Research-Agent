experiment:
  name: "h-m1-layer-neuron-consistency"
  hypothesis_id: "h-m1"
  hypothesis_type: "MECHANISM"
  prerequisite: "h-e1"

training:
  epochs: 20
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.9

data:
  dataset_name: "CMNIST"
  data_path: "./data/mnist"
  download: true
  batch_size: 256
  num_workers: 4
  spurious_feature: "color"
  spurious_train_correlation: 0.95
  spurious_test_correlation: 0.10

model:
  architecture: "resnet18"
  num_classes: 10
  pretrained: false
  layer_names:
    - conv1
    - layer1
    - layer2
    - layer3
    - layer4

analysis:
  alpha: 0.05
  test_type: "one_sided"
  early_layers:
    - conv1
    - layer1
  late_layers:
    - layer3
    - layer4
  correlation_method: "pearson"
  max_neurons_heatmap: 100
  figure_dpi: 300
  cdf_bins: 50

output:
  output_folder: "../"
  figures_folder: "../figures"
  checkpoint_folder: "../checkpoints"
  validation_report: "../04_validation.md"
  bar_chart: "layer_correlation_means.png"
  heatmap: "neuron_correlation_heatmap.png"
  cdf_plot: "correlation_cdf.png"

reproducibility:
  seed: 0
  device: "cuda"
