# h-c1 Gradient-Aware Training Configuration

experiment:
  name: "h-c1-gradient-aware-training"
  hypothesis_id: "h-c1"
  hypothesis_type: "CONDITION"
  prerequisite: "h-m1"

data:
  dataset_name: "Waterbirds"
  data_root: "./data/waterbirds"
  download: false  # Manual download required
  batch_size: 64  # Reduced for ResNet-50 memory
  num_workers: 2
  image_size: 224
  horizontal_flip: true

model:
  architecture: "resnet50"
  num_classes: 2
  pretrained: true

optimizer:
  type: "sgd"
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0001

scheduler:
  type: "cosine"
  epochs: 100  # Reduced for faster validation

training:
  epochs: 100  # Reduced from 300 for ablation test
  log_interval: 5
  checkpoint_best: true
  gradient_clip_norm: 1.0
  lr_floor: 0.00001

gradient_aware:
  rho_j_source: "../h-m1/results/layer_rho_j.npy"
  update_interval: 10
  modulation_formula: "lr * (1 - rho_j)"
  # Fallback: use h-m1 validation report layer means
  fallback_rho:
    conv1: 0.001
    layer1: 0.004
    layer2: 0.005
    layer3: 0.003
    layer4: 0.000

jtt:
  stage1_epochs: 30  # Reduced from 100
  stage2_epochs: 60  # Reduced from 200
  upweight_factor: 10

evaluation:
  metrics:
    - "worst_group_accuracy"
    - "average_accuracy"
    - "per_group_accuracy"
  num_groups: 4

statistical_test:
  num_seeds: 3  # Reduced from 10 for faster validation
  alpha: 0.05
  test_type: "paired_ttest"
  target_threshold: 0.86

output:
  output_folder: "./h-c1"
  checkpoint_folder: "./h-c1/checkpoints"
  figures_folder: "./h-c1/figures"
  validation_report: "04_validation.md"
  gate_metrics_bar: "gate_metrics.png"
  lr_modulation_heatmap: "lr_modulation.png"
  training_curves: "training_curves.png"
  per_group_accuracy: "per_group_accuracy.png"

reproducibility:
  seeds: [0, 1, 2]  # Reduced from 10 seeds
  device: "cuda"
  cudnn_deterministic: true
