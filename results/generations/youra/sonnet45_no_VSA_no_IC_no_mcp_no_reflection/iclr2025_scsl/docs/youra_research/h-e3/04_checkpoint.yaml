    ## Limitation Details

    GradCAM temporal ratio R_temporal(t) did NOT show expected monotonic decrease from epoch 5 to 50. Instead, the ratio oscillated around 0.49 with minimal change (Δ=-0.011, i.e., 1.1% INCREASE instead of expected 10% decrease).

    Root cause: Simplified spatial masks (top_half/bottom_half) do NOT effectively separate spurious features (color) from core features (shape) in CMNIST, where color bias is globally distributed rather than spatially localized.

    ## Failed Checks

    - Delta = -0.011 (INCREASE instead of decrease)
    - Direction check failed: R_temporal(5) < R_temporal(50)
    - Effect size failed: |Delta| = 0.011 << 0.1 threshold
    - Monotonic trend (Kendall τ < -0.7) not observed

    ## Partial Results

    | Metric | Value |
    |--------|-------|
    | R_temporal_epoch_5 | 0.478 |
    | R_temporal_epoch_50 | 0.489 |
    | delta | -0.011 |
    | worst_group_acc | 0.94 |

    ## Experiment Summary

    PoC experiment (seed 0) completed successfully with:
    - R_temporal tracked from epoch 5 to 50
    - Simplified spatial masks (top_half/bottom_half)
    - Dataset: CMNIST (substituted for unavailable Waterbirds)

    Key finding: While h-e1 gradient convergence metric showed temporal ordering (E_spurious < E_core), h-e3 GradCAM spatial ratio did NOT show the expected shift from spurious to core regions over time. This cross-method inconsistency suggests the simplified spatial masking approach is inadequate for CMNIST's global color bias.

    ## Context

    This limitation was recorded but **did not block the pipeline**.
    The hypothesis proceeded to Phase 5 with this limitation noted.

    Future research attempts should consider:
    1. The specific checks that failed
    2. Whether the limitation is fundamental or circumstantial
    3. Alternative approaches that might avoid this limitation

    Recommended improvements:
    - Use Waterbirds dataset with proper background segmentation
    - Replace simplified spatial masks with semantic segmentation masks
    - Test alternative attribution methods (Integrated Gradients, LIME)

