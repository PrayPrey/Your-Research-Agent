# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "JTT/LfF demonstrate that reweighting hard examples improves worst-group accuracy"
      status: "BUILD_ON"
      evidence: "Nam et al. (NeurIPS 2020), Liu et al. (ICML 2021) - established empirical methods"
    - claim: "SAM shows that flat minima (low sharpness) improve robustness"
      status: "BUILD_ON"
      evidence: "Foret et al. (ICLR 2021) - sharpness-aware minimization improves generalization"
    - claim: "Spurious features are learned earlier than core features (temporal hypothesis)"
      status: "PROVE_NEW"
      evidence: "Hypothesized by JTT/LfF but never directly measured via gradient tracking - this is our core contribution"
    - claim: "CNNs and ViTs have different architectural inductive biases"
      status: "BUILD_ON"
      evidence: "Local receptive fields vs global attention - established architectural property"
  scope_reduction_percentage: 25
  phase2b_4_instructions: |
    Build on established debiasing methods (JTT, SAM) and architectural properties.
    Focus verification on NEW claims: gradient-level temporal signature (E_s < E_c),
    multi-metric correlation (variance, forgetting), architectural modulation (CNN vs ViT gaps).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TemporalGradient-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under gradient descent optimization on spurious correlation benchmarks (CMNIST, Waterbirds, CelebA, NICO++),
    if we measure per-epoch gradient norms for spurious features vs core features,
    then spurious features will converge significantly earlier (E_s < E_c by ≥2 epochs),
    because spurious features provide simpler, lower-level decision boundaries that gradient descent implicitly prefers early in training.
  alternative_hypothesis_h0: |
    There is no significant difference in convergence epoch between spurious and core features (E_s ≥ E_c),
    or any observed temporal gap is negligible (< 2 epochs).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Feature Type"
      type: "categorical"
      operationalization: "Spurious (background, color, context) vs Core (shape, morphology, target attribute)"
      levels: ["Spurious", "Core"]
    - name: "Architecture"
      type: "categorical"
      operationalization: "CNN (ResNet-50/18) vs Vision Transformer (ViT-B/16)"
      levels: ["ResNet", "ViT"]
    - name: "Dataset"
      type: "categorical"
      operationalization: "CMNIST, Waterbirds, CelebA, NICO++"
      levels: ["CMNIST", "Waterbirds", "CelebA", "NICO++"]
  dependent:
    - name: "Convergence Epoch (E)"
      type: "continuous"
      operationalization: "Epoch when gradient norm drops below 10% of peak for 3 consecutive epochs"
      primary: true
    - name: "Gradient Variance (V)"
      type: "continuous"
      operationalization: "Rolling 3-epoch standard deviation of gradient norms"
      primary: false
    - name: "Forgetting Rate (F)"
      type: "continuous"
      operationalization: "Fraction of examples that flip predictions more than once (Toneva et al. 2019)"
      primary: false
    - name: "GradCAM Temporal Ratio (R_temporal)"
      type: "continuous"
      operationalization: "A_spurious / (A_spurious + A_core) computed from GradCAM saliency maps"
      primary: false
  controlled:
    - name: "Optimizer"
      operationalization: "SGD with momentum 0.9 (standard for spurious benchmarks)"
    - name: "Learning Rate Schedule"
      operationalization: "Cosine annealing or step decay (per dataset standard)"
    - name: "Random Seeds"
      operationalization: "10 random seeds per experiment (statistical power)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Gradient descent has implicit bias toward max-margin solutions (Soudry et al. 2018)"
      evidence: "Established optimization theory - GD prefers simpler decision boundaries on separable data"
      falsifier: "If GD showed no preference for simpler features, temporal separation would not emerge"
    - step: 2
      description: "Spurious features (color, background) provide simpler, lower-level decision boundaries than core features (shape, semantics)"
      evidence: "Low-level visual features processed in early conv layers, core features require deeper semantic processing"
      falsifier: "If spurious and core features had equal complexity, convergence speed would be identical"
    - step: 3
      description: "Simpler features converge faster because their gradient landscape is smoother (fewer local minima)"
      evidence: "SAM shows flat minima correlate with robustness; spurious features likely have sharper, faster-convergence basins"
      falsifier: "If spurious features had complex, non-convex landscapes, they would converge slower"
    - step: 4
      description: "Early convergence of spurious features causes network to commit to spurious solution, slowing core feature learning"
      evidence: "JTT demonstrates that reweighting late-learned examples (core features) improves robustness"
      falsifier: "If early spurious convergence didn't interfere with core learning, reweighting wouldn't work"
  key_tension: "Forgetting rate may be derived from convergence epoch rather than independent metric - partial correlation test (Test 4) will determine independence"
  evidence_summary: |
    Causal chain builds on: (1) implicit bias theory (Soudry), (2) hierarchical feature processing (CNNs),
    (3) loss landscape geometry (SAM, Li et al.), (4) empirical debiasing success (JTT).
    Each step falsifiable via controlled experiments (ablation training, gradient tracking).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Gradient norm convergence is a valid proxy for feature learning completion"
    supporting_evidence: "Standard optimization literature uses gradient norm as convergence criterion"
    consequence_if_violated: "Measured E_s and E_c may not reflect true feature learning timeline - would need alternative metric (e.g., feature attribution strength)"
  - id: "A2"
    assumption: "Ablation training (spurious-only vs core-only) preserves learning dynamics of the full problem"
    supporting_evidence: "Widely used technique in interpretability research (e.g., feature knockout experiments)"
    consequence_if_violated: "E_s and E_c from ablation runs may not generalize to baseline training - cross-validate with R_temporal from full training"
  - id: "A3"
    assumption: "GradCAM spatial attribution accurately identifies spurious vs core regions"
    supporting_evidence: "GradCAM validated for saliency in numerous vision papers"
    consequence_if_violated: "R_temporal may misattribute regions - validate via connected-component analysis and cross-check with ablation E_s"
  - id: "A4"
    assumption: "Temporal gap (E_s - E_c) is consistent across random seeds"
    supporting_evidence: "10 random seeds provide statistical power to detect consistent effects"
    consequence_if_violated: "Large variance across seeds would indicate phenomenon is not robust - require p < 0.05 for validation"
  - id: "A5"
    assumption: "Neuron-spurious correlation (ρ_j) computed from ablation data reflects neuron behavior in full training"
    supporting_evidence: "Assumption requires validation via layer-neuron consistency test (Test 8)"
    consequence_if_violated: "Feature-selective learning rate modulation would target wrong neurons - intervention would fail"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Vision domain spurious correlation benchmarks (image classification)
    - Low-level visual spurious features (color, background texture)
    - Mid-level semantic spurious features (object-context associations in NICO++)
    - Attribute-based spurious correlations (gender-attribute in CelebA)
    - Gradient descent-based optimizers (SGD, Adam, AdamW)
    - CNN and Vision Transformer architectures
  does_not_apply_to: |
    - Text/audio/multimodal spurious correlations (not tested, likely different dynamics)
    - Reinforcement learning or non-gradient optimization
    - Spurious correlations requiring high-level reasoning (e.g., logical rules)
    - Non-supervised learning settings (self-supervised, unsupervised)
  known_limitations: |
    - Tested on 4 vision benchmarks only - generalization beyond vision uncertain
    - Architectural comparison limited to ResNet vs ViT - other architectures (ConvNeXt, Swin) untested
    - Intervention (gradient-aware training) tested only on Waterbirds - may not generalize to all benchmarks
    - Forgetting rate metric may be derived from convergence epoch (pending Test 4 partial correlation result)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Spurious features converge at least 2 epochs earlier than core features across all 4 datasets"
    test_method: "Paired t-test on (E_s, E_c) across 10 random seeds per dataset"
    success_criterion: "p < 0.05 AND mean(E_c - E_s) ≥ 2 epochs for each dataset"
    falsification: "If E_s ≥ E_c OR mean gap < 2 epochs for any dataset, temporal hypothesis is falsified for that dataset"
  - id: "P2"
    primary: false
    statement: "Spurious features exhibit lower gradient variance than core features during convergence"
    test_method: "F-test for variance ratio across epochs [E_s - 3, E_s + 3]"
    success_criterion: "p < 0.05 AND variance_ratio < 0.7"
    falsification: "If variance_ratio ≥ 0.7, gradient stability is not a distinguishing feature"
  - id: "P3"
    primary: false
    statement: "GradCAM temporal ratio R_temporal(t) decreases monotonically from epoch 5 to 50"
    test_method: "Kendall τ correlation between R_temporal(t) and epoch t"
    success_criterion: "τ < -0.7 AND p < 0.05"
    falsification: "If τ ≥ -0.7 OR non-significant, GradCAM temporal ratio is not a valid diagnostic"
  - id: "P4"
    primary: false
    statement: "CNNs show larger temporal gaps (E_c - E_s) than Vision Transformers"
    test_method: "Independent samples t-test on Δ_ResNet vs Δ_ViT (10 seeds each)"
    success_criterion: "p < 0.05 AND mean difference ≥ 2 epochs"
    falsification: "If no significant difference, architectural modulation hypothesis is false"
  - id: "P5"
    primary: false
    statement: "Gradient-aware training matches or exceeds JTT worst-group accuracy on Waterbirds"
    test_method: "Paired t-test on worst-group accuracy (10 seeds)"
    success_criterion: "mean(Gradient-Aware) ≥ mean(JTT) - 1% AND p < 0.05"
    falsification: "If Gradient-Aware underperforms JTT by >3%, intervention hypothesis is weak"

