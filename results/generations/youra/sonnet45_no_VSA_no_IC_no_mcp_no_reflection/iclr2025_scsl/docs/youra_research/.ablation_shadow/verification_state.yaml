main_hypothesis:
  id: H-TemporalGradient-v1
  title: Gradient-Level Temporal Signature of Spurious Feature Learning
  statement: Under gradient descent optimization on spurious correlation benchmarks (CMNIST, Waterbirds, CelebA, NICO++),
    if we measure per-epoch gradient norms for spurious features vs core features, then spurious features will converge significantly
    earlier (E_s < E_c by ≥2 epochs), because spurious features provide simpler, lower-level decision boundaries that gradient
    descent implicitly prefers early in training.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: CMNIST, Waterbirds, CelebA, NICO++
    model: ResNet-50/18, ViT-B/16
    optimizer: SGD with momentum 0.9
    hyperparameters:
      learning_rate: Dataset-specific (cosine annealing or step decay)
      batch_size: Dataset-specific standard
      epochs: 50-200 (dataset-dependent)
      random_seeds: 10
