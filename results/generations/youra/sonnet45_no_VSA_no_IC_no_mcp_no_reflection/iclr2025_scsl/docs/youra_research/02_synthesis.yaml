hypothesis_draft:
  title: "Gradient-Level Temporal Signature of Spurious Feature Learning"
  hypothesis_id: "H-TemporalGradient-v1"
  core_claim: |
    Under gradient descent optimization on spurious correlation benchmarks,
    spurious features converge significantly earlier than core features (E_s < E_c by ≥2 epochs)
    because spurious features provide simpler, lower-level decision boundaries that
    gradient descent implicitly prefers early in training.
  mechanism: |
    (1) Gradient descent has implicit bias toward max-margin, simpler solutions (Soudry et al. 2018).
    (2) Spurious features (color, background) are lower-level, processed in early conv layers.
    (3) Core features (shape, semantics) are higher-level, require deeper processing.
    (4) Simpler features have smoother gradient landscapes, enabling faster convergence.
    (5) Early spurious convergence commits network to spurious solution, slowing core feature learning.
  predictions:
    - P1: "E_s < E_c by ≥2 epochs across CMNIST, Waterbirds, CelebA, NICO++ (p < 0.05)"
    - P2: "V_spurious < V_core (variance ratio < 0.7, p < 0.05)"
    - P3: "R_temporal(t) monotonically decreasing (Kendall τ < -0.7, p < 0.05)"
    - P4: "Δ_ResNet > Δ_ViT (CNN shows larger temporal gap than ViT, p < 0.05)"
    - P5: "Gradient-aware training matches JTT worst-group accuracy (within 1%)"

variables_summary:
  independent: "Feature Type (Spurious vs Core), Architecture (ResNet vs ViT), Dataset (CMNIST, Waterbirds, CelebA, NICO++)"
  dependent_primary: "Convergence Epoch (E) - when gradient norm < 10% of peak for 3 consecutive epochs"
  controlled: "Optimizer (SGD momentum 0.9), Learning Rate Schedule (cosine annealing), Random Seeds (10 per experiment)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in convergence epoch between spurious and core features (E_s ≥ E_c),
    or any observed temporal gap is negligible (< 2 epochs).
  statistical_test: "Paired t-test on (E_s, E_c) across 10 random seeds"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First rigorous gradient-level validation of temporal hypothesis + GradCAM temporal ratio R_temporal(t) as continuous diagnostic"
  differentiation_summary: |
    JTT hypothesizes temporal dynamics but doesn't measure gradients directly.
    SAM focuses on sharpness, we extend to temporal dynamics.
    Toneva tracks example-level forgetting, we adapt to feature-level (spurious vs core).

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "ResNet-18 (CMNIST)"
    - "ResNet-50 (Waterbirds, CelebA, NICO++)"
    - "ViT-B/16 (Waterbirds, CelebA)"
  datasets:
    - "CMNIST (color spurious)"
    - "Waterbirds (background spurious)"
    - "CelebA (gender attribute spurious)"
    - "NICO++ (context spurious)"
  baselines:
    - "ERM (standard training)"
    - "JTT (Just Train Twice - SOTA reweighting)"
    - "Layer-wise Regularization (falsification baseline)"

measurement_plan:
  data_collection:
    - source: "Per-epoch gradient norms for spurious vs core features"
    - source: "GradCAM saliency maps computed at each epoch"
    - source: "Forgetting events tracked per Toneva et al. (2019)"
    - source: "Neuron-spurious correlation ρ_j from ablation training"
  procedure:
    - step: "Phase 1: Run ablation training (spurious-only, core-only, baseline) on CMNIST with 10 seeds"
    - step: "Phase 1: Measure E_s, E_c, V_spurious, V_core, F_spurious, F_core per seed"
    - step: "Phase 1: Statistical tests 1-4 (temporal ordering, variance, forgetting, partial correlation)"
    - step: "Phase 2: Compute R_temporal(t) via GradCAM on Waterbirds/CelebA/NICO++ (ResNet + ViT)"
    - step: "Phase 2: Statistical tests 5-8 (monotonicity, cross-method consistency, architecture comparison, layer-neuron consistency)"
    - step: "Phase 3: Implement gradient-aware training (lr_j = lr_base * (1 - ρ_j))"
    - step: "Phase 3: Compare against ERM, JTT, Layer-wise Regularization on Waterbirds (10 seeds)"
    - step: "Phase 3: Statistical test 9 (mechanistic validation: gradient-aware vs layer-wise)"
  success_criteria:
    - "Tests 1-3 pass: E_s < E_c, V_spurious < V_core, F_spurious < F_core"
    - "Tests 5-6 pass: R_temporal(t) monotonic, cross-validates with E_s"
    - "Test 7 passes: Δ_ResNet > Δ_ViT (architectural modulation)"
    - "Test 9 passes: Gradient-aware > Layer-wise (mechanistic story validated)"
    - "Phase 3: Gradient-aware worst-group acc ≥ JTT - 1%"

validation:
  internal_validity:
    - "10 random seeds per experiment (statistical power for small effects)"
    - "Paired statistical tests control for seed-to-seed variance"
    - "Ablation training (spurious-only, core-only) isolates feature contributions"
    - "Layer-wise regularization baseline falsifies 'regularization in disguise' alternative"
  external_validity:
    - "4 diverse datasets (CMNIST, Waterbirds, CelebA, NICO++) cover low-level to context-based spurious features"
    - "2 architectures (ResNet, ViT) test architectural invariance"
    - "Comparison to SOTA baseline (JTT) establishes practical relevance"

