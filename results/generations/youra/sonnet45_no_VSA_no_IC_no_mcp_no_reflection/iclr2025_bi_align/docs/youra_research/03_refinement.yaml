# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "Anthropic-HH (Helpful & Harmless)"
    type: "standard"
    source: "https://github.com/anthropics/hh-rlhf"
    path: "hh-rlhf/helpful-base and hh-rlhf/harmless-base"
    hypothesis_fit: |
      Contains pairwise preference comparisons across diverse conversational tasks (QA, creative,
      opinion, advice). Includes both base model and RLHF-tuned model responses, enabling Part 1
      retrospective analysis. Large scale (160K+ comparisons) supports robust entropy calculation.
  model:
    name: "Pythia-1B (for Part 2 checkpoint experiment)"
    type: "decoder-only transformer"
    source: "EleutherAI Pythia suite"
    hypothesis_fit: |
      Open-source model with published training checkpoints, enabling reproducible RLHF experiments.
      1B parameter scale is compute-feasible for multi-checkpoint training (12 GPU-hours estimated).
      Small enough for rapid iteration, large enough to show RLHF training dynamics.
  baselines:
    - name: "Base model preference entropy (no RLHF)"
      method: "Compute entropy on base Pythia-1B outputs to establish high-diversity baseline"
    - name: "Performance-predicted entropy reduction"
      method: "Use objective task ΔH/ΔP ratio as baseline expectation for subjective tasks — excess reduction beyond this indicates overcorrection"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First application of information-theoretic entropy to measure bidirectional alignment failure.
    Introduces "inflection point detection" methodology for identifying when RLHF training crosses
    from quality improvement to preference monoculture imposition. Reframes preference variance as
    signal (critical evaluation capacity) rather than noise (measurement error).
  key_innovation: |
    **Entropy collapse as bidirectional alignment gap metric**: Existing benchmarks measure AI→human
    alignment (preference agreement), but ignore human→AI alignment (preserved critical diversity).
    Preference entropy provides a quantifiable proxy for collective human agency preservation.
  differentiation:
    - prior_work: "Traditional RLHF evaluation (Ouyang et al. InstructGPT, Bai et al. Constitutional AI)"
      difference: "Measures preference agreement as success metric. High consensus = good alignment. Does not measure whether consensus erases legitimate diversity."
    - prior_work: "HCI user empowerment metrics (user control, perceived agency)"
      difference: "Requires user studies and self-reported measures. Entropy approach uses existing preference data, no new human evaluation needed."
    - prior_work: "Reward hacking detection (over-optimization on proxy metrics)"
      difference: "Focuses on model exploiting misspecified reward functions. Entropy collapse focuses on user behavior homogenization, not model behavior."

