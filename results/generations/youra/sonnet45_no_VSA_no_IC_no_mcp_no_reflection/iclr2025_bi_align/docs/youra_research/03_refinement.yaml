# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "RLHF training reduces preference variance compared to base models"
      status: "BUILD_ON"
      evidence: "Existing RLHF literature (Ouyang et al. InstructGPT, Bai et al. Constitutional AI) shows increased preference agreement with RLHF-tuned models vs base models"
    - claim: "Preference entropy is a valid information-theoretic measure of diversity"
      status: "BUILD_ON"
      evidence: "Shannon entropy is established metric for distribution uncertainty/diversity"
    - claim: "Current RLHF benchmarks measure preference agreement, not preference diversity"
      status: "PROVE_NEW"
      evidence: "Phase 1 gap analysis identified absence of human agency metrics in evaluation frameworks"
  scope_reduction_percentage: 33
  phase2b_4_instructions: |
    Claims 1-2 are established and require citation only, not re-validation.
    Claim 3 (current benchmarks ignore diversity) is the novel contribution requiring experimental demonstration.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EntropyCollapse-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under RLHF training on preference datasets (Anthropic-HH, WebGPT), if models undergo
    extended alignment optimization beyond initial performance saturation, then preference
    distribution entropy collapses faster than task performance improves, because users
    habituate to model output style and converge on preferences even for subjective tasks
    where diversity is legitimate.
  alternative_hypothesis_h0: |
    There is no significant difference in the entropy-reduction-per-performance-gain ratio
    (dH/dP) between RLHF training phases. Entropy reduction is fully explained by task
    quality improvements.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "RLHF Training Stage"
      type: "categorical"
      operationalization: "Model checkpoint: Base, RLHF-1K, RLHF-5K, RLHF-10K, RLHF-20K steps"
      levels: ["base", "rlhf_1k", "rlhf_5k", "rlhf_10k", "rlhf_20k"]
    - name: "Task Type"
      type: "categorical"
      operationalization: "Objective (factual QA, code correctness) vs Subjective (creative writing, opinion)"
      levels: ["objective", "subjective"]
  dependent:
    - name: "Preference Entropy (H)"
      type: "continuous"
      operationalization: "Shannon entropy of preference distribution: H = -Σ p_i log(p_i), where p_i is proportion of users choosing option i for a given prompt. Range: [0, log(n_options)]. Higher = more diverse preferences."
      primary: true
    - name: "Task Performance (P)"
      type: "continuous"
      operationalization: "Win rate against baseline model (for Anthropic-HH) or accuracy (for factual QA subsets). Range: [0, 1]."
      primary: false
    - name: "Entropy Reduction Rate (dH/dP)"
      type: "continuous"
      operationalization: "Change in entropy per unit performance gain: dH/dP = (H_t - H_{t-1}) / (P_t - P_{t-1}). Negative values indicate entropy decreases as performance improves."
      primary: false
  controlled:
    - name: "Preference Collection Protocol"
      operationalization: "Use same pairwise comparison methodology (A vs B ranking) across all model checkpoints"
    - name: "Prompt Set"
      operationalization: "Fixed 1K prompts from Anthropic-HH, stratified across task types"
    - name: "User Population"
      operationalization: "Control for population shift by using same labeler pool or demographically matched samples"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Base models produce high-variance outputs due to lack of alignment → users express diverse legitimate preferences → high preference entropy (baseline state)"
      evidence: "Base LLMs (GPT-2, Pythia) show wide output variation on open-ended prompts, documented in RLHF literature"
      falsifier: "If base model preference entropy is already low (near-consensus), the mechanism fails at step 1"
    - step: 2
      description: "Initial RLHF training (steps 1K-5K) optimizes for preference agreement → model outputs improve quality and consistency → entropy decreases proportionally to performance gains (justified reduction)"
      evidence: "Standard RLHF learning curves show rapid performance improvement in early training stages"
      falsifier: "If entropy does not decrease during early RLHF training, or decreases faster than performance improves even in early stages, the mechanism is incorrect"
    - step: 3
      description: "Continued RLHF training beyond performance saturation (steps 10K-20K) → users habituate to model output style → preference convergence accelerates beyond quality improvements (inflection point)"
      evidence: "Hypothesis-specific: requires experimental detection of inflection point where dH/dP rate changes"
      falsifier: "If dH/dP remains constant across all training stages (no inflection point), the overcorrection claim is unsupported"
    - step: 4
      description: "Entropy collapse is greater on subjective tasks (where diversity should persist) than objective tasks (where consensus is legitimate) → evidence of preference monoculture imposition, not just quality improvement"
      evidence: "Hypothesis-specific: requires task stratification analysis showing differential entropy reduction rates"
      falsifier: "If objective and subjective tasks show identical entropy reduction patterns, the monoculture claim is unsupported"
  key_tension: "Distinguishing legitimate entropy reduction (users agree because AI is correct) from problematic entropy collapse (users agree because they stopped critically evaluating)"
  evidence_summary: |
    Steps 1-2 build on established RLHF training dynamics. Steps 3-4 are novel hypotheses requiring
    experimental validation through checkpoint analysis and task stratification.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Preference entropy is a valid proxy for human critical evaluation capacity"
    supporting_evidence: "Information theory: higher entropy = greater diversity/uncertainty in judgments, indicating active deliberation rather than passive acceptance"
    consequence_if_violated: "If entropy is orthogonal to critical thinking (e.g., users show low entropy but high override rates), the hypothesis mechanism fails"
  - id: "A2"
    assumption: "RLHF training can continue beyond performance saturation (inflection point exists)"
    supporting_evidence: "Many RLHF implementations use fixed step counts (10K-50K) without early stopping based on performance plateaus"
    consequence_if_violated: "If RLHF training always stops before inflection point, the overcorrection phenomenon may not occur in practice"
  - id: "A3"
    assumption: "Subjective tasks legitimately support diverse preferences (no single correct answer)"
    supporting_evidence: "Tasks like creative writing, opinion questions, stylistic preferences have no ground truth — diversity is expected"
    consequence_if_violated: "If all tasks converge to ground truth over time, entropy reduction on subjective tasks could be justified by users learning correct answers"
  - id: "A4"
    assumption: "Cross-user preference entropy reflects collective critical diversity, not just population heterogeneity"
    supporting_evidence: "By controlling for task type and using fixed prompt sets, we isolate entropy changes due to model influence, not shifting user demographics"
    consequence_if_violated: "If entropy changes are driven by population composition shifts (different labelers at different training stages), we're measuring confound, not mechanism"
  - id: "A5"
    assumption: "Existing RLHF preference datasets (Anthropic-HH, WebGPT) contain sufficient raw preference distributions to compute entropy (not just aggregated win rates)"
    supporting_evidence: "Anthropic-HH publishes pairwise comparison data; entropy computable from response frequency distributions"
    consequence_if_violated: "If datasets only publish summary statistics (mean win rate), entropy cannot be calculated — requires access to raw preference counts"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    RLHF training on preference datasets for conversational AI, QA systems, and text generation tasks.
    Applies to models trained with PPO or similar RL algorithms optimizing for preference agreement.
    Relevant for evaluation benchmarks measuring alignment quality (Anthropic-HH, InstructGPT evals,
    Constitutional AI metrics).
  does_not_apply_to: |
    Supervised fine-tuning (SFT) without reinforcement learning — no preference optimization occurs.
    Single-task models with objective ground truth only (e.g., pure math solvers) — no subjective
    preference diversity expected.
    Non-conversational domains (image generation, robotics) where preference entropy has different
    operational meaning.
  known_limitations: |
    - Cannot distinguish individual user critical thinking from population-level heterogeneity (cross-user entropy conflation)
    - Requires access to intermediate RLHF training checkpoints (not always publicly available)
    - Task stratification (objective vs subjective) relies on human judgment of "ground truth existence"
    - Entropy calculation requires raw preference distributions, not just aggregated metrics

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Preference entropy decreases monotonically with RLHF training steps, with an inflection point where entropy reduction accelerates beyond performance improvement (dH/dP rate increases)"
    test_method: "Part 2 checkpoint experiment: Compute H and P at base, RLHF-1K, 5K, 10K, 20K. Fit segmented regression to detect change point in dH/dP slope."
    success_criterion: "Inflection point detected at RLHF-10K steps (±2K) where |dH/dP| increases by ≥50% compared to early-stage baseline"
    falsification: "If dH/dP remains constant (±10%) across all checkpoints, no inflection point exists — entropy reduction is linear with performance"
  - id: "P2"
    primary: false
    statement: "Subjective tasks (creative writing, opinion) show greater entropy reduction than objective tasks (factual QA) when controlling for performance gains"
    test_method: "Part 3 stratification: Split dataset into objective vs subjective. Compare ΔH/ΔP ratios between task types."
    success_criterion: "Subjective tasks show ΔH/ΔP ratio ≥1.5x larger than objective tasks (measured from base to RLHF-20K)"
    falsification: "If both task types show similar ΔH/ΔP ratios (within 20% difference), the preference monoculture claim is unsupported"
  - id: "P3"
    primary: false
    statement: "Existing RLHF benchmarks (Anthropic-HH) show entropy reduction that exceeds performance-predicted levels when compared to base models"
    test_method: "Part 1 retrospective: Compute H for base vs RLHF-tuned models on Anthropic-HH. Compare ΔH to ΔP, using objective task entropy-performance relationship as baseline expectation."
    success_criterion: "RLHF-tuned model shows 30%+ excess entropy reduction on subjective tasks compared to objective task baseline"
    falsification: "If entropy reduction is fully explained by performance gains (within 10% of baseline expectation), no excess collapse occurs"

