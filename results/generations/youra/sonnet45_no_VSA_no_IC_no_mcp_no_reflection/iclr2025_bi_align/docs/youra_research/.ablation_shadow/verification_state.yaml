  id: H-EntropyCollapse-v1
  title: RLHF Training Induces Preference Entropy Collapse Beyond Performance-Justified Levels
  statement: RLHF training beyond performance saturation reduces preference diversity (measured as Shannon entropy) faster
    than task performance improvements predict, indicating preference monoculture imposition that erases legitimate human
    variation
  defined_in: 03_refinement.yaml
