# ═══════════════════════════════════════════════════════════════
# SECTION 10: Writing Guidelines
# ═══════════════════════════════════════════════════════════════

writing_guidelines:
  voice: "third-person academic"
  tense:
    methods: "past (what we did)"
    results: "past (what we found)"
    discussion: "present (what it means)"

  terminology_consistency:
    preference_entropy: "Shannon entropy of preference distribution (H = -Σ p_i log(p_i))"
    bidirectional_alignment: "AI→human (preference agreement) AND human→AI (preserved critical diversity)"
    dataset_formats:
      pairwise_unique: "Pairwise comparison format with unique response candidates per example"
      multi_annotator_fixed: "Multi-annotator voting format with fixed response sets per prompt"

  quantitative_precision:
    - "Always report exact values: H = 0.6931 nats (not ~0.7)"
    - "Include confidence intervals where applicable (bootstrap 95% CI)"
    - "State statistical tests explicitly (segmented regression, t-test, etc.)"

  limitation_framing:
    - "Be transparent: 'Our validation revealed dataset-methodology mismatch' (not 'implementation failed')"
    - "Forward-looking: 'Future work should test with multi-annotator datasets' (not 'we couldn't test')"
    - "Honest scope: 'Hypothesis mechanism untested (data-limited), not falsified'"

