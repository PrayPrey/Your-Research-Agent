# ═══════════════════════════════════════════════════════════════
# SECTION 1: Core Claims (Fact-Checkable Assertions)
# ═══════════════════════════════════════════════════════════════

core_claims:
  claim_1:
    statement: "RLHF evaluation benchmarks (InstructGPT, Constitutional AI) measure preference agreement but not preference diversity"
    status: "VALIDATED"
    evidence:
      - "Ouyang et al. (2022) InstructGPT reports 85% win rate vs base model (preference agreement)"
      - "Bai et al. (2022) Constitutional AI reports harmlessness/helpfulness scores (aggregate metrics)"
      - "No entropy or variance measures in either paper's evaluation sections"
    confidence: 1.0
    section: "Introduction, Related Work"

  claim_2:
    statement: "Preference entropy is computable from preference data when data structure matches requirements (multi-annotator fixed responses)"
    status: "VALIDATED"
    evidence:
      - "H-E1 entropy computation: 100% success rate on Anthropic-HH"
      - "All entropy values in valid range [0, ln(2)] ≈ [0, 0.693] nats"
      - "scipy.stats.entropy correctly applies Shannon formula (deterministic, reproducible)"
    confidence: 1.0
    section: "Methodology, Results"

  claim_3:
    statement: "Anthropic-HH dataset uses pairwise comparison format with unique response candidates per example, structurally incompatible with per-prompt entropy aggregation"
    status: "VALIDATED"
    evidence:
      - "H-E1 validation: constant entropy ln(2) across all 100 prompts (variance = 0)"
      - "Root cause analysis: each example compares different response pairs (A1 vs B1, A2 vs B2), not multiple votes on fixed options"
      - "Tautological 50/50 split: every example has 1 chosen + 1 rejected → H = ln(2) for all prompts"
    confidence: 0.95
    section: "Results, Discussion"
    limitation: "Single dataset tested (Anthropic-HH only); pairwise incompatibility inferred for WebGPT, InstructGPT but not empirically validated"

  claim_4:
    statement: "Multi-annotator fixed-response format (OpenAI Summarization, Chatbot Arena) enables entropy measurement"
    status: "THEORETICAL"
    evidence:
      - "Stiennon et al. (2020) OpenAI Summarization: 3-5 annotators rated same summaries"
      - "Chatbot Arena (Zheng et al., 2023): multi-user voting on same model outputs"
      - "Structure matches entropy requirements: multiple voters on fixed response set → distribution variance possible"
    confidence: 0.70
    section: "Related Work, Discussion"
    limitation: "Not empirically validated with entropy computation on these datasets"

  claim_5:
    statement: "Dataset format trade-off: pairwise-unique optimizes annotation cost, multi-annotator-fixed enables diversity measurement"
    status: "VALIDATED"
    evidence:
      - "Anthropic-HH: 160K comparisons × 1 annotator = 160K labels (low cost per label)"
      - "Multi-annotator alternative: 1K prompts × 20 annotators × 5 responses = 100K labels (higher cost per prompt)"
      - "Table 2 taxonomy: pairwise = cost-efficient but entropy-incompatible, multi-annotator = entropy-measurable but higher cost"
    confidence: 0.95
    section: "Discussion"

