    status: "VALIDATED"
    evidence:
      - "Each pairwise example has 1 chosen + 1 rejected by construction"
      - "Aggregation: [n, n] counts → [0.5, 0.5] probabilities → H = ln(2) for all prompts"
      - "Manual calculation confirmed automated results (0.6931 nats)"
    confidence: 1.0
