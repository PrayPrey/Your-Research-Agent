# ═══════════════════════════════════════════════════════════════
# SECTION 4: Experimental Parameters (Reproducibility)
# ═══════════════════════════════════════════════════════════════

experimental_parameters:
  dataset:
    name: "Anthropic-HH (hh-rlhf)"
    source: "https://github.com/anthropics/hh-rlhf"
    split: "train"
    total_examples: 160800
    sampling_seed: 1
    sample_size: 100
    filtering_criterion: "≥5 examples per prompt group"

  entropy_computation:
    formula: "H = -Σ p_i log(p_i)"
    base: "e (natural log, nats)"
    library: "scipy.stats.entropy (v1.11.0)"
    theoretical_range: "[0, ln(2)] ≈ [0, 0.693] nats for binary"

  prompt_grouping:
    method: "First 200 characters of chosen response text"
    rationale: "No explicit prompt IDs in Anthropic-HH; conversation context proxy"
    group_size_distribution:
      min: 5
      max: 57
      median: 6
      mean: 9.6

  execution_environment:
    hardware: "CPU-only (no GPU)"
    ram: "8GB"
    total_runtime: "25 seconds (including dataset caching)"
    dependencies:
      - "datasets (v2.14.0)"
      - "scipy (v1.11.0)"
      - "numpy (v1.24.0)"
      - "matplotlib (v3.7.0)"

# ═══════════════════════════════════════════════════════════════
# SECTION 5: Limitations (Acknowledged Constraints)
# ═══════════════════════════════════════════════════════════════

limitations:
  limitation_1:
    category: "dataset_structure_dependency"
    severity: "CRITICAL"
    description: "Preference entropy measurement requires multi-annotator voting on fixed response sets per prompt. Pairwise comparison datasets (Anthropic-HH) are structurally incompatible."
    impact: "Blocks all 3 hypothesis predictions (P1: inflection point, P2: task differential, P3: benchmark retrospective)"
    mitigation: "Dataset switch (multi-annotator) OR alternative proxy (response diversity entropy)"
    section: "Discussion (Section 6.5)"

  limitation_2:
    category: "population_heterogeneity_confound"
    severity: "HIGH"
    description: "Cross-user preference entropy conflates collective diversity (population demographics) with individual critical evaluation capacity"
    impact: "Weakens claim to 'population-level preference convergence' vs 'individual habituation'"
    mitigation: "Labeler-fixed-effects analysis OR within-user variance metrics (intra-annotator variance proxy)"
    section: "Discussion (Section 6.5)"

  limitation_3:
    category: "task_stratification_subjectivity"
    severity: "MEDIUM"
    description: "Objective vs subjective task classification relies on human judgment of 'ground truth existence'"
    impact: "Risks P2 validity (subjective/objective differential) due to edge case classification noise"
    mitigation: "Use validated taxonomies (HELM, BIG-Bench) OR continuous subjectivity scores (1-5 crowd annotation)"
    section: "Discussion (Section 6.5)"

  limitation_4:
    category: "single_dataset_tested"
    severity: "MEDIUM"
    description: "H-E1 validated on Anthropic-HH only. Pairwise incompatibility inferred for WebGPT, InstructGPT but not empirically confirmed."
    impact: "Taxonomy (Table 2) theory-based for other datasets; positive case (multi-annotator measurability) untested"
    mitigation: "Validate entropy computation on OpenAI Summarization or Chatbot Arena (multi-annotator datasets)"
    section: "Discussion (Section 6.5)"

