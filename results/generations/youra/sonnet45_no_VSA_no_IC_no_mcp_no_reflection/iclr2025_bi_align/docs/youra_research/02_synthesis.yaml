hypothesis_draft:
  title: "RLHF Training Induces Preference Entropy Collapse Beyond Performance-Justified Levels"
  hypothesis_id: "H-EntropyCollapse-v1"
  core_claim: |
    RLHF optimization reduces preference diversity (measured as preference distribution entropy)
    more than task performance improvements alone would predict, indicating that aligned models
    impose a preference monoculture that erases legitimate human variation. This entropy collapse
    is a bidirectional alignment failure: while the AI adapts to majority preferences (traditional
    alignment succeeds), the human population loses critical diversity in evaluation (bidirectional
    alignment fails).
  mechanism: |
    (1) Base models → high output variance → diverse user preferences → high entropy baseline
    (2) Early RLHF training → quality improves → entropy decreases proportionally (justified)
    (3) Continued RLHF beyond performance saturation → inflection point → entropy collapses
        faster than performance improves → users habituate to model style
    (4) Subjective tasks show greater entropy collapse than objective tasks → evidence of
        preference monoculture imposition
  predictions:
    - P1: "Inflection point detected where dH/dP accelerates (e.g., at RLHF-10K steps)"
    - P2: "Subjective tasks show ≥1.5x greater ΔH/ΔP ratio than objective tasks"
    - P3: "Existing benchmarks (Anthropic-HH) show 30%+ excess entropy reduction on subjective tasks"

variables_summary:
  independent: "RLHF Training Stage (base, 1K, 5K, 10K, 20K steps), Task Type (objective vs subjective)"
  dependent_primary: "Preference Entropy H = -Σ p_i log(p_i), range [0, log(n_options)]"
  controlled: "Preference collection protocol, prompt set (fixed 1K examples), user population"

null_hypothesis:
  h0_statement: |
    No significant difference in entropy-reduction-per-performance-gain ratio (dH/dP) across
    RLHF training phases. Entropy reduction is fully explained by task quality improvements.
  statistical_test: "Segmented regression (change-point detection) for inflection point; two-sample t-test for objective vs subjective ΔH/ΔP comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    First application of information-theoretic entropy to measure bidirectional alignment gap.
    Reframes preference variance as signal (critical evaluation capacity) rather than noise.
    Introduces inflection point detection for identifying when RLHF crosses from improvement to overcorrection.
  differentiation_summary: |
    Traditional RLHF evaluation measures preference agreement as success (Ouyang et al., Bai et al.).
    Entropy approach measures whether consensus erases legitimate diversity. HCI user empowerment
    metrics require user studies; entropy uses existing preference data. Reward hacking focuses on
    model behavior; entropy collapse focuses on user behavior homogenization.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["Pythia-1B (checkpoint experiment)", "Base models in Anthropic-HH (retrospective analysis)"]
  datasets: ["Anthropic-HH (helpful-base, harmless-base)", "Subset 1K prompts stratified by task type"]
  baselines: ["Base model entropy (no RLHF)", "Performance-predicted entropy reduction (from objective tasks)"]

measurement_plan:
  data_collection:
    - source: "Part 1: Anthropic-HH published dataset (base vs RLHF-tuned preference comparisons)"
    - source: "Part 2: RLHF checkpoint experiment on Pythia-1B (collect preferences at base, 1K, 5K, 10K, 20K steps)"
    - source: "Part 3: Task stratification using same datasets, split by objective/subjective labels"
  procedure:
    - step: "Compute preference distribution for each prompt: For n response options, count frequency of each option selection"
    - step: "Calculate Shannon entropy: H = -Σ p_i log(p_i), where p_i = count_i / total_responses"
    - step: "Measure performance: Win rate (Anthropic-HH) or accuracy (factual QA subsets)"
    - step: "Compute dH/dP rate: (H_t - H_{t-1}) / (P_t - P_{t-1}) for consecutive checkpoints"
    - step: "Detect inflection point: Fit segmented regression to dH/dP trajectory, identify change point"
    - step: "Compare task types: Two-sample test of ΔH/ΔP ratios (objective vs subjective)"
  success_criteria:
    - "Part 1: RLHF-tuned model shows 30%+ excess entropy reduction on subjective tasks vs baseline"
    - "Part 2: Inflection point detected where |dH/dP| increases ≥50% compared to early-stage baseline"
    - "Part 3: Subjective tasks show ΔH/ΔP ≥1.5x larger than objective tasks"

validation:
  internal_validity:
    - "Control for preference collection protocol (same pairwise comparison methodology across checkpoints)"
    - "Fixed prompt set (1K examples) eliminates prompt selection bias"
    - "Task stratification isolates subjective vs objective entropy behavior"
    - "Baseline control: Use objective task entropy-performance relationship to predict expected reduction"
  external_validity:
    - "Anthropic-HH dataset covers diverse conversational domains (QA, creative, advice)"
    - "Pythia-1B is representative of small-scale open models commonly used in RLHF research"
    - "Findings may not generalize to very large models (>10B parameters) or non-conversational domains"
    - "Preference entropy proxy for critical evaluation assumes entropy reflects deliberation, not confusion"

