# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FailureModeTaxonomy-v1"
  confidence_level: 0.85
  core_hypothesis_statement: |
    Under multi-dimensional trustworthiness evaluation using existing benchmarks (TruthfulQA, AdvBench, BOLD),
    if we compute pairwise failure correlations and apply hierarchical clustering to correlation matrices,
    then distinct failure modes emerge that (1) persist across model scales (Mantel test r > 0.7) and
    (2) can be targeted by interventions improving multiple dimensions simultaneously,
    because trustworthiness failures share root causes (e.g., epistemic uncertainty, distribution shift sensitivity)
    that manifest across dimensions rather than arising independently.
  alternative_hypothesis_h0: |
    There is no significant correlation between LLM failures across trustworthiness dimensions
    (reliability, robustness, fairness) when measured on existing benchmarks (TruthfulQA, AdvBench, BOLD).
    Failure modes are dimension-specific and independent.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Model Architecture Stratum"
      type: "categorical"
      operationalization: "Model parameter count stratified into 3 groups: <1B, 1-10B, >10B parameters"
      levels:
        - "Small (<1B params)"
        - "Medium (1-10B params)"
        - "Large (>10B params)"
    - name: "Targeted Intervention Type"
      type: "categorical"
      operationalization: "Intervention applied to target emergent failure mode (Phase 4 only)"
      levels:
        - "Calibration training (for epistemic uncertainty cluster)"
        - "Adversarial training (for robustness cluster)"
        - "Control (no intervention)"
  dependent:
    - name: "Cross-Benchmark Failure Correlation"
      type: "continuous"
      operationalization: "Spearman correlation coefficient between benchmark scores (range: -1 to 1), p-value < 0.01 after Bonferroni correction"
      primary: true
    - name: "Failure Mode Cluster Stability"
      type: "continuous"
      operationalization: "Silhouette score from hierarchical clustering (range: -1 to 1), target > 0.5"
      primary: false
    - name: "Cross-Strata Correlation Pattern Similarity"
      type: "continuous"
      operationalization: "Mantel test correlation coefficient comparing correlation matrices across strata (range: -1 to 1), target r > 0.7"
      primary: false
    - name: "Intervention Effect Size"
      type: "continuous"
      operationalization: "Cohen's d measuring improvement in cluster benchmarks post-intervention (target d > 0.5)"
      primary: false
  controlled:
    - name: "Benchmark Selection"
      operationalization: "Fixed set: TruthfulQA (reliability), AdvBench (robustness), BOLD (fairness)"
    - name: "Statistical Test Procedures"
      operationalization: "Spearman correlation, permutation test, Bonferroni correction, Ward linkage hierarchical clustering, bootstrap resampling (1000 iterations), Mantel test"
    - name: "Sample Size"
      operationalization: "Minimum 15 models across 3 size strata (≥5 models per stratum)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM failures on individual benchmarks arise from shared underlying model properties (e.g., poor calibration, brittle representations, biased training data) rather than dimension-specific issues"
      evidence: "Exchange 5 (Dr. Ally): Pre-training data quality affects both truthfulness and robustness (shared root cause). Model size correlates with both fairness metrics and adversarial robustness (architectural factor)"
      falsifier: "If failures on TruthfulQA, AdvBench, BOLD are statistically independent (Spearman r ~ 0, p > 0.05), shared root causes don't exist"
    - step: 2
      description: "Shared root causes produce correlated failure patterns detectable via pairwise correlation analysis across benchmarks"
      evidence: "Exchange 2 (Prof. Vera): Testable prediction that models failing TruthfulQA show above-random failure on adversarial inputs"
      falsifier: "If permutation test shows correlations not significantly different from random chance, failure patterns aren't systematically related"
    - step: 3
      description: "Correlated failure patterns cluster into distinct failure modes when correlation matrices undergo hierarchical clustering, and these clusters are stable (not sampling artifacts)"
      evidence: "Exchange 8 (Prof. Vera): Bootstrap resampling (1000 iterations) demonstrates cluster stability. Silhouette score > 0.5 indicates well-separated clusters"
      falsifier: "If bootstrap resampling shows clusters unstable (<80% consistency), or silhouette score < 0.3, patterns are noise not structure"
    - step: 4
      description: "Failure mode clusters persist across model architectures and scales (scale-invariant), indicating fundamental LLM properties rather than architecture-specific confounds"
      evidence: "Exchange 7 (Dr. Nova): Stratification by model size + Mantel test. If epistemic uncertainty cluster appears in GPT-2, LLaMA, and Claude, it's universal"
      falsifier: "If Mantel test r < 0.5 when comparing correlation matrices across size strata, failure modes are architecture/scale-specific, not universal"
  key_tension: "Clustering requires interpretive labeling (e.g., 'epistemic uncertainty') which introduces subjectivity despite quantitative validation (Prof. Rex Exchange 6, Remaining Concerns)"
  evidence_summary: |
    Causal chain supported by: (1) Prior work showing shared root causes affect multiple dimensions (Dr. Ally Exchange 5),
    (2) Statistical validation at each step (correlation significance, cluster stability, cross-strata similarity),
    (3) Intervention validation showing targeted fixes improve multiple dimensions (Phase 4 prediction).
    Key uncertainty: Sample size adequacy for stable correlation estimation (Prof. Rex concern).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Existing benchmarks (TruthfulQA ~800 questions, AdvBench attack types, BOLD demographics) encode sufficient signal for stable correlation estimation across 15+ models"
    supporting_evidence: "Bootstrap resampling (1000 iterations) will validate correlation stability empirically (Prof. Vera Exchange 8)"
    consequence_if_violated: "Spurious correlations due to small sample + multiple comparisons. Mitigation: Supplement with additional benchmarks if correlations appear unstable (Prof. Rex mitigation strategy)"
  - id: "A2"
    assumption: "Failure mode clusters represent shared root causes (e.g., epistemic uncertainty, distribution shift) rather than confounding variables (model size, training compute)"
    supporting_evidence: "Stratification + Mantel test control for confounds by testing if patterns persist within size strata (Dr. Nova Exchange 7)"
    consequence_if_violated: "Clusters merely rediscover 'small vs large models' rather than failure mechanisms. Falsified if Mantel test r < 0.5 (Prof. Vera Exchange 8)"
  - id: "A3"
    assumption: "Interventions targeting one failure mode cluster improve all benchmarks in that cluster without creating tradeoffs (degrading other clusters)"
    supporting_evidence: "Prior work shows alignment fine-tuning improves multiple dimensions simultaneously (Dr. Ally Exchange 5)"
    consequence_if_violated: "Taxonomy not actionable — fixing one dimension degrades another. Phase 4 includes control tracking other clusters for tradeoff detection (Prof. Vera Exchange 8)"
  - id: "A4"
    assumption: "Public benchmark results are available for ≥15 models across 3 size strata to enable stratified analysis"
    supporting_evidence: "Leaderboards publish TruthfulQA, robustness, fairness metrics for major models (GPT, LLaMA, Claude, Mistral, etc.)"
    consequence_if_violated: "Insufficient data for cross-strata validation. Mitigation: Evaluate additional models if public results insufficient"
  - id: "A5"
    assumption: "Hierarchical clustering with Ward linkage and silhouette score validation provides objective cluster count selection without human judgment"
    supporting_evidence: "Silhouette score is established metric for cluster quality assessment (Prof. Pax Exchange 4, Prof. Vera Exchange 8)"
    consequence_if_violated: "Cluster count selection becomes subjective. Alternative: Use multiple cluster validation indices (cophenetic correlation, elbow method) for triangulation"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Large language models evaluated on existing trustworthiness benchmarks (TruthfulQA, AdvBench, BOLD)
    - Models with publicly available benchmark results across multiple dimensions
    - Correlation-based analysis using standard statistical methods (no new metrics required)
    - Scale range: <1B to >10B parameters (small to large LLMs)
  does_not_apply_to: |
    - Models without multi-dimensional benchmark results (single-dimension evaluations excluded)
    - Benchmarks requiring human evaluation or annotation (constraint violation)
    - Trustworthiness dimensions not covered by selected benchmarks (e.g., privacy, security)
    - Models outside parameter range (<100M params or >100B params) - extrapolation uncertain
  known_limitations: |
    - Sample size constraints: TruthfulQA ~800 questions may limit correlation stability (Assumption A1, Prof. Rex concern)
    - Benchmark coverage: Only 3 dimensions tested (reliability, robustness, fairness) - explainability not included
    - Interpretive labeling: Failure mode names (e.g., "epistemic uncertainty") require qualitative judgment (Prof. Rex Exchange 6)
    - Intervention scope: Phase 4 tests only ONE failure mode intervention (calibration or adversarial training) - full intervention spectrum untested

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Pairwise failure correlations across TruthfulQA, AdvBench, BOLD exceed random chance with statistical significance"
    test_method: "Compute Spearman correlation for each model pair across benchmarks. Run permutation test comparing observed correlations to null distribution. Apply Bonferroni correction for multiple comparisons."
    success_criterion: "Spearman r > 0.3 AND p < 0.01 after Bonferroni correction for ≥70% of model comparisons"
    falsification: "If correlations not significantly different from random (p > 0.05) or effect size small (r < 0.2), hypothesis rejected at Phase 1"
  - id: "P2"
    primary: false
    statement: "Hierarchical clustering identifies 2-5 stable failure modes with well-separated clusters"
    test_method: "Apply Ward linkage hierarchical clustering to correlation matrices. Compute silhouette score for cluster quality. Bootstrap resample 1000 times to test cluster stability."
    success_criterion: "Silhouette score > 0.5 AND ≥80% of bootstrap iterations produce consistent cluster assignments"
    falsification: "If silhouette score < 0.3 or bootstrap consistency < 60%, clusters are unstable and hypothesis fails at Phase 2"
  - id: "P3"
    primary: false
    statement: "Correlation pattern similarity across model size strata (Mantel test r > 0.7) demonstrates scale-invariance of failure modes"
    test_method: "Compute correlation matrices separately for small (<1B), medium (1-10B), large (>10B) model strata. Apply Mantel test to compare correlation structure between strata pairs."
    success_criterion: "Mantel test r > 0.7 for all 3 pairwise strata comparisons (small-medium, medium-large, small-large)"
    falsification: "If Mantel test r < 0.5 for any comparison, failure modes are architecture/scale-specific, not universal (hypothesis still valid but interpretation changes)"
  - id: "P4"
    primary: false
    statement: "Interventions targeting one failure mode improve ALL benchmarks in that cluster (Cohen's d > 0.5) without degrading other clusters"
    test_method: "Select emergent failure mode with highest silhouette score. Apply targeted intervention (calibration training for epistemic cluster). Measure pre/post intervention scores on all benchmarks. Track benchmarks in other clusters for tradeoff detection."
    success_criterion: "Cohen's d > 0.5 for improvement on all cluster benchmarks AND Cohen's d < 0.1 (no significant change) for benchmarks in other clusters"
    falsification: "If intervention improves <50% of cluster benchmarks OR degrades other clusters (d < -0.3), taxonomy not actionable"

