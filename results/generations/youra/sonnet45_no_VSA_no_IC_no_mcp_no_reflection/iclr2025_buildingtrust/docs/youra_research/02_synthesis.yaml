hypothesis_draft:
  title: "Scale-Invariant Failure Mode Taxonomy for Multi-Dimensional LLM Trustworthiness"
  hypothesis_id: "H-FailureModeTaxonomy-v1"
  core_claim: |
    Multi-dimensional trustworthiness failures in LLMs exhibit statistically significant correlations
    across existing benchmarks (TruthfulQA, AdvBench, BOLD). These correlations cluster into distinct
    failure modes representing shared root causes that persist across model architectures and scales.
  mechanism: |
    Correlation matrices computed from per-model benchmark scores undergo hierarchical clustering
    (Ward linkage) to identify failure mode clusters. Cluster stability validated via bootstrap
    resampling (1000 iterations). Cross-strata Mantel tests confirm patterns are scale-invariant,
    not confound-driven.
  predictions:
    - P1: "Pairwise failure correlations exceed random chance (Spearman r > 0.3, p < 0.01 after Bonferroni)"
    - P2: "Hierarchical clustering identifies 2-5 stable failure modes (silhouette > 0.5, 80%+ bootstrap consistency)"
    - P3: "Correlation pattern similarity across size strata (Mantel r > 0.7) demonstrates scale-invariance"
    - P4: "Interventions targeting one mode improve ALL cluster benchmarks (Cohen's d > 0.5) without degrading others"

variables_summary:
  independent: "Model size stratum (categorical: <1B, 1-10B, >10B params); Intervention type (categorical: calibration, adversarial, control)"
  dependent_primary: "Cross-benchmark failure correlation (Spearman r, p < 0.01)"
  controlled: "Benchmark set (TruthfulQA, AdvBench, BOLD fixed); Statistical procedures (Spearman, permutation, Bonferroni, Ward, bootstrap, Mantel); Sample size (≥15 models, ≥5 per stratum)"

null_hypothesis:
  h0_statement: |
    There is no significant correlation between LLM failures across trustworthiness dimensions
    (reliability, robustness, fairness) when measured on existing benchmarks. Failure modes are
    dimension-specific and independent.
  statistical_test: "Spearman correlation + permutation test with Bonferroni correction"
  significance_level: 0.01

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Paradigm shift from 'score each dimension independently' to 'map the trustworthiness failure space via correlation clustering'. Enables holistic diagnosis and intervention targeting shared root causes."
  differentiation_summary: |
    Prior work (HELM) aggregates benchmarks without analyzing cross-dimensional correlations.
    Individual papers focus on single dimensions. This formalizes which dimensions co-vary via
    quantitative taxonomy, enabling targeted intervention selection based on failure mode diagnosis.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "GPT series (various sizes)"
    - "LLaMA series (7B, 13B, 70B)"
    - "Claude series"
    - "Mistral, Phi, others with public benchmarks"
    - "Minimum 15 models total, ≥5 per size stratum"
  datasets:
    - "TruthfulQA (~800 questions) - reliability"
    - "AdvBench (attack types) - robustness"
    - "BOLD (demographics) - fairness"
  baselines:
    - "Random correlation null model (permutation test)"
    - "Single-dimension evaluation (current practice)"
    - "HELM aggregation (lacks correlation analysis)"

measurement_plan:
  data_collection:
    - source: "Public leaderboards publishing TruthfulQA, AdvBench, BOLD scores"
    - source: "Model cards and technical reports with benchmark results"
    - source: "Research papers reporting multi-dimensional evaluations"
  procedure:
    - step: "Collect benchmark scores for ≥15 models across 3 size strata"
    - step: "Compute Spearman correlation matrices (pairwise across benchmarks)"
    - step: "Run permutation test for significance (p < 0.01, Bonferroni corrected)"
    - step: "Apply hierarchical clustering (Ward linkage) to correlation matrices"
    - step: "Validate cluster stability via bootstrap resampling (1000 iterations)"
    - step: "Compute silhouette scores for cluster quality (target > 0.5)"
    - step: "Perform Mantel test comparing correlation matrices across size strata (target r > 0.7)"
    - step: "Select highest silhouette cluster, apply targeted intervention (Phase 4)"
    - step: "Measure pre/post intervention effect sizes (Cohen's d) on all benchmarks"
  success_criteria:
    - "Phase 1: Spearman r > 0.3, p < 0.01 for ≥70% model comparisons"
    - "Phase 2: Silhouette > 0.5, bootstrap consistency ≥80%"
    - "Phase 3: Mantel r > 0.7 for all strata pairs"
    - "Phase 4: Cohen's d > 0.5 for cluster benchmarks, d < 0.1 for other clusters"

validation:
  internal_validity:
    - "Permutation test controls for random correlation chance"
    - "Bonferroni correction addresses multiple comparisons problem"
    - "Bootstrap resampling validates cluster stability (not sampling artifacts)"
    - "Stratification + Mantel test control for confounding variables (model size)"
    - "Phase 4 control group tracks tradeoffs (intervention doesn't degrade other clusters)"
  external_validity:
    - "Public benchmark data ensures reproducibility"
    - "Multi-model corpus (15+) across architectures ensures generalizability"
    - "Size strata (small/medium/large) test scale-invariance"
    - "Intervention validation (Phase 4) demonstrates practical utility"

