# ═══════════════════════════════════════════════════════════════════
# QUANTITATIVE CLAIMS (exact numbers for verification)
# ═══════════════════════════════════════════════════════════════════

quantitative_claims:

  # Correlation strengths
  - claim_id: "Q1"
    statement: "All three benchmark pairs exhibit r > 0.99 (p < 1e-17)"
    section: "Abstract, Introduction, Results"
    ground_truth:
      TrustfulQA_AdvBench: {r: 0.998, p: "1.11e-23"}
      TrustfulQA_BOLD: {r: 0.993, p: "1.35e-17"}
      AdvBench_BOLD: {r: 0.996, p: "9.96e-20"}
    source: "045_validated_hypothesis.md Section 2, h-e1/04_validation.md"
    verification_method: "Check actual Spearman correlation values from h-e1 experiment"

  # Sample sizes
  - claim_id: "Q2"
    statement: "20 LLMs spanning three size strata (small <1B n=6, medium 1-10B n=9, large >10B n=5)"
    section: "Abstract, Introduction, Methodology"
    ground_truth:
      total_models: 20
      small_count: 6
      medium_count: 9
      large_count: 5
    source: "045_validated_hypothesis.md lines 236-238"
    verification_method: "Check h-e1/02c_experiment_brief.md dataset specification"

  # Stratified correlations
  - claim_id: "Q3"
    statement: "Correlations remain r > 0.98 within all size strata"
    section: "Results, Discussion"
    ground_truth:
      small_stratum:
        TrustfulQA_AdvBench: {r: 0.994, p: "2.64e-05"}
        TrustfulQA_BOLD: {r: 0.989, p: "8.12e-05"}
        AdvBench_BOLD: {r: 0.986, p: "1.45e-04"}
      medium_stratum:
        TrustfulQA_AdvBench: {r: 0.998, p: "1.47e-09"}
        TrustfulQA_BOLD: {r: 0.995, p: "1.31e-08"}
        AdvBench_BOLD: {r: 0.997, p: "4.37e-09"}
      large_stratum:
        TrustfulQA_AdvBench: {r: 0.997, p: "2.39e-04"}
        TrustfulQA_BOLD: {r: 0.991, p: "1.01e-03"}
        AdvBench_BOLD: {r: 0.994, p: "4.58e-04"}
    source: "045_validated_hypothesis.md lines 261-275"
    verification_method: "Verify stratified analysis from h-e1/04_validation.md"

  # Clustering metrics
  - claim_id: "Q4"
    statement: "Silhouette score = 0.274 < 0.5 threshold"
    section: "Results, Discussion"
    ground_truth:
      silhouette_score: 0.274
      threshold: 0.5
      status: "REFUTED"
    source: "045_validated_hypothesis.md line 316"
    verification_method: "Check h-m1/04_validation.md clustering results"

  - claim_id: "Q5"
    statement: "100% bootstrap consistency across 1000 iterations"
    section: "Results"
    ground_truth:
      bootstrap_consistency: 100.0
      iterations: 1000
      threshold: 80.0
      status: "PASSED"
    source: "045_validated_hypothesis.md line 316"
    verification_method: "Check h-m1/04_validation.md bootstrap analysis"

  # Cophenetic correlation
  - claim_id: "Q6"
    statement: "Cophenetic correlation = 0.693 < 0.7 threshold"
    section: "Results"
    ground_truth:
      cophenetic_correlation: 0.693
      threshold: 0.7
      status: "BORDERLINE_FAIL"
    source: "045_validated_hypothesis.md line 318"
    verification_method: "Check h-m1/04_validation.md dendrogram quality"

  # Confidence adjustment
  - claim_id: "Q7"
    statement: "Revised confidence 0.85 → 0.40 (P1: +0.40, P2: -0.45, P3: -0.40)"
    section: "Results"
    ground_truth:
      original_confidence: 0.85
      revised_confidence: 0.40
      adjustment_breakdown:
        P1_correlation: +0.40
        P2_clustering: -0.45
        P3_scale_invariance: -0.40
    source: "045_validated_hypothesis.md lines 114-129"
    verification_method: "Check confidence adjustment table"

# ═══════════════════════════════════════════════════════════════════
# QUALITATIVE CLAIMS (interpretation and reasoning)
# ═══════════════════════════════════════════════════════════════════

qualitative_claims:

  # Hypothesis status
  - claim_id: "L1"
    statement: "Overall hypothesis status: PARTIALLY_SUPPORTED (1/4 validated, 1/4 refuted, 2/4 untested)"
    section: "Abstract, Results, Conclusion"
    ground_truth:
      P1: "SUPPORTED (correlations exist r > 0.99)"
      P2: "REFUTED (silhouette = 0.274 < 0.5)"
      P3: "NOT_EVALUATED (h-m4 blocked by h-m1 gate failure)"
      P4: "NOT_EVALUATED (intervention requires validated clusters)"
    source: "045_validated_hypothesis.md lines 42-47"
    verification_method: "Check prediction-result matrix in 045_validated_hypothesis.md Section 2"

  # Competing explanations
  - claim_id: "L2"
    statement: "Unified Capability Hypothesis (60% plausibility) vs Insufficient Resolution Hypothesis (30% plausibility)"
    section: "Discussion, Conclusion"
    ground_truth:
      hypothesis_1_name: "Unified Capability Hypothesis"
      hypothesis_1_posterior: 0.60
      hypothesis_1_claim: "All benchmarks measure same construct (general model quality)"
      hypothesis_2_name: "Insufficient Resolution Hypothesis"
      hypothesis_2_posterior: 0.30
      hypothesis_2_claim: "Distinct dimensions exist but 3 benchmarks cannot resolve them"
    source: "045_validated_hypothesis.md lines 154-188"
    verification_method: "Check competing explanations analysis in Section 4.2"

  # Limitations
  - claim_id: "L3"
    statement: "3-benchmark sample size constraint prevents k≥3 clustering (critical limitation)"
    section: "Discussion"
    ground_truth:
      constraint: "k≥3 silhouette requires n≥3 samples, but n=3 benchmarks"
      impact: "Cannot test 2-5 distinct failure modes hypothesis prediction"
      severity: "CRITICAL"
    source: "045_validated_hypothesis.md lines 397-410"
    verification_method: "Verify sample size limitation documented in Section 5"

  - claim_id: "L4"
    statement: "Scale invariance untested due to h-m1 MUST_WORK gate failure (high severity)"
    section: "Discussion"
    ground_truth:
      constraint: "h-m4 (Mantel test) blocked by h-m1 gate failure"
      partial_evidence: "Stratified correlations r > 0.98 within strata"
      severity: "HIGH"
    source: "045_validated_hypothesis.md lines 461-470"
    verification_method: "Check limitation L5 in Section 5"

  # Methodological lessons
  - claim_id: "L5"
    statement: "Bootstrap consistency (stability) and silhouette (separation) measure orthogonal properties"
    section: "Discussion"
    ground_truth:
      observed: "100% bootstrap consistency + 0.274 silhouette"
      interpretation: "Clusters stable but not well-separated"
      lesson: "High correlation (r > 0.99) produces minimal distance variation (0.003-0.007)"
    source: "045_validated_hypothesis.md lines 335-346, 421-442"
    verification_method: "Check bootstrap-silhouette divergence discussion in Section 4.2"

