# ═══════════════════════════════════════════════════════════════════

experimental_design:

  - claim_id: "E1"
    statement: "Spearman correlation with Bonferroni correction (α = 0.01 / 3 = 0.0033)"
    section: "Methodology"
    ground_truth:
      statistical_test: "Spearman rank correlation"
      correction: "Bonferroni"
      alpha_uncorrected: 0.01
      alpha_corrected: 0.0033
      comparison_count: 3
    source: "03_refinement.yaml Section 1.6, 02b_verification_plan.md"
    verification_method: "Check h-e1/02c_experiment_brief.md statistical protocol"

  - claim_id: "E2"
    statement: "Ward linkage hierarchical clustering with silhouette > 0.5 success criterion"
    section: "Methodology"
    ground_truth:
      clustering_method: "Ward linkage"
      distance_metric: "1 - r (correlation-based)"
      quality_metric: "Silhouette score"
      threshold: 0.5
    source: "03_refinement.yaml Section 1.6 (P2), 02b_verification_plan.md"
    verification_method: "Check h-m1/02c_experiment_brief.md method specification"

  - claim_id: "E3"
    statement: "Bootstrap resampling with 1000 iterations, consistency threshold ≥ 80%"
    section: "Methodology"
    ground_truth:
      resampling_method: "Bootstrap with replacement"
      iterations: 1000
      consistency_threshold: 0.80
    source: "02b_verification_plan.md H-M3 specification"
    verification_method: "Check h-m1/02c_experiment_brief.md validation protocol"

