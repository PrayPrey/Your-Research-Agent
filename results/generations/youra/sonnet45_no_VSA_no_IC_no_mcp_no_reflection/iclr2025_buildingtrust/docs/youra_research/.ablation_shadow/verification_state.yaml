main_hypothesis:
  id: H-FailureModeTaxonomy-v1
  title: Scale-Invariant Failure Mode Taxonomy for Multi-Dimensional LLM Trustworthiness
  statement: 'Under multi-dimensional trustworthiness evaluation using existing benchmarks (TruthfulQA, AdvBench, BOLD),

    if we compute pairwise failure correlations and apply hierarchical clustering to correlation matrices,

    then distinct failure modes emerge that (1) persist across model scales (Mantel test r > 0.7) and

    (2) can be targeted by interventions improving multiple dimensions simultaneously,

    because trustworthiness failures share root causes (e.g., epistemic uncertainty, distribution shift sensitivity)

    that manifest across dimensions rather than arising independently.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Public LLM Benchmark Results (TruthfulQA, AdvBench, BOLD)
    model: Multi-Model Corpus (15+ LLMs across GPT/LLaMA/Claude/Mistral families)
    optimizer: N/A (analysis-only, no training)
    hyperparameters:
      min_models: 15
      min_models_per_stratum: 5
      strata:
      - <1B params
      - 1-10B params
      - '>10B params'
      correlation_method: Spearman
      clustering_method: Ward linkage hierarchical
      bootstrap_iterations: 1000
      significance_level: 0.01
