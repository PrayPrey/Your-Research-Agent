main_hypothesis:
  id: H-EntropySelectivePrediction-v1
  title: Single-Pass Distribution Entropy for Selective Prediction
  statement: Under factual question-answering tasks with single-answer targets, if we apply entropy-based rejection thresholds
    to frozen LLM predictions, then selective prediction accuracy will exceed max-probability-based rejection, because entropy
    captures multi-modal distribution uncertainty that max-probability (mode-only) misses.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TriviaQA (primary), SQuAD, Natural Questions
    model: Llama-7B, Llama-13B, Llama-70B
    optimizer: null
    hyperparameters:
      coverage_levels:
      - 0.6
      - 0.7
      - 0.8
      - 0.9
      significance_alpha: 0.017
      test_split: full test sets
  baseline_comparison:
