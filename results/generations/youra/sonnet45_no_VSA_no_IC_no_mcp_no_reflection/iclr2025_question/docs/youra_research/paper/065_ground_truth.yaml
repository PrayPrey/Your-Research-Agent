  - claim: "Entropy mean = 4.72 nats, range [2.14, 7.38]"
    status: "NOT_IN_SOURCE"
    source: "Not explicitly stated in 04_validation.md"
    risk_level: "MEDIUM"

  - claim: "Pearson r = -0.73 between entropy and max-prob"
    status: "NOT_IN_SOURCE"
    source: "Not stated in validation report"
    risk_level: "MEDIUM"

  - claim: "GPT-2 trained on ~40GB text (WebText)"
    status: "COMMON_KNOWLEDGE"
