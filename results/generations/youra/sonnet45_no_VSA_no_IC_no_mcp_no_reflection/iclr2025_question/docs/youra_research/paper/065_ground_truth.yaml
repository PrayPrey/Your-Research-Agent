  1. Entropy statistics (mean, range) — not in source docs
  2. Pearson correlation value (-0.73) — not in source docs
  3. Capacity threshold (7B) — extrapolated, not directly tested
  4. Llama-2-7B accuracy claim (>10%) — from literature, not our experiment

  SAFE claims (directly sourced):
  1. 100% extraction rate ✓
  2. 8.20% Q3 population ✓
  3. 0% accuracy ✓
  4. NaN correlation ✓
  5. 500 sample size ✓
