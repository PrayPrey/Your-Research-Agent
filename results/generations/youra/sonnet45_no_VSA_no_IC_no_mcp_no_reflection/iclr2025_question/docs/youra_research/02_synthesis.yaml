    - step: "For each prediction: store (entropy, max-prob, prediction, ground-truth)"
    - step: "Quadrant analysis: median split on entropy/max-prob, measure accuracy per quadrant"
    - step: "Coverage-accuracy curves: sweep thresholds, plot accuracy vs coverage, compute AUC"
    - step: "Top-5 entropy: extract top-5 token distributions, compute entropy, compare Q3 vs Q1"
  success_criteria:
