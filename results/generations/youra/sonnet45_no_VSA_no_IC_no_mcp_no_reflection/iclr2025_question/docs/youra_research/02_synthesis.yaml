hypothesis_draft:
  title: "Single-Pass Distribution Entropy for Selective Prediction in Autoregressive Language Models"
  hypothesis_id: "H-EntropySelectivePrediction-v1"
  core_claim: |
    Token probability distribution entropy, computed from a single forward pass,
    captures multi-modal output uncertainty in large language models and enables
    more effective selective prediction than maximum probability thresholding,
    particularly when the two signals disagree.
  mechanism: |
    When LLMs generate text, the output token distribution's entropy encodes
    uncertainty through its spread across multiple plausible tokens. Maximum
    probability captures only the mode (highest peak), missing cases where
    multiple answers have similar probabilities. Entropy captures the full
    distribution shape, detecting multi-modal uncertainty. By analyzing cases
    where max-prob is high but entropy is also high (disagreement quadrant Q3),
    we identify hidden uncertainty that max-prob alone misses.
  predictions:
    - P1: "Disagreement quadrant Q3 accuracy is >5% lower than agreement quadrant Q1 on TriviaQA (p < 0.017)"
    - P2: "Entropy-based rejection AUC exceeds max-prob AUC on TriviaQA, SQuAD, Natural Questions"
    - P3: "Q3 exhibits significantly higher top-5 entropy than Q1, validating multi-modal mechanism (p < 0.017)"

variables_summary:
  independent: "Rejection method: entropy threshold vs max-prob threshold vs random"
  dependent_primary: "Accuracy at fixed coverage levels (60%, 70%, 80%, 90%); Coverage-accuracy AUC"
  controlled: "Model family (Llama 7B/13B/70B), Datasets (TriviaQA/SQuAD/NQ), Metric (exact match)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in selective prediction performance
    (coverage-accuracy AUC) between entropy-based and max-probability-based rejection methods.
  statistical_test: "Paired t-test for quadrant analysis; AUC comparison across methods"
  significance_level: 0.017  # Bonferroni-corrected for 3 predictions

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Quadrant analysis framework for entropy-maxprob disagreement; first systematic study of distribution entropy for LLM selective prediction"
  differentiation_summary: |
    Unlike max-prob baselines (mode-only), entropy captures full distribution geometry.
    Unlike ensemble methods, requires single forward pass (zero-shot, no training).
    Unlike calibration methods, no held-out data required.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

