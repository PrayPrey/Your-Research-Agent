# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════
established_facts:
  claims:
    - claim: "Token probability distributions from LLM forward passes contain uncertainty signals"
      status: "BUILD_ON"
      evidence: "Standard practice in calibration research (temperature scaling, max-prob baselines)"
    - claim: "Max-probability thresholding is a baseline method for selective prediction"
      status: "BUILD_ON"
      evidence: "Hendrycks et al. OOD detection work establishes max-prob as strong baseline"
    - claim: "Distribution entropy outperforms max-prob on selective prediction for factual QA"
      status: "PROVE_NEW"
      evidence: "Core hypothesis - requires experimental validation"
  scope_reduction_percentage: 67
  phase2b_4_instructions: |
    Build on established calibration methods (temperature scaling, max-prob).
    Focus proof effort on showing entropy's advantage in disagreement cases (quadrant Q3).
    Do not re-prove that uncertainty signals exist in distributions.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════
core_statement:
  hypothesis_id: "H-EntropySelectivePrediction-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under factual question-answering tasks with single-answer targets,
    if we apply entropy-based rejection thresholds to frozen LLM predictions,
    then selective prediction accuracy will exceed max-probability-based rejection,
    because entropy captures multi-modal distribution uncertainty that max-probability (mode-only) misses.
  alternative_hypothesis_h0: |
    There is no significant difference in selective prediction performance
    (coverage-accuracy AUC) between entropy-based and max-probability-based rejection methods.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════
variables:
  independent:
    - name: "Rejection Method"
      type: "categorical"
      operationalization: "entropy threshold vs max-probability threshold vs random baseline"
      levels: ["entropy", "max-prob", "random"]
  dependent:
    - name: "Accuracy at Fixed Coverage"
      type: "continuous"
      operationalization: "Exact match accuracy on retained predictions at 60%, 70%, 80%, 90% coverage"
      primary: true
    - name: "Coverage-Accuracy AUC"
      type: "continuous"
      operationalization: "Area under coverage-accuracy curve (0-1 coverage range)"
      primary: false
  controlled:
    - name: "Model Family"
      operationalization: "Llama-7B, Llama-13B, Llama-70B (consistent architecture across scales)"
    - name: "Datasets"
      operationalization: "TriviaQA, SQuAD, Natural Questions (all factual QA benchmarks)"
    - name: "Evaluation Metric"
      operationalization: "Exact match (standard for QA tasks)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM forward pass produces token probability distribution over vocabulary"
      evidence: "Standard autoregressive generation (Vaswani et al. 2017 Transformer architecture)"
      falsifier: "If distribution is not accessible, method fails (requires logprobs API or model access)"
    - step: 2
      description: "Distribution shape encodes uncertainty: peaked (confident) vs flat (uncertain)"
      evidence: "Information theory - entropy quantifies distribution spread"
      falsifier: "If entropy does not correlate with error rate, shape does not encode uncertainty"
    - step: 3
      description: "Max-prob captures mode only; entropy captures full distribution geometry including multi-modality"
      evidence: "Mathematical definition: max-prob = max(P), entropy = -Σ(P log P)"
      falsifier: "If high-entropy, high-max-prob cases have same accuracy as low-entropy, high-max-prob, entropy adds no signal"
    - step: 4
      description: "Entropy-based rejection identifies multi-modal uncertainty missed by max-prob thresholding"
      evidence: "Quadrant analysis Q3 (disagreement: high max-prob, high entropy) should show lower accuracy"
      falsifier: "P1 falsification - if Q3 accuracy ≥ Q1 accuracy, rejection does not work"
  key_tension: "Entropy and max-prob are correlated (both measure uncertainty). Key question is disagreement cases."
  evidence_summary: |
    Steps 1-2 are established (standard practice).
    Steps 3-4 require experimental validation (core hypothesis contribution).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════
key_assumptions:
  - id: "A1"
    assumption: "Entropy and max-prob are not perfectly correlated (r < 0.95)"
    supporting_evidence: "If r ≥ 0.95, signals are redundant - hypothesis fails by design"
    consequence_if_violated: "Entropy adds no information; max-prob is sufficient"
  - id: "A2"
    assumption: "Disagreement quadrant Q3 (high max-prob, high entropy) is non-trivial (>5% of predictions)"
    supporting_evidence: "If Q3 is empty or tiny, phenomenon doesn't generalize"
    consequence_if_violated: "Quadrant analysis is not meaningful; edge case only"
  - id: "A3"
    assumption: "Multi-modal uncertainty manifests in top-5 token distributions"
    supporting_evidence: "Most probability mass concentrates in top-k tokens for LLMs"
    consequence_if_violated: "Top-5 entropy check (P3) may fail even if mechanism is correct"
  - id: "A4"
    assumption: "Entropy thresholds can be set to achieve target coverage levels"
    supporting_evidence: "Entropy is continuous; threshold sweep should span 0-100% coverage"
    consequence_if_violated: "Cannot construct coverage-accuracy curves"
  - id: "A5"
    assumption: "Single-answer factual QA is representative of selective prediction use cases"
    supporting_evidence: "Common deployment scenario (medical QA, fact-checking)"
    consequence_if_violated: "Results do not generalize to other task types (acknowledged scope limitation)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════
scope:
  applies_to: |
    - Factual question-answering tasks with single-answer targets
    - Autoregressive language models with accessible logprobs
    - Closed-set evaluation (exact match metrics)
  does_not_apply_to: |
    - Open-ended text generation (no ground truth for accuracy)
    - Multi-answer questions or ambiguous queries
    - Multi-hop reasoning tasks (not tested)
    - Chain-of-thought or reasoning-heavy tasks (not tested)
  known_limitations: |
    - Scope restricted to three factual QA benchmarks (TriviaQA, SQuAD, Natural Questions)
    - Tested only on Llama family (architectural generalization unknown)
    - Does not address calibration (only selective prediction)
    - Threshold selection requires coverage target (not automatic)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════
predictions:
  - id: "P1"
    primary: true
    statement: "On TriviaQA, accuracy in disagreement quadrant Q3 (high max-prob, high entropy) is >5% lower than agreement quadrant Q1 (high max-prob, low entropy) with p < 0.017"
    test_method: "Quadrant analysis: median split on entropy and max-prob, compute accuracy per quadrant, paired t-test"
    success_criterion: "Q1 accuracy - Q3 accuracy > 5% AND p-value < 0.017 (Bonferroni-corrected)"
    falsification: "If Q3 accuracy ≥ Q1 accuracy OR p ≥ 0.017 OR gap ≤ 5%, entropy does not detect missed uncertainty"
  - id: "P2"
    primary: false
    statement: "Coverage-accuracy AUC for entropy-based rejection exceeds max-prob-based rejection on TriviaQA, SQuAD, and Natural Questions"
    test_method: "Sweep rejection thresholds to vary coverage 0-100%, plot accuracy vs coverage, compute AUC for each method"
    success_criterion: "AUC(entropy) > AUC(max-prob) on all three datasets"
    falsification: "If AUC(max-prob) ≥ AUC(entropy) on any dataset, max-prob is sufficient for that domain"
  - id: "P3"
    primary: false
    statement: "Disagreement quadrant Q3 has significantly higher top-5 entropy than agreement quadrant Q1 with p < 0.017"
    test_method: "Compute top-5 token distribution entropy for each prediction, compare Q3 vs Q1, t-test"
    success_criterion: "Top-5 entropy(Q3) > Top-5 entropy(Q1) AND p < 0.017"
    falsification: "If top-5 entropy(Q3) ≤ top-5 entropy(Q1) OR p ≥ 0.017, multi-modal mechanism explanation is wrong"

