# ============================================================================
# METRICS — Ground truth from Phase 4 validation reports
# ============================================================================

metrics:
  primary_metric:
    name: "IRR (Incidence Rate Ratio) for has_tags binary"
    hypothesis: "H-E1"
    our_value: 1.2263
    ci_lower: 1.1681
    ci_upper: 1.2873
    p_value: 1.87e-16
    n: 5217
    improvement_over_null: "22.6%"
    gate: "MUST_WORK — PASS"

  secondary_metrics:
    - name: "Attenuation ratio (mechanism verification)"
      hypothesis: "H-M1"
      value: 1.1219
      interpretation: "Decade FE absorbs only 12.2% of has_tags effect"
      gate_threshold: "< 1.5 for STRONG"
      result: "STRONG"

    - name: "IRR_P2 (log_tag_count+1 in tagged subset)"
      hypothesis: "H-M2"
      value: 1.5332
      ci_lower: 1.4680
      ci_upper: 1.6014
      p_value: 1.28e-82
      n: 2625
      attenuation_ratio: 1.0007
      gate: "SHOULD_WORK — PASS"

    - name: "IRR for 6+ tag category"
      hypothesis: "H-M3"
      value: 1.2861
      category_reference: "0 tags"
      p_value: 1.12e-22  # vs. reference "0 tags"
      gate: "INFORMATIVE_NEGATIVE"

    - name: "Cameron-Trivedi LR (overdispersion test)"
      hypothesis: "All"
      primary: 7356.36
      p2_spec: 7357.39
      p3_spec: 7509.42
      critical_value: 3.84
      interpretation: "NB-2 strongly appropriate over Poisson in all specifications"

  categorical_irr_table:
    reference: "0 tags"
    bins:
      "0": {n: 2592, irr: 1.000, ci_lower: null, ci_upper: null}
      "1-2": {n: 73, irr: 1.1267, ci_lower: 0.889, ci_upper: 1.429, p: 0.320}
      "3-5": {n: 710, irr: 1.1277, ci_lower: 1.042, ci_upper: 1.220, p: 0.003}
      "6+": {n: 1842, irr: 1.2861, ci_lower: 1.218, ci_upper: 1.358, p: "<0.001"}
    adjacent_contrasts:
      "0→1-2": {p: 1.000, interpretation: "Underpowered (N=73)"}
      "1-2→3-5": {p: 1.000, irr_gap: 0.001, interpretation: "Effectively zero gap"}
      "3-5→6+": {p: 5.54e-10, interpretation: "PASS Bonferroni (α=0.0167)"}

# ============================================================================
# METHODOLOGY — Ground truth from Phase 3 artifacts
# ============================================================================

methodology:
  algorithm_name: "Negative Binomial Type 2 (NB-2) Regression"
  implementation: "statsmodels.formula.api.negativebinomial"
  loglike_method: "nb2"

  primary_formula: "N_tasks ~ has_tags + log_n_instances + log_n_features + age_years + age_sq + C(decade)"
  p2_formula: "N_tasks ~ log_tag_count_p1 + log_n_instances + log_n_features + age_years + age_sq + C(decade)"
  p3_formula: "N_tasks ~ C(tag_count_cat) + log_n_instances + log_n_features + age_years + age_sq + C(decade)"

  key_hyperparameters:
    - name: "optimizer"
      value: "bfgs"
    - name: "maxiter"
      value: 100
    - name: "sample_restriction"
      value: "N_tasks >= 1"
    - name: "tag_count_bins"
      value: "[-1, 0, 2, 5, inf] → labels ['0', '1-2', '3-5', '6+']"
    - name: "reference_category"
      value: "0"

  training_details:
    sample_p1: 5217
    sample_p2: 2625
    sample_p3: 5217
    convergence: "BFGS — all 7 model variants converged"
    overdispersion_confirmed: true

  corpus:
    file: "h-e1/code/data/h_e1/openml_dataset_corpus.csv"
    preprocessed: "h-e1/results/preprocessed.parquet"
    n_total: 5217
    has_tags_1_count: 2625
    has_tags_0_count: 2592
    tag_distribution:
      "0 tags": 2592
      "1-2 tags": 73
      "3-5 tags": 710
      "6+ tags": 1842

