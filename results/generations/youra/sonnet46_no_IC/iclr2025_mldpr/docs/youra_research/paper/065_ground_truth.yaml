# HYPOTHESIS GATE SUMMARY
# ============================================================================

hypothesis_gates:
  h_e1:
    gate_type: "MUST_WORK"
    result: "PASS"
    criteria:
      irr_gate: {required: ">= 1.1", actual: 1.2263, pass: true}
      ci_lower_gate: {required: ">= 1.1", actual: 1.1681, pass: true}
      pvalue_gate: {required: "< 0.05", actual: "1.87e-16", pass: true}

  h_m1:
    gate_type: "MUST_WORK"
    result: "PASS"
    criteria:
      post_fe_irr: {required: ">= 1.1", actual: 1.2263, pass: true}
      post_fe_pvalue: {required: "< 0.05", actual: "1.87e-16", pass: true}
      mechanism_support: "STRONG (attenuation_ratio=1.1219 < 1.5)"

  h_m2:
    gate_type: "SHOULD_WORK"
    result: "PASS"
    criteria:
      ci_lower_gate: {required: ">= 1.05", actual: 1.4680, pass: true}
      pvalue_gate: {required: "< 0.05", actual: "1.28e-82", pass: true}

  h_m3:
    gate_type: "SHOULD_WORK"
    result: "INFORMATIVE_NEGATIVE"
    criteria:
      monotonic_ordering: {required: true, actual: true, pass: true}
      adjacent_contrasts: {required: ">= 2/3", actual: "1/3", pass: false}
    reason: "Bin 1-2 sparsity (N=73) limits contrast power; IRR gap 1-2→3-5 = 0.001"

# ============================================================================
# LIMITATIONS — For adversarial review cross-check
# ============================================================================

honest_limitations:
  - id: "L1"
    description: "Cross-sectional — no timestamp data for causal ordering"
    claimed_in_paper: "Section 6.3 L1"
    acceptable_because: "OpenML creator-only tagging architecture; cross-domain corroboration"

  - id: "L2"
    description: "N_tasks proxy: registration count, not execution frequency"
    claimed_in_paper: "Section 6.3 L2"
    acceptable_because: "Task registration = deliberate effort signal; consistent with prior work"

  - id: "L3"
    description: "N_tasks>=1 restriction: conditional adoption only"
    claimed_in_paper: "Section 6.3 L3"
    acceptable_because: "Hurdle model explicitly deferred; claim scoped to conditional adoption"

  - id: "L4"
    description: "RC-3 collinearity (V=0.823): 12.2% partially uncontrolled era confounding"
    claimed_in_paper: "Section 6.3 L4"
    acceptable_because: "Attenuation non-fatal; large effect size remains; H-M2 orthogonal"

  - id: "L5"
    description: "H-M3 bin 1-2 sparsity (N=73): uniform categorical gradient undertermined"
    claimed_in_paper: "Section 6.3 L5, Section 5.4"
    acceptable_because: "Informative negative honestly reported; H-M2 covers continuous dose-response"

