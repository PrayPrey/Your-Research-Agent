# ============================================================================
# ADVERSARIAL REVIEW FOCUS AREAS
# ============================================================================

adversarial_review_focus:
  - area: "Causal vs. predictive framing"
    issue: "Cross-sectional design cannot prove causality; paper should consistently use 'predicts'/'associated with' not 'causes'"
    check: "Review all result statements for inappropriate causal language"

  - area: "Informative negative honest framing"
    issue: "H-M3 gate failure must not be minimized — bin 1-2 sparsity must be acknowledged as design limitation, not mechanism failure"
    check: "Section 5.4 and 6.3 L5 cover this honestly"

  - area: "Composite score negative control"
    issue: "Prior episode composite IRR=1.014 under decade FE is mentioned as negative control — must be clearly presented as prior episode, not as a within-study randomized comparison"
    check: "Framing in Section 5.1 is appropriate — described as 'prior episode on same corpus'"

  - area: "95% CI interpretation"
    issue: "CI values in paper must exactly match CI values in 045_validated_hypothesis.md"
    ground_truth_ci_h_e1: "[1.1681, 1.2873]"
    ground_truth_ci_h_m2: "[1.4680, 1.6014]"

  - area: "N_tasks>=1 scope boundary"
    issue: "Every adoption claim must be scoped to 'conditional on at least one task' — not stated as 'overall adoption'"
    check: "Section 3.1 and 6.3 L3 address this"
