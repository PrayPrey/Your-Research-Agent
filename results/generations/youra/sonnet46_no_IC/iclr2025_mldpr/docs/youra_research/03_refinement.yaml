# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "h-e1-v2"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under the OpenML platform context (N=5,217 datasets with N_tasks ≥ 1, cross-sectional
    corpus), if a dataset has keyword tags attached (has_tags=1 vs. has_tags=0), then it will
    have significantly more registered ML tasks (N_tasks), because keyword tags make datasets
    discoverable through OpenML's tag-indexed search (FAIR F1 mechanism), and discoverability
    drives researcher engagement and task creation.

    Formally: In NB-2 regression of N_tasks on has_tags controlling for log(n_instances),
    log(n_features), age_years, age², C(decade), the IRR for has_tags will be ≥ 1.1 with
    95% CI lower bound ≥ 1.1.
  alternative_hypothesis_h0: |
    H0-P1: There is no significant positive association between has_tags (binary) and N_tasks
    in NB-2 regression after controlling for dataset size, age, and decade effects
    (IRR 95% CI lower < 1.1 or p ≥ 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "has_tags"
      type: "categorical"
      operationalization: "Binary indicator: 1 if dataset has ≥1 keyword tag on OpenML, 0 otherwise. Derived from tags field in corpus: has_tags = (len(str(tags).strip()) > 0 and str(tags) != 'nan')"
      levels: [0, 1]
    - name: "log_tag_count_plus1"
      type: "continuous"
      operationalization: "log(tag_count + 1) where tag_count = number of comma-separated tags in the tags field (0 for untagged datasets). Secondary IV for P2."
    - name: "tag_count_categorical"
      type: "categorical"
      operationalization: "tag_count binned: 0, 1-2, 3-5, 6+. For P3 dose-response analysis."
      levels: ["0", "1-2", "3-5", "6+"]
  dependent:
    - name: "N_tasks"
      type: "continuous"
      operationalization: "Count of distinct ML tasks registered on the dataset in OpenML (integer ≥ 1 by sample restriction). NOTE: proxy for adoption; ≠ task execution run count. Available as column in corpus."
      primary: true
  controlled:
    - name: "log_n_instances"
      operationalization: "log(n_instances); accounts for dataset size effect on adoption"
    - name: "log_n_features"
      operationalization: "log(n_features); accounts for dataset dimensionality effect"
    - name: "age_years"
      operationalization: "years since dataset upload date (continuous)"
    - name: "age_sq"
      operationalization: "age_years² (quadratic age term for non-linear age effect)"
    - name: "C_decade"
      operationalization: "Decade-of-upload fixed effects via patsy C(decade) formula; primary temporal confounder control"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Tags → Search Index Membership: OpenML's search engine indexes keyword tags as primary discovery keys (Vanschoren et al. 2014). A dataset with any tags immediately enters the platform's keyword search results; untagged datasets do not."
      evidence: "OpenML platform architecture (Vanschoren 2014); FAIR F1 principle (Wilkinson 2016) — tags operationalize Findability; confirmed by Chapman 2019 (keywords = primary discovery mechanism)"
      falsifier: "If has_tags=1 datasets do NOT appear more in OpenML search results than has_tags=0 datasets, this step fails"
    - step: 2
      description: "Search Index Membership → Discovery Probability: Datasets appearing in keyword searches are exposed to researchers who would not otherwise encounter them. More discovery pathways → more researcher encounters → more potential task creators."
      evidence: "Chapman 2019 dataset search survey; Yang 2024 (documentation → HF popularity); Lachmuth 2025 (FAIR metadata → BonaRes reuse)"
      falsifier: "If search exposure does not increase researcher discovery events (testable via click-through data not available in corpus)"
    - step: 3
      description: "Discovery → Task Creation (N_tasks): Researchers who discover a dataset and find it relevant create formal ML tasks on it. Decade FE controls for platform-era differences in task creation norms."
      evidence: "N_tasks = publicly available count of distinct tasks created; prior work (Yang 2024) shows discovery → engagement; h-e1 established NB-2 appropriateness for this DV"
      falsifier: "If IRR 95% CI lower < 1.1 in primary NB-2 model, or if decade FE removes the association entirely (as in h-e1 RC-3 for composite score)"
  key_tension: "Cross-sectional data cannot establish that tags were assigned before task creation (endogeneity). Platform architecture (tags assigned at upload by creator only) provides a non-experimental defense but not causal identification."
  evidence_summary: |
    Three-layer support: (1) Theoretical — FAIR F1 (Wilkinson 2016, 15,976 cit.); (2) Platform design — OpenML tag-indexed search, creator-only tagging (Vanschoren 2014); (3) Cross-domain empirical — FAIR metadata → reuse in domain repositories (Lachmuth 2025 BonaRes). Mechanism is non-trivial and distinguishes tags from other metadata fields (description, name) by their direct integration into the platform's search index.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "N_tasks (distinct ML task count) is a valid proxy for dataset adoption intensity"
    supporting_evidence: "h-e1 used same proxy; N_tasks reflects deliberate researcher engagement (creating a task requires effort); publicly available from OpenML API"
    consequence_if_violated: "IRR estimates capture task-count adoption signal which may differ from run-count adoption signal; results would not generalize to execution frequency"
  - id: "A2"
    assumption: "Tag assignment on OpenML temporally precedes task creation for most datasets (tags as upstream cause)"
    supporting_evidence: "OpenML platform design: tags assigned at upload by dataset creator (Vanschoren 2014 v2 API); creator-only tagging prevents post-hoc popularity-driven tag accumulation"
    consequence_if_violated: "Association is reverse-causal (adoption → tagging); predictive claim still valid but causal interpretation fails"
  - id: "A3"
    assumption: "Tag count's adoption effect is decade-invariant (has_tags effect survives C(decade) FE)"
    supporting_evidence: "FAIR tagging conventions stable since 2016; OpenML tagging since 2012; tagging platform participation is not decade-specific unlike composite score which confounded with platform maturation"
    consequence_if_violated: "IRR attenuates to non-significance under decade FE (as in h-e1 RC-3); hypothesis fails even if uncorrected association is strong"
  - id: "A4"
    assumption: "Zero-tag datasets in the N=5,217 sample represent valid 'untagged' observations, not missing data"
    supporting_evidence: "OpenML allows zero-tag datasets; tags field is explicitly empty/null (not missing). Justified by treating has_tags=0 as 'did not participate in tagging' — a valid platform behavior level"
    consequence_if_violated: "Zero-tag datasets are MNAR; inclusion biases estimates downward; RC-5 (tag_count≥1 restriction) tests sensitivity"
  - id: "A5"
    assumption: "NB-2 remains appropriate with has_tags as primary IV (overdispersion structure stable under IV change)"
    supporting_evidence: "h-e1 confirmed extreme overdispersion (CT LR stat=2222.68); overdispersion in N_tasks is driven by heavy-tailed distribution (few datasets with thousands of tasks), unlikely to change with IV change"
    consequence_if_violated: "If CT test fails with new IV specification, fall back to Poisson or quasi-Poisson; recalculate IRR under correct model"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    OpenML datasets with N_tasks ≥ 1 as of corpus collection date (N=5,217).
    Keyword tags as defined by OpenML platform (user-assigned at upload, creator-controlled).
    ML task count (N_tasks) as adoption proxy.
    Cross-sectional observational study design.
    Binary tag presence (P1) and count magnitude (P2, P3) as IVs.
  does_not_apply_to: |
    Datasets with N_tasks = 0 (not studied; would require hurdle model — permanently avoided).
    HuggingFace, Kaggle, UCI, or other ML dataset repositories (external validity is future work).
    Actual task run counts (execution frequency) — not the DV.
    Causal effect of tags (only predictive/associational claims).
    Post-2016 FAIR-compliant metadata systems with structured tagging vocabularies (OpenML uses free-text tags).
  known_limitations: |
    (1) Cross-sectional design: cannot establish temporal ordering of tags relative to task creation.
    (2) N_tasks proxy: does not count execution frequency, only distinct task registrations.
    (3) Sample restriction: N_tasks≥1 selects already-adopted datasets; not generalizable to adoption vs. non-adoption.
    (4) Endogeneity risk: mitigated by platform architecture argument but not eliminated.
    (5) Corpus snapshot: static as of h-e1 collection date; new datasets since then not included.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "has_tags binary (0/1) positively predicts N_tasks in NB-2 with IRR ≥ 1.1 and 95% CI lower bound ≥ 1.1, p < 0.05, after controlling for log(n_instances), log(n_features), age_years, age², C(decade)"
    test_method: "smf.negativebinomial('N_tasks ~ has_tags + log_n_instances + log_n_features + age_years + age_sq + C(decade)', data=df).fit(method='bfgs'); IRR=exp(coef['has_tags']); CI_lower=exp(coef['has_tags']-1.96*se['has_tags'])"
    success_criterion: "IRR ≥ 1.1 AND CI_lower ≥ 1.1 AND p < 0.05"
    falsification: "CI_lower < 1.1 OR p ≥ 0.05 in primary model. Partial pass: CI_lower ∈ [1.05, 1.1) — secondary criterion met."
  - id: "P2"
    primary: false
    statement: "log(tag_count+1) positively predicts N_tasks in NB-2 (restricted to has_tags=1 datasets) with IRR 95% CI lower ≥ 1.05, p < 0.05, controlling for same covariates"
    test_method: "df_tagged = df[df['has_tags']==1]; smf.negativebinomial('N_tasks ~ log_tag_count_p1 + log_n_instances + log_n_features + age_years + age_sq + C(decade)', data=df_tagged).fit(method='bfgs')"
    success_criterion: "IRR_log_tag_count 95% CI lower ≥ 1.05 AND p < 0.05"
    falsification: "CI_lower < 1.05 or p ≥ 0.05 — implies binary threshold (P1) is the full signal; count magnitude above threshold doesn't predict additional adoption"
  - id: "P3"
    primary: false
    statement: "tag_count categorical (0, 1-2, 3-5, 6+) shows monotonic dose-response on N_tasks in NB-2; each higher category has significantly more predicted N_tasks than previous"
    test_method: "Add tag_count_cat dummies to NB-2 formula; check monotonic ordering of exponentiated coefficients; test each adjacent-category contrast"
    success_criterion: "Monotonic ordering of IRRs across all 4 categories AND adjacent contrasts statistically significant (p < 0.05 Bonferroni-corrected)"
    falsification: "Non-monotonic pattern or failure of adjacent-category contrasts — implies no dose-response gradient beyond binary threshold"

