gap_id: "gap-1"
gap_title: "No Empirical NB-2 Test of Tag Count as ML Dataset Adoption Predictor"
gap_description: |
  No existing study tests tag count (number of keyword tags attached to OpenML datasets)
  as predictor of task run count in NB-2 regression controlling for log(n_instances),
  log(n_features), dataset age, age², and decade FE, with IRR ≥ 1.1 at 95% CI lower bound.
  Directly IS the research question; closing it produces the primary contribution.
