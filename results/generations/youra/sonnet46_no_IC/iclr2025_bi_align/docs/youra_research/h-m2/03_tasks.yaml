      - "CSV readable with pandas"
      - "figures/ directory created"

  - id: "A-2"
    title: "Data Pipeline"
    type: data-pipeline
    priority: 92
    description: >
      Copy data_loader.py from h-e1 (load_and_validate unchanged — same signature,
