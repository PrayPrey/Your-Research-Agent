      - file: "docs/youra_research/h-m2/03_config.md"
        section: "Requirements"
    acceptance_criteria:
      - "pingouin importable (pip install pingouin if missing)"
      - "figures/ directory exists"
      - "CSV file accessible"

  # ── Epic Tasks (priority 93 → 50) ────────────────────────────────────────
  - id: "A-1"
    title: "Environment Setup Verification"
