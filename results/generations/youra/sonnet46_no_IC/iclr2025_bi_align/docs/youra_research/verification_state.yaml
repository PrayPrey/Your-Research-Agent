main_hypothesis:
  id: H-BiAlign-v1
  title: Capability-Modulated Bidirectional Alignment Asymmetry in LLM Evaluation
  statement: 'Under the scope of N=222 models in the AlpacaEval 2.0 leaderboard, model capability (win_rate) independently
    predicts length-debiased preference score (LC_winrate) after controlling for response verbosity (avg_length): rho(win_rate,
    LC_winrate | avg_length) > 0, p < 0.05, |r_partial| >= 0.15. High-capability models exhibit smaller bidirectional alignment
    gap (|Delta| = |LC_winrate - win_rate|) than low-capability models, independent of verbosity.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: AlpacaEval 2.0 Leaderboard (N=222)
    model: N/A — statistical analysis on pre-computed scores
