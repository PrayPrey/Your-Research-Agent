---
# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from verified Phase 4/5 results
# Source: 045_validated_hypothesis.md + h-*/04_validation.md

paper_title: "Capability or Verbosity? Disentangling the Drivers of Length-Debiased Preference in LLM Evaluation"
hypothesis_id: "H-BiAlign-v1"
extracted_at: "2026-08-04"
pipeline_phase: "6"

dataset:
  name: "AlpacaEval 2.0"
  n_models: 223
  source: "Public leaderboard CSV"
  variables:
    - name: win_rate
      role: "Independent Variable (IV) — capability proxy"
      range: "~3–80%"
    - name: length_controlled_winrate
      alias: LC_winrate
      role: "Dependent Variable (DV)"
      range: "~2–95%"
    - name: avg_length
      role: "Covariate / confound"
      range: "~400–2200 tokens"

sub_hypotheses:

  H-E1:
    name: "Spearman Partial Correlation"
    gate: "MUST_WORK"
    status: "PASS"
    metrics:
      r_partial: 0.9851
      p_value: 1.69e-170
      bootstrap_ci_lower: 0.976
      bootstrap_ci_upper: 0.988
      vif: 1.764
      n: 223
      method: "pingouin.partial_corr(method='spearman', covar='avg_length')"
      bootstrap_resamples: 1000
      random_state: 42
    bivariate_comparison:
      bivariate_rho: 0.94  # Dubois 2024 reported
      partial_vs_bivariate_delta: 0.045  # partial EXCEEDS bivariate

  H-M1:
    name: "Standardized OLS Dominance"
    gate: "MUST_WORK"
    status: "PASS"
    metrics:
      beta_win_std: 21.34
      beta_len_std: -4.37
      beta_len_sign: "NEGATIVE"
      dominance_ratio: 4.88
      p_win: 4.58e-145
      r_squared_full: 0.963
      r_squared_verbosity_only: 0.256
      r_squared_gain: 0.707  # +70.7pp
      heteroscedasticity_bp_p: 0.011  # mild, non-critical
      method: "statsmodels.OLS with sklearn.StandardScaler"

  H-M2:
    name: "FWL Theorem Verification"
    gate: "SHOULD_WORK"
    status: "PASS"
    metrics:
      rho_pingouin: 0.9851
      rho_fwl_resid: 0.9739
      delta: 0.0112
      delta_threshold: 0.02
      p_fwl: 2.37e-144
      bootstrap_ci_lower: 0.962
      bootstrap_ci_upper: 0.981
      converged: true

  H-M3:
    name: "KW on Delta across Quartiles"
    gate: "SHOULD_WORK"
    status: "PASS"
    metrics:
      kw_statistic: 22.19
      p_value: 5.97e-05
      epsilon_squared: 0.088
      effect_size_label: "medium"
      dunn_q1_vs_q4_p: 1.0  # not significant
      monotonic: false
      quartile_medians:
        Q1: 2.19
        Q2: 2.96
        Q3: 5.43  # non-monotonic — Q3 > Q4
        Q4: 0.91
    note: "Non-monotonic Q3. DV choice lesson: Δ attenuates effect by ~10x vs LC_winrate"

  H-C1:
    name: "KW on LC_winrate across Quartiles"
    gate: "SHOULD_WORK"
    status: "PASS"
    metrics:
      kw_statistic: 196.32
      p_value: 2.63e-42
      epsilon_squared: 0.883
      effect_size_label: "large"
      dunn_q1_vs_q4_p: 1.04e-38
      monotonic: true
      quartile_medians:
        Q1: 7.14
        Q2: 14.69
        Q3: 26.41
        Q4: 51.62
      q4_vs_q1_ratio: 7.2  # 7.2x higher
      dunn_correction: "Bonferroni"
      bootstrap_ci_dunn_lower: 1.43e-40
      bootstrap_ci_dunn_upper: 2.23e-35

quartile_boundaries:
  Q1_max: 5.19   # win_rate <= 5.19%
  Q2_max: 14.29  # 5.19% < win_rate <= 14.29%
  Q3_max: 27.85  # 14.29% < win_rate <= 27.85%
  Q4_min: 27.85  # win_rate > 27.85%
  Q_sizes:
    Q1: 56
    Q2: 56
    Q3: 55
    Q4: 56

dv_comparison_lesson:
  lc_winrate_epsilon_squared: 0.883
  delta_epsilon_squared: 0.088
  attenuation_ratio: 10.0
  recommendation: "Use LC_winrate not Δ as DV for capability-alignment studies"

citations:
  verified:
    - key: Dubois2024LengthControlled
      doi: "10.48550/arXiv.2404.04475"
      semantic_scholar_id: "eb375712bd37250c350ecd3f559e1879e87eb3e5"
    - key: Hu2024Explaining
      doi: "10.18653/v1/2025.findings-emnlp.358"
      semantic_scholar_id: "1c5a097b4e376897545f153370425cf7e0c2d8fd"
      arxiv: "2407.01085"
    - key: Zheng2023Judging
      semantic_scholar_id: "a0a79dad89857a96f8f71b14238e5237cbfc4787"
      arxiv: "2306.05685"
    - key: Shen2024Bidirectional
      doi: "10.48550/arXiv.2406.09264"
      semantic_scholar_id: "c11d885b219e817bdb3d4e95c0307e7f987d3bba"
    - key: Shi2024Judging
      doi: "10.48550/arXiv.2406.07791"
      semantic_scholar_id: "b55f84db0d6b75328ddf26d3c5abc0193afdb3b0"
  unverified:
    - key: Singhal2023Sycophancy
      note: "Not found via Semantic Scholar — verify before submission"
    - key: Ji2023Survey
      arxiv_claimed: "2310.19852"
      note: "Not confirmed via MCP in this session — verify"
  classical:
    - key: Frisch1933Partial
    - key: Lovell1963Seasonal
  software:
    - key: Vallat2018Pingouin
      doi: "10.21105/joss.01026"

adversarial_review_targets:
  - claim: "r_partial = 0.985 > bivariate 0.94"
    evidence: "H-E1 metrics above; partial correlation controls for VIF=1.764 confound"
    challenge_vector: "Is VIF=1.764 low enough to justify partial correlation interpretation?"
  - claim: "|β_win| dominates 4.88:1"
    evidence: "H-M1 metrics above"
    challenge_vector: "Mild heteroscedasticity (BP p=0.011) — does it affect β estimates?"
  - claim: "FWL convergence delta=1.1pp"
    evidence: "H-M2 metrics above"
    challenge_vector: "FWL exact equality only holds for Pearson, not Spearman — acknowledged as 'should work' not exact"
  - claim: "ε²=0.883 large effect"
    evidence: "H-C1 KW on LC_winrate"
    challenge_vector: "KW epsilon-squared interpretation — is this the right effect size for KW?"
  - claim: "10× DV attenuation"
    evidence: "0.883 vs 0.088"
    challenge_vector: "H-M3 still found p=5.97e-05 — Δ varies across quartiles, just non-monotonically"

known_limitations:
  - id: L1
    description: "Observational study — no causal claims"
  - id: L2
    description: "Single dataset (AlpacaEval 2.0); may not generalize"
  - id: L3
    description: "win_rate conflates capability with style preferences"
  - id: L4
    description: "Mild heteroscedasticity in H-M1 (BP p=0.011)"
  - id: L5
    description: "Δ-monotonicity not confirmed (H-M3 non-monotonic Q3)"
