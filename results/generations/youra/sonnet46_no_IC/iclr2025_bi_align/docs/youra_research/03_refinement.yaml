# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiAlign-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the scope of N=222 models in the publicly available AlpacaEval 2.0 leaderboard
    (win_rate, length_controlled_winrate, avg_length columns confirmed accessible),
    if model capability is higher (operationalized as raw human preference win_rate),
    then length-debiased preference score (LC_winrate) is also higher beyond what verbosity
    (avg_length) explains, because high-capability models produce broad-spectrum quality
    outputs that satisfy both human annotators and AI-based length-controlled evaluation
    systems simultaneously, while low-capability models disproportionately exploit
    verbosity/formatting heuristics that the LC correction strips away.
    Formally: ρ(win_rate, LC_winrate | avg_length) > 0, p < 0.05, |r_partial| ≥ 0.15.
  alternative_hypothesis_h0: |
    There is no significant partial correlation between model capability (win_rate) and
    length-debiased preference score (LC_winrate) after controlling for response verbosity
    (avg_length). Any observed correlation between win_rate and LC_winrate is fully
    explained by verbosity, not by capability per se.
    H0: ρ(win_rate, LC_winrate | avg_length) = 0.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "win_rate"
      type: "continuous"
      operationalization: "Fraction of model outputs preferred by human annotators over GPT-4o reference in AlpacaEval 2.0 pairwise comparison; range 0-1; higher = more human-preferred = higher capability proxy"
  dependent:
    - name: "length_controlled_winrate"
      type: "continuous"
      operationalization: "GLM-debiased win rate from AlpacaEval 2.0; length effect regressed out via GLM; range 0-1; PRIMARY DV for OLS and partial correlation tests"
      primary: true
    - name: "delta"
      type: "continuous"
      operationalization: "Δ = length_controlled_winrate − win_rate; bidirectional alignment gap metric; negative values indicate GPT-4 LC rates model lower than humans; SECONDARY DV for alignment gap interpretation"
      primary: false
  controlled:
    - name: "avg_length"
      operationalization: "Mean response token length per model in AlpacaEval 2.0; verbosity confound; controlled via partial correlation and OLS covariate"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "High-capability models (high win_rate) produce outputs with high desirability — quality that is length-independent and captures human preferences for correctness, coherence, and task completion. This desirability component is operationalized as the win_rate signal that survives LC correction."
      evidence: "Hu et al. 2024 decomposition of win_rate into desirability (length-independent) and information mass (length-dependent); h-m1 observation: GPT-4 (Δ=−8.8pp) vs wizardlm (Δ=−32pp) within same training type"
      falsifier: "If win_rate is not associated with any quality signal beyond length (i.e., if win_rate is purely explained by avg_length), then capability-desirability claim fails — detectable via ρ(win_rate, avg_length) ≈ 1.0"
    - step: 2
      description: "High-desirability outputs satisfy the GPT-4 LC evaluation criteria (which are orthogonalized against length) at a rate proportionate to their capability. The LC evaluator rewards capability-intrinsic properties (accuracy, structure, task relevance) that correlate with human preference independent of response length."
      evidence: "Li et al. 2024: LLMs of similar sizes have similar preferences regardless of training method — capability drives convergence between evaluators; Dubois 2024: LC_winrate and win_rate are highly correlated (ρ≈0.94) but not identical, indicating shared capability signal"
      falsifier: "If LC_winrate and win_rate measure the same thing (ρ=1.0), no additional capability signal exists. If LC_winrate is independent of win_rate (ρ≈0), LC measures something entirely different from capability."
    - step: 3
      description: "The bidirectional alignment gap (Δ = LC_winrate − win_rate) is smaller (less negative) for high-capability models because their win_rate and LC_winrate are closer together — both measuring the same underlying quality. Low-capability models exhibit large negative Δ because their win_rate is inflated by length/formatting heuristics that the LC correction penalizes."
      evidence: "h-m1 direct observation: within RLHF group, Δ ranges from −8.8pp (GPT-4, high capability) to −32pp (recycled-wizardlm, low capability); population mean Δ ≈ −16.37pp; Singhal et al. 2023: RLHF amplifies length but effect is quality-dependent"
      falsifier: "If Δ is constant across capability levels (no correlation with win_rate), the mechanism fails. If VIF(win_rate, avg_length) >> 5, the decomposition is uninterpretable."
  key_tension: "The mathematical dependency (Δ = LC_winrate − win_rate contains −win_rate) means any observed correlation of win_rate with Δ has a trivial component. The partial correlation ρ(win_rate, LC_winrate | avg_length) using LC_winrate as DV resolves this, but VIF between win_rate and avg_length is unknown pre-experiment and could affect H-M interpretability."
  evidence_summary: |
    Three independent evidence sources support the causal chain:
    (1) h-m1 direct empirical observation within RLHF group showing capability-Δ gradient;
    (2) Dubois 2024 establishing LC_winrate as empirically distinct from win_rate (ρ≈0.94);
    (3) Hu 2024 mechanistic decomposition showing desirability and information mass are separable.
    Theoretical grounding: Shen et al. 2024 identifies this as open empirical challenge for bidirectional alignment.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "win_rate is a valid proxy for model capability (not just a verbosity or popularity signal)"
    supporting_evidence: "AlpacaEval 2.0 uses human annotators for pairwise preference; strong correlation with MT-Bench and Chatbot Arena (Dubois 2024); h-m1 showed within-RLHF group win_rate tracks quality gradient"
    consequence_if_violated: "If win_rate primarily reflects verbosity or response format rather than quality, the partial correlation is not interpretable as capability-Δ relationship; however, the Hu 2024 decomposition (desirability channel) shows win_rate has a length-independent component"
  - id: "A2"
    assumption: "VIF(win_rate, avg_length) < 5 in AlpacaEval 2.0 data — moderate collinearity at most"
    supporting_evidence: "win_rate and avg_length measure qualitatively different things (human preference vs. response length); VIF for ρ=0.5 ≈ 1.33, for ρ=0.7 ≈ 1.96 — well below VIF=5 threshold; only ρ>0.9 would give VIF>5"
    consequence_if_violated: "OLS β coefficients become imprecise; H-M (dominance comparison) fails; mitigation: dominance analysis (Shapley values for regression) or ridge regression; H-E (partial correlation) is VIF-robust"
  - id: "A3"
    assumption: "The capability-Δ relationship observed in h-m1 (N=58 typed subset) generalizes to full leaderboard N=222"
    supporting_evidence: "The h-m1 analysis used 58 models with known training type; full leaderboard contains 222 models with broader capability range; larger N should increase statistical power and stabilize estimates"
    consequence_if_violated: "The N=58 within-RLHF gradient may be specific to RLHF models; out-of-distribution models may show different patterns; check: run analysis on full N=222 and on typed-subset N=58 separately"
  - id: "A4"
    assumption: "The AlpacaEval 2.0 dataset is representative of the broader model evaluation landscape (not biased toward specific model families)"
    supporting_evidence: "N=222 models from diverse sources; includes GPT-4, Claude, Llama, Mistral, open-source finetuned variants; Dubois 2024 validation against Chatbot Arena confirms alignment with human preferences broadly"
    consequence_if_violated: "If the dataset is dominated by a single model family, the capability gradient may reflect family-specific training differences rather than general capability effects; check: model family distribution in N=222"
  - id: "A5"
    assumption: "The directional prediction (ρ < 0 for Δ / ρ > 0 for LC_winrate partial) holds — high capability → smaller |Δ|"
    supporting_evidence: "h-m1 within-RLHF observation provides direct prior evidence; theoretical mechanism (broad-spectrum quality) supports this direction; Li et al. 2024 shows capability drives evaluator preference convergence"
    consequence_if_violated: "If high-capability models show MORE negative Δ, it means LC evaluation penalizes high-capability outputs disproportionately — possible if high-capability models are systematically longer at high quality (information mass argument). This would be an equally interesting but opposite finding."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    AlpacaEval 2.0 leaderboard models (N=222) with confirmed win_rate, length_controlled_winrate,
    and avg_length columns. Models spanning diverse capability levels (win_rate range: ~1% to ~98%).
    The relationship is expected to hold for models evaluated on instruction-following tasks
    with human pairwise preference annotation vs GPT-4o reference.
  does_not_apply_to: |
    Cross-leaderboard analysis (explicitly excluded — root cause of h-e1 failures).
    HumaneEval v1 models (2025/2026 era — no AlpacaEval 2.0 overlap).
    Arena ELO as AI→H proxy (misclassified in h-e1 run1 — Arena ELO is H→AI).
    RewardBench-Chat (insufficient model overlap — max N=10 in prior analysis).
    Models not in AlpacaEval 2.0 CSV.
  known_limitations: |
    1. win_rate is not a pure capability measure — it conflates capability with response style preferences.
    2. The AlpacaEval 2.0 dataset reflects human preferences as of its collection date (2023-2024 era models dominant).
    3. The GLM-based LC correction may not perfectly orthogonalize length and quality for all model types.
    4. The analysis is observational (not causal) — VIF or unmeasured confounds may affect interpretation.
    5. Results may not generalize to non-instruction-following tasks or other evaluation frameworks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The partial correlation ρ(win_rate, LC_winrate | avg_length) is significantly positive (p < 0.05, |r_partial| ≥ 0.15), establishing that model capability independently predicts length-debiased preference score beyond verbosity."
    test_method: "pingouin.partial_corr(data=df, x='win_rate', y='length_controlled_winrate', covar='avg_length') on AlpacaEval 2.0 CSV (N=222). Also run OLS: LC_winrate ~ win_rate_std + avg_length_std; test β_win_rate > 0, p < 0.05."
    success_criterion: "r_partial > 0 AND p < 0.05 (two-tailed) AND |r_partial| ≥ 0.15"
    falsification: "r_partial ≤ 0 OR p ≥ 0.05 OR |r_partial| < 0.15 → H-E FAILS, hypothesis falsified, route to Phase 0"
  - id: "P2"
    primary: false
    statement: "In standardized OLS (LC_winrate ~ win_rate_std + avg_length_std), the absolute standardized coefficient for capability (|β_win_rate|) exceeds that for verbosity (|β_avg_length|), indicating capability is the dominant predictor of length-debiased preference."
    test_method: "sklearn StandardScaler preprocessing; statsmodels OLS or sklearn.LinearRegression; compare standardized β coefficients. If VIF(win_rate, avg_length) ≥ 5, use dominance analysis (Shapley values) instead."
    success_criterion: "|β_win_rate_std| > |β_avg_length_std| in standardized OLS, both with p < 0.05 (or Shapley(win_rate) > Shapley(avg_length) if VIF ≥ 5)"
    falsification: "|β_avg_length_std| ≥ |β_win_rate_std| → H-M fails (SHOULD_WORK level; does not invalidate H-E)"
  - id: "P3"
    primary: false
    statement: "Win_rate quartiles (Q1 = lowest capability, Q4 = highest capability) show significantly different LC_winrate distributions (Kruskal-Wallis), with Q4 showing systematically higher LC_winrate than Q1 (Dunn post-hoc Q1 vs Q4, Bonferroni-corrected p < 0.05), confirming monotonic capability-alignment relationship."
    test_method: "pd.qcut(df['win_rate'], q=4); scipy.stats.kruskal(*[group['LC_winrate'].values for _, group in df.groupby('quartile')]); scikit_posthocs.posthoc_dunn for pairwise comparison."
    success_criterion: "Kruskal-Wallis p < 0.05 AND Dunn Q1 vs Q4 Bonferroni-corrected p < 0.05"
    falsification: "Kruskal-Wallis p ≥ 0.05 OR Dunn Q1 vs Q4 p ≥ 0.05 → H-C fails (SHOULD_WORK level; does not invalidate H-E)"

