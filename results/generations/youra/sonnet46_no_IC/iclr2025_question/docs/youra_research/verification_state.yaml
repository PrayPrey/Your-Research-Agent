main_hypothesis:
  id: H-LayerLensUQ-v2
  title: Depth-Resolved Logit-Lens Uncertainty Signals for Architecture-Robust Hallucination Detection
  statement: 'Under white-box, single-greedy-pass inference on TriviaQA and TruthfulQA with LLaMA-2-7B, Mistral-7B-v0.1, and
    LLaMA-3-8B-Instruct, per-layer logit-lens uncertainty statistics (Shannon entropy, max-token probability, adjacent-layer
    KL divergence, averaged over answer tokens) with (layer, signal, direction) selected per model on a held-out selection
    split achieve test-split AUROC >= 0.60 on both datasets for all three models AND on LLaMA-2-7B exceed the final-layer
    entropy baseline (0.5186) with a 95% paired-bootstrap CI on the AUROC difference excluding zero, because intermediate
    layers preserve the separation between resolved and unresolved candidate competition that final-layer output calibration
    suppresses.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TriviaQA rc.nocontext validation[:1000] + TruthfulQA generation validation (817)
    model: meta-llama/Llama-2-7b-hf + mistralai/Mistral-7B-v0.1 + meta-llama/Meta-Llama-3-8B-Instruct (frozen, fp16)
    optimizer: N/A (training-free scoring; P3 fusion = 2-parameter logistic on selection split)
    hyperparameters:
      decoding: greedy (do_sample=False), h-e1-identical max_new_tokens
      split: stratified 50/50 selection/test per dataset, seed 42, test locked
      bootstrap: paired percentile, n=1000, example-level resampling
      numerics: fp16 weights, float32 statistics, log(p+1e-12) guard, KL NaN at layer 1 excluded
      degeneracy_screen: drop layers with entropy within 1% of ln|V| OR top-1 agreement with final layer < 5%
      anchor: h-e1 final-layer references reproduced within ±0.03 (halt gate)
  baseline_comparison:
