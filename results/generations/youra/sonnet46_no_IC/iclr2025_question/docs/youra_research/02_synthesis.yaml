measurement_plan:
  data_collection:
    - source: "Single greedy pass per example with output_hidden_states=True; teacher-forced re-forward on generated sequence; per-layer lm_head(model.norm(h_l)) in float32; 3 signals x 32 layers, mean over answer tokens; per-token statistics cached (FST-style ablation); streaming scalar CSV (no hidden-state stacks); reuse v1 871/1000 llama2/TriviaQA cache where protocol-identical"
  procedure:
    - step: "Load datasets, h-e1-verbatim prompts/labels; stratified 50/50 selection/test split per dataset, seed 42; write and lock test split"
    - step: "Smoke run (10 examples/model, shape + memory assert) before each full sweep"
    - step: "Full sweep: 1,817 examples x 3 models; stream per-example scalars"
    - step: "Selection split ONLY: degeneracy screen (drop layers with entropy within 1% of ln|V| OR top-1 agreement with final layer < 5%), select (layer, signal, direction) per model, freeze direction signs, fit P3 fusion"
    - step: "Test split: corrected AUROC per cell; paired bootstrap n=1000 for ΔAUROC_rescue, transfer gaps, fusion gains"
    - step: "Diagnostics: h-e1 baseline reproduction ±0.03 (halt on failure — A2); raw-direction pattern report (Chi/familiarity flag); length-stratified AUROC on selected layers"
  success_criteria:
    - "Tier 1 (rescue, falsification gate): LLaMA-2-7B CI-separated ΔAUROC > 0 vs final-layer entropy on TriviaQA AND selected layer AUROC >= 0.60 on both datasets"
    - "Tier 2 (robustness): all six model x dataset cells >= 0.60 AND no-regression clause (mistral/llama3 intermediate >= final − 0.02)"
    - "Protocol validity: h-e1 references reproduced within ±0.03; mechanism-activation indicators (depth variation of AUROC across layers std > 0.01) all TRUE"

validation:
  internal_validity:
    - "All selection-sensitive operations (screen, selection, direction freezing, fusion fitting) confined to selection split; test split locked and read once"
    - "Paired bootstrap on differences (not marginal-CI comparison); direction correction estimated on selection, frozen on test — 192-candidate selection bias controlled"
    - "Within-model rescue structure cancels tokenizer/tuning/calibration confounds by construction"
    - "Length-stratified AUROC check guards against non-uniform EM label noise becoming spurious signal"
  external_validity:
    - "Claims bounded to two QA datasets, three 7-8B families, greedy decoding (R4); base/instruct asymmetry documented (R3)"
    - "Cross-dataset transfer measured explicitly (P2) rather than assumed; both outcomes pre-interpreted"
    - "Recall-vs-truthfulness causal question scoped out (R1) with direction-pattern diagnostic reported"

discussion_synthesis:
  key_insights:
    - "The h-e1 failure is best explained as calibration suppression at the final layer, not absence of signal — the mechanism retrodicts both the 0.5186 miss and the direction inversion"
    - "Kim et al.'s adversarial alignment result is answered by measurement scope: single-token trajectories ≠ full-distribution statistics; their own 97%-positive PD correlations show residual signal"
    - "Within-model rescue framing (intermediate vs final on the same checkpoint) cancels the base/instruct confound by construction — the single best design decision of the discussion"
    - "Honest vocabulary matters: 'training-free scoring, label-efficient selection'; fusion quarantined as the only trained component"
    - "P1 and P2 are separable claims: transfer failure must not contaminate the rescue verdict"
  breakthrough_moments:
    - "Exchange 6: Dr. Ally's within-model restructure of the rescue claim, dissolving Rex's confound objection by construction"
    - "Exchange 7: Dr. Nova's unresolved-candidate-competition mechanism, converting Entropy-Lens's expansion/pruning reading into a hallucination account that makes all three signals natural"
    - "Exchange 8: Prof. Vera's leak-closing protocol (direction sign frozen from selection split; paired bootstrap on differences) — turning a 192-candidate fishing risk into a disciplined selection"
    - "Exchange 13: mechanism upgraded to three falsifiable steps that retrodict both h-e1 anomalies"
  resolved_tensions:
    - "Kim 2025 alignment vs Entropy-Lens richness → resolved by measurement-scope boundary (final-token trajectory vs full-distribution statistics); the experiment adjudicates the remaining question"
    - "'Training-free' claim vs label-consuming selection → resolved by vocabulary split (training-free scoring, label-efficient selection) and fusion quarantine"
    - "FEPoID cross-dataset layer variability vs deployability → resolved by demoting transfer to measured prediction P2 with pre-stated tolerance and pre-interpreted outcomes"
    - "Rex's 0.57 ambiguity scenario → resolved by two-tier frozen gates (Tier 1 rescue / Tier 2 robustness), making partial outcomes well-defined"
