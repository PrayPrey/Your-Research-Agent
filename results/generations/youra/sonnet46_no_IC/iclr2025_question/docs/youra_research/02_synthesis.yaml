hypothesis_draft:
  title: "Depth-Resolved Logit-Lens Uncertainty Signals for Architecture-Robust Hallucination Detection"
  hypothesis_id: "H-LayerLensUQ-v2"
  core_claim: |
    Per-layer logit-lens uncertainty statistics (Shannon entropy, max-token probability,
    adjacent-layer KL divergence) computed from a single greedy forward pass, with
    (layer, signal, direction) selected per model on a held-out selection split, achieve
    hallucination-detection AUROC >= 0.60 on TriviaQA and TruthfulQA for LLaMA-2-7B,
    Mistral-7B-v0.1, and LLaMA-3-8B-Instruct — including a CI-separated within-model
    rescue of LLaMA-2-7B, where the final-layer entropy readout failed at 0.5186.
  mechanism: |
    Calibration suppression, three falsifiable steps: (1) factual answers resolve
    next-token candidate competition at intermediate depth while hallucinations remain
    unresolved (elevated entropy, contested leader, persistent inter-layer revision —
    grounded in Entropy-Lens's validated expansion/pruning reading); (2) final-layer
    output calibration (tokenizer/tuning-dependent) suppresses the separation at layer
    32; (3) suppression severity is architecture-dependent — worst in base LLaMA-2-7B —
    so per-model depth selection restores robustness. Retrodicts both h-e1 anomalies
    (llama2 miss and direction inversion).
  predictions:
    - P1: "LLaMA-2-7B rescue: selected intermediate layer reaches AUROC >= 0.60 on both datasets AND beats final-layer entropy with 95% paired-bootstrap CI excluding zero on TriviaQA (primary falsification gate)"
    - P2: "Cross-dataset layer transfer: TriviaQA↔TruthfulQA transferred layer within 0.05 AUROC of native selection and >= 0.60, both directions, per model (genuinely uncertain; separable claim)"
    - P3: "KL-entropy complementarity: 2-parameter logistic fusion gains >= 0.02 AUROC over best single signal with CI excluding zero (trained combiner, quarantined)"

variables_summary:
  independent: "readout_layer (1-32, per-model selected vs final-layer baseline); signal_type (entropy | max_token_probability | adjacent_layer_KL); model_family (3 levels); dataset (2 levels)"
  dependent_primary: "AUROC_corrected on locked test split (direction sign frozen from selection split); supporting: paired ΔAUROC_rescue, transfer_AUROC_gap, fusion_gain"
  controlled: "greedy decoding, h-e1-verbatim prompts/labels, stratified 50/50 selection/test split (seed 42, test locked), fp16 weights + float32 statistics, answer_length logged"

null_hypothesis:
  h0_statement: |
    Per-layer logit-lens statistics carry no separation the final layer lacks: for every
    screened intermediate layer of LLaMA-2-7B, the 95% paired-bootstrap CI of
    ΔAUROC(intermediate − final-layer entropy) contains zero; no model achieves test-split
    AUROC >= 0.60 on both datasets beyond final-layer performance; cross-dataset transfer
    is no better than chance layer choice.
  statistical_test: "Paired percentile bootstrap (n=1000, example-level resampling, both scores per resample) for AUROC differences; per-cell corrected AUROC with direction sign estimated on selection split and frozen on test"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Reading uncertainty BEFORE final-layer calibration: per-layer logit-lens statistics as training-free single-pass detection scores with per-model held-out selection — the empty cell between Entropy-Lens (feature without task) and FEPoID (task without this method)"
  differentiation_summary: |
    Entropy-Lens computes the identical feature as a computation signature, never for
    detection AUROC. FEPoID confirms intermediate>final but selects via intrinsic
    dimension inside a supervised probing framework. Kim et al. 2025's negative result
    concerns final-prediction-token trajectories (tuned lens, MCQ) — a strictly narrower
    measurement, answered by scope. SAPLMA requires a trained probe. END/DoLa use
    cross-layer shifts only at decoding time. h-e1 (own failure) read one scalar at the
    final layer only. HalluShift overlap: formal novelty check scheduled in Phase 2B.
    Cross-dataset layer-transfer matrix is measured nowhere in the corpus.

