# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LayerLensUQ-v2"
  confidence_level: 0.72 # Prof. Vera's audited proposal (Exchange 13): P2 uncertainty and Kim-adjacency priced in
  core_hypothesis_statement: |
    Under white-box, single-greedy-pass inference on TriviaQA and TruthfulQA with
    LLaMA-2-7B, Mistral-7B-v0.1, and LLaMA-3-8B-Instruct, if hallucination scores are
    computed as per-layer logit-lens uncertainty statistics (Shannon entropy, max-token
    probability, adjacent-layer KL divergence of decoded distributions, averaged over
    answer tokens) with (layer, signal, direction) selected per model on a held-out
    selection split, then the selected intermediate-layer score achieves test-split
    AUROC >= 0.60 on both datasets for all three models AND on LLaMA-2-7B exceeds the
    final-layer entropy baseline (0.5186) with a 95% paired-bootstrap CI on the AUROC
    difference excluding zero, because intermediate layers preserve the separation
    between resolved (factual) and unresolved (hallucinated) candidate competition that
    final-layer output calibration — tokenizer- and tuning-dependent — suppresses.
  alternative_hypothesis_h0: |
    Per-layer logit-lens statistics carry no separation the final layer lacks: for every
    screened intermediate layer of LLaMA-2-7B, the 95% paired-bootstrap CI of
    ΔAUROC(intermediate − final-layer entropy) contains zero, and no model achieves
    test-split AUROC >= 0.60 on both datasets beyond what final-layer signals provide;
    cross-dataset layer transfer performs no better than chance layer choice.

