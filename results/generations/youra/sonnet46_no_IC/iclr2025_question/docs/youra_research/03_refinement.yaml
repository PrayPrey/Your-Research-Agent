variables:
  independent:
    - name: "readout_layer"
      type: "categorical"
      operationalization: "Transformer layer index ℓ ∈ {1..32} at which logit-lens statistics are computed (embedding state excluded); selected per model on selection split; final layer serves as within-model baseline"
      levels: ["1-31 (intermediate)", "32 (final, baseline)"]
    - name: "signal_type"
      type: "categorical"
      operationalization: "Which per-layer statistic scores the example"
      levels: ["entropy", "max_token_probability", "adjacent_layer_KL"]
    - name: "model_family"
      type: "categorical"
      operationalization: "Frozen 7-8B checkpoint, fp16, greedy decoding"
      levels: ["meta-llama/Llama-2-7b-hf", "mistralai/Mistral-7B-v0.1", "meta-llama/Meta-Llama-3-8B-Instruct"]
    - name: "dataset"
      type: "categorical"
      operationalization: "QA benchmark with h-e1-verbatim prompts and labels"
      levels: ["TriviaQA rc.nocontext validation[:1000]", "TruthfulQA generation validation (817)"]
  dependent:
    - name: "AUROC_corrected"
      type: "continuous"
      operationalization: "Area under ROC for hallucination label (1 = incorrect), direction sign estimated on selection split and applied frozen on test split; range [0,1]; sklearn roc_auc_score"
      primary: true
    - name: "delta_AUROC_rescue"
      type: "continuous"
      operationalization: "AUROC(selected intermediate) − AUROC(final-layer mean entropy), paired bootstrap n=1000 resampling examples, 95% percentile CI"
      primary: false
    - name: "transfer_AUROC_gap"
      type: "continuous"
      operationalization: "AUROC(layer selected on dataset A, evaluated on dataset B test) − AUROC(natively selected layer on B test), per model, both directions"
      primary: false
    - name: "fusion_gain"
      type: "continuous"
      operationalization: "AUROC(2-parameter logistic fusion of best entropy-family + best KL signal) − AUROC(best single signal), paired bootstrap CI"
      primary: false
  controlled:
    - name: "decoding"
      operationalization: "Greedy (do_sample=False), h-e1-identical max_new_tokens; single pass; teacher-forced re-forward with output_hidden_states=True on the generated sequence"
    - name: "labels_and_prompts"
      operationalization: "h-e1 prompt templates, scoring modes, and correctness labels reused verbatim (anchors comparability to the 0.5186 baseline)"
    - name: "split_discipline"
      operationalization: "Stratified 50/50 selection/test per dataset, seed 42; test split written and locked; degeneracy screen, selection, direction freezing, fusion fitting on selection split ONLY"
    - name: "numerics"
      operationalization: "fp16 weights, float32 statistics, log(p+1e-12) guard, KL undefined at layer 1 (NaN, excluded)"
    - name: "answer_length"
      operationalization: "Logged per example; length-stratified AUROC sanity check on selected layers (label-noise diagnostic, Exchange 10)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "For factual answers, next-token candidate competition resolves at intermediate depth (early expansion, long pruning glide); for hallucinated answers the competition remains unresolved — elevated entropy, contested max-prob leader, and persistent inter-layer belief revision deeper into the stack"
      evidence: "Entropy-Lens validated ΔH ↔ candidate-set correspondence (Spearman 0.74-0.88) [Ali et al., 2025]; supervised probes find truthfulness at intermediate depth [Azaria & Mitchell, 2023]; intermediate>final consensus [Wang et al., 2026]"
      falsifier: "No screened intermediate layer on any model shows class-separable statistics (all selection-split AUROCs ≈ 0.5) — separation does not exist in token space at depth"
    - step: 2
      description: "Final-layer output calibration (tokenizer- and RLHF/tuning-dependent unembedding sharpening) suppresses this separation, collapsing the correct/hallucinated statistic gap at layer 32"
      evidence: "h-e1: same statistic that fails at final layer on llama2 (0.5186, inverted) works on llama3-instruct (0.6583) — calibration varies by model [Kadavath et al., 2022 grounds the confound]; logit-lens bias concentrated near output layers [Belrose et al., 2023]"
      falsifier: "Intermediate-layer AUROC ≤ final-layer AUROC on LLaMA-2-7B (CI containing zero or negative ΔAUROC) — nothing was suppressed; the signal never existed"
    - step: 3
      description: "Suppression severity is architecture/tuning-dependent — worst in base LLaMA-2-7B, mildest in RLHF-tuned LLaMA-3-8B-Instruct — so reading BEFORE calibration (per-model selected intermediate layer) restores architecture-robust detection"
      evidence: "Retrodicts BOTH h-e1 anomalies: the llama2 miss AND the TriviaQA direction inversion (calibration sign-flipping a residual signal). Exchange 13. Instruct tuning amplifies final-layer entropy differences (h-e1 lessons)"
      falsifier: "Per-model selected intermediate layers still fail on llama2 while final layers suffice elsewhere, or improvements appear uniformly across models with no relation to tuning status — architecture-dependence claim wrong"
  key_tension: "Kim et al. 2025 found certain/uncertain layer-wise trajectories ALIGNED (final-prediction-token probability, tuned lens, MCQ); our mechanism requires full-distribution statistics to separate where single-token trajectories do not — the scope boundary between these measurements is the hypothesis's load-bearing wall"
  evidence_summary: |
    The causal chain is anchored at both ends: step 1 by the published intermediate-layer
    consensus and Entropy-Lens's validated mechanistic reading of per-layer entropy, and
    step 2/3 by the h-e1 failure data itself, which the mechanism retrodicts in detail
    (which model fails, on which readout, including the direction inversion). The open
    middle — whether the separation survives unembedding into token space at intermediate
    depth — is exactly what the experiment measures, and Kim et al.'s adversarial result
    bounds the nearest measurement that does NOT work.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The raw logit lens yields valid (non-degenerate) decoded distributions on enough intermediate layers of all three models to permit selection"
    supporting_evidence: "LLaMA/Mistral lineage is the best-behaved lens case (pre-LN, clean model.norm+lm_head path) [Belrose et al., 2023]; v1 archive ran the extraction healthily"
    consequence_if_violated: "Degeneracy screen rejects most layers; fallback to tuned-lens translators (introduces trained components — claim vocabulary must be relabeled for that variant)"
  - id: "A2"
    assumption: "h-e1's labels, prompts, and answer-span extraction are reusable verbatim and reproduce the final-layer reference AUROCs within ±0.03"
    supporting_evidence: "Labels/templates preserved in v1 archive; identical protocol re-run mid-flight in v1 before interruption"
    consequence_if_violated: "Baseline anchor fails — labeling/prompting discrepancy makes ALL downstream comparisons uninterpretable; pipeline must halt and reconcile (mandatory protocol-validity gate)"
  - id: "A3"
    assumption: "Mean-over-answer-tokens aggregation is not dominated by end-of-sequence noise for short-form QA answers"
    supporting_evidence: "TriviaQA/TruthfulQA greedy answers are short-form; FST evidence of degradation [Wang et al., 2026] concerns 30-token instruct rambles; per-token statistics cached for free truncated-aggregation ablation"
    consequence_if_violated: "Aggregation noise depresses all AUROCs; run the cached FST-style truncated ablation offline; if it rescues, adopt with documented deviation"
  - id: "A4"
    assumption: "Selection-split discipline (500/408 examples) suffices to select (layer, signal, direction) from ~192 candidates without overfitting that destroys test-split performance"
    supporting_evidence: "Selection of one discrete argmax over smooth AUROC(layer) curves is low-complexity; h-e1 CI machinery (n=1000 bootstrap) quantifies uncertainty"
    consequence_if_violated: "Test-split AUROC systematically below selection-split AUROC beyond CI width — selection overfit; report both splits, widen to top-k layer ensembling only as documented deviation"
  - id: "A5"
    assumption: "AUROC under standard correct/incorrect labels measures hallucination separation, not merely question familiarity (recall)"
    supporting_evidence: "Standard protocol across the field (FEPoID, SAPLMA, h-e1); Chi et al. 2025 challenge acknowledged and scoped out causally"
    consequence_if_violated: "Signal reflects recall/popularity rather than truthfulness; claims remain valid as stated (separation under standard labels) — direction-pattern diagnostic flags familiarity-like behavior; causal disentanglement explicitly out of scope (R1)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    White-box open-source LLMs (LLaMA-2-7B base, Mistral-7B-v0.1 base,
    LLaMA-3-8B-Instruct) with accessible hidden states and unembedding; single greedy
    pass; short-form QA hallucination detection on TriviaQA (rc.nocontext) and
    TruthfulQA (generation) under h-e1-verbatim correct/incorrect labels; per-model
    signal selection with a small labeled selection split available.
  does_not_apply_to: |
    Black-box/API models (no hidden-state access); multi-sample consistency methods
    (excluded direction from failed fusion attempts); long-form generation or
    summarization hallucination; claims about the CAUSAL nature of the signal
    (recall vs truthfulness — R1); models outside the three tested 7-8B families;
    non-greedy decoding regimes. "Training-free" applies to scoring only — selection
    is label-efficient, not label-free; the P3 fusion is an explicitly trained
    2-parameter combiner.
  known_limitations: |
    (R1) Recall shadow: direction-pattern diagnostic can flag but not exclude a
    familiarity-based mechanism (Chi et al. 2025). (R2) Transfer fragility: SAPLMA's
    within-model layer shift and FEPoID's cross-dataset variability make P2 genuinely
    uncertain; P1/P2 verdicts are separable by design. (R3) Instruct asymmetry: LLaMA-3
    is the only instruct model — cross-model depth patterns are confounded; relative-depth
    observations stay descriptive. (R4) Generalization ceiling: two QA datasets, three
    7-8B families, greedy decoding — "architecture-robust" means "across the three tested
    families" only. TruthfulQA's n=817 yields wide CIs — CI-separation clauses anchor on
    TriviaQA (n=1000).

