established_facts:
  claims:
    - claim: "Hallucination-related signals are more strongly encoded in intermediate layers than in the final layer of LLMs"
      status: "BUILD_ON"
      evidence: "Stated as known in FEPoID abstract [Wang et al., 2026, arXiv 2605.26366]; corroborated by 'LLMs Know More Than They Show' (2024) and 'Layer by Layer' (2025). Discussion Exchange 1."
    - claim: "Per-layer logit-lens entropy from a single forward pass is a well-defined, computable, per-sample statistic carrying rich structure"
      status: "BUILD_ON"
      evidence: "Entropy-Lens [Ali et al., 2025, arXiv 2502.16570]: validated expansion/pruning reading (Spearman 0.74-0.88 vs candidate-set changes), kNN AUC > 94 on entropy profiles. Exchanges 1, 7."
    - claim: "Truthfulness information is extractable from intermediate hidden states with supervised probes, and the optimal layer varies per model and per distribution"
      status: "BUILD_ON"
      evidence: "SAPLMA [Azaria & Mitchell, 2023, arXiv 2304.13734]: OPT best at layer 20/32, LLaMA2 at 16/32, shift to 28/32 on generated sentences (p<0.05). Exchanges 4, 10."
    - claim: "Final-layer mean token entropy fails on base LLaMA-2-7B (AUROC 0.5186 TriviaQA, direction inverted; 0.5153 TruthfulQA) while passing on Mistral-7B and LLaMA-3-8B-Instruct"
      status: "BUILD_ON"
      evidence: "h-e1 Run 1 failure record (Serena memory failure_h-e1_run1.md), bootstrap CIs n=1000. Serves as the documented baseline anchor for the rescue test. Briefing + Exchange 2."
    - claim: "The raw logit lens is a biased, family-dependent instrument requiring validity screening"
      status: "BUILD_ON"
      evidence: "Tuned Lens [Belrose et al., 2023, arXiv 2303.08112]: 4-5 bits marginal KL bias on GPT-Neo, rogue dimensions, representation drift; LLaMA/Mistral lineage best-behaved. Exchange 3."
    - claim: "Final-prediction-token probability trajectories are largely aligned for certain vs uncertain outputs (adversarial bound on trajectory-based detection)"
      status: "BUILD_ON"
      evidence: "Kim et al. 2025 [arXiv 2507.06722]: 5 models x 11 MCQ datasets; but PD-incorrectness correlations 97% positive (up to 0.48) show residual signal. Answered by measurement scope in Exchange 2."
    - claim: "Per-layer full-distribution logit-lens uncertainty statistics (entropy, max-prob, adjacent-layer KL) achieve hallucination-detection AUROC > 0.60 with per-model held-out layer selection, rescuing LLaMA-2-7B where the final layer failed"
      status: "PROVE_NEW"
      evidence: "The empty cell verified in Exchanges 1, 5, 12 — no prior work evaluates these statistics as detection AUROC scores with per-model selection."
    - claim: "The layer selected on one QA dataset transfers to another (AUROC within 0.05, floor 0.60)"
      status: "PROVE_NEW"
      evidence: "Measured nowhere in the corpus; counter-evidence exists (FEPoID cross-dataset variability, SAPLMA layer shift) — genuinely uncertain prediction P2. Exchanges 5, 10."
    - claim: "Adjacent-layer prediction KL divergence provides detection signal complementary to per-layer entropy (fusion gain >= 0.02 AUROC)"
      status: "PROVE_NEW"
      evidence: "Cross-layer shift validated only at decoding time (END, DoLa); never as detection score. Exchanges 1, 7, 8."
  scope_reduction_percentage: 62 # 5 of 8 core claims BUILD_ON: (8-3)/8 * 100 ≈ 62
  phase2b_4_instructions: |
    Do NOT re-verify BUILD_ON claims — cite the listed sources. Phase 2B sub-hypotheses
