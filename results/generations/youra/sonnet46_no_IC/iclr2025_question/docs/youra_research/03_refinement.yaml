    primary: true
    statement: "On LLaMA-2-7B (the documented final-layer failure architecture), the per-model selected intermediate-layer logit-lens signal achieves test-split AUROC_corrected >= 0.60 on BOTH TriviaQA and TruthfulQA, and its paired ΔAUROC vs the final-layer mean-entropy baseline on TriviaQA has a 95% bootstrap CI excluding zero"
    test_method: "Single greedy pass; (layer, signal, direction) selected on selection split; frozen evaluation on locked test split; paired percentile bootstrap n=1000 resampling examples (both scores computed per resample); degeneracy screen on selection split only"
    success_criterion: "AUROC >= 0.60 on both datasets AND ΔAUROC CI(2.5%, 97.5%) > 0 on TriviaQA"
    falsification: "No screened intermediate layer clears CI separation vs final layer on LLaMA-2-7B — the depth-resolved hypothesis dies at the same gate that killed h-e1 (Tier 1 fail)"
  - id: "P2"
    primary: false
    statement: "The per-model selected layer is stable across datasets: the layer selected on dataset A's selection split, evaluated on dataset B's test split, yields AUROC within 0.05 of the natively selected layer's AUROC and >= 0.60, in both directions (TriviaQA↔TruthfulQA), for each model"
    test_method: "Transfer matrix: cross-evaluate selected (layer, signal, direction) tuples across datasets on locked test splits; tolerance defined on AUROC scale (layer-index matching explicitly rejected as criterion)"
    success_criterion: "Transfer gap <= 0.05 AND transferred AUROC >= 0.60, both directions, per model"
    falsification: "Either direction drops below tolerance for a model — transfer fails for that model; finding stands alone (per-domain selection required) and must NOT contaminate the P1 verdict (confidence: genuinely uncertain — counter-evidence from FEPoID variability and SAPLMA layer shift)"
  - id: "P3"
    primary: false
    statement: "Adjacent-layer KL divergence carries detection signal complementary to entropy: a 2-parameter logistic fusion of best entropy-family signal and best KL signal exceeds the best single signal's test AUROC by >= 0.02 with paired bootstrap CI excluding zero, per model-dataset cell"
    test_method: "Logistic regression (2 coefficients) fit on selection split; paired bootstrap on test split; fusion explicitly labeled a trained component (quarantined from the training-free headline claim)"
    success_criterion: "Fusion gain >= 0.02 with CI excluding zero in a majority of the six cells"
    falsification: "Fusion gain indistinguishable from zero — turbulence (KL) is redundant with width (entropy); informative null, mechanism's two-facet reading weakened"
  - id: "P4"
    primary: false
    statement: "No-regression guard: on Mistral-7B and LLaMA-3-8B (the h-e1-passing architectures), the selected intermediate layer's AUROC is >= final-layer AUROC − 0.02 on each dataset"
    test_method: "Within-model comparison on locked test splits, same sweep"
    success_criterion: "Intermediate >= final − 0.02 on all four passing-model cells"
    falsification: "Depth-resolved pivot sacrifices an architecture that already worked — robustness claim rejected even if LLaMA-2 rescued (Exchange 10)"

