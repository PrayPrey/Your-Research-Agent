# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "First AUROC evaluation of raw logit-lens uncertainty statistics (per-layer entropy, max-prob, adjacent-layer KL) as training-free, single-pass hallucination-detection scores with per-model held-out layer selection; first cross-dataset layer-transfer measurement for hallucination detection; first controlled rescue test on an architecture with a documented final-layer failure baseline"
  key_innovation: "Reading uncertainty BEFORE final-layer calibration via per-model depth selection — turning the interpretability community's per-layer entropy instrument (Entropy-Lens) into a detection score, with the h-e1 failure record providing a unique falsification anchor no external work possesses"
  differentiation:
    - prior_work: "Entropy-Lens [Ali et al., 2025]"
      difference: "Computes the identical per-layer logit-lens entropy but as a computation signature (family/task/format fingerprinting) — never evaluated as hallucination-detection AUROC"
    - prior_work: "FEPoID [Wang et al., 2026]"
      difference: "Same task, but supervised MLP probing on hidden-state geometry with intrinsic-dimension layer selection; ours is training-free token-space scoring with label-efficient AUROC-based selection; FEPoID also reports no dataset→dataset transfer of a fixed selected layer"
    - prior_work: "Kim et al. 2025 [arXiv 2507.06722]"
      difference: "Tracked final-prediction-token probability trajectories (tuned lens, MCQ) and found alignment; we compute full-vocabulary distribution statistics on open QA — different measurement; their negative result bounds ours and is answered by scope"
    - prior_work: "SAPLMA [Azaria & Mitchell, 2023]"
      difference: "Supervised feedforward probe on raw activations; ours removes the trained probe entirely — the delta is supervision"
    - prior_work: "END / DoLa / SLED"
      difference: "Use cross-layer distribution shifts at DECODING time to improve generation; we use adjacent-layer KL as a detection-time score — untested cell"
    - prior_work: "h-e1 (own prior failure)"
      difference: "h-e1 read one scalar at the final layer; this reads three statistics at every layer with per-model selection — implements the failure record's own suggested modification"
    - prior_work: "HalluShift (arXiv 2504.09482)"
      difference: "Internal distribution-shift features, but per its abstract not per-layer logit-lens KL from a single greedy pass — formal novelty check scheduled in Phase 2B"

