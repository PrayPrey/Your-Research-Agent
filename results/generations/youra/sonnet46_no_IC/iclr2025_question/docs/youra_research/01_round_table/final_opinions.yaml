final_opinions:
  perspective_novelty:
    agent: "Dr. Nova"
    icon: "🔭"
    assessment: |
      Verdict: STRONG. The hypothesis occupies a verified empty cell: Entropy-Lens
      computes the exact feature but never for detection; FEPoID solves the task but
      with supervised probes and geometric selection; Kim 2025 tested a strictly
      narrower measurement (final-token trajectory) whose negative result is answered
      by scope, not ignored. The unresolved-candidate-competition mechanism, the
      adjacent-layer-KL "turbulence" signal, and the cross-dataset transfer matrix are
      each individually novel — together this is the experiment the h-e1 failure
      record was asking for.
    key_points:
      - "Empty cell verified against Entropy-Lens (feature without task) and FEPoID (task without this method)"
      - "Adjacent-layer KL as detection-time score is an untested signal family (END/DoLa are decoding-time)"
      - "Relative-depth band (40-80%) is a testable universality question, kept exploratory"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      Verdict: STRONG. All three predictions carry test methods, numeric success
      criteria, and explicit falsification conditions; the primary gate (CI-separated
      within-model improvement on LLaMA-2-7B) is inherited from the gate that killed
      h-e1, so the hypothesis cannot be talked past its own death condition.
      Selection-bias leaks (192 candidates, direction correction, degeneracy screen)
      are all confined to the selection split by protocol. Confidence 0.72 honestly
      prices P2's uncertainty.
    key_points:
      - "Kill condition explicit: all ΔAUROC CIs straddle zero on LLaMA-2 → Tier 1 fails → hypothesis dies"
      - "Direction correction estimated on selection split, frozen on test — post-hoc max(AUROC, 1-AUROC) on test prohibited"
      - "h-e1 baseline reproduction ±0.03 as mandatory protocol-validity anchor"

  perspective_significance:
    agent: "Dr. Sage"
    icon: "🎯"
    assessment: |
      Verdict: STRONG. The experiment adjudicates a live tension in the literature —
      whether the intermediate-layer hallucination signal survives into decoded
      token-space distributions or requires hidden-state geometry — and both gate
      outcomes are publishable. The zero-training, single-pass cost point is a
      genuinely different frontier position from supervised probing and multi-sample
      UQ, and the layer-transfer matrix is an unmeasured deployment-decisive quantity
      regardless of sign.
    key_points:
      - "Adjudicates token-space vs geometry as carrier of the intermediate-layer signal"
      - "Failure is informative: would exhaust single-pass token-space statistics and promote geometry/recall explanations"
      - "Transfer matrix decides deployable-constant vs per-domain-calibration — no published numbers exist"

  perspective_plausibility:
    agent: "Prof. Pax"
    icon: "⚙️"
    assessment: |
      Verdict: STRONG. No unproven step exists in the validity chain from forward pass
      to AUROC: extraction path is uniform across the three families, all numerical
      hazards have named guards, and the v1 archive provides an empirical existence
      proof (validated code, healthy run, 871/1000 cache). Residual risks are empirical
      (the signal may not exist on LLaMA-2) and edge-case (degeneracy screen may force
      the tuned-lens fallback), not fundamental. Non-triviality confirmed by the 0.0014
      h-e1 miss and Kim's alignment result.
    key_points:
      - "Degeneracy screen (1% of ln|V|, 5% top-1 agreement) mandatory, selection-split-only"
      - "Risk register: empirical signal absence > screen-rejects-llama2 (tuned-lens fallback) > TruthfulQA CI width"
      - "TriviaQA-anchored CI clauses correct given TruthfulQA n=817"

  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      Consensus hypothesis: under white-box single-greedy-pass inference on TriviaQA
      and TruthfulQA with LLaMA-2-7B, Mistral-7B-v0.1, and LLaMA-3-8B-Instruct,
