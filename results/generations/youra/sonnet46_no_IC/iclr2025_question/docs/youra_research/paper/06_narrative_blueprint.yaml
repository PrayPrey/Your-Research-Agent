# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress the full story into ~150 words — written LAST"
    key_message: >
      Training-free intermediate-layer uncertainty statistics detect hallucinations
      better than the final layer in every cell tested; AUROC baselines don't
      survive protocol changes.
    structure_notes: |
      - S1-2: architecture-fragility of final-layer signals + the training-free gap
      - S3: approach (per-layer logit-lens statistics, per-model selection)
      - S4-5: 6/6 existence grid 0.61-0.70, depth_beats_final 6/6, adj_kl novelty
      - S6: measurement-validity finding + scope honesty (selection-split PoC)
    avoid: ["Citations in abstract", "Vague claims without numbers", "Undefined acronyms", "Claiming test-split/held-out performance"]

  introduction:
    narrative_purpose: "Hook -> Problem -> Insight -> Preview"
    hook_strategy: "counterintuitive_finding + measurement_validity_subplot"
    problem_escalation: |
      1. Surface: cheap output-layer confidence signals are architecture-fragile
         (concrete: 0.66 llama3 vs ~0.52 inverted llama2, same statistic).
      2. Deeper: intermediate>final is consensus, but every exploit re-introduces
         supervision, geometry, or sampling.
      3. Gap: raw logit-lens uncertainty statistics never evaluated as detection
         scores; adjacent-layer KL never used at detection time.
    insight_preview: >
      Read uncertainty before final-layer calibration; select the readout layer per
      model. Preview 6/6 grid + depth_beats_final without over-numbering.
    contributions_framing: |
      Flow from insight, not a bulleted dump: (1) first AUROC evaluation of
      training-free per-layer lens statistics (6/6 cells separable); (2) universal
      point-estimate depth advantage; (3) adj_kl as detection signal; (4)
      protocol-internal validity anchoring (methodological). State the staged-
      verification scope honestly (selection-split PoC; test-split = future tier).
    transition_to_related_work: >
      "This sits at the junction of interpretability instruments and detection
      methods that have never been connected without supervision..."

  related_work:
    narrative_purpose: "Show existing work insufficient -> justify our approach"
    positioning_strategy: >
      Organize by what each line RE-INTRODUCES that we remove: probes (SAPLMA,
      FEPoID, CLAP, TriLens), sampling (Semantic Entropy, INSIDE), decoding-only
      use of cross-layer shift (DoLa, END, SLED), instrument-not-detector
      (Entropy-Lens, Tuned Lens). Address adversarial results head-on (Kim 2025
      trajectory alignment = different measurement; Chi 2025 recall shadow =
      scoped interpretation).
    key_comparison_points:
      - area: "Supervised intermediate-layer probing"
        limitation_to_highlight: "Requires labeled training data + per-model probe training"
        how_we_differ: "Training-free statistics; selection is label-efficient argmax, not a trained model"
      - area: "Multi-sample UQ"
        limitation_to_highlight: "10x inference cost"
        how_we_differ: "Single greedy pass, statistics are free byproducts"
      - area: "Cross-layer shift at decoding time (DoLa/END/SLED)"
        limitation_to_highlight: "Signal exploited only to steer generation, never scored for detection"
        how_we_differ: "First detection-time AUROC evaluation of adjacent-layer KL"
      - area: "Lens instruments (Entropy-Lens, Tuned Lens)"
        limitation_to_highlight: "Same statistics studied as computation signatures, never as detection scores"
        how_we_differ: "Same instrument, detection evaluation with per-model selection"
    papers_to_discuss:
      - "Belrose et al. 2023 (Tuned Lens, arXiv 2303.08112)"
      - "Ali et al. 2025 (Entropy-Lens, arXiv 2502.16570)"
      - "Wang et al. 2026 (FEPoID / Automatic Layer Selection, arXiv 2605.26366)"
      - "Azaria & Mitchell 2023 (SAPLMA, arXiv 2304.13734)"
      - "Chuang et al. 2023 (DoLa, arXiv 2309.03883)"
      - "Wu et al. 2025 (END, arXiv 2502.03199)"
      - "Zhang et al. 2024 (SLED, arXiv 2411.02433)"
      - "Kim et al. 2025 (trajectory alignment, arXiv 2507.06722)"
      - "Chi et al. 2025 (recall vs truthfulness, arXiv 2510.09033)"
      - "Farquhar et al. 2024 (Semantic Entropy, Nature)"
      - "Chen et al. 2024 (INSIDE, arXiv 2402.03744)"
      - "Kadavath et al. 2022 (arXiv 2207.05221)"
      - "Kossen et al. 2024 (Semantic Entropy Probes, arXiv 2406.15927)"
      - "Orgad et al. 2024 (LLMs Know More Than They Show)"
      - "Azaria & Mitchell / CLAP Suresh et al. 2025 (arXiv 2509.09700)"
      - "HalluShift (arXiv 2504.09482)"
      - "Su et al. 2024 (MIND, arXiv 2403.06448)"
    avoid: ["Survey-style listing", "Unfair dismissal of probes (they hit higher AUROC — supervised skyline)", "Ignoring Kim/Chi adversarial results"]

  methodology:
    narrative_purpose: "WHY this design solves the problem"
    connection_to_insight: >
      Every component operationalizes 'read before calibration': lens readout at
      every layer; three uncertainty facets (width: entropy/maxprob, revision:
      adj_kl); per-model selection because calibration depth is a model property;
      degeneracy screen because the raw lens is a biased instrument.
    key_design_decisions:
      - decision: "Raw logit lens (lm_head ∘ norm on each hidden state), no tuned translators"
        rationale: "Training-free claim integrity; LLaMA/Mistral lineage is the best-behaved raw-lens case"
        alternatives_considered: "Tuned lens (introduces trained components; kept as documented fallback if screen fails)"
      - decision: "Three signals: entropy, max-token probability, adjacent-layer KL"
        rationale: "Width vs revision facets of unresolved candidate competition; adj_kl is the untested cell"
        alternatives_considered: "Hidden-state geometry (supervised), single entropy (misses revision)"
      - decision: "Per-model (layer, signal, direction) selection on held-out selection split; test split locked"
        rationale: "Optimal layer/signal varies per model AND dataset (observed: signal winner differs in 4/6 cells)"
        alternatives_considered: "Fixed relative depth (contradicted by SAPLMA layer shift); all-layer ensembles (supervision creep)"
      - decision: "Degeneracy screen (entropy within 1% of ln|V| OR <5% top-1 agreement with final layer)"
        rationale: "Guards against lens artifacts scoring as signal; retained 20/15/15 layers"
        alternatives_considered: "No screen (risks scoring degenerate layers); tuned-lens fallback"
      - decision: "A2-v2 protocol-internal validity anchor (identity-verified cache reuse 10/10 + within-sweep final-layer baselines + descriptive-only cross-run direction reports)"
        rationale: "Cross-protocol numeric anchors are unsatisfiable by construction — demonstrated by the v1 forensics"
        alternatives_considered: "v1 cross-protocol numeric anchor (breached: Δ +0.0742, six protocol differences)"
    intuition_building: |
      entropy_heatmap_llama2.png (correct vs incorrect groups across layers) for
      the separation intuition; degeneracy_screen.png for instrument validity;
      anchor_v2_report.png for the validity protocol.
    technical_depth_balance: |
      Main text: lens path, signals, screen, selection discipline, anchor design
      rationale. Appendix-level detail (exact numerics guards, resume mechanics)
      compressed or footnoted.

  experiments:
    narrative_purpose: "Design tests for our specific claims"
    experimental_questions:
      - question: "EQ1: Does at least one screened intermediate (layer, signal) pair per model separate classes (AUROC >= 0.55) on both datasets?"
        experiment: "Full sweep: 3 models x 2 datasets x 32 layers x 3 signals, 5,451 scored generations; degeneracy screen; selection-split evaluation"
        expected_outcome: "Existence gate pass in all 6 cells (observed 0.6092-0.7011)"
      - question: "EQ2: Does the best screened intermediate layer beat the same sweep's final-layer entropy readout per cell?"
        experiment: "Within-sweep depth_beats_final comparison, per cell, point estimates"
        expected_outcome: "6/6 direction consistency (observed margins +0.0035 to +0.130)"
      - question: "EQ3: Is the evaluation protocol internally valid?"
        experiment: "A2-v2 anchor: 10/10 donor-cache identity verification before reuse; per-cell within-sweep baselines; v1-record direction consistency reported descriptively"
        expected_outcome: "All anchor clauses satisfied with zero spurious halts (vs v1's constructive unsatisfiability)"
    baseline_rationale: >
      Within-sweep final-layer entropy (and max-prob) — the SAME protocol, same
      pass, same labels — is the only valid comparison after the cross-protocol
      anchor forensics; supervised skylines (FEPoID) cited but not re-run
      (different resource class, Phase 5 skipped by config).
    dataset_rationale: >
      TriviaQA rc.nocontext (n=1000) + TruthfulQA generation (n=817): short-form QA
      with the documented final-layer failure lineage; label protocols differ
      (alias match vs similarity) — a deliberate robustness axis.
    metric_rationale: >
      Corrected AUROC (direction selected on selection split): threshold-free,
      comparable across cells; direction correction addresses the documented
      inversion failure mode.
    fairness_considerations: |
      Identical prompts/labels/decoding across all cells (v1-verbatim data.py);
      stratified 50/50 selection/test split, seed 42, test locked and untouched;
      all selection-sensitive operations confined to the selection split.

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: >
      6/6 existence grid (AUROC 0.6092-0.7011, gate 0.55) with depth_beats_final
      in every cell — Figure: gate_metrics_bar.png headline + auroc_heatmap.png.
    result_presentation_order:
      - result: "Existence grid (6/6 cells, selected tuples table)"
        purpose: "Main claim first — universal within scope"
      - result: "Depth advantage per cell, split by dataset (TriviaQA large, TruthfulQA thin)"
        purpose: "Mechanism direction + honest nuance (the +0.0035 cell flagged)"
      - result: "Signal-family analysis: adj_kl dominance at L31, layer localization L28-L31"
        purpose: "Most novel observation; sets up fusion future work"
      - result: "Anchor forensics: 0.5186 vs 0.5928, six protocol differences, 47-second halt"
        purpose: "Measurement-validity contribution; explains why baselines are within-sweep"
    surprising_result_handling: >
      Tuning-polarity reversal (llama3-instruct largest margin) reported
      descriptively with the revised sharpening hypothesis, explicitly unverified;
      TruthfulQA strong final layers presented with three live explanations.
    avoid: ["Presenting selection-split AUROC as held-out performance", "Hiding the +0.0035 margin", "Claiming statistical significance (no CIs computed)"]

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    key_findings_interpretation: >
      Existence premise confirmed universally at PoC scale; calibration-suppression
      mechanism directionally supported but not established (CI test never ran;
      severity-ordering sub-claim contradicted descriptively); protocol-sensitivity
      finding elevates measurement validity to a first-class result.
    honest_limitations:
      - limitation: "All AUROCs are selection-split values; locked test splits never evaluated"
        why_acceptable: "Staged EXISTENCE-tier design; every artifact for zero-GPU test-split follow-up exists"
        future_mitigation: "Freeze the six tuples (published), evaluate locked test splits with paired bootstrap — the original rescue claim"
      - limitation: "Single seed, no confidence intervals; thinnest margin +0.0035 is within noise"
        why_acceptable: "Gate margins on the binding quantity are large (+0.059 to +0.151); claim degrades gracefully (5/6 margins > 0.03)"
        future_mitigation: "Bootstrap CI machinery exists in analysis.py; zero-GPU"
      - limitation: "The original 'rescue from 0.5186 failure' framing is protocol-specific; current-protocol llama2 final layer is 0.59, not chance"
        why_acceptable: "Converted into the measurement-validity contribution; depth advantage stands on within-protocol comparisons"
        future_mitigation: "Factorial protocol-attribution study"
      - limitation: "Scope: three 7-8B families, two short-form QA datasets, greedy decoding, one instruct model; familiarity confound (A5) unaddressed"
        why_acceptable: "Standard PoC scoping; controlled lineage to the failure record was deliberate"
        future_mitigation: "Base-vs-instruct pairs; frequency-stratified AUROC diagnostic"
    broader_impact_statement: >
      Better cheap hallucination detection lowers deployment risk for open-weight
      LLMs; scores are uncertainty correlates under standard labels, not
      truth oracles — overtrust is the primary misuse risk.

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: >
      Close the loop on both hook threads: (1) every model scored its own
      hallucinations better from the middle of the stack than from its mouth;
      (2) the baseline we set out to beat dissolved under provenance audit — and
      the replacement protocol-internal anchor is itself a contribution.
    memorable_ending: >
      The output layer is where the model speaks; it is not the best place to
      listen.
    future_work_vision: >
      Zero-GPU completion of the staged program (test-split rescue, transfer,
      fusion, CIs) from the published caches; base-vs-instruct calibration-polarity
      study; protocol-attribution reproducibility follow-up.

