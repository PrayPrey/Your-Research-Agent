# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: >
      In every model and dataset we tested, the model's intermediate layers scored
      its own hallucinations better than its output layer did — using nothing but
      the uncertainty statistics of the distributions the model already computes on
      the way to its answer. And the "documented failure" baseline this study set
      out to beat turned out to be an artifact of someone else's evaluation
      protocol: six protocol differences moved the same cell's AUROC from 0.5186 to
      0.5928 before a single new claim was tested.
    strategy: "counterintuitive_finding + measurement_validity_subplot"

  why_reader_should_care:
    main_reason: >
      Hallucination detection that needs no trained probe, no repeated sampling,
      and no extra inference cost — the per-layer signals are free byproducts of a
      single greedy pass — would make white-box uncertainty quantification
      deployable wherever open-weight LLMs run.
    concrete_example: >
      Final-layer entropy, the cheapest standard signal, is architecture-fragile: a
      prior run in this program measured AUROC 0.66 on LLaMA-3-8B-Instruct but
      ~0.52 with inverted direction on base LLaMA-2-7B — the same statistic, the
      same datasets. Practitioners cannot rely on a signal whose validity flips
      with the checkpoint.
    stakes: >
      Without architecture-robust, training-free signals, deployments either pay
      10x inference for multi-sample methods, train per-model supervised probes, or
      ship confidence scores that silently fail on some model families.

  real_world_impact:
    application_domain: "Open-weight LLM deployment; QA and factual generation monitoring"
    potential_beneficiaries: "Practitioners running white-box LLMs; UQ and interpretability researchers"
    scale_of_impact: >
      Any system with hidden-state access; zero additional forward passes, so the
      method scales with existing serving cost.

problem_framing:
  surface_problem:
    description: >
      LLMs hallucinate, and the cheap detection signals — output-layer confidence
      statistics — are unreliable across architectures.
    common_understanding: >
      Papers typically frame this as "confidence is miscalibrated" and reach for
      multi-sample semantic consistency (10x cost) or supervised hidden-state
      probes (labels + training per model).

  deeper_problem:
    description: >
      The field has converged on the premise that intermediate layers carry
      stronger truthfulness signal than the final layer, yet every method that
      exploits it re-introduces supervision (probes), geometric machinery over
      hidden states, or multi-sample generation. The obvious training-free
      candidate — the raw logit-lens uncertainty statistics of each layer's decoded
      distribution — has never been evaluated as a detection score.
    why_overlooked: >
      Logit-lens entropy was developed as an interpretability instrument
      (computation signatures), not a detector; the nearest published measurement
      (final-prediction-token trajectories, Kim et al. 2025) found certain and
      uncertain trajectories aligned, which discouraged the depth-resolved route
      without actually testing full-distribution statistics.
    our_perspective: >
      The final layer is not where the information dies — it is where output
      calibration (tokenizer- and tuning-dependent) reshapes it. Read the
      uncertainty BEFORE that calibration stage, selecting the readout layer per
      model, and the separation is still there in token space.

  gap_in_existing_work:
    description: >
      No training-free, single-pass evaluation of raw per-layer logit-lens
      uncertainty statistics (entropy, max-prob, adjacent-layer KL) as
      hallucination-detection AUROC scores with per-model layer selection; and
      adjacent-layer KL divergence had never been used as a detection-time score at
      all (only to steer decoding, DoLa-style).
    why_gap_exists: >
      Community split: interpretability owns the instrument (lens) but doesn't
      evaluate detection; detection owns the task but defaults to probes and
      sampling. The rescue-style controlled test additionally requires a documented
      final-layer failure baseline, which no external group possesses.
    why_gap_matters: >
      If the signal exists raw in token space, the trained probe is unnecessary for
      signal existence — changing the recipe for white-box UQ and the
      interpretation of what probes add.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: >
      Hallucination-predictive uncertainty is present and class-separable in the
      token-space readout of intermediate layers (L28–L31) in every model × dataset
      cell tested, and always exceeds the final layer's own entropy readout —
      without training any probe.
    expanded_explanation: >
      For factual answers, next-token candidate competition resolves at
      intermediate depth; for hallucinated answers it stays unresolved — wider
      decoded distributions, contested leaders, persistent inter-layer belief
      revision. Final-layer output calibration partially attenuates this
      separation, so per-model selection of an intermediate readout layer recovers
      signal the output layer weakens. A second insight emerged the hard way:
      AUROC magnitudes for weak signals are not portable across evaluation
      protocols — validity anchors must be protocol-internal.

  why_others_missed_it:
    common_assumptions: >
      (a) Useful intermediate-layer signal requires a trained probe or hidden-state
      geometry; (b) layer-wise trajectory measurements had already come up empty
      (Kim et al. 2025); (c) cross-run numeric baselines are reusable as anchors.
    our_different_view: >
      Full-vocabulary distribution statistics are a different measurement from
      single-token probability trajectories; the scope boundary between the two is
      load-bearing. And the h-e1 failure record pointed directly at final-layer
      calibration as the confound to bypass.
    enabling_factor: >
      A documented final-layer failure on base LLaMA-2-7B from a prior run in this
      program — a controlled falsification anchor no external work possesses — plus
      a degeneracy screen that makes the raw lens usable without tuned translators.

  what_makes_it_work:
    intuitive_explanation: >
      Watch the model make up its mind layer by layer: when it knows the answer,
      the candidate set collapses early and stays collapsed; when it is
      hallucinating, the distribution stays wide and keeps churning until the
      output head tidies it up. Reading the statistics one stop before the terminus
      preserves the difference.
    key_mechanism: >
      Per-layer logit-lens decoding (lm_head ∘ norm applied to each hidden state)
      from one greedy pass; three statistics per layer (Shannon entropy, max-token
      probability, adjacent-layer KL), averaged over answer tokens; degeneracy
      screen; (layer, signal, direction) selected per model on a held-out
      selection split.
    analogy: >
      Election-night forecasting: the final published tally is calibrated for
      presentation; the county-by-county returns an hour earlier carry the
      uncertainty structure. We read the returns, not the press release.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: >
      Training-free per-layer logit-lens uncertainty statistics are class-separable
      hallucination scores at intermediate depth in all six model × dataset cells
      (selection-split corrected AUROC 0.6092–0.7011), and the best screened
      intermediate layer beats the same sweep's final-layer entropy readout in
      every cell (point-estimate margins +0.0035 to +0.130).
    measurable_criteria: >
      Gate: >= 1 screened (layer, signal) pair per model with corrected AUROC >=
      0.55 on both datasets (observed margin over gate +0.059 to +0.151);
      depth_beats_final direction check per cell; 5,451 real scored generations,
      37/37 tests, REAL_MODEL verification.

  supporting_evidence:
    - id: "evidence_1"
      what: >
        The 6/6 existence grid: llama2/triviaqa L31 adj_kl 0.6522; llama2/truthfulqa
        L29 entropy 0.7011; mistral/triviaqa L31 maxprob 0.6092; mistral/truthfulqa
        L31 adj_kl 0.6570; llama3/triviaqa L28 entropy 0.6868; llama3/truthfulqa
        L31 maxprob 0.6213 — informative layers concentrated at L28–L31.
      so_what: >
        The signal exists everywhere tested, not in cherry-picked cells — the
        intermediate>final consensus holds for training-free token-space statistics.
      how_it_supports_claim: "Directly instantiates the existence clause of the main claim in every cell."
    - id: "evidence_2"
      what: >
        depth_beats_final 6/6: TriviaQA margins +0.059/+0.064/+0.130 vs TruthfulQA
        +0.034/+0.052/+0.0035; TruthfulQA final layers already strong (0.60–0.67).
      so_what: >
        The depth advantage is universal in direction but dataset-dependent in
        size — a nuance that preempts over-generalization and motivates transfer
        experiments.
      how_it_supports_claim: "Supports the calibration-suppression direction (consistent with, not established)."
    - id: "evidence_3"
      what: >
        Adjacent-layer KL — previously a decoding heuristic (DoLa lineage) — is the
        best signal in 3/6 cells; top-3 llama2/triviaqa intermediates are all
        adj_kl (L31 0.6522, L17 0.6145, L30 0.6062).
      so_what: >
        Inter-layer belief revision is a first-class detection signal — the paper's
        most novel single observation.
      how_it_supports_claim: "Shows the signal family is broader than entropy; upgrades cross-layer shift to detection."
    - id: "evidence_4"
      what: >
        Anchor forensics: the v1-recorded 0.5186 final-layer baseline measured
        0.5928/0.5739 under the current protocol; provenance audit found six
        protocol differences; a designed halt gate stopped a doomed ~2.5 h campaign
        in 47 seconds.
      so_what: >
        Quantified, attributable demonstration that AUROC magnitudes for weak
        signals are protocol-bound — direction transfers, magnitude does not — and
        that cheap validity gates pay for themselves.
      how_it_supports_claim: "Grounds the measurement-validity contribution and the A2-v2 protocol-internal anchor design."

  surprising_findings:
    finding: >
      The depth advantage does NOT track tuning status as predicted: the largest
      TriviaQA margin (+0.130) is on RLHF-tuned LLaMA-3-8B-Instruct — the model
      predicted to need depth least — reversing the hypothesized severity ordering.
    why_surprising: >
      The Phase 2A mechanism predicted base LLaMA-2 would be worst-suppressed and
      gain most from depth readout.
    our_interpretation: >
      Unverified hypothesis: instruct tuning SHARPENS final-layer calibration,
      strengthening suppression — still a calibration story, opposite tuning
      polarity. Reported descriptively only (single instruct model, R3 confound).

  what_results_mean:
    synthesis: >
      At PoC scale, the existence premise of depth-resolved training-free
      hallucination detection is confirmed universally within scope; the
      deployable-detector claims (test-split AUROC >= 0.60, CI-separated rescue,
      transfer, fusion) remain explicitly unmeasured because the dependent
      hypotheses never executed.
    confidence_level: >
      HIGH for existence (full-scale real run, gate margins +0.059 to +0.151);
      MEDIUM for depth advantage (point estimates, one margin +0.0035 within
      noise); the mechanism is directionally supported, not established.
    caveats: >
      Selection-split-only evidence; single seed; no CIs; three 7–8B families, two
      short-form QA datasets, greedy decoding; familiarity-vs-truthfulness
      confound unaddressed (A5).

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: >
      First evidence that raw logit-lens per-layer uncertainty statistics — with no
      trained probe, no sampling, one greedy pass — are class-separable
      hallucination scores that beat the model's own final-layer readout in every
      model × dataset cell tested, plus a reusable protocol-internal validity-anchor
      design born from a quantified cross-protocol baseline failure.
    why_significant: >
      Removes the trained probe from the intermediate-layer detection recipe
      (the delta to SAPLMA/FEPoID/TriLens is supervision) and turns a
      reproducibility failure into a methodological contribution.

  implications:
    for_field: >
      Intermediate>final consensus extended to training-free token-space readouts;
      adjacent-layer KL promoted from decoding heuristic to detection statistic;
      cross-protocol numeric anchors shown invalid by construction.
    for_practice: >
      Zero-extra-inference-cost signal for white-box deployments; auditable,
      resumable, cheap protocol (binding cell reproduced with zero GPU via
      verified cache reuse).
    conceptual_contribution: >
      "Read before calibration": the output layer is a presentation surface, not
      the best measurement surface.

  future_possibilities:
    immediate_extensions: >
      The single highest-value next step is zero-GPU: freeze the six selected
      tuples and evaluate the locked test splits with paired bootstrap — this IS
      the original rescue claim (h-m1/h-m2). Also zero-GPU: transfer matrix
      (h-c1), KL-entropy fusion (h-m3), CIs on the existence grid.
    longer_term_vision: >
      Base-vs-instruct pairs of one family to test the reversed tuning-polarity
      hypothesis; third dataset with exact-match labels; factorial protocol
      attribution of the 0.5186→0.5928 shift as a standalone reproducibility study.
    open_questions: >
      Does selection survive frozen test evaluation (A4)? Is adj_kl complementary
      to entropy or a calibration-step meter? Does the signal reflect truthfulness
      or familiarity (A5)?

