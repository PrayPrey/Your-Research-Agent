gap_id: "GAP-001"
gap_title: "No training-free, single-pass evaluation of raw logit-lens uncertainty statistics (entropy / max-prob) as per-layer hallucination-detection AUROC scores"
gap_description: >
  AUROC evaluation of raw logit-lens entropy and max-token-probability computed at
  EVERY layer from one greedy pass, with the informative layer selected per-model on
  a held-out split — on TriviaQA/TruthfulQA across LLaMA-2-7B, Mistral-7B, LLaMA-3-8B.
  Integrates Gap 2 (cross-dataset layer transfer, cross-family depth consistency) and
  Gap 3 (adjacent-layer KL detection signal + LLaMA-2 rescue stress test).
papers_folder: "docs/youra_research/papers/"
