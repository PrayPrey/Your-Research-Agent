gap_id: "gap-1"
gap_title: "Causal Attribution of Curation Choices to Benchmark Outcomes Is Unestablished"
gap_description: |
  Individual curation methods (ProX, SoftDedup, REWIRE, WebOrganizer, CoLoR-Filter, DataMan) each
  demonstrate isolated downstream improvements on their own axis of curation variation, but no study
  jointly controls for model size, architecture, and training compute budget while varying exactly one
  curation dimension at a time. Pythia and OLMo provide the controlled platforms but have not been
  used for this multi-axis ablation.
