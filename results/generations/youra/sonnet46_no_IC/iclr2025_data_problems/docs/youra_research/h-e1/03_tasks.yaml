      logic: "03_logic.md"
      config: "03_config.md"

  # ── SUBTASKS from A-2 Corpus Curation (priority 49–2) ───────────────────────
  - id: "L-2-1"
    epic: "Corpus Curation"
    title: "[Subtask] PPL scoring with batched GPT-2 inference"
    description: |
      Implement score_and_filter_ppl() in curate.py:
      - Per-document GPT-2 forward pass (avoids padding bias).
      - Streaming iteration over HF IterableDataset.
      - Batch tokenization (batch_size=64), truncate to max_length=1024.
      - Retain doc if exp(loss) <= ppl_threshold.
      - Write retained docs to JSONL, return {retained, total, output_path}.
      Memory safety: stream one doc at a time; never materialize full corpus.
    feature_tag: "data-pipeline"
    priority: 49
