    epic: "Config + Orchestrator"
    title: "Implement config.py and orchestrate.py"
    description: |
      Implement code/config.py: ExperimentConfig dataclass with all hyperparameters,
      paths, and factorial design axes. Single CONFIG = ExperimentConfig() singleton.

      Implement code/orchestrate.py: top-level pipeline runner with stage selection
      (curate/preprocess/train/evaluate/analyze/visualize/all) and resume support
