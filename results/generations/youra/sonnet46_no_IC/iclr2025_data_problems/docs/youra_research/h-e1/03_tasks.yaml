  - id: "A-2"
    epic: "Corpus Curation"
    title: "Implement corpus curation pipeline (curate.py)"
    description: |
      Implement code/curate.py with full corpus curation pipeline:
      - score_and_filter_ppl(): GPT-2 PPL scoring (per-doc, streaming, batch_size=64)
        Retain docs with PPL <= tau. tau in {20, 35, 50}.
      - apply_minhash_dedup(): NeMo-Curator FuzzyDuplicates.
        J=0.7 -> num_buckets=20; J=0.9 -> num_buckets=8; both hashes_per_bucket=13.
      - curate_all_variants(): orchestrate 6 variants per corpus (3 PPL x 2 dedup).
        Idempotent via _SUCCESS flag. Produces 12 JSONL dirs total.
      - get_corpus_stream(): returns HF streaming dataset for dolma or fineweb.
      - log_corpus_stats(): write token counts and CR to corpus_stats.csv.
    feature_tag: "data-pipeline"
    priority: 90
    source_document: "03_architecture.md"
    complexity: 17
    reference_files:
      architecture: "03_architecture.md"
      logic: "03_logic.md"
      config: "03_config.md"

  - id: "A-3"
    epic: "Preprocessing"
    title: "Implement preprocessing pipeline (preprocess.py)"
    description: |
      Implement code/preprocess.py:
      - convert_to_neox_binary(): call tools/preprocess_data.py via subprocess.
        Converts JSONL to NeoX .bin/.idx memory-mapped format.
        Tokenizer: 20B_tokenizer.json (NeoX tokenizer).
      - run_decontaminator(): run llm-decontaminator against MMLU + HellaSwag test sets.
        Returns contamination_rate (CR) for ANCOVA covariate.
      - preprocess_all_variants(): process all 12 variants, adding binary_prefix
        and contamination_rate to each variant_metadata dict.
      Apply 95/2.5/2.5 train/val/test split during preprocessing.
    feature_tag: "data-pipeline"
    priority: 85
    source_document: "03_architecture.md"
    complexity: 13
    reference_files:
      architecture: "03_architecture.md"
      logic: "03_logic.md"
      config: "03_config.md"

  - id: "A-4"
    epic: "Training"
    title: "Implement GPT-NeoX training launcher (train.py)"
    description: |
      Implement code/train.py:
      - build_neox_config(): merge per-run overrides into base Pythia YAML.
        Overrides: data_path, seed, save/load paths, train_iters=25000,
        checkpoint_factor=2500 (every 5B tokens), FP16, DeepSpeed ZeRO-1.
        Scale-specific: 70M (6L, d=512, h=8, lr=1e-3) or 160M (12L, d=768, h=12, lr=6e-4).
      - launch_neox_run(): run `python deepy.py train.py <config>` as subprocess.
      - run_all_training(): 12 variants x 2 scales x 3 seeds = 72 runs.
        Sequential with state file resume. Skip done runs.
      - list_checkpoints(): discover global_stepXXXXX dirs, auto-convert to HF format.
      - convert_checkpoint_to_hf(): call tools/convert_to_hf.py via subprocess.
      State tracking: atomic JSON writes via os.replace, crash detection.
    feature_tag: "training"
    priority: 80
    source_document: "03_architecture.md"
    complexity: 16
    reference_files:
      architecture: "03_architecture.md"
      logic: "03_logic.md"
      config: "03_config.md"

  - id: "A-5"
    epic: "Evaluation"
    title: "Implement batch evaluation runner (evaluate.py)"
    description: |
      Implement code/evaluate.py:
      - run_lm_eval(): run lm-evaluation-harness via subprocess for one checkpoint.
        Tasks: mmlu (4-shot) + hellaswag (0-shot via task config).
        Full standard test sets: MMLU 14,042 examples; HellaSwag 10,042 examples.
        CLI: lm-eval --model hf --model_args pretrained=PATH --tasks mmlu,hellaswag
             --num_fewshot 4 --batch_size auto --output_path OUTPUT
      - parse_lm_eval_output(): parse JSON results, extract mmlu_4shot + hellaswag_0shot.
      - evaluate_all_checkpoints(): batch 720 evaluations (72 runs x 10 checkpoints each).
      - save_results(): write results_df to CSV + Parquet.
        Columns: scale, ppl_threshold, dedup_j, corpus, seed, checkpoint_step,
                 mmlu_4shot, hellaswag_0shot, contamination_rate.
    feature_tag: "evaluation"
    priority: 75
    source_document: "03_architecture.md"
    complexity: 14
    reference_files:
      architecture: "03_architecture.md"
      logic: "03_logic.md"
      config: "03_config.md"

  - id: "A-6"
    epic: "Analysis + Gate"
    title: "Implement statistical analysis and gate check (analyze.py)"
    description: |
      Implement code/analyze.py:
      - load_results(): load results.csv into DataFrame.
      - compute_partial_eta2(): compute partial eta-squared from ANOVA table.
      - run_ancova_interaction(): OLS with formula
        "mmlu_4shot ~ C(scale) * C(ppl_threshold) + contamination_rate"
        Returns interaction_p, interaction_eta2, anova_table.
      - check_direction(): compute tau*(70M) and tau*(160M) via argmax.
        direction_confirmed = tau*(70M) < tau*(160M).
      - run_secondary_analyses(): Levene's test + Scale x Dedup ANOVA + post-hoc.
      - gate_check(): MUST_WORK gate: p<0.05 AND eta2>=0.15 AND direction_confirmed.
      - run_full_analysis(): top-level function, prints gate result.
      Failure handling: if CR covariate absorbs >50% variance, pivot to HellaSwag DV.
    feature_tag: "experiment"
    priority: 70
    source_document: "03_architecture.md"
    complexity: 12
    reference_files:
      architecture: "03_architecture.md"
      logic: "03_logic.md"
      config: "03_config.md"

  - id: "A-7"
    epic: "Visualization"
    title: "Implement visualization (visualize.py)"
    description: |
      Implement code/visualize.py with all required figures:
      1. plot_bar_factorial(): MMLU + HellaSwag by Scale x PPL-threshold (2x3, error bars).
      2. plot_interaction(): line plot score vs tau, separate lines per scale.
      3. plot_dedup_interaction(): dedup effect (J=0.7 vs J=0.9) by scale.
      4. plot_fineweb_replication(): side-by-side Dolma vs FineWeb interaction panels.
      5. plot_corpus_size_heatmap(): token count per filter condition.
      6. plot_contamination_table(): CR(condition) per corpus variant.
      generate_all_figures(): top-level, saves all 6 figures to figures/ dir.
