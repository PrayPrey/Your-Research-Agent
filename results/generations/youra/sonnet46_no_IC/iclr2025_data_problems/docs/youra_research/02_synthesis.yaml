experimental_scope:
  models:
    - "Pythia-architecture 70M (trained from scratch)"
    - "Pythia-architecture 160M (trained from scratch)"
  datasets:
    - "Dolma v1.7 (primary; allenai/dolma)"
    - "FineWeb (replication; HuggingFaceFW/fineweb)"
  baselines:
    - "Raw Dolma (no filtering)"
    - "Standard practice (τ=35, J=0.9)"
    - "Aggressive filtering (τ=20, J=0.7)"

measurement_plan:
  data_collection:
    - source: "NeMo-Curator: apply PPL filtering (τ ∈ {20, 35, 50}) and MinHash dedup (J ∈ {0.7, 0.9}) to Dolma v1.7; 6 filtered corpus variants per corpus"
    - source: "Train 24 models (2 scales × 3 PPL × 2 dedup × 2 corpora = 24) from scratch using GPT-NeoX training code; 3 seeds each = 72 total training runs"
    - source: "Evaluate each model at 10 checkpoints (every 5B tokens out of 50B) using lm-evaluation-harness (MMLU 4-shot, HellaSwag 0-shot)"
    - source: "Run lm-sys/llm-decontaminator on each filtered corpus against MMLU and HellaSwag test sets; record CR(condition)"
  procedure:
    - step: "1. Prepare corpora: run NeMo-Curator on Dolma v1.7 with 6 filter configurations (3 PPL × 2 dedup); record corpus size and contamination rate per condition"
    - step: "2. Train models: launch 24 training jobs (2 scales × 6 filter conditions × 2 corpora) with 3 seeds each; save checkpoints at every 5B tokens"
    - step: "3. Evaluate checkpoints: run lm-evaluation-harness on all 10 × 72 = 720 checkpoint evaluations (MMLU + HellaSwag)"
    - step: "4. Fit learning curves: for each of 72 training runs, fit B(T) = A - C·exp(-λT) to the 10 evaluation points; extract λ and asymptote A"
    - step: "5. Statistical analysis: run pre-registered ANOVA tests (P1–P4) with contamination rate as ANCOVA covariate; compute partial η² for all interaction terms"
    - step: "6. Replication check: compare P1 and P3 results between Dolma and FineWeb; flag corpus-specific findings"
  success_criteria:
    - "P1 confirmed: Scale × PPL interaction p < 0.05, partial η² ≥ 0.15, τ*(70M) < τ*(160M)"
    - "P2 confirmed: Levene's test p < 0.05, Var(70M) > Var(160M)"
    - "P3 confirmed: Scale × Dedup interaction p < 0.05, sign change confirmed, pre-condition met"
    - "P4 confirmed: Scale × PPL interaction on λ p < 0.05, λ(70M, τ=20) > λ(160M, τ=20)"
    - "At least 2 of 4 predictions confirmed for publishable contribution"

validation:
  internal_validity:
    - "Contamination ANCOVA: all ANOVAs include contamination rate as covariate; results must survive adjustment"
    - "3 independent seeds per condition: report mean ± std; use seed as random effect in mixed model"
    - "Separate analysis of MMLU and HellaSwag: no benchmark averaging that could mask task-type interactions"
    - "Pre-registration: all predictions, tests, and directional hypotheses pre-registered on OSF before data collection"
  external_validity:
    - "FineWeb replication: P1 and P3 must hold on both Dolma and FineWeb for universal claim; corpus-specific finding otherwise"
    - "1B extrapolation: use Na et al. (2024) modular merging approximation to estimate interaction direction at 1B scale"
    - "OLMo architecture replication (conditional on compute availability): verify interaction holds for different architecture family"

discussion_synthesis:
  key_insights:
    - "PPL/ICL misalignment (DataMan) is the key motivating finding — it implies perplexity-optimal data is not ICL-optimal, and this gap may be scale-dependent"
    - "SoftDedup's finding that near-duplicate DOWN-WEIGHTING outperforms hard removal for few-shot performance directly supports P3's mechanism (near-duplicates carry ICL signal)"
    - "WebOrganizer's domain mixing being super-additive with quality filtering suggests domain diversity and quality filtering address orthogonal distributional properties — relevant to why large models (which need diversity) may prefer looser quality filtering"
    - "Na et al.'s modular approximation is a practical methodological bridge between tractable small-scale experiments and practically relevant large-scale predictions"
  breakthrough_moments:
    - "Exchange 5 (Dr. Ally): First consolidated H-CurationScale-v1 hypothesis with Under-If-Then-Because structure"
    - "Exchange 7 (Dr. Nova): P2 (benchmark variance) and P3 (opposite sign for dedup) — two entirely novel predictions beyond what the original gap framing suggested"
    - "Exchange 13 (Dr. Nova): Data efficiency reframing (tokens-to-peak / learning curve λ) — dissolves the token budget equalization problem and adds P4 as novel outcome"
    - "Exchange 14 (Prof. Vera): Log-linear learning curve formalization with pre-registered statistical test for P4 — makes the efficiency claim quantitatively precise"
  resolved_tensions:
    - "Token budget equalization (Exch 4 concern → Exch 13 resolution): resolved by tokens-to-peak framing; tokens-seen recorded as ANCOVA covariate"
    - "Monotonicity vs. scale-dependence (Exch 6 concern → Exch 7 resolution): reframed as directional prediction (τ*(70M) < τ*(160M)) without requiring strict monotonicity across all scales"
    - "Epoch memorization at small scale (Exch 12 concern → Exch 13 resolution): resolved by learning curve analysis (train to 50B, fit curve, extract λ — no epoch truncation needed)"
    - "Corpus generalizability (Exch 6 concern → Exch 11 resolution): FineWeb added as replication corpus; corpus-specificity pre-specified as acceptable secondary finding"
