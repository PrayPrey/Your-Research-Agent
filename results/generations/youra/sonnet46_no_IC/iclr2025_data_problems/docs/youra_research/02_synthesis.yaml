hypothesis_draft:
  title: "Scale-Dependent Optimal Curation: Perplexity Filtering and Deduplication Aggressiveness Have Opposite Scale Interactions in Pre-training"
  hypothesis_id: "H-CurationScale-v1"
  core_claim: |
    The optimal pre-training data curation configuration (perplexity filtering threshold and
    deduplication aggressiveness) is not universal but scale-dependent. Smaller models (70M)
    achieve peak benchmark performance with aggressive quality filtering (low PPL threshold)
    and strict deduplication. Larger models (160M+) achieve peak performance with moderate
    quality filtering (higher PPL threshold, allowing more distributional diversity) and loose
    deduplication (preserving near-duplicate patterns that support in-context learning). This
    produces measurable Scale × Curation interaction effects in a controlled factorial experiment
    on fully open pre-training corpora (Dolma, FineWeb) evaluated on standard benchmarks
    (MMLU, HellaSwag).
  mechanism: |
    Smaller models have lower representation capacity and cannot efficiently extract learning
    signal from high-diversity, high-variance token distributions. They require cleaner,
    more predictable data (aggressive PPL filtering) and benefit from deduplication that
    reduces distribution variance. Larger models have sufficient capacity to exploit
    distributional diversity and leverage near-duplicate frequency patterns for in-context
    learning (per Bayesian ICL theory, Xie et al. 2022). Removing these patterns via
    aggressive deduplication disproportionately hurts large models. Additionally, aggressive
    filtering reduces the effective dataset size and thus data efficiency (tokens-to-peak)
    at large scale, where diversity is valued over quality.
  predictions:
    - P1: "Optimal PPL threshold τ*(70M) ∈ [20,35] < τ*(160M) ∈ [35,50]; significant Scale × PPL interaction in 2-way ANOVA (p < 0.05, partial η² ≥ 0.15)"
    - P2: "Benchmark score variance across PPL conditions: Var(70M) > Var(160M); Levene's test p < 0.05"
    - P3: "Sign of (B(strict dedup) - B(loose dedup)) is positive at 70M, non-positive at 160M; significant Scale × Dedup interaction (p < 0.05)"
    - P4: "Convergence rate λ from log-linear learning curve is higher at (70M, τ=20) than at (160M, τ=20); significant Scale × PPL interaction on λ (p < 0.05)"

variables_summary:
  independent: "PPL filtering threshold τ ∈ {20, 35, 50} × Dedup aggressiveness d ∈ {strict J=0.7, loose J=0.9} × Model scale ∈ {70M, 160M} × Corpus ∈ {Dolma, FineWeb}"
  dependent_primary: "MMLU 4-shot accuracy (primary); HellaSwag 0-shot accuracy; learning curve convergence rate λ"
  controlled: "Architecture (Pythia-style), optimizer (AdamW), token budget (tokens-seen fixed), random seeds (3 per condition), contamination rate (ANCOVA covariate)"

null_hypothesis:
  h0_statement: |
    There is no significant interaction between model scale (70M vs. 160M) and curation
    configuration (PPL threshold or dedup aggressiveness) on downstream benchmark scores
    (MMLU + HellaSwag). The optimal curation recipe is scale-invariant.
  statistical_test: "2-way mixed ANOVA interaction term for Scale × Curation; Levene's test for P2; pre-registered directional predictions for all"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled factorial measurement of Scale × Curation interaction effects in pre-training; scale-aware curation recipe; potential first data-quality scaling law via learning curve analysis"
  differentiation_summary: |
    All prior curation ablation papers (ProX, REWIRE, DataMan, WebOrganizer, SoftDedup) operate
    at a single model scale and vary one curation axis at a time without factorial design. The
    scale × curation interaction is untested. DataComp (vision) runs multi-condition ablations
    but at fixed scale. The learning curve analysis (P4) introduces a novel efficiency outcome
    variable (convergence rate λ) that has not been used in pre-training curation literature.
    If P3 holds (dedup hurts large models), it challenges universal dedup practice adopted
    industry-wide since 2021.

