# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CurationScale-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under fixed model architecture family (Pythia-style, trained from scratch) and fixed
    tokens-seen budget on open corpora (Dolma, FineWeb replication), if we independently
    vary perplexity filtering threshold τ ∈ {20, 35, 50} and deduplication aggressiveness
    d ∈ {strict: MinHash Jaccard=0.7, loose: MinHash Jaccard=0.9}, then downstream benchmark
    scores (MMLU 4-shot + HellaSwag 0-shot) will show significant Scale × Curation interaction
    effects — specifically: smaller models (70M) achieve peak performance at lower PPL thresholds
    and benefit from aggressive deduplication, while larger models (160M+) achieve peak performance
    at higher PPL thresholds and are harmed by aggressive deduplication — because smaller models
    lack sufficient capacity to extract signal from high-diversity noisier distributions (requiring
    stronger quality filtering), while larger models rely on near-duplicate pattern frequency for
    in-context learning ability (which aggressive deduplication removes).
  alternative_hypothesis_h0: |
    There is no significant interaction between model scale and curation configuration on
    downstream benchmark scores — the optimal curation recipe (PPL threshold and dedup
    aggressiveness) is scale-invariant.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Perplexity filtering threshold (τ)"
      type: "categorical"
      operationalization: "GPT-2 reference model PPL score; documents with PPL > τ removed from corpus"
      levels: [20, 35, 50]
    - name: "Deduplication aggressiveness (d)"
      type: "categorical"
      operationalization: "MinHash near-deduplication Jaccard similarity threshold; documents with Jaccard > d to any other document removed"
      levels: ["strict (J=0.7)", "loose (J=0.9)"]
    - name: "Model scale (N)"
      type: "categorical"
      operationalization: "Number of trainable parameters in Pythia-architecture model"
      levels: ["70M", "160M"]
    - name: "Training corpus"
      type: "categorical"
      operationalization: "Open pre-training corpus used; same filtering applied to each"
      levels: ["Dolma", "FineWeb"]
  dependent:
    - name: "MMLU 4-shot accuracy"
      type: "continuous"
      operationalization: "Average accuracy across 57 MMLU tasks (4-shot prompting), range 0-1"
      primary: true
    - name: "HellaSwag 0-shot accuracy"
      type: "continuous"
      operationalization: "Accuracy on HellaSwag completion task (0-shot), range 0-1"
      primary: false
    - name: "Data efficiency (λ)"
      type: "continuous"
      operationalization: "Convergence rate from log-linear learning curve fit B(T) = A - C·exp(-λT); larger λ = faster convergence"
      primary: false
  controlled:
    - name: "Model architecture"
      operationalization: "Pythia transformer architecture; same hyperparameters across all runs"
    - name: "Training tokens-seen budget"
      operationalization: "Fixed at minimum filtered corpus size across all conditions; tokens-seen recorded as ANCOVA covariate where it varies"
    - name: "Optimizer and training hyperparameters"
      operationalization: "AdamW, lr=1e-3, cosine decay, batch size=2M tokens; identical across all runs"
    - name: "Benchmark contamination rate"
      operationalization: "Measured per condition using lm-sys/llm-decontaminator against MMLU and HellaSwag test sets; included as ANCOVA covariate"
    - name: "Random seed"
      operationalization: "3 independent training seeds per condition; results averaged"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Curation filtering changes the token distribution of the training corpus — PPL filtering removes high-perplexity (high-diversity, noisier) documents; deduplication removes near-duplicate (high-frequency pattern) documents"
      evidence: "DataMan [Peng et al., 2025] documents PPL-filtered vs. unfiltered distribution differences; google-research/deduplicate-text-datasets quantifies near-duplicate fraction removed"
      falsifier: "If PPL filtering and deduplication do not measurably change the distribution of the training corpus token statistics (KL divergence from reference), the mechanism is broken"
    - step: 2
      description: "Smaller models have lower representation capacity — they cannot efficiently extract signal from high-diversity, high-variance token distributions; their learning dynamics are dominated by the quality of individual examples rather than distributional coverage. Larger models have sufficient capacity to leverage distributional diversity, extracting cross-document patterns including near-duplicate frequency signals used for ICL."
      evidence: "Curriculum Learning theory (Bengio et al., 2009) supports capacity-dependent optimal difficulty. Bayesian ICL theory (Xie et al., 2022) supports near-duplicate pattern frequency as ICL mechanism. SoftDedup [He et al., 2024] shows near-duplicate down-weighting (not removal) outperforms hard dedup for few-shot (+1.77%), suggesting these patterns carry ICL signal."
      falsifier: "If attention entropy analysis of trained models does not show higher cross-document attention in large models vs. small models (or if removing near-duplicates does not selectively reduce ICL scores vs. standard accuracy), the capacity-diversity mechanism is not supported"
    - step: 3
      description: "The result is a scale × curation interaction effect in benchmark scores: (a) optimal PPL threshold is lower for small models (cleaner data preferred) and higher for large models (diversity valued); (b) aggressive deduplication improves small model scores (removes noise) but hurts large model scores (removes ICL-relevant patterns); (c) these effects manifest as measurably different learning curve shapes — aggressive filtering steepens the learning curve (higher λ) at small scale but flattens it at large scale."
      evidence: "WebOrganizer [Wettig et al., 2025] shows domain mixing (a proxy for distributional diversity) is more beneficial than quality filtering — consistent with large models preferring diversity. Scalable Ablation Approx [Na et al., 2024] shows merged-model PPL (which reflects training distribution, not reference PPL) correlates r=0.81 with benchmarks."
      falsifier: "If 2-way ANOVA (Scale × PPL-threshold) shows no significant interaction term (p > 0.05, partial η² < 0.15), the scale-curation interaction does not exist at measurable effect size"
  key_tension: "Token budget equalization vs. avoiding memorization artifacts at small scale — resolved by tokens-to-peak framing, but multi-epoch training at 70M remains a potential confound if tokens-seen covariate is not adequate"
  evidence_summary: |
    The causal chain is supported by: (1) DataMan's empirical PPL/ICL misalignment showing the
    PPL-distribution-ICL relationship is not simple; (2) SoftDedup's finding that near-duplicate
    down-weighting (preserving pattern frequency) beats hard removal for few-shot performance;
    (3) WebOrganizer's finding that domain diversity is orthogonal to and complementary with
    quality filtering; (4) Bayesian ICL theory providing mechanistic grounding for why near-duplicate
    frequency patterns matter for large model ICL. No single prior work has measured the scale ×
    curation interaction directly.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pythia-architecture models trained from scratch on Dolma subsets are comparable across curation conditions (same architecture, same optimizer, same training infrastructure)"
    supporting_evidence: "Pythia architecture is well-documented and publicly available; NeMo-Curator provides reproducible corpus preparation; EleutherAI Pythia training code is open-source"
    consequence_if_violated: "Cross-condition comparisons are invalid; entire experimental design collapses"
  - id: "A2"
    assumption: "GPT-2 PPL is a reasonable operationalization of 'data quality' that meaningfully partitions the Dolma distribution"
    supporting_evidence: "DataMan [Peng et al., 2025] uses GPT-2 PPL as the primary quality proxy and shows it produces measurable distribution shifts; standard in the literature (CCNET, Gopher)"
    consequence_if_violated: "PPL threshold manipulation may not produce the hypothesized quality variation; need alternative quality metric (e.g., educational value classifier)"
  - id: "A3"
    assumption: "Near-duplicate document removal (MinHash at J=0.7 vs. J=0.9) produces meaningfully different ICL pattern frequency distributions"
    supporting_evidence: "SoftDedup [He et al., 2024] shows that hard vs. soft dedup produce different few-shot (ICL) performance; google-research/deduplicate-text-datasets documents that MinHash J=0.7 removes ~15-20% of web data"
    consequence_if_violated: "The PPL and dedup thresholds tested may not span a sufficient range to detect the scale interaction for dedup (P3)"
  - id: "A4"
    assumption: "MMLU and HellaSwag are not so heavily contaminated in Dolma/FineWeb that contamination removal eliminates the benchmark signal"
    supporting_evidence: "Yang et al. (2023) reports 8-18% HumanEval contamination in RedPajama but MMLU contamination is typically lower; contamination measured per condition and included as ANCOVA covariate"
    consequence_if_violated: "Benchmark scores reflect contamination variation rather than true capability; measured by ANCOVA — if contamination covariate absorbs all variance, benchmarks are invalid for this study"
  - id: "A5"
    assumption: "The scale × curation interaction observed at 70M and 160M is representative of the general trend across scales (i.e., the interaction direction does not reverse between 160M and 1B)"
    supporting_evidence: "Theoretical scaling laws (Chinchilla, power laws) suggest smooth interpolation across scales; Na et al. (2024) approximation method allows extrapolation to 1B as validation"
    consequence_if_violated: "Results at 70M/160M may not generalize to practically relevant scales (1B+); report as limitation and use Na et al. approximation for extrapolation"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Autoregressive transformer language models in the 70M–160M parameter range trained on
    open English-language web corpora (Dolma, FineWeb). Pre-training from scratch (not
    fine-tuning). Standard pre-training objectives (next-token prediction). Quality filtering
    via perplexity (GPT-2 reference) and near-deduplication (MinHash). Evaluated on existing
    English-language NLP benchmarks (MMLU, HellaSwag).
  does_not_apply_to: |
    - Fine-tuned models or instruction-tuned models (different data distribution assumptions)
    - Non-English corpora (PPL reference model and contamination patterns differ)
    - Proprietary or non-open corpora (replication requires open data with documented filtering)
    - Models above 1B parameters (compute constraints; extrapolated via Na et al. approximation only)
    - Curation axes beyond PPL filtering and deduplication (e.g., domain mixing, format filtering)
      — these are excluded from primary hypothesis to maintain experimental tractability
    - Synthetic or generated data (pipeline-enforced feasibility constraint)
  known_limitations: |
    - Single architecture family (Pythia-style); results may not generalize to different architectures
    - Compute constraints limit primary study to 70M and 160M; 1B+ extrapolated, not directly measured
    - English-language only; multilingual curation dynamics may differ substantially
    - PPL reference model (GPT-2) trained on WebText — may not be optimal reference for Dolma/FineWeb
    - Two corpora (Dolma, FineWeb) — if results diverge, corpus-specific conclusion only

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The optimal PPL threshold (τ that maximizes MMLU + HellaSwag average) is lower for 70M models (predicted: τ* ∈ [20, 35]) than for 160M models (predicted: τ* ∈ [35, 50])"
    test_method: "2-way mixed ANOVA on benchmark scores with factors Scale (between-subjects) × PPL-threshold (within-subjects, 3 levels); test interaction term F_{Scale×PPL}; identify τ* per scale via simple effects analysis"
    success_criterion: "Significant interaction (p < 0.05, partial η² ≥ 0.15) with direction: τ*(70M) < τ*(160M); pre-registered directional prediction"
    falsification: "No significant interaction (p > 0.05) OR interaction in opposite direction (τ*(70M) ≥ τ*(160M))"
  - id: "P2"
    primary: false
    statement: "Variance in benchmark scores across PPL threshold conditions is higher at 70M than at 160M — smaller models are more sensitive to curation quality variation"
    test_method: "Levene's test for equality of variance between within-scale benchmark score distributions; one-tailed test (H1: Var(70M) > Var(160M))"
    success_criterion: "Levene's test p < 0.05 with Var(70M) > Var(160M) direction confirmed"
    falsification: "Levene's test p > 0.05 OR Var(160M) ≥ Var(70M)"
  - id: "P3"
    primary: false
    statement: "Sign of (B(strict dedup) - B(loose dedup)) is positive at 70M (strict dedup helps) and non-positive at 160M (strict dedup does not help or hurts)"
    test_method: "2-way ANOVA on benchmark scores with factors Scale × Dedup-aggressiveness (2 levels); test interaction term; compute simple effects at each scale. Pre-condition: at least one scale shows significant main effect of dedup (p < 0.05)."
    success_criterion: "Significant Scale × Dedup interaction (p < 0.05) with sign change confirmed; pre-condition met"
    falsification: "No significant interaction (p > 0.05) OR sign change not observed (same direction at both scales) OR pre-condition not met (no scale shows significant dedup main effect)"
  - id: "P4"
    primary: false
    statement: "Aggressive perplexity filtering (τ=20) produces a higher convergence rate λ (faster tokens-to-peak) at 70M scale than at 160M scale — aggressive filtering improves data efficiency only at small scale"
    test_method: "Fit log-linear learning curve B(T) = A - C·exp(-λT) to checkpoint evaluations (every 5B tokens out of 50B total; 10 evaluation points per run). Extract λ per condition. 2-way ANOVA on λ with Scale × PPL-threshold; test interaction; verify direction: λ(70M, τ=20) > λ(160M, τ=20) > λ(70M, τ=50)."
    success_criterion: "Significant interaction in ANOVA on λ (p < 0.05) with predicted direction: aggressive filtering accelerates convergence at 70M more than at 160M"
    falsification: "No significant interaction on λ (p > 0.05) OR λ is higher for large models under aggressive filtering (opposite direction)"

