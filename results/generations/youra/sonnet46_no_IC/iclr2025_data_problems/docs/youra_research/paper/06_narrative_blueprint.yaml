  - check: "Does each section naturally flow to the next?"
    status: "DESIGNED — Intro→Related (challenge single-scale work) → Method (factorial design) → Experiments → Results → Discussion → Conclusion (circle back)"

  - check: "Is key insight consistently emphasized throughout?"
    status: "DESIGNED — capacity-quality trade-off framing in Intro, Method, and Discussion"

  - check: "Are all major claims supported by evidence?"
    status: "DESIGNED — τ* ordering supported by 24 runs; effect size honest; P3 acknowledged as inconclusive"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "DESIGNED — lead with counterintuitive result (τ*(14M)≠τ*(31M)), one concrete number (30-unit gap), honest scope (PoC)"
