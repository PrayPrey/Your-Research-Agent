# ============================================================
# POTENTIAL ADVERSARIAL ATTACK VECTORS
# ============================================================

known_vulnerabilities:
  - type: "scale_generalization"
    issue: "Results at 14M/31M; original target 70M/160M not tested"
    paper_response: "Explicitly acknowledged as L1 limitation; framed as existence proof"
    severity: "HIGH — a reviewer will definitely raise this"

  - type: "effect_size"
    issue: "Δacc_norm ≈ 0.003 is very small"
    paper_response: "Acknowledged; attributed to short training (500 steps far from convergence)"
    severity: "MEDIUM — direction confirmed but magnitude uncertain"

  - type: "p3_claim"
    issue: "Dedup x scale interaction claimed in hypothesis but not measured"
    paper_response: "P3 marked INCONCLUSIVE; not claimed in paper; data available for analysis"
    severity: "LOW — paper does not make this claim"

  - type: "single_corpus"
    issue: "FineWeb only; Dolma originally planned but not used"
    paper_response: "Standard limitation in pre-training ablation literature"
    severity: "LOW — common in field"

  - type: "mmlu_floor"
    issue: "Primary original metric (MMLU) unusable; replaced with HellaSwag"
    paper_response: "Documented; HellaSwag justified as appropriate metric for this scale"
    severity: "MEDIUM — scope narrowing from original hypothesis"
