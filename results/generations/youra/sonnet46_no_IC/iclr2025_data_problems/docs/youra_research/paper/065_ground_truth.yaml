# Extracted from Phase 0-5 artifacts and validated paper
# Used by Adversary Agent to verify paper accuracy

version: "1.0"
extracted_at: "2026-08-04T23:30:00Z"
paper_file: "paper/06_paper.md"
primary_source: "045_validated_hypothesis.md"

# ============================================================
# VERIFIED QUANTITATIVE RESULTS (from h-e1-v2/04_validation.md)
# ============================================================

metrics:
  primary_metric:
    name: "HellaSwag 0-shot acc_norm"
    random_baseline: 0.25
    # All values from verification_state.yaml h-e1-v2.key_findings
    hellaswag_14m_tau20: 0.2556  # tau*(14M) — best for 14M
    hellaswag_31m_tau50: 0.2548  # tau*(31M) — best for 31M
    hellaswag_31m_tau20: 0.2524  # worst for 31M (strict filtering hurts)
    effect_size_delta_acc: 0.003  # approximate delta between best and worst per scale

  gate_checks:
    direction_confirmed: true   # tau*(14M) <= tau*(31M)
    above_random: true          # all acc_norm > 0.25
    interaction_exists: true    # tau*(14M) != tau*(31M)

  optimal_thresholds:
    tau_star_14m: 20
    tau_star_31m: 50
    tau_gap: 30  # full range of experimental design space

  corpus_statistics:
    tau20_retention_rate: 0.035    # 176/5000 = 3.5%
    tau50_retention_rate: 0.415    # 2074/5000 = 41.5%
    retention_ratio: 12            # 12x difference between tau=50 and tau=20

# ============================================================
# EXPERIMENTAL DESIGN (from h-e1-v2/02c_experiment_brief.md)
# ============================================================

methodology:
  experiment_type: "factorial_ablation"
  total_runs: 24
  design_factors:
    ppl_thresholds: [20, 35, 50]
    dedup_thresholds: [0.7, 0.9]  # MinHash Jaccard
    model_scales_params: [14, 31]  # Millions
    seeds: [1, 2]

  corpus:
    name: "FineWeb"
    huggingface_id: "HuggingFaceFW/fineweb"
    subset: "sample-10BT"
    documents_streamed: 50000
    ppl_reference_model: "GPT-2 (117M)"

  training_details:
    optimizer: "AdamW"
    learning_rate: 0.001
    lr_schedule: "cosine decay to 1e-4"
    batch_size_tokens: 131072
    training_steps: 500
    warmup_steps: 50
    context_length: 2048
    total_tokens: 1000000000  # 1B
    wall_clock_minutes: 68    # approximate for all 24 runs

  evaluation_tool: "lm-evaluation-harness"
  evaluation_split: "HellaSwag full validation set (10003 examples)"
  evaluation_type: "0-shot"

# ============================================================
# SCOPE AND LIMITATIONS (from 045_validated_hypothesis.md §6)
# ============================================================

scope:
  model_scales_tested: [14, 31]      # million parameters
  model_scales_original_target: [70, 160]  # million parameters (NOT tested)
  token_budget_tested: 1000000000    # 1B tokens
  token_budget_original_target: 50000000000  # 50B tokens (NOT tested)
  compute_scale_gap: "~50x"

  confirmed_claims:
    - "tau*(14M) < tau*(31M) direction confirmed"
    - "All 24 runs above HellaSwag random baseline"
    - "MMLU at floor for sub-100M models at 500 steps"
    - "7M/16M proxy models insufficient for interaction detection"

  inconclusive_claims:
    - "P3: Dedup x scale interaction direction (data exists in results.csv but not analyzed)"
    - "P4: Convergence rate differential by scale (disk constraints prevented multi-checkpoint)"
    - "Full-scale (70M/160M) interaction confirmation"

  removed_claims:
    - "MMLU 4-shot as primary metric (floor effect confirmed)"
    - "ANCOVA statistical significance p<0.05, eta2>=0.15 (insufficient power at PoC scale)"
    - "Dolma as primary corpus (not used in completed experiments)"

