main_hypothesis:
  id: H-CDTCS-v1
  title: Cross-Dimension Trustworthiness Correlation Structure (CDTCS)
  statement: 'Under the setting of existing LLM evaluation frameworks (TrustLLM 16-model x 6-dimension

    scores, HELM 30-model x 7-metric scores, and Pythia-family benchmark evaluations via

    lm-eval-harness), if we compute partial Spearman rank correlation matrices across

    trustworthiness dimensions controlling for model scale (log parameter count) and alignment

    status (RLHF fine-tuning yes/no), then we will observe a 2-cluster correlation structure

    separating RLHF-sensitive dimensions (safety, ethics) from RLHF-insensitive dimensions

    (adversarial robustness, calibration/privacy), with a derivable minimum spanning evaluation

    set of <=4 dimensions and replication of key cluster signs in HELM data.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TrustLLM published score tables (HowieHwong/TrustLLM results/*.json)
    model: TrustLLM 16-model set + Pythia scaling series (70M-12B)
    optimizer: null
    hyperparameters:
      bonferroni_alpha: 0.0033
      bootstrap_n: 1000
      bootstrap_subsample: 14
      spearman_threshold: 0.5
      silhouette_threshold: 0.3
      mst_stability_threshold: 0.9
