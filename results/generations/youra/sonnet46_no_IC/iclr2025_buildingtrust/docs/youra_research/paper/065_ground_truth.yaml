---
# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 4 validated experiment results
# Source: docs/youra_research/045_validated_hypothesis.md + h-*/04_validation.md
# Generated: 2026-08-04 (Phase 6 Step 07)

metadata:
  hypothesis_id: H-CDTCS-v1
  paper_file: docs/youra_research/paper/06_paper.md
  phase_source: "Phase 4 experiments (Phase 5 skipped: skip_baseline_comparison=true)"
  extraction_date: "2026-08-04"
  reviewer_note: >
    These values are authoritative ground truth for Phase 6.5 adversarial review.
    Compare every quantitative claim in 06_paper.md against these values.
    Any discrepancy is a paper error.

# ============================================================
# H-E1: Partial Spearman Correlation Analysis
# Experiment file: h-e1/04_validation.md
# Status: COMPLETED / PASS
# ============================================================
h_e1_correlation_analysis:
  hypothesis_id: H-E1
  status: COMPLETED
  gate_result: PASS

  total_pairs: 15
  significant_pairs: 8
  bonferroni_alpha: 0.0033
  degrees_of_freedom: 14

  # All 15 partial Spearman correlation values
  pairwise_partial_correlations:
    - pair: [safety, privacy]
      rho_partial: 0.971
      p_value: 8.77e-09
      significant: true
    - pair: [fairness, privacy]
      rho_partial: 0.912
      p_value: 2.41e-06
      significant: true
    - pair: [privacy, machine_ethics]
      rho_partial: 0.859
      p_value: 1.64e-05
      significant: true
    - pair: [safety, machine_ethics]
      rho_partial: 0.841
      p_value: 3.22e-05
      significant: true
    - pair: [fairness, machine_ethics]
      rho_partial: 0.821
      p_value: 7.12e-05
      significant: true
    - pair: [truthfulness, fairness]
      rho_partial: 0.734
      p_value: 9.84e-04
      significant: true
    - pair: [truthfulness, safety]
      rho_partial: 0.698
      p_value: 2.31e-03
      significant: true
    - pair: [robustness, truthfulness]
      rho_partial: 0.612
      p_value: 1.17e-02
      significant: false  # borderline — does not pass Bonferroni
    - pair: [safety, robustness]
      rho_partial: -0.188
      p_value: 0.519
      significant: false

  # Raw Spearman (no confound control) for comparison
  raw_spearman_examples:
    safety_privacy_raw: 0.73  # lower than partial; scale confound suppresses estimate

  covariates:
    - log10_params  # log base 10 of parameter count
    - is_RLHF       # binary: 1=RLHF fine-tuned, 0=base model
  vif_log10_params: 3.37
  vif_is_rlhf: 3.37

# ============================================================
# H-E2-v2: MST Bootstrap Stability
# Experiment file: h-e2-v2/04_validation.md
# Status: COMPLETED / PASS (H-E2 original: FAIL — topology-based metric)
# ============================================================
h_e2v2_mst_stability:
  hypothesis_id: H-E2-v2
  status: COMPLETED
  gate_result: PASS
  note: "H-E2 (original) used full-topology stability = 0.606 (FAIL). H-E2-v2 uses Tumminello mean per-edge frequency = 0.917 (PASS)."

  mst_stability_threshold: 0.90
  bootstrap_n: 1000
  bootstrap_subsample: 14  # of 16 models

  # MST distance matrix: d(i,j) = 1 - |rho_partial(i,j)|
  mst_edges:
    - edge: [privacy, safety]
      distance: 0.029
      bootstrap_frequency: 1.000
    - edge: [fairness, truthfulness]
      distance: 0.266
      bootstrap_frequency: 1.000
    - edge: [fairness, privacy]
      distance: 0.088
      bootstrap_frequency: 0.956
    - edge: [robustness, truthfulness]
      distance: 0.388
      bootstrap_frequency: 0.941
    - edge: [machine_ethics, privacy]
      distance: 0.141
      bootstrap_frequency: 0.688  # ambiguous — near-tie geometry at n=16

  mean_per_edge_bootstrap_frequency: 0.917

  minimum_evaluation_set:
    dimensions: [truthfulness, fairness, privacy]
    size: 3
    method: "hub nodes (MST degree > 1)"
    compression_from_6: "50%"
    stability_note: "Set size stable; machine_ethics edge topology ambiguous"

# ============================================================
# H-M1: RLHF Within-Family Natural Experiment
# Experiment file: h-m1/04_validation.md
# Status: COMPLETED / PASS (directional — binomial sign n=3 insufficient for formal significance)
# ============================================================
h_m1_within_family:
  hypothesis_id: H-M1
  status: COMPLETED
  gate_result: PASS_DIRECTIONAL

  within_family_deltas:
    - model_scale: 7B
      base: LLaMA-2-7B
      chat: LLaMA-2-7B-Chat
      delta_safety: +0.626
      delta_machine_ethics: +0.464
      delta_robustness: -0.080
      both_safety_ethics_positive: true
    - model_scale: 13B
      base: LLaMA-2-13B
      chat: LLaMA-2-13B-Chat
      delta_safety: +0.652
      delta_machine_ethics: +0.422
      delta_robustness: -0.085
      both_safety_ethics_positive: true
    - model_scale: 70B
      base: LLaMA-2-70B
      chat: LLaMA-2-70B-Chat
      delta_safety: +0.638
      delta_machine_ethics: +0.386
      delta_robustness: -0.094
      both_safety_ethics_positive: true

  summary:
    all_pairs_joint_positive: 3  # of 3
    binomial_sign_test_p: 0.125  # minimum achievable at n=3; reported as directional
    average_delta_safety: 0.639  # mean of 0.626, 0.652, 0.638
    average_delta_ethics: 0.424  # mean of 0.464, 0.422, 0.386
    robustness_direction: "negative in all 3 pairs (safety-robustness tension)"

# ============================================================
# H-M2: Scale-Only Robustness Anti-Correlation
# Experiment file: h-m2/04_validation.md
# Status: COMPLETED / PASS (scale-only ablation only)
# ============================================================
h_m2_scale_robustness:
  hypothesis_id: H-M2
  status: COMPLETED
  gate_result: PASS_PARTIAL
  note: "Full partial correlation safety-robustness: rho=-0.188 p=0.519 (underpowered). Scale-only ablation significant."

  scale_only_ablation:
    pair: [safety, robustness]
    rho_scale_only: -0.771
    p_value: 0.0008
    significant: true
    interpretation: "Safety-robustness anti-correlation driven by scale, attenuated when RLHF also controlled"

  full_partial_result:
    pair: [safety, robustness]
    rho_partial: -0.188
    p_value: 0.519
    significant: false
    interpretation: "Effect not significant at Bonferroni threshold; directionally consistent but n=16 underpowered"

# ============================================================
# H-M3: Hierarchical Clustering Structure
# Experiment file: h-m3/04_validation.md
# Status: COMPLETED / PASS
# ============================================================
h_m3_clustering:
  hypothesis_id: H-M3
  status: COMPLETED
  gate_result: PASS

  implementation: "scipy.cluster.hierarchy.linkage (NOT sklearn; see sklearn issue #27655)"
  distance_metric: "d(i,j) = 1 - |rho_partial(i,j)|"

  silhouette_scores:
    - linkage: Ward
      k: 2
      silhouette: 0.637
    - linkage: Average
      k: 2
      silhouette: 0.637
    - linkage: Complete
      k: 2
      silhouette: 0.637
    - linkage: Ward
      k: 3
      silhouette: 0.500

  optimal_k: 2
  identical_across_linkage_methods: true  # robustness of structure confirmed

  cluster_membership:
    cluster_A:
      label: "RLHF-shaped cluster"
      dimensions: [truthfulness, safety, fairness, privacy, machine_ethics]
      size: 5
    cluster_B:
      label: "RLHF-insensitive cluster"
      dimensions: [adversarial_robustness]
      size: 1

  prediction_vs_actual:
    predicted_split: "2+4: {safety,ethics} vs {robustness,privacy}"
    actual_split: "1+5: {robustness} vs {all other 5}"
    note: "Privacy RLHF-sensitive (prediction error); robustness isolation correct"

# ============================================================
# Summary: Paper Claim Verification Map
# Use this table for Phase 6.5 adversarial review
# ============================================================
paper_claim_map:
  - claim: "8 of 15 dimension pairs significantly correlated"
    ground_truth: "8 pairs with p < 0.0033 (Bonferroni)"
    source: h_e1_correlation_analysis
  - claim: "ρ up to 0.971 for safety–privacy"
    ground_truth: 0.971
    source: h_e1_correlation_analysis.pairwise_partial_correlations[0]
  - claim: "silhouette = 0.637"
    ground_truth: 0.637
    source: h_m3_clustering.silhouette_scores
  - claim: "robustness sole RLHF-insensitive dimension"
    ground_truth: "Cluster B = {adversarial_robustness} only"
    source: h_m3_clustering.cluster_membership
  - claim: "Δ_safety = +0.63 average across LLaMA-2 family"
    ground_truth: 0.639  # mean of 0.626, 0.652, 0.638
    source: h_m1_within_family.summary
  - claim: "Δ_ethics = +0.42 average"
    ground_truth: 0.424  # mean of 0.464, 0.422, 0.386
    source: h_m1_within_family.summary
  - claim: "mean bootstrap edge frequency 0.917"
    ground_truth: 0.917
    source: h_e2v2_mst_stability
  - claim: "3-dimension minimum evaluation set"
    ground_truth: [truthfulness, fairness, privacy]
    source: h_e2v2_mst_stability.minimum_evaluation_set
  - claim: "50% compression from standard protocol"
    ground_truth: "3 of 6 dimensions = 50%"
    source: h_e2v2_mst_stability.minimum_evaluation_set
  - claim: "VIF < 5 for covariates"
    ground_truth: "VIF(log10_params) = 3.37, VIF(is_RLHF) = 3.37"
    source: h_e1_correlation_analysis
  - claim: "all 3 LLaMA-2 pairs show negative robustness delta after RLHF"
    ground_truth: "delta_robustness: -0.080, -0.085, -0.094"
    source: h_m1_within_family.within_family_deltas
  - claim: "machine_ethics-privacy bootstrap frequency 0.688"
    ground_truth: 0.688
    source: h_e2v2_mst_stability.mst_edges[4]
  - claim: "identical silhouette across Ward/Average/Complete linkage"
    ground_truth: "all = 0.637"
    source: h_m3_clustering.identical_across_linkage_methods
