# Narrative Blueprint — CDTCS Paper
# Generated: Phase 6 Step 02
# Paper: "Trustworthiness Dimensions in LLMs Are Not Independent: A Partial Correlation Structure Driven by RLHF"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: |
      LLM trustworthiness evaluation typically measures 6 independent dimensions — safety,
      fairness, truthfulness, robustness, privacy, and machine ethics — as though they were
      orthogonal axes. But are they? We show that after controlling for model scale and RLHF
      alignment, 8 of 15 dimension pairs are significantly correlated (ρ up to 0.971), a
      3-dimension minimum evaluation set is derivable from the correlation geometry, and a
      single dimension — adversarial robustness — stands apart from the tight cluster governing
      all others.
    strategy: "Counterintuitive Finding + Practical Payoff"
    rationale: |
      The hook works on two levels: (1) it challenges the implicit assumption that trustworthiness
      dimensions are independent (counterintuitive), and (2) it immediately promises a practical
      payoff (evaluation compression from 6 to 3). The surprise about robustness isolation and
      privacy's unexpected behavior creates narrative tension that propels the reader forward.

  why_reader_should_care:
    main_reason: "If trustworthiness dimensions are correlated, practitioners are wasting evaluation resources measuring redundant axes — and may be missing the one genuinely independent dimension (robustness) that requires separate attention."
    concrete_example: "A deployment team running TrustLLM's 6-dimension evaluation could obtain equivalent ranking information by measuring only 3 dimensions — yet no framework currently exploits this compression."
    stakes: "Without understanding the correlation structure, evaluation frameworks overcount correlated dimensions (creating false confidence) and underweight the sole independent dimension (robustness), which follows a different trajectory determined by scale, not alignment."

# ============================================================================
# PROBLEM FRAMING (3 LEVELS)
# ============================================================================

problem_framing:
  surface_problem:
    description: "LLM trustworthiness is multi-dimensional and expensive to evaluate — current frameworks measure 6+ dimensions independently."
    common_understanding: "TrustLLM, HELM, and MultiTrust all evaluate multiple dimensions and note that different models have different strength profiles, with safety-utility tradeoffs documented."

  deeper_problem:
    description: "Existing trustworthiness evaluation frameworks assume dimensional independence — but the dimensions share systematic covariance driven by RLHF training that is invisible in raw scores."
    why_overlooked: "Prior work publishes leaderboard rankings and radar charts but has not computed the pairwise Spearman correlation matrix across models. The covariance is latent in the published data, not explicitly computed."
    our_perspective: "We reframe trustworthiness evaluation as a correlation geometry problem: rather than asking 'what score does model X achieve on dimension D?', we ask 'what is the geometric structure of the 6-dimensional trustworthiness space?' This framing immediately suggests MST-based evaluation compression."

  gap_in_existing_work:
    description: "No study has computed a partial Spearman correlation matrix across LLM trustworthiness dimensions controlling for model scale and RLHF status, identified the underlying cluster structure, or derived a minimum sufficient evaluation set from that structure."
    why_gap_exists: "The data (TrustLLM published scores) has existed since 2024, but the analysis (pairwise partial correlation with confound control) has not been applied. Liu et al. [2023] explicitly list this as future work."
    why_gap_matters: "Without this analysis, practitioners cannot know which dimensions are redundant (co-optimized by RLHF) vs genuinely independent (requiring separate effort), leading to misevaluated models and inefficient evaluation pipelines."

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "RLHF preference training simultaneously shapes safety, fairness, privacy, truthfulness, and machine ethics into a single tightly correlated cluster — while adversarial robustness follows a separate trajectory governed by scale, not alignment."
    expanded_explanation: |
      Human preference annotation, which trains RLHF models to avoid harmful, unfair, and
      privacy-violating outputs, creates a shared optimization signal that co-moves 5 of 6
      trustworthiness dimensions. The exception — adversarial robustness — is governed by
      scale and training distribution, not by human preference signals, making it the only
      dimension that genuinely requires independent evaluation.

  why_others_missed_it:
    common_assumptions: "Prior work assumed that because trustworthiness dimensions measure different properties (safety vs fairness vs robustness), they should be treated as independent evaluation axes. This is a construct validity assumption, not an empirical finding."
    our_different_view: "We ask an empirical question — are these dimensions statistically independent across models? — and find they are not. The answer was hiding in published TrustLLM scores that had never been subjected to pairwise correlation analysis."
    enabling_factor: "Controlling for model scale and RLHF status (partial correlation) removes the confound that inflates raw correlations, revealing the genuine trustworthiness geometry."

  what_makes_it_work:
    intuitive_explanation: "RLHF annotators penalize the same set of behaviors (harmful, unfair, privacy-violating outputs) when rating model responses — creating a shared training signal that lifts all non-robustness dimensions together. Robustness to adversarial inputs is never directly tested in preference annotation, so it's optimized separately through scale."
    key_mechanism: "OLS residualization of model scale and RLHF binary covariate removes confounds from Spearman rank correlations; the residual partial correlations reveal the RLHF-driven geometry. Ward hierarchical clustering (silhouette=0.637, robust across all linkage methods) confirms the 2-cluster structure."

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "LLM trustworthiness dimensions form a 2-cluster partial correlation structure: a 5-dimension RLHF-shaped cluster with robustness isolating as the sole RLHF-insensitive axis."
    measurable_criteria: "8/15 pairs Bonferroni-significant; silhouette=0.637 for k=2; 3-dim MST minimum evaluation set with mean bootstrap edge frequency 0.917."

  supporting_evidence:
    - id: "evidence_1"
      what: "8 of 15 trustworthiness dimension pairs are statistically significant after Bonferroni correction (ρ up to 0.971 for safety–privacy)."
      so_what: "The correlation structure is not noise — it is a systematic pattern driven by shared optimization pressure."
      how_it_supports_claim: "Establishes that the correlation structure exists and is statistically robust (H-E1 PASS)."

    - id: "evidence_2"
      what: "Ward hierarchical clustering produces a 2-cluster solution with silhouette=0.637, identical across Ward, average, and complete linkage."
      so_what: "The cluster structure is not a methodological artifact of Ward linkage — it is a genuine geometric property of the data."
      how_it_supports_claim: "Confirms the 2-cluster structure (H-M3 PARTIAL_PASS — primary gate passes; membership boundary differs from prediction, which is itself a finding)."

    - id: "evidence_3"
      what: "RLHF chat fine-tuning increases both safety AND machine ethics simultaneously in all 3 LLaMA-2 scale points (7B/13B/70B)."
      so_what: "RLHF is the mechanism — the same training signal that optimizes safety also optimizes ethics at every model scale."
      how_it_supports_claim: "Provides mechanistic evidence for WHY the correlation cluster exists (H-M1 PASS)."

    - id: "evidence_4"
      what: "A 3-dimension minimum evaluation set {truthfulness, fairness, privacy} spans the MST of the trustworthiness correlation space (mean bootstrap edge frequency 0.917)."
      so_what: "Practitioners can compress 6-dimension evaluation to 3 dimensions with high bootstrap stability — a 50% reduction."
      how_it_supports_claim: "Demonstrates the practical implication of the correlation structure (H-E2-v2 PASS)."

  surprising_findings:
    - finding: "Privacy is the strongest trustworthiness co-mover with safety (ρ=0.971) — not machine ethics as originally predicted."
      why_surprising: "The original hypothesis classified privacy as RLHF-insensitive alongside robustness, reasoning that privacy protection is an architectural/data concern. In practice, RLHF annotators appear to penalize privacy-violating outputs alongside harmful outputs."
      our_interpretation: "RLHF reward modeling embeds safety, ethics, AND privacy avoidance through shared annotator judgments — the construct measurement, not abstract theory, drives the correlation."

    - finding: "The safety-robustness anti-correlation does not reach statistical significance (ρ=-0.188, p=0.519) despite directional evidence from all 3 LLaMA-2 within-family pairs."
      why_surprising: "The original hypothesis predicted a significant negative correlation. The RLHF binary covariate absorbs the shared variance between safety and robustness, attenuating the full partial correlation."
      our_interpretation: "This is a power issue (n=16), not a true null. Scale-only analysis yields ρ=-0.771 (p=0.0008), confirming the effect exists but requires larger samples to survive Bonferroni correction when both scale and RLHF are controlled."

  what_results_mean: "The partial correlation structure reveals that RLHF training creates a pervasive alignment signal that shapes 5 of 6 trustworthiness dimensions simultaneously, enabling principled evaluation compression while highlighting robustness as the one dimension that requires separate, scale-focused attention."

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "We provide the first systematic partial Spearman correlation analysis of LLM trustworthiness dimensions, revealing a 2-cluster structure driven by RLHF and enabling principled evaluation compression from 6 to 3 dimensions."
    why_significant: "This reframes trustworthiness evaluation from a 6-axis measurement problem to a structured geometry problem, with immediate implications for how benchmarks are designed and how evaluation budgets are allocated."

  implications:
    for_field: "Trustworthiness benchmarking should account for inter-dimension correlation; the current independent-axes assumption leads to redundant measurement and potential under-emphasis on robustness."
    for_practice: "Deployment teams can use the MST-derived minimum evaluation set {truthfulness, fairness, privacy} for efficient pre-deployment screening, reserving adversarial robustness evaluation as an independent axis."

  future_possibilities:
    immediate_extensions: "HELM replication to test cross-framework construct equivalence; Pythia lm-eval-harness robustness expansion for larger n."
    longer_term_vision: "Dynamic trustworthiness benchmarking that exploits correlation structure to identify which single dimension best predicts a model's full trustworthiness profile in a given deployment context."

# ============================================================================
# SECTION-LEVEL GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize the hook, key insight, headline result, and practical payoff over numerical detail."
    key_message: "RLHF creates a 5-dimension trustworthiness cluster; robustness stands apart; you only need 3 dimensions to evaluate the correlated cluster."

  introduction:
    narrative_purpose: "Hook → Problem (3 levels) → Key Insight → Contributions preview"
    hook_strategy: "Counterintuitive Finding + Practical Payoff"
    opening: "Start with the challenge to implicit independence assumption; move to the data-driven discovery."
    transition_to_related: "After establishing the insight, transition to 'prior work either provides the data (TrustLLM, HELM) or notes the gap (Liu et al. 2023) — but no one has run the analysis.'"

  related_work:
    narrative_purpose: "Build the argument that existing work provides data but not analysis; establish our method as the natural next step."
    positioning_strategy: "Group prior work into: (1) evaluation frameworks that provide the data, (2) tradeoff-specific studies that confirm dimension heterogeneity, (3) benchmark correlation literature that provides methodological context."
    key_comparison_points:
      - "TrustLLM/HELM: provide scores but no pairwise correlation analysis"
      - "AQUA-LLM/Know Thy Judge: confirm specific tradeoffs but no systematic matrix"
      - "Epoch AI/PCA study: capability correlation baseline (ρ=0.73 median) vs our trustworthiness structure"
      - "Liu et al. 2023: explicitly lists cross-dim correlation as future work — we deliver it"

  methodology:
    narrative_purpose: "Explain WHY partial Spearman with OLS residualization is the right tool; connect to key insight about confound removal."
    connection_to_insight: "The key insight (RLHF creates cluster structure) requires REMOVING the RLHF confound first — partial correlation does this."
    key_design_decisions:
      - "OLS residualization for partial Spearman (not pingouin) — exact df control"
      - "Bonferroni correction (α/15=0.0033) — conservative, not FDR, given exploratory nature"
      - "scipy Ward clustering (not sklearn) — sklearn bug #27655 with precomputed distance"
      - "Tumminello (2007) mean per-edge frequency metric for MST stability"

  experiments:
    narrative_purpose: "Explain what questions we ask and what data/methods we use to answer them."
    experimental_questions:
      - "RQ1: Do trustworthiness dimensions exhibit significant pairwise correlations after controlling for scale and RLHF? (H-E1)"
      - "RQ2: Is RLHF the mechanism behind joint safety-ethics co-optimization? (H-M1)"
      - "RQ3: What is the cluster structure of the partial correlation matrix? (H-M3)"
      - "RQ4: What is the minimum sufficient evaluation set? (H-E2-v2)"

  results:
    narrative_purpose: "Present evidence in the order: existence → mechanism → structure → compression."
    main_result_highlight: "8/15 pairs significant; silhouette=0.637; robustness isolates; 3-dim MST with 0.917 mean bootstrap frequency."

  discussion:
    narrative_purpose: "Interpret the unexpected findings; acknowledge honest limitations; connect to broader impact."
    honest_limitations:
      - "n=16 (TrustLLM) — limits power for moderate effects; acknowledged in P2 null"
      - "RLHF mechanism is proposed framework, not experimentally proven causation"
      - "TrustLLM-specific operationalization — HELM replication is future work"
      - "machine_ethics MST edge ambiguity at n=16 — topology stable at 91.7% mean freq"

  conclusion:
    narrative_purpose: "Callback to hook + summary of contributions with results + future work vision."
    callback_to_hook: "Return to the implicit independence assumption — 'We set out to question whether LLM trustworthiness dimensions are as independent as evaluation frameworks implicitly assume. The answer is no.'"

