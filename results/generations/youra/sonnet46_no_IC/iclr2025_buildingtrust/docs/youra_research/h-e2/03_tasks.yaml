         - Compare frozenset edge sets; track per-edge frequency in same loop
         - Return (topology_stability, edge_frequencies)

      3. run_mst_analysis(rho_partial, raw_scores, covariates, dim_names, ...) -> Dict
         - Baseline: raw Spearman via scipy.stats.spearmanr(raw_scores) -> build_mst
         - Primary: build_mst(rho_partial, dim_names); assert 5 edges
         - Bootstrap: call bootstrap_mst_stability
         - Return full results dict for serialization

      CRITICAL: ols_residualize requires pd.DataFrame not ndarray — wrap numpy slices!
      CRITICAL: build_mst takes rho_partial (correlation), NOT distance matrix.
