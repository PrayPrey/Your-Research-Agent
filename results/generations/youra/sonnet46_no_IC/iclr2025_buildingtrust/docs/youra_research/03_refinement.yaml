# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Trustworthiness dimension pair"
      type: "categorical"
      operationalization: "One of 15 pairwise combinations from {truthfulness, safety, fairness, robustness, privacy, ethics}"
      levels:
        - "truthfulness × safety"
        - "truthfulness × fairness"
        - "truthfulness × robustness"
        - "truthfulness × privacy"
        - "truthfulness × ethics"
        - "safety × fairness"
        - "safety × robustness"
        - "safety × privacy"
        - "safety × ethics"
        - "fairness × robustness"
        - "fairness × privacy"
        - "fairness × ethics"
        - "robustness × privacy"
        - "robustness × ethics"
        - "privacy × ethics"
    - name: "Model scale"
      type: "continuous"
      operationalization: "log10(parameter_count) — covariate controlled via partial correlation"
      levels: []
    - name: "RLHF alignment status"
      type: "categorical"
      operationalization: "Binary: RLHF fine-tuned (Chat/Instruct models) vs base models — covariate controlled"
      levels: ["RLHF-tuned", "base"]
  dependent:
    - name: "Partial Spearman rank correlation coefficient (ρ_partial)"
      type: "continuous"
      operationalization: "Spearman ρ between dimension pair after partialing out scale and alignment status; range [-1, +1]"
      primary: true
    - name: "Hierarchical clustering silhouette score"
      type: "continuous"
      operationalization: "Silhouette coefficient for k=2 clustering of 6×6 ρ_partial matrix; range [-1, +1]"
      primary: false
    - name: "Minimum spanning evaluation set size"
      type: "continuous"
      operationalization: "Number of dimensions in MST-derived minimum sufficient evaluation set; integer ∈ {1, 2, 3, 4, 5, 6}"
      primary: false
    - name: "Bootstrap MST topology stability"
      type: "continuous"
      operationalization: "Proportion of 1000 bootstrap resamples (14/16 models) that produce identical MST topology; range [0, 1]"
      primary: false
  controlled:
    - name: "Benchmark operationalization"
      operationalization: "Use TrustLLM published scores (fixed operationalization) for primary analysis; HELM for replication"
    - name: "Model population"
      operationalization: "TrustLLM 16-model convenience sample (primary); Pythia family for scale-controlled expansion"
    - name: "Evaluation protocol"
      operationalization: "Published scores from TrustLLM GitHub repository — not re-evaluated"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "RLHF reward signals directly optimize safety and ethics behavior by penalizing harmful outputs and rewarding value-aligned responses during preference learning"
      evidence: "Sun et al. [2024] LLaMA-2-Chat vs LLaMA-2-base comparison shows safety gains from RLHF. AQUA-LLM [Güngör et al., 2025] shows RLHF creates accuracy-robustness tradeoff. Exchange 4, 8."
      falsifier: "If RLHF models do NOT show higher safety AND ethics scores than base models of equivalent scale, Step 1 is broken"
    - step: 2
      description: "RLHF-induced conservative, refusal-prone attention patterns create representation-level rigidity that reduces adversarial robustness — the same representations that improve safety (avoiding harmful outputs via pattern-matching) are brittle to adversarial perturbations"
      evidence: "AQUA-LLM accuracy-robustness tradeoff; Know Thy Judge [Eiras et al., 2025] shows safety judges brittle to style shift (FNR ≤0.24 jump). Exchange 9."
      falsifier: "If RLHF models show EQUAL or HIGHER robustness than base models (within same scale bracket), Step 2 is broken"
    - step: 3
      description: "The RLHF-driven co-movement of safety and ethics (positive correlation) combined with safety-robustness anti-correlation creates a 2-cluster structure that manifests as negative cross-cluster partial Spearman ρ in the across-model correlation analysis"
      evidence: "MultiTrust [Zhang et al., 2024] radar charts visually show dimension-specific vulnerability pattern per model; PCA study shows TruthfulQA orthogonal to capability. Exchange 5, 12."
      falsifier: "If clustering of 6×6 ρ_partial matrix produces k≠2 clusters with silhouette > 0.3, Step 3 is wrong"
  key_tension: "Whether the observed correlation structure reflects the RLHF mechanism specifically, or a broader model development confound (larger/better-trained models score higher on everything). Partial correlation controls for scale address this tension but cannot fully rule out unobserved confounds."
  evidence_summary: |
    The causal chain is theoretically grounded by three independent evidence streams:
    (1) Within-family RLHF comparisons [Sun et al., 2024] showing safety gains and robustness costs;
    (2) Representation-level mechanism via AQUA-LLM [2025] and Know Thy Judge [2025] brittleness findings;
    (3) Structural evidence from PCA (TruthfulQA orthogonal to capability) and MultiTrust radar charts
    showing dimension-specific vulnerability patterns. The Pythia natural experiment will provide
    the cleanest test: within Pythia family (fixed architecture, no RLHF), do dimensions show
    different correlation patterns than across the full model sample?

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "TrustLLM published per-model per-dimension scores are sufficiently granular (not just aggregate rankings) to compute pairwise Spearman correlation"
    supporting_evidence: "TrustLLM GitHub repository (HowieHwong/TrustLLM) publishes evaluation results in results/ folder with per-model JSON files. Exchange 14."
    consequence_if_violated: "Must re-run lm-eval-harness on the same 16 models using the same sub-benchmarks — significant engineering work but feasible; fallback confirmed in Exchange 14."
  - id: "A2"
    assumption: "The 16 TrustLLM models span sufficient variation in both scale and RLHF alignment status to estimate partial correlations after controlling for these covariates"
    supporting_evidence: "TrustLLM includes base and chat variants of LLaMA-2 (7B/13B/70B), Mistral-7B, Falcon-7B, GPT-3.5/4, Claude-2, Vicuna — spanning ~7B to ~175B+ parameters and both RLHF and base models. Exchange 8."
    consequence_if_violated: "Partial correlation estimates are unreliable; Pythia expansion (adding 8 base-only scale-series models) partially mitigates by improving scale range coverage."
  - id: "A3"
    assumption: "RLHF alignment status (binary: RLHF vs base) is a sufficient covariate to capture alignment confound; other alignment techniques (DPO, SFT) are treated as aligned for this analysis"
    supporting_evidence: "TrustLLM model set primarily uses RLHF (LLaMA-2-Chat, Vicuna) or base. DPO was less prevalent in 2024. Simplification acknowledged. Exchange 9."
    consequence_if_violated: "DPO models (if misclassified) could introduce noise in partial correlation; sensitivity analysis: rerun with DPO models excluded to check robustness."
  - id: "A4"
    assumption: "The same construct (e.g., 'safety') measured differently in TrustLLM vs HELM is sufficiently correlated to make cross-framework replication meaningful"
    supporting_evidence: "Both TrustLLM safety and HELM toxicity/bias metrics measure harmful output avoidance; construct overlap is substantial if not identical. Prof. Pax analysis in Exchange 4."
    consequence_if_violated: "HELM replication finds no structure → qualify finding as 'TrustLLM operationalization-specific'; negative replication is itself a contribution showing construct sensitivity."
  - id: "A5"
    assumption: "The Spearman rank correlation is an appropriate measure for the ordinal relationship between dimension scores across models (vs Pearson for linear relationships)"
    supporting_evidence: "Dimension scores are bounded [0,1] and may not be normally distributed; Spearman is more robust to outliers and non-normality. Standard in benchmark correlation literature (Epoch AI study uses Spearman). Exchange 2."
    consequence_if_violated: "Results would change if Pearson shows different sign pattern; mitigation: report both Spearman and Pearson, note where they diverge."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Text-only autoregressive LLMs evaluated on existing trustworthiness benchmark suites
    (TrustLLM 6-dimension framework, HELM 7-metric framework). Applicable to models
    spanning the size range of existing TrustLLM/HELM evaluations (~7B to ~175B parameters).
    Correlation structure is specific to the 2024-era model landscape and evaluation
    operationalizations in TrustLLM and HELM.
  does_not_apply_to: |
    Multimodal LLMs (MLLM trustworthiness geometry may differ; see MultiTrust for MLLM analysis).
    Models evaluated on entirely different benchmark operationalizations not in TrustLLM/HELM.
    Item-level analysis (this is a model-level correlation study, not item-level).
    Models released after TrustLLM/HELM publication if not included in the score tables.
  known_limitations: |
    1. n=16 (TrustLLM): low statistical power for weak-to-moderate correlations (|ρ|<0.55);
       large effects required for significance after Bonferroni correction.
    2. Convenience sample: TrustLLM 16 models are not a random sample of LLMs;
       results generalize to the frontier model population, not all LLMs.
    3. RLHF mechanism is proposed explanatory framework, not directly tested causal claim.
    4. Benchmark operationalization sensitivity: cross-framework replication may show
       different structures if constructs are defined differently.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The partial Spearman correlation between safety and ethics dimensions (controlling for log-scale and RLHF status) is significantly positive: ρ_partial(safety, ethics) > 0.5 in TrustLLM data (n=16 models)"
    test_method: "Compute partial Spearman ρ for (safety, ethics) using TrustLLM JSON scores. Control for log10(param_count) and is_RLHF binary. Test H0: ρ=0 using t-distribution with n-3=13 df."
    success_criterion: "ρ_partial(safety, ethics) > 0.5 AND p < 0.05 (one-tailed) in TrustLLM data"
    falsification: "ρ_partial(safety, ethics) < 0.3 OR p > 0.05; safety and ethics move independently after scale/alignment control"
  - id: "P2"
    primary: false
    statement: "The partial Spearman correlation between safety and adversarial robustness dimensions (controlling for scale and RLHF) is significantly negative: ρ_partial(safety, robustness) < -0.4 in TrustLLM data"
    test_method: "Same partial Spearman procedure as P1 but for (safety, robustness) pair"
    success_criterion: "ρ_partial(safety, robustness) < -0.4 AND p < 0.05 (one-tailed)"
    falsification: "ρ_partial(safety, robustness) > 0 OR p > 0.05 in TrustLLM; OR sign pattern reverses in HELM replication"
  - id: "P3"
    primary: false
    statement: "Hierarchical clustering (Ward linkage) of the 6×6 ρ_partial matrix produces a 2-cluster solution with silhouette score > 0.3, with clusters aligning to predicted RLHF-sensitive vs RLHF-insensitive grouping"
    test_method: "sklearn.cluster.AgglomerativeClustering with ward linkage on 6×6 ρ_partial matrix. sklearn.metrics.silhouette_score for k=2. Compare cluster membership to predicted {safety, ethics} vs {robustness, calibration/privacy}."
    success_criterion: "Silhouette score > 0.3 for k=2 AND cluster membership matches predicted grouping in ≥4/6 dimensions"
    falsification: "Silhouette < 0.1 for all k≥2 (no cluster structure); OR optimal k≠2; OR cluster membership misaligns with RLHF-sensitive prediction"
  - id: "P4"
    primary: false
    statement: "The MST of the partial Spearman matrix identifies a minimum sufficient evaluation set of ≤4 dimensions with ≥90% bootstrap topology stability"
    test_method: "networkx minimum spanning tree of (1-|ρ_partial|) distance matrix. Bootstrap: resample 14/16 models × 1000 iterations. Compute MST for each bootstrap sample. Report topology stability as proportion with same edge set."
    success_criterion: "MST identifies ≤4 mandatory evaluation dimensions AND bootstrap stability ≥ 0.90"
    falsification: "MST requires all 6 dimensions (minimum set = 6) OR bootstrap stability < 0.70 (topology unstable)"

