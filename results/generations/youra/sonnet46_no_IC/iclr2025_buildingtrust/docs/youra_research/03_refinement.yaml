established_facts:
  claims:
    - claim: "LLM trustworthiness dimensions (safety, ethics, truthfulness, robustness, privacy, fairness) can be independently measured using existing benchmark suites"
      status: "BUILD_ON"
      evidence: "TrustLLM [Sun et al., 2024] — 6-dim evaluation of 16 LLMs with published scores. Exchange 1."
    - claim: "Safety-RLHF creates safety-robustness trade-off within model families"
      status: "BUILD_ON"
      evidence: "LLaMA-2-Chat vs LLaMA-2-base within-family comparison in TrustLLM [Sun et al., 2024]. Exchange 4."
    - claim: "General capability benchmarks are highly correlated (median Spearman ρ=0.73, Epoch AI)"
      status: "BUILD_ON"
      evidence: "Epoch AI benchmark correlations analysis, 17 capability benchmarks. Exchange 1."
    - claim: "TruthfulQA loads orthogonally to capability PC1 (PCA study 2603.00394)"
      status: "BUILD_ON"
      evidence: "PCA study showing truthfulness as distinct dimension from general capability. Exchange 1."
    - claim: "Cross-dimension Spearman correlation matrix for LLM trustworthiness has NOT been computed"
      status: "PROVE_NEW"
      evidence: "Absence finding: TrustLLM publishes leaderboard rankings but not pairwise correlation analysis. Liu et al. [2023] explicitly lists this as future work. Exchange 3."
    - claim: "2-cluster RLHF-driven correlation structure of trustworthiness dimensions"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis from discussion — not present in any prior paper. Exchanges 5, 16."
    - claim: "Minimum spanning trustworthiness evaluation set derivable from correlation structure"
      status: "PROVE_NEW"
