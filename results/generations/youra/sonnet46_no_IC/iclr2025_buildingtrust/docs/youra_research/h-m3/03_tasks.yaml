    title: "Membership Alignment (Secondary Gate)"
    description: |
      Implement compute_membership_alignment(labels, dims) -> int in analysis.py.
      Try both label assignments (sensitive_label in [0, 1]).
      For each: count dims in PREDICTED_RLHF_SENSITIVE matching sensitive_label
               + dims in PREDICTED_RLHF_INSENSITIVE NOT matching sensitive_label.
      Return best count (max over both assignments). Range: [0, 4].
      Evaluate secondary gate: best >= SECONDARY_ALIGNMENT_THRESHOLD (4).
      Print: "✓ SECONDARY GATE PASS: membership_alignment=X/4" or "EXPLORE: ..."
    feature_tag: "evaluation"
