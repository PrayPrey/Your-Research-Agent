  - id: "task-004"
    epic: "A-3"
    title: "Distance Matrix Construction"
    description: |
      Implement in h-m3/code/analysis.py:
      - make_distance_matrix(rho) -> tuple[np.ndarray, np.ndarray]
        dist = np.clip(1.0 - rho, 0.0, 2.0)
        np.fill_diagonal(dist, 0.0)
        condensed = squareform(dist)  # shape (15,) = 6*5/2
        Return (dist [6,6], condensed [15,])
    feature_tag: "data-pipeline"
    priority: 91
    source_document: "03_architecture.md"
    complexity: 5
    reference_files:
      architecture: "03_architecture.md#analysis-codeanalysispy"
