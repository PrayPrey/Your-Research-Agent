      config: null

  - id: "task-005"
    epic: "A-4"
    title: "Ward Clustering (Primary Gate)"
    description: |
      Implement run_ward_clustering(condensed, dist_matrix, n_clusters=N_CLUSTERS) -> dict in analysis.py.
      CRITICAL: Use scipy.cluster.hierarchy.linkage(condensed, method='ward')
      FORBIDDEN: sklearn AgglomerativeClustering(linkage='ward', metric='precomputed') — sklearn #27655
      Steps:
        Z = linkage(condensed, method='ward')
        labels = fcluster(Z, t=n_clusters, criterion='maxclust') - 1  # 0-indexed
        sil = silhouette_score(dist_matrix, labels, metric='precomputed')
        gate_pass = sil > PRIMARY_SILHOUETTE_THRESHOLD
      Print: "✓ PRIMARY GATE PASS: silhouette_ward=X > 0.3" or "EXPLORE: silhouette_ward=X — below 0.3 threshold"
      Return: {Z, labels, silhouette_ward, primary_gate_pass}
    feature_tag: "model"
    priority: 90
    source_document: "03_architecture.md"
    complexity: 9
    reference_files:
