  - id: "task-007"
    epic: "A-6"
    title: "Robustness Checks"
    description: |
      Implement in analysis.py:
      - run_alternative_linkages(dist_matrix, dims) -> dict
        sklearn AgglomerativeClustering(n_clusters=2, metric='precomputed', linkage='average'/'complete')
        Return {silhouette_average, silhouette_complete, labels_average, labels_complete}
      - run_k3_check(condensed, dist_matrix) -> float
        scipy Ward at k=3; return silhouette_k3
      - run_alt_distance(rho, dims) -> dict
        dist_alt = sqrt(clip(1-rho^2, 0, 1)); Ward on this; return {silhouette_alt_distance, labels_alt}
      - run_mds_projection(dist_matrix, seed=RANDOM_SEED) -> ndarray (6,2)
        sklearn MDS(n_components=2, dissimilarity='precomputed', random_state=seed)
    feature_tag: "evaluation"
