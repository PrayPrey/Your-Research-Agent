hypothesis_draft:
  title: "Cross-Dimension Trustworthiness Correlation Structure (CDTCS)"
  hypothesis_id: "H-CDTCS-v1"
  core_claim: |
    LLM trustworthiness dimensions (safety, ethics, truthfulness, robustness, privacy, fairness)
    exhibit a non-random 2-cluster partial Spearman correlation structure driven by RLHF
    optimization pressure, detectable in existing published evaluation data (TrustLLM, HELM)
    without requiring new benchmarks or human annotation.
  mechanism: |
    RLHF reward signals directly optimize safety and ethics behavior, making these dimensions
    co-move (positive partial ρ) across models. Adversarial robustness and calibration/privacy
    are orthogonal to human preference signals and may degrade when RLHF creates conservative,
    refusal-prone representations — producing negative cross-cluster partial correlations.
    The Pythia scaling series provides a clean natural experiment where RLHF=False, isolating
    the pure scale effect from the RLHF-alignment effect.
  predictions:
    - P1: "ρ_partial(safety, ethics) > 0.5, p < 0.05, TrustLLM n=16"
    - P2: "ρ_partial(safety, robustness) < -0.4, p < 0.05, TrustLLM n=16"
    - P3: "2-cluster hierarchical solution with silhouette > 0.3, clusters align with RLHF-sensitive vs RLHF-insensitive grouping"
    - P4: "MST-derived minimum evaluation set ≤4 dimensions, bootstrap stability ≥0.90"

variables_summary:
  independent: "Trustworthiness dimension pair (15 combinations from 6 dimensions); model scale (log-param, covariate); RLHF alignment status (binary, covariate)"
  dependent_primary: "Partial Spearman rank correlation coefficient ρ_partial for each dimension pair (range [-1, +1], controlling for scale and alignment)"
  controlled: "Benchmark operationalization (TrustLLM primary, HELM replication); model population (TrustLLM 16-model set for primary, Pythia for scale control)"

null_hypothesis:
  h0_statement: |
    There is no significant correlation structure across 6 TrustLLM trustworthiness dimensions
    after controlling for model scale and RLHF alignment status (all |ρ_partial| < 0.3 across
    all 15 pairwise combinations; silhouette score < 0.1 for all k≥2 hierarchical clustering
    solutions). Trustworthiness dimensions are statistically independent.
  statistical_test: "Partial Spearman rank correlation with t-distribution test (df = n-3 = 13 for TrustLLM), Bonferroni-corrected α = 0.0033 for 15 simultaneous tests"
  significance_level: 0.0033

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic partial Spearman correlation analysis of 6 trustworthiness dimensions + RLHF-cluster organizing principle + MST-derived minimum evaluation set"
  differentiation_summary: |
    Liu et al. [2023] (575 citations) explicitly identifies cross-dimension correlation analysis
    as an open future direction. TrustLLM [Sun et al., 2024] and HELM [Liang et al., 2022] both
    note qualitative tradeoffs but publish neither Spearman correlation matrices nor partial
    correlations controlling for confounds. Epoch AI computes capability benchmark correlations
    (ρ=0.73) but not trustworthiness dimension correlations. This paper fills all three gaps
    simultaneously and adds the prescriptive MST evaluation set application.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "TrustLLM 16-model set: GPT-4, GPT-3.5-Turbo, Claude-2, Claude-Instant, LLaMA-2 (7B/13B/70B), LLaMA-2-Chat (7B/13B/70B), Vicuna (7B/13B), Mistral-7B, Falcon-7B"
    - "Pythia expansion: pythia-70m, pythia-160m, pythia-410m, pythia-1b, pythia-1.4b, pythia-2.8b, pythia-6.9b, pythia-12b"
  datasets:
    - "TrustLLM published score tables (HowieHwong/TrustLLM GitHub)"
    - "HELM leaderboard data (stanford-crfm/helm)"
    - "lm-eval-harness benchmark outputs for Pythia expansion (TruthfulQA, AdvGLUE, WinoGender, HarmBench)"
  baselines:
    - "Raw (uncontrolled) Spearman ρ matrix"
    - "Capability benchmark correlation baseline (Epoch AI median ρ=0.73)"
    - "HELM replication analysis"

measurement_plan:
  data_collection:
    - source: "TrustLLM GitHub repository: results/*.json → per-model per-dimension scores"
    - source: "HELM leaderboard API → 30-model × 7-metric score table"
    - source: "lm-eval-harness evaluation of Pythia family on TruthfulQA, AdvGLUE, WinoGender, HarmBench"
  procedure:
    - step: "1. Load TrustLLM JSON scores → construct 16×6 score matrix"
    - step: "2. Annotate each model with log10(param_count) and is_RLHF binary"
    - step: "3. Compute partial Spearman ρ for all 15 dimension pairs: residualize each dimension on [log_params, is_RLHF], then compute Spearman ρ on residuals"
    - step: "4. Apply Bonferroni correction (α=0.0033 for 15 tests); report significant pairs"
    - step: "5. Hierarchical clustering (Ward linkage) on 6×6 ρ_partial matrix; test k=2 via silhouette"
    - step: "6. MST analysis: networkx MST on (1-|ρ_partial|) distance matrix; identify minimum evaluation set"
    - step: "7. Bootstrap stability: resample 14/16 models × 1000 iterations; compute MST topology stability"
    - step: "8. HELM replication: repeat steps 1-4 using HELM leaderboard scores for equivalent dimension pairs"
    - step: "9. Pythia natural experiment: run lm-eval-harness on 8 Pythia checkpoints; compute within-Pythia correlation analysis (scale-only, no RLHF confound)"
  success_criteria:
    - "P1 confirmed: ρ_partial(safety, ethics) > 0.5 AND p < 0.0033"
    - "P2 confirmed: ρ_partial(safety, robustness) < -0.4 AND p < 0.0033"
    - "P3 confirmed: silhouette > 0.3 for k=2 with correct cluster assignment"
    - "P4 confirmed: MST minimum set ≤4 dimensions with ≥90% bootstrap stability"
    - "HELM replication: sign pattern of P1 and P2 reproduced (even if not significant with n=30)"

validation:
  internal_validity:
    - "Partial correlation controls for two major confounds (scale and alignment status) — stronger than raw correlation"
    - "Bootstrap stability test validates MST topology robustness to sampling variation"
    - "Pythia natural experiment provides within-family clean test of scale-only effect"
    - "Bonferroni correction prevents false discovery from 15 simultaneous tests"
  external_validity:
    - "HELM replication across different operationalization validates construct robustness"
    - "Two independent evaluation frameworks (TrustLLM + HELM) increase generalizability beyond convenience sample"
    - "Pythia family provides test across parameter count range (70M-12B) not well-represented in TrustLLM 16-model set"

discussion_synthesis:
  key_insights:
    - "The RLHF-cluster mechanism provides a theoretically motivated prediction of 2-cluster structure before data analysis — making this predictive, not post-hoc"
    - "Both outcome directions (trade-offs confirmed OR independence confirmed) are publishable at NeurIPS/ICML/ICLR tier"
    - "The MST prescriptive application upgrades the contribution from descriptive (correlation matrix) to actionable (minimum evaluation set)"
    - "Partial Spearman with confound control is the methodologically correct choice; raw correlation would be misleading due to scale and alignment confounds"
  breakthrough_moments:
    - "Exchange 5 (Dr. Nova): RLHF-cluster hypothesis refined from raw correlation idea to 2-cluster mechanistic prediction"
    - "Exchange 8 (Prof. Rex): Scale and alignment confounds identified, forcing stronger methodology (partial Spearman + Pythia experiment)"
    - "Exchange 11 (Dr. Nova): MST application elevates descriptive contribution to prescriptive practical output"
    - "Exchange 12 (Prof. Vera): Bootstrap MST stability test added as methodological rigor for prescriptive claim"
  resolved_tensions:
    - "Statistical power concern (n=16 underpowered) resolved by: (a) large-effect requirement for significance, (b) Pythia expansion to n≈24, (c) HELM replication as independent check"
    - "Construct validity concern (TrustLLM vs HELM measure different constructs) resolved by treating both as independent operationalizations; cross-framework replication is a strength, not a weakness"
    - "Post-hoc mechanism concern resolved by emphasizing that structural predictions are made BEFORE data analysis and mechanism is proposed as theoretical framework, not tested causal claim"
