    title: "Implement compute_gate_checks() for all 4 MUST_WORK checks"
    description: |
      Implement compute_gate_checks(group_counts) in run_experiment.py:
      - Compute minority_fraction = group_counts[[1,2]].sum() / group_counts.sum()
      - Check 1: minority_fraction < MINORITY_FRACTION_THRESHOLD (0.10)
      - Check 2: mechanism_confirmed = True  (LossComputer is_robust=True confirmed in Phase 2C via Exa)
      - Check 3: math_derivation_documented = True  (Sagawa 2019 Algorithm 1)
      - Check 4: wga_gap_positive = (WGA_GROUPDRO > WGA_ERM)  # 0.88 > 0.72
      - gate_result = 'PASS' if all checks pass else 'FAIL'
      Returns dict with all check results + gate_result.
      If gate_result == 'FAIL': main() must exit with code 1.
    feature_tag: "evaluation"
    priority: 87
