    title: "Implement load_group_distribution() and compute minority_fraction"
    description: |
      Implement load_group_distribution() in h-m1/code/run_experiment.py:
      - from wilds import get_dataset
      - dataset = get_dataset(dataset=config.WILDS_DATASET, download=False, root_dir=config.WILDS_CACHE)
      - train_data = dataset.get_subset('train')
      - group_array = train_data.metadata_array[:, 0].numpy().astype(int)  # NOT y_array
      - group_counts = np.bincount(group_array, minlength=4)  # shape (4,)
      - Print: f"Group counts: {group_counts}"  # expect ~[3498, 184, 56, 1057]
      - Print: f"Minority fraction: {minority_fraction:.4f}"  # expect ~0.050
      - Assert minority_fraction < 0.10 (gate check 1)
      Returns: (group_array, group_counts)
    feature_tag: "data-pipeline"
