# ============================================================================
# PHASE 6.5 ADVERSARIAL REVIEW GUIDANCE
# ============================================================================

adversarial_review_guidance:
  highest_risk_claims:
    - "QC-6 (H-P2 SUGGESTIVE) — do not overstate as CONFIRMED in abstract or introduction"
    - "UC-3 (suppression vs dilution) — do not use mechanistic language beyond decodability"
    - "QC-10 (SAM exploratory) — ensure clearly marked as exploratory, not pre-registered"

  strongest_claims_to_defend:
    - "QC-1+QC-2: H-M3 CONFIRMED with p=0.0039 and d=6.48 — robust to small-n critique"
    - "QC-3: DFR backbone identity at float32 precision — mathematically definitive"
    - "QC-4: Backbone/head ratio 6.47-7.03 with perfect DFR negative control"

  expected_reviewer_attacks:
    - attack: "n=3 is too small"
      response: "d=6.48 requires only n=2 for 80% power at alpha=0.05, one-sided. Power is not a concern."
    - attack: "Single dataset/architecture limits generalizability"
      response: "Acknowledged in L2. Waterbirds is canonical benchmark directly comparable to prior work."
    - attack: "H-P2 is not significant at n=9"
      response: "Correctly reported as SUGGESTIVE. ERM+GroupDRO ablation CONFIRMED. Limitation L3 acknowledged."
    - attack: "Linear probe is insufficient to prove backbone mechanism"
      response: "Correct. We claim reduced decodability (measured), not suppression mechanism (unmeasured). L4 acknowledged."
