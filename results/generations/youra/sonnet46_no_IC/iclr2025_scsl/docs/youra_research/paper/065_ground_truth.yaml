    claim: "One-sided paired t-test used for H-M3 (pre-registered, directional)"
    pre_registered: true
    threshold: "p < 0.05 AND d > 0 for CONFIRMED"
    rationale: "Directional prediction (GroupDRO < ERM) from theory + H-M2 mechanism verification"

  - claim_id: "SC-2"
    claim: "Bootstrap CI uses percentile method (not BCa) at n=9 for H-P2"
    pre_registered: true
    rationale: "BCa bootstrap fails at n=9 due to degenerate distribution; percentile method is correct fallback"

  - claim_id: "SC-3"
    claim: "Pre-registered gate thresholds: CONFIRMED=p<0.05+d>0; SUGGESTIVE=p<0.10+d>0.5; REJECTED otherwise"
    pre_registered: true
    source: "03_refinement.yaml, 02b_verification_plan.md"

