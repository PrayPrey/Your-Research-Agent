# CAUSAL CHAIN CLAIMS (verifiable against hypothesis chain)
# ============================================================================

causal_claims:
  - claim_id: "CC-1"
    claim: "Three-step verified causal chain: H-M1 → H-M2 → H-M3"
    steps:
      - step: 1
        hypothesis: "H-M1"
        claim: "GroupDRO creates group-balanced loss via minority upweighting"
        gate: "MUST_WORK"
        verdict: "PASS"
      - step: 2
        hypothesis: "H-M2"
        claim: "Group-balanced gradient propagates to all backbone layers"
        gate: "SHOULD_WORK"
        verdict: "PASS (weight diff VERIFIED; probe SUGGESTIVE p=0.0526)"
      - step: 3
        hypothesis: "H-M3"
        claim: "Gradient propagation results in reduced spurious decodability"
        gate: "MUST_WORK"
        verdict: "CONFIRMED (p=0.0039, d=6.48)"

  - claim_id: "CC-2"
    claim: "DFR is structurally distinct: head-recalibration pathway confirmed by H-P0"
    gate: "MUST_WORK"
    verdict: "PASS (cosine sim = 1.000000)"

# ============================================================================
# CLAIMS THAT MUST BE REPORTED AS UNCERTAIN/EXPLORATORY
# ============================================================================

uncertain_claims:
  - claim_id: "UC-1"
    claim: "H-P2 WGA correlation reaches CONFIRMED threshold"
    truth: "SUGGESTIVE at n=9 (CI upper bound = +0.084 > 0); ERM+GroupDRO subset CONFIRMED"
    risk: "Reviewer may claim we overstate the correlation result"
    mitigation: "Paper correctly reports SUGGESTIVE for n=9 and CONFIRMED for n=6 ablation"

  - claim_id: "UC-2"
    claim: "SAM backbone modification is pre-registered/confirmed"
    truth: "SAM is EXPLORATORY; not pre-registered for backbone comparison"
    risk: "May be misread as confirmed result"
    mitigation: "Paper explicitly marks SAM as 'exploratory, not pre-registered'"

  - claim_id: "UC-3"
    claim: "GroupDRO suppresses spurious features (mechanistic claim)"
    truth: "We measure LINEAR DECODABILITY, not suppression vs. dilution mechanism"
    risk: "Over-mechanistic language could invite reviewer rejection"
    mitigation: "Paper uses 'reduces linear decodability' throughout, not 'suppresses'"

  - claim_id: "UC-4"
    claim: "H-M2 linear probe is CONFIRMED"
    truth: "H-M2 linear probe p=0.0526 (SUGGESTIVE); H-M2 weight diff analysis is CONFIRMED"
    risk: "Conflating SUGGESTIVE probe with CONFIRMED weight analysis"
    mitigation: "Paper distinguishes: weight analysis VERIFIED, probe SUGGESTIVE"

