# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BSER-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under ResNet-50 checkpoints from izmailovpavel/spurious_feature_learning (3 seeds × 4 methods,
    fully trained on Waterbirds WILDS), if we compare GroupDRO-trained backbones to ERM-trained
    backbones using sklearn L-BFGS linear probe accuracy predicting background attribute (land/water,
    group_array) from frozen layer4 features (D=2048) on the full Waterbirds test set, then GroupDRO
    backbones exhibit significantly lower spurious probe accuracy (paired one-sided t-test, p<0.05,
    n=3 seeds), because GroupDRO's group-balanced worst-group loss forces gradient updates through
    all layers to reduce reliance on spurious background features, while DFR (head-only retraining)
    leaves backbone spurious encoding unchanged relative to ERM.
  alternative_hypothesis_h0: |
    There is no significant difference in spurious attribute linear probe accuracy between
    GroupDRO-trained and ERM-trained ResNet-50 layer4 features on Waterbirds WILDS (one-sided
    paired t-test: p >= 0.05 for GroupDRO < ERM direction).

