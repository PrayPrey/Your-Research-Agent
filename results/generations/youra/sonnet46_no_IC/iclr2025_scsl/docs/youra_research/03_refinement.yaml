# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "GroupDRO training upweights minority groups (land-bird on land background, water-bird on water background — atypical background examples), creating a group-balanced effective loss signal during backbone training"
      evidence: "Sagawa et al. 2019 GroupDRO paper: worst-group loss objective. Phase 1: Waterbirds minority groups are background-atypical examples. Exchange 3 (Dr. Sage), Exchange 6 (Prof. Vera)."
      falsifier: "If GroupDRO's minority group upweighting does not create different gradient signals for background-predictive features vs ERM — i.e., the effective loss is equivalent to ERM after averaging — then no backbone change would be expected."
    - step: 2
      description: "Group-balanced gradient signal propagates through all ResNet-50 layers including layer4, modifying weight updates to reduce the predictive utility of spurious background features for classification loss minimization"
      evidence: "Prof. Pax (Exchange 8): mechanically plausible — GroupDRO modifies training distribution seen by all layers. Supported by representation learning theory: training objective shapes representation (general DL principle)."
      falsifier: "If spurious feature gradient signal is confined to the final classification layer and does not propagate significantly to layer4 — e.g., if layer4 gradient magnitude from spurious features is negligible compared to class-discriminative features — then backbone encoding would be unchanged."
    - step: 3
      description: "Reduced spurious gradient signal in layer4 during GroupDRO training results in layer4 features where background (land/water) is less linearly decodable, measured as lower sklearn L-BFGS probe accuracy vs ERM-trained layer4 features"
      evidence: "Park et al. 2025 SCER: regularizing spurious feature subspace in representation space reduces background linear decodability. Izmailov 2022: s-DFR proxy shows high background decodability from ERM features (~85%). Our prediction: GroupDRO reduces this. Exchanges 11 (Dr. Ally), 13 (Prof. Vera)."
      falsifier: "If GroupDRO backbone probe accuracy ≥ ERM probe accuracy (one-sided t-test p ≥ 0.05, n=3 seeds), mechanism is not supported — backbone encoding is unchanged despite different training objective."
  key_tension: "GroupDRO improves WGA substantially (0.88 vs ERM 0.72 per Izmailov 2022). Does this WGA improvement come from backbone representation change (H-P1), head calibration only (no backbone change), or both? If both, the probe accuracy should show GroupDRO reduction. If head-only, probe accuracy would be similar to ERM despite higher WGA."
  evidence_summary: |
    Mechanistic chain is plausible but unproven. Supporting evidence: GroupDRO training objective
    theoretically forces gradient signal away from spurious features (Sagawa 2019). Park 2025 SCER
    demonstrates spurious feature subspace is regularizable in representation space. Izmailov 2022
    shows ERM encodes strong background (s-DFR ~85%). Against: Kirichenko 2022 shows DFR (head-only)
    achieves competitive WGA without backbone change, suggesting head calibration may suffice.
    The mechanism is a direct empirical question answerable by measuring GroupDRO layer4 probe accuracy.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "DFR backbone weights in Izmailov 2022 released checkpoints are numerically identical to ERM backbone weights at the same seed (frozen backbone in DFR protocol)"
    supporting_evidence: "Kirichenko 2022 DFR protocol explicitly freezes backbone. Izmailov repo implements DFR as ERM-backbone + sklearn head. Prof. Pax (Exchange 4), Prof. Rex (Exchange 12)."
    consequence_if_violated: "DFR cannot be excluded from backbone comparison; H-P1 must include DFR as a fourth backbone condition; interpretation changes substantially."

  - id: "A2"
    assumption: "Background attribute (land/water, group_array) is linearly decodable from ERM layer4 features at above-chance accuracy (baseline probe accuracy > 0.6)"
    supporting_evidence: "Izmailov 2022 s-DFR proxy shows ~85% background decodability from ERM features. If probe accuracy is near chance for all methods, the metric lacks discriminative power."
    consequence_if_violated: "Probe methodology fails; must examine earlier layers or use non-linear probes."

  - id: "A3"
    assumption: "Within-method probe accuracy variance across 3 seeds is small enough for paired t-test to have meaningful power (expected probe accuracy CV < 0.05)"
    supporting_evidence: "Linear probe accuracy is bounded [0,1] and a deterministic function of fixed features + stable sklearn probe. Unlike gradient cosine similarity (CV=3.98 in h-e1), probe accuracy CV expected << 1 for fixed checkpoints. Exchange 2 (Prof. Vera), Exchange 9 (Dr. Ally)."
    consequence_if_violated: "Cohen's d threshold cannot be pre-set; all results reported as SUGGESTIVE; power analysis post-hoc."

  - id: "A4"
    assumption: "The 12 released checkpoints represent genuinely different training methods (not identical due to implementation bugs or shared random states)"
    supporting_evidence: "WGA differences (ERM=0.72, GroupDRO=0.88, DFR=0.91) confirm differentiation. Izmailov 2022 paper validates these checkpoints are training-method-distinct."
    consequence_if_violated: "Checkpoint identity verification needed before any analysis."

  - id: "A5"
    assumption: "Group_array in Waterbirds WILDS encodes background attribute (land/water) as binary label, usable as spurious attribute probe target"
    supporting_evidence: "Sagawa et al. 2019 GroupDRO paper defines Waterbirds group structure: {waterbird, landbird} × {water_background, land_background} → 4 groups. group_array(0=landbird-land, 1=landbird-water, 2=waterbird-land, 3=waterbird-water) → background = group_array % 2. Phase 1 research confirmed."
    consequence_if_violated: "Label extraction code incorrect; probe predicts wrong attribute."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    ResNet-50 checkpoints from izmailovpavel/spurious_feature_learning.
    Waterbirds WILDS benchmark (background = land/water spurious attribute, bird species = core attribute).
    Layer4 features specifically (D=2048 after AdaptiveAvgPool2d).
    Linear probe only (sklearn L-BFGS C=1e9) — linear decodability measurement.
    Methods with genuinely different backbones: ERM, SAM, GroupDRO (and DFR contingent on H-P0).
  does_not_apply_to: |
    Other benchmark datasets (CelebA, MultiNLI, CivilComments) — not tested here.
    Non-linear probing (neural network probes) — out of scope for this hypothesis.
    Other model architectures (ViT, DINO) — not covered by available checkpoints.
    Gradient or Hessian-based metrics — prohibited by h-e1 and h-m2 failure records.
    New benchmarks, synthetic data, or human evaluation — rejected by feasibility constraints.
  known_limitations: |
    n=3 seeds underpowered for Cohen's d < 0.8 (one-sided t-test ~55% power at d=0.8).
    Layer4 only — spurious encoding at earlier layers not measured (Phase 1 Gap 3: secondary).
    WGA correlation test uses n=9 checkpoints (small sample for Pearson r significance).
    Cannot distinguish "suppression" from "dilution through feature diversity" — both reduce probe accuracy.
    DFR result contingent on H-P0: if DFR backbone ≠ ERM, interpretation changes.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P0"
    primary: false
    statement: "DFR layer4 features and ERM layer4 features at the same seed are numerically identical (cosine similarity ≥ 0.9999 for all test inputs)"
    test_method: "Load DFR and ERM checkpoints at seed 1/2/3. Extract layer4 features for 50 Waterbirds test images. Compute mean cosine similarity across all feature pairs."
    success_criterion: "Mean cosine similarity ≥ 0.9999 for all 3 seed pairs. Variance < 1e-6."
    falsification: "If cosine similarity < 0.999: DFR checkpoint includes backbone fine-tuning; DFR must be included as independent backbone in H-P1/P2."
    gate: "SANITY_CHECK — must pass before H-P1/P2"

  - id: "P1"
    primary: true
    statement: "GroupDRO ResNet-50 layer4 spurious attribute probe accuracy (background land/water from group_array) is lower than ERM layer4 spurious probe accuracy on full Waterbirds WILDS test set"
    test_method: "For each of 3 seeds: load GroupDRO and ERM checkpoints, extract layer4 features (forward pass only, no gradients), train sklearn LogisticRegression(solver='lbfgs', C=1e9) to predict group_array%2 (background), evaluate probe accuracy. Paired one-sided t-test: GroupDRO < ERM (n=3 pairs)."
    success_criterion: |
      CONFIRMED: p < 0.05 one-sided AND Cohen's d > 0 (direction correct)
      SUGGESTIVE: p < 0.10 one-sided AND Cohen's d > 0.5
      REJECTED: direction wrong (GroupDRO ≥ ERM mean) OR (p ≥ 0.10 AND d < 0.2)
    falsification: "GroupDRO mean spurious probe accuracy ≥ ERM mean spurious probe accuracy (paired t-test one-sided p ≥ 0.05 with d < 0.2 and correct direction is weak evidence at best)."

  - id: "P1b"
    primary: false
    statement: "SAM ResNet-50 layer4 spurious probe accuracy is lower than ERM layer4 spurious probe accuracy (exploratory)"
    test_method: "Same as P1 but for SAM vs ERM. No pre-registered success threshold — report direction and effect size."
    success_criterion: "Exploratory only: report Cohen's d and direction. No pre-registered pass/fail."
    falsification: "N/A — exploratory."

  - id: "P2"
    primary: false
    statement: "Spurious attribute probe accuracy correlates negatively with WGA across 9 distinct-backbone checkpoints (ERM×3 + SAM×3 + GroupDRO×3)"
    test_method: "Compute spurious probe accuracy for all 9 checkpoints. Load WGA values from Izmailov 2022 (or reproduce from checkpoints). Pearson correlation spurious_probe_acc ~ WGA. Bootstrap CI (n=1000 samples) for the correlation coefficient. One-sided p<0.05 for r<0."
    success_criterion: "Pearson r < -0.5 AND bootstrapped 95% CI upper bound < 0 (r is negative throughout CI)."
    falsification: "Pearson r ≥ -0.3 or bootstrap CI includes r ≥ 0."

  - id: "P3"
    primary: false
    statement: "GroupDRO layer4 core attribute probe accuracy (bird species prediction) is ≥ ERM core attribute probe accuracy (preservation check)"
    test_method: "Same feature extraction. Train sklearn probe predicting bird species label (waterbird/landbird) from layer4 features. Compare GroupDRO vs ERM accuracy across 3 seeds (directional check only)."
    success_criterion: "GroupDRO mean core probe accuracy ≥ ERM mean core probe accuracy. No statistical test — directional only."
    falsification: "GroupDRO core probe accuracy < ERM in all 3 seeds (consistent direction of degradation)."

