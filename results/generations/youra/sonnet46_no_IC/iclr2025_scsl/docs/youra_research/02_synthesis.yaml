  datasets: ["Waterbirds WILDS (/home/PrayPrey/.wilds_cache/waterbirds_v1.0)"]
  baselines: ["ERM (positive control, high spurious encoding)", "Random (chance=0.5 for binary background)"]
  probe: "sklearn LogisticRegression(solver='lbfgs', C=1e9, max_iter=1000, random_state=42)"

measurement_plan:
  data_collection:
    - source: "izmailovpavel/spurious_feature_learning: download 12 ResNet-50 checkpoints"
    - source: "Waterbirds WILDS test set at /home/PrayPrey/.wilds_cache/waterbirds_v1.0"
    - source: "group_array from WILDS metadata: background_label = group_array % 2"
  procedure:
    - step: "H-P0: Load ERM and DFR checkpoint pairs (3 seeds). Extract layer4 features for 50 test images. Compute mean cosine similarity. Validate ≥ 0.9999 before proceeding."
    - step: "Feature extraction: for each of 12 checkpoints, model.eval() + torch.no_grad() + forward to layer4 + AdaptiveAvgPool2d(1,1) + flatten → D=2048 feature matrix [N_test × 2048]"
    - step: "Spurious probe (H-P1): sklearn LogisticRegression.fit(features, background_labels). accuracy = probe.score(features, background_labels). Record per-checkpoint."
    - step: "Core probe (H-P3): Same procedure with species label (waterbird/landbird) as target."
    - step: "Statistical tests: paired t-test (scipy.stats.ttest_rel, alternative='less') GroupDRO vs ERM. Cohen's d = (ERM_mean - GroupDRO_mean) / pooled_std. Pearson r (scipy.stats.pearsonr) probe_acc vs WGA across 9 checkpoints."
    - step: "Bootstrap H-P2: resample 9 (probe_acc, WGA) pairs with replacement 1000x, compute r each time, report 95% CI."
  success_criteria:
    - "H-P0: cosine similarity ≥ 0.9999 for all 3 seed pairs"
    - "H-P1 CONFIRMED: t-test p<0.05 one-sided AND Cohen's d > 0 (GroupDRO < ERM direction)"
    - "H-P2: Pearson r < -0.5 AND bootstrapped 95% CI upper bound < 0"
    - "H-P3: GroupDRO mean core probe acc ≥ ERM mean core probe acc"

validation:
  internal_validity:
    - "H-P0 sanity check ensures DFR backbone identity before backbone-level comparisons"
    - "Same probe architecture (sklearn L-BFGS C=1e9) applied identically across all 12 checkpoints"
    - "Full test set used (not sampled) — eliminates batch size noise that doomed h-e1"
    - "Frozen backbone feature extraction (torch.no_grad()) — no gradient computation"
    - "Pre-registered direction (GroupDRO < ERM) prevents post-hoc interpretation"
  external_validity:
    - "Waterbirds is canonical benchmark — results relevant to spurious correlation field"
    - "Layer4 only — generalizability to other layers or models not claimed"
    - "n=3 seeds limits confidence — tiered criteria acknowledge this honestly"
    - "ResNet-50 specific — ViT/DINO results may differ"

