novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First per-method, per-seed spurious attribute linear probe accuracy measurement with pre-registered direction and statistical testing. Mechanistic distinction: backbone-changing (ERM/SAM/GroupDRO) vs backbone-preserving (DFR) robustification methods."
  differentiation_summary: |
    Izmailov 2022 used s-DFR proxy (background as head retraining target) — different task.
    Kirichenko 2022 used WGA — indirect measure. No paper reports layer4 probe accuracy
    per-method per-seed. This is a diagnostic measurement filling a direct gap in the literature.

