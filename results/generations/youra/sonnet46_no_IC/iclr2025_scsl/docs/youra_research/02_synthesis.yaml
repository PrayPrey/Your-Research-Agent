hypothesis_draft:
  title: "Backbone Spurious Encoding Reduction (BSER): GroupDRO Training Reduces Linear Decodability of Spurious Background Attributes in ResNet-50 Layer4 Features"
  hypothesis_id: "H-BSER-v1"
  core_claim: |
    GroupDRO training reduces the linear decodability of spurious background attributes (land/water)
    from ResNet-50 layer4 features compared to ERM training, as measured by sklearn L-BFGS probe
    accuracy on Waterbirds WILDS. DFR, by design, does not change backbone encoding (backbone ≡ ERM).
    Spurious probe accuracy correlates negatively with WGA across 9 distinct-backbone checkpoints.
  mechanism: |
    GroupDRO's worst-group loss upweights minority groups (background-atypical examples), creating
    gradient signal through all backbone layers that reduces the discriminative utility of spurious
    background features. This reduces background linear decodability from layer4 features (D=2048).
    DFR, by contrast, freezes the backbone and retrains only the head — backbone spurious encoding
    is architecturally unchanged. The mechanism predicts: GroupDRO < ERM spurious probe accuracy;
    DFR ≡ ERM spurious probe accuracy.
  predictions:
    - P0: "DFR layer4 features cosine similarity with ERM features ≥ 0.9999 at matching seed (sanity check)"
    - P1: "GroupDRO spurious probe accuracy < ERM spurious probe accuracy (paired t-test p<0.05, n=3)"
    - P2: "Pearson r(spurious_probe_acc, WGA) < -0.5 across 9 distinct-backbone checkpoints (p<0.05 one-sided)"
    - P3: "GroupDRO core probe accuracy (bird species) ≥ ERM core probe accuracy (directional check)"

variables_summary:
  independent: "Training method (ERM/SAM/GroupDRO/DFR) × seed (1/2/3) → 12 checkpoints"
  dependent_primary: "Spurious attribute probe accuracy: sklearn L-BFGS accuracy predicting land/water background (group_array%2) from frozen layer4 features (D=2048), full Waterbirds WILDS test set, range [0,1]"
  controlled: "Probe architecture (sklearn L-BFGS C=1e9), feature layer (layer4 D=2048), test set (full Waterbirds WILDS), checkpoint source (izmailovpavel/spurious_feature_learning)"

