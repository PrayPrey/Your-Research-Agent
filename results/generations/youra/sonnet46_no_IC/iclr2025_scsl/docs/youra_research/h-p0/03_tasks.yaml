    epic: "A-6: Output & Figures"
    title: "Implement save_figures(), save_results(), and main() orchestrator"
    description: |
      Implement output functions in run_experiment.py:
      1. save_figures(results, output_dir):
         - Bar chart: 3 seeds × mean cosine similarity, red dashed line at 0.9999
           save as h-p0/figures/gate_cosine_similarity.png
         - Histogram: per-sample cosine similarity (50 samples per seed, 3 subplots)
           save as h-p0/figures/per_sample_distribution.png
         - PCA scatter (optional): ERM vs DFR features for seed 1
           save as h-p0/figures/pca_feature_scatter.png
      2. save_results(results, gate_passed, probe_acc):
         - Write h-p0/results/similarity_results.json (schema: per_seed, gate_passed, probe_acc)
         - Write h-p0/04_validation.md (markdown report with gate verdict and per-seed table)
      3. main(): orchestrate all steps — load images, loop seeds, compare, gate, probe, save
    feature_tag: "evaluation"
    priority: 78
    source_document: "03_architecture.md"
    complexity: 6
    reference_files:
