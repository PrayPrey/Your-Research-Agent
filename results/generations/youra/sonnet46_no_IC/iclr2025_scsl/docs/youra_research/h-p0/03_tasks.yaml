  - id: "task-005"
    epic: "A-4: Feature Extraction"
    title: "Implement extract_layer4_features() via forward hook"
    description: |
      Implement extract_layer4_features(model, images, device) in run_experiment.py.
      - Register forward hook on model.layer4 to capture [B,2048,7,7] output
      - Forward pass 50 images with torch.no_grad()
      - Remove hook after forward pass
      - Apply AdaptiveAvgPool2d(1,1) → flatten(1) → shape (50,2048)
      Assertions:
        assert feat.shape == (50, 2048)
        assert feat.norm(dim=1).min() > 0  # no zero vectors
    feature_tag: "model"
