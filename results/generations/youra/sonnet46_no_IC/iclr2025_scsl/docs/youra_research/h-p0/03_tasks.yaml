  - id: "task-006"
    epic: "A-5: Similarity + Gate"
    title: "Implement cosine similarity, gate evaluation, and ERM probe"
    description: |
      Implement three functions in run_experiment.py:
      1. compute_cosine_similarity(feat1, feat2):
         - F.cosine_similarity(feat1, feat2, dim=1) → (50,)
         - return {mean: float, variance: float, per_sample: Tensor}
      2. evaluate_gate(results):
         - For each seed: check mean >= 0.9999 AND variance < 1e-6
         - Return bool (all seeds pass)
      3. run_probe(features, background_labels):
         - sklearn LogisticRegression(C=1e9, max_iter=1000, solver='lbfgs', random_state=42)
         - fit on 50 ERM seed1 features, return accuracy (secondary check, > 0.6 expected)
      Log per-seed: "Seed {seed}: mean_cosine_sim={val:.6f}, variance={var:.2e}"
    feature_tag: "evaluation"
    priority: 81
    source_document: "03_architecture.md"
    complexity: 7
    reference_files:
      architecture: "03_architecture.md#Epic-Tasks"
      logic: "03_logic.md#Function-6-compute_cosine_similarity"
      config: "03_config.md#Gate-Thresholds"

