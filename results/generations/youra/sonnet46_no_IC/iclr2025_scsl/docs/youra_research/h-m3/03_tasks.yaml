  - id: A-5
    type: implementation
    title: "Implement statistical analysis: paired_ttest, gate_verdict, sanity checks"
    description: |
      paired_ttest(erm_accs, gdro_accs): scipy.stats.ttest_rel(erm, gdro, alternative='greater'),
      Cohen's d = mean(diff) / std(diff, ddof=1). Returns (p_value, cohens_d).
      gate_verdict(p_value, cohens_d, gdro_mean, erm_mean): direction check first (gdro >= erm → REJECTED),
      then CONFIRMED (p<0.05, d>0), SUGGESTIVE (p<0.10, d>0.5), else REJECTED.
      Sanity checks: assert erm_mean > 0.6, assert all accs in [0.5, 1.0].
      Log all [H-M3] messages per experiment brief.
    priority: 89
    complexity: 8
    reference_files:
