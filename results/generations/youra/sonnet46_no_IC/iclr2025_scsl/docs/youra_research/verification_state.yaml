  id: H-BSER-v1
  statement: 'Under ResNet-50 checkpoints from izmailovpavel/spurious_feature_learning (3 seeds × 4 methods, fully trained
    on Waterbirds WILDS), GroupDRO-trained backbones exhibit significantly lower spurious attribute (background land/water,
    group_array) probe accuracy than ERM-trained backbones, measured by sklearn L-BFGS linear probe on frozen layer4 features
    (D=2048) on the full Waterbirds test set (paired one-sided t-test, p<0.05, n=3 seeds), because GroupDRO''s group-balanced
    worst-group loss forces gradient updates through all layers to reduce reliance on spurious background features.

    '
  title: 'Backbone Spurious Encoding Reduction (BSER): GroupDRO Training Reduces Linear Decodability of Spurious Background
    Attributes in ResNet-50 Layer4 Features'
