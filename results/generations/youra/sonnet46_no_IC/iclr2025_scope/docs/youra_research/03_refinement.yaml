phase2b_readiness:
  status: "READY"
  sh1_existence: |
    erank(W₀) must vary sufficiently across layers (CV > 0.05 within each model family)
    to enable correlation analysis. Preliminary evidence: h-e1 ViT depth variation confirms
    this for ViT; BERT Levene p=0.0001 confirms type-based variation for NLP models.
    The existence sub-hypothesis (H-E1) tests: Pearson r ≥ 0.65 in ≥2/3 families.
  sh2_mechanism: |
    Core mechanism to test: layers with higher erank(W₀) show larger relative adaptation
    magnitude ‖ΔW_opt‖_F/‖W₀‖_F during oracle training (P3, Spearman ρ ≥ 0.5).
    Secondary mechanism: alignment between LoRA update directions and W₀ singular directions
    decreases with erank (high-erank layers → more non-dominated LoRA update directions).
  sh3_comparison: |
    Comparison to AdaLoRA's learned rank allocation (training-time) and IFCLoRA's
    calibration-based allocation (calibration-time). Deferred to Phase 5 — requires
    full training pipeline and multi-task evaluation.
  open_questions:
    - "Does erank generalize to decoder-only LLMs (GPT/LLaMA architecture)?"
    - "Does the erank-truncation criterion (oracle-free) correlate with PARA oracle at comparable r?"
    - "Is the erank-oracle correlation consistent across MNLI and SST-2 (task-agnosticity)?"
    - "What is the minimum training run count needed for a stable marginal oracle (2 seeds sufficient)?"

