# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-erank-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under pre-trained transformer models {BERT-base-uncased, DeBERTa-v3-base, ViT-base-patch16-224}
    with adequate fine-tuning (≥3 epochs NLP on full GLUE MNLI 392k samples; ≥5 epochs ViT on
    CIFAR-10 50k samples), if per-layer effective rank erank(W₀) = exp(H(σ/‖σ‖₁)) of each
    weight matrix W₀ is computed from pre-trained weights (fp32 precision, before any fine-tuning),
    then it demonstrates statistically significant positive Pearson correlation (r ≥ 0.65,
    one-tailed H₁: α > 0) with per-layer marginal PARA oracle ranks (argmax over r ∈ {4,8,16,32,64}
    of validation accuracy, all non-target layers frozen at baseline r=8) across ≥2 of the 3
    model families, because effective rank captures the geometric complexity of each layer's
    pre-training representation — layers with spread-out singular spectra have more non-dominated
    directions and require higher-rank LoRA updates to capture task-relevant signal.
  alternative_hypothesis_h0: |
    There is no significant positive correlation between erank(W₀) and PARA oracle ranks
    (Pearson r ≤ 0 for ≥2/3 model families, or 0 < r < 0.65 for all 3 families).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "erank(W₀) per layer"
      type: "continuous"
      operationalization: |
        For each weight matrix W₀ ∈ {query, key, value, output, intermediate, output_dense}:
        S = torch.linalg.svdvals(W₀.float())
        S = S[S > 1e-10]
        p = S / S.sum()
        erank = torch.exp(-(p * torch.log(p)).sum()).item()
        Range: [1, min(d_in, d_out)]. Computed before any fine-tuning.
  dependent:
    - name: "PARA oracle rank per layer"
      type: "categorical_ordinal"
      operationalization: |
        For each layer l: train LoRA with r_l ∈ {4,8,16,32,64}, all other layers at r=8 (frozen).
        oracle_rank_l = argmax_{r ∈ {4,8,16,32,64}} validation_accuracy(r).
        Training: AdamW lr=2e-5, batch=32, ≥3 epochs MNLI (NLP); AdamW lr=1e-4, batch=128, ≥5 epochs CIFAR-10 (ViT).
      primary: true
    - name: "Pearson r(erank, oracle_rank) per model family"
      type: "continuous"
      operationalization: "scipy.stats.pearsonr over all layers in one model family. Primary test statistic."
      primary: true
    - name: "Fine-tuning performance with erank-proportional ranks"
      type: "continuous"
      operationalization: |
        erank percentile assignment: top-20% → r=64, 20-40% → r=32, 40-60% → r=16,
        60-80% → r=8, bottom-20% → r=4. Total param budget held constant.
        Metric: validation accuracy (MNLI) or top-1 accuracy (CIFAR-10).
      primary: false
  controlled:
    - name: "Model architecture"
      operationalization: "Fixed: BERT-base-uncased, DeBERTa-v3-base, ViT-base-patch16-224 (HuggingFace pretrained)"
    - name: "Baseline rank for non-target layers"
      operationalization: "Fixed at r=8 for all non-target layers in PARA oracle sweep"
    - name: "Training hyperparameters"
      operationalization: "AdamW optimizer, fixed LR per family, fixed batch size, fixed epochs (≥3 NLP, ≥5 ViT)"
    - name: "Numerical precision"
      operationalization: "fp32 for all SVD computations (bf16 inflates erank — h-e1 lesson)"
    - name: "Random seed"
      operationalization: "Fixed seed per run for reproducibility"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: |
        Pre-training via gradient descent on large corpora shapes the singular value distribution
        of each weight matrix. Layers performing complex, distributed transformations (deep FFN,
        cross-modal attention) develop spread-out singular spectra (high erank). Layers performing
        simpler, more redundant transformations (early attention, position encodings) develop
        concentrated singular spectra (low erank).
      evidence: |
        h-e1 data: ViT entropy increases with depth (early 4.27 → late 6.44).
        BERT Levene p=0.0001 for attention vs FFN type grouping.
        Aghajanyan 2021: d_90 varies per layer; pre-training minimizes intrinsic dim.
      falsifier: "If erank shows no layer-type or depth variation in pretrained models (Levene p > 0.05, CV < 0.02 across all layers)"
    - step: 2
      description: |
        High-erank matrices have their singular mass spread across many directions — no dominant
        subspace. When LoRA adds ΔW = BA (rank r), the update must align with task-relevant
        signal that is not already captured by the dominant pre-training directions. In high-erank
        matrices, more orthogonal directions exist, requiring higher rank to capture diverse
        task-relevant signal without redundancy.
      evidence: |
        Theoretical: Dr. Nova's direction argument (Exchange 7) — high erank → non-dominated
        directions → higher rank needed to span task-relevant subspace.
        Indirect: AdaLoRA assigns higher ranks to deeper layers and FFN matrices, consistent
        with higher erank in those regions.
      falsifier: "If LoRA update directions show no relationship to W₀ singular direction spread (alignment study: Spearman ρ < 0.1)"
    - step: 3
      description: |
        The PARA oracle, which independently optimizes rank per layer on the target task, assigns
        higher ranks to the same layers that have high erank — because those layers benefit most
        from high-rank updates (more task-relevant signal to capture). This creates the empirically
        measurable positive Pearson correlation between erank(W₀) and oracle_rank.
      evidence: |
        IFCLoRA 2026: pre-training structure (activation-based) does predict optimal rank before
        training — establishes the structural-predictor premise. erank is purely structural (no
        activation needed), strengthening the task-agnostic claim.
      falsifier: "Pearson r < 0.65 for all 3 model families (primary falsification of P1)"
  key_tension: |
    The Burer-Monteiro non-convex optimization landscape of LoRA means that the optimal rank
    for a layer may depend on training dynamics and task alignment, not just W₀ geometry.
    High-erank layers might learn low-rank updates if the task signal happens to align with
    dominant W₀ singular directions. This tension is resolved empirically by P1.
  evidence_summary: |
    Indirect support: h-e1 ViT depth variation; BERT attention vs FFN Levene significance;
    Aghajanyan 2021 per-layer d_90 variation; LAARA 2026 Fisher-optimal > uniform rank;
    IFCLoRA 2026 structural predictor premise. Direct evidence (P1): pending Phase 4 experiments.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "erank(W₀) shows sufficient variation across layers within each model family (dynamic range > 0.05 CV) to enable correlation analysis"
    supporting_evidence: "h-e1 data: ViT erank variation by depth confirmed; BERT attention vs FFN type differences confirmed (Levene p=0.0001). Erank has wider dynamic range than spectral entropy by construction."
    consequence_if_violated: "Correlation is undetectable regardless of mechanism validity; hypothesis cannot be validated with this metric. Fallback: use participation ratio PR(W₀) or effective rank of layer-normalized matrices."
  - id: "A2"
    assumption: "The marginal PARA oracle (per-layer independent rank sweep, others frozen at r=8) produces stable and meaningful rank assignments (oracle ranks are consistent across random seeds)"
    supporting_evidence: "GLUE benchmarks have sufficient validation set size for stable accuracy estimates; 392k MNLI training samples ensure oracle training is not noise-dominated; AdamW with fixed LR produces consistent results."
    consequence_if_violated: "Oracle ranks are noisy — correlation inflated or deflated by measurement error. Mitigation: run each oracle training with 2 seeds, use mean accuracy for argmax."
  - id: "A3"
    assumption: "The positive direction holds: erank(W₀) positively predicts oracle rank (not negatively)"
    supporting_evidence: "Theoretical derivation (Exchange 7): high-erank → spread singular directions → more non-dominated signal → higher rank needed. AdaLoRA learned allocations: deeper/FFN layers get higher rank, consistent with higher erank in those regions."
    consequence_if_violated: "Pearson r < 0 — direction is inverted. Hypothesis is falsified in its stated form; requires reinterpretation (concentrated layers may need more rank to compensate for poor low-rank approximation)."
  - id: "A4"
    assumption: "erank-oracle correlation generalizes across NLP tasks (task-agnosticity): oracle ranks for MNLI and SST-2 agree at Spearman ρ ≥ 0.7"
    supporting_evidence: "IFCLoRA shows structural predictor generalizes across tasks (their IFC metric is task-class agnostic). Aghajanyan 2021: intrinsic dim partially task-independent (pre-training is the dominant factor)."
    consequence_if_violated: "erank is a task-SPECIFIC predictor, not task-agnostic. Claim scope must be reduced to per-task erank estimation with calibration data (loses zero-data advantage over IFCLoRA)."
  - id: "A5"
    assumption: "erank(W₀) captures the relevant structural property better than spectral entropy H(W₀) (h-e1 failed metric)"
    supporting_evidence: "Theoretical: erank = exp(H(normalized_singular_values)) uses normalized distribution — avoids scale sensitivity. Empirical: spectral entropy CV bounded 0.03-0.08 across pretrained transformers; erank uses ratio of spectral values, providing wider dynamic range."
    consequence_if_violated: "erank shows same ceiling effect as spectral entropy (CV < 0.05 across layers). Fallback: participation ratio PR(W₀) as alternative (DQ5). Consider rank diversity (count of singular values > 1% of max) as tertiary metric."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Pre-trained transformer encoder models (BERT-family, DeBERTa-family)
    - Pre-trained vision transformer models (ViT-family)
    - Classification tasks with standard train/validation splits (GLUE NLU, image classification)
    - LoRA rank selection for full fine-tuning (not quantized, not adapter-only)
    - Weight matrices: attention Q/K/V/O projections, FFN intermediate/output dense layers
    - Model scale: base-scale models (BERT-base, DeBERTa-v3-base, ViT-base ~86M-440M params)
  does_not_apply_to: |
    - Decoder-only LLMs (GPT, LLaMA) — not tested; architectural differences in causal attention
    - Quantized models (4-bit, 8-bit) — SVD precision requirements not met
    - Generation tasks (translation, summarization) — PARA oracle requires classification metric
    - Models fine-tuned before erank computation (erank must be from pretrained W₀, not adapted)
    - Embedding layers and layer normalization (not standard LoRA targets)
  known_limitations: |
    - Marginal oracle ≠ joint-optimal oracle: correlation with marginal oracle does not guarantee
      erank-derived allocation matches globally optimal joint allocation
    - erank is a scalar summary of the full singular value distribution; full spectrum provides
      more information but is less interpretable
    - Oracle sweep requires 5 × n_layers training runs per (model, task) pair: ~15 days on 5×H100
    - Cross-architecture claim (NLP→ViT) tested only on CIFAR-10; may not generalize to other
      vision tasks (detection, segmentation)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: |
      Pearson r(erank(W₀_l), oracle_rank_l) ≥ 0.65 across all layers l within each model
      family, for ≥2 of 3 families {BERT-base, DeBERTa-v3-base, ViT-base}.
    test_method: |
      Compute erank for all weight matrices in W₀ (fp32). Run PARA oracle sweep (r ∈ {4,8,16,32,64},
      all non-target layers at r=8). Compute Pearson r with 95% CI (bootstrap n=1000).
      One-tailed test H₁: r > 0. α = 0.05.
    success_criterion: "r ≥ 0.65 for ≥2/3 families (one-tailed p < 0.05)"
    falsification: "r < 0 for ≥2/3 families (wrong direction) OR 0 < r < 0.65 for all 3 families (signal too weak)"
  - id: "P2"
    primary: false
    statement: |
      erank-proportional rank assignment (percentile mapping to {4,8,16,32,64}) achieves
      validation accuracy within 1% (absolute) of PARA oracle and outperforms uniform r=8 baseline.
    test_method: |
      Assign ranks by erank percentile (top-20%→r=64, ..., bottom-20%→r=4). Train LoRA with
      these ranks (same total parameter budget as uniform r=8). Compare on MNLI validation,
      SST-2 validation, CIFAR-10 test.
    success_criterion: "accuracy(erank-strategy) ≥ accuracy(oracle) - 1% AND accuracy(erank-strategy) > accuracy(uniform-r8)"
    falsification: "accuracy(erank-strategy) < accuracy(uniform-r8) OR gap to oracle > 1%"
  - id: "P3"
    primary: false
    statement: |
      The relative adaptation magnitude ‖ΔW_opt‖_F / ‖W₀‖_F per layer correlates with
      erank(W₀) at Spearman ρ ≥ 0.5 (mechanism check — layers with higher erank show larger
      relative adaptation).
    test_method: |
      After oracle training runs: for each layer l at oracle rank r_l, record ‖ΔW_opt_l‖_F / ‖W₀_l‖_F.
      Compute Spearman ρ with erank(W₀_l). Two-tailed test at α = 0.05.
    success_criterion: "Spearman ρ ≥ 0.5 for ≥2/3 families"
    falsification: "ρ < 0.2 for all families (mechanism: adaptation magnitude decoupled from erank)"
  - id: "P4"
    primary: false
    statement: |
      Levene test on oracle ranks grouped by erank tercile (bottom vs top third) significant
      at p < 0.05 for ≥2/3 model families, using layer-TYPE grouping (attention vs FFN/MLP).
    test_method: |
      Split layers by erank tercile (bottom 33% vs top 33%). Run Levene test on oracle ranks
      in each tercile group. Also run Levene with layer-type grouping (attention vs FFN).
    success_criterion: "Levene p < 0.05 for ≥2/3 families (tercile OR type grouping)"
    falsification: "Levene p > 0.05 for all families in both groupings"
  - id: "P5"
    primary: false
    statement: |
      Participation ratio PR(W₀) = (Σσᵢ)² / Σσᵢ² and erank(W₀) agree in layer ranking at
      Spearman ρ ≥ 0.8 across all layers within each model family.
    test_method: |
      Compute PR(W₀) for all matrices. Compute Spearman ρ(erank, PR) per model family.
    success_criterion: "ρ ≥ 0.8 for all 3 families"
    falsification: "ρ < 0.6 for any family (metrics disagree — choose better predictor)"

