experimental_setup:
  dataset:
    name: "GLUE MNLI + SST-2 (NLP); CIFAR-10 (Vision)"
    type: "standard"
    source: "HuggingFace datasets (glue, cifar10)"
    path: "HuggingFace Hub — no local download required"
    hypothesis_fit: |
      MNLI (392k samples) provides sufficient training data for stable 3-epoch oracle runs.
      SST-2 enables task-agnosticity validation (second NLP task). CIFAR-10 (50k samples)
      provides cross-architecture validation with ViT-base. All are standard classification
      benchmarks with fixed train/validation splits — no custom evaluation needed.
  model:
    name: "BERT-base-uncased, DeBERTa-v3-base, ViT-base-patch16-224"
    type: "pretrained_transformer"
    source: "HuggingFace Hub (bert-base-uncased, microsoft/deberta-v3-base, google/vit-base-patch16-224)"
    hypothesis_fit: |
      Three architecturally distinct models: BERT (encoder, absolute position), DeBERTa (encoder,
      disentangled attention), ViT (vision encoder, patch attention). Testing ≥2/3 families
      validates cross-architecture generalization. All models are base-scale — SVD computation
      feasible in fp32 on CPU.
  baselines:
    - name: "Uniform LoRA r=8"
      method: "Standard LoRA with identical rank r=8 across all layers — current default practice"
    - name: "AdaLoRA (learned allocation)"
      method: "AdaLoRA's training-time SVD-based rank allocation — primary competitor"
    - name: "IFCLoRA-inspired (calibration-based)"
      method: "Activation-based IFC from 128-sample calibration set — closest structural predictor"
    - name: "PARA oracle (upper bound)"
      method: "Per-layer marginal oracle sweep — theoretical upper bound for rank selection quality"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First empirical study measuring Pearson/Spearman correlation between erank(W₀) and
    PARA oracle ranks per layer. First zero-data (no calibration required), task-agnostic,
    static structural predictor for LoRA rank. First cross-architecture (NLP + ViT) evaluation
    of a W₀-based rank predictor.
  key_innovation: |
    erank(W₀) provides zero-cost (single SVD, no training, no calibration data) per-layer
    rank prediction. This is qualitatively different from all prior work: AdaLoRA requires
    full training, IFCLoRA requires calibration forward pass, LAARA requires gradient computation.
    erank requires only the pretrained weights — available before any fine-tuning begins.
  differentiation:
    - prior_work: "AdaLoRA (Zhang et al. 2023) — SVD of ΔW during training"
      difference: "erank uses W₀ (before training) not ΔW (during training). Zero training overhead."
    - prior_work: "IFCLoRA (Zhang et al. 2026) — activation-based IFC from calibration set"
      difference: "erank requires no calibration data — purely structural. Fully task-agnostic."
    - prior_work: "LAARA (Tripathi et al. 2026) — Fisher information from training warmup"
      difference: "erank requires no gradient computation. Applicable at model load time."
    - prior_work: "PiSSA/LoRA-XS — W₀ SVD for initialization"
      difference: "Those methods use SVD components for parameter initialization, not rank selection."
    - prior_work: "Aghajanyan 2021 — intrinsic dimensionality via subspace sweep"
      difference: "erank provides a closed-form zero-shot estimate of intrinsic dimensionality per layer."

