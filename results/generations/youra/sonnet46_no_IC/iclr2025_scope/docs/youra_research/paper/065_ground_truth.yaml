# ============================================================================
# POTENTIAL ADVERSARIAL TARGETS
# ============================================================================

adversarial_targets:
  - issue: "n=5 oracle measurements is very small; r=0.984 may be due to lucky sampling"
    paper_response: "Explicitly acknowledged in Discussion L1 and Results 5.1. The small sample reflects bimodal oracle structure, not noise."
    mitigation: "Full 72-layer coverage planned; bimodal structure is a feature, not a limitation of the analysis"

  - issue: "Layer 3 attention.self.query.weight receives r=4 but has moderate erank — contradicts FFN/attention narrative"
    paper_response: "Paper's layer-type framing is simplified. Query weight erank is not minimal; the correlation story is based on the continuous erank values, not layer-type labels."
    actual_erank_of_query_layer: "~555.7 (from erank_map_bert-base-uncased.json: encoder.layer.3.attention.self.query.weight)"
    oracle_rank: 4
    note: "This is a potential adversarial finding — query layer has moderate erank but low oracle rank, which actually supports the correlation (erank ~555 → oracle 4) not contradicts it"

  - issue: "Global gate FAILED (only 1/3 families evaluated); paper presents results as if hypothesis partially confirmed"
    paper_response: "Paper correctly frames as 'preliminary evidence' and 'PENDING' for multi-family claim. Does not claim gate success."
    verified: true

  - issue: "erank values for BERT range from 543 to 727 — ratio 1.34× is modest; CV ~0.04"
    paper_response: "Acknowledged in Discussion. The CV threshold A1 (CV > 0.05) is not met for BERT/DeBERTa but IS met for ViT (~0.12). The bimodal oracle structure compensates for modest CV in BERT."
    note: "This is a genuine limitation; paper should strengthen the ViT argument"
