# ============================================================================
# KEY CLAIMS AND VERIFICATION STATUS
# ============================================================================

claims:
  - claim: "erank(W₀) correlates with PARA oracle ranks at Pearson r = 0.984 for BERT-base-uncased"
    location: "Abstract, Section 5.1"
    supporting_evidence: "h-e1/results/correlation_bert-base-uncased.json: r=0.9836085"
    verified: true
    caveat: "Based on 5 oracle measurements only; full 72-layer coverage pending"

  - claim: "p = 0.0013 (one-tailed)"
    location: "Abstract, Section 5.1, Table 1"
    supporting_evidence: "h-e1/results/correlation_bert-base-uncased.json: p_one_tailed=0.00126"
    verified: true

  - claim: "FFN intermediate layers receive oracle rank r=64"
    location: "Abstract, Introduction, Results"
    supporting_evidence: "oracle_rank_map: encoder.layer.10.intermediate.dense.weight=64, encoder.layer.8.intermediate.dense.weight=64"
    verified: true
    caveat: "encoder.layer.3.attention.self.query.weight also receives r=4 — paper's layer-type claim is directionally correct but simplified"

  - claim: "Attention output layers receive oracle rank r=4"
    location: "Abstract, Introduction, Results"
    supporting_evidence: "oracle_rank_map: encoder.layer.0.attention.output.dense.weight=4, encoder.layer.6.attention.output.dense.weight=4"
    verified: true

  - claim: "PR(W₀) agrees with erank at ρ = 0.968"
    location: "Introduction, Results 5.2"
    supporting_evidence: "correlation_bert-base-uncased.json: pr_r=0.96783"
    verified: true

  - claim: "ViT erank range ratio 2.97×"
    location: "Abstract, Results Table 2"
    supporting_evidence: "erank_map_google-vit-base-patch16-224.json: 244.4–727.2"
    verified: true

  - claim: "Multi-family hypothesis (≥2/3 families) confirmed"
    location: "NOT CLAIMED — paper correctly marks as PENDING"
    verified: true  # Paper correctly acknowledges this is unmet

