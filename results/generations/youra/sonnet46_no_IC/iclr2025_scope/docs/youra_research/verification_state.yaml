main_hypothesis:
  id: H-erank-v1
  title: 'Effective Rank as Zero-Shot LoRA Rank Predictor: erank(W₀) Correlation with PARA Oracle Ranks'
  statement: 'Under pre-trained transformer models {BERT-base-uncased, DeBERTa-v3-base, ViT-base-patch16-224} with adequate
    fine-tuning (≥3 epochs NLP on full GLUE MNLI 392k samples; ≥5 epochs ViT on CIFAR-10 50k samples), if per-layer effective
    rank erank(W₀) = exp(H(σ/‖σ‖₁)) of each weight matrix W₀ is computed from pre-trained weights (fp32 precision, before
    any fine-tuning), then it demonstrates statistically significant positive Pearson correlation (r ≥ 0.65, one-tailed H₁:
    α > 0) with per-layer marginal PARA oracle ranks (argmax over r ∈ {4,8,16,32,64} of validation accuracy, all non-target
    layers frozen at baseline r=8) across ≥2 of the 3 model families, because effective rank captures the geometric complexity
    of each layer''s pre-training representation.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: GLUE MNLI (392k train), GLUE SST-2 (67k train), CIFAR-10 (50k train)
    model: BERT-base-uncased, DeBERTa-v3-base, ViT-base-patch16-224
    optimizer: AdamW (lr=2e-5 NLP, lr=1e-4 ViT)
    hyperparameters:
      baseline_rank: 8
      epochs_nlp: 3
      epochs_vit: 5
      batch_size_nlp: 32
      batch_size_vit: 128
      svd_precision: fp32
      oracle_seeds: 2
