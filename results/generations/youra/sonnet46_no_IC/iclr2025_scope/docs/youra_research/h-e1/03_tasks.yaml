    description: |
      Implement erank.py: compute_erank() + compute_erank_map() + save/load.
      compute_erank(W, eps=1e-10): W.float() → torch.linalg.svdvals(W) → filter S > eps →
        p = S / S.sum() → H = -(p * p.log()).sum() → exp(H).item().
      compute_erank_map(model_name): load pretrained AutoModel (base, no task head);
        iterate named_parameters(); skip non-2D / 'embed' / 'norm' layers;
        return {param_name: erank_value}. Expected: ≥60 entries per model.
      save_erank_map(erank_map, path): JSON dump.
      load_erank_map(path): JSON load.
      Note: use AutoModel (not AutoModelForSequenceClassification) for erank — no task head needed.
