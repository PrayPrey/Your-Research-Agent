        - Gate result (PASS/DOCUMENT) at top
        - Table: mean±std accuracy per task + overall for both methods
        - t-statistic, p-value, Cohen's d, % pairs positive
        - Figure references
        - Conclusion sentence
    feature_tag: "experiment"
    priority: 38
    source_document: "03_logic.md"
