  - id: "task-015"
    epic: "A-8: Main Runner"
    title: "L-8-2: Implement result serialization and 04_validation.md generation"
    description: |
      In run_hm3.py:
      _save_results(results, out_path): serialize to hm3_results.json
        schema: {metadata: {...}, statistics: {...}, pairs: [...]}
        See 03_logic.md#L-8-2 for full JSON schema.
