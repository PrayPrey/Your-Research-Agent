  - id: "task-012"
    epic: "A-2"
    title: "L-2-1: vit_checkpoint_to_graph — layer node extraction"
    description: |
      Implement layer-level node extraction for ViT checkpoints.
      Each layer (attention sublayer, FF layer) → one node with 4-dim feature vector [mean, std, l2_norm, max_abs].
      Key: node_in_dim MUST be 4 to match H-E1 EquiSSLEncoder.
