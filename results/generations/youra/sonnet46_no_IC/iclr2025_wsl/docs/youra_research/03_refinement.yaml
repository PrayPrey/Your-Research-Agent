experimental_setup:
  dataset:
    name: "SANE MultiZoo (training) + ViT Model Zoo (held-out test)"
    type: "standard"
    source: "SANE MultiZoo: github.com/HSG-AIML/MultiZoo-SANE (public). ViT Model Zoo: arXiv 2504.10231 (public)."
    path: "Training: HSG-AIML/MultiZoo-SANE dataset (~30k MLP+CNN models). Test: ViT Model Zoo (250 ViT models)."
    hypothesis_fit: "MultiZoo provides the diverse MLP+CNN training distribution that EquiSSL generalizes from. ViT zoo provides architecturally held-out test models — no ViT data in training. Both have existing accuracy labels. No new benchmarks or annotation required."
  model:
    name: "EquiSSL: ScaleGMN Encoder + Graph Decoder + Contrastive Autoencoder"
    type: "Equivariant graph neural network with contrastive autoencoder training"
    source: "ScaleGMN: github.com/jkalogero/scalegmn (public). Neural-graphs (hierarchical ViT formulation): github.com/mkofinas/neural-graphs (public). SANE training framework: github.com/HSG-AIML/SANE (public)."
    hypothesis_fit: "ScaleGMN's monomial group equivariant encoder directly tests the symmetry hypothesis. Graph decoder enables P3 (latent interpolation). Composable from existing codebases."
  baselines:
    - name: "SANE (non-equivariant SSL)"
      method: "Transformer flat chunk tokenizer + masked weight modeling + linear probe. Trained on same MLP+CNN MultiZoo data."
    - name: "EquiSSL-perm (permutation-only equivariant SSL)"
      method: "Neural-graphs GNN encoder + contrastive autoencoder training. Uses same training objective as EquiSSL but permutation-only equivariance (no scale). Ablates scale equivariance contribution."
    - name: "ScaleGMN-supervised (equivariant supervised)"
      method: "ScaleGMN with supervised property labels. Upper bound for equivariant encoder performance (no SSL, full labels). Trained on ViT zoo with 10% supervision for cross-arch upper bound."

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "First method combining scale+permutation equivariant encoding with SSL training objectives for weight-space representation learning, demonstrating cross-architecture generalization to architecturally held-out model families (ViT zoo)."
  key_innovation: "EquiSSL unifies two previously separate research tracks: (1) equivariant weight-space architectures (ScaleGMN, NFN, neural-graphs) and (2) SSL on weight populations (SANE, hyper-representations). The computational graph as universal weight-space coordinate system enables this unification."
  differentiation:
    - prior_work: "SANE (Schürholt et al. 2024 ICML)"
      difference: "SANE uses flat chunk tokenization (architecture-specific) and permutation augmentation (approximate invariance). EquiSSL uses computational graph (architecture-agnostic) and monomial-group equivariant encoder (exact invariance by construction). First SSL method with provable symmetry guarantees."
    - prior_work: "ScaleGMN (Kalogeropoulos et al. 2024 NeurIPS Oral)"
      difference: "ScaleGMN is supervised — requires property labels for training. EquiSSL trains without labels using SSL objectives, enabling application to unlabeled model zoos (e.g., all of Hugging Face)."
    - prior_work: "Neural-graphs (Kofinas et al. 2024 ICLR Oral)"
      difference: "Neural-graphs demonstrates cross-architecture supervised transfer. EquiSSL demonstrates cross-architecture SSL transfer — no labels required for the new architecture family."
    - prior_work: "Ballerini et al. 2025 (NeRF domain SSL)"
      difference: "Ballerini shows SSL cross-arch transfer for NeRFs specifically. EquiSSL targets general model architectures (MLPs, CNNs, ViTs) — the domain-independent case."

