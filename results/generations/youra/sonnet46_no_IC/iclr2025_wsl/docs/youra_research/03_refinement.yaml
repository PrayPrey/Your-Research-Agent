    - claim: "Scale+permutation equivariant architectures (ScaleGMN) outperform permutation-only methods on property prediction within the same supervised setting"
      status: "BUILD_ON"
      evidence: "Kalogeropoulos et al. 2024 NeurIPS Oral (ScaleGMN R²=0.91 vs NFN R²=0.84 on MLP zoo)"
    - claim: "SSL on weight populations (SANE, hyper-representations) produces useful property prediction representations from unlabeled model zoos"
      status: "BUILD_ON"
      evidence: "Schürholt et al. 2021 NeurIPS (R²=0.89 on MNIST zoo), Schürholt et al. 2024 ICML (R²=0.72 on heterogeneous zoo)"
    - claim: "No existing method combines SSL training objectives with scale+permutation equivariant encoders"
      status: "PROVE_NEW"
      evidence: "Phase 1 literature review cross-reference matrix: ScaleGMN=equivariant+supervised, SANE=SSL+non-equivariant; intersection is empty"
    - claim: "SSL weight representations generalize to held-out general model architectures (MLPs/CNNs to ViTs)"
      status: "PROVE_NEW"
      evidence: "Ballerini 2025 shows SSL cross-arch transfer for NeRFs only; no work tests on ViT zoo"
    - claim: "Computational graph representation provides architecture-agnostic node/edge semantics (attention layers = MLP subgraphs)"
      status: "BUILD_ON"
