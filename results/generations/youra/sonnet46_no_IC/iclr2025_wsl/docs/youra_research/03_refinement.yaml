# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EquiSSL-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the weight-space SSL setting using existing MLP+CNN model zoo checkpoints (SANE MultiZoo),
    if a scale+permutation equivariant graph encoder (ScaleGMN backbone with hierarchical representation
    for block-structured architectures) is trained with a contrastive autoencoder objective using
    scale/permutation augmented positive pairs,
    then the learned representations will achieve property prediction R² on a held-out ViT Model Zoo
    (no ViT training data) that is at least 0.10 above SANE baseline trained on the same data,
    because the computational graph representation eliminates architectural distribution shift
    while scale equivariance normalizes weight magnitude variation across architectures.
  alternative_hypothesis_h0: |
    There is no significant difference in held-out ViT zoo property prediction R² between EquiSSL
    (scale+perm equivariant contrastive autoencoder) and SANE (non-equivariant SSL autoencoder)
    when both are trained on the same MLP+CNN zoo data (delta R² < 0.05).

