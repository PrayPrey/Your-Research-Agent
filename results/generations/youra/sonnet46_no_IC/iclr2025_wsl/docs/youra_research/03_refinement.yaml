# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Computational graph representation eliminates architectural distribution shift. Every feedforward architecture (MLP, CNN, ViT) is represented as a directed graph where nodes are neurons and edges are scalar weights. A ViT attention layer (Q/K/V projections) is a set of linear layers — structurally identical to MLP layers at the edge/node level. SANE's flat tokenizer sees different weight tensor shapes; the graph encoder sees the same node/edge schema regardless of architecture."
      evidence: "Kofinas et al. 2024 ICLR Oral: zero-shot MLP→CNN transfer using graph representation achieves R²=0.71 (vs baseline 0.59). Schürholt et al. 2021: hyper-representations without graph structure fail to generalize even across minor distribution shifts."
      falsifier: "If MMD(EquiSSL train→test) ≈ MMD(SANE train→test) (ratio < 1.5), the distribution shift elimination mechanism is disconfirmed"
    - step: 2
      description: "Monomial group (scale+permutation) equivariant message passing maps functionally equivalent networks to related latent codes. If network A and network B are related by a neuron scaling transformation (incoming weights ×α, outgoing ×1/α), ScaleGMN's encoder guarantees f(scale(A)) = scale(f(A)). The contrastive pooling layer projects these to the same invariant representation. SANE's flat tokenizer maps scaled and unscaled networks to different representations, conflating functional equivalents."
      evidence: "Kalogeropoulos et al. 2024 NeurIPS Oral: ScaleGMN ablation removing scale equivariance drops R² by 8-12 points on same-architecture evaluation. This effect should amplify under cross-architecture conditions."
      falsifier: "If EquiSSL-perm (permutation-only) achieves same R² as EquiSSL (scale+perm) on ViT zoo, scale equivariance is not causally necessary — permutation alone suffices"
    - step: 3
      description: "Contrastive autoencoder training with scale/perm positive pairs produces discriminative latent space that separates functionally distinct networks while clustering equivalent ones. NT-Xent contrastive loss on z penalizes distinct networks mapping to similar latent codes. Reconstruction loss (MSE on weight chunks) ensures z retains sufficient information to decode back to functional weights. Together, these objectives create a latent space that is both compact (similar models cluster) and faithful (decoded models are functional)."
      evidence: "Vision SSL analogue: MAE + contrastive hybrid (I-JEPA, Assran et al. 2023) achieves better transfer than either objective alone. Schürholt et al. 2022 NeurIPS: pure reconstruction on weight zoo enables property prediction and generation — adding contrastive objective should improve discriminativity."
      falsifier: "If pure contrastive (no reconstruction) achieves same held-out R² as contrastive autoencoder, the reconstruction component is unnecessary — simplify to SimCLR-style"
    - step: 4
      description: "Generalization to ViT zoo: EquiSSL encoder trained on MLP+CNN zoo, when applied to ViT checkpoints, produces latent codes z that contain property-predictive information despite no ViT training data. Mechanism: graph representation generalizes (Step 1), scale equivariance handles scaling variation in attention weights (Step 2), and contrastive training has learned to encode model quality into z from diverse zoo experience (Step 3). Linear probe on frozen z achieves meaningful R² on ViT zoo."
      evidence: "Ballerini et al. 2025: SSL cross-architecture transfer works for NeRF domain (contrastive SSL on diverse NeRF architectures → unseen architectures). General-model cross-architecture SSL is the untested analogous case."
      falsifier: "If linear probe on EquiSSL z achieves R² < 0.50 on ViT zoo (chance level for accuracy prediction), the full causal chain fails"
  key_tension: "Scale equivariance contribution vs permutation-only: the ablation (Step 2 falsifier) is the most critical empirical question. If permutation-only (neural-graphs+contrastive) achieves equivalent R² on ViT zoo, the scale equivariance contribution is methodologically interesting but not empirically necessary for the transfer result."
  evidence_summary: |
    The causal chain rests on three empirically supported components: (1) graph representation for architecture-agnostic processing (Kofinas 2024, direct evidence), (2) scale equivariance for parametrization-independent representations (Kalogeropoulos 2024, indirect evidence for SSL setting), and (3) contrastive autoencoder training for discriminative generative latent space (Schürholt 2022 for weight space, Assran 2023 for vision analogue). The combination has not been tested; each component individually has supporting evidence.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The computational graph representation (node=neuron, edge=weight) provides genuinely architecture-agnostic node/edge semantics — ViT attention projections have the same structural role as MLP weight matrices in the graph"
    supporting_evidence: "Kofinas et al. 2024 ICLR Oral: zero-shot MLP→CNN transfer demonstrates the graph schema works across architecture families. ViT attention projections are linear layers — same graph-schema mapping."
    consequence_if_violated: "If ViT attention weights have fundamentally different graph semantics (e.g., positional encodings break the node/edge analogy), the distribution shift elimination mechanism fails and EquiSSL won't generalize to ViTs"
  - id: "A2"
    assumption: "Scale equivariance contributes meaningfully beyond permutation equivariance for cross-architecture transfer — the scaling symmetry of attention weights is empirically similar to the scaling symmetry of MLP weights"
    supporting_evidence: "Kalogeropoulos et al. 2024: 8-12 R² improvement from scale equivariance in supervised same-architecture setting. Cross-architecture setting should amplify this."
    consequence_if_violated: "If scale equivariance doesn't improve cross-architecture R², the paper's core technical contribution (the scale+perm unification) is reduced to an engineering choice rather than a scientific finding"
  - id: "A3"
    assumption: "The ViT Model Zoo (250 models, arXiv 2504.10231) has sufficient diversity and property labels to serve as a valid held-out test bed with meaningful R² evaluation"
    supporting_evidence: "The zoo paper reports it includes ViTs trained on multiple tasks with accuracy labels. 250 models with varying accuracy provides sufficient range for R² evaluation (analogous to MNIST zoo at 50k models but smaller)."
    consequence_if_violated: "If the ViT zoo is too small (< 100 models), R² estimates will have high variance and statistical significance will be hard to establish. May need to supplement with additional ViT checkpoints from Hugging Face (still existing data)."
  - id: "A4"
    assumption: "The SANE MultiZoo training data (MLP+CNN, ~30k models) provides sufficient diversity for SSL pre-training that generalizes to ViT architecture"
    supporting_evidence: "Impact of Model Zoo Size and Composition on WSL (arXiv 2504.10141): dataset diversity is a strong predictor of cross-arch performance. MLP+CNN zoo covers diverse tasks and hyperparameters — this may be sufficient."
    consequence_if_violated: "If zoo diversity is insufficient, EquiSSL will also fail to generalize — ruling out the hypothesis but not necessarily the general EquiSSL approach (training on larger zoo could recover performance)"
  - id: "A5"
    assumption: "The contrastive autoencoder training with λ=0.1-1.0 (reconstruction weight) converges stably and the two objectives (contrastive + reconstruction) do not conflict"
    supporting_evidence: "Vision SSL analogues (I-JEPA, BEiT-style) demonstrate contrastive+reconstruction objectives coexist stably. Weight-space autoencoders (Schürholt 2022) converge with pure reconstruction. No known reason for conflict."
    consequence_if_violated: "If the two objectives conflict (encoder specializes for one task and degrades on the other), the hybrid architecture collapses. Mitigation: λ sweep over 4 values to identify stable training regime."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Feedforward neural networks representable as directed computational graphs: MLPs, CNNs, ViTs (up to ~1B parameters).
    Property prediction tasks with existing accuracy labels from model zoo construction.
    Model editing tasks (interpolation) within the same task domain as training zoo.
    Evaluation using existing public model zoo datasets and benchmarks.
  does_not_apply_to: |
    LLM-scale models (7B+ parameters): full-graph message passing is computationally infeasible at this scale; hierarchical approximations needed.
    Recurrent networks (RNNs, LSTMs): the computational graph formalism handles feedforward connections; recurrent edges require extension.
    Generative models (diffusion, VAE) of novel architectures: not evaluated in the proposed experiments.
    Tasks requiring new benchmarks, synthetic data, or human annotation.
  known_limitations: |
    ViT Model Zoo (250 models) is small — R² estimates may have higher variance than MLP zoo (50k models).
    LLM-scale generalization is not tested and may require different approaches.
    Model editing (P3) is tested only for same-task interpolation; cross-task editing (task arithmetic) requires additional experiments not included here.
    λ hyperparameter adds one tunable dimension; results may be λ-sensitive.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "EquiSSL (ScaleGMN encoder + contrastive autoencoder, trained on MLP+CNN zoo) achieves property prediction R² on the held-out ViT Model Zoo (250 ViT models, no ViT training data) at least 0.10 above SANE baseline trained on the same data."
    test_method: "Train EquiSSL and SANE on SANE MultiZoo (MLP+CNN). Apply frozen encoder to ViT Model Zoo. Train linear probe. Measure R² for accuracy prediction. Report mean ± std over 5 random seeds."
    success_criterion: "R²(EquiSSL, ViT zoo) - R²(SANE, ViT zoo) ≥ 0.10, with p < 0.05 by paired t-test across seeds"
    falsification: "If R²(EquiSSL) - R²(SANE) < 0.05 on ViT zoo (within noise), P1 is disconfirmed — equivariant SSL does not outperform non-equivariant SSL for cross-architecture transfer"
  - id: "P2"
    primary: false
    statement: "The maximum mean discrepancy (MMD) between training (MLP+CNN) and test (ViT) latent distributions is at least 2x smaller for EquiSSL than for SANE, indicating reduced architectural distribution shift."
    test_method: "Compute latent representations for all MLP+CNN training models and all 250 ViT test models using each encoder. Compute MMD with RBF kernel (bandwidth σ = median heuristic). Report MMD ratio."
    success_criterion: "MMD(SANE, MLP+CNN→ViT) / MMD(EquiSSL, MLP+CNN→ViT) ≥ 2.0"
    falsification: "If MMD ratio < 1.5, the computational graph is not reducing distribution shift as theorized — alternative mechanism explanation needed"
  - id: "P3"
    primary: false
    statement: "Latent-space linear interpolation via EquiSSL (decode midpoint z = (z_A + z_B)/2 back to weights using graph decoder) achieves higher task accuracy than naive weight-space averaging ((θ_A + θ_B)/2), averaged over 100 random MLP pairs from the zoo."
    test_method: "Sample 100 pairs of MLP checkpoints from the training zoo (same task). For each pair: compute weight average and latent interpolation. Evaluate both on the task benchmark. Report mean accuracy difference (latent - weight) ± std."
    success_criterion: "Mean accuracy(latent interpolation) > mean accuracy(weight average), p < 0.05 by paired t-test over 100 pairs"
    falsification: "If latent interpolation accuracy ≤ weight-space averaging on the majority of pairs, P3 is disconfirmed — the latent space is not organizing models by functional behavior"

