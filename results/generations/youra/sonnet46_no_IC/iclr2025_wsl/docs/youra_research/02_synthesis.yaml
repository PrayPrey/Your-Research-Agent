hypothesis_draft:
  title: "EquiSSL: Scale+Permutation Equivariant Self-Supervised Learning for Cross-Architecture Weight Representations"
  hypothesis_id: "H-EquiSSL-v1"
  core_claim: |
    A scale+permutation equivariant graph encoder trained with contrastive autoencoder SSL
    on diverse MLP+CNN model zoo data will produce weight-space representations that generalize
    zero-shot to held-out ViT architectures (no ViT training data), achieving property prediction
    R² at least 0.10 above the SANE non-equivariant SSL baseline.
  mechanism: |
    Step 1: Computational graph representation (node=neuron, edge=weight) provides architecture-
    agnostic semantics — ViT attention projections are represented with the same node/edge schema
    as MLP layers, eliminating the architectural distribution shift that causes flat tokenizers
    (SANE) to fail on novel architectures.
    Step 2: Monomial group (scale+permutation) equivariant message passing maps functionally
    equivalent networks (related by neuron rescaling) to the same invariant latent representation,
    where SANE's flat tokenizer conflates distinct representations.
    Step 3: Contrastive autoencoder training with scale/permutation augmented positive pairs
    creates a discriminative latent space that separates networks by function while enabling
    reconstruction (necessary for latent-space model interpolation).
  predictions:
    - P1: "EquiSSL R² on ViT zoo ≥ SANE R² + 0.10 (held-out, no ViT training data)"
    - P2: "MMD distribution shift ratio (SANE/EquiSSL) ≥ 2.0 — direct mechanism evidence"
    - P3: "Latent-space interpolation accuracy > weight-space averaging on 100 MLP pairs (p < 0.05)"

variables_summary:
  independent: "Encoder symmetry type (scale+perm / perm-only / none) × SSL training objective (contrastive autoencoder / pure reconstruction)"
  dependent_primary: "Property prediction R² on held-out ViT Model Zoo (250 models, no ViT training data)"
  controlled: "Training data (SANE MultiZoo MLP+CNN), evaluation protocol (linear probe, same split), held-out test (ViT Model Zoo arXiv 2504.10231)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in held-out ViT zoo property prediction R² between
    EquiSSL (scale+perm equivariant contrastive autoencoder) and SANE (non-equivariant SSL
    autoencoder) when both are trained on the same MLP+CNN data (delta R² < 0.05).
  statistical_test: "Paired t-test over 5 random seeds, comparing R² per seed"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First unification of scale+permutation equivariant weight-space encoder (ScaleGMN) with SSL training objectives (contrastive autoencoder), enabling zero-shot cross-architecture transfer to architecturally held-out model families."
  differentiation_summary: |
    EquiSSL closes the gap between two mature but isolated research tracks:
    - Equivariant architectures (ScaleGMN, NFN, neural-graphs): exact symmetry enforcement, supervised setting only
    - SSL on weight populations (SANE, hyper-representations): scalable unsupervised learning, non-equivariant
    No existing work sits at the intersection. The key novelty is demonstrating that this intersection
    enables a capability neither track alone provides: zero-shot cross-architecture SSL transfer.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "EquiSSL (ScaleGMN encoder + graph decoder + contrastive autoencoder) — proposed method"
    - "SANE (flat tokenizer + masked weight modeling) — primary non-equivariant SSL baseline"
    - "EquiSSL-perm (neural-graphs encoder + contrastive autoencoder) — permutation-only ablation"
    - "ScaleGMN-supervised (10% ViT labels) — supervised equivariant upper bound"
  datasets:
    - "SANE MultiZoo (MLP+CNN, ~30k models) — training data, public"
    - "ViT Model Zoo (250 ViT models, arXiv 2504.10231) — held-out test, public"
    - "Hyper-representations MNIST zoo (50k MLPs, NeurIPS 2021) — additional same-arch evaluation"
  baselines:
    - "SANE trained on MLP+CNN MultiZoo (primary baseline, same training data as EquiSSL)"
    - "SANE trained on MLP+CNN+ViT (diversity control: EquiSSL without ViT must beat SANE with ViT)"
    - "EquiSSL-perm (permutation-only): isolates scale equivariance contribution"
    - "Weight-space averaging (git-re-basin): model editing baseline for P3"

measurement_plan:
  data_collection:
    - source: "SANE MultiZoo dataset: download from github.com/HSG-AIML/MultiZoo-SANE (~30k MLP+CNN checkpoints with accuracy labels)"
    - source: "ViT Model Zoo: download from arXiv 2504.10231 supplementary (250 ViT checkpoints with accuracy labels)"
    - source: "Hyper-representations NeurIPS 2021 MNIST zoo (optional, for same-arch evaluation)"
  procedure:
    - step: "Pilot: Run SANE inference on ViT zoo, train linear probe, measure R² — calibrate success threshold (1-2 hours)"
    - step: "Training: Train EquiSSL (ScaleGMN encoder + contrastive autoencoder) on SANE MultiZoo. λ sweep: {0.01, 0.1, 1.0, 10.0}. 5 random seeds. (~48-72h A100)"
    - step: "Training: Train SANE baseline on same SANE MultiZoo data (existing codebase, existing checkpoints may be available)"
    - step: "Training: Train EquiSSL-perm (neural-graphs + contrastive) on same data — ablation (similar compute)"
    - step: "Evaluation P1: Linear probe on frozen z for ViT zoo accuracy prediction. Report R² for all methods."
    - step: "Evaluation P2: Compute MMD(train→ViT) for SANE and EquiSSL latent spaces. Report ratio."
    - step: "Evaluation P3: Sample 100 MLP pairs from training zoo. Compute latent interpolation via graph decoder. Compare to weight-space averaging."
  success_criteria:
    - "P1: R²(EquiSSL, ViT zoo) - R²(SANE, ViT zoo) ≥ 0.10, p < 0.05"
    - "P2: MMD ratio (SANE/EquiSSL) ≥ 2.0"
    - "P3: Latent interpolation accuracy > weight average accuracy, p < 0.05 over 100 pairs"

validation:
  internal_validity:
    - "Randomized seeds (5 runs) for statistical reliability of R² estimates"
    - "Pre-registered pilot (SANE-ViT baseline) before full training to prevent post-hoc threshold adjustment"
    - "Ablation ladder (SANE → EquiSSL-perm → EquiSSL) disentangles component contributions"
    - "λ sweep reported transparently — no cherry-picking of single λ value"
  external_validity:
    - "ViT zoo as held-out test covers the most common modern architecture type not in training"
    - "Future work: test on CNN zoo held out, NeRF zoo (Ballerini comparison), and Hugging Face Hub checkpoints"
    - "Feasibility constraints: all experiments use existing public datasets and benchmarks — results are reproducible"

discussion_synthesis:
  key_insights:
    - "The gap between equivariant and SSL weight-space methods is not technical but strategic — nobody has attempted the combination because the two communities have been working independently"
    - "Computational graph representation is the key enabler for architecture-agnostic SSL — it's not primarily about equivariance but about representation format"
    - "Scale equivariance's contribution may be smaller than expected for cross-architecture transfer (Prof. Rex's challenge was well-founded); the ablation will clarify this"
    - "The pilot experiment (SANE on ViT zoo) is the most important first step — it calibrates the entire hypothesis before committing compute"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Identifying that 'necessity' of scale equivariance is unprovable without exhaustive comparison — shifted to comparative effectiveness claim"
    - "Exchange 7 (Dr. Nova): MMD distribution shift as mechanistic evidence — changed from pure 'better accuracy' to mechanistic explanation with direct measurement"
    - "Exchange 9 (Prof. Pax): Hierarchical graph representation for ViT feasibility — resolved the compute barrier for ViT-scale models"
    - "Exchange 12 (Dr. Ally): Using neural-graphs as permutation-only ablation baseline — avoided costly ScaleGMN architecture modification"
  resolved_tensions:
    - "Necessity vs sufficiency (Exchanges 5-6): resolved to comparative effectiveness — EquiSSL is claimed to be superior, not uniquely necessary"
    - "Masked modeling vs contrastive SSL (Exchange 3): resolved to contrastive autoencoder — combines discriminative and generative objectives"
    - "ViT-scale feasibility (Exchange 9): resolved by hierarchical graph representation from neural-graphs formulation"
    - "Scale ablation implementation (Exchanges 11-12): resolved by using neural-graphs as existing perm-only baseline"
