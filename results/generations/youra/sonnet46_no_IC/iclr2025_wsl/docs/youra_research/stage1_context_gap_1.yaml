gap_id: "gap_1"
gap_title: "Unified Symmetry-Complete SSL Framework for Weight Spaces"
gap_description: |
  No existing method combines SSL training objectives with scale+permutation equivariant
  encoders trained on model zoo checkpoints. SSL methods (SANE, hyper-representations) ignore
  scaling symmetry. ScaleGMN enforces both symmetries but is supervised only. The union required
  by the research question has not been instantiated.
