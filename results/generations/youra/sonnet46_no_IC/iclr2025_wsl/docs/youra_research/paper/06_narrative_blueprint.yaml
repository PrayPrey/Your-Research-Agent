narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion callback?"
    status: "YES — hook: 'coordinate system not symmetry group'; conclusion closes the loop"

  - check: "Does each section naturally flow to the next?"
    status: >
      YES: Intro (problem) → Related (insufficient prior work) →
      Method (graph encoding solution) → Experiments (test design) →
      Results (evidence) → Discussion (interpretation + limits) → Conclusion (close)

  - check: "Is key insight consistently emphasized?"
    status: "YES — graph schema as universal coordinate system threads through all sections"

  - check: "Are all major claims supported by evidence?"
    status: >
      YES: Claim 1 (R² improvement) → h-m1 evidence;
      Claim 2 (scale reversal) → h-m2 evidence;
      Claim 3 (SANE collapse) → h-e1 evidence;
      Negative result → h-m3 evidence

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "PENDING — Abstract written last in Step 5"

