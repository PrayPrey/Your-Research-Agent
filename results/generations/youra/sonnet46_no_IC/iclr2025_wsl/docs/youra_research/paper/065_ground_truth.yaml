    improvements:
      equissl_vs_sane_absolute: 0.13766  # 0.210 - 0.072
      equissl_perm_vs_sane_absolute: 0.15836  # 0.231 - 0.072
      equissl_perm_vs_sane_relative_percent: 219.5  # +219% improvement
