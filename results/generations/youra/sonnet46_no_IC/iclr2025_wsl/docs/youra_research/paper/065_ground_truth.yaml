  interpolation_metric:
    name: "Latent interpolation vs weight-space averaging"
    n_pairs: 501
    source: "h-m3/experiment_results.json"

    results:
      mean_acc_latent: 0.1
      mean_acc_ws: 0.12516027944111777
      mean_delta: -0.02516027944111776
      std_delta: 0.022944369917257623
      t_stat: -24.52021797334851
      p_value: 9.012338860513386e-88
      cohen_d: -1.0965774842303881
      pct_pairs_positive: 0.09381237524950099  # 9.4% latent better than ws
      gate_pass: false

# ============================================================
# HYPERPARAMETERS — validated optimal configuration (h-m1)
# ============================================================

methodology:
  primary_method: "EquiSSL-perm (neural-graphs, permutation equivariant)"
  baseline_method: "SANE with VICReg fix"
  ablation_method: "EquiSSL (ScaleGMN, scale+permutation)"

  key_hyperparameters:
    encoder_type: "neural-graphs (permutation equivariant)"
    hidden_dim: 256
    latent_dim: 128
    num_layers: 4
    symmetry_group: "permutation"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    batch_size: 64
    epochs: 100
    temperature: 0.07  # NT-Xent temperature
    lambda_rec: 0.1   # MSE reconstruction weight
    scheduler: "CosineAnnealingLR"
    T_max: 100
    eta_min: 1.0e-5

  sane_baseline:
    vicregfix: true
    variance_weight: 0.1  # VICReg: 0.1 * relu(1 - z_std).mean()
    note: "VICReg required to prevent SANE latent collapse on cross-arch inputs"

  graph_encoding:
    node_in_dim: 4  # [bias_mean, bias_std, bias_min, bias_max]
    edge_in_dim: 4  # [weight_mean, weight_std, weight_min, weight_max]

  augmentation:
    perm_augment: true
    scale_augment: false  # CRITICAL: not used for EquiSSL-perm

  linear_probe:
    type: "RidgeCV"
    ridge_alphas: [0.1, 1.0, 10.0, 100.0]
    test_fraction: 0.2

  training_data:
    zoo: "SANE MultiZoo CIFAR-10 CNN (tune_zoo_cifar10_uniform_small)"
    n_models: "~3000 (not full ~30k)"
    test_zoo: "ViT Model Zoo (arXiv:2504.10231)"
    n_vit_models: 53  # of planned 250

