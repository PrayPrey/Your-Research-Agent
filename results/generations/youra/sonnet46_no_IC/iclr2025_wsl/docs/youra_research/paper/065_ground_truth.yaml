      equissl_perm:
        r2_seed0: 0.3273755452780519
        source: "h-m2/results/hm2_results.json"

      delta_r2:
        mean: -0.14280929406618648  # EquiSSL - EquiSSL-perm (NEGATIVE = perm wins)
