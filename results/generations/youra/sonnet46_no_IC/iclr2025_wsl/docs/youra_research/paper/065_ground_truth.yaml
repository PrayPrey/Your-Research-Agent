        source: "h-m2/results/hm2_results.json"

      sane_r2: 0.0721  # from h-m2 results (consistent with h-m1)

  # h-e1 (MMD measurement)
  mmd_metric:
    name: "MMD (RBF kernel) between CNN train zoo and ViT test zoo latents"

    results:
      mmd_sane: 0.849  # from h-e1/experiment_results.json (3-seed mean)
