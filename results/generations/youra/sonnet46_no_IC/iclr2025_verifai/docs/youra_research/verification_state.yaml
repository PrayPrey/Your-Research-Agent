main_hypothesis:
  id: H-IsoComputeFeedback-v1
  title: Iso-Compute Feedback Type Comparison for LLM Code Generation on HumanEval/MBPP
  statement: 'Under HumanEval and MBPP benchmarks, for open-source instruction-tuned LLMs at 7B scale

    (Llama 3.1 8B primary; Qwen2.5-Coder-7B replication), if formal feedback type is varied

    between (A) pylint/mypy static analysis feedback and (B) execution test feedback — both in

    iterative repair mode at fixed token budget B=1000 output tokens per problem instance —

    then execution test feedback achieves a statistically significantly larger pass@1 improvement

    delta over no-feedback baseline than pylint/mypy feedback (McNemar''s test, α=0.05), because

    execution feedback covers the full distribution of code errors while static analysis covers

    a subset with lower correlation to the specific logical failures that dominate HumanEval/MBPP.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval (164 problems) + MBPP (374 problems)
    model: Llama 3.1 8B Instruct (primary) + Qwen2.5-Coder-7B-Instruct (replication)
    optimizer: null
    hyperparameters:
      token_budget_per_problem: 1000
      decoding: greedy (temperature=0)
      random_seed: 42
      repair_rounds_max: 3
