novelty:
  preserved_novelty: "First iso-compute head-to-head comparison of execution feedback vs. pylint/mypy static analysis feedback in iterative repair mode on standard Python functional correctness benchmarks (HumanEval, MBPP) — with automated mechanism analysis"
  key_innovation: "Iso-compute comparison framework (fixed total output token budget per problem) that enables fair comparison between repair modes that differ in number of passes; plus automated pylint failure coverage analysis that mechanistically explains the observed ranking"
  differentiation:
    - prior_work: "FeedbackEval [Dai et al., 2025]"
      difference: "FeedbackEval uses compiler/syntax errors as 'compiler feedback' — not semantic pylint/mypy analysis. FeedbackEval does not normalize by token budget. FeedbackEval does not include type-constrained decoding. Our paper adds the pylint/mypy semantic feedback condition and the iso-compute normalization."
    - prior_work: "Static Analysis as Feedback Loop [Blyth et al., 2025]"
      difference: "Blyth et al. test only on PythonSecurityEval (security metric, not pass@k on functional correctness). No comparison to execution feedback. Our paper tests on HumanEval/MBPP functional correctness and directly compares to execution feedback at equal token budget."
    - prior_work: "Type-Constrained Code Generation [Mündler et al., 2025]"
      difference: "Mündler et al. compare only to unconstrained generation. No comparison to execution feedback or pylint feedback in repair mode. Our paper includes type-constrained decoding as a prevention baseline but does not claim to fully characterize it against repair conditions."
    - prior_work: "Self-Debug [Chen et al., 2023]"
      difference: "Self-Debug evaluates execution feedback only (rubber duck + execution trace). No comparison to static analysis or type-constrained signals. Our paper provides the comparison Self-Debug's design could not."

