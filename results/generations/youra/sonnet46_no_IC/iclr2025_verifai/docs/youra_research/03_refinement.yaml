experimental_setup:
  dataset:
    name: "HumanEval + MBPP"
    type: "standard"
    source: "HumanEval: Chen et al. 2021 (openai/human-eval repo); MBPP: Austin et al. 2021 (google-research/mbpp repo)"
    path: "Standard benchmark loaders; available via lm-evaluation-harness or direct download"
    hypothesis_fit: "HumanEval (164 algorithmic Python problems) and MBPP (374 Python problems) are the canonical standard benchmarks for Python code generation functional correctness. Both have unit test oracles (required for execution feedback condition). No new benchmarks created."
  model:
    name: "Llama 3.1 8B Instruct (primary) + Qwen2.5-Coder-7B-Instruct (replication)"
    type: "open-source instruction-tuned decoder-only transformer"
    source: "HuggingFace model hub: meta-llama/Llama-3.1-8B-Instruct; Qwen/Qwen2.5-Coder-7B-Instruct"
    hypothesis_fit: "7B-scale instruction-tuned models selected for: (1) sufficient instruction-following capability for repair tasks (validated by Iterative Self-Repair 2026 on Llama 3.1 8B); (2) feasible local inference without >24GB VRAM; (3) two different training regimes (Meta vs. Alibaba) for replication diversity; (4) honest scope (not claiming to generalize to 70B+)."
  baselines:
    - name: "No-feedback baseline"
      method: "Single generation pass, no repair. pass@1 from one sample per problem at temperature=0 (greedy). Token budget: initial generation only (not charged against B)."
    - name: "FeedbackEval compiler feedback"
      method: "Compiler/syntax error feedback as in Dai et al. [2025] — syntax-only feedback, no semantic pylint. Not implemented but cited as point of comparison for interpreting magnitude of results."
    - name: "Reflexion (upper bound reference)"
      method: "Execution + verbal self-reflection. 91% HumanEval [Shinn et al., 2023]. Reference point for execution feedback ceiling — not re-implemented, cited from paper."

