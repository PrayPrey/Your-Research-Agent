established_facts:
  claims:
    - claim: "Execution-based iterative repair feedback improves pass@1 on HumanEval and MBPP over no-feedback baseline"
      status: "BUILD_ON"
      evidence: "Reflexion [Shinn et al., 2023]: 91% HumanEval; Self-Debug [Chen et al., 2023]: +12% MBPP, 10x sample efficiency; Iterative Self-Repair [Arimbur, 2026]: +4.9-17.1pp HumanEval on modern 8B models"
    - claim: "Type-constrained decoding reduces compilation/type errors by >50% on HumanEval/MBPP"
      status: "BUILD_ON"
      evidence: "Type-Constrained Code Generation [Mündler et al., 2025]: >50% compilation error reduction; no fine-tuning required"
    - claim: "Pylint/Bandit iterative feedback reduces security issues on PythonSecurityEval"
      status: "BUILD_ON"
      evidence: "Static Analysis as Feedback Loop [Blyth et al., 2025]: 40%→13% security issue rate in 10 iterations on PythonSecurityEval"
    - claim: "No existing study provides iso-compute comparison of execution vs. static analysis feedback in repair mode on HumanEval/MBPP functional correctness"
      status: "PROVE_NEW"
      evidence: "FeedbackEval [Dai et al., 2025] compared compiler/test/minimal feedback but excluded semantic pylint/mypy and type-constrained decoding; Blyth et al. tested only on security benchmark; no study normalizes by token budget"
    - claim: "Pylint/mypy static analysis feedback improves functional correctness (pass@1) on HumanEval or MBPP"
      status: "PROVE_NEW"
