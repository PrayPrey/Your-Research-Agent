hypothesis_draft:
  title: "Iso-Compute Feedback Type Comparison for LLM Code Generation on HumanEval/MBPP"
  hypothesis_id: "H-IsoComputeFeedback-v1"
  core_claim: |
    Under HumanEval and MBPP benchmarks, for open-source 7B instruction-tuned LLMs in
    iterative repair mode at fixed token budget (B=1000 output tokens per problem),
    execution test feedback achieves a statistically significantly larger pass@1 improvement
    delta over no-feedback baseline than pylint/mypy static analysis feedback, because
    execution feedback covers the full distribution of code errors while static analysis
    covers a subset with lower correlation to logical correctness failures on these benchmarks.
  mechanism: |
    LLMs generate code with logic, type, syntax, and runtime errors. Execution test feedback
    directly reveals the expected vs. actual output for failing test cases — providing complete
    semantic information about what the code does wrong. Pylint/mypy static analysis provides
    syntax, type annotation, and style violations pre-execution — a subset of errors that may
    have lower correlation with the logical failures that dominate HumanEval/MBPP failures.
    The mechanism is operationalized as: fraction of HumanEval baseline failures that pylint
    detects pre-execution (automated measurement) vs. fraction that execution catches (100%).
  predictions:
    - P1: "Δ_execution > Δ_pylint on HumanEval/MBPP with Llama 3.1 8B at B=1000 tokens (McNemar p<0.05)"
    - P2: "pylint pre-execution coverage < 50% of HumanEval baseline failures (automated measurement)"
    - P3: "type-constrained decoding achieves positive pass@1 delta over unconstrained one-pass on HumanEval (secondary study)"

variables_summary:
  independent: "Feedback type: {no_feedback, pylint_mypy_repair, execution_repair, type_constrained_onepass}"
  dependent_primary: "pass@1 improvement delta vs. no-feedback baseline at B=1000 output tokens per problem"
  controlled: "Model (Llama 3.1 8B Instruct), benchmarks (HumanEval 164 problems, MBPP 374 problems), token budget (B=1000), prompt template, random seed"

null_hypothesis:
  h0_statement: |
    There is no statistically significant difference in pass@1 improvement delta between
    pylint/mypy static analysis feedback and execution test feedback at equal token budget
    (B=1000 output tokens per problem) on HumanEval/MBPP for Llama 3.1 8B.
    (H0: Δ_pylint = Δ_execution)
  statistical_test: "McNemar's test on paired binary outcomes (pass/fail per problem)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First iso-compute head-to-head comparison of execution vs. static analysis (pylint/mypy) feedback in iterative repair mode on HumanEval/MBPP functional correctness, with automated mechanism analysis (pylint failure coverage)"
  differentiation_summary: |
    FeedbackEval [Dai et al., 2025] compares compiler/test/minimal feedback but excludes
    semantic pylint/mypy and type-constrained decoding; does not normalize by token budget.
    Blyth et al. [2025] tests pylint on security benchmarks, not functional correctness.
    Mündler et al. [2025] compares type-constrained to unconstrained only.
    Self-Debug [Chen et al., 2023] and Reflexion [Shinn et al., 2023] test execution feedback
    only. No existing paper provides the iso-compute execution vs. pylint comparison on
    HumanEval/MBPP.

