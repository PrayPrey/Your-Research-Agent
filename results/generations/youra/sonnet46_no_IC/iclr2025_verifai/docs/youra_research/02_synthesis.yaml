    - "Same base prompt template for all conditions (only feedback signal insertion differs)"
    - "Greedy decoding (temperature=0) for reproducibility"
    - "Official test suites for HumanEval/MBPP used without modification"
    - "McNemar's test applied before examining effect sizes (prevents post-hoc endpoint switching)"
  external_validity:
    - "Two models from different training regimes (Meta, Alibaba) for replication"
    - "Two benchmarks (HumanEval, MBPP) for cross-benchmark consistency"
    - "Scope explicitly bounded to 7B instruction-tuned models on Python functional correctness"
    - "Note: generalization to 70B models, RL-trained models, or non-Python benchmarks requires separate study"

discussion_synthesis:
  key_insights:
    - "The iso-compute framework (fixed output token budget per problem) is necessary for fair comparison — repair modes that differ in pass count cannot be compared without this normalization"
    - "A null result for pylint (Δ_pylint ≈ 0) is as scientifically valuable as a positive result — it definitively establishes the boundary of static analysis feedback utility in functional code generation"
    - "The automated pylint coverage analysis is a secondary contribution that explains the mechanism without human annotation"
    - "Type-constrained decoding and iterative repair are mechanistically incompatible (prevention vs. correction) — must be studied separately to avoid conflation"
    - "Production deployment implications are direct: if static analysis achieves X% of execution improvement at much lower compute cost, the tradeoff is immediately actionable for coding assistant engineering teams"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): revealed that the assumed ranking (execution > static analysis) is directionally unproven and pylint's functional correctness effect on HumanEval is empirically unknown — this sharpened the hypothesis into testing the null"
    - "Exchange 9 (Dr. Sage): proposed type-constrained decoding as a separate 'prevention baseline' rather than a repair-mode competitor — resolved the architectural incompatibility problem cleanly"
    - "Exchange 10 (Prof. Pax): confirmed the bifurcated design (primary repair comparison + secondary prevention study) resolves mechanistic incompatibility"
    - "Exchange 13 (Dr. Nova): converted the mechanism claim from an assumed explanation into a testable, automated measurement (pylint coverage analysis)"
  resolved_tensions:
    - "TENSION: type-constrained decoding is architecturally incompatible with iterative repair for iso-compute comparison. RESOLUTION: bifurcate into primary (repair modes) and secondary (prevention baseline) studies."
    - "TENSION: mechanism claim (pylint provides 'style-only' feedback) was empirically unjustified. RESOLUTION: convert to testable prediction with automated coverage analysis."
    - "TENSION: ranking prediction could be wrong (pylint null result). RESOLUTION: formulate hypothesis to accept null result as publishable finding."
    - "TENSION: model selection 'at least 7B' is too vague. RESOLUTION: specify Llama 3.1 8B (primary) + Qwen2.5-Coder-7B (replication)."
