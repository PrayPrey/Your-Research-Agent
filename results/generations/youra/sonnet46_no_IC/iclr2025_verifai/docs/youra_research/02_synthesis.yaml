    - "FeedbackEval compiler feedback [Dai et al., 2025] — compiler-only reference (cited)"

measurement_plan:
  data_collection:
    - source: "HumanEval — generate code with each model under each condition; run official test suite"
    - source: "MBPP — generate code with each model under each condition; run official test suite"
    - source: "Pylint coverage analysis — run pylint+mypy on all baseline failure cases; record flags"
  procedure:
    - step: "1. Run no-feedback baseline (greedy decoding, single pass) on all HumanEval/MBPP problems per model. Record pass/fail per problem."
    - step: "2. Run pylint/mypy repair condition: generate code, run pylint+mypy, format warnings as structured feedback, generate repair, repeat until B=1000 total output tokens consumed. Record final pass/fail."
    - step: "3. Run execution repair condition: generate code, run test suite, format test failures as structured feedback, generate repair, repeat until B=1000 total output tokens consumed. Record final pass/fail."
    - step: "4. Run type-constrained decoding (secondary study): one-pass generation with eth-sri type constraints at B=1000 token budget. Record pass/fail vs. unconstrained one-pass."
    - step: "5. Pylint coverage analysis: for all problems that fail in the no-feedback baseline, run pylint+mypy on the failing code without execution. Record fraction flagged with at least one warning/error."
    - step: "6. Compute pass@1 delta per condition vs. baseline. Run McNemar's test for P1. Report per-round improvement trajectory."
    - step: "7. Replicate steps 1-6 with Qwen2.5-Coder-7B-Instruct."
  success_criteria:
    - "P1 supported: Δ_execution > Δ_pylint, p<0.05 McNemar's test on HumanEval with Llama 3.1 8B"
    - "P2 supported: pylint pre-execution coverage < 50% of HumanEval baseline failures"
    - "P3 supported: type-constrained decoding pass@1 delta > 0 on HumanEval (secondary)"
    - "Both models show consistent direction of feedback type ranking (replication check)"

validation:
