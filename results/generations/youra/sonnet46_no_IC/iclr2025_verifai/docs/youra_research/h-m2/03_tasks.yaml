      Implement _run_mypy(path) -> tuple[bool, int, str].

      Args:
        ['--ignore-missing-imports', '--no-strict-optional', '--no-error-summary', '--no-color-output', path]

      Return:
        flagged = (exit_code != 0) and (error_count > 0 or exit_code == 1)
        error_count = count lines where 'error:' in line and not line.startswith('Found')
        output truncated to 500 chars

      except Exception → return (False, 0, f'mypy_error: {e}')

