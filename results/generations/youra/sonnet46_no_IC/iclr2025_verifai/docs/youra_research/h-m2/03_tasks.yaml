    title: "L-2-2: Implement _run_pylint — API call + regex category parse + subprocess fallback"
    description: |
      Implement _run_pylint(path) -> tuple[bool, dict, str].

      Primary path (pylint API):
        - from pylint import lint, TextReporter, StringIO
        - lint.Run([path, '--score=no'], reporter=TextReporter(buf), exit=False)
        - Parse categories with regex: re.search(r':\s+([EWCRI])\d{4}', line)
        - Return (flagged, categories, output[:1000])

      Fallback (_pylint_subprocess_fallback):
        - subprocess.run(['python', '-m', 'pylint', '--output-format=json', '--score=no', path])
        - json.loads(stdout), map type->category letter
        - Same return signature

      except SystemExit, Exception → call fallback

      See 03_logic.md#L-2-2 for full pseudo-code.
    feature_tag: "experiment"
    priority: 46
