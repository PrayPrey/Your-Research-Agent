      Key computations:
        n_pylint_only = sum(p and not m for p, m in zip(pylint_flags, mypy_flags))
        n_mypy_only   = sum(m and not p ...)
        n_both        = sum(p and m ...)
        n_neither     = n_total - n_flagged
        coverage_passes_gate = (coverage < 0.50)

      Category totals: aggregate pylint_categories across all results.
      Call _bootstrap_ci(flags_arr, n_bootstrap, seed).
