        rounds = case.get('rounds', [])
        if rounds and isinstance(rounds[0], dict): return rounds[0].get('code', '')
        return ''

      tqdm progress bar: desc="Static analysis coverage", unit="file"
      Count and report analysis errors at end.
      Never raises — errors recorded per-case in 'error' field.

