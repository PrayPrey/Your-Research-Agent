    title: "L-3-2: Implement _bootstrap_ci — numpy seeded bootstrap, vectorized"
    description: |
      Implement _bootstrap_ci(flags, n_bootstrap, seed) -> tuple[float, float].

      Use np.random.default_rng(seed) (modern NumPy RNG, not legacy RandomState).

      Vectorized form preferred:
        idx = rng.integers(0, n, size=(n_bootstrap, n))
        bootstrap_means = flags[idx].mean(axis=1)
        return float(np.percentile(bootstrap_means, 2.5)), float(np.percentile(bootstrap_means, 97.5))

      Or list comprehension (simpler, fine for n~64):
        means = [rng.choice(flags, len(flags), replace=True).mean() for _ in range(n_bootstrap)]

      See 03_logic.md#L-3-2 for implementation note.
