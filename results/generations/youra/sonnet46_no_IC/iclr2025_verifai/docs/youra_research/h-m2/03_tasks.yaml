    description: |
      Implement run_coverage_measurement(cases) -> list[dict].

      Code field extraction (handle multiple formats):
        code = case.get('generated_code') or case.get('completion') or case.get('code')
               or _extract_nested_code(case)  # rounds[0].code for H-M1 format

