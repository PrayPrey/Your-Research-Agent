tasks:
  # ─── ENVIRONMENT SETUP (priority 94) ───────────────────────────────────────
  - id: ENV-1
    title: "Environment Setup and H-E1 Result Verification"
    type: setup
    priority: 94
    description: >
      Install all required packages. Verify H-E1 results exist for reuse.
      Pin dependencies in requirements.txt.
      Packages: groq>=0.9.0, vllm>=0.4.0, transformers>=4.43.0, torch>=2.1.0,
      evalplus>=0.3.0, human-eval>=1.0.0, statsmodels>=0.14.0, scipy>=1.11.0,
      datasets>=2.20.0, numpy>=1.24.0, pandas>=2.0.0, matplotlib>=3.7.0,
      tqdm>=4.65.0, pyyaml>=6.0.
      Verify existence of:
        docs/youra_research/h-e1/results/baseline_humaneval.jsonl
        docs/youra_research/h-e1/results/baseline_mbpp.jsonl
        docs/youra_research/h-e1/results/pylint_humaneval.jsonl
        docs/youra_research/h-e1/results/pylint_mbpp.jsonl
    reference_files:
      - file: "docs/youra_research/h-m1/03_prd.md"
