  phase: 3
  prerequisite: h-e1
  description: "Execution test feedback vs pylint/mypy at iso-compute (B=1000 tokens). McNemar test, HumanEval+MBPP, Llama 3.1 8B + Qwen2.5-Coder-7B replication."

