# ============================================================================
# EXPERIMENTAL CONFIGURATION (from h-e1/03_prd.md, h-m1/03_prd.md)
# ============================================================================

methodology:
  model: "meta-llama/Llama-3.1-8B-Instruct"
  backend: "vLLM v0.10.1.1"
  precision: "bfloat16"
  hardware: "5x H100 NVL"
  gpu_memory_utilization: 0.4
  max_model_len: 4096

  token_budget:
    B: 1000  # output tokens per problem, total across all rounds
    min_tokens_remaining: 50  # skip repair if budget < 50 tokens remaining
    max_repair_rounds: 3       # effectively 1 in practice at B=1000

  decoding:
    temperature: 0.0  # greedy
    seed: 42

  datasets:
    humaneval:
      problems: 164
      failures_baseline: 64  # 39% failure rate
      test_suite: "EvalPlus official"
    mbpp:
      problems: 378
      failures_baseline: 253  # 67% failure rate
      format: "EvalPlus assertion field"

  statistical_tests:
    primary: "McNemar's test"
    alpha: 0.05
    bootstrap_n: 10000
    bootstrap_seed: 42

  execution_sandbox:
    timeout_seconds: 15
    result_writer: "JSONL incremental with task_id deduplication"
    all_problems_completed: true

