gap_id: "gap3"
gap_title: "Systematic Ranking of Formal Feedback Signal Types on Standard Code Benchmarks"
gap_description: |
  Three feedback signal categories exist in the literature but are studied in isolation
  or without cross-benchmark standardization: (1) Execution feedback (error messages, test
  results) — studied by CodeRL, RLEF, Self-Debugging, Reflexion, FeedbackEval;
  (2) Static analysis feedback (pylint, bandit, mypy) — studied by Blyth et al. 2025
  on PythonSecurityEval (not HumanEval/MBPP); (3) Type/grammar constraints
  (Type-Constrained Decoding, CRANE, SynCode) — studied on HumanEval/MBPP but in
  constrained decoding mode, not iterative repair. FeedbackEval (Dai et al., 2025)
  compares feedback types but uses "compiler feedback" rather than full static analysis
  and does not include type-constrained decoding.
  Missing: A systematic head-to-head comparison of (a) execution test feedback,
  (b) pylint/mypy static analysis feedback, and (c) type-constrained decoding on same
  LLMs, same benchmarks (HumanEval, MBPP), measuring pass@1 delta over no-feedback
  baseline at equal inference compute.
