main_hypothesis:
  id: H-ExecFilteredSFT-v1
  title: 'Exec-FilteredSFT: Execution-Filtered SFT Data from Raw Corpus Improves Code LLM Performance at Equal Token Budget'
  statement: 'Under equal token budget from The Stack Python corpus (SFT stage, Python language,

    Qwen2.5-Coder-1.5B primary and 7B secondary), if training data is execution-filtered

    (compile-only via compile() AST check, or doctest-passing via compile() + doctest

    module execution), then HumanEval pass@1 and MBPP pass@1 improve over unfiltered-subset

    SFT of equal token count, because execution filtering retains syntactically and

    functionally consistent training examples, reducing exposure to malformed patterns and

    improving distributional alignment with benchmark-style correct code.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: The Stack Python (bigcode/the-stack-dedup)
    model: Qwen2.5-Coder-1.5B (primary), Qwen2.5-Coder-7B (secondary)
    optimizer: AdamW
    hyperparameters:
      learning_rate: 2e-5
      batch_size: 32
      epochs: 3
      seed: 42
      token_budget: 500M-1B tokens
