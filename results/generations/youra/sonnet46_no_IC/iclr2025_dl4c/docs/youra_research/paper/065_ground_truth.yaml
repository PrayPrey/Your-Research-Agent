# ─── ADVERSARIAL REVIEW FOCUS AREAS ─────────────────────────────────────────
# Phase 6.5 should pay particular attention to these potential weaknesses

adversarial_targets:
  - id: "AT1"
    area: "Overstating H-C1 as a complete contribution when H-E1 is missing"
    concern: "A reviewer may argue the paper's main claim (execution filtering improves SFT) is untested"
    paper_defense: "H-C1 is positioned as a feasibility characterization; H-E1 is explicitly marked pending throughout"
    risk: MEDIUM

  - id: "AT2"
    area: "Dataset proxy validity (codeparrot vs. the-stack-dedup)"
    concern: "Reviewer may argue the-stack-dedup has different composition, invalidating the PIVOT"
    paper_defense: "Section 6.2 L1 addresses this; 31× gap is robust to 5× dataset composition difference"
    risk: LOW-MEDIUM

  - id: "AT3"
    area: "Small sample of executable-doctest files (n=10)"
    concern: "Statistical confidence on import error distribution with only 10 passing files and 194 failing files"
    paper_defense: "Main finding is the rate (0.1%), not the error distribution. Rate is well-characterized at 10/10,000 (binomial CI: [0.05%, 0.18%])"
    risk: LOW

  - id: "AT4"
    area: "Generalizability of 0.1% rate to other Python corpora"
    concern: "codeparrot-clean-valid may be more library-heavy than average Python code repositories"
    paper_defense: "Acknowledged in L1 and Section 6.2. Even at 5× higher rate (0.5%), doctest condition remains infeasible"
    risk: LOW-MEDIUM

  - id: "AT5"
    area: "Results.json lists 'dataset: bigcode/the-stack-dedup' but actual scan was codeparrot"
    concern: "Potential discrepancy between what was scanned and what was reported"
    paper_defense: "Paper correctly attributes codeparrot-clean-valid in Section 3.2 and Limitations. The results.json records the configured target, not the actual fallback"
    risk: MEDIUM
    action_needed: "Clarify in paper that results.json reflects intended dataset configuration; actual scan used fallback"

