established_facts:
  claims:
    - claim: "Quality-filtered SFT outperforms equal-token-budget unfiltered SFT — established by phi-1 [Gunasekar et al., 2023] using GPT-4 curation"
      status: "BUILD_ON"
      evidence: "phi-1: 1.3B quality tokens → 50.6% HumanEval; equal-budget methodology validated"
    - claim: "Execution-selected SFT samples improve HumanEval pass@1 — EffiCoder +13pp on Qwen2.5-Coder-7B"
      status: "BUILD_ON"
      evidence: "EffiCoder [Zeng et al., 2024]: 44.8% → 57.7% pass@1 via execution-selected samples at inference time"
    - claim: "HumanEval and MBPP are valid, automated benchmarks for code generation pass@1"
      status: "BUILD_ON"
      evidence: "Chen et al. 2021 (HumanEval); Austin et al. 2021 (MBPP); both have automated test execution"
    - claim: "The Stack Python is publicly available and supports SFT corpus construction"
      status: "BUILD_ON"
      evidence: "StarCoder [Li et al., 2023]: The Stack + heuristic filtering → 40% HumanEval; cristinaimprota ICPC 2025 pipeline"
    - claim: "No controlled SFT comparison of unfiltered vs compile-only vs compile+test at equal token budget exists"
      status: "PROVE_NEW"
      evidence: "Phase 1 research confirmed: 12 papers, 9 EXA resources — gap is real and novel"
    - claim: "Execution-filtered SFT from raw corpus (not instruction data) outperforms unfiltered SFT at equal token budget"
      status: "PROVE_NEW"
      evidence: "EffiCoder filtered instruction-tuning samples (not raw corpus); phi-1 used GPT-4 not execution; no prior work does this"
  scope_reduction_percentage: 33
  phase2b_4_instructions: |
    BUILD_ON claims (quality filtering works, HumanEval/MBPP validity, The Stack availability) are established —
    Phase 2B should NOT re-verify these. Focus verification effort on PROVE_NEW claims:
    (1) that execution filtering of raw SFT corpus at equal token budget produces measurable improvement, and
    (2) that compile+test filtering provides additional gain over compile-only.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ExecFilteredSFT-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under equal token budget from The Stack Python corpus (SFT stage, Python language,
    Qwen2.5-Coder-1.5B primary and 7B secondary), if training data is execution-filtered
    (compile-only via `compile()` AST check, or doctest-passing via `compile()` + `doctest`
    module execution), then HumanEval pass@1 and MBPP pass@1 improve over unfiltered-subset
    SFT of equal token count, because execution filtering retains syntactically and
    functionally consistent training examples, reducing exposure to malformed patterns and
    improving distributional alignment with benchmark-style correct code.
  alternative_hypothesis_h0: |
    There is no significant difference in HumanEval pass@1 or MBPP pass@1 between SFT on
    execution-filtered data and SFT on unfiltered data of equal token count from The Stack
    Python, when controlling for base model, training hyperparameters, and token budget.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Execution filter condition"
      type: "categorical"
      operationalization: "Filtering gate applied to The Stack Python before SFT"
      levels:
        - "Unfiltered: random subsample to N tokens (no filtering)"
        - "Compile-only: `compile(code, '<string>', 'exec')` succeeds; subsample to N tokens"
        - "Doctest-passing: compile() + `doctest` module runs without failures; subsample to N tokens"
    - name: "Model size"
      type: "categorical"
      operationalization: "Qwen2.5-Coder model variant used for SFT"
      levels:
        - "Qwen2.5-Coder-1.5B (primary)"
        - "Qwen2.5-Coder-7B (secondary generalization check)"
  dependent:
    - name: "HumanEval pass@1"
      type: "continuous"
      operationalization: "Fraction of 164 HumanEval problems solved correctly in one generation; measured via lm-evaluation-harness or openai/human-eval"
      primary: true
    - name: "MBPP pass@1"
      type: "continuous"
      operationalization: "Fraction of MBPP test problems (standard split) solved correctly in one generation; measured via lm-evaluation-harness"
      primary: false
  controlled:
    - name: "Token budget (N)"
      operationalization: "Equal number of training tokens across all three filter conditions; subsampling applied after filtering"
    - name: "Base model"
      operationalization: "Identical pretrained checkpoint (Qwen2.5-Coder-1.5B or 7B) for all conditions"
    - name: "Training hyperparameters"
      operationalization: "Identical: learning rate, batch size, warmup, optimizer, epochs — same for all conditions"
    - name: "Data source"
      operationalization: "All conditions draw from The Stack Python (bigcode/the-stack-dedup); same corpus version"
    - name: "Evaluation harness"
      operationalization: "lm-evaluation-harness (EleutherAI) for both HumanEval and MBPP; identical generation params (temperature, top-p, max tokens)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Execution filtering selects syntactically and/or functionally valid programs from The Stack Python corpus"
      evidence: "opc_data_filtering compile gate; Python standard library `compile()` and `doctest` — validated tools"
      falsifier: "If compile() or doctest gate retains programs that are invalid, the filter is broken — verify by spot-checking retained samples"
    - step: 2
      description: "SFT on filtered corpus reduces model exposure to malformed or functionally incorrect code patterns"
      evidence: "Curriculum learning literature [Bengio et al., 2009]; negative interference from invalid examples reduces gradient quality"
      falsifier: "If filtered and unfiltered corpora have similar perplexity on held-out correct code, step 2 fails — the model doesn't distinguish"
    - step: 3
      description: "Reduced exposure to invalid patterns improves model's distributional alignment with benchmark-style correct Python code"
      evidence: "phi-1 [Gunasekar et al., 2023]: quality-filtered corpus → benchmark performance improvement at equal token budget"
      falsifier: "Measure n-gram overlap between filtered training data and HumanEval/MBPP test cases — if filtered ≈ unfiltered overlap, step 3 mechanism is not distribution shift"
    - step: 4
      description: "Improved distributional alignment → higher HumanEval pass@1 and MBPP pass@1"
      evidence: "EffiCoder [Zeng et al., 2024]: execution-selected samples → +13pp HumanEval; OpenCodeInstruct [2025]: +multiple pp across 1B/3B/7B"
      falsifier: "If HumanEval improvement ≥ 2pp but MBPP shows no improvement (or vice versa), the mechanism may be benchmark-specific, not general"
  key_tension: "The mechanism (noise reduction vs. distribution shift vs. coverage concentration) is not fully distinguished by P1/P2 — mechanism disambiguation requires intermediate measurements (learning curves, n-gram analysis) designed in Phase 2B"
  evidence_summary: |
    The causal chain is supported by: phi-1's equal-budget methodology (quality → benchmark gains),
    EffiCoder's execution-selection result (+13pp HumanEval), and curriculum learning theory (negative
    interference from invalid examples). The mechanism is stated mechanism-agnostically per Prof. Rex's
    refinement — all three candidate mechanisms (noise reduction, distribution shift, coverage
    concentration) predict the same P1/P2 outcome and require Phase 2B intermediate metrics to distinguish.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The Stack Python (deduplicated) contains sufficient doctest-bearing files to yield N training tokens at the compile+test condition (≥3% prevalence for 500M token budget)"
    supporting_evidence: "Python ecosystem patterns: NumPy, SciPy, standard library have high doctest density; estimated 5-10% of functions"
    consequence_if_violated: "Compile+test condition cannot be run; fall back to compile-only as primary condition (Gap 1 RQ1/RQ2 still answerable)"
  - id: "A2"
    assumption: "Execution filtering quality signal (compile/doctest passing) correlates with training example quality relevant to HumanEval/MBPP task types"
    supporting_evidence: "EffiCoder's execution selection → HumanEval gain; OpenCodeInstruct execution feedback → cross-benchmark improvement"
    consequence_if_violated: "P1 fails: execution-filtered SFT shows no HumanEval/MBPP improvement; study finds null result (publishable but negative)"
  - id: "A3"
    assumption: "Qwen2.5-Coder-1.5B is sensitive to SFT data quality at the token budgets being tested (500M-1B tokens)"
    supporting_evidence: "phi-1 showed 1.3B model highly sensitive to quality at similar token budgets; Qwen2.5-Coder-1.5B has demonstrated SFT sensitivity in OpenCodeInstruct experiments"
    consequence_if_violated: "Model too large/small for the token budget to show quality effects; repeat with different model size or budget"
  - id: "A4"
    assumption: "The P3 stratum check is valid: compile-only-doctest-subset performance ≈ compile-only-full-stack performance (within 1pp) if no stratum bias"
    supporting_evidence: "If doctest-bearing functions are representative of The Stack Python distribution, stratum check should pass"
    consequence_if_violated: "Doctest stratum is systematically different from general Stack Python (library code bias); P1 result attributed to stratum quality, not execution filtering — reframing needed"
  - id: "A5"
    assumption: "`doctest` execution within the main process does not cause stability issues at corpus-scan scale (memory leaks, infinite loops from malformed doctests)"
    supporting_evidence: "`doctest` module has timeout controls; malformed doctests typically fail quickly; opc_data_filtering has similar in-process execution experience"
    consequence_if_violated: "Doctest scanning pipeline crashes or is too slow; fall back to compile-only condition as primary"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Corpus: The Stack Python (bigcode/the-stack-dedup), Python language files only
    - Training stage: SFT (supervised fine-tuning), not pretraining or RLHF
    - Models: Qwen2.5-Coder-1.5B (primary), Qwen2.5-Coder-7B (secondary)
    - Evaluation: HumanEval pass@1 (164 problems), MBPP pass@1 (standard split)
    - Filter types: compile-only (syntax gate) and doctest-passing (functional gate)
    - Token budget: fixed N across all conditions (500M-1B tokens)
  does_not_apply_to: |
    - RLHF, PPO, or other reinforcement learning training paradigms (H-E1 territory — prohibited)
    - APPS or other interview-level competitive programming benchmarks
    - Multilingual code (non-Python) — The Stack is multilingual but this study uses Python only
    - Pretraining stage (this is SFT study only)
    - Instruction-tuning datasets (OpenCodeInstruct, etc.) — different format from raw corpus
    - Model families other than Qwen2.5-Coder (generalization to other families is future work)
  known_limitations: |
    - Doctest prevalence assumed 5-10%; if <3%, compile+test condition not feasible at stated budget
    - The Stack Python's doctest-bearing stratum may be systematically biased toward library/teaching code
    - 7B model result is secondary/exploratory — primary hypothesis tested on 1.5B only
    - Mechanism (noise reduction vs. distribution shift vs. coverage concentration) not distinguished by P1/P2

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "SFT on doctest-passing-filtered data (compile+test condition) outperforms SFT on unfiltered data of equal token count on HumanEval pass@1 with Qwen2.5-Coder-1.5B"
    test_method: "Train three Qwen2.5-Coder-1.5B SFTs (unfiltered, compile-only, doctest-passing) on equal token budget from The Stack Python; evaluate with lm-evaluation-harness on HumanEval pass@1; run paired bootstrap (n=1000) for significance"
    success_criterion: "ΔHumanEval(compile+test - unfiltered) ≥ 2pp absolute AND paired bootstrap p < 0.05"
    falsification: "ΔHumanEval < 2pp OR p > 0.05 → H0 not rejected; execution filtering does not improve pass@1 at this token budget"
  - id: "P2"
    primary: false
    statement: "Filtering strictness ordering holds: compile+test ≥ compile-only ≥ unfiltered on HumanEval pass@1"
    test_method: "Same three-condition SFT experiment as P1; compare all three conditions pairwise"
    success_criterion: "HumanEval(compile+test) ≥ HumanEval(compile-only) ≥ HumanEval(unfiltered)"
    falsification: "compile-only ≥ compile+test (ordering violated) OR unfiltered ≥ compile-only (no benefit from syntax filtering)"
  - id: "P3"
    primary: false
    statement: "The doctest stratum is not systematically better than random Stack Python (confound control): compile-only applied to doctest-bearing files only ≈ compile-only applied to full Stack Python, within 1pp HumanEval"
    test_method: "Train additional SFT: compile-only-doctest-subset (same files as P1 compile+test condition, but without doctest execution gate); compare to compile-only-full-stack condition"
    success_criterion: "|HumanEval(compile-only-doctest-subset) - HumanEval(compile-only-full)| ≤ 1pp"
    falsification: "ΔP3 > 1pp → doctest stratum selection dominates the gain; P1 improvement attributed to stratum quality not execution gate"

