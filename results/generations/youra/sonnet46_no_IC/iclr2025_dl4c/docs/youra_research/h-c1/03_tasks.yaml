  - id: "task-014"
    epic: "E-1: Data Streaming & Sampling"
    title: "L-1-2: Implement quality_filter() with The Stack paper thresholds"
    description: |
      Implement quality_filter(sample) in data_loader.py.
      Thresholds: avg_line_len<=100, max_line_len<=1000, alphanum_frac>=0.25.
      Handle empty content (return False). Use splitlines() for line metrics.
      See 03_logic.md L-1-2 and 03_config.md §5 Quality Filter Constants.
    feature_tag: "data-pipeline"
    priority: 31
    source_document: "03_logic.md"
