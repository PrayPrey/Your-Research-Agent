      1. Verify docs/youra_research/h-c1/results.json exists and has all required fields
      2. Verify run_gate_check() was called and returned PASS/SCOPE/PIVOT
      3. Record gate result in verification_state.yaml:
         sub_hypotheses.h-c1.gate.satisfied = (True if PASS/SCOPE, False if PIVOT)
         sub_hypotheses.h-c1.gate.result = "PASS" | "SCOPE" | "PIVOT"
      4. Print final summary:
         H-C1 COMPLETE: doctest_executable_rate={rate}, STATUS={status}
