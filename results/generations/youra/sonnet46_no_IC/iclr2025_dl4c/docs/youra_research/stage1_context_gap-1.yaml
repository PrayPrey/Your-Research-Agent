gap_id: "gap-1"
gap_title: "No Controlled Comparison of Execution-Filtered SFT Data (Compile-Only vs Compile+Test) at Equal Token Budget"
gap_description: |
  No existing study performs controlled comparison of unfiltered / compile-only / compile+test SFT filtering
  on The Stack Python at equal token budget, evaluated on HumanEval + MBPP. The missing piece is a controlled
  SFT ablation with three conditions: (1) unfiltered subset, (2) compile-only filtered, (3) compile+test filtered,
  all at equal token budget, same base model, evaluated on HumanEval pass@1 and MBPP pass@1.
papers_folder: "docs/youra_research/papers/"
github_repos:
  - "https://github.com/OpenCoder-llm/opc_data_filtering"
  - "https://github.com/cristinaimprota/Investigating-Training-Data-s-Role"
  - "https://github.com/openai/human-eval"
  - "https://github.com/EleutherAI/lm-evaluation-harness"
archon_queries:
  - "execution-based data filtering SFT code LLM"
  - "compile pass rate filtering training data quality"
exa_search_terms:
  - "execution-based data filtering supervised fine-tuning code LLM HumanEval"
  - "compile-only vs compile+test filtering code training data"
round_table_folder: "docs/youra_research/01_round_table"
supporting_papers:
