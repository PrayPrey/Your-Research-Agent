# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-GRC-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under conditions where LLMs are evaluated on multiple trustworthiness benchmarks
    (truthfulness, robustness, calibration), if a dominant latent factor (PC1,residual)
    exists after controlling for model scale and training confounds, then this factor
    reflects a shared representational stability mechanism, because training procedures
    that increase internal consistency simultaneously improve all trustworthiness dimensions.
  alternative_hypothesis_h0: |
    There is no latent factor beyond scale-driven covariance; λ₁,residual ≤ λ₁,perm
    (95th percentile of permutation distribution) after controlling for log(parameters)
    and release date.

