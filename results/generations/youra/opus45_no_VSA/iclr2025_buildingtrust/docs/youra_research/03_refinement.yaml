# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Training procedures (pretraining scale, instruction tuning, RLHF) shape internal representation geometry"
      evidence: "CCPS paper showed representation stability tracks calibration gains"
      falsifier: "If representation geometry is invariant to training procedures"
    - step: 2
      description: "Higher representation stability reduces sensitivity to input perturbations and improves calibration"
      evidence: "CCPS achieved 55% ECE reduction via representation stability probing"
      falsifier: "If stability measures don't correlate with calibration metrics"
    - step: 3
      description: "Improved stability simultaneously boosts truthfulness (better epistemic discrimination), robustness (less activation drift), and reliability (consistent predictions)"
      evidence: "Observed high cross-benchmark correlation (ρ = 0.80-0.87) is signature of shared mechanism"
      falsifier: "If some benchmarks show negative correlation with stability"
    - step: 4
      description: "This shared mechanism induces positive correlation across all trustworthiness benchmarks, creating a dominant latent factor"
      evidence: "Psychometric 'g-factor' analogy: positive manifold implies single underlying factor"
      falsifier: "If λ₁,residual ≤ permutation null after confound control"
  key_tension: "Distinguishing GRC from 'general model quality' requires discriminant validity tests"
  evidence_summary: |
    CCPS (Khanmohammadi et al., 2025) provides mechanistic evidence that representation
    stability improves calibration. The observed high cross-benchmark correlation from
    h-m2 failure confirms the positive manifold exists. The chain proposes that this
    manifold reflects a shared stability mechanism rather than independent capability gains.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Trustworthiness benchmarks measure meaningfully distinct constructs (with expected partial overlap)"
    supporting_evidence: "Trust-RAG Compass defines 6 distinct dimensions; benchmarks designed for different purposes"
    consequence_if_violated: "GRC becomes tautological if benchmarks measure the same thing by design"
  - id: "A2"
    assumption: "Representation stability is operationalizable via behavioral proxies (BSI)"
    supporting_evidence: "CCPS shows internal representation stability predicts ECE; behavioral proxies feasible"
    consequence_if_violated: "Cannot test mechanism without valid BSI measurement"
  - id: "A3"
    assumption: "Model scale correlates with training quality but does not fully explain cross-benchmark covariance"
    supporting_evidence: "Scaling laws show diminishing returns; residual covariance expected"
    consequence_if_violated: "GRC is redundant with scale if residual variance disappears after control"
  - id: "A4"
    assumption: "Instruction-tuning approximates a stability-increasing intervention"
    supporting_evidence: "Instruction-tuning adds alignment training without parameter increase"
    consequence_if_violated: "Quasi-intervention test fails; would need true randomized intervention"
  - id: "A5"
    assumption: "HELM/Open LLM Leaderboard provides representative model sample"
    supporting_evidence: "Leaderboards contain ~100+ models across families and scales"
    consequence_if_violated: "Selection bias may affect factor structure estimates"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Decoder-only LLMs with public benchmark scores
    - Models on HELM/Open LLM Leaderboard
    - Parameter range: 1B to 70B+ parameters
    - Time period: 2022-2026 model releases
  does_not_apply_to: |
    - Encoder-only models (BERT, RoBERTa)
    - Multimodal models (unless evaluated on text-only benchmarks)
    - Models without published benchmark scores
    - Proprietary models without API access for BSI measurement
  known_limitations: |
    - Closed-source models limit activation-level analysis; BSI restricted to behavioral proxies
    - Instruction-tuning quasi-intervention is not randomized; confounding possible
    - HELM benchmark selection may not span all trustworthiness dimensions
    - Release date confounded with engineering improvements beyond RLHF

# Section 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "λ₁,residual exceeds 95th percentile of permutation distribution after controlling for log(params) and release date"
    test_method: "PCA on residualized benchmark matrix; permutation test with 1000 shuffles"
    success_criterion: "p < 0.05 (one-tailed test: observed λ₁ > 95th percentile of permuted λ₁)"
    falsification: "λ₁,residual ≤ permutation 95th percentile indicates no shared latent factor beyond scale"
  - id: "P2"
    primary: false
    statement: "PC1,residual correlates positively with Behavioral Stability Index (BSI) computed on independent datasets"
    test_method: "Pearson correlation between PC1 scores and BSI composite; BSI measured on PAWS/QQP (not trustworthiness benchmarks)"
    success_criterion: "ρ > 0, p < 0.05"
    falsification: "ρ ≤ 0 or p ≥ 0.05 indicates no mechanism link between factor and stability"
  - id: "P3"
    primary: false
    statement: "Any new trustworthiness benchmark added after PC1 estimation shows loading ≥ 0.3 on frozen PC1"
    test_method: "Out-of-sample factor scoring: regress new benchmark on frozen PC1 weights"
    success_criterion: "Loading coefficient ≥ 0.3 for at least 2 independent future benchmarks"
    falsification: "Two consecutive new benchmarks with |loading| < 0.2 fractures structural constraint claim"
  - id: "P4"
    primary: false
    statement: "Instruction-tuning increases both BSI and PC1,residual score within matched base/instruct model pairs"
    test_method: "Paired t-test on ΔBSI and ΔPC1 for matched pairs (e.g., Llama-2 base vs Llama-2-Chat)"
    success_criterion: "Both Δ > 0 with p < 0.05"
    falsification: "No significant increase in either metric disconfirms quasi-intervention evidence"

