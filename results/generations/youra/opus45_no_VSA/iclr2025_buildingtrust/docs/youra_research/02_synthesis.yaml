hypothesis_draft:
  title: "Generalized Representational Coherence (GRC) as Latent Factor in LLM Trustworthiness"
  hypothesis_id: "H-GRC-v1"
  core_claim: |
    High cross-benchmark correlation in LLM trustworthiness evaluation reflects a shared
    latent factor (Generalized Representational Coherence) arising from representation
    stability, not mere scale confounding. This factor is detectable via residual PCA
    after controlling for model scale and training confounds.
  mechanism: |
    Training procedures that increase internal representation stability (measured via
    Behavioral Stability Index) simultaneously improve performance across all trustworthiness
    dimensions. This shared mechanism induces positive correlation, creating a dominant
    latent factor analogous to psychometric 'g'.
  predictions:
    - P1: "λ₁,residual > permutation 95th percentile (p < 0.05)"
    - P2: "ρ(PC1,residual, BSI) > 0 (p < 0.05)"
    - P3: "New benchmark loading ≥ 0.3 on frozen PC1"
    - P4: "Instruction-tuning increases BSI and PC1 in matched pairs"

variables_summary:
  independent: "Model identity (cross-sectional), instruction-tuning status (quasi-intervention)"
  dependent_primary: "PC1,residual score from trustworthiness benchmark PCA"
  controlled: "log(parameters), release date, training family"

null_hypothesis:
  h0_statement: |
    There is no latent factor beyond scale-driven covariance; λ₁,residual ≤ λ₁,perm
    (95th percentile) after controlling for log(parameters) and release date.
  statistical_test: "Permutation test for eigenvalue significance"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Factor-analytic framework for cross-trustworthiness correlation with mechanistic grounding in representation stability"
  differentiation_summary: |
    Prior work (Trust-RAG Compass) proposes multi-dimensional frameworks but doesn't test
    cross-correlation. This work provides the first systematic evidence that benchmarks
    share variance beyond scale, with falsifiable mechanism claims via BSI mediation.

