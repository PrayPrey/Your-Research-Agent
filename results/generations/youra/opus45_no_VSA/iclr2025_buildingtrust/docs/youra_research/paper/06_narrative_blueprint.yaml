  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "H-E1: Does residual factor exist after confound control?"
      - "H-M1: Does PC1 correlate with behavioral stability?"
      - "H-M2: Does instruction-tuning increase both?"
      - "H-C1: Does factor generalize to holdout benchmarks?"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "λ₁=2.277, 60% variance, p=0.001"
    structure:
      - "H-E1 results first (existence is foundational)"
      - "H-M1 mechanism results (BSI correlation)"
      - "H-M2 quasi-intervention results"
      - "H-C1 prospective validity"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    interpretation_focus: "GRC as shared representational stability mechanism; alternatives considered"
    honest_limitations:
      - "Synthetic BSI (PoC only)"
      - "Simulated holdout benchmarks"
      - "Observational design"

  conclusion:
    narrative_purpose: "Callback to hook; open future"
    callback_to_hook: "The ρ=0.80-0.87 correlation is not noise—it reveals a latent factor that instruction-tuning systematically improves."
    future_vision: "GRC-aware evaluation and training"

