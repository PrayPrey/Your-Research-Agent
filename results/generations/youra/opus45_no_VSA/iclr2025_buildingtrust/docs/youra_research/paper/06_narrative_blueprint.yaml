    key_message: "Cross-benchmark correlation in LLM trustworthiness reflects a measurable latent factor (GRC) that increases with instruction-tuning."
    must_include:
      - "N=4,561 models"
      - "λ₁=2.277 (60% variance)"
      - "ρ=0.405 BSI correlation"
      - "d≈2.0 instruction-tuning effect"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "Counterintuitive Finding"
    key_elements:
      - "Open with correlation observation (ρ=0.80-0.87)"
