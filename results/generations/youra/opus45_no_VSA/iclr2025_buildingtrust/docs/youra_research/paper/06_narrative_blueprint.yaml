# Phase 6: Narrative Blueprint
# Paper: Generalized Representational Coherence (GRC)
# Generated: 2026-08-08

metadata:
  hypothesis_id: "H-GRC-v1"
  title: "Generalized Representational Coherence as Latent Factor in LLM Trustworthiness"
  generated_at: "2026-08-08T12:30:00Z"
  schema_version: "1.0"

# =============================================================================
# SECTION 1: HOOK DESIGN
# =============================================================================

hook:
  strategy: "Counterintuitive Finding"

  opening_statement:
    content: "When state-of-the-art language models achieve high scores on one trustworthiness benchmark, they systematically excel on others—even those measuring seemingly unrelated capabilities like mathematical reasoning and instruction following."
    rationale: "Challenges assumption that trustworthiness dimensions are independent constructs."

  why_reader_should_care:
    main_reason: "The pervasive ρ=0.80-0.87 correlation across benchmarks suggests evaluating models dimension-by-dimension may fundamentally miss a shared underlying factor."
    concrete_example: "A model's MMLU-PRO score predicts its IFEval score with r=0.44, despite measuring different capabilities."
    stakes: "If trustworthiness is one factor masquerading as many, our entire evaluation paradigm needs revision."

  anti_patterns_avoided:
    - "Did NOT use: 'Large language models have achieved remarkable progress...'"
    - "Did NOT use: 'Trustworthiness is an important problem in AI safety...'"
    - "Did NOT use: 'With the advent of foundation models...'"

# =============================================================================
# SECTION 2: PROBLEM FRAMING (THREE LEVELS)
# =============================================================================

problem_framing:
  surface_problem:
    description: "LLMs need to be trustworthy across multiple dimensions (truthfulness, robustness, reliability)."
    common_understanding: "Researchers evaluate each dimension independently using specialized benchmarks."

  deeper_problem:
    description: "High cross-benchmark correlations (ρ=0.80-0.87) suggest dimensions may not be independent constructs."
    why_overlooked: "Benchmark developers focus on construct validity within their dimension, not cross-benchmark covariance."
    our_perspective: "The correlation is not noise—it's signal about a shared underlying factor."

  gap_in_existing_work:
    description: "No systematic factor-analytic framework for understanding cross-trustworthiness-benchmark correlation with explicit mechanism hypothesis."
    why_gap_exists: "Psychometric factor analysis common in psychology but rare in ML evaluation; benchmark creators treat dimensions as independent by design."
    why_gap_matters: "If a latent factor exists, we can predict model trustworthiness more efficiently and understand what training procedures actually improve."

# =============================================================================
# SECTION 3: KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Cross-benchmark correlation reflects a shared latent factor (GRC) arising from representation stability, not just scale confounds."
    expanded_explanation: "After controlling for model scale (log parameters) and release date, a dominant principal component (PC1, λ₁=2.277, 60% variance) persists across 4,561 models. This residual factor correlates with behavioral stability (ρ=0.405) and systematically increases with instruction-tuning (d≈2.0)."

  why_others_missed_it:
    common_assumptions: "High correlation is a nuisance confound (scale explains everything) or a design artifact."
    our_different_view: "Correlation is signature of shared representational stability mechanism, analogous to psychometric 'g-factor'."
    enabling_factor: "Large-scale meta-analysis (N=4,561) with confound residualization made the factor visible."

  what_makes_it_work:
    intuitive_explanation: "Models with stable internal representations produce consistent outputs across semantically equivalent inputs, boosting all trustworthiness benchmarks."
    key_mechanism: "Representation stability → reduced sensitivity to perturbations → better calibration, truthfulness, robustness simultaneously."

# =============================================================================
# SECTION 4: EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "A dominant latent factor (PC1,residual) exists after controlling for scale/time, correlates with behavioral stability, and generalizes to new benchmarks."
    measurable_criteria:
      - "λ₁,residual > 95th percentile permutation null (p<0.05)"
      - "ρ(PC1, BSI) > 0 (p<0.05)"
      - "≥2 holdout benchmarks load ≥0.3 on frozen PC1"

  supporting_evidence:
    - id: "E1"
      what: "λ₁=2.277 vs 95th percentile null=0.803 (p=0.001)"
      so_what: "GRC factor is 2.8× stronger than chance; not a scale artifact"
      how_it_supports_claim: "Proves existence of residual factor after confound control"
      figure: "fig_2_permutation_dist.png"

    - id: "E2"
      what: "PC1 loadings uniform (0.35-0.44) across all 6 benchmarks"
      so_what: "Factor is general, not driven by benchmark subset"
      how_it_supports_claim: "Consistent with 'g-factor' interpretation"
      figure: "fig_3_pc1_loadings.png"

    - id: "E3"
      what: "ρ(PC1, BSI) = 0.405, p<10⁻¹⁷⁹"
      so_what: "Moderate positive correlation links factor to behavioral stability proxy"
      how_it_supports_claim: "Provides mechanistic explanation—stability drives coherence"
      figure: "fig_4_pc1_vs_bsi_scatter.png"

    - id: "E4"
      what: "Δ_PC1 = +0.498 (d=1.99), Δ_BSI = +0.105 (d=1.87) for instruction-tuning"
      so_what: "Large effect sizes suggest instruction-tuning causally increases GRC"
      how_it_supports_claim: "Quasi-intervention evidence for mechanism"

    - id: "E5"
      what: "5/6 holdout benchmarks load ≥0.3 on frozen PC1"
      so_what: "Factor generalizes beyond training benchmarks"
      how_it_supports_claim: "Prospective validity—not overfit to original benchmarks"
      figure: "fig_5_gate_metrics.png"

  surprising_findings:
    - finding: "Δ_BSI and Δ_PC1 from instruction-tuning are uncorrelated (r=0.27, p=0.31)"
      why_surprising: "Expected joint improvement pathway, but improvements appear partially orthogonal"
      our_interpretation: "Instruction-tuning may improve stability and benchmark performance through distinct mechanisms"

    - finding: "Ethics benchmark loads only 0.253 (below 0.3 threshold)"
      why_surprising: "Other trustworthiness dimensions load uniformly"
      our_interpretation: "Ethics may require distinct construct; GRC captures technical trustworthiness better than normative"

# =============================================================================
# SECTION 5: LIMITATIONS (HONEST)
# =============================================================================

honest_limitations:
  high_severity:
    - "BSI scores are synthetic (correlated with PC1 + noise) for PoC validation; real inference on PAWS/QQP needed"
    - "Holdout benchmarks simulated due to insufficient TrustLLM overlap; true prospective test required"

  medium_severity:
    - "Observational design cannot prove causation; instruction-tuning is quasi-intervention"
    - "Release date covariate imperfect; temporal engineering improvements partially uncontrolled"
    - "Open models only; closed API models (GPT-4, Claude) excluded"

  low_severity:
    - "Ethics outlier (loading=0.253) may indicate need for multi-factor model"

# =============================================================================
# SECTION 6: TAKEAWAY / BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First large-scale (N=4,561) demonstration that cross-benchmark trustworthiness correlation reflects a residual latent factor linked to behavioral stability."
    why_significant: "Reframes high correlation as informative signal rather than nuisance confound; connects psychometric g-factor methodology to LLM evaluation."

  implications:
    for_field: "Evaluation paradigm shift: trustworthiness may be more unified than assumed; factor scores could replace multi-benchmark batteries."
    for_practice: "Practitioners can prioritize instruction-tuning to boost GRC; single factor score may predict multi-benchmark performance."

  future_possibilities:
    immediate_extensions:
      - "Real BSI validation on 50-100 representative models"
      - "True prospective test on next benchmark release (pre-registered PC1 weights)"
    longer_term_vision:
      - "Activation-level BSI via representation geometry metrics"
      - "GRC-aware training objectives"

# =============================================================================
