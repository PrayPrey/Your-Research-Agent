  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "Residualization removes scale confounds to reveal latent factor; BSI operationalizes stability mechanism"
    key_design_decisions:
      - "Confound control: log(params) + release_date regression"
      - "PCA on residuals to extract latent factor"
