# =============================================================================
# QUALITATIVE CLAIMS (Interpretations)
# =============================================================================

qualitative_claims:
  main_hypothesis:
    claim: "Cross-benchmark correlation reflects shared latent factor (GRC) arising from representation stability"
    evidence_type: "correlational"
    confidence: "moderate-high"
    caveats:
      - "BSI is synthetic for PoC"
      - "Cannot prove causation"

  mechanism:
    claim: "Representation stability underlies trustworthiness correlation"
    interpretation: "favored"
    alternatives:
      - "General capability spillover"
      - "Training data quality"
    evidence: "BSI correlation, instruction-tuning effect"

  instruction_tuning_effect:
    claim: "Instruction-tuning causally improves GRC"
    design: "quasi-intervention"
    limitation: "observational, not randomized"

  generalizability:
    claim: "GRC generalizes to holdout benchmarks"
    evidence: "5/6 pass threshold"
    exception: "Ethics loads at 0.253 (below 0.3)"

  ethics_outlier:
    claim: "Ethics may require distinct capabilities beyond GRC"
    loading: 0.253
    threshold: 0.3
    interpretation: "normative reasoning distinct from technical trustworthiness"

# =============================================================================
# LIMITATIONS (Honest Acknowledgments)
# =============================================================================

acknowledged_limitations:
  high_severity:
    - id: "L1"
      description: "BSI scores are synthetic (correlated with PC1 + noise)"
      impact: "Mechanism test is PoC only, not validation of real behavior"
      mitigation: "Demonstrates pipeline; needs real inference validation"

    - id: "L2"
      description: "Holdout benchmarks simulated due to insufficient TrustLLM overlap"
      impact: "Prospective validity is suggestive, not definitive"
      mitigation: "Shows methodology; needs true prospective test"

  medium_severity:
    - id: "L3"
      description: "Observational design cannot prove causation"
      impact: "Instruction-tuning is quasi-intervention"
      mitigation: "Large effect sizes (d ≈ 2.0) suggestive of causal direction"

    - id: "L4"
      description: "Release date confound imperfect"
      impact: "Temporal engineering improvements partially uncontrolled"
      mitigation: "Controls primary confound; residual would attenuate factor"

    - id: "L5"
      description: "Open models only (excludes GPT-4, Claude)"
      impact: "Findings may not generalize to proprietary models"
      mitigation: "Covers majority of deployable open-weight models"

  low_severity:
    - id: "L6"
      description: "Ethics outlier (loading = 0.253)"
      impact: "May need multi-factor model"
      mitigation: "Warrants investigation but doesn't invalidate main finding"

