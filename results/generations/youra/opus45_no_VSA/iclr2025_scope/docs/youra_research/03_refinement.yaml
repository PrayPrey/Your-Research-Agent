    - name: "adapter_bank_size"
      operationalization: "k=8-10 task-specific LoRA adapters, rank r=16"
    - name: "sentence_encoder"
      operationalization: "Frozen MiniLM-L6-v2 (~22M params)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Instruction prefix encodes task semantics via frozen sentence encoder"
      evidence: "Instruction-tuning literature (FLAN, T0) shows models condition on instruction format"
      falsifier: "If prefix embeddings do not cluster by task family (macro-F1 <0.75 on 10+ families)"
    - step: 2
      description: "Learned linear projection maps prefix embedding to adapter weight space"
      evidence: "CLIP demonstrates cross-modal alignment via linear projection; proven pattern"
      falsifier: "If linear probe cannot predict oracle adapter (accuracy <70% AND top-3 <85%)"
    - step: 3
      description: "Soft routing computes weighted combination of LoRA deltas"
      evidence: "LoRA deltas are additive low-rank matrices; mathematically valid combination"
      falsifier: "If weighted combination performance <80% of oracle"
    - step: 4
      description: "Combined adapter produces task-appropriate model behavior"
      evidence: "AdapterFusion (1,228 citations) shows adapter composition improves performance"
      falsifier: "If IPCR does not significantly outperform uniform combination"
  key_tension: "Whether instruction semantics and adapter specializations share sufficient geometric alignment without task-specific training"
  evidence_summary: |
    Alignment is plausible because prefix embeddings and LoRA deltas share representational
    ancestry in the base model. Instruction prefixes are processed by the same model that
    LoRA adapters modify. If the base model's internal axes organize tasks semantically,
    partial linear alignment should exist.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Instruction prefixes contain sufficient task signal for routing"
    supporting_evidence: "FLAN instruction format explicitly encodes task type"
    consequence_if_violated: "Prefix embeddings will not separate by task family; routing fails"
  - id: "A2"
    assumption: "Frozen sentence encoder (MiniLM) preserves task-relevant semantics"
    supporting_evidence: "Contrastive pretraining (SimCSE) provides paraphrase invariance"
    consequence_if_violated: "Paraphrase perturbations will destabilize routing"
  - id: "A3"
    assumption: "Adapter specialization structure aligns with instruction semantic space"
    supporting_evidence: "Shared representational ancestry in base model"
    consequence_if_violated: "Linear probe cannot predict adapter choice; need nonlinear router"
  - id: "A4"
    assumption: "LoRA deltas are approximately linearly composable"
    supporting_evidence: "Mathematical additivity of low-rank matrices"
    consequence_if_violated: "Soft routing produces interference; hard routing required"
  - id: "A5"
    assumption: "Oracle adapters have sharp optima per task"
    supporting_evidence: "Task-specific fine-tuning is standard practice"
    consequence_if_violated: "Oracle margin <3%; routing accuracy is not meaningful signal"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - FLAN instruction-tuning task taxonomy (62 task categories)
    - Single-task instructions with explicit task prefixes
    - Decoder-only LLMs (Llama-2, Mistral) with LoRA adaptation
    - Adapter banks of 8-10 task-specialized LoRAs
  does_not_apply_to: |
    - Composite/multi-step tasks (translate-then-summarize) - extension work
    - Underspecified prompts without task headers - requires additional handling
    - Non-instruction-tuned base models
    - Adapter architectures other than LoRA (Adapters, IA3, etc.)
  known_limitations: |
    - Evaluation limited to FLAN task taxonomy; generalization to arbitrary instructions untested
    - Requires FLAN-style instruction formatting for reliable routing
    - Compositional routing is secondary analysis, not core hypothesis

