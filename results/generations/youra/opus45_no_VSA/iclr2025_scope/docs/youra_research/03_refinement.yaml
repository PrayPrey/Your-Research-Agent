# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "routing_method"
      type: "categorical"
      operationalization: "Method for selecting/weighting LoRA adapters"
      levels:
        - "random_selection"
        - "uniform_soft_combination"
        - "LORAUTER_zero_validation"
        - "IPCR_prefix_routing"
    - name: "prefix_type"
      type: "categorical"
      operationalization: "Instruction prefix variant"
      levels:
        - "original_FLAN"
        - "paraphrased"
        - "keyword_masked"
  dependent:
