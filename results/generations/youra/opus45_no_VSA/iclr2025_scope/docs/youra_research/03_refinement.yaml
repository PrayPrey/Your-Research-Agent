# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-IPCR-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the FLAN instruction-tuning task taxonomy,
    if instruction prefixes are embedded using a frozen sentence encoder (MiniLM) and mapped via learned linear projection to adapter weights,
    then zero-shot adapter routing achieves ≥90% of oracle task-specific LoRA performance on held-out tasks,
    because instruction semantics and adapter specializations share geometric structure inherited from the base model's learned task representations.
  alternative_hypothesis_h0: |
    There is no significant difference in task performance between zero-shot prefix-based adapter routing
    and random/uniform adapter selection, or instruction prefix embeddings do not linearly predict optimal
    adapter choice above chance level.

