    - claim: "LoRA deltas are mathematically additive (convex combination valid)"
      status: "BUILD_ON"
      evidence: "AdapterFusion (Pfeiffer et al. 2021), MoELoRA (Luo et al. 2024)"
    - claim: "Task-representation routing can exceed oracle performance"
      status: "BUILD_ON"
      evidence: "LORAUTER achieves 101.2% of oracle on task-aligned adapters"
    - claim: "Zero-shot prefix-only routing achieves ≥90% of oracle"
      status: "PROVE_NEW"
