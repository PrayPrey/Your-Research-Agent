hypothesis_draft:
  title: "Instruction-Prefix-Conditioned Adapter Routing (IPCR)"
  hypothesis_id: "H-IPCR-v1"
  core_claim: |
    Zero-shot adapter routing using instruction prefixes alone achieves ≥90% of oracle
    task-specific LoRA performance because instruction semantics and adapter specializations
    share geometric structure inherited from the base model's learned task representations.
  mechanism: |
    1. Frozen sentence encoder (MiniLM) embeds instruction prefix
    2. Learned linear projection maps embedding to adapter weight space
    3. Soft routing computes weighted combination of LoRA deltas
    4. Combined adapter produces task-appropriate model behavior
  predictions:
    - P1: "Linear probe achieves ≥70% oracle selection accuracy (or top-3 ≥85%)"
    - P2: "Zero-shot routing achieves ≥90% of oracle on held-out FLAN tasks"
    - P3: "Routing robust to paraphrase (cosine similarity ≥0.90) and keyword masking (<10% drop)"

variables_summary:
  independent: "routing_method (random, uniform, LORAUTER-zero, IPCR); prefix_type (original, paraphrased, masked)"
  dependent_primary: "relative_oracle_performance (% of oracle task-specific LoRA)"
  controlled: "base_model (Llama-2-7B), adapter_bank (k=8-10, r=16), sentence_encoder (MiniLM)"

null_hypothesis:
  h0_statement: |
    Zero-shot prefix-based adapter routing does not significantly outperform random or uniform
    adapter selection, and instruction prefix embeddings do not linearly predict optimal
    adapter choice above chance level.
  statistical_test: "Paired t-test or Wilcoxon signed-rank test across task families"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First work to test whether instruction-adapter alignment exists intrinsically without task-specific computation"
  differentiation_summary: |
    Prior work (LORAUTER, LoRAHub, MoELoRA) assumes task representations must be learned
    from validation examples or gradients. IPCR tests whether alignment exists WITHOUT
    any task-specific computation, using only the instruction prefix.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Llama-2-7B-chat"
    - "Mistral-7B-Instruct"
  datasets:
    - "FLAN instruction collection (62 task categories)"
  baselines:
    - "Random adapter selection"
    - "Uniform soft combination"
    - "LORAUTER-zero"
    - "Oracle task-specific LoRA"

measurement_plan:
  data_collection:
    - source: "FLAN task families, held-out split (10+ families)"
    - source: "Paraphrased instruction variants (20 per task)"
    - source: "Keyword-masked instruction variants"
  procedure:
    - step: "Train k=8-10 task-specific LoRA adapters (oracle)"
    - step: "Train linear probe on frozen MiniLM embeddings → oracle adapter labels"
    - step: "Evaluate IPCR routing on held-out task families"
    - step: "Compare to random, uniform, LORAUTER-zero baselines"
    - step: "Run paraphrase and keyword-masking robustness tests"
  success_criteria:
    - "Linear probe top-1 ≥70% OR top-3 ≥85%"
    - "IPCR ≥90% of oracle on single-task instructions"
    - "Significant improvement over uniform baseline (p<0.01)"
    - "Paraphrase cosine similarity ≥0.90"
    - "ECE ≤0.15 for routing calibration"

validation:
  internal_validity:
    - "Held-out task family split prevents data leakage"
    - "Frozen encoder isolates prefix predictiveness from learned routing"
    - "Pre-registered thresholds prevent post-hoc interpretation"
  external_validity:
    - "FLAN covers diverse instruction types (translation, QA, summarization, etc.)"
    - "Multiple base models (Llama-2, Mistral) test generalization"

discussion_synthesis:
  key_insights:
    - "Alignment is plausible because prefix embeddings and LoRA deltas share base-model representational ancestry"
    - "Testing WHETHER alignment exists is more novel than building a router that assumes it"
    - "Two-tier contribution: practical (zero-shot routing) + theoretical (geometric alignment)"
  breakthrough_moments:
    - "Exchange 7: Reframing from IPCR (method) to IAGA (structural theory)"
    - "Exchange 13: Diagnostic ladder with H-E0 prefix separability prerequisite"
    - "Exchange 14-15: Oracle margin and representation drift analysis"
  resolved_tensions:
    - "Soft vs hard routing: soft routing recommended due to graceful degradation"
    - "Compositional tasks: scoped as extension, not core hypothesis"
    - "Geometric isomorphism: tempered to 'partial alignment' rather than 'perfect structure'"
