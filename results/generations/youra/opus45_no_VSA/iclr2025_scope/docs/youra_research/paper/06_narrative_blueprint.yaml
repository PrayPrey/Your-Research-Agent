# Narrative Blueprint: IPCR Zero-Shot Adapter Routing
# Phase 6 Step 2 - Narrative Design
# Generated: 2026-08-09

metadata:
  paper_title: "Zero-Shot Adapter Routing via Instruction Prefix Embeddings"
  main_hypothesis: "H-IPCR-v1"
  target_venue: "ICML 2025"
  word_target: "~6000-7000 (8 pages)"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  opening_statement:
    content: "A model achieving 95% accuracy on standard benchmarks can fail to generalize when adapter selection depends on task-specific validation data that doesn't exist at deployment."
    strategy: "practical_failure"

  why_reader_should_care:
    main_reason: "Adapter-based specialization is the dominant approach for multi-task LLMs, but existing routing methods require validation examples that are unavailable in zero-shot settings"
    concrete_example: "LoRAHub requires gradient-free optimization over validation loss; LORAUTER needs 5+ validation examples per task"
    stakes: "Without zero-shot routing, adapter banks remain inaccessible for new instructions at inference time"

# ============================================================================
# PROBLEM FRAMING (3 Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Multi-task LLMs benefit from task-specialized LoRA adapters, but selecting the right adapter at inference requires knowing the task"
    common_understanding: "Prior work uses validation examples or gradient signals to route queries to adapters"

  deeper_problem:
    description: "Existing routing methods assume access to task-specific validation data, which is unavailable when encountering novel instructions"
    why_overlooked: "Most adapter routing research focused on few-shot or gradient-based settings"
    our_perspective: "We ask: does the instruction itself contain sufficient signal for routing, without any task examples?"

  gap_in_existing_work:
    description: "No prior work tests whether instruction-adapter alignment exists intrinsically"
    why_gap_exists: "Focus on learning routing rather than testing whether alignment is already present"
    why_gap_matters: "If alignment exists, zero-shot routing becomes possible without validation data"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Instruction prefixes embedded by frozen sentence encoders are linearly separable by task family, enabling zero-shot adapter routing without validation examples."
    expanded_explanation: "We discovered that MiniLM embeddings of FLAN instruction prefixes cluster by task type with F1=0.995, and a simple linear probe can predict the optimal adapter with 72.67% top-1 accuracy (95.78% top-3). This suggests instruction semantics and adapter specializations share geometric structure."

  why_others_missed_it:
    common_assumptions: "Routing must be learned jointly with adapters or require validation examples"
    our_different_view: "We hypothesized that pre-existing alignment from the base model's instruction tuning might be sufficient"
    enabling_factor: "Testing the simplest possible approach (frozen encoder + linear probe) before adding complexity"

  what_makes_it_work:
    intuitive_explanation: "FLAN instructions contain task-indicative keywords that cluster in embedding space"
    key_mechanism: "MiniLM's contrastive pretraining preserves task-relevant semantics that align with adapter specializations"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Zero-shot adapter routing achieves ≥90% of oracle task-specific LoRA performance"
    measurable_criteria: "IPCR achieves 95.00% of oracle performance on held-out FLAN task families"

  supporting_evidence:
    - id: "evidence_1"
      what: "Instruction embeddings are linearly separable (F1=0.995)"
      so_what: "Proves task signal exists in frozen embeddings"
      how_it_supports_claim: "Prerequisite for routing - if embeddings don't separate, routing is impossible"

    - id: "evidence_2"
      what: "Linear probe achieves 72.67% top-1, 95.78% top-3 adapter selection"
      so_what: "Simple linear mapping suffices for routing"
      how_it_supports_claim: "Demonstrates practical routing accuracy without complex architectures"

    - id: "evidence_3"
      what: "IPCR outperforms uniform (36.79%) and random (14.97%) baselines"
      so_what: "Routing provides meaningful benefit over naive approaches"
      how_it_supports_claim: "Statistical significance (p < 1e-200) confirms real effect"

  surprising_findings:
    finding: "Routing relies heavily on lexical keywords, not deep semantics (cosine 0.78 under paraphrase)"
    why_surprising: "Expected contrastive-trained encoder to provide paraphrase invariance"
    our_interpretation: "MiniLM mean-pooling captures token presence, not compositional meaning; routing works via lexical anchoring in FLAN templates"

# ============================================================================
# LIMITATIONS (Honest, Paper-Ready)
# ============================================================================

limitations:
  must_include:
    - id: "L1"
      limitation: "Routing depends on lexical keywords; 44% accuracy drop under 50% keyword masking"
      scope: "IPCR works on FLAN-formatted instructions; fragile to paraphrased queries"
      mitigation_direction: "Paraphrase augmentation during probe training"

    - id: "L2"
      limitation: "Paraphrase fragility (cosine 0.78 < 0.90 threshold)"
      scope: "Real-world instruction variations will cause routing errors (~24% inconsistency)"
      mitigation_direction: "Contrastive fine-tuning or larger encoder (E5-large)"

    - id: "L3"
      limitation: "Tested 9-18 task families, not full 62 FLAN categories"
      scope: "Generalization to untested families unverified"
      mitigation_direction: "Full-scale evaluation on complete FLAN taxonomy"

# ============================================================================
# TAKEAWAY & BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First demonstration that zero-shot adapter routing is achievable using frozen instruction embeddings"
    why_significant: "Eliminates validation data requirement for adapter selection"

  implications:
    for_field: "Opens new direction for intrinsic alignment between instructions and adapters"
    for_practice: "Enables adapter banks for API/template-controlled instruction formats"

  future_possibilities:
    immediate_extensions: "Robust router training with paraphrase augmentation; hybrid routing"
    longer_term_vision: "Compositional routing for multi-step tasks; adapter mixing"

# ============================================================================
# SECTION-LEVEL GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: problem → insight → method → results → limitation"
    key_message: "Zero-shot adapter routing achieves 95% of oracle via instruction embeddings, but depends on lexical features"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "practical_failure"
    transition_to_related: "Prior routing methods and their validation requirements"

  related_work:
    narrative_purpose: "Show existing routing methods insufficient for zero-shot setting"
    positioning_strategy: "LoRAHub/LORAUTER require validation; we test intrinsic alignment"
    key_comparison_points:
      - "LoRAHub (401 cites): gradient-free but needs validation loss"
      - "LORAUTER (2 cites): task embeddings but needs 5+ examples"
      - "MoELoRA (62 cites): jointly trained, can't generalize to new tasks"

  methodology:
    narrative_purpose: "Simple approach testing intrinsic alignment"
    connection_to_insight: "If alignment exists, simplest probe should work"
    key_design_decisions:
      - "Frozen MiniLM encoder (no fine-tuning)"
      - "Linear probe (minimal capacity)"
      - "FLAN task families (standardized benchmark)"

  experiments:
    narrative_purpose: "Test three claims: separability → routing → performance"
    experimental_questions:
      - "H-E0: Are instruction embeddings linearly separable by task?"
      - "H-E1: Can linear probe select optimal adapter?"
      - "H-M1: Does IPCR achieve ≥90% of oracle?"
      - "H-M2: Is routing robust to perturbations?"

  results:
    narrative_purpose: "Present evidence with interpretation"
    main_result_highlight: "95% of oracle performance validates zero-shot routing"

  discussion:
    narrative_purpose: "Interpret robustness failure honestly"
    honest_limitations:
      - "Lexical dependence, not semantic understanding"
      - "Paraphrase fragility limits deployment scope"

  conclusion:
    narrative_purpose: "Callback to hook, vision for robust routing"
    callback_to_hook: "Zero-shot routing is achievable but requires robustification for open-ended queries"

