    - prior_work: "SelfCheckGPT (Manakul 2023)"
      difference: "Requires sampling and external consistency check; CLTI uses internal states"
    - prior_work: "MIND (Su 2024)"
      difference: "Uses arbitrary internal state features; CLTI uses interpretable trajectory metrics"
    - prior_work: "END cross-layer entropy (Wu 2025)"
      difference: "No normalized trajectory formalization; CLTI adds CMI and RCI"

