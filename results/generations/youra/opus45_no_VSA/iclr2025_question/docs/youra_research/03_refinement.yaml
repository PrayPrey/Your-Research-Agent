# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-CLTI-v1"
  confidence_level: 0.65
  core_hypothesis_statement: |
    Under single-pass inference on TruthfulQA MC1 (LLaMA-2-7B, layers 24-32),
    if we compute cross-layer trajectory metrics (NTI, CMI, RCI),
    then hallucinated responses exhibit higher instability (NTI), lower
    convergence monotonicity (CMI), and characteristic competition patterns (RCI),
    because factual retrieval follows stable attractor dynamics while
    fabrication requires iterative cross-layer constraint satisfaction.
  alternative_hypothesis_h0: |
    There is no significant difference in cross-layer trajectory metrics
    (NTI, CMI, RCI) between correct and incorrect responses on TruthfulQA MC1
    beyond what final-layer entropy already predicts.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "response_correctness"
      type: "categorical"
      operationalization: "TruthfulQA MC1 binary label (correct=1, incorrect=0)"
      levels: ["correct", "incorrect"]
  dependent:
    - name: "NTI"
      type: "continuous"
      operationalization: "Normalized Trajectory Instability = var(delta_l) / (H_L + epsilon), layers 24-32"
      primary: true
    - name: "CMI"
      type: "continuous"
      operationalization: "Convergence Monotonicity Index = proportion of layers where sim_{l+1} > sim_l - delta (delta=0.002)"
      primary: false
    - name: "RCI"
      type: "continuous"
      operationalization: "Representational Competition Index = sim_l(best_rejected) - sim_l(chosen) per layer"
      primary: false
    - name: "KL_path_length"
      type: "continuous"
      operationalization: "Cumulative KL(p_l || p_{l+1}) across layers 24-32"
      primary: false
  controlled:
    - name: "sequence_length"
      operationalization: "Median aggregation per token, regression control"
    - name: "model_architecture"
      operationalization: "Fixed to LLaMA-2-7B (32 layers)"
    - name: "decoding_method"
      operationalization: "Greedy decoding only"
    - name: "temperature"
      operationalization: "0 (deterministic)"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Model receives question and generates hidden representations at each layer"
      evidence: "Standard transformer forward pass"
      falsifier: "N/A - architectural fact"
    - step: 2
      description: "For factual retrieval, representations converge monotonically toward a knowledge-grounded attractor"
      evidence: "MIND framework shows internal states differ for factual vs hallucinated; logit lens shows progressive refinement"
      falsifier: "CMI shows no difference between correct/incorrect, or early layers show equal signal"
    - step: 3
      description: "For fabrication, representations must satisfy multiple soft constraints without grounded knowledge, causing cross-layer reorientation"
      evidence: "Constraint satisfaction requires computation; no stable attractor means trajectory oscillation"
      falsifier: "KL path length identical for both classes; RCI flip pattern absent or <30% prevalence"
    - step: 4
      description: "Reorientation manifests as higher entropy variance, non-monotonic similarity, and transient alignment with alternative answers"
      evidence: "END cross-layer entropy shows correlation with factuality"
      falsifier: "NTI collinear (r>0.9) with H_L; trajectory features add no incremental validity"
  key_tension: "False attractor problem - hallucinations may converge smoothly to wrong answers"
  evidence_summary: |
    Prior work (MIND, END, semantic entropy probes) demonstrates internal states
    carry hallucination-relevant signal. The CLTI hypothesis operationalizes this
    via trajectory metrics that can be computed from single forward pass.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Logit-lens provides meaningful probability distributions for layers 24-32"
    supporting_evidence: "Tuned Lens validation, Nostalgebraist 2020, standard interpretability practice"
    consequence_if_violated: "Per-layer entropy/similarity computations are geometrically distorted, not semantically meaningful"
  - id: "A2"
    assumption: "TruthfulQA MC1 wrong answers can be treated as 'hallucinations'"
    supporting_evidence: "MC1 incorrect selections indicate factual error; standard benchmark usage"
    consequence_if_violated: "Some 'incorrect' may be ambiguous rather than hallucinated; dilutes signal"
  - id: "A3"
    assumption: "Cross-layer dynamics reflect epistemic processing, not just geometric artifacts"
    supporting_evidence: "Projection and permutation controls will test this directly"
    consequence_if_violated: "Trajectory features are geometry, not knowledge — detection may work but interpretability fails"
  - id: "A4"
    assumption: "LLaMA-2-7B results generalize to similar decoder-only architectures"
    supporting_evidence: "Common architecture pattern; prior hallucination work uses LLaMA"
    consequence_if_violated: "Hypothesis may be architecture-specific; scope narrower than claimed"
  - id: "A5"
    assumption: "Greedy decoding doesn't fundamentally change trajectory patterns"
    supporting_evidence: "Greedy is most common deployment; stochasticity adds noise not signal"
    consequence_if_violated: "Temperature-dependent effects may exist; would need separate study"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Decoder-only transformer LLMs (LLaMA, Mistral, GPT-style)
    - Factual QA tasks with verifiable ground truth
    - Single forward-pass inference (no sampling required)
    - Late layers (final 8-10) where logit-lens is reliable
  does_not_apply_to: |
    - Open-ended generation without verifiable answers
    - Reasoning tasks (math, logic) where "hallucination" is undefined
    - Encoder-only or encoder-decoder models
    - Early layers where logit-lens degrades
  known_limitations: |
    - Single architecture (LLaMA-2-7B) tested initially
    - TruthfulQA MC1 is multiple-choice, not free generation
    - Interpretability claims (RCI flip) contingent on pattern prevalence
    - Causal intervention is exploratory, not gated

