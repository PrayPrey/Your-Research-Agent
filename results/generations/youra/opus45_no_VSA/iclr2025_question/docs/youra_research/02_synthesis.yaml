hypothesis_draft:
  title: "Cross-Layer Trajectory Instability (CLTI) for Hallucination Detection"
  hypothesis_id: "H-CLTI-v1"
  core_claim: |
    Under single-pass inference on TruthfulQA MC1 (LLaMA-2-7B, layers 24-32),
    hallucinated responses exhibit higher trajectory instability (NTI), lower
    convergence monotonicity (CMI), and characteristic representational competition
    patterns (RCI), because factual retrieval follows stable attractor dynamics
    while fabrication requires iterative cross-layer constraint satisfaction.
  mechanism: |
    1. Model generates hidden representations at each layer
    2. Factual retrieval: representations converge monotonically toward knowledge-grounded attractor
    3. Fabrication: representations must satisfy constraints without grounded knowledge, causing reorientation
    4. Reorientation manifests as entropy variance, non-monotonic similarity, transient alignment with alternatives
  predictions:
    - P1: "NTI achieves AUROC > 0.55 (MUST_WORK)"
    - P2: "Combined model improves AUROC >= 0.03 over H_L alone (SHOULD_WORK)"
    - P3: "Low-entropy subset discrimination with CI excluding 0.50 (SHOULD_WORK)"

variables_summary:
  independent: "Response correctness on TruthfulQA MC1 (binary)"
  dependent_primary: "NTI = var(delta_l) / (H_L + epsilon) across layers 24-32"
  controlled: "Sequence length (median aggregation), model (LLaMA-2-7B), decoding (greedy), temperature (0)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in cross-layer trajectory metrics
    (NTI, CMI, RCI) between correct and incorrect responses on TruthfulQA MC1
    beyond what final-layer entropy already predicts.
  statistical_test: "Nested model comparison (likelihood ratio test) + bootstrap AUROC CI"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    Shifts measurement paradigm from output confidence to internal processing
    dynamics. Extracts interpretable trajectory features from single forward
    pass without sampling or ensemble methods.
  differentiation_summary: |
    Unlike semantic entropy (requires sampling), SelfCheckGPT (requires consistency
    check), or MIND (arbitrary features), CLTI provides single-pass, interpretable
    trajectory metrics with mechanistic justification.

