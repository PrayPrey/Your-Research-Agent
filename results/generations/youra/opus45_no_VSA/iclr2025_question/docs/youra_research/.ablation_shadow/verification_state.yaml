main_hypothesis:
  id: H-CLTI-v1
  title: Cross-Layer Trajectory Instability (CLTI) for Hallucination Detection
  statement: Under single-pass inference on TruthfulQA MC1 (LLaMA-2-7B, layers 24-32), hallucinated responses exhibit higher
    trajectory instability (NTI), lower convergence monotonicity (CMI), and characteristic competition patterns (RCI), because
    factual retrieval follows stable attractor dynamics while fabrication requires iterative cross-layer constraint satisfaction.
  defined_in: 03_refinement.yaml
