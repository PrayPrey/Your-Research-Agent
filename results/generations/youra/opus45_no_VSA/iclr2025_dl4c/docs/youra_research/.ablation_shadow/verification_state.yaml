  id: H-HybridRL-Refine-v1
  title: Superadditive Gains from Hybrid RL Training and Test-Time Refinement
  statement: RL training with structurally diverse execution feedback induces a feedback-conditioned edit policy that, when
    combined with test-time refinement, produces superadditive accuracy gains measurable via positive interaction terms.
