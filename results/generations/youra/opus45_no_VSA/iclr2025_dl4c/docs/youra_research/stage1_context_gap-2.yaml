gap_title: "Limited Hybrid Approach Studies (Training + Test-Time Combined)"
gap_description: |
  Most papers study either training-time RL OR test-time refinement in isolation.
  ScaleRTL (2025) mentions both but focuses on reasoning data.
  "Rethinking Fine-Tuning" touches on interaction but is theoretical.

  Missing: Empirical study combining RL-trained models with test-time refinement.
  Key questions: Does RL training make test-time refinement more or less effective?
  Are gains additive or superadditive?

