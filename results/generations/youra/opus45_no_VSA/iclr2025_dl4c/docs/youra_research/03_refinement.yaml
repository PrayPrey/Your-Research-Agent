# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The Training × Refinement interaction term will be positive and statistically significant on pass@1"
    test_method: "Logit-scale GLMM: logit(P(success)) ~ Training × Refinement + (1|Problem)"
    success_criterion: "Interaction coefficient > 0, p < 0.05, odds ratio ≥ 1.2"
    falsification: "Interaction coefficient ≤ 0 or p ≥ 0.05 across both benchmarks"
  - id: "P2"
    primary: false
    statement: "RL models show greater sensitivity to semantic feedback contradiction than CE models"
    test_method: "Difference-in-differences: [(A-C)_RL - (A-C)_CE] where A=original, C=contradiction"
    success_criterion: "DiD contrast > 0, p < 0.05"
    falsification: "DiD ≤ 0, indicating no differential semantic sensitivity"
  - id: "P3"
    primary: false
    statement: "RL training increases structural coupling between feedback and edits"
    test_method: "Normalized PMI between feedback spans (F) and edit spans (E)"
    success_criterion: "I(F;E)_RL > I(F;E)_CE, p < 0.05, controlling for edit length"
    falsification: "I(F;E)_RL ≤ I(F;E)_CE, indicating no structural coupling improvement"

