# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-HybridRL-Refine-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under conditions where RL training includes structurally diverse execution feedback
    (H(Schema|ErrorClass) > threshold), if we apply both RL training and K-step test-time
    refinement to code generation models, then we observe (1) superadditive accuracy gains
    (Training×Refinement interaction > 0 on logit scale), (2) differential sensitivity to
    semantic feedback structure (difference-in-differences > 0), and (3) increased
    feedback→edit mutual information, because RL training induces a feedback-conditioned
    edit policy that transfers to inference-time refinement.
  alternative_hypothesis_h0: |
    RL training does not alter the model's conditional response to semantic feedback
    structure. Any accuracy gains from combining RL training with test-time refinement
    are purely additive (interaction term ≈ 0) or attributable to baseline competence
    differences (difference-in-differences ≈ 0).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "training_type"
      type: "categorical"
      operationalization: "CE (cross-entropy on code completion) vs RL (execution-based rewards using CodeRL protocol)"
      levels: ["CE", "RL"]
    - name: "inference_mode"
      type: "categorical"
      operationalization: "single-shot (K=0) vs K-step refinement (K=3, Self-Refine protocol)"
      levels: ["single-shot", "refined"]
    - name: "training_feedback_diversity"
      type: "categorical"
      operationalization: "H(Schema|ErrorClass): low (<1.5 bits) vs high (>2.5 bits)"
      levels: ["low", "high"]
  dependent:
    - name: "pass_at_1"
      type: "continuous"
      operationalization: "Proportion of problems solved correctly on first attempt (logit-transformed for analysis)"
      primary: true
    - name: "feedback_edit_mutual_information"
      type: "continuous"
      operationalization: "I(F;E) = normalized PMI between feedback-referenced spans and edit-modified spans"
      primary: false
    - name: "per_error_class_correction_rate"
      type: "continuous"
      operationalization: "P(fix | feedback, error_class) for syntax, type, logical, boundary classes"
      primary: false
    - name: "edit_precision"
      type: "continuous"
      operationalization: "Proportion of edits confined to error-relevant code spans"
      primary: false
  controlled:
    - name: "model_architecture"
      operationalization: "CodeT5+-base (220M parameters) for all conditions"
    - name: "training_data"
      operationalization: "Same code corpus for CE and RL training"
    - name: "evaluation_benchmarks"
      operationalization: "HumanEval+ (164 problems) and MBPP+ (500+ problems)"
    - name: "refinement_protocol"
      operationalization: "Self-Refine with execution feedback (3 iterations max)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "RL training optimizes p(edit | code, feedback) under diverse feedback distributions"
      evidence: "CodeRL demonstrates RL can use execution signals as reward; we extend to diverse feedback"
      falsifier: "If RL training does not alter conditional edit distribution relative to CE"
    - step: 2
      description: "Structural diversity in training feedback forces abstraction over feedback structure rather than surface memorization"
      evidence: "Meta-learning theory: diverse tasks → generalizable skills"
      falsifier: "If low-diversity RL produces equivalent superadditivity, diversity is not necessary"
    - step: 3
      description: "Abstraction manifests as increased I(F;E) — structural coupling between feedback spans and edit locations"
      evidence: "Novel metric; analogous to attention alignment in interpretability"
      falsifier: "If I(F;E)_RL ≤ I(F;E)_CE, no structural coupling is induced"
    - step: 4
      description: "At inference, structural coupling compounds: each refinement step is more directed, producing superadditive pass@k"
      evidence: "Mathematical: if per-step improvement is higher for RL, K iterations compound multiplicatively"
      falsifier: "If gains are additive or subadditive (interaction ≤ 0)"
  key_tension: "RL may reduce exploration diversity while increasing edit directionality — the net effect on refinement is empirical"
  evidence_summary: |
    The mechanism proposes that RL training with diverse feedback teaches the model to
    structurally couple feedback tokens to edit locations, which transfers to improved
    refinement at inference time. This is measured via I(F;E) mutual information metric.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "RL training from execution feedback is computationally feasible with available resources"
    supporting_evidence: "CodeRL reports 2 days on 8 GPUs; manageable with smaller model or existing checkpoint"
    consequence_if_violated: "Experiment cannot be conducted; need alternative training approach"
  - id: "A2"
    assumption: "Error classes (syntax, type, logical, boundary) are separable enough for meaningful conditional probability estimates"
    supporting_evidence: "Static analyzers (pylint, mypy) reliably classify syntax/type errors; logical errors need test failure patterns"
    consequence_if_violated: "Per-error-class analysis becomes noisy; aggregate analysis may still hold"
  - id: "A3"
    assumption: "Feedback perturbations can be constructed with controlled semantics (paraphrase vs contradiction)"
    supporting_evidence: "Template-based approach: swap variable names, change line numbers, invert error conditions"
    consequence_if_violated: "Cannot isolate semantic sensitivity; behavioral results alone remain valid"
  - id: "A4"
    assumption: "Transformer architecture does not already provide maximal abstraction under any training regime"
    supporting_evidence: "If true, low-diversity RL would show superadditivity; ablation tests this"
    consequence_if_violated: "Diversity is not a necessary condition, but superadditivity may still hold"
  - id: "A5"
    assumption: "HumanEval+ and MBPP+ provide sufficient problem diversity for statistical power"
    supporting_evidence: "Combined 664+ problems × multiple seeds = adequate cell sizes for GLMM"
    consequence_if_violated: "Need additional benchmarks or larger sample sizes"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Function-level code generation (single-function Python problems)
    - Models with encoder-decoder or decoder-only architectures
    - Benchmarks with execution-based evaluation (test case pass/fail)
    - Settings where structured execution feedback (tracebacks) is available
  does_not_apply_to: |
    - Repository-level code generation (multi-file, long-context)
    - Natural language tasks without structured feedback
    - Domains without executable evaluation (e.g., open-ended text generation)
    - Models without fine-tuning capability (API-only models)
  known_limitations: |
    - Results may not transfer to models with fundamentally different architectures
    - Training diversity effects may saturate at high diversity levels
    - Feedback perturbation quality depends on template design

