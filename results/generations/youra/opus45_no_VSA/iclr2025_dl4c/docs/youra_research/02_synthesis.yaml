hypothesis_draft:
  title: "Superadditive Gains from Hybrid RL Training and Test-Time Refinement in Code Generation"
  hypothesis_id: "H-HybridRL-Refine-v1"
  core_claim: |
    RL training with structurally diverse execution feedback induces a feedback-conditioned
    edit policy that, when combined with test-time refinement, produces superadditive accuracy
    gains measurable via positive interaction terms in factorial designs.
  mechanism: |
    RL optimizes p(edit | code, feedback) under diverse feedback distributions, forcing
    abstraction over feedback structure. This abstraction manifests as increased mutual
    information I(F;E) between feedback-referenced error spans and edit-modified code spans.
    At inference, this structural coupling compounds: each refinement step is more directed,
    producing multiplicatively better outcomes than either approach alone.
  predictions:
    - P1: "Training × Refinement interaction > 0 on logit(pass@1), p < 0.05"
    - P2: "Difference-in-differences [(A-C)_RL - (A-C)_CE] > 0 for semantic sensitivity"
    - P3: "I(F;E)_RL > I(F;E)_CE controlling for edit length"

variables_summary:
  independent: "Training type (CE vs RL), Inference mode (single-shot vs refined), Training feedback diversity (low vs high)"
  dependent_primary: "pass@1 on HumanEval+ and MBPP+ (logit-transformed)"
  controlled: "Model architecture (CodeT5+-base), training data, evaluation benchmarks, refinement protocol"

null_hypothesis:
  h0_statement: |
    RL training does not alter the model's conditional response to semantic feedback structure.
    Any accuracy gains from combining RL training with test-time refinement are purely additive
    (interaction term ≈ 0) or attributable to baseline competence differences.
  statistical_test: "Two-way ANOVA / GLMM interaction term"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Feedback→edit mutual information I(F;E) as mechanistic probe for policy structure"
  differentiation_summary: |
    Prior work evaluates RL training (CodeRL) and test-time refinement (Self-Refine) in isolation.
    This work is the first to systematically combine them and measure the interaction effect.
    The I(F;E) metric is a novel contribution for probing structural coupling in code generation.

