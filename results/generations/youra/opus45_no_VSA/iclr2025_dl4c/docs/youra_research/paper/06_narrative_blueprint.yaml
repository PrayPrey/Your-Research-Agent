    key_message: "First framework for Training×Refinement interaction with I(F;E) metric"
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "puzzle (does training transfer to inference?)"
