      - "Insight: Feedback-conditioned policy transfers"
      - "Contributions: Framework, metric, validation"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify factorial design"
    positioning_strategy: "Not competing with CodeRL/Self-Refine; combining them"
    key_comparison_points:
      - "CodeRL: RL training evaluated single-shot only"
      - "Self-Refine: Applied to pretrained, not RL-trained models"
      - "S*: Hybrid test-time scaling without RL training component"
      - "No prior work measures interaction term"

  methodology:
    narrative_purpose: "Show WHY factorial design solves the problem"
    connection_to_insight: |
      I(F;E) operationalizes the feedback-conditioned policy hypothesis.
      Factorial design isolates interaction from main effects.
    key_design_decisions:
      - "2×2 factorial: CE/RL × single-shot/refined"
      - "MINE estimator for I(F;E) measurement"
      - "FeedbackDiversityController for ablation"
      - "GLMM with problem random effects for statistics"

  experiments:
    narrative_purpose: "Design tests that verify specific mechanism claims"
    experimental_questions:
      - "Q1: Is Training×Refinement interaction > 0? (H-E1)"
      - "Q2: Is I(F;E)_RL > I(F;E)_CE? (H-M1)"
      - "Q3: Is high diversity necessary for superadditivity? (H-C1)"
    dataset_rationale: "HumanEval+ (164) + MBPP+ (500+) provide statistical power"
    baseline_rationale: "CE baseline isolates RL's contribution to interaction"

  results:
    narrative_purpose: "Present validated infrastructure, acknowledge smoke-test limitations"
    main_result_highlight: |
      All code paths execute successfully. 2×2 framework operational.
      MINE produces bounded MI estimates. Diversity manipulation verified.
    honest_framing: |
      Smoke tests validate methodology, not hypothesis. Full experiments pending.

  discussion:
    narrative_purpose: "Interpret validation results, acknowledge scope"
    honest_limitations:
      - "Smoke test only — no statistical power for hypothesis confirmation"
      - "H-M2 blocked by CUDA driver incompatibility"
      - "Single model architecture (CodeT5+-220M)"
      - "Single seed in PoC runs"
    limitation_framing: |
      These are infrastructure/resource limitations, not methodology flaws.
      Code is complete; full validation requires GPU compute.

  conclusion:
    narrative_purpose: "Reinforce gap-filling contribution, open future"
    callback_to_hook: |
      We asked whether RL training transfers to test-time refinement.
      Our validated framework now enables systematic measurement of this interaction.
    future_vision: |
      Full-scale experiments will determine whether RL+Refine achieves superadditivity.
      If confirmed, training objectives should explicitly optimize for inference synergy.

