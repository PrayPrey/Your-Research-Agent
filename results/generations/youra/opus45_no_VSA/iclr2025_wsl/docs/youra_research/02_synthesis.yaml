# Supplementary file for Phase 2B (FULL_LOAD)
# Contains synthesis details, measurement plan, and validation strategy

metadata:
  generated_at: "2026-08-10T12:00:00Z"
  workflow: "phase2a-dialogue"
  architecture: "Self-Contained Tikitaka Loop"
  schema_version: "10.0.0"
  gap_id: "gap-1"

hypothesis_draft:
  title: "CV of Participation Ratio as Model Quality Signal"
  hypothesis_id: "H-CVPR-v1"
  core_claim: |
    The coefficient of variation (CV) of participation ratio, computed via
    randomized SVD with 20 seeds, captures spectral shape information that
    correlates negatively with model generalization quality. Low CV indicates
    flatter spectral decay and better-conditioned weight matrices.
  mechanism: |
    Training shapes weight spectral properties (Martin & Mahoney 2019).
    Flatter spectral decay enables faster, more stable SVD convergence.
    Stability across SVD seeds (low CV) indicates well-conditioned weights.
    Well-conditioned weights correlate with smooth loss landscapes and
    better generalization (Li et al. 2018).
  predictions:
    - P1: "correlation(CV_PR, accuracy) < -0.3 with p < 0.05"
    - P2: "partial_correlation(CV_PR, accuracy | condition_number) significant"
    - P3: "|correlation_within_ResNet| > |correlation_cross_family|"

variables_summary:
  independent: "CV_PR: std(PR across 20 SVD seeds) / mean(PR), averaged over layers"
  dependent_primary: "ImageNet top-1 accuracy (%)"
  controlled: "Architecture family, parameter count, training dataset (ImageNet-1K)"

null_hypothesis:
  h0_statement: |
    There is no significant negative correlation between CV_PR and model accuracy.
    The observed variance in participation ratio across SVD seeds is random noise
    unrelated to model quality.
  statistical_test: "Pearson correlation with bootstrap 95% CI"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Using SVD estimator variance as model quality proxy"
  differentiation_summary: |
    Prior work (Unterthiner 2020, Martin & Mahoney 2019) computed spectral
    properties directly. This hypothesis measures the STABILITY of those
    computations, connecting computational properties of spectral decomposition
    to model generalization. No prior work used CV of participation ratio
    as a quality signal.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "ResNet variants (resnet10t through resnet200d, ~80 models)"
    - "ViT variants (~100 models)"
    - "EfficientNet variants (~50 models)"
    - "ConvNeXt variants (~20 models)"
  datasets:
    - "ImageNet-1K (pretrained weights source)"
    - "timm metadata (accuracy ground truth)"
  baselines:
    - "Unterthiner features (mean, variance, spectral properties)"
    - "Condition number only (max/min singular value ratio)"

measurement_plan:
  data_collection:
    - source: "timm.list_models(pretrained=True)"
      action: "Download pretrained weights for 100+ models"
    - source: "timm model metadata"
      action: "Extract ImageNet top-1 accuracy"
  procedure:
    - step: "For each model, extract all weight matrices from conv/linear layers"
    - step: "For each weight matrix, compute PR via randomized SVD with 20 different seeds"
    - step: "Calculate CV = std(PR) / mean(PR) per layer"
    - step: "Aggregate CV across layers via mean"
    - step: "Compute Pearson correlation(CV_PR, accuracy)"
    - step: "Compute partial correlation controlling for condition number"
    - step: "Stratify by architecture family for P3"
  success_criteria:
    - "P1: r < -0.3 with p < 0.05 (MUST_WORK)"
    - "P2: partial r significant at p < 0.05"
    - "P3: |r_within_family| > |r_pooled|"

validation:
  internal_validity:
    - "Control for parameter count via partial correlation"
    - "Use same number of SVD seeds (20) across all models"
    - "Consistent layer selection (conv2d, linear only)"
  external_validity:
    - "Test across multiple architecture families"
    - "Report results for each family separately"
    - "Bootstrap confidence intervals for stability"

