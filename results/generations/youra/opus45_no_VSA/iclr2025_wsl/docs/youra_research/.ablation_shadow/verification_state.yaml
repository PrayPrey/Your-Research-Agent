main_hypothesis:
  id: H-CVPR-v1
  title: CV of Participation Ratio as Model Quality Signal
  statement: Under pretrained image classification models from timm (n >= 100), if we compute the coefficient of variation
    (CV) of participation ratio across 20 randomized SVD seeds and aggregate layer-wise metrics via mean, then CV_PR correlates
    negatively with model accuracy (r < -0.3, p < 0.05), because CV reflects spectral shape — flatter decay enables better
    generalization.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: ImageNet-1K pretrained models (timm)
    model: 100+ pretrained models (ResNet, ViT, EfficientNet, ConvNeXt)
    optimizer: null
    hyperparameters:
      svd_seeds: 20
      layer_types:
      - conv2d
      - linear
      aggregation: mean
  baseline_comparison:
