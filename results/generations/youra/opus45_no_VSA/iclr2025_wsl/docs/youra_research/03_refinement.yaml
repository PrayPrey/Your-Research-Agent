# SECTION 0: Established Facts & Claim Scope
established_facts:
  claims:
    - claim: "Spectral features (r_eff, PR, d_MLE) are extractable from pretrained models"
      status: "BUILD_ON"
      evidence: "h-e1 Run 2 confirmed extraction methodology works"
    - claim: "Alpha (power-law exponent) does not discriminate model quality"
      status: "BUILD_ON"
      evidence: "h-m1 limitation: p=0.5547, not significant"
    - claim: "GroupNorm models show lower CV than BatchNorm"
      status: "PROVE_NEW"
      evidence: "h-e1 Run 2 showed CV=0.0 for GroupNorm, but n=1"
    - claim: "Weight statistics predict accuracy with R² > 0.98"
      status: "BUILD_ON"
      evidence: "Unterthiner et al. 2020 baseline"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims need no re-verification. PROVE_NEW claims require validation.
    Focus experimental effort on P1 (CV-accuracy correlation) as primary gate.

# SECTION 1.1: Core Statement
core_statement:
  hypothesis_id: "H-CVPR-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under pretrained image classification models from timm (n >= 100),
    if we compute the coefficient of variation (CV) of participation ratio
    across 20 randomized SVD seeds and aggregate layer-wise metrics via mean,
    then CV_PR correlates negatively with model accuracy (r < -0.3, p < 0.05),
    because CV reflects spectral shape — flatter decay enables better generalization.
  alternative_hypothesis_h0: |
    There is no significant negative correlation between CV_PR and model accuracy
    (r >= 0 or p >= 0.05).

# SECTION 1.2: Variables Table
variables:
  independent:
    - name: "CV_PR"
      type: "continuous"
      operationalization: "std(PR across 20 SVD seeds) / mean(PR across seeds), averaged over all weight matrices"
      levels: null
  dependent:
    - name: "ImageNet_Top1_Accuracy"
      type: "continuous"
      operationalization: "ImageNet-1K validation top-1 accuracy (%), from timm metadata"
      primary: true
    - name: "Generalization_Gap"
      type: "continuous"
      operationalization: "Train accuracy - Validation accuracy (where available)"
      primary: false
  controlled:
    - name: "Architecture_Family"
      operationalization: "Categorical: ResNet, ViT, EfficientNet, ConvNeXt"
    - name: "Parameter_Count"
      operationalization: "Total trainable parameters (for partial correlation control)"
    - name: "Training_Dataset"
      operationalization: "Held constant: ImageNet-1K pretrained models only"

# SECTION 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Model training shapes weight matrix spectral properties"
      evidence: "Martin & Mahoney 2019: training phases reflected in spectral decay"
      falsifier: "Random weights show same spectral patterns as trained weights"
    - step: 2
      description: "Spectral shape (flat vs peaked decay) affects randomized SVD convergence rate"
      evidence: "SVD convergence theory: dominant singular values converge faster"
      falsifier: "CV independent of spectral decay pattern"
    - step: 3
      description: "Flat spectra lead to consistent SVD estimates across seeds (low CV)"
      evidence: "Computational mathematics: well-conditioned matrices have stable decomposition"
      falsifier: "CV uncorrelated with spectral flatness"
    - step: 4
      description: "Flat spectra indicate smooth loss landscapes enabling better generalization"
      evidence: "Li et al. 2018: intrinsic dimension relates to optimization landscape"
      falsifier: "Flat spectra but poor generalization observed"
  key_tension: "Effect size may be moderate (r ~ -0.3 explains only 9% variance)"
  evidence_summary: |
    Spectral analysis of neural network weights is well-established (Martin & Mahoney 2019).
    The novel connection is using estimator variance (CV) as a proxy for spectral shape,
    which is computationally cheaper than full spectral analysis.

# SECTION 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Randomized SVD introduces meaningful variance reflecting spectral properties, not just numerical noise"
    supporting_evidence: "SVD convergence depends on spectral decay rate"
    consequence_if_violated: "CV measures noise, not signal; P1 correlation spurious"
  - id: "A2"
    assumption: "timm models span sufficient diversity in training quality"
    supporting_evidence: "1700+ models with varied architectures and training recipes"
    consequence_if_violated: "Range restriction reduces observed correlation"
  - id: "A3"
    assumption: "ImageNet accuracy is a valid proxy for generalization"
    supporting_evidence: "Standard benchmark, correlated with transfer performance"
    consequence_if_violated: "Results may not transfer to other quality measures"
  - id: "A4"
    assumption: "Layer-wise mean aggregation preserves predictive signal"
    supporting_evidence: "Need empirical validation (ablation in experiments)"
    consequence_if_violated: "Better aggregation scheme may improve results"
  - id: "A5"
    assumption: "Participation ratio is more informative than condition number alone"
    supporting_evidence: "PR captures spectral shape; condition number only captures extremes"
    consequence_if_violated: "CV_PR redundant with simpler metric"

# SECTION 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Pretrained image classification models
    - timm model zoo (ResNet, ViT, EfficientNet, ConvNeXt families)
    - Models with 2D conv or linear layers
    - Models trained on ImageNet-1K
  does_not_apply_to: |
    - Language models (different architecture patterns)
    - Randomly initialized models (no training-induced structure)
    - Models < 1M parameters (insufficient spectral complexity)
    - Models not in timm zoo (no ground truth accuracy)
  known_limitations: |
    - Effect size may be moderate (|r| ~ 0.3-0.5)
    - Aggregation scheme requires empirical validation
    - Fine-tuning behavior not directly tested
    - n=1 for original GroupNorm observation

# SECTION 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "CV_PR correlates negatively with ImageNet accuracy (r < -0.3, p < 0.05)"
    test_method: "Compute CV_PR for 100+ timm models, correlate with top-1 accuracy"
    success_criterion: "Pearson r < -0.3 with p < 0.05"
    falsification: "r >= 0 or p >= 0.05"
  - id: "P2"
    primary: false
    statement: "Partial correlation CV_PR-accuracy remains significant after controlling for condition number"
    test_method: "Compute partial correlation(CV_PR, accuracy | condition_number)"
    success_criterion: "Partial r significant at p < 0.05, |r| > 0.1"
    falsification: "Partial r non-significant or |r| < 0.1"
  - id: "P3"
    primary: false
    statement: "Within ResNet family, correlation is stronger than cross-family pooled"
    test_method: "Compute correlation for ResNet subset vs full pool"
    success_criterion: "|r_within_ResNet| > |r_cross_family|"
    falsification: "Within-family correlation weaker or equal"

