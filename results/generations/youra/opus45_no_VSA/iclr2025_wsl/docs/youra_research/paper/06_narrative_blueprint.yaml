# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "We set out to prove that stable spectral properties indicate model quality — and proved the exact opposite."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Spectral analysis of neural networks is widely used but assumptions about what spectral properties mean for generalization may be inverted"
    concrete_example: "Our hypothesis that low coefficient of variation in participation ratio indicates quality was contradicted by a strong positive correlation (r=+0.61)"
    stakes: "Misunderstanding spectral-quality relationships leads to flawed model selection and architecture design"

  real_world_impact:
    application_domain: "Pretrained model selection and quality assessment"
    potential_beneficiaries: "ML practitioners selecting from model zoos (timm, HuggingFace)"
    scale_of_impact: "Thousands of pretrained models exist; better quality signals reduce deployment risk"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Predicting model quality without expensive evaluation"
    common_understanding: "Weight statistics and spectral properties correlate with accuracy"

  deeper_problem:
    description: "The direction and mechanism of spectral-quality relationships remain unclear"
    why_overlooked: "Prior work (Martin & Mahoney, WeightWatcher) computed spectral features but did not systematically test causal hypotheses about variance"
    our_perspective: "We use randomized SVD variance (CV_PR) as a novel computational proxy for spectral stability"

  gap_in_existing_work:
    description: "No systematic test of whether SVD estimator variance predicts model quality, and in which direction"
    why_gap_exists: "Prior spectral analyses computed features directly; variance of estimates across random seeds is a new angle"
    why_gap_matters: "Incorrect assumptions about stability-quality relationships propagate through model selection literature"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "CV_PR (coefficient of variation of participation ratio across SVD seeds) positively correlates with accuracy — higher variance accompanies better models, not worse."
    expanded_explanation: "We hypothesized that flat spectra lead to stable SVD estimates (low CV) and better generalization. Experiments on 94 timm models showed the opposite: r=+0.61 (p<1e-10). The causal mechanism 'flat spectra → low CV → better models' is falsified."

  why_others_missed_it:
    common_assumptions: "Spectral stability (low variance) indicates well-conditioned weight matrices and smooth loss landscapes"
    our_different_view: "We directly measured randomized SVD variance instead of assuming what it means"
    enabling_factor: "Systematic correlation test across 100+ models with controlled extraction methodology"

  what_makes_it_work:
    intuitive_explanation: "Better models may have richer, more diverse feature representations that cause higher spectral variability across SVD projections"
    key_mechanism: "Alternative hypothesis: model size confounds both accuracy and spectral diversity"
    analogy: "Like how complex orchestral music has more tonal variation than simple melodies — richness, not instability"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "The hypothesis that CV_PR negatively correlates with accuracy is falsified; empirical evidence shows strong positive correlation"
    measurable_criteria: "Pearson r > +0.3, p < 0.05 (observed: r=+0.61, p=9.24e-11)"

  supporting_evidence:
    - id: "evidence_1"
      what: "CV_PR extraction works reliably (100% completion, 100 models)"
      so_what: "The methodology is sound — the metric can be computed consistently"
      how_it_supports_claim: "Validates that observed correlation is real signal, not extraction noise"

    - id: "evidence_2"
      what: "Pearson r = +0.6065, 95% CI [0.506, 0.703], n=94"
      so_what: "Strong positive correlation, opposite to hypothesized direction"
      how_it_supports_claim: "Directly falsifies the negative correlation hypothesis"

    - id: "evidence_3"
      what: "Spearman r = +0.6368, confirming monotonic relationship"
      so_what: "Correlation holds under rank-based analysis"
      how_it_supports_claim: "Result robust to outliers and distributional assumptions"

  surprising_findings:
    finding: "Correlation direction completely inverted from prediction"
    why_surprising: "Theory predicted r < -0.3; observed r = +0.61 — not borderline, but decisively opposite"
    our_interpretation: "Model complexity/size may confound, or higher CV reflects richer representations"

  what_results_mean:
    synthesis: "The folk belief that spectral stability indicates quality needs re-examination; our falsified hypothesis points to confounding or inverted mechanism"
    confidence_level: "HIGH for falsification; MEDIUM for alternative interpretations"
    caveats: "Confounding by model size not yet controlled via partial correlation"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "We demonstrate that CV_PR positively correlates with model accuracy, falsifying the hypothesis that spectral stability indicates quality"
    why_significant: "Negative results that reveal unexpected phenomena guide future research away from dead ends"

  implications:
    for_field: "Spectral analysis papers should empirically test assumed relationships rather than relying on intuition"
    for_practice: "Model selection based on spectral 'stability' may select against better models"
    conceptual_contribution: "Randomized SVD variance as a computationally cheap quality signal (opposite sign from expected)"

  future_possibilities:
    immediate_extensions: "Partial correlation controlling param_count; architecture-stratified analysis"
    longer_term_vision: "Understanding why higher spectral variance accompanies better generalization"
    open_questions: "Is CV_PR confounded by size, or does it capture representation richness?"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress the full story: hypothesis → falsification → unexpected positive correlation"
    key_message: "CV_PR positively correlates with accuracy (r=+0.61), directly contradicting the stability-quality assumption"
    structure_notes: |
      - S1: Spectral properties of neural networks are used to predict quality
      - S2: We hypothesized CV of participation ratio negatively correlates with accuracy
      - S3: Experiments on 94 timm models revealed opposite: r=+0.61 (p<1e-10)
      - S4: The falsification points to confounding or inverted causal mechanism
      - S5-6: Implications for spectral analysis and model selection

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "Counterintuitive finding: we proved ourselves wrong"
    problem_escalation: |
      1. Surface: Model quality prediction from weights is useful
      2. Deeper: Assumed spectral stability → quality relationship untested
      3. Gap: No systematic correlation test of SVD variance signals
    insight_preview: "We tested the hypothesis rigorously — and it failed spectacularly"
    transition_to_related_work: "Prior spectral analysis work motivates but does not test our specific variance hypothesis"

  related_work:
    narrative_purpose: "Position against spectral analysis literature; show gap"
    positioning_strategy: "Build on Martin & Mahoney, WeightWatcher, Unterthiner — none tested SVD variance-quality direction"
    key_comparison_points:
      - area: "Spectral analysis of neural networks"
        limitation_to_highlight: "Computed features directly, did not test estimator variance"
        how_we_differ: "We measure randomized SVD variance as quality signal"
      - area: "Model quality prediction"
        limitation_to_highlight: "Architecture-agnostic features (Unterthiner) hit 98% R²"
        how_we_differ: "We test whether spectral variance adds interpretable signal"
    papers_to_discuss:
      - "Martin & Mahoney 2019"
      - "Unterthiner et al. 2020"
      - "WeightWatcher"
      - "Halko et al. 2011 (randomized SVD)"

  methodology:
    narrative_purpose: "Explain CV_PR extraction and correlation test design"
    connection_to_insight: "20-seed randomized SVD → compute CV of participation ratio → correlate with accuracy"
    key_design_decisions:
      - decision: "20 random seeds per layer"
        rationale: "Balance compute vs variance estimation precision"
        alternatives_considered: "10, 50 seeds; 20 is standard in literature"
      - decision: "Mean aggregation across layers"
        rationale: "Simple, interpretable; ablation deferred to future work"
        alternatives_considered: "Median, weighted by layer size"
    intuition_building: |
      - Randomized SVD projects to random subspace → variance reflects spectral shape
      - Participation ratio captures effective rank
      - CV = std/mean normalizes across models

  experiments:
    narrative_purpose: "Two-stage: H-E1 (feasibility) → H-E2 (correlation test)"
    experimental_questions:
      - question: "Can CV_PR be reliably extracted from 100+ models?"
        experiment: "H-E1: Extract from timm models, check completion and finite range"
        expected_outcome: "≥95% completion, CV_PR ∈ (0, 10)"
      - question: "Does CV_PR correlate negatively with accuracy?"
        experiment: "H-E2: Pearson/Spearman correlation with ImageNet top-1"
        expected_outcome: "r < -0.3, p < 0.05 (FAILED: observed r = +0.61)"
    baseline_rationale: "Compare against condition number only"
    dataset_rationale: "timm provides 100+ pretrained models with known accuracy"
    metric_rationale: "Pearson r captures linear relationship; Spearman confirms monotonicity"

  results:
    narrative_purpose: "H-E1 PASS, H-E2 FAIL — falsification narrative"
    main_result_highlight: "r = +0.6065, p = 9.24e-11, 95% CI [0.506, 0.703]"
    result_presentation_order:
      - result: "H-E1 feasibility: 100% completion, CV_PR in expected range"
        purpose: "Establish methodology works before showing surprising result"
      - result: "H-E2 correlation: strong POSITIVE (opposite to hypothesis)"
        purpose: "The dramatic falsification — the story's climax"
      - result: "95% CI excludes all negative values and zero"
        purpose: "Not borderline — decisively opposite"
    surprising_result_handling: "Present honestly as falsification; offer alternative explanations (confounding, inverted mechanism)"

  discussion:
    narrative_purpose: "Interpret falsification; outline future directions"
    key_findings_interpretation: "Original mechanism (flat spectra → low CV → better generalization) is wrong"
    honest_limitations:
      - limitation: "Confounding by model size not controlled"
        why_acceptable: "This was existence test; partial correlation is natural follow-up"
        future_mitigation: "Compute partial_corr(CV_PR, accuracy | param_count)"
      - limitation: "Mechanism hypotheses h-m1, h-m2 blocked"
        why_acceptable: "Proper gate enforcement; don't validate mechanism when existence fails"
        future_mitigation: "Reformulate with positive correlation hypothesis"
    broader_impact_statement: "Negative results revealing unexpected phenomena are scientifically valuable"

  conclusion:
    narrative_purpose: "Close loop; summarize contribution; point forward"
    callback_to_hook: "We set out to prove stability indicates quality — and found the opposite. This falsification is itself a contribution."
    memorable_ending: "Sometimes the most valuable finding is that our intuitions were wrong"
    future_work_vision: "Understanding why higher spectral variance accompanies better models"

