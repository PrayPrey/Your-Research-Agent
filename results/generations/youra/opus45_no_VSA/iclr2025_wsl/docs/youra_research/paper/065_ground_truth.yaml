# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 0-5 artifacts and validated paper
# Used by Adversary Agent to verify paper accuracy

version: "1.0"
extracted_at: "2026-08-10T00:00:00Z"
hypothesis_id: "H-CVPR-v1"

# Primary metrics from Phase 4 validation
metrics:
  main_metric:
    name: "Pearson correlation (CV_PR vs accuracy)"
    hypothesis_value: "r < -0.3"
    observed_value: "+0.6065"
    p_value: "9.24e-11"
    result: "FALSIFIED"

  confidence_interval:
    lower: 0.506
    upper: 0.703
    excludes_zero: true
    excludes_negative: true

  secondary_metrics:
    - name: "Spearman correlation"
      value: "+0.6368"
      p_value: "5.26e-12"

    - name: "Sample size (matched)"
      value: 94

    - name: "Extraction completion rate"
      value: "100%"
      threshold: ">=95%"

# Methodology ground truth
methodology:
  algorithm_name: "CV_PR via Randomized SVD"
  key_hyperparameters:
    - name: "n_seeds"
      value: 20
    - name: "svd_rank"
      value: 50
    - name: "oversampling"
      value: 10
    - name: "seed_base"
      value: 0

  extraction_details:
    layer_types: ["Conv2d", "Linear"]
    min_elements: 100
    aggregation: "mean"

  cv_pr_statistics:
    mean: 0.0116
    std: 0.0059
    min: 0.0014
    max: 0.0326

# Results ground truth
results:
  h_e1:
    name: "Extraction Feasibility"
    gate: "MUST_WORK"
    result: "PASS"
    evidence:
      - "100/100 models processed (100% completion)"
      - "CV_PR values in [0.0014, 0.0326]"

  h_e2:
    name: "Negative Correlation"
    gate: "MUST_WORK"
    result: "FAIL"
    evidence:
      - "Pearson r = +0.6065 (opposite direction)"
      - "p = 9.24e-11 (highly significant)"
      - "95% CI [0.506, 0.703] excludes negative values"

  blocked_hypotheses:
    - id: "h-m1"
      name: "Partial correlation controlling condition number"
      reason: "Blocked by h-e2 MUST_WORK failure"
    - id: "h-m2"
      name: "Within-family correlation"
      reason: "Blocked by h-e2 MUST_WORK failure"

# Key claims in paper
claims:
  - claim: "CV_PR can be reliably extracted from 100+ pretrained models"
    location: "Abstract, Section 5.1"
    supporting_evidence: "100% completion rate across 100 models"
    verified: true

  - claim: "CV_PR positively correlates with accuracy (r = +0.61)"
    location: "Abstract, Section 5.2"
    supporting_evidence: "Pearson r = +0.6065, p = 9.24e-11"
    verified: true

  - claim: "The negative correlation hypothesis is falsified"
    location: "Abstract, Section 5.2, Section 7"
    supporting_evidence: "95% CI [0.506, 0.703] excludes r < -0.3"
    verified: true

  - claim: "Confounding by model size is a competing explanation"
    location: "Section 5, Section 6"
    supporting_evidence: "Stated as limitation; partial correlation not computed"
    verified: true
    note: "Honest limitation acknowledged"

# Contribution verification
contributions:
  - contribution: "Methodology validation"
    evidence_in_paper: "Section 5.1 (RQ1 results)"
    ground_truth: "100% completion, CV_PR in [0.001, 0.033]"

  - contribution: "Hypothesis falsification"
    evidence_in_paper: "Section 5.2 (RQ2 results)"
    ground_truth: "r = +0.61 vs predicted r < -0.3"

  - contribution: "Interpretive framework"
    evidence_in_paper: "Section 6 (Discussion)"
    ground_truth: "Two alternative explanations provided"

# Figures
figures:
  - id: "fig_1"
    description: "Scatter plot of CV_PR vs accuracy"
    file: "figures/scatter_cv_pr_vs_accuracy.png"
    referenced_in: "Section 5.2"
    data_matches_text: true

  - id: "fig_2"
    description: "CV_PR distribution"
    file: "figures/cv_pr_distribution.png"
    referenced_in: "Section 3"
    data_matches_text: true

# Limitations acknowledged
limitations:
  - limitation: "Confounding by model size not controlled"
    acknowledged_in: "Section 6"
    honest: true

  - limitation: "Mechanism hypotheses blocked"
    acknowledged_in: "Section 6"
    honest: true

  - limitation: "Limited architecture stratification"
    acknowledged_in: "Section 6"
    honest: true

# Paper statistics
statistics:
  word_count_estimate: 3500
  figures: 3
  tables: 5
  citations: 11
  sections: 7
