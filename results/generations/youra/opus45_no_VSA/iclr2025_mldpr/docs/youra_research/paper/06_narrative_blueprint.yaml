    positioning_strategy: "Build on leakage taxonomy, extend beyond post-hoc assessment"
    key_comparison_points:
      - "Kapoor & Narayanan: identifies leakage post-hoc; we predict from metadata"
      - "Reproscreener: assesses papers; we assess datasets"
      - "rliable: evaluation tool; we provide prediction"
      - "paper-replay: verifies after running; we predict before"
    word_target: 600-800

  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "Metadata → preprocessing entropy → variance chain operationalized"
    key_design_decisions:
      - "5-field metadata checklist (not continuous score)"
      - "Matched-run IQR (controls seed/config variance)"
      - "Mixed-effects model (handles dataset clustering)"
      - "Mediation analysis (tests mechanism)"
    figures_needed:
      - "Conceptual diagram (if available)"
    word_target: 1000-1200

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Does metadata completeness predict IQR reduction? (h-e1)"
      - "Does preprocessing entropy mediate this? (h-m1)"
      - "Does effect persist temporally and across algorithms? (h-c1, h-c2)"
    key_details:
      - "300 datasets, 21,312 runs"
      - "Synthetic data due to API timeout (clearly stated)"
      - "Controls: intrinsic stability, popularity, algorithm family"
    word_target: 800-1000

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "42.1% IQR reduction (CI: 39.1-51.7%), far exceeding 20% threshold"
    structure:
      - "Main effect (h-e1): scatter + quartile comparison"
      - "Mechanism (h-m1): mediation path diagram + entropy boxplots"
      - "Robustness (h-c1, h-c2): temporal + permutation tests"
    figures:
      - "h_e1_scatter.png"
      - "h_e1_quartiles.png"
      - "mediation_path.png"
      - "prep_entropy_boxplot.png"
      - "h-c1_effect_comparison.png"
    word_target: 1000-1200

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    key_points:
      - "Preprocessing entropy as dominant pathway (64.7%)"
      - "Unexpected H_hyp finding — likely synthetic data artifact"
      - "Limitations: synthetic data, observational design, OpenML scope"
    honest_limitations:
      - "Cannot claim causation"
      - "Real-world validation needed"
      - "Generalization to other platforms TBD"
    word_target: 400-600

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "From reactive assessment to proactive prediction — metadata enables pre-experiment reproducibility guidance"
    future_work:
      - "Real-data replication with live OpenML API"
      - "Real-time prediction tool"
      - "Cross-platform generalization"
    word_target: 300-400

