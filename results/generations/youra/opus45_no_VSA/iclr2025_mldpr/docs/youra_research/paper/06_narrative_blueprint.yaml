    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "Metadata predicts reproducibility variance; preprocessing entropy is the mechanism"
    must_include:
      - "42.1% effect size"
      - "64.7% mediation"
      - "Predictive (not reactive) framing"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "puzzle_paradox"
    key_points:
      - "Reproducibility crisis established but tools are reactive"
      - "Dataset metadata as upstream predictor (novel framing)"
      - "Preprocessing entropy as mechanism"
    transition_to_related: "Position against post-hoc assessment tools"
    word_target: 800-1000

  related_work:
