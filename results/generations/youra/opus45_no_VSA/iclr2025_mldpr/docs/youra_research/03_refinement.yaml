  dataset:
    name: "OpenML Benchmark Suite"
    type: "standard"
    source: "OpenML API (openml.org)"
    path: "openml.datasets.list_datasets(), openml.runs.list_runs()"
    hypothesis_fit: |
      OpenML has ~10 million runs with rich metadata, enabling variance measurement
      across matched configurations. 38 auto-computed meta-features provide stability controls.
  model:
    name: "Mixed-Effects Regression + Mediation Analysis"
    type: "statistical"
    source: "statsmodels, scipy"
    hypothesis_fit: |
      Hierarchical variance decomposition (seed/config/dataset levels) cleanly separates
      specification-driven variance from other sources.
  baselines:
    - name: "Naive Correlation"
      method: "Simple correlation between metadata count and variance (no controls)"
    - name: "Intrinsic-Stability-Only Model"
      method: "Predict variance from NumberOfInstances, imbalance, 1-NN error only"
    - name: "Popularity-Only Model"
      method: "Predict variance from run count and citation frequency only"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First study to predict reproducibility from dataset metadata BEFORE experiments run.
    Reframes reproducibility as a continuous property of datasets (not binary property of papers).
  key_innovation: |
    Reproducibility as inverse epistemic entropy: documentation reduces degrees of freedom,
    constraining implementation heterogeneity, reducing outcome variance.
    Component-specific mediation (preprocessing but not model hyperparameters) provides
    a sharp, falsifiable mechanistic claim.
  differentiation:
    - prior_work: "Kapoor & Narayanan 2022 (Leakage Taxonomy)"
      difference: "Identified leakage types post-hoc; we predict variance from metadata pre-experiment"
    - prior_work: "Reproscreener (Bhaskar & Stodden 2024)"
      difference: "Assesses papers via LLM; we assess datasets via metadata"
    - prior_work: "rliable (Google Research)"
      difference: "Provides statistical evaluation tools; we provide predictive guidance"
    - prior_work: "paper-replay"
      difference: "Verifies reproducibility after running; we predict before running"

