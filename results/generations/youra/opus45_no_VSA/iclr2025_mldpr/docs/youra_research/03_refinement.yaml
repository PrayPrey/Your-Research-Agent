# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Reproducibility crisis in ML is well-documented (329 papers affected by leakage)"
      status: "BUILD_ON"
      evidence: "Kapoor & Narayanan 2022, 241 citations"
    - claim: "Assessment tools exist but don't predict (Reproscreener, rliable, paper-replay)"
      status: "BUILD_ON"
      evidence: "Phase 1 literature review"
    - claim: "OpenML has ~10 million runs with rich metadata including 38 auto-computed meta-features"
      status: "BUILD_ON"
      evidence: "OpenML platform documentation, Prof. Pax verification"
    - claim: "Dataset metadata completeness predicts reproducibility variance"
      status: "PROVE_NEW"
      evidence: "Core hypothesis to test"
    - claim: "Preprocessing entropy mediates metadata-variance relationship"
      status: "PROVE_NEW"
      evidence: "Mechanism hypothesis to test"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Skip verification of reproducibility crisis prevalence (established).
    Focus on: (1) metadata completeness → variance correlation, (2) preprocessing entropy mediation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-MetadataReproducibility-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under OpenML benchmark datasets with ≥10 matched runs (2019-2024),
    if metadata completeness score increases (explicit train/test splits, preprocessing specifications, missing value handling, feature semantics, versioning),
    then reproducibility variance (IQR of performance across matched runs) decreases by ≥20%,
    because richer documentation constrains preprocessing degrees of freedom, reducing pipeline heterogeneity.
  alternative_hypothesis_h0: |
    There is no significant difference in reproducibility variance between high-metadata-completeness
    and low-metadata-completeness datasets, after controlling for intrinsic stability, popularity,
    algorithm family, and infrastructure factors.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Metadata Completeness Score"
      type: "categorical"
      operationalization: |
        5-field binary checklist: (1) train/test split specified, (2) preprocessing enumerated,
        (3) missing value handling documented, (4) feature semantics provided, (5) versioning present.
        Score = sum of fields present (0-5), quartiles used for categorical analysis.
      levels: ["Q1 (0-1)", "Q2 (2)", "Q3 (3)", "Q4 (4-5)"]
  dependent:
    - name: "Reproducibility Variance (V_spec)"
      type: "continuous"
      operationalization: |
        IQR of accuracy/F1 across runs with identical flow + hyperparameters,
        after partialling out seed-level stochasticity via nested variance decomposition.
      primary: true
    - name: "Preprocessing Entropy"
      type: "continuous"
      operationalization: |
        Component diversity (Shannon entropy of imputation/scaling/encoding families) +
        hyperparameter entropy within preprocessing classes.
      primary: false
  controlled:
    - name: "Intrinsic Stability"
      operationalization: "log(NumberOfInstances), MajorityClassPercentage, 1-NN CV error"
    - name: "Popularity"
      operationalization: "log(number_of_runs), citation count"
    - name: "Algorithm Family"
      operationalization: "Fixed effects for algorithm family (RandomForest, SVM, etc.)"
    - name: "Infrastructure"
      operationalization: "Time window 2019-2024, sklearn ≥0.22"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Higher metadata completeness reduces ambiguity about preprocessing choices"
      evidence: "Documentation specifies missing value handling, feature semantics → fewer valid implementation paths"
      falsifier: "High-M and low-M datasets show equal preprocessing component diversity"
    - step: 2
      description: "Reduced ambiguity constrains preprocessing pipeline heterogeneity (lower entropy)"
      evidence: "Researchers facing explicit specifications make more uniform decisions"
      falsifier: "Preprocessing entropy is independent of metadata completeness"
    - step: 3
      description: "Lower pipeline heterogeneity reduces performance variance across implementations"
      evidence: "Same preprocessing → same transformed data → more consistent model outputs"
      falsifier: "Preprocessing entropy does not mediate metadata → variance relationship"
  key_tension: "Seed-level stochasticity may contaminate V_spec; must be partialled out"
  evidence_summary: |
    The mechanism is theoretically grounded in information theory: documentation reduces epistemic
    entropy (degrees of freedom), which reduces implementation heterogeneity, which reduces outcome
    variance. Component-specific mediation (preprocessing but not model hyperparameters) provides
    a sharp falsifiable pattern.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "OpenML seed logging is sufficiently complete to estimate Var_seed"
    supporting_evidence: "Random seeds logged in flow.parameters.random_state for many flows"
    consequence_if_violated: "Var_spec becomes a residual mixture term; causal language weakens"
  - id: "A2"
    assumption: "Preprocessing component taxonomy is standardizable across flows"
    supporting_evidence: "scikit-learn pipelines have consistent naming; ~70% flows parseable"
    consequence_if_violated: "Entropy estimates become artifacts of naming heterogeneity"
  - id: "A3"
    assumption: "Dataset metadata is time-invariant (no post-upload edits affect early runs)"
    supporting_evidence: "Version-1 metadata restriction; OpenML versioning system"
    consequence_if_violated: "Temporal integrity of early-run test collapses"
  - id: "A4"
    assumption: "Metadata completeness is not merely a proxy for dataset popularity"
    supporting_evidence: "Stratified analysis within popularity quartiles"
    consequence_if_violated: "Observed effect is community convergence, not documentation quality"
  - id: "A5"
    assumption: "200+ datasets with ≥10 matched runs exist meeting filtering criteria"
    supporting_evidence: "OpenML has ~2,500 datasets with >10 runs; subset meeting criteria TBD in pilot"
    consequence_if_violated: "Study is underpowered; conclusions not generalizable"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - OpenML datasets with ≥10 matched runs (same flow, same hyperparameters)
    - Classification and regression tasks
    - Time window 2019-2024, sklearn ≥0.22
    - Datasets where preprocessing component extraction succeeds (~70% of runs)
  does_not_apply_to: |
    - Datasets with <10 runs (insufficient variance estimates)
    - Deep learning benchmarks (different infrastructure; OpenML focus is tabular)
    - Pre-2019 runs (infrastructure drift confounds)
    - Custom pipelines without parseable component structure
  known_limitations: |
    - Cannot claim causality without randomized intervention; observational study
    - Generalization to HuggingFace/UCI requires separate validation
    - Graph edit distance metric deferred to supplementary analysis

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Top-quartile metadata completeness predicts ≥20% reduction in IQR and ≥0.01 absolute accuracy points vs bottom quartile"
    test_method: "Mixed-effects regression with full covariate controls"
    success_criterion: "95% CI excludes <10% relative reduction; absolute reduction ≥0.01"
    falsification: "Effect <10% or CI includes zero"
  - id: "P2"
    primary: false
    statement: "Preprocessing entropy mediates ≥30% of the metadata → variance effect"
    test_method: "Sobel mediation test; bootstrap CIs"
    success_criterion: "Indirect effect accounts for ≥30%, p<0.05"
    falsification: "Indirect effect <15% or p>0.10"
  - id: "P2a"
    primary: false
    statement: "High-M datasets show ≥30% lower entropy in preprocessing components (imputation/encoding/scaling)"
    test_method: "Shannon entropy comparison across metadata quartiles"
    success_criterion: "Significant difference in preprocessing entropy"
    falsification: "No difference in preprocessing entropy"
  - id: "P2b"
    primary: false
    statement: "High-M datasets show NO significant difference in model hyperparameter entropy"
    test_method: "Shannon entropy comparison for model hyperparameters"
    success_criterion: "No significant difference (p>0.10)"
    falsification: "Significant difference in model hyperparameter entropy"
  - id: "P3"
    primary: false
    statement: "Effect holds in first-50-runs subsample (early-run test)"
    test_method: "Restrict analysis to runs within 90 days of dataset upload"
    success_criterion: "Effect persists with similar magnitude"
    falsification: "Effect absent or reversed in early runs"
  - id: "P4"
    primary: false
    statement: "Effect persists within RandomForest-only analysis"
    test_method: "Restrict to flow.name containing 'RandomForest'"
    success_criterion: "Effect magnitude similar to full analysis"
    falsification: "Effect disappears within single algorithm family"
  - id: "P5"
    primary: false
    statement: "Pre-2022 model retains ≥75% of R² on post-2022 holdout"
    test_method: "Temporal train/test split"
    success_criterion: "R² degradation <25%"
    falsification: "R² drop >50%"
  - id: "P6"
    primary: false
    statement: "Permutation control: shuffled metadata produces effect <5% of observed"
    test_method: "Random permutation of metadata scores 1000 times"
    success_criterion: "Permuted effect <5% of true effect"
    falsification: "Shuffled effect ≥20% of observed"

