main_hypothesis:
  id: H-MetadataReproducibility-v1
  title: Metadata Completeness Predicts Reproducibility Variance via Preprocessing Entropy Reduction
  statement: Under OpenML benchmark datasets with ≥10 matched runs (2019-2024), if metadata completeness score increases,
    then reproducibility variance (IQR) decreases by ≥20%, because richer documentation constrains preprocessing degrees of
    freedom.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: OpenML Benchmark Suite (200+ datasets, ≥10 matched runs)
    model: Mixed-Effects Regression + Mediation Analysis
    optimizer: null
    hyperparameters:
      time_window: 2019-2024
      sklearn_version: '>=0.22'
      min_runs_per_dataset: 10
