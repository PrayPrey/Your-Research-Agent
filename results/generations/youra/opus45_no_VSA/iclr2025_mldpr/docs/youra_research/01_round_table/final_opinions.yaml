      The reframing of reproducibility as a continuous, predictable property of datasets — rather
      than a binary property of papers — is genuinely novel. No prior work predicts reproducibility
      from dataset metadata before experiments run. The "reproducibility as inverse epistemic
      entropy" frame provides theoretical grounding beyond empirical correlation.
    key_points:
      - "First predictive model for dataset-level reproducibility"
      - "Paradigm shift: datasets as continuous reproducibility variables, not binary paper outcomes"
      - "Theoretical contribution via information-theoretic framing (epistemic entropy)"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    verdict: "STRONG"
    assessment: |
      Six preregistered predictions with quantitative thresholds (≥20% IQR reduction, ≥30%
      mediation, etc.) and explicit falsification criteria. Nested variance decomposition,
      permutation nulls, temporal holdout, and within-algorithm-family tests provide multiple
      opportunities for the hypothesis to fail. This is designed to be broken.
    key_points:
      - "Preregistered thresholds: ≥20% relative + ≥0.01 absolute IQR reduction"
      - "Multiple falsification paths: permutation, temporal, within-family, early-run tests"
      - "Nested variance decomposition with explicit falsification if ICC_seed >40%"

