hypothesis_draft:
  title: "Metadata Completeness Predicts Reproducibility Variance via Preprocessing Entropy Reduction"
  hypothesis_id: "H-MetadataReproducibility-v1"
  core_claim: |
    Dataset metadata completeness predicts reduced reproducibility variance through a mechanism
    of constrained preprocessing entropy. Specifically, datasets with richer documentation
    exhibit lower performance dispersion across independent reimplementations, mediated by
    reduced heterogeneity in preprocessing pipeline choices.
  mechanism: |
    M → E → V_spec causal chain:
    1. Higher metadata completeness (M) reduces ambiguity about preprocessing choices
    2. Reduced ambiguity constrains preprocessing pipeline heterogeneity (E = entropy)
    3. Lower pipeline heterogeneity reduces specification-driven variance (V_spec)

    Key insight: Documentation constrains preprocessing degrees of freedom, NOT model hyperparameters.
    This provides a sharp falsifiable pattern for mediation testing.
  predictions:
    - P1: "≥20% IQR reduction AND ≥0.01 absolute accuracy for top-quartile metadata (vs bottom)"
    - P2: "≥30% mediation via preprocessing entropy; preprocessing entropy moves, model hyperparameters don't"
    - P3: "Effect holds in early-run subsample (first 50 runs, within 90 days of upload)"
    - P4: "Effect persists within RandomForest-only analysis"
    - P5: "Pre-2022 model retains ≥75% R² on post-2022 holdout"
    - P6: "Permutation control collapses (<5% of observed effect)"

variables_summary:
  independent: "Metadata Completeness Score (5-field binary checklist, quartiles)"
  dependent_primary: "Reproducibility Variance V_spec (IQR after seed-stochasticity decomposition)"
  controlled: "Intrinsic stability, popularity, algorithm family, infrastructure (2019-2024, sklearn≥0.22)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in reproducibility variance between high-metadata-completeness
    and low-metadata-completeness datasets, after controlling for intrinsic stability, popularity,
    algorithm family, and infrastructure factors.
  statistical_test: "Mixed-effects regression with full covariate adjustment"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    First predictive model for dataset-level reproducibility. Reframes reproducibility as
    inverse epistemic entropy: documentation → constrained preprocessing space → reduced variance.
  differentiation_summary: |
    Prior work (Kapoor taxonomy, Reproscreener, rliable, paper-replay) either identifies issues
    post-hoc or provides assessment tools. This work PREDICTS reproducibility from metadata
    BEFORE experiments run, and provides a falsifiable mechanism (component-specific mediation).

