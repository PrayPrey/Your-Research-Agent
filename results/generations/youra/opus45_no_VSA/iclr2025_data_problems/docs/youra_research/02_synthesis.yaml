hypothesis_draft:
  title: "Curation-Driven Contamination Amplification (CDCA)"
  hypothesis_id: "H-CDCA-v1"
  core_claim: |
    Certain data filtering strategies preferentially retain training examples that
    contribute to benchmark memorization. This amplification effect is quantifiable
    via Contamination Contribution Ratio (CCR), causally validated via removal
    intervention, and mechanistically characterized via Influence Fidelity Ratio (IFR)
    and Influence Gini Coefficient (IGC).
  mechanism: |
    1. Filtering strategy selects high-information-density examples
    2. High-density examples include disproportionate benchmark-related content
    3. Model learns benchmark answers from contaminated examples during training
    4. Contaminated examples have low redundancy, making influence structurally necessary
  predictions:
    - P1: "CCR is higher for perplexity filtering than random sampling (>0.1 difference, p<0.05)"
    - P2: "Removing high-CCR examples causes ≥1.5× larger accuracy drop than random removal"
    - P3: "Amplification Index (AI) is positive for perplexity vs. random filtering"
    - P4: "IFR(contaminated) > IFR(non-contaminated) with negative redundancy correlation"
    - P5: "Synthetic injection produces monotonic CCR scaling (R² ≥ 0.9) and F1 > 0.8"

variables_summary:
  independent: "Filtering Strategy (perplexity_top30, quality_classifier, random_sampling); Removal Level (0.01%, 0.05%, 0.1%)"
  dependent_primary: "Contamination Contribution Ratio (CCR)"
  controlled: "Raw corpus (RedPajama-1B subset), model architecture (Pythia-1B), training seeds (5 per condition), token budget (matched)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in CCR across filtering strategies when controlling
    for dataset size, token frequency distributions, and benchmark lexical overlap.
    Any filtering strategy effects on benchmark performance reflect general quality
    improvement, not contamination amplification.
  statistical_test: "Bootstrap comparison of CCR distributions across strategies; mixed-effects model for removal intervention"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    Three novel metrics (CCR, IFR, IGC) that together enable quantifying, causally validating,
    and structurally characterizing contamination amplification by curation strategy.
    First work connecting data attribution methods to contamination detection in curation context.
  differentiation_summary: |
    Prior work addressed each component in isolation:
    - CDD/Min-K%++ detect contamination but don't explain curation relationship
    - TRAK provides attribution but doesn't distinguish contamination sources
    - DataComp-LM studies curation but doesn't address contamination
    This work integrates all three into a unified analysis framework.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Pythia-1B (EleutherAI)"
    - "OLMo-1B (AllenAI)"
  datasets:
    - "RedPajama-1B subset"
    - "MMLU (contamination-prone benchmark)"
    - "Time-stratified MMLU 2024+ (clean benchmark)"
  baselines:
    - "Random sampling"
    - "Quality classifier filtering"

measurement_plan:
  data_collection:
    - source: "TRAK/LoGra attribution scores for each training example"
    - source: "Min-K%++/CDD contamination flags for each training example"
    - source: "Benchmark accuracy (MMLU, clean split) across conditions"
    - source: "Model hidden state representations for redundancy analysis"
  procedure:
    - step: "1. Apply 3 filtering strategies to matched corpus subsets"
    - step: "2. Train Pythia-1B models with 5 seeds per condition"
    - step: "3. Compute TRAK attribution scores for benchmark examples"
    - step: "4. Apply contamination detection (Min-K%++/CDD) to training set"
    - step: "5. Calculate CCR for each strategy-seed combination"
    - step: "6. Run removal intervention at 3 levels (0.01%, 0.05%, 0.1%)"
    - step: "7. Retrain and measure accuracy drop vs. random removal"
    - step: "8. Compute IFR and redundancy correlations"
    - step: "9. Validate via synthetic injection calibration"
  success_criteria:
    - "CCR difference between perplexity and random > 0.1 with p<0.05"
    - "Removal degradation ratio ≥1.5× with 95% CI excluding zero and random mean"
    - "Synthetic injection produces monotonic CCR scaling (R² ≥ 0.9)"
    - "Attribution ranking stability: Spearman ρ ≥ 0.7 across seeds"

validation:
  internal_validity:
    - "Matched corpus across strategies (isolates filtering effect)"
    - "Fixed model architecture and hyperparameters"
    - "Multiple seeds per condition for variance estimation"
    - "Mixed-effects model separating seed variance from treatment effect"
  external_validity:
    - "Results tested on 2 benchmarks (MMLU, clean time-stratified split)"
    - "Methodology applicable to other filtering strategies"
    - "1B scale validates methodology before scaling to larger models"

