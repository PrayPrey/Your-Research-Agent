# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "TRAK/LoGra enables scalable data attribution for LLMs at 1B parameter scale"
      status: "BUILD_ON"
      evidence: "Park et al. 2023 (TRAK), Choe et al. 2024 (LoGra 6500x speedup)"
    - claim: "CDD and Min-K%++ can detect training data membership with >0.9 AUC"
      status: "BUILD_ON"
      evidence: "Dong et al. 2024 (CDD), Zhang et al. 2024 (Min-K%++)"
    - claim: "Data filtering strategies affect downstream benchmark performance"
      status: "BUILD_ON"
      evidence: "DataComp-LM (Li et al. 2024) - model-based filtering improves MMLU"
    - claim: "Filtering strategies amplify contamination contribution differently"
      status: "PROVE_NEW"
      evidence: "No prior work connects curation to contamination via attribution"
    - claim: "Contaminated examples have lower redundancy than non-contaminated high-influence examples"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis from discussion - requires validation"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Focus verification on PROVE_NEW claims. BUILD_ON claims have existing evidence.
    Primary verification target: CCR variation by filtering strategy + IFR sign reversal.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CDCA-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under controlled experiments with matched corpora and fixed model architecture (Pythia-1B/OLMo-1B),
    if a filtering strategy (e.g., perplexity-based selection) preferentially retains examples
    flagged as contaminated by membership inference (Min-K%++/CDD), then models trained on
    that strategy will show: (1) higher Contamination Contribution Ratio (CCR) than random
    baseline, (2) larger accuracy drops when high-CCR examples are removed, and (3) positive
    Amplification Index diverging contaminated vs. clean benchmark performance, because
    filtering mechanisms that favor high-information-density examples inadvertently select
    benchmark-related content at higher rates, and these examples are structurally less
    redundant than general high-influence examples.
  alternative_hypothesis_h0: |
    There is no significant difference in CCR across filtering strategies when controlling
    for dataset size, token frequency distributions, and benchmark lexical overlap.
    Filtering strategy effects on benchmark performance are attributable to general
    quality improvement, not contamination amplification.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Filtering Strategy"
      type: "categorical"
      operationalization: "Applied to common raw corpus before training"
      levels: ["perplexity_top30", "quality_classifier", "random_sampling"]
    - name: "Removal Level"
      type: "categorical"
      operationalization: "Percentage of high-CCR examples removed before retraining"
      levels: ["0.01%", "0.05%", "0.1%"]
  dependent:
    - name: "Contamination Contribution Ratio (CCR)"
      type: "continuous"
      operationalization: "Sum of TRAK attribution mass from contamination-flagged examples / total attribution mass for benchmark"
      primary: true
    - name: "Benchmark Accuracy Drop"
      type: "continuous"
      operationalization: "Accuracy decrease after removing high-CCR examples vs. baseline"
      primary: false
    - name: "Influence Fidelity Ratio (IFR)"
      type: "continuous"
      operationalization: "Influence-masking degradation / full-retraining degradation"
      primary: false
    - name: "Amplification Index (AI)"
      type: "continuous"
      operationalization: "ΔAccuracy(contaminated benchmark) - ΔAccuracy(clean benchmark)"
      primary: false
    - name: "Influence Gini Coefficient (IGC)"
      type: "continuous"
      operationalization: "Gini coefficient of TRAK attribution scores over benchmark examples"
      primary: false
  controlled:
    - name: "Raw Corpus"
      operationalization: "Fixed RedPajama-1B subset across all strategies"
    - name: "Model Architecture"
      operationalization: "Pythia-1B or OLMo-1B with identical hyperparameters"
    - name: "Training Seeds"
      operationalization: "5 independent seeds per condition for variance analysis"
    - name: "Token Budget"
      operationalization: "Matched token count across filtered datasets"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Filtering strategy applied to raw corpus preferentially retains examples with high information density"
      evidence: "DataComp-LM showed perplexity filtering selects high-quality examples"
      falsifier: "If retention rates are uniform across example types, mechanism fails"
    - step: 2
      description: "High-density examples include disproportionate benchmark-related content (questions, answers, paraphrases)"
      evidence: "Benchmark questions often appear in high-quality web text (educational sites, Q&A forums)"
      falsifier: "If contamination detection rates are equal across strategies, no amplification"
    - step: 3
      description: "Model learns benchmark answers from contaminated examples during training"
      evidence: "Attribution methods (TRAK) can trace benchmark performance to specific training examples"
      falsifier: "If attribution scores for contaminated examples are not elevated, mechanism not operating"
    - step: 4
      description: "Contaminated examples have low redundancy, making their influence structurally necessary"
      evidence: "Benchmark-specific content lacks semantic equivalents elsewhere in corpus"
      falsifier: "If IFR ≈ 1 for both contaminated and non-contaminated, no structural difference"
  key_tension: "Whether influence concentration is detectable at 1B scale given optimization noise"
  evidence_summary: |
    The mechanism connects filtering (Step 1) → content selection (Step 2) → learning (Step 3)
    → structural necessity (Step 4). Each step has independent validation tests.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "TRAK/LoGra attribution scores reliably identify performance-driving training examples"
    supporting_evidence: "TRAK validation studies show ~70% precision in counterfactual validation"
    consequence_if_violated: "CCR becomes unreliable metric; requires alternative attribution method"
  - id: "A2"
    assumption: "Min-K%++/CDD reliably identify benchmark-related examples at per-example level"
    supporting_evidence: "CDD achieves >0.9 AUC on synthetic contamination; validated via injection"
    consequence_if_violated: "CCR numerator is noisy; requires synthetic calibration for precision"
  - id: "A3"
    assumption: "Filtering strategy effects are separable from corpus composition effects"
    supporting_evidence: "Using matched corpus with different filtering isolates strategy effect"
    consequence_if_violated: "CCR differences reflect corpus, not strategy; need stratified analysis"
  - id: "A4"
    assumption: "Influence scores are sufficiently concentrated for removal effects to be detectable"
    supporting_evidence: "Requires empirical measurement of Gini coefficient before intervention"
    consequence_if_violated: "Removal effects below optimization noise; need larger removal fractions"
  - id: "A5"
    assumption: "Clean benchmark (time-stratified) has <0.01% overlap with training corpus"
    supporting_evidence: "Requires MinHash + embedding overlap audit with tight confidence bounds"
    consequence_if_violated: "Amplification Index confounded by latent contamination in 'clean' split"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Decoder-only language models at 1B parameter scale
    - Web-scraped pretraining corpora (C4, RedPajama, Pile derivatives)
    - Multiple-choice benchmarks (MMLU, HellaSwag, ARC)
    - Filtering strategies: perplexity-based, classifier-based, random sampling
  does_not_apply_to: |
    - Encoder-only or encoder-decoder models (different attribution dynamics)
    - Models trained on curated/synthetic data (no curation strategy variation)
    - Open-ended generation benchmarks (different contamination signatures)
    - >10B parameter models (methodology validated at 1B first)
  known_limitations: |
    - Results may not generalize to instruction-tuned or RLHF models
    - Per-example contamination detection has inherent false positive rates
    - Influence concentration may vary by benchmark type
    - Time-stratified clean benchmarks may have subtle semantic overlap

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "CCR is higher for perplexity-filtered training than random-sampled training"
    test_method: "Compare CCR across 3 filtering strategies using matched corpus and 3+ seeds"
    success_criterion: "CCR(perplexity) - CCR(random) > 0.1, p<0.05 under bootstrap"
    falsification: "No significant CCR difference across strategies after controlling for confounds"
  - id: "P2"
    primary: true
    statement: "Removing high-CCR examples causes larger accuracy drop than random removal"
    test_method: "Retrain after removing top 0.01%-0.1% high-CCR examples vs. random removal; 5 seeds"
    success_criterion: "Degradation from high-CCR removal ≥1.5× random removal, 95% CI excludes both zero and random mean"
    falsification: "Degradation ≤ random removal or within seed variance band"
  - id: "P3"
    primary: true
    statement: "Amplification Index is positive for perplexity filtering vs. random"
    test_method: "2×2 factorial: contaminated (MMLU) vs clean (time-stratified MMLU 2024+) benchmarks"
    success_criterion: "AI > 0 for perplexity vs. random, 95% CI excludes zero; clean benchmark passes <0.01% overlap audit"
    falsification: "AI ≈ 0 after overlap audit, or contaminated/clean performance track proportionally"
  - id: "P4"
    primary: false
    statement: "Contaminated high-influence examples have higher IFR than non-contaminated high-influence examples"
    test_method: "Compare IFR between contaminated and non-contaminated examples in top 1% attribution"
    success_criterion: "IFR(contaminated) > IFR(non-contaminated) at p<0.05; IFR correlates negatively with redundancy (ρ < -0.5)"
    falsification: "No IFR difference or no redundancy correlation"
  - id: "P5"
    primary: false
    statement: "Synthetic injection calibrates CCR metric stack"
    test_method: "Inject benchmark items at 0%, 0.01%, 0.05%, 0.1% before filtering; measure CCR and recovery F1"
    success_criterion: "CCR scales monotonically with injection rate; F1 > 0.8 at 0.1% injection"
    falsification: "Non-monotonic scaling, saturation before 0.1%, or F1 < 0.8"

