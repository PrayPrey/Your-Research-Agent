main_hypothesis:
  id: H-CDCA-v1
  title: Curation-Driven Contamination Amplification
  statement: Under controlled experiments with matched corpora and fixed model architecture (Pythia-1B/OLMo-1B), if a filtering
    strategy preferentially retains examples flagged as contaminated by membership inference (Min-K%++/CDD), then models trained
    on that strategy will show higher CCR, larger accuracy drops when high-CCR examples are removed, and positive Amplification
    Index.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: RedPajama-1B subset
    model: Pythia-1B or OLMo-1B
    optimizer: AdamW
    hyperparameters:
      seeds: 5
      filtering_strategies:
      - perplexity_top30
      - quality_classifier
      - random_sampling
      removal_levels:
      - 0.01%
      - 0.05%
      - 0.1%
