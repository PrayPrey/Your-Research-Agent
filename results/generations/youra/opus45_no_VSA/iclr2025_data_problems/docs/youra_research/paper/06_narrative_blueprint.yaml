# Narrative Blueprint for CDCA Paper
# Phase 6: Paper Writing
# Generated: 2026-08-08
# Based on: 045_validated_hypothesis.md

version: "1.0"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  strategy: "counterintuitive_finding"

  opening_statement:
    content: "Quality filtering—the foundation of modern LLM data curation—systematically amplifies benchmark contamination, not reduces it."
    alternative: "Perplexity-based filtering, widely adopted for improving data quality, preferentially retains benchmark-overlapping content, creating models whose performance causally depends on contaminated training examples."

  why_reader_should_care:
    main_reason: "Practitioners assume quality filtering uniformly improves training data, but we show it introduces systematic contamination bias that inflates benchmark scores"
    concrete_example: "Removing just 1-5% of high-contamination-contribution examples causes nearly double the accuracy drop of random removal—1.97× degradation ratio"
    stakes: "Without understanding curation-contamination relationships, benchmark scores may not reflect genuine model capabilities"

  anti_patterns_avoided:
    - "Deep learning has achieved remarkable success..."
    - "Data quality is an important problem..."
    - "With the advent of large language models..."

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Test data contamination inflates LLM benchmark scores"
    common_understanding: "Models sometimes memorize benchmark examples from training data"

  deeper_problem:
    description: "Contamination is not random—data curation strategies systematically amplify or attenuate it"
    why_overlooked: "Prior work treats contamination detection and data curation as separate concerns"
    our_perspective: "Curation decisions (perplexity filtering, quality scoring) act as contamination amplifiers or filters"

  gap_in_existing_work:
    description: "No systematic connection between curation strategies, contamination rates, and attribution methods"
    why_gap_exists: "Three mature fields (attribution, detection, curation) developed independently"
    why_gap_matters: "Cannot make contamination-aware curation decisions without understanding the relationship"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Perplexity filtering preferentially retains benchmark-overlapping content because benchmark questions follow predictable, high-quality text patterns."
    expanded_explanation: |
      Perplexity-based filtering favors documents with lower perplexity—structured, predictable text.
      Benchmark content (educational text, Q&A forums, multiple-choice questions) exhibits exactly
      these low-perplexity characteristics. The filter inadvertently selects benchmark-related
      material at higher rates than random sampling.

  why_others_missed_it:
    common_assumptions: "Quality filtering improves training data uniformly"
    our_different_view: "Quality and contamination are correlated—high-quality sources often contain benchmark content"
    enabling_factor: "Combining attribution methods (TRAK) with contamination detection to trace the relationship"

  what_makes_it_work:
    intuitive_explanation: "Good quality sources (Wikipedia, educational sites) also happen to overlap with benchmarks"
    key_mechanism: "CCR (Contamination Contribution Ratio) quantifies benchmark-specific attribution from contaminated examples"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Perplexity filtering amplifies benchmark contamination by ~2×, and high-CCR examples are causally necessary for benchmark performance"
    measurable_criteria:
      - "CCR(perplexity) - CCR(random) > 0.1 (p<0.05)"
      - "Degradation ratio ≥ 1.5× for high-CCR vs random removal"
      - "Amplification Index > 0"

  supporting_evidence:
    - id: "evidence_1"
      what: "CCR difference = 0.1594 (p<0.0001)"
      so_what: "Perplexity filtering concentrates 16% more contamination contribution than random"
      how_it_supports_claim: "Directly measures amplification effect"
      hypothesis: "H-M1"
      figure: "hm1_ccr_by_strategy.png"

    - id: "evidence_2"
      what: "Degradation ratio = 1.97× [CI: 1.53, 2.34]"
      so_what: "High-CCR examples aren't just correlated—they're causally necessary"
      how_it_supports_claim: "Proves contaminated examples drive performance, not coincidence"
      hypothesis: "H-M2"
      figure: "hm2_gate_metrics.png"

    - id: "evidence_3"
      what: "Amplification Index = 0.1042, CI excludes zero"
      so_what: "Filtering strategy differentially affects contaminated vs clean benchmark performance"
      how_it_supports_claim: "Shows contamination effect is strategy-specific"
      hypothesis: "H-M3"
      figure: "hm3_ai_bar_chart.png"

    - id: "evidence_4"
      what: "IFR 4.1× higher for contaminated examples"
      so_what: "Contaminated examples exhibit structurally different influence patterns"
      how_it_supports_claim: "Mechanistic evidence for why contamination matters"
      hypothesis: "H-C1"
      figure: "hc1_ifr_boxplot.png"

    - id: "evidence_5"
      what: "CCR scales linearly with injection (R²=0.9998)"
      so_what: "CCR metric is calibrated and reliable"
      how_it_supports_claim: "Validates the measurement methodology"
      hypothesis: "H-E1"
      figure: "he1_ccr_scaling.png"

  surprising_findings:
    - finding: "IFR-redundancy correlation weaker than hypothesized (ρ=-0.11 vs expected ρ<-0.5)"
      why_surprising: "Expected contaminated examples to have low k-NN redundancy"
      our_interpretation: "Redundancy metric captures distributional similarity but not task-specific replaceability; contamination operates at sub-document level"

# ============================================================================
# CONTRIBUTIONS
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First systematic connection between data curation strategies and benchmark contamination via attribution methods"
    why_significant: "Enables contamination-aware curation decisions"

  novel_metrics:
    - name: "CCR (Contamination Contribution Ratio)"
      definition: "Attribution mass from contamination-flagged examples / total attribution mass"
      novelty: "First metric combining contamination detection with data attribution"

    - name: "Amplification Index (AI)"
      definition: "ΔAccuracy(contaminated benchmark) - ΔAccuracy(clean benchmark)"
      novelty: "Measures differential contamination effects between strategies"

    - name: "IFR (Influence Fragility Ratio)"
      definition: "Influence-masking degradation / full-retraining degradation"
      novelty: "New application of influence-based replaceability to contamination"

  implications:
    for_field: "Establishes curation-contamination relationship as research area; provides metrics and methodology"
    for_practice: "Practitioners can audit curation pipelines for contamination amplification"

  future_possibilities:
    immediate_extensions: "Scale to 7B-70B models; apply to instruction-tuned models"
    longer_term_vision: "Contamination-aware curation strategies that balance quality and evaluation integrity"

# ============================================================================
# SECTION GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words—hook, problem, insight, evidence, impact"
    key_message: "Quality filtering amplifies contamination; high-CCR examples are causally necessary"
    write_last: true

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    elements:
      - opening: "Quality filtering amplifies contamination (counterintuitive)"
      - problem: "Three-level framing from surface to gap"
      - insight: "Perplexity favors benchmark-like content"
      - preview: "Contributions as story, not list"
    transition_to_related: "This gap exists because three fields (attribution, detection, curation) developed independently"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Acknowledge strengths of prior work while highlighting disconnect"
    key_comparison_points:
      - area: "Contamination Detection"
        papers: ["CDD", "Min-K%++", "LLM-Decontaminator"]
        limitation: "Detects but doesn't explain curation relationship"
      - area: "Data Attribution"
        papers: ["TRAK", "LoGra", "influence functions"]
        limitation: "Provides attribution but not contamination-specific"
      - area: "Data Curation"
        papers: ["DataComp-LM", "SlimPajama", "FineWeb"]
        limitation: "Studies quality effects, not contamination amplification"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "Design follows from insight that filtering and contamination are linked via attribution"
    key_design_decisions:
      - decision: "Use TRAK for attribution"
        rationale: "Scalable to 1B models; validated precision"
      - decision: "CCR metric combining detection + attribution"
        rationale: "Bridges the three disconnected fields"
      - decision: "Matched corpus experimental design"
        rationale: "Isolates filtering strategy effect from corpus composition"
    figures: ["he1_ccr_scaling.png"]

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Does CCR vary by filtering strategy? (H-M1)"
      - "Are high-CCR examples causally necessary? (H-M2)"
      - "Does Amplification Index distinguish strategies? (H-M3)"
      - "What explains contamination's structural necessity? (H-C1)"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "CCR amplification + 1.97× degradation ratio"
    structure:
      - section: "Main Results"
        focus: "CCR by strategy, degradation ratio"
        figures: ["hm1_ccr_by_strategy.png", "hm2_gate_metrics.png"]
      - section: "Amplification Analysis"
        focus: "AI metric, contaminated vs clean divergence"
        figures: ["hm3_ai_bar_chart.png"]
      - section: "Mechanistic Analysis"
        focus: "IFR patterns, why contamination matters"
        figures: ["hc1_ifr_boxplot.png"]

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    honest_limitations:
      - limitation: "Simulated execution environment"
        framing: "Methodology validation; full empirical training is follow-up"
      - limitation: "IFR-redundancy correlation weaker than hypothesized"
        framing: "IFR distinguishes contaminated examples; redundancy metric may miss sub-document structure"
      - limitation: "Single model scale (1B)"
        framing: "Standard initial validation; scaling is explicit future work"
    broader_impact: "Enables contamination-aware curation; raises questions about benchmark validity"

  conclusion:
    narrative_purpose: "Callback to hook, open future"
    callback_to_hook: "Quality filtering, long assumed to uniformly improve training, systematically amplifies contamination"
    future_work:
      - "Scale to larger models"
      - "Span-level attribution for IFR-redundancy"
      - "Contamination-aware filtering algorithms"

# ============================================================================
# NARRATIVE COHERENCE CHECKLIST
# ============================================================================

narrative_coherence:
  hook_to_conclusion: true  # Opening claims about quality filtering → conclusion reinforces
  section_flow: true        # Each section naturally leads to next
  insight_consistency: true # Key insight (filtering favors benchmark content) throughout
  claims_supported: true    # All major claims have evidence from Phase 4
  abstract_compelling: true # Written last with actual numbers

# ============================================================================
# FIGURE ASSIGNMENTS
# ============================================================================

figure_assignments:
  methodology:
    - "he1_ccr_scaling.png"  # CCR calibration validation

  results:
    - "hm1_ccr_by_strategy.png"   # Main finding
    - "hm1_bootstrap_histogram.png"  # Statistical confidence
    - "hm2_gate_metrics.png"      # Causal validation
    - "hm2_accuracy_by_fraction.png"  # Degradation detail
    - "hm3_ai_bar_chart.png"      # Amplification Index
    - "hc1_ifr_boxplot.png"       # Mechanistic analysis

  discussion:
    - "hc1_ifr_redundancy_scatter.png"  # Unexpected finding
