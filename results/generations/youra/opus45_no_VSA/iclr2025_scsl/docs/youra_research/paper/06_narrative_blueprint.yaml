# Narrative Blueprint for DCR Hypothesis Paper
# Generated: 2026-08-09
# Phase 6 Step 02

metadata:
  title: "Differential Convergence Rates Cause Minority Group Curvature Disparity"
  short_title: "DCR Curvature Mechanism"
  target_venue: "ICML 2027"
  page_limit: 9

hook_strategy:
  type: "temporal_insight"
  hook_line: "When does training go wrong? 3-4 epochs before you see it."
  elaboration: |
    Standard ERM training on imbalanced data produces predictable group disparities,
    but the root cause precedes the visible symptom. We show gradient ratio decay
    temporally precedes curvature divergence by 3-4 epochs, opening a diagnostic
    window for early intervention.
  callback_in_conclusion: true

problem_framing:
  level_1_symptom: |
    Models trained with ERM on group-imbalanced data exhibit worse performance
    on minority groups (worst-group accuracy gap of 15-20pp on Waterbirds).
  level_2_observation: |
    Minority groups occupy sharper regions of the loss landscape (SR > 1.0),
    making optimization harder and generalization worse.
  level_3_mechanism: |
    Differential convergence rates cause this curvature asymmetry. Majority groups,
    having more samples, converge faster (gradient norms decay earlier), smoothing
    their relevant parameter directions while leaving minority directions sharp.

key_insight:
  statement: |
    Gradient ratio decay temporally precedes sharpness ratio divergence by 3-4 epochs.
    Combined with SR ≈ 1.0 at initialization, this establishes training dynamics—not
    data geometry—as the causal source of group curvature disparity.
  novelty: |
    First quantitative characterization of the temporal lag (τ_r→SR) between
    gradient convergence and curvature divergence in group robustness setting.
  evidence_chain:
    - h-e1: "SR₀ = 0.9999 ± 0.0047 rules out intrinsic curvature"
    - h-m1: "τ_r→SR = 3.67 epochs (95% CI [3.0, 4.0]) confirms temporal precedence"

evidence_structure:
  primary_claims:
    - claim: "SR ≈ 1 at random initialization"
      evidence: "h-e1: 5 seeds, mean 0.9999, 95% CI [0.9953, 1.0046]"
      figure: "fig1_sr_init"
      confidence: HIGH

    - claim: "Gradient ratio decay precedes SR divergence (τ > 0)"
      evidence: "h-m1: τ = 3.67 epochs, CI excludes zero, 3/3 seeds consistent"
      figure: "fig2_time_series"
      confidence: HIGH

    - claim: "Mechanism is reproducible across seeds"
      evidence: "All seeds show τ ∈ {3, 4}, SEM = 0.0017 for SR₀"
      figure: "fig3_cross_correlation"
      confidence: HIGH

  secondary_claims:
    - claim: "Update-norm parity can attenuate SR divergence"
      evidence: "h-m2: Code validated, unit tests pass, not executed due to hardware"
      status: CODE_VALIDATED

  limitations:
    - "Intervention efficacy (h-m2) not experimentally confirmed"
    - "Single dataset (Waterbirds only)"
    - "PoC-scale experiments (3 seeds × 10 epochs)"

