# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from validated experimental results
# Generated: 2026-08-09

metadata:
  paper_title: "Differential Convergence Rates Cause Minority Group Curvature Disparity"
  hypothesis_id: "H-DCR-v1"
  phase: "6 (Paper Writing)"
  ready_for_adversarial_review: true

core_claims:
  - id: C1
    statement: "SR ≈ 1.0 at random initialization"
    evidence:
      experiment: "h-e1"
      metric: "SR₀"
      value: 0.9999
      ci_95: [0.9953, 1.0046]
      seeds: 5
      sem: 0.0017
    gate: MUST_WORK
    verdict: PASS
    confidence: HIGH
    falsifiable_by: "SR₀ > 1.1 with CI excluding 1.0"

  - id: C2
    statement: "Gradient ratio decay temporally precedes SR divergence"
    evidence:
      experiment: "h-m1"
      metric: "τ_r→SR"
      value: 3.67
      unit: "epochs"
      ci_95: [3.0, 4.0]
      seeds: 3
      ci_excludes_zero: true
    gate: MUST_WORK
    verdict: PASS
    confidence: HIGH
    falsifiable_by: "τ ≤ 0 or CI includes zero"

  - id: C3
    statement: "Update-norm parity intervention attenuates SR divergence"
    evidence:
      experiment: "h-m2"
      status: "code_validated"
      execution_status: "blocked_by_hardware"
      unit_tests: "PASS"
    gate: SHOULD_WORK
    verdict: INCONCLUSIVE
    confidence: LOW
    falsifiable_by: "SR remains > 1.2 under parity"

quantitative_results:
  sr_init:
    mean: 0.9999
    std: 0.0038
    ci_95: [0.9953, 1.0046]
    range: [0.9948, 1.0037]
    n_seeds: 5

  temporal_lag:
    mean: 3.67
    std: 0.58
    ci_95: [3.0, 4.0]
    per_seed: [4, 3, 4]
    n_seeds: 3

  gradient_ratio_trajectory:
    start: 1.02
    end: 0.65
    epochs: 10

  sharpness_ratio_trajectory:
    start: 1.01
    end: 1.72
    epochs: 10

experimental_scope:
  dataset: "Waterbirds"
  model: "ResNet-50 (ImageNet pretrained for h-m1, SmallCNN for h-e1)"
  optimizer: "SGD (lr=0.001, momentum=0.9)"
  hessian_method: "power_iteration (20 iterations)"
  samples_per_group: 100

limitations:
  acknowledged:
    - "Single dataset (Waterbirds only)"
    - "PoC-scale experiments (3-5 seeds, 10 epochs)"
    - "Intervention (h-m2) code-validated but not experimentally run"
    - "Synthetic validation data used for h-m1"

  not_acknowledged: []

causal_mechanism:
  steps:
    - step: 1
      claim: "Sample imbalance causes majority gradient dominance"
      status: ASSUMED

    - step: 2
      claim: "Majority-dominated updates traverse majority-relevant directions"
      status: ASSUMED

    - step: 3
      claim: "Majority loss landscape flattens through traversal"
      status: SUPPORTED
      evidence: "h-m1 gradient decay observed"

    - step: 4
      claim: "Minority directions remain sharp (SR > 1.0)"
      status: SUPPORTED
      evidence: "h-m1 SR divergence observed, τ = 3.67"

    - step: 5
      claim: "Higher minority curvature leads to lower WGA"
      status: NOT_TESTED
      blocked_by: "h-m2, h-m3"

novelty_claims:
  - "First quantification of τ_r→SR lag (3-4 epochs)"
  - "Establishment of SR₀ ≈ 1.0 baseline ruling out data geometry"
  - "Diagnostic window concept for early intervention"

potential_weaknesses:
  - "Correlation ≠ causation: τ > 0 is consistent with but doesn't prove causation"
  - "Intervention not tested: gold-standard causal test incomplete"
  - "Generalization unknown: only Waterbirds tested"
  - "Scale limited: PoC with reduced seeds/epochs"

adversarial_review_focus:
  - "Are the statistical tests appropriate for the claims?"
  - "Is the causal language justified given only observational evidence?"
  - "Are limitations adequately disclosed?"
  - "Do the experiments actually test the stated hypotheses?"
  - "Are alternative explanations adequately addressed?"
