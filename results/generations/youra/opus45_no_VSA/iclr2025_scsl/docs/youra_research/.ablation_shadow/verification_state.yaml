main_hypothesis:
  id: H-DCR-v1
  title: Differential Convergence Rate Mechanism for Group Curvature Disparity
  statement: Under ERM training on group-imbalanced data, if majority groups converge faster (lower per-sample gradient norms
    earlier), then minority groups maintain higher local curvature (SR > 1.0), because majority-dominated updates smooth curvature
    only in majority-relevant parameter directions, leaving minority-relevant directions untraversed and sharp.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Waterbirds
    model: ResNet-50 pretrained on ImageNet
    optimizer: SGD with momentum
    hyperparameters:
      seeds: 5
      epochs: 100
      batch_size: 128
