hypothesis_draft:
  title: "Differential Convergence Rate (DCR) Mechanism for Group Curvature Disparity"
  hypothesis_id: "H-DCR-v1"
  core_claim: |
    Majority groups converge faster during ERM training, leaving minority groups in
    sharper (higher curvature) regions of the loss landscape. This explains why
    SR = λ_max(H_min)/λ_max(H_maj) > 1.0 throughout training.
  mechanism: |
    Sample imbalance → majority gradient dominance → differential convergence →
    majority curvature flattens → minority curvature stays sharp → SR > 1.0 →
    higher minority loss → lower worst-group accuracy.
  predictions:
    - P1: "Per-sample gradient ratio decay precedes SR divergence (τ_r→SR > 0)"
    - P2: "Update-norm parity intervention attenuates SR (≤1.1 vs >1.2 baseline)"
    - P3: "SR ≈ 1 at initialization (no intrinsic curvature asymmetry)"
    - P4: "SR reduction correlates with WGA improvement (ΔSR → ΔWGA)"
    - P5: "SR → 1 in NTK regime (path dependence requires nonlinearity)"

variables_summary:
  independent: "Sample frequency ratio; update-norm parity (binary intervention)"
  dependent_primary: "Sharpness Ratio (SR) = λ_max(H_min) / λ_max(H_maj)"
  controlled: "ResNet-50 architecture, SGD optimizer, Waterbirds dataset"

null_hypothesis:
  h0_statement: |
    There is no significant difference in per-sample gradient norm decay rates
    between majority and minority groups, and SR > 1.0 is an intrinsic property
    of data geometry unrelated to training dynamics.
  statistical_test: "Lagged cross-correlation with permutation-based significance testing"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    Reframes Hessian orthogonality from failure to consequence of differential convergence.
    Introduces M1/M2/M3 competition framework for distinguishing causal mechanisms.
  differentiation_summary: |
    Unlike prior work that documents SR > 1.0 (h-e1) or eigenspace orthogonality (h-c1),
    this hypothesis provides a mechanistic explanation rooted in gradient dynamics.
    Unlike Group DRO/JTT which intervene post-hoc, the proposed intervention
    targets early gradient dynamics directly.

