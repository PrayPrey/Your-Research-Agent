      status: "BUILD_ON"
      evidence: "h-c1 measured all 6 group-pair max principal angles > 87°"
    - claim: "Minority has more concentrated gradients (GCDR = 0.175)"
      status: "BUILD_ON"
      evidence: "h-m1 experimental result"
    - claim: "Differential convergence rate causes SR > 1.0"
      status: "PROVE_NEW"
      evidence: "Proposed mechanism; not yet validated"
