      status: "PROVE_NEW"
      evidence: "Proposed intervention; not yet tested"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Build on established SR > 1.0 and Hessian orthogonality observations.
    Focus verification on temporal ordering (P1), initialization check (P3),
