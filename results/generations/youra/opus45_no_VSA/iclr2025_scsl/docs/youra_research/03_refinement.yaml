# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DCR-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under ERM training on group-imbalanced data, if majority groups converge faster
    (lower per-sample gradient norms earlier), then minority groups maintain higher
    local curvature (SR > 1.0), because majority-dominated updates smooth curvature
    only in majority-relevant parameter directions, leaving minority-relevant
    directions untraversed and sharp.
  alternative_hypothesis_h0: |
    There is no significant difference in per-sample gradient norm decay rates
    between majority and minority groups, and SR > 1.0 is an intrinsic property
    of data geometry unrelated to training dynamics.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Sample frequency ratio"
      type: "continuous"
      operationalization: "n_majority / n_minority (e.g., 95/5 in Waterbirds)"
    - name: "Update-norm parity"
      type: "categorical"
      operationalization: "Binary: adaptive scaling applied or not"
      levels: ["baseline", "parity_enforced"]
  dependent:
    - name: "Sharpness Ratio (SR)"
      type: "continuous"
      operationalization: "λ_max(H_min) / λ_max(H_maj), measured per epoch via PyHessian"
      primary: true
    - name: "Worst-group accuracy (WGA)"
      type: "continuous"
      operationalization: "Accuracy on minority group (landbird_water or waterbird_land)"
      primary: false
    - name: "Per-sample gradient norm ratio"
      type: "continuous"
      operationalization: "||∇L_maj||/n_maj divided by ||∇L_min||/n_min"
      primary: false
  controlled:
    - name: "Architecture"
      operationalization: "ResNet-50 pretrained on ImageNet"
    - name: "Learning rate schedule"
      operationalization: "Fixed across conditions; standard SGD with momentum"
    - name: "Dataset"
      operationalization: "Waterbirds (primary), CelebA (validation)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Sample imbalance causes majority gradient dominance"
      evidence: "In 95/5 split, majority contributes ~95% of batch gradient magnitude"
      falsifier: "If majority gradient contribution does not scale with sample frequency"
    - step: 2
      description: "Majority-dominated updates traverse majority-relevant parameter directions"
      evidence: "Gradient flow primarily in directions that reduce majority loss"
      falsifier: "If gradient cosine between groups remains high throughout training"
    - step: 3
      description: "Majority loss landscape flattens through repeated traversal"
      evidence: "Majority λ_max decreases over training (from h-c1 eigenvalue data)"
      falsifier: "If majority Hessian eigenvalues remain high despite training"
    - step: 4
      description: "Minority-relevant directions remain untraversed and sharp"
      evidence: "Minority λ_max stays elevated (SR > 1.0 validated)"
      falsifier: "If minority curvature decreases at same rate as majority"
    - step: 5
      description: "Higher minority curvature leads to higher minority loss and lower WGA"
      evidence: "Correlation between SR and WGA to be established"
      falsifier: "If SR manipulation does not affect WGA"
  key_tension: "Does differential convergence CAUSE SR > 1, or are both downstream of intrinsic data geometry?"
  evidence_summary: |
    Existing evidence supports steps 3-4 (SR > 1.0 validated, eigenspace orthogonality confirmed).
    Steps 1-2 need validation via per-sample gradient norm tracking and lag analysis.
    Step 5 needs validation via SR→WGA mediation test.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Per-sample gradient norms reflect true convergence, not just frequency weighting"
    supporting_evidence: "Normalization by sample count isolates geometric effects"
    consequence_if_violated: "DCR mechanism reduces to trivial empirical risk scaling"
  - id: "A2"
    assumption: "SR > 1 at initialization is negligible (path dependence required)"
    supporting_evidence: "Random initialization should not prefer group-specific curvature"
    consequence_if_violated: "Intrinsic curvature (M3) dominates; training intervention futile"
  - id: "A3"
    assumption: "Minority-relevant parameter directions are not traversed by majority updates"
    supporting_evidence: "Eigenspace orthogonality (~88.5°) suggests distinct directions"
    consequence_if_violated: "Majority updates could smooth minority curvature; SR should decrease"
  - id: "A4"
    assumption: "Update-norm parity is achievable without destroying discriminative structure"
    supporting_evidence: "Adaptive scaling modifies magnitude, not direction"
    consequence_if_violated: "Intervention may degrade accuracy without testing mechanism"
  - id: "A5"
    assumption: "SR mediates the relationship between gradient dynamics and WGA"
    supporting_evidence: "Higher curvature implies harder optimization, higher loss"
    consequence_if_violated: "SR is epiphenomenal; different mechanism drives WGA"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ERM training on class-imbalanced datasets with group structure
    - Vision classification tasks with spurious correlations
    - Pretrained models fine-tuned on biased data
  does_not_apply_to: |
    - Balanced datasets (no differential convergence expected)
    - Non-neural methods (path dependence requires nonlinear optimization)
    - NTK regime (linearized dynamics eliminate path dependence)
  known_limitations: |
    - Tested primarily on Waterbirds; generalization to CelebA/ColorMNIST requires validation
    - Assumes pretrained ResNet-50; training from scratch may show different dynamics
    - Hessian computation approximated via power iteration (PyHessian)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Per-sample gradient ratio decay precedes SR divergence"
    test_method: "Lagged cross-correlation τ_r→SR over epochs [-5, +5]"
    success_criterion: "τ_r→SR > 0 with 95% CI excluding zero across seeds"
    falsification: "τ_r→SR ≤ 0 or CI includes zero"
  - id: "P2"
    primary: true
    statement: "Update-norm parity attenuates SR divergence"
    test_method: "Compare SR trajectories: baseline vs parity-enforced training"
    success_criterion: "SR ≤ 1.1 sustained under parity vs SR > 1.2 baseline"
    falsification: "SR remains > 1.2 despite parity intervention"
  - id: "P3"
    primary: true
    statement: "SR ≈ 1 at initialization (no intrinsic curvature asymmetry)"
    test_method: "Compute SR₀ at random init, average over 5 seeds"
    success_criterion: "SR₀ ∈ [0.9, 1.1] with 95% CI including 1.0"
    falsification: "SR₀ > 1.1 with CI excluding 1.0"
  - id: "P4"
    primary: false
    statement: "SR reduction improves worst-group accuracy"
    test_method: "Mediation analysis: correlate ΔSR with ΔWGA"
    success_criterion: "ΔSR ≤ -0.2 corresponds to ΔWGA ≥ +2pp (95% CI)"
    falsification: "No significant correlation between ΔSR and ΔWGA"
  - id: "P5"
    primary: false
    statement: "SR → 1 as network width increases (NTK regime)"
    test_method: "Width sweep {64, 1024} with SR measurement"
    success_criterion: "Monotonic SR decrease with width; SR < 1.2 at width 1024"
    falsification: "SR stable or increases with width"

