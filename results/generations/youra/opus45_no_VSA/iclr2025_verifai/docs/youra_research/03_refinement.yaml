    - name: "iterations"
      operationalization: "3 repair iterations per problem"
    - name: "benchmark"
      operationalization: "HumanEval (164) + MBPP (500) = 664 problems"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Static analysis identifies surface errors (type mismatches, unused variables, style violations)"
      evidence: "Pylint/Pyright detect these categories; Blyth 2025 shows 40-50% reduction in such issues"
      falsifier: "If static analysis produces no actionable errors for most problems, this step fails"
    - step: 2
      description: "LLM processes static feedback first, resolving low-level issues in initial repair attempts"
      evidence: "Sequential prompt structure presents static errors before execution results"
      falsifier: "If LLM ignores static feedback and focuses on execution traces, ordering is irrelevant"
    - step: 3
      description: "With surface issues cleared, execution feedback focuses attention on semantic errors"
      evidence: "Execution feedback now reports only higher-level failures (logic, specifications)"
      falsifier: "If surface fixes introduce new execution errors (regressions), the chain breaks"
    - step: 4
      description: "The sequential structure creates a coarse-to-fine repair trajectory"
      evidence: "Edit distances should decrease across iterations as repairs become more localized"
      falsifier: "If edit distances are constant or increase, coarse-to-fine pattern not observed"
    - step: 5
      description: "Regression rates decrease because surface fixes don't destabilize passing tests"
      evidence: "Static errors are typically independent of test-passing logic"
      falsifier: "If regression rates are equal or higher in cascade condition, scaffolding fails"
  key_tension: "Scaffolding vs recency: does ordering help because static-first is structurally better, or because 'whatever comes last wins' (terminal position bias)?"
  evidence_summary: |
    The mechanism proposes that static→execution creates a structured repair curriculum
    (coarse-to-fine). Supporting evidence: h-c1's 16.18% improvement, Blyth's static
    feedback effectiveness, Arimbur's finding that gains concentrate in early iterations.
    The matched-content design isolates this from information volume confounds.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Static and execution feedback contain sufficiently different information (~65% non-overlap)"
    supporting_evidence: "h-m1 showed 34.5% overlap, implying ~65% unique information per feedback type"
    consequence_if_violated: "If overlap is high (>80%), ordering provides no structural benefit—same info repeated"
  - id: "A2"
    assumption: "LLMs are sensitive to presentation order under matched content"
    supporting_evidence: "Known positional biases in transformer attention; recency effects documented in prompting literature"
    consequence_if_violated: "If LLMs treat concatenated feedback identically regardless of order, hypothesis fails"
  - id: "A3"
    assumption: "Scaffolding manifests as trajectory differences, not just final accuracy"
    supporting_evidence: "Coarse-to-fine is observable via edit distances and regression rates across iterations"
    consequence_if_violated: "If pass@1 improves but trajectory signatures fail, mechanism is not scaffolding"
  - id: "A4"
    assumption: "3 repair iterations are sufficient to observe ordering effects"
    supporting_evidence: "Arimbur 2026 shows most gains in first 2-3 iterations; h-c1 used 3 iterations successfully"
    consequence_if_violated: "May need more iterations; but 3 is standard in literature"
  - id: "A5"
    assumption: "Token-capped feedback (500+500) preserves diagnostic utility"
    supporting_evidence: "Most static analysis and traceback outputs fit within 500 tokens; deterministic truncation maintains consistency"
    consequence_if_violated: "If truncation removes critical error info, feedback quality degrades unpredictably"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Iterative LLM code repair (3+ iterations)
    - Python code generation benchmarks (HumanEval, MBPP)
    - Scenarios where both static and execution feedback are available
    - Models with sufficient context length for concatenated feedback (~2000 tokens)
  does_not_apply_to: |
    - Single-shot code generation (no repair iterations)
    - Non-Python languages (not tested)
    - Execution-only scenarios (no static analysis available)
    - Models with very limited context (<1000 tokens)
  known_limitations: |
    - Single model tested (GPT-4o-mini); cross-model generalization unknown
    - Fixed iteration count (3); optimal iteration count not explored
    - Static analyzer fixed (Pylint/Pyright); other analyzers may differ
    - Benchmarks are function-level; file-level or project-level tasks not tested

