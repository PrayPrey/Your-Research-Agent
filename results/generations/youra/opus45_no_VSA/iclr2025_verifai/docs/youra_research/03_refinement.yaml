# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-FeedbackOrder-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under iterative repair (3 iterations) on HumanEval (164) + MBPP (500),
    if feedback is presented in static→execution order versus execution→static order
    (both with identical byte-matched content at 1000 tokens total),
    then the static-first condition achieves ≥15% relative pass@1 improvement,
    because early exposure to static analysis errors scaffolds the LLM's repair
    process toward surface-level fixes before tackling semantic issues.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@1 between static→execution and
    execution→static orderings when feedback content is identical; relative
    improvement <10% or 95% CI includes zero.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "feedback_presentation_order"
      type: "categorical"
      operationalization: "Order in which static and execution feedback are presented to LLM"
      levels:
        - "static_then_execution"
        - "execution_then_static"
  dependent:
    - name: "relative_pass_at_1_improvement"
      type: "continuous"
      operationalization: "Percentage improvement in pass@1 of cascade over reverse: (pass@1_A - pass@1_B) / pass@1_B * 100"
      primary: true
    - name: "delta_pass_1_2"
      type: "continuous"
      operationalization: "Mean change in per-test pass rate from iteration 1 to iteration 2"
      primary: false
    - name: "regression_rate_1_2"
      type: "continuous"
      operationalization: "Probability that a previously passing test fails at iteration 2"
      primary: false
    - name: "edit_locality_3"
      type: "continuous"
