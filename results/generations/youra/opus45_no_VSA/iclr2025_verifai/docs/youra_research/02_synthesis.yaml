    - source: "Per-iteration code snapshots for edit distance calculation"
    - source: "Per-test pass/fail results for regression detection"
    - source: "Token counts per API call for cost tracking"
  procedure:
    - step: "Generate static analysis report (Pylint/Pyright) for each problem"
    - step: "Execute code and capture traceback for each problem"
    - step: "Truncate both to 500 tokens deterministically"
    - step: "For condition A: present static→execution; for B: execution→static"
    - step: "Run 3 repair iterations, logging code after each"
    - step: "Compute pass@1, ΔPass₁₂, Regression Rate₁₂, Edit Locality₃"
  success_criteria:
    - "A vs B relative improvement ≥15% with 95% CI lower bound >10%"
    - "ΔPass₁₂(A) > ΔPass₁₂(B) with p<0.05"
    - "Regression Rate₁₂(A) < Regression Rate₁₂(B) with p<0.05"

validation:
