hypothesis_draft:
  title: "Feedback Ordering Effect in LLM Code Repair"
  hypothesis_id: "H-FeedbackOrder-v1"
  core_claim: |
    Under iterative repair on HumanEval+MBPP, presenting feedback in static→execution
    order achieves ≥15% relative pass@1 improvement over execution→static order when
    feedback content is byte-identical, because early static feedback scaffolds
    surface-level fixes before semantic repair.
  mechanism: |
    Static analysis identifies surface errors (type mismatches, unused variables).
    LLM resolves these first, clearing low-level issues. Execution feedback then
    focuses attention on semantic errors. This creates a coarse-to-fine repair
    trajectory with lower regression rates and more localized edits in later iterations.
  predictions:
    - P1: "A vs B achieves ≥15% relative pass@1 improvement, CI lower bound >10%"
    - P2: "ΔPass₁₂(cascade) > ΔPass₁₂(reverse) — larger early iteration gains"
    - P3: "Regression Rate₁₂(cascade) < Regression Rate₁₂(reverse) — fewer regressions"

variables_summary:
  independent: "Feedback presentation order (static→execution vs execution→static)"
  dependent_primary: "Relative pass@1 improvement (threshold ≥15%, CI >10%)"
  controlled: "Token budget (1000), content (byte-identical), model (GPT-4o-mini), iterations (3)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in pass@1 between static→execution and
    execution→static orderings when feedback content is identical; relative
    improvement <10% or 95% CI includes zero.
  statistical_test: "Two-proportion z-test for pass@1 comparison; bootstrap CIs"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First matched-content ordering test in LLM code repair"
  differentiation_summary: |
    Prior work (Olausson 2023, Blyth 2025, Arimbur 2026) treats feedback as monolithic.
    This design isolates ordering from information volume by using byte-identical content.
    h-c1's comparison had a volume confound (cascaded had 2x tokens); this design eliminates it.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
