main_hypothesis:
  id: H-FeedbackOrder-v1
  title: Feedback Ordering Effect in LLM Code Repair
  statement: Under iterative repair (3 iterations) on HumanEval (164) + MBPP (500), if feedback is presented in static→execution
    order versus execution→static order (both with identical byte-matched content at 1000 tokens total), then the static-first
    condition achieves ≥15% relative pass@1 improvement, because early exposure to static analysis errors scaffolds the LLM's
    repair process toward surface-level fixes before tackling semantic issues.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval + MBPP (664 problems)
    model: GPT-4o-mini
    optimizer: null
    hyperparameters:
      token_budget: 1000
      iterations: 3
      static_tokens: 500
      execution_tokens: 500
