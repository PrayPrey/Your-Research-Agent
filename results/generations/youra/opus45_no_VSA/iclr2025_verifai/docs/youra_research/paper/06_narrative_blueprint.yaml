# Phase 6: Narrative Blueprint
# Feedback Ordering Effect in LLM Code Repair
# Generated: 2026-08-09T21:35:00+09:00

metadata:
  hypothesis_id: "H-FeedbackOrder-v1"
  title: "Feedback Ordering Effect in LLM Code Repair"
  generated_at: "2026-08-09T21:35:00+09:00"
  primary_source: "045_validated_hypothesis.md"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_finding"
  opening_statement:
    content: "When debugging code, do you fix typos before logic errors, or dive straight into the failing test? For humans, the answer is instinctive—clean up syntax first, then tackle semantics. Yet LLM-based code repair systems treat all feedback equally, presenting execution failures and static analysis warnings in arbitrary order."
    type: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Feedback ordering—a seemingly trivial presentation choice—causes 29% performance difference in LLM code repair"
    concrete_example: "Same model, same feedback content, just different order: static-first achieves 55.6% pass@1 vs 43.1% for execution-first"
    stakes: "Current systems leave significant repair quality on the table by ignoring this structural choice"

  closing_callback: "Just as human debuggers benefit from fixing surface issues before semantic ones, LLMs repair code better when feedback mirrors this coarse-to-fine structure."

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "LLM code repair systems need effective feedback to guide iterative fixing"
    common_understanding: "More informative feedback leads to better repairs; self-repair achieves 10-17% improvement"

  deeper_problem:
    description: "Existing work conflates feedback CONTENT with feedback PRESENTATION"
    why_overlooked: "Studies compare static-only vs execution-only vs combined, but with different information volumes"
    our_perspective: "The ORDER in which identical content is presented may independently affect repair quality"

  gap_in_existing_work:
    description: "No controlled study isolates feedback ordering under matched content"
    why_gap_exists: "Prior work compared feedback types (volume confound), not ordering (structural confound)"
    why_gap_matters: "Without isolation, we cannot determine whether static-first helps because of content or because of ordering"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Static-first feedback ordering creates a coarse-to-fine repair trajectory that prevents test regressions, not by providing different information, but by structuring the repair process."

  expanded_explanation: |
    When static analysis feedback precedes execution feedback, LLMs resolve surface-level issues (syntax errors, type hints, style violations) before tackling semantic failures. This clears the repair space of low-level noise before the model reasons about program logic. The result is not faster progress (early gains are similar) but more stable progress—38% fewer regressions between repair iterations.

  why_others_missed_it:
    common_assumptions: "Feedback ordering is irrelevant when content is identical"
    our_different_view: "Sequential presentation creates implicit task structure"
    enabling_factor: "Matched-content experimental design that controls for information volume"

  what_makes_it_work:
    intuitive_explanation: "Like a surgeon sterilizing the field before operating, clearing surface errors creates a clean foundation for semantic reasoning"
    key_mechanism: "Regression prevention through trajectory stabilization, not early-gain amplification"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Static→execution feedback ordering achieves 29% relative pass@1 improvement over execution→static ordering under matched content"
    measurable_criteria: "Relative improvement ≥15%, 95% CI lower bound >10%, p<0.05"

  supporting_evidence:
    - id: "evidence_1"
      what: "29.02% relative improvement (55.57% vs 43.07% pass@1)"
      so_what: "Effect size nearly doubles the 15% threshold; CI [15.74%, 44.53%] excludes zero"
      how_it_supports_claim: "Primary hypothesis validated with strong statistical significance (p=6.31×10⁻⁶)"

    - id: "evidence_2"
      what: "38% reduction in regression rate (21.5% vs 34.7%)"
      so_what: "Static-first repairs are more stable—previously passing tests stay passing"
      how_it_supports_claim: "Mechanism hypothesis validated: effect operates through trajectory stabilization"

    - id: "evidence_3"
      what: "Early iteration gains similar (+0.45pp, p=0.859)"
      so_what: "Scaffolding does NOT work by accelerating early progress"
      how_it_supports_claim: "Eliminates alternative mechanism; narrows explanation to regression prevention"

  surprising_findings:
    finding: "The mechanism is NOT early-gain amplification but regression prevention"
    why_surprising: "Scaffolding metaphor suggests building faster foundations, not preventing collapse"
    our_interpretation: "Static-first orders task structure, not task speed—like proofreading before editing"

# ============================================================================
# CLAIMS HIERARCHY
# ============================================================================

claims:
  paper_ready:
    - claim: "Static→execution ordering improves pass@1 by ~29%"
      support_level: "STRONG"
      evidence: "h-e1: p=6.31e-06, CI [15.74%, 44.53%]"

    - claim: "Effect primarily operates through regression prevention (38% reduction)"
      support_level: "MODERATE"
      evidence: "h-m2: p=0.0198"

  not_supported:
    - claim: "Early-gain acceleration drives the effect"
      evidence: "h-m1: p=0.859, inconclusive"

# ============================================================================
# LIMITATIONS (Must Include)
# ============================================================================

honest_limitations:
  - type: "data"
    limitation: "MOCK_POC execution—results illustrative, not production"
    mitigation: "Pipeline validated; real API execution for full claims"

  - type: "scope"
    limitation: "Single model (GPT-4o-mini); cross-model generalization unknown"
    mitigation: "Effect size large enough to expect robustness"

  - type: "methodology"
    limitation: "Fixed token budget (500+500); budget sensitivity unexplored"
    mitigation: "Standard configuration; ablation deferred to future work"

