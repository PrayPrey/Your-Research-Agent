# Phase 6 Narrative Blueprint
# Bidirectional Alignment Index (BAI) Paper
# Generated: 2026-08-08

narrative_architecture:
  strategy: "surprising_negative_result_plus_methodology"
  tone: "empirical_honest"
  target_venue: "ICML 2025"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  type: "unexpected_finding"
  opening_sentence: |
    We can reliably extract signals from AI responses that are statistically
    independent from reward scores — but these signals may not capture what
    we intended them to measure.
  tension: |
    Strong methodological success (AUROC 0.98-0.99) combined with semantic
    validation failure (0% agency pattern rate) creates productive tension.
  hook_callback_in_conclusion: |
    Return to the gap between extractability and interpretability — what
    we can measure vs. what we mean to measure.

# ============================================================================
# PROBLEM FRAMING (3 LEVELS)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: |
      Current AI alignment evaluation is unidirectional — measuring only
      whether AI follows human preferences, not whether AI preserves human
      agency and critical evaluation capability.
    evidence: "Shen et al. (2024) systematic review of 400+ papers"

  level_2_deeper:
    statement: |
      The Bidirectional Alignment Framework (Shen et al. 2024) proposes
      Human→AI alignment as a second axis, but lacks operationalization.
      Can we extract agency-preserving signals from existing preference data?
    gap: "No benchmark measures both alignment directions simultaneously"

  level_3_fundamental:
    statement: |
      The deeper question is whether surface-level linguistic proxies
      (clarifying questions, hedging, deferral) actually capture functional
      agency preservation, or merely stylistic correlates.
    insight_preview: |
      Our experiments show these proxies are extractable and representationally
      independent — but semantically incoherent as agency-preserving behaviors.

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  one_sentence: |
    BAI forms a statistically independent representational dimension (AUROC 0.99
    after gradient reversal), but semantic analysis reveals high-BAI responses
    cluster by generic conversational patterns, not agency vocabulary.
  verification_evidence:
    - "H-M1: BAI AUROC 0.9864 post-GRL, R² degradation -0.27%"
    - "H-C1: 0% agency keyword match in BERTopic clusters"
  implication: |
    Surface-level operationalizations capture syntax, not semantics. Future
    bidirectional alignment work needs embedding-based or LLM-judge approaches.

# ============================================================================
# EVIDENCE STRUCTURE
# ============================================================================

evidence_structure:
  primary_claims:
    - claim: "Agency proxies are reliably extractable"
      evidence: "H-E1: Mean AUROC 0.9836, all 4 proxies > 0.96"
      confidence: "HIGH"
      section: "results"

    - claim: "BAI is representationally independent from reward"
      evidence: "H-M1: AUROC 0.9864 after GRL, R² degradation -0.27%"
      confidence: "HIGH"
      section: "results"

    - claim: "Systematic BAI-reward disagreement exists but is moderate"
      evidence: "H-M2: 11.77% disagreement (above 10%, below 20%)"
      confidence: "MEDIUM"
      section: "results"

    - claim: "Surface proxies do NOT capture semantic agency"
      evidence: "H-C1: 0% agency pattern rate despite 98% cluster coverage"
      confidence: "HIGH"
      section: "discussion"

  secondary_claims:
    - claim: "High-BAI/Low-Reward dominates over Low-BAI/High-Reward"
      evidence: "HL quadrant 3,063 vs LH 1,869"
      interpretation: "May reflect safety refusals or verbosity correlation"

    - claim: "BAI variance is low (0.0022)"
      evidence: "Proxy detection rates 0.12%-11.66%"
      interpretation: "Conservative regex patterns may miss genuine signals"

  negative_results:
    - finding: "Semantic coherence failed"
      evidence: "Topics dominated by stopwords: 'welcome', 'you', 'thanks'"
      framing: "Valuable negative result guiding future operationalization"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    word_target: 150
    must_include:
      - "Bidirectional alignment gap"
      - "BAI operationalization"
      - "Key positive results (AUROC 0.98, 0.99)"
      - "Key negative result (semantic coherence failed)"
      - "Methodological contribution"

  introduction:
    word_target: 900
    narrative_arc:
      - "Hook: extractable but maybe meaningless signals"
      - "Problem Level 1: unidirectional alignment evaluation"
      - "Problem Level 2: bidirectional framework lacks metrics"
      - "Problem Level 3: surface vs functional agency"
      - "Key insight preview"
      - "Contributions (not a bullet list)"

  related_work:
    word_target: 700
    positioning:
      - category: "Alignment Evaluation Benchmarks"
        works: ["RewardBench", "AlignBench", "PERSONA"]
        gap: "AI→Human only"
      - category: "Human Agency in AI"
        works: ["Mitelut et al. 2023", "HumanAgencyBench"]
        gap: "Not integrated with alignment infrastructure"
      - category: "Bidirectional Alignment"
        works: ["Shen et al. 2024 framework"]
        gap: "Conceptual, not operationalized"
      - category: "Adversarial Probing"
        works: ["Ganin & Lempitsky 2015", "domain adaptation"]
        build_on: "Methodology for representational independence"

  methodology:
    word_target: 1100
    structure:
      - "Problem setup: extracting agency signals from preference data"
      - "BAI computation: 4 proxies, length normalization"
      - "Adversarial probing: gradient reversal for independence"
      - "Disagreement analysis: quartile-based systematic comparison"
      - "Semantic validation: BERTopic clustering"
    figure_reference: "Figure 1 illustrates..."

  experiments:
    word_target: 900
    structure:
      - "Research questions (not 'RQ1, RQ2' — natural prose)"
      - "Datasets: HH-RLHF (40,688), RewardBench Safety (1,208)"
      - "Implementation: TF-IDF + LogReg, DeBERTa reward model"
      - "Evaluation protocol: AUROC, R², disagreement rate, agency pattern rate"

  results:
    word_target: 1100
    structure:
      - "H-E1: Proxy extraction (AUROC 0.9836)"
      - "H-M1: Representational independence (AUROC 0.9864)"
      - "H-M2: Disagreement analysis (11.77%)"
      - "H-C1: Semantic coherence (0%)"
    figures:
      - "fig_1: auroc_bar.png"
      - "fig_3: scatter_quadrants.png"

  discussion:
    word_target: 500
    structure:
      - "Key finding interpretation: independence without meaning"
      - "Why semantic coherence failed"
      - "Limitations: synthetic data (H-M1), low BAI variance"
      - "Implications for bidirectional alignment research"
    figures:
      - "fig_5: umap_projection.png"
      - "fig_6: topic_wordclouds.png"

  conclusion:
    word_target: 350
    structure:
      - "Summary: what we showed"
      - "Callback to hook: extractable ≠ meaningful"
      - "Future work: LLM-judge, real activations, domain stratification"

# ============================================================================
# FIGURE PLACEMENT
# ============================================================================

figure_placement:
  methodology:
    - figure: "Figure 1 (method overview)"
      note: "Deferred to Phase 6.5.1 (PaperBanana)"
      prose_reference: "Figure 1 illustrates the BAI extraction and validation pipeline."

  results:
    - figure: "fig_1 (auroc_bar.png)"
      placement: "After proxy extraction results paragraph"
      caption_hook: "All four proxies exceed 0.8 target"

    - figure: "fig_3 (scatter_quadrants.png)"
      placement: "After disagreement analysis paragraph"
      caption_hook: "11.77% in disagreement quadrants"

  discussion:
    - figure: "fig_5 (umap_projection.png)"
      placement: "After semantic failure explanation"
      caption_hook: "Clusters reflect generic language, not agency"

# ============================================================================
# CITATIONS (KEY)
# ============================================================================

key_citations:
  - ref: "Shen2024"
    title: "Towards Bidirectional Human-AI Alignment"
    usage: "Framework motivation, gap identification"
    must_cite_in: ["introduction", "related_work"]

  - ref: "Lambert2024"
    title: "RewardBench"
    usage: "Baseline comparison, dataset"
    must_cite_in: ["related_work", "experiments"]

  - ref: "Mitelut2023"
    title: "Intent-aligned AI systems deplete human agency"
    usage: "Agency preservation theory"
    must_cite_in: ["introduction", "related_work"]

  - ref: "HumanAgencyBench2024"
    title: "HumanAgencyBench"
    usage: "6 agency dimensions adapted to 4 proxies"
    must_cite_in: ["methodology"]

  - ref: "Ganin2015"
    title: "Domain-Adversarial Training"
    usage: "Gradient reversal methodology"
    must_cite_in: ["methodology"]

# ============================================================================
# NARRATIVE COHERENCE CHECKS
# ============================================================================

coherence_checks:
  hook_callback: true
  claim_evidence_match: true
  limitation_honesty: true
  negative_result_framed: true
  contributions_specific: true
