# ============================================================================
# METHODOLOGY CLAIMS (Adversarial Review Should Check)
# ============================================================================

methodology_claims:
  - claim_id: "M1"
    claim: "TF-IDF + LogisticRegression for proxy detection"
    parameters:
      ngram_range: [1, 2]
      max_features: 5000
      C: 1.0
    source: "h-e1/02c_experiment_brief.md"

  - claim_id: "M2"
    claim: "DANN sigmoid scheduling for gradient reversal"
    parameters:
      alpha_schedule: "0→1 over epoch 1"
      loss_lambda: 1.0
      epochs: 5
    source: "h-m1/02c_experiment_brief.md"

  - claim_id: "M3"
    claim: "BERTopic with all-MiniLM-L6-v2 for semantic clustering"
    parameters:
      embedding_model: "all-MiniLM-L6-v2"
      min_cluster_size: 50
      umap_n_components: 5
      umap_n_neighbors: 15
    source: "h-c1/02c_experiment_brief.md"

# ============================================================================
# LIMITATIONS (Must Be Acknowledged)
# ============================================================================

acknowledged_limitations:
  - id: "L1"
    limitation: "H-M1 used synthetic hidden states, not real LLM activations"
    impact: "Methodology validated but not production-tested"
    acceptable: true
    reason: "GPU memory constraints; real-model validation is straightforward follow-up"

  - id: "L2"
    limitation: "Low BAI variance (0.0022)"
    impact: "Floor effect may compress signal"
    source: "h-m2/04_validation.md"

  - id: "L3"
    limitation: "H-C1 semantic coherence failed"
    impact: "BAI may capture surface features, not functional agency"
    source: "h-c1/04_validation.md"

