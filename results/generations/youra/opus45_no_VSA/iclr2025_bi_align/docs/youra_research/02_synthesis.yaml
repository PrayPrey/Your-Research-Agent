hypothesis_draft:
  title: "Bidirectional Alignment Index (BAI): Extracting Human-to-AI Alignment from Existing Preference Data"
  hypothesis_id: "H-BAI-v1"
  core_claim: |
    Existing preference datasets contain a latent agency-preservation dimension that can be
    extracted via automated proxies and validated through representational probing. This
    dimension is orthogonal to reward model scores and represents the underweighted
    Human-to-AI alignment direction.
  mechanism: |
    Four agency-preserving behaviors (clarifying questions, option enumeration, epistemic
    hedging, explicit deferral) encode variance in model representations that is not captured
    by reward prediction. Adversarial probing isolates this orthogonal subspace. Disagreement
    analysis (high-BAI/low-reward cases) reveals responses that preserve user agency but are
    penalized as "unhelpful" by current benchmarks.
  predictions:
    - P1: "BAI remains decodable (AUROC ≥0.7) after adversarial gradient reversal"
    - P2: "≥20% disagreement rate between BAI and reward quartiles"
    - P3: "Disagreement cases exhibit interpretable agency-preserving patterns"

variables_summary:
  independent: "BAI score (composite of 4 proxies, length-normalized, residualized)"
  dependent_primary: "Representational independence (adversarial probe AUROC)"
  controlled: "Response length, politeness markers, prompt ambiguity"

null_hypothesis:
  h0_statement: |
    BAI does not form an independent representational dimension — either decodability
    collapses after gradient reversal (AUROC <0.6) or BAI correlates monotonically
    with reward scores (disagreement rate <10%).
  statistical_test: "Adversarial probing with gradient reversal; quartile disagreement analysis"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First automated extraction of Human→AI alignment signal from existing preference data"
  differentiation_summary: |
    Unlike HumanAgencyBench (LLM-as-judge), BAI uses pattern-based proxies for full automation.
    Unlike RewardBench (AI→Human only), BAI extracts orthogonal second axis.
    Unlike Shen et al. (conceptual framework), BAI provides computable metric.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

