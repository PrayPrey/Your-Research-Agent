# Stage 1 Context - Gap 1: Unified Bidirectional Alignment Metrics
gap_id: "gap1_unified_bidirectional_metrics"
gap_title: "Absence of Unified Bidirectional Alignment Metrics"
gap_description: |
  Current alignment benchmarks (RewardBench, AlignBench, PERSONA) exclusively measure
  AI-to-human alignment direction. Shen et al. (2024) systematic review of 400+ papers
  confirms this unidirectional focus. No unified benchmark framework simultaneously
  measures both AI→Human alignment (reward model quality, instruction following) AND
  Human→AI alignment (agency preservation, critical evaluation capability).

