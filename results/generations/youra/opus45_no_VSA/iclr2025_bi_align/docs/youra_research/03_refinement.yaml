# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Existing alignment benchmarks (RewardBench, AlignBench, PERSONA) measure AI-to-human alignment exclusively"
      status: "BUILD_ON"
      evidence: "Shen et al. (2024) systematic review of 400+ papers confirms unidirectional focus"
    - claim: "HumanAgencyBench provides 6 dimensions for human agency preservation"
      status: "BUILD_ON"
      evidence: "BenSturgeon/HumanAgencyBench - 60K rows, 6 validated dimensions"
    - claim: "No unified benchmark measures both alignment directions simultaneously"
      status: "PROVE_NEW"
      evidence: "Research gap identified in Phase 1; this is the novel contribution"
  scope_reduction_percentage: 33
  phase2b_4_instructions: |
    Build on existing benchmarks (RewardBench, HH-RLHF) and HumanAgencyBench dimensions.
    Focus validation on proving representational independence of BAI from reward scores.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BAI-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under conditions where four agency proxies (clarifying questions, option enumeration,
    epistemic hedging, explicit deferral) achieve ≥0.8 AUROC against pre-existing prompt
    annotations, if we compute a length-normalized Bidirectional Alignment Index (BAI)
    from these proxies, then BAI will form a statistically independent dimension in model
    representation space (adversarial probe AUROC ≥0.7 after gradient reversal) and show
    systematic disagreement with reward scores (≥20% high-BAI/low-reward pairs), because
    agency-preserving AI behaviors constitute a latent dimension that current
    helpfulness-oriented evaluation systematically underweights.
  alternative_hypothesis_h0: |
    BAI does not form an independent representational dimension — either BAI decodability
    collapses to chance (AUROC <0.6) after removing reward-predictive variance, OR
    BAI shows <10% disagreement rate with reward scores, indicating it is a stylistic
    subcomponent of helpfulness rather than an orthogonal alignment axis.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "BAI Score"
      type: "continuous"
      operationalization: "Composite score from 4 agency proxies: clarifying questions (binary), option enumeration (count), epistemic hedging (ratio), explicit deferral (binary). Length-normalized, residualized against verbosity/politeness."
      levels: null
    - name: "Reward Model Score"
      type: "continuous"
      operationalization: "Standard reward model output (RewardBench/HH-RLHF preference probability)"
      levels: null
  dependent:
    - name: "Representational Independence"
      type: "continuous"
      operationalization: "BAI decodability (AUROC) from hidden states after adversarial gradient reversal"
      primary: true
    - name: "Disagreement Rate"
      type: "continuous"
      operationalization: "Percentage of response pairs with high-BAI/low-reward or low-BAI/high-reward (quartile-based)"
      primary: false
  controlled:
    - name: "Response Length (tokens)"
      operationalization: "Token count, used for normalization"
    - name: "Politeness Markers"
      operationalization: "Count of politeness phrases, controlled via residualization"
    - name: "Prompt Ambiguity"
      operationalization: "Pre-existing annotation tags in HH-RLHF/RewardBench"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Agency-preserving behaviors (clarifying, enumerating, hedging, deferring) are encoded in AI responses"
      evidence: "HumanAgencyBench dimensions; pattern-extractable from text"
      falsifier: "Proxies fail reliability threshold (AUROC <0.8)"
    - step: 2
      description: "These behaviors form a latent representational dimension distinct from reward optimization"
      evidence: "Adversarial probing isolates orthogonal variance"
      falsifier: "BAI decodability collapses after gradient reversal (AUROC <0.6)"
    - step: 3
      description: "Current reward models underweight or penalize these behaviors as 'unhelpful'"
      evidence: "Systematic disagreement cases (high-BAI/low-reward slices)"
      falsifier: "Disagreement rate <10%; BAI correlates monotonically with reward"
    - step: 4
      description: "Agency-preserving behaviors reduce user cognitive offloading, increasing independent evaluation (theoretical)"
      evidence: "Mitelut et al. (2023) agency preservation framework"
      falsifier: "Future behavioral study shows no error detection improvement"
  key_tension: "Step 4 (behavioral causality) cannot be tested without new human experiments; deferred to future work"
  evidence_summary: |
    Steps 1-3 are testable with existing infrastructure. Step 4 provides theoretical grounding
    (Mitelut et al.'s formal agency definition) but requires human study for empirical validation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Surface text features (clarifying questions, options, hedging) map to functional agency preservation"
    supporting_evidence: "HumanAgencyBench validated 6 dimensions via human evaluation"
    consequence_if_violated: "BAI captures stylistic tone, not agency-relevant behavior"
  - id: "A2"
    assumption: "HH-RLHF/RewardBench contain sufficient variance in agency-preserving responses (>15% prevalence)"
    supporting_evidence: "Preliminary: advice-seeking prompts should elicit varied response styles"
    consequence_if_violated: "Insufficient statistical power; cannot extract meaningful second axis"
  - id: "A3"
    assumption: "Open-weight models (Llama, Mistral, Qwen) are representative of general alignment trends"
    supporting_evidence: "These models dominate public benchmarks and research"
    consequence_if_violated: "Results may not generalize to closed models (GPT-4, Claude)"
  - id: "A4"
    assumption: "Adversarial probing correctly isolates representational independence"
    supporting_evidence: "Gradient reversal is standard technique for domain separation"
    consequence_if_violated: "Non-linear entanglement may persist despite passing linear independence tests"
  - id: "A5"
    assumption: "Advisory/moral prompts are the appropriate scope for agency preservation"
    supporting_evidence: "HumanAgencyBench dimensions are inherently advice-relevant"
    consequence_if_violated: "Results are domain-conditional, not a 'second alignment axis' globally"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Advisory and moral prompts (HH-RLHF "helpful" subset, RewardBench "Chat"/"Safety")
    - Open-weight language models with accessible hidden states (Llama-3, Mistral, Qwen-2)
    - Text-based AI assistant interactions
  does_not_apply_to: |
    - Factual QA prompts (e.g., trivia, knowledge retrieval)
    - Closed-weight models (GPT-4, Claude) — behavioral-only validation possible
    - Multi-turn conversational dynamics (single-turn responses only)
    - Non-text modalities (image, audio)
  known_limitations: |
    - Cannot test causal mechanism (agency → error detection) without new human experiments
    - Behavioral validation deferred; current study establishes construct validity only
    - Domain-conditional effects may limit generalizability claims

