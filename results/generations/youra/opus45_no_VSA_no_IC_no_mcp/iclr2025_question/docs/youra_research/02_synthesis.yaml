hypothesis_draft:
  title: "Orthogonal UQ Signals: Entropy vs. Consistency for Hallucination Detection"
  hypothesis_id: "H-EntropyConsistency-v1"
  core_claim: |
    Token-level entropy and N-sample consistency capture complementary uncertainty
    signals for LLM hallucination detection. A hybrid detector combining both
    outperforms either method alone on factuality benchmarks.
  mechanism: |
    1. Token entropy captures epistemic uncertainty — diffuse logit distributions
       indicate model lacks knowledge about the answer.
    2. N-sample consistency captures generation stability — low similarity across
       samples indicates unstable generation process.
    3. Discordant cases (methods disagree) reveal complementary failure modes,
       enabling improved detection when combined.
  predictions:
    - P1: "Hybrid AUROC exceeds max(entropy, consistency) by ≥3% on TruthfulQA"
    - P2: "Correlation(entropy, consistency) < 0.3"
    - P3: "Discordant cases (>15%) show differential predictive value (AUROC >0.6 per method)"

variables_summary:
  independent: "UQ Method: entropy_only | consistency_only | hybrid_weighted"
  dependent_primary: "Hallucination Detection AUROC on TruthfulQA"
  controlled: "Model (LLaMA-2-7B), Dataset (TruthfulQA), N=5 samples, mean entropy aggregation"

null_hypothesis:
  h0_statement: |
    There is no significant improvement in hallucination detection AUROC from
    combining entropy and consistency methods compared to the best single method
