# Ground Truth for Phase 6.5 Adversarial Review
# Generated: 2026-08-28
# Purpose: Factual claims that reviewers can verify against source artifacts

metadata:
  paper_file: "06_paper.md"
  source_artifacts:
    - "045_validated_hypothesis.md"
    - "h-m2/04_validation.md"
    - "h-m3/04_validation.md"
    - "03_refinement.yaml"

# =============================================================================
# QUANTITATIVE CLAIMS (Exact values that can be verified)
# =============================================================================

quantitative_claims:
  orthogonality:
    - claim: "Pearson correlation r = 0.228"
      source: "h-m3/04_validation.md"
      threshold: "< 0.3"
      status: "PASS"
      verifiable: true

    - claim: "Spearman correlation ρ = 0.241"
      source: "h-m3/04_validation.md"
      verifiable: true

    - claim: "5% shared variance"
      derivation: "r² = 0.228² ≈ 0.052"
      verifiable: true

  effect_size:
    - claim: "Cohen's d = 1.068 for consistency"
      source: "h-m2/04_validation.md"
      threshold: "> 0.2"
      status: "PASS"
      verifiable: true

    - claim: "95% CI = [0.921, 1.215]"
      source: "h-m2/04_validation.md"
      verifiable: true

    - claim: "p-value = 4.64e-46"
      source: "h-m2/04_validation.md"
      verifiable: true

  consistency_means:
    - claim: "Correct responses mean = 0.720"
      source: "h-m2/04_validation.md"
      verifiable: true

    - claim: "Incorrect responses mean = 0.577"
      source: "h-m2/04_validation.md"
      verifiable: true

    - claim: "Difference = 24% (0.72 vs 0.58)"
      derivation: "(0.72 - 0.577) / 0.577 ≈ 0.248"
      verifiable: true

  discordant_cases:
    - claim: "18.1% discordant cases"
      source: "h-m3/04_validation.md"
      count: 148
      total: 817
      threshold: "> 15%"
      status: "PASS"
      verifiable: true

    - claim: "High-entropy-only subset AUROC = 0.764"
      source: "h-m3/04_validation.md"
      threshold: "> 0.6"
      status: "PASS"
      verifiable: true

    - claim: "High-inconsistency-only subset AUROC = 0.797"
      source: "h-m3/04_validation.md"
      threshold: "> 0.6"
      status: "PASS"
      verifiable: true

  dataset:
    - claim: "817 questions from TruthfulQA generation split"
      source: "h-e1/04_validation.md"
      verifiable: true

    - claim: "367 correct, 450 incorrect"
      source: "h-m2/04_validation.md"
      verifiable: true

# =============================================================================
# QUALITATIVE CLAIMS (Interpretations that can be scrutinized)
# =============================================================================

qualitative_claims:
  key_insight:
    claim: "Token entropy and N-sample consistency capture fundamentally different hallucination signatures"
    support:
      - "r = 0.228 (5% shared variance)"
      - "Each method achieves AUROC > 0.75 on its winning discordant subset"
    challenge_vectors:
      - "Could the low correlation be due to noise rather than orthogonality?"
      - "Is 18.1% discordant proportion practically significant?"

  mechanism_entropy:
    claim: "Entropy reflects epistemic uncertainty (model doesn't know)"
    support: "H-M1 validated: higher entropy for incorrect responses"
    challenge_vectors:
      - "Direction confirmed but exact effect size not quantified"
      - "Entropy might capture other phenomena beyond epistemic uncertainty"

  mechanism_consistency:
    claim: "Consistency reflects generation stability (model knows but unstable)"
    support: "H-M2 validated: d = 1.068, correct > incorrect"
    challenge_vectors:
      - "Large effect might be TruthfulQA-specific"
      - "Temperature=1.0 may artificially amplify differences"

  complementarity:
    claim: "Combining signals would improve detection"
    support:
      - "Orthogonality established (r = 0.228)"
      - "Complementary AUROC on discordant subsets"
    challenge_vectors:
      - "Hybrid detector not actually tested (P1 pending)"
      - "Improvement magnitude unknown"

# =============================================================================
# LIMITATIONS ACKNOWLEDGED (Honest scope boundaries)
# =============================================================================

limitations_acknowledged:
  - id: "L1"
    limitation: "Single model (LLaMA-2-7B only)"
    consequence: "Results may not generalize to other architectures or scales"
    mentioned_in_paper: true

  - id: "L2"
    limitation: "Single benchmark (TruthfulQA)"
    consequence: "Adversarial design may inflate effect sizes"
    mentioned_in_paper: true

  - id: "L3"
    limitation: "Hybrid detector not tested"
    consequence: "Primary prediction (P1: ≥3pp improvement) unverified"
    mentioned_in_paper: true

  - id: "L4"
    limitation: "Fixed hyperparameters (N=5, T=1.0)"
    consequence: "Different parameters may yield different results"
    mentioned_in_paper: true

