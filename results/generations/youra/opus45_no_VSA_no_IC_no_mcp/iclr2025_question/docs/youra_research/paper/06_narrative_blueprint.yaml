# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "On 18% of factuality questions, token entropy and answer consistency point in opposite directions — and each method is right about its own subset."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Single uncertainty signals miss complementary failure modes; combining orthogonal signals could improve hallucination detection"
    concrete_example: "When entropy says the model is confident but consistency shows unstable sampling, each captures a different type of hallucination"
    stakes: "Deploying LLMs with only one uncertainty measure leaves 18% of errors undetected by that measure"

  anti_patterns_avoided:
    - "Did NOT use: 'LLMs have achieved remarkable success...'"
    - "Did NOT use: 'Hallucination detection is an important problem...'"
    - "Used: Quantitative surprise (18%, r=0.228, d=1.068)"

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "LLMs generate factually incorrect information (hallucinations) that is difficult to detect"
    common_understanding: "Uncertainty quantification methods like entropy and consistency can flag potential hallucinations"

  deeper_problem:
    description: "Entropy-based and consistency-based methods have been developed independently without systematic comparison"
    why_overlooked: "Different communities (NLG vs. factuality, different benchmarks)"
    our_perspective: "If methods capture different failure modes, neither alone is sufficient"

  gap_in_existing_work:
    description: "No systematic head-to-head comparison of entropy vs. consistency methods on same factuality benchmark"
    why_gap_exists: "Kuhn et al. (Semantic Entropy) evaluated on NLG tasks; Manakul et al. (SelfCheckGPT) on WikiBio"
    why_gap_matters: "Cannot determine if methods are redundant or complementary without direct comparison"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Token entropy and N-sample consistency capture fundamentally different hallucination signatures — entropy detects when the model doesn't know, while consistency detects when the model knows but generates unreliably."
    expanded_explanation: |
      We found that entropy and consistency signals share only 5% variance (r=0.228).
      In 18.1% of questions where methods disagree substantially, each achieves AUROC >0.75
      on its "winning" subset. This demonstrates genuine complementary detection capability.

  why_others_missed_it:
    common_assumptions: "Uncertainty signals should correlate highly with each other"
    our_different_view: "Different uncertainty types (epistemic vs. generation stability) manifest differently"
    enabling_factor: "Direct comparison on same benchmark (TruthfulQA) with same model (LLaMA-2-7B)"

  what_makes_it_work:
    intuitive_explanation: "High entropy = model doesn't know the answer; low consistency = model's sampling is unstable"
    key_mechanism: "Orthogonal signals enable complementary detection — discordant cases reveal different failure modes"

# =============================================================================
# EVIDENCE STORY
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Token entropy and N-sample consistency are orthogonal uncertainty signals with complementary predictive value for hallucination detection"
    measurable_criteria:
      - "Pearson r < 0.3 between entropy and consistency"
      - "Discordant cases > 15%"
      - "Each method achieves AUROC > 0.6 on its winning subset"

  prediction_status:
    P1_hybrid_improvement: "INCONCLUSIVE (not yet tested; deferred to Phase 5)"
    P2_orthogonality: "SUPPORTED (r=0.228 < 0.3 threshold)"
    P3_complementarity: "SUPPORTED (18.1% discordant, subset AUROC > 0.75)"

supporting_evidence:
  - id: "evidence_1"
    what: "Pearson r = 0.228 between entropy and consistency"
    so_what: "Only 5% shared variance — methods measure fundamentally different phenomena"
    how_it_supports_claim: "Confirms orthogonality of signals"
    figure: "fig_1 (scatter_entropy_consistency.png)"

  - id: "evidence_2"
    what: "Cohen's d = 1.068 for consistency effect size"
    so_what: "Correct responses have ~1 std higher consistency than incorrect (5× threshold)"
    how_it_supports_claim: "Consistency is a powerful discriminator for factuality"
    figure: "fig_3 (distribution_comparison.png)"

  - id: "evidence_3"
    what: "18.1% discordant cases with subset AUROC 0.764 and 0.797"
    so_what: "Each method wins big on its own territory — genuine complementarity"
    how_it_supports_claim: "Validates hybrid combination potential"
    figure: "fig_2 (quadrant_analysis.png)"

surprising_findings:
  - finding: "Consistency effect size (d=1.068) exceeds expectations by 5×"
    why_surprising: "SelfCheckGPT literature suggested moderate effects (d ~0.3-0.5)"
    our_interpretation: "TruthfulQA's adversarial design elicits clearer hallucinations; temperature=1.0 amplifies differences"

  - finding: "Both subset AUROCs exceed 0.75 (threshold was 0.6)"
    why_surprising: "Expected modest complementarity; observed strong discriminative power"
    our_interpretation: "Genuine complementarity — entropy detects knowledge gaps, consistency detects generation artifacts"

