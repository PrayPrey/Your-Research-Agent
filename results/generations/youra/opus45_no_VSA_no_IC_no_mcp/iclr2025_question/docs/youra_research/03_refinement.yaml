established_facts:
  claims:
    - claim: "Token entropy can be computed from LLM logits using H = -Σp log p"
      status: "BUILD_ON"
      evidence: "Standard information theory, used in Kuhn et al. 2023"
    - claim: "N-sample consistency can be measured via embedding cosine similarity"
      status: "BUILD_ON"
      evidence: "SelfCheckGPT (Manakul et al. 2023) validated this approach"
    - claim: "TruthfulQA provides ground truth factuality labels for ~800 QA pairs"
      status: "BUILD_ON"
      evidence: "Lin et al. 2022, benchmark established"
    - claim: "Entropy and consistency methods have not been compared on same benchmark"
      status: "PROVE_NEW"
      evidence: "Gap identified in Phase 1 research"
    - claim: "The two methods capture orthogonal uncertainty signals"
      status: "PROVE_NEW"
      evidence: "Core hypothesis to test"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims are established — use as background. Focus verification on
    PROVE_NEW claims: orthogonality of entropy/consistency signals and hybrid improvement.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EntropyConsistency-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under closed-book QA conditions (TruthfulQA), if we compute both token-level
    entropy and N-sample consistency for each LLM response, then a hybrid detector
    combining both signals will outperform either method alone by ≥3 percentage
    points AUROC, because the methods capture orthogonal failure modes — entropy
    reflects epistemic uncertainty while consistency reflects generation stability.
  alternative_hypothesis_h0: |
    There is no significant difference in hallucination detection performance
    between a hybrid entropy+consistency detector and the best single-method
    detector (AUROC improvement < 3 percentage points).

