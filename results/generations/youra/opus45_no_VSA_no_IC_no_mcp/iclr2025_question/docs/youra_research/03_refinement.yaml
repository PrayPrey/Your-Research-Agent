        - "consistency_only"
        - "hybrid_weighted"
  dependent:
    - name: "Hallucination Detection AUROC"
      type: "continuous"
      operationalization: "Area under ROC curve for predicting factual correctness on TruthfulQA"
      primary: true
    - name: "Entropy-Consistency Correlation"
      type: "continuous"
      operationalization: "Pearson correlation coefficient between entropy and consistency scores"
      primary: false
    - name: "Discordant Case Proportion"
      type: "continuous"
      operationalization: "Fraction of questions where entropy rank differs from consistency rank by >50 percentile points"
      primary: false
  controlled:
