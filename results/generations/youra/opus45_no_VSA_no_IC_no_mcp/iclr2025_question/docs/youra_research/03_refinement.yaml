# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Closed-book factuality QA tasks (TruthfulQA, Natural Questions)
    - Autoregressive decoder-only LLMs (LLaMA family)
    - English language QA
    - Tasks with ground truth factuality labels
  does_not_apply_to: |
    - Open-domain generation without factuality labels
    - Non-English languages
    - Encoder-only or encoder-decoder models
    - Tasks requiring human judgment of correctness
  known_limitations: |
    - Single model scale (7B) — may not generalize to 13B/70B
    - Single benchmark — may not generalize to other factuality tasks
    - Semantic entropy (Kuhn's method) not tested — may outperform token entropy

