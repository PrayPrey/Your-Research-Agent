    - name: "Dataset"
      operationalization: "Fixed to TruthfulQA (~800 questions)"
    - name: "Consistency samples"
      operationalization: "Fixed to N=5 samples per question"
    - name: "Entropy aggregation"
      operationalization: "Fixed to mean token entropy over response"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Token entropy captures epistemic uncertainty — when model lacks knowledge about answer, logit distribution is diffuse"
      evidence: "High entropy indicates model uncertainty about next token, correlates with knowledge gaps (Kadavath et al. 2022)"
      falsifier: "If entropy is uncorrelated with factual correctness, mechanism fails"
    - step: 2
      description: "N-sample consistency captures generation stability — when model's sampling process is unstable, different runs yield semantically different answers"
      evidence: "SelfCheckGPT shows low consistency indicates hallucination (Manakul et al. 2023)"
      falsifier: "If consistency is uncorrelated with factual correctness, mechanism fails"
    - step: 3
      description: "Orthogonal signals enable complementary detection — discordant cases (where methods disagree) reveal different failure modes"
      evidence: "Discussion identified four quadrants: high/low entropy × high/low consistency"
      falsifier: "If correlation(entropy, consistency) > 0.7, signals are redundant not orthogonal"
  key_tension: "Whether discordant cases contain genuine complementary signal vs. just noise"
  evidence_summary: |
    Both entropy and consistency have shown individual predictive value for hallucination
    in prior work. The key hypothesis is that they capture different phenomena and thus
    provide additive value when combined.

