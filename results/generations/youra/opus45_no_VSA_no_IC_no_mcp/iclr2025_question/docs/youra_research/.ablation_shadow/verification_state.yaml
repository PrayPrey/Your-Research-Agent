main_hypothesis:
  id: H-EntropyConsistency-v1
  title: 'Orthogonal UQ Signals: Entropy vs. Consistency for Hallucination Detection'
  statement: Under closed-book QA conditions (TruthfulQA), if we compute both token-level entropy and N-sample consistency
    for each LLM response, then a hybrid detector combining both signals will outperform either method alone by ≥3 percentage
    points AUROC, because the methods capture orthogonal failure modes — entropy reflects epistemic uncertainty while consistency
    reflects generation stability.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA (~800 questions)
    model: LLaMA-2-7B
    optimizer: null
    hyperparameters:
      consistency_samples: 5
      entropy_aggregation: mean
