# H-M3 TC-SSM experiment config
model:
  name: "state-spaces/mamba-130m-hf"
  d_model: 768
  n_layer: 24
  d_state: 16
  d_conv: 4
  expand: 2

task_conditioning:
  rank: 32
  n_tasks: 5

baseline_lora:
  r: 16
  alpha: 32
  target_modules: ["out_proj", "in_proj"]

conversion_training:
  source_model: "gpt2"
  kl_weight: 1.0
  mse_weight: 1.0
  adaptation_reg_weight: 0.1
  steps: 500
  lr: 1e-4

few_shot_training:
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 8
  max_steps: 100
  grad_clip: 1.0
  seeds: [42, 123, 2024]

few_shot_eval:
  k_shots: [8, 16]
  tasks: ["boolq", "cb", "copa", "rte", "wic"]

hardware:
  device: "cuda"
  precision: "bf16"
