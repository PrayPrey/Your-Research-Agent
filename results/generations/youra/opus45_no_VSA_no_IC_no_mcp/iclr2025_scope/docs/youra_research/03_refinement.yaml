# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Task embeddings encode functional specialization patterns from conversion data"
      evidence: "Self-supervised clustering discovers latent task structure (analogous to LLM topic discovery)"
      falsifier: "Task embeddings show no clustering structure correlated with downstream task performance"
    - step: 2
      description: "Low-rank projections modulate Mamba's Δ, B, C matrices based on task embeddings"
      evidence: "LoRA demonstrates effective low-rank modulation; Mamba uses input-dependent gating"
      falsifier: "Modulation adds >2x computational overhead"
    - step: 3
      description: "Task-conditioned state dynamics preserve the adaptation manifold enabling rapid specialization"
      evidence: "MAML shows initialization-sensitive manifolds exist; we preserve rather than compress them"
      falsifier: "Adaptation speed is not faster than baseline methods"
  key_tension: "Self-supervised task clustering may not align with meaningful downstream task structure"
  evidence_summary: |
    Mechanism builds on established components: selective state spaces (Mamba), low-rank adaptation (LoRA),
    meta-learning manifolds (MAML). Novel contribution is their integration during conversion.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Task structure is discoverable via self-supervised clustering of hidden states"
    supporting_evidence: "Language models learn latent topics without supervision"
    consequence_if_violated: "Requires task-labeled conversion data, limiting generality"
  - id: "A2"
    assumption: "Adaptation capability is at least partially preserved in SSM's state dynamics"
    supporting_evidence: "SSM achieves competitive performance on many NLP tasks"
    consequence_if_violated: "Some tasks fundamentally incompatible; must scope to SSM-viable tasks"
  - id: "A3"
    assumption: "Low-rank task embeddings (rank 16-64) are sufficient"
    supporting_evidence: "LoRA works with rank 8-64 across diverse tasks"
    consequence_if_violated: "Higher rank increases overhead, approaching O(n²) in worst case"
  - id: "A4"
    assumption: "Joint conversion + adaptation training is stable"
    supporting_evidence: "Multi-task learning and curriculum methods exist"
    consequence_if_violated: "May require curriculum training or staged optimization"

# Section 1.5: Scope
scope:
  applies_to: |
    - Transformer-to-SSM (Mamba-style) conversion
    - Tasks where SSM achieves >80% of transformer baseline performance
    - Few-shot learning scenarios (8/16/32-shot)
    - Standard NLP benchmarks (SuperGLUE, BIG-Bench-Hard subsets)
  does_not_apply_to: |
    - Tasks requiring long-range dependencies where SSM fundamentally underperforms
    - Vision or multimodal models (not tested)
    - Extremely low-resource scenarios (<8 shots)
  known_limitations: |
    - >80% viability threshold needs empirical characterization
    - Self-supervised clustering adds implementation complexity
    - Not all transformer capabilities transfer to SSM architecture

