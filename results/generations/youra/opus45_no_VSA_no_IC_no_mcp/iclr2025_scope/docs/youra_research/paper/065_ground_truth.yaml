# ==============================================================================
# METHODOLOGY PARAMETERS (For reproducibility verification)
# ==============================================================================

methodology_parameters:
  model:
    base: "state-spaces/mamba-130m"
    teacher: "bert-base-uncased"
    d_model: 768
    d_state: 16
    n_layers: 24

  task_discovery:
    method: "K-means"
    k: 8
    samples: 660
    tasks: ["boolq", "cb", "copa", "wic", "wsc"]

  task_embedding:
    method: "InfoNCE contrastive"
    embedding_dim: 32
    temperature: 0.1
    epochs: 10
    lr: 0.0001
    batch_size: 32

  ssm_modulation:
    rank: 32
    targets: ["delta", "B", "C"]

  conversion_training:
    steps: 2000
    lr: 0.00002
    batch_size: 8
    grad_clip: 1.0
    kl_weight: 1.0
    mse_weight: 0.5
    adapt_reg_weight: 0.1

  few_shot_adaptation:
    max_steps: 100
    lr: 0.00002
    batch_size: 8
    k_shots: [8, 16]
    seeds: [1, 2, 3]

