# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Execution feedback (compiler errors, test failures) can improve code generation through iterative refinement"
      status: "BUILD_ON"
      evidence: "Self-Debug (Chen et al., 2023), CodeRL (Le et al., 2022)"
    - claim: "AI feedback (LLM critique) can improve code generation through self-refinement"
      status: "BUILD_ON"
      evidence: "Self-Refine (Madaan et al., 2023), Reflexion (Shinn et al., 2023)"
    - claim: "Execution feedback provides ground-truth error localization"
      status: "BUILD_ON"
      evidence: "Established software engineering practice"
    - claim: "Execution feedback outperforms AI feedback under controlled conditions"
      status: "PROVE_NEW"
      evidence: "No prior controlled comparison exists"
    - claim: "Feedback granularity (binary vs detailed) affects alignment quality"
      status: "PROVE_NEW"
      evidence: "Implied by prior work but never ablated"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    Focus verification on PROVE_NEW claims. BUILD_ON claims can be cited without re-verification.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ExecVsAI-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under iterative code generation refinement on standard benchmarks (HumanEval, MBPP),
    if feedback is provided by execution (compiler + tests) versus AI critique (instruction-tuned LLM),
    then execution feedback will yield higher pass@1 rates,
    because execution provides ground-truth counterfactual error localization that AI critique must approximate.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@1 between execution feedback and AI feedback conditions
    when controlling for base model, dataset, and number of refinement iterations.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Feedback Type"
      type: "categorical"
      operationalization: "Source of refinement signal provided to the model"
      levels:
        - "execution-detailed: Full error trace in natural language"
        - "execution-binary: Pass/fail only"
        - "ai-critic: Off-the-shelf LLM critique"
        - "random: Shuffled feedback from other samples"
  dependent:
    - name: "pass@1"
      type: "continuous"
      operationalization: "Proportion of problems solved correctly on first attempt after k=3 refinement iterations"
      primary: true
    - name: "pass@10"
      type: "continuous"
      operationalization: "Proportion of problems solved correctly within 10 samples"
      primary: false
    - name: "refinement_efficiency"
      type: "continuous"
      operationalization: "Average iterations to first correct solution"
      primary: false
  controlled:
    - name: "Base Model"
      operationalization: "Fixed to CodeLlama-7B and StarCoder-7B (two families)"
    - name: "Refinement Iterations"
      operationalization: "Fixed at k=3 iterations per problem"
    - name: "Temperature"
      operationalization: "Fixed at T=0.2 for generation"
    - name: "Benchmark"
      operationalization: "HumanEval-164, MBPP-500"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Execution feedback provides counterfactual information — 'if X were different, Y would not have failed'"
      evidence: "Error traces contain line numbers, variable values, expected vs actual outputs"
      falsifier: "If AI critique can match this localization accuracy without execution"
    - step: 2
      description: "Counterfactual information enables targeted code edits rather than global rewrites"
      evidence: "Self-Debug shows execution errors guide specific line edits"
      falsifier: "If AI feedback leads to equally targeted edits"
    - step: 3
      description: "Targeted edits have higher probability of fixing bugs than global rewrites"
      evidence: "Smaller diffs are more likely to preserve working code"
      falsifier: "If global rewrites from AI feedback achieve comparable success"
  key_tension: "AI critics may learn implicit execution patterns from training data"
  evidence_summary: |
    The mechanism rests on execution providing ground-truth localization that AI must approximate.
    Prior work shows execution-guided refinement succeeds but hasn't isolated the feedback signal.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Off-the-shelf LLM critics have not been fine-tuned on execution feedback"
    supporting_evidence: "Using GPT-4/Claude which are trained on diverse data without explicit execution labels"
    consequence_if_violated: "AI feedback would contain indirect execution signal, confounding comparison"
  - id: "A2"
    assumption: "Execution sandbox faithfully represents target environment"
    supporting_evidence: "Using standardized sandboxes (E2B, Docker) with documented configurations"
    consequence_if_violated: "Execution feedback may not generalize to real deployment"
  - id: "A3"
    assumption: "Natural language normalization preserves feedback information content"
    supporting_evidence: "Template conversion maintains error type, location, expected/actual values"
    consequence_if_violated: "Format differences would confound feedback type comparison"
  - id: "A4"
    assumption: "Base model can utilize feedback for refinement"
    supporting_evidence: "Both CodeLlama and StarCoder support instruction-following for code editing"
    consequence_if_violated: "Results would reflect model capability, not feedback effectiveness"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Iterative code generation refinement (generate-feedback-refine loop)
    - Standard benchmarks with automated test suites (HumanEval, MBPP)
    - Open-source base models (CodeLlama, StarCoder families)
    - Single-function code generation tasks
  does_not_apply_to: |
    - Training-time alignment (RLHF/RLAIF) — this studies inference-time refinement
    - Repository-level generation (SWE-bench full) — deferred to Phase 5 extension
    - Closed-source models (API cost constraints)
    - Tasks without automated tests (natural language, creative writing)
  known_limitations: |
    - Results may not transfer to larger models (>13B parameters)
    - Benchmark tasks may not represent real-world distribution
    - AI critic quality depends on underlying model capabilities

