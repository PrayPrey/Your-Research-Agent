hypothesis_draft:
  title: "Execution Feedback vs AI Feedback for Code Generation Alignment"
  hypothesis_id: "H-ExecVsAI-v1"
  core_claim: |
    Execution feedback (compiler errors, test failures, runtime exceptions) outperforms AI feedback
    (LLM-generated critique) for post-training alignment of code generation models on standard benchmarks.
    The advantage scales with feedback granularity: detailed error traces > binary pass/fail.
  mechanism: |
    Execution feedback provides counterfactual information — "if X were different, Y would not have failed" —
    with precise error localization (line numbers, variable values, expected vs actual). This enables
    targeted code edits rather than global rewrites. AI feedback provides predictive critique that must
    approximate this localization without ground truth, leading to less precise repair guidance.
  predictions:
    - P1: "Execution-detailed > AI-critic > Execution-binary on pass@1"
    - P2: "Execution advantage larger on complex tasks (MBPP vs HumanEval)"
    - P3: "Self-critique approaches execution-detailed when critic = base model"

variables_summary:
  independent: "Feedback Type (execution-detailed, execution-binary, ai-critic, random)"
  dependent_primary: "pass@1 after k=3 refinement iterations"
  controlled: "Base model (CodeLlama-7B, StarCoder-7B), iterations (k=3), temperature (T=0.2)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in pass@1 between execution feedback and AI feedback conditions
    when controlling for base model, dataset, and number of refinement iterations.
  statistical_test: "Two-way ANOVA with post-hoc pairwise comparisons (Bonferroni)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled comparison isolating feedback signal (not method) with granularity ablation"
  differentiation_summary: |
    Prior work compared methods (CodeRL vs Self-Refine) that confound feedback type with other factors.
    This study isolates the feedback signal itself, enabling principled conclusions about when
    verifiable rewards (execution) are preferable to proxy rewards (AI critique).

