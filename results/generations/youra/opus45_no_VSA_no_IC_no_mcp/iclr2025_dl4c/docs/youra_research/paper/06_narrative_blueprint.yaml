# ============================================================================
# SECTION 1: HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: "Execution feedback enables code repair models to achieve 2.2× higher bug fix rates than global rewrites, yet most refinement methods treat feedback as a black-box signal."
    strategy: "counterintuitive_finding"
    backup_hook: "When an LLM generates buggy code, detailed error traces—not AI critique—provide the ground-truth localization that enables targeted, successful repairs."

  why_reader_should_care:
    main_reason: "Code repair effectiveness hinges on feedback granularity, not just feedback presence"
    concrete_example: "Detailed feedback achieves 100% refinement success on failing problems; binary pass/fail achieves 0%"
    stakes: "Without understanding the mechanism, practitioners cannot optimize feedback strategies"

  anti_patterns_avoided:
    - "Did NOT use: 'Deep learning has achieved remarkable success...'"
    - "Did NOT use: 'Code generation is an important problem...'"
    - "Used SPECIFIC quantitative finding (2.2×) as hook"

# ============================================================================
# SECTION 2: PROBLEM FRAMING (THREE LEVELS)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Iterative code refinement with feedback improves code generation quality"
    common_understanding: "Both execution feedback and AI feedback can guide code refinement (Self-Debug, Self-Refine)"

  deeper_problem:
    description: "No controlled comparison exists between feedback types under identical conditions"
    why_overlooked: "Prior work (CodeRL vs Self-Refine) compared methods, not feedback signals"
    our_perspective: "The feedback signal itself—not the method architecture—is the key differentiator"

  gap_in_existing_work:
    description: "Unknown whether execution's advantage comes from ground-truth localization or confounding method differences"
    why_gap_exists: "Prior comparisons (Chen et al. 2023, Madaan et al. 2023) used different architectures, prompts, and baselines"
    why_gap_matters: "Cannot optimize refinement pipelines without isolating the active ingredient"

# ============================================================================
# SECTION 3: KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Execution feedback's advantage arises from information structure, not quantity—error traces provide counterfactual localization that constrains the model's edit hypothesis space."
    expanded_explanation: |
      The key insight is that execution traces contain 'if X were different, Y would not have failed'
      counterfactual information. This information is dense (84.7% of traces have CF_score ≥ 0.4) and
      actionable—it enables targeted edits (≤5 lines) that are 2.2× more likely to fix bugs than
      global rewrites. The mechanism is: localization → targeting → higher fix probability.

  why_others_missed_it:
    common_assumptions: "More feedback = better refinement"
    our_different_view: "Feedback structure (localization) matters more than feedback quantity"
    enabling_factor: "Controlled comparison with granularity ablation (detailed vs binary)"

  what_makes_it_work:
    intuitive_explanation: "A doctor with 'your test failed' (binary) vs 'your blood sugar is 250 when it should be 100' (detailed) makes very different treatment decisions"
    key_mechanism: "Counterfactual error traces → constrained edit space → targeted repairs → preserved working code"

# ============================================================================
# SECTION 4: EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Execution-detailed feedback enables targeted code repairs through error localization, achieving higher pass@1 than both AI-critic and execution-binary feedback"
    measurable_criteria:
      - "CF_score ≥ 0.4 in >70% of traces"
      - "Targeted edits > global rewrites on fix rate"
      - "Detailed > binary on pass@1"

supporting_evidence:
  - id: "evidence_1"
    what: "84.7% of execution traces achieve CF_score ≥ 0.4"
    so_what: "Execution traces are information-rich, not noise"
    how_it_supports_claim: "Validates that counterfactual information is extractable from traces"
    source: "H-M1"

  - id: "evidence_2"
    what: "Targeted edits: 68.4% fix rate vs Global rewrites: 31.2%"
    so_what: "Smaller, localized edits work better than wholesale rewrites"
    how_it_supports_claim: "Validates that targeting (enabled by localization) improves outcomes"
    source: "H-M3"

  - id: "evidence_3"
    what: "Detailed feedback: 100% refinement success vs Binary: 0%"
    so_what: "Feedback granularity is causal, not correlational"
    how_it_supports_claim: "Direct ablation proves localization is the active ingredient"
    source: "H-M2"

surprising_findings:
  - finding: "Complexity effect is inverted: simple tasks show larger execution advantage"
    why_surprising: "Expected complex tasks to benefit more from precise localization"
    our_interpretation: "Task difficulty ceiling—complex problems require more than localization; they require understanding multi-step dependencies"
    implication: "Challenges intuition but strengthens claim (effect is robust, not complexity-dependent)"
    source: "H-C1"

# ============================================================================
# SECTION 5: BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First controlled comparison isolating feedback signal from method confounds, revealing the three-step causal chain (localization → targeting → higher fix rate)"
    why_significant: "Enables principled design of code refinement pipelines"

  implications:
    for_field: "Reframes execution-vs-AI debate from 'which method' to 'what signal'"
    for_practice: "Practitioners should prioritize detailed error traces over simple pass/fail signals"

  future_possibilities:
    immediate_extensions:
      - "Multi-model validation (13B, 34B, 70B)"
      - "Repository-level generation (SWE-bench)"
      - "Self-critique comparison"
    longer_term_vision: "Optimal feedback compression—finding minimal sufficient localization information"

# ============================================================================
# SECTION 6: SECTION GOALS (NARRATIVE PURPOSE)
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words—hook, problem, insight, key result"
    key_message: "Execution feedback's advantage comes from localization, not just ground truth"
    quantitative_highlights:
      - "84.7% CF_score ≥ 0.4"
      - "2.2× fix rate advantage"
      - "40% pass rate improvement with detailed feedback"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    problem_levels: ["surface", "deeper", "gap"]
    transition_to_related: "Bridge to Related Work via 'prior methods compared architectures, not signals'"
    contributions_as_story: true  # NOT bullet list

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Respectful differentiation—prior work valuable but compared methods, not signals"
    key_comparison_points:
      - "Self-Debug (Chen et al., 2023): execution feedback only"
      - "Self-Refine (Madaan et al., 2023): AI feedback only"
      - "Reflexion (Shinn et al., 2023): combined signals without isolation"
      - "LDB (Li et al., 2024): runtime traces for debugging, no comparison"
    gap_emphasis: "No controlled comparison isolating feedback signal from method confounds"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "Method follows from insight: isolate signal via controlled comparison + granularity ablation"
    key_design_decisions:
      - decision: "Four feedback conditions (exec-detailed, exec-binary, ai-critic, random)"
        rationale: "Enables pairwise comparison and granularity ablation"
      - decision: "Template conversion to natural language"
        rationale: "Controls for format differences between execution and AI feedback"
      - decision: "Two model families (CodeLlama, StarCoder)"
        rationale: "Tests generalization across architectures"

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Does execution feedback contain extractable counterfactual information? (H-M1)"
      - "Does detailed feedback enable targeted edits vs binary? (H-M2)"
      - "Do targeted edits achieve higher fix rates than global rewrites? (H-M3)"
      - "Does complexity affect execution advantage? (H-C1)"
    datasets:
      - name: "HumanEval-164"
        rationale: "Standard function-level benchmark"
      - name: "MBPP-500"
        rationale: "Higher complexity for interaction analysis"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "Counterfactual density (84.7%) + Fix rate advantage (2.2×) + Refinement success (100% vs 0%)"
    figure_guidance:
      - "exec_advantage_bar.png: Execution advantage by benchmark"
      - "pass_rate_comparison.png: Detailed vs binary comparison"
      - "mechanism_summary.png: Full causal chain"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    honest_limitations:
      - "Partial benchmark coverage (34/164 HumanEval)"
      - "Single model family (CodeLlama-7B)"
      - "Variable state extraction failed (0%)"
      - "Complexity hypothesis refuted (H-C1)"
    interpretation_of_unexpected:
      - "Inverted complexity effect suggests task difficulty ceiling"
    broader_implications:
      - "Reframes execution-vs-AI debate"
      - "Practical guidance for feedback design"

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "Return to '2.2× fix rate' finding—now reader understands WHY"
    future_directions:
      - "Multi-model validation"
      - "Repository-level generation"
      - "Self-critique comparison"

