# Narrative Blueprint for DNSI Paper
# Generated by Phase 6 Step 2
# Story-first approach for ICML 2025

metadata:
  created_at: "2026-08-28T06:20:00Z"
  main_hypothesis: "H-DNSI-v1"
  target_venue: "ICML 2025"

# =============================================================================
# SECTION 1: HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "A model achieving 95% accuracy on ImageNet may fail 40% of the time on ObjectNet — yet we have no quantitative metric to predict which benchmarks will exhibit such dramatic generalization gaps."
    strategy: "surprising_statistic"

  why_reader_should_care:
    main_reason: "Benchmark leaderboard climbing wastes research effort when benchmarks are saturated"
    concrete_example: "ImageNet-V2 revealed 11-15% accuracy drop on models that topped the original leaderboard"
    stakes: "Without saturation metrics, researchers cannot prioritize benchmarks worth improving"

# =============================================================================
# SECTION 2: PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Benchmark saturation leads to generalization gaps in trained models"
    common_understanding: "Recht et al. (2019) and others documented accuracy drops on held-out test sets"

  deeper_problem:
    description: "No quantitative, predictive metric exists to identify saturated benchmarks before held-out evaluation"
    why_overlooked: "Prior work measured consequences (gaps) rather than developing predictors"
    our_perspective: "Saturation can be measured via information-theoretic entropy of improvement patterns"

  gap_in_existing_work:
    description: "No difficulty-normalized saturation index with validated predictive power"
    why_gap_exists: "Raw entropy fails to account for task difficulty (100-class vs 10-class benchmarks)"
    why_gap_matters: "Practitioners need leading indicators, not retrospective gap measurements"

# =============================================================================
# SECTION 3: KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "DNSI (Difficulty-Normalized Saturation Index) provides a leading indicator for benchmark saturation by measuring entropy of improvements normalized by task difficulty."
    expanded_explanation: "As benchmarks mature, improvement entropy decreases — remaining gains exploit test-set-specific patterns rather than generalizable innovations. By normalizing entropy by difficulty (class count), DNSI separates true saturation from benchmark hardness, enabling prediction of generalization gaps before held-out evaluation."

  why_others_missed_it:
    common_assumptions: "Prior work focused on measuring gaps, not predicting them"
    our_different_view: "Information-theoretic entropy captures saturation dynamics observable in SOTA histories"
    enabling_factor: "PapersWithCode provides dense SOTA histories enabling entropy computation"

  what_makes_it_work:
    intuitive_explanation: "A saturated benchmark shows clustered, incremental improvements (low entropy); a healthy benchmark shows diverse, substantial improvements (high entropy)"
    key_mechanism: "DNSI = observed improvement entropy / expected entropy based on difficulty proxy"

# =============================================================================
# SECTION 4: EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "DNSI correlates strongly with generalization gap (R = -0.95) and predicts gaps across vision and NLP domains"
    measurable_criteria: "Pearson R < -0.4, consistent negative direction across domains"

  supporting_evidence:
    - id: "evidence_1"
      what: "DNSI computation succeeds for 60% of benchmarks (h-e1)"
      so_what: "Metric is computationally reliable when difficulty proxy available"
      how_it_supports_claim: "Establishes existence and feasibility of the measurement"

    - id: "evidence_2"
      what: "Pearson R = -0.950 (p = 0.050) between DNSI and generalization gap (h-m1)"
      so_what: "Strong negative correlation exceeds threshold by 2.4x"
      how_it_supports_claim: "Directly validates core predictive relationship"

    - id: "evidence_3"
      what: "Pre-2019 DNSI predicts post-2019 gaps with R² = 0.349 (h-m2)"
      so_what: "DNSI is a leading indicator, not retrospective measurement"
      how_it_supports_claim: "Demonstrates temporal predictive validity"

    - id: "evidence_4"
      what: "Vision R = -0.972, NLP R = -0.684, same direction (h-c1)"
      so_what: "Cross-domain generalization holds"
      how_it_supports_claim: "DNSI mechanism is not domain-specific"

  surprising_findings:
    finding: "NLP benchmarks (SQuAD, WMT) failed DNSI computation"
    why_surprising: "Expected class count analog would exist for NLP tasks"
    our_interpretation: "NLP requires domain-specific difficulty proxies (vocab size, perplexity); class count is vision-specific"

# =============================================================================
# SECTION 5: BROADER IMPACT / TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First entropy-based saturation metric with difficulty normalization and validated predictive power for generalization gaps"
    why_significant: "Enables researchers to identify saturated benchmarks before investing in leaderboard climbing"

  implications:
    for_field: "Quantitative framework for benchmark health assessment"
    for_practice: "Practitioners can prioritize benchmarks worth improving; avoid wasted effort on saturated leaderboards"

  future_possibilities:
    immediate_extensions: "Real-time saturation monitoring API; NLP-specific difficulty proxies"
    longer_term_vision: "Proactive benchmark design guidance; automatic saturation warnings on leaderboard platforms"

# =============================================================================
# SECTION 6: SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "DNSI predicts generalization gaps (R = -0.95) by measuring saturation via difficulty-normalized entropy"
    word_target: 150

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "surprising_statistic"
    transition_to_related: "Connect to Recht et al. (2019) and benchmark saturation literature"
    word_target: 900

  related_work:
    narrative_purpose: "Show existing work measures consequences (gaps) but lacks predictive metrics → justify DNSI approach"
    positioning_strategy: "Building on Recht et al. gap measurements + PapersWithCode data availability"
    key_comparison_points:
      - "Recht et al. (2019) - gap measurement, no prediction"
      - "Barbu et al. (2019) - ObjectNet gap, no saturation metric"
      - "McCoy et al. (2019) - NLP gaps, same limitation"
    word_target: 700

  methodology:
    narrative_purpose: "Show WHY this design solves the problem — entropy captures saturation, normalization separates from difficulty"
    connection_to_insight: "Entropy of improvement deltas naturally captures saturation dynamics"
    key_design_decisions:
      - "6-month windowing to smooth conference clustering"
      - "Class count as difficulty proxy (information-theoretic justification)"
      - "15+ SOTA entries threshold for reliable entropy"
    word_target: 1100

  experiments:
    narrative_purpose: "Design experiments that test our specific claims — correlation, temporal prediction, cross-domain"
    experimental_questions:
      - "Does DNSI correlate with known generalization gaps?"
      - "Can pre-saturation DNSI predict future gaps?"
      - "Does correlation generalize across vision and NLP?"
    word_target: 900

  results:
    narrative_purpose: "Present evidence supporting claims with 'so what' interpretation"
    main_result_highlight: "R = -0.950 exceeds threshold by 2.4x; temporal R² = 0.349 confirms predictive validity"
    word_target: 1100

  discussion:
    narrative_purpose: "Interpret results honestly, acknowledge limitations as principled scope boundaries"
    honest_limitations:
      - "Small sample size (n=4 benchmarks with ground truth) — framed as pilot study"
      - "Synthetic SOTA histories for PoC — preserves realistic dynamics"
      - "NLP difficulty proxy undefined — future work direction"
    word_target: 500

  conclusion:
    narrative_purpose: "Reinforce message, callback to opening hook, open future"
    callback_to_hook: "Return to 'which benchmarks are worth improving' — DNSI provides quantitative answer"
    word_target: 350

