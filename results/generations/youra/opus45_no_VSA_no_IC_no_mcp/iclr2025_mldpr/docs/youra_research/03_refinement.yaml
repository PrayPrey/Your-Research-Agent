established_facts:
  claims:
    - claim: "Benchmark saturation leads to generalization gaps in trained models"
      status: "BUILD_ON"
      evidence: "Recht et al. (2019) demonstrated 11-15% accuracy drop on ImageNet-V2"
    - claim: "PapersWithCode provides SOTA progression histories for 100+ benchmarks"
      status: "BUILD_ON"
      evidence: "Public API available, verified data existence"
    - claim: "Held-out test sets exist for validation: ImageNet-V2, CIFAR-10.2, ObjectNet, HANS"
      status: "BUILD_ON"
      evidence: "Published in Recht et al. (2019), Barbu et al. (2019), McCoy et al. (2019)"
    - claim: "Difficulty-normalized saturation index predicts generalization gap"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis - requires empirical validation"
  scope_reduction_percentage: 75
  phase2b_4_instructions: |
    BUILD_ON claims are established by prior literature - cite and use directly.
    PROVE_NEW claims require experimental validation in Phase 4.
    The core novel contribution is the DNSI metric and its predictive validity.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DNSI-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard ML benchmarks with dense SOTA histories (>50 entries over >3 years),
    if we compute a Difficulty-Normalized Saturation Index (DNSI) = observed improvement entropy / expected entropy based on difficulty proxy,
    then DNSI will correlate negatively with generalization gap (R > 0.4),
    because saturated benchmarks exhibit systematic overfitting to test set characteristics.
  alternative_hypothesis_h0: |
    There is no significant correlation (R < 0.2) between DNSI and generalization gap
    across benchmarks with ground truth held-out test set measurements.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Difficulty-Normalized Saturation Index (DNSI)"
      type: "continuous"
      operationalization: "DNSI = entropy(improvement deltas) / expected_entropy(difficulty_proxy), computed from PapersWithCode SOTA histories using 6-month windowing"
      range: "[0, inf), lower = more saturated"
  dependent:
    - name: "Generalization Gap"
      type: "continuous"
      operationalization: "Accuracy drop (%) between original test set and held-out test set (ImageNet-V2, CIFAR-10.2, ObjectNet, HANS)"
      primary: true
      unit: "percentage points"
    - name: "Method Family Concentration"
      type: "continuous"
      operationalization: "Herfindahl-Hirschman Index of architecture families in top-10 SOTA entries"
      primary: false
  controlled:
    - name: "Benchmark Age"
      operationalization: "Years since benchmark creation"
    - name: "Submission Count"
      operationalization: "Total SOTA entries in PapersWithCode"
    - name: "Dataset Size"
      operationalization: "Number of training samples"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "As benchmark matures, generalizable improvements exhaust"
      evidence: "PapersWithCode shows diminishing accuracy gains over time for mature benchmarks"
      falsifier: "Mature benchmarks show same improvement rate as new benchmarks"
    - step: 2
      description: "Remaining improvements exploit test-set-specific patterns"
      evidence: "Recht et al. (2019) show accuracy gains don't transfer to ImageNet-V2"
      falsifier: "ImageNet improvements transfer fully to ImageNet-V2"
    - step: 3
      description: "Test-set overfitting manifests as generalization gap on held-out distribution"
      evidence: "11-15% accuracy drop measured on ImageNet-V2, ObjectNet"
      falsifier: "No accuracy drop on held-out distributions"
  key_tension: "Correlation does not prove causation - saturation and overfitting may be confounded by third factor (benchmark design quality)"
  evidence_summary: |
    The causal chain is supported by converging evidence: Recht et al. (2019) documents the generalization gap,
    PapersWithCode documents the saturation pattern. The hypothesis connects these previously separate observations
    through the DNSI metric which serves as a leading indicator for generalization gaps.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "PapersWithCode SOTA histories are representative of actual research progress"
    supporting_evidence: "PWC is the de facto standard for tracking ML benchmarks, used in major surveys"
    consequence_if_violated: "DNSI would measure publication patterns, not research progress"
  - id: "A2"
    assumption: "Held-out test sets (ImageNet-V2, CIFAR-10.2, etc.) measure true generalization"
    supporting_evidence: "Created by independent teams following original dataset protocols"
    consequence_if_violated: "Generalization gap would reflect distribution shift, not overfitting"
  - id: "A3"
    assumption: "Difficulty can be proxied by benchmark characteristics (classes, dimensionality)"
    supporting_evidence: "Information-theoretic bounds relate these quantities to task complexity"
    consequence_if_violated: "DNSI normalization would be invalid"
  - id: "A4"
    assumption: "Four benchmarks with ground truth provide sufficient statistical power"
    supporting_evidence: "Effect sizes in Recht et al. are large (>10% gap), reducing required N"
    consequence_if_violated: "Results may not generalize to other benchmarks"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ML benchmarks with dense SOTA histories (>50 submissions over >3 years)
    - Benchmarks with published held-out test set studies
    - Image classification and NLU tasks (validated domains)
  does_not_apply_to: |
    - Benchmarks without SOTA tracking (proprietary, niche)
    - Generative tasks (no clear accuracy metric)
    - Benchmarks < 3 years old (insufficient saturation time)
  known_limitations: |
    - Sample size is small (n=4 benchmarks with ground truth)
    - Correlation does not prove causation
    - Difficulty proxy operationalization requires sensitivity analysis
    - Publication bias in PapersWithCode may inflate early-stage entropy

