hypothesis_draft:
  title: "Difficulty-Normalized Saturation Index (DNSI) for Predicting Benchmark Generalization Gaps"
  hypothesis_id: "H-DNSI-v1"
  core_claim: |
    The Difficulty-Normalized Saturation Index (DNSI), computed as the ratio of observed
    improvement entropy to expected entropy based on benchmark difficulty, predicts
    generalization gaps on held-out test sets. Saturated benchmarks (low DNSI) exhibit
    systematic overfitting that fails to transfer to new test distributions.
  mechanism: |
    As benchmarks mature, generalizable improvements exhaust first (easy wins).
    Remaining improvements increasingly exploit test-set-specific patterns (harder optimizations).
    This manifests as high leaderboard accuracy with poor transfer to held-out distributions.
    DNSI captures this by measuring whether improvement rate is slower than expected given difficulty.
  predictions:
    - P1: "Lowest DNSI quartile benchmarks show >10% generalization gap"
    - P2: "Pre-2019 DNSI predicts post-2019 generalization measurements (R² > 0.3)"
    - P3: "DNSI-gap correlation holds across vision and NLP domains (R > 0.3 each)"

variables_summary:
  independent: "DNSI = entropy(improvement deltas) / expected_entropy(difficulty_proxy)"
  dependent_primary: "Generalization gap (%) on held-out test sets"
  controlled: "Benchmark age, submission count, dataset size"

null_hypothesis:
  h0_statement: |
    There is no significant correlation between DNSI and generalization gap.
    Saturation patterns are uncorrelated with model transfer performance.
  statistical_test: "Pearson correlation with bootstrap confidence intervals"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First difficulty-normalized saturation metric with predictive validity"
  differentiation_summary: |
    Prior work measured consequences (Recht et al.'s generalization gap) or tracked progress
    descriptively (PapersWithCode). DNSI provides a predictive framework that:
    (1) normalizes for benchmark difficulty (distinguishing saturation from hardness)
    (2) enables temporal prediction (pre-compute index, validate against future gaps)
    (3) generalizes across domains (vision, NLP)

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "No ML models required - statistical analysis only"
  datasets:
    - "PapersWithCode SOTA histories (ImageNet, CIFAR-10, GLUE)"
    - "ImageNet-V2 (Recht et al. 2019)"
    - "CIFAR-10.2 (Recht et al. 2019)"
    - "ObjectNet (Barbu et al. 2019)"
    - "HANS challenge set (McCoy et al. 2019)"
  baselines:
    - "Raw entropy (no normalization)"
    - "Improvement rate (mean accuracy gain/year)"
    - "Time since last improvement"

measurement_plan:
  data_collection:
    - source: "PapersWithCode API"
      fields: "benchmark_id, timestamp, accuracy, method_name, paper_url"
      filter: ">50 SOTA entries, >3 years history"
    - source: "Published papers"
      fields: "Generalization gap measurements (ImageNet-V2, CIFAR-10.2, ObjectNet, HANS)"
  procedure:
    - step: "1. Download SOTA histories for target benchmarks via PapersWithCode API"
    - step: "2. Compute improvement deltas between consecutive SOTA entries"
    - step: "3. Apply 6-month windowing to smooth conference clustering effects"
    - step: "4. Compute entropy of improvement distribution per benchmark"
    - step: "5. Estimate expected entropy from difficulty proxy (class count, human baseline)"
    - step: "6. Calculate DNSI = observed_entropy / expected_entropy"
    - step: "7. Extract generalization gap data from published papers"
    - step: "8. Run correlation analysis with controls"
  success_criteria:
    - "DNSI-gap correlation R > 0.4 across all 4 benchmarks"
    - "Temporal prediction R² > 0.3 for ImageNet"
    - "Cross-domain consistency (R > 0.3 in both vision and NLP)"

validation:
