main_hypothesis:
  id: H-DNSI-v1
  title: Difficulty-Normalized Saturation Index for Predicting Benchmark Generalization Gaps
  statement: Under standard ML benchmarks with dense SOTA histories (>50 entries over >3 years), DNSI = observed improvement
    entropy / expected entropy based on difficulty proxy correlates negatively with generalization gap (R > 0.4), because
    saturated benchmarks exhibit systematic overfitting to test set characteristics.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: PapersWithCode SOTA histories + held-out test sets (ImageNet-V2, CIFAR-10.2, ObjectNet, HANS)
    model: Statistical analysis (scipy, statsmodels)
    optimizer: null
    hyperparameters:
      windowing: 6-month
      significance_level: 0.05
      bootstrap_samples: 1000
  baseline_comparison:
