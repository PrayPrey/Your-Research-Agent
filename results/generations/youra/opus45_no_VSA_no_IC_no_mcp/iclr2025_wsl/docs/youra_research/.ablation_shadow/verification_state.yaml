  id: H-LocalityBias-v1
  title: Locality Inductive Bias in Permutation-Equivariant Weight Processing
  statement: Under model property prediction tasks on standard benchmarks (TrojAI, ModelZoo), if different permutation-equivariant
    architectures (DWS, NFT) are applied, then property-type-dependent performance differences emerge, because explicit locality
    inductive bias (DWS) improves fine-grained pattern detection while global attention (NFT) improves holistic property aggregation.
