hypothesis_draft:
  title: "Locality Inductive Bias in Permutation-Equivariant Weight Processing"
  hypothesis_id: "H-LocalityBias-v1"
  core_claim: |
    Permutation-equivariant architectures show property-type-dependent performance
    profiles on model zoo benchmarks. DWS-style explicit locality improves fine-grained
    pattern detection (backdoor), while NFT-style global attention improves holistic
    property aggregation (accuracy prediction).
  mechanism: |
    DWS encodes spatial weight structure directly in equivariant layer operations,
    reducing sample complexity for local pattern detection. NFT's full attention
    must learn locality from data, advantaging global property aggregation but
    requiring more data for local patterns.
  predictions:
    - P1: "DWS > NFT > baseline on TrojAI backdoor detection AUC by >1.5σ"
    - P2: "NFT > DWS > baseline on ModelZoo accuracy prediction RMSE by >1.5σ"
    - P3: "Both equivariant methods outperform baseline on at least one task"

