  independent: "Architecture type (MLP-Baseline, NFT, DWS) × Property type (Backdoor, Accuracy)"
  dependent_primary: "Backdoor AUC, Accuracy RMSE"
  controlled: "Parameter count, training procedure, dataset splits"

