# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LocalityBias-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under model property prediction tasks on standard benchmarks (TrojAI, ModelZoo),
    if different permutation-equivariant architectures (DWS, NFT) are applied,
    then property-type-dependent performance differences emerge,
    because explicit locality inductive bias (DWS) improves fine-grained pattern detection
    while global attention (NFT) improves holistic property aggregation.
  alternative_hypothesis_h0: |
    There is no significant difference in model property prediction performance
    between DWS and NFT architectures across property types (backdoor, accuracy).

