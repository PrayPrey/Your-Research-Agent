      description: "Architecture encodes different inductive biases"
      evidence: "DWS uses equivariant layers preserving weight locality (Navon 2023); NFT flattens to tokens with full attention (Zhou 2024)"
      falsifier: "Showing NFT attention is equally local as DWS operations"
    - step: 2
      description: "Locality bias reduces sample complexity for local patterns"
      evidence: "Analogous to CNN vs ViT literature showing locality helps with limited data"
      falsifier: "NFT matching DWS on backdoor detection with same training data"
    - step: 3
      description: "Task-dependent optimal bias manifests as performance difference"
      evidence: "Backdoor triggers are local weight anomalies; accuracy depends on global weight statistics"
      falsifier: "No interaction effect between architecture and property type"
  key_tension: "Whether NFT's attention can learn locality from data given sufficient training"
  evidence_summary: |
    The mechanism is grounded in architectural facts from published papers and
    analogous findings in vision (CNN vs ViT on small datasets). Direct evidence
    for the sample complexity claim is extrapolated from related domains.

