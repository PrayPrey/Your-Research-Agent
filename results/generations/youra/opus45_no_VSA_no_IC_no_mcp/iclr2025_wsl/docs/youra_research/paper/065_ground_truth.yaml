# ═══════════════════════════════════════════════════════════════
# QUALITATIVE CLAIMS (Reviewers may challenge)
# ═══════════════════════════════════════════════════════════════

qualitative_claims:
  - id: "C1"
    claim: "First quantitative measurement of inductive bias differences in weight-space architectures"
    type: "novelty"
    verification: "Literature search required"
    challenge_likelihood: "MEDIUM"
    defense: "No prior work operationalizes locality vs attention via training dynamics in weight-space"

  - id: "C2"
    claim: "NFT's global attention directly benefits holistic property aggregation"
    type: "causal"
    verification: "Ablation or mechanism analysis"
    challenge_likelihood: "LOW"
    defense: "RMSE advantage (12.3%) is substantial and consistent across seeds"

  - id: "C3"
    claim: "DWS locality advantage on backdoor remains plausible but unconfirmed"
    type: "hedged"
    verification: "Acknowledged limitation"
    challenge_likelihood: "LOW"
    defense: "Explicitly stated as experimental design limitation, not falsification"

  - id: "C4"
    claim: "Results reflect inductive bias, not capacity"
    type: "interpretation"
    verification: "Parameter matching analysis"
    challenge_likelihood: "MEDIUM"
    defense: "MLP has 2× parameters but underperforms NFT; direction argues against capacity explanation"

