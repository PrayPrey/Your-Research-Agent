  - id: "L2"
    limitation: "Dataset ceiling effects"
    section: "Discussion 6.2"
    impact: "Cannot differentiate sample efficiency"
    mitigation: "Future work: harder benchmarks"

  - id: "L3"
    limitation: "Parameter count mismatch (4.9M-9.8M)"
    section: "Discussion 6.2"
    impact: "Potential capacity confound"
    mitigation: "MLP has MORE parameters but worse accuracy prediction"

  - id: "L4"
    limitation: "Synthetic vs real data"
    section: "Discussion 6.2"
    impact: "Generalization to real model zoos unknown"
    mitigation: "Future work: TrojAI/CNN-Zoo evaluation"

