# =============================================================================
# METHODOLOGY GROUND TRUTH
# =============================================================================

methodology:
  dataset:
    name: "Waterbirds v1.0"
    total_images: 11788
    training: 4795
    validation: 1199
    test: 5794
    classes: 2
    spurious_attribute: "background (water/land)"

  model:
    architecture: "ResNet-50"
    pretrained: "ImageNet"
    framework: "PyTorch 2.0"

  training:
    optimizer: "SGD"
    momentum: 0.9
    weight_decay: 0.0001
    batch_size: 128
    epochs: 50
    lr_h_e1: 0.01
    lr_h_m1: 0.001
    lr_schedule: "StepLR (step=20, gamma=0.1)"
    seeds_h_e1: 1
    seeds_h_m1: 3

  attribution:
    method: "GradCAM"
    layer: "layer4 (final conv block)"
    samples_per_epoch: 500
    region_definition: "spatial heuristic (upper 60% spurious, lower 40% core)"

  gradient_measurement:
    layer: "layer4"
    grouping: "spurious-aligned vs minority"
    norm_type: "L2"

