  introduction_to_conclusion_loop: true
  loop_description: "Opens with falsification claim, closes with implications of falsification"

  key_insight_thread:
    - introduction: "Preview: gradient competition may be wrong"
    - methodology: "Design to test gradient competition directly"
    - results: "Evidence: gradient ratio inverted"
    - discussion: "Interpretation: convergence speed, not gradient magnitude"
    - conclusion: "Implications: rethink robustness interventions"

  checklist:
    - check: "Does Introduction hook connect to Conclusion ending?"
      status: "YES - falsification frames both"
    - check: "Does each section naturally flow to the next?"
      status: "YES - existence → mechanism → results → interpretation"
    - check: "Is key insight consistently emphasized throughout?"
      status: "YES - gradient inversion appears in all sections"
    - check: "Are all major claims supported by evidence?"
      status: "YES - H-E1 and H-M1 results mapped to claims"
    - check: "Would a busy reviewer find Abstract compelling?"
      status: "YES - counterintuitive finding with clear numbers"

