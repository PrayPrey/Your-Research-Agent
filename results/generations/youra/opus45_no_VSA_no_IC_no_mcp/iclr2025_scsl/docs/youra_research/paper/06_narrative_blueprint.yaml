# Narrative Blueprint for Paper
# Phase 6 Step 02 Output
# Generated: 2026-08-28

metadata:
  hypothesis_id: "H-TemporalSGD-v1"
  hypothesis_status: "PARTIALLY_SUPPORTED"
  gate_results:
    h_e1: "PASS"
    h_m1: "FAIL"
  paper_type: "negative_result_with_discovery"

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  strategy: "counterintuitive_finding"

  opening_statement:
    content: "The dominant explanation for why neural networks rely on spurious features—that such features produce stronger gradient signals—is wrong."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "If the mechanism is misunderstood, interventions targeting gradient competition will fail"
    concrete_example: "Gradient rebalancing methods assume spurious features receive stronger updates—our measurements show the opposite"
    stakes: "Robustness interventions built on incorrect mechanistic assumptions waste research effort"

  hook_sentence: "We set out to control when neural networks learn spurious features—and discovered that the prevailing explanation for why they learn them is inverted."

# =============================================================================
# PROBLEM FRAMING (3 Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Deep neural networks trained with ERM learn spurious correlations that harm minority group performance"
    common_understanding: "Models exploit statistical shortcuts (background, texture) instead of invariant features"
    citations: ["Shah et al. 2020", "Sagawa et al. 2020"]

  deeper_problem:
    description: "The temporal dynamics of spurious feature emergence are poorly characterized"
    why_overlooked: "Most work focuses on post-hoc mitigation (reweighting, two-stage) rather than understanding learning dynamics"
    our_perspective: "Spurious reliance is established in early training—understanding timing could enable single-stage interventions"

  gap:
    description: "No mechanistic understanding of WHY spurious features are learned preferentially"
    why_gap_exists: "Prior work establishes existence (simplicity bias) but assumes gradient competition without testing"
    why_gap_matters: "Interventions targeting gradients may be fundamentally misguided"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Spurious features dominate not because they receive stronger gradients, but because they occupy simpler loss landscape regions that converge faster."
    expanded_explanation: |
      We measured gradient norms for spurious-aligned vs. minority samples and found the relationship is inverted from expectation: minority samples produce 5.7x higher gradient norms. This reveals that "gradient competition" is the wrong frame—spurious dominance is a convergence speed phenomenon, not a gradient magnitude phenomenon.

  why_others_missed_it:
    common_assumptions: "Simplicity bias implies simple features receive stronger gradient signal"
    our_different_view: "Simplicity means faster convergence (lower loss quickly), which produces LOWER gradients (already solved)"
    enabling_factor: "Direct measurement of per-group gradient norms across training"

  what_makes_it_work:
    intuitive_explanation: "Easy problems get solved first and stop sending learning signals; hard problems keep trying"
    key_mechanism: "Spurious-aligned samples reach low loss early → low gradients. Minority samples remain high-loss → high gradients."

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "The gradient competition hypothesis for spurious feature learning is empirically falsified"
    measurable_criteria: "Expected gradient ratio >1.5 for spurious features; observed ratio 0.18 (5.7x inverted)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Spurious attribution dominates from epoch 0 (ratio=1.348)"
      so_what: "Confirms simplicity bias exists—spurious features ARE learned preferentially"
      how_it_supports_claim: "Establishes that spurious dominance is real before testing mechanism"
      source: "H-E1"
      figure: "fig_1"

    - id: "evidence_2"
      what: "Spurious/minority gradient norm ratio = 0.18 (inverted from >1.5 expectation)"
      so_what: "Falsifies gradient competition hypothesis"
      how_it_supports_claim: "Direct evidence that mechanism explanation is wrong"
      source: "H-M1"
      figure: "fig_4"

    - id: "evidence_3"
      what: "Ratio consistent across 3 seeds (0.173-0.181)"
      so_what: "Result is robust, not noise"
      how_it_supports_claim: "Strengthens falsification"
      source: "H-M1"
      figure: "fig_5"

    - id: "evidence_4"
      what: "Decreasing gradient ratio over training (0.45→0.15)"
      so_what: "Effect intensifies as spurious samples become even 'more solved'"
      how_it_supports_claim: "Supports convergence speed interpretation"
      source: "H-M1"
      figure: "fig_3"

  surprising_findings:
    finding: "Minority samples produce 5.7x higher gradient norms than spurious-aligned samples"
    why_surprising: "Intuition suggests dominant features receive stronger learning signal"
    our_interpretation: "High gradients indicate ongoing learning (unsolved), not preferential learning"

# =============================================================================
# CONTRIBUTIONS
# =============================================================================

contributions:
  primary:
    statement: "Empirical falsification of the gradient competition hypothesis for spurious feature learning"
    evidence: "Gradient norm ratio 0.18 vs. expected >1.5"

  secondary:
    - "Confirmation of simplicity bias: spurious dominance from epoch 0 with ratio 1.35"
    - "Novel mechanistic reframing: convergence speed, not gradient magnitude"
    - "Implications for robustness intervention design"

# =============================================================================
# HONEST LIMITATIONS
# =============================================================================

limitations:
  critical:
    - limitation: "Mechanism hypothesis falsified, so LR/batch interventions not tested"
      impact: "Cannot claim hyperparameter control of spurious timing"
      mitigation: "Paper reframes as mechanistic investigation"

    - limitation: "Single dataset (Waterbirds)"
      impact: "Results may not generalize"
      mitigation: "Waterbirds is standard benchmark; CelebA replication recommended"

  methodological:
    - "GradCAM attribution uses synthetic masks (upper/lower half), not segmentation"
    - "Layer4 gradients only—earlier layers may differ"
    - "ResNet-50 architecture—ViT may have different dynamics"

# =============================================================================
# SECTION GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress discovery story: we tested a mechanism, falsified it, and offer new interpretation"
    key_message: "Gradient competition is wrong; spurious dominance is convergence speed"
    word_target: 150

  introduction:
    narrative_purpose: "Hook with counterintuitive finding → establish spurious correlation problem → preview falsification"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Prior work assumes gradient-based explanations; we test this directly"
    subsections:
      - "Opening hook (falsification of common belief)"
      - "Spurious correlation background (surface problem)"
      - "Timing and mechanism gap (deeper problem)"
      - "Our investigation and findings (preview)"
    word_target: 900

  related_work:
    narrative_purpose: "Position against gradient-based assumptions in prior work"
    positioning_strategy: "Show how existing methods implicitly assume gradient competition"
    key_comparison_points:
      - "Simplicity bias (Shah et al. 2020) - establishes phenomenon, doesn't test mechanism"
      - "JTT (Liu et al. 2021) - two-stage, assumes early errors signal spurious reliance"
      - "Group DRO (Sagawa et al. 2020) - requires labels, reweights based on group loss"
      - "SAM (Foret et al. 2021) - targets sharpness, may connect to our convergence view"
    word_target: 700

  methodology:
    narrative_purpose: "WHY we designed experiments to test gradient competition directly"
    connection_to_insight: "Testing the mechanism requires measuring per-group gradient norms"
    key_design_decisions:
      - "Two-stage verification: existence (H-E1) then mechanism (H-M1)"
      - "GradCAM for attribution ratio measurement"
      - "Layer4 gradient norms for mechanism test"
      - "Spurious-aligned vs. minority sample grouping"
    word_target: 1000

  experiments:
    narrative_purpose: "Precise experimental setup for reproducibility"
    experimental_questions:
      - "Q1: Do spurious features dominate early in training? (H-E1)"
      - "Q2: Do spurious features receive stronger gradient signal? (H-M1)"
    setup_details:
      - "Dataset: Waterbirds v1.0"
      - "Model: ResNet-50 (ImageNet pretrained)"
      - "Training: SGD, 50 epochs, 3 seeds"
    word_target: 800

  results:
    narrative_purpose: "Present evidence: existence confirmed, mechanism falsified"
    main_result_highlight: "Gradient ratio 0.18 (inverted from >1.5 expectation)"
    figure_integration:
      - "fig_1: Attribution ratio trajectory (H-E1)"
      - "fig_3: Gradient ratio trajectory (H-M1)"
      - "fig_4: Norm comparison bar chart"
    word_target: 1000

  discussion:
    narrative_purpose: "Interpret falsification, propose alternative mechanism, acknowledge limits"
    key_points:
      - "Why gradient competition intuition is wrong"
      - "Convergence speed as alternative explanation"
      - "Implications for robustness methods"
    honest_limitations:
      - "Single dataset"
      - "Synthetic masks"
      - "Layer4 only"
    word_target: 500

  conclusion:
    narrative_purpose: "Close narrative loop with callback to hook"
    callback_to_hook: "Return to falsification: what this changes for robustness research"
    future_work:
      - "Test convergence speed hypothesis directly"
      - "Multi-dataset replication"
      - "Connect to SAM and loss landscape geometry"
    word_target: 350

# =============================================================================
# NARRATIVE COHERENCE
# =============================================================================

