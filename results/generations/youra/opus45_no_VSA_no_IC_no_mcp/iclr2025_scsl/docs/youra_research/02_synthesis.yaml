hypothesis_draft:
  title: "Temporal SGD Control of Spurious Feature Emergence"
  hypothesis_id: "H-TemporalSGD-v1"
  core_claim: |
    Under standard supervised learning on datasets with spurious correlations,
    if we increase the learning rate or decrease the batch size,
    then peak spurious feature dominance will occur at later training epochs,
    because higher learning rates and smaller batches introduce optimization noise
    that disrupts the fast convergence to spurious feature reliance.
  mechanism: |
    1. Spurious features produce stronger gradient signal early (simplicity bias)
    2. Higher LR / smaller batch introduces optimization noise
    3. Noise disrupts spurious gradient advantage, delaying dominance
    4. Delayed dominance allows more core feature learning
    5. Result: improved worst-group accuracy
  predictions:
    - P1: "10x LR increase shifts peak spurious dominance by >=10% of training epochs"
    - P2: "Peak dominance epoch negatively correlates with worst-group accuracy (r < -0.5)"
    - P3: "Sharpness at peak dominance is >=2x higher than at convergence"

variables_summary:
  independent: "Learning rate (0.001, 0.01, 0.1), Batch size (32, 128, 512)"
  dependent_primary: "Peak spurious dominance epoch, Worst-group accuracy"
  controlled: "Architecture (ResNet-50), Dataset, Random seed (5 per config)"

null_hypothesis:
  h0_statement: |
    There is no significant relationship between SGD hyperparameters (LR, batch size)
    and the epoch at which spurious feature reliance peaks. Variations in LR and batch size
    do not systematically affect worst-group accuracy beyond their general effects on
    training dynamics.
  statistical_test: "Paired t-test for P1, Spearman correlation for P2"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First temporal characterization + single-stage optimization-only robustification"
  differentiation_summary: |
    Unlike Shah et al. (simplicity bias existence), we measure temporal dynamics across hyperparameters.
    Unlike JTT (two-stage), we propose single-stage hyperparameter control.
    Unlike SAM (general generalization), we focus specifically on spurious feature dynamics.

