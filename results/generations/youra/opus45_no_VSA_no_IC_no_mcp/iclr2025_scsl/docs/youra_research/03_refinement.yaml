# Section 0: Established Facts
established_facts:
  claims:
    - claim: "Simplicity bias exists - DNNs learn simple features first"
      status: "BUILD_ON"
      evidence: "Shah et al., 2020 (arXiv:2006.07710)"
    - claim: "SAM finds flat minima with better generalization"
      status: "BUILD_ON"
      evidence: "Foret et al., 2021 (arXiv:2010.01412)"
    - claim: "JTT achieves annotation-free robustness via two-stage training"
      status: "PROVE_NEW"
      evidence: "We claim single-stage optimization suffices"
    - claim: "Spurious features dominate due to faster gradient signal"
      status: "PROVE_NEW"
      evidence: "Proposed mechanism - gradient competition hypothesis"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims (simplicity bias, SAM) are established - cite but don't re-verify.
    PROVE_NEW claims require experimental verification in this study.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-TemporalSGD-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under standard supervised learning on datasets with spurious correlations (Waterbirds, CelebA),
    if we increase the learning rate or decrease the batch size,
    then peak spurious feature dominance will occur at later training epochs,
    because higher learning rates and smaller batches introduce optimization noise
    that disrupts the fast convergence to spurious feature reliance.
  alternative_hypothesis_h0: |
    There is no significant relationship between SGD hyperparameters (LR, batch size)
    and the epoch at which spurious feature reliance peaks. Variations in LR and batch size
    do not systematically affect worst-group accuracy beyond their general effects on training dynamics.

# Section 1.2: Variables
variables:
  independent:
    - name: "Learning Rate"
      type: "categorical"
      operationalization: "SGD learning rate parameter"
      levels: [0.001, 0.01, 0.1]
    - name: "Batch Size"
      type: "categorical"
      operationalization: "Training batch size"
      levels: [32, 128, 512]
  dependent:
    - name: "Peak Spurious Dominance Epoch"
      type: "continuous"
      operationalization: "First epoch where spurious attribution > core attribution (via GradCAM)"
      primary: true
    - name: "Worst-Group Accuracy"
      type: "continuous"
      operationalization: "Accuracy on minority group (e.g., landbirds on water background)"
      primary: true
    - name: "Loss Landscape Sharpness"
      type: "continuous"
      operationalization: "Top Hessian eigenvalue at peak dominance epoch"
      primary: false
    - name: "Spurious/Core Attribution Ratio"
      type: "continuous"
      operationalization: "GradCAM activation ratio on spurious vs. core regions"
      primary: false
  controlled:
    - name: "Model Architecture"
      operationalization: "Fixed to ResNet-50"
    - name: "Dataset"
      operationalization: "Waterbirds (primary), CelebA (replication)"
    - name: "Random Seed"
      operationalization: "5 seeds per configuration"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Spurious features produce stronger gradient signal than core features due to higher training-set correlation"
      evidence: "Simplicity bias literature (Shah et al., 2020)"
      falsifier: "If gradient norms for spurious features are NOT higher than core features early in training"
    - step: 2
      description: "Higher LR and smaller batches introduce optimization noise that disrupts spurious gradient advantage"
      evidence: "Stochastic regularization literature; implicit regularization in SGD"
      falsifier: "If high-LR configurations show same spurious timing as low-LR"
    - step: 3
      description: "Delayed spurious dominance allows more epochs for core feature learning, improving worst-group accuracy"
      evidence: "Proposed - to be verified via P2 correlation"
      falsifier: "If delayed dominance does NOT correlate with improved worst-group accuracy"
  key_tension: "Whether 'gradient competition' is the actual mechanism or merely a useful approximation"
  evidence_summary: |
    The mechanism builds on established simplicity bias (Shah et al., 2020) and SGD implicit regularization theory.
    The novel claim is that optimization hyperparameters can control the timing of spurious feature emergence.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "GradCAM reliably separates spurious vs. core feature attribution"
    supporting_evidence: "GradCAM is established for attribution; Waterbirds/CelebA have ground-truth regions"
    consequence_if_violated: "Spurious dominance epoch measurement becomes unreliable"
  - id: "A2"
    assumption: "Spurious and core features compete for gradient signal"
    supporting_evidence: "Simplicity bias implies features are learned in order of gradient magnitude"
    consequence_if_violated: "The gradient competition mechanism is invalid (but empirical predictions may still hold)"
  - id: "A3"
    assumption: "Higher LR / smaller batch increases optimization noise"
    supporting_evidence: "Well-established in SGD theory"
    consequence_if_violated: "Core mechanism of intervention fails"
  - id: "A4"
    assumption: "Delayed spurious dominance causally improves worst-group accuracy"
    supporting_evidence: "Proposed - P2 tests this"
    consequence_if_violated: "Practical relevance of timing control diminishes"
  - id: "A5"
    assumption: "Effects transfer across datasets with similar spurious structure"
    supporting_evidence: "Both Waterbirds and CelebA have background/foreground spurious patterns"
    consequence_if_violated: "Method may be dataset-specific"

# Section 1.5: Scope
scope:
  applies_to: |
    Image classification tasks with spurious correlations (background-foreground type).
    ResNet-family architectures trained with SGD.
    Datasets where spurious features are visually separable (Waterbirds, CelebA, CMNIST).
  does_not_apply_to: |
    NLP tasks (different feature dynamics).
    Transformer architectures (may have different optimization dynamics).
    Spurious correlations without visual separation.
  known_limitations: |
    Ground truth attribution regions needed for measurement (but not for intervention deployment).
    Hessian computation is expensive at scale.
    GradCAM may be noisy for complex scenes.

# Section 1.6: Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Models trained with 10x higher learning rate will show peak spurious feature dominance at epochs >=10% later than baseline"
    test_method: "Compare peak dominance epochs across LR configurations, controlling for convergence speed"
    success_criterion: "Spurious dominance epoch shift >= 5 epochs (for 50-epoch training); paired t-test p < 0.05"
    falsification: "If high-LR configurations show <=2 epoch shift, hypothesis fails"
  - id: "P2"
    primary: true
    statement: "Peak spurious dominance epoch will negatively correlate with final worst-group accuracy"
    test_method: "Spearman correlation across all configurations"
    success_criterion: "r < -0.5, p < 0.05"
    falsification: "If r >= -0.3, practical relevance is questionable"
  - id: "P3"
    primary: false
    statement: "Loss landscape sharpness at peak spurious dominance epoch will be >=2x higher than at convergence"
    test_method: "Compute top Hessian eigenvalue via power iteration at peak vs. final epoch"
    success_criterion: "Eigenvalue ratio >= 2.0"
    falsification: "If ratio < 1.5, sharpness-spurious connection fails"

