main_hypothesis:
  id: H-ErrorFormat-v1
  title: Structured Error Formatting for LLM Self-Repair
  statement: Under the setting of LLM self-repair on code generation benchmarks (HumanEval+, MBPP+), if static analysis errors
    are formatted as structured templates with intermediate-specificity fix suggestions, then repair success rates will improve
    over raw compiler output, because structured formatting reduces the representational gap between compiler output and LLM
    training distribution while intermediate hints provide useful direction without creating copy-paste dependency.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: EvalPlus (HumanEval+, MBPP+)
    model: CodeLlama-7B, CodeLlama-34B, GPT-4
    optimizer: null
