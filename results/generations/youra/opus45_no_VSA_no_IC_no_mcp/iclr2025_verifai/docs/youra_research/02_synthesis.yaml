hypothesis_draft:
  title: "Structured Error Formatting for LLM Self-Repair"
  hypothesis_id: "H-ErrorFormat-v1"
  core_claim: |
    Structured error feedback that preserves all diagnostic information, separates
    problem identification from fix suggestions, and uses natural language descriptions
    alongside technical details improves LLM self-repair success because it reduces
    the representational gap between compiler output and the LLM's training distribution.
  mechanism: |
    1. Representational Alignment: Structured templates transform compiler output toward
       LLM training distribution (natural language, clear sections)
    2. Information Preservation: All diagnostic content retained, verified by reconstruction
    3. Scaffolded Guidance: Intermediate-specificity hints activate relevant model knowledge
       without bypassing reasoning
  predictions:
    - P1: "Structured format > Raw/Verbose-Raw/Scrambled for repair success rate"
    - P2: "Fix specificity shows inverted-U (Levels 1-2 > Levels 0, 3)"
    - P3: "Format benefits larger for smaller models (7B > 34B > GPT-4)"

variables_summary:
  independent: "Error Format (4 levels), Fix Specificity (4 levels), Model Scale (3 levels), Error Type (3 levels)"
  dependent_primary: "Repair Success Rate (fixed / attempted)"
  controlled: "Information content, temperature, max iterations, prompt template"

null_hypothesis:
  h0_statement: |
    There is no significant difference in repair success rate across error format
    conditions (raw, verbose-raw, structured, scrambled) after controlling for
    information content and prompt length.
  statistical_test: "Mixed-effects ANOVA with BH-FDR correction"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic study of error format for LLM self-repair; introduces representational alignment hypothesis + fix specificity dimension"
  differentiation_summary: |
    Prior work (CompCoder, Self-Repair ICLR 2024, InspectCoder) focuses on WHETHER to
    include compiler feedback, not HOW to format it. We fill this gap with a 4x4x3x3
    factorial design testing format type, fix specificity, model scale, and error type.

