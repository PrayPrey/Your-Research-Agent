    - claim: "Intermediate fix specificity outperforms both no hints and exact fixes"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis based on HCI worked-examples research"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    BUILD_ON claims require citation only; do not re-verify.
    PROVE_NEW claims require experimental validation in Phase 4.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-ErrorFormat-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the setting of LLM self-repair on code generation benchmarks (HumanEval+, MBPP+),
    if static analysis errors are formatted as structured templates with intermediate-specificity
    fix suggestions, then repair success rates will improve over raw compiler output, because
    structured formatting reduces the representational gap between compiler output and LLM
    training distribution while intermediate hints provide useful direction without creating
    copy-paste dependency.
  alternative_hypothesis_h0: |
    There is no significant difference in repair success rate across error format conditions
    (raw, verbose-raw, structured, scrambled) after controlling for information content and
    prompt length.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "Error Format"
      type: "categorical"
      operationalization: "Format of static analysis error message fed to LLM"
      levels:
        - "Raw: Direct compiler/linter output"
        - "Verbose-Raw: Expanded raw output with same information, unstructured"
        - "Structured: Template format (PROBLEM/LOCATION/CONTEXT/ROOT CAUSE)"
        - "Scrambled: Structured content with randomly ordered sections"
    - name: "Fix Specificity Level"
      type: "categorical"
      operationalization: "Specificity of fix suggestions in error feedback"
      levels:
        - "Level 0: No fix hint (diagnostic only)"
        - "Level 1: General strategy (e.g., 'convert types to match')"
        - "Level 2: Specific pattern (e.g., 'use str(x) or int(y)')"
        - "Level 3: Exact fix (e.g., 'str(count)')"
    - name: "Model Scale"
      type: "categorical"
      operationalization: "Parameter count of LLM being tested"
      levels:
        - "Small: CodeLlama-7B"
        - "Medium: CodeLlama-34B"
        - "Large: GPT-4"
    - name: "Error Type"
      type: "categorical"
      operationalization: "Category of static analysis error"
      levels:
        - "Syntax: Parse errors, missing brackets"
        - "Type: Type mismatches, incompatible operations"
        - "Semantic: Undefined variables, unreachable code"
  dependent:
    - name: "Repair Success Rate"
      type: "continuous"
      operationalization: "Proportion of errors successfully fixed (fixed / attempted), range [0, 1]"
      primary: true
    - name: "Iteration Count"
      type: "continuous"
      operationalization: "Number of repair attempts until success or max iterations"
      primary: false
    - name: "Pass@1 Improvement"
      type: "continuous"
      operationalization: "Delta in pass@1 vs base model without repair, range [-1, 1]"
      primary: false
  controlled:
    - name: "Information Content"
      operationalization: "All format conditions contain identical diagnostic information; verified by reconstruction test"
    - name: "Temperature"
      operationalization: "Fixed at 0.0 for deterministic comparison"
    - name: "Max Iterations"
      operationalization: "Fixed at 5 repair attempts per error"
    - name: "Prompt Template"
      operationalization: "Identical instruction wrapper across conditions, only error format varies"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Representational Alignment - Structured templates transform compiler output toward LLM training distribution (natural language, clear sections)"
      evidence: "LLMs trained on human-written text; compiler errors written for humans but with terse, technical formatting that differs from training data"
      falsifier: "If structured format performs equally to scrambled format, then section structure (not alignment) is irrelevant"
    - step: 2
      description: "Information Preservation - All diagnostic content retained through format transformation"
      evidence: "Reconstruction test: third-party LLM can extract original error details from structured format"
      falsifier: "If structured format degrades for specific error types, information loss may be occurring"
    - step: 3
      description: "Scaffolded Guidance - Intermediate-specificity hints activate relevant model knowledge without bypassing reasoning"
      evidence: "HCI research on worked examples shows faded scaffolding outperforms both no hints and full solutions"
      falsifier: "If Level 3 (exact fix) outperforms Level 1-2, then models benefit from explicit solutions over guidance"
  key_tension: "Does structure itself matter, or only information content and length? Scrambled condition isolates this."
  evidence_summary: |
    The mechanism is grounded in representational learning theory: LLMs encode text in ways shaped by
    training distribution. Compiler errors fall outside typical training patterns. Transforming errors
    toward natural language should improve model understanding and response quality.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Information content can be held constant across format conditions"
    supporting_evidence: "Reconstruction test design allows verification"
    consequence_if_violated: "Format effects would be confounded with information differences"
  - id: "A2"
    assumption: "Real model failures from HumanEval+/MBPP+ are representative of errors LLMs make in practice"
    supporting_evidence: "EvalPlus benchmarks are standard evaluation with 80x more test cases"
    consequence_if_violated: "Findings may not generalize to production use cases"
  - id: "A3"
    assumption: "Error type distribution in benchmark is balanced enough for stratified analysis"
    supporting_evidence: "Will monitor and report distribution; stratified sampling if needed"
    consequence_if_violated: "Underpowered subanalyses for rare error types"
  - id: "A4"
    assumption: "Self-repair framework (theoxo/self-repair) is correctly implemented"
    supporting_evidence: "ICLR 2024 publication with released code and reproduction artifacts"
    consequence_if_violated: "Baseline may be misconfigured"
  - id: "A5"
    assumption: "GPT-4 is not at ceiling for repair of complex error types"
    supporting_evidence: "Type/semantic errors still challenging per InspectCoder paper"
    consequence_if_violated: "Format benefits may only appear for smaller models"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - LLM self-repair on Python code generation tasks
    - Standard benchmarks: HumanEval+, MBPP+, HumanEval, MBPP
    - Static analysis errors: type errors, syntax errors, undefined variables
    - Model scales from 7B to 100B+ parameters
    - Iterative refinement with compiler/linter feedback
  does_not_apply_to: |
    - Dynamic analysis (runtime debugging) - different information content
    - Human-in-the-loop repair - different feedback modality
    - Languages other than Python (not tested)
    - Logical/algorithmic errors without static analysis signals
  known_limitations: |
    - Results may not generalize to production codebases (longer, more complex)
    - Format preferences may differ across model families (only testing CodeLlama + GPT-4)
    - Does not address whether format preferences are learnable vs fixed

# Section 1.6: Testable Predictions
