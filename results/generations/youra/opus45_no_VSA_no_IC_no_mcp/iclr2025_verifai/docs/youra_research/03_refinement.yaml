# Section 0: Established Facts & Claim Scope
established_facts:
  claims:
    - claim: "Self-repair yields minimum +4.9% improvement across all models tested"
      status: "BUILD_ON"
      evidence: "arXiv:2604.10508 - How Many Tries Does It Take?"
    - claim: "Compiler feedback improves compilation success (44% to 89% in CompCoder)"
      status: "BUILD_ON"
