  - id: "P1"
    primary: true
    statement: "Structured error format achieves higher repair success rate than Raw, Verbose-Raw, and Scrambled formats"
    test_method: "Compare mean repair success rate across format conditions using mixed-effects ANOVA"
    success_criterion: "Structured > Raw with p < 0.05 (BH-FDR corrected)"
    falsification: "Structured <= Raw OR Structured = Scrambled (would indicate information content, not structure, drives effect)"
  - id: "P2"
    primary: false
    statement: "Fix specificity shows inverted-U pattern: Levels 1-2 outperform both Level 0 and Level 3"
    test_method: "Polynomial contrast analysis of fix specificity levels"
    success_criterion: "Quadratic term significant with peak at Level 1-2"
    falsification: "Monotonic relationship OR no effect of fix specificity"
  - id: "P3"
    primary: false
    statement: "Format benefits are larger for smaller models (7B > 34B > GPT-4)"
    test_method: "Format x Model Scale interaction in mixed-effects ANOVA"
    success_criterion: "Significant interaction with larger format effect for smaller models"
    falsification: "No interaction OR reversed direction (larger models benefit more)"

