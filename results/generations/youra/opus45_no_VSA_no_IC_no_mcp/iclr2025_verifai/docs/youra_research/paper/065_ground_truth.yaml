# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 4-5 validation reports
# Used to verify paper claims against experimental evidence

metadata:
  generated_at: "2026-08-28T04:15:00Z"
  paper_file: "06_paper.md"
  hypothesis_id: "H-ErrorFormat-v1"
  source_files:
    - "045_validated_hypothesis.md"
    - "h-m2/04_validation.md"
    - "h-m3/04_validation.md"
    - "h-c1/04_validation.md"

# =============================================================================
# CORE CLAIMS AND EVIDENCE
# =============================================================================

claims:
  # Primary claim
  - id: "claim_1"
    statement: "Structured error formatting significantly improves LLM self-repair success"
    paper_location: "Abstract, Introduction, Results"
    evidence:
      source: "h-m2/04_validation.md"
      metrics:
        structured_success_rate: 0.484
        scrambled_success_rate: 0.340
        delta: 0.144
        p_value: 6.5e-06
        confidence_interval: [0.082, 0.206]
        cohens_d: 0.30
        n_samples: 500
      statistical_test: "McNemar's chi-squared"
    verdict: "VALIDATED"

  # Causal mechanism claim
  - id: "claim_2"
    statement: "Organizational structure, not information content, drives improvement"
    paper_location: "Results Section 5.1, Discussion"
    evidence:
      source: "h-m2/04_validation.md"
      design: "Scrambled condition contains identical information with randomized section order"
      metrics:
        structured_wins: 160
        scrambled_wins: 88
        net_advantage: 72
    verdict: "VALIDATED"

  # Information preservation claim
  - id: "claim_3"
    statement: "Format transformation preserves all diagnostic information"
    paper_location: "Methodology, Results Table 2"
    evidence:
      source: "h-m1/04_validation.md"
      metrics:
        reconstruction_accuracy: 1.0
        per_field_accuracy:
          line_number: 1.0
          error_type: 1.0
          error_message: 1.0
          code_context: 1.0
        n_samples: 500
        error_types_tested: 8
      mode: "MOCK"
      note: "Perfect accuracy in regex-based mock mode; real LLM judge pending"
    verdict: "VALIDATED_WITH_CAVEAT"

  # Scaffolding claim
  - id: "claim_4"
    statement: "Intermediate-specificity hints achieve optimal repair success (inverted-U pattern)"
    paper_location: "Results Section 5.3, Table 3"
    evidence:
      source: "h-m3/04_validation.md"
      metrics:
        level_0_success: 0.347
        level_1_success: 0.553
        level_2_success: 0.602
        level_3_success: 0.396
        quadratic_coefficient: -0.1029
        p_value: "<0.001"
        peak_level: 2
      mode: "SIMULATION"
      note: "Blocked by flash_attn CUDA error; pattern from synthetic data"
    verdict: "SIMULATION_VALIDATED"

  # Scale interaction claim
  - id: "claim_5"
    statement: "Smaller models benefit more from structured formatting (directional pattern)"
    paper_location: "Results Section 5.4, Table 4"
    evidence:
      source: "h-c1/04_validation.md"
      metrics:
        7B_benefit: 0.114
        34B_benefit: 0.083
        gpt4_benefit: 0.039
        interaction_p: 0.176
        interaction_eta_sq: 0.001
        gpt4_n_samples: 81
      statistical_test: "Two-way ANOVA"
    verdict: "NOT_SIGNIFICANT"
    note: "Directional pattern exists but interaction not statistically significant"

# =============================================================================
# QUANTITATIVE VALUES (for fact-checking)
# =============================================================================

quantitative_values:
  # Main result
  main_improvement: "14.4%"
  main_p_value: "6.5e-06"
  main_ci: "[0.082, 0.206]"
  main_effect_size: "0.30 (Cohen's d)"

  # Fix specificity
  level_0_rate: "34.7%"
  level_1_rate: "55.3%"
  level_2_rate: "60.2%"
  level_3_rate: "39.6%"
  quadratic_p: "<0.001"

  # Scale effects
  7B_delta: "+11.4%"
  34B_delta: "+8.3%"
  gpt4_delta: "+3.9%"
  interaction_p: "0.176"
  interaction_eta_sq: "0.001"

  # Sample sizes
  main_n: 500
  gpt4_failures: 81
  total_problems: 542

