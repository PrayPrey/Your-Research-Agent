    description: "H-M3 ran in simulation mode due to flash_attn CUDA compatibility"
    paper_must_state: "real-model validation pending"

  - id: "lim_2"
    description: "H-M1 used mock LLM judge (regex-based)"
    paper_must_state: "mock mode / regex fallback used"

  - id: "lim_3"
    description: "H-C1 underpowered for GPT-4 (only 81 samples)"
    paper_must_state: "power limitation or sample size issue"

  - id: "lim_4"
    description: "Python only; single benchmark family"
    paper_must_state: "may not generalize to other languages"

  - id: "lim_5"
    description: "8 error types covered, not comprehensive"
    paper_must_state: "limited error type coverage"

