main_hypothesis:
  id: H-CalibCorr-v1
  title: Calibration-Mediated Correlation Between Truthfulness and Adversarial Robustness in LLMs
  statement: Under controlled evaluation conditions, TruthfulQA MC1 accuracy and AdvGLUE average accuracy show significant
    positive partial correlation (r > 0.3, p < 0.05) after controlling for model size, because both capabilities rely on accurate
    uncertainty estimation that calibration enables.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA, AdvGLUE, MMLU
    model: 15-20 decoder-only LLMs (Pythia, Llama-2, Mistral, Falcon families)
    optimizer: null
    hyperparameters:
      evaluation_framework: lm-evaluation-harness
      ece_bins: 15
      bootstrap_iterations: 1000
      significance_level: 0.05
