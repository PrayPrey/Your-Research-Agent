# =============================================================================
# 1. CORE CLAIMS (What the paper asserts as true)
# =============================================================================

core_claims:
  main_claim:
    statement: "TruthfulQA MC1 and AdvGLUE accuracy show strong positive partial correlation (r=0.80, p<0.001) after controlling for model size"
    evidence_source: "h-e1 validation"
    confidence: "HIGH"
    paper_section: "Results"

  mechanism_claim:
    statement: "Calibration (ECE) does not explain the truthfulness-robustness correlation"
    evidence_source: "h-m1 validation"
    confidence: "HIGH"
    paper_section: "Results"

  generalization_claim:
    statement: "Correlation holds across model families (Pythia, Llama-2, Mistral, Falcon)"
    evidence_source: "h-e1 family analysis"
    confidence: "MEDIUM"
    paper_section: "Results"

