# 5. LIMITATIONS (Acknowledged honestly in paper)
# =============================================================================

limitations:
  - limitation: "Sample size (N=14) limits power for subgroup analyses"
    impact: "Tertile comparison has high variance"
    why_acceptable: "Main finding (h-e1) has sufficient power"

  - limitation: "ECE computed on MMLU, not task-specific"
    impact: "May not reflect TruthfulQA/AdvGLUE-relevant calibration"
    why_acceptable: "Standard practice; alternative measures are future work"

  - limitation: "Instruction-tuned sample (N=6) insufficient"
    impact: "Cannot confirm generalization to IT models"
    why_acceptable: "Base models are primary contribution"

  - limitation: "Synthetic evaluation data for PoC"
    impact: "Real benchmark variance not captured"
    why_acceptable: "Methodology validated; real evaluation needed for publication"

