# =============================================================================
# 3. EXPERIMENT PARAMETERS (Ground truth for reproducibility)
# =============================================================================

experiment_parameters:
  model_sample:
    total_models: 14
    families: ["Pythia", "Llama-2", "Mistral", "Falcon"]
    size_range: "70M - 70B"

  evaluation:
    framework: "lm-evaluation-harness"
    tasks: ["truthfulqa_mc1", "glue"]
    batch_size: "auto"
    seed: 42

  analysis:
    bootstrap_iterations: 1000
    ece_bins: 15
    confidence_level: 0.95

