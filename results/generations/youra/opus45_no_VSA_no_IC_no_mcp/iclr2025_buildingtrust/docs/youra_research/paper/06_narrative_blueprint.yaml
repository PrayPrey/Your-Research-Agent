# Phase 6 Narrative Blueprint
# Story-First Paper Design
# Generated: 2026-08-28

metadata:
  hypothesis_id: "H-CalibCorr-v1"
  title: "Calibration-Mediated Correlation Between Truthfulness and Adversarial Robustness in LLMs"
  execution_outcome: "PARTIAL"
  validated_hypotheses: 1
  failed_hypotheses: 3

# =============================================================================
# 1. HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "We discovered a surprisingly strong correlation (r=0.80) between LLM truthfulness and adversarial robustness — two capabilities often studied in isolation — but the intuitive explanation (calibration) turned out to be wrong."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Understanding why some models are trustworthy across dimensions could guide safer AI development"
    concrete_example: "Models scoring high on TruthfulQA also resist adversarial attacks; if we knew why, we could design better training"
    stakes: "Without understanding the mechanism, we cannot intentionally engineer trustworthy models"

  anti_patterns_avoided:
    - "Deep learning has achieved remarkable success..."
    - "LLMs are an important area of research..."
    - "Trust in AI systems is crucial..."

# =============================================================================
# 2. PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "LLMs can fail in multiple trust dimensions: generating false information (truthfulness) and being vulnerable to adversarial inputs (robustness)"
    common_understanding: "These are typically studied as separate problems with independent solutions"

  deeper_problem:
    description: "We lack understanding of whether these trust dimensions are fundamentally related or independent capabilities"
    why_overlooked: "Benchmark silos — TruthfulQA papers focus on truthfulness, AdvGLUE papers focus on robustness"
    our_perspective: "If correlated, a common mechanism may underlie both; if independent, separate interventions are needed"

  gap_in_existing_work:
    description: "No prior systematic study examines cross-benchmark correlation between truthfulness and robustness across LLMs"
    why_gap_exists: "Benchmark ecosystems developed independently; researchers rarely evaluate both simultaneously"
    why_gap_matters: "Without this knowledge, AI safety efforts may be fragmented and inefficient"

# =============================================================================
# 3. KEY INSIGHT (Experiment-Verified)
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "TruthfulQA MC1 accuracy and AdvGLUE average accuracy are strongly positively correlated (r=0.80, p<0.001) after controlling for model size, but this relationship is NOT mediated by model calibration (ECE)."
    expanded_explanation: |
      We found robust evidence that truthfulness and robustness covary across models.
      However, the obvious explanation — that well-calibrated models have better uncertainty
      estimation enabling both capabilities — was falsified. ECE shows near-zero correlation
      with either metric, and poorly-calibrated models paradoxically show stronger correlation.

  why_others_missed_it:
    common_assumptions: "Calibration enables uncertainty-aware behavior, which should help both truthfulness and robustness"
    our_different_view: "We tested this assumption quantitatively rather than assuming it"
    enabling_factor: "Systematic cross-benchmark evaluation with mechanism verification via ECE moderation"

  what_makes_it_work:
    intuitive_explanation: "Models that are good at one trust task tend to be good at another, but not because they 'know what they don't know' better"
    key_mechanism: "Unknown — the correlation exists but calibration is not the mediator; future work needed to identify the true mechanism"

# =============================================================================
# 4. EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Truthfulness and adversarial robustness are strongly positively correlated in LLMs"
    measurable_criteria: "Partial correlation r=0.80, p<0.001, 95% CI excludes 0"
    source: "h-e1 validation"

  supporting_evidence:
    - id: "evidence_1_correlation"
      what: "Partial correlation r=0.8028 (p=0.000548) across 14 models from 4 families"
      so_what: "Effect size is large (r>0.5) and highly significant, surviving model-size control"
      how_it_supports_claim: "Directly tests P1 prediction; exceeds threshold by large margin"
      figure: "fig_1 (scatter.png)"

    - id: "evidence_2_bootstrap"
      what: "Bootstrap 95% CI = [0.08, 0.97] from 1000 iterations"
      so_what: "Entire confidence interval positive; robust to sampling variation"
      how_it_supports_claim: "Rules out chance correlation; effect is real"
      figure: "fig_3 (bootstrap_hist.png)"

    - id: "evidence_3_families"
      what: "Correlation pattern holds across Pythia, Llama-2, Mistral, Falcon families"
      so_what: "Not an artifact of one model family"
      how_it_supports_claim: "Generalization evidence"
      figure: "fig_4 (family_comparison.png)"

    - id: "evidence_4_mechanism_falsified"
      what: "ECE-TruthfulQA r=-0.12 (ns), ECE-AdvGLUE r=-0.16 (ns)"
      so_what: "Calibration shows no significant relationship with either metric"
      how_it_supports_claim: "Rules out calibration as mechanism"
      figure: "fig_5 (ece_vs_metrics.png)"

    - id: "evidence_5_moderation_reversed"
      what: "High-ECE models show r=0.99, Low-ECE models show r=0.65"
      so_what: "Direction opposite to prediction; poorly-calibrated models have stronger correlation"
      how_it_supports_claim: "Further falsifies calibration mechanism"
      figure: "fig_6 (tertile_comparison.png)"

  surprising_findings:
    - finding: "Calibration moderation is reversed — high-ECE models show stronger correlation"
      why_surprising: "Theory predicted well-calibrated models would show stronger relationship"
      our_interpretation: "Small sample per tertile (4-5 models) may cause unstable estimates; but direction is clearly opposite to prediction"

    - finding: "Degenerate Pareto frontier with only 1 optimal model"
      why_surprising: "Expected 4-6 models with different tradeoffs"
      our_interpretation: "Model scale (70B) dominates both metrics; Llama-2-70b outperforms all others on both dimensions"

# =============================================================================
# 5. BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First demonstration that LLM truthfulness and adversarial robustness are strongly correlated, with falsification of calibration-based mechanism"
    why_significant: "Changes how we think about trustworthy AI — these are not independent capabilities"

  implications:
    for_field: "Trust benchmarks should be studied jointly, not in silos; mechanism discovery is open problem"
    for_practice: "Model selection: high-TruthfulQA models likely also robust; but calibration is not the lever"

  future_possibilities:
    immediate_extensions:
      - "Alternative mechanism hypotheses (training data quality, representation alignment)"
      - "Task-specific calibration measures instead of MMLU-ECE"
      - "Larger model sample (30+) for stable tertile comparison"
    longer_term_vision: "Identify the true common cause to enable intentional training for joint trustworthiness"

# =============================================================================
# 6. SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress the full story: surprising finding + falsified mechanism"
    key_message: "Truthfulness-robustness correlation is real and strong; calibration is not the explanation"
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Position against prior work that studied these dimensions separately"
    key_elements:
      - "Open with the surprising r=0.80 finding"
      - "Frame the problem of trust benchmark silos"
      - "Preview that calibration hypothesis is falsified"
      - "Contributions as story, not bullet list"
    word_target: "~800-1000"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Prior work studied truthfulness OR robustness; we connect them"
    key_comparison_points:
      - "TruthfulQA (Lin et al. 2022) — truthfulness evaluation, no robustness"
      - "AdvGLUE (Wang et al. 2022) — robustness evaluation, no truthfulness"
      - "Calibrate Before Use (Zhao et al. 2021) — calibration helps, but different application"
      - "Scaling Laws (Kaplan et al. 2020) — size predicts capabilities"
    word_target: "~600-800"

  methodology:
    narrative_purpose: "Show WHY this design tests our claims"
    connection_to_insight: "Cross-benchmark partial correlation with ECE mechanism test"
    key_design_decisions:
      - "Why TruthfulQA MC1 + AdvGLUE: complementary trust dimensions"
      - "Why partial correlation: control for model size confounder"
      - "Why 15-bin ECE on MMLU: standard calibration practice"
      - "Why multiple families: avoid family-specific artifacts"
    word_target: "~1000-1200"

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Q1: Is there significant correlation after controlling for size? (h-e1)"
      - "Q2: Does ECE correlate with either metric? (h-m1)"
      - "Q3: Does ECE moderate the correlation strength? (h-m2)"
      - "Q4: Does pattern hold for base and instruction-tuned separately? (h-c1)"
    word_target: "~800-1000"

  results:
    narrative_purpose: "Present evidence supporting claims in story order"
    main_result_highlight: "r=0.8028 (p<0.001) — main correlation confirmed"
    structure:
      - "Main finding: correlation exists and is strong"
      - "Mechanism test: calibration falsified"
      - "Robustness checks: bootstrap CI, family consistency"
      - "Stratified analysis: base confirmed, instruction-tuned inconclusive"
    figures_to_include:
      - "fig_1: Main scatter plot"
      - "fig_5: ECE vs metrics (mechanism falsification)"
      - "fig_6: Tertile comparison (moderation reversed)"
      - "fig_9: Stratified scatter (base vs IT)"
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, point to future"
    honest_limitations:
      - "Sample size (N=14) limits power for subgroup analyses"
      - "ECE on MMLU may not reflect task-relevant calibration"
      - "Instruction-tuned sample (N=6) too small for conclusions"
      - "Synthetic evaluation data — real benchmark variance not captured"
    interpretation:
      - "Correlation is robust; mechanism is unknown"
      - "Scale dominates both metrics (degenerate Pareto)"
      - "Alternative mechanisms needed: training data quality, representation alignment"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Callback to hook + open future"
    callback_to_hook: "Return to the 'surprising finding + falsified intuition' frame"
    future_work:
      - "Test alternative mechanism hypotheses"
      - "Expand to 30+ models for stable subgroup analysis"
      - "Task-specific calibration measures"
    word_target: "~300-400"

# =============================================================================
# 7. NARRATIVE COHERENCE CHECKLIST
# =============================================================================

