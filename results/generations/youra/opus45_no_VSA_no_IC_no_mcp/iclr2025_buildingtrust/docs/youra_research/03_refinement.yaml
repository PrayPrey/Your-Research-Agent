# Section 0: Established Facts & Claim Scope
established_facts:
  claims:
    - claim: "TruthfulQA measures model tendency to repeat misconceptions"
      status: "BUILD_ON"
      evidence: "Lin et al. 2022, established benchmark"
    - claim: "AdvGLUE measures robustness to word-level adversarial perturbations"
      status: "BUILD_ON"
      evidence: "Wang et al. 2022, established benchmark"
    - claim: "ECE (Expected Calibration Error) measures calibration quality"
      status: "BUILD_ON"
      evidence: "Guo et al. 2017, standard metric"
    - claim: "Calibration improves few-shot performance"
      status: "BUILD_ON"
      evidence: "Zhao et al. 2021 (Calibrate Before Use)"
    - claim: "Truthfulness and robustness are correlated via calibration"
      status: "PROVE_NEW"
      evidence: "No prior study tests this interaction"
  scope_reduction_percentage: 80
  phase2b_4_instructions: |
    Focus verification on PROVE_NEW claim: the correlation between truthfulness
    and robustness, and calibration's mediating role. BUILD_ON claims are
    established by cited papers and need no re-verification.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-CalibCorr-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under controlled evaluation conditions (lm-eval-harness, consistent settings),
    if we measure TruthfulQA MC1 accuracy and AdvGLUE average accuracy across 15+ LLMs
    from multiple families (Llama, Mistral, Pythia, Falcon),
    then we will observe a significant positive partial correlation (r > 0.3, p < 0.05)
    after controlling for model size,
    because both capabilities rely on accurate uncertainty estimation that calibration enables.
  alternative_hypothesis_h0: |
    There is no significant partial correlation between TruthfulQA MC1 accuracy and
    AdvGLUE average accuracy after controlling for model parameter count (|r| < 0.2, p > 0.1).

# Section 1.2: Variables Table
variables:
  independent:
    - name: "Model Identity"
      type: "categorical"
      operationalization: "Different LLM checkpoints from public model families"
      levels:
        - "Pythia (70M to 12B)"
        - "Llama-2 (7B/13B/70B, base/chat)"
        - "Mistral-7B variants"
        - "Falcon (7B/40B)"
  dependent:
    - name: "TruthfulQA MC1 Accuracy"
      type: "continuous"
      operationalization: "Accuracy on TruthfulQA multiple-choice format 1, range 0-1"
      primary: true
    - name: "AdvGLUE Average Accuracy"
      type: "continuous"
      operationalization: "Mean accuracy across AdvGLUE subtasks, range 0-1"
      primary: true
    - name: "ECE (Expected Calibration Error)"
      type: "continuous"
      operationalization: "15-bin ECE on MMLU validation set, range 0-1 (lower = better calibrated)"
      primary: false
  controlled:
    - name: "Model Parameter Count"
      operationalization: "Log-transformed parameter count as covariate in partial correlation"
    - name: "Evaluation Settings"
      operationalization: "Consistent prompt templates, generation settings via lm-eval-harness"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Calibration (ECE) reflects model's ability to estimate its own uncertainty"
      evidence: "Guo et al. 2017, Zhao et al. 2021"
      falsifier: "If ECE does not correlate with confidence accuracy on held-out data"
    - step: 2
      description: "Good uncertainty estimation leads to refusing to hallucinate (truthfulness)"
      evidence: "Models with accurate confidence should abstain on uncertain claims"
      falsifier: "If high-confidence errors are equally common in low-ECE models"
    - step: 3
      description: "Good uncertainty estimation leads to detecting anomalous inputs (robustness)"
      evidence: "Calibrated models should assign low confidence to adversarial inputs"
      falsifier: "If adversarial inputs receive high confidence in low-ECE models"
    - step: 4
      description: "Therefore, calibration is a common cause enabling both capabilities"
      evidence: "Proposed mechanism linking truthfulness and robustness"
      falsifier: "If correlation persists when stratified by ECE (no moderation effect)"
  key_tension: "Whether calibration is truly causal or merely correlated via model quality"
  evidence_summary: |
    Calibration has been shown to improve downstream performance (Zhao et al. 2021).
    The hypothesis extends this to propose calibration as mediator between two specific
    trust dimensions that have not been studied jointly.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "TruthfulQA and AdvGLUE measure distinct but related trust dimensions"
    supporting_evidence: "Both require model to handle challenging inputs correctly"
    consequence_if_violated: "If measuring same construct, correlation is trivial"
  - id: "A2"
    assumption: "ECE calculated on neutral benchmark (MMLU) reflects general calibration"
    supporting_evidence: "Standard practice in calibration literature"
    consequence_if_violated: "Task-specific calibration may not generalize"
  - id: "A3"
    assumption: "Model size is the primary confounder to control"
    supporting_evidence: "Larger models generally perform better on both metrics"
    consequence_if_violated: "Other confounders may explain correlation"
  - id: "A4"
    assumption: "lm-eval-harness provides comparable evaluations across models"
    supporting_evidence: "Standard evaluation framework, consistent prompt templates"
    consequence_if_violated: "Evaluation inconsistencies may introduce noise"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Decoder-only autoregressive LLMs
    - Models with public weights (HuggingFace accessible)
    - English language benchmarks
    - Multiple-choice and classification tasks
  does_not_apply_to: |
    - Encoder-only models (BERT family)
    - Proprietary models (GPT-4, Claude) without logit access
    - Non-English benchmarks
    - Generation tasks (free-form text)
  known_limitations: |
    - Sample size (N~20) limits statistical power
    - AdvGLUE subtask heterogeneity may mask patterns
    - Correlation does not establish causation (exploratory study)

# Section 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Partial correlation r > 0.3 (p < 0.05) between TruthfulQA MC1 and AdvGLUE average after controlling for model size"
    test_method: "Partial Pearson correlation with log(params) covariate, bootstrap 95% CI"
    success_criterion: "r > 0.3, p < 0.05, bootstrap CI excludes 0"
    falsification: "If partial |r| < 0.2 and p > 0.1"
  - id: "P2"
    primary: false
    statement: "Correlation is stronger in low-ECE (well-calibrated) models than high-ECE models"
    test_method: "Fisher's z-test comparing correlation coefficients across ECE tertiles"
    success_criterion: "Low-ECE tertile r significantly > High-ECE tertile r (z-test p < 0.05)"
    falsification: "If correlations across ECE tertiles are not significantly different"
  - id: "P3"
    primary: false
    statement: "Pareto-optimal models (no model dominates on both metrics) have lower average ECE"
    test_method: "Compare mean ECE of Pareto-optimal vs non-Pareto models (t-test)"
    success_criterion: "Pareto-optimal models have significantly lower ECE (p < 0.05)"
    falsification: "If Pareto-optimal and non-Pareto models have similar ECE"

