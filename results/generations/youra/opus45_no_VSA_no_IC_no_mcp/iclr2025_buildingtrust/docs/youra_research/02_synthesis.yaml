hypothesis_draft:
  title: "Calibration-Mediated Correlation Between Truthfulness and Adversarial Robustness in LLMs"
  hypothesis_id: "H-CalibCorr-v1"
  core_claim: |
    LLMs show a significant positive correlation between TruthfulQA MC1 accuracy and
    AdvGLUE average accuracy (r > 0.3, p < 0.05) after controlling for model size.
    This correlation is mediated by calibration quality (ECE).
  mechanism: |
    Calibration enables accurate uncertainty estimation. Good uncertainty estimation
    underlies both: (1) refusing to hallucinate on uncertain claims (truthfulness), and
    (2) detecting anomalous/adversarial inputs (robustness). Therefore, calibration
    is a common cause enabling both capabilities.
  predictions:
    - P1: "Partial correlation r > 0.3 between TruthfulQA and AdvGLUE after size control"
    - P2: "Correlation stronger in low-ECE models than high-ECE models"
    - P3: "Pareto-optimal models have lower average ECE (exploratory)"

variables_summary:
  independent: "Model identity (15-20 LLMs from Pythia, Llama-2, Mistral, Falcon families)"
  dependent_primary: "TruthfulQA MC1 accuracy, AdvGLUE average accuracy"
  controlled: "Model parameter count (log-transformed covariate)"

null_hypothesis:
  h0_statement: |
    There is no significant partial correlation between TruthfulQA MC1 accuracy and
    AdvGLUE average accuracy after controlling for model parameter count.
    Specifically: |r| < 0.2 and p > 0.1.
  statistical_test: "Partial Pearson correlation with bootstrap CI"
  significance_level: 0.05

novelty_assessment:
