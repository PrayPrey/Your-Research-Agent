    dataset: RedPajama-v2 (English web text subset)
    model: GPT-2 architecture (125M/350M/1B)
    optimizer: AdamW
    hyperparameters:
      training_tokens: 10B per configuration
      seeds: 3
      batch_size: fixed
      learning_rate: fixed schedule
