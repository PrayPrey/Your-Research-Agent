  id: H-CPDR-v1
  title: Curation Parameter Dose-Response Hypothesis
  statement: Under LLM pretraining on English web text corpora, systematically varying data curation parameters (perplexity
    filtering threshold, deduplication stringency) produces quantifiable dose-response relationships with downstream benchmark
    performance, because an optimal balance exists between data quality and data diversity.
  defined_in: 03_refinement.yaml
