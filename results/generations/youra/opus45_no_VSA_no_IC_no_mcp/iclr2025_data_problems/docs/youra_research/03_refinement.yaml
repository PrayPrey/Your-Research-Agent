# ═══════════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Perplexity filtering improves LLM training quality"
      status: "BUILD_ON"
      evidence: "arXiv:2402.09668 (How to Train Data-Efficient LLMs), arXiv:2405.20541 (Perplexed by Perplexity)"
    - claim: "Deduplication reduces memorization and improves generalization"
      status: "BUILD_ON"
      evidence: "Standard practice in RedPajama, Dolma, DataComp-LM pipelines"
    - claim: "Small models (125M-1B) exhibit consistent benchmark behavior under controlled conditions"
      status: "BUILD_ON"
      evidence: "Scaling laws literature (Hoffmann et al., Chinchilla)"
    - claim: "Optimal curation parameters can be determined via systematic sweep"
      status: "PROVE_NEW"
      evidence: "DataComp demonstrated for vision; LLM version with confound control is novel"
    - claim: "Optimal parameters transfer across model scales"
      status: "PROVE_NEW"
      evidence: "Scaling laws show loss transfer, not curation optima transfer - untested"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims (perplexity filtering, deduplication effects, small model consistency) should not
    require verification protocols - these are established. PROVE_NEW claims (systematic dose-response
    mapping, cross-scale transfer) are the experimental targets.

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CPDR-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under LLM pretraining on English web text corpora, if data curation parameters
    (perplexity filtering threshold, deduplication stringency) are systematically varied
    in controlled ablation, then quantifiable dose-response relationships with downstream
    benchmark performance will emerge, because there exists an optimal balance between
    data quality (strict filtering) and data diversity (permissive filtering).
  alternative_hypothesis_h0: |
    There is no non-monotonic relationship between curation parameters and benchmark
    performance; stricter filtering always improves or always harms performance monotonically,
    or curation parameters have no measurable effect on downstream benchmarks.

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Perplexity Threshold"
      type: "categorical"
      operationalization: "KenLM 5-gram perplexity percentile cutoff (trained on Wikipedia)"
      levels: ["none", "p10", "p20", "p30", "p40", "p50", "p60", "p70", "p80", "p90"]
    - name: "Deduplication Stringency"
      type: "categorical"
      operationalization: "MinHash/exact deduplication configuration"
      levels: ["none", "fuzzy_0.7", "fuzzy_0.85", "exact", "exact_plus_fuzzy"]
    - name: "Model Size"
      type: "categorical"
      operationalization: "Transformer parameter count"
      levels: ["125M", "350M", "1B"]
  dependent:
    - name: "Benchmark Ensemble Score"
      type: "continuous"
      operationalization: "PC1 of [HellaSwag, ARC-Easy, PIQA, WinoGrande] accuracy scores"
      primary: true
    - name: "Individual Benchmark Scores"
      type: "continuous"
      operationalization: "Per-benchmark accuracy for diagnostics"
      primary: false
  controlled:
    - name: "Training Token Budget"
      operationalization: "Fixed at 10B tokens per configuration"
    - name: "Training Hyperparameters"
      operationalization: "Fixed learning rate schedule, batch size, architecture"
    - name: "Evaluation Set Integrity"
      operationalization: "Min-K%++ contamination check before evaluation"
    - name: "Random Seed"
      operationalization: "3 seeds per configuration for variance estimation"

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Low perplexity thresholds include noisy, irrelevant, or low-quality data"
      evidence: "Standard observation in data curation literature; high-perplexity samples often malformed"
      falsifier: "If no-filter baseline performs equivalently to filtered baselines"
    - step: 2
      description: "Noise in training data dilutes the learning signal, reducing sample efficiency"
      evidence: "Information theory; also Chinchilla scaling analysis"
      falsifier: "If benchmark performance is independent of data quality metrics"
    - step: 3
      description: "Excessively strict filtering removes diverse, edge-case, or domain-specific content"
      evidence: "arXiv:2405.20541 notes optimal thresholds vary; overly strict filtering harms coverage"
      falsifier: "If strictest filtering (p90) always outperforms moderate filtering"
    - step: 4
      description: "An optimal balance point exists where quality and diversity are maximized"
      evidence: "DataComp vision studies found such optima; hypothesized to apply to LLMs"
      falsifier: "If dose-response curve is monotonic (R² > 0.9 for linear fit)"
  key_tension: "Whether optimal thresholds are universal or domain/scale-specific"
  evidence_summary: |
    The mechanism is supported by information-theoretic arguments about signal dilution,
    empirical observations from DataComp (vision), and the fact that all major LLM pipelines
    (RedPajama, Dolma, C4) use intermediate filtering thresholds rather than extremes.

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "KenLM 5-gram perplexity is a valid proxy for data quality"
    supporting_evidence: "Used by CCNet, C4, RedPajama pipelines; correlates with human quality judgments"
    consequence_if_violated: "Would need alternative quality metric (classifier-based, BERT perplexity)"
  - id: "A2"
    assumption: "125M model benchmark behavior is informative for larger scales"
    supporting_evidence: "Scaling laws literature shows consistent relative ordering"
    consequence_if_violated: "Would need to run full sweep at 1B+ scale (10x compute increase)"
  - id: "A3"
    assumption: "MinHash deduplication with Jaccard threshold captures relevant near-duplicates"
    supporting_evidence: "Standard in text deduplication; validated against manual inspection"
    consequence_if_violated: "Semantic deduplication (embedding-based) might be required"
  - id: "A4"
    assumption: "Benchmark ensemble (HellaSwag, ARC-Easy, PIQA, WinoGrande) measures general reasoning"
    supporting_evidence: "These benchmarks target different reasoning facets; ensemble reduces noise"
    consequence_if_violated: "Would need task-specific analysis instead of aggregate score"
  - id: "A5"
    assumption: "10B tokens is sufficient to observe curation effects at 125M scale"
    supporting_evidence: "Chinchilla-optimal for 125M is ~2.5B; 10B provides 4x overtraining for signal"
    consequence_if_violated: "Would need longer training or smaller models"

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - English web text corpora (C4, RedPajama-v2, Common Crawl derivatives)
    - LLM pretraining (not fine-tuning or instruction tuning)
    - Decoder-only transformer architectures
    - Model sizes 125M-1B (with validation at larger scales)
  does_not_apply_to: |
    - Code corpora (different quality/perplexity distributions)
    - Multilingual corpora (perplexity metrics not validated cross-lingually)
    - Instruction/chat tuning data (different quality criteria)
    - Multimodal data (image-text pairs have different curation considerations)
  known_limitations: |
    - Results may not transfer to specialized domains (code, scientific text)
    - Optimal thresholds may shift with corpus source (Common Crawl vs curated web)
    - Cross-scale transfer (125M→7B+) remains to be validated
    - Does not address interaction effects between perplexity and dedup (future work)

# ═══════════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "At least one curation parameter (perplexity or deduplication) shows non-monotonic (concave) dose-response relationship with benchmark ensemble score, with a measurable peak"
    test_method: "Polynomial regression with AIC/BIC model selection across parameter sweep"
    success_criterion: "Quadratic or higher-order model selected over linear; peak identifiable within parameter range"
    falsification: "R² > 0.9 for linear (monotonic) fit across all parameters"
  - id: "P2"
    primary: true
    statement: "CPDR-optimized parameter configuration outperforms RedPajama literature defaults by >1% on benchmark ensemble"
    test_method: "Train model with CPDR-selected params vs RedPajama defaults; compare mean benchmark scores"
    success_criterion: "CPDR config mean > RedPajama mean + 1% (absolute), p < 0.05"
    falsification: "No configuration beats RedPajama by >1% with statistical significance"
  - id: "P3"
    primary: false
    statement: "Optimal parameter values at 125M scale are within ±20% of optima at 1B scale"
    test_method: "Identify optima at 125M via sweep; validate at 1B via targeted runs"
    success_criterion: "Optimal perplexity threshold at 1B within ±2 percentile points of 125M optimum"
    falsification: "Optima differ by >20% (>2 percentile points) across scales"

