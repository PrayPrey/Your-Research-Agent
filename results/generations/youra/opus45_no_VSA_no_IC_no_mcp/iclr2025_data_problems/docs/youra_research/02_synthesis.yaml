hypothesis_draft:
  title: "Curation Parameter Dose-Response (H-CPDR)"
  hypothesis_id: "H-CPDR-v1"
  core_claim: |
    For LLM pretraining on English web text, data curation parameters (perplexity filtering
    threshold, deduplication stringency) exhibit quantifiable dose-response relationships
    with downstream benchmark performance. Optimal parameter values can be empirically
    determined through controlled ablation and outperform literature defaults.
  mechanism: |
    1. Low perplexity thresholds include noisy data that dilutes learning signal
    2. High perplexity thresholds exclude diverse content, reducing coverage
    3. An optimal balance exists that maximizes both quality and diversity
    4. This optimum can be identified through systematic parameter sweeps
  predictions:
    - P1: "At least one parameter shows non-monotonic dose-response with measurable peak"
    - P2: "CPDR-optimized parameters outperform RedPajama defaults by >1%"
    - P3: "Optimal values at 125M scale transfer within ±20% to 1B scale"

variables_summary:
  independent: "Perplexity threshold (10 levels), Deduplication stringency (5 levels), Model size (3 levels)"
  dependent_primary: "Benchmark ensemble score (PC1 of HellaSwag, ARC-Easy, PIQA, WinoGrande)"
  controlled: "Training tokens (10B fixed), hyperparameters, contamination check, 3 seeds"

null_hypothesis:
  h0_statement: |
    There is no non-monotonic relationship between curation parameters and benchmark
    performance. Curation effects are either monotonic (stricter always better/worse)
    or negligible (no measurable impact).
  statistical_test: "Polynomial regression with AIC/BIC model selection; t-test for baseline comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled dose-response study for LLM curation with fixed-token confound control"
  differentiation_summary: |
    Prior work (DataComp, RedPajama, Dolma) either focused on vision or varied multiple
    parameters simultaneously. This study isolates individual curation parameters while
    controlling for dataset size via fixed-token design.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

