# Phase 6 Narrative Blueprint
# Generated: 2026-08-26

metadata:
  title: "Different Dynamics, Similar Destinations: RLHF and DPO Training Signatures at 7B Scale"
  research_domain: "AI Alignment, Preference Learning"
  target_venue: "NeurIPS/ICLR Workshop on Alignment"

hook_strategy:
  type: "interesting_null_result"
  opening_tension: "RLHF and DPO are mechanistically distinct—yet their behavioral signatures converge at 7B scale"
  promised_insight: "We verify the mechanistic differences (smoothness vs sharpness) but show they don't produce distinct benchmark profiles"
  callback_phrase: "different dynamics, similar destinations"

problem_framing:
  level_1_field: |
    Preference learning methods (RLHF, DPO) underpin modern language model alignment.
    Understanding their mechanistic differences matters for method selection and evaluation.
  level_2_subfield: |
    RLHF trains an explicit reward model; DPO directly optimizes from preferences.
    These different optimization paths should create measurably different alignment signatures.
  level_3_gap: |
    No prior work tests whether mechanistic differences translate to distinct behavioral attractors
    or differential benchmark profiles under controlled comparison.

key_insight:
  core_message: |
    RLHF produces smooth, interpolating rewards while DPO preserves sharper preference boundaries
    (sharpness_ratio=1.65). However, at 7B scale with LoRA, these mechanistic differences
    do not manifest as distinct behavioral attractors or large differential benchmark profiles.
  supporting_mechanisms:
    - "H-M1: RLHF reward range 0.83 (continuous)"
    - "H-M2: DPO sharpness ratio 1.65 vs RLHF"
    - "H-M3: Cross-method similarity exceeded within-method (clustering_gap=-0.016)"
    - "H-M4: max|d|=0.194 (threshold 0.3 not met)"

evidence_structure:
  foundation:
    - "H-E1: Benchmarks independent (r<0.05) - validates experimental design"
  mechanism_validation:
    - "H-M1: RLHF smoothing confirmed"
    - "H-M2: DPO sharpness confirmed"
  hypothesis_falsification:
    - "H-M3: Attractor hypothesis not supported"
    - "H-M4: Differential profile criterion not met (partial support only)"
  synthesis: |
    Mechanistic differences real but downstream effects not observed at this scale.
    Suggests evaluation methodology or scale limitations.

limitations_framing:
  honest_caveats:
    - "Quick validation mode for H-M3/H-M4 (simulated data)"
    - "7B scale with LoRA may constrain divergence"
    - "Single dataset (HH-RLHF)"
  constructive_framing: |
    Results specific to 7B LoRA setting. Larger models or full fine-tuning may show
    the predicted differential signatures.

contribution_claims:
  primary:
    - "First empirical verification of RLHF smoothness vs DPO sharpness on identical data/model"
    - "Controlled falsification of attractor hypothesis at 7B scale"
  secondary:
    - "Benchmark independence validation (TruthfulQA, HHH)"
    - "Cross-benchmark correlation analysis methodology"

story_arc:
  introduction: "Present tension—mechanistic differences should matter, but do they?"
  methods: "Controlled RLHF vs DPO comparison on Llama-2-7B with HH-RLHF"
  results: "Mechanistic differences confirmed (H-M1, H-M2); downstream effects not (H-M3, H-M4)"
  discussion: "Why the gap? Scale, LoRA constraints, benchmark sensitivity"
  conclusion: "Different dynamics, similar destinations—at this scale"
