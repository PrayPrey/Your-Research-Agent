hypothesis_draft:
  title: "Dimensional Alignment Signatures: Cross-Benchmark Comparison of RLHF vs DPO"
  hypothesis_id: "H-DimensionalAlignmentSignatures-v1"
  core_claim: |
    Different preference learning methods (PPO-based RLHF vs DPO) produce measurably
    different alignment profiles when evaluated across multiple existing benchmarks,
    revealing that alignment is multi-dimensional rather than monolithic.
  mechanism: |
    PPO-RLHF trains an explicit reward model that smooths the preference landscape,
    while DPO's closed-form objective preserves sharper preference boundaries.
    This mechanistic difference manifests as differential performance across
    benchmarks targeting different alignment dimensions (truthfulness, helpfulness,
    harmlessness).
  predictions:
    - P1: "At least one benchmark shows divergence (d > 0.3) while others remain similar (d < 0.15)"
    - P2: "Cross-benchmark correlations differ between methods"
    - P3: "Data ablation produces method-dependent profile shifts"

variables_summary:
  independent: "Training method (RLHF-PPO vs DPO)"
  dependent_primary: "Cross-benchmark performance profile (TruthfulQA accuracy, HHH-helpful, HHH-harmless scores)"
  controlled: "Base model (Llama-2-7B), preference data (HH-RLHF), compute budget, evaluation protocol"

null_hypothesis:
  h0_statement: |
    There is no significant difference in cross-benchmark performance profiles
    between DPO and RLHF-trained models. All pairwise comparisons will show
    Cohen's d < 0.15.
  statistical_test: "Independent samples t-tests with Bonferroni correction across benchmarks"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Cross-benchmark dimensional signature detection as probe into alignment method mechanisms"
  differentiation_summary: |
    Prior work compares RLHF vs DPO on single benchmarks (aggregate performance).
    This work examines cross-benchmark patterns to reveal dimensional signatures,
    shifting alignment evaluation from monolithic scoring to multi-dimensional profiling.

