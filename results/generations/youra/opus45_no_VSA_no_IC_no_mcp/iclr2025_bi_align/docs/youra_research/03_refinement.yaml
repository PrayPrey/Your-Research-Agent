# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "training_method"
      type: "categorical"
      operationalization: "Alignment training algorithm applied to base model"
      levels:
        - "RLHF-PPO"
        - "DPO"
  dependent:
    - name: "truthfulqa_accuracy"
      type: "continuous"
      operationalization: "Accuracy on TruthfulQA benchmark (0-1 scale, ~800 questions)"
      primary: true
    - name: "hhh_helpful_score"
      type: "continuous"
      operationalization: "Score on HHH helpfulness evaluation subset"
      primary: false
    - name: "hhh_harmless_score"
      type: "continuous"
      operationalization: "Score on HHH harmlessness evaluation subset"
      primary: false
    - name: "cross_benchmark_correlation"
      type: "continuous"
      operationalization: "Pearson correlation between benchmark scores within method"
      primary: false
  controlled:
    - name: "base_model"
      operationalization: "Llama-2-7B with identical initialization"
    - name: "preference_data"
      operationalization: "Anthropic HH-RLHF dataset (same subset for both methods)"
    - name: "compute_budget"
      operationalization: "Equivalent training steps/epochs, LoRA rank, batch size"
    - name: "evaluation_protocol"
      operationalization: "Identical prompts, sampling parameters, scoring rubric"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "PPO-RLHF trains an explicit reward model from preference pairs, learning a smooth approximation of human preferences"
      evidence: "Standard RLHF pipeline (Ouyang et al. 2022, Bai et al. 2022)"
      falsifier: "Reward model produces non-smooth, discontinuous reward landscape"
    - step: 2
      description: "DPO directly optimizes policy from preferences without intermediate reward model, preserving sharper preference boundaries"
      evidence: "DPO closed-form derivation (Rafailov et al. 2023)"
      falsifier: "DPO produces equally smooth optimization landscape as RLHF"
    - step: 3
      description: "Smooth vs sharp optimization landscapes create different alignment 'attractors' - stable configurations the model converges to"
      evidence: "Theoretical expectation from optimization landscape literature"
      falsifier: "Both methods converge to identical attractors regardless of landscape shape"
    - step: 4
      description: "Different attractors manifest as differential performance across benchmarks measuring distinct alignment dimensions"
      evidence: "To be tested - core novel claim"
      falsifier: "No measurable difference in cross-benchmark profiles (d < 0.15 everywhere)"
  key_tension: "Whether reward model smoothing vs direct optimization actually produces measurably different alignment profiles, or methods are functionally equivalent"
  evidence_summary: |
    Steps 1-2 are established (RLHF and DPO use different optimization paths).
    Steps 3-4 are the novel claims to test: that these paths create distinct
    alignment signatures detectable on existing benchmarks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Existing benchmarks (TruthfulQA, HHH-helpful, HHH-harmless) measure sufficiently distinct alignment dimensions"
    supporting_evidence: "Benchmarks designed to target different aspects (truthfulness, helpfulness, harmlessness)"
    consequence_if_violated: "Cross-benchmark patterns may be artifacts of shared variance, not dimensional signatures"
  - id: "A2"
    assumption: "7B model scale is sufficient to observe method differences if they exist"
    supporting_evidence: "Both DPO and RLHF show effects at 7B scale in prior work"
    consequence_if_violated: "Results may not generalize; larger models might show different patterns"
  - id: "A3"
    assumption: "HH-RLHF dataset quality equally supports both training methods"
    supporting_evidence: "Dataset used successfully for both DPO and RLHF in published work"
    consequence_if_violated: "One method may be disadvantaged by data characteristics"
  - id: "A4"
    assumption: "Reward model training quality can be controlled to ensure fair RLHF comparison"
    supporting_evidence: "Standard practices exist (held-out validation, early stopping)"
    consequence_if_violated: "Poor reward model would create unfair comparison against DPO"
  - id: "A5"
    assumption: "Benchmark sample sizes provide sufficient statistical power for effect detection"
    supporting_evidence: "TruthfulQA ~800 samples sufficient for d=0.3 at 80% power"
    consequence_if_violated: "May miss real effects due to underpowered tests"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - 7B-scale instruction-tuned language models
    - English language alignment benchmarks
    - Preference learning methods with explicit comparison (RLHF-PPO vs DPO)
    - Settings where alignment trade-offs matter for deployment decisions
  does_not_apply_to: |
    - Larger models (70B+) where scaling effects may dominate
    - Non-English alignment evaluation
    - Other alignment methods (RLAIF, Constitutional AI, etc.) without explicit comparison
    - Real-time deployment latency considerations
  known_limitations: |
    - Single base model family (Llama-2); results may not generalize to other architectures
    - Reward model quality sensitivity in RLHF comparison
    - Benchmark correlation assumption requires pre-test validation

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "DPO and PPO-RLHF will show significantly different performance profiles: at least one benchmark shows divergence (Cohen's d > 0.3) while others remain similar (d < 0.15)"
    test_method: "Train both methods on same data, evaluate on TruthfulQA/HHH benchmarks, compute pairwise effect sizes"
    success_criterion: "At least one benchmark pair shows d > 0.3 AND at least one shows d < 0.15 (differential profile)"
    falsification: "All benchmark comparisons show d < 0.15 OR all show d > 0.3 (no differential profile)"
  - id: "P2"
    primary: false
    statement: "Cross-benchmark correlations will differ between methods: DPO models show lower correlation between truthfulness and helpfulness scores than RLHF models"
    test_method: "Compute Pearson correlation between benchmark scores within each method group"
    success_criterion: "Significant difference in correlation coefficients (Fisher z-test, p < 0.05)"
    falsification: "Correlation coefficients statistically indistinguishable between methods"
  - id: "P3"
    primary: false
    statement: "Data ablation (emphasis on helpful vs harmless examples) produces method-dependent profile shifts of different magnitudes"
    test_method: "Subsample HH-RLHF toward helpful/harmless, train both methods, measure profile shift"
    success_criterion: "Interaction effect significant: data emphasis × method on benchmark profile"
    falsification: "No interaction effect: both methods respond identically to data emphasis"

