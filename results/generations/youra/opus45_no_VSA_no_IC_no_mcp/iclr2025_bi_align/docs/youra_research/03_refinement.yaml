# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "DPO and RLHF achieve similar aggregate performance on individual benchmarks"
      status: "BUILD_ON"
      evidence: "Rafailov et al. 2023 demonstrated DPO matches or exceeds RLHF on single benchmarks"
    - claim: "HH-RLHF dataset supports both RLHF and DPO training methods"
      status: "BUILD_ON"
      evidence: "Anthropic's public HH-RLHF dataset used in both DPO and RLHF papers"
    - claim: "TruthfulQA, HHH, and BIG-bench are validated alignment benchmarks"
      status: "BUILD_ON"
      evidence: "Published benchmarks with established evaluation protocols"
    - claim: "Different preference learning methods produce measurably different alignment profiles across multiple benchmarks"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis - no prior work systematically compared cross-benchmark profiles under controlled conditions"
  scope_reduction_percentage: 75
  phase2b_4_instructions: |
    Skip re-verification of established facts (BUILD_ON claims).
    Focus verification efforts on the PROVE_NEW claim: dimensional signature detection.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DimensionalAlignmentSignatures-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under controlled conditions (same base model, same preference data, same compute budget),
    if we compare PPO-based RLHF and Direct Preference Optimization (DPO),
    then we will observe differential performance profiles across alignment benchmarks
    (TruthfulQA, HHH-helpful, HHH-harmless),
    because the methods' mechanistic differences (explicit reward model smoothing vs
    direct closed-form optimization) create distinct alignment signatures detectable
    on existing evaluation infrastructure.
  alternative_hypothesis_h0: |
    There is no significant difference in cross-benchmark performance profiles between
    DPO and RLHF-trained models. All pairwise benchmark comparisons will show
    Cohen's d < 0.15.

