main_hypothesis:
  id: H-DimensionalAlignmentSignatures-v1
  title: 'Dimensional Alignment Signatures: Cross-Benchmark Comparison of RLHF vs DPO'
  statement: Under controlled conditions (same base model, same preference data, same compute budget), if we compare PPO-based
    RLHF and Direct Preference Optimization (DPO), then we will observe differential performance profiles across alignment
    benchmarks (TruthfulQA, HHH-helpful, HHH-harmless), because the methods' mechanistic differences (explicit reward model
    smoothing vs direct closed-form optimization) create distinct alignment signatures detectable on existing evaluation infrastructure.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Anthropic HH-RLHF
    model: Llama-2-7B
    optimizer: AdamW
    hyperparameters:
      training_method:
      - RLHF-PPO
      - DPO
      compute_budget: equivalent
