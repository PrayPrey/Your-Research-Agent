experimental_scope:
  models:
    - "SimCLR (ResNet-50, 200 epochs)"
    - "MoCo-v2 (ResNet-50, 200 epochs)"
    - "DINO (ResNet-50, 200 epochs)"
  datasets:
    - "Waterbirds (landbird/waterbird × land/water background; 4 groups)"
    - "CelebA (blond/nonblond hair × male/female; 4 groups)"
    - "CMNIST (digit × background color; spurious correlation strength 0.9)"
  baselines:
    - "SGD-trained SSL (SimCLR/MoCo/DINO) — primary comparison"
    - "LFR annotation-free (Ghaznavi 2023) on SSL features"
    - "EVaLS (2024) on SSL features"
    - "JTT (Liu 2021) annotation-free on SSL features"
    - "Group DRO (Sagawa 2019) — oracle upper bound (uses group labels)"

measurement_plan:
  data_collection:
    - source: "Waterbirds dataset from kohpangwei/group_DRO"
    - source: "CelebA from PyTorch/torchvision official loader"
    - source: "CMNIST from torchvision with spurious correlation injection (p=0.9)"
  procedure:
    - step: "Train SSL models (SimCLR/MoCo/DINO × SGD/SAM/ASAM) for 200 epochs — 9 training runs"
    - step: "Save checkpoints at epochs 50, 100, 150, 200 for each run"
    - step: "Train linear probe on frozen representations (100 epochs, SGD, lr=0.01, no group labels)"
    - step: "Compute linear probe loss distribution — identify top-25% high-loss samples as spurious proxy directions"
    - step: "Measure SAM perturbation loss increase along spurious proxy directions vs. 100 random direction samples (rho=0.05, same as SAM training)"
    - step: "Compute sharpness anisotropy ratio = spurious_sharpness / random_sharpness"
    - step: "Evaluate worst-group accuracy using standard group_DRO protocol (group labels used ONLY for evaluation)"
    - step: "Compute Pearson r between anisotropy ratio and worst-group accuracy across checkpoints"
  success_criteria:
    - "P1: anisotropy ratio > 1.2 AND |r| > 0.5 in ≥7/9 model-dataset pairs"
    - "P2: SAM anisotropy ratio ≤ 0.85 × SGD AND majority accuracy drop < 2pp in ≥2/3 datasets"
    - "P3: worst-group accuracy improvement ≥2pp on ≥2/3 datasets for ≥1 SSL method"

validation:
  internal_validity:
    - "Use identical linear probe protocol across all SSL methods and optimizers to control for evaluation variance"
    - "Measure majority accuracy alongside minority accuracy to detect fake flat minima (uniform flattening)"
    - "Include ASAM variant to check sensitivity to SAM hyperparameter (rho vs. adaptive rho)"
    - "Validate linear probe proxy quality: report precision/recall vs. ground-truth group labels in evaluation-only mode"
  external_validity:
    - "Test across 3 distinct spurious correlation benchmarks (different spurious feature types: texture/background, appearance, color)"
    - "Test across 3 SSL architectures (SimCLR/MoCo-v2/DINO — different contrastive objectives)"
    - "Compare against established annotation-free baselines (LFR, EVaLS, JTT) to contextualize absolute improvement"

discussion_synthesis:
  key_insights:
    - "Gatmiry's rank-1 simplicity bias result for supervised SAM does NOT automatically transfer to InfoNCE SSL — the InfoNCE landscape's uniform distribution pressure creates qualitatively different dynamics. This is the central theoretical uncertainty and the motivation for empirical test."
    - "The annotation-free constraint is fully satisfiable: SAM training needs no labels; measurement uses linear probe loss variance as proxy (LFR-validated mechanism); evaluation uses group labels only for metrics."
    - "Two-part hypothesis (diagnostic P1 + intervention P2/P3) ensures scientific value regardless of outcome: if P1 fails, SSL doesn't have the anisotropy mechanism; if P1 succeeds but P3 fails, anisotropy exists but SAM's fake flat minima problem dominates."
    - "Fake flat minima (DGSAM's failure mode) is diagnostically distinguishable from true shortcut reduction by checking majority accuracy preservation — built into the measurement plan."
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Revealed that Gatmiry's theory predicts SAM → MORE shortcuts (rank-1 = simpler = spurious), requiring a theoretical counter-argument for the InfoNCE setting."
    - "Exchange 7 (Dr. Nova): InfoNCE landscape argument — uniform distribution pressure with no single rank-1 attractor makes the simplicity bias transfer non-obvious and empirically testable."
    - "Exchange 6 (Prof. Rex) + Exchange 7 (Dr. Nova): Annotation problem identified and resolved — use LFR's loss variance proxy instead of Izmailov's group-label-requiring subspace extraction."
  resolved_tensions:
    - "Tension: Gatmiry rank-1 result suggests SAM → more shortcuts. Resolution: InfoNCE landscape differs from supervised cross-entropy; empirical test is the answer."
    - "Tension: 'annotation-free' measurement requires group labels in Izmailov's approach. Resolution: use linear probe loss variance proxy (LFR protocol) — validated annotation-free."
    - "Tension: Fake flat minima (DGSAM) — SAM may flatten everything uniformly, not selectively. Resolution: distinguishable failure mode — uniform flattening + no worst-group improvement vs. selective flattening + improvement. Built into measurement design."
