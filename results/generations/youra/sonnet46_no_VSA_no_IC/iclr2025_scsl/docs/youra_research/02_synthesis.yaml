hypothesis_draft:
  title: "SAM-SSL Sharpness Anisotropy Hypothesis for Spurious Correlation Reduction"
  hypothesis_id: "H-SAMSSL-v1"
  core_claim: |
    SSL models (SimCLR/MoCo/DINO) trained on spurious correlation benchmarks develop
    anisotropic loss landscapes: higher Hessian sharpness along spurious feature directions
    (identifiable via linear-probe loss variance proxy, annotation-free) than along random
    directions. This anisotropy predicts worst-group accuracy. SAM during SSL pre-training
    reduces this anisotropy and improves worst-group accuracy by ≥2pp on ≥2/3 benchmarks
    (Waterbirds/CelebA/CMNIST) without group annotations.
  mechanism: |
    SSL contrastive pre-training (InfoNCE) creates a loss landscape with anisotropic curvature:
    shortcut features (spurious, low-rank) correspond to sharper loss landscape directions than
    core features. SAM's perturbation-based optimization flattens these sharper directions during
    training. In SSL's InfoNCE landscape (unlike supervised cross-entropy), SAM's flattening
    may preferentially target spurious directions because they are sharper, without the rank-1
    simplicity bias that Gatmiry (2024) proves for supervised settings. The intervention is
    annotation-free because SAM operates only on the loss gradient; the diagnostic measurement
    uses linear-probe loss variance as a proxy for spurious direction identification (LFR protocol).
  predictions:
    - P1: "Sharpness anisotropy (spurious vs. random direction, ratio > 1.2) correlates negatively with worst-group accuracy across SSL model checkpoints (r < -0.5, p < 0.05)"
    - P2: "SAM training reduces spurious anisotropy ratio by ≥15% vs. SGD, preserving majority accuracy within 2pp"
    - P3: "SAM-trained SSL improves worst-group accuracy ≥2pp on ≥2/3 datasets vs. SGD baseline"

variables_summary:
  independent: "Optimizer (SAM rho=0.05 / ASAM rho=0.5 / SGD baseline) × SSL method (SimCLR/MoCo-v2/DINO) × Dataset (Waterbirds/CelebA/CMNIST)"
  dependent_primary: "Worst-group accuracy (standard kohpangwei/group_DRO protocol)"
  controlled: "ResNet-50 backbone, identical augmentation pipeline, identical linear probe evaluation, 200 pre-training epochs"

null_hypothesis:
  h0_statement: |
    There is no significant difference in worst-group accuracy between SAM-trained and
    SGD-trained SSL models on Waterbirds, CelebA, and CMNIST (< 1pp on all three).
    Equivalently, loss landscape sharpness anisotropy along spurious feature directions
    does not correlate with worst-group accuracy (|r| < 0.2, p > 0.05).
  statistical_test: "Paired t-test (SAM vs. SGD worst-group accuracy across 3 datasets × 3 SSL methods); Pearson correlation for P1"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical measurement of loss landscape sharpness anisotropy along spurious feature directions in SSL models; first annotation-free SSL pre-training optimizer intervention for spurious correlation benchmarks"
  differentiation_summary: |
    G2-SAM (Ji 2025): group-aware SAM, supervised, annotation-required — this work: annotation-free, SSL.
    DGSAM (Song 2025): domain generalization, not spurious correlation benchmarks — different target.
    Cross-Variant SSL (Yadav 2026): augmentation-based, not optimizer-based — orthogonal mechanism.
    LFR/EVaLS: post-hoc reweighting on fixed representations — this work intervenes during pre-training.
    Gatmiry (2024): theory for supervised cross-entropy — this work tests empirically in SSL InfoNCE setting.

