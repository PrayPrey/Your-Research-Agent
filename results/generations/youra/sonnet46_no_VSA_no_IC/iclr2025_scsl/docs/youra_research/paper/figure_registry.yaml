figures:
  - id: "fig_1"
    original_name: "fig_wga_comparison.png"
    source: "paper/figures/fig_wga_comparison.png"
    target: "figures/fig_wga_comparison.png"
    caption: "Worst-group accuracy (WGA) and average accuracy of DINO (SSL) vs. Supervised training on Waterbirds. SSL achieves only 8.6% WGA vs. 81.9% for supervised—a 73.4 pp gap—despite comparable average accuracy (62.1% vs. 94.7%), confirming severe spurious correlation encoding in SSL representations."
    section: "results"
    width: "0.9\\textwidth"
    phase: "phase_4"

  - id: "fig_2"
    original_name: "fig_training_dynamics.png"
    source: "paper/figures/fig_training_dynamics.png"
    target: "figures/fig_training_dynamics.png"
    caption: "Validation WGA and average accuracy over 100 training epochs for DINO (SSL, left) and supervised (right) on Waterbirds. SSL average accuracy converges normally while WGA stagnates below 25%, demonstrating that shortcut encoding persists through training. Supervised WGA rapidly improves, revealing that the SSL objective itself—not training duration—drives the disparity."
    section: "results"
    width: "0.95\\textwidth"
    phase: "phase_4"

  - id: "fig_3"
    original_name: "fig_group_accuracy.png"
    source: "paper/figures/fig_group_accuracy.png"
    target: "figures/fig_group_accuracy.png"
    caption: "Per-group test accuracy across four Waterbirds groups for DINO (SSL) and supervised models. SSL catastrophically fails on minority groups (waterbird on land: 8.6%, landbird on water: 36.5%), while supervised achieves ≥82% on all groups. This asymmetric failure pattern is the geometric signature this work seeks to diagnose and address."
    section: "results"
    width: "0.9\\textwidth"
    phase: "phase_4"

