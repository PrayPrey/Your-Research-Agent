# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "SSL pre-training with SGD creates anisotropic loss landscape: sharper curvature along spurious feature directions than along core feature directions. Spurious features (e.g., background in Waterbirds) correspond to lower-rank, simpler representations that the contrastive loss can exploit as shortcuts during training."
      evidence: "Theoretical: Gatmiry et al. (2024) proves simplicity bias in sharpness minimization; SCER (Park et al. 2025) theoretically links embedding geometry to worst-group error; empirically, CLIP shows 80.7pp avg-worst gap (Zhang & Ré, 2022)"
      falsifier: "If SSL models trained on spurious benchmarks show NO sharpness anisotropy (uniform Hessian spectrum), Step 1 fails and the mechanism doesn't apply"
    - step: 2
      description: "Linear probe trained on downstream task exhibits high loss variance for minority group samples (e.g., waterbirds on land). This loss variance distribution identifies the spurious feature directions in representation space without group annotations — following the same proxy mechanism validated by LFR (Ghaznavi et al., 2023)."
      evidence: "LFR (2023): high-loss proxy successfully identifies minority group members on Waterbirds/CelebA without group labels, achieving annotation-free DFR comparable to oracle-labeled DFR"
      falsifier: "If linear probe loss variance fails to correlate with minority group membership (precision/recall < 0.6), the annotation-free proxy is invalid"
    - step: 3
      description: "SAM optimizer, applied during SSL pre-training, reduces Hessian sharpness preferentially along the spurious feature directions (those with high loss variance under linear probe). The InfoNCE loss landscape differs from supervised cross-entropy: no single rank-1 attractor exists, so SAM's flattening effect distributes more broadly, potentially reducing spurious direction sharpness without eliminating core feature sharpness."
      evidence: "Theoretical: InfoNCE creates uniform distribution pressure (von Mises-Fisher concentration) with multiple attractors, unlike supervised cross-entropy's single rank-1 attractor (Gatmiry 2024); empirical precedent: G2-SAM reduces group-wise sharpness in supervised setting"
      falsifier: "If SAM training shows no reduction in spurious direction sharpness vs. SGD (measured by SAM perturbation loss increase ratio), or shows fake flat minima (all directions flatten equally with no worst-group improvement), Step 3 fails"
    - step: 4
      description: "Reduced spurious direction sharpness → SSL representation encodes core features more prominently than spurious features → linear probe trained on these representations achieves higher worst-group accuracy on spurious correlation benchmarks."
      evidence: "G2-SAM (Ji et al. 2025) shows group-wise sharpness reduction → improved worst-group accuracy in supervised setting; Cross-Variant SSL (Yadav 2026) shows view diversity improves worst-group accuracy via representation change"
      falsifier: "If worst-group accuracy does not improve despite sharpness anisotropy reduction (< 1pp improvement on all datasets), Step 4 fails — reduced anisotropy is necessary but not sufficient"
  key_tension: "Gatmiry et al. (2024) prove SAM promotes rank-1/simplicity bias in supervised cross-entropy — and spurious features tend to be simpler (lower rank) than core features. If this transfers to InfoNCE, SAM would INCREASE shortcut reliance. The InfoNCE uniform distribution pressure argument is theoretically motivated but unproven — this is the central empirical question."
  evidence_summary: |
    Convergent evidence from: (1) theoretical link between sharpness and simplicity bias (Gatmiry 2024);
    (2) practical annotation-free proxy validity (LFR 2023); (3) SAM's worst-group improvement in supervised
    setting (G2-SAM 2025); (4) confirmed SSL shortcut problem (Zhang & Ré 2022). Key counter-evidence:
    DGSAM's fake flat minima risk (Song 2025) and Schliserman's flat minima critique (2025). The InfoNCE
    landscape difference is the theoretical hinge — empirically unresolved.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The InfoNCE landscape is qualitatively different from supervised cross-entropy landscape in ways that prevent direct application of Gatmiry's rank-1 simplicity bias result to SSL"
    supporting_evidence: "InfoNCE creates uniform distribution pressure (von Mises-Fisher) with no single rank-1 attractor; supervised cross-entropy has a single rank-1 attractor per Gatmiry's proof"
    consequence_if_violated: "If InfoNCE landscape has same rank-1 dynamics as supervised loss, SAM would increase rather than decrease spurious feature reliance — P3 would fail and the intervention is counterproductive"
  - id: "A2"
    assumption: "Linear probe loss variance is a valid annotation-free proxy for minority group membership and spurious feature direction identification in SSL representations"
    supporting_evidence: "LFR (Ghaznavi 2023) validates this proxy for supervised ERM representations on Waterbirds/CelebA; EVaLS uses similar mechanism"
    consequence_if_violated: "If proxy precision/recall < 0.6, the spurious direction measurement is invalid and P1 cannot be meaningfully tested"
  - id: "A3"
    assumption: "Hessian sharpness anisotropy (spurious vs. random direction curvature ratio) is the relevant geometric property linking loss landscape to shortcut reliance, not other properties like curvature sign or global flatness"
    supporting_evidence: "SCER (Park 2025) theoretically links embedding geometry to worst-group error; SAM perturbation naturally measures directional sharpness"
    consequence_if_violated: "Anisotropy may exist but not predict worst-group accuracy — other landscape properties (e.g., gradient alignment, loss curvature sign) may be the relevant diagnostic"
  - id: "A4"
    assumption: "Standard SSL augmentation (crop, color jitter, flip) leaves spurious feature content consistent enough across views that SAM's landscape flattening (not view diversity) is the primary mechanism of shortcut reduction"
    supporting_evidence: "Cross-Variant SSL (Yadav 2026) uses generative augmentation to actually remove spurious content; our hypothesis relies on optimizer-level intervention, not augmentation change"
    consequence_if_violated: "If spurious features are already randomized by standard augmentation, there is nothing for SAM to target — the baseline SSL model would already have low shortcut reliance"
  - id: "A5"
    assumption: "SAM's 2x computational cost per step does not require prohibitively long training to reach convergence on ResNet-50 SSL training"
    supporting_evidence: "davda54/sam is widely used for 200-epoch ResNet-50 training in supervised settings; pyssl supports standard SSL training loops"
    consequence_if_violated: "Not a feasibility concern (Prof. Pax: this is a cost/resource issue, not a scientific barrier); training completes with sufficient compute"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - SSL pre-training methods with InfoNCE-type contrastive objectives: SimCLR, MoCo-v2, DINO
    - Spurious correlation benchmarks with existing worst-group evaluation protocols: Waterbirds, CelebA (hair color), CMNIST
    - ResNet-50 backbone (primary setting)
    - Annotation-free setting: no group labels at training time
    - Binary spurious correlation structure (core feature vs. single spurious feature)
  does_not_apply_to: |
    - Supervised pre-training (different loss landscape — Gatmiry's theory applies directly)
    - Multi-attribute spurious correlation settings (UrbanCars: out of scope for primary analysis)
    - Foundation models / large-scale SSL (CLIP, DINOv2): different scale regime
    - Augmentation-based spurious correlation removal (Cross-Variant SSL approach)
    - Settings requiring group labels at training time (Group DRO, G2-SAM)
  known_limitations: |
    - ResNet-50 results may not generalize to ViT architectures (different loss landscape geometry)
    - Linear probe loss variance proxy may underperform LFR's full resampling approach
    - ASAM (adaptive SAM) may behave differently from standard SAM — treated as variant
    - UrbanCars benchmark excluded due to multi-attribute complexity; include in extended analysis if primary results are positive
    - The InfoNCE landscape argument is theoretical motivation; empirical outcome may contradict it

