# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "SSL models (SimCLR/MoCo/DINO) trained with SGD on Waterbirds/CelebA/CMNIST exhibit statistically significant sharpness anisotropy: SAM perturbation loss increase along spurious directions (identified via linear probe loss variance proxy) is higher than along random directions (ratio > 1.2), and this anisotropy ratio correlates negatively with worst-group accuracy across at least 5 model checkpoints per SSL method per dataset (Pearson r < -0.5, p < 0.05)"
    test_method: "Train 3 SSL methods × 3 datasets × SGD baseline (9 models). For each: train linear probe → identify high-loss-variance directions → measure SAM perturbation loss increase ratio (spurious vs. random, 100 random samples). Compute Pearson r between anisotropy ratio and worst-group accuracy across checkpoints."
    success_criterion: "Anisotropy ratio > 1.2 AND |r| > 0.5, p < 0.05 in at least 7/9 model-dataset combinations"
    falsification: "Anisotropy ratio ≈ 1.0 (no anisotropy) OR |r| < 0.2 (no correlation with worst-group accuracy)"
  - id: "P2"
    primary: false
    statement: "SAM-trained SSL models (rho=0.05) show reduced sharpness anisotropy ratio vs. SGD-trained models at convergence on Waterbirds/CelebA/CMNIST: the spurious-to-random sharpness ratio is lower in SAM models (ratio reduction ≥ 15%) AND majority group linear probe accuracy is preserved (< 2pp drop vs. SGD baseline)"
    test_method: "Train SAM variants (SAM rho=0.05, ASAM rho=0.5) for each SSL method × dataset combination. Measure anisotropy ratio at final checkpoint. Compare vs. SGD baseline. Measure majority-group linear probe accuracy to detect fake flat minima."
    success_criterion: "SAM anisotropy ratio ≤ 0.85 × SGD anisotropy ratio AND majority accuracy drop < 2pp in at least 2/3 datasets"
    falsification: "SAM anisotropy ratio ≥ SGD anisotropy ratio OR majority accuracy drops > 5pp (fake flat minima)"
  - id: "P3"
    primary: false
    statement: "SAM-trained SSL models improve worst-group accuracy by ≥2pp over SGD-trained SSL models on at least 2 of 3 benchmarks (Waterbirds/CelebA/CMNIST), without group annotations at training time, when evaluated using the standard worst-group accuracy protocol from kohpangwei/group_DRO"
    test_method: "Compare worst-group accuracy of SAM-trained vs. SGD-trained SSL models after identical linear probe evaluation. Also compare vs. annotation-free baselines (LFR, EVaLS) applied to SGD-trained SSL features."
    success_criterion: "Worst-group accuracy improvement ≥ 2pp on ≥ 2/3 datasets for at least one SSL method"
    falsification: "< 1pp improvement on all 3 datasets for all SSL methods tested"

