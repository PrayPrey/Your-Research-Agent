predictions:
  - id: "P1"
    primary: true
    statement: "Equivariant encoders (DWSNets, GNN-NFN) reach 90% of their peak accuracy-prediction R² at ≤50% of the training set size required by plain flat-MLP to reach 90% of its peak R²"
    test_method: "Plot R² vs. training size for all 4 conditions; identify the training size at which each reaches 90% of its full-data R²; compute ratio for equivariant vs. plain"
    success_criterion: "Ratio ≥ 2.0 (equivariant needs ≤50% of plain's data); both DWSNets and GNN-NFN satisfy this on both MNIST and CIFAR-10 zoos"
    falsification: "Ratio < 1.5 for both equivariant conditions on both datasets (efficiency advantage is <33% and within noise)"
  - id: "P2"
    primary: false
    statement: "Plain flat-MLP + permutation augmentation achieves 50-80% of the equivariant sample efficiency advantage, but does not match equivariant performance at training sizes ≤250 models"
    test_method: "Compare R² at training sizes 100, 250, 500 between conditions; augmentation should be intermediate between plain and equivariant"
    success_criterion: "Augmented MLP R² is strictly between plain MLP and equivariant (at sizes ≤250), and the gap to equivariant remains statistically significant (non-overlapping bootstrap 95% CIs)"
    falsification: "Augmented MLP R² matches equivariant at training size ≤250 on both datasets (augmentation fully closes the gap)"
  - id: "P3"
    primary: false
    statement: "In the full-data regime (training on 80% of full zoo), all four encoder types converge to within 5% R² of each other — the efficiency advantage disappears at high data volume"
    test_method: "Compare R² at full training size for all 4 conditions; check whether bootstrap CIs overlap"
    success_criterion: "Max pairwise R² difference < 0.05 at full training size; CIs overlap"
    falsification: "Equivariant encoders still outperform plain MLP by >0.05 R² at full training size (Dayan 2026 expressivity equivalence doesn't translate to practical equivalence at scale)"

