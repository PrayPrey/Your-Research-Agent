      operationalization: "Encoders grouped by parameter count range: small (<50K), medium (50K-200K), large (>200K); comparisons made within same range"
    - name: "Train/Test Split"
      operationalization: "Fixed random seed for ModelZooDataset split; identical across all encoder types"
    - name: "Optimizer and Learning Rate"
      operationalization: "Adam optimizer, same learning rate schedule across conditions; tuned once on full-data condition and held fixed"
    - name: "Random Seeds"
      operationalization: "10 seeds for training sizes ≤250; 5 seeds for larger sizes; report mean ± bootstrap 95% CI"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Permutation equivariance as structural inductive bias: DWSNets and GNN-NFN architectures are constrained to produce the same output regardless of neuron ordering within layers, matching the true symmetry of weight spaces"
      evidence: "DWSNets [Navon et al. 2023] mathematical proof of equivariance; NFN [Zhou et al. 2023] auto-constructed equivariant layers"
      falsifier: "If DWSNets outputs vary with neuron permutation in practice (equivariance violated by implementation), the mechanism is invalid"
    - step: 2
      description: "Symmetry-consistent hypothesis space is smaller: equivariant encoders only search within functions that respect permutation symmetry, dramatically reducing the effective hypothesis space compared to unconstrained flat-MLPs"
      evidence: "Dayan et al. 2026 [arXiv:2602.01083] — expressivity equivalence theorem implies same ceiling, smaller search space; analogous to CNNs vs. flat MLPs for images"
      falsifier: "If the functional forms achievable by flat-MLPs on weight vectors are already in practice limited to symmetry-consistent functions (due to gradient descent implicit bias), the hypothesis space reduction would not manifest"
    - step: 3
      description: "Reduced hypothesis space → lower sample complexity: fewer training models are needed to identify the correct property-prediction function within the smaller equivariant hypothesis space, producing higher R² at lower training set sizes"
      evidence: "Sample complexity theory: VC dimension bounds for equivariant vs. unrestricted function classes; empirical analogy: SSL with invariant augmentations improves sample efficiency in image domains"
      falsifier: "If R² efficiency curves for equivariant and plain encoders show no difference at training sizes ≤500 (the primary test range), the mechanism's practical effect is null"
  key_tension: "Dayan et al. 2026 proves expressivity equivalence — but equivalent expressivity ceiling does not guarantee equivalent learning dynamics or sample complexity. The tension is whether the theoretical symmetry-reduction of the search space translates to practical sample efficiency gains, or whether gradient descent on flat-MLPs implicitly discovers the symmetric solution without needing the structural constraint."
  evidence_summary: |
    The causal chain is supported by: (1) mathematical proofs of equivariance in DWSNets/NFN,
    (2) expressivity equivalence theorem from Dayan 2026 establishing the ceiling parity that
    makes efficiency the differentiator, and (3) analogous sample efficiency gains from structural
    inductive biases in image (CNNs vs. MLPs) and graph (GNNs vs. MLPs) domains. The main
    uncertainty is whether gradient descent on plain MLPs discovers permutation-symmetric solutions
    efficiently enough to close the practical gap.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "ModelZooDataset provides sufficient model diversity for the comparison to generalize — models differ in initialization, learning rate, and training duration, not just random seeds"
    supporting_evidence: "Schürholt et al. 2022 describes zoo construction with systematic hyperparameter variation; R² ≈ 0.83 suggests meaningful signal"
    consequence_if_violated: "If the zoo models are too similar (low diversity), both equivariant and plain encoders would trivially achieve high R² with few training models — the efficiency comparison becomes meaningless"
  - id: "A2"
    assumption: "Parameter-count matching within ranges (small/medium/large) provides fair comparison — architectural differences beyond parameter count don't dominate the efficiency comparison"
    supporting_evidence: "Prior work uses parameter count as the standard fairness control; Herrmann 2024 uses similar range-based matching"
    consequence_if_violated: "If DWSNets achieves gains solely from deeper/wider architecture rather than equivariance, the attribution to inductive bias fails — must run architecture search within constraint"
  - id: "A3"
    assumption: "Permutation augmentation is a valid approximation of equivariance — randomly permuting neuron orderings during training on flat-MLPs provides equivalent or near-equivalent invariance to structural equivariance"
    supporting_evidence: "Data augmentation typically achieves some but not all benefits of architectural invariance (analogy: random crops vs. shift-equivariant CNNs)"
    consequence_if_violated: "If augmentation fully replicates structural equivariance (R² curves identical), the distinction between structural and learned symmetry is practically irrelevant"
  - id: "A4"
    assumption: "The MNIST and CIFAR-10 model zoo tasks are representative of general weight-space property prediction — findings generalize beyond these specific architectures"
    supporting_evidence: "ModelZooDataset models are standard CNNs widely studied in the literature; MNIST and CIFAR-10 zoos use different scales"
    consequence_if_violated: "If efficiency gap only exists for tiny MLP/CNN models (MNIST zoo) but not CIFAR-10 CNNs, the finding is architecture-size-specific"
  - id: "A5"
    assumption: "Fixed optimizer and learning rate (Adam, tuned on full data) provides fair comparison across all training sizes — no encoder type benefits disproportionately from hyperparameter tuning at small sizes"
    supporting_evidence: "Standard practice in learning curve studies; single HP set avoids overfitting to small-sample regime"
    consequence_if_violated: "If plain-MLP benefits substantially from different LR at small training sizes, the comparison would be unfair — partially addressable by LR sensitivity analysis"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Weight-space property prediction tasks (accuracy prediction, generalization gap prediction)
    - Model zoos with homogeneous architecture families (all models same backbone, varied HPs)
    - MLP and CNN weight spaces (MNIST and CIFAR-10 model zoos)
    - Supervised property prediction from weight encodings
    - Training set sizes in the range [100, full zoo size]
  does_not_apply_to: |
    - Transformer weight spaces (different symmetry structure; requires separate analysis)
    - Cross-architecture generalization (Gap 1 in Phase 1 — separate hypothesis)
    - Model editing tasks (merging, task arithmetic) — different objective
    - Generative weight space models (different task)
    - Large-scale (1M+) model collections on HuggingFace (not in ModelZooDataset)
  known_limitations: |
    - ModelZooDataset MNIST zoo has ~4,860 models — "full data" regime is still small by DL standards
    - DWSNets is specialized for MLP weight spaces; GNN-NFN handles diverse architectures differently
    - Results may not transfer to weight spaces with different symmetry groups (scaling, sign-flipping)
    - Single benchmark domain (image classification); NLP model zoos would require separate study

