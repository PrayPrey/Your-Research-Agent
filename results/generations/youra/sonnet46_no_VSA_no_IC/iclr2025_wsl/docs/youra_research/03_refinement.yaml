# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Permutation equivariance is a symmetry of neural network weight spaces (neuron reordering in a layer leaves the function unchanged)"
      status: "BUILD_ON"
      evidence: "DWSNets [Navon et al. 2023, arXiv:2301.12780]; NFN [Zhou et al. 2023, arXiv:2302.14040]"
    - claim: "All permutation-equivariant weight-space networks have equivalent expressive power"
      status: "BUILD_ON"
      evidence: "Dayan, Eitan, Maron 2026 [arXiv:2602.01083] — theoretical proof; 34% SOTA improvement from theory-guided construction"
    - claim: "Plain SSL on flattened weights can predict model accuracy and generalization gap from weights alone"
      status: "BUILD_ON"
      evidence: "Schürholt et al. 2021 [arXiv:2110.15288] — R² ≈ 0.83 for accuracy prediction on MNIST model zoo"
    - claim: "ModelZooDataset provides standardized model zoos with ground-truth performance metrics for MNIST and CIFAR-10"
      status: "BUILD_ON"
      evidence: "Schürholt et al. 2022 [arXiv:2209.14764]; GitHub: ModelZoos/ModelZooDataset"
    - claim: "Equivariant encoders (DWSNets, GNN-NFN) achieve SOTA on property prediction but use different train/test splits than plain baselines"
      status: "BUILD_ON"
      evidence: "DWSNets [Navon et al. 2023] R² ≈ 0.89; GNN-NFN [Kofinas et al. 2024] SOTA — but no unified comparison"
    - claim: "Whether equivariant inductive bias provides sample efficiency advantage over plain encoders is empirically unknown"
      status: "PROVE_NEW"
      evidence: "No controlled comparison on shared splits in any published work as of 2026"
  scope_reduction_percentage: 83
  phase2b_4_instructions: |
    Claims 1-5 are BUILD_ON (established) — do not re-verify in Phase 2B.
    Only Claim 6 (sample efficiency advantage) is PROVE_NEW and requires experimental validation.
    Phase 2B should focus experimental effort on Claim 6: the equivariant vs. plain efficiency comparison.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EquivSampleEfficiency-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the weight-space property prediction setting using the ModelZooDataset MNIST and CIFAR-10
    model zoos with standardized shared train/test splits, if we train equivariant weight-space
    encoders (DWSNets, GNN-NFN) versus plain encoders (flat-MLP, flat-MLP + permutation
    augmentation) at matched parameter budget ranges across systematically varied training set sizes
    {100, 250, 500, 1000, full}, then equivariant encoders will demonstrate superior sample
    efficiency — reaching ≥90% of their peak accuracy-prediction R² at ≤50% of the training set
    size required by plain encoders to reach the same relative threshold — because permutation
    equivariance constrains the hypothesis space to symmetry-consistent functions, reducing the
    effective sample complexity of learning weight-space property mappings.
  alternative_hypothesis_h0: |
    There is no significant difference in the training-size-normalized R² efficiency between
    equivariant encoders and plain encoders for weight-space accuracy prediction on ModelZooDataset;
    the 90%/50% threshold is not met, or the gap is within bootstrap confidence interval overlap.

