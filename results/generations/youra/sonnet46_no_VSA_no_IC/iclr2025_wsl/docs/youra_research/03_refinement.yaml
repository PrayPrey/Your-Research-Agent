variables:
  independent:
    - name: "Encoder Architecture Type"
      type: "categorical"
      operationalization: "Which weight-space encoder is trained"
      levels:
        - "DWSNets (equivariant, permutation-equivariant layers)"
        - "GNN-NFN (equivariant, computational graph)"
        - "Flat-MLP (plain, weight vector flattening)"
        - "Flat-MLP + PermAug (plain + permutation augmentation)"
    - name: "Training Set Size"
      type: "categorical"
      operationalization: "Number of model zoo models used for encoder training"
      levels: [100, 250, 500, 1000, "full (~4860 MNIST / ~9000 CIFAR)"]
  dependent:
    - name: "Test-Set Accuracy Prediction R²"
      type: "continuous"
      operationalization: "Coefficient of determination for predicting ground-truth model test accuracy from weight encoding; range [0,1]; computed on fixed held-out set"
      primary: true
    - name: "Generalization Gap Prediction R²"
      type: "continuous"
      operationalization: "R² for predicting train_accuracy - test_accuracy from weight encoding; secondary metric"
      primary: false
    - name: "Sample Efficiency Ratio"
      type: "continuous"
      operationalization: "Ratio of training size at which plain encoder reaches 90% peak R² to training size at which equivariant encoder reaches 90% peak R²; values >1 indicate equivariant advantage"
      primary: false
  controlled:
