null_hypothesis:
  h0_statement: |
    There is no significant difference in sample efficiency between equivariant and plain
    weight-space encoders for model accuracy prediction on ModelZooDataset; the training-size
    required for each encoder to reach 90% of its peak R² does not differ by more than 33%
    (efficiency ratio < 1.5).
  statistical_test: "Bootstrap confidence intervals (10+ seeds) on efficiency ratio; non-overlapping CIs at α=0.05 reject H0"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled comparison of equivariant vs. plain weight-space encoders on shared ModelZooDataset splits; first empirical sample efficiency curve for weight-space encoders; permutation augmentation as mechanistic ablation condition"
  differentiation_summary: |
    All prior equivariant weight-space papers (DWSNets, GNN-NFN, NFN) benchmark on their own
    private or custom splits, preventing direct comparison. Schürholt 2021 provides the only
    plain baseline on ModelZooDataset but never compares to equivariant methods on the same data.
    Dayan et al. 2026 proves expressivity equivalence but provides no empirical efficiency data.
    This study fills the empirical gap: shared splits, training size ablation, permutation
    augmentation condition. The core novel finding would be the efficiency ratio quantifying
    when equivariant inductive bias matters.

