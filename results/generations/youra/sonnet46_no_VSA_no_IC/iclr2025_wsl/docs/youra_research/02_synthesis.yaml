hypothesis_draft:
  title: "Equivariant Weight-Space Encoders Are More Sample-Efficient Than Plain Encoders for Model Property Prediction in the Low-Data Regime"
  hypothesis_id: "H-EquivSampleEfficiency-v1"
  core_claim: |
    Equivariant weight-space encoders (DWSNets, GNN-NFN) achieve higher accuracy-prediction R²
    than parameter-matched plain encoders (flat-MLP) at training set sizes ≤500 models from
    ModelZooDataset, because permutation equivariance constrains the encoder's hypothesis space
    to symmetry-consistent functions, reducing effective sample complexity. The advantage
    narrows to <5% R² difference at full dataset size (~4860 MNIST / ~9000 CIFAR-10 models),
    consistent with Dayan et al. 2026's expressivity equivalence theorem.
  mechanism: |
    Permutation equivariance is a structural inductive bias: DWSNets and GNN-NFN architectures
    are mathematically constrained to respect neuron-ordering symmetry in weight spaces. This
    constraint eliminates a large family of non-symmetric functions from the hypothesis space,
    so gradient descent converges to the correct property-prediction function faster (with fewer
    training examples). Plain MLPs operating on flattened weight vectors must discover the
    symmetric solution from scratch using data alone, requiring more training examples to achieve
    the same performance. Permutation augmentation partially bridges this gap by making the
    training data distribution approximately symmetric, but does not eliminate non-symmetric
    functional forms from the MLP's hypothesis space.
  predictions:
    - P1: "Equivariant encoders reach 90% of peak R² at ≤50% of the training data required by plain MLP for same threshold (efficiency ratio ≥2.0)"
    - P2: "Plain MLP + permutation augmentation achieves intermediate performance: strictly better than plain MLP but not matching equivariant at ≤250 training models"
    - P3: "At full training size, all four conditions converge to within 5% R² of each other (expressivity equivalence translates to performance parity at high data)"

