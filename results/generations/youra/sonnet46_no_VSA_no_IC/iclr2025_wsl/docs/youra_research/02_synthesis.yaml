experimental_scope:
  models:
    - "DWSNets (equivariant, github.com/AvivNavon/DWSNets)"
    - "GNN-NFN (equivariant, github.com/mkofinas/neural-graphs)"
    - "Flat-MLP (plain, custom implementation ~50 lines PyTorch)"
    - "Flat-MLP + PermAug (plain + permutation augmentation)"
  datasets:
    - "ModelZooDataset MNIST model zoo (~4,860 CNNs with ground-truth test accuracy)"
    - "ModelZooDataset CIFAR-10 model zoo (~9,000 CNNs — replication)"
  baselines:
    - "Random predictor (R²=0 floor)"
    - "Schürholt 2021 SSL (plain, full-data upper bound for plain approaches)"

measurement_plan:
  data_collection:
    - source: "ModelZooDataset (github.com/ModelZoos/ModelZooDataset) — MNIST and CIFAR-10 model zoo checkpoints with ground-truth metrics"
  procedure:
    - step: "Download ModelZooDataset; verify checkpoint format compatibility with DWSNets and GNN-NFN"
    - step: "Define fixed train/test split (fixed random seed); subsample training sets: {100, 250, 500, 1000, full}"
    - step: "For each (encoder, training_size) combination: train encoder, evaluate R² on fixed held-out test set"
    - step: "Repeat with 10 random seeds for sizes ≤250; 5 seeds for sizes >250"
    - step: "Compute efficiency ratio: training_size at which plain-MLP reaches 90% of peak R² / training_size at which equivariant reaches 90% of peak R²"
    - step: "Compute bootstrap 95% CIs on all R² values and efficiency ratios"
    - step: "Replicate on CIFAR-10 zoo; compare efficiency ratios across zoo sizes"
    - step: "Optional: compute CKA between equivariant and plain encoder latent spaces at each training size"
  success_criteria:
    - "P1: Efficiency ratio ≥ 2.0 for at least one equivariant condition on both MNIST and CIFAR-10 zoos"
    - "P2: Bootstrap CIs for augmented MLP R² at ≤250 training models do not overlap with equivariant at same size"
    - "P3: Max pairwise R² difference < 0.05 at full training size; bootstrap CIs overlap"

validation:
  internal_validity:
    - "Fixed train/test split eliminates data leakage between conditions"
    - "Parameter count range control eliminates capacity confound"
    - "Multiple seeds provide variance estimates; bootstrap CIs prevent spurious significance"
    - "Permutation augmentation condition isolates structural vs. data-level equivariance"
  external_validity:
    - "CIFAR-10 zoo replication tests generalization to different architecture scale"
    - "Scope limitation: results applicable to MLP/CNN weight spaces only; transformer and RNN zoos require separate studies"
    - "ModelZooDataset construction (varied HPs, multiple initializations) provides realistic diversity"

discussion_synthesis:
  key_insights:
    - "Dayan et al. 2026 expressivity equivalence theorem reframes the comparison: efficiency, not capability, is the open question"
    - "The low-data regime (<500 models) is the practically relevant regime — real-world model zoos (RNN zoo: ~1000 models) are small"
    - "Permutation augmentation as ablation condition is the key mechanistic test: distinguishes structural from learned symmetry"
    - "Prof. Rex's CIFAR-10 replication concern is critical — must avoid single-dataset conclusions"
  breakthrough_moments:
    - "Dr. Sage's framing: 'when does equivariant inductive bias matter?' — turns a methods comparison into a practical question"
    - "Prof. Pax confirming 15-20 GPU hours total — experiment is feasible without large compute"
    - "Prof. Rex's concern that null result (augmentation closes gap) is still publishable — removes publication bias risk"
  resolved_tensions:
    - "Tension: 'parameter matching is hard' → Resolved by parameter count ranges rather than exact matching"
    - "Tension: 'effect size may be trivially small' → Resolved by relative efficiency ratio (90%/50% criterion) rather than absolute R² gap"
    - "Tension: 'single dataset insufficient' → Resolved by mandatory CIFAR-10 replication in Phase 2B design"
