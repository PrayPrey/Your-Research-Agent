  h-m1:
    type: MECHANISM
    statement: Under controlled verification, if DWSNets and GNN-NFN encoder implementations are tested by permuting neuron
      orderings within layers of identical weight tensors, then their output representations will be identical regardless
      of permutation (max absolute difference < 1e-5), because the architectures are mathematically constrained to permutation-equivariant
      operations.
    status: VALIDATED
    prerequisites:
    - h-e1
    gate:
      type: MUST_WORK
      satisfied: true
      result: 'GNN-NFN (equivariant): max_diff=1.80e-06 < 1e-5 (10,000 checks on 200 CIFAR-10 zoo models × 50 perms). DWSNets
        (equivariant): max_diff=7.45e-09 < 1e-5 (1,000 checks on 50 synthetic MLP models × 20 perms; CNN zoo has only 2 FC
        layers, DWSNets requires >2). FlatMLP (negative control): max_diff=5.59e-02 > 1e-3 (not equivariant). Gap ratio FlatMLP/DWSNets
        ≈ 7.5M >> 100. All 4 gate indicators True. CAVEATS: (1) DWSNets tested on synthetic MLP weight space, not CIFAR-10
        CNN zoo weights (structural limitation of DWSNets); (2) Encoders use random init (H-E1 checkpoints not saved); random
        init valid for structural mechanism verification.'
    experiment_design:
      status: COMPLETED
      file: docs/youra_research/h-m1/02c_experiment_brief.md
