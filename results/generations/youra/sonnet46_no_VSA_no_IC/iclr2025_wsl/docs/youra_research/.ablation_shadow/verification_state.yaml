  h-m2:
    type: MECHANISM
    statement: Under the weight-space property prediction setting, if we plot R² learning curves for equivariant encoders
      (DWSNets, GNN-NFN) and plain Flat-MLP across {100, 250, 500, 1000, full} training sizes, then equivariant learning curves
      will be steeper in the low-data regime (≤500 models), with efficiency ratio ≥2.0 (plain 90%-peak size / equivariant
      90%-peak size) on both MNIST and CIFAR-10 zoos, because structural permutation-equivariance reduces the effective VC
      dimension of the encoder.
    status: VALIDATED
    prerequisites:
