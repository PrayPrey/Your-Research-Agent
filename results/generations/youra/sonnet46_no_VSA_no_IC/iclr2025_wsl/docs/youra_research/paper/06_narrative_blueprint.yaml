# Narrative Blueprint for Phase 6 Paper Writing
# Generated: 2026-08-21T18:35:00+00:00
# Hypothesis: H-EquivSampleEfficiency-v1
# Paper: "When Symmetry Hurts: Data-Regime-Dependent Sample Efficiency of Equivariant Weight-Space Encoders"

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: |
      A simple trick — randomly shuffling neurons before each training step — outperforms
      a mathematically guaranteed equivariant architecture when only 100 models are
      available for training. Yet with 250 models, the structural guarantee wins decisively.
      Why does a symmetry-enforcing architecture fail at the very scale where its inductive
      bias should matter most?
    strategy: "counterintuitive_finding"
    why_this_hook: |
      The N=100 crossover (PermAug > GNN-NFN) violates naive expectation: equivariant
      inductive bias should help most at low data. Presenting this reversal first grabs
      attention, challenges assumptions, and immediately motivates both the main finding
      (structural equivariance is sample-efficient above a threshold) and the novel
      contribution (the threshold itself, ~150-250 models). Avoids generic
      "equivariant encoders are better" framing.

  why_reader_should_care:
    main_reason: |
      Practitioners collecting model zoos for weight-space property prediction need to
      know whether to invest in equivariant graph encoders (expensive to implement,
      harder to scale) or use simple augmentation of a plain MLP. The answer depends
      critically on how many models they can collect — a decision boundary that did not
      previously exist in the literature.
    concrete_example: |
      A medical imaging team training classifiers on limited patient data can collect
      perhaps 80-150 model variants to form a weight zoo for property prediction.
      At this scale, our findings show that a flat-MLP with permutation augmentation
      will outperform the state-of-the-art equivariant encoder GNN-NFN.
    stakes: |
      Without knowing the data-regime crossover, practitioners systematically
      over-engineer their weight-space learning pipeline for small zoos, or
      under-engineer it for large zoos — wasting compute in both directions.

# =============================================================================
# PROBLEM FRAMING (THREE LEVELS)
# =============================================================================

problem_framing:
  surface_problem:
    description: |
      Neural network weights are redundant — permuting neurons within a layer produces
      functionally identical networks. Weight-space learning methods must handle this
      symmetry to predict model properties from weights.
    common_understanding: |
      The field knows that plain MLPs operating on flattened weights are permutation-
      sensitive, and that equivariant architectures (DWSNets, GNN-NFN) address this
      by construction. Prior work shows equivariant encoders achieve state-of-the-art
      accuracy prediction on model zoos.

  deeper_problem:
    description: |
      Despite equivariant encoders achieving strong accuracy, no prior work has conducted
      a controlled comparison of equivariant vs. plain encoders on shared training splits
      with systematically varied training set sizes. This makes the practical decision
      about which encoder to use under data constraints unanswerable from existing evidence.
    why_overlooked: |
      Equivariant encoder papers use private or custom splits, and plain encoder papers
      use different datasets. The comparison has never been made apples-to-apples.
      Additionally, the focus has been on peak performance (full data) rather than
      sample efficiency (learning curve shape).
    our_perspective: |
      Sample efficiency — not peak accuracy — is the critical comparison axis. The
      expressivity equivalence theorem (Dayan et al. 2026) already proves that equivariant
      and plain encoders reach the same ceiling given sufficient data. The interesting
      question is how much data is needed to get there.

  gap_in_existing_work:
    description: |
      No controlled, shared-split measurement of the sample efficiency ratio between
      equivariant and plain weight-space encoders exists in the literature, and the
      data-regime dependence of the equivariant advantage has never been reported.
    why_gap_exists: |
      Benchmark heterogeneity (each paper uses its own splits/zoo) and focus on
      full-data performance. The PermAug condition — a critical intermediate between
      plain and structural equivariance — has not been systematically compared.
    why_gap_matters: |
      Practitioners cannot make an informed encoder choice without knowing the crossover
      point. The gap is not merely academic: it has direct implications for zoo design
      (how many models to train) and encoder selection (complex vs. simple).

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: |
      Permutation-equivariant graph encoders achieve a 6.8x sample efficiency advantage
      over plain flat-MLP for weight-space property prediction — but only above a
      minimum-data threshold of approximately 150-250 training models; below this,
      data augmentation of a plain MLP is superior.
    expanded_explanation: |
      The insight has two components: (1) the magnitude of the advantage when it exists
      is much larger than a factor of 2x — the equivariant encoder needs only 14.7% of
      the training data of the plain encoder to reach equivalent performance. (2) This
      advantage is not monotone in data: at N=100 the equivariant encoder is actively
      harmful (R²=-0.016, below-chance), while simple 11x permutation augmentation of
      a flat-MLP yields positive R²=0.138. The crossover happens between N=100 and N=250,
      revealing a minimum-data threshold for graph encoder generalization.

  why_others_missed_it:
    common_assumptions: |
      Prior work assumed equivariant inductive bias helps most at low data (consistent
      with the general principle that priors matter when data is scarce). Papers also
      assumed PermAug is strictly intermediate between plain and structural equivariance.
    our_different_view: |
      We tested these assumptions explicitly with a controlled learning curve study.
      The crossover at N=100 was not predicted — it emerged from the data. GNN-NFN's
      graph encoder architecture requires a minimum number of diverse weight graphs
      to learn useful node embeddings; below this threshold, the structural constraint
      is a liability (underfitting), not an asset.
    enabling_factor: |
      Using shared ModelZooDataset splits across all conditions, and including PermAug
      as an explicit third condition, made the crossover visible. Without PermAug as
      the intermediate baseline, the N=100 GNN-NFN failure would appear to be a simple
      low-data failure of both approaches.

  what_makes_it_work:
    intuitive_explanation: |
      Think of equivariant graph encoders as specialists: they are excellent once they
      have seen enough examples to calibrate their graph-structured representations,
      but require more examples to "warm up" than a generalist (flat-MLP). Permutation
      augmentation gives the generalist more practice examples cheaply, making it
      better than the unprepared specialist at small zoo sizes.
    key_mechanism: |
      GNN-NFN constructs a computational graph from weight tensors, where nodes are
      neurons and edges are weight matrices. At N=100, the diversity of graph topologies
      in the training set is insufficient for the encoder to learn useful node embeddings
      — the graph-level representation degenerates. At N>=250, sufficient topological
      diversity enables the equivariant constraint to reduce the effective hypothesis
      space, producing a 6.8x efficiency gain.

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: |
      GNN-NFN achieves a 6.8x sample efficiency advantage over flat-MLP on CIFAR-10
      CNN zoo weight-space accuracy prediction, with a data-regime crossover: PermAug
      dominates at N=100, structural equivariance dominates at N>=250.
    measurable_criteria:
      - "Efficiency ratio = N_plain_90 / N_equiv_90 >= 2.0 (achieved: 6.804x)"
      - "GNN-NFN R^2 >= PermAug R^2 at N=250 (achieved: 0.767 vs 0.532)"
      - "PermAug R^2 > GNN-NFN R^2 at N=100 (achieved: 0.138 vs -0.016)"
      - "Permutation equivariance verified to floating-point precision (max_diff=1.80e-06)"

  supporting_evidence:
    - id: "evidence_1"
      what: "6.804x efficiency ratio — GNN-NFN reaches 90% peak R^2 at N~147 vs N=1000 for flat-MLP"
      so_what: "Equivariant encoders reduce the labeled model zoo requirement by ~7x, enabling property prediction from zoo sizes that are practically collectible"
      how_it_supports_claim: "Primary quantitative evidence for P1 (efficiency ratio >= 2x); gate PASSED by wide margin"
      figures: ["fig_1 (learning_curves_cifar10.png)", "fig_2 (efficiency_ratio_bar.png)"]

    - id: "evidence_2"
      what: "Permutation equivariance verified to floating-point precision: GNN-NFN max_diff=1.80e-06, FlatMLP max_diff=5.59e-02 across 10,000 checks"
      so_what: "The efficiency advantage has a verified structural basis — the encoder mathematically treats permutation-equivalent weight tensors identically"
      how_it_supports_claim: "Mechanistic grounding for the efficiency claim; confirms Step 1 of causal chain"
      figures: ["Table from H-M1 (max_diff values)"]

    - id: "evidence_3"
      what: "Data-regime crossover: at N=100 PermAug R^2=0.138 > GNN-NFN R^2=-0.016; at N=250 GNN-NFN R^2=0.767 > PermAug R^2=0.532"
      so_what: "Practitioners with very small model zoos (<150 models) should prefer permutation augmentation over equivariant graph encoders"
      how_it_supports_claim: "Qualifies the main claim with a precision boundary; the crossover is the key novel finding"
      figures: ["fig_3 (ordering_plot.png)", "fig_4 (gate_metrics.png)"]

    - id: "evidence_4"
      what: "Full-scale convergence: GNN-NFN~0.894, flat-MLP~0.886 at N=full (delta=0.008<0.05)"
      so_what: "Consistent with Dayan et al. 2026 expressivity equivalence theorem — the advantage is a sample complexity phenomenon, not a function class ceiling"
      how_it_supports_claim: "Supports P3 and connects to theoretical framework; characterizes the full data-regime picture"
      figures: ["fig_1 (learning_curves_cifar10.png, full data point)"]

  surprising_findings:
    - finding: "GNN-NFN achieves below-chance R^2=-0.016 at N=100 — worse than predicting the mean"
      why_surprising: "Equivariant inductive bias was expected to help most at low data, where priors matter most. Instead, the structural constraint produces active harm at N=100."
      our_interpretation: |
        GNN-NFN's graph encoder requires a minimum diversity of weight-graph topologies
        in its training set before the equivariant structural constraint becomes
        advantageous rather than constraining. At N=100, the 11x data expansion from
        PermAug provides more useful training signal than structural priors alone.
        The sharp R^2 jump from -0.016 (N=100) to 0.767 (N=250) is consistent with
        crossing a minimum-data threshold for graph encoder generalization.

    - finding: "PermAug fraction of the equivariant gap is 2.23x at N=100 (exceeds the gap itself) and 0.26 at N=250"
      why_surprising: "P2 predicted PermAug would achieve 50-80% of equivariant advantage. Instead the relationship is strongly data-regime dependent."
      our_interpretation: |
        The two symmetry-enforcement strategies (data-level vs. structural) are not
        interchangeable — they have qualitatively different learning dynamics that
        produce opposite orderings depending on zoo size. This is scientifically
        informative: PermAug and structural equivariance are distinguishable,
        not approximations of each other.

# =============================================================================
# BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: |
      First controlled measurement of sample efficiency ratio between equivariant (GNN-NFN)
      and plain (flat-MLP) weight-space encoders on shared ModelZooDataset splits, revealing
      a 6.8x advantage above a minimum-data threshold of ~250 models and a reversal below it.
    why_significant: |
      Resolves a previously unanswerable practical question: which encoder to use under
      data constraints. Provides a concrete decision boundary (~150-250 models) that is
      directly actionable for zoo design. Establishes a reusable evaluation protocol
      for weight-space encoder efficiency comparison.

  implications:
    for_field: |
      Future weight-space encoder papers should report learning curves (not just peak
      performance) and include PermAug as a third condition alongside equivariant and
      plain encoders. The 6.8x efficiency ratio establishes a strong baseline for
      future encoder designs to surpass. The minimum-data threshold motivates
      investigation of lightweight equivariant architectures suitable for N<150.
    for_practice: |
      Practitioners with small model zoos (<150 models): use flat-MLP + permutation
      augmentation. Practitioners with medium zoos (250-1000 models): use GNN-NFN
      or equivalent equivariant graph encoder. At full zoo scale: choice matters
      less (gap <1% R^2). Zoo designers should target N>=250 to benefit from
      equivariant encoders.

  future_possibilities:
    immediate_extensions:
      - "Multi-seed replication of N=100 crossover to confirm or refute (10 seeds)"
      - "LR sweep at N=100 to isolate hyperparameter vs. architectural explanation"
      - "GNN-NFN capacity ablation (hidden_dim 16,32,64,128) to find minimum viable model"
      - "Download MNIST MLP zoo from Zenodo and run DWSNets comparison"
    longer_term_vision: |
      Identifying and reducing the minimum-data threshold for equivariant graph encoders
      could unlock weight-space learning for the most common practical scenario
      (small model zoos of 50-150 models). Cross-architecture extension (transformers,
      RNNs) would generalize the efficiency finding beyond CNN zoos.

# =============================================================================
# SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — lead with the counterintuitive finding, then the main result, then the practical implication"
    key_message: |
      Equivariant encoders achieve 6.8x sample efficiency over plain MLPs for
      weight-space property prediction — but only above ~250 training models;
      below that, simple augmentation wins.
    anti_pattern_to_avoid: "Do not open with 'Neural networks achieve...' or list all metrics"

  introduction:
    narrative_purpose: "Hook -> Problem escalation (3 levels) -> Key insight preview -> Contributions as story"
    hook_strategy: "counterintuitive_finding — lead with N=100 reversal"
    problem_levels:
      surface: "Weight-space learning requires handling permutation symmetry"
      deeper: "No controlled shared-split comparison of equivariant vs. plain under data constraints"
      gap: "Data-regime dependence of equivariant advantage is unknown and unknowable from existing literature"
    key_insight_preview: "6.8x advantage above threshold, reversal below — motivates zoo size as a design decision"
    contributions_framing: "Frame as: (1) empirical finding (efficiency ratio), (2) novel finding (crossover), (3) methodological contribution (evaluation protocol)"
    transition_to_related: "After establishing the gap, pivot: 'We situate this work within three lines of prior research...'"

  related_work:
    narrative_purpose: "Show existing work insufficient in exactly the three ways our paper addresses — not a survey, an argument"
    positioning_strategy: "Three theme clusters: (A) equivariant weight-space encoders, (B) plain/augmentation baselines, (C) theoretical expressivity. Each cluster ends with its specific limitation that our work addresses."
    key_comparison_points:
      - cluster: "A — Equivariant encoders (DWSNets, GNN-NFN, NFN)"
        limitation: "Used private/custom splits; no plain encoder comparison; no training size ablation"
        our_address: "First shared-split controlled comparison"
      - cluster: "B — Plain weight-space learning (Schürholt 2021/2022, ModelZooDataset)"
        limitation: "No equivariant comparison on same data; no efficiency curve"
        our_address: "PermAug condition + efficiency ratio as evaluation"
      - cluster: "C — Expressivity theory (Dayan et al. 2026)"
        limitation: "Proves ceiling equivalence but not sample complexity parity"
        our_address: "Empirical counterpart: efficiency ratio quantifies the sample complexity gap"
    tone: "Fair to prior work — each line of work is incomplete in a specific way, not wrong"

  methodology:
    narrative_purpose: "WHY this design solves the problem — method follows from insight, not from convention"
    connection_to_insight: "The minimum-data threshold insight motivates the specific training sizes {100,250,500,1000,full} — the crossover is only visible with this resolution"
    key_design_decisions:
      - decision: "Shared ModelZooDataset splits for all encoder types"
        rationale: "Eliminates split-heterogeneity confound that prevented prior comparison; only way to get apples-to-apples efficiency curve"
      - decision: "Three conditions: plain MLP, MLP+PermAug, equivariant GNN-NFN"
        rationale: "PermAug is the critical intermediate that makes the crossover interpretable — without it, GNN-NFN failure at N=100 has no comparative context"
      - decision: "Training sizes {100,250,500,1000,full} with 90%-peak efficiency ratio"
        rationale: "Logarithmically spaced to detect crossover; 90%-peak threshold is more informative than peak R^2 for learning curve comparison"
      - decision: "Permutation equivariance verification (H-M1) as a prerequisite"
        rationale: "Mechanistic grounding: the efficiency claim is only interpretable if we verify the structural property exists in the encoder"
    subsections: ["Problem setup", "Encoder architectures", "Training protocol", "Evaluation metrics", "Equivariance verification"]

  experiments:
    narrative_purpose: "Design tests that answer the exact questions the introduction poses — RQs map 1:1 to claims"
    experimental_questions:
      - "RQ1: Does GNN-NFN achieve a sample efficiency ratio >= 2x over flat-MLP on shared ModelZooDataset splits? (P1)"
      - "RQ2: Is structural equivariance verified to floating-point precision? Does this mechanistic property hold in practice? (H-M1)"
      - "RQ3: What is the role of permutation augmentation — is it intermediate between plain and structural equivariance across all data regimes? (P2)"
      - "RQ4: At full training scale, do all encoder types converge in performance? (P3 + Dayan 2026 connection)"
    dataset_rationale: "CIFAR-10 CNN zoo (~9K models) — chosen because it is the larger/harder zoo, enabling training-size ablation down to N=100; and because GNN-NFN is architecturally suited to CNN weight spaces"
    baseline_rationale: "Flat-MLP: standard plain baseline. PermAug: critical intermediate to distinguish data-level from structural symmetry. Both needed to identify the crossover."

  results:
    narrative_purpose: "Evidence for each claim, in the order the claims were introduced — main efficiency finding first, then mechanism, then crossover, then full-scale convergence"
    main_result_highlight: "6.804x efficiency ratio — the concrete answer to RQ1"
    result_order:
      1: "Main efficiency claim (RQ1): efficiency ratio figure + learning curve"
      2: "Mechanistic grounding (RQ2): equivariance verification table (max_diff)"
      3: "Regime-dependent crossover (RQ3): ordering plot + gate_metrics bar chart"
      4: "Full-scale convergence (RQ4): table + connection to Dayan 2026"
    anti_pattern: "Do NOT list 'Table 1 shows X' without interpreting what X means for the claim"

  discussion:
    narrative_purpose: "Interpret results beyond the RQs — what does the crossover mean theoretically? What should practitioners do? Where are the honest limits?"
    key_findings_interpretation:
      - finding: "6.8x efficiency advantage motivates equivariant encoders as the preferred approach for medium-to-large model zoos"
        implication: "Reduces zoo collection requirement by ~7x — makes weight-space property prediction practical from collected checkpoints"
      - finding: "N=100 crossover reveals minimum-data threshold for graph encoder generalization"
        implication: "Architecture complexity must be matched to data density; equivariant graph encoders require zoo sizes above a threshold to benefit from their inductive bias"
      - finding: "PermAug and structural equivariance have qualitatively different learning dynamics at N=100"
        implication: "The two symmetry strategies are distinguishable, not interchangeable; this validates the value of studying them separately"
    honest_limitations:
      - "CIFAR-10 only — MNIST zoo not available locally; single-zoo results"
      - "DWSNets property prediction not tested on CNN zoo (architectural constraint)"
      - "N=100 crossover finding is single-seed and statistically fragile"
      - "Low zoo diversity (CIFAR-10 accuracy variance=0.025) may affect absolute R^2 values"

  conclusion:
    narrative_purpose: "Return to the hook's question and answer it; summarize what changed; open the future"
    callback_to_hook: "Return to 'Why does a symmetry-enforcing architecture fail at the very scale where its inductive bias should matter most?' and answer it with the minimum-data threshold explanation"
    summary_framing: "We addressed [gap] by [design]; found [main result]; discovered [novel finding]; established [protocol]"
    memorable_ending: "As model zoos grow and equivariant encoder designs mature, the minimum-data threshold we identify may shrink — but until it does, practitioners with small zoos should start with augmented simplicity, not equivariant complexity."

