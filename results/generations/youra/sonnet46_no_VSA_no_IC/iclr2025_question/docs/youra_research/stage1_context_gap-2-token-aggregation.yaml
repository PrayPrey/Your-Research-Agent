gap_id: "gap-2-token-aggregation"
gap_title: "Systematic Comparison of Token-Level Uncertainty Aggregation Strategies Without Fine-Tuning"
gap_description: |
  No existing study isolates max vs. mean vs. sum token log-prob aggregation as the sole
  variable on fixed factual QA benchmarks using frozen models. Individual methods (CCP, EPR, SE)
  each use different aggregation strategies but never ablate aggregation in isolation.
