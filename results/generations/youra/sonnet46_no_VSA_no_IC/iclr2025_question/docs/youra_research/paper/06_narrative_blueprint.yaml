# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress the entire story into ~150 words — prioritize storytelling over numerical detail"
    key_message: |
      The optimal token-level log-probability aggregation function for zero-cost hallucination
      detection is determined by hallucination type, not arbitrary — and the rule is:
      use min for factual recall, mean for imitative falsehood. This principle is
      mechanistically grounded and empirically confirmed with large effect sizes.
    structure_notes: |
      - Sentence 1-2: Hook — no single aggregation is best; the optimal choice depends on
        hallucination type (counterintuitive opening)
      - Sentence 3: Our approach — controlled ablation with mechanistic predictions
      - Sentence 4-5: Main results — P1, P2 AUROC differentials with CIs; raw_sum finding
      - Sentence 6: Significance — first principled selection criterion; zero-cost deployment
    avoid:
      - "Citations in abstract"
      - "Vague claims without numbers"
      - "Undefined acronyms (SE, CCP, etc.)"
      - "Starting with 'Large language models have...'"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"
    hook_strategy: |
      Open with the counterintuitive finding: there is no universally optimal aggregation
      function, and the right choice FLIPS between benchmark types. This creates productive
      tension — the reader knows the conclusion but wants to understand WHY and HOW.
      Support with the concrete magnitude: 12 AUROC points is a large, reproducible gap.
    problem_escalation: |
      1. Surface: Hallucination is a critical problem; token log-probs are widely used as
         cheap detection signal.
      2. Deeper: The aggregation step is universally overlooked despite being a meaningful
         design choice. Prior work: ad hoc (CCP: mean; SE: sum within clusters; SelfCheckGPT:
         ad hoc). No systematic comparison; no mechanistic theory.
      3. Gap: No study has isolated aggregation as sole variable with directional predictions.
         Liu et al. 2025 identify this as an open challenge.
    insight_preview: |
      Briefly introduce the hallucination-type taxonomy and its link to token distribution
      shape without full technical detail. "We show that the aggregation function should
      match the structure of the hallucination signal, which differs predictably between
      factual recall and imitative falsehood."
    contributions_framing: |
      Present contributions as natural outcomes of the insight:
      (1) Mechanism-grounded prediction → confirmed via peakedness analysis (h-m1) and
          Spearman ρ (h-m2).
      (2) Directional AUROC confirmation → P1 and P2 with bootstrap CIs (h-m3).
      (3) Unexpected finding: raw_sum as strongest factual-recall detector, exceeding SE.
      (4) Practical guideline: aggregation-function selection criterion without labels.
    transition_to_related_work: |
      "To understand how this contribution relates to prior uncertainty estimation methods,
      we next situate our work within the landscape of hallucination detection approaches."

  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify our approach"
    positioning_strategy: |
      Not adversarial — build on prior work while showing the specific gap each family leaves.
      The argument: every prior method implicitly chooses an aggregation function without
      testing whether that choice is optimal for the benchmark type. Our contribution fills
      the gap all prior methods share.
    key_comparison_points:
      - area: "Mean log-prob methods (CCP, Fadeeva et al. 2024)"
        limitation_to_highlight: |
          Uses mean implicitly; achieves AUROC 0.72–0.80 on TriviaQA/NQ but does not test
          whether min would outperform on factual recall benchmarks.
        how_we_differ: |
          We show min outperforms mean by 5–12 AUROC points on TriviaQA — the gap CCP
          could have closed with a different aggregation choice.

      - area: "Semantic Entropy (Farquhar et al. 2023)"
        limitation_to_highlight: |
          Uses sum (predictive entropy) within NLI clusters; requires N=10 samples;
          AUROC ~0.79 on TriviaQA. Does not ablate aggregation function; does not explain
          why sum is used.
        how_we_differ: |
          Our raw_sum (single forward pass) achieves 0.895–0.896 AUROC on TriviaQA,
          exceeding SE at 10× lower inference cost. We additionally explain WHY length-
          sensitive sum outperforms on factual recall (length-confidence signal).

      - area: "SelfCheckGPT (Manakul et al. 2023)"
        limitation_to_highlight: |
          Ad hoc probability baselines without directional predictions; requires N=20 samples.
          Does not provide mechanism-grounded aggregation selection guidance.
        how_we_differ: |
          Controlled comparison with mechanism explanation — the first paper to predict
          aggregation advantage direction from hallucination type.

      - area: "Survey: Liu et al. 2025"
        limitation_to_highlight: |
          Identifies systematic aggregation comparison as open gap in the literature.
        how_we_differ: |
          Directly fills the gap identified by Liu et al. — controlled ablation with
          mechanism-grounded predictions.

    papers_to_discuss:
      - "Fadeeva et al. 2024 (CCP, arXiv:2403.04696)"
      - "Farquhar et al. 2023 (Semantic Entropy, arXiv:2302.09664)"
      - "Manakul et al. 2023 (SelfCheckGPT, arXiv:2303.08896)"
      - "Lin et al. 2021 (TruthfulQA, arXiv:2109.07958)"
      - "Kadavath et al. 2022 (P(True), arXiv:2207.05221)"
      - "Liu et al. 2025 (survey)"
      - "Guo et al. 2017 (calibration)"
      - "Xiong et al. 2024 (uncertainty LLMs survey)"

  methodology:
    narrative_purpose: "Explain WHY this design solves the problem"
    connection_to_insight: |
      The methodology is the operationalization of the mechanism hypothesis.
      The three-step mechanism predicts what we should measure (distribution shape,
      rank correlation, AUROC differential) and in what order (distributional evidence
      first → rank-level second → threshold-level third). The experiment design is not
      arbitrary — it follows from the causal chain.
    key_design_decisions:
      - decision: "Freeze model weights; vary only aggregation function"
        rationale: |
          Isolates aggregation as the sole variable. Any observed AUROC difference
          can be attributed to aggregation function, not model differences.
          Prior work always confounds model, training, and aggregation simultaneously.
        alternatives_considered: |
          Fine-tuned models or prompt-varied models were rejected — they introduce
          confounds that prevent clean attribution to aggregation choice.

      - decision: "Two model families (LLaMA-2-7B and Mistral-7B-v0.1)"
        rationale: |
          Cross-architecture replication strengthens generalizability. LLaMA and Mistral
          differ in pretraining data, tokenization, and architecture — consistent
          directional results across both families argue against model-specific artifacts.
        alternatives_considered: |
          Single model would leave open the question of generalizability. Larger models
          (70B) are beyond GPU resource constraints; 7B provides two-model replication
          as the strongest available generalizability evidence within budget.

      - decision: "Bootstrap 95% CI for all AUROC comparisons"
        rationale: |
          Provides bounded uncertainty estimates for the directional claims.
          Parametric tests (e.g., DeLong) make assumptions that may not hold for
          paired AUROC comparisons. Bootstrap percentile CI is distribution-free
          and directly quantifies the uncertainty in AUROC differentials.
        alternatives_considered: |
          DeLong test rejected for assumption sensitivity. Single AUROC point estimates
          rejected for lacking uncertainty quantification. Bootstrap with n=1000 is
          standard in the uncertainty estimation literature (Farquhar et al. 2023).

      - decision: "Two benchmark types: TriviaQA (factual recall) and TruthfulQA (imitative falsehood)"
        rationale: |
          These two benchmark types represent the two distinct hallucination mechanisms
          the theory predicts will produce different distribution shapes.
          Farquhar 2023 TriviaQA/NQ splits provide reproducible binary labels.
          TruthfulQA generation subset provides standard imitative-falsehood labels.
        alternatives_considered: |
          SciQ added as exploratory; NQ attempted but cache gap prevented inclusion.
          Only benchmarks with clear hallucination-type classification are included
          in the main analysis — off-type benchmarks would require additional mechanism
          analysis to position correctly.

      - decision: "Custom token log-prob extraction (batch=1, greedy decoding)"
        rationale: |
          lm-polygraph was evaluated and found to have version-compatibility issues.
          Custom implementation with 22/22 unit tests ensures correctness.
          Batch=1 is mandatory for log-prob numerical correctness under flash_attention_2.
          Greedy decoding provides deterministic, reproducible token sequences.
        alternatives_considered: |
          lm-polygraph rejected for compatibility issues. Temperature sampling rejected
          for introducing stochasticity that complicates log-prob interpretation.

    intuition_building: |
      Use a concrete "microphone vs. thermometer" analogy (min=microphone for detecting
      a single loud spike; mean=thermometer for detecting overall temperature).
      Show a schematic distribution figure contrasting peaked (TriviaQA hallucination)
      vs. flat (TruthfulQA hallucination) token probability distributions.
      Walk through the three-step mechanism explicitly before presenting the experiments.

  experiments:
    narrative_purpose: "Design experiments that test our specific claims"
    experimental_questions:
      - question: "Do aggregation functions produce measurably different AUROC values?"
        experiment: "h-e1: Three-way AUROC comparison (min/mean/raw_sum) on TriviaQA and TruthfulQA with bootstrap CI"
        expected_outcome: "At least one pair shows statistically significant AUROC difference on at least one benchmark type"

      - question: "Do recall-failure hallucinations produce peaked token distributions?"
        experiment: "h-m1: Peakedness ratio (kurtosis + max_prob/mean_prob) comparison between hallucinated and correct TriviaQA responses"
        expected_outcome: "Hallucinated responses show significantly higher peakedness (p<0.05)"

      - question: "Does rank-correlation advantage confirm mechanism at signal level?"
        experiment: "h-m2: Spearman ρ comparison (ρ(min) vs ρ(mean)) on TriviaQA and TruthfulQA for both models"
        expected_outcome: "ρ(min)>ρ(mean) on TriviaQA and ρ(mean)>ρ(min) on TruthfulQA, all CIs exclude 0"

      - question: "Do AUROC threshold differentials confirm directional predictions?"
        experiment: "h-m3: Bootstrap AUROC differential analysis for P1 (TriviaQA, min>mean≥0.02) and P2 (TruthfulQA, mean>min≥0.02) and P3 (raw_sum weakest)"
        expected_outcome: "P1 and P2 confirmed; P3 refuted (unexpected: raw_sum is strongest)"

    baseline_rationale: |
      Baselines are the three aggregation functions themselves (min, mean, raw_sum).
      The experiment is not method vs. baseline — it is a controlled ablation where
      the "baseline" is any aggregation choice, and the question is which choice
      is optimal for which benchmark type. Literature baselines (SE AUROC ~0.79,
      CCP AUROC ~0.72–0.80) provide external reference points for the absolute AUROC
      values but are not directly compared in the same pipeline.
    dataset_rationale: |
      TriviaQA (Farquhar 2023 splits): canonical factual recall benchmark with
      reproducible binary labels and established baselines in the literature.
      TruthfulQA (HuggingFace generation subset): canonical imitative-falsehood
      benchmark; Lin et al. 2021 establishes the inverse-scaling hallucination
      pattern at this benchmark type.
      The two benchmark types are selected to maximally contrast the two distribution
      shape hypotheses.
    metric_rationale: |
      AUROC is the primary metric: threshold-independent, commonly reported in the
      literature, and directly comparable to Fadeeva 2024 and Farquhar 2023 baselines.
      Spearman ρ is the mechanism-level metric: rank-order correlation is robust to
      monotonic transformations and threshold assumptions.
      Peakedness ratio is the distributional metric: directly measures the peaked vs.
      flat distribution shape predicted by the mechanism.

  results:
    narrative_purpose: "Present evidence that supports our claims"
    main_result_highlight: |
      The direction of aggregation advantage flips cleanly between TriviaQA (min>mean)
      and TruthfulQA (mean>min) with effect sizes of 5–12 AUROC points, confirmed
      across two model families with bootstrap 95% CIs excluding zero. The unexpected
      finding: raw_sum is strongest on TriviaQA (0.895–0.896), exceeding both min
      and mean — and exceeding published SE AUROC (~0.79) at single-pass cost.
    result_presentation_order:
      - result: "Distributional evidence (h-m1 peakedness)"
        purpose: |
          Present mechanism grounding first — establishes WHY the AUROC pattern follows
          before showing the AUROC numbers. This prevents the results from looking post-hoc.

      - result: "Rank-correlation evidence (h-m2 Spearman ρ)"
        purpose: |
          Threshold-agnostic confirmation of the mechanism at signal level.
          Strongest mechanistic evidence, confirmed across all four (model × dataset) pairs.

      - result: "AUROC evidence (h-m3 P1/P2/P3)"
        purpose: |
          Threshold-level confirmation directly measuring the magnitude of the claim.
          Present P1 and P2 confirmation first (the confirmed predictions), then P3
          refutation (the unexpected finding as a positive discovery).

      - result: "Raw_sum dominance on TriviaQA (unexpected finding)"
        purpose: |
          The "bonus" result that extends the practical contribution.
          Position as: "In addition to confirming the min/mean mechanism, we discover
          that the unnormalized sum outperforms both, motivating the sequence-level
          joint probability signal as future work."

    surprising_result_handling: |
      P3 refutation (raw_sum as strongest, not weakest): Present directly and honestly.
      Acknowledge the prediction failure. Provide the most likely interpretation
      (length-confidence confound / sequence-level calibration). Flag the length
      stratification analysis as needed future work. Do not bury or minimize.

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, show significance"
    key_findings_interpretation: |
      The results establish three layers of evidence for the mechanism: distributional
      (h-m1), rank-order (h-m2), and threshold (h-m3). This layered structure is unusual
      for hallucination detection papers and provides stronger mechanistic support than
      any single metric. The cross-architecture consistency (LLaMA and Mistral) within
      7B scale is the strongest available generalizability evidence within the resource budget.
      The raw_sum discovery reframes sequence-level joint probability as an underexplored
      zero-cost signal — a practical implication beyond the original mechanism study.
    honest_limitations:
      - limitation: "NQ results unavailable due to data cache gap"
        why_acceptable: |
          NQ and TriviaQA are the same hallucination type (factual recall). Mechanism
          confirmed at type level via two metrics and two models. TriviaQA effect sizes
          are large (Δ≥0.056 AUROC, Δρ≥0.092). NQ replication requires only GPU time.
        future_mitigation: |
          Re-run h-e1 inference on NQ-Open (~2h GPU). All code exists.

      - limitation: "7B model scale only"
        why_acceptable: |
          Cross-architecture consistency at 7B (LLaMA + Mistral) established.
          TruthfulQA inverse scaling (Lin 2021) predicts stronger P2 effects at 70B+.
          7B provides a lower bound; scale extension is natural future work.
        future_mitigation: |
          Multi-GPU setup for 13B/70B experiments in follow-up work.

      - limitation: "P3 refuted (raw_sum unexpectedly strongest on TriviaQA)"
        why_acceptable: |
          Scientific finding, not experimental failure. P3 was not a gating condition
          for the main contributions (P1, P2, and mechanism). Raw_sum refutation
          enriches the contribution with a novel positive finding.
        future_mitigation: |
          Length-stratified AUROC analysis to determine if advantage is genuine
          signal or length-confidence confound.

      - limitation: "Multi-sample baselines not in same pipeline"
        why_acceptable: |
          Zero-cost single-pass is a practically important distinct regime.
          Our best result (raw_sum 0.895) already exceeds published SE AUROC (~0.79).
        future_mitigation: |
          Phase 5 baseline comparison pipeline (available but not executed in this study).

    broader_impact_statement: |
      This work advances zero-cost hallucination detection — a practically important
      component of responsible LLM deployment. By providing a principled selection
      criterion for aggregation function based on expected hallucination type, we reduce
      the risk of systematically underperforming detection for specific error classes.
      The mechanism-grounded framework may generalize to other sequence-level tasks
      where token probability distributions carry task-type-specific structure.

  conclusion:
    narrative_purpose: "Reinforce key message + open future directions"
    callback_to_hook: |
      Close the loop opened by the hook: "The best hallucination detector depends on
      what kind of hallucination you expect — and that is now a principled choice,
      not a guess." This directly answers the question posed in the opening.
    memorable_ending: |
      The lasting impression: token log-probabilities carry richer structure than
      previously appreciated. The aggregation function is a design choice with a
      mechanistic answer. Choosing the right one is free — the only cost is knowing which
      one to choose.
    future_work_vision: |
      Not a list of "more experiments" — frame as: the three-step mechanism opens
      a research direction in hallucination-type-aware detection. Immediate next step
      (NQ, length stratification) is infrastructure that exists. Longer-term vision:
      adaptive aggregation without labels, scale extension, taxonomy extension beyond
      two benchmark types.

