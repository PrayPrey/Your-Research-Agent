# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "On TriviaQA and NQ (Farquhar 2023 splits), min log-prob achieves AUROC ≥ mean log-prob + 0.02 for both LLaMA-2-7B and Mistral-7B-v0.1"
    test_method: "Compute token-level log-probs via single forward pass on frozen models; apply min and mean aggregation; compute AUROC against exact-match correctness labels; bootstrap 95% CI (n=1000) on AUROC difference"
    success_criterion: "AUROC(min) - AUROC(mean) ≥ 0.02 AND bootstrap 95% CI lower bound > 0 for both models on both TriviaQA and NQ"
    falsification: "If AUROC(min) - AUROC(mean) < 0.02 OR bootstrap 95% CI includes 0 for either model on TriviaQA/NQ"
  - id: "P2"
    primary: false
    statement: "On TruthfulQA generation subset, mean log-prob achieves AUROC ≥ min log-prob + 0.02 for both LLaMA-2-7B and Mistral-7B-v0.1"
    test_method: "Same protocol as P1 applied to TruthfulQA generation subset with binary truth labels"
    success_criterion: "AUROC(mean) - AUROC(min) ≥ 0.02 AND bootstrap 95% CI lower bound > 0 for both models"
    falsification: "If AUROC(mean) - AUROC(min) < 0.02 OR bootstrap 95% CI includes 0 for either model on TruthfulQA"
  - id: "P3"
    primary: false
    statement: "Raw-sum log-prob achieves lower AUROC than both min and mean log-prob across TriviaQA, NQ, and TruthfulQA"
    test_method: "Same AUROC computation using raw-sum (unnormalized sum of token log-probs); compare to min and mean on all three benchmarks"
    success_criterion: "AUROC(sum) < AUROC(min) AND AUROC(sum) < AUROC(mean) on all three benchmarks for both models (directional, not threshold-gated)"
    falsification: "If raw-sum achieves AUROC equal to or exceeding min or mean on any benchmark; length-controlled analysis added to diagnose confound"

