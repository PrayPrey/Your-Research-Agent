established_facts:
  claims:
    - claim: "Token-level log-probabilities from frozen LLMs correlate with hallucination on factual QA benchmarks"
      status: "BUILD_ON"
      evidence: "Fadeeva et al. 2024 (CCP, arXiv:2403.04696): AUROC 0.72-0.80 on TriviaQA/NQ using mean log-prob; Farquhar et al. 2023 (SE, arXiv:2302.09664): predictive entropy (sum) achieves AUROC ~0.72 on TriviaQA"
    - claim: "Semantic entropy (multi-sample, NLI-clustered) outperforms raw token log-prob aggregation on TriviaQA"
      status: "BUILD_ON"
      evidence: "Farquhar et al. 2023: SE AUROC ~0.79 vs. predictive entropy ~0.72; published in Nature 2024"
    - claim: "SelfCheckGPT (N-sample consistency) achieves AUROC 0.72-0.78 on sentence-level hallucination detection"
      status: "BUILD_ON"
      evidence: "Manakul et al. 2023 (arXiv:2303.08896): NLI consistency variant; requires N=20 samples"
    - claim: "No study has ablated max vs. mean vs. sum token log-prob aggregation in isolation on fixed factual QA splits"
      status: "PROVE_NEW"
      evidence: "Phase 1 literature review: Fadeeva uses mean; Farquhar uses sum within clusters; SelfCheckGPT repo has ad-hoc baselines. Liu et al. 2025 survey identifies this as an open challenge."
    - claim: "Optimal aggregation function is determined by hallucination type (imitative vs. recall failure)"
      status: "PROVE_NEW"
      evidence: "New hypothesis from discussion — no prior paper has tested this; theoretical argument from signal geometry analysis in Exchange 7"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Claims 1-3 (BUILD_ON) are established and can serve as baselines without re-verification.
    Claims 4-5 (PROVE_NEW) are the core experimental contribution.
    Phase 2B should focus verification protocols on claims 4-5.
    The AUROC values from claim 1-2 serve as comparative baselines for our experimental results.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TokenAgg-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under frozen open-weight LLMs (LLaMA-2-7B, Mistral-7B-v0.1) evaluated on existing factual QA
    benchmarks with binary correctness labels (Farquhar 2023 splits for TriviaQA/NQ; standard
    TruthfulQA generation subset), if we vary only the token-level log-probability aggregation
    function (min, mean, raw-sum) applied to single-forward-pass output probabilities, then the
    AUROC for hallucination detection will differ significantly across aggregation functions in a
    benchmark-type-dependent pattern: min log-prob achieves AUROC ≥ mean log-prob on factual
    recall benchmarks (TriviaQA, NQ) by ≥ 0.02, while mean log-prob achieves AUROC ≥ min
    log-prob on imitative-falsehood benchmarks (TruthfulQA) by ≥ 0.02, because hallucination
    signal concentrates at the single most uncertain fact-token in recall failures but is
    distributed uniformly across all tokens in imitative falsehoods.
  alternative_hypothesis_h0: |
    There is no significant difference in AUROC between min log-prob, mean log-prob, and raw-sum
    log-prob aggregation functions across TriviaQA, NQ, and TruthfulQA benchmark splits; any
    observed AUROC differences are within bootstrap 95% confidence intervals and do not exceed
    0.02 in either direction.

