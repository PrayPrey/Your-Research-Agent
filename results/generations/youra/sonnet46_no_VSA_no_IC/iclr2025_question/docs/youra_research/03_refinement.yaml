novelty:
  preserved_novelty: "First paper to isolate token-level log-probability aggregation function as the sole experimental variable, with benchmark-type-dependent directional predictions grounded in a hallucination taxonomy (Type A imitative vs. Type B recall failure)"
  key_innovation: "Hallucination-type-to-aggregation-function mapping: the hypothesis that optimal zero-parameter uncertainty signal depends on the structural nature of the hallucination (concentrated vs. distributed token-level uncertainty), not on model scale or benchmark difficulty"
  differentiation:
    - prior_work: "Fadeeva et al. 2024 (CCP)"
      difference: "CCP uses mean as implicit baseline and proposes CCP as improvement; never ablates min vs. mean vs. sum as competing strategies on the same conditions"
    - prior_work: "Farquhar et al. 2023 (Semantic Entropy)"
      difference: "SE uses sum (Rao-Blackwellised) within semantic clusters; never ablates single-pass aggregation functions; multi-sample not single-pass"
    - prior_work: "Manakul et al. 2023 (SelfCheckGPT)"
      difference: "Probability baselines in repo are ad-hoc, not systematically ablated; no directional predictions; not framed as controlled study"
    - prior_work: "Liu et al. 2025 (Survey)"
      difference: "Survey identifies lack of systematic aggregation comparison as gap; our paper fills it with experimental evidence and theoretical grounding"

