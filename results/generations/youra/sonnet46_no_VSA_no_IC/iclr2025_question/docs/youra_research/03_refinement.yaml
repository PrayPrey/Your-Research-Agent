variables:
  independent:
    - name: "Token-level log-probability aggregation function"
      type: "categorical"
      operationalization: "Applied to the sequence of token log-probabilities from a single greedy/argmax forward pass on frozen LLM"
      levels:
        - "min log-prob (most uncertain token; worst-case signal)"
        - "mean log-prob (= length-normalized sum; average uncertainty)"
        - "raw-sum log-prob (total log-probability; length-sensitive)"
    - name: "Benchmark type"
      type: "categorical"
      operationalization: "Factual QA dataset with binary correctness labels"
      levels:
        - "TriviaQA (factual recall; variable answer length)"
        - "Natural Questions (factual recall; variable answer length)"
        - "TruthfulQA generation subset (imitative falsehood; short answers)"
        - "SciQ (exploratory; science factual QA)"
  dependent:
    - name: "AUROC for hallucination detection"
      type: "continuous"
      operationalization: "Area Under ROC Curve; aggregation function score as predictor, binary correctness label as target; range [0,1]; higher = better hallucination detector"
      primary: true
    - name: "AURAC (Area Under Risk-Coverage Curve)"
      type: "continuous"
      operationalization: "Risk-coverage tradeoff when abstaining based on aggregation function threshold; computed by lm-polygraph evaluation suite"
      primary: false
  controlled:
    - name: "LLM model weights"
      operationalization: "Frozen weights — no fine-tuning; same checkpoint used for all aggregation functions"
    - name: "Benchmark splits"
      operationalization: "Exact splits from Farquhar et al. 2023 (jlko/semantic_uncertainty repo) for TriviaQA/NQ; standard TruthfulQA generation split"
    - name: "Decoding strategy"
      operationalization: "Greedy decoding (argmax) for single forward pass; temperature=0"
    - name: "Correctness label methodology"
      operationalization: "Exact match / F1 against reference answers, identical to Farquhar 2023 to ensure comparability"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Hallucination type determines token probability distribution shape. Recall-failure hallucinations produce a peaked uncertainty distribution (single low-probability fact-token surrounded by high-probability function words). Imitative-falsehood hallucinations produce a flat high-probability distribution (all tokens receive high probability because the model confidently recites learned-but-wrong content)."
      evidence: "Theoretical argument from signal geometry analysis (Exchange 7); consistent with Kadavath et al. 2022 finding that P(True) correlates with self-knowledge; consistent with TruthfulQA inverse scaling (Lin et al. 2021 — larger models are MORE confidently wrong, suggesting uniform high probability)"
      falsifier: "If token probability histograms for hallucinated answers on TruthfulQA show peaked (not flat) distributions, Step 1 is false"
    - step: 2
      description: "Aggregation function sensitivity aligns with distribution shape. Min log-prob is sensitive to the single most uncertain token — it captures the peaked distribution's spike effectively. Mean log-prob averages over all tokens — it captures the elevated mean uncertainty in flat high-probability-but-wrong distributions more effectively than min (which may be close to 0 uncertainty for any single token in a flat distribution)."
      evidence: "Mathematical consequence of aggregation function properties; consistent with Fadeeva et al. 2024 finding that length-normalized mean outperforms unnormalized sum; consistent with SelfCheckGPT probability-based-baselines.ipynb showing max/mean differences on different example types"
      falsifier: "If min and mean log-prob produce identical ranked orderings on both benchmark types, Step 2 is false"
    - step: 3
      description: "AUROC differential reflects aggregation-distribution alignment. Because AUROC measures ranking ability (can we rank hallucinated above non-hallucinated), the aggregation function that best captures the hallucination signal for a given distribution shape will produce the highest AUROC. The benchmark-type-dependent pattern in AUROC is therefore a direct consequence of steps 1-2."
      evidence: "Standard statistical argument: AUROC depends on the quality of the underlying signal; signal quality depends on alignment between aggregation function and signal distribution shape"
      falsifier: "If AUROC differences between min and mean are not statistically significant (within bootstrap 95% CI) on the benchmarks where step 1-2 predict differences, Step 3 is false"
  key_tension: "TruthfulQA's inverse scaling suggests larger models are MORE confidently wrong — but if we use smaller models (LLaMA-2-7B, Mistral-7B-v0.1), they may not show strong imitative hallucination patterns, potentially weakening the TruthfulQA prediction (P2)"
  evidence_summary: |
    The mechanism rests on a well-grounded theoretical argument about how different hallucination
    types produce different token probability distributions, combined with the mathematical
    properties of min vs. mean aggregation. The theoretical argument is consistent with observations
    in Fadeeva 2024, TruthfulQA inverse scaling (Lin 2021), and SelfCheckGPT baselines (Manakul 2023).
    No paper has directly tested this mechanism, making it genuinely new.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "TruthfulQA generation subset at 7B model scale exhibits imitative-falsehood hallucination pattern (flat high-probability wrong answers), not recall-failure pattern"
    supporting_evidence: "TruthfulQA inverse scaling with model size (Lin 2021); hallucinations in TruthfulQA are designed to match human misconceptions, suggesting the model learned them confidently"
    consequence_if_violated: "P2 (mean > min on TruthfulQA) would not hold; TruthfulQA would join the factual-recall group, making the hypothesis non-differentiating"
  - id: "A2"
    assumption: "TriviaQA and NQ at 7B model scale exhibit recall-failure hallucination pattern (peaked uncertainty at specific fact-token)"
    supporting_evidence: "Farquhar 2023 finding that SE (which captures semantic uncertainty, not just token-level max) outperforms predictive entropy (sum) — consistent with semantic uncertainty being concentrated rather than distributed; CCP's success with mean aggregation (not max) is the only evidence against this, but CCP includes a correction factor"
    consequence_if_violated: "P1 (min > mean on TriviaQA/NQ) would not hold; the hypothesis direction collapses"
  - id: "A3"
    assumption: "Token log-probabilities from greedy decoding are representative of the model's uncertainty (vs. requiring sampling)"
    supporting_evidence: "Standard assumption in white-box UQ literature; Fadeeva 2024, Moslonka 2025 both use single-forward-pass logprobs; the token probability sequence from greedy decoding reflects the model's confidence in its own output"
    consequence_if_violated: "Greedy log-probs might not reflect true model uncertainty; sampling-based estimates might be required — but this would undermine the zero-cost framing"
  - id: "A4"
    assumption: "Exact-match / F1 labels from Farquhar 2023 splits provide sufficiently clean binary hallucination labels"
    supporting_evidence: "Farquhar 2023 uses these labels and achieves AUROC ~0.79 — sufficient signal exists; same methodology as multiple published baselines"
    consequence_if_violated: "Label noise ceiling limits maximum achievable AUROC; but since all aggregation functions face the same ceiling, relative comparisons remain valid"
  - id: "A5"
    assumption: "lm-polygraph implements min, mean, and raw-sum token log-prob as distinct UE estimators that can be run on LLaMA-2-7B and Mistral-7B-v0.1 via the same benchmark pipeline"
    supporting_evidence: "lm-polygraph documentation: token_entropy (= mean), token_prob (product = geometric mean), max_token_entropy (= max entropy = min log-prob variant) are listed as implemented estimators; Mistral and LLaMA-2 are listed as supported models"
    consequence_if_violated: "Minor implementation work needed to add missing estimators; does not invalidate hypothesis"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Open-weight frozen LLMs with white-box logprob access (LLaMA-2-7B, Mistral-7B-v0.1 confirmed; GPT-2 as lightweight baseline)
    - Factual QA benchmarks with binary correctness labels derived from reference answer matching
    - Short-to-medium answer generation tasks (sentence-level answers typical of TriviaQA/NQ/TruthfulQA)
    - Single-forward-pass greedy decoding (no sampling required)
    - English-language benchmarks
  does_not_apply_to: |
    - Long-form generation (summarization, essay writing) — answer length confound dominates
    - Code generation — correctness labels require execution, not reference matching
    - Multi-turn dialogue — context window effects dominate
    - Black-box API models without logprob access (GPT-4, Claude) — logprobs unavailable
    - Tasks requiring calibration (probability thresholding) rather than ranking (AUROC)
    - SciQ: included as exploratory only; hallucination type classification uncertain
  known_limitations: |
    - Tokenization granularity varies across model families: within-model comparisons are clean;
      cross-model comparisons require normalization by entropy baseline
    - TruthfulQA prediction (P2) may be weaker at 7B scale than at 70B+ scale where
      inverse scaling is more pronounced
    - The ≥0.02 AUROC threshold for practical significance is pragmatic; formal justification
      requires connecting to downstream deployment context (coverage-accuracy tradeoff)
    - SciQ hallucination type classification (A vs. B) is uncertain — treated as exploratory

