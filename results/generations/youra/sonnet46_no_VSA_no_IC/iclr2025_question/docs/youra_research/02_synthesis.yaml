measurement_plan:
  data_collection:
    - source: "jlko/semantic_uncertainty: TriviaQA/NQ question-answer pairs with Farquhar 2023 splits and correctness labels"
    - source: "HuggingFace datasets: truthful_qa (generation config), sciq"
    - source: "LLaMA-2-7B and Mistral-7B-v0.1 token log-probabilities via HuggingFace transformers (forward pass, greedy decoding)"
  procedure:
    - step: "Load frozen model (LLaMA-2-7B or Mistral-7B-v0.1) in eval mode; no gradient computation"
    - step: "For each benchmark question, generate greedy response; collect token log-probability sequence from the model's logits"
    - step: "Compute 3 aggregation functions on the token log-prob sequence: min (most uncertain token), mean (length-normalized sum), raw-sum (unnormalized)"
    - step: "Retrieve binary correctness label (exact match or F1 ≥ threshold against reference answers, per Farquhar 2023 methodology)"
    - step: "Compute AUROC using aggregation function score (negated, since higher uncertainty = more likely hallucinated) vs. binary label; bootstrap 95% CI (n=1000)"
    - step: "Compute AURAC using lm-polygraph evaluation pipeline for secondary metric"
    - step: "Run baseline comparisons: SE (jlko/semantic_uncertainty), SelfCheckGPT (potsawee/selfcheckgpt), CCP mean (lm-polygraph)"
  success_criteria:
    - "P1 confirmed: AUROC(min) - AUROC(mean) ≥ 0.02 with bootstrap 95% CI lower bound > 0 on TriviaQA and NQ for both models"
    - "P2 confirmed: AUROC(mean) - AUROC(min) ≥ 0.02 with bootstrap 95% CI lower bound > 0 on TruthfulQA for both models"
    - "P3 confirmed: AUROC(sum) < AUROC(min) and AUROC(sum) < AUROC(mean) directionally on all three benchmarks"

