hypothesis_draft:
  title: "Hallucination-Type-Dependent Token Aggregation (HDTA): Optimal Token Log-Prob Aggregation Function Is Determined by Hallucination Type on Existing Factual QA Benchmarks"
  hypothesis_id: "H-TokenAgg-v1"
  core_claim: |
    Among token-level log-probability aggregation functions (min, mean, raw-sum) computed from
    a single forward pass on frozen open-weight LLMs, the aggregation function that maximizes
    AUROC for hallucination detection is benchmark-type-dependent: min log-prob dominates on
    factual recall benchmarks (TriviaQA, NQ) and mean log-prob dominates on imitative-falsehood
    benchmarks (TruthfulQA). This is because hallucination type determines token probability
    distribution shape: recall failures produce peaked uncertainty (single uncertain fact-token),
    which min captures; imitative falsehoods produce flat high-probability wrong answers, which
    mean captures.
  mechanism: |
    Step 1: Hallucination type → distribution shape.
    Recall-failure hallucinations (TriviaQA/NQ): model uncertain about specific entity/fact-token;
    produces peaked uncertainty distribution (one low log-prob token amid high log-prob function words).
    Imitative-falsehood hallucinations (TruthfulQA): model confidently recites learned misconception;
    produces flat high-probability distribution (all tokens uniformly high probability but wrong).

    Step 2: Distribution shape → aggregation function sensitivity.
    Min log-prob captures the single most uncertain token — optimal signal for peaked distributions.
    Mean log-prob averages over all tokens — optimal signal for elevated-mean flat distributions.
    Raw-sum log-prob is length-confounded — inferior to both min and mean for ranking tasks.

    Step 3: Aggregation-distribution alignment → AUROC differential.
    AUROC measures ranking ability; better alignment between aggregation function and hallucination
    signal distribution → higher AUROC. Therefore AUROC follows the benchmark-type pattern.
  predictions:
    - P1: "min log-prob AUROC ≥ mean log-prob AUROC + 0.02 on TriviaQA and NQ (Farquhar 2023 splits) for LLaMA-2-7B and Mistral-7B-v0.1"
    - P2: "mean log-prob AUROC ≥ min log-prob AUROC + 0.02 on TruthfulQA generation subset for LLaMA-2-7B and Mistral-7B-v0.1"
    - P3: "raw-sum log-prob AUROC < both min and mean AUROC across TriviaQA, NQ, and TruthfulQA for both models"

variables_summary:
  independent: "Token-level log-probability aggregation function (min, mean, raw-sum) × Benchmark type (TriviaQA, NQ, TruthfulQA, SciQ)"
  dependent_primary: "AUROC for hallucination detection (aggregation function score vs. binary correctness label)"
  controlled: "Frozen LLM weights; Farquhar 2023 exact benchmark splits; greedy decoding; exact-match correctness labels"

null_hypothesis:
  h0_statement: |
    All token-level log-probability aggregation functions (min, mean, raw-sum) produce
    statistically equivalent AUROC distributions across TriviaQA, NQ, and TruthfulQA benchmark
    splits; observed differences are within bootstrap 95% confidence intervals and do not exceed
    0.02 in absolute terms for either model.
  statistical_test: "Bootstrap confidence intervals (n=1000) on pairwise AUROC differences; Friedman test for global equivalence across all aggregation functions within each benchmark"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic ablation of token log-prob aggregation as sole variable; first mechanistic prediction connecting hallucination type to optimal aggregation function; establishes Type A (imitative) vs. Type B (recall failure) hallucination taxonomy with measurement implications"
  differentiation_summary: |
    Fadeeva 2024 (CCP): uses mean implicitly, proposes CCP as improvement — never ablates min vs. mean.
    Farquhar 2023 (SE): uses sum within NLI clusters, multi-sample — never ablates single-pass functions.
    Manakul 2023 (SelfCheckGPT): includes ad-hoc probability baselines — not a controlled ablation study.
    Liu 2025 (Survey): identifies the gap as open — our study fills it with theoretical grounding.
    Vipulanandan 2026 (closest): tests 8 LLMs on multiple benchmarks but uses SE (multi-sample), not single-pass aggregation ablation.

