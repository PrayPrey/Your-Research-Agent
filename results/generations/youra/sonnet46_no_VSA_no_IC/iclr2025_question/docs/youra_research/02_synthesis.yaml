    - "Farquhar 2023 splits are standard in the UQ literature — results directly comparable to SE, SE-probes, etc."

discussion_synthesis:
  key_insights:
    - "Hallucination type (Type A: imitative/uniform vs. Type B: recall-failure/peaked) is a new taxonomy that predicts optimal uncertainty measure — this emerged from signal geometry analysis in Exchange 1 and was refined through Exchanges 3-7"
    - "Min log-prob as a hallucination signal is theoretically motivated for recall-failure tasks but has never been systematically tested against mean — this gap is the core contribution"
    - "Geometric mean of log-probs is a monotone transform of mean for AUROC purposes (same ranking) — reduces the ablation to 3 genuinely distinct functions (min, mean, raw-sum)"
    - "lm-polygraph already implements all needed estimators; this is an execution task, not an implementation task"
    - "The null result is also meaningful: if min ≈ mean ≈ sum, practitioners can use any aggregation function interchangeably — also a useful finding for deployment"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): identified that TruthfulQA hallucination may be UNIFORM high confidence (mean wins), not single-token spike (max/min wins) — reversed the initial naive prediction"
    - "Exchange 7 (Dr. Nova): synthesized hallucination type taxonomy from Prof. Rex's insight; clarified that geometric mean = monotone transform of mean → reduces to 3 functions"
    - "Exchange 2 (Prof. Vera): established AUROC as primary metric and H0 formulation; introduced bootstrap CI methodology — gave the study a rigorous statistical framework"
  resolved_tensions:
    - "Tension: cross-model comparison vs. tokenization confound → Resolved: primary analysis within-model; cross-model as secondary replication with normalization caveat"
    - "Tension: mean vs. length-normalized sum → Resolved: they are the same function; explicitly noted to prevent reviewer confusion"
    - "Tension: how many aggregation functions to include → Resolved: 3 genuinely distinct (min, mean, raw-sum); geometric mean dropped as redundant with mean for AUROC"
    - "Tension: TruthfulQA directional prediction → Resolved: Prof. Rex's reversal is theoretically grounded; mean > min on TruthfulQA is the correct prediction"
