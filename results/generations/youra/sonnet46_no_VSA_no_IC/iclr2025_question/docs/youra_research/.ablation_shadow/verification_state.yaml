        excluded: []
      completed_at: '2026-08-21T14:00:00+00:00'
    validation:
      status: COMPLETED
      result: PARTIAL_PASS
      key_findings:
      - 'LLaMA-2-7B TriviaQA: AUROC(min)=0.8493 > AUROC(mean)=0.7299, diff=+0.119 (CI:[+0.083,+0.153]) — P1 confirmed on TriviaQA'
      - 'Mistral-7B TriviaQA: AUROC(min)=0.8924 > AUROC(mean)=0.8362, diff=+0.056 (CI:[+0.032,+0.082]) — P1 confirmed on TriviaQA'
      - 'LLaMA-2-7B TruthfulQA: AUROC(mean)=0.7207 > AUROC(min)=0.6010, diff_mean_min=+0.120 (CI:[+0.084,+0.157]) — P2 PASS'
      - 'Mistral-7B TruthfulQA: AUROC(mean)=0.6492 > AUROC(min)=0.5382, diff_mean_min=+0.111 (CI:[+0.071,+0.147]) — P2 PASS'
      - 'P1 gate FAIL: NQ npz missing from h-e1 (data gap, not mechanism failure); TriviaQA direction fully confirmed'
      - 'P3 gate FAIL: raw_sum unexpectedly achieves highest AUROC on TriviaQA (0.896-0.895); unnormalized length advantage
        on factual recall'
