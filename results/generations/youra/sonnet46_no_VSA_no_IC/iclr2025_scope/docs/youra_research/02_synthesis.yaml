hypothesis_draft:
  title: "Entropy-Guided Zero-Shot Selective Sliding Window Attention Conversion in Llama-2-7B"
  hypothesis_id: "H-EntropySWA-v1"
  core_claim: |
    In Llama-2-7B (32 attention layers, no fine-tuning), replacing the k=4 highest-entropy
    layers (by mean per-layer attention entropy on a 100-sequence calibration set) with
    sliding window attention (w=512 tokens) zero-shot maintains WikiText-103 perplexity
    within 2 points and GLUE SST-2 accuracy within 2 percentage points of the full-attention
    baseline, because high-entropy layers contribute less unique global context and the
    residual stream of 28 retained full-attention layers provides sufficient compensation.
  mechanism: |
    Three-step causal mechanism:
    1. ENTROPY SCORING: Per-layer mean attention entropy on 100 calibration sequences identifies
       layers with diffuse, low-information-value global attention (supported by HIES, Michel et al.)
    2. SWA REPLACEMENT: Replacing entropy-selected layers with SWA(w=512) aligns mechanism with
       measured behavior — these layers were not exploiting sharp global attention
    3. RESIDUAL STREAM COMPENSATION: 28 retained full-attention layers propagate global context
       through the residual stream, compensating for SWA layers' reduced reach (analogous to
       SWARR's finding that full-model SWA fails while partial retention is the mitigation)
  predictions:
    - P1: "k=4 entropy-guided SWA maintains WikiText-103 perplexity within 2pt of baseline (primary)"
    - P2: "Entropy-guided k=4 outperforms random-k=4 and last-k=4 on perplexity preservation"
    - P3: "k=8 entropy-guided SWA characterizes conversion capacity boundary (expected >5pt degradation)"

variables_summary:
  independent: "Layer selection strategy (entropy-guided / random-k / last-k / baseline) × number of converted layers k (0, 4, 8)"
  dependent_primary: "WikiText-103 perplexity delta from full-attention baseline (Δperplexity, lower is better)"
  controlled: "Model weights (Llama-2-7B, no fine-tuning), SWA window (w=512), calibration set (100 WikiText-103 sequences)"

null_hypothesis:
  h0_statement: |
    Entropy-guided k=4 SWA conversion produces WikiText-103 perplexity equal to or worse than
    random-k=4 SWA conversion (entropy provides no selection advantage); OR any selective SWA
    conversion (k≥1) causes >5pt perplexity degradation regardless of selection criterion (zero-shot
    selective SWA is infeasible in Llama-2-7B).
  statistical_test: "Paired comparison: Δperplexity(entropy-k4) vs Δperplexity(random-k4, mean of 3 seeds). No hypothesis test needed — perplexity comparison is deterministic given fixed model weights and evaluation set."
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical characterization of zero-shot accuracy bounds for selective FA→SWA layer conversion using entropy as a layer-level convertibility signal in a causal decoder LLM. Extends head-level entropy signal (HIES) to layer-level SWA conversion decisions. Complements SWAA (which requires fine-tuning) by defining the zero-shot frontier."
  differentiation_summary: |
    vs SWAA [2025]: SWAA converts ALL layers + requires fine-tuning. H-EntropySWA-v1 converts k/32<<1
    layers + zero-shot. Orthogonal contributions — SWAA tests the fine-tuned ceiling; this work tests
    the zero-shot floor and selective partial conversion regime.
    vs SWARR [2026]: Full-model conversion with RL recovery. Not applicable to zero-shot setting.
    vs HIES [2025]: Head-LEVEL entropy for PRUNING in encoders. This work: layer-LEVEL entropy for
    SWA CONVERSION in causal decoders. Different operation, granularity, architecture family.
    vs Michel et al. [2019]: HEAD REMOVAL at test time. SWA conversion is a weaker, more compute-
    efficient operation than removal — maintains head capacity with local window constraint.

