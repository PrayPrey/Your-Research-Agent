# =============================================================================
# PAPER FRAMING NOTE
# =============================================================================

framing_note: |
  This paper is written as an INTERIM VALIDATED CHECKPOINT. The entropy criterion
  prerequisite (h-e1) has been confirmed; the core accuracy-preservation experiments
  (h-e2, h-m1, h-m2, h-c1) remain pending. The paper contributes:

  (1) EMPIRICAL: First layer-level attention concentration characterization in
      Llama-2-7B via head-mean entropy (Gini=0.6829, universal across 200 examples).

  (2) METHODOLOGICAL: Head-mean pooling shown superior to head-max for stable
      layer-level entropy characterization (+32% relative Gini increase).

  (3) FRAMEWORK: The entropy-guided selective SWA conversion pipeline, validated
      at the prerequisite stage, with clear protocol for full validation.

  All pending claims are clearly marked as such. The paper's contribution is
  meaningful as a characterization and methodology paper, independent of h-e2 outcomes.
