    severity: "MEDIUM"

  - risk: "P1/P2/P3 unverified — paper contributions 4 rests on pending experiments"
    location: "Introduction contribution (4), Conclusion future work"
    detail: "Paper correctly marks these as pending. Adversarial review should verify conditional framing is consistent throughout."
