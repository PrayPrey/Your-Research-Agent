experimental_setup:
  dataset:
    name: "WikiText-103 + GLUE SST-2"
    type: "standard"
    source: "HuggingFace datasets (wikitext, glue)"
    path: "datasets.load_dataset('wikitext', 'wikitext-103-raw-v1') / datasets.load_dataset('glue', 'sst2')"
    hypothesis_fit: "WikiText-103 is the standard LM perplexity benchmark for transformer efficiency papers (used in SWAA, CoFiPruning). SST-2 is a standard discriminative classification benchmark for LLM evaluation. Both are existing, freely available HuggingFace datasets — no new benchmarks required."
  model:
    name: "Llama-2-7B"
    type: "causal decoder transformer, 32 attention layers, RoPE position encoding"
    source: "meta-llama/Llama-2-7b-hf (HuggingFace)"
    hypothesis_fit: "7B-scale causal decoder with 32 layers provides sufficient layer count for k=4 and k=8 selective conversion while maintaining k/N << 1. RoPE position encoding is standard for modern decoder LLMs. SWAA [2025] used the same model class. h-e1 pilot constraints (< 1 GPU-hour) are satisfied."
  baselines:
    - name: "Full-attention baseline (k=0)"
      method: "Llama-2-7B unmodified; all 32 layers use standard full causal attention"
    - name: "Random-k=4 selection"
      method: "4 layers selected uniformly at random (mean of 3 random seeds); SWA(w=512) applied to selected layers"
    - name: "Last-k=4 selection"
      method: "4 deepest layers (indices 28-31) converted to SWA(w=512); tests whether depth-based heuristic matches or beats entropy"
    - name: "Entropy-guided k=8 (boundary characterization)"
      method: "Top-8 entropy layers converted to SWA(w=512); tests degradation at higher conversion ratio"

