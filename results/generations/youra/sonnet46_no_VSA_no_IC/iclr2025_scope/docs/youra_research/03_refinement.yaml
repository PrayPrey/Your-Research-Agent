novelty:
  preserved_novelty: "Zero-shot selective SWA layer conversion guided by per-layer attention entropy in a pre-trained causal decoder LLM, with no fine-tuning required."
  key_innovation: "First empirical characterization of zero-shot accuracy bounds for selective FA→SWA layer conversion, using entropy as a layer-level convertibility signal. SWAA requires fine-tuning for recovery; this work tests the zero-shot frontier. The entropy criterion extends HIES head-level signal to layer-level conversion decisions."
  differentiation:
    - prior_work: "SWAA [Yu et al., 2025]"
      difference: "SWAA converts ALL layers and requires fine-tuning recovery. This work converts k/32 << 1 layers (selective) with no fine-tuning. The selective approach is hypothesized to avoid catastrophic collapse via residual stream compensation."
    - prior_work: "SWARR [Liu et al., 2026]"
      difference: "SWARR addresses full-model SWA with RL recovery (SFT insufficient). This work's zero-shot selective conversion is a different regime — fewer layers converted, no training at all."
    - prior_work: "HIES [Choi et al., 2025]"
      difference: "HIES uses entropy for HEAD-level PRUNING in encoders. This work uses entropy for LAYER-level SWA CONVERSION in causal decoders — different granularity, different operation, different architecture family."
    - prior_work: "Michel et al. [2019]"
      difference: "Michel et al. demonstrates HEAD REMOVAL at test time. This work replaces attention operation with a functionally similar but computationally cheaper alternative (SWA), using entropy as the selection signal."

