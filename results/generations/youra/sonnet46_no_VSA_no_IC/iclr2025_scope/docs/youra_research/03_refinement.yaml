# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EntropySWA-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under the setting of Llama-2-7B (32 attention layers, no fine-tuning, standard
    WikiText-103 and GLUE SST-2 evaluation), if the k=4 layers with highest mean
    per-layer attention entropy (measured on a 100-sequence calibration set using
    output_attentions=True) are replaced with sliding window attention (window size
    w=512 tokens) zero-shot, then WikiText-103 perplexity will remain within 2 points
    and GLUE SST-2 accuracy within 2 percentage points of the full-attention baseline,
    because high-entropy layers already contribute less unique global context than
    low-entropy layers, and the residual stream of the 28 remaining full-attention
    layers provides sufficient global context compensation for the converted layers.
  alternative_hypothesis_h0: |
    There is no significant difference in WikiText-103 perplexity or GLUE SST-2
    accuracy between entropy-guided k=4 SWA conversion and random-k=4 SWA conversion
    (i.e., entropy provides no predictive value for identifying SWA-safe layers);
    OR any k≥1 selective SWA conversion causes >5pt perplexity degradation regardless
    of selection criterion (i.e., zero-shot selective SWA is infeasible in Llama-2-7B).

