predictions:
  - id: "P1"
    primary: true
    statement: "Entropy-guided k=4 SWA conversion in Llama-2-7B maintains WikiText-103 perplexity within 2 points of the full-attention baseline (zero-shot, no fine-tuning)."
    test_method: "Run Llama-2-7B with 4 SWA-converted layers (entropy-selected) on WikiText-103 test set; measure perplexity via standard next-token prediction evaluation using HuggingFace Trainer/evaluate; compare to full-attention baseline perplexity."
    success_criterion: "Δperplexity = perplexity(SWA-k4-entropy) - perplexity(baseline) ≤ 2.0 points"
    falsification: "Δperplexity > 2.0 points for entropy-guided k=4; OR Δperplexity > 5.0 points for any k≥1 configuration (suggests zero-shot SWA conversion is fundamentally infeasible in Llama-2-7B regardless of selection criterion)"
  - id: "P2"
    primary: false
    statement: "Entropy-guided k=4 SWA conversion produces lower WikiText-103 perplexity degradation than random-k=4 and last-k=4 SWA conversion at matched k, demonstrating that entropy is a valid layer selection criterion."
    test_method: "Compare perplexity delta for: (a) entropy-guided k=4, (b) random-k=4 (mean of 3 seeds), (c) last-k=4. All with SWA(w=512) on same Llama-2-7B model and WikiText-103 test set."
    success_criterion: "Δperplexity(entropy-k4) < Δperplexity(random-k4) AND Δperplexity(entropy-k4) < Δperplexity(last-k4)"
    falsification: "Δperplexity(entropy-k4) ≥ Δperplexity(random-k4) — entropy provides no selection advantage over random; OR Δperplexity(entropy-k4) ≥ Δperplexity(last-k4) — entropy is worse than a simple heuristic"
  - id: "P3"
    primary: false
    statement: "Entropy-guided k=8 SWA conversion produces measurably higher perplexity degradation than k=4, characterizing the conversion capacity boundary (expected to exceed 5pt threshold)."
    test_method: "Run Llama-2-7B with 8 SWA-converted layers (top-8 by entropy) on WikiText-103 test set; compare perplexity to k=4 and k=0 baselines."
    success_criterion: "Δperplexity(entropy-k8) > Δperplexity(entropy-k4), characterizing the degradation curve; k* boundary estimate: largest k where Δperplexity ≤ 5pt"
    falsification: "Δperplexity(entropy-k8) ≤ Δperplexity(entropy-k4) would be anomalous (non-monotone degradation); if Δperplexity(entropy-k8) ≤ 2pt, the hypothesis dramatically underestimated SWA tolerance"

