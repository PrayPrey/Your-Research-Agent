# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Entropy scoring identifies layers with diffuse, low-information-value global attention patterns. Mean per-layer entropy (aggregated across heads and positions) on 100 calibration sequences is computed; high-entropy layers are those with already-flat attention distributions that rely less on sharp global token retrieval."
      evidence: "HIES [Choi et al., 2025]: entropy validates attention redundancy at head level (+15.2% quality over importance-only pruning). Michel et al. [2019]: high-entropy heads are prunable at test time without accuracy loss. Entropy-Lens [Ali et al., 2025]: entropy characterizes layer-level information processing signature across depth."
      falsifier: "If entropy rank ordering is unstable across calibration seeds (Spearman ρ < 0.7), the selection criterion is noise and the mechanism fails at this step."
    - step: 2
      description: "Replacing high-entropy layers with SWA(w=512) aligns the implemented attention mechanism with the measured attention behavior. Since these layers were already not exploiting sharp global attention, constraining them to a local window does not remove functionality they were using — it formalizes their de facto local behavior."
      evidence: "Raganato et al. [2020]: some transformer layers already learn fixed positional/local attention patterns. Michel et al. [2019]: many heads can be removed entirely; SWA is a weaker constraint than removal. HF AttentionMaskConverter and PyTorch create_sliding_window_attn_mask provide production-grade implementation."
      falsifier: "If k=4 entropy-guided conversion causes >2pt perplexity degradation on WikiText-103 (primary threshold), step 2 fails — the entropy criterion selected layers that WERE using global attention meaningfully."
    - step: 3
      description: "The 28 remaining full-attention layers compensate for the SWA layers' reduced global reach by propagating global context through the residual stream. The residual stream in transformer architectures accumulates representations from all preceding layers; full-attention layers provide global context that persists in the residual stream and is accessible to subsequent SWA layers."
      evidence: "Transformer residual stream design [standard; Vaswani et al., 2017]. Selective conversion leaves 28/32 layers with full global attention. SWARR [Liu et al., 2026] found full-model SWA (0/32 full-attention) insufficient even with SFT — confirming global context loss is the failure mode; selective conversion avoids this by retaining 28/32 full-attention layers."
      falsifier: "If entropy criterion selects primarily early-depth layers (positions 0-8), the residual stream has not yet accumulated sufficient global context at those positions, and compensation via residual stream fails. Layer depth distribution of selected layers is a key diagnostic output."
  key_tension: "Entropy identifies diffuse attention globally, but does not distinguish between 'diffuse local' and 'diffuse global' attention. The mechanism relies on the residual stream compensating for any lost global context — but this compensation is stronger for later-depth converted layers than earlier ones."
  evidence_summary: |
    The three-step mechanism is supported by: (1) entropy as a selection signal (HIES, Michel et al.),
    (2) local-pattern identification in pre-trained layers (Raganato et al., Michel et al.),
    (3) residual stream as global context propagator (inherent to transformer architecture, confirmed
    by SWARR's finding that removing ALL global attention is harmful while selective retention is
    the proposed mitigation). The mechanism is novel in combining these three well-supported
    components in a zero-shot selective conversion framework.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Mean per-layer attention entropy (averaged across heads and positions) on 100 calibration sequences produces a stable layer ranking (Spearman ρ > 0.8 across different calibration seeds)."
    supporting_evidence: "100-sequence calibration is standard for quantization (GPTQ/AWQ); attention distributions at layer level aggregate across H heads × N positions, reducing variance. Prof. Rex concern — addressed by explicit stability test."
    consequence_if_violated: "If ρ < 0.7, the entropy ranking is noise and the selection criterion is invalid. Mitigation: use 300 sequences; if still unstable, entropy-based criterion is infeasible for this model."
  - id: "A2"
    assumption: "High-entropy layers in Llama-2-7B have attention patterns that are functionally equivalent to or approximable by local-window attention (w=512) for the evaluated tasks."
    supporting_evidence: "Michel et al. [2019]: high-entropy heads can be removed entirely without accuracy loss; SWA is weaker than removal. Raganato et al. [2020]: some layers learn positional/local patterns. This is the central empirical claim to be tested."
    consequence_if_violated: "If high-entropy layers are actually doing diffuse global attention that is irreplaceable by local window, k=4 conversion will exceed the 2pt perplexity threshold. This is the primary falsification event."
  - id: "A3"
    assumption: "The residual stream of 28 retained full-attention layers provides sufficient global context compensation for 4 converted SWA layers."
    supporting_evidence: "Transformer residual stream design accumulates representations across depth. SWARR [2026] confirms that FULL-model SWA (0 full-attention layers) fails even with SFT, while retaining some full-attention layers should preserve global context access."
    consequence_if_violated: "If the 4 converted layers are positionally early and the residual stream hasn't accumulated sufficient global context, compensation fails. Diagnosed by examining depth positions of entropy-selected layers."
  - id: "A4"
    assumption: "WikiText-103 perplexity and GLUE SST-2 accuracy jointly characterize the accuracy-preservation of SWA conversion for general-purpose language understanding."
    supporting_evidence: "WikiText-103 tests generative language modeling; SST-2 tests discriminative classification. Together they cover two major task families. Standard benchmarks used across the SWA literature (SWAA, Longformer)."
    consequence_if_violated: "If only one benchmark is preserved and the other degrades, the hypothesis partially fails. The two benchmarks are treated as independent criteria (not required to jointly pass)."
  - id: "A5"
    assumption: "The attn_mask replacement approach (via HF AttentionMaskConverter or direct mask injection) correctly implements SWA semantics in Llama-2-7B without changing model weights or introducing numerical errors."
    supporting_evidence: "HF AttentionMaskConverter(sliding_window=w) is production code used in Mistral 7B inference. PyTorch create_sliding_window_attn_mask is verified. No weight modification required."
    consequence_if_violated: "If mask injection has bugs (e.g., off-by-one in causal masking), results will be confounded. Mitigation: validate mask by checking that attended positions in converted layers are within [i-512, i] for position i."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Llama-2-7B (meta-llama/Llama-2-7b-hf) as the primary test model
    - Causal decoder transformer architectures with RoPE position encoding and 32 attention layers
    - Standard language modeling and text classification tasks (WikiText-103, GLUE SST-2)
    - Short-to-medium context evaluation (sequences up to ~512-1024 tokens for the evaluation benchmarks)
    - Zero-shot, no-fine-tuning inference setting
  does_not_apply_to: |
    - Other causal decoder LLMs (Llama-3, Mistral, Falcon) — generalization is future work
    - Long-context evaluation (>2048 tokens) where w=512 SWA limitation would be more impactful
    - Encoder-only or encoder-decoder architectures
    - Settings requiring fine-tuning (addressed by SWAA, SWARR instead)
    - Full-model SWA conversion (all 32 layers) — addressed by SWAA
  known_limitations: |
    - w=512 window may be insufficient for tasks requiring cross-document attention (not tested)
    - RoPE pre-training included positions >512; SWA layers' RoPE coefficients beyond w=512 are
      "wasted" (trained but never activated at inference); this is acceptable overhead, not a failure
    - Entropy criterion validated only on WikiText-103 calibration sequences; SST-2 domain
      calibration may produce different layer rankings (tested as ablation)
    - k* boundary (maximum safe conversion count) may be Llama-2-7B-specific

