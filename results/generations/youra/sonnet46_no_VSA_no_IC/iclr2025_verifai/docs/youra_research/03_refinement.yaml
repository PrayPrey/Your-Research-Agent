# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SpecRepair-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under GPT-4o-mini on the 134 h-e1 Run 2 EvalPlus failures (34 HumanEval+ + 100 MBPP+),
    if the repair prompt includes structured specification context — (1) problem docstring's
    formal intent, (2) failing test's input/expected-output pair, and (3) model's actual
    incorrect output (Condition C: spec-aligned repair) — then round-1 pass@1 will be
    significantly higher than both blind reprompting without error context (Condition B)
    and the round-0 baseline (Condition A), as measured by one-tailed McNemar's test
    (α=0.05, temperature=0.2 seed=42), because the structured triple provides a formal
    semantic gap description — the minimum information required for targeted algorithmic
    repair, enabling the model to re-anchor on the intended algorithm, identify the
    behavioral gap, and detect where its reasoning diverged from specification.
  alternative_hypothesis_h0: |
    H₀: There is no significant difference in round-1 pass@1 between specification-aligned
    repair (Condition C) and blind reprompting (Condition B) on the 134 h-e1 Run 2
    EvalPlus failures. Formally: P(fixed by C, not by B) = P(fixed by B, not by C).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Repair Condition"
      type: "categorical"
      operationalization: "Prompt template provided to GPT-4o-mini for round-1 repair attempt"
      levels:
        - "A: Round-0 baseline (no repair — h-e1 Run 2 results)"
        - "B: Blind reprompt (original problem prompt + 'Please try again.')"
        - "C: Spec-aligned repair (problem prompt + docstring formal intent + failing test input/expected output + actual model output)"
  dependent:
    - name: "Round-1 Pass@1"
      type: "binary"
      operationalization: "1 if repaired code passes all EvalPlus augmented test cases, 0 otherwise"
      primary: true
    - name: "Fix rate"
      type: "continuous"
      operationalization: "Proportion of 134 problems fixed under each condition (0-1)"
      primary: false
    - name: "Token efficiency ratio"
      type: "continuous"
      operationalization: "Fix rate per 1000 additional input tokens vs. Condition A baseline"
      primary: false
  controlled:
    - name: "Model"
      operationalization: "GPT-4o-mini (fixed; same model used in h-e1 Run 2)"
    - name: "Temperature & seed"
      operationalization: "temperature=0.2, seed=42 for Conditions B and C (pre-registered)"
    - name: "Problem set"
      operationalization: "Exactly the 134 h-e1 Run 2 failing problems (fixed; no new sampling)"
    - name: "Evaluation suite"
      operationalization: "EvalPlus augmented test suite (all tests must pass for fix = 1)"
    - name: "Failing test selection"
      operationalization: "First failing test case from EvalPlus deterministic test ordering (pre-registered)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "The problem docstring's formal intent re-anchors the model on the intended algorithm, preventing re-generation of the same incorrect solution."
      evidence: "Haeri & Ghelichi 2026: spec grounding is 'primary driver' (+38pp); FeedbackEval: docstring removal = severe degradation. Docstring context changes the model's internal goal representation."
      falsifier: "If Condition C with docstring removed (test pair + actual output only) performs equally well, then docstring re-anchoring is not a causal mechanism."
    - step: 2
      description: "The failing test's input/expected-output pair provides a concrete behavioral gap — a grounded counterexample (in the CEGIS sense) that specifies exactly where the model's algorithm diverges from the specification."
      evidence: "ContrastRepair (Kong, Xie et al. 2024): contrastive I/O pairs > single failure message (143/337 vs 124 bugs). The concrete example enables targeted algorithm correction."
      falsifier: "If expected output is hidden (input only) and performance matches full C, then the expected output component adds no signal."
    - step: 3
      description: "The model's actual incorrect output enables deviation detection — the model can compare its output to the expected output and identify the specific algorithmic error (off-by-one, wrong edge case, incorrect base case, etc.)."
      evidence: "Iscan 2026: content matters (code+facts +18pp over bare code, p=0.00042), not mere re-exposure. The actual output provides the diagnostic link between specification and error."
      falsifier: "If actual output is hidden (docstring + expected only) and performance matches full C, then actual output comparison adds no signal beyond the expected output alone."
  key_tension: "The experiment cannot distinguish which of the three components (docstring, expected output, actual output) is the primary driver — the full triple is tested as an integrated oracle. Component ablation would require 7 additional conditions and is deferred to Phase 5."
  evidence_summary: |
    Three convergent mechanisms support C > B: (1) docstring re-anchoring prevents same-solution regeneration,
    (2) I/O contrast pair provides CEGIS-style counterexample for targeted repair, (3) deviation detection
    enables model to diagnose the specific algorithmic error. All three are supported by independent literature
    (Haeri 2026, ContrastRepair 2024, Iscan 2026). The integrated triple is stronger than any single component
    because it provides intent (docstring), gap (expected vs. actual), and diagnostic (actual output) simultaneously.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "GPT-4o-mini can use the structured specification context to improve its repair beyond blind reprompting — i.e., it is capable of reasoning from formal counterexamples."
    supporting_evidence: "Iscan 2026 shows content matters for LLM repair (p=0.00042). GPT-4o-mini is a capable instruction-following model."
    consequence_if_violated: "If GPT-4o-mini cannot leverage the triple context (e.g., if it is too weak to reason from counterexamples), C ≈ B and hypothesis fails. Redirect to stronger models (GPT-4o) or structured CoT prompting."
  - id: "A2"
    assumption: "The 134-problem failure set from h-e1 Run 2 is representative of EvalPlus semantic failures generally — not a cherry-picked or anomalous subset."
    supporting_evidence: "All 134 problems are drawn from standard EvalPlus (HE+/MBPP+) by natural failure under round-0 GPT-4o-mini. No cherry-picking."
    consequence_if_violated: "If the failure set is anomalously hard or easy, fix rates will be out of the literature-predicted 15-40% range, reducing power or ceiling effects."
  - id: "A3"
    assumption: "The first failing test case from EvalPlus's deterministic test ordering is a representative counterexample — not systematically trivial or adversarial."
    supporting_evidence: "EvalPlus augmented test suite is designed to be comprehensive; first failing test reflects a real behavioral gap."
    consequence_if_violated: "If first failing tests are systematically trivial (e.g., always the same edge case), the counterexample quality degrades. Fix: use random failing test selection or worst-failing test."
  - id: "A4"
    assumption: "Temperature=0.2 seed=42 produces sufficient stochasticity to avoid greedy fixed-point suppression of Condition B, while remaining reproducible."
    supporting_evidence: "Standard practice in LLM evaluation; seed=42 ensures reproducibility; temperature=0.2 allows >0 diversity."
    consequence_if_violated: "If GPT-4o-mini still converges to same wrong answer at temperature=0.2 for Condition B, B's fix rate will be artificially low. Fix: raise temperature to 0.5 or use best-of-3 sampling."
  - id: "A5"
    assumption: "The McNemar test is appropriate for the n=134 sample size — specifically, that there will be sufficient discordant pairs (cells b and c in the 2×2 table) for valid inference."
    supporting_evidence: "Expected 20-54 fixes under C (15-40% fix rate range); 10-20 under B. Discordant pairs likely 15-40 range. McNemar valid with Yates' continuity correction if any cell < 5."
    consequence_if_violated: "If fix rates are very low (<5%) under both conditions, discordant pairs too few for reliable McNemar. Fix: Fisher's exact test on the same 2×2 table."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - GPT-4o-mini on EvalPlus (HumanEval+ and MBPP+ subsets)
    - Round-0 failures that are semantic/algorithmic (not infrastructure failures)
    - Problems with at least one failing augmented test case available
    - Single-turn repair (one additional API call per problem)
    - Structured specification context as repair oracle (docstring + test pair + actual output)
  does_not_apply_to: |
    - Other LLMs (GPT-4o, Claude, Llama) — generalization not tested
    - Multi-round repair loops (only round-1 is tested)
    - Problems with infrastructure failures (no execution environment, timeout)
    - Live/contamination-free benchmarks (LiveCodeBench) — not tested
    - Static analysis errors (ruff/mypy) — SA oracle has been falsified for this task
  known_limitations: |
    - n=134 may limit power for subgroup analyses (34 HE+ problems only)
    - Prompt template design could affect results — must be pre-registered
    - GPT-4o-mini-specific results may not generalize to other models
    - Single failing test in prompt — multiple test context may perform differently
    - Component ablation (which part of the triple matters most) is out of scope

