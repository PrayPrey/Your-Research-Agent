# ─────────────────────────────────────────────────────────────────────────────
# METHODOLOGY (from 03_refinement.yaml, 02b_verification_plan.md)
# ─────────────────────────────────────────────────────────────────────────────
methodology:
  algorithm_name: "Specification-Aligned Repair (Condition C)"
  conditions:
    A: "Round-0 baseline (no repair; existing h-e1 data)"
    B: "Blind reprompt (original prompt + 'The above solution is incorrect. Please try again.')"
    C: "Spec-aligned repair (original prompt + docstring + failing test I/O + actual model output)"

  key_hyperparameters:
    model: "gpt-4o-mini"
    temperature: 0.2
    seed: 42
    repair_rounds: 1
    test_selection: "plus_input[0] (first augmented test, deterministic)"
    evalplus_version: "0.3.1"

  statistical_tests:
    primary: "One-tailed McNemar's test (Yates' correction if any cell < 5)"
    fallback: "Fisher's exact test (if discordant pairs < 25)"
    alpha: 0.05
    direction: "C > B, C > A"

  api_calls_planned:
    condition_b: 128
    condition_c: 128
    condition_a: 0
    total: 256
    estimated_cost_usd: 0.05

