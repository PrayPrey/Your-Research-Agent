hypothesis_draft:
  title: "Specification-Aligned Repair: Structured Semantic Gap Description as Oracle for EvalPlus Code Repair"
  hypothesis_id: "H-SpecRepair-v1"
  core_claim: |
    Providing GPT-4o-mini with a structured triple of (problem docstring formal intent,
    failing test input/expected-output pair, actual model output) as a repair oracle
    produces statistically significantly higher pass@1 than blind reprompting on the
    134 h-e1 Run 2 EvalPlus failures (one-tailed McNemar p<0.05, temperature=0.2 seed=42).
  mechanism: |
    The triple creates a formal semantic gap description: (1) docstring re-anchors the model
    on intended algorithm, (2) failing test I/O provides a CEGIS-style counterexample showing
    the behavioral gap, (3) actual output enables deviation detection. The integrated oracle
    provides intent + gap + diagnostic — the minimum information for targeted algorithmic repair.
  predictions:
    - P1: "McNemar one-tailed p < 0.05 for Condition C vs. Condition B (spec-aligned > blind reprompt)"
    - P2: "McNemar one-tailed p < 0.05 for Condition C vs. Condition A (spec-aligned > round-0 baseline); fix rate ≥ 15%"
    - P3: "Fix rate HE+ > fix rate MBPP+ (directional; complexity interaction)"

variables_summary:
  independent: "Repair condition: A (round-0 baseline), B (blind reprompt), C (spec-aligned triple)"
  dependent_primary: "Round-1 pass@1 binary (passes all EvalPlus augmented tests after repair)"
  controlled: "GPT-4o-mini, temperature=0.2 seed=42, n=134 failure set fixed, EvalPlus evaluation suite"

null_hypothesis:
  h0_statement: |
    H₀: There is no significant difference in round-1 pass@1 between specification-aligned
    repair (Condition C) and blind reprompting (Condition B) on the 134 h-e1 Run 2 EvalPlus
    failures. P(fixed by C, not B) = P(fixed by B, not C).
  statistical_test: "One-tailed McNemar's test with Yates' continuity correction (if any cell < 5)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First 3-condition McNemar ablation on EvalPlus's own semantic failure set; treating (docstring + I/O + actual output) triple as formal CEGIS-style counterexample oracle."
  differentiation_summary: |
    Prior work (Haeri 2026, FeedbackEval 2025, Self-Refine 2023) compares structured feedback
    vs. no-feedback broadly. This study uniquely: (1) applies to EvalPlus semantic failures
    specifically, (2) adds explicit blind reprompt baseline (Condition B) to isolate spec context
    value vs. mere re-exposure, (3) uses EvalPlus's native oracle components (docstring + augmented
    tests), (4) directly follows from h-e1 failure root cause — SA oracle falsified, execution
    oracle required. No existing paper fills this exact gap.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "GPT-4o-mini (OpenAI API)"
  datasets:
    - "EvalPlus HumanEval+ (34 failing problems from h-e1 Run 2)"
    - "EvalPlus MBPP+ (100 failing problems from h-e1 Run 2)"
  baselines:
    - "Condition A: Round-0 baseline (h-e1 Run 2 existing results)"
    - "Condition B: Blind reprompt (no error context)"

measurement_plan:
  data_collection:
    - source: "h-e1 Run 2 results: 134 failing problem IDs + GPT-4o-mini incorrect outputs (already collected)"
    - source: "EvalPlus API: problem['prompt'] (docstring) + plus_input (augmented tests) for each of 134 problems"
    - source: "Condition B API calls: 134 × 1 = 134 new GPT-4o-mini calls"
    - source: "Condition C API calls: 134 × 1 = 134 new GPT-4o-mini calls"
  procedure:
    - step: "Load 134 failing problems from h-e1 Run 2 results (problem IDs + incorrect outputs)"
    - step: "For each problem: construct Condition B prompt (problem prompt + 'Please try again.')"
    - step: "For each problem: select first failing EvalPlus augmented test case (deterministic ordering)"
    - step: "For each problem: construct Condition C prompt (docstring + failing test I/O + actual output)"
    - step: "Submit Condition B and C prompts to GPT-4o-mini API (temperature=0.2, seed=42)"
    - step: "Evaluate all repaired outputs against full EvalPlus augmented test suite (subprocess oracle)"
    - step: "Record binary pass/fail for each problem under each condition"
    - step: "Compute 2×2 McNemar table for C vs. B and C vs. A comparisons"
    - step: "Run one-tailed McNemar's test with Yates' correction (scipy.stats.mcnemar)"
    - step: "Compute stratified fix rates by HE+ vs. MBPP+ and difficulty"
  success_criteria:
    - "P1: McNemar one-tailed p < 0.05 for C vs. B"
    - "P2: McNemar one-tailed p < 0.05 for C vs. A AND fix rate under C ≥ 15%"
    - "P3: Fix rate HE+ > fix rate MBPP+ (directional, secondary)"

validation:
  internal_validity:
    - "Fixed problem set (n=134): no sampling variance in problem selection"
    - "Pre-registered temperature=0.2 seed=42: reproducible API calls"
    - "Pre-registered first-failing-test selection: deterministic Condition C construction"
    - "Full EvalPlus test evaluation: avoids partial-fix overcounting"
    - "Pre-registered one-tailed direction: appropriate given strong literature prior"
  external_validity:
    - "Results specific to GPT-4o-mini — generalization to other models not tested"
    - "Results specific to EvalPlus (HE+ + MBPP+) — other benchmarks not tested"
    - "Single-turn repair only — multi-round repair not addressed"

