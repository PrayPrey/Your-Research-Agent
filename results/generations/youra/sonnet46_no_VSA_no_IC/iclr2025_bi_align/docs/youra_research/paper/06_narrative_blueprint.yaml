    file: "figures/fig1_gate_metrics.png"
    section: "results"
    caption_template: |
      Gate evaluation results per classification scheme. Coverage rate (left)
      and cross-group edge count (right) against gate thresholds (70% coverage,
      30 edges). Scheme3 (FoS-primary) classifies all 33 resolved papers but
      the proxy corpus yields only 9 cross-group edges — insufficient for
      chi-squared testing.
    first_reference: "Results (R4: Gate evaluation)"

  fig_2_dropout_by_venue:
    file: "figures/fig2_dropout_by_venue.png"
    section: "results"
    caption_template: |
      Unresolved papers by ID type and source venue. Non-systematic dropout:
      16 of 49 papers fail S2AG resolution because they are ACM DL publications
      without arXiv preprints, which do not introduce directional bias in
      classification outcomes.
    first_reference: "Results (R5: Corpus proxy analysis)"

  fig_3_edge_heatmaps:
    file: "figures/fig3_edge_heatmaps.png"
    section: "results"
    caption_template: |
      Directed citation edge count heatmaps for all three classification schemes.
      Scheme3 (FoS-primary, right panel): ML_NLP→ML_NLP=42, ML_NLP→HCI=5,
      HCI→ML_NLP=4, HCI→HCI=0. Directional ratio = 0.107. Scheme1/2 panels
      show limited edge coverage due to 12% classification rate.
    first_reference: "Results (R3: Directional edge matrix)"

  fig_4_venue_pie:
    file: "figures/fig4_venue_pie.png"
    section: "experiments"
    caption_template: |
      Corpus composition by venue group under Scheme1 (venue-string) classification.
      Only 4 of 33 resolved papers are classified, illustrating the 12% coverage
      limitation of venue-string methods on this corpus.
    first_reference: "Experiments (corpus composition)"

  fig_5_corpus_overview:
    file: "figures/corpus_overview.png"
    section: "methodology"
    caption_template: |
      Overview of the huashen218 bidirectional alignment corpus structure as
      accessed via the public GitHub reading list. ~130 linked papers yield
      49 extractable identifiers and 33 S2AG-resolved papers.
    first_reference: "Methodology (corpus access)"
