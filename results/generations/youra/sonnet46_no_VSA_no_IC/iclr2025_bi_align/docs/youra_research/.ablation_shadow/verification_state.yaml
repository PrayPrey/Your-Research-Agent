    statement: Under the huashen218 corpus (papers with resolved S2AG IDs, ≥30 cross-group edges confirmed in H-E1), if papers
      are classified as ML_NLP (NeurIPS/ICML/ICLR/ACL/EMNLP), then the proportion of their outgoing within-corpus citations
