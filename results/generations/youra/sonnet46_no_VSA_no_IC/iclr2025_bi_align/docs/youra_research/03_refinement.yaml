# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "S2AG covers ≥70% of huashen218 corpus papers with resolved paper IDs (DOI or arXiv)"
    supporting_evidence: "S2AG indexes 205M+ publications including arXiv preprints; huashen218 papers are primarily from indexed venues (NeurIPS, CHI, ACL, etc.)"
    consequence_if_violated: "Sample representativeness is compromised; study must characterize unresolved papers and argue for non-systematic dropout"
  - id: "A2"
    assumption: "The huashen218 corpus has sufficient within-corpus citation density (≥30 cross-group directed edges) for chi-squared analysis"
    supporting_evidence: "Community preference effect (Wahle et al. 2023: 10-30× base rate for within-field citation) suggests elevated within-corpus density; prior estimate 240-720 edges"
    consequence_if_violated: "Chi-squared test is under-powered; study shifts to descriptive statistics and bridge paper analysis only"
  - id: "A3"
    assumption: "Venue classification by S2AG fieldsOfStudy + venue string fallback produces a valid ML_NLP/HCI separation for ≥80% of corpus papers"
    supporting_evidence: "Wahle et al. 2023 used same S2AG fieldsOfStudy approach successfully for 77k papers; venue list for ML_NLP and HCI is well-defined"
    consequence_if_violated: "Sensitivity analysis across 3 classification schemes isolates whether findings are classification-dependent"
  - id: "A4"
    assumption: "Citation proportions (cross-group citations / total outgoing citations) are age-invariant within each cohort"
    supporting_evidence: "Both numerator and denominator scale with time; proportion is robust to citation age accumulation under assumption of stable citation behavior"
    consequence_if_violated: "Temporal cohort analysis is confounded; must use citations-per-year normalization as fallback"
  - id: "A5"
    assumption: "The curated nature of huashen218 (selected as an alignment reading list) does not systematically bias the citation direction — i.e., curation selected for cross-community relevance, not for one-directional citation behavior"
    supporting_evidence: "Shen et al. 2024 describes a systematic review process across HCI, NLP, and ML venues — not a citation-graph-based selection"
    consequence_if_violated: "Findings must be explicitly scoped to corpus-level claims; field-level generalization requires matched baseline"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Papers in the huashen218/bidirectional-alignment-reading-list corpus (~400 papers, 2018-2024)
    - Papers classifiable as ML_NLP (NeurIPS/ICML/ICLR/ACL/EMNLP) or HCI (CHI/CSCW/IUI)
    - Citation edges where both source and target paper are within the corpus
    - Study findings apply specifically to the bidirectional human-AI alignment research corpus
  does_not_apply_to: |
    - Field-level claims about ML vs HCI citation behavior in general (requires matched baseline)
    - Papers with unresolvable venue classification or missing S2AG metadata
    - Citation edges between corpus papers and external (non-corpus) papers
    - AI safety / AI ethics literature not in the huashen218 corpus
  known_limitations: |
    - Selection bias: huashen218 is a curated reading list, not a random sample of ML/HCI papers
    - Coverage: S2AG may not resolve all 400+ papers; workshop papers and preprints may be missing
    - Temporal: post-2022 papers have shorter citation accumulation windows
    - Scope: findings are corpus-level, not field-level

