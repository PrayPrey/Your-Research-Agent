# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "AI→HCI directed citation ratio < 1.0 (ML_NLP papers cite HCI papers at a lower rate than HCI papers cite ML_NLP papers), significant at chi-squared p < 0.05 on the 2×2 contingency table"
    test_method: "Construct directed citation graph from S2AG; filter within-corpus edges; compute 2×2 table (AI→HCI, AI→AI, HCI→AI, HCI→HCI); run scipy.stats.chi2_contingency or fisher_exact; report ratio and p-value"
    success_criterion: "ratio = (AI→HCI/total_AI_out) / (HCI→AI/total_HCI_out) < 1.0 AND p < 0.05; holds under ≥2 of 3 venue classification schemes"
    falsification: "ratio ≥ 1.0, or p ≥ 0.05, or result fails under all 3 venue classification schemes"
  - id: "P2"
    primary: false
    statement: "Within-group citation density (AI→AI proportion of AI outgoing; HCI→HCI proportion of HCI outgoing) significantly exceeds cross-group citation density in the huashen218 corpus, consistent with community siloing"
    test_method: "Compute within-group edge proportions from the same 2×2 table; compare within-group vs cross-group proportions using chi-squared or proportion z-test"
    success_criterion: "Within-group proportion > cross-group proportion for both ML_NLP and HCI groups (p < 0.05)"
    falsification: "No significant difference between within-group and cross-group citation density"
  - id: "P3"
    primary: false
    statement: "Bridge papers (top 10 by normalized betweenness centrality using Kim et al. 2026 ratio) are disproportionately from ML/NLP venues rather than HCI venues"
    test_method: "Compute nx.betweenness_centrality on directed subgraph; normalize by degree (Kim et al. 2026 ratio); rank papers; classify top-10 bridge papers by venue group"
    success_criterion: "≥7 of top-10 bridge papers classified as ML_NLP"
    falsification: "Top-10 bridge papers are majority HCI or evenly split"

