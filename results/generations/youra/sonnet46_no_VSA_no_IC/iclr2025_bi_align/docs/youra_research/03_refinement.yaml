# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CitAsym-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the huashen218 bidirectional alignment corpus (~400 papers, 2018-2024),
    if papers are classified by venue group (AI-centered: NeurIPS/ICML/ICLR/ACL/EMNLP;
    HCI-centered: CHI/CSCW/IUI) using S2AG fieldsOfStudy with venue string fallback,
    then the directed citation ratio AI→HCI / HCI→AI < 1.0 (chi-squared p < 0.05 on
    the 2×2 citation contingency table),
    because ML/NLP alignment research is primarily self-referential to ML/NLP foundations
    (RLHF, safety, fine-tuning), while HCI alignment research — engaging with applied AI
    deployment in sociotechnical contexts — systematically cites ML/NLP foundational work
    to ground its user-facing analyses.
  alternative_hypothesis_h0: |
    There is no significant difference in the proportion of AI→HCI vs HCI→AI directed
    citation edges within the huashen218 alignment corpus (ratio = 1.0, chi-squared p ≥ 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Venue Group"
      type: "categorical"
      operationalization: "Paper classified as ML_NLP (NeurIPS/ICML/ICLR/ACL/EMNLP) or HCI (CHI/CSCW/IUI) using S2AG fieldsOfStudy controlled vocabulary with venue string fallback; sensitivity analysis across 3 schemes (ACL/EMNLP as ML_NLP / excluded / NLP-bridge)"
      levels: ["ML_NLP", "HCI", "NLP_bridge (sensitivity only)", "excluded"]
  dependent:
    - name: "Cross-group citation proportion"
      type: "continuous"
      operationalization: "AI→HCI directed edges / total ML_NLP outgoing within-corpus edges; HCI→AI directed edges / total HCI outgoing within-corpus edges. Primary: ratio (AI→HCI proportion) / (HCI→AI proportion)"
      primary: true
    - name: "Within-group citation density"
      type: "continuous"
      operationalization: "AI→AI within-corpus edges / total possible AI→AI edges; HCI→HCI / total possible HCI→HCI edges"
      primary: false
    - name: "Normalized betweenness centrality"
      type: "continuous"
      operationalization: "Kim et al. 2026 betweenness-to-connectivity ratio for each corpus paper in the directed subgraph; identifies bridge papers"
      primary: false
  controlled:
    - name: "Citation proportions (not raw counts) for temporal analysis"
      operationalization: "Use proportion of outgoing citations per cohort (pre-2022, post-2022) rather than raw edge counts to control for paper age accumulation bias"
    - name: "S2AG coverage threshold"
      operationalization: "Only proceed with chi-squared test if ≥70% of corpus papers resolve and ≥30 cross-group within-corpus edges confirmed"
    - name: "Venue classification scheme"
      operationalization: "Pre-specified sensitivity analysis across 3 classification schemes; hypothesis supported if asymmetry holds under ≥2 of 3 schemes"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "ML/NLP alignment research is primarily grounded in ML/NLP methodology (RLHF, fine-tuning, safety, reward modeling). The conceptual vocabulary and technical foundations of ML alignment do not require engagement with HCI literature on user agency, collaborative design, or sociotechnical systems."
      evidence: "Shen et al. 2024 qualitatively identifies divergent alignment framings; Ghosh & Wilson 2025 (arXiv:2508.11067) documents ML/ethics research divergence over 10 years"
      falsifier: "If ML/NLP alignment papers have similar reference list composition to HCI papers, this step fails"
    - step: 2
      description: "HCI alignment research — focused on human-AI interaction, user agency, explainability, and collaborative AI — must engage with ML/NLP foundational work to understand the AI systems it studies. This creates an asymmetric citation dependency: HCI must cite ML to establish the AI context; ML need not cite HCI for the technical contribution."
      evidence: "Reza et al. 2025 (arXiv:2504.12488) — HCI systematic review surfaces 'alignment and gaps between research and user needs' while citing ML alignment work; Chen 2024 X-index shows HCI increasingly self-citing but also citing adjacent fields"
      falsifier: "If HCI papers cite ML at same rate as ML cites HCI, the asymmetric dependency claim fails"
    - step: 3
      description: "Citation behavior reflects conceptual engagement: the asymmetric citation dependency produces a measurable 2×2 directed citation matrix where AI→HCI / HCI→AI < 1.0 within the curated huashen218 alignment corpus."
      evidence: "Wahle et al. 2023 EMNLP demonstrated this mechanism for NLP vs other fields; Chen 2024 X-index showed HCI self-citation increasing (consistent with reduced outgoing cross-field citation)"
      falsifier: "Chi-squared test returns p ≥ 0.05, or ratio AI→HCI / HCI→AI ≥ 1.0"
  key_tension: "Within-corpus edge sparsity is an empirical unknown — the curated nature of huashen218 may mean papers in the corpus cite each other at higher rates than random, but actual within-corpus edge count is unconfirmed"
  evidence_summary: |
    The causal mechanism is supported by two independent analogues (Wahle et al. 2023 for NLP cross-field;
    Chen 2024 for HCI self-citation) and qualitatively by the primary corpus paper (Shen et al. 2024).
    The mechanism chain is parsimonious (3 steps) and each step has a clear falsifier.
    The key empirical unknown (within-corpus edge density) is addressed by the ≥30 edge threshold condition.

