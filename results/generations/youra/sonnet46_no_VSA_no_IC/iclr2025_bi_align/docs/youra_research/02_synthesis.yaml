hypothesis_draft:
  title: "Citation Asymmetry in Bidirectional Alignment: ML/NLP Papers Cite HCI Alignment Papers Significantly Less Than Vice Versa"
  hypothesis_id: "H-CitAsym-v1"
  core_claim: |
    Within the huashen218 bidirectional alignment corpus (~400 papers, 2018-2024), the directed
    citation ratio AI→HCI / HCI→AI < 1.0, as measured by chi-squared test on the 2×2 directed
    citation contingency table constructed from Semantic Scholar Academic Graph edges. This reflects
    structural community siloing: ML/NLP alignment research is self-referential to ML foundations,
    while HCI alignment research must cite ML/NLP work to ground its applied user-facing analyses.
  mechanism: |
    ML/NLP alignment papers focus on technical mechanisms (RLHF, fine-tuning, safety) that do not
    require HCI literature. HCI alignment papers study human-AI interaction in deployment contexts
    and must cite ML/NLP foundational work to characterize the AI systems they study. This produces
    an asymmetric citation dependency detectable as directed edge count imbalance in the S2AG graph.
  predictions:
    - P1: "AI→HCI / HCI→AI ratio < 1.0, chi-squared p < 0.05 on 2×2 table (primary)"
    - P2: "Within-group citation density (AI→AI, HCI→HCI) > cross-group density (siloing)"
    - P3: "Top-10 bridge papers by normalized betweenness ≥7 from ML_NLP venues"

variables_summary:
  independent: "Venue group (ML_NLP vs HCI) classified via S2AG fieldsOfStudy + venue string fallback; 3-scheme sensitivity analysis"
  dependent_primary: "Cross-group citation proportion ratio (AI→HCI proportion) / (HCI→AI proportion)"
  controlled: "Citation proportions (not raw counts) for temporal cohort; S2AG coverage ≥70%; edge count ≥30 threshold"

null_hypothesis:
  h0_statement: |
    There is no significant difference in the proportion of AI→HCI vs HCI→AI directed citation
    edges within the huashen218 alignment corpus (ratio = 1.0, chi-squared p ≥ 0.05).
  statistical_test: "chi-squared (scipy.stats.chi2_contingency) or Fisher's exact (scipy.stats.fisher_exact) if any cell < 5"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical directed citation graph analysis of the huashen218 alignment corpus; structurally orthogonal to all three prior failed operationalizations"
  differentiation_summary: |
    Wahle et al. 2023 analyzed NLP broadly (77k papers); Chen 2024 analyzed HCI self-citation.
    Neither applies to the alignment corpus specifically or tests the AI→HCI vs HCI→AI directional
    asymmetry. This study provides the empirical anchor the ICLR 2025 Workshop claims lack.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["NetworkX DiGraph", "scipy.stats.chi2_contingency", "scipy.stats.fisher_exact", "nx.betweenness_centrality"]
  datasets: ["huashen218/bidirectional-alignment-reading-list (~400 papers)", "S2AG API (papers/references/citations endpoints)"]
  baselines: ["Wahle et al. 2023 EMNLP cross-field NLP asymmetry", "Chen 2024 CHI X-index HCI self-citation"]

measurement_plan:
  data_collection:
    - source: "huashen218 GitHub: extract paper IDs (DOI/arXiv) from reading list"
    - source: "S2AG /paper/{id} endpoint: resolve paper IDs, retrieve venue/fieldsOfStudy metadata"
    - source: "S2AG /paper/{id}/references endpoint: retrieve directed outgoing citation edges per corpus paper"
  procedure:
    - step: "1. Resolve all ~400 huashen218 paper IDs against S2AG; document coverage rate"
    - step: "2. Classify papers by venue group (3 schemes: ACL/EMNLP as ML_NLP / excluded / NLP_bridge)"
    - step: "3. Retrieve reference lists for all resolved papers via S2AG (with rate limiting + local cache)"
    - step: "4. Filter references to within-corpus edges only (both source and target in huashen218)"
    - step: "5. Verify ≥30 cross-group within-corpus edges; if below threshold, report descriptive statistics only"
    - step: "6. Construct 2×2 contingency table (AI→HCI, AI→AI, HCI→AI, HCI→HCI)"
    - step: "7. Run chi-squared or Fisher's exact test; compute ratio AI→HCI proportion / HCI→AI proportion"
    - step: "8. Compute normalized betweenness centrality (Kim et al. 2026 ratio) for bridge paper identification"
    - step: "9. Run pre/post-2022 cohort analysis using citation proportions"
  success_criteria:
    - "P1: ratio < 1.0 AND p < 0.05 under ≥2 of 3 venue classification schemes"
    - "P2: within-group proportion > cross-group proportion for both ML_NLP and HCI (p < 0.05)"
    - "P3: ≥7 of top-10 normalized betweenness bridge papers classified as ML_NLP"

validation:
  internal_validity:
    - "Pre-specified sensitivity analysis (3 venue classification schemes) prevents post-hoc rationalization"
    - "Edge count threshold (≥30) ensures adequate statistical power before chi-squared test"
    - "Citation proportions (not raw counts) for temporal analysis controls for paper age"
    - "S2AG fieldsOfStudy (controlled vocabulary) preferred over free-text venue strings"
  external_validity:
    - "Study is scoped to huashen218 corpus — field-level claims explicitly excluded"
    - "Matched baseline comparison (random ML/HCI papers not in corpus) deferred to Phase 5"
    - "Wahle et al. 2023 and Chen 2024 provide methodological analogues from comparable bibliometric studies"

discussion_synthesis:
  key_insights:
    - "Citation directionality is the key methodological breakthrough — avoids all prior failure modes (SPECTER2 centroid bias, cross-corpus overlap, keyword circularity)"
    - "The curated nature of huashen218 is a feature, not a bug — the study audits whether the corpus itself exhibits the asymmetry the workshop claims"
    - "Within-corpus edge sparsity is the main empirical risk — must be verified before statistical testing"
    - "Citation proportions (not raw counts) eliminate the paper-age confound in temporal analysis"
  breakthrough_moments:
    - "Exchange 5 (Dr. Ally): Recognizing citation proportions as age-invariant — resolves Prof. Vera's age confound concern without requiring per-year normalization"
    - "Exchange 7 (Dr. Ally): Edge-count threshold (≥30) as explicit study validity condition — converts sparsity risk into a pre-registered failsafe"
  resolved_tensions:
    - "Edge sparsity concern (Prof. Rex Exchange 6) → conditioned on ≥30 threshold with descriptive-only fallback"
    - "Selection bias (Prof. Rex Exchange 6) → resolved by explicit corpus-level scope framing (not field-level claims)"
    - "Betweenness spuriousness (Prof. Rex Exchange 6) → resolved by adopting Kim et al. 2026 normalized ratio"
    - "Age confound in temporal analysis (Prof. Vera Exchange 2) → resolved by citation proportions (Dr. Ally Exchange 5)"
