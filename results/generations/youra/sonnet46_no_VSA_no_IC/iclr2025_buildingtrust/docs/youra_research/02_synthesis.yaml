hypothesis_draft:
  title: "Trustworthiness Generalization Predictive Validity: Fairness vs. Adversarial Robustness"
  hypothesis_id: "H-TrustPredVal-v1"
  core_claim: |
    When partial Spearman ρ (controlling for MMLU general capability) is computed between
    in-distribution and OOD model rankings across 15+ public LLMs on matched trustworthiness
    benchmark pairs, fairness (BBQ-Disambig → BBQ-Ambig) shows significantly positive
    partial ρ while adversarial robustness (GLUE → AdvGLUE, ANLI R1 → R3) shows lower
    partial ρ. This asymmetry reveals that fairness failures reflect stable latent model
    biases that generalize across distribution shifts, while adversarial robustness is
    disrupted by the adversarial design principle that specifically targets current model
    capabilities.
  mechanism: |
    Two competing mechanisms determine cross-split predictive validity:
    (1) STABLE LATENT BIAS: Fairness failures arise from statistical co-occurrences in
    pretraining data encoded as stable model weights. These biases manifest consistently
    whether context is informative (disambig) or underspecified (ambig), producing
    high rank correlation across the split.
    (2) ADVERSARIAL DISRUPTION: Robustness benchmarks (AdvGLUE, ANLI R3) are constructed
    through iterative human-model-in-the-loop adversarial annotation that specifically
    identifies and targets the failure modes of models that pass earlier versions.
    By design, models that perform well on GLUE/ANLI R1 are the targets of AdvGLUE/ANLI R3,
    disrupting rank stability.
  predictions:
    - P1: "Partial Spearman ρ_fairness (BBQ-Disambig → BBQ-Ambig) > 0.4 AND p < 0.05 after MMLU control [CONFIRMATORY]"
    - P2: "ρ_fairness > ρ_robustness by Δρ ≥ 0.2 [EXPLORATORY, DIRECTIONAL]"
    - P3: "Instruction-tuned models show smaller fairness TGG than base models (not robustness TGG) [EXPLORATORY]"

variables_summary:
  independent: "Trustworthiness dimension (Fairness vs. Robustness-Adversarial vs. Robustness-Difficulty) × Evaluation split (ID vs. OOD) × Training paradigm (base vs. instruction-tuned, secondary)"
  dependent_primary: "Partial Spearman ρ (MMLU-controlled) between ID and OOD model rankings per dimension"
  controlled: "MMLU score rank (general capability), evaluation protocol consistency, overlapping model set identity"

null_hypothesis:
  h0_statement: |
    There is no significant difference in partial Spearman ρ (MMLU-controlled) between
    the fairness dimension (BBQ) and the adversarial robustness dimension (GLUE/ANLI)
    for in-distribution to OOD model rank prediction. All trustworthiness dimensions
    show equal cross-split predictive validity (Δρ = 0, Fisher z-test p ≥ 0.05).
  statistical_test: "Fisher z-transformation for difference between two Spearman correlations; one-tailed test for directional P2"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First application of predictive validity methodology (Gevers & Daelemans 2026) to trustworthiness benchmarks, with capability control via partial Spearman ρ to isolate trustworthiness-specific generalization"
  differentiation_summary: |
    Prior work (DecodingTrust, TrustLLM, HELM) measures trustworthiness performance in isolation
    without asking whether in-distribution scores predict OOD scores as a rank-correlation question.
    The closest work (Gevers & Daelemans 2026) applies this methodology to commonsense benchmarks —
    we extend it to the higher-stakes trustworthiness domain with an additional theoretical
    contribution: the latent-bias-stability vs. adversarial-design distinction as a mechanism
    for explaining dimension-specific predictive validity differences.

