    - "BBQ-Ambiguous (fairness OOD) — Parrish et al. 2021"
    - "GLUE (robustness ID) — Wang et al. 2018"
    - "AdvGLUE (robustness OOD) — Wang et al. 2021"
    - "ANLI R1 (robustness-difficulty ID) — Nie et al. 2020"
    - "ANLI R3 (robustness-difficulty OOD) — Nie et al. 2020"
    - "MMLU (capability control) — Hendrycks et al. 2020"
  baselines:
    - "Random rank assignment (ρ = 0, permutation CI)"
    - "Raw Spearman ρ without MMLU control"
    - "Gevers & Daelemans (2026) commonsense ρ reference values"

measurement_plan:
  data_collection:
    - source: "TrustLLM (HowieHwong/TrustLLM) — extract BBQ-Disambig and BBQ-Ambig per-model scores for 16 LLMs"
    - source: "GLUE-X (YangLinyi/GLUE-X) — extract GLUE and AdvGLUE per-model scores for 21 models"
    - source: "OOD_NLP (lifan-yuan/OOD_NLP) — extract ANLI R1 and R3 per-model scores"
    - source: "MMLU leaderboard / Open LLM Leaderboard — extract MMLU scores for overlapping model set"
    - source: "DecodingTrust (AI-secure/DecodingTrust) — supplement GPT-3.5/4 scores"
  procedure:
    - step: "Build model×benchmark score matrix from aggregated sources; note N per cell"
    - step: "Identify overlapping model set with scores on all required benchmarks"
    - step: "Compute raw Spearman ρ per dimension (fairness ID vs OOD; robustness ID vs OOD)"
    - step: "Compute partial Spearman ρ controlling for MMLU rank (partial correlation formula)"
    - step: "Test P1: Fisher z-test on partial ρ_fairness (one-tailed, α=0.05)"
    - step: "Test P2: Fisher z-test comparing partial ρ_fairness vs partial ρ_robustness (exploratory)"
    - step: "Secondary P3: Compute TGG per base/instruction-tuned pair; Wilcoxon signed-rank test"
    - step: "Sensitivity analysis: repeat partial ρ controlling for Winogrande instead of MMLU"
  success_criteria:
    - "P1 confirmed: partial ρ_fairness > 0.4 AND p < 0.05 (Fisher z-test, N ≥ 10)"
    - "P2 supported: partial ρ_fairness > partial ρ_robustness by Δρ ≥ 0.2 (exploratory threshold)"
    - "P3 directional: instruction-tuned models have smaller median fairness TGG than base"

validation:
  internal_validity:
    - "Use same overlapping model set across all dimension comparisons to eliminate model-set confound"
    - "Report N per analysis cell explicitly; flag cells with N < 10 as underpowered"
    - "Partial correlation controls for capability confound (MMLU)"
    - "Label P2 as exploratory/directional to prevent confirmatory bias"
  external_validity:
    - "Results apply to models with published scores as of 2024-2025; generalization to newer models uncertain"
    - "English-language benchmarks only; fairness patterns may differ for other languages"
    - "Score aggregation across papers introduces potential protocol variation — acknowledge as limitation"

discussion_synthesis:
  key_insights:
    - "The capability confound (general NLU capability explains both ID and OOD scores) is the primary methodological threat; partial Spearman ρ is the correct tool to address it"
    - "TruthfulQA→HaluEval pair must be excluded due to evaluation protocol incompatibility — reliability dimension requires consistent-protocol pair"
    - "The DecodingTrust GPT-4 finding (higher standard scores, more adversarial vulnerability) is N=2 evidence for the rank reversal hypothesis; full Spearman ρ analysis is the necessary test"
    - "Shift type heterogeneity (adversarial difficulty vs. distributional underspecification) is a feature, not a bug — it becomes the theoretical explanation for dimension-specific ρ differences"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Identifying the capability confound as central threat → led to partial Spearman ρ as core methodology"
    - "Exchange 7 (Dr. Nova): Reframing capability control as strengthening novelty (testing independent trustworthiness generalization) rather than complicating the analysis"
    - "Exchange 5 (Dr. Ally): Shifting from 'drop reliability dimension' to 'use TrustLLM consistent hallucination OOD task' — preserves scope"
  resolved_tensions:
    - "Tension: TruthfulQA→HaluEval protocol mismatch → Resolved: drop pair or substitute with consistent-protocol reliability measure"
    - "Tension: directionality of fairness > robustness needs theoretical grounding → Resolved: latent statistical bias (stable) vs. adversarial design (disruptive) distinction, labeled as exploratory"
    - "Tension: small common model set → Resolved: report N per cell explicitly, acknowledge power limitations"
