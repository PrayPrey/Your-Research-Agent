# Phase 6 Narrative Blueprint
# Generated: Step 02 - Narrative Design
# Paper: Cross-Split Predictive Validity of LLM Trustworthiness Benchmarks

paper_title: "Do Trustworthiness Benchmarks Generalize? Rank Stability of LLM Fairness and Robustness Across Distribution Shifts"

# ============================================================
# HOOK
# ============================================================

hook:
  opening_statement:
    content: >
      We set out to find that fairness rankings of language models are more stable than adversarial
      robustness rankings across distribution shifts — and found that we were wrong about why.
      Both dimensions exhibit strikingly high rank stability (ρ > 0.68 for all pairs), even after
      controlling for general capability. The mechanism we proposed to explain the difference was
      falsified. Yet the empirical pattern — near-perfect fairness rank preservation (ρ = 0.962)
      and substantial robustness rank preservation (ρ = 0.684–0.868) — turns out to be the more
      important finding.
    strategy: "counterintuitive_finding"
    why_counterintuitive: "Predicted adversarial benchmarks would disrupt rankings; they don't."

  why_reader_should_care:
    main_reason: "If trustworthiness rankings are stable across distribution shifts, in-distribution evaluations are predictive — making safety deployment decisions more tractable."
    concrete_example: "A model ranked high on fairness in a disambiguated context will also rank high in an ambiguous context. This is not obvious — and it has direct implications for how we select models for deployment."
    stakes: "Without knowing whether in-distribution trustworthiness predicts OOD trustworthiness, practitioners have no principled basis for trusting evaluation-to-deployment transfer."

# ============================================================
# PROBLEM FRAMING (3 levels)
# ============================================================

problem_framing:
  surface_problem:
    description: "LLMs are evaluated on trustworthiness benchmarks, but these benchmarks cover specific conditions — not the full deployment distribution."
    common_understanding: "Researchers evaluate models on available benchmarks and report scores. The field knows models can fail in unexpected ways OOD."

  deeper_problem:
    description: "The fundamental question of whether in-distribution trustworthiness rankings predict out-of-distribution rankings has not been systematically studied across dimensions."
    why_overlooked: "Most evaluation papers report absolute scores per model, not rank correlation across benchmark splits. The predictive validity framing — borrowed from psychometrics — has not been applied to trustworthiness."
    our_perspective: "Trustworthiness evaluation is implicitly used as predictive of deployment behavior. This predictive claim has never been empirically tested at scale for fairness and robustness dimensions."

  gap_in_existing_work:
    description: "No study computes partial Spearman ρ (capability-controlled) between in-distribution and OOD trustworthiness model rankings across 15+ LLMs and compares dimensions."
    why_gap_exists: "Evaluation papers focus on absolute performance, not predictive validity. The partial correlation framing requires cross-benchmark data aggregation and capability control not performed in prior work."
    why_gap_matters: "Without this analysis, it is unknown whether trustworthiness evaluations are measuring stable model properties or context-specific artifacts — a critical question for deployment."

# ============================================================
# KEY INSIGHT
# ============================================================

key_insight:
  aha_moment:
    one_sentence: >
      LLM trustworthiness rankings — both fairness and adversarial robustness — are highly stable
      across in-distribution to out-of-distribution benchmark shifts even after controlling for
      general capability, suggesting trustworthiness is a stable latent property rather than a
      test-specific artifact.
    expanded_explanation: >
      After controlling for general capability (MMLU), fairness model rankings (BBQ-Disambig →
      BBQ-Ambig) show near-perfect preservation (ρ = 0.962), and adversarial robustness rankings
      show substantial preservation (ρ_ANLI = 0.684, ρ_AdvGLUE = 0.868). Zero rank reversals
      were observed. The critical insight is that the adversarial design of robustness benchmarks
      does not disrupt rank stability — models that outperform peers on easier rounds also outperform
      on adversarially-constructed harder rounds.

  why_others_missed_it:
    common_assumptions: "Prior work assumed adversarial benchmarks disrupt rankings (DecodingTrust N=2 anecdote) or did not frame trustworthiness evaluation as a predictive validity problem."
    our_different_view: "We treated in-distribution trustworthiness as a predictor of OOD trustworthiness, applied partial correlation to remove capability confound, and tested at N=16 across diverse model families."
    enabling_factor: "TrustLLM (2024) provided a single-source, protocol-consistent evaluation of 16 LLMs on both BBQ splits and ANLI rounds with MMLU scores — enabling this analysis without new data collection."

  what_makes_it_work:
    intuitive_explanation: "Fairness biases appear to be deeply encoded in model weights during pretraining — they persist even when the surface evaluation context changes from informative to ambiguous."
    key_mechanism: "Partial Spearman ρ (pingouin.partial_corr, MMLU-controlled) separates trustworthiness-specific rank stability from general capability correlations."

# ============================================================
# EVIDENCE NARRATIVE
# ============================================================

evidence_narrative:
  main_claim:
    statement: "LLM trustworthiness model rankings are highly stable across in-distribution to OOD benchmark shifts after controlling for general capability, with fairness showing marginally stronger stability than adversarial robustness."
    measurable_criteria:
      - "Partial Spearman ρ_fairness > 0.4, p < 0.05 (N=16): CONFIRMED at ρ=0.962"
      - "Partial Spearman ρ_robustness significantly positive: CONFIRMED at ρ_ANLI=0.684, ρ_AdvGLUE=0.868"
      - "Δρ directional significance: SUPPORTED (Fisher z p=0.024, Δρ=0.192)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Fairness partial ρ = 0.962 (CI=[0.90,1.00], p≈0, N=16)"
      so_what: "In-distribution fairness scores near-perfectly predict OOD fairness rankings — trustworthiness benchmark placement is not noise."
      how_it_supports_claim: "Directly confirms high rank stability for fairness dimension; primary result."

    - id: "evidence_2"
      what: "Zero rank reversals across both adversarial robustness pairs (N=13, ANLI+AdvGLUE)"
      so_what: "Adversarial benchmark construction does not flip model ordering. Models strong on ANLI R1 remain strong on ANLI R3 even after capability control."
      how_it_supports_claim: "Falsifies mechanism, establishes robustness stability as empirical fact."

    - id: "evidence_3"
      what: "MMLU control reveals hidden differential: raw ρ≈0.98 for all dimensions; partial ρ: fairness=0.962, ANLI=0.684"
      so_what: "Without capability control, all dimensions appear equally stable. Partial analysis reveals the fairness > robustness signal — capability control is methodologically essential."
      how_it_supports_claim: "Justifies the partial ρ methodology; demonstrates the approach reveals structure invisible in raw correlations."

    - id: "evidence_4"
      what: "Winogrande sensitivity: fairness ρ=0.969 (≈MMLU); Δρ collapses to 0.073 under Winogrande control"
      so_what: "Fairness result is robust to covariate choice; fairness-robustness differential is sensitive to capability proxy, motivating richer future analysis."
      how_it_supports_claim: "Supports robustness of primary finding; identifies limitation in Δρ claim."

  surprising_findings:
    - finding: "Adversarial robustness benchmark pairs show high positive partial ρ (ρ_AdvGLUE=0.868, ρ_ANLI=0.684), not disruption as predicted."
      why_surprising: "The adversarial design of ANLI R3 and AdvGLUE is specifically intended to defeat models that pass the easier variants. We expected rank disruption."
      our_interpretation: "Robustness to adversarial perturbation appears to be a stable latent model property — possibly training data diversity or instruction-tuning quality — that persists across adversarial difficulty escalation."

  what_results_mean:
    primary_interpretation: "Both fairness and adversarial robustness are stable latent model properties, not test-specific artifacts. In-distribution evaluations predict out-of-distribution rankings after capability control."
    secondary_interpretation: "The adversarial disruption hypothesis is falsified. The correct characterization is that fairness shows marginally stronger stability (Δρ=0.192 directional, p=0.024) — mechanism unknown."

# ============================================================
# BROADER IMPACT
# ============================================================

takeaway:
  main_contribution:
    one_sentence: "First partial Spearman ρ analysis of cross-split trustworthiness benchmark predictive validity across 16 LLMs establishes that trustworthiness rankings are stable across distribution shifts."
    why_significant: "Validates the implicit assumption in LLM safety evaluation that in-distribution trustworthiness predicts OOD behavior — and reveals the adversarial disruption hypothesis is empirically incorrect."

  implications:
    for_field: "Trustworthiness benchmarks have higher predictive validity than assumed — a model selected for deployment based on fairness or robustness rankings will likely maintain its relative standing in harder conditions."
    for_practice: "Safety evaluators can use in-distribution trustworthiness rankings as meaningful predictors of OOD behavior, but should acknowledge the near-threshold Δρ result and test with richer capability controls."

  future_possibilities:
    immediate_extensions:
      - "BBQ item-level overlap analysis to distinguish model stability from benchmark artifact"
      - "Richer capability covariates (BIG-Bench, GSM8K) to test Δρ sensitivity"
    longer_term_vision: "Extending to reliability and privacy dimensions, post-2024 models, and multi-attack adversarial robustness to build a comprehensive predictive validity map of LLM trustworthiness."

# ============================================================
# SECTION-LEVEL GOALS
# ============================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story — problem, insight, key result, honest qualification — into ~150 words. Story-driven, not a metrics list."
    key_message: "Trustworthiness rankings are stable across distribution shifts (ρ>0.68 all dimensions); adversarial disruption hypothesis falsified; fairness shows marginally stronger stability."

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding — we expected disruption, found stability; mechanism was wrong, empirical finding is stronger"
    opening: "Start with the specific empirical finding (not 'X is important') and the honest reversal: we were wrong about the mechanism."
    problem_levels:
      level_1: "LLMs are evaluated on trustworthiness benchmarks, but deployment conditions differ."
      level_2: "No prior work tests whether in-distribution trustworthiness rankings predict OOD rankings across 15+ models."
      level_3: "Without this, we cannot know whether trustworthiness evaluations measure stable properties or context-specific artifacts."
    contributions_framing: "Frame as: (1) empirical baseline, (2) methodological demonstration, (3) mechanism revision"
    transition_to_related: "The gap we address is implicit in how the field uses evaluation results."

  related_work:
    narrative_purpose: "Show existing work is insufficient → justify our approach"
    positioning_strategy: "Each prior work evaluates trustworthiness but not cross-split predictive validity; we fill this gap."
    key_comparison_points:
      - area: "Multi-dimensional LLM trustworthiness evaluation"
        papers: ["TrustLLM (Huang et al., 2024)", "DecodingTrust (Wang et al., 2023)", "HELM (Liang et al., 2022)"]
        limitation: "Report absolute scores, not cross-split rank correlations. DecodingTrust N=2."
      - area: "Adversarial robustness benchmarks"
        papers: ["AdvGLUE (Wang et al., 2021)", "ANLI (Nie et al., 2020)"]
        limitation: "Benchmark construction papers; do not evaluate cross-model rank stability."
      - area: "Cross-benchmark predictive validity methodology"
        papers: ["Gevers & Daelemans (2026)"]
        limitation: "Applied to commonsense benchmarks, not trustworthiness dimensions with safety stakes."
      - area: "Fairness benchmark design"
        papers: ["BBQ (Parrish et al., 2021)"]
        limitation: "Documents bias patterns; does not compute ID→OOD rank stability."

  methodology:
    narrative_purpose: "WHY this design solves the problem — the partial ρ approach and its rationale"
    connection_to_insight: "Partial Spearman ρ (MMLU-controlled) is the minimal sufficient statistic to answer the predictive validity question while separating trustworthiness from general capability."
    key_design_decisions:
      - decision: "Partial correlation (not raw correlation)"
        rationale: "Raw ρ is near-ceiling for all dimensions (≈0.98), masking dimension-specific signal. MMLU control isolates trustworthiness-specific rank preservation."
      - decision: "Single-source data (TrustLLM)"
        rationale: "Cross-source aggregation introduces protocol confounds. Single-source ensures 100% protocol consistency."
      - decision: "GLUE/AdvGLUE exclusion"
        rationale: "GLUE-X covers encoder-only PLMs; zero overlap with the 16 LLMs in TrustLLM. Architectural divide makes comparison invalid."
      - decision: "Fisher z-test for Δρ"
        rationale: "Standard test for difference between two correlations; one-tailed to match directional hypothesis."

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "RQ1: Is partial ρ_fairness significantly positive after capability control? (P1 — confirmatory)"
      - "RQ2: Is Δρ_fairness − ρ_robustness ≥ 0.2? (P2 — exploratory)"
      - "RQ3: Does adversarial benchmark construction disrupt rank stability per pair? (P3 — mechanism test)"
    dataset_rationale: "TrustLLM provides the only single-source protocol-consistent scores across all target dimensions."
    baseline_rationale: "Raw ρ (no MMLU control) and random permutation test as statistical baseline."
    metric_rationale: "Partial Spearman ρ is the primary statistic; Fisher z-test for significance and Δρ comparison."

  results:
    narrative_purpose: "Present evidence supporting claims — interpret every number"
    main_result_highlight: "Fairness partial ρ = 0.962 — near-perfect rank preservation after capability control (Figure 1)."
    result_flow:
      - "Primary: fairness ρ (P1 confirmed)"
      - "Robustness: both pairs significantly positive (mechanism falsified)"
      - "Differential: Δρ = 0.192 directional (P2 near-miss)"
      - "Methodology: raw vs partial comparison (Figure 4)"
      - "Sensitivity: Winogrande control (Figure 5 / Appendix)"

  discussion:
    narrative_purpose: "Interpret results, acknowledge honest limitations"
    key_findings_interpretation:
      - "Both trustworthiness dimensions are stable latent model properties — not test artifacts"
      - "Adversarial disruption mechanism falsified; corrects theoretical assumption"
      - "Capability control is methodologically essential (raw ρ masks dimension-specific signal)"
    honest_limitations:
      - "GLUE/AdvGLUE arm unavailable for decoder-only LLMs (structural gap)"
      - "Δρ=0.192 below preregistered 0.200 criterion (near-miss, directional only)"
      - "Causal mechanism for fairness > robustness stability unknown"
      - "P3 (instruction-tuning effects) untested"

  conclusion:
    narrative_purpose: "Reinforce message, callback to hook, open future"
    callback_to_hook: "We began with a falsified mechanism and an unexpected finding. The unexpected finding — that trustworthiness rankings are stable — is the contribution."
    memorable_ending: "Knowing that a model's trustworthiness ranking is stable across distribution shifts is a prerequisite for principled model selection. This study establishes that prerequisite is met — while opening the question of why."

