    original_name: "rank_scatter_bbq.png"
    source: "h-m1/figures/rank_scatter_bbq.png"
    target: "figures/rank_scatter_bbq.png"
    caption: "Rank scatter plot of BBQ-Disambig vs BBQ-Ambig model rankings (N=16). Partial Spearman ρ = 0.962 after MMLU control. Each point is one LLM; models maintain their relative ordering across context shifts."
    section: "results"
    width: "0.9\\textwidth"
    phase: "phase_4"
    figure_number: 1

  - id: "fig_2"
    original_name: "forest_plot.png"
    source: "h-m2/figures/forest_plot.png"
    target: "figures/forest_plot.png"
    caption: "Forest plot of partial Spearman ρ with 95% confidence intervals for each trustworthiness dimension (N=13). Fairness (BBQ): ρ=0.962; ANLI: ρ=0.684; OOD robustness: ρ=0.868. Dashed line shows preregistered Δρ=0.200 threshold."
    section: "results"
    width: "0.9\\textwidth"
    phase: "phase_4"
    figure_number: 2

  - id: "fig_3"
    original_name: "rank_reversal_heatmap.png"
    source: "h-m3/figures/rank_reversal_heatmap.png"
    target: "figures/rank_reversal_heatmap.png"
    caption: "Model rank position heatmap across benchmark pairs. Zero rank reversals observed across N=13 models for both ANLI R1→R3 and GLUE→AdvGLUE pairs, falsifying the adversarial disruption hypothesis."
    section: "results"
    width: "0.9\\textwidth"
    phase: "phase_4"
    figure_number: 3

  - id: "fig_4"
    original_name: "per_dimension_scatter.png"
    source: "h-m2/figures/per_dimension_scatter.png"
    target: "figures/per_dimension_scatter.png"
    caption: "Three-panel scatter plot of partial ρ (MMLU-controlled) per trustworthiness dimension. Raw ρ is near-ceiling for all dimensions (≈0.98); partial ρ reveals dimension-specific variation hidden by the capability confound."
    section: "results"
    width: "0.95\\textwidth"
    phase: "phase_4"
    figure_number: 4

  - id: "fig_5"
    original_name: "sensitivity_comparison.png"
    source: "h-m1/figures/sensitivity_comparison.png"
    target: "figures/sensitivity_comparison.png"
    caption: "Sensitivity analysis comparing MMLU vs Winogrande as capability covariate for fairness partial ρ (N=14 for Winogrande). Fairness result is robust to covariate choice (MMLU: 0.962, Winogrande: 0.969)."
    section: "appendix"
    width: "0.85\\textwidth"
    phase: "phase_4"
    figure_number: 5

