# ============================================================
# METHODOLOGY DETAILS
# ============================================================

methodology:
  primary_tool: "pingouin.partial_corr"
  method: "spearman"
  alternative: "greater"
  significance_level: 0.05

  data_source: "TrustLLM (Sun et al., 2024), arXiv 2401.05561"
  model_n_fairness: 16
  model_n_robustness: 13
  excluded_models: ["Alpaca-13B", "Koala-13B", "OpenAssistant-12B"]
  capability_covariate_primary: "MMLU"
  capability_covariate_sensitivity: "Winogrande"

  benchmark_pairs:
    fairness: "BBQ-Disambig → BBQ-Ambig"
    robustness_primary: "ANLI R1 → R3"
    robustness_secondary: "OOD Robustness (TrustLLM Micro F1)"
    excluded: "GLUE → AdvGLUE (GLUE-X PLM-only; zero LLM overlap)"

  key_implementation_files:
    - "h-m1/code/analysis.py — compute_partial_spearman()"
    - "h-m1/code/data.py — build_score_dataframe()"
    - "h-m3/code/analysis.py — per-pair robustness analysis"

# ============================================================
# GATE OUTCOMES
# ============================================================

gate_results:
  h_e1:
    gate_type: "MUST_WORK"
    result: "PASS"
    finding: "N_common=16 for BBQ+ANLI+MMLU. GLUE/AdvGLUE arm dropped (zero LLM overlap with GLUE-X)."

  h_m1:
    gate_type: "MUST_WORK"
    result: "PASS"
    key_result: "Partial ρ_fairness=0.9617, p≈0, N=16. All 9 mechanism tests pass."

  h_m2:
    gate_type: "SHOULD_WORK"
    result: "FAIL"
    key_result: "Δρ=0.192 < 0.200 threshold. Fisher z p=0.024 (directional significance present)."
    near_miss: true
    shortfall: 0.008

  h_m3:
    gate_type: "SHOULD_WORK"
    result: "FAIL"
    key_result: "ρ_AdvGLUE=0.868, ρ_ANLI=0.684 — both significantly positive. Mechanism falsified."
    falsified_mechanism: "Adversarial benchmark design disrupts rank stability"

