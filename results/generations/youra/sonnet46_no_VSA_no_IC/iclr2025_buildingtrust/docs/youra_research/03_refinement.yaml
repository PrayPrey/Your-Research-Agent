      difference: "DecodingTrust measures multi-dimension trustworthiness for 2 GPT models. We measure cross-split predictive validity across 15+ diverse models and compute Spearman ρ as the primary outcome."
    - prior_work: "TrustLLM (Huang et al., ICML 2024)"
      difference: "TrustLLM evaluates 16 models across 6 trustworthiness dimensions but does not compute rank correlation between ID and OOD variants as a predictive validity question."
    - prior_work: "Gevers & Daelemans (2026) — commonsense benchmark predictive validity"
      difference: "We apply the identical methodology (rank correlation + capability control) to trustworthiness dimensions, which have higher safety stakes and a mechanistically distinct ID/OOD structure (latent bias vs. adversarial design)."
    - prior_work: "GLUE-X (Yang et al., ACL 2023)"
      difference: "GLUE-X measures ID→OOD accuracy gap magnitude but does not compute cross-model rank correlation or compare dimension-specific predictive validity."

