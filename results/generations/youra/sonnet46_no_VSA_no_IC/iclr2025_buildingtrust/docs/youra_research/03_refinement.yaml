# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Spearman rank correlation is a valid method for measuring cross-benchmark model rank stability"
      status: "BUILD_ON"
      evidence: "Standard non-parametric measure; used in Gevers & Daelemans (2026) for commonsense benchmark predictive validity analysis"
    - claim: "GLUE/AdvGLUE and ANLI R1/R3 are matched in-distribution/OOD benchmark pairs for robustness"
      status: "BUILD_ON"
      evidence: "Wang et al. (2021) AdvGLUE; Nie et al. (2020) ANLI; confirmed publicly available with 15+ model evaluations in GLUE-X (Yang et al., ACL 2023)"
    - claim: "BBQ-Disambiguated vs BBQ-Ambiguous constitutes a valid fairness ID/OOD pair"
      status: "BUILD_ON"
      evidence: "Parrish et al. (2021) BBQ; disambig context provides clear answer, ambiguous context requires stereotype resistance — confirmed shift type"
    - claim: "No prior study computes Spearman ρ across 15+ models between in-distribution and OOD trustworthiness benchmark scores"
      status: "PROVE_NEW"
      evidence: "Confirmed by Phase 1 citation network analysis: DecodingTrust, TrustLLM, HELM evaluate dimensions in isolation without cross-split rank correlation as primary question"
    - claim: "Partial Spearman ρ controlling for MMLU separates trustworthiness generalization from general capability generalization"
      status: "PROVE_NEW"
      evidence: "Theoretical — capability confound identified in discussion (Exchange 6); MMLU as general capability proxy is widely used but has known limitations (sensitivity analysis needed)"
    - claim: "Fairness benchmark scores reflect stable latent statistical biases while adversarial robustness scores reflect capability-targeting properties"
      status: "PROVE_NEW"
      evidence: "Theoretical argument developed in discussion (Exchange 7); supported by DecodingTrust finding that GPT-4 has higher standard scores but greater adversarial vulnerability than GPT-3.5; requires empirical confirmation"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims (50%) are established and do not need re-verification.
    Focus Phase 2B verification on the three PROVE_NEW claims:
    (1) Confirm no prior cross-split predictive validity study exists for trustworthiness (literature check)
    (2) Validate partial Spearman ρ methodology with MMLU control on the actual model set
    (3) Test the latent-bias-stability vs adversarial-design distinction empirically

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TrustPredVal-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under evaluation of 15+ publicly available LLMs on matched in-distribution/OOD
    trustworthiness benchmark pairs, if we compute partial Spearman ρ between
    in-distribution and OOD model rankings (controlling for general capability via MMLU),
    then the fairness dimension (BBQ-Disambig → BBQ-Ambig) shows significantly positive
    partial ρ (ρ > 0.4, p < 0.05) while the adversarial robustness dimension
    (GLUE → AdvGLUE, ANLI R1 → R3) shows lower partial ρ, because fairness failures
    reflect stable latent statistical biases in model representations that manifest
    consistently across distribution shifts, while adversarial robustness benchmarks
    are specifically designed to overcome models' current capabilities and therefore
    do not track stable generalizable trustworthiness properties.
  alternative_hypothesis_h0: |
    There is no significant difference in partial Spearman ρ (MMLU-controlled) between
    the fairness dimension and the robustness dimension for in-distribution to OOD
    model rank prediction (Δρ = 0 across dimensions, Fisher z-test p ≥ 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Trustworthiness Dimension"
      type: "categorical"
      operationalization: "Which trustworthiness property is being evaluated"
      levels:
        - "Fairness (BBQ-Disambig → BBQ-Ambig)"
        - "Robustness-Adversarial (GLUE → AdvGLUE)"
        - "Robustness-Difficulty (ANLI R1 → ANLI R3)"
    - name: "Evaluation Split Type"
      type: "categorical"
      operationalization: "Whether model is evaluated on in-distribution (ID) or out-of-distribution (OOD) benchmark variant"
      levels:
        - "In-distribution (ID)"
        - "Out-of-distribution (OOD)"
    - name: "Training Paradigm"
      type: "categorical"
      operationalization: "Base pretrained model vs. RLHF/instruction-tuned variant (secondary analysis)"
      levels:
        - "Base pretrained"
        - "Instruction-tuned (RLHF/SFT)"
  dependent:
    - name: "Partial Spearman ρ (MMLU-controlled)"
      type: "continuous"
      operationalization: "Spearman rank correlation between model rankings on ID benchmark and OOD benchmark, after partial correlation removing MMLU rank as general capability covariate. Range: -1 to +1."
      primary: true
    - name: "Raw Spearman ρ (unadjusted)"
      type: "continuous"
      operationalization: "Spearman rank correlation between model rankings on ID benchmark and OOD benchmark, without capability control. Range: -1 to +1."
      primary: false
    - name: "Trustworthiness Generalization Gap (TGG)"
      type: "continuous"
      operationalization: "Mean absolute rank position change between ID and OOD evaluation across models. Higher = less stable generalization."
      primary: false
  controlled:
    - name: "General Capability (MMLU)"
      operationalization: "Partial out MMLU score rank from Spearman ρ computation to isolate trustworthiness-specific generalization"
    - name: "Model Set"
      operationalization: "Use same overlapping model set across dimensions where possible; report N per analysis cell explicitly"
    - name: "Benchmark Evaluation Protocol"
      operationalization: "Use only benchmark pairs with compatible evaluation protocols (drop TruthfulQA→HaluEval due to format mismatch; use TrustLLM hallucination OOD task if reliability dimension is included)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Fairness failures are encoded as stable latent statistical biases in model weights during pretraining, reflecting statistical regularities in training data (stereotypical associations, demographic co-occurrences)"
      evidence: "BBQ (Parrish et al., 2021): models rely on stereotypes in ambiguous contexts — 3.4pp accuracy advantage when answers align with social bias. This bias persists across context framing (disambig vs. ambig), suggesting it reflects internal model state rather than surface context features."
      falsifier: "If fairness performance varies dramatically across semantically equivalent reformulations of the same BBQ item, bias is surface-level (not latent) and this step fails"
    - step: 2
      description: "Because fairness biases are stable latent properties, model rankings on fairness ID benchmarks (disambig context) preserve their order on fairness OOD benchmarks (ambig context) — the relative bias magnitude across models is consistent across shift"
      evidence: "Theoretical inference from step 1 + supported by TrustLLM (Huang et al., ICML 2024) finding consistent ordering of model families on fairness metrics across evaluation conditions"
      falsifier: "If Spearman ρ between BBQ-Disambig and BBQ-Ambig model rankings is not significantly positive after MMLU control (ρ ≤ 0.2, p ≥ 0.05), step 2 fails"
    - step: 3
      description: "Adversarial robustness benchmarks (AdvGLUE, ANLI R3) are designed through iterative adversarial human-model-in-the-loop processes to defeat models that pass the in-distribution version — they specifically target current capability limitations. Therefore, model rankings on in-distribution NLU tasks do not predict rankings on adversarially-designed OOD variants."
      evidence: "AdvGLUE (Wang et al., 2021): 14 adversarial attack methods all designed to fool current models. ANLI (Nie et al., 2020): R3 constructed to defeat models that passed R1/R2 — by design, models that perform well on easier rounds are specifically targeted in harder rounds. DecodingTrust (Wang et al., 2023): GPT-4 has higher standard scores but MORE adversarial vulnerability than GPT-3.5."
      falsifier: "If partial Spearman ρ for GLUE→AdvGLUE or ANLI R1→R3 is significantly positive (ρ > 0.4, p < 0.05) after MMLU control, the adversarial-design disruption mechanism fails"
  key_tension: "The mechanism assumes adversarial design systematically disrupts rank stability, but if adversarial robustness is also partly a function of stable model properties (e.g., general reasoning quality), some positive ρ may persist even for adversarial pairs. The key empirical question is whether this positive signal is smaller than for fairness."
  evidence_summary: |
    The causal chain relies on the distinction between stable latent statistical biases
    (fairness) and adversarially-designed capability-targeting tests (robustness).
    Direct evidence: DecodingTrust N=2 (GPT-3.5/4) shows rank reversal for adversarial
    vulnerability. BBQ shows consistent stereotype reliance across contexts.
    The full Spearman ρ analysis across 15+ models will be the primary empirical test.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "A common model set of at least 10 models has published scores on both BBQ-Disambig and BBQ-Ambig benchmark variants, enabling minimum-power Spearman ρ computation"
    supporting_evidence: "TrustLLM (Huang et al., ICML 2024) evaluates 16 LLMs on fairness tasks including BBQ variants; GLUE-X evaluates 21 models on NLU OOD tasks"
    consequence_if_violated: "Spearman ρ computed on N < 10 models has insufficient power (Δρ = 0.3 requires N ≈ 15 for 80% power at p < 0.05); primary prediction P1 cannot be tested"
  - id: "A2"
    assumption: "MMLU scores are available for the same model set as the trustworthiness benchmark scores, enabling partial correlation computation"
    supporting_evidence: "MMLU (Hendrycks et al., 2020) scores are widely published for virtually all major LLMs including LLaMA-2, GPT family, Mistral, Falcon — the same models in TrustLLM and GLUE-X"
    consequence_if_violated: "Cannot compute partial Spearman ρ; analysis falls back to raw ρ which conflates trustworthiness generalization with capability generalization"
  - id: "A3"
    assumption: "BBQ-Disambig and BBQ-Ambig evaluations use identical scoring protocols (same metric, same few-shot setup) across the model evaluations being aggregated"
    supporting_evidence: "TrustLLM uses consistent evaluation protocols across fairness tasks; BBQ dataset provides standardized splits"
    consequence_if_violated: "Rank correlation reflects protocol differences rather than genuine fairness generalization; dimension-specific comparison is invalid"
  - id: "A4"
    assumption: "The adversarial design of AdvGLUE and ANLI R3 is sufficient to disrupt rank stability relative to fairness benchmarks — i.e., the adversarial targeting effect is large enough to detect with the available model set"
    supporting_evidence: "DecodingTrust rank reversal (GPT-4 vs GPT-3.5) and ANLI design philosophy (R3 specifically defeats R1/R2 models) support large disruption effect"
    consequence_if_violated: "Δρ between fairness and robustness is smaller than 0.2 and P2 is not confirmed; hypothesis is not falsified but the key asymmetry claim is not supported"
  - id: "A5"
    assumption: "Aggregating model evaluation scores from different papers (TrustLLM, GLUE-X, DecodingTrust) for the same model on the same benchmark yields comparable scores (no systematic evaluation protocol differences across papers)"
    supporting_evidence: "Standard benchmarks (BBQ, ANLI, GLUE/AdvGLUE) use fixed test sets; score variation across papers is typically small for identical evaluation conditions"
    consequence_if_violated: "Aggregated scores are not comparable; analysis must restrict to single-source datasets (reduces model N but increases comparability)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - LLMs evaluated on public trustworthiness benchmarks with published scores
    - English-language benchmarks (BBQ, ANLI, GLUE/AdvGLUE)
    - Models of sufficient scale to have meaningful variation on trustworthiness benchmarks
      (approximately GPT-2 scale and above)
    - Decoder-only and encoder-decoder transformer architectures
    - The fairness and robustness trustworthiness dimensions as operationalized by
      BBQ (fairness) and AdvGLUE/ANLI (robustness)
  does_not_apply_to: |
    - Proprietary models without published benchmark scores
    - Non-English benchmarks or cross-lingual trustworthiness settings
    - The reliability dimension (TruthfulQA→HaluEval excluded due to protocol incompatibility)
    - Benchmark pairs where evaluation protocols differ across aggregated sources
    - Models that have been specifically trained on the OOD benchmarks (contamination would
      artificially inflate ρ)
  known_limitations: |
    - Reliability dimension dropped (TruthfulQA/HaluEval protocol mismatch); can be
      revisited with consistent-protocol hallucination evaluation
    - MMLU capability control is imperfect — does not capture all capability dimensions
    - Common model set N varies by dimension; some cells may have N < 15
    - Cross-paper score aggregation introduces potential protocol variation
    - Results apply to models available as of 2024-2025; newer models may shift the ρ landscape

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Partial Spearman ρ (MMLU-controlled) between BBQ-Disambig and BBQ-Ambig model rankings is significantly positive across the common model set"
    test_method: "Compute Spearman ρ between model rankings on BBQ-Disambig accuracy and BBQ-Ambig accuracy. Compute partial Spearman ρ removing MMLU rank. Test significance using Fisher z-transformation (one-tailed, α=0.05)."
    success_criterion: "Partial Spearman ρ_fairness > 0.4 AND p < 0.05 (one-tailed Fisher z-test), with N ≥ 10 models"
    falsification: "Partial Spearman ρ_fairness ≤ 0.2 OR p ≥ 0.05 after MMLU control falsifies P1"
  - id: "P2"
    primary: false
    statement: "(EXPLORATORY, DIRECTIONAL) Partial Spearman ρ for fairness (BBQ) exceeds partial ρ for adversarial robustness (GLUE→AdvGLUE or ANLI R1→R3) by at least Δρ = 0.2"
    test_method: "Compute partial Spearman ρ for both dimensions on overlapping model set. Compare using Fisher z-transformation for difference between two correlations."
    success_criterion: "ρ_fairness - ρ_robustness ≥ 0.2 (exploratory threshold, directional)"
    falsification: "ρ_robustness ≥ ρ_fairness (i.e., robustness is equally or more predictable than fairness) falsifies P2"
  - id: "P3"
    primary: false
    statement: "(EXPLORATORY) Instruction-tuned models (LLaMA-2-Chat, Mistral-Instruct, etc.) show a smaller trustworthiness generalization gap (TGG) than their base model counterparts for the fairness dimension, but not for the adversarial robustness dimension"
    test_method: "For each base/instruction-tuned pair with published scores: compute TGG = |rank_ID - rank_OOD| for fairness and robustness dimensions. Compare paired differences using Wilcoxon signed-rank test (N ≈ 5-8 pairs)."
    success_criterion: "Median TGG_fairness is smaller for instruction-tuned vs base (directional, N too small for formal significance)"
    falsification: "No systematic reduction in fairness TGG for instruction-tuned models, or TGG_robustness also decreases for instruction-tuned models (eliminating the dimension asymmetry)"

