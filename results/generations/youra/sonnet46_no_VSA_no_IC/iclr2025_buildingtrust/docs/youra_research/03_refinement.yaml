experimental_setup:
  dataset:
    name: "Aggregated multi-model trustworthiness evaluation scores from published sources"
    type: "standard"
    source: "TrustLLM (Huang et al., ICML 2024), GLUE-X (Yang et al., ACL 2023), OOD_NLP (Yuan et al., NeurIPS 2023), DecodingTrust (Wang et al., NeurIPS 2023)"
    path: "Published leaderboards and paper tables; GitHub repos: HowieHwong/TrustLLM, YangLinyi/GLUE-X, lifan-yuan/OOD_NLP, AI-secure/DecodingTrust"
    hypothesis_fit: "These sources collectively provide published multi-model scores on all target benchmark pairs (BBQ, ANLI, GLUE/AdvGLUE) with 15+ models, enabling Spearman ρ computation without new data collection"
  model:
    name: "Overlapping model set across evaluation sources"
    type: "Mixed (decoder-only transformers at various scales)"
    source: "LLaMA-2 family (7B, 13B, 70B, Chat variants), Mistral (7B, Instruct), Falcon, GPT-3.5, GPT-4, Vicuna, Alpaca — all with published scores in at least one target source"
    hypothesis_fit: "Diverse model family coverage enables Spearman ρ with sufficient range in trustworthiness performance; base/instruction-tuned pairs enable P3 analysis"
  baselines:
    - name: "Random baseline"
      method: "Spearman ρ expected under random rank assignment (ρ = 0, CI from permutation test)"
    - name: "Raw Spearman ρ (no MMLU control)"
      method: "Compare partial ρ vs. raw ρ to quantify capability confound magnitude"
    - name: "Gevers & Daelemans (2026) commonsense benchmark ρ values"
      method: "Compare trustworthiness dimension ρ values to published commonsense benchmark ρ values as external reference for effect size interpretation"

