gap_title: "No Empirical Saturation Onset Threshold (paper_count*) Detected in PwC Leaderboard Data"
gap_description: |
  No prior work applies PELT change-point detection to PwC CoV-vs-paper_count series
  to identify saturation onset threshold (paper_count*). The confirmed rho=-0.28 (N=111, p=0.0025)
  shows monotonic relationship, but no breakpoint has been detected. This gap directly addresses Q1.
