# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SatOnset-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under PwC leaderboard benchmark data (N=111 benchmarks with confirmed CoV and paper_count),
    if we apply PELT change-point detection to linearly detrended residual CoV values sorted by
    paper_count, then a statistically significant structural break (paper_count*) will be detected,
    because Goodhart saturation dynamics create a genuine regime shift from high-variance CoV
    (performance exploration) to low-variance CoV (ceiling compression) as paper counts cross the threshold.
  alternative_hypothesis_h0: |
    There is no statistically significant change-point in the CoV-vs-paper_count relationship
    in PwC data (permutation test p ≥ 0.05 and/or Brown-Forsythe p ≥ 0.05). The rho=−0.28
    relationship is best described as a smooth monotonic trend without a regime shift.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "paper_count"
      type: "continuous"
      operationalization: "Number of result rows per benchmark in PwC evaluation-tables data. Computed by derive.py as count of unique result submissions per benchmark_id."
  dependent:
    - name: "residual_CoV"
      type: "continuous"
      operationalization: "Coefficient of Variation (std/mean of scores per benchmark), residualized by removing linear paper_count trend via OLS. Primary dependent variable for change-point detection."
      primary: true
    - name: "paper_count_star"
      type: "continuous"
      operationalization: "Detected change-point value in paper_count space (the breakpoint index mapped back to paper_count). Point estimate + 95% bootstrap CI."
      primary: false
    - name: "post_breakpoint_variance_ratio"
      type: "continuous"
      operationalization: "Ratio of residual_CoV variance in post-breakpoint segment to pre-breakpoint segment. Expected < 1.0 under H1."
      primary: false
  controlled:
    - name: "linear_paper_count_trend"
      operationalization: "Removed via OLS detrending (CoV ~ paper_count) before PELT application to avoid detecting the known global trend as a spurious change-point."
    - name: "benchmark_task_type"
      operationalization: "Controlled in global analysis (pooled), explicitly varied in stratified analysis. PwC task_type metadata field used for stratification."
    - name: "PELT_penalty_parameter"
      operationalization: "Tuned via elbow method across log-space [1, 50]. BIC formula applied. Sensitivity analysis across range reported."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Early publication phase (paper_count < paper_count*): Benchmark is newly introduced; model families explore diverse approaches. Score distribution is wide (high CoV) because the best architectural approach is not yet known."
      evidence: "Consistent with ImageNet history (arXiv:2205.04596): early years show wide score variation as CNN architectures compete. Goodhart's Law not yet active — no dominant strategy has emerged."
      falsifier: "If early-phase CoV is not systematically higher than late-phase CoV, the regime shift mechanism is absent."
    - step: 2
      description: "Saturation transition (paper_count ≈ paper_count*): The community identifies dominant approaches. Publication incentives shift from exploration to incremental improvement. Score distribution begins compressing."
      evidence: "Liao et al. 2022 documents this transition in aggregate; arXiv:2602.16763 S_index captures the compression. The structural break in CoV residuals corresponds to this community-level shift in research strategy."
      falsifier: "If no structural break is detectable in the residual CoV series (permutation p ≥ 0.05), this transition mechanism does not produce a detectable signal at the CoV level."
    - step: 3
      description: "Post-saturation phase (paper_count > paper_count*): Goodhart saturation — community optimizes for known ceiling. Score variance collapses (low CoV, homogeneous residuals). Benchmark loses discriminative power."
      evidence: "Bowman et al. 2021 (NAACL): argues saturated benchmarks lose discriminative power. rho=−0.28 confirms that high-paper_count benchmarks have lower CoV. Brown-Forsythe test directly tests whether post-breakpoint residuals are more homogeneous."
      falsifier: "If post-breakpoint residual CoV variance is NOT significantly lower than pre-breakpoint (Brown-Forsythe p ≥ 0.05), the saturation compression mechanism is not operating as described."
  key_tension: "Whether a detectable change-point exists at all — the smooth monotonic rho=−0.28 relationship might be consistent with no structural break. The permutation test directly addresses this tension."
  evidence_summary: |
    The three-step mechanism is supported by: (1) confirmed rho=−0.28 empirical anchor (global trend);
    (2) Goodhart's Law literature explaining community ceiling optimization; (3) prior saturation
    documentation at aggregate level (Liao 2022, S_index 2026). The structural break (step 2) is
    the novel claim requiring new empirical validation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pooled cross-sectional CoV values sorted by paper_count form a valid input series for PELT after linear detrending."
    supporting_evidence: "Linear detrending removes the global monotonic component (captured by rho=−0.28), leaving residuals that represent benchmark-level deviation from the trend. PELT on residuals detects structural breaks in dispersion, not the trend itself."
    consequence_if_violated: "PELT detects heterogeneity between benchmark subpopulations (e.g., image vs. NLP) rather than a saturation threshold. Stratified analysis would reveal this."
  - id: "A2"
    assumption: "N=111 benchmarks is sufficient for reliable PELT change-point detection."
    supporting_evidence: "VPWBS (arXiv:1906.11364): O_p(1/n) localization rate. With N=111, min_size=3, localization accuracy ≈ ±1 paper. Bootstrap CI width ≤ 20 papers is achievable."
    consequence_if_violated: "Bootstrap CI width > 20 papers, indicating paper_count* estimate is too uncertain for policy use. Result published as exploratory with caveat."
  - id: "A3"
    assumption: "PwC benchmark task_type metadata is accurate enough for stratification (N ≥ 20 per major stratum)."
    supporting_evidence: "Phase 1 analysis: image_classification ~30, NLP/reading_comprehension ~40, object_detection ~15-20. Two strata (image, NLP) exceed N=20 threshold."
    consequence_if_violated: "Object_detection stratum falls below N=20; use piecewise regression F-test only for that stratum (pre-specified rule)."
  - id: "A4"
    assumption: "The Goodhart saturation mechanism (community optimization toward known ceiling) is the primary driver of CoV reduction, not confounding factors like benchmark metric heterogeneity."
    supporting_evidence: "rho=−0.28 persists across diverse benchmark types in H-E1 v2, suggesting the mechanism is robust to metric heterogeneity. Linear detrending controls for paper_count as a confounder."
    consequence_if_violated: "Metric heterogeneity (different score scales) drives observed CoV patterns. Robustness check: repeat analysis with score-normalized CoV (min-max per benchmark) and compare paper_count* estimates."
  - id: "A5"
    assumption: "A single structural break (one change-point) adequately characterizes the CoV-vs-paper_count relationship."
    supporting_evidence: "Parsimony assumption supported by rho=−0.28 global monotonic trend — suggests one dominant transition. PELT can detect multiple change-points; BIC-tuned penalty will naturally select simpler models."
    consequence_if_violated: "PELT detects 2+ change-points, suggesting more complex saturation dynamics (e.g., early exploration, rapid convergence, plateau). Still interpretable; report all change-points."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    PwC leaderboard benchmarks with: (1) ≥5 result rows (paper_count ≥ 5) — minimum for CoV computation;
    (2) computable CoV from existing derive.py output; (3) percentage-based or normalized performance metrics
    (accuracy, F1, etc.) where higher scores indicate better performance. Analysis covers N=111 benchmarks
    confirmed in H-E1 v2.
  does_not_apply_to: |
    (1) Loss-based metrics (lower = better) — direction of saturation effect differs.
    (2) Benchmarks with fewer than 5 results — CoV unreliable.
    (3) k-shot benchmarks excluded per Phase 1 constraints (pre-2020 data insufficient).
    (4) Cross-repository analysis (PwC + OpenML joins) — excluded per H-E1 v1 failure.
    (5) External benchmarks not in PwC data (HELM, OpenLLM Leaderboard) — different data schema.
  known_limitations: |
    (1) N=111 is a subset of 1,096 total PwC benchmarks (only those with computable CoV).
    (2) Object_detection stratum may be too small for PELT (N~15-20); F-test fallback pre-specified.
    (3) Cross-sectional pooling (not longitudinal within-benchmark) — assumes IID benchmarks.
    (4) Single change-point assumption may not hold for all task domains.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "A statistically significant structural break (paper_count*) exists in the CoV-vs-paper_count relationship in PwC N=111 benchmark data, detectable via PELT on linearly detrended residual CoV, with permutation test p < 0.05."
    test_method: |
      1. Compute residual CoV: OLS fit CoV ~ paper_count, extract residuals.
      2. Sort residual CoV by paper_count ascending.
      3. Apply rpt.Pelt(model='l2', min_size=3).fit(residual_cov_sorted).predict(pen=bic_tuned).
      4. Permutation test: shuffle paper_count labels ×1000, rerun PELT, compare null distribution to observed paper_count*.
    success_criterion: "Permutation test p < 0.05 AND paper_count* ∈ [10, 120] (excludes boundary artifacts)."
    falsification: "Permutation test p ≥ 0.05: no significant change-point detected. Null model (smooth monotonic rho=−0.28) is the empirically supported description."
  - id: "P2"
    primary: false
    statement: "Post-breakpoint residual CoV has significantly lower variance than pre-breakpoint residual CoV (Brown-Forsythe test p < 0.05), confirming the Goodhart saturation compression mechanism."
    test_method: |
      1. Split residual CoV at detected paper_count*.
      2. Apply scipy.stats.levene(pre_segment, post_segment, center='median') [Brown-Forsythe variant].
      3. Test H1: variance(post) < variance(pre) — one-tailed.
    success_criterion: "Brown-Forsythe p < 0.05, variance ratio (post/pre) < 1.0."
    falsification: "Brown-Forsythe p ≥ 0.05: no variance compression in post-breakpoint regime. Change-point (if detected) reflects mean shift only, not the variance homogenization predicted by Goodhart mechanism."
  - id: "P3"
    primary: false
    statement: "Task-type-stratified paper_count* values differ significantly across image_classification, NLP, and object_detection strata (within N ≥ 20 strata), demonstrating domain-specific saturation rates."
    test_method: |
      1. For each stratum with N ≥ 20: repeat P1 analysis within stratum.
      2. For strata with N < 20: apply piecewise linear regression F-test (statsmodels).
      3. Compare stratum-specific paper_count* point estimates and 95% bootstrap CIs.
      4. Non-overlapping CIs across strata = evidence for domain-specific thresholds.
    success_criterion: "At least one pair of task-type strata with non-overlapping 95% bootstrap CIs for paper_count*."
    falsification: "All stratum-specific paper_count* CIs overlap: no evidence for domain-specific thresholds. Global paper_count* is the best available estimate."

