# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "PwC benchmark result CoV is negatively correlated with paper_count (rho=−0.28, N=111, p=0.0025)"
      status: "BUILD_ON"
      evidence: "Confirmed empirical anchor from H-E1 v2 (prior pipeline iteration). ingest_pwc.py + derive.py verified."
    - claim: "ML benchmark saturation is a systemic phenomenon across CV and NLP (Liao et al. 2022, 3,765 benchmarks)"
      status: "BUILD_ON"
      evidence: "Liao et al. 2022 (Nature Comm): near-saturation trend confirmed across domains. No paper_count* threshold provided."
    - claim: "S_index (arXiv:2602.16763) characterizes saturation for LLM benchmarks but does not identify paper_count* in PwC data"
      status: "BUILD_ON"
      evidence: "evaleval/benchmark-saturation repo provides S_index computation — does not apply PELT to CoV-vs-paper_count."
    - claim: "PELT (ruptures library) detects unknown-N change-points with O_p(1/n) localization rate"
      status: "BUILD_ON"
      evidence: "arXiv:1906.11364 VPWBS algorithm; ruptures 2000+ stars; min_size=3 sufficient for N=111."
    - claim: "Paper_count* threshold in PwC CoV-vs-paper_count series has not been detected in any prior work"
      status: "PROVE_NEW"
      evidence: "Gap 1 analysis in Phase 1: no prior study applies change-point detection to PwC-internal CoV series."
    - claim: "Post-breakpoint residual CoV has lower variance than pre-breakpoint CoV (Goodhart saturation mechanism)"
      status: "PROVE_NEW"
      evidence: "Proposed mechanism; requires Brown-Forsythe variance test on empirical data."
  scope_reduction_percentage: 67
  phase2b_4_instructions: |
    BUILD_ON claims (4/6) are established and do not need re-verification in Phase 2B.
    PROVE_NEW claims (2/6) require empirical validation via the specified protocol.
