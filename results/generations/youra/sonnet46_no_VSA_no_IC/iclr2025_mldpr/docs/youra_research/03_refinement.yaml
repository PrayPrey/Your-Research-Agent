  model:
    name: "PELT Change-Point Detection + Piecewise Linear Regression"
    type: "Statistical analysis (no ML model training)"
    source: "ruptures (deepcharles/ruptures, 2000+ stars), statsmodels, scipy"
    hypothesis_fit: "PELT detects unknown-N change-points in 1D series. Piecewise linear regression provides independent validation via F-test. Both operate on N=111 observations — computationally trivial."
  baselines:
    - name: "Null model: smooth monotonic rho=−0.28 relationship (no change-point)"
      method: "OLS linear regression CoV ~ paper_count. This is the baseline H₀ that the change-point model must beat on BIC/AIC."
    - name: "S_index saturation metric (arXiv:2602.16763)"
      method: "evaleval/benchmark-saturation repo S_index computation. Comparison: does S_index threshold align with paper_count*? If so, cross-validates the finding."
    - name: "Time-based saturation year (Liao et al. 2022)"
      method: "For benchmarks with temporal data, compare paper_count* to year-of-saturation (year CoV first drops below median). Tests whether paper_count* and temporal saturation year are consistent measures."

