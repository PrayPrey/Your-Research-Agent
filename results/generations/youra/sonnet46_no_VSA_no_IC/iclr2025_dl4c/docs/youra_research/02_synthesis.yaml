hypothesis_draft:
  title: "Variance-Guided Offline Frozen-Model Profiling for Binary Execution Reward RLEF Data Selection"
  hypothesis_id: "H-VarianceGuidedRLEF-v1"
  core_claim: |
    Under short RLEF (20–50 GRPO steps, use_vllm=False, G=4), selecting top-50 MBPP training
    problems by frozen-model binary execution reward variance p_i*(1-p_i) (k=8 completions from
    frozen DeepSeek-Coder-7B-Instruct) achieves higher HumanEval+ pass@1 improvement per gradient
    step than random-50 subset RLEF, because variance profiling concentrates GRPO gradient steps
    on nonzero-signal problems while random selection includes ~69% zero-gradient groups.
  mechanism: |
    The GRPO group gradient magnitude is exactly σ = √(k(G-k))/G, which is zero when all G
    completions are correct (k=G) or all fail (k=0). Per-problem binary reward variance p*(1-p)
    is a monotone proxy for this: maximum at p=0.5 (k=G/2), zero at p=0 or p=1. Offline frozen-model
    profiling computes p_i = correct(k=8)/8 for each MBPP problem, approximating the true pass rate.
    Top-50 selection by p_i*(1-p_i) preferentially includes problems where k ∈ {1,2,3} of G=4
    GRPO completions succeed, ensuring nonzero gradient throughout the 50-step training budget.
    Random selection includes the full distribution of p_i values, expected to have ~69% zero-gradient
    groups (per Gradient Starvation paper empirical result at G=4), wasting ~69% of gradient steps.
  predictions:
    - P1: "Variance-50 achieves ≥ 2pp HumanEval+ pass@1 improvement and ≥ 1pp gap over random-50 at 50 GRPO steps"
    - P2: "Variance-50 exhibits lower mean TRL frac_reward_zero_std than random-50 at all training checkpoints"
    - P3: "Variance-50 achieves ≥ 80% of full-374 HumanEval+ improvement, conditional on both conditions achieving ≥ 2pp"

variables_summary:
  independent: "Data selection method: variance-50 (top-50 MBPP by p*(1-p)) vs random-50 (uniform random N=50) vs full-374 (all MBPP training problems)"
  dependent_primary: "HumanEval+ pass@1 improvement over no-RLEF baseline at 50 GRPO steps, measured by EvalPlus correctness scoring (absolute percentage points)"
  controlled: "DeepSeek-Coder-7B-Instruct base model; G=4, use_vllm=False, generation_batch_size=4, 50 steps; binary_execution_reward; EvalPlus evaluation"

null_hypothesis:
  h0_statement: |
    There is no significant difference in HumanEval+ pass@1 improvement between variance-selected
    and random-selected RLEF subsets of equal size (N=50) at 50 GRPO steps.
    H0: variance_50_improvement = random_50_improvement (±measurement noise)
  statistical_test: "Direct comparison of EvalPlus pass@1 improvement at step 50 for variance-50 vs random-50; secondary mechanistic test via TRL frac_reward_zero_std comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First offline frozen-model variance profiling approach for binary execution reward RLEF data selection in code generation — distinct from all existing online selection methods (VIGOR, Sun et al., Prompt Replay, LZE)"
  differentiation_summary: |
    All prior RLEF data selection work (VIGOR, Sun et al. 2025, Prompt Replay, LZE, LearnAlign) requires
    an active training loop to compute the selection signal — they are online methods. This research uses
    a single pre-training profiling pass on a frozen model (k=8 completions per MBPP problem, ~19 min at
    generation_batch_size=4) to estimate per-problem variance, then trains exclusively on the selected
    subset. The "profile once, train anywhere" pattern is new for RLEF and enables resumable, reproducible
    experiments that are not possible with online selection. Additionally, all prior selection papers target
    math reasoning with scalar rewards; this is the first application to binary execution reward code
    generation on MBPP/HumanEval+.

