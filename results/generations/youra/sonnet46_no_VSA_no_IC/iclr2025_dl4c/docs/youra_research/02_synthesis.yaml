    - "DeepSeek-Coder-7B-Instruct is a representative 7B code LLM widely used in the research community"
    - "Finding positive/negative under h-e1 constraints (use_vllm=False) applies to any environment with these constraints"

discussion_synthesis:
  key_insights:
    - "The offline vs online distinction is the core novelty — all prior selection work requires active training loops; frozen-model profiling enables pre-training data curation"
    - "The mathematical foundation (σ = √(k(G-k))/G) makes p*(1-p) variance an exact proxy for GRPO gradient magnitude — this is not a heuristic but a formal connection"
    - "Multi-checkpoint learning curve analysis (steps 10, 20, 50) enables secondary contribution: characterizing learning zone exhaustion dynamics for variance-selected vs random RLEF"
    - "The experiment produces publishable findings under any outcome — positive, partial, or null results all answer open questions"
  breakthrough_moments:
    - "Exchange 4 (Prof. Pax): Recognized that the primary claim should be 'filtering near-zero-variance problems' not 'variance predicts full training trajectory' — this scoping makes the hypothesis scientifically precise"
    - "Exchange 6 (Prof. Rex): Identified the HumanEval+ measurement noise issue (3.9pp SE) and proposed multi-checkpoint evaluation as mitigation — essential for P1 validity"
    - "Exchange 8 (Prof. Vera): Formalized the three-hypothesis structure (H1 effectiveness, H2 mechanism, H3 efficiency) — clarified that each is independently falsifiable"
  resolved_tensions:
    - "Tension: 'variance selection vs difficulty selection confound' — Resolved by: include p_i distribution reporting as part of the experiment; frac_reward_zero_std provides mechanism-level evidence independent of this confound"
    - "Tension: 'frozen model proxy degradation' — Resolved by: explicitly scope to SHORT RLEF (20–50 steps) as the regime where the proxy is most valid; treat degradation as a measurable phenomenon via frac_reward_zero_std curves"
    - "Tension: '80% efficiency claim unfalsifiability' — Resolved by: pre-specify minimum effect size ≥ 2pp; P3 declared untestable (not failed) if condition not met"
