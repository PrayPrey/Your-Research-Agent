measurement_plan:
  data_collection:
    - source: "TRL GRPO trainer training logs: frac_reward_zero_std per step for variance-50 and random-50"
    - source: "EvalPlus correctness evaluation on HumanEval+ at checkpoints step 10, 20, 50 for all 3 conditions"
    - source: "Profiling output: per-problem p_i and variance_i = p_i*(1-p_i) for all 374 MBPP problems"
    - source: "Profiling output: top-50 selected problem IDs by variance + random-50 selected IDs (fixed seed)"
  procedure:
    - step: "Run frozen-model profiling: k=8 completions per MBPP problem on DeepSeek-Coder-7B-Instruct (no gradient); compute p_i = correct(k)/k and variance_i = p_i*(1-p_i) for all 374 problems"
    - step: "Select top-50 by variance_i (variance-50 condition); sample random-50 with fixed seed; prepare full-374 dataset"
    - step: "Run variance-50 GRPO training for 50 steps; log frac_reward_zero_std per step; EvalPlus eval at steps 10, 20, 50"
    - step: "Run random-50 GRPO training for 50 steps; log frac_reward_zero_std per step; EvalPlus eval at steps 10, 20, 50"
    - step: "Run full-374 GRPO training for 50 steps; EvalPlus eval at steps 10, 20, 50 (frac_reward_zero_std optional)"
    - step: "Compute: pass@1 improvement = EvalPlus(step_50) - EvalPlus(step_0) for each condition; compare P1, P2, P3"
  success_criteria:
    - "P1: variance_50_improvement ≥ 2.0pp AND (variance_50_improvement - random_50_improvement) ≥ 1.0pp"
    - "P2: mean_frac_zero_std(variance-50) < mean_frac_zero_std(random-50) at steps 10, 20, and 50"
    - "P3: (variance_50_improvement / full_374_improvement) ≥ 0.80, conditional on both ≥ 2pp"

