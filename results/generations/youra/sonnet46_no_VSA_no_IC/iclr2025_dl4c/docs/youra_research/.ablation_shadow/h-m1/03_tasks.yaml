- complexity: 9
  description: 'Core mechanism:

    ranked_idx = np.argsort(variance_i)[::-1]          # descending

    variance_50_idx = ranked_idx[:50]

    rng = np.random.default_rng(42)

    random_50_idx = rng.choice(len(variance_i), 50, replace=False)

    variance_50_var = variance_i[variance_50_idx]

    random_50_var = variance_i[random_50_idx]

    mean_var_selected = float(np.mean(variance_50_var))

    mean_var_random = float(np.mean(random_50_var))

    gate_passed = mean_var_selected > mean_var_random

    boundary_gap = float(variance_i[ranked_idx[49]] - variance_i[ranked_idx[50]])

    stat, p_value = mannwhitneyu(variance_50_var, random_50_var, alternative=''greater'')

    Run mechanism asserts (see FR-7 in PRD).

    Log: [H-M1] Gate: mean_var_selected={:.4f} > mean_var_random={:.4f}: {gate_passed}

    Return dict with all metrics + variance_50_ids (list[int]) + random_50_ids (list[int])
    + seed=42

    '
