    icon: "🔬"
    verdict: "STRONG"
    assessment: |
      The three-hypothesis structure (H1 effectiveness, H2 mechanism, H3 efficiency) is precisely
      falsifiable. H1 has a clear pre-specified minimum effect size (≥ 2pp on HumanEval+, ≥ 1pp
