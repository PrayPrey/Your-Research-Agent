# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Offline frozen-model variance profiling for binary execution reward RLEF subset selection in code generation"
  key_innovation: "Separation of cheap profiling phase (frozen model, k=8 completions, ~19 min) from expensive training phase (GRPO), enabling 'profile once, train anywhere' data selection for RLEF — distinct from all prior online selection methods (VIGOR, Sun et al., Prompt Replay, LZE)"
  differentiation:
    - prior_work: "Sun et al. 2025 (arXiv:2506.05316)"
      difference: "Sun et al. use online difficulty estimation with attention mechanism during training; we use offline frozen-model variance profiling before training. Sun et al. target math reasoning with scalar rewards; we target code generation with binary execution rewards."

    - prior_work: "VIGOR (arXiv:2607.22002)"
      difference: "VIGOR uses online within-group variance estimation during training to allocate rollouts; we use offline frozen-model pass rate to estimate variance before training begins. VIGOR is online and iterative; our approach is a single pre-training profiling pass."

    - prior_work: "Prompt Replay (arXiv:2603.21177)"
      difference: "Prompt Replay uses the running pass rate during training (online) to prioritize pass rate ≈ 0.5 problems; we compute pass rates offline on a frozen model. Prompt Replay cannot be deployed without an active training loop."

    - prior_work: "LZE (arXiv:2605.17003)"
      difference: "LZE fuses pass-rate momentum + outcome-uncertainty online during training; our approach is purely offline. LZE targets math reasoning; we target binary execution reward code generation."

