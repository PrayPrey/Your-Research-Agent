version: "1.0"
generated_at: "2026-08-21"
hypothesis_id: "H-VarianceGuidedRLEF-v1"
paper_title: "When the Signal is Real but the Training is Not: Variance-Guided RLEF Data Selection and the Cold-Start Problem"

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  strategy: "puzzle_counterintuitive"
  opening_statement:
    content: "Selecting 7.8% of training data for GRPO code generation yields a 4.24x gradient signal advantage over random selection — but that advantage is entirely invisible during training when the model never generates a single correct solution."
    strategy: "puzzle_counterintuitive"
    rationale: "Opens with the positive result (robust selection signal), then immediately introduces the cold-start puzzle. This accurately represents both validated contributions and the negative training result without either over-claiming or appearing to have only failed."

  why_reader_should_care:
    main_reason: "RLEF data selection is an open problem: gradient starvation from zero-reward problems is known to waste up to 69% of compute in binary-reward GRPO. An offline profiling solution would let practitioners choose training data once, cheaply, before training begins."
    concrete_example: "A frozen 7B code model can profile 374 MBPP problems in 32 seconds with vLLM — identifying problems where it occasionally succeeds — while training the same model on randomly chosen data wastes 69%+ of gradient steps."
    stakes: "Without solving data selection for RLEF, short training budgets (20–50 steps) are dominated by zero-gradient noise rather than actual learning."

  anti_patterns_avoided:
    - "Deep learning has achieved remarkable success..."
    - "Data selection is an important problem..."
    - "With the advent of large language models..."

# ============================================================================
# PROBLEM FRAMING (THREE LEVELS)
# ============================================================================

problem_framing:
  surface_problem:
    description: "GRPO training on code generation suffers from gradient starvation: with binary execution rewards (pass/fail), 69.25% of training groups at G=4 produce zero gradient because the model either passes all completions or fails all of them."
    common_understanding: "Prior work (Gradient Starvation, arXiv:2605.07689) has characterized this: σ = sqrt(k(G-k))/G = 0 when k=0 or k=G."

  deeper_problem:
    description: "Even if we know which problems maximize gradient signal — those where the model occasionally succeeds (intermediate pass rate p_i ≈ 0.5) — all existing methods for identifying these problems require an active training loop. They are online: they compute difficulty signals during training, adapting as the model learns. This couples the data selection cost to the training cost."
    why_overlooked: "Online selection is the natural framing: as the model improves, what is 'learnable' changes. Offline profiling seems to conflict with this intuition."
    our_perspective: "For short RLEF regimes (20–50 steps), frozen-model performance should be a stable enough proxy. We can profile once with a frozen model, then train anywhere — decoupling a cheap profiling phase from the expensive training phase."

  gap_in_existing_work:
    description: "No prior work has (1) characterized per-problem binary execution reward variance across MBPP for a code LLM, (2) compared offline variance-guided selection to random selection for binary-reward RLEF, or (3) identified the cold-start precondition that must be met for any variance selection to operate."
    why_gap_exists: "Prior work focused on math reasoning with scalar rewards, or on online selection methods. The binary execution reward + code generation + offline profiling combination was unexplored."
    why_gap_matters: "Without understanding the cold-start precondition, practitioners deploying variance selection could silently fail: the data selection method appears to work analytically but produces no training benefit."

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Offline frozen-model variance profiling produces a statistically robust selection signal, but GRPO gradient concentration can only manifest this advantage when the model is already capable of generating some correct solutions — a cold-start precondition that must be verified before deployment."
    expanded_explanation: "The selection signal is real and measurable (4.24x mean variance advantage, p=2.22e-06). But in a cold-start regime where the model generates zero correct solutions across all training conditions, data selection method is irrelevant — both variance-selected and random conditions are identical (frac_reward_zero_std=1.0). The insight is not just about what the method does, but about identifying the regime boundary where it can operate."

  why_others_missed_it:
    common_assumptions: "Prior work assumed that if selection signal is analytically real, it will manifest in training. The profiling-training parameter alignment was not considered a critical precondition."
    our_different_view: "We found that profiling under one set of generation parameters (max_new_tokens=128, vLLM) and training under different parameters (max_completion_length=512, HF GRPOTrainer) can nullify the entire selection advantage — the 29 problems identified as 'learnable' may generate 0% correct under training conditions."
    enabling_factor: "Running the full experiment to failure — including 40,000+ generation attempts across 50–200 training steps — made the cold-start finding undeniable and precisely quantifiable."

  what_makes_it_work:
    intuitive_explanation: "You need the model to occasionally solve a problem during training for selection to matter. If it never gets any right, it doesn't matter which problems you selected."
    key_mechanism: "The binary reward variance identity sigma = sqrt(k(G-k))/G equals zero whenever k=0 or k=G. Cold-start means k=0 for every problem in every group — no selection method can help."

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Offline frozen-model variance profiling reliably identifies a statistically distinct MBPP subset (4.24x mean variance advantage, p=2.22e-06), but this advantage is invisible during GRPO training in a cold-start regime — a finding that precisely identifies the necessary precondition for variance selection to operate."
    measurable_criteria:
      - "h-e1: 29/374 MBPP problems have variance_i > 0.1 (gate: 15 threshold, PASSED)"
      - "h-m1: mean_var_selected=0.1113 vs mean_var_random=0.0262; MWU p=2.22e-06 (PASSED)"
      - "h-m2: frac_reward_zero_std=1.0 for BOTH conditions, 50 steps (cold-start confirmed)"
      - "h-m3: frac_reward_zero_std=1.0 for BOTH conditions, 200 steps, doubled LR (cold-start is not a duration issue)"

  supporting_evidence:
    - id: "evidence_1"
      what: "h-e1: MBPP variance distribution — 91.7% all-fail, 7.8% at p_i=0.25, vLLM profiling completes in ~32 seconds"
      so_what: "Establishes the distribution shape as a novel empirical finding, confirms variance-guided selection has a real (if narrow) substrate to work with, and demonstrates practical profiling speed."
      how_it_supports_claim: "Proves existence of the selection signal substrate; quantifies the regime constraint (only 29 usable problems, not the 50+ assumed)"

    - id: "evidence_2"
      what: "h-m1: 4.24x mean variance advantage (0.1113 vs 0.0262), MWU U=1807, p=2.22e-06, stochastic dominance on CDF"
      so_what: "The selection signal is not marginal — 4.24x advantage with near-zero p-value. Even with boundary ties (21 zero-variance problems in the top-50), the full distribution stochastically dominates random-50."
      how_it_supports_claim: "Proves the method works as an analytical selection tool; the gap is real and statistically robust"

    - id: "evidence_3"
      what: "h-m2 + h-m3: 40,000+ generation attempts across 50–200 GRPO steps, reward=0 for all conditions"
      so_what: "Quantifies the scale of cold-start failure — not a small-sample fluke. The selection method and random baseline are completely indistinguishable in this regime."
      how_it_supports_claim: "Proves cold-start is a precondition; provides the negative result that motivates the parameter-alignment fix"

    - id: "evidence_4"
      what: "vLLM batch profiling: ~32 seconds for 374 problems x 4 completions = 1496 completions total"
      so_what: "Establishes practical viability — the profiling overhead is negligible compared to even a short GRPO run. The bottleneck is not profiling but GRPO warm-start."
      how_it_supports_claim: "Supports the 'profile once, train anywhere' efficiency claim"

  surprising_findings:
    - finding: "The 29 'high-variance' problems identified by offline profiling all appear at exactly variance=0.1875 (p_i=0.25) — a consequence of k=4 granularity forcing all intermediate-success problems into a single discrete bin"
      why_surprising: "Expected a gradient of variance values; instead, the distribution is bimodal (0 or 0.1875) with no intermediate levels"
      our_interpretation: "k=4 is too coarse for fine-grained difficulty stratification; k=8 with max_new_tokens=512 would reveal richer intermediate pass-rate structure"

    - finding: "The cold-start persisted even after doubling the learning rate (1e-6) and extending training to 200 steps (h-m3)"
      why_surprising: "Expected some warm-up effect with longer training or higher LR; the failure mode proved to be regime-level, not duration-level"
      our_interpretation: "Cold-start under parameter mismatch is not recoverable within the current parameter space; requires aligned profiling or a warm-started model"

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "We establish offline variance profiling as a viable and fast data selection signal for RLEF, while precisely identifying the cold-start precondition that determines whether any selection method can operate."
    why_significant: "Previous online selection methods (VIGOR, Prompt Replay, LZE) avoid the cold-start problem by computing difficulty during training. Our work shows that offline methods — which are cheaper and more flexible — face a concrete, diagnosable failure mode that practitioners must verify before deployment."

  implications:
    for_field: "Adds cold-start verification as a necessary step in the RLEF data selection evaluation protocol. Any paper claiming data selection advantages for RLEF should report frac_reward_zero_std baseline to confirm the training regime is not in cold-start."
    for_practice: "Practitioners using short RLEF (< 200 steps) should verify model pass@k > 0 on target problems under training-identical generation parameters before investing in data selection methods."

  future_possibilities:
    immediate_extensions: "Re-profile MBPP with training-identical parameters (max_new_tokens=512, subprocess exec, identical prompt format); use warm-started model (Qwen2.5-7B-Instruct with >30% MBPP pass@1); test online variance selection as comparison"
    longer_term_vision: "Profile-once offline variance selection as a compute-efficient alternative to online methods for practitioners with limited training budgets; cross-architecture generalization to Code-LLaMA-7B"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: selection signal is real, training advantage requires cold-start resolution, cold-start is precisely diagnosed"
    key_message: "Offline variance profiling works analytically (4.24x advantage) but requires training-regime alignment to manifest in gradient concentration"

  introduction:
    narrative_purpose: "Hook (puzzle) → Surface problem (gradient starvation) → Deeper problem (online-only selection) → Gap (no offline comparison, no cold-start characterization) → Key insight preview → Contributions"
    hook_strategy: "puzzle_counterintuitive"
    transition_to_related: "Our approach builds on the gradient starvation characterization and extends prior online selection work to an offline setting — related work positions us against online methods and contextualizes the cold-start finding"

  related_work:
    narrative_purpose: "Show existing work insufficient for offline profiling + binary rewards + cold-start analysis"
    positioning_strategy: "All prior RLEF data selection is online (requires active training loop). We occupy the offline niche. Cold-start has not been systematically studied as a precondition."
    key_comparison_points:
      - "Gradient Starvation (arXiv:2605.07689): characterizes the problem we address"
      - "VIGOR (arXiv:2607.22002): online variance-utility selection — builds on same mechanism but requires training loop"
      - "Prompt Replay (arXiv:2603.21177): online pass-rate targeting — nearest competitor in spirit"
      - "Sun et al. 2025 (arXiv:2506.05316): difficulty-targeted selection for math (online); different reward type"
      - "LZE (arXiv:2605.17003): outcome-uncertainty online selection"
      - "RLEF / Gehring et al. (arXiv:2410.02089): foundational binary execution reward RLEF"

  methodology:
    narrative_purpose: "Show WHY offline profiling was the design choice, how it works, what parameters matter"
    connection_to_insight: "Motivated by the 69.25% zero-gradient waste at G=4: if we can identify the 7–13% of learnable problems before training, we can concentrate gradient steps on them without paying the online selection cost"
    key_design_decisions:
      - "Frozen model profiling: decouples expensive inference from training — run once with vLLM, reuse indefinitely"
      - "Binary execution reward variance: p_i*(1-p_i) directly governs GRPO gradient magnitude via sigma identity"
      - "Top-k selection: simple, interpretable, no tuning required"
      - "Parameter choices (k=4, max_new_tokens=128): motivated, limitations acknowledged"

  experiments:
    narrative_purpose: "Design experiments that test the causal chain: existence → selection signal → gradient concentration → performance"
    experimental_questions:
      - "RQ1: Does MBPP exhibit a non-degenerate binary reward variance distribution for DeepSeek-Coder-7B? (h-e1)"
      - "RQ2: Does variance-guided top-50 selection achieve statistically higher mean variance than random-50? (h-m1)"
      - "RQ3: Does variance selection reduce frac_reward_zero_std during GRPO training? (h-m2, h-m3)"

  results:
    narrative_purpose: "Present evidence in causal chain order: distribution → selection signal → training failure → cold-start diagnosis"
    main_result_highlight: "4.24x mean variance advantage (confirmed) + complete cold-start collapse (40,000+ attempts, zero reward)"

  discussion:
    narrative_purpose: "Interpret the compound result: the method works analytically, fails empirically, for a diagnosable reason"
    honest_limitations:
      - "Cold-start prevents empirical gradient-concentration test"
      - "Profiling parameters (k=4, 128 tokens) differ from training (512 tokens) — most likely root cause"
      - "Variance distribution severely degenerate under constrained generation: only 29/374 usable problems"
      - "Single-run experiments (cold-start finding is deterministic, so replication not required for negative result)"

  conclusion:
    narrative_purpose: "Return to the opening puzzle: the signal was real, but invisible — and now we know exactly why and how to make it visible"
    callback_to_hook: "We began by observing that a 4.24x selection advantage was invisible during training. Our experiments show this invisibility has a specific, diagnosable cause — and a clear path to resolving it."

