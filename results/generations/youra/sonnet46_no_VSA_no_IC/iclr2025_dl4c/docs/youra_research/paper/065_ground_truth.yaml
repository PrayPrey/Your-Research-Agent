    model: "deepseek-ai/deepseek-coder-7b-instruct-v1.5"

# ============================================================================
# METHODOLOGY GROUND TRUTH
# ============================================================================

methodology:
  profiling:
    model: "deepseek-ai/deepseek-coder-7b-instruct-v1.5"
    k: 4  # actual (design was k=8)
    max_new_tokens: 128  # actual (design was 512)
    temperature: 1.0
    top_p: 0.95
    inference_engine: "vLLM"
    gpu_memory_utilization: 0.75
    variance_threshold: 0.1
    min_count_gate: 15

  selection:
    k_select: 50
    seed: 42
    method: "argsort descending by variance_i"
    high_variance_problems: 29  # actual distinct high-variance problems
    zero_variance_filler: 21   # to reach top-50

  training:
    framework: "TRL 1.9.2 GRPOTrainer"
    num_generations: 4
    per_device_train_batch_size: 1
    generation_batch_size: 4
    max_completion_length: 512
    beta: 0.0
    use_vllm: false
    processing_class: "AutoTokenizer"
    dataset_subset: "full"  # NOT "sanitized"
    reward_function: "binary execution reward via subprocess, 5s timeout"

  parameter_mismatch:
    profiling_max_new_tokens: 128
    training_max_completion_length: 512
    mismatch_present: true
    mismatch_hypothesized_as_root_cause: true

# ============================================================================
# RESULTS GROUND TRUTH
# ============================================================================

results:
  h_e1:
    claimed: "29 problems with variance_i > 0.1, gate PASSED (threshold 15)"
