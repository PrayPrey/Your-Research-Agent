    match: true

  h_m2:
    claimed: "frac_reward_zero_std=1.0 for BOTH conditions, gap=0.0, cold-start"
    actual: "frac_reward_zero_std=1.0 at ALL steps for both conditions"
    match: true

  h_m3:
    claimed: "cold-start persists at 200 steps, doubled LR"
    actual: "frac_reward_zero_std=1.0 throughout 200 steps"
    match: true

# ============================================================================
# CLAIMS IN PAPER — VERIFIED
# ============================================================================

claims:
  - claim: "7.8% of MBPP problems exhibit nonzero variance under constrained generation"
    location: "Abstract, Section 5.1"
    supporting_evidence: "h-e1: 29/374 = 7.78%"
    verified: true

  - claim: "top-50 variance-guided selection achieves 4.24x higher mean variance than random-50 (Mann-Whitney p=2.22e-06)"
    location: "Abstract, Section 5.2"
    supporting_evidence: "h-m1: mean_var_selected=0.1113, mean_var_random=0.0262, ratio=4.24, MWU p=2.22e-06"
    verified: true

  - claim: "profiling completes in ~32 seconds via vLLM"
    location: "Abstract, Section 3.2, Section 7"
    supporting_evidence: "h-e1 runtime log: vLLM batch ~32s for 374x4=1496 completions"
    verified: true

  - claim: "40,000+ generation attempts across 50-200 training steps produce zero reward"
    location: "Abstract, Section 5.3"
    supporting_evidence: "h-m2: 10,000 attempts (50 steps x 50 problems x 4); h-m3: 40,000 attempts (200 steps x 50 problems x 4); combined >40,000"
    verified: true
    note: "Exact combined count: 50,000 (10,000 h-m2 + 40,000 h-m3); paper says '>40,000' which is correct"

  - claim: "91.7% of MBPP problems yield p_i=0 (all-fail)"
    location: "Section 5.1, Table 1"
    supporting_evidence: "h-e1: 343/374 = 91.71%"
    verified: true

  - claim: "variance-50 CDF stochastically dominates random-50"
    location: "Section 5.2"
    supporting_evidence: "h-m1: fig4_cdf.png; CDF lies entirely above random-50"
    verified: true

  - claim: "cold-start persists even with doubled LR and 200 training steps"
    location: "Section 5.3"
    supporting_evidence: "h-m3: LR=1e-6 (doubled from 5e-7), 200 steps, frac=1.0 throughout"
    verified: true

