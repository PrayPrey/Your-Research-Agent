    type: "Autoregressive LM (GPT-NeoX architecture)"
    source: "EleutherAI/pythia-* on HuggingFace"
    hypothesis_fit: "16 model sizes (70M-12B), 154 checkpoints each, identical architecture and data — the cleanest existing controlled infrastructure for within-family analysis"
  baselines:
