      method: "Panel regression with only log(model_params) as predictor; no domain variables"
    - name: "Random domain baseline"
      method: "Permutation test: randomly shuffle domain labels across checkpoints, refit regression 1000 times to establish null distribution of R² gain from domain variables"
    - name: "Uniform domain hypothesis"
      method: "Constrain all β_d to be equal across benchmarks; compare AIC vs benchmark-specific model"

