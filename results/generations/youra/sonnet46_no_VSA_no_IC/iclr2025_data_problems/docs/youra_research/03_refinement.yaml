# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "DCLM shows model-based filtering outperforms heuristic filtering (64% vs ~57% MMLU at 7B)"
      status: "BUILD_ON"
      evidence: "Li et al., 2024 (DCLM, 2406.11794), 398 citations"
    - claim: "Pythia provides 154 checkpoints per model (70M-12B) with exact dataloaders"
      status: "BUILD_ON"
      evidence: "Biderman et al., 2023 (Pythia, 2304.01373), 2071 citations"
    - claim: "The Pile has 22 known domains with published proportions (WebText2 22%, Books 9%, Wiki 1.5%, etc.)"
      status: "BUILD_ON"
      evidence: "Gao et al., 2020 (The Pile, 2101.00027), 2969 citations"
    - claim: "CoLoR-Filter achieves 11-25x data efficiency via task-conditioned filtering"
      status: "BUILD_ON"
      evidence: "Brandfonbrener et al., 2024 (CoLoR-Filter, 2406.10670), 19 citations"
    - claim: "No prior study has produced a per-filter × per-benchmark correlation matrix for existing checkpoints"
      status: "PROVE_NEW"
      evidence: "Gap established by Phase 1 literature review; absent from DCLM, Pythia, and RegMix papers"
    - claim: "Domain composition has domain-benchmark specific effects (Wikipedia → MMLU, Books → HellaSwag)"
      status: "PROVE_NEW"
      evidence: "Hypothesized from CoLoR-Filter task-specificity principle; not empirically demonstrated at pre-training scale"
  scope_reduction_percentage: 33
  phase2b_4_instructions: |
    Section 0 claims marked BUILD_ON are established and should not be re-verified.
    Focus Phase 2B verification on PROVE_NEW claims: (1) domain-benchmark specificity
    quantifiable via panel regression, (2) Wikipedia exposure predicts MMLU more than
    HellaSwag, (3) Books exposure predicts HellaSwag/WinoGrande more than MMLU.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DomainExposureBenchmarkSpecificity-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the Pythia model family trained on The Pile (a fixed heterogeneous corpus
    with known domain proportions), if cumulative domain exposure trajectories are
    computed from exact dataloaders at 154 training checkpoints across 16 model sizes
    (70M-12B), then domain-specific coefficients in a panel regression (with model-size
    fixed effects) will reveal benchmark-specific effects: Wikipedia exposure positively
    predicts MMLU more than HellaSwag; Books exposure positively predicts HellaSwag and
    WinoGrande more than MMLU, because different domains contain different distributions
    of cognitive task patterns that selectively strengthen the capabilities tested by
    each benchmark.
  alternative_hypothesis_h0: |
    There is no significant difference in domain regression coefficients across benchmarks
    (β_d is identical for all domains d across MMLU, HellaSwag, ARC, WinoGrande after
    controlling for model scale via fixed effects).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Cumulative domain exposure fraction"
      type: "continuous"
      operationalization: "For each domain d and checkpoint t: tokens_from_domain_d_seen_by_step_t / total_tokens_seen_by_step_t; computed from Pythia exact dataloaders"
      levels: []
    - name: "Model scale (log parameters)"
      type: "continuous"
      operationalization: "log10 of model parameter count; used as fixed effect covariate (70M, 160M, 410M, 1B, 1.4B, 2.8B, 6.9B, 12B)"
      levels: []
  dependent:
    - name: "MMLU score"
      type: "continuous"
      operationalization: "5-shot accuracy on MMLU test set via lm-evaluation-harness v0.4; range 0-1; contamination-adjusted"
      primary: true
    - name: "HellaSwag score"
      type: "continuous"
      operationalization: "10-shot accuracy on HellaSwag via lm-evaluation-harness v0.4; range 0-1"
      primary: false
    - name: "ARC-Challenge score"
      type: "continuous"
      operationalization: "25-shot accuracy on ARC-Challenge via lm-evaluation-harness v0.4; range 0-1"
      primary: false
    - name: "WinoGrande score"
      type: "continuous"
      operationalization: "5-shot accuracy on WinoGrande via lm-evaluation-harness v0.4; range 0-1"
      primary: false
  controlled:
    - name: "Model architecture"
      operationalization: "Fixed: all Pythia models use identical GPT-NeoX architecture; no cross-family models included"
    - name: "Training tokens seen"
      operationalization: "Monotonically increasing with checkpoint step; captured implicitly by checkpoint index"
    - name: "Data contamination"
      operationalization: "Pre-corrected: run 13-gram decontamination (lm-evaluation-harness built-in) on The Pile vs all 4 benchmark test sets; adjust scores before regression"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Different domains in The Pile contain systematically different distributions of cognitive task patterns: Wikipedia concentrates factual associations and entity relationships; Books concentrate narrative coherence and causal inference; GitHub concentrates formal reasoning and structured problem-solving"
      evidence: "Domain content analysis consistent with Gao et al. (The Pile, 2020) domain descriptions; CoLoR-Filter [Brandfonbrener et al., 2024] shows task-conditioned filtering selects different data subsets for different benchmarks, implying task-relevant patterns are domain-localized"
      falsifier: "If domain content analysis shows uniform distribution of task patterns across domains, step 1 fails"
    - step: 2
      description: "As cumulative exposure to each domain increases during training, the model's internal representations become increasingly aligned with the cognitive patterns concentrated in that domain, proportionally strengthening the capabilities those patterns support"
      evidence: "Training dynamics literature shows gradient updates reflect data statistics; CoLoR-Filter's 11-25x efficiency gain implies concentrated task-relevant exposure accelerates learning; Pythia checkpoint trajectory shows steady benchmark improvement correlated with training progress"
      falsifier: "If early high-Wikipedia-exposure checkpoints do not show differential MMLU vs HellaSwag improvement compared to later low-Wikipedia checkpoints, step 2 fails"
    - step: 3
      description: "Benchmark performance reflects the cumulative weighted sum of domain exposures, with benchmark-specific weights (β coefficients) that reflect the alignment between each domain's cognitive pattern distribution and each benchmark's task demands"
      evidence: "Linear approximation is standard in data mixing literature (RegMix [ICLR 2025], Data Mixing Laws); panel regression framework captures this quantitatively"
      falsifier: "If non-linear interaction terms significantly outperform linear domain coefficients, the linear mechanism step fails (though domain-specificity claim would survive)"
  key_tension: "Whether The Pile's data ordering is uniformly shuffled (eliminating within-family domain variation and collapsing the panel regression to a degenerate case)"
  evidence_summary: |
    The causal chain is grounded in (1) known domain content differences in The Pile,
    (2) CoLoR-Filter's empirical demonstration that task-relevant signal is domain-localized,
    and (3) the linear mixing law framework validated by RegMix and DoReMi. The primary
    uncertainty is whether within-family domain exposure variation is measurable from
    Pythia's data ordering.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pythia's data ordering is non-uniform (i.e., different domains appear with different densities at different points in training), providing within-family domain exposure variation across the 154 checkpoints"
    supporting_evidence: "Large-scale datasets are often interleaved in domain-proportional blocks; Pythia paper does not explicitly confirm uniform shuffling"
    consequence_if_violated: "Panel regression within Pythia collapses (zero domain variation); fallback to cross-family design required"
  - id: "A2"
    assumption: "Domain exposure effects are approximately linear and additive (no strong domain-domain interaction effects)"
    supporting_evidence: "RegMix and DoReMi both show linear mixing law fits are predictive at proxy-model scale"
    consequence_if_violated: "Linear regression underfits; need interaction terms or non-linear model; core directional claim still testable with ANOVA"
  - id: "A3"
    assumption: "Contamination between The Pile and benchmark test sets does not systematically correlate with domain exposure trajectories (contamination is domain-independent)"
    supporting_evidence: "Contamination is known to be concentrated in web-crawled data; Wikipedia and Books may have lower contamination rates than WebText2"
    consequence_if_violated: "Contamination-adjusted scores differ substantially from raw scores; the adjustment is already planned as a mandatory pre-step"
  - id: "A4"
    assumption: "Model-size fixed effects adequately control for scale-related confounds, leaving domain exposure as the primary remaining explanatory variable"
    supporting_evidence: "Standard econometric approach for panel data; scaling laws literature shows clean log-linear scale effects"
    consequence_if_violated: "Residual scale confound biases domain coefficients; mitigation: report within-scale regressions separately for 70M-400M and 1B-12B groups"
  - id: "A5"
    assumption: "The 4 target benchmarks (MMLU, HellaSwag, ARC-Challenge, WinoGrande) are sufficiently distinct in their cognitive demands to produce different domain coefficient profiles"
    supporting_evidence: "These 4 benchmarks are standard in the field precisely because they probe different capabilities (knowledge, commonsense, reasoning, linguistic)"
    consequence_if_violated: "If all 4 benchmarks show identical domain profiles, the specificity claim fails — but this would itself be a publishable null finding"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Pre-training of autoregressive language models on heterogeneous multi-domain corpora
    - Model families with exact dataloader documentation (Pythia primary; OLMo/Falcon as secondary)
    - Standard NLP benchmarks with existing contamination detection tooling (MMLU, HellaSwag, ARC, WinoGrande)
    - Model scales 70M-12B (Pythia's range)
  does_not_apply_to: |
    - Fine-tuning stages (RLHF, SFT, instruction tuning)
    - Single-domain corpora (no domain variation to measure)
    - Proprietary model families without public dataloaders
    - Benchmarks without established test-set contamination detection (would require new tooling)
    - Models trained with dynamic data mixing (domain proportions change during training by design)
  known_limitations: |
    - Observational design: cannot establish causal intervention effects (only correlational)
    - Within-Pythia domain variation depends on data ordering (A1 assumption)
    - 22 domain predictors with correlated domain exposure trajectories → multicollinearity risk
    - Regression to 2,464 observations may have non-independent errors (temporal autocorrelation within model size)
    - Findings generalize to Pile-era models; newer corpora (FineWeb2, DCLM-Baseline) may have different domain structures

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "β_Wikipedia > β_Books for MMLU in the panel regression (Wikipedia exposure has larger positive coefficient for MMLU than Books exposure)"
    test_method: "Panel OLS regression: MMLU_score ~ model_size_FE + Σ_d β_d × exposure_d(t); compare β_Wikipedia vs β_Books with t-test"
    success_criterion: "β_Wikipedia > β_Books with p < 0.05 (one-tailed)"
    falsification: "β_Wikipedia ≤ β_Books for MMLU (Books exposure as predictive or more predictive for knowledge benchmark)"
  - id: "P2"
    primary: false
    statement: "β_Books > β_Wikipedia for HellaSwag in the panel regression (Books exposure has larger positive coefficient for HellaSwag than Wikipedia)"
    test_method: "Same panel regression as P1; compare β_Books vs β_Wikipedia for HellaSwag DV"
    success_criterion: "β_Books > β_Wikipedia for HellaSwag with p < 0.05 (one-tailed)"
    falsification: "β_Wikipedia ≥ β_Books for HellaSwag"
  - id: "P3"
    primary: false
    statement: "Domain coefficient profiles differ significantly across at least 2 of 4 benchmarks (MMLU, HellaSwag, ARC, WinoGrande)"
    test_method: "Likelihood ratio test comparing model with benchmark-specific domain coefficients vs shared coefficients; FDR correction across pairwise benchmark comparisons"
    success_criterion: "At least 2 benchmark pairs show significantly different domain coefficient vectors (q < 0.05 after FDR correction)"
    falsification: "No two benchmarks show significantly different domain profiles (all β vectors are indistinguishable)"
  - id: "P4"
    primary: false
    statement: "Domain-benchmark specificity pattern is consistent across model scales (domain coefficient rankings are stable from 70M to 12B)"
    test_method: "Fit separate regressions for small (70M-400M) and large (1B-12B) model groups; compare coefficient orderings via Spearman rank correlation"
    success_criterion: "Spearman correlation of domain coefficient rankings between small and large model groups > 0.7 for both MMLU and HellaSwag"
    falsification: "Coefficient rankings are uncorrelated or reversed across scale groups"

