measurement_plan:
  data_collection:
    - source: "Pythia exact dataloaders: compute cumulative domain fractions at each of 154 checkpoints × 16 model sizes from The Pile's domain metadata"
    - source: "lm-evaluation-harness v0.4: standardized benchmark evaluation at key checkpoints (step 1k, 5k, 10k, 50k, 100k, 143k minimum; full 154 for 2-3 model sizes)"
    - source: "13-gram decontamination: lm-evaluation-harness built-in decontam against MMLU/HellaSwag/ARC/WinoGrande test sets on The Pile"
  procedure:
    - step: "1. Verify The Pile data ordering (uniform shuffle vs domain-blocked) via Pythia dataloader documentation"
    - step: "2. If non-uniform: compute cumulative domain exposure matrix (154 × 22) per model size from dataloaders"
    - step: "3. Run 13-gram contamination audit on The Pile vs 4 benchmark test sets; record contamination rates"
    - step: "4. Run lm-evaluation-harness on Pythia checkpoints (standardized 5-shot MMLU, 10-shot HellaSwag, 25-shot ARC, 5-shot WinoGrande)"
    - step: "5. Adjust benchmark scores by contamination rates (subtract contaminated-example performance delta)"
    - step: "6. Fit panel OLS: benchmark_score ~ model_size_FE + Σ_d β_d × exposure_d(t)"
    - step: "7. Report β vectors per benchmark; test P1-P4 predictions"
    - step: "8. Robustness: within-scale subgroup regressions, permutation tests, multicollinearity diagnostics"
  success_criteria:
    - "P1 confirmed: β_Wikipedia > β_Books for MMLU (p < 0.05)"
    - "P2 confirmed: β_Books > β_Wikipedia for HellaSwag (p < 0.05)"
    - "P3 confirmed: at least 2/4 benchmarks have significantly different domain profiles (FDR q < 0.05)"
    - "Contamination audit completed and scores adjusted before regression"

validation:
  internal_validity:
    - "Model-size fixed effects control for scale confound"
    - "Contamination pre-adjustment removes test-set overlap bias"
    - "Permutation null establishes empirical null distribution for R² gain"
    - "Multicollinearity diagnostics (VIF) for 22-domain feature set; PCA fallback if VIF > 10"
    - "Temporal autocorrelation correction: cluster standard errors by model size"
  external_validity:
    - "Within-Pythia findings may not generalize to other corpora (The Pile's 22-domain structure is specific)"
    - "Contingency design: if uniform shuffle found, cross-family analysis with n=15+ model families provides broader validity"
    - "Scale range 70M-12B may not extrapolate to GPT-4 scale (100B+)"

discussion_synthesis:
  key_insights:
    - "Pythia's exact dataloaders are an underutilized resource for within-family domain attribution — the ordering information enables domain exposure trajectory computation that no prior study has exploited"
    - "CoLoR-Filter's task-conditioned efficiency gain (11-25x) implies domain-localized task-relevant signal, providing a theoretical bridge from task-specific filtering to domain-benchmark specificity"
    - "The panel dataset (2,464 observations) is substantially larger than typical data mixing studies, providing statistical power for domain-specific coefficient estimation"
    - "Contamination audit is not optional — PaCoST finding ('almost all models suspected contaminated') means uncorrected scores would produce biased domain coefficients"
  breakthrough_moments:
    - "Exchange 4 (Prof. Pax): Identified that DataModels/influence functions are infeasible at Pythia scale, focusing the hypothesis on feasible regression approach"
    - "Exchange 6 (Prof. Rex): Identified that within-Pythia domain composition is fixed (no variation within family), forcing the pivot to data ordering as source of variation"
    - "Exchange 7 (Dr. Nova): Reframed data ordering as temporal domain exposure trajectories — the key innovation that makes within-family analysis feasible"
  resolved_tensions:
    - "DataModels vs regression: DataModels infeasible at scale; panel regression on dataloader-derived domain exposure is the feasible alternative"
    - "Cross-family vs within-family: cross-family has corpus-size confound; within-family via dataloader ordering eliminates this — primary design"
    - "Per-filter vs per-domain: per-filter ablation requires new training runs; per-domain analysis uses existing checkpoints — feasibility constraint drove domain framing"
