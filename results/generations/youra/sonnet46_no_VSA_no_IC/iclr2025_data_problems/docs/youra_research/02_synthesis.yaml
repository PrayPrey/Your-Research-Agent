hypothesis_draft:
  title: "Domain Exposure-Benchmark Specificity in Pre-trained LLMs"
  hypothesis_id: "H-DomainExposureBenchmarkSpecificity-v1"
  core_claim: |
    Within the Pythia model family trained on The Pile, cumulative domain exposure
    trajectories (computed from exact dataloaders at 154 checkpoints × 16 model sizes)
    are significant predictors of individual benchmark performance, with domain-specific
    effects: Wikipedia exposure correlates more strongly with MMLU than HellaSwag;
    Books exposure correlates more strongly with HellaSwag/WinoGrande than MMLU.
    These effects are quantifiable via panel regression with model-size fixed effects.
  mechanism: |
    Different domains in The Pile contain systematically different distributions of
    cognitive task patterns. Wikipedia concentrates factual associations and entity
    relationships (→ knowledge benchmarks). Books concentrate narrative coherence and
    causal inference (→ commonsense benchmarks). GitHub concentrates formal reasoning
    (→ systematic reasoning benchmarks). As cumulative domain exposure accumulates
    during training, the model's representations selectively strengthen the capabilities
    aligned with each domain's cognitive pattern distribution. Benchmark scores reflect
    the weighted sum of domain exposures with benchmark-specific weights (β coefficients).
  predictions:
    - P1: "β_Wikipedia > β_Books for MMLU (p < 0.05, one-tailed panel regression)"
    - P2: "β_Books > β_Wikipedia for HellaSwag (p < 0.05, one-tailed panel regression)"
    - P3: "Domain profiles differ across at least 2 of 4 benchmarks (FDR-corrected q < 0.05)"
    - P4: "Domain coefficient rankings are consistent across small (70M-400M) and large (1B-12B) models (Spearman > 0.7)"

variables_summary:
  independent: "Cumulative domain exposure fraction per domain per checkpoint (22 The Pile domains × 154 checkpoints × 16 model sizes = 2,464 panel observations)"
  dependent_primary: "MMLU 5-shot accuracy via lm-evaluation-harness v0.4 (contamination-adjusted)"
  controlled: "Model architecture (fixed: GPT-NeoX), contamination (pre-adjusted via 13-gram decontam), training tokens (absorbed by checkpoint index)"

null_hypothesis:
  h0_statement: |
    Domain composition coefficients are identical across all 4 benchmarks after
    controlling for model scale: β_d is the same for MMLU, HellaSwag, ARC-Challenge,
    and WinoGrande for all 22 domains d.
  statistical_test: "Likelihood ratio test: benchmark-specific β model vs shared-β constrained model"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First use of Pythia's exact dataloader ordering to construct within-family domain exposure panel data for benchmark-specific correlation analysis — eliminates cross-family confounds that plague prior mixing studies"
  differentiation_summary: |
    DCLM provides holistic 53-task filter benchmarks but no per-domain × per-benchmark breakdown.
    Pythia paper uses checkpoints for memorization/scaling analysis but not domain trajectory analysis.
    RegMix/DoReMi optimize aggregate validation loss, not individual benchmark profiles.
    This study uniquely exploits the dataloader ordering as a source of within-family domain variation,
    producing the first domain-benchmark coefficient matrix for Pythia-scale pre-training.

