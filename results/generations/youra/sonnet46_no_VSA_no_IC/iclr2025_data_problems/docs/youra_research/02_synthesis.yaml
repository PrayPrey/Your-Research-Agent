  datasets:
    - "The Pile (EleutherAI/the_pile on HuggingFace) — training corpus with domain metadata"
    - "MMLU test set (hendrycks/mmlu) — knowledge benchmark"
    - "HellaSwag test set (Rowan/hellaswag) — commonsense benchmark"
    - "ARC-Challenge test set (allenai/ai2_arc) — reasoning benchmark"
    - "WinoGrande test set (allenai/winogrande) — linguistic commonsense benchmark"
  baselines:
