# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TruthfulnessDimensions-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under evaluation of N≥30 diverse LLMs (varied architecture, scale, training) on
    truthfulness benchmarks, if TruthfulQA, HaluEval, and FactScore measure partially
    independent reliability dimensions, then inter-benchmark correlations will be moderate
    (r between unrelated-benchmark baseline and 0.7) while intra-benchmark correlations
    remain high (r > 0.7), and factor analysis will reveal 2-3 components rather than a
    single factor, because these benchmarks target distinct failure modes: misconception
    resistance, generation coherence, and factual precision respectively.
  alternative_hypothesis_h0: |
    There is no significant difference in correlation structure — all truthfulness
    benchmarks measure the same underlying construct, with inter-benchmark r > 0.7
    and single-factor solution explaining >80% variance.

