# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "TruthfulQA tests resistance to popular misconceptions that appear in training data"
      evidence: "TruthfulQA paper: designed to elicit imitative falsehoods"
      falsifier: "If TruthfulQA scores correlate perfectly with general knowledge (MMLU), no unique construct"
    - step: 2
      description: "HaluEval tests generation coherence and consistency maintenance during text production"
      evidence: "HaluEval paper: targets hallucinated details in QA/dialogue/summarization"
      falsifier: "If HaluEval correlates perfectly with TruthfulQA, same underlying process"
    - step: 3
      description: "FactScore tests atomic factual precision via retrieval-based verification"
      evidence: "FactScore paper: decomposes claims and verifies against Wikipedia"
      falsifier: "If FactScore correlates perfectly with other benchmarks, no unique contribution"
    - step: 4
      description: "Different benchmarks tap different model capabilities, leading to partial independence"
      evidence: "Inferred from distinct methodologies; no prior empirical test"
      falsifier: "If factor analysis shows single factor with >80% variance, capabilities are unified"
  key_tension: "Whether observed benchmark differences reflect true capability dimensions or measurement noise"
  evidence_summary: |
    Prior work establishes benchmark heterogeneity exists (BenchBench, Ailem et al.) but
    hasn't quantified truthfulness-specific correlation structure. The mechanism predicts
    partial independence based on different evaluation paradigms.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Benchmark scores are reliable measurements with low noise"
    supporting_evidence: "All benchmarks have published reliability statistics; HaluEval uses 35K samples"
    consequence_if_violated: "Low correlations could reflect noise, not true independence"
  - id: "A2"
    assumption: "Model population (N≥30) is representative of current LLM landscape"
    supporting_evidence: "Open LLM Leaderboard includes diverse architectures, scales, training approaches"
    consequence_if_violated: "Correlation structure may not generalize beyond tested models"
  - id: "A3"
    assumption: "Factor analysis assumptions approximately hold for benchmark scores"
    supporting_evidence: "Continuous scores, reasonable sample size; IRT analysis as robustness check"
    consequence_if_violated: "Factor structure may be artifacts; IRT results would diverge"
  - id: "A4"
    assumption: "Format differences (MC vs generation) don't dominate construct differences"
    supporting_evidence: "Will test via format-controlled analyses"
    consequence_if_violated: "Apparent multi-dimensionality may reflect format, not constructs"
  - id: "A5"
    assumption: "Unrelated-benchmark baseline (MMLU-Physics vs HaluEval) provides valid reference"
    supporting_evidence: "These measure different domains; expected near-zero correlation"
    consequence_if_violated: "Threshold interpretation becomes arbitrary"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Current generation LLMs (decoder-only transformers), 7B-70B parameter scale,
    established truthfulness benchmarks (TruthfulQA, HaluEval, FactScore),
    English-language evaluation only
  does_not_apply_to: |
    Multimodal models (vision-language), non-English benchmarks, proprietary
    closed-source models without API access (no evaluation possible),
    encoder-only or encoder-decoder architectures
  known_limitations: |
    FactScore depends on retrieval quality (Wikipedia snapshot).
    HaluEval subsets may have different reliability.
    Model count (N=30) limits statistical power for detecting small correlations.

