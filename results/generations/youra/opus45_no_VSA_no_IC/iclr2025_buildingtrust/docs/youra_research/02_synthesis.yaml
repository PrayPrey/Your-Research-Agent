metadata:
  generated_at: "2026-08-24"
  workflow: "phase2a-dialogue"
  architecture: "Self-Play Tikitaka Loop (Independent Controller Ablation)"
  schema_version: "10.0.0"
  gap_id: "gap-1-cross-benchmark-correlation"

hypothesis_draft:
  title: "Multi-Dimensional Truthfulness: Correlation Structure of LLM Reliability Benchmarks"
  hypothesis_id: "H-TruthfulnessDimensions-v1"
  core_claim: |
    Existing truthfulness benchmarks (TruthfulQA, HaluEval, FactScore) measure partially
    independent dimensions of LLM reliability, evidenced by moderate inter-benchmark
    correlations and multi-factor structure, because they target distinct failure modes.
  mechanism: |
    TruthfulQA targets misconception resistance (knowledge retrieval + misconception detection).
    HaluEval targets generation coherence (generation control + consistency maintenance).
    FactScore targets factual precision (fact verification + retrieval accuracy).
    Different capabilities → partial independence → moderate correlation + multi-factor structure.
  predictions:
    - P1: "Inter-benchmark correlations (TruthfulQA vs HaluEval vs FactScore) will be moderate (r between baseline and 0.7)"
    - P2: "Intra-benchmark correlations will remain high (r > 0.7)"
    - P3: "Factor analysis reveals 2-3 components, not single factor"
    - P4: "Error type clustering distinguishes benchmark performance patterns"

variables_summary:
  independent: "Benchmark type (TruthfulQA variants, HaluEval subsets, FactScore)"
  dependent_primary: "Inter-benchmark Spearman correlation coefficient"
  controlled: "Model architecture, scale, training approach, evaluation format"

null_hypothesis:
  h0_statement: |
    All truthfulness benchmarks measure the same underlying construct, with
    inter-benchmark r > 0.7 and single-factor solution explaining >80% variance.
  statistical_test: "Spearman correlation matrix + PCA factor analysis"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical correlation/factor structure study for truthfulness benchmarks"
  differentiation_summary: |
    BenchBench (2024) proposes methodology but doesn't apply to truthfulness.
    Ailem et al. (2024) examines prompt-level correlations, not model-level cross-benchmark.
    Moving Target (2026) studies score drift, not correlation structure.
    We fill the gap with truthfulness-specific empirical analysis.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Llama family (7B, 13B, 70B variants)"
    - "Mistral family (7B, 8x7B)"
    - "Falcon family (7B, 40B)"
    - "Phi family (2, 3)"
    - "Qwen family (7B, 14B, 72B)"
  datasets:
    - "TruthfulQA (817 questions, MC1/MC2/Generation)"
    - "HaluEval (35K samples, QA/Summarization subsets)"
    - "FactScore (generation + Wikipedia retrieval)"
    - "MMLU (control, knowledge benchmark)"
    - "HellaSwag (control, reasoning benchmark)"
  baselines:
    - "Unrelated-benchmark correlation as floor (MMLU-Physics vs HaluEval)"
    - "Single-factor PCA solution as null hypothesis"

measurement_plan:
  data_collection:
    - source: "Run all benchmarks via lm-evaluation-harness (TruthfulQA, MMLU, HellaSwag)"
    - source: "Run HaluEval via published evaluation scripts"
    - source: "Run FactScore via PyPI package with fixed Wikipedia snapshot"
    - source: "Aggregate scores for N≥30 models from diverse architectures"
  procedure:
    - step: "1. Select 30+ models from Open LLM Leaderboard (10 base, 10 instruct, 10 scaled)"
    - step: "2. Run all benchmarks on each model (~13 GPU-hours per model)"
    - step: "3. Compute Spearman correlation matrix for all benchmark pairs"
    - step: "4. Compute intra-benchmark correlations (MC1 vs MC2, HaluEval-QA vs HaluEval-Summ)"
    - step: "5. Run PCA with oblique rotation to identify factor structure"
    - step: "6. IRT analysis as robustness check"
    - step: "7. Error clustering on models with divergent benchmark profiles"
  success_criteria:
    - "Inter-benchmark r in moderate range (> baseline, < 0.7)"
    - "Intra-benchmark r > 0.7"
    - "2-3 factors with eigenvalue > 1, no single factor >80% variance"
    - "Distinct error patterns for divergent benchmark profiles"

validation:
  internal_validity:
    - "Diverse model population controls for architecture-specific effects"
    - "Format-controlled analyses (generation-only, MC-only) control for format confounds"
    - "Fixed FactScore retrieval corpus (Wikipedia snapshot date) controls for retrieval variance"
    - "Baseline-relative thresholds avoid arbitrary cutoff selection"
  external_validity:
    - "Model population spans Open LLM Leaderboard diversity"
    - "All benchmarks are established in the field with known reliability"
    - "Results generalizable to similar decoder-only transformer models"

discussion_synthesis:
  key_insights:
    - "Truthfulness benchmarks may measure distinct failure modes, not a single trait"
    - "Divergence patterns could be more informative than correlation strength"
    - "Factor analysis can reveal latent structure of truthfulness dimensions"
    - "Either outcome (multi-factor or single-factor) is valuable for the field"
  breakthrough_moments:
    - "Exchange 1: Dr. Nova's reframing — asking what latent structure explains divergence"
    - "Exchange 4: Prof. Pax confirming computational tractability (~400 GPU-hours)"
    - "Exchange 7: Dr. Nova's solution to arbitrary thresholds via relative baselines"
    - "Exchange 11: Dr. Ally's synthesis of refined hypothesis with all concerns addressed"
  resolved_tensions:
    - "Threshold arbitrariness → Baseline-relative thresholds (vs unrelated benchmarks)"
    - "Format confounds → Separate generation-only and MC-only analysis tracks"
    - "Model diversity → Required diverse population (architecture, scale, training)"
    - "Convergent validity → Error type clustering analysis added"
