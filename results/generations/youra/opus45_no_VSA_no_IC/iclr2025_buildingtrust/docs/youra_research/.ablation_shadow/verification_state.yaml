main_hypothesis:
  id: H-TruthfulnessDimensions-v1
  title: 'Multi-Dimensional Truthfulness: Correlation Structure of LLM Reliability Benchmarks'
  statement: Under evaluation of N≥30 diverse LLMs on truthfulness benchmarks, if TruthfulQA, HaluEval, and FactScore measure
    partially independent reliability dimensions, then inter-benchmark correlations will be moderate (r between baseline and
    0.7) while intra-benchmark correlations remain high (r > 0.7), and factor analysis will reveal 2-3 components rather than
    a single factor.
  defined_in: 03_refinement.yaml
