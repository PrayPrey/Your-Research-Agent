# Narrative Blueprint for Phase 6 Paper
# Generated: 2026-08-24
# Primary Source: 045_validated_hypothesis.md

version: "1.0"
hypothesis_id: "H-TruthfulnessDimensions-v1"

# ═══════════════════════════════════════════════════════════════
# SECTION 1: HOOK DESIGN
# ═══════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "Is a 'truthful' LLM truthful in all the same ways? A model that achieves 95% on MMLU can fail 40% of TruthfulQA questions — and our analysis of 50 models reveals this is the norm, not the exception."
    strategy: "counterintuitive_finding"
    backup_hook: "We find that models excelling at factual recall still systematically reproduce popular misconceptions — suggesting truthfulness is not one skill but several."

  why_reader_should_care:
    main_reason: "Practitioners selecting models based on one truthfulness benchmark may be blindsided by failures on others"
    concrete_example: "4 models (8%) in our study showed high MMLU scores but low TruthfulQA — demonstrating that knowledge retrieval ≠ misconception resistance"
    stakes: "Treating truthfulness as monolithic leads to incomplete model evaluation and potential deployment failures"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: PROBLEM FRAMING (3 LEVELS)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "LLM truthfulness benchmarks (TruthfulQA, HaluEval, FactScore) exist, but models show inconsistent performance across them"
    common_understanding: "Different benchmarks test different aspects of truthfulness"

  deeper_problem:
    description: "No study has quantified whether these benchmarks measure the same underlying construct or distinct dimensions"
    why_overlooked: "Each benchmark community operates independently; meta-evaluation studies (BenchBench) examined methodology, not truthfulness-specific correlation structure"
    our_perspective: "We hypothesize that apparent benchmark differences reflect genuine multi-dimensionality in LLM truthfulness capabilities"

  gap_in_existing_work:
    description: "No systematic cross-benchmark correlation study for truthfulness benchmarks using the same model population"
    why_gap_exists: "Benchmarks developed by separate research groups; Open LLM Leaderboard shows scores but not correlations"
    why_gap_matters: "Without knowing correlation structure, we cannot assess whether a single benchmark suffices or multiple are required"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Truthfulness in LLMs is a multi-dimensional construct: misconception resistance, generation coherence, and factual precision are three distinct, partially independent dimensions."
    expanded_explanation: "Our correlation analysis reveals that TruthfulQA (r=0.19 with MMLU), HaluEval (r=0.16 with TruthfulQA), and FactScore (r≈0 with both) tap different capabilities. PCA confirms 3 components are needed for 80% variance — no single factor dominates."

  why_others_missed_it:
    common_assumptions: "Benchmarks measuring 'truthfulness' should correlate highly if measuring the same construct"
    our_different_view: "Different evaluation paradigms (MC vs binary detection vs atomic fact verification) target different failure modes"
    enabling_factor: "First systematic correlation analysis on N=50 models across all three benchmarks simultaneously"

  what_makes_it_work:
    intuitive_explanation: "A model can know facts (MMLU) but still reproduce misconceptions (TruthfulQA), maintain coherence but hallucinate details (HaluEval), or pass holistic evaluation but fail atomic fact checks (FactScore)"
    key_mechanism: "Each benchmark targets a different stage of the generation process: knowledge retrieval, coherence maintenance, and fine-grained factual precision"

# ═══════════════════════════════════════════════════════════════
# SECTION 4: EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "TruthfulQA, HaluEval, and FactScore measure three distinct dimensions of LLM truthfulness"
    measurable_criteria: "Inter-benchmark r in moderate range (0.10 < r < 0.70); PCA requires 3 components for 80% variance"

supporting_evidence:
  - id: "evidence_1"
    what: "Cross-benchmark correlations: TQA-HE r=0.58, TQA-FS r=0.42, HE-FS r=0.44"
    so_what: "All correlations exceed unrelated-benchmark baseline (r=0.10) but fall below unity — partial independence, not total independence or identity"
    how_it_supports_claim: "Quantifies the degree of independence between truthfulness dimensions"
    figure: "fig_1 (heatmap.png)"

  - id: "evidence_2"
    what: "TruthfulQA-MMLU correlation: r=0.19 vs MMLU internal r=0.78"
    so_what: "TruthfulQA measures something distinct from general knowledge — 4 models with high MMLU show low TruthfulQA"
    how_it_supports_claim: "Validates misconception resistance as distinct dimension from knowledge retrieval"
    figure: "fig_3 (gate_comparison.png), fig_4 (scatter_divergent.png)"

  - id: "evidence_3"
    what: "HaluEval-TruthfulQA correlation: r=0.16"
    so_what: "Generation coherence (HaluEval) is nearly orthogonal to misconception resistance (TruthfulQA)"
    how_it_supports_claim: "Different failure modes produce different benchmark profiles"
    figure: "fig_5 (correlation_heatmap.png)"

  - id: "evidence_4"
    what: "FactScore correlations: r=-0.005 (TQA), r=-0.15 (HE)"
    so_what: "Atomic factual precision is independent of both misconception resistance and coherence"
    how_it_supports_claim: "Confirms third distinct dimension"
    figure: "fig_6 (pca_biplot.png)"

  - id: "evidence_5"
    what: "PCA: 3 components for 80% variance; PC1=38.6%"
    so_what: "No single factor dominates — multi-dimensional structure confirmed"
    how_it_supports_claim: "Factor analysis independently validates correlation-based findings"
    figure: "fig_7 (cumulative_variance.png)"

surprising_findings:
  - finding: "FactScore shows near-zero or negative correlations with other truthfulness benchmarks"
    why_surprising: "Expected moderate positive correlations given all measure 'truthfulness'"
    our_interpretation: "Task format (long-form biography generation + atomic decomposition) measures fundamentally different error mode than MC or binary detection"

  - finding: "Intra-HaluEval correlation r=0.65, below predicted r>0.7"
    why_surprising: "Expected high within-benchmark correlation"
    our_interpretation: "Even within HaluEval, QA/dialogue/summarization subtasks target different coherence failure modes"

# ═══════════════════════════════════════════════════════════════
# SECTION 5: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First empirical quantification of multi-dimensional truthfulness structure in LLMs"
    why_significant: "Establishes that single-benchmark evaluation is insufficient; provides actionable guidance for comprehensive model assessment"

  implications:
    for_field: "Future truthfulness research should explicitly address which dimension(s) they target"
    for_practice: "Model selection should evaluate all three dimensions: misconception resistance, generation coherence, factual precision"

  future_possibilities:
    immediate_extensions: "Cross-format validation (apply same evaluation paradigm across benchmarks), scale stratification analysis"
    longer_term_vision: "Intervention strategies targeting specific truthfulness dimensions; multi-dimensional truthfulness scores in model cards"

# ═══════════════════════════════════════════════════════════════
# SECTION 6: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — problem, insight, evidence, implication"
    key_message: "Truthfulness is multi-dimensional; 3 benchmarks tap 3 distinct dimensions; single-benchmark evaluation is insufficient"
    word_target: 150

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    key_elements:
      - "Hook: High MMLU ≠ high TruthfulQA (4 divergent models)"
      - "Problem: Unknown correlation structure between truthfulness benchmarks"
      - "Insight: Multi-dimensional truthfulness with 3 components"
      - "Contributions: First correlation study, 3-dimension model, divergent profile analysis"
    transition_to_related: "Connect to BenchBench and Ailem et al. — we extend meta-evaluation to truthfulness domain"
    word_target: 900

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "BUILDS_ON: BenchBench methodology, individual benchmark papers; DIFFERS: First truthfulness-specific correlation study"
    key_comparison_points:
      - "BenchBench (2024): Benchmark agreement methodology, not truthfulness-specific"
      - "Ailem et al. (2024): Prompt-level within-benchmark correlations; we do model-level cross-benchmark"
      - "Individual benchmarks (TruthfulQA, HaluEval, FactScore): Developed independently, never cross-correlated"
    word_target: 700

  methodology:
    narrative_purpose: "WHY this design solves the problem — not just WHAT we did"
    connection_to_insight: "Correlation + factor analysis reveals structure; N=50 diverse models enables robust estimation"
    key_design_decisions:
      - "Model selection: 7 architectures, 4 scales, 4 variants (diversity for generalization)"
      - "Correlation method: Spearman (robust to non-normal distributions)"
      - "Significance testing: Bonferroni correction (multiple comparisons)"
      - "Factor analysis: PCA to test single vs multi-factor structure"
    word_target: 1100

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "EQ1: Are inter-benchmark correlations moderate (baseline < r < 0.7)?"
      - "EQ2: Is TruthfulQA distinct from general knowledge (MMLU)?"
      - "EQ3: Is HaluEval distinct from TruthfulQA?"
      - "EQ4: Is FactScore distinct from both?"
    key_baselines:
      - "Unrelated-benchmark baseline: r(MMLU-Physics, HaluEval) = 0.10"
      - "Intra-benchmark correlation: r(MMLU internal) = 0.78"
    word_target: 900

  results:
    narrative_purpose: "Present evidence supporting claims — numbers with interpretation"
    main_result_highlight: "All 4 hypotheses PASS: r=0.42-0.58 inter-benchmark; TQA-MMLU r=0.19; HE-TQA r=0.16; FS correlations ≈0"
    figure_sequence:
      - "Fig 1: Correlation heatmap (overall structure)"
      - "Fig 2: TQA-MMLU gate comparison (distinctness)"
      - "Fig 3: Divergent models scatter (case study)"
      - "Fig 4: PCA variance plot (factor structure)"
    word_target: 1100

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, broader implications"
    honest_limitations:
      - "Model population: Open-source, English, 7B-70B only"
      - "FactScore: Proxy methodology, not full evaluation"
      - "Intra-HaluEval: r=0.65 below predicted 0.7"
    broader_implications: "Evaluation as multi-dimensional; model cards should report all dimensions; intervention should target specific dimensions"
    word_target: 500

  conclusion:
    narrative_purpose: "Callback to hook + open future"
    callback_to_hook: "Return to 'Is a truthful LLM truthful in all the same ways?' — answer is No, and we've quantified how"
    future_vision: "Multi-dimensional truthfulness framework; dimension-specific interventions; expanded model populations"
    word_target: 350

