    statement: "TruthfulQA, HaluEval, and FactScore measure three distinct dimensions of LLM truthfulness"
    supported: true
    evidence_type: "correlation_analysis + factor_analysis"

  dimension_definitions:
    - dimension: "Misconception Resistance"
      benchmark: "TruthfulQA"
      description: "Resistance to reproducing popular misconceptions from training data"
    - dimension: "Generation Coherence"
      benchmark: "HaluEval"
      description: "Maintaining consistency and avoiding hallucinated details during generation"
    - dimension: "Factual Precision"
      benchmark: "FactScore"
      description: "Ensuring atomic claims are verifiable against external sources"

  mechanism_verification:
    - step: "TruthfulQA tests misconception resistance distinct from knowledge"
      verified: true
      evidence: "r(TQA,MMLU)=0.19 << r(MMLU internal)=0.78"
    - step: "HaluEval tests coherence distinct from TruthfulQA"
      verified: true
      evidence: "r(HE,TQA)=0.16 << 0.7"
    - step: "FactScore tests precision distinct from both"
      verified: true
      evidence: "r(FS,TQA)=-0.005, r(FS,HE)=-0.15"
    - step: "Multi-factor structure confirmed"
      verified: true
      evidence: "PCA: 3 components for 80% variance"

