gap_id: "gap_1"
gap_title: "Unified Benchmark for LLM Data Attribution Comparison"
gap_description: |
  Current State: DATE-LM (2025) is first unified benchmark but limited to 3 tasks;
  existing evaluations use inconsistent metrics (LDS, LOO, counterfactual).
  Missing Piece: Comprehensive benchmark spanning model scales (7B to 70B),
  multiple FM families, and standardized efficiency/accuracy tradeoff metrics.
  Potential Impact: High - Without unified benchmarks, method comparison remains unreliable.
