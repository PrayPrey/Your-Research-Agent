hypothesis_draft:
  title: "Attribution Method Fingerprinting via Contrastive Mode Probing"
  hypothesis_id: "H-AttributionFingerprint-v1"
  core_claim: |
    Different LLM data attribution methods exhibit characteristic and stable
    mode profiles — systematic patterns of sensitivity to memorization,
    feature transfer, and spurious association influence modes — that
    dissociate across methods and transfer across model families.
  mechanism: |
    1. Attribution methods compute influence via mathematically distinct operations
       (TRAK: gradient projection, TracIn: checkpoint proximity, Kronfluence: K-FAC Hessian)
    2. These computational differences create different sensitivities to training data properties
    3. Different sensitivities manifest as measurable mode profile differences when probed
       with contrastive test points designed to isolate each influence mode
  predictions:
    - P1: "Methods show dissociable mode profiles (inter-method variance > intra-method variance, Cohen's d > 0.5)"
    - P2: "Profiles are stable within methods (Cronbach's alpha > 0.8)"
    - P3: "Profiles transfer across model families (cross-model r > 0.7)"

variables_summary:
  independent: "Attribution Method (TRAK, TracIn, Kronfluence) × Influence Mode (Memorization, Feature Transfer, Spurious Association)"
  dependent_primary: "Mode Profile Score — correlation between attribution scores and mode indicator"
  controlled: "Model scale (7B), probe set size (1000 pairs), hyperparameters (default with sensitivity analysis)"

null_hypothesis:
  h0_statement: |
    Attribution methods do not exhibit dissociable mode profiles.
    All methods show similar sensitivity patterns across influence modes,
    with inter-method variance no greater than intra-method variance.
  statistical_test: "ANOVA for method effect on mode profiles; pairwise t-tests with Bonferroni correction"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Reframes benchmarking from comparative accuracy to explanatory taxonomy via mode fingerprinting"
  differentiation_summary: |
    Unlike DATE-LM (which compares methods on accuracy), this work explains WHY methods differ
    by characterizing their mode-specific sensitivities. Unlike single-method studies (TRAK, Kronfluence),
    this provides cross-method taxonomy. Unlike fragility analysis (Basu 2020), this frames
    method differences as informative signatures rather than failures.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "LLaMA-2-7B"
    - "Mistral-7B"
    - "Qwen-7B"
    - "CodeLLaMA-7B (domain-specialized control)"
  datasets:
    - "OpenWebText (memorization probes via duplicate detection)"
    - "SQuAD (feature probes via semantic similarity)"
    - "Waterbirds-Text adaptation (spurious association probes)"
  baselines:
    - "Random attribution (null)"
    - "BM25 lexical similarity (non-learned)"

measurement_plan:
  data_collection:
    - source: "Contrastive probe pairs: 1000 per mode × 3 modes × 4 models"
    - source: "Attribution scores from TRAK, TracIn, Kronfluence for each test point"
  procedure:
    - step: "Construct contrastive probe pairs using MinHash (memorization) and semantic similarity (feature)"
    - step: "Run attribution methods on 7B models using official implementations"
    - step: "Compute mode profile scores as correlation between attribution and mode indicator"
    - step: "Calculate profile stability (split-half), dissociation (F-ratio), transfer (cross-model r)"
  success_criteria:
    - "P1 validated: F-ratio > 4.0, Cohen's d > 0.5"
    - "P2 validated: Cronbach's alpha > 0.8"
    - "P3 validated: Cross-model r > 0.7"

validation:
  internal_validity:
    - "Contrastive probe design isolates mode effects"
    - "Hyperparameter sensitivity analysis ensures method-intrinsic signatures"
    - "Random and BM25 baselines provide null comparison"
  external_validity:
    - "Three model families (LLaMA, Mistral, Qwen) test generalization"
    - "Domain-specialized model (CodeLLaMA) tests training data confound"
    - "7B scale sufficient for mechanism-level effects"

