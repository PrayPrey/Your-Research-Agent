# Phase 6 Narrative Blueprint
# Story-First Paper Design for Attribution Method Fingerprinting
# Generated: 2026-08-24

metadata:
  hypothesis_id: "H-AttributionFingerprint-v1"
  title: "Attribution Method Fingerprinting via Contrastive Mode Probing"
  status: "PARTIALLY_VALIDATED"
  sub_hypotheses_passed: "4/5"
  primary_limitation: "Cross-architecture transfer fails for ConvNeXt"

# =============================================================================
# SECTION 1: HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "When three leading data attribution methods are applied to the same training example, they can disagree by as much as their difference from random chance—yet researchers routinely treat them as interchangeable."
    strategy: "puzzle_paradox"
    source: "045_validated_hypothesis.md: F=1423.55 shows methods are radically different"

  why_reader_should_care:
    main_reason: "Method choice fundamentally shapes what 'influence' means, affecting fairness audits, data valuation, and model debugging conclusions"
    concrete_example: "A memorization-sensitive method (TRAK) and a curvature-sensitive method (Kronfluence) may identify completely different training examples as influential for the same prediction"
    stakes: "Wrong method choice may lead practitioners to incorrect conclusions about model behavior, with downstream impacts on data curation and model governance"

  anti_patterns_avoided:
    - "NOT: 'Data attribution is an important problem...'"
    - "NOT: 'Large language models have achieved remarkable success...'"
    - "INSTEAD: Specific puzzle about method disagreement + quantified evidence (F=1423)"

# =============================================================================
# SECTION 2: PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Data attribution methods (TRAK, TracIn, Kronfluence) produce different influence rankings"
    common_understanding: "DATE-LM (2025) showed no single method dominates across tasks"
    what_papers_say: "Different methods have different computational trade-offs; choose based on efficiency"

  deeper_problem:
    description: "Methods embed fundamentally different mathematical inductive biases that create systematic sensitivity differences"
    why_overlooked: "Prior work focused on accuracy/efficiency trade-offs, not on characterizing what each method actually measures"
    our_perspective: "The disagreement is not noise—it's signal about what each method's mathematics emphasizes"

  gap_in_existing_work:
    description: "No framework exists to characterize and compare attribution methods by their sensitivity profiles"
    why_gap_exists: "Evaluation focused on 'which method wins' rather than 'what does each method measure'"
    why_gap_matters: "Without characterization, practitioners cannot make informed method choices; method disagreement remains unexplained"

# =============================================================================
# SECTION 3: KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Different attribution algorithms compute influence via mathematically distinct operations that create characteristic 'fingerprints'—stable sensitivity patterns to memorization, feature transfer, and spurious association."
    expanded_explanation: |
      TRAK uses random projection preserving gradient direction; TracIn sums checkpoint-weighted gradient dot products;
      Kronfluence inverts Fisher information via K-FAC approximation. These operations are provably non-equivalent
      and create systematically different sensitivities to influence modes. The fingerprint emerges from the mathematics,
      not from random variation—methods cluster by identity with F=1423.55, not F~1.

  why_others_missed_it:
    common_assumptions: "Methods are approximately equivalent; differences are noise or dataset-dependent"
    our_different_view: "Differences are systematic signatures of mathematical operations; we can measure them"
    enabling_factor: "Contrastive mode probing—test cases designed to isolate memorization, feature transfer, spurious association"

  what_makes_it_work:
    intuitive_explanation: "Like how different cameras capture the same scene differently (one emphasizes color, another contrast), attribution methods 'see' influence through different mathematical lenses"
    key_mechanism: "Mode profiles: L2-normalized vectors of [memorization_sensitivity, transfer_sensitivity, spurious_sensitivity] that reliably distinguish methods"

# =============================================================================
# SECTION 4: EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Attribution methods produce strongly dissociable, internally consistent mode profiles"
    measurable_criteria:
      - "F-ratio > 4.0 for method dissociation (actual: F=1423.55)"
      - "Cronbach's α > 0.8 for internal consistency (actual: α > 0.96 all methods)"
    support_level: "STRONG"

  supporting_evidence:
    - id: "evidence_1"
      what: "F=1423.55, Cohen's d=20.64, p=4.3e-28"
      so_what: "Methods are not just 'different' but 'radically different'—inter-method variance exceeds intra-method variance by 3 orders of magnitude"
      how_it_supports_claim: "Directly validates P1 (dissociation prediction)"

    - id: "evidence_2"
      what: "Cronbach's α: TRAK=0.965, TracIn=0.974, Kronfluence=0.962"
      so_what: "Fingerprints are reliable—same method produces consistent profile across test points"
      how_it_supports_claim: "Validates P2 (stability prediction)"

    - id: "evidence_3"
      what: "ResNet-ViT correlation r=0.804"
      so_what: "Fingerprints transfer within architectural families (CNN-Transformer)"
      how_it_supports_claim: "Partially validates P3 (transfer prediction)"

  surprising_findings:
    finding: "ConvNeXt produces inverted mode profiles (r=-0.71 vs ResNet, r=-0.99 vs ViT)"
    why_surprising: "Expected positive transfer across all architecture pairs based on P3"
    our_interpretation: "ConvNeXt's depthwise separable convolutions process spatial information differently, inverting gradient flow patterns. Transfer is architecture-family-dependent, not universal."
    paper_framing: "This limitation is scientifically interesting—it reveals architecture-dependence of fingerprints and motivates calibration research"

# =============================================================================
# SECTION 5: BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First quantitative framework for characterizing attribution methods by their mode profiles"
    why_significant: "Transforms 'which method wins' into 'what does each method measure'—enables informed method selection"

  implications:
    for_field: "Explains WHY methods disagree (DATE-LM finding); provides taxonomy beyond single-method characterization"
    for_practice: "Practitioners can match methods to use cases: memorization detection → TRAK; curvature analysis → Kronfluence"

  future_possibilities:
    immediate_extensions: "Per-architecture calibration transforms; LLM-scale validation"
    longer_term_vision: "Method ensemble strategies; automatic method selection based on task profile"

# =============================================================================
# SECTION 6: SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words"
    key_message: "Attribution methods have characteristic fingerprints; we provide first quantitative characterization"
    structure: "Problem (methods disagree) → Insight (fingerprints) → Method (contrastive probing) → Results (F=1423, α>0.96) → Limitation (architecture-dependent)"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "puzzle_paradox"
    content_flow:
      - "Open with method disagreement puzzle"
      - "Three-level problem framing"
      - "Key insight: fingerprints from mathematical operations"
      - "Preview contributions (characterization framework, quantified dissociation, transfer analysis)"
    transition_to_related: "Position against DATE-LM and single-method characterization papers"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Build on DATE-LM, extend beyond single-method characterization, address Basu fragility concern"
    key_comparison_points:
      - "DATE-LM: Showed methods differ; we explain WHY"
      - "TRAK/Kronfluence papers: Single-method; we provide cross-method taxonomy"
      - "Basu 2020: Fragility concern; our fingerprints show systematic, not fragile, behavior"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "Mathematical distinctness → mode sensitivity → contrastive probing"
    key_design_decisions:
      - "Three influence modes: memorization, feature transfer, spurious association"
      - "Contrastive probe pairs: isolate each mode"
      - "Mode profiles: L2-normalized sensitivity vectors"
      - "Statistical analysis: ANOVA F-ratio, Cronbach's α, Pearson r"

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "EQ1: Do methods produce dissociable profiles? (h-m2)"
      - "EQ2: Are profiles stable within methods? (h-c1)"
      - "EQ3: Do profiles transfer across architectures? (h-c2)"
    baselines: "Random attribution, BM25 lexical similarity"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "F=1423.55 (threshold: 4.0) — methods are radically dissociable"
    secondary_highlights:
      - "α > 0.96 — excellent reliability"
      - "ResNet-ViT r=0.80 — within-family transfer works"
      - "ConvNeXt r < 0 — cross-family transfer fails (limitation)"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits honestly"
    honest_limitations:
      - "L1: Architecture-dependent transfer (ConvNeXt inverts)"
      - "L2: CPU-only execution (effect sizes robust, magnitudes may shift)"
      - "L3: Vision proxy for LLM hypothesis (mechanism transfers theoretically)"
    implications: "Method choice matters; fingerprinting enables informed selection"

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "Return to method disagreement puzzle → now explained by fingerprints"
    future_work:
      - "Per-architecture calibration"
      - "LLM-scale validation"
      - "Method ensemble strategies"

# =============================================================================
