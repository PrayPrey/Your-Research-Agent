      primary: false
    - name: "Profile Dissociation Index"
      type: "continuous"
      operationalization: "Inter-method variance / intra-method variance ratio for mode profiles"
      primary: false
  controlled:
    - name: "Model Scale"
      operationalization: "Fixed at 7B parameters across all models"
    - name: "Probe Set Size"
      operationalization: "1000 contrastive pairs per mode per model"
    - name: "Hyperparameter Configuration"
      operationalization: "Default settings from official implementations (sensitivity analysis as robustness check)"

# SECTION 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Different attribution algorithms compute influence via fundamentally different mathematical operations"
      evidence: "TRAK uses random projection of gradients; TracIn sums gradient dot products across checkpoints; Kronfluence inverts K-FAC approximated Hessian"
      falsifier: "If methods use mathematically equivalent operations, step fails"
    - step: 2
      description: "Different mathematical operations create different sensitivities to training data properties"
      evidence: "Gradient projection emphasizes direction alignment; checkpoint proximity emphasizes temporal learning patterns; Hessian inversion emphasizes curvature landscape"
      falsifier: "If operations produce identical sensitivity patterns, step fails"
    - step: 3
      description: "Different sensitivities manifest as measurable mode profile differences"
      evidence: "Contrastive probing reveals mode-specific attribution behavior"
      falsifier: "If mode profiles are identical across methods, step fails"
  key_tension: "Mode entanglement may blur clean separation — use continuous mode profiles rather than binary labels"
  evidence_summary: |
    The causal chain is grounded in the mathematical structure of each method.
    TRAK's random projection preserves gradient direction but not magnitude;
    TracIn's checkpoint aggregation emphasizes persistent vs transient influence;
    Kronfluence's K-FAC approximation captures second-order curvature information.
    These computational differences should translate to detectably different
    sensitivity patterns when probed with mode-diagnostic test points.

# SECTION 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Influence modes (memorization, feature transfer, spurious association) are sufficiently separable for measurement"
    supporting_evidence: "Prior work on duplicate detection, semantic similarity, spurious correlation datasets suggests operationalizable distinctions"
    consequence_if_violated: "Mode profiles become noisy; larger sample sizes needed"
  - id: "A2"
    assumption: "Method fingerprints are stable across hyperparameter choices"
    supporting_evidence: "Will verify via sensitivity analysis with 3 settings per method"
    consequence_if_violated: "Fingerprints are hyperparameter-dependent, not method-intrinsic"
  - id: "A3"
    assumption: "Cross-model transfer is not confounded by training data overlap"
    supporting_evidence: "Include domain-specialized model (CodeLLaMA) with distinct training corpus"
    consequence_if_violated: "Apparent transfer may reflect shared training data, not generalization"
  - id: "A4"
    assumption: "7B scale is sufficient for hypothesis validation"
    supporting_evidence: "DATE-LM validated at 7B; mechanism-level effects should be scale-invariant"
    consequence_if_violated: "70B spot-checks would be needed to confirm scaling"
  - id: "A5"
    assumption: "Existing implementations (TRAK, Kronfluence) are correct and comparable"
    supporting_evidence: "Both have peer-reviewed publications and active maintenance"
    consequence_if_violated: "Bugs could create artificial dissociation"

# SECTION 1.5: Scope & Boundaries
scope:
  applies_to: |
    - LLM data attribution at 7B parameter scale
    - Autoregressive transformer models (LLaMA, Mistral, Qwen families)
    - English language models
    - Methods with public implementations (TRAK, TracIn, Kronfluence)
  does_not_apply_to: |
    - Multimodal models (image-text, audio)
    - Models < 1B or > 13B parameters (extrapolation untested)
    - Non-transformer architectures (SSMs, RNNs)
    - Proprietary methods without implementation details
  known_limitations: |
    - TracIn requires checkpoint adaptation for LLM setting
    - 70B validation deferred to future work
    - Contrastive probe construction may miss some influence modes
    - Results may not transfer to non-English models

# SECTION 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Attribution methods exhibit dissociable mode profiles: inter-method variance in mode sensitivity exceeds intra-method variance"
    test_method: "Compute mode profiles for each method across 3 models, calculate F-ratio for method effect"
    success_criterion: "F-ratio > 4.0 (p < 0.05), Cohen's d > 0.5 for pairwise method comparisons"
    falsification: "F-ratio < 2.0 or Cohen's d < 0.3 for all pairwise comparisons"
  - id: "P2"
    primary: false
    statement: "Mode profiles are stable within methods across test points: consistency > 0.8"
    test_method: "Split-half reliability of mode profile scores across contrastive probe pairs"
    success_criterion: "Cronbach's alpha > 0.8 for each method's mode profile"
    falsification: "Cronbach's alpha < 0.6 for any method"
  - id: "P3"
    primary: false
    statement: "Mode profiles transfer across model families: cross-model correlation r > 0.7"
    test_method: "Correlate mode profiles between LLaMA-7B, Mistral-7B, Qwen-7B for each method"
    success_criterion: "Mean Pearson r > 0.7 across model pairs"
    falsification: "Mean Pearson r < 0.5 or any pair r < 0.3"

