# SECTION 1.1: Core Statement
core_statement:
  hypothesis_id: "H-AttributionFingerprint-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the scope of LLM data attribution at 7B parameter scale,
    if we characterize attribution methods by their mode profiles
    (sensitivity to memorization vs feature transfer vs spurious association),
    then methods will exhibit stable, dissociable fingerprints across model families,
    because different attribution algorithms embed different inductive biases
    about what makes training data influential.
  alternative_hypothesis_h0: |
    Attribution methods do not exhibit dissociable mode profiles;
    all methods show similar sensitivity patterns across influence modes,
    with inter-method variance no greater than intra-method variance.

# SECTION 1.2: Variables Table
variables:
  independent:
    - name: "Attribution Method"
      type: "categorical"
      operationalization: "TRAK (gradient projection), TracIn (checkpoint proximity), Kronfluence (K-FAC Hessian)"
      levels: ["TRAK", "TracIn", "Kronfluence"]
    - name: "Influence Mode"
      type: "categorical"
      operationalization: "Type of influence relationship being measured via contrastive probes"
      levels: ["Memorization", "Feature Transfer", "Spurious Association"]
  dependent:
    - name: "Mode Profile Score"
      type: "continuous"
      operationalization: "Correlation between attribution scores and mode indicator across contrastive probe pairs; range [-1, 1]"
      primary: true
    - name: "Cross-Model Transfer Correlation"
