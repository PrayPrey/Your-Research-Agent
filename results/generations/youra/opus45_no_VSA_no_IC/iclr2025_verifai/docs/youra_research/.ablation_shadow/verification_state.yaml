  id: h-sa-correlation-001
  title: SA-Correctness Correlation Quantification
  statement: Static analysis metrics (pylint score, mypy error count, radon cyclomatic complexity) exhibit moderate positive
    correlation (point-biserial r ≥ 0.35) with functional correctness (pass@1) on HumanEval/MBPP for LLM-generated code, after
    controlling for code length as a confounding variable.
