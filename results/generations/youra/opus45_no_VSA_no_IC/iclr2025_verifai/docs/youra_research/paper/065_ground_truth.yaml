# ============================================================================
# METHODOLOGY (From Phase 2C/3)
# ============================================================================

methodology:
  statistical_method: "point-biserial partial correlation"
  covariate: "LOC (lines of code)"
  significance_threshold: 0.05

  sa_tools:
    - name: "pylint"
      version: "3.0+"
      timeout: 30

    - name: "mypy"
      version: "1.0+"
      timeout: 30
      status: "numerical artifact - excluded"

    - name: "radon"
      version: "6.0+"
      timeout: 30

  libraries:
    - "scipy.stats.pointbiserialr"
    - "pingouin.partial_corr"

# ============================================================================
# DATASET (From Phase 4 validation)
# ============================================================================

dataset:
  combined_samples: 421
  humaneval: 164
  mbpp_sanitized_test: 257
  pass_rate: 0.3895

  cross_model_samples:
    per_model: 150
    total: 600
    models: ["gpt4", "claude3", "codellama", "codestral"]

# ============================================================================
# RESULTS (From Phase 4 validation reports)
# ============================================================================

results:
  h_e1:
    gate: "MUST_WORK"
    criterion: "≥95% valid rate"
    actual: "100%"
    passed: true

  h_m1:
    gate: "MUST_WORK"
    criterion: "max(|r_partial|) ≥ 0.35, p < 0.05"
    actual:
      pylint_r: 0.873
      pylint_p: 2.9e-132
      radon_r: -0.569
      radon_p: 2.4e-37
    passed: true

  h_m2:
    gate: "SHOULD_WORK"
    criterion: "r_ensemble > max(r_individual)"
    actual:
      r_ensemble: 0.861
      r_individual_best: 0.873
    passed: false
    reason: "Ensemble (0.861) < pylint-only (0.873)"

  h_c1:
    gate: "SHOULD_WORK"
    criterion: "std(r) < 0.15, all r > 0.35"
    actual:
      std_r: 0.186
      all_above_threshold: true
      min_r: 0.424
    passed: false
    reason: "std(r)=0.186 > 0.15; GPT-4 outlier (r=0.42)"

