# Phase 2A Refinement Output
# Generated: 2026-08-24
# Gap: SA-Correctness Correlation Quantification

hypothesis:
  id: "h-sa-correlation-001"
  version: 1
  status: "phase2b_ready"

  core_statement: |
    Static analysis metrics (pylint score, mypy error count, radon cyclomatic complexity)
    exhibit moderate positive correlation (point-biserial r ≥ 0.35) with functional correctness
    (pass@1) on HumanEval/MBPP for LLM-generated code, after controlling for code length
    as a confounding variable.

  causal_mechanism:
    steps:
      - "LLM generates code with varying quality"
      - "SA tools detect patterns (style violations, type errors, complexity) that statistically co-occur with logical errors"
      - "Code with fewer SA issues is more likely to pass functional tests"
      - "This relationship is independent of code length"

  variables:
    independent:
      - name: "pylint_score"
        type: "continuous"
        range: "0-10"
        description: "Pylint code quality score"
      - name: "mypy_error_count"
        type: "count"
        range: "0-∞"
        description: "Number of mypy type errors"
      - name: "mypy_type_coverage"
        type: "percentage"
        range: "0-100"
        description: "Percentage of typed expressions"
      - name: "radon_cc"
        type: "continuous"
        range: "1-∞"
        description: "Radon cyclomatic complexity"
    dependent:
      - name: "pass_at_1"
        type: "binary"
        values: [0, 1]
        description: "Whether code passes all test cases"
    control:
      - name: "code_length"
        type: "count"
        description: "Lines of code or token count"

  predictions:
    primary:
      statement: "Point-biserial correlation between pylint score and pass@1 will be r ≥ 0.35 (p < 0.05) controlling for code length"
      success_criterion: "r ≥ 0.35, p < 0.05"
      measurement: "Partial point-biserial correlation"
    secondary:
      statement: "Ensemble SA score will achieve higher correlation than any single metric"
      success_criterion: "r_ensemble > max(r_individual)"
      measurement: "Weighted combination correlation"
    tertiary:
      statement: "Correlation will generalize across 3+ LLMs with r variance < 0.15"
      success_criterion: "std(r_per_model) < 0.15"
      measurement: "Cross-model r comparison"

  null_hypothesis: |
    H0: After controlling for code length, no SA metric shows significant
    correlation (r > 0.35) with pass@1 across LLMs.

  novelty:
    - "First quantified correlation study between SA metrics and functional correctness"
    - "First to control for code length confound"
    - "First to test cross-model generalization of SA predictiveness"

  scope:
    in_scope:
      - "HumanEval (164 problems)"
      - "MBPP (399 problems)"
      - "Python code only"
      - "3-4 LLMs: GPT-4, Claude-3, Llama-70B, Codestral"
      - "SA tools: pylint, mypy, radon, bandit"
    out_of_scope:
      - "Other programming languages"
      - "Repository-level code"
      - "Custom SA rules"
      - "Semantic similarity metrics"

  assumptions:
    - "SA tools produce consistent, reproducible outputs"
    - "HumanEval/MBPP tests are valid proxies for functional correctness"
    - "SA pattern detection has some semantic relationship to code quality"
    - "Code length is the primary confounding variable"

  experimental_setup:
    data_generation:
      samples_per_problem: 100
      problems: 563  # 164 HumanEval + 399 MBPP
      llms: ["gpt-4", "claude-3-opus", "llama-70b", "codestral"]
      total_samples: "~225,200"
    measurement:
      sa_tools: ["pylint", "mypy", "radon", "bandit"]
      ground_truth: "EvalPlus test execution"
    analysis:
      primary_statistic: "point-biserial correlation"
      confound_control: "partial correlation controlling for LOC"
      significance_level: 0.05

  related_work:
    - paper: "Blyth 2025 - Static Analysis as Feedback Loop"
      relation: "comparison - our prediction vs their correction"
    - paper: "CodeQUEST 2025"
      relation: "quantify their 'meaningful correlation' claim"
    - baseline: "random"
      expected: "r ≈ 0"

  phase2b_seeds:
    - "Define exact ensemble weighting strategy"
    - "Statistical power analysis for sample size"
    - "Threshold for 'actionable' correlation"

  consensus:
    support_count: 6
    average_confidence: 0.855
    status: "CONVERGED"
