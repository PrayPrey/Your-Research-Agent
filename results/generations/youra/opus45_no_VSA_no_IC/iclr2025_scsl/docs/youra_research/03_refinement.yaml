causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Pre-compression weight statistics encode layer-specific structure"
      evidence: "Weight sparsity and kurtosis are measurable properties that vary across layers"
      falsifier: "If weight statistics are uniform across layers (no variation)"
    - step: 2
      description: "Compression techniques interact differently with weight distributions"
      evidence: "Pruning removes low-magnitude weights; quantization bins all weights. These operations are not commutative."
      falsifier: "If prune-then-quantize equals quantize-then-prune in all cases"
    - step: 3
      description: "Layer features predict which ordering preserves accuracy better"
      evidence: "To be tested: correlation between features and ordering preference"
      falsifier: "If correlation < 0.3 or prediction accuracy < 55%"
  key_tension: "Whether static pre-compression features capture enough information, or dynamic/interaction effects dominate"
  evidence_summary: |
    Prior work establishes ordering matters (arXiv 2604.04988, 2502.16638). This hypothesis
    adds the predictive component: that cheap-to-compute features determine optimal ordering.

