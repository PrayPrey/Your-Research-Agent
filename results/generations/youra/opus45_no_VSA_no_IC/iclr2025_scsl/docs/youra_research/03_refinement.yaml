# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-AACS-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard CNN architectures (ResNet-18/34), if we measure pre-compression
    weight distribution statistics (sparsity, kurtosis) per layer, then we can predict
    whether prune-first or quantize-first ordering yields higher accuracy at a fixed
    operating point (50% parameter reduction + INT8 quantization), because sparsity
    indicates noise-dominated weights that pruning removes efficiently while bimodal
    distributions indicate structure that quantization preserves better.
  alternative_hypothesis_h0: |
    There is no significant correlation between pre-compression weight statistics
    and optimal compression ordering preference. Ordering effects are random or
    determined by factors not captured in static weight distributions.

