# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Weight statistics computed pre-compression are predictive of post-compression behavior"
    supporting_evidence: "Weight magnitude is used by pruning; weight distribution affects quantization error"
    consequence_if_violated: "Predictor would need dynamic features (during compression), increasing cost"
  - id: "A2"
    assumption: "Ordering effects are layer-separable (each layer's preference is independent)"
    supporting_evidence: "Layers are processed independently in most compression pipelines"
    consequence_if_violated: "Would need block-level or whole-model analysis, increasing complexity"
  - id: "A3"
    assumption: "Effect sizes are practically significant (>1% accuracy difference)"
    supporting_evidence: "Prior work shows ordering can change accuracy by 2-5%"
    consequence_if_violated: "Hypothesis would be correct but not useful"
  - id: "A4"
    assumption: "Results generalize from ResNet-18 to other CNNs"
    supporting_evidence: "Weight distribution properties are architecture-agnostic"
    consequence_if_violated: "Scope limited to single architecture family"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Standard CNN architectures (ResNet family initially)
    - Pretrained models on ImageNet
    - Unstructured magnitude pruning + post-training INT8 quantization
    - Fixed operating point: 50% param reduction + INT8
  does_not_apply_to: |
    - Transformer architectures (future extension)
    - Structured pruning (different mechanism)
    - Quantization-aware training (changes dynamics)
    - Knowledge distillation (excluded to reduce confounds)
  known_limitations: |
    - Single operating point (50%+INT8) may not generalize to other ratios
    - Static features only; dynamic features may be more predictive
    - Layer-level analysis ignores cross-layer interactions

