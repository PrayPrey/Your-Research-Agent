hypothesis_draft:
  title: "Architecture-Aware Compression Sequencing (AACS)"
  hypothesis_id: "H-AACS-v1"
  core_claim: |
    Pre-compression weight distribution statistics (sparsity, kurtosis) can predict
    whether pruning-first or quantization-first ordering yields higher accuracy at
    a fixed operating point.
  mechanism: |
    Sparse-weight layers have noise-dominated magnitudes that pruning removes efficiently.
    Bimodally-distributed weight layers have structure that quantization preserves better.
    These properties are detectable from cheap-to-compute features before compression.
  predictions:
    - P1: "Weight features correlate with ordering preference (r > 0.3)"
    - P2: "Simple classifier predicts ordering with >55% accuracy"
    - P3: "Predicted ordering outperforms default in >70% of comparisons"

variables_summary:
  independent: "Compression ordering (prune-first vs quantize-first)"
  dependent_primary: "Model accuracy at 50% param reduction + INT8"
  controlled: "Compression ratio, quantization level, architecture, random seeds"

null_hypothesis:
  h0_statement: |
    There is no significant correlation between pre-compression weight statistics
    and optimal compression ordering preference. Ordering effects are random.
  statistical_test: "Pearson correlation, logistic regression accuracy"
  significance_level: 0.05

novelty_assessment:
