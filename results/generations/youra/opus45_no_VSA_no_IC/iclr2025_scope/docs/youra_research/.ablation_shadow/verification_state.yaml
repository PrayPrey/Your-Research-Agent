main_hypothesis:
  id: H-LoRARankScaling-v1
  title: Sub-Linear Scaling Law for Optimal LoRA Rank
  statement: Under Pythia 1B-12B, optimal LoRA rank scales as r_opt ∝ N^α where α ∈ (0.3, 0.7), because task-relevant subspace
    dimensionality grows sub-linearly with model capacity.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: SQuAD-v2, HotpotQA, Natural Questions
    model: EleutherAI/pythia-{1b,2.8b,6.9b,12b}
    optimizer: AdamW
    hyperparameters:
      learning_rate: 1e-4
      epochs: 3
      lora_alpha: 2r
      target_modules:
      - q_proj
      - v_proj
      ranks:
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
