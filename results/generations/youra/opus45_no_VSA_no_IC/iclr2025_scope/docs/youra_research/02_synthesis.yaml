hypothesis_draft:
  title: "Sub-Linear Scaling Law for Optimal LoRA Rank"
  hypothesis_id: "H-LoRARankScaling-v1"
  core_claim: |
    Optimal LoRA rank scales sub-linearly with model size following r_opt ∝ N^α
    where α ∈ (0.3, 0.7). This relationship exists because task-relevant subspace
    dimensionality grows slower than total model capacity.
  mechanism: |
    Larger models have increasingly redundant parameters. The task-specific adaptation
    needed can be captured in a lower-dimensional subspace relative to total model size.
    This explains why low-rank adapters remain effective at scale despite having a
    smaller fraction of trainable parameters.
  predictions:
    - P1: "Scaling exponent α ∈ (0.3, 0.7), 95% CI excluding 0 and 1"
    - P2: "Rank sensitivity >2x higher at 12B vs 1B (phase transition)"
    - P3: "Attention entropy correlates with optimal rank (r > 0.6)"

variables_summary:
  independent: "Model size (1B-12B Pythia), LoRA rank (4-128), Task complexity (single/multi-hop)"
  dependent_primary: "Task accuracy (F1/EM), Optimal rank r_opt"
  controlled: "LoRA α=2r, epochs=3, lr=1e-4, targets=Q,V"

null_hypothesis:
  h0_statement: |
    Optimal LoRA rank does not systematically vary with model size.
    Either α = 0 (constant rank optimal) or α = 1 (linear scaling).
  statistical_test: "Log-linear regression with t-test on α coefficient"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic quantification of model-size to optimal-rank relationship"
  differentiation_summary: |
    Prior work (LoRA, RoRA, LoRA-drop) addressed rank as hyperparameter or scaling fix,
    but none characterized how optimal rank changes with model scale. This provides
    a predictive framework rather than post-hoc tuning.

