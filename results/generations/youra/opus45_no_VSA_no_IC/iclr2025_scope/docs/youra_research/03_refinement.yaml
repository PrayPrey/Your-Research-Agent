causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Larger models have higher-dimensional representation spaces with more redundancy"
      evidence: "Scaling laws literature shows parameter efficiency decreases with scale"
      falsifier: "If representation intrinsic dimensionality scales linearly with parameters"
    - step: 2
      description: "Task-relevant subspace dimensionality grows sub-linearly with model capacity"
      evidence: "RoRA's α/√r fix suggests rank-dependent behavior exists"
      falsifier: "If optimal rank scales linearly (α = 1) or is constant (α = 0)"
    - step: 3
      description: "Low-rank adapters can capture task-specific structure without full-rank updates"
      evidence: "LoRA-drop shows 50% retention via output evaluation"
      falsifier: "If low-rank adapters consistently underperform full fine-tuning regardless of rank"
  key_tension: "Whether the sub-linear relationship is continuous or exhibits phase transition"
  evidence_summary: |
    RoRA demonstrates rank-dependent scaling behavior. LoRA-drop shows rank can be reduced
    significantly. No systematic study has quantified the model size to optimal rank relationship.

