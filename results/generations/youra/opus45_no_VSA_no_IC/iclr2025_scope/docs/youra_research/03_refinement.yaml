scope:
  applies_to: |
    - Pythia model family (1B-12B parameters)
    - Extractive and multi-hop QA tasks
    - Standard LoRA configuration (Q, V projections)
    - English language tasks
  does_not_apply_to: |
    - Other model architectures (Llama, Mistral, MoE)
    - Other task types (summarization, coding, generation)
    - Models below 1B or above 12B parameters
    - Non-English languages
  known_limitations: |
    - Single architecture family limits generalization claims
    - QA-only scope may not represent all fine-tuning scenarios
    - Pythia is older architecture; modern models may behave differently

