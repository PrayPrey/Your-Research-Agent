# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LoRARankScaling-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the Pythia model family (1B-12B parameters), if we measure optimal LoRA rank
    across QA tasks, then r_opt ∝ N^α where α ∈ (0.3, 0.7), because task-relevant
    subspace dimensionality grows sub-linearly with model capacity.
  alternative_hypothesis_h0: |
    Optimal LoRA rank does not systematically vary with model size: α = 0 (constant rank)
    or α = 1 (linear scaling). There is no significant sub-linear relationship.

