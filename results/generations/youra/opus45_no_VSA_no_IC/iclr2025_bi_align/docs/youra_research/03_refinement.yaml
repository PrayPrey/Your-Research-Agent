# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-AMode-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the scope of Chatbot Arena pairwise battles with standard response pairs,
    if we classify samples into four alignment modes based on human vote entropy (high/low, median split)
    crossed with RM ensemble variance (high/low, median split),
    then the Mode 3 population (Misaligned-Confident: high human entropy, low RM variance)
    will constitute >10% of samples,
    because reward models overfit to surface features while humans disagree on subjective criteria
    the RMs weren't trained on.
  alternative_hypothesis_h0: |
    Mode distribution is uniform (25%/25%/25%/25% across four modes) OR Mode 3 proportion < 5% (negligible).
    There is no systematic pattern of overconfident misalignment detectable from entropy-variance distributions.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "human_vote_entropy"
      type: "categorical"
      operationalization: "Shannon entropy of vote distribution (e.g., [A,A,B] → 0.92), binarized via median split"
      levels: ["low", "high"]
    - name: "rm_ensemble_variance"
      type: "categorical"
      operationalization: "Variance across RM preference scores for same pair, binarized via median split"
      levels: ["low", "high"]
  dependent:
    - name: "mode_3_proportion"
      type: "continuous"
      operationalization: "Proportion of samples in Mode 3 (high entropy, low variance) cell, range 0-1"
      primary: true
    - name: "semantic_similarity_by_mode"
      type: "continuous"
      operationalization: "Mean sentence-transformer cosine similarity of response pairs, per mode"
      primary: false
    - name: "mode_3_rate_by_prompt_type"
      type: "continuous"
      operationalization: "Mode 3 proportion stratified by subjective vs objective prompt classification"
      primary: false
  controlled:
    - name: "model_tier"
      operationalization: "Group battles by model capability tier (e.g., frontier vs mid-tier)"
    - name: "response_length"
      operationalization: "Control for response length effects on entropy/variance"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Human voters evaluate responses on diverse criteria including subjective preferences"
      evidence: "Chatbot Arena voting behavior shows high variance across similar prompts"
      falsifier: "If human votes are perfectly correlated with objective quality metrics"
    - step: 2
      description: "When responses differ substantively, some humans prefer A, others prefer B (high entropy)"
      evidence: "High entropy samples exist in Chatbot Arena (validated in h-m1)"
      falsifier: "If all high-entropy samples are due to noise/spam rather than genuine disagreement"
    - step: 3
      description: "Reward models trained on aggregate preferences collapse subjective distinctions"
      evidence: "Alignment Ceiling paper documents RM overoptimization [Lambert 2023]"
      falsifier: "If RMs trained with diverse preference signals maintain distinctions"
    - step: 4
      description: "RMs become confident on samples where they lack nuanced training signal (low variance)"
      evidence: "h-m1 showed negative correlation: high entropy → low RM variance"
      falsifier: "If RM confidence scales with training data density for sample type"
    - step: 5
      description: "Result: Overconfident misalignment (high entropy + low variance = Mode 3)"
      evidence: "This is the primary hypothesis to test"
      falsifier: "If Mode 3 population < 5%"
  key_tension: "Whether high human entropy truly indicates subjectivity vs. genuine quality ties"
  evidence_summary: |
    The causal chain is supported by h-m1's orthogonality finding (r=-0.06),
    the Alignment Ceiling paper's documentation of RM overoptimization,
    and the LLM-as-Judge paper's evidence of systematic biases.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Chatbot Arena votes reflect genuine human preferences (not spam/bots)"
    supporting_evidence: "Chatbot Arena has quality controls and verified user base"
    consequence_if_violated: "Entropy measurements would be noise, not preference signal"
  - id: "A2"
    assumption: "RM ensemble scores are comparable across models in the ensemble"
    supporting_evidence: "Standard practice to use normalized scores; h-m1 infrastructure validated"
    consequence_if_violated: "Variance would reflect model scale differences, not uncertainty"
  - id: "A3"
    assumption: "Median split provides reasonable threshold for high/low classification"
    supporting_evidence: "Common statistical practice; avoids arbitrary threshold selection"
    consequence_if_violated: "Mode proportions would shift; sensitivity analysis required"
  - id: "A4"
    assumption: "Human entropy is a valid proxy for preference diversity or subjectivity"
    supporting_evidence: "High entropy = voters disagree; literature uses entropy for disagreement"
    consequence_if_violated: "Entropy might proxy for confusion or battle difficulty instead"
  - id: "A5"
    assumption: "The four-mode framework captures meaningful alignment patterns"
    supporting_evidence: "Derives from crossing two validated dimensions (entropy, variance)"
    consequence_if_violated: "Mode boundaries might be arbitrary; alternative framings needed"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Pairwise preference evaluation settings (A vs B comparisons)
    - RM ensembles with variance as uncertainty proxy
    - Discrete human voting data with computable entropy
    - Chatbot Arena-style data with multiple votes per battle
  does_not_apply_to: |
    - Single-response evaluation (no pairwise comparison)
    - Continuous rating scales without discretization
    - Settings without human vote data
    - Direct answer evaluation without preference comparison
  known_limitations: |
    - Median split thresholds may not generalize across datasets
    - Semantic similarity as mechanism proxy may miss some failure modes
    - Prompt type classification requires existing metadata or heuristics

