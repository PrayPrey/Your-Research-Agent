# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Human vote entropy and RM ensemble variance are near-orthogonal (r=-0.06)"
      status: "BUILD_ON"
      evidence: "h-m1 Phase 4 experiment (N=6000, p<0.001)"
    - claim: "Chatbot Arena data is usable for bidirectional alignment research"
      status: "BUILD_ON"
