    - claim: "RM scoring infrastructure works with 2-3 model ensemble"
      status: "BUILD_ON"
      evidence: "h-m1 Phase 4 execution completed"
    - claim: "Mode 3 (Misaligned-Confident) exists in >10% of samples"
      status: "PROVE_NEW"
      evidence: "Primary hypothesis to test"
    - claim: "Semantic similarity differs between alignment modes"
      status: "PROVE_NEW"
      evidence: "Mechanism hypothesis to test"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Use h-m1 established infrastructure for data pipeline and RM scoring.
