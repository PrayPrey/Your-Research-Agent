# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Mode 3 (Misaligned-Confident: high human entropy, low RM variance) constitutes >10% of Chatbot Arena samples"
    test_method: "Count samples in Mode 3 cell after median split classification"
    success_criterion: "Proportion statistically > 10% (one-sided binomial test, p < 0.05)"
    falsification: "Proportion < 5% or not statistically different from 10%"
  - id: "P2"
    primary: false
    statement: "Mode 3 response pairs have lower semantic similarity than Mode 1 response pairs"
    test_method: "Compute sentence-transformer cosine similarity per pair, compare means"
    success_criterion: "Cohen's d > 0.3 for similarity difference"
    falsification: "No significant difference or d < 0.1"
  - id: "P3"
    primary: false
    statement: "Mode 3 proportion is higher for subjective prompts (creative writing) than objective prompts (math/coding)"
    test_method: "Stratify by prompt type, compare Mode 3 rates"
    success_criterion: "Ratio > 1.5 (subjective:objective Mode 3 rate)"
    falsification: "Ratio < 1.0 (opposite direction)"

