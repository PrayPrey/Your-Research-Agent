contribution_claims:
  empirical:
    claim: "First measurement showing ~24% of pairwise preference battles exhibit overconfident RM misalignment"
    novelty: true
    evidence: "QC1"

  methodological:
    claim: "2×2 mode decomposition (entropy × variance) as alignment diagnostic"
    novelty: true
    evidence: "Near-uniform distribution validates orthogonal decomposition"

  negative:
    claim: "Semantic divergence and prompt subjectivity ruled out as explanatory mechanisms"
    evidence: ["QC2", "QC3"]

limitations:
  - id: "L1"
    category: "methodological"
    description: "Single RM variance proxy instead of multi-model ensemble"
    impact: "Mode boundaries may shift with true variance"

  - id: "L2"
    category: "scope"
    description: "Chatbot Arena specific; generalization unknown"
    impact: "Results may not transfer to HH-RLHF, SHP, etc."

  - id: "L3"
    category: "methodological"
    description: "Correlational only; no causal claims"
    impact: "Cannot establish that reducing Mode 3 improves alignment"

  - id: "L4"
    category: "methodological"
    description: "Embedding model (MiniLM) may miss stylistic/tonal features"
    impact: "h-m1 negative result may be artifact of embedding choice"

  - id: "L5"
    category: "methodological"
    description: "Keyword-based prompt classification (75% ambiguous excluded)"
    impact: "h-c1 result based on subset; full coverage pending"

threats_to_validity:
  internal:
    - "RM variance proxy uses single model; not true ensemble variance"
    - "Human entropy aggregated at model-pair level, not per-battle"

  external:
    - "Single dataset (Chatbot Arena)"
    - "Single embedding model (MiniLM)"

  construct:
    - "Entropy as proxy for preference diversity vs confusion"
    - "Low RM score difference as proxy for high confidence"

adversarial_prompts:
  - "Is the 23.7% Mode 3 proportion an artifact of median-split thresholding?"
  - "Would tercile or data-driven clustering produce different mode boundaries?"
  - "Does the negative h-m1 result hold with larger/different embedding models?"
  - "Is the near-uniform mode distribution (23.7-26.3%) a red flag for arbitrary decomposition?"
  - "Could Mode 3 be an artifact of model-pair entropy aggregation?"
