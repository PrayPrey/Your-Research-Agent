# Phase 6 - Step 02: Narrative Blueprint
# Generated: 2026-08-24

hook_strategy:
  opening: "One in four preference battles hides a silent failure: reward models confident, humans conflicted."
  callback_keywords: ["one in four", "silent failure", "overconfident misalignment"]
  tension: "Aggregate metrics report 85% accuracy. What happens in the other 15%—and more critically, in the 85% we trust?"

problem_framing:
  level_1_practical:
    statement: "Reward models guide RLHF, but aggregate evaluation metrics miss systematic failure patterns."
    audience: "ML practitioners deploying RLHF systems"

  level_2_methodological:
    statement: "RewardBench-style aggregate accuracy conceals mode-specific failures; we need decomposition tools."
    audience: "Alignment researchers developing evaluation protocols"

  level_3_theoretical:
    statement: "Human-RM disagreement has structure: orthogonal dimensions (entropy × variance) reveal four alignment modes."
    audience: "AI safety researchers studying human-AI value alignment"

key_insight:
  one_sentence: "Crossing human vote entropy with RM variance exposes a 2×2 mode structure where 24% of battles show overconfident misalignment—RMs certain while humans disagree."
  novelty_claim: "First quantification of overconfident RM misalignment in large-scale preference data"
  mechanism_status: "Phenomenon identified; causal mechanism unknown (semantic similarity and prompt type ruled out)"

evidence_structure:
  primary_positive:
    hypothesis: "h-e1 (EXISTENCE)"
    result: "Mode 3 = 23.7% (95% CI: 23.4-24.0%, p<0.001)"
    role: "Core contribution—proves phenomenon exists at scale"

  negative_results:
    - hypothesis: "h-m1 (MECHANISM)"
      result: "Cohen's d = -0.049 (opposite direction)"
      role: "Rules out semantic similarity as explanation"
      framing: "What Mode 3 is NOT"
    - hypothesis: "h-c1 (CONDITION)"
      result: "Ratio = 1.07 (below 1.5 threshold)"
      role: "Shows Mode 3 is pervasive, not domain-specific"
      framing: "Mode 3 everywhere, not concentrated"

narrative_arc:
  setup: "RMs deployed at scale; aggregate metrics look good; what are we missing?"
  conflict: "Decompose by entropy × variance—reveals 24% overconfident misalignment zone"
  resolution: "Framework provides diagnostic lens; mechanism unknown but falsified two candidates"
  implications: "Aggregate metrics insufficient; mode-aware evaluation needed; new mechanism hypotheses required"

section_flow:
  - section: "Introduction"
    purpose: "Hook + problem framing + contribution preview"
    key_content: "1-in-4 statistic, aggregate vs decomposed view, what we prove/disprove"

  - section: "Related Work"
    purpose: "Position against RewardBench, Alignment Ceiling, BiAlign"
    key_content: "Aggregate metrics → mode decomposition; prior orthogonality finding"

  - section: "Methodology"
    purpose: "Operationalize entropy, variance, mode classification"
    key_content: "Entropy calculation, RM variance proxy, median-split framework, statistical tests"

  - section: "Experiments"
    purpose: "Three hypothesis tests in unified framework"
    key_content: "h-e1 existence, h-m1 similarity, h-c1 prompt type"

  - section: "Results"
    purpose: "Present findings cleanly: one confirmed, two refuted"
    key_content: "Mode distribution, similarity statistics, category analysis"

  - section: "Discussion"
    purpose: "Interpret findings, competing explanations, limitations"
    key_content: "What Mode 3 tells us, what it doesn't, future mechanism hypotheses"

  - section: "Conclusion"
    purpose: "Callback to hook, summarize contributions, future work"
    key_content: "1-in-4 revisited, framework utility, mechanism quest continues"

contribution_claims:
  - type: "empirical"
    claim: "First measurement showing ~24% of pairwise preference battles exhibit overconfident RM misalignment"
    evidence: "h-e1: N=57,477, Mode 3 = 23.7%, p<0.001"

  - type: "methodological"
    claim: "2×2 mode decomposition (entropy × variance) as alignment diagnostic"
    evidence: "Near-uniform distribution validates orthogonal decomposition"

  - type: "negative"
    claim: "Semantic divergence and prompt subjectivity ruled out as explanatory mechanisms"
    evidence: "h-m1: d=-0.049; h-c1: ratio=1.07"

limitations_to_acknowledge:
  - "Single RM variance proxy (full ensemble pending)"
  - "Chatbot Arena specific (generalization unknown)"
  - "Correlational only (no causal claims)"
  - "Mechanism unknown (descriptive, not explanatory)"

figure_plan:
  - id: "fig1"
    type: "2×2 heatmap"
    content: "Mode distribution with proportions"
    purpose: "Core framework visualization"

  - id: "fig2"
    type: "bar chart"
    content: "Mode 3 vs threshold comparison"
    purpose: "Primary result visualization"

  - id: "fig3"
    type: "distribution plot"
    content: "Similarity distributions Mode 1 vs Mode 3"
    purpose: "Negative result visualization (h-m1)"
