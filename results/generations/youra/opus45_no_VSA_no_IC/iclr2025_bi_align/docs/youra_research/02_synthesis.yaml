  gap_id: "gap-1"

hypothesis_draft:
  title: "Alignment Mode Hypothesis (H-AMode)"
  hypothesis_id: "H-AMode-v1"
  core_claim: |
    Chatbot Arena pairwise battles can be classified into four alignment modes based on
    human vote entropy crossed with RM ensemble variance. Mode 3 (Misaligned-Confident:
    high human entropy, low RM variance) represents overconfident alignment failures
    and constitutes >10% of samples. This reveals failure patterns that aggregate
    accuracy metrics miss.
  mechanism: |
    Reward models trained on aggregate preferences collapse subjective distinctions.
    When humans disagree (high entropy), RMs confidently pick based on surface features
    (low variance), resulting in overconfident misalignment. The h-m1 negative correlation
    (r=-0.06) validates that entropy and variance are near-orthogonal, supporting the
    2x2 mode decomposition.
  predictions:
    - P1: "Mode 3 proportion > 10% of samples"
    - P2: "Mode 3 response pairs have lower semantic similarity than Mode 1"
    - P3: "Mode 3 rate higher for subjective prompts than objective prompts"

variables_summary:
  independent: "Human vote entropy (high/low) × RM ensemble variance (high/low) via median split"
  dependent_primary: "Mode 3 proportion (target: >10%)"
  controlled: "Model tier, response length, prompt type"

null_hypothesis:
  h0_statement: |
    Mode distribution is uniform (25%/25%/25%/25% across four modes) OR Mode 3 proportion < 5%.
    There is no systematic pattern of overconfident misalignment in reward model predictions.
  statistical_test: "Chi-square goodness-of-fit (vs uniform), one-sided binomial (Mode 3 > 10%)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First alignment mode characterization via joint entropy-variance distributions"
  differentiation_summary: |
    Prior work uses aggregate metrics (RewardBench) or correlation analysis (h-m1).
    This work reveals failure PATTERNS through mode decomposition. Mode 3 identifies
    safety-critical overconfident misalignment that aggregates miss.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "OpenAssistant Reward Model"
    - "PairRM"
    - "ArmoRM"
    - "Starling-RM (optional)"
  datasets:
    - "Chatbot Arena Battles (lmsys/chatbot_arena_conversations)"
    - "RewardBench (for baseline comparison)"
  baselines:
    - "Uniform mode distribution (25% each)"
    - "h-m1 correlation approach (r=-0.06)"

measurement_plan:
  data_collection:
    - source: "Chatbot Arena via HuggingFace"
      fields: ["prompt", "response_a", "response_b", "winner", "vote_distribution"]
  procedure:
    - step: "Load Chatbot Arena battles with vote distributions"
    - step: "Score each response pair with RM ensemble"
    - step: "Compute human vote entropy per battle"
    - step: "Compute RM ensemble variance per battle"
    - step: "Apply median split to classify into 4 modes"
    - step: "Calculate mode proportions, test Mode 3 > 10%"
    - step: "For H-M1: Compute semantic similarity per pair, compare across modes"
    - step: "For H-M2: Stratify by prompt type, compare Mode 3 rates"
  success_criteria:
    - "Mode 3 proportion statistically > 10% (p < 0.05)"
    - "Mode distribution differs from uniform (Chi-square p < 0.05)"
    - "Semantic similarity Cohen's d > 0.3 for Mode 3 vs Mode 1"
    - "Subjective/Objective Mode 3 ratio > 1.5"

validation:
  internal_validity:
    - "Median split avoids arbitrary thresholds"
    - "RM ensemble reduces single-model bias"
    - "Multiple votes per battle ensures entropy stability"
  external_validity:
    - "Chatbot Arena is a major human preference benchmark"
    - "Method applies to any pairwise preference setting"
    - "Replicable with different RM ensembles"

discussion_synthesis:
  key_insights:
    - "h-m1's negative correlation (r=-0.06) is a FEATURE: orthogonality validates 2x2 decomposition"
    - "Mode 3 (Misaligned-Confident) is the safety-critical failure pattern"
    - "Aggregate metrics miss mode-specific patterns; distribution analysis fills this gap"
  breakthrough_moments:
    - "Exchange 5: Dr. Ally reconciled h-m1 findings with new hypothesis"
    - "Exchange 7: Dr. Nova proposed four-mode framework"
    - "Exchange 8: Prof. Vera formalized testable predictions"
  resolved_tensions:
    - "Tension: What does high entropy mean? Resolution: Use median split, test multiple interpretations"
    - "Tension: How to define accuracy without ground truth? Resolution: Use mode characterization, not accuracy"
    - "Tension: Is semantic similarity valid? Resolution: Standard method, sensitivity analysis"
