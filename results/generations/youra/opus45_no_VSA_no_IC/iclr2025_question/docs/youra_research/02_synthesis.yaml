# 02_synthesis.yaml - Phase 2A Synthesis
# Single-Pass Uncertainty Probes for Hallucination Detection

metadata:
  generated_at: "2026-08-24"
  workflow: "phase2a-dialogue"
  architecture: "Self-Play Tikitaka Loop"
  schema_version: "10.0.0"
  gap_id: "P1"

hypothesis_draft:
  title: "Cross-Family Generalization of Single-Pass Uncertainty Probes"
  hypothesis_id: "H-SEP-CrossFamily-v1"
  core_claim: |
    Hidden-state uncertainty probes (SEPs) achieve hallucination detection performance
    within 0.05 AUROC of multi-sample semantic entropy across multiple LLM families,
    demonstrating architecture-invariant uncertainty encoding in transformer models.
  mechanism: |
    Transformer hidden states encode semantic uncertainty as geometric properties
    (directions, distances) that are consistent across model architectures.
    Linear probes trained to extract this uncertainty signal transfer across
    model families without significant performance degradation.
  predictions:
    - P1: "SEPs achieve AUROC within 0.05 of multi-sample SE on Llama-3, Mistral, Qwen-2"
    - P2: "Cross-dataset transfer (TriviaQA to TruthfulQA) achieves AUROC >0.70"
    - P3: "Cross-model transfer maintains AUROC gap <0.10"

variables_summary:
  independent: "Detection method (multi-sample SE vs single-pass SEP)"
  dependent_primary: "Hallucination detection AUROC on TruthfulQA"
  controlled: "Model size (~7B), layer selection procedure, probe architecture, benchmark"

null_hypothesis:
  h0_statement: |
    There is no significant difference (<0.05 AUROC) between single-pass SEP performance
    and multi-sample SE performance. If the gap exceeds 0.05 for 2+ families or
    exceeds 0.10 for any family, the null is rejected in favor of multi-sample superiority.
  statistical_test: "Bootstrap confidence intervals for AUROC comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic cross-family validation of uncertainty probe transfer"
  differentiation_summary: |
    Prior work (SEP paper) demonstrated single-pass probing within individual models.
    This hypothesis extends to cross-family generalization, testing whether uncertainty
    representations are universal across transformer architectures. If confirmed,
    enables zero-shot uncertainty estimation for arbitrary models.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Llama-3-8B-Instruct"
    - "Mistral-7B-Instruct-v0.2"
    - "Qwen-2-7B-Instruct"
  datasets:
    - "TruthfulQA (817 questions, evaluation)"
    - "TriviaQA (~11K questions, training for transfer experiments)"
  baselines:
    - "Multi-sample Semantic Entropy (5 samples)"
    - "Token-level Entropy"
    - "Random (AUROC 0.50)"

measurement_plan:
  data_collection:
    - source: "Generate model outputs on TruthfulQA questions"
    - source: "Extract hidden states from final layer (or validation-tuned layer)"
    - source: "Apply trained probes to predict correctness"
  procedure:
    - step: "Train SEP probes on each model using TruthfulQA train split"
    - step: "Evaluate on TruthfulQA test split, compute AUROC"
    - step: "Run multi-sample SE baseline (5 samples) for comparison"
    - step: "Cross-dataset: train on TriviaQA, eval on TruthfulQA"
    - step: "Cross-model: apply Model A probe to Model B hidden states"
  success_criteria:
    - "P1: AUROC gap ≤0.05 for 2/3 families, none >0.10"
    - "P2: Cross-dataset AUROC >0.70"
    - "P3: Cross-model gap <0.10"

validation:
