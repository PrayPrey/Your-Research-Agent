  - contribution: "First systematic cross-family validation of SEP transfer"
    evidence_in_paper: "Results Section 5.1, Table 1 (3x3 transfer matrix)"
    source: "h-m2/04_validation.md"

  - contribution: "Affine alignment for dimension mismatch"
    evidence_in_paper: "Methodology Section 3.4, Results Section 5.3"
    source: "h-m2/03_architecture.md: AffineAligner class"

  - contribution: "Evidence for convergent uncertainty encoding"
    evidence_in_paper: "Discussion Section 6.1"
    source: "045_validated_hypothesis.md: theoretical interpretation"

# Limitations acknowledged
