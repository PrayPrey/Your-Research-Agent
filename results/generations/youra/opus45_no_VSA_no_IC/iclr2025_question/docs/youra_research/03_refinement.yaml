# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-SEP-CrossFamily-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under standard QA evaluation conditions (TruthfulQA benchmark),
    if we apply hidden-state uncertainty probes (SEPs) to detect hallucinations,
    then single-pass detection achieves AUROC within 0.05 of multi-sample semantic entropy
    across multiple LLM families (Llama-3, Mistral, Qwen-2),
    because transformer hidden states encode extractable uncertainty signals
    that generalize across architectures.
  alternative_hypothesis_h0: |
    There is no significant difference (<0.05 AUROC) between single-pass SEP performance
    and multi-sample SE performance on hallucination detection across LLM families.
    Alternative: the gap exceeds 0.05 AUROC for at least 2/3 families tested.

