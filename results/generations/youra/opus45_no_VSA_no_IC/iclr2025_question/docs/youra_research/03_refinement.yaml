# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Instruction-tuned LLMs in 7-8B parameter range
    - Short-form QA tasks with factual answers
    - Models from major families: Llama, Mistral, Qwen
  does_not_apply_to: |
    - Base models without instruction tuning
    - Very large models (70B+) — hidden state dimensions differ
    - Long-form generation tasks
    - Multi-turn dialogue or reasoning chains
    - Proprietary API-only models (no hidden state access)
  known_limitations: |
    - Layer selection requires validation data per model
    - Probe training requires some labeled correctness data
    - Results may not transfer to fundamentally different architectures (e.g., Mamba)

