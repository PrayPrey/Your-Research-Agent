# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Generalization gaps exist (11-14% on ImageNet test set replication)"
      status: "BUILD_ON"
      evidence: "Recht et al. (2019) - Do ImageNet Classifiers Generalize to ImageNet? arXiv:1902.10811"
    - claim: "Underspecification causes deployment divergence - models with equal benchmark performance behave differently in deployment"
      status: "BUILD_ON"
      evidence: "D'Amour et al. (2020) - Underspecification Presents Challenges arXiv:2011.03395"
    - claim: "Frequency shortcuts (texture bias) affect OOD generalization"
      status: "BUILD_ON"
      evidence: "Wang et al. (2025) - Do ImageNet-trained models learn shortcuts? arXiv:2503.03519"
    - claim: "Dataset concentration is increasing in ML research"
      status: "BUILD_ON"
      evidence: "Koch et al. (2021) - Reduced, Reused, Recycled: The Life of a Dataset"
    - claim: "Benchmark fingerprints are detectable in model representations"
      status: "PROVE_NEW"
      evidence: "This hypothesis proposes novel measurement"
    - claim: "Fingerprint strength correlates with cross-dataset generalization gap"
      status: "PROVE_NEW"
      evidence: "This hypothesis proposes novel correlation analysis"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    The first 4 claims are established and should be cited, not re-proven.
    Focus verification on the 2 PROVE_NEW claims: fingerprint detectability and correlation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkFingerprint-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under fine-tuning scenarios on image classification tasks, if a model is fine-tuned
    on a single popular benchmark (high usage frequency as measured by Papers With Code
    submissions), then it will exhibit: (a) a detectable benchmark fingerprint in its
    representations, and (b) larger performance degradation on alternative same-domain
    datasets, because fine-tuning on narrow benchmark distributions causes models to
    encode benchmark-specific spurious features rather than task-general visual concepts.
  alternative_hypothesis_h0: |
    There is no significant difference in cross-dataset generalization gap between
    models fine-tuned on single benchmarks versus mixed benchmarks, and benchmark
    fingerprint strength does not correlate with performance degradation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "fine_tuning_regime"
      type: "categorical"
      operationalization: "Single benchmark vs multi-benchmark mix"
      levels: ["single_benchmark", "multi_benchmark_mix"]
    - name: "benchmark_popularity"
      type: "continuous"
      operationalization: "Papers With Code leaderboard submission count for the fine-tuning benchmark"
  dependent:
    - name: "cross_dataset_gap"
      type: "continuous"
      operationalization: "In-domain accuracy minus out-of-domain accuracy, measured as percentage points"
      primary: true
    - name: "benchmark_fingerprint_score"
      type: "continuous"
      operationalization: "Linear classifier confidence for predicting fine-tuning benchmark from penultimate layer representations (0-1 scale)"
      primary: false
  controlled:
    - name: "model_architecture"
      operationalization: "ResNet-50 for all conditions"
    - name: "pretraining_source"
      operationalization: "ImageNet-1K pretrained weights (torchvision)"
    - name: "finetuning_epochs"
      operationalization: "30 epochs for all conditions"
    - name: "learning_rate"
      operationalization: "0.01 with cosine annealing schedule"
    - name: "optimizer"
      operationalization: "SGD with momentum 0.9"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Models are fine-tuned on a single benchmark with specific statistical properties (textures, backgrounds, label distributions, collection biases)"
      evidence: "Standard transfer learning protocol - well-established practice"
      falsifier: "If fine-tuning doesn't change representations (no adaptation), mechanism fails"
    - step: 2
      description: "Optimization pressure causes models to capture benchmark-idiosyncratic features beyond task-essential features to minimize training loss"
      evidence: "Wang et al. (2025) showed CNNs learn texture shortcuts; D'Amour et al. (2020) showed underspecification"
      falsifier: "If models only encode task-general features regardless of benchmark, this step fails"
    - step: 3
      description: "These spurious features manifest as systematic patterns in the representation space that are detectable by a linear classifier"
      evidence: "Linear probing is standard for representation analysis (Kornblith et al.)"
      falsifier: "If classifier cannot distinguish benchmarks from representations (accuracy ≤25%), fingerprints don't exist as discrete signals"
    - step: 4
      description: "When evaluated on alternative datasets lacking these spurious correlations, models fail to generalize because they relied on benchmark-specific patterns"
      evidence: "Recht et al. (2019) demonstrated 11-14% accuracy drops on replicated test sets"
      falsifier: "If fingerprint strength doesn't correlate with gap (r≤0), spurious encoding doesn't explain performance degradation"
  key_tension: "Distinguishing beneficial task adaptation from harmful benchmark fingerprinting - both involve representation changes"
  evidence_summary: |
    The mechanism combines established findings: (1) underspecification explains why benchmark-equivalent
    models diverge (D'Amour), (2) frequency shortcuts show models encode spurious features (Wang),
    (3) generalization gaps are measurable via test set replication (Recht). Our contribution unifies
    these into a single measurable fingerprint construct.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Fine-grained classification benchmarks share enough task similarity that cross-dataset evaluation is meaningful"
    supporting_evidence: "All datasets involve recognizing object categories from natural images; transfer learning literature shows positive transfer between similar tasks"
    consequence_if_violated: "Cross-dataset gaps may reflect task difficulty differences rather than benchmark overfitting"
  - id: "A2"
    assumption: "Penultimate layer representations capture fine-tuning effects reliably"
    supporting_evidence: "Standard practice in representation analysis; Kornblith et al. showed penultimate layer is most informative for transfer"
    consequence_if_violated: "May need to analyze multiple layers or use different representation extraction methods"
  - id: "A3"
    assumption: "Linear classifiers are sufficient to detect fingerprint patterns"
    supporting_evidence: "Linear probes are standard and interpretable; if fingerprints are systematic, linear separation should work"
    consequence_if_violated: "May need non-linear probes, but this increases risk of overfitting to model-specific rather than benchmark-specific features"
  - id: "A4"
    assumption: "Papers With Code submission count is a valid proxy for benchmark popularity and usage frequency"
    supporting_evidence: "Papers With Code is the dominant platform for ML benchmarking; submission count reflects active research attention"
    consequence_if_violated: "May need additional proxies (citations, OpenML runs) for robustness"
  - id: "A5"
    assumption: "ImageNet pre-training provides sufficiently similar starting point across all conditions"
    supporting_evidence: "Using same pre-trained weights for all models controls for initialization effects"
    consequence_if_violated: "Pre-training source could interact with fine-tuning benchmark; may need to test with other pre-training sources"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Image classification models (CNN architectures, initially ResNet-50)
    - Fine-tuning scenarios from ImageNet pre-trained weights
    - Fine-grained visual classification benchmarks (birds, dogs, flowers, cars, aircraft)
    - Scenarios where cross-dataset evaluation is meaningful (same object category, different collection)
  does_not_apply_to: |
    - Training from scratch (different optimization dynamics)
    - NLP or other modalities (would require separate validation with modality-specific benchmarks)
    - Coarse-grained classification (CIFAR-10 vs ImageNet - task differences may dominate)
    - Multi-modal models (CLIP, etc. - different representation structure)
  known_limitations: |
    - Limited to publicly available fine-grained classification datasets
    - ResNet-50 may not generalize to Transformer architectures (ViT, DeiT)
    - Benchmark popularity data depends on Papers With Code completeness
    - 5 benchmarks may be insufficient for robust popularity correlation

