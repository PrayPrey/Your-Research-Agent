# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "A linear classifier trained on penultimate layer representations can predict which fine-tuning benchmark was used with >60% accuracy (chance = 20% for 5 benchmarks)"
    test_method: "Train ResNet-50 on 5 fine-grained benchmarks separately, extract features, train linear classifier with 80/20 model split"
    success_criterion: "Classification accuracy > 60%"
    falsification: "Accuracy ≤ 25% (near chance level)"
  - id: "P2"
    primary: false
    statement: "Benchmark Fingerprint Score (classifier confidence for true benchmark) correlates positively with cross-dataset performance gap"
    test_method: "Compute BFS and cross-dataset gap for each model, calculate Pearson correlation"
    success_criterion: "r > 0.3, p < 0.05"
    falsification: "r ≤ 0 or p > 0.1"
  - id: "P3"
    primary: false
    statement: "Models fine-tuned on a single benchmark show larger cross-dataset gap than models fine-tuned on a mix of 3+ benchmarks"
    test_method: "Compare mean cross-dataset gap between single-benchmark and multi-benchmark conditions"
    success_criterion: "Single-benchmark gap > multi-benchmark gap + 5 percentage points"
    falsification: "Multi-benchmark gap ≥ single-benchmark gap"

