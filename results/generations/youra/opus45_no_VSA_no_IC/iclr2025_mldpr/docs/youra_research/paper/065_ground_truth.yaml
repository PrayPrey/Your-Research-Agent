# Core claims that can be fact-checked
claims:
  primary:
    - id: "C1"
      statement: "Linear classifier achieves 99.51% accuracy distinguishing fine-tuned model origins"
      source: "H-E1 experiment"
      verifiable: true
      evidence_location: "h-e1/04_validation.md"
      numerical_value: 99.51
      unit: "percent"
      threshold: 60

    - id: "C2"
      statement: "Effect size Cohen's d = 698.08"
      source: "H-E1 statistical analysis"
      verifiable: true
      evidence_location: "h-e1/04_validation.md"
      numerical_value: 698.08
      unit: "cohens_d"

    - id: "C3"
      statement: "BFS-gap correlation r = 0.022, p = 0.967"
      source: "H-M1 experiment"
      verifiable: true
      evidence_location: "h-m1/04_validation.md"
      numerical_value: 0.022
      unit: "pearson_r"
      threshold: 0.3

  secondary:
    - id: "C4"
      statement: "Shuffled baseline achieves 50.43% accuracy"
      source: "H-E1 baseline validation"
      verifiable: true
      numerical_value: 50.43

    - id: "C5"
      statement: "All models achieved BFS > 0.999"
      source: "H-M1 results"
      verifiable: true
      evidence_location: "h-m1/04_validation.md"

# Experimental parameters (for reproducibility review)
experimental_parameters:
  models:
    architecture: "ResNet-50"
    pretrained_on: "ImageNet-1K"
    fine_tuning_epochs: 10
    learning_rate: 0.01
    optimizer: "SGD"
    momentum: 0.9
    seeds_per_benchmark: 3
    total_models: 6

  benchmarks:
    - name: "Flowers102"
      classes: 102
    - name: "CIFAR-100"
      classes: 100

  probe:
    classifier: "LogisticRegression"
    feature_dim: 2048
    feature_layer: "avgpool"

# Hypothesis verdicts
hypothesis_verdicts:
  - id: "H-E1"
    type: "EXISTENCE"
    gate: "MUST_WORK"
    verdict: "PASS"
    threshold_met: true

  - id: "H-M1"
    type: "MECHANISM"
    gate: "SHOULD_WORK"
    verdict: "FAIL"
    threshold_met: false

  - id: "H-M2"
    type: "MECHANISM"
    gate: "SHOULD_WORK"
    verdict: "INCONCLUSIVE"
    reason: "Synthetic data only; real datasets required"

# Known limitations (for review fairness)
limitations:
  - id: "L1"
    description: "Reduced benchmark count (2 vs planned 5)"
    severity: "medium"
    impact: "Higher chance level (50% vs 20%)"

  - id: "L2"
    description: "BFS metric saturation (all >0.999)"
    severity: "high"
    impact: "Blocks correlation analysis"

  - id: "L3"
    description: "H-M2 not executed with real data"
    severity: "high"
    impact: "Key mechanism prediction unvalidated"

  - id: "L4"
    description: "Sample size n=6 for correlation"
    severity: "medium"
    impact: "Low statistical power"

  - id: "L5"
    description: "Domain heterogeneity confound"
    severity: "medium"
    impact: "Gap may reflect domain distance"

