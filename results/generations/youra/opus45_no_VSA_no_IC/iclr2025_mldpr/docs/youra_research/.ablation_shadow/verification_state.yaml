main_hypothesis:
  id: H-BenchmarkFingerprint-v1
  title: The Benchmark Fingerprint Hypothesis
  statement: 'Under fine-tuning scenarios on image classification tasks, if a model is fine-tuned on a single popular benchmark,
    then it will exhibit: (a) a detectable benchmark fingerprint in its representations, and (b) larger performance degradation
    on alternative same-domain datasets, because fine-tuning on narrow benchmark distributions causes models to encode benchmark-specific
    spurious features rather than task-general visual concepts.'
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Fine-Grained Visual Classification Suite (CUB-200, Stanford Dogs, Flowers102, Stanford Cars, FGVC Aircraft)
    model: ResNet-50
    optimizer: SGD with momentum 0.9
    hyperparameters:
      learning_rate: 0.01
      lr_schedule: cosine annealing
      epochs: 30
      seeds: 3
