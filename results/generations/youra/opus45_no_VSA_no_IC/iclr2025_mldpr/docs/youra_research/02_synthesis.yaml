hypothesis_draft:
  title: "The Benchmark Fingerprint Hypothesis"
  hypothesis_id: "H-BenchmarkFingerprint-v1"
  core_claim: |
    Fine-tuning on single popular benchmarks causes models to encode benchmark-specific
    spurious features rather than task-general visual concepts, creating detectable
    "fingerprints" in their representations that correlate with cross-dataset
    generalization failure.
  mechanism: |
    1. Narrow benchmark distributions contain idiosyncratic statistical patterns
       (textures, backgrounds, label correlations) beyond task-essential features
    2. Optimization pressure causes models to capture these spurious patterns
    3. The fingerprint manifests as systematic representation differences
       detectable by linear classification
    4. Models fail on alternative datasets lacking these spurious correlations
  predictions:
    - P1: "Fingerprint detectability: Linear classifier >60% accuracy predicting fine-tuning benchmark"
    - P2: "Gap correlation: BFS correlates positively with cross-dataset gap (r>0.3)"
    - P3: "Single vs multi effect: Single-benchmark models show >5% larger gap"

variables_summary:
  independent: "Fine-tuning regime (single vs multi-benchmark); Benchmark popularity (PWC submissions)"
  dependent_primary: "Cross-dataset performance gap (in-domain - out-of-domain accuracy, %)"
  controlled: "Architecture (ResNet-50), pre-training (ImageNet), epochs (30), LR schedule"

null_hypothesis:
  h0_statement: |
    There is no significant difference in cross-dataset generalization gap between
    models fine-tuned on single benchmarks versus mixed benchmarks, and benchmark
    fingerprint strength does not correlate with performance degradation.
  statistical_test: "Two-sample t-test for single vs multi comparison; Pearson correlation for BFS-gap relationship"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First model-internal metric (BFS) for benchmark overfitting effects"
  differentiation_summary: |
    Recht et al. measured gaps but not mechanism. D'Amour explained divergence but no metric.
    Wang identified shortcuts but not benchmark connection. Koch analyzed papers not models.
    We unify: usage patterns → representation changes → generalization outcomes.

