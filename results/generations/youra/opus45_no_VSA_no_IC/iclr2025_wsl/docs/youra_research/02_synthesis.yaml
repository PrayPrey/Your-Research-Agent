hypothesis_draft:
  title: "Data Efficiency of Permutation-Equivariant Weight Embeddings"
  hypothesis_id: "H-EquivariantDataEfficiency-v1"
  core_claim: |
    Permutation-equivariant weight embeddings (NFN) achieve equivalent accuracy
    prediction performance with ≤50% of training samples compared to MLP baselines
    on homogeneous model zoos, because equivariance eliminates the need to learn
    permutation invariance from data.
  mechanism: |
    Weight matrices have hidden-unit permutation symmetry. Non-equivariant methods
    must learn this invariance from data, consuming sample complexity. Equivariant
    methods enforce invariance architecturally, freeing capacity for the actual
    prediction task.
  predictions:
    - P1: "NFN R² > MLP R² + 0.1 at N=500 training models"
    - P2: "All methods within R² ±0.03 at N=5000"
    - P3: "Crossing point N* < 2500 where NFN matches Statistics baseline"

variables_summary:
  independent: "Training set size (100-5000 models), Embedding method (Statistics/MLP/NFN)"
  dependent_primary: "R² on held-out accuracy prediction"
  controlled: "Architecture (ResNet-20), Dataset (CIFAR-10), Test size (500), Seeds (10)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in R² between NFN and MLP at any training
    set size N ∈ {100, 250, 500, 1000, 2500, 5000} (p>0.05 for all comparisons).
  statistical_test: "One-sided two-sample t-test (P1), ANOVA with pairwise (P2)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic data efficiency comparison for weight embeddings; 'crossing point' analysis paradigm"
  differentiation_summary: |
    Prior work compared final performance or introduced new architectures. This
    work uniquely focuses on sample complexity—how many training models each
    method needs to achieve target R². The crossing point metric characterizes
    when learned embeddings match handcrafted statistics.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "NFN (nfn library, PyTorch)"
    - "MLP (3-layer, flattened weights)"
    - "Ridge regression (statistics features)"
  datasets:
    - "Model Zoo ResNet-20/CIFAR-10 (5360 models)"
  baselines:
    - "Unterthiner statistics → Ridge regression"
    - "Flattened weights → MLP"

measurement_plan:
  data_collection:
    - source: "Model Zoo dataset (github.com/ModelZoos/ModelZooDataset)"
    - source: "nfn library (github.com/AllanYangZhou/nfn)"
  procedure:
    - step: "Load 5360 ResNet-20 models and their CIFAR-10 test accuracies"
    - step: "Create training splits: N ∈ {100, 250, 500, 1000, 2500, 5000}"
    - step: "Hold out 500 models for testing (fixed across all conditions)"
    - step: "For each (N, method, seed): train embedding model, compute test R²"
    - step: "Repeat 10 seeds per condition"
    - step: "Compute mean ± std R² for each (N, method)"
    - step: "Perform statistical tests (t-test for P1, ANOVA for P2)"
    - step: "Interpolate learning curves to find crossing point N*"
  success_criteria:
    - "P1: NFN mean R² > MLP mean R² + 0.1 at N=500, p<0.05"
    - "P2: Max pairwise R² difference < 0.03 at N=5000"
    - "P3: Crossing point N* < 2500"

validation:
  internal_validity:
    - "Fixed architecture eliminates confound from variable network structure"
    - "Same test set across all conditions ensures comparable R² values"
    - "10 seeds provide confidence intervals and statistical power"
    - "Three methods (Statistics, MLP, NFN) enable isolation of equivariance effect"
  external_validity:
    - "ResNet-20/CIFAR-10 is widely used benchmark"
    - "Model Zoo dataset is publicly available and reproducible"
    - "Limitation: results may not generalize to heterogeneous architectures"

discussion_synthesis:
  key_insights:
    - "Data efficiency is the right comparison axis—equivariance may not improve ceiling but should improve floor"
    - "Three-way comparison (Statistics/MLP/NFN) reveals whether equivariance matches handcrafted knowledge"
    - "Crossing point analysis provides outcome-agnostic contribution"
  breakthrough_moments:
