# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-EquivariantDataEfficiency-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under fixed-architecture homogeneous model zoos (ResNet-20/CIFAR-10),
    if we train weight embedding models with varying dataset sizes (N=100 to 5000),
    then permutation-equivariant architectures (NFN) will achieve equivalent accuracy
    prediction R² with ≤50% of training samples compared to MLP baselines,
    because equivariance eliminates the need to learn permutation invariance from data.
  alternative_hypothesis_h0: |
    There is no significant difference in R² between NFN and MLP at any training
    set size N ∈ {100, 250, 500, 1000, 2500, 5000} (p>0.05 for all comparisons).

