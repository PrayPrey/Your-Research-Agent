key_assumptions:
  - id: "A1"
    assumption: "ResNet-20 model zoo has sufficient accuracy diversity for meaningful regression"
    supporting_evidence: "Model Zoo paper shows accuracy range 70-95% across training runs"
    consequence_if_violated: "Low variance in DV reduces statistical power to detect method differences"
  - id: "A2"
    assumption: "Unterthiner's statistics represent near-optimal handcrafted features"
    supporting_evidence: "Achieves R² > 0.98 on their 120K model dataset"
    consequence_if_violated: "Statistics baseline may underperform, inflating apparent equivariance benefit"
  - id: "A3"
    assumption: "Official nfn library implementation is correct and optimized"
    supporting_evidence: "Published at NeurIPS 2023, 93 GitHub stars, actively maintained"
    consequence_if_violated: "NFN underperformance may reflect implementation bugs, not method limitations"
  - id: "A4"
    assumption: "10 random seeds provide sufficient confidence intervals"
    supporting_evidence: "Standard practice in ML benchmarking (matches Model Zoo paper)"
    consequence_if_violated: "Statistical tests may be underpowered or unreliable"
  - id: "A5"
    assumption: "N=500 threshold is appropriate for detecting equivariance benefits"
    supporting_evidence: "Small enough for data efficiency to matter, large enough for learning"
    consequence_if_violated: "May need to adjust N thresholds based on pilot results"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Fixed-architecture homogeneous model zoos (same architecture, different training runs)
    - Accuracy prediction task from weight embeddings
    - Supervised embedding learning with labeled model accuracy
  does_not_apply_to: |
    - Cross-architecture transfer (CNN → ViT) - deferred to future work
    - Heterogeneous model collections with varying architectures
    - Other property prediction tasks (loss, generalization gap)
    - Unsupervised or self-supervised weight embedding
  known_limitations: |
    - Homogeneous model zoo may be easier than realistic heterogeneous scenarios
    - R² ceiling (>0.98 in prior work) limits sensitivity at large training sizes
    - Results may not transfer to other architectures or datasets

