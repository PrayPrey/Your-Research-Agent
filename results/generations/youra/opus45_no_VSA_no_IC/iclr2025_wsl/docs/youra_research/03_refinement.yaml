# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Weight matrices in neural networks have hidden-unit permutation symmetry"
      evidence: "Git Re-Basin (Ainsworth et al. 2022) formally proves reordering neurons preserves network function"
      falsifier: "Find a network architecture where neuron permutation changes output"
    - step: 2
      description: "Non-equivariant methods (MLP) must learn permutation invariance from data"
      evidence: "MLP treats weight tensors as arbitrary vectors, cannot exploit symmetry structure"
      falsifier: "MLP achieves same sample efficiency as equivariant methods"
    - step: 3
      description: "Equivariant methods (NFN) enforce invariance architecturally, freeing capacity"
      evidence: "NFN layers preserve permutation equivariance by construction (Zhou et al. 2023)"
      falsifier: "NFN shows no data efficiency advantage over MLP"
  key_tension: "Whether architectural inductive bias translates to measurable sample complexity reduction in practice"
  evidence_summary: |
    Theoretical justification is strong: equivariance reduces hypothesis space by
    enforcing symmetry constraints. The question is whether this theoretical
    advantage manifests empirically in the weight-to-accuracy prediction task.

