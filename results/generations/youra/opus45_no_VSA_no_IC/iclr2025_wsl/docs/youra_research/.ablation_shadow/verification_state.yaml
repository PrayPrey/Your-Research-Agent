main_hypothesis:
  id: H-EquivariantDataEfficiency-v1
  title: Data Efficiency of Permutation-Equivariant Weight Embeddings
  statement: Under fixed-architecture homogeneous model zoos (ResNet-20/CIFAR-10), permutation-equivariant architectures (NFN)
    achieve equivalent accuracy prediction R² with ≤50% of training samples compared to MLP baselines, because equivariance
    eliminates the need to learn permutation invariance from data.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: CIFAR-10
    model: ResNet-20
    optimizer: null
    hyperparameters:
      training_sizes:
      - 100
      - 250
      - 500
      - 1000
      - 2500
      - 5000
      test_size: 500
      seeds: 10
