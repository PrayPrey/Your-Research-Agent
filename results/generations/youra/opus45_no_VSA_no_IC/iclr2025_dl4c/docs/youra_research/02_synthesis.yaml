hypothesis_draft:
  title: "Scale-Dependent Error Patterns in LLM Code Judges"
  hypothesis_id: "H-ScaleJudge-v1"
  core_claim: |
    LLM code judges at different scales (7B/70B/proprietary) exhibit systematically
    different error patterns when evaluated against execution ground truth. Larger
    models achieve higher accuracy but with diminishing returns. Scale disagreement
    serves as a confidence signal, and majority-vote ensembles outperform individual judges.
  mechanism: |
    Models trained at different scales develop different heuristics for assessing code
    correctness. Smaller models rely more on surface patterns (syntax, structure), leading
    to false negatives on semantically correct but syntactically unusual code. Larger
    models capture deeper semantic relationships but may be fooled by superficially correct
    code with subtle logic errors, leading to false positives. This complementarity enables
    ensemble benefit and makes unanimous agreement a high-confidence signal.
  predictions:
    - P1: "Scale ordering with diminishing returns - 7B < 70B < proprietary accuracy; larger gap between 7B-70B than 70B-proprietary"
    - P2: "Error type clustering - FP/FN ratios significantly different across scales (chi-square p < 0.05)"
    - P3: "Ensemble improvement - majority vote ≥3% better than best single judge"
    - P4: "Agreement signal - unanimous verdicts ≥10% more accurate than split verdicts"

variables_summary:
  independent: "Judge model scale (7B, 70B, proprietary) - three tiers"
  dependent_primary: "Judge-execution agreement rate (binary match with execution outcome)"
  controlled: "Evaluation prompt (fixed), temperature (0), benchmark (HumanEval+/MBPP+)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in judge-execution agreement patterns across
    model scales. Error types (FP/FN) are uniformly distributed regardless of scale,
    and ensemble voting provides no improvement over the best single judge.
  statistical_test: "Kruskal-Wallis for P1, Chi-square for P2, McNemar for P3, z-test for P4"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Scale disagreement as confidence signal; first scale-controlled error pattern analysis"
  differentiation_summary: |
    Prior work (Crupi 2025, Wang 2025, Moon 2025) identified that LLM judges fail and
    have biases, but did not systematically compare across scale tiers or analyze
    ensemble behavior. This work fills that gap with controlled comparison and novel
    agreement-as-confidence insight.

