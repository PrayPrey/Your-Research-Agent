main_hypothesis:
  id: H-ScaleJudge-v1
  title: Scale-Dependent Error Patterns in LLM Code Judges
  statement: Under standardized code correctness evaluation settings (fixed prompt, zero temperature, HumanEval+/MBPP+ benchmarks),
    if we compare LLM judges of varying scale (7B/70B/proprietary), then (1) judge-execution agreement increases with scale
    but with diminishing returns, (2) different scales exhibit systematically different FP/FN error patterns, (3) scale-ensemble
    outperforms the best individual judge, and (4) unanimous scale agreement indicates higher verdict reliability.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: HumanEval+ (164), MBPP+ (500)
    model: DeepSeek-Coder-7B, CodeLlama-7B, CodeLlama-70B, GPT-4
    optimizer: null
    hyperparameters:
      temperature: 0
      prompt: fixed zero-shot (pilot-selected)
  baseline_comparison:
