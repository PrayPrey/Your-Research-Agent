# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Algorithmic coding problems (HumanEval+, MBPP+ style)
    - Python language
    - Zero-shot evaluation prompts
    - Single-function code snippets
    - Models with clear scale tiers (7B, 70B, proprietary)
  does_not_apply_to: |
    - Enterprise/production code
    - Multi-file projects
    - Non-Python languages (without further validation)
    - Fine-tuned or specialized code judges
    - Few-shot or chain-of-thought prompting
  known_limitations: |
    - HumanEval+/MBPP+ may not represent real-world code complexity
    - Results specific to tested models; may not generalize to future models
    - Binary correctness judgment ignores code quality, efficiency, style

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Judge-execution agreement increases with model scale but with diminishing returns"
    test_method: "Kruskal-Wallis H-test for ordinal scale effect; compare increments"
    success_criterion: "7B < 70B < proprietary agreement rates; (70B - 7B) > (proprietary - 70B)"
    falsification: "Linear or reversed ordering; proprietary shows >20% improvement over 70B"
  - id: "P2"
    primary: true
    statement: "Different scales exhibit systematically different FP/FN error ratios"
    test_method: "Chi-square test for independence: scale × error_type (FP/FN)"
    success_criterion: "Chi-square p < 0.05 showing significant association"
    falsification: "p > 0.10; FP/FN ratios statistically identical across scales"
  - id: "P3"
    primary: true
    statement: "Scale-ensemble (majority vote) outperforms the best individual judge"
    test_method: "McNemar test comparing ensemble vs best single judge"
    success_criterion: "Ensemble accuracy > best single by ≥3%"
    falsification: "Improvement < 2% or ensemble worse than best single"
  - id: "P4"
    primary: false
    statement: "Unanimous scale agreement indicates higher verdict reliability"
    test_method: "Two-proportion z-test: unanimous cases vs split cases"
    success_criterion: "Unanimous verdict accuracy > split verdict accuracy by ≥10%"
    falsification: "Difference < 5%"

