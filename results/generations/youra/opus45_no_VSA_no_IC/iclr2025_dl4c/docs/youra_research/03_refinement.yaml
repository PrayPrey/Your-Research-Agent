# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ScaleJudge-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under standardized code correctness evaluation settings (fixed prompt, zero temperature,
    HumanEval+/MBPP+ benchmarks), if we compare LLM judges of varying scale (7B/70B/proprietary),
    then (1) judge-execution agreement increases with scale but with diminishing returns,
    (2) different scales exhibit systematically different FP/FN error patterns,
    (3) scale-ensemble outperforms the best individual judge, and (4) unanimous scale agreement
    indicates higher verdict reliability, because larger models develop complementary correctness
    heuristics during training on different code distributions.
  alternative_hypothesis_h0: |
    There is no significant difference in judge-execution agreement patterns or error type
    distributions across model scales (7B, 70B, proprietary). Error types are uniformly
    distributed regardless of scale, and ensemble voting provides no accuracy improvement
    over the best single judge.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Judge Model Scale"
      type: "categorical"
      operationalization: "Model parameter count tier"
      levels: ["7B (DeepSeek-Coder-7B, CodeLlama-7B)", "70B (CodeLlama-70B)", "Proprietary (GPT-4)"]
  dependent:
    - name: "Judge-Execution Agreement Rate"
      type: "continuous"
      operationalization: "Proportion of verdicts matching execution outcome (0-1)"
      primary: true
    - name: "False Positive Rate"
      type: "continuous"
      operationalization: "P(judge=correct | execution=fail)"
      primary: false
    - name: "False Negative Rate"
      type: "continuous"
      operationalization: "P(judge=incorrect | execution=pass)"
      primary: false
    - name: "Ensemble Accuracy"
      type: "continuous"
      operationalization: "Majority-vote agreement with execution (0-1)"
      primary: false
    - name: "Unanimous Verdict Accuracy"
      type: "continuous"
      operationalization: "Accuracy when all scales agree vs when they disagree"
      primary: false
  controlled:
    - name: "Evaluation Prompt"
      operationalization: "Fixed zero-shot correctness judgment prompt (pilot-selected)"
    - name: "Temperature"
      operationalization: "Set to 0 for reproducibility"
    - name: "Benchmark"
      operationalization: "HumanEval+ and MBPP+ (existing execution-based benchmarks)"
    - name: "Execution Ground Truth"
      operationalization: "EvalPlus framework with 80x test coverage"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Models at different scales are trained on overlapping but not identical code distributions"
      evidence: "Scaling laws literature shows training data composition affects capabilities"
      falsifier: "If 7B and 70B models use identical training data, step 1 fails"
    - step: 2
      description: "Smaller models (7B) rely more on surface patterns (syntax, structure)"
      evidence: "Emergent abilities literature shows deeper reasoning requires scale"
      falsifier: "If 7B models show same semantic understanding as 70B on probing tasks"
    - step: 3
      description: "Larger models capture deeper semantic relationships but may over-generalize"
      evidence: "GPT-4 'frequently misjudges' per Crupi et al. (2025)"
      falsifier: "If larger models never make over-generalization errors"
    - step: 4
      description: "This creates complementary error patterns: small models miss subtle logic, large models fooled by superficial correctness"
      evidence: "To be verified by P2 (error clustering by scale)"
      falsifier: "If FP/FN ratios are identical across scales (chi-square p > 0.10)"
    - step: 5
      description: "Ensemble combination exploits complementarity; unanimous agreement filters high-confidence cases"
      evidence: "To be verified by P3 and P4"
      falsifier: "If ensemble accuracy <= best single judge; if unanimous != higher accuracy"
  key_tension: "Mechanism is observable-only (attention patterns not measured); causal interpretation is suggestive, not proven"
  evidence_summary: |
    The mechanism is grounded in scaling laws and emergent abilities literature. Direct evidence
    will come from P2 (error pattern differences) and P3/P4 (ensemble behavior). The 'why' of
    attention patterns is deferred to future work - this study establishes the 'what'.

