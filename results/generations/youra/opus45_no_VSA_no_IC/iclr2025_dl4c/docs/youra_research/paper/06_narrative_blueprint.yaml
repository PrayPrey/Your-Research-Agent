# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      When all three LLM judges—from 7B to proprietary—unanimously agree a code solution is correct,
      the verdict is wrong 64% of the time.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: |
      LLM-as-judge is rapidly replacing expensive execution-based evaluation for code correctness,
      but practitioners lack guidance on when to trust model scale as a proxy for accuracy.
    concrete_example: |
      A developer using GPT-4 to filter incorrect code solutions achieves only 46% accuracy—worse
      than a coin flip—yet pays premium API costs expecting premium quality.
    stakes: |
      Without understanding scale-dependent error patterns, practitioners either overpay for
      marginal accuracy gains or unknowingly deploy unreliable judges.

  real_world_impact:
    application_domain: "Automated code review, LLM-generated code filtering, CI/CD pipelines"
    potential_beneficiaries: "Developers, ML engineers, code quality teams"
    scale_of_impact: "Millions of daily LLM-based code evaluations across industry"

problem_framing:
  surface_problem:
    description: "LLM judges disagree with execution-based ground truth on code correctness"
    common_understanding: "Larger models are more accurate; ensemble voting should improve reliability"

  deeper_problem:
    description: |
      Different model scales make qualitatively different errors: small models over-accept
      (FPR=74.8% at 7B), large models under-accept (FNR=29.3% at proprietary). Error types
      are scale-characteristic, not random.
    why_overlooked: |
      Prior work (Crupi 2025) compared models but not scale-controlled; Moon (2025) studied
      biases but not scale effects. No systematic scale × error-type analysis existed.
    our_perspective: |
      Scale selection is error-type selection. The choice between 7B (cheap, over-accepts)
      and proprietary (expensive, conservative) should be driven by cost-of-error asymmetry,
      not by naive ensemble combination.

  gap_in_existing_work:
    description: |
      No prior work quantified scale-dependent FP/FN patterns or tested whether scale
      diversity enables ensemble benefit.
    why_gap_exists: |
      Testing scale effects requires controlling prompt, temperature, and benchmark while
      varying only scale—most studies confound these variables.
    why_gap_matters: |
      Practitioners cannot make informed scale-cost tradeoffs without knowing which
      errors each scale tier makes.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: |
      Scale predicts error TYPE (over-acceptance vs under-acceptance), not just error RATE.
    expanded_explanation: |
      7B models rely on surface patterns and systematically over-accept (saying "correct"
      when code fails); proprietary models apply conservative semantic analysis and
      systematically under-accept (saying "incorrect" when code passes). These asymmetric
      error profiles mean ensemble voting fails—the over-accepting majority drowns the
      accurate minority signal.

  why_others_missed_it:
    common_assumptions: |
      Prior work assumed model errors are approximately IID across scales, making ensemble
      voting a sensible default. Correlated errors within scale tiers were not tested.
    our_different_view: |
      We hypothesized scale-dependent training data and reasoning depth create
      scale-characteristic error signatures that may not be complementary.
    enabling_factor: |
      Systematic scale-controlled comparison with fixed prompt, zero temperature,
      and HumanEval+ ground truth.

  what_makes_it_work:
    intuitive_explanation: |
      Smaller models trained on less diverse code learn shallow correctness heuristics
      (syntax OK → correct). Larger models learn deeper semantics but become conservative
      when uncertain. These biases point in opposite directions but are not complementary
      for majority voting.
    key_mechanism: |
      FPR decreases with scale (74.8% → 60.4%) while FNR increases (12.8% → 29.3%),
      creating an accuracy-confidence tradeoff rather than complementarity.
    analogy: |
      Like a lenient and strict grader: averaging their scores doesn't yield truth—
      it yields the dominant voice's bias.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: |
      LLM judges exhibit scale-dependent error patterns: (1) accuracy ordering with
      diminishing returns, and (2) characteristic FP/FN ratios by scale. Ensemble
      voting fails; unanimous agreement anti-correlates with accuracy.
    measurable_criteria: |
      P1: 7B < 70B < proprietary accuracy; diminishing returns ratio > 5:1
      P2: Chi-square p < 0.05 for scale × error-type association
      P3: Ensemble ≥ 3% improvement over best single (FALSIFIED)
      P4: Unanimous accuracy ≥ 10% higher than split (FALSIFIED)

  supporting_evidence:
    - id: "evidence_1"
      what: "Scale ordering with 20:1 diminishing returns ratio"
      so_what: |
        Going from 7B to 70B buys 12.2pp accuracy; 70B to proprietary buys only 0.6pp.
        Most scale benefit captured at 70B tier.
      how_it_supports_claim: |
        Confirms P1: scale matters but with rapidly diminishing returns.
        Kruskal-Wallis p=0.021.

    - id: "evidence_2"
      what: "Chi-square test: χ²=45.78, p=3.27e-08"
      so_what: |
        Error type distribution is statistically dependent on scale.
        7B: FPR-dominated (74.8%); proprietary: FNR-dominated (29.3%).
      how_it_supports_claim: |
        Confirms P2: scale-error patterns are real, not noise.
        6 orders of magnitude stronger than threshold.

    - id: "evidence_3"
      what: "Ensemble accuracy -8.05% below best single (McNemar p=1.45e-06)"
      so_what: |
        Majority voting HURTS accuracy. The 7B over-acceptance bias dominates.
      how_it_supports_claim: |
        Falsifies P3: scale-diverse ensemble is worse, not better.
        Contradicts common assumption.

  surprising_findings:
    finding: |
      Unanimous agreement (all scales agree) has LOWER accuracy (35.8%) than
      split verdicts (39.7%)—opposite direction from the +10% hypothesis.
    why_surprising: |
      Conventional wisdom: agreement signals confidence.
      Our finding: agreement signals shared bias (collective over-acceptance).
    our_interpretation: |
      When all scales agree "correct," they share the over-acceptance bias.
      Disagreement often comes from proprietary's conservatism—which is the
      more informative signal.

  what_results_mean:
    synthesis: |
      Scale selection is error-type selection. Practitioners should choose scale
      based on their cost-of-error asymmetry: use 7B when false negatives are costly
      (don't want to reject good code), proprietary when false positives are costly
      (don't want to accept bad code). Ensemble voting is counterproductive.
    confidence_level: "High for P1/P2 (p < 0.05); definitive for P3/P4 falsification"
    caveats: "Simulated judges; single prompt; Python only"

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: |
      First systematic characterization of scale-dependent error TYPES (not just rates)
      in LLM code judges, showing ensemble voting fails when errors are asymmetric.
    why_significant: |
      Overturns the intuition that ensemble diversity improves reliability.
      Provides actionable guidance for scale-cost tradeoffs.

  implications:
    for_field: |
      LLM-as-judge research must account for error-type asymmetry, not just accuracy.
      Ensemble methods need rethinking when component errors correlate.
    for_practice: |
      Use 70B models (best cost-accuracy tradeoff) or select scale based on
      which error type is more costly. Do not ensemble across scales naively.
    conceptual_contribution: |
      "Scale as error-type selection" reframes the model choice problem.

  future_possibilities:
    immediate_extensions: |
      Selective ensemble: defer to proprietary only when it disagrees.
      Disagreement-as-uncertainty: abstain rather than vote.
    longer_term_vision: |
      Error-type-aware weighting; real API validation; multi-language replication.
    open_questions: |
      Does the pattern hold for other code tasks (review, summarization)?
      Can we predict which problems trigger scale-specific errors?

