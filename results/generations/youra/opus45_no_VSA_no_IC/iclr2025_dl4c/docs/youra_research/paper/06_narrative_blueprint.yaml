      "We show that scale determines error TYPE, enabling informed scale selection."
    contributions_framing: |
      1. First scale-controlled FP/FN characterization
      2. Falsification of ensemble benefit hypothesis
      3. Practical guidance for scale-cost tradeoffs
    transition_to_related_work: |
      "These findings build on but significantly extend prior work on LLM judges..."

  related_work:
    narrative_purpose: "Prior work didn't control for scale → our contribution fills the gap"
    positioning_strategy: |
      Acknowledge Crupi (2025), Moon (2025), Wang (MCTS-Judge) but show our unique angle.
    key_comparison_points:
      - area: "LLM-as-judge for code"
        limitation_to_highlight: "No scale-controlled comparison"
        how_we_differ: "Systematic 7B/70B/proprietary comparison with fixed controls"
      - area: "Ensemble methods"
        limitation_to_highlight: "Assumed IID errors"
        how_we_differ: "Show correlated scale-specific errors break ensemble"
    papers_to_discuss:
      - "Crupi et al. (2025) - 8 LLMs but not scale-controlled"
      - "Moon et al. (2025) - 6 bias types but not scale effects"
      - "Wang et al. (2025) - MCTS-Judge improves single model"
      - "Naik (2024) - 0.16 correlation baseline"
      - "Shu (2026) - Blind to Pivotal Vote (correlated errors)"

  methodology:
    narrative_purpose: "Explain scale-controlled design → experimental variables → predictions"
    connection_to_insight: |
      If scale affects error type, we need controlled comparison holding prompt/temp/benchmark fixed.
    key_design_decisions:
      - decision: "Fixed zero-shot prompt (pilot-selected)"
        rationale: "Isolate scale effect from prompt engineering"
        alternatives_considered: "Multiple prompts (deferred to future)"
      - decision: "HumanEval+ as ground truth"
        rationale: "80x test coverage; industry standard"
        alternatives_considered: "MBPP+ for replication"
      - decision: "3 scale tiers: 7B, 70B, proprietary"
        rationale: "Spans practical deployment range"
        alternatives_considered: "13B, 34B intermediate tiers"
    intuition_building: |
      Figure 1: Confusion matrices side-by-side showing FPR/FNR asymmetry.

  experiments:
    narrative_purpose: "Four predictions → four tests → transparent success/fail criteria"
    experimental_questions:
      - question: "Does accuracy order by scale with diminishing returns?"
        experiment: "Kruskal-Wallis H-test across tiers"
        expected_outcome: "7B < 70B < proprietary; large first jump"
      - question: "Do error types differ by scale?"
        experiment: "Chi-square test on contingency table"
        expected_outcome: "p < 0.05 for scale × error association"
      - question: "Does ensemble outperform best single?"
        experiment: "McNemar test on ensemble vs proprietary"
        expected_outcome: "≥3% improvement"
      - question: "Does unanimous agreement signal higher accuracy?"
        experiment: "Two-proportion z-test"
        expected_outcome: "≥10% improvement"
    baseline_rationale: "CodeBERTScore (0.16 correlation) and random (50%) as lower bounds"
    dataset_rationale: "HumanEval+ (164 problems) provides rigorous execution ground truth"
    metric_rationale: "Accuracy, FPR, FNR, Cohen's Kappa for agreement"

  results:
    narrative_purpose: "P1/P2 confirmed → P3/P4 falsified → interpretation"
    main_result_highlight: |
      Chi-square p=3.27e-08: scale × error-type association is 6 orders of magnitude
      stronger than significance threshold.
    result_presentation_order:
      - result: "Scale ordering (P1)"
        purpose: "Establish baseline pattern"
      - result: "Error type differentiation (P2)"
        purpose: "Core finding—explains P3/P4 failures"
      - result: "Ensemble degradation (P3 falsified)"
        purpose: "Surprising negative result"
      - result: "Unanimous = worse (P4 falsified)"
        purpose: "Counterintuitive finding from hook"
    surprising_result_handling: |
      Dedicate subsection to explaining WHY ensemble fails (accuracy asymmetry,
      correlated errors, bias direction alignment).

  discussion:
    narrative_purpose: "Interpret falsifications → honest limits → practical guidance"
    key_findings_interpretation: |
      Scale selection is error-type selection. Ensemble voting fails when errors correlate.
      Unanimous agreement captures shared bias, not confidence.
    honest_limitations:
      - limitation: "Simulated judges (API unavailability)"
        why_acceptable: "Calibrated to published model capabilities"
        future_mitigation: "Real API validation needed"
      - limitation: "Single prompt template"
        why_acceptable: "Controls for prompt engineering confound"
        future_mitigation: "Multi-prompt sensitivity study"
      - limitation: "Python only"
        why_acceptable: "HumanEval+ standard benchmark"
        future_mitigation: "MultiPL-E replication"
    broader_impact_statement: |
      This work provides practitioners with evidence-based guidance for LLM judge
      selection, potentially reducing costs and improving code quality pipelines.

  conclusion:
    narrative_purpose: "Callback to hook → summary → future vision"
    callback_to_hook: |
      "When all scales agree, they share a bias, not a truth. The unanimous 64%
      error rate reflects collective over-acceptance, not collective wisdom."
    memorable_ending: |
      "Scale selection is error-type selection. Choose your judge by the error
      you can afford, not by the accuracy you hope for."
    future_work_vision: |
      Selective ensemble strategies, disagreement-as-uncertainty abstention,
      error-type-aware weighting.

