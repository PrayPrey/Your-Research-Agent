main_hypothesis:
  id: H-RankingStability-v1
  title: Cross-Benchmark Ranking Stability Analysis
  statement: Under controlled evaluation conditions, if we evaluate ImageNet models on ImageNet-V2, then model rankings will
    shift significantly (Kendall-τ < 0.90), because iterative community optimization on popular benchmarks creates benchmark-specific
    adaptations that don't transfer to novel test distributions.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: ImageNet + ImageNet-V2
    model: ImageNet classification models (2015-2024)
    optimizer: null
    hyperparameters:
      evaluation_protocol: Top-1 accuracy, center crop
      model_count: 100+
