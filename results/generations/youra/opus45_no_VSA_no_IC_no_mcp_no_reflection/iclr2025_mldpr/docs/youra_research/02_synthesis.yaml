hypothesis_draft:
  title: "Cross-Benchmark Ranking Stability Analysis"
  hypothesis_id: "H-RankingStability-v1"
  core_claim: |
    Model rankings on popular ML benchmarks (ImageNet) are not preserved on
    semantically-similar alternative benchmarks (ImageNet-V2), indicating
    benchmark-specific overfitting affects model selection decisions.
  mechanism: |
    1. Popular benchmarks receive concentrated research attention
    2. Iterative model development optimizes for benchmark-specific features
    3. These optimizations don't transfer to independently-collected test sets
    4. Result: Rankings shift when evaluated on alternative benchmarks
  predictions:
    - P1: "Kendall-τ < 0.90 between ImageNet and ImageNet-V2 rankings"
    - P2: "Top-10 overlap < 80% between benchmark rankings"
    - P3: "Negative publication year coefficient in temporal regression"

variables_summary:
  independent: "Benchmark variant (ImageNet vs ImageNet-V2), Model publication year (2015-2024)"
  dependent_primary: "Kendall-τ ranking correlation, Top-10 overlap percentage"
  controlled: "Architecture family, model parameters, training data source"

null_hypothesis:
  h0_statement: |
    There is no significant difference in model rankings between ImageNet and ImageNet-V2;
    Kendall-τ ≥ 0.95 indicating rankings are essentially preserved.
  statistical_test: "Kendall tau-b correlation with permutation test for significance"
  significance_level: 0.001

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic ranking correlation analysis (vs accuracy drops) between benchmark variants"
  differentiation_summary: |
    Prior work (Recht 2019) measured accuracy drops; we measure ranking correlations.
    Prior work (Dehghani 2021) analyzed task selection in NLU; we analyze model rankings.
    This directly addresses whether benchmark overfitting affects model selection.

