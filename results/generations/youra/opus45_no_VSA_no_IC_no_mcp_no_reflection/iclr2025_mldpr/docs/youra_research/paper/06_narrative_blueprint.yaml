# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "While prior work shows models lose 10-14% accuracy when evaluated on ImageNet-V2, we find their relative rankings remain remarkably stable (Kendall-τ = 0.96)."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Model selection decisions based on ImageNet benchmarks remain valid despite distribution shift"
    concrete_example: "If you chose Model A over Model B based on ImageNet accuracy, that decision holds for ImageNet-V2 with 96% rank correlation"
    stakes: "Practitioners can trust benchmark rankings for model selection even on novel test distributions"

  anti_patterns_avoided:
    - "NOT: 'Deep learning has achieved remarkable success...'"
    - "NOT: 'Benchmark overfitting is an important problem...'"
    - "USED: Counterintuitive finding that challenges reader expectations"

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Models experience significant accuracy drops (11-14%) on independently-collected benchmark variants like ImageNet-V2"
    common_understanding: "This is often interpreted as evidence of benchmark-specific overfitting"
    source: "Recht et al. (2019)"

  deeper_problem:
    description: "The critical question is not WHETHER accuracy drops occur, but WHETHER rankings shift—which affects model selection decisions"
    why_overlooked: "Prior work focused on absolute accuracy degradation, not ordinal ranking stability"
    our_perspective: "Ranking stability matters more than absolute accuracy for practical model selection"

  gap_in_existing_work:
    description: "No systematic computation of Kendall-τ ranking correlation between ImageNet and ImageNet-V2 model leaderboards"
    why_gap_exists: "Research emphasis on accuracy metrics over ranking metrics"
    why_gap_matters: "If rankings remain stable despite accuracy drops, benchmark-based model selection remains valid"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Ranking stability (τ = 0.96) coexists with accuracy degradation (11.68%): distribution shift affects all models approximately equally, preserving ordinal model quality."
    expanded_explanation: |
      While all models lose ~11% accuracy on ImageNet-V2, they lose it proportionally.
      A model ranked 10th on ImageNet is still approximately 10th on ImageNet-V2.
      This uniform degradation preserves relative rankings even though absolute accuracy drops.

  why_others_missed_it:
    common_assumptions: "Accuracy drops imply ranking instability; benchmark-specific optimizations create differential vulnerability"
    our_different_view: "We tested ranking stability directly rather than inferring from accuracy changes"
    enabling_factor: "Systematic Kendall-τ computation across 96 models with both ImageNet and V2 results"

  what_makes_it_work:
    intuitive_explanation: "Think of it like a class where everyone's grades drop by 10%—the class rank stays the same"
    key_mechanism: "Uniform degradation across models preserves ordinal relationships"

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Model rankings are highly preserved between ImageNet and ImageNet-V2 (Kendall-τ = 0.96, p < 10⁻⁴⁰)"
    measurable_criteria: "τ significantly above our threshold of 0.90; 95% CI [0.9454, 0.9795] entirely excludes threshold"

  supporting_evidence:
    - id: "evidence_1"
      what: "Kendall-τ = 0.9647 with p = 1.58e-43"
      so_what: "Rankings are statistically near-perfectly correlated"
      how_it_supports_claim: "Primary metric directly tests ranking stability hypothesis"

    - id: "evidence_2"
      what: "95% CI [0.9454, 0.9795] entirely above 0.90 threshold"
      so_what: "High confidence that true correlation exceeds our a priori threshold"
      how_it_supports_claim: "Robust statistical inference; result not due to sampling variance"

    - id: "evidence_3"
      what: "Mean accuracy drop = 11.68%, max rank change = 9 positions"
      so_what: "Despite substantial accuracy drops, rank changes are minimal"
      how_it_supports_claim: "Demonstrates uniform degradation mechanism"

    - id: "evidence_4"
      what: "Spearman-ρ = 0.9964 confirms finding"
      so_what: "Alternative ranking metric agrees with Kendall-τ"
      how_it_supports_claim: "Robustness check; result not metric-dependent"

  surprising_findings:
    finding: "Original hypothesis (τ < 0.90) was refuted—rankings are MORE stable than expected"
    why_surprising: "Prior work emphasized accuracy drops, implying rankings should shift"
    our_interpretation: "Accuracy drops are uniform across models; benchmark-specific adaptations, if present, affect all models equally"

# =============================================================================
# BROADER IMPACT / TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First systematic measurement showing ranking stability can coexist with accuracy degradation under distribution shift"
    why_significant: "Validates benchmark-based model selection for ImageNet-V2-like distributions"

  implications:
    for_field: "Refines understanding of 'benchmark overfitting'—accuracy drops ≠ ranking instability"
    for_practice: "Practitioners can trust ImageNet rankings when selecting models for deployment"

  future_possibilities:
    immediate_extensions: "Test ranking stability on other distribution shifts (ObjectNet, ImageNet-Sketch, ImageNet-R)"
    longer_term_vision: "Develop theory of when ranking stability holds vs. breaks under distribution shift"

# =============================================================================
# SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail"
    key_message: "Rankings remain stable (τ = 0.96) despite accuracy drops; model selection decisions generalize"
    structure: "Problem → What we tested → Surprising finding → Implication"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Prior work established accuracy drops but did not measure ranking stability"
    contributions:
      - "First systematic Kendall-τ analysis across 96 ImageNet/V2 models"
      - "Evidence that accuracy degradation is uniform, preserving rankings"
      - "Practical implication: benchmark-based model selection remains valid"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "Extend Recht et al. from accuracy measurement to ranking stability"
    key_comparison_points:
      - "Recht 2019: accuracy drops, but no ranking analysis"
      - "Dehghani 2021: benchmark lottery in NLU, not cross-variant ranking"
      - "Taori 2020: effective robustness linear relationship, consistent with our uniform degradation"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem"
    connection_to_insight: "To test ranking stability, we compute Kendall-τ between benchmark leaderboards"
    key_design_decisions:
      - "96 models with both ImageNet and V2 results from Papers With Code"
      - "Kendall-τ chosen for ordinal ranking comparison (robust to ties)"
      - "Bootstrap CI (10,000 iterations) for uncertainty quantification"
      - "A priori threshold τ < 0.90 based on prior ranking stability literature"

  experiments:
    narrative_purpose: "Design tests that verify our specific claims"
    experimental_questions:
      - "Q1: Is Kendall-τ < 0.90 (our threshold for 'significant shift')?"
      - "Q2: How confident are we in the correlation estimate?"
      - "Q3: What is the distribution of per-model rank changes?"

  results:
    narrative_purpose: "Present evidence supporting claims"
    main_result_highlight: "τ = 0.9647 with 95% CI [0.9454, 0.9795], rejecting our original hypothesis"
    figure_strategy:
      - "Fig 1 (ranking_scatter): Visual demonstration of tight correlation"
      - "Fig 2 (accuracy_drop): Uniform drop distribution explains ranking preservation"
      - "Fig 3 (rank_change_distribution): Minimal rank changes"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits"
    honest_limitations:
      - "Only ImageNet → ImageNet-V2 tested; other shifts may differ"
      - "96 models may not represent full population (selection bias)"
      - "Original hypothesis refuted—null result, but scientifically valuable"
    broader_impact: "Validates benchmark-based model selection; contributes to understanding distribution shift"

  conclusion:
    narrative_purpose: "Reinforce message, open future"
    callback_to_hook: "Contrary to intuition from accuracy drops, rankings are remarkably stable"
    future_work:
      - "Test ranking stability on ObjectNet, ImageNet-Sketch, ImageNet-R"
      - "Architecture-stratified analysis (ResNet vs ViT)"
      - "Develop theory of ranking stability under distribution shift"

