# Section 0: Established Facts
established_facts:
  claims:
    - claim: "Models show 11-14% accuracy drops on ImageNet-V2 vs ImageNet"
      status: "BUILD_ON"
      evidence: "Recht et al. (2019)"
    - claim: "Top 10% of datasets account for 90% of benchmark usage"
      status: "BUILD_ON"
      evidence: "Reduced/Reused/Recycled (2021)"
    - claim: "Benchmark selection affects model rankings in NLU"
      status: "BUILD_ON"
      evidence: "Dehghani et al. (2021) - Benchmark Lottery"
    - claim: "Kendall-τ ranking correlation between ImageNet and ImageNet-V2 has not been systematically computed"
      status: "PROVE_NEW"
      evidence: "Gap identified in Phase 1 literature review"
    - claim: "Temporal correlation between model publication date and ranking stability is unknown"
      status: "PROVE_NEW"
      evidence: "Gap 2 from Phase 1"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims provide evidence foundation. Focus validation on PROVE_NEW claims:
    computing Kendall-τ and testing temporal correlation.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-RankingStability-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under controlled evaluation conditions (same models, same task semantics),
    if we evaluate ImageNet models on an independently-collected benchmark variant (ImageNet-V2),
    then model rankings will shift significantly (Kendall-τ < 0.90),
    because iterative community optimization on popular benchmarks creates benchmark-specific
    adaptations that don't transfer to novel test distributions.
  alternative_hypothesis_h0: |
    There is no significant difference in model rankings between ImageNet and ImageNet-V2;
    Kendall-τ ≥ 0.95 indicating rankings are essentially preserved across benchmark variants.

# Section 1.2: Variables
variables:
  independent:
    - name: "Benchmark Variant"
      type: "categorical"
      operationalization: "ImageNet (original) vs ImageNet-V2 (independently collected)"
      levels: ["ImageNet", "ImageNet-V2"]
    - name: "Model Publication Year"
      type: "continuous"
      operationalization: "Year paper introducing the model was published (2015-2024)"
  dependent:
    - name: "Ranking Stability (Kendall-τ)"
      type: "continuous"
      operationalization: "Kendall tau-b correlation coefficient between model rankings on ImageNet vs ImageNet-V2"
      primary: true
    - name: "Top-10 Overlap"
      type: "continuous"
      operationalization: "Percentage of ImageNet Top-10 models appearing in ImageNet-V2 Top-10"
      primary: false
  controlled:
    - name: "Architecture Family"
      operationalization: "Categorical grouping: ResNet, ViT, ConvNeXt, EfficientNet, Other"
    - name: "Model Parameters"
      operationalization: "Log-transformed parameter count"
    - name: "Training Data"
      operationalization: "Binary: ImageNet-1K only vs additional pretraining (ImageNet-21K, etc.)"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Popular benchmarks receive concentrated research attention (top 10% = 90% usage)"
      evidence: "Reduced/Reused/Recycled (2021) - documented concentration"
      falsifier: "If benchmark usage were uniformly distributed, no concentration effect"
    - step: 2
      description: "Iterative model development optimizes for benchmark-specific features (augmentation, architecture tweaks, hyperparameters)"
      evidence: "Implicit knowledge transfer through papers, shared training recipes, benchmark-focused competitions"
      falsifier: "If models were developed blind to benchmark characteristics, no specific adaptation"
    - step: 3
      description: "Benchmark-specific optimizations don't transfer to independently-collected test sets with slightly different distribution characteristics"
      evidence: "Recht et al. (2019) - 11-14% accuracy drops on ImageNet-V2"
      falsifier: "If drops were uniform across all models, rankings would be preserved"
    - step: 4
      description: "Non-uniform performance degradation causes rankings to shift between original and alternative benchmarks"
      evidence: "To be tested - the core hypothesis prediction"
      falsifier: "If Kendall-τ ≥ 0.95, rankings are preserved despite accuracy drops"
  key_tension: "Whether accuracy drops are uniform (preserving rankings) or differential (causing ranking shifts)"
  evidence_summary: |
    Prior work established accuracy drops (Recht 2019) and benchmark concentration (Reduced/Reused 2021).
    The missing piece is whether these drops are uniform or cause ranking shifts - directly tested by this hypothesis.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "ImageNet-V2 results from different papers are comparable (same evaluation protocol)"
    supporting_evidence: "Recht et al. released standardized evaluation code widely adopted by subsequent papers"
    consequence_if_violated: "Ranking correlations would be confounded by protocol differences; mitigation: verify evaluation protocol in papers"
  - id: "A2"
    assumption: "Papers With Code leaderboard data accurately reflects published results"
    supporting_evidence: "Papers With Code is the standard community resource, regularly updated"
    consequence_if_violated: "Data collection errors; mitigation: cross-validate with original papers"
  - id: "A3"
    assumption: "Model publication year is a reasonable proxy for exposure to benchmark-specific knowledge"
    supporting_evidence: "Cumulative community knowledge increases over time; more papers = more optimization"
    consequence_if_violated: "Temporal effect could reflect other trends; mitigation: multivariate controls"
  - id: "A4"
    assumption: "Kendall-τ is an appropriate metric for ranking stability"
    supporting_evidence: "Standard metric in statistics for comparing rankings; robust to ties"
    consequence_if_violated: "Results might not capture practically important ranking changes; mitigation: also report Top-K overlap"
  - id: "A5"
    assumption: "Selection of models with ImageNet-V2 results is not severely biased"
    supporting_evidence: "ImageNet-V2 evaluation has become standard in generalization-focused papers"
    consequence_if_violated: "Results may understate true population effect; mitigation: note potential selection bias"

# Section 1.5: Scope
scope:
  applies_to: |
    - Image classification models evaluated on ImageNet and ImageNet-V2
    - Models published between 2015-2024 with available benchmark results
    - Standard evaluation protocols (top-1 accuracy, center crop or 10-crop as specified)
  does_not_apply_to: |
    - Object detection or segmentation models
    - Models without published ImageNet-V2 results
    - Non-vision benchmarks (NLP, audio) - though similar analysis could extend to them
  known_limitations: |
    - Limited to models where researchers chose to evaluate on V2 (potential selection bias)
    - ImageNet-V2 is one specific alternative; results may differ for other variants
    - Temporal analysis limited by available model publication dates

# Section 1.6: Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Kendall-τ correlation between ImageNet and ImageNet-V2 model rankings is significantly below 1.0, indicating ranking instability"
    test_method: "Compute Kendall-τ between ImageNet accuracy rankings and ImageNet-V2 accuracy rankings for all models with both results"
    success_criterion: "τ < 0.90 with 95% CI not including 0.95, p < 0.001"
    falsification: "τ ≥ 0.95 would indicate rankings are essentially preserved"
  - id: "P2"
    primary: false
    statement: "Top-10 overlap between ImageNet and ImageNet-V2 rankings is below 80%"
    test_method: "Identify Top-10 models by ImageNet accuracy; count how many appear in Top-10 by ImageNet-V2 accuracy"
    success_criterion: "Overlap < 80% (at most 7 of 10 appear in both Top-10 lists)"
    falsification: "Overlap ≥ 90% would indicate top performers are stable"
  - id: "P3"
    primary: false
    statement: "Newer models show less ranking stability than older models"
    test_method: "Multivariate regression: pairwise_agreement ~ publication_year + architecture + log(params)"
    success_criterion: "β_year < 0 with p < 0.05 after controlling for architecture and parameters"
    falsification: "β_year ≥ 0 or p ≥ 0.05 would indicate no temporal effect"

