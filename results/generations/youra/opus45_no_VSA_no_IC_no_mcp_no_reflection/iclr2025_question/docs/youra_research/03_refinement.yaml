# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-UQ-Compare-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under decoder-only LLMs (7-13B parameters), if we compare token entropy,
    semantic entropy, P(True), and SelfCheckGPT on identical TruthfulQA/HaluEval splits,
    then (1) semantic entropy achieves highest overall AUROC, (2) method rankings vary
    across hallucination categories, and (3) semantic clustering produces more separable
    score distributions, because semantic entropy captures meaning-level consistency
    while token entropy only captures surface-level confidence.
  alternative_hypothesis_h0: |
    There is no significant difference (>3 AUROC points) between UQ methods for
    hallucination detection, and method rankings are consistent across all hallucination
    categories.

