key_assumptions:
  - id: "A1"
    assumption: "TruthfulQA and HaluEval labels are accurate ground truth"
    supporting_evidence: "Both benchmarks are peer-reviewed and widely used"
    consequence_if_violated: "AUROC scores would be unreliable"
  - id: "A2"
    assumption: "10 samples per query is sufficient for multi-sample methods"
    supporting_evidence: "Kuhn 2023 uses 5-10 samples; SelfCheckGPT uses 5-20"
    consequence_if_violated: "May underestimate multi-sample method performance"
  - id: "A3"
    assumption: "Method implementations from public repos are correct"
    supporting_evidence: "semantic_uncertainty, selfcheckgpt are author-released"
    consequence_if_violated: "Results may not reflect true method performance"
  - id: "A4"
    assumption: "HaluEval subtask categories capture meaningful hallucination types"
    supporting_evidence: "Categories based on task domain (QA, dialogue, summarization)"
    consequence_if_violated: "P2 (category variation) may not reveal hallucination-type patterns"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Decoder-only LLMs in 7-13B parameter range
    - English factuality benchmarks (TruthfulQA, HaluEval)
    - Four UQ methods: token entropy, semantic entropy, P(True), SelfCheckGPT
  does_not_apply_to: |
    - Encoder-decoder models (T5, BART)
    - Models >70B parameters (may have different calibration)
    - Non-English benchmarks
    - Proprietary closed-source models (GPT-4, Claude)
  known_limitations: |
    - Results may not generalize beyond tested models (Llama-3, Mistral)
    - Category analysis limited to HaluEval's three subtasks
    - Does not test instruction-tuned vs. base model differences

