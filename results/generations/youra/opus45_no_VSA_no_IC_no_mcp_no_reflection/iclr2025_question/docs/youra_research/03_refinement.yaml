    - name: "Benchmark Splits"
      operationalization: "Identical train/test splits across all methods"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "LLM generates output with varying confidence levels"
      evidence: "Standard decoder behavior; confidence varies by query"
      falsifier: "If LLM always outputs uniform confidence, mechanism breaks"
    - step: 2
      description: "UQ method extracts uncertainty signal from generation process"
      evidence: "Each method computes scores: token entropy from logits, semantic entropy from clustered samples, etc."
      falsifier: "If UQ scores are random/uncorrelated with output quality, mechanism fails"
    - step: 3
      description: "Uncertainty signal correlates with hallucination status"
      evidence: "Prior work shows correlation exists; question is which signal is strongest"
      falsifier: "If AUROC ≈ 0.5 for all methods, no method detects hallucinations"
  key_tension: "Semantic entropy requires costly NLI clustering; unclear if benefit justifies cost"
  evidence_summary: |
    Kuhn 2023 shows semantic entropy beats token entropy on their split.
    Manakul 2023 shows SelfCheckGPT works for factual consistency.
    No study compares all four on identical controlled conditions.

