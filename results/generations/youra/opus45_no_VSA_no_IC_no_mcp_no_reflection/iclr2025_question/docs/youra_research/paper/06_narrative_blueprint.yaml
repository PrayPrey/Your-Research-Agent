    - id: "fig_auroc_comparison"
      type: "bar_chart"
      content: "AUROC comparison: max_prob (0.81), choice_entropy (0.77), semantic_entropy (0.56)"
      section: "results"
      note: "Generate from metrics if not available from Phase 4/5"

    - id: "fig_mechanism_verification"
      type: "histogram or box plot"
      content: "Cluster count distribution showing mechanism active (avg 4.92)"
