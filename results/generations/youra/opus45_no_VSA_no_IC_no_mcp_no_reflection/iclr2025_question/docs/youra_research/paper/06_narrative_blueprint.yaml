# Phase 6: Narrative Blueprint
# Story-first paper design from Phase 4.5 synthesis
# Generated: 2026-08-29

metadata:
  workflow: "phase6-paper-writing"
  source: "045_validated_hypothesis.md"
  hypothesis_id: "H-UQ-Compare-v1"

# ═══════════════════════════════════════════════════════════════
# SECTION 1: HOOK DESIGN
# ═══════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      Semantic entropy, celebrated for capturing 'meaning-level uncertainty' in language
      models, underperforms a simple confidence score by 24 AUROC points on multiple-choice
      hallucination detection.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Method complexity does not guarantee better hallucination detection"
    concrete_example: "max_prob (AUROC=0.81) vs semantic_entropy (AUROC=0.56) on TruthfulQA mc1"
    stakes: "Practitioners may waste compute on sophisticated methods that underperform simple baselines"

  anti_patterns_avoided:
    - "NOT: 'LLMs have achieved remarkable success...'"
    - "NOT: 'Hallucination detection is an important problem...'"
    - "INSTEAD: Specific counterintuitive finding with numbers"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: PROBLEM FRAMING (3 Levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "LLMs produce hallucinations that are difficult to detect automatically"
    common_understanding: "Uncertainty quantification (UQ) methods can signal when models are unreliable"
    prior_work_consensus: "Semantic entropy outperforms token entropy (Kuhn 2023)"

  deeper_problem:
    description: "UQ method effectiveness may depend on task format, not just algorithmic sophistication"
    why_overlooked: "Prior comparisons used different benchmarks, splits, and evaluation protocols"
    our_perspective: "No controlled head-to-head comparison exists on identical conditions"

  gap_in_existing_work:
    description: "No systematic study of UQ method performance across task formats"
    why_gap_exists: "Each method paper used its own favorable evaluation setup"
    why_gap_matters: "Practitioners cannot select appropriate methods for their use case"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: |
      UQ method effectiveness is format-dependent: simple confidence-based methods dominate
      for multiple-choice hallucination detection, while semantic entropy's NLI-based
      clustering cannot extract meaningful signal from single-letter answers.
    expanded_explanation: |
      Semantic entropy clusters semantically equivalent responses via NLI models, then
      computes entropy over clusters. This mechanism works correctly (we verified clustering
      occurs with avg 4.92 clusters from 5 samples). However, MC answers are single letters
      (A/B/C/D) with no semantic content for NLI comparison. The mechanism is sound but
      the task format breaks the signal.

  why_others_missed_it:
    common_assumptions: "More sophisticated = better performance"
    our_different_view: "Format compatibility matters more than algorithmic complexity"
    enabling_factor: "First controlled comparison on identical MC benchmark conditions"

  what_makes_it_work:
    intuitive_explanation: "NLI models cannot meaningfully compare 'A' vs 'B' as answers"
    key_mechanism: "Token-level methods extract signal directly from logits; no format dependency"

# ═══════════════════════════════════════════════════════════════
# SECTION 4: EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Token-level UQ methods effectively detect hallucinations on MC format while semantic entropy fails"
    measurable_criteria: "max_prob AUROC > 0.70 AND semantic_entropy AUROC < 0.60"

  supporting_evidence:
    - id: "evidence_1"
      what: "max_prob achieves AUROC = 0.8068 on TruthfulQA mc1"
      so_what: "Simplest method achieves strongest discrimination"
      how_it_supports_claim: "Proves token-level methods work for MC hallucination detection"
      source: "h-e1 validation"

    - id: "evidence_2"
      what: "choice_entropy achieves AUROC = 0.7703"
      so_what: "Entropy over choices also works well"
      how_it_supports_claim: "Second token-level method confirms pattern"
      source: "h-e1 validation"

    - id: "evidence_3"
      what: "semantic_entropy achieves AUROC = 0.5645 despite active clustering"
      so_what: "Mechanism works but signal non-discriminative"
      how_it_supports_claim: "Demonstrates format dependency, not implementation failure"
      source: "h-m1 validation"

    - id: "evidence_4"
      what: "Mechanism verification: avg 4.92 clusters from 5 samples, entropy variance > 0"
      so_what: "Clustering functions correctly; low AUROC not from broken implementation"
      how_it_supports_claim: "Isolates format mismatch as root cause"
      source: "h-m1 validation"

  surprising_findings:
    - finding: "Semantic entropy underperforms by 0.24 AUROC points despite higher complexity"
      why_surprising: "Kuhn 2023 showed semantic entropy outperforms token entropy"
      our_interpretation: "Their evaluation used free-form QA; MC format breaks semantic comparison"

    - finding: "max_prob (0.81) outperforms choice_entropy (0.77)"
      why_surprising: "Entropy captures more distributional information"
      our_interpretation: "With only 4 MC options, entropy over 4 values may be noisier than direct confidence"

# ═══════════════════════════════════════════════════════════════
# SECTION 5: TAKEAWAY / BROADER IMPACT
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First controlled comparison revealing format-dependency of UQ methods for hallucination detection"
    why_significant: "Guides method selection based on task format, not just reported accuracy"

  implications:
    for_field: "Method comparisons must control for task format; claims need format qualifications"
    for_practice: "Use simple confidence for MC; save semantic entropy for free-form generation"

  future_possibilities:
    immediate_extensions: "Test semantic entropy on HaluEval free-form to validate format hypothesis"
    longer_term_vision: "Format-aware UQ method selection framework"

# ═══════════════════════════════════════════════════════════════
# SECTION 6: SECTION-LEVEL GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story: problem → insight → evidence → implication"
    key_message: "UQ method performance depends on task format; simple methods win for MC"
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    key_elements:
      - "Open with the 0.24 AUROC gap finding"
      - "Frame the controlled comparison need"
      - "Preview format-dependency insight"
      - "List contributions as natural flow, not bullet points"
    transition_to_related: "Prior work evaluated methods separately; we unify comparison"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "BUILD_ON existing methods, PROVE_NEW the comparison"
    key_comparison_points:
      - "Kuhn 2023 (Semantic Entropy): BUILD_ON their method, test on MC format"
      - "Manakul 2023 (SelfCheckGPT): Tested on WikiBio, not TruthfulQA"
      - "Kadavath 2022 (P(True)): Proprietary data; we use public benchmark"
    gap_statement: "No controlled head-to-head comparison on identical conditions"

  methodology:
    narrative_purpose: "Show WHY this design enables fair comparison"
    connection_to_insight: "Identical splits, same model, controlled variables"
    key_design_decisions:
      - "TruthfulQA mc1 for ground truth without annotation"
      - "Llama-3-8B as representative 7-13B decoder"
      - "Mechanism verification separate from discrimination evaluation"
    figures: []  # Architecture diagram if available

  experiments:
    narrative_purpose: "Test specific claims with clear experimental questions"
    experimental_questions:
      - "Q1: Do UQ methods discriminate hallucinations? (h-e1)"
      - "Q2: Does semantic entropy achieve AUROC ≥ 0.70? (h-m1)"
      - "Q3: Does semantic clustering mechanism function? (h-m1 mechanism)"

  results:
    narrative_purpose: "Present evidence with interpretation, not just numbers"
    main_result_highlight: "max_prob AUROC=0.81, semantic_entropy AUROC=0.56"
    structure:
      - "Token-level results (h-e1): Both methods exceed threshold"
      - "Semantic entropy results (h-m1): AUROC=0.56, mechanism verified"
      - "Comparison: 0.24 point gap, format mismatch interpretation"
    figures: []  # AUROC comparison bar chart, ROC curves

  discussion:
    narrative_purpose: "Interpret results, connect to insight, acknowledge limits"
    key_points:
      - "Format-dependency as primary finding"
      - "Semantic entropy not broken, just mismatched"
      - "Implications for method selection"
    honest_limitations:
      - "PoC sample size (50 questions)"
      - "Single model (Llama-3-8B)"
      - "MC format only; free-form untested"

  conclusion:
    narrative_purpose: "Reinforce message, callback to hook, open future"
    callback_to_hook: "The 0.24 gap reveals format dependency, not method failure"
    future_work:
      - "Test on free-form (HaluEval)"
      - "Multi-model generalization"
      - "Full-scale validation (817 samples)"

