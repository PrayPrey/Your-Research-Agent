# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 4/4.5 validated experiments
# Generated: 2026-08-29

metadata:
  paper_file: "06_paper.md"
  source: "045_validated_hypothesis.md"
  hypothesis_id: "H-UQ-Compare-v1"

# ═══════════════════════════════════════════════════════════════
# QUANTITATIVE CLAIMS (Must match exactly)
# ═══════════════════════════════════════════════════════════════

quantitative_claims:
  primary_metrics:
    - claim: "max_prob AUROC"
      value: 0.8068
      source: "h-e1/04_validation.md"
      tolerance: 0.0001

    - claim: "choice_entropy AUROC"
      value: 0.7703
      source: "h-e1/04_validation.md"
      tolerance: 0.0001

    - claim: "semantic_entropy AUROC"
      value: 0.5645
      source: "h-m1/04_validation.md"
      tolerance: 0.0001

    - claim: "AUROC gap (max_prob - semantic)"
      value: 0.2423
      derived_from: "0.8068 - 0.5645"
      tolerance: 0.01

  mechanism_verification:
    - claim: "avg clusters per question"
      value: 4.92
      source: "h-m1/04_validation.md"

    - claim: "entropy variance (std)"
      value: 0.0752
      source: "h-m1/04_validation.md"

  experimental_setup:
    - claim: "sample size"
      value: 50
      source: "h-e1/04_validation.md"

    - claim: "samples per question (semantic)"
      value: 5
      source: "h-m1/04_validation.md"

    - claim: "model accuracy"
      value: 0.56
      source: "h-e1/04_validation.md"

# ═══════════════════════════════════════════════════════════════
# QUALITATIVE CLAIMS (Interpretation - reviewable)
# ═══════════════════════════════════════════════════════════════

qualitative_claims:
  key_findings:
    - claim: "Token-level methods effectively discriminate hallucinations on MC format"
      evidence: "max_prob AUROC=0.81, choice_entropy AUROC=0.77, both > 0.55 threshold"
      confidence: "HIGH"

    - claim: "Semantic entropy mechanism functions correctly"
      evidence: "avg 4.92 clusters from 5 samples, entropy std > 0"
      confidence: "HIGH"

    - claim: "Semantic entropy underperforms due to format mismatch"
      evidence: "Mechanism verified but AUROC=0.56; MC answers are single letters"
      confidence: "MEDIUM"
      note: "Interpretation; not directly tested on free-form"

  causal_claims:
    - claim: "UQ method effectiveness is format-dependent"
      type: "INTERPRETATION"
      direct_evidence: false
      supporting_evidence:
        - "Token methods work on MC (AUROC > 0.77)"
        - "Semantic entropy fails on MC (AUROC=0.56)"
        - "Mechanism verification passes"
      would_require: "Free-form evaluation to fully validate"

# ═══════════════════════════════════════════════════════════════
# LIMITATIONS (Must be honestly represented)
# ═══════════════════════════════════════════════════════════════

limitations:
  acknowledged:
    - type: "sample_size"
      description: "50 questions (PoC level)"
      full_size: 817
      impact: "AUROC estimates have wider confidence intervals"

    - type: "single_model"
      description: "Only Llama-3-8B-Instruct tested"
      generalization: "Unknown for other architectures/sizes"

    - type: "format_scope"
      description: "MC format only"
      generalization: "Free-form may yield different rankings"

    - type: "sample_count_semantic"
      description: "5 samples per question"
      note: "Within standard range but potentially suboptimal"

  not_acknowledged_but_valid:
    - "Temperature sensitivity not tested"
    - "NLI threshold sensitivity not tested (fixed at 0.7)"
    - "Other NLI models not compared"

