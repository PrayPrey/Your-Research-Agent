main_hypothesis:
  id: H-UQ-Compare-v1
  title: Controlled Comparison of UQ Methods for Hallucination Detection
  statement: 'Under decoder-only LLMs (7-13B parameters), if we compare token entropy,

    semantic entropy, P(True), and SelfCheckGPT on identical TruthfulQA/HaluEval splits,

    then (1) semantic entropy achieves highest overall AUROC, (2) method rankings vary

    across hallucination categories, and (3) semantic clustering produces more separable

    score distributions.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA mc1 + HaluEval (QA/dialogue/summarization)
    model: Llama-3-8B-Instruct (primary), Mistral-7B (secondary)
    optimizer: null
    hyperparameters:
      sample_budget: 10
      splits: identical across methods
  baseline_comparison:
