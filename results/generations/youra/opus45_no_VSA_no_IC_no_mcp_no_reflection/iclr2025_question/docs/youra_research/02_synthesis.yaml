hypothesis_draft:
  title: "Controlled Comparison of UQ Methods for Hallucination Detection"
  hypothesis_id: "H-UQ-Compare-v1"
  core_claim: |
    Semantic entropy achieves highest overall AUROC for hallucination detection,
    but method rankings vary across hallucination categories because different
    UQ methods capture distinct uncertainty signals.
  mechanism: |
    Semantic entropy clusters semantically equivalent samples via NLI before
    computing entropy, capturing meaning-level consistency. Token entropy
    measures surface-level logit confidence. P(True) uses explicit probability
    prompting. SelfCheckGPT checks factual consistency across samples.
    Each captures different aspects of uncertainty.
  predictions:
    - P1: "Semantic entropy AUROC ≥ 0.70 on TruthfulQA, outperforming token entropy by ≥3 points"
    - P2: "Method rankings differ across HaluEval subtask categories"
    - P3: "Semantic entropy produces higher KL divergence between correct/hallucinated score distributions"

variables_summary:
  independent: "UQ Method (4 levels), Hallucination Category (3 levels)"
  dependent_primary: "AUROC for hallucination detection"
  controlled: "Model (Llama-3-8B), sample budget (10), benchmark splits"

null_hypothesis:
  h0_statement: |
    There is no significant difference (>3 AUROC points) between UQ methods,
    and method rankings are consistent across hallucination categories.
  statistical_test: "Bootstrap confidence intervals for AUROC differences"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Method-hallucination-type correspondence hypothesis"
  differentiation_summary: |
    Prior work evaluates individual methods on their own test beds.
    This is the first controlled comparison of four methods on identical
    benchmark conditions, testing whether method effectiveness varies
    by hallucination category.

