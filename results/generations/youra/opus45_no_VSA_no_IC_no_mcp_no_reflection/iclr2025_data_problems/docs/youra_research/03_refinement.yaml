# Section 0: Established Facts & Claim Scope
established_facts:
  claims:
    - claim: "Domain mixing ratios affect downstream LLM performance"
      status: "BUILD_ON"
      evidence: "DoReMi, SlimPajama research established this empirically"
    - claim: "Embedding similarity correlates with transfer performance"
      status: "BUILD_ON"
      evidence: "Domain adaptation literature, DSIR (Park et al.)"
    - claim: "Training-free prediction of optimal domain mixing via embeddings is possible"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis to be validated"
  scope_reduction_percentage: 66
  phase2b_4_instructions: |
    Domain mixing impact and embedding-transfer correlation are established.
    Focus Phase 2B on validating the EDMP scoring mechanism (similarity + diversity)
    and its predictive power for ranking optimization.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-EDMP-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard LLM pretraining conditions with multi-domain corpora,
    if domain mixing is guided by embedding-based similarity + diversity scores
    computed from a mid-scale embedder (E5-large) against downstream task exemplars,
    then downstream task performance will improve by ≥3% on average compared to
    heuristic methods (perplexity-based, random selection),
    because embedding geometry captures task-relevant information content that
    correlates with transfer utility.
  alternative_hypothesis_h0: |
    There is no significant difference in downstream performance (MMLU, HellaSwag, ARC)
    between models trained on EDMP-selected domain mixtures and models trained on
    perplexity-selected or randomly-selected domain mixtures, given equal training compute.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "domain_selection_method"
      type: "categorical"
      operationalization: "Method used to select/rank domains for training mixture"
      levels:
        - "EDMP (embedding similarity + diversity)"
        - "perplexity-based selection"
        - "random selection"
        - "equal weighting"
  dependent:
    - name: "downstream_benchmark_performance"
      type: "continuous"
      operationalization: "Average accuracy across MMLU, HellaSwag, ARC benchmarks"
      primary: true
    - name: "domain_ranking_correlation"
      type: "continuous"
      operationalization: "Kendall's tau between predicted and actual performance ranking"
      primary: false
  controlled:
    - name: "total_training_tokens"
      operationalization: "Fixed token budget across all conditions (e.g., 10B tokens)"
    - name: "model_architecture"
      operationalization: "Same architecture (e.g., Pythia-1B) for all training runs"
    - name: "training_hyperparameters"
      operationalization: "Identical LR, batch size, optimizer across conditions"
    - name: "evaluation_protocol"
      operationalization: "Same prompting format, few-shot count for benchmarks"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Embedding extraction: Sample tokens from each domain, embed with mid-scale model (E5-large) to capture semantic distribution"
      evidence: "E5-large produces semantically meaningful embeddings validated on retrieval benchmarks"
      falsifier: "If domain embeddings cluster randomly with no semantic structure, this step fails"
    - step: 2
      description: "Scoring: Compute similarity to task exemplar embeddings + diversity contribution via coverage of task embedding space"
      evidence: "DSIR showed distributional alignment correlates with transfer performance"
      falsifier: "If similarity scores don't correlate with downstream performance (r < 0.3), this step fails"
    - step: 3
      description: "Ranking: Rank domains by combined score (similarity × (1 + diversity_bonus)), select top-K for training mixture"
      evidence: "Logical composition of valid sub-metrics should preserve predictive power"
      falsifier: "If top-K domains underperform random-K selection, ranking aggregation is flawed"
  key_tension: "Whether embedding geometry from one model scale predicts optimal mixtures for different target scales"
  evidence_summary: |
    Domain adaptation literature establishes that distributional alignment correlates with transfer.
    DSIR demonstrated importance sampling based on similarity improves outcomes.
    The EDMP hypothesis extends this to multi-domain mixing with diversity term.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "Embedding geometry captures task-relevant information content"
    supporting_evidence: "Retrieval benchmarks show semantic similarity in embedding space"
    consequence_if_violated: "EDMP scores would not correlate with transfer utility"
  - id: "A2"
    assumption: "Task exemplar embeddings represent downstream task distribution"
    supporting_evidence: "Validation sets are designed to cover task distribution"
    consequence_if_violated: "Similarity scores would be unrepresentative; use larger exemplar sets"
  - id: "A3"
    assumption: "Domain rankings are stable across embedder model scales"
    supporting_evidence: "To be validated; partial support from transfer learning literature"
    consequence_if_violated: "EDMP would require scale-specific embedders, reducing generality"
  - id: "A4"
    assumption: "Similarity + diversity scoring captures both relevance and complementarity"
    supporting_evidence: "Set cover metrics capture complementarity in recommendation systems"
    consequence_if_violated: "Missing domain interactions; would need pairwise interaction terms"
  - id: "A5"
    assumption: "Embedding computation is substantially cheaper than proxy model training"
    supporting_evidence: "Inference-only vs. gradient computation; ~32 vs. 100+ GPU-hours estimated"
    consequence_if_violated: "Training-free claim weakened; still valuable if faster even at similar cost"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Multi-domain LLM pretraining at 1B-7B parameter scale
    - Domain-labeled corpora (The Pile, SlimPajama, RedPajama)
    - Standard NLP benchmarks (MMLU, HellaSwag, ARC)
    - English language models with Western-centric benchmarks
  does_not_apply_to: |
    - Single-domain pretraining (no mixing to optimize)
    - >70B scale models (not validated)
    - Non-English / multilingual settings
    - Modalities beyond text (vision, audio)
    - Custom/proprietary benchmarks without exemplars
  known_limitations: |
    - Requires domain labels (doesn't help with unlabeled web crawl)
    - Task exemplars needed (limited for novel tasks)
    - Embedding quality depends on embedder choice
    - Doesn't predict absolute performance, only rankings

# Section 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Models trained on EDMP-selected top-3 domains outperform perplexity-selected top-3 by ≥3% on MMLU average"
    test_method: "Train two 1B models on 10B tokens: one with EDMP top-3, one with perplexity top-3. Evaluate on MMLU test set."
    success_criterion: "EDMP model MMLU accuracy ≥ perplexity model MMLU accuracy + 3 percentage points"
    falsification: "If improvement < 2% or perplexity model outperforms EDMP model"
  - id: "P2"
    primary: false
    statement: "EDMP domain rankings correlate with actual performance rankings across scales (Kendall's τ > 0.5)"
    test_method: "Compute EDMP rankings with 3B embedder. Train 1B and 7B models on individual domains. Measure performance ranking correlation."
    success_criterion: "Kendall's τ between EDMP rank and performance rank > 0.5 for both scales"
    falsification: "If τ < 0.4 at either scale"
  - id: "P3"
    primary: false
    statement: "EDMP compute cost < 10% of DoReMi proxy training compute"
    test_method: "Measure GPU-hours for EDMP (embedding 8 domains) vs. DoReMi proxy training estimate"
    success_criterion: "EDMP GPU-hours / DoReMi GPU-hours < 0.1"
    falsification: "If ratio > 0.2"

