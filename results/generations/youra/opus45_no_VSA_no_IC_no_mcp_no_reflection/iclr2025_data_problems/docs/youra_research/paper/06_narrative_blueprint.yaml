# Narrative Blueprint for EDMP Paper
# Generated: 2026-08-28
# Story Architecture: Narrative-First Design

metadata:
  hypothesis_id: "H-EDMP-v1"
  paper_type: "methodology_validation"  # Partial validation, pipeline proof-of-concept
  narrative_strategy: "methodological_transparency"

# =============================================================================
# 1. HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "Domain mixing ratios can make or break LLM performance—yet optimizing them typically costs hundreds of GPU-hours in proxy model training. What if we could predict optimal mixtures using only frozen embeddings?"
    strategy: "practical_failure_then_promise"

  why_reader_should_care:
    main_reason: "Training compute is the bottleneck; data selection methods that avoid training overhead have immediate practical value"
    concrete_example: "DoReMi requires training a proxy model to optimize mixtures; EDMP promises training-free prediction"
    stakes: "Without efficient optimization, practitioners default to heuristic mixing that leaves performance on the table"

  anti_patterns_avoided:
    - "Did NOT open with 'LLMs have achieved remarkable success...'"
    - "Did NOT use generic 'X is an important problem...'"
    - "Opens with concrete problem and promise"

# =============================================================================
# 2. PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Domain mixing ratios significantly affect downstream LLM performance"
    common_understanding: "DoReMi, SlimPajama established that mixing matters"
    source: "BUILD_ON claims from 03_refinement.yaml"

  deeper_problem:
    description: "Current optimization methods (DoReMi) require expensive proxy model training"
    why_overlooked: "Most research focuses on WHAT to mix, not HOW to predict utility without training"
    our_perspective: "Embedding geometry may encode task-relevant information that predicts transfer utility"

  gap_in_existing_work:
    description: "No training-free method exists for predicting optimal domain mixtures"
    why_gap_exists: "Prior work assumed you must train to evaluate domain utility"
    why_gap_matters: "Training-free prediction would democratize FM optimization for compute-constrained practitioners"

# =============================================================================
# 3. KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Embedding similarity to task exemplars produces statistically distinguishable domain scores—but synthetic data reveals this signal requires real domain vocabulary to discriminate effectively."
    expanded_explanation: "E5-large embeddings produce ANOVA-significant domain differences (F=1242.59), proving the scoring mechanism is functional. However, synthetic data yields insufficient variance (std=0.007), indicating the predictive power depends on data quality, not just method validity."

  why_others_missed_it:
    common_assumptions: "Assumed embedding similarity straightforwardly predicts training utility"
    our_different_view: "The mechanism EXISTS (Step 1 verified), but its PREDICTIVE POWER (Steps 2-3) requires real domain data to test"
    enabling_factor: "End-to-end pipeline validation before full hypothesis testing"

  what_makes_it_work:
    intuitive_explanation: "Task exemplars define a target region in embedding space; domains closer to this region may transfer better"
    key_mechanism: "Cosine similarity between domain sample embeddings and task exemplar embeddings, aggregated per domain"

# =============================================================================
# 4. EVIDENCE NARRATIVE (from 045_validated_hypothesis.md)
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "The EDMP scoring pipeline is computationally tractable and produces statistically significant domain differences"
    measurable_criteria: "ANOVA significance (p < 0.05), reproducibility (variance < 0.05), baseline separation"
    verification_status: "VERIFIED for pipeline existence; UNVERIFIED for predictive power"

  supporting_evidence:
    - id: "evidence_1"
      what: "8/8 domains produce valid similarity scores"
      so_what: "Pipeline computes reliably across all tested domains"
      how_it_supports_claim: "EXISTENCE criterion met"

    - id: "evidence_2"
      what: "ANOVA F=1242.59, p<0.001"
      so_what: "Domains ARE statistically distinguishable via embedding similarity"
      how_it_supports_claim: "Scoring mechanism produces signal, not noise"

    - id: "evidence_3"
      what: "Reproducibility variance = 0.0 across seeds [42, 43, 44]"
      so_what: "Pipeline is deterministic and reliable"
      how_it_supports_claim: "Results are reproducible"

    - id: "evidence_4"
      what: "E5 scores ~0.74 vs random ~0.0"
      so_what: "Embeddings carry semantic content"
      how_it_supports_claim: "Method uses meaningful signal, not random noise"

  negative_findings:
    - id: "finding_1"
      what: "Cross-domain std = 0.007 (threshold: 0.05)"
      why_it_happened: "Synthetic data shares ~70% vocabulary across domains"
      implication: "Real domain data required to test predictive power"
      honest_framing: "Data limitation, not fundamental method flaw"

    - id: "finding_2"
      what: "5 of 6 sub-hypotheses NOT_STARTED"
      why_it_happened: "h-e1 PARTIAL blocked dependent hypotheses"
      implication: "Main predictions (P1, P2, P3) remain untested"
      honest_framing: "Proper scientific gating—EXISTENCE before MECHANISM"

# =============================================================================
# 5. BROADER IMPACT / TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "We validated the computational pipeline for embedding-based domain scoring while identifying that synthetic data cannot test the core hypothesis."
    why_significant: "Infrastructure now exists for full validation once real data is accessible"

  implications:
    for_field: "Establishes feasibility of training-free domain scoring; awaits predictive power validation"
    for_practice: "Pipeline code is reusable; practitioners can adapt once real data constraints are resolved"

  future_possibilities:
    immediate_extensions: "Retry with real Pile data (streaming or cached); test with alternative embedders (BGE, OpenAI)"
    longer_term_vision: "If predictive power confirmed, EDMP could replace proxy model training in FM optimization"

# =============================================================================
# 6. SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress: problem, method, key finding (pipeline works, variance insufficient), future direction"
    key_message: "EDMP scoring is computationally tractable with significant domain differences, but real data needed for predictive validation"
    word_target: 150

  introduction:
    narrative_purpose: "Hook (cost of DoReMi) → Problem (no training-free method) → Insight (embedding geometry) → Preview (what we tested)"
    hook_strategy: "practical_failure_then_promise"
    transition_to_related: "Connect to prior work on domain adaptation and embedding-based selection"
    word_target: 800-1000

  related_work:
    narrative_purpose: "Position EDMP against DoReMi, DSIR, perplexity-based methods; show gap we address"
    positioning_strategy: "DoReMi requires training; DSIR is task-specific; perplexity is model-dependent; EDMP is training-free and task-grounded"
    key_comparison_points:
      - "DoReMi: proxy model training required"
      - "DSIR: importance sampling for single-task fine-tuning"
      - "Perplexity selection: model-dependent, no task grounding"
    word_target: 600-800

  methodology:
    narrative_purpose: "Explain WHY embedding similarity might predict transfer; describe EDMP scoring formula"
    connection_to_insight: "If embedding geometry captures task-relevant content, similarity to task exemplars should correlate with utility"
    key_design_decisions:
      - "E5-large for stable, well-validated embeddings"
      - "MMLU validation as task exemplar source"
      - "Cosine similarity with mean aggregation"
    word_target: 1000-1200

  experiments:
    narrative_purpose: "Describe h-e1 experiment design; explain success criteria and what we tested"
    experimental_questions:
      - "Can EDMP scores be computed reliably for all domains?"
      - "Do scores show sufficient variance to discriminate domains?"
      - "Are results reproducible across seeds?"
    word_target: 800-1000

  results:
    narrative_purpose: "Present evidence: pipeline works, domains distinguishable, but variance insufficient"
    main_result_highlight: "ANOVA F=1242.59 proves domains ARE distinguishable; std=0.007 shows variance insufficient with synthetic data"
    figure_references:
      - "fig_1: domain_similarity_bar.png"
    word_target: 1000-1200

  discussion:
    narrative_purpose: "Interpret: why low variance? synthetic data limitation. what we learned. honest limitations."
    honest_limitations:
      - "Only h-e1 tested; main predictions (P1-P3) unverified"
      - "Synthetic data lacks real domain vocabulary diversity"
      - "Single embedder (E5-large) evaluated"
    broader_interpretation: "Pipeline feasibility confirmed; predictive power hypothesis remains open"
    word_target: 400-600

  conclusion:
    narrative_purpose: "Callback to hook (cost reduction promise deferred); summarize what we proved; point to future work"
    callback_to_hook: "The promise of training-free domain mixing remains viable—but requires real data to fulfill"
    future_directions:
      - "Retry with real Pile data"
      - "Test alternative embedders"
      - "Complete causal mechanism chain"
    word_target: 300-400

# =============================================================================
# 7. NARRATIVE COHERENCE CHECKLIST
# =============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES - Hook: cost reduction promise; Conclusion: promise deferred pending real data"

  - check: "Does each section naturally flow to the next?"
    status: "YES - Problem → Prior work gap → Our method → Tests → Results → Interpretation → Summary"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES - 'Embedding geometry may predict utility' threaded through all sections"

  - check: "Are all major claims supported by evidence?"
    status: "YES - Pipeline claims supported by h-e1; predictive claims explicitly marked UNVERIFIED"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES - Honest framing as partial validation is more credible than overclaiming"

# =============================================================================
# 8. CLAIMS STATUS (for Phase 6.5 Ground Truth)
# =============================================================================

claims_registry:
  verified_claims:
    - claim: "E5-large can compute embedding similarity scores for domain-task pairs"
      evidence: "h-e1: 8/8 domains computed"
      confidence: "HIGH"

    - claim: "Domain scores are statistically distinguishable"
      evidence: "ANOVA F=1242.59, p<0.001"
      confidence: "HIGH"

    - claim: "Pipeline is reproducible"
      evidence: "Variance = 0.0 across seeds"
      confidence: "HIGH"

  unverified_claims:
    - claim: "EDMP scores predict downstream training utility"
      required_evidence: "h-m1, h-m2 correlation testing"
      status: "NOT_TESTED"

    - claim: "EDMP top-K outperforms random-K by ≥3%"
      required_evidence: "h-m3 training comparison"
      status: "NOT_TESTED"

    - claim: "Compute cost < 10% DoReMi"
      required_evidence: "h-c2 benchmarking"
      status: "NOT_TESTED"
