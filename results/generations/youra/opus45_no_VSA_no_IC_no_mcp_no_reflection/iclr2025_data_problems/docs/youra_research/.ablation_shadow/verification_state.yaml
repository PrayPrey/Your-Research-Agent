main_hypothesis:
  id: H-EDMP-v1
  title: Embedding-Based Domain Mixing Prediction (EDMP)
  statement: Under standard LLM pretraining conditions with multi-domain corpora, if domain mixing is guided by embedding-based
    similarity + diversity scores computed from a mid-scale embedder (E5-large) against downstream task exemplars, then downstream
    task performance will improve by ≥3% on average compared to heuristic methods (perplexity-based, random selection), because
    embedding geometry captures task-relevant information content that correlates with transfer utility.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: The Pile (22 domains)
    model: Pythia-1B
    optimizer: AdamW (standard Pythia config)
    hyperparameters:
      training_tokens: 10B
      batch_size: 2M tokens
      learning_rate: 3e-4
      seeds:
      - 42
      - 123
      - 456
  baseline_comparison:
