hypothesis_draft:
  title: "Embedding-Based Domain Mixing Prediction (EDMP)"
  hypothesis_id: "H-EDMP-v1"
  core_claim: |
    Domain mixing ratios for LLM pretraining can be optimized without training
    by computing embedding-based similarity + diversity scores against downstream
    task exemplars. This training-free approach predicts domain utility via
    geometric properties of embedding space.
  mechanism: |
    1. Embed sampled tokens from each domain using mid-scale embedder (E5-large)
    2. Compute similarity to task validation set embeddings + diversity via coverage
    3. Rank domains by combined score: similarity × (1 + diversity_bonus)
    4. Select top-K domains for training mixture
  predictions:
    - P1: "EDMP-selected domains outperform perplexity-selected by ≥3% on MMLU"
    - P2: "Domain rankings correlate across scales (Kendall's τ > 0.5)"
    - P3: "EDMP compute < 10% of DoReMi proxy training"

variables_summary:
  independent: "Domain selection method (EDMP vs. perplexity-based vs. random vs. equal)"
  dependent_primary: "Average downstream benchmark performance (MMLU, HellaSwag, ARC)"
  controlled: "Training tokens, model architecture, hyperparameters, evaluation protocol"

null_hypothesis:
  h0_statement: |
    There is no significant difference in downstream performance between models
    trained on EDMP-selected domain mixtures and models trained on perplexity-selected
    or randomly-selected domain mixtures, given equal training compute.
  statistical_test: "Two-sample t-test or bootstrap comparison of benchmark accuracies"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Training-free domain mixing optimization via embedding geometry (similarity + diversity scoring)"
  differentiation_summary: |
    Unlike DoReMi (requires proxy training) or DSIR (task-specific importance sampling),
    EDMP uses frozen embeddings to predict domain utility. This enables optimization
    without any gradient computation, reducing cost by ~90% while providing principled
    geometric grounding for data curation decisions.

