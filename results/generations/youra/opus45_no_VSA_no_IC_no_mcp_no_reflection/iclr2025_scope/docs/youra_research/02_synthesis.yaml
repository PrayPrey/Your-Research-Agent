hypothesis_draft:
  title: "Duality-Guided Cross-Architecture Distillation (DG-CAD)"
  hypothesis_id: "H-DG-CAD-v1"
  core_claim: |
    Transformer attention layers can be efficiently converted to SSM layers using
    Mamba-2 duality-inspired initialization, achieving performance within 1.5x the
    degradation of same-architecture distillation while reducing inference complexity
    from O(n²) to O(n).
  mechanism: |
    1. Derive initial SSM parameters (A, B, C, Δ) from attention weights using Mamba-2
       duality equations: A = -exp(W_Q·W_K^T), B = W_V, C = W_O, Δ = 1/seq_len
    2. Optimize SSM parameters layer-wise on calibration set (1000 samples, 512-4096 tokens)
    3. Fine-tune full model on downstream task with soft labels from teacher
  predictions:
    - P1: "DG-CAD outperforms naive KD by ≥1% on LongBench 8K context"
    - P2: "Low-entropy attention heads (<median) convert with <5% reconstruction error"
    - P3: "Short calibration (≤1K tokens) generalizes to 8K with <2x degradation"

variables_summary:
  independent: "Distillation method (DG-CAD vs Naive KD vs Same-arch KD)"
  dependent_primary: "Task accuracy on GLUE and LongBench"
  controlled: "Model size (12 layers, 768 dim), training data, evaluation benchmarks"

null_hypothesis:
  h0_statement: |
