# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      Mamba-2 establishes theoretical equivalence between Transformer attention and
      state space models, promising a principled path for knowledge transfer. We test
      whether this duality enables practical distillation and discover a surprising
      result: duality-derived SSM parameters are numerically stable but reconstruct
      attention outputs 2.13% worse than random initialization.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: |
      Cross-architecture distillation from Transformers to efficient alternatives could
      enable deployment of large pretrained models on resource-constrained devices with
      linear-time inference.
    concrete_example: |
      A practitioner wants to deploy BERT's knowledge on edge devices with O(n) inference.
      Mamba-2 duality suggests attention can be converted to SSM form—but does this work?
    stakes: |
      Without understanding the scope of attention-SSM duality, practitioners may invest
      in approaches that fail at the output-alignment level, wasting compute and time.

  real_world_impact:
    application_domain: "Edge deployment of pretrained Transformers"
    potential_beneficiaries: "ML practitioners, embedded systems developers"
    scale_of_impact: "Any deployment requiring sub-quadratic inference"

problem_framing:
  surface_problem:
    description: "Transformers have quadratic attention complexity, limiting long-context deployment"
    common_understanding: "Sub-quadratic alternatives (Mamba, RWKV) exist but require training from scratch"

  deeper_problem:
    description: |
      No methodology exists for transferring pretrained Transformer knowledge to SSM
      architecture while preserving the learned attention structure.
    why_overlooked: |
      Mamba-2 duality is theoretical—practitioners assumed output-matching KD would suffice.
    our_perspective: |
      We ask whether the duality equations themselves can initialize SSM parameters that
      capture attention structure, providing a better starting point than random init.

  gap_in_existing_work:
    description: |
      First operationalization of Mamba-2 duality for practical distillation, with
      empirical validation of whether duality preserves attention structure.
    why_gap_exists: |
      Mamba-2 proves duality for specific conditions (scalar A, 1-semiseparable masks).
      Real attention (multi-head, learned positions) may not satisfy these conditions.
    why_gap_matters: |
      Clarifies scope of duality theory for practitioners considering attention→SSM conversion.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: |
      Numerical stability does not imply structural fidelity: duality-derived SSM
      parameters are valid but capture less attention structure than random initialization
      at the output level.
    expanded_explanation: |
      While Mamba-2 duality equations successfully convert attention weights to stable SSM
      parameters (0% NaN/Inf, 0.11x magnitude ratio), these parameters reconstruct attention
      outputs 2.13% worse than random initialization (p < 0.0001, Cohen's d = -4.56). This
      negative effect is consistent across all 12 BERT layers, suggesting a fundamental
      mismatch between BERT attention and SSD duality conditions.

  why_others_missed_it:
    common_assumptions: |
      Prior work assumed that if duality equations produce valid parameters, those
      parameters would preserve attention structure for output alignment.
    our_different_view: |
      We explicitly test zero-shot reconstruction error, separating parameter validity
      (existence) from structural fidelity (mechanism).
    enabling_factor: |
      Systematic two-stage validation: h-e1 tests stability, h-m1 tests reconstruction.

  what_makes_it_work:
    intuitive_explanation: |
      Imagine translating a document: you can produce grammatically valid sentences (stable
      parameters) that don't preserve the original meaning (structural fidelity). The duality
      equations preserve mathematical validity but not the computational structure that
      attention encodes.
    key_mechanism: |
      BERT's multi-head attention with learned position embeddings likely violates SSD
      duality conditions (scalar A, 1-semiseparable causal masks), causing the mapping to
      produce valid but structurally misaligned parameters.
    analogy: |
      Like fitting a square peg into a round hole by shaving the corners—it fits, but
      loses information.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: |
      Mamba-2 duality equations produce valid SSM parameters from BERT attention but
      do not capture meaningful structure for output-level reconstruction.
    measurable_criteria: |
      h-e1: 100% stability (0% NaN/Inf), magnitude ratio < 10x
      h-m1: Duality error vs random error comparison

  supporting_evidence:
    - id: "evidence_1"
      what: "100/100 samples produced stable SSM outputs with 0.11x magnitude ratio"
      so_what: "Duality equations DO produce valid parameters—the issue is structure, not validity"
      how_it_supports_claim: "Establishes that parameter derivation works at existence level"

    - id: "evidence_2"
      what: "Duality reconstruction error 91.45 vs random 89.54 (2.13% worse)"
      so_what: "Duality initialization provides NO structural advantage over random"
      how_it_supports_claim: "Directly tests whether duality captures attention structure"

    - id: "evidence_3"
      what: "All 12 BERT layers show negative effect (Cohen's d -4.15 to -5.97)"
      so_what: "Consistent failure across layers rules out layer-specific issues"
      how_it_supports_claim: "Demonstrates systematic rather than incidental mismatch"

  surprising_findings:
    finding: "Duality initialization is WORSE than random initialization"
    why_surprising: |
      Duality equations derive parameters from attention weights—they have information
      that random init lacks. Random should be the lower bound, not the target to beat.
    our_interpretation: |
      The output Frobenius norm metric may not align with what duality preserves. MOHAWK
      uses matrix alignment (CB^T vs QK^T), not output alignment. Alternative: BERT
      attention violates SSD conditions, corrupting the mapping.

  what_results_mean:
    synthesis: |
      The Mamba-2 duality framework has clear boundaries: it produces stable parameters
      but does not ensure output-level reconstruction for architectures that violate SSD
      conditions. Practitioners should not expect zero-shot output alignment from duality
      initialization alone.
    confidence_level: "HIGH—statistically significant with large effect size"
    caveats: |
      Results use output Frobenius norm metric; matrix alignment may show different
      properties. Only tested BERT-base on WikiText-103. No optimization phase tested.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: |
      First empirical clarification of Mamba-2 duality scope: valid parameters ≠ preserved
      structure at output level.
    why_significant: |
      Negative results with clear methodology are valuable—saves practitioners from
      investing in approaches that fail at the foundational level.

  implications:
    for_field: |
      Clarifies that duality-based initialization requires additional optimization or
      different metrics; cannot be used as zero-shot conversion.
    for_practice: |
      Practitioners considering attention→SSM conversion should test reconstruction
      quality, not just parameter validity.
    conceptual_contribution: |
      Separates "parameter validity" (existence) from "structural fidelity" (mechanism)
      as distinct verification levels for architecture conversion.

  future_possibilities:
    immediate_extensions: |
      1. Test MOHAWK matrix alignment metric (CB^T vs QK^T) instead of output Frobenius
      2. Test duality after minimal optimization (convergence speed comparison)
      3. Test on architectures that better satisfy SSD conditions (causal LM)
    longer_term_vision: |
      Develop conversion metrics that predict when duality will preserve structure,
      enabling selective use of duality initialization on compatible attention patterns.
    open_questions: |
      1. Does duality provide faster convergence during optimization despite worse zero-shot?
      2. Which attention characteristics predict successful duality conversion?
      3. Can per-head conversion (preserving multi-head structure) improve results?

