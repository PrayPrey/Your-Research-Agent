# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DG-CAD-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under standard NLP tasks (classification, QA, summarization), if Transformer
    attention layers are converted to SSM layers using Mamba-2 duality-inspired
    closed-form initialization followed by layer-wise optimization, then the
    resulting sub-quadratic model achieves performance within 1.5x the degradation
    of same-architecture distillation, because the duality-preserving initialization
    provides a strong starting point that reduces optimization difficulty and
    preserves long-context reasoning structure.
  alternative_hypothesis_h0: |
    There is no significant difference in downstream task performance between
    duality-guided cross-architecture distillation and naive output-matching
    knowledge distillation (p > 0.05).

