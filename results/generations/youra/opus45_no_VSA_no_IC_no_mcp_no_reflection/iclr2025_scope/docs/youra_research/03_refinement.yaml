# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Closed-form initialization derives SSM parameters (A, B, C, Δ) from attention weights using Mamba-2 duality equations"
      evidence: "Mamba-2 proves attention = SSM under specific parameterizations; closed-form mapping is derivable"
      falsifier: "If initialization produces SSM parameters that diverge during optimization, duality mapping is incorrect"
    - step: 2
      description: "Layer-wise optimization refines SSM parameters to minimize reconstruction error on calibration set"
      evidence: "Standard optimization on well-posed objective; 100 steps per layer shown sufficient in similar work"
      falsifier: "If reconstruction error does not decrease with optimization steps, objective is ill-posed"
    - step: 3
      description: "Fine-tuning on downstream task aligns converted model with task distribution"
      evidence: "Standard KD fine-tuning; DistilBERT demonstrates effectiveness"
      falsifier: "If fine-tuning degrades calibration-set performance, catastrophic forgetting occurs"
  key_tension: "Whether duality-inspired initialization provides sufficiently better starting point than random to justify complexity"
  evidence_summary: |
    Mamba-2 provides theoretical foundation. DistilBERT demonstrates distillation methodology works.
    Gap: no existing method combines duality theory with distillation practice.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Mamba-2 duality conditions approximately hold for pretrained Transformer attention patterns"
    supporting_evidence: "Mamba-2 shows equivalence for attention with specific structure; real attention may approximate this"
    consequence_if_violated: "Closed-form initialization produces poor starting point, negating benefit over naive KD"
  - id: "A2"
    assumption: "Layer-wise conversion preserves gradient flow better than end-to-end conversion"
    supporting_evidence: "Layer-wise distillation used successfully in DistilBERT; easier optimization landscape"
    consequence_if_violated: "May need alternative conversion order (e.g., final layers first)"
  - id: "A3"
    assumption: "Calibration on 512-4096 token sequences generalizes to 8K+ contexts"
    supporting_evidence: "SSM recurrence is position-agnostic; should generalize if core dynamics captured"
    consequence_if_violated: "Must include longer sequences in calibration set"
  - id: "A4"
    assumption: "768-dim SSM state is sufficient to represent 768-dim Transformer hidden states"
    supporting_evidence: "Mamba-2 uses matching dimensions; theoretical equivalence proven"
    consequence_if_violated: "May need state expansion factor (e.g., 2x)"
  - id: "A5"
    assumption: "Attention head entropy correlates with conversion difficulty"
    supporting_evidence: "High-entropy attention spreads information widely; harder to compress into recurrent state"
    consequence_if_violated: "Need alternative metrics for predicting conversion quality"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Encoder-only (BERT-style) and decoder-only (GPT-style) Transformers
    - Standard NLP tasks: classification, QA, summarization
    - Context lengths 512-16K tokens
    - Mamba-family SSM architectures
  does_not_apply_to: |
    - Vision Transformers (ViT) - different attention patterns
    - Mixture-of-Experts models - routing complicates conversion
    - Tasks requiring exact position encoding (e.g., arithmetic)
  known_limitations: |
    - Requires access to teacher model internals (attention weights)
    - Calibration set needed (1000-5000 samples)
    - Does not address training-from-scratch scenarios

