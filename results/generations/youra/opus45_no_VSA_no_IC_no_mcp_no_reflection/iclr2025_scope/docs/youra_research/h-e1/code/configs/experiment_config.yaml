experiment:
  name: "h-e1-duality-existence"
  hypothesis_id: "h-e1"
  type: "EXISTENCE"
  seed: 42

model:
  source:
    name: "bert-base-uncased"
    source: "huggingface"
  ssm:
    d_state: 64
    target_layer: 0

data:
  preprocessing:
    min_length: 64
    max_length: 512
    num_samples: 100
    batch_size: 8

validation:
  nan_inf_threshold: 0.0
  magnitude_ratio_threshold: 10.0

output:
  results_dir: "results/"
  figures_dir: "figures/"

hardware:
  device: "cuda"
  dtype: "float32"
