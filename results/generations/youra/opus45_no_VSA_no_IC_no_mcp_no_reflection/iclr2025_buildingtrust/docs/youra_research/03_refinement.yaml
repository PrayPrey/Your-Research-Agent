  phase2b_4_instructions: |
    BUILD_ON claims require no new verification — cite original papers.
    PROVE_NEW claims are the experimental focus. Design experiments to test:
    1. Method difference (P1): Do AUROC differ significantly?
    2. Moderation (P2): Does method × benchmark interaction exist?

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-BudgetMatchedUQ-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under matched generation budgets (N samples), if semantic entropy and self-consistency
    methods are applied to the same hallucination detection task, then they will show
    different precision-recall tradeoffs with the pattern varying by benchmark, because
    semantic entropy captures semantic clustering of errors while self-consistency captures
    surface-level output inconsistency.
  alternative_hypothesis_h0: |
    There is no significant difference in hallucination detection AUROC between semantic
    entropy and self-consistency methods under matched generation budgets, and no
    method × benchmark interaction exists.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "detection_method"
      type: "categorical"
      operationalization: "Method applied to detect hallucination"
      levels: ["semantic_entropy", "self_consistency", "contextual_calibration"]
    - name: "sample_count"
      type: "categorical"
      operationalization: "Number of generations per query"
      levels: [5, 10, 20]
    - name: "benchmark"
      type: "categorical"
      operationalization: "Evaluation benchmark used"
      levels: ["TruthfulQA", "HaluEval-QA", "HaluEval-Summarization"]
  dependent:
    - name: "auroc"
