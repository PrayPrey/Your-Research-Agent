      operationalization: "F1 score at optimal threshold, range [0,1]"
      primary: false
    - name: "precision_at_recall_80"
      type: "continuous"
      operationalization: "Precision when recall = 0.8, range [0,1]"
      primary: false
  controlled:
    - name: "base_model"
      operationalization: "Fixed to Llama-3-8B-Instruct and Mistral-7B-Instruct (run separately)"
    - name: "temperature"
      operationalization: "Fixed at 0.7 for all sampling"
    - name: "max_tokens"
      operationalization: "Fixed at 256 per generation"
    - name: "random_seed"
      operationalization: "Fixed seed per query for reproducibility"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Model generates N responses to each query under sampling (temperature > 0)"
      evidence: "Standard practice in both semantic entropy and self-consistency papers"
      falsifier: "If deterministic outputs, mechanism cannot operate"
    - step: 2
      description: "Semantic entropy clusters responses by semantic equivalence via bidirectional NLI, then computes entropy over clusters"
      evidence: "Kuhn et al. 2023 Section 3.2"
      falsifier: "If NLI clustering fails (all in one cluster or all separate), entropy is uninformative"
    - step: 3
      description: "Self-consistency measures surface-level agreement (e.g., BERTScore, n-gram overlap) without semantic grouping"
      evidence: "Manakul et al. 2023 Section 3"
      falsifier: "If surface metrics correlate perfectly with semantic meaning, methods converge"
  key_tension: "Whether semantic clustering and surface consistency capture genuinely different failure modes, or are proxies for the same underlying uncertainty"
  evidence_summary: |
    Both methods use sampling but apply different post-processing: semantic entropy uses NLI
    for meaning-based clustering while self-consistency uses surface similarity. The hypothesis
    is that these capture different error types, leading to different detection patterns.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "NLI models accurately capture semantic equivalence between generated responses"
    supporting_evidence: "Kuhn et al. report high agreement with human judgments; standard NLI models achieve >90% on MNLI"
    consequence_if_violated: "Semantic entropy clusters become noise; method degrades to random"
  - id: "A2"
    assumption: "Surface-level metrics (BERTScore) correlate with but do not perfectly predict semantic equivalence"
    supporting_evidence: "Known divergence: paraphrases score high, factually different responses can also score high"
    consequence_if_violated: "If perfectly correlated, methods become identical and no difference expected"
  - id: "A3"
    assumption: "TruthfulQA and HaluEval benchmarks have sufficient label quality for AUROC computation"
    supporting_evidence: "Both benchmarks published with validated labels; TruthfulQA has human verification"
    consequence_if_violated: "Label noise inflates variance, may mask real method differences"
  - id: "A4"
    assumption: "Llama-3-8B and Mistral-7B produce sufficiently varied hallucinations for testing"
    supporting_evidence: "Both models known to hallucinate on factual questions at non-trivial rates"
    consequence_if_violated: "If models are near-perfect, no hallucinations to detect"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Decoder-only LLMs with sampling capability
    - Factual QA tasks with verifiable ground truth
    - Post-hoc hallucination detection (given generated response)
    - Settings where multiple generations per query are acceptable
  does_not_apply_to: |
    - Single-generation scenarios (streaming, real-time)
    - Creative generation tasks without ground truth
    - Tasks requiring generation-time intervention
  known_limitations: |
    - Comparison limited to two open-weight model families
    - Does not address latency constraints in production
    - NLI overhead for semantic entropy not parallelized in baseline implementation

# Section 1.6: Testable Predictions
predictions:
  - id: "P1"
    primary: true
    statement: "Semantic entropy and self-consistency show statistically different AUROC on at least one benchmark"
    test_method: "Paired t-test comparing method AUROCs across queries, Bonferroni-corrected for 3 benchmarks"
    success_criterion: "p < 0.05 on at least one benchmark"
    falsification: "p >= 0.05 on all three benchmarks"
  - id: "P2"
    primary: false
    statement: "Method effectiveness rank ordering differs across benchmarks (method × benchmark interaction)"
    test_method: "Two-way ANOVA with method and benchmark as factors, test interaction term"
    success_criterion: "Significant interaction (p < 0.05)"
    falsification: "No significant interaction; main effects only"
  - id: "P3"
    primary: false
    statement: "Both sampling methods outperform contextual calibration baseline at N >= 10"
    test_method: "Compare AUROC of semantic entropy and self-consistency to calibration baseline"
    success_criterion: "Both methods show higher AUROC than baseline (p < 0.05, one-tailed)"
    falsification: "Calibration baseline matches or exceeds either sampling method"

