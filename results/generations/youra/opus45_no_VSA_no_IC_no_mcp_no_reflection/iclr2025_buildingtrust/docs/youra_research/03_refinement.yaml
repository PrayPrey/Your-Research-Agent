    - claim: "Semantic entropy uses NLI-based clustering to group generations by semantic equivalence"
      status: "BUILD_ON"
      evidence: "Kuhn et al. 2023 (arXiv:2302.09664)"
    - claim: "SelfCheckGPT measures surface-level consistency across multiple generations"
      status: "BUILD_ON"
      evidence: "Manakul et al. 2023 (arXiv:2303.08896)"
    - claim: "Both methods require multiple forward passes (sampling)"
      status: "BUILD_ON"
      evidence: "Both original papers; N=5-20 typical"
    - claim: "Contextual calibration improves confidence calibration in LLMs"
      status: "BUILD_ON"
      evidence: "Zhao et al. 2021 (arXiv:2102.09690)"
