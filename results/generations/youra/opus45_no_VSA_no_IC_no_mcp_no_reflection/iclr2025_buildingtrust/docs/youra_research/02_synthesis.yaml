hypothesis_draft:
  title: "Matched-Budget Comparison of Uncertainty-Based Hallucination Detection Methods"
  hypothesis_id: "H-BudgetMatchedUQ-v1"
  core_claim: |
    Semantic entropy and self-consistency methods show different hallucination detection
    performance patterns under matched generation budgets, with effectiveness varying by
    benchmark characteristics.
  mechanism: |
    Semantic entropy clusters generations by semantic equivalence via NLI, detecting when
    models consistently produce semantically similar but incorrect responses. Self-consistency
    measures surface-level agreement, detecting when models produce inconsistent outputs.
    These target different failure modes: semantic entropy catches "confident wrong answers"
    while self-consistency catches "inconsistent reasoning."
  predictions:
    - P1: "Methods show statistically different AUROC on at least one benchmark (p < 0.05)"
    - P2: "Significant method × benchmark interaction exists"
    - P3: "Both methods outperform contextual calibration baseline at N >= 10"

variables_summary:
  independent: "detection_method (semantic_entropy, self_consistency, calibration), sample_count (5, 10, 20), benchmark (TruthfulQA, HaluEval-QA, HaluEval-Summ)"
  dependent_primary: "AUROC for hallucination detection"
  controlled: "base_model, temperature (0.7), max_tokens (256), random_seed"

null_hypothesis:
  h0_statement: |
    There is no significant difference in hallucination detection AUROC between semantic
    entropy and self-consistency methods under matched generation budgets, and no
