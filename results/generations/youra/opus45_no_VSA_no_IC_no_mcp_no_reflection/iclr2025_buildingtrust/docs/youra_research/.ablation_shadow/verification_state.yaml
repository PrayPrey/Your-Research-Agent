main_hypothesis:
  id: H-BudgetMatchedUQ-v1
  title: Matched-Budget Comparison of Uncertainty-Based Hallucination Detection Methods
  statement: Under matched generation budgets (N samples), semantic entropy and self-consistency methods show different precision-recall
    tradeoffs with patterns varying by benchmark, because semantic entropy captures semantic clustering while self-consistency
    captures surface-level inconsistency.
  defined_in: 03_refinement.yaml
