# Phase 6: Narrative Blueprint
# Designed before section generation for story coherence
# Generated: 2026-08-28

metadata:
  hypothesis_id: "H-BudgetMatchedUQ-v1"
  paper_type: "empirical_evaluation"
  target_venue: "ICML 2025"
  created_at: "2026-08-28T12:30:00Z"

# ============================================================================
# 1. HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: "Uncertainty-based hallucination detection methods report impressive results—semantic entropy achieves AUROC 0.85 on TruthfulQA, self-consistency reaches 0.80 on WikiBio—yet our pilot study reveals these methods can perform at random or even inverted on different benchmarks under identical conditions."
    strategy: "puzzle_paradox"
    why_effective: "Creates tension between literature claims and our observations; positions work as methodological contribution"

  why_reader_should_care:
    main_reason: "Practitioners selecting detection methods have no guidance on when each method works or fails"
    concrete_example: "Semantic entropy AUROC dropped from expected 0.85 to 0.289 on TruthfulQA—worse than random"
    stakes: "Deploying wrong detection method for a given task gives false confidence in hallucination-prone outputs"

  callback_for_conclusion: "Return to the benchmark sensitivity finding—what started as surprising failure became methodological insight"

# ============================================================================
# 2. PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "LLMs hallucinate confidently, requiring detection methods"
    common_understanding: "Multiple uncertainty-based methods exist (semantic entropy, self-consistency) with reported high performance"
    what_papers_say: "Each method claims AUROC 0.70-0.85 on their chosen benchmarks"

  deeper_problem:
    description: "Methods evaluated on different benchmarks with different sample counts—no controlled comparison exists"
    why_overlooked: "Each paper focused on demonstrating own method, not comparing under matched conditions"
    our_perspective: "Without matched-budget comparison, practitioners cannot make informed method selection"

  gap_in_existing_work:
    description: "No head-to-head evaluation of SE vs SC under matched computational budgets on same benchmarks"
    why_gap_exists: "Method papers optimize for novelty, not for fair comparison infrastructure"
    why_gap_matters: "Method selection is currently based on uncontrolled, incomparable results"

# ============================================================================
# 3. KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Hallucination detection method effectiveness is benchmark-sensitive in ways not previously reported—semantic entropy works on HaluEval but fails (inverted) on TruthfulQA under identical conditions."
    expanded_explanation: |
      Our pilot study found semantic entropy AUROC=0.551 on HaluEval (marginal but above random)
      but AUROC=0.289 on TruthfulQA (worse than random, inverted). Self-consistency performed
      near-random on both. This suggests benchmark design fundamentally affects method evaluation.

  why_others_missed_it:
    common_assumptions: "Methods generalize across hallucination benchmarks"
    our_different_view: "Benchmarks encode different hallucination definitions that may not align with detection methods"
    enabling_factor: "Tested same methods on multiple benchmarks under identical setup—exposed sensitivity"

  what_makes_it_work:
    intuitive_explanation: "TruthfulQA measures truthfulness (best answer matching), HaluEval measures factual correctness—different target labels, different method effectiveness"
    key_mechanism: "Semantic entropy clusters by NLI entailment; if benchmark labels don't align with entailment-based uncertainty, AUROC inverts"

# ============================================================================
# 4. EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Under matched computational budgets, semantic entropy and self-consistency show benchmark-dependent performance that cannot be predicted from published results"
    measurable_criteria: "AUROC comparison across TruthfulQA and HaluEval with identical N=10 samples, same model"
    confidence_level: "LOW (pilot study, n=20 per dataset)"

  supporting_evidence:
    - id: "evidence_1"
      what: "SE AUROC=0.551 on HaluEval, 0.289 on TruthfulQA"
      so_what: "Same method, opposite performance direction across benchmarks"
      how_it_supports_claim: "Demonstrates benchmark sensitivity"
      figure_ref: "fig_1 (ROC curves)"

    - id: "evidence_2"
      what: "SC AUROC 0.444-0.474 (near random) on both datasets"
      so_what: "BERTScore-based consistency may not capture hallucination-relevant uncertainty"
      how_it_supports_claim: "SC mechanism unverified; method may need different similarity metric"

    - id: "evidence_3"
      what: "Wide confidence intervals (95% CI spans 0.5+ range)"
      so_what: "Pilot sample size insufficient for definitive conclusions"
      how_it_supports_claim: "Establishes need for larger-scale validation"

  surprising_findings:
    finding: "TruthfulQA produced inverted AUROC for semantic entropy (high uncertainty on truthful, low on hallucinated)"
    why_surprising: "Literature reports SE AUROC ~0.85 on TruthfulQA"
    our_interpretation: "Labeling mismatch—'Best Answer' matching may not align with hallucination detection definition"
    competing_explanations:
      - "Model-specific (Llama-3-8B) behavior"
      - "Implementation difference from original paper"
      - "Benchmark label quality issues"

# ============================================================================
# 5. LIMITATIONS (Honest, Principled)
# ============================================================================

honest_limitations:
  - id: "L1"
    limitation: "Sample size too small (n=20 per dataset) for statistical power"
    why_acceptable: "PoC mode by design; pipeline functionality validated"
    framing: "Pilot study to validate experimental pipeline; full-scale results forthcoming"

  - id: "L2"
    limitation: "TruthfulQA labeling may not align with hallucination detection"
    why_acceptable: "Identifies methodological issue for future work"
    framing: "Labeling protocol alignment needed between benchmarks and detection methods"

  - id: "L3"
    limitation: "Single model family tested (Llama-3-8B)"
    why_acceptable: "Standard PoC practice"
    framing: "Initial results on Llama-3-8B; generalization requires multi-model validation"

# ============================================================================
# 6. BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First matched-budget pilot comparison revealing benchmark sensitivity in hallucination detection methods"
    why_significant: "Provides foundation for rigorous method evaluation protocols"

  implications:
    for_field: "Method papers should evaluate on multiple benchmarks under controlled conditions"
    for_practice: "Practitioners should not assume method performance transfers across benchmarks"

  future_possibilities:
    immediate_extensions:
      - "Full-scale evaluation (N=817+ samples)"
      - "Multi-model validation (Mistral-7B, others)"
      - "NLI-based consistency metric for SC"
    longer_term_vision: "Benchmark-specific method recommendation system"

# ============================================================================
# 7. SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress puzzle→insight→contribution into ~150 words"
    key_message: "Hallucination detection methods are benchmark-sensitive; controlled comparison is essential"
    must_include:
      - "Pilot study framing"
      - "Key quantitative finding (SE 0.551 vs 0.289)"
      - "Limitation acknowledgment"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "puzzle_paradox"
    transition_to_related: "Given this gap in controlled comparison, we first survey existing methods..."
    word_target: "~800-1000"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify controlled comparison"
    positioning_strategy: "Acknowledge method contributions, highlight evaluation gaps"
    key_comparison_points:
      - "Semantic entropy (Kuhn et al. 2023)"
      - "SelfCheckGPT (Manakul et al. 2023)"
      - "Contextual calibration (Zhao et al. 2021)"
      - "No matched-budget comparison exists"
    word_target: "~600-800"

  methodology:
    narrative_purpose: "WHY this matched-budget design addresses the gap"
    connection_to_insight: "To reveal benchmark sensitivity, we must control computational budget"
    key_design_decisions:
      - "Matched N=10 samples across methods"
      - "Two benchmarks with different hallucination definitions"
      - "Same model (Llama-3-8B) for consistency"
      - "PoC mode (n=20) for pipeline validation"
    word_target: "~1000-1200"

  experiments:
    narrative_purpose: "Design that tests benchmark sensitivity claim"
    experimental_questions:
      - "Q1: Do both methods detect above random on each benchmark?"
      - "Q2: Does method ranking differ across benchmarks?"
      - "Q3: Are results statistically significant?"
    word_target: "~800-1000"

  results:
    narrative_purpose: "Present evidence with interpretation"
    main_result_highlight: "SE marginal on HaluEval, inverted on TruthfulQA; SC near-random on both"
    figure_placement:
      - "fig_1: ROC curves (primary result visualization)"
      - "fig_2: Score distributions"
      - "fig_3: Gate comparison"
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, identify future work"
    honest_limitations:
      - "Small sample size"
      - "TruthfulQA labeling mismatch hypothesis"
      - "Single model family"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Callback to hook, reinforce contribution, open future"
    callback_to_hook: "Return to the benchmark sensitivity puzzle—controlled comparison revealed the issue"
    future_vision: "Toward benchmark-aware method selection"
    word_target: "~300-400"

