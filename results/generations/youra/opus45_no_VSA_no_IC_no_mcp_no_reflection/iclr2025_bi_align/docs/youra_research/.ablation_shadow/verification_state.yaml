main_hypothesis:
  id: H-BiAlign-v1
  title: Bidirectional Alignment Training
  statement: 'Under standard RLHF fine-tuning conditions, if we augment the helpfulness

    reward with IFEval-derived controllability signals (R_combined = α·R_AlpacaEval

    + β·R_IFEval_rate), then the resulting model will achieve higher held-out

    instruction-following scores, maintain helpfulness, AND improve safety benchmark

    performance, because explicit constraint training builds general constraint-following

    capacity that transfers to implicit safety constraints.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: IFEval (70/30 split) + UltraFeedback
    model: Llama-3-8B-Instruct
    optimizer: PPO via trl
    hyperparameters:
      alpha_range:
      - 0.2
      - 0.4
      - 0.6
      - 0.8
      training_steps: same across conditions
      batch_size: same across conditions
      learning_rate: same across conditions
