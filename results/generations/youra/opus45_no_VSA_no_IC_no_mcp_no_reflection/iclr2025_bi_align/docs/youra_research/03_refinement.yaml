# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training Signal Configuration"
      type: "categorical"
      operationalization: "Reward function composition during RLHF"
      levels:
        - "B1: SFT-only (no RLHF)"
        - "B2: RLHF with AlpacaEval reward (helpfulness)"
        - "B3: RLHF with quality-only reward (excluding instruction adherence)"
        - "T1-T4: RLHF with combined AlpacaEval + IFEval at α ∈ {0.2, 0.4, 0.6, 0.8}"
    - name: "α/β Weight Ratio"
      type: "continuous"
      operationalization: "α for helpfulness, β=1-α for controllability"
      levels: [0.2, 0.4, 0.6, 0.8]
  dependent:
    - name: "Instruction-Following Accuracy"
      type: "continuous"
      operationalization: "IFEval strict accuracy on held-out 30% test split"
      primary: true
    - name: "Helpfulness Score"
      type: "continuous"
      operationalization: "AlpacaEval win rate vs reference model"
      primary: false
    - name: "Safety Benchmark Performance"
      type: "continuous"
      operationalization: "Accuracy on TruthfulQA and BBQ benchmarks"
      primary: false
  controlled:
    - name: "Base Model"
      operationalization: "Same pretrained model (e.g., Llama-3-8B) across all conditions"
    - name: "Training Compute"
      operationalization: "Same number of PPO steps, batch size, learning rate"
    - name: "Evaluation Protocol"
      operationalization: "Same lm-eval-harness configuration across conditions"

