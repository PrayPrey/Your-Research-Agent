# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiAlign-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard RLHF fine-tuning conditions, if we augment the helpfulness
    reward with IFEval-derived controllability signals (R_combined = α·R_AlpacaEval
    + β·R_IFEval_rate), then the resulting model will achieve higher held-out
    instruction-following scores, maintain helpfulness, AND improve safety benchmark
    performance, because explicit constraint training builds general constraint-following
    capacity that transfers to implicit safety constraints.
  alternative_hypothesis_h0: |
    There is no significant difference in held-out IFEval scores, AlpacaEval
    performance, or safety benchmark scores (TruthfulQA, BBQ) between models
    fine-tuned with bidirectional (helpfulness + controllability) signals versus
    unidirectional (helpfulness-only) signals.

