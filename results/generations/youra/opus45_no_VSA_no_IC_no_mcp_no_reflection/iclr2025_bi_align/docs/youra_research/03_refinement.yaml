# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "IFEval constraint satisfaction rate computed as continuous reward signal"
      evidence: "Prof. Pax validated: expected value of binary constraint satisfaction is differentiable proxy"
      falsifier: "If IFEval rate doesn't correlate with actual instruction-following behavior"
    - step: 2
      description: "Combined reward R = α·R_helpfulness + β·R_controllability optimized via PPO"
      evidence: "Standard multi-objective RL; trl PPOTrainer supports custom reward functions"
      falsifier: "If optimization diverges or reward hacking dominates"
    - step: 3
      description: "Model learns to satisfy explicit constraints (format, length, structure)"
      evidence: "P1 prediction: held-out IFEval improvement validates this step"
      falsifier: "If IFEval_test shows no improvement over baselines"
    - step: 4
      description: "Explicit constraint capacity generalizes to implicit safety constraints"
      evidence: "Analogous to Constitutional AI's explicit→implicit transfer"
      falsifier: "If safety benchmarks (TruthfulQA, BBQ) show no improvement"
  key_tension: "Step 4 (explicit→implicit generalization) is the weakest link — requires P3 to validate"
  evidence_summary: |
    Steps 1-3 are well-supported by existing RLHF methodology. Step 4 is the novel
    mechanism claim requiring empirical validation through safety benchmark comparison.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "IFEval constraint satisfaction rate is a valid proxy for controllability"
    supporting_evidence: "IFEval designed to measure instruction-following; rule-based verification is objective"
    consequence_if_violated: "Training signal doesn't capture true controllability; need alternative metric"
  - id: "A2"
    assumption: "AlpacaEval and IFEval measure orthogonal constructs"
    supporting_evidence: "AlpacaEval uses GPT-4 quality judgment; IFEval uses rule-based constraint checking"
    consequence_if_violated: "Signals are redundant; combined training provides no benefit"
  - id: "A3"
    assumption: "Explicit constraint training transfers to implicit constraint adherence"
    supporting_evidence: "Constitutional AI showed explicit safety training improves implicit harmlessness"
    consequence_if_violated: "Safety benchmarks won't improve; P3 fails"
  - id: "A4"
    assumption: "70/30 IFEval split avoids memorization"
    supporting_evidence: "Standard train/test split; held-out instructions are unseen during training"
    consequence_if_violated: "IFEval_test improvements reflect memorization, not generalization"
  - id: "A5"
    assumption: "Optimal α/β exists on Pareto frontier"
    supporting_evidence: "Multi-objective optimization theory guarantees Pareto solutions"
    consequence_if_violated: "All trade-offs are sharp; no configuration achieves P1+P2+P3 simultaneously"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Language models undergoing RLHF fine-tuning
    - Instruction-following tasks with verifiable constraints
    - English-language benchmarks (IFEval, AlpacaEval, TruthfulQA, BBQ)
    - Base models in 7B-13B parameter range
  does_not_apply_to: |
    - Pre-training (this is about fine-tuning signals)
    - Non-instruction tasks (pure generation, completion)
    - Non-English languages (benchmarks are English-only)
    - Extremely large models (100B+) where dynamics may differ
  known_limitations: |
    - IFEval constraint types may not cover all controllability dimensions
    - AlpacaEval GPT-4 judge has known biases (verbosity, formatting)
    - Safety benchmarks (TruthfulQA, BBQ) are static and may be partially saturated
    - Single α/β per training run; adaptive weighting not explored

