hypothesis_draft:
  title: "Bidirectional Alignment Training"
  hypothesis_id: "H-BiAlign-v1"
  core_claim: |
    Augmenting RLHF helpfulness rewards with IFEval-derived controllability
    signals produces models that excel at instruction-following, maintain
    helpfulness, and improve on safety benchmarks.
  mechanism: |
    Combined reward R = α·R_AlpacaEval + β·R_IFEval_rate is optimized via PPO.
    Explicit constraint training (IFEval-style) builds general constraint-following
    capacity that transfers to implicit safety constraints.
  predictions:
    - P1: "Higher held-out IFEval scores than single-signal baselines"
    - P2: "Maintain ≥95% of baseline AlpacaEval performance"
    - P3: "Improve ≥2pp on at least one safety benchmark (TruthfulQA or BBQ)"

variables_summary:
  independent: "Training signal configuration: SFT-only, AlpacaEval RLHF, quality-only RLHF, or combined (α/β sweep)"
  dependent_primary: "Held-out IFEval strict accuracy"
  controlled: "Base model (Llama-3-8B), training compute, evaluation protocol"

null_hypothesis:
  h0_statement: |
