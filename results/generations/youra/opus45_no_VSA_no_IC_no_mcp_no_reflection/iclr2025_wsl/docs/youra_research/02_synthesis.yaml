    - "Include multiple architecture families to establish generality"

discussion_synthesis:
  key_insights:
    - "Architecture-invariant features should target learning dynamics (heavy-tailed), not architecture specifics"
    - "Must explicitly beat parameter-count baseline to claim meaningful contribution"
    - "Heavy-tailed theory for ViT is a testable sub-hypothesis, not an assumption"
  breakthrough_moments:
    - "Prof. Rex's identification of model-size confound led to explicit baseline requirement"
    - "Reframing from 'universal features' to 'transfer across architecture families'"
  resolved_tensions:
    - "Complexity vs simplicity: start with simple features (Frobenius, spectral, heavy-tailed) before elaborate constructs"
    - "Within-architecture vs cross-architecture: the contribution is in transfer, not replication"
