hypothesis_draft:
  title: "Cross-Architecture Weight Feature Generalization for Accuracy Prediction"
  hypothesis_id: "H-CrossArchWeightFeatures-v1"
  core_claim: |
    Simple architecture-agnostic weight statistics (heavy-tailed exponent α,
    spectral norms, Frobenius norms) can predict ImageNet validation accuracy
    across architecture families (ResNet, ViT, ConvNeXt) better than a
    parameter-count baseline, because well-trained models exhibit similar
    implicit self-regularization signatures regardless of architecture.
  mechanism: |
    1. Training produces implicit self-regularization manifesting as heavy-tailed weight distributions
    2. Self-regularization signatures encode generalization quality in an architecture-invariant way
    3. A unified regressor can learn the mapping from weight statistics to accuracy across architectures
  predictions:
    - P1: "Heavy-tailed exponents computable with bounded variance (σ < 0.5) for ViT models"
    - P2: "Unified regressor R² ≥ baseline R² + 0.15 on held-out architecture family"
    - P3: "Top 20% predicted ∩ top 20% actual > 80% within each architecture family"

variables_summary:
  independent: "Heavy-tailed exponent (α), mean spectral norm ratio, normalized Frobenius norm, architecture family"
  dependent_primary: "ImageNet validation accuracy (top-1)"
  controlled: "Dataset (ImageNet-1K), input resolution (native per model)"

null_hypothesis:
  h0_statement: |
    Weight statistics do not improve ImageNet accuracy prediction over a
    log(parameter_count) regression baseline. The unified regressor trained
    on weight features achieves R² ≤ baseline R² + 0.15 on held-out architecture families.
  statistical_test: "Paired t-test or permutation test comparing R² values"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic evaluation of weight-feature prediction transfer across CNN/Transformer boundary"
  differentiation_summary: |
    Prior work (Unterthiner 2020, Martin & Mahoney 2021) established feasibility
    for CNNs. This hypothesis tests whether the same features transfer to
    architecturally distinct models (ViT, ConvNeXt), which is not established.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
