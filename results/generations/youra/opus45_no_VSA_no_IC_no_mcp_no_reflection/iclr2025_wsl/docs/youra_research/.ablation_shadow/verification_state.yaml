main_hypothesis:
  id: H-CrossArchWeightFeatures-v1
  title: Cross-Architecture Weight Feature Generalization for Accuracy Prediction
  statement: Under collections of pretrained vision models on Hugging Face Model Hub (ResNet, ViT, ConvNeXt families), if
    we extract architecture-agnostic weight statistics (heavy-tailed exponent α, mean spectral norm ratio, normalized Frobenius
    norm) and train a single regression model, then this unified predictor achieves R² at least 0.15 higher than a parameter-count
    baseline when predicting ImageNet validation accuracy across architecture families.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: ImageNet-1K validation set (50,000 images)
    model: MLP Regressor (scikit-learn/PyTorch)
    optimizer: null
    hyperparameters:
      min_models_per_family: 100
      held_out_family: ViT
