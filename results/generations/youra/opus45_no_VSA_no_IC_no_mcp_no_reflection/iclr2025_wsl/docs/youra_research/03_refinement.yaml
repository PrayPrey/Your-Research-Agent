# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Weight statistics can predict accuracy for CNN models"
      status: "BUILD_ON"
      evidence: "Unterthiner et al. (2020) demonstrated weight→accuracy prediction for CNNs"
    - claim: "Heavy-tailed weight distributions correlate with generalization"
      status: "BUILD_ON"
      evidence: "Martin & Mahoney (2021) showed power-law exponents indicate implicit self-regularization"
    - claim: "Weight statistics transfer predictively across architecture families"
      status: "PROVE_NEW"
      evidence: "Not established — core hypothesis to test"
    - claim: "Heavy-tailed theory applies to ViT attention weights"
      status: "PROVE_NEW"
      evidence: "Not validated — sub-hypothesis H-M1"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims (CNN prediction, heavy-tailed theory) provide foundation.
    Focus experimental validation on PROVE_NEW claims:
    1. Cross-architecture transfer of weight feature predictors
    2. Heavy-tailed exponent validity for attention-based architectures

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CrossArchWeightFeatures-v1"
  confidence_level: 0.70
  core_hypothesis_statement: |
    Under collections of pretrained vision models on Hugging Face Model Hub (ResNet, ViT, ConvNeXt families),
    if we extract architecture-agnostic weight statistics (heavy-tailed exponent α, mean spectral norm ratio, normalized Frobenius norm) and train a single regression model,
    then this unified predictor achieves R² at least 0.15 higher than a parameter-count baseline when predicting ImageNet validation accuracy across architecture families,
    because well-trained models exhibit similar implicit self-regularization signatures (per Martin & Mahoney) regardless of architecture, and these signatures encode generalization quality.
  alternative_hypothesis_h0: |
    Weight statistics do not improve ImageNet accuracy prediction over a log(parameter_count) regression baseline.
    The unified regressor trained on weight features achieves R² ≤ baseline R² + 0.15 on held-out architecture families.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Heavy-tailed exponent (α)"
      type: "continuous"
      operationalization: "Computed via Hill estimator on absolute weight values; range typically [1.5, 4.0]"
    - name: "Mean spectral norm ratio"
      type: "continuous"
      operationalization: "Average of (spectral_norm / frobenius_norm) across all weight matrices"
    - name: "Normalized Frobenius norm"
      type: "continuous"
      operationalization: "Total Frobenius norm divided by sqrt(parameter_count)"
    - name: "Architecture family"
      type: "categorical"
      operationalization: "Model architecture type"
      levels: ["ResNet", "ViT", "ConvNeXt", "Swin", "Other"]
  dependent:
    - name: "ImageNet validation accuracy"
      type: "continuous"
      operationalization: "Top-1 accuracy on ImageNet-1K validation set; range [0.0, 1.0]"
      primary: true
    - name: "Predicted accuracy"
      type: "continuous"
      operationalization: "Regression output from weight-feature model"
      primary: false
  controlled:
    - name: "Dataset"
      operationalization: "All models evaluated on ImageNet-1K validation set (50,000 images)"
    - name: "Input resolution"
      operationalization: "Normalized to model's native resolution (224x224 for most)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Well-trained neural networks develop implicit self-regularization during training, manifesting as heavy-tailed weight distributions"
      evidence: "Martin & Mahoney (2021) theoretical framework; observed in CNN training dynamics"
      falsifier: "ViT models do not exhibit heavy-tailed weight distributions"
    - step: 2
      description: "Self-regularization signatures (heavy-tailed exponents, spectral properties) encode generalization quality regardless of architectural substrate"
      evidence: "Unterthiner et al. (2020) showed weight statistics predict accuracy; theory is about learning dynamics, not architecture"
      falsifier: "Weight features are predictive within architecture families but not across them"
    - step: 3
      description: "A unified regressor trained on architecture-agnostic weight features transfers across architecture families"
      evidence: "If mechanism is truly architecture-invariant, learned mapping should generalize"
      falsifier: "Cross-architecture R² is not significantly better than within-architecture baseline"
  key_tension: "Whether heavy-tailed theory developed on CNNs applies to attention-based architectures with different parameter structures"
  evidence_summary: |
    The causal chain connects learning dynamics (training produces regularization signatures)
    to weight statistics (signatures are measurable) to prediction (statistics predict generalization).
    The key gap is validating step 1-2 for non-CNN architectures.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Heavy-tailed weight distributions are a universal property of well-trained neural networks, not CNN-specific"
    supporting_evidence: "Martin & Mahoney's theory is about SGD dynamics, not architecture"
    consequence_if_violated: "Must use architecture-specific features instead of unified predictor"
  - id: "A2"
    assumption: "ImageNet accuracy reported on Hugging Face is accurate and comparable across models"
    supporting_evidence: "Standard benchmark with established evaluation protocol"
    consequence_if_violated: "Need to re-evaluate models ourselves, increasing cost"
  - id: "A3"
    assumption: "Weight statistics computed on downloaded model checkpoints reflect training quality, not post-hoc modifications"
    supporting_evidence: "Most Hugging Face models are direct training outputs"
    consequence_if_violated: "Quantized or pruned models may confound analysis"
  - id: "A4"
    assumption: "Sufficient model diversity exists on Hugging Face (100+ models per architecture family with varied accuracies)"
    supporting_evidence: "Hugging Face hosts thousands of vision models"
    consequence_if_violated: "Reduced statistical power; may need to scrape additional sources"
  - id: "A5"
    assumption: "Training procedure variation is not the dominant factor in weight statistics variance"
    supporting_evidence: "Heavy-tailed theory focuses on final state, not training path"
    consequence_if_violated: "Must include training recipe as covariate if metadata available"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Pretrained image classification models on Hugging Face Model Hub
    - Architecture families: ResNet, ViT, ConvNeXt, Swin, DeiT, EfficientNet
    - ImageNet-1K trained/fine-tuned models with reported validation accuracy
    - Models with accessible PyTorch weights
  does_not_apply_to: |
    - Object detection, segmentation, or other non-classification models
    - Models trained on datasets other than ImageNet (transfer validity unknown)
    - Quantized, pruned, or distilled models (weight statistics may be confounded)
    - Closed-source models without accessible weights
  known_limitations: |
    - Cannot control for training procedure variation without metadata
    - Heavy-tailed exponent computation may be noisy for small models
    - Cross-architecture transfer assumes all architectures encode similar information in weights

