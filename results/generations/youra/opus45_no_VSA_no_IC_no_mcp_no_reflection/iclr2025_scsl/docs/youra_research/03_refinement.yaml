# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Simplicity bias causes spurious features to be learned before core features"
      status: "BUILD_ON"
      evidence: "Shah et al. (2020) 'Simplicity Bias in Neural Networks'"
    - claim: "Last-layer retraining can recover core features (DFR)"
      status: "BUILD_ON"
      evidence: "Kirichenko et al. (2023) 'Deep Feature Reweighting'"
    - claim: "Two-stage training improves worst-group accuracy (JTT)"
      status: "BUILD_ON"
      evidence: "Liu et al. (2021) 'Just Train Twice'"
    - claim: "Progressive gradient orthogonalization improves robustness"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis from Phase 2A discussion"
  scope_reduction_percentage: 75
  phase2b_4_instructions: |
    BUILD_ON claims establish context. Focus verification on PROVE_NEW claim:
    progressive gradient orthogonalization mechanism.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-PGO-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard supervised classification with spurious correlations,
    if we progressively project training gradients orthogonal to the cumulative
    "easy gradient" subspace, then worst-group accuracy improves relative to ERM,
    because the model is forced to learn features that generalize beyond
    majority-group shortcuts.
  alternative_hypothesis_h0: |
    There is no significant difference in worst-group accuracy between
    Progressive Gradient Orthogonalization (PGO) and standard ERM training.

