# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Early training: network follows 'easy' gradients toward spurious features"
      evidence: "Shah et al. (2020) - simplicity bias causes early spurious feature learning"
      falsifier: "If early gradients don't correlate with spurious features, mechanism fails"
    - step: 2
      description: "PGO accumulates early gradient directions into subspace S"
      evidence: "Incremental SVD maintains running estimate of cumulative gradient subspace"
      falsifier: "If subspace S is uninformative (low variance), mechanism fails"
    - step: 3
      description: "Later gradients projected orthogonal to S must find core features"
      evidence: "Orthogonalization forces exploration of loss landscape regions not explained by S"
      falsifier: "If orthogonalized gradients still increase spurious feature reliance, mechanism fails"
  key_tension: "Early gradient subspace may contain some core feature directions"
  evidence_summary: |
    Simplicity bias (established) causes spurious features to dominate early gradients.
    Gradient projection is mathematically well-defined. Forcing orthogonality to the
    spurious subspace should require the network to find alternative (core) features.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Early gradient subspace is primarily spurious, not core"
    supporting_evidence: "Simplicity bias predicts spurious features learned first"
    consequence_if_violated: "Orthogonalization would harm core feature learning"
  - id: "A2"
    assumption: "Low-rank SVD approximation captures spurious gradient directions"
    supporting_evidence: "Spurious features are 'simple' — low-dimensional subspace"
    consequence_if_violated: "Subspace S would miss spurious directions"
  - id: "A3"
    assumption: "Core and spurious feature gradients are separable in parameter space"
    supporting_evidence: "Distributed representations still have directional structure"
    consequence_if_violated: "Orthogonalization would be impossible"
  - id: "A4"
    assumption: "Progressive orthogonalization doesn't collapse training dynamics"
    supporting_evidence: "Similar to gradient penalty methods that remain stable"
    consequence_if_violated: "Training would diverge or converge to poor solutions"
  - id: "A5"
    assumption: "Existing benchmarks (Waterbirds, CelebA) have sufficient spurious correlation"
    supporting_evidence: "Established benchmarks with known spurious features"
    consequence_if_violated: "Would need different benchmarks to test hypothesis"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Image classification with spurious background correlations
    - Settings where spurious features are simpler than core features
    - Standard supervised learning without group annotations
  does_not_apply_to: |
    - Tasks without spurious correlations
    - Settings where spurious features are more complex than core features
    - Reinforcement learning or other non-supervised paradigms
  known_limitations: |
    - Requires hyperparameter tuning for rank k and α_max
    - Additional memory overhead (~5GB for ResNet-50)
    - May not help if spurious and core features have similar complexity

