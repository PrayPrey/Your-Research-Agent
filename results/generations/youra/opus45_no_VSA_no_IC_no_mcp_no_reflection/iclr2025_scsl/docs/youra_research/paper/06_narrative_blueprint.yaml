# Phase 6 Narrative Blueprint
# Narrative-First Paper Design for PGO Research
# Generated: 2026-08-29

metadata:
  hypothesis_id: "H-PGO-v1"
  gate_result: "PARTIAL"
  narrative_type: "negative_methodological_result"
  primary_source: "045_validated_hypothesis.md"

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "Gradient-based interventions for spurious correlation robustness promise single-run training without group labels—but our experiments reveal a critical measurement challenge: naive gradient subspace accumulation produces representations too low-rank to distinguish spurious from core feature directions."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Methods claiming to exploit training dynamics for robustness may be measuring noise rather than meaningful signal"
    concrete_example: "We observed spurious and core alignment both at ~0.05 (essentially indistinguishable) when theory predicted >0.70 vs <0.30"
    stakes: "Without understanding minimum requirements for gradient subspace analysis, researchers may waste effort on fundamentally flawed approaches"

  anti_patterns_avoided:
    - "NOT: 'Spurious correlations are an important problem...'"
    - "NOT: 'Deep learning has achieved remarkable success...'"
    - "INSTEAD: Direct statement of surprising negative finding"

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Models trained with ERM learn spurious correlations, hurting worst-group accuracy"
    common_understanding: "Spurious features are simpler, learned first (simplicity bias)"

  deeper_problem:
    description: "Existing robustification methods require group labels (Group DRO), two training runs (JTT), or post-training intervention (DFR)"
    why_overlooked: "Focus on sample-level rather than gradient-level interventions"
    our_perspective: "Training dynamics (gradients) might encode spurious information exploitably"

  gap_in_existing_work:
    description: "No validated method to identify spurious gradient directions in parameter space during training"
    why_gap_exists: "Assumed simplicity bias translates directly to gradient subspace separability"
    why_gap_matters: "Without measurement validity, gradient-based interventions cannot be reliably designed"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Gradient subspace analysis in high-dimensional parameter spaces requires sufficient sample density; single gradients per epoch produce subspaces too low-rank for meaningful directional analysis."
    expanded_explanation: |
      We discovered that accumulating only one gradient vector per epoch
      produces a 10-dimensional subspace in a 25-million-parameter space.
      This is insufficient to capture meaningful variance in any direction,
      making alignment measurements unreliable regardless of the underlying
      phenomenon. The measurement is broken before the hypothesis is tested.

  why_others_missed_it:
    common_assumptions: "Low-rank SVD of accumulated gradients captures principal training directions"
    our_different_view: "Rank must be sufficient relative to parameter count for meaningful projection"
    enabling_factor: "Actually running the experiment and examining why alignment was near-zero for BOTH directions"

  what_makes_it_work:
    intuitive_explanation: "Like trying to measure correlation with only 10 data points in a million-dimensional space"
    key_mechanism: "Projection energy onto a 10-dim subspace of a 25M-dim space is negligible regardless of direction"

# =============================================================================
# EVIDENCE STORY
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "The PGO hypothesis remains unverified because the experimental apparatus (gradient subspace accumulation) failed validation"
    measurable_criteria: "Spurious alignment should be >0.70, core <0.30; observed both ~0.05"

  supporting_evidence:
    - id: "evidence_1"
      what: "Spurious alignment = 0.052, core alignment = 0.056 at epoch 10"
      so_what: "Values are statistically indistinguishable, near zero"
      how_it_supports_claim: "Demonstrates measurement failure, not hypothesis falsification"

    - id: "evidence_2"
      what: "SVD produced 10-dimensional subspace"
      so_what: "Captures negligible variance in 25M-parameter space"
      how_it_supports_claim: "Explains WHY alignment values are meaningless"

    - id: "evidence_3"
      what: "Training completed successfully (90 epochs, 91.8% validation accuracy)"
      so_what: "The model learned normally; only the measurement failed"
      how_it_supports_claim: "Isolates the problem to gradient accumulation, not training"

  surprising_findings:
    finding: "Near-identical alignment for both spurious and core directions"
    why_surprising: "Theory predicts early gradients strongly favor spurious (simpler) features"
    our_interpretation: "Measurement resolution insufficient—equivalent to random projection"

# =============================================================================
# LIMITATIONS (MUST INCLUDE)
# =============================================================================

honest_limitations:
  - limitation: "Core hypothesis unverified"
    framing: "Preliminary experiments identified methodological requirements for gradient subspace analysis"

  - limitation: "Mechanism chain incomplete"
    framing: "Full mechanism evaluation deferred pending resolution of gradient accumulation"

  - limitation: "Only one dataset (Waterbirds) tested"
    framing: "Focused investigation sufficient to identify measurement issue"

# =============================================================================
# TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "We establish minimum requirements for gradient subspace analysis: multi-batch accumulation necessary for meaningful directional measurement"
    why_significant: "Prevents wasted effort on gradient-based methods with invalid measurement apparatus"

  implications:
    for_field: "Future gradient-based robustification work must validate subspace rank sufficiency"
    for_practice: "Do not deploy gradient orthogonalization without accumulation validation"

  future_possibilities:
    immediate_extensions: "Re-run H-E1 with streaming SVD across all batches in epochs 1-10"
    longer_term_vision: "If foundation validates, test full PGO mechanism chain"

# =============================================================================
# SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress negative finding + methodological contribution into ~150 words"
    key_message: "Gradient subspace methods require validation; we identify minimum requirements"

  introduction:
    narrative_purpose: "Hook (surprising failure) → Problem (robustification needs gradient methods) → Insight (measurement validity) → Preview"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Existing gradient-based methods assume separability; we test this assumption"

  related_work:
    narrative_purpose: "Show gradient-based approaches exist but lack measurement validation"
    positioning_strategy: "Complements rather than supersedes—we identify a validity issue"
    key_comparison_points:
      - "Group DRO, JTT, DFR: sample-level, not gradient-level"
      - "Simplicity bias theory: gradient consequences assumed, not measured"

  methodology:
    narrative_purpose: "Show our measurement apparatus and why it matters"
    connection_to_insight: "Gradient accumulation design determines measurement validity"
    key_design_decisions:
      - "Incremental SVD for gradient subspace"
      - "Alignment metric via projection energy"
      - "Single-batch vs multi-batch accumulation"

  experiments:
    narrative_purpose: "Test whether gradient subspace captures spurious directions"
    experimental_questions:
      - "Does accumulated gradient subspace align with spurious features?"
      - "Is alignment distinguishable from random projection?"

  results:
    narrative_purpose: "Report finding: alignment indistinguishable, explain why"
    main_result_highlight: "Both alignments ~0.05 due to insufficient subspace rank"

  discussion:
    narrative_purpose: "Interpret failure, derive methodological guidance"
    honest_limitations:
      - "Hypothesis unverified"
      - "Single dataset"
      - "Implementation issue identified"

  conclusion:
    narrative_purpose: "Callback to hook, establish what we learned"
    callback_to_hook: "The promise of gradient-based robustification awaits valid measurement—we show what that requires"

# =============================================================================
# NARRATIVE COHERENCE CHECK
# =============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES - both reference measurement validity for gradient methods"

  - check: "Does each section naturally flow to the next?"
    status: "YES - problem → related → method → test → finding → interpretation → takeaway"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES - multi-batch accumulation requirement appears in Methods, Results, Discussion, Conclusion"

  - check: "Are all major claims supported by evidence?"
    status: "YES - alignment values (0.05) and SVD rank (10-dim) documented in h-e1/04_validation.md"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "TENTATIVE - negative result, but methodological contribution clear"
