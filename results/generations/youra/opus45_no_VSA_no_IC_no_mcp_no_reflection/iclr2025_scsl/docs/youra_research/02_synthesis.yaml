hypothesis_draft:
  title: "Progressive Gradient Orthogonalization (PGO)"
  hypothesis_id: "H-PGO-v1"
  core_claim: |
    Progressive projection of training gradients orthogonal to the cumulative
    "easy gradient" subspace forces networks to learn core features by blocking
    reinforcement of spurious shortcuts.
  mechanism: |
    1. Early training: Network follows easy gradients toward spurious features
    2. PGO accumulates these directions into subspace S via incremental SVD
    3. Later gradients projected orthogonal to S must find alternative (core) features
  predictions:
    - P1: "PGO improves worst-group accuracy by ≥5% over ERM on Waterbirds"
    - P2: "PGO matches or exceeds JTT without two training runs"
    - P3: "PGO representations show higher core-feature probe accuracy than ERM"

variables_summary:
  independent: "Orthogonalization strength schedule (none/linear/step) and subspace rank k (10/25/50)"
  dependent_primary: "Worst-group test accuracy"
  controlled: "ResNet-50, lr=0.001, batch=64, epochs=50, 5 random seeds"

null_hypothesis:
  h0_statement: |
    There is no significant difference in worst-group accuracy between
    Progressive Gradient Orthogonalization (PGO) and standard ERM training.
  statistical_test: "Two-sample t-test on worst-group accuracy"
  significance_level: 0.05

novelty_assessment:
