main_hypothesis:
  id: H-PGO-v1
  title: Progressive Gradient Orthogonalization for Spurious Correlation Robustness
  statement: Under standard supervised classification with spurious correlations, if we progressively project training gradients
    orthogonal to the cumulative easy gradient subspace, then worst-group accuracy improves relative to ERM, because the model
    is forced to learn features that generalize beyond majority-group shortcuts.
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: Waterbirds
    model: ResNet-50
    optimizer: SGD
    hyperparameters:
      learning_rate: 0.001
      batch_size: 64
      epochs: 50
      seeds: 5
