variables:
  independent:
    - name: "Reward Information Bandwidth"
      type: "categorical"
      operationalization: "Structure of reward signal: binary, continuous, or categorical+continuous"
      levels:
        - "LOW: reward ∈ {0, 1} (binary pass/fail)"
        - "MEDIUM: reward = test_pass_rate ∈ [0, 1] (continuous)"
        - "HIGH: reward = 0.5 × pass_rate + 0.5 × error_score (categorical + continuous)"
  dependent:
    - name: "Samples-to-Threshold"
      type: "continuous"
      operationalization: "Number of generated solutions until pass@1 > 0.3 on HumanEval"
