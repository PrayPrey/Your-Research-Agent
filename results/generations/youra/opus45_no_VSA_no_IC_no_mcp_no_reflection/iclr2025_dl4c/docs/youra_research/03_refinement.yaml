key_assumptions:
  - id: "A1"
    assumption: "Error types form a meaningful ordering reflecting distance to correct solution"
    supporting_evidence: "Execution stages: parse → execute → assert → pass represent clear progression"
    consequence_if_violated: "Error_score weighting would be arbitrary, HIGH condition loses principled grounding"
  - id: "A2"
    assumption: "CodeLlama-7B has sufficient capacity to learn from fine-grained signals"
    supporting_evidence: "7B parameter models have shown ability to learn code generation via RL (PPOCoder)"
    consequence_if_violated: "Model might not have capacity to use additional signal, masking true effect"
  - id: "A3"
    assumption: "PPO training is stable enough to attribute effects to reward function"
    supporting_evidence: "TRL library provides stable PPO implementation, PPOCoder demonstrated stability"
    consequence_if_violated: "Training instability would add noise, requiring more seeds"
  - id: "A4"
    assumption: "HumanEval is representative of code generation quality"
    supporting_evidence: "HumanEval is standard benchmark used by CodeRL, RLTF, PPOCoder"
    consequence_if_violated: "Results might not generalize to other code generation tasks"
  - id: "A5"
    assumption: "5 seeds per condition provides sufficient statistical power"
    supporting_evidence: "Power analysis with σ ≈ 0.03 achieves 80% power for effect size d = 0.8"
    consequence_if_violated: "May fail to detect smaller true effects"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - RLEF training of code LLMs on execution-based feedback
    - Medium-scale models (7B parameters)
    - Python code generation tasks with test-based evaluation
    - Standard competitive programming style problems
  does_not_apply_to: |
    - Non-execution feedback (LLM-as-judge, human evaluation)
    - Very large models (unclear if scaling changes dynamics)
    - Non-Python languages (execution infrastructure differs)
    - Tasks without test suites (e.g., open-ended generation)
  known_limitations: |
    - 0.5/0.5 weighting between pass_rate and error_score is heuristic
    - Single model size tested (7B)
    - Limited to Python execution environment
    - Error parsing assumes standard Python error formatting

