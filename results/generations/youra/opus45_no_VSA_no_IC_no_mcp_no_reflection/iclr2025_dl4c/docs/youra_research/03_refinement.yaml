# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Higher bandwidth rewards provide more bits of information per gradient update"
      evidence: "Information theory: binary gives 1 bit, error-type gives ~2 bits, pass_rate continuous"
      falsifier: "If mutual information analysis shows similar information content across conditions"
    - step: 2
      description: "Denser signal enables model to distinguish between error types (syntax vs. runtime vs. assertion)"
      evidence: "Error-type scoring with distance-to-correct principle provides ordered feedback"
      falsifier: "If error-type distribution is identical across conditions throughout training"
    - step: 3
      description: "Credit assignment becomes more precise—model learns which code patterns cause which errors"
      evidence: "Gradient direction should differ based on error type received"
      falsifier: "If gradient analysis shows no difference in update directions between conditions"
    - step: 4
      description: "Faster convergence results from more informative gradient directions"
      evidence: "Learning curves should show earlier threshold crossing for HIGH vs LOW"
      falsifier: "If samples-to-threshold is identical across conditions"
  key_tension: "Whether categorical error information adds value beyond continuous pass_rate signal"
  evidence_summary: |
    The mechanism is grounded in information theory (bits per update) and RL credit assignment principles.
    The distance-to-correct error scoring provides principled ordering: syntax=0.0, runtime=0.33, assertion=0.67, pass=1.0.

