hypothesis_draft:
  title: "Reward Information Bandwidth for Code LLM Training"
  hypothesis_id: "H-RewardBandwidth-v1"
  core_claim: |
    Higher reward information bandwidth (categorical + continuous signals) produces faster
    convergence in RLEF training of code LLMs compared to binary pass/fail feedback,
    because denser signals enable more precise credit assignment to error-causing patterns.
  mechanism: |
    1. Higher bandwidth rewards provide more bits of information per gradient update
    2. Error-type scoring (syntax=0.0, runtime=0.33, assertion=0.67, pass=1.0) creates ordered feedback
    3. Model learns which code patterns cause which error types, enabling precise credit assignment
    4. Faster convergence results from more informative gradient directions
  predictions:
    - P1: "HIGH condition reaches pass@1 > 0.3 threshold in fewer samples than LOW (p < 0.05)"
    - P2: "MEDIUM condition converges faster than LOW (tests continuous signal value)"
    - P3: "HIGH shows different error-type distribution by epoch 3 (fewer syntax errors)"

variables_summary:
  independent: "Reward bandwidth: LOW (binary), MEDIUM (pass_rate), HIGH (error_type + pass_rate)"
  dependent_primary: "Samples-to-threshold (pass@1 > 0.3 on HumanEval)"
  controlled: "Base model (CodeLlama-7B), RL algorithm (PPO), dataset (MBPP/HumanEval), compute (3 epochs)"

null_hypothesis:
