# Phase 6: Narrative Blueprint
# Story Design for ICML Paper
# Status: INCONCLUSIVE RESULTS → "Lessons Learned" Framing

metadata:
  generated_at: "2026-08-29T14:35:00Z"
  hypothesis_id: "H-RewardBandwidth-v1"
  result_status: "INCONCLUSIVE"
  paper_type: "negative_results_with_lessons"

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  strategy: "Puzzle/Paradox"

  opening_statement:
    content: |
      Despite theoretical guarantees that denser reward signals should accelerate
      reinforcement learning, we find that at proof-of-concept scale, all feedback
      granularities—binary, categorical, and high-bandwidth—produce identical outcomes:
      zero learning.
    why_engaging: "Counterintuitive finding challenges information theory expectations"

  why_reader_should_care:
    main_reason: |
      RL for code LLMs is expensive. Practitioners need to know minimum viable
      scale before feedback granularity effects emerge.
    concrete_example: |
      Running 3-condition ablation at 1 epoch each costs ~$X in compute.
      Our negative result shows this scale is insufficient for any condition.
    stakes: |
      Without scale guidance, researchers waste resources on underpowered experiments
      that cannot distinguish between "hypothesis is false" and "experiment is underpowered."

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Binary pass/fail rewards may be suboptimal for code LLM training"
    common_understanding: |
      Prior work (CodeRL, RLTF, PPOCoder) uses various feedback granularities
      but lacks controlled comparison.

  deeper_problem:
    description: "No principled guidance on minimum training scale for feedback effects"
    why_overlooked: |
      Papers report final accuracy, not samples-to-signal. Negative results
      at small scale are rarely published.
    our_perspective: |
      Information bandwidth effects may exist but require threshold compute
      to become measurable.

  gap_in_existing_work:
    description: "Missing: minimum viable scale for controlled feedback ablation"
    why_gap_exists: |
      Incentives favor positive results; underpowered experiments are abandoned,
      not reported.
    why_gap_matters: |
      Future researchers need scale guidance to design adequately powered studies.

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: |
      At PoC scale (1 epoch, 3 seeds), all reward conditions hit the same floor—
      the minimum viable scale for this hypothesis exceeds our compute budget.
    expanded_explanation: |
      Our experiment was designed to test information bandwidth effects, but
      instead revealed a methodological finding: PPO on code LLMs requires
      substantial training before any policy improvement emerges. This null
      result, while not confirming or falsifying the hypothesis, provides
      concrete lower bounds for future work.

  why_others_missed_it:
    common_assumptions: "Small-scale pilots can distinguish between conditions"
    our_different_view: |
      Code generation RL has high sample complexity; pilot studies may be
      systematically underpowered.
    enabling_factor: |
      We committed to reporting null results rather than abandoning the study.

  what_makes_it_work:
    intuitive_explanation: |
      Think of it like testing fertilizer on seedlings before they germinate—
      you can't measure growth differences when nothing has sprouted yet.
    key_mechanism: |
      PPO requires thousands of gradient updates before policy improvement;
      1 epoch at PoC scale provides insufficient signal.

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: |
      The reward information bandwidth hypothesis remains UNTESTED at PoC scale—
      all conditions produced 0% pass@1, providing a lower bound for future studies.
    measurable_criteria: |
      Gate: pass@1 > 0.3 threshold. Result: 0% across all conditions.

  supporting_evidence:
    - id: "evidence_1"
      what: "All 3 conditions × 3 seeds = 0% pass@1"
      so_what: "Scale is insufficient for ANY learning, not just differential effects"
      how_it_supports_claim: "Establishes floor, not ceiling"

    - id: "evidence_2"
      what: "t-statistic = NaN (no variance)"
      so_what: "Statistical comparison impossible at floor"
      how_it_supports_claim: "Confirms inconclusiveness rather than falsification"

    - id: "evidence_3"
      what: "Theoretical mechanism remains intact"
      so_what: |
        Information theory grounding (1 bit vs ~2 bits) is not challenged by
        underpowered experiment
      how_it_supports_claim: "Distinguishes methodological failure from theoretical falsification"

  surprising_findings:
    finding: "Zero learning across ALL conditions including binary baseline"
    why_surprising: |
      CodeRL (2022) reported ~25% pass@1 with binary rewards. Our 0% suggests
      their scale was much larger or infrastructure differs.
    our_interpretation: |
      PoC scale (1 epoch, ~1000 gradient updates) is below the threshold
      for PPO policy improvement on code generation.

# =============================================================================
# TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: |
      A negative result establishing minimum viable scale for reward ablation
      studies on code LLMs.
    why_significant: |
      Prevents future researchers from wasting compute on underpowered experiments.

  implications:
    for_field: |
      Scale requirements for code LLM RL are higher than commonly assumed;
      PoC pilots may be systematically uninformative.
    for_practice: |
      Budget ≥3 epochs, ≥5 seeds before expecting measurable feedback effects.

  future_possibilities:
    immediate_extensions: |
      - Retest with adequate compute (3+ epochs, 5+ seeds)
      - Add learning rate warm-up and PPO hyperparameter tuning
      - Include early stopping criteria
    longer_term_vision: |
      Establish sample complexity scaling laws for reward granularity effects.

# =============================================================================
# SECTION GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress story: motivation → negative result → lesson"
    key_message: |
      Reward bandwidth hypothesis UNTESTED at PoC scale; provides lower bound
      for future work.
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook (paradox) → Problem → Why we expected effect → Preview"
    hook_strategy: "Puzzle/Paradox"
    transition_to_related: |
      Prior work varies feedback but doesn't report scale requirements.
    word_target: "~800-1000"

  related_work:
    narrative_purpose: |
      Show feedback diversity exists → controlled comparison missing →
      scale guidance absent.
    positioning_strategy: |
      We BUILD ON CodeRL/RLTF/PPOCoder infrastructure, PROVE NEW by reporting
      scale lower bound.
    key_comparison_points:
      - "CodeRL (binary, unreported scale)"
      - "RLTF (multi-granularity, different infrastructure)"
      - "PPOCoder (PPO, higher compute)"
    word_target: "~600-800"

  methodology:
    narrative_purpose: "WHY this design tests bandwidth hypothesis"
    connection_to_insight: |
      Three conditions vary information content: 1 bit (binary), ~1.5 bits
      (continuous), ~2 bits (categorical + continuous).
    key_design_decisions:
      - "Error-type scoring: syntax=0.0, runtime=0.33, assertion=0.67, pass=1.0"
      - "0.5/0.5 weighting: heuristic, documented as limitation"
      - "PoC scale: 1 epoch, 3 seeds (acknowledged as potential limitation)"
    word_target: "~1000-1200"

  experiments:
    narrative_purpose: "Design tests for bandwidth hypothesis"
    experimental_questions:
      - "Q1: Does HIGH reach pass@1 > 0.3 faster than LOW?"
      - "Q2: Does MEDIUM outperform LOW?"
      - "Q3: Does error distribution differ across conditions?"
    word_target: "~800-1000"

  results:
    narrative_purpose: "Present null result honestly"
    main_result_highlight: |
      ALL conditions: 0% pass@1. No variance. Comparison impossible.
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret null → distinguish inconclusive from falsified"
    honest_limitations:
      - "Scale: 1 epoch insufficient for ANY learning"
      - "Seeds: 3 insufficient for variance estimation"
      - "Infrastructure: possible differences from prior work"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Callback to paradox → future requirements"
    callback_to_hook: |
      The paradox remains: theory predicts bandwidth effects, but PoC scale
      cannot measure them. The answer requires more compute, not more theory.
    word_target: "~300-400"

