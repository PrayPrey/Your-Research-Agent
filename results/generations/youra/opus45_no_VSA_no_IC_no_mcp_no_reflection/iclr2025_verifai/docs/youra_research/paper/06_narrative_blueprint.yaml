# 06_narrative_blueprint.yaml - Phase 6 Step 02
# Narrative Structure for Paper

metadata:
  generated_at: "2026-08-29"
  hypothesis_id: "H-StaticFeedback-v1"
  paper_type: "methodology_study"  # Not full hypothesis validation

# ═══════════════════════════════════════════════════════════════
# HOOK STRATEGY
# ═══════════════════════════════════════════════════════════════

hook:
  opening_question: "Can static analyzers improve LLM code repair, or do they merely validate what execution feedback already catches?"
  tension: "Prior work shows static analysis improves code quality metrics, but functional correctness (pass@k) remains unmeasured."
  promise: "We present a methodology framework and baseline analysis for evaluating static analysis in iterative LLM code repair."
  callback_for_conclusion: "Return to the quality-vs-correctness distinction; emphasize methodology contribution over null result."

# ═══════════════════════════════════════════════════════════════
# PROBLEM FRAMING (3 levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  level_1_broad:
    statement: "LLM code generation has advanced rapidly, but repair loops rely primarily on execution feedback."
    audience: "General ML/NLP researchers"

  level_2_specific:
    statement: "Static analysis provides mechanistic error explanations, yet no study measures its impact on pass@k."
    audience: "Code generation researchers"

  level_3_precise:
    statement: "We need a validated methodology to test whether pylint/mypy feedback improves HumanEval/MBPP pass rates."
    audience: "LLM + static analysis practitioners"

# ═══════════════════════════════════════════════════════════════
# KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  statement: "Canonical HumanEval solutions exhibit only 9.15% pylint warning rate, establishing a floor but not predicting LLM output behavior."
  implication: "Using canonical solutions as LLM proxy is methodologically invalid; dedicated LLM generation required."
  novelty: "First baseline measurement of static warning rates on standard code benchmarks."

# ═══════════════════════════════════════════════════════════════
# EVIDENCE STRUCTURE
# ═══════════════════════════════════════════════════════════════

evidence_structure:
  primary_evidence:
    - claim: "Pylint pipeline successfully detects actionable warnings"
      data: "23 warnings across 9 categories on 164 problems"
      figure: "warning_type_breakdown.png"

    - claim: "Canonical solutions have low warning rate (~9%)"
      data: "15/164 problems with ≥1 warning"
      figure: "gate_metrics.png"

    - claim: "Gate mechanism catches methodology limitations"
      data: "h-e1 FAIL at 9.15% vs 30% threshold"
      figure: "warning_distribution.png"

  supporting_evidence:
    - claim: "Warning types are actionable for code repair"
      data: "bad-indentation (12), unused-import (3), bare-except (2)"
      figure: "top_warning_codes.png"

# ═══════════════════════════════════════════════════════════════
# NARRATIVE ARC
# ═══════════════════════════════════════════════════════════════

narrative_arc:
  act_1_setup:
    sections: [introduction, related_work]
    goal: "Establish gap: static analysis helps quality, unknown for correctness"

  act_2_method:
    sections: [methodology]
    goal: "Present hypothesis structure, experimental design, gate mechanism"

  act_3_evidence:
    sections: [experiments, results]
    goal: "Show what we measured and what we found (methodology validation)"

  act_4_interpretation:
    sections: [discussion]
    goal: "Why proxy failed, what baseline means, path forward"

  act_5_closure:
    sections: [conclusion, abstract]
    goal: "Methodology contribution, future work, honest framing"

# ═══════════════════════════════════════════════════════════════
# HONEST LIMITATIONS
# ═══════════════════════════════════════════════════════════════

limitations_to_highlight:
  - limitation: "No LLM-generated code tested (API access unavailable)"
    framing: "Methodology study establishing baseline for future work"

  - limitation: "Single hypothesis tested (h-e1 only)"
    framing: "Gate mechanism correctly halted at existence gate"

  - limitation: "Single dataset (HumanEval only)"
    framing: "Standard benchmark; MBPP extension is future work"

# ═══════════════════════════════════════════════════════════════
# CONTRIBUTION CLAIMS (ordered by strength)
# ═══════════════════════════════════════════════════════════════

contributions:
  - id: C1
    claim: "First baseline measurement of static warning rates on HumanEval canonical solutions"
    strength: "HIGH"
    evidence: "9.15% rate, 23 warnings, 9 categories"

  - id: C2
    claim: "Validated pylint analysis pipeline for code generation research"
    strength: "HIGH"
    evidence: "Reusable static_analyzer.py, humaneval_loader.py"

  - id: C3
    claim: "Gate-based hypothesis validation methodology"
    strength: "MEDIUM"
    evidence: "MUST_WORK gate correctly caught proxy limitation"

  - id: C4
    claim: "Identification of proxy limitation in LLM code evaluation"
    strength: "MEDIUM"
    evidence: "Canonical ≠ LLM output; methodology insight"
