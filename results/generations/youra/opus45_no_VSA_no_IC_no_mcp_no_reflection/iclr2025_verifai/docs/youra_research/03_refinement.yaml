key_assumptions:
  - id: "A1"
    assumption: "Static analyzers produce meaningful warnings on LLM-generated code"
    supporting_evidence: "LLM code likely has similar issues to human code"
    consequence_if_violated: "No signal to add; intervention is null"
  - id: "A2"
    assumption: "LLMs can interpret static warnings and translate to fixes"
    supporting_evidence: "LLMs understand natural language error descriptions"
    consequence_if_violated: "Warnings add noise, possibly decreasing pass@k"
  - id: "A3"
    assumption: "Static and execution feedback catch non-overlapping error classes"
    supporting_evidence: "Static catches potential issues; execution catches actual failures"
    consequence_if_violated: "Static is redundant; no improvement expected"
  - id: "A4"
    assumption: "HumanEval/MBPP contain problems with static-detectable errors"
    supporting_evidence: "Common error types include undefined variables, type issues"
    consequence_if_violated: "Improvement limited to subset; effect size reduced"
  - id: "A5"
    assumption: "Pylint severity filtering reduces false positives effectively"
    supporting_evidence: "Error/warning categories are higher precision than conventions"
    consequence_if_violated: "Signal-to-noise ratio too low; intervention ineffective"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Iterative LLM code repair loops (Self-Debug style)
    - Python code generation benchmarks (HumanEval, MBPP)
    - Static analyzers with structured output (pylint, mypy)
    - Error types detectable by static analysis (undefined vars, types, unreachable code)
  does_not_apply_to: |
    - Pure logic errors without static signatures
    - Non-Python languages (different analyzer ecosystems)
    - Single-shot generation without repair loops
    - Human code repair (different error distributions)
  known_limitations: |
    - Effect size may be small (<5%) due to limited static-detectable errors in benchmarks
    - Model-dependent: stronger models may already capture static-like reasoning
    - False positive filtering strategy may need tuning

