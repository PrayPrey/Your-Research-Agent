causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Static analyzer runs on LLM-generated code and produces warnings"
      evidence: "Pylint/mypy reliably detect undefined variables, type mismatches, unreachable code"
      falsifier: "If most LLM solutions have zero static warnings, no signal exists"
    - step: 2
      description: "LLM receives mechanistic feedback (why error occurs, not just where)"
      evidence: "Static warnings explain cause (e.g., 'variable may be undefined') vs tracebacks (just location)"
      falsifier: "If LLM cannot interpret static warnings into fixes, mechanism breaks"
    - step: 3
      description: "More targeted repairs lead to higher pass@k"
      evidence: "Mechanistic understanding should enable more precise fixes"
      falsifier: "If pass@k does not improve, mechanism provides no value"
  key_tension: "Unknown whether static warnings on LLM code are actionable vs noise"
  evidence_summary: |
    The mechanism assumes static analyzers provide non-redundant signal beyond execution tracebacks.
    Pilot study on 50 HumanEval problems recommended to verify signal quality before full experiment.

