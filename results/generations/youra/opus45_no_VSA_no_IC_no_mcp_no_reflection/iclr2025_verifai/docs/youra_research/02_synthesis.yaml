hypothesis_draft:
  title: "Static Analysis Feedback for LLM Code Repair"
  hypothesis_id: "H-StaticFeedback-v1"
  core_claim: |
    Integrating static analyzer feedback (pylint/mypy) into LLM iterative code repair loops
    improves functional correctness (pass@k) on HumanEval/MBPP compared to execution-only feedback.
  mechanism: |
    Static analysis provides mechanistic error explanations ("variable may be undefined")
    rather than just failure locations ("NameError at line 5"). This enables more targeted
    repairs. Additionally, static analysis catches potential issues before execution,
    potentially reducing total repair iterations needed.
  predictions:
    - P1: "pass@1(static+exec) > pass@1(exec-only) by ≥2% absolute OR ≥5% relative"
    - P2: "Improvement concentrated in problems with static-detectable errors"
    - P3: "No improvement for pure logic errors without static warnings"

variables_summary:
  independent: "Feedback type (execution-only vs static+execution)"
  dependent_primary: "pass@1 on HumanEval"
  controlled: "Model, iteration budget (5), prompt format, static analyzer (pylint)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in pass@k between static+execution feedback
    and execution-only feedback conditions on HumanEval/MBPP benchmarks.
  statistical_test: "Two-proportion z-test or McNemar's test (paired)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First measurement of static analysis → pass@k relationship"
  differentiation_summary: |
    Blyth et al. measured quality (security, readability) but not functional correctness.
    Self-Debug uses execution-only feedback. We combine static + execution and measure pass@k.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "GPT-4"
    - "CodeLlama-34B"
  datasets:
    - "HumanEval (164 problems)"
    - "MBPP (974 problems)"
  baselines:
    - "Self-Debug (execution-only)"
    - "Static-only (ablation)"

measurement_plan:
  data_collection:
    - source: "Generate solutions using LLM with iterative repair"
  procedure:
    - step: "1. Generate N solutions per problem per condition"
    - step: "2. Run static analyzer (pylint) on each solution"
    - step: "3. Execute tests and record pass/fail"
    - step: "4. Calculate pass@k for each condition"
  success_criteria:
    - "pass@1(static+exec) - pass@1(exec-only) ≥ 0.02 (absolute)"
    - "OR (pass@1(static+exec) - pass@1(exec-only)) / pass@1(exec-only) ≥ 0.05 (relative)"

validation:
  internal_validity:
    - "Same model across conditions controls for capability differences"
    - "Fixed iteration budget controls for compute differences"
    - "Standardized prompt format controls for presentation effects"
  external_validity:
    - "Test on two benchmarks (HumanEval, MBPP) for generalization"
    - "Test on multiple models if resources permit"

discussion_synthesis:
  key_insights:
    - "Static analysis provides mechanistic feedback vs just failure location"
    - "Static analysis may help even on passing solutions (patchwork problem)"
    - "Non-overlap between static and execution signals is key assumption to validate"
  breakthrough_moments:
