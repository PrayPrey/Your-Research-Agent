  description: "In validate_z3_spec(), implement the canonical solution validation:\n\
    \n1. exec(spec_code, spec_ns) — compile spec safely\n2. check_candidate = spec_ns.get(\"\
    check_candidate\") — must exist\n3. exec(problem[\"canonical_solution\"], canon_ns)\
    \ — get canonical fn\n4. result = check_candidate(canon_fn) with threading timeout\
    \ (10s)\n5. If result is not None → false negative → Z3SpecResult(valid=False,\
    \ reason=...)\n6. If result is None → canonical passes spec → Z3SpecResult(valid=True)\n\
    \nThreading timeout (cross-platform, no SIGALRM):\n  from concurrent.futures import\
    \ ThreadPoolExecutor, TimeoutError\n  with ThreadPoolExecutor(max_workers=1) as\
    \ ex:\n      future = ex.submit(check_candidate, canon_fn)\n      result = future.result(timeout=timeout)\n\
    \nCatch: TimeoutError, Exception → Z3SpecResult(valid=False, reason=str(e))\n"
