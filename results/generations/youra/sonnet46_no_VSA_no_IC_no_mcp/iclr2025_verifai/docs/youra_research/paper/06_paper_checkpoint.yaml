  id: "mypy-repair-loop"
  title: "Mypy-Augmented LLM Repair Loops Improve pass@1 on HumanEval+"
  gate_result: "PARTIAL"
  refined_statement: >
    On HumanEval+ (164 problems, GPT-4o-mini, k=5 repair rounds, 3 seeds),
    augmenting execution-based repair loops with mypy static analysis feedback
    achieves +8.94pp higher pass@1 than execution-only repair (87.20% vs 78.25%).
    Mechanism is general context enrichment, not type-targeted repair.

