  initial_generation_temperature: 0.8
  repair_temperature: 0.0
  repair_rounds: 5
  seeds: [42, 123, 456]
  benchmarks:
    primary: "HumanEval+ (164 problems)"
    secondary: "MBPP+ (378 problems)"
    arithmetic_subset: "112 problems (valid Z3 specs)"
  mypy_flags: ["--ignore-missing-imports", "--no-strict-optional"]
  mypy_timeout_seconds: 30
  z3_timeout_seconds: 10

  sub_hypotheses_structure:
    h-e1:
      gate: "MUST_WORK"
      result: "PASS"
      metric: "mypy error fraction >= 10%"
    h-m1:
      gate: "MUST_WORK"
      result: "PASS"
      metric: "Spearman rho < 0"
    h-m2:
      gate: "SHOULD_WORK"
      result: "FAIL"
      metric: "delta_type > delta_non"
      note: "Ceiling effect; not mechanism failure of repair loop"
    h-m3:
      gate: "MUST_WORK"
      result: "PASS"
      metric: "pass@1_B > pass@1_A"
    h-z1:
      gate: "SHOULD_WORK"
      result: "FAIL"
      metric: "pass@1_C > pass@1_B"
      note: "Low CE rate + ceiling effect"

