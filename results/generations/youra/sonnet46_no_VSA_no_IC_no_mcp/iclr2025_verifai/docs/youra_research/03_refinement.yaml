predictions:
  - id: "P1"
    primary: true
    statement: "Execution+mypy repair achieves strictly higher pass@1 than execution-only repair on MBPP+ (primary) and HumanEval+ (secondary), averaged over k=1..5 repair rounds"
    test_method: "3-condition repair loop experiment on HumanEval+ (164) and MBPP+ (378); 3 seeds; Welch's t-test on per-problem improvement delta"
    success_criterion: "p < 0.05 on MBPP+; absolute pass@1 improvement >= 1% on MBPP+"
    falsification: "p >= 0.05 on both benchmarks, or negative pass@1 delta (mypy condition performs worse)"
  - id: "P2"
    primary: false
    statement: "On the curated Z3 subset (~50 arithmetic-heavy HumanEval problems), execution+mypy+Z3 achieves higher pass@1 than execution+mypy (after Z3 spec pre-validation)"
    test_method: "Same repair loop; subset restricted to pure functions with simple types; Z3 specs generated by GPT-4o-mini and validated against EvalPlus test cases before use"
    success_criterion: "Positive pass@1 delta (Z3 > mypy) on curated subset, even if not statistically significant at p < 0.05"
    falsification: "Z3 condition performs equal to or worse than mypy condition (Z3 specs add noise even on curated subset)"
  - id: "P3"
    primary: false
    statement: "Under execution+mypy repair, the number of mypy type errors in repair attempt r+1 is lower than in attempt r (across rounds 1..5), confirming LLM uses mypy feedback"
    test_method: "Run mypy on each repair attempt for each problem in execution+mypy condition; track mean type error count per round"
    success_criterion: "Monotonically decreasing mean mypy error count from round 1 to round 5"
    falsification: "mypy error count does not decrease (or increases) across repair rounds — LLM ignores mypy signal"

