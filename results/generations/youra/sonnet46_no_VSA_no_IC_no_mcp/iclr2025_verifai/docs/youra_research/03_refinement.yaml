# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-StaticRepair-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under Python code generation on HumanEval+ and MBPP+ benchmarks,
    if repair loops are augmented with static analysis feedback (mypy type checking)
    in addition to execution-based feedback,
    then pass@1 after up to k=5 repair rounds increases beyond the execution-only baseline,
    because mypy provides error-type-specific correction signal (type mismatch location and expected type)
    that narrows the LLM's next-attempt distribution toward type-correct solutions,
    whereas execution-only feedback provides only pass/fail binary signal without type-level diagnostics.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@1 (averaged over k=1..5 repair rounds) between
    execution+mypy repair and execution-only repair on HumanEval+ and MBPP+.
    (Welch's t-test, p >= 0.05 on both benchmarks)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Repair feedback condition"
      type: "categorical"
      operationalization: "Type of feedback provided to LLM during repair loop"
      levels:
        - "execution-only: run code, capture stdout/stderr/exception, feed to LLM"
        - "execution+mypy: run code AND run mypy --ignore-missing-imports, feed both outputs to LLM"
        - "execution+mypy+Z3: above plus LLM-generated Z3 spec verification with counterexample [curated subset only]"
    - name: "Repair round k"
      type: "continuous"
      operationalization: "Number of repair iterations (k=1..5); analyzed as learning curve"
    - name: "Benchmark"
      type: "categorical"
      operationalization: "HumanEval+ (164 problems) vs. MBPP+ (378 problems)"
      levels: ["HumanEval+", "MBPP+"]
  dependent:
    - name: "pass@1"
      type: "continuous"
      operationalization: "Fraction of problems where LLM-generated code passes all EvalPlus test cases, after up to k repair rounds; range [0,1]"
      primary: true
    - name: "Type error reduction rate"
      type: "continuous"
      operationalization: "Fraction of mypy errors in repair attempt r+1 that were corrected relative to repair attempt r; tracks mypy signal incorporation"
      primary: false
    - name: "Repair success by error category"
      type: "categorical"
      operationalization: "Categorize failure reasons (syntax/type/semantic/logic) and measure per-condition repair rate per category"
      primary: false
  controlled:
    - name: "LLM model"
      operationalization: "GPT-4o-mini (fixed); same model for initial generation and all repair rounds"
    - name: "Initial generation temperature"
      operationalization: "temperature=0.8 for initial code generation (stochastic)"
    - name: "Repair generation temperature"
      operationalization: "temperature=0.0 for repair rounds (deterministic given feedback)"
    - name: "Token budget per repair prompt"
      operationalization: "Max 2048 tokens per repair prompt (truncate feedback if needed)"
    - name: "Number of seeds"
      operationalization: "3 random seeds for initial generation; results averaged"
    - name: "Benchmark split"
      operationalization: "Full HumanEval+ (164) and MBPP+ (378) — no subset for primary comparison"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Initial LLM generation produces code with type errors (~20-30% of HumanEval failures involve type mismatches based on EvalPlus analysis)"
      evidence: "EvalPlus analysis (Liu et al. 2023) shows execution failures cluster around type mismatch and off-by-one errors"
      falsifier: "If fewer than 10% of initial failures involve type errors, mypy signal is too sparse to matter"
    - step: 2
      description: "mypy feedback provides structured type-error message (error type, line number, expected vs. actual type) that specifically locates the type mismatch, enabling targeted repair"
      evidence: "mypy output format is structured and actionable; distinguishes AttributeError, TypeVar, Optional violations by error code"
      falsifier: "If mypy and execution feedback contain equivalent information (overlap > 95%), no additional signal expected"
    - step: 3
      description: "LLM conditioned on mypy error message generates a next attempt with lower probability mass on type-incorrect tokens, increasing pass@1"
      evidence: "Analogous to how Self-Debug [Chen et al. 2023] showed execution error messages guide repair; mypy provides richer type-specific signal"
      falsifier: "If pass@1 after round 2 (with mypy) equals pass@1 after round 2 (execution-only), mechanism fails"
  key_tension: "mypy in strict mode may produce false positives on dynamically-typed HumanEval code, potentially adding noise rather than signal. Mitigation: permissive mypy flags (--ignore-missing-imports --no-strict-optional)"
  evidence_summary: |
    The causal chain has weak-to-moderate prior support: Step 1 (type errors are common)
    is supported by EvalPlus analysis. Step 2 (mypy output is informative) is well-established.
    Step 3 (LLM uses mypy signal for targeted repair) is the empirical claim requiring validation.
    The chain is plausible but the effect size at Step 3 is genuinely unknown.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Type errors are a non-trivial fraction (~20%+) of HumanEval+/MBPP+ failures under GPT-4o-mini generation"
    supporting_evidence: "EvalPlus error analysis (Liu et al. 2023) suggests type-related failures are common in model-generated Python"
    consequence_if_violated: "If type errors are rare (<5% of failures), mypy adds negligible signal and pass@1 improvement will be near zero"
  - id: "A2"
    assumption: "GPT-4o-mini can incorporate mypy error messages to improve repair quality — i.e., mypy error format is interpretable by the LLM"
    supporting_evidence: "GPT-4o-mini has strong Python understanding; mypy error messages are human-readable text"
    consequence_if_violated: "If LLM cannot parse/use mypy output, Condition B degrades to Condition A (extra tokens wasted)"
  - id: "A3"
    assumption: "mypy in permissive mode (--ignore-missing-imports --no-strict-optional) produces actionable errors with low false-positive rate on HumanEval/MBPP code"
    supporting_evidence: "Permissive mypy flags are standard practice for partially-typed Python codebases"
    consequence_if_violated: "High false-positive rate adds noise, potentially degrading repair quality"
  - id: "A4"
    assumption: "k=5 repair rounds is sufficient to capture the asymptotic pass@k benefit; effect does not require k>5"
    supporting_evidence: "Self-Debug [Chen et al. 2023] shows most repair benefit materializes within k=3 rounds"
    consequence_if_violated: "Effect may be delayed, requiring k>5 rounds to observe; timeline extends"
  - id: "A5"
    assumption: "For the Z3 curated subset (~50 arithmetic-heavy HumanEval problems), LLM-generated Z3 specs are sufficiently correct (validated against EvalPlus test cases before use)"
    supporting_evidence: "Pure functions with simple int/str types have reliable formal encodings; pre-validation step catches wrong specs"
    consequence_if_violated: "Wrong Z3 specs generate misleading counterexamples; Condition C may underperform Condition B — this is the null result for the Z3 sub-hypothesis"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Python code generation tasks on competitive programming / algorithmic benchmarks
    - Problems where mypy can analyze generated code (no complex external dependencies)
    - LLMs with strong Python understanding (code-specialized or large general models)
    - Repair loop settings where k>=2 repair rounds are permitted
    - HumanEval+ (164 problems) and MBPP+ (378 problems) — existing benchmarks
  does_not_apply_to: |
    - Real-world software engineering tasks (SWE-bench) — excluded from primary analysis due to compute cost
    - Non-Python languages — mypy is Python-specific; findings may not generalize
    - Code generation tasks with complex external library dependencies (mypy cannot analyze without stubs)
    - Single-shot generation (k=1, no repair loop) — not the target setting
    - Grammar-constrained decoding-time interventions — distinct architecture not studied here
  known_limitations: |
    - GPT-4o-mini is a single model; generalization to other models requires replication
    - HumanEval+ (164 problems) may be underpowered for 1% absolute effect detection — MBPP+ (378) is primary
    - Z3 analysis is restricted to ~50-problem subset; not representative of full benchmark
    - All MCP sources in Phase 1 were INFERRED (data quality 63/100) — arXiv IDs need verification

