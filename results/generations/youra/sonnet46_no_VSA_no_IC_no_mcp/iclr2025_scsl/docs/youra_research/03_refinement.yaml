# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "Waterbirds (PRIMARY) + CelebA (SECONDARY)"
    type: "standard"
    source: "Waterbirds: WILDS package (p-lambda/wilds), constructed from CUB-200-2011 + Places365. CelebA: torchvision.datasets.CelebA"
    path: "Waterbirds: wilds.get_dataset('waterbirds'). CelebA: torchvision.datasets.CelebA(root='./data')"
    hypothesis_fit: "Both have explicit group annotations (spurious attribute × task label), group-balanced train/test splits, and established codebase. Waterbirds has 95% train spurious correlation (strong signal). CelebA has weaker correlation (~80%), making cross-dataset comparison informative."
  model:
    name: "ResNet-50 (4 pretrained checkpoints)"
    type: "CNN backbone (frozen for all probe experiments)"
    source: |
      ERM: torchvision.models.resnet50(pretrained=True)
      SimCLR: SimCLR-v2 PyTorch port or MoCo-v3 as alternative
      DINO: torch.hub.load('facebookresearch/dino:main', 'dino_resnet50')
      BarlowTwins: torch.hub.load('facebookresearch/barlowtwins:main', 'resnet50')
    hypothesis_fit: "Same architecture across all 4 paradigms eliminates architecture confound. ResNet-50 is the standard backbone used in DFR and Group DRO baselines, enabling direct comparison."
  baselines:
    - name: "ERM (supervised)"
      method: "Standard ImageNet-pretrained ResNet-50 (torchvision default); represents the supervised paradigm baseline"
    - name: "Chance level probe"
      method: "Random feature probe (shuffled labels) to establish lower bound and verify probe is learning"
    - name: "DFR result"
      method: "Kirichenko et al. (2022) DFR accuracy on Waterbirds/CelebA as downstream performance reference point"

