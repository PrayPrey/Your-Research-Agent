      difference: "WILDS evaluates fine-tuned models on distribution shift; does not isolate pretraining paradigm effect by freezing backbone."
    - prior_work: "DFR (Kirichenko et al. 2022)"
      difference: "DFR shows ERM features are sufficient but does not compare to SSL paradigms. Our study extends the question: are SSL features equally sufficient, more sufficient, or less sufficient?"
    - prior_work: "Group DRO (Sagawa et al. 2020)"
      difference: "Group DRO focuses on optimization objective at fine-tuning time, not pretraining paradigm effect on feature encoding."

