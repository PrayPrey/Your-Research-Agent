# ─────────────────────────────────────────────────────
# METHODOLOGY
# ─────────────────────────────────────────────────────
methodology:
  probe_type: "LogisticRegression"
  probe_C: 1.0
  probe_solver: "lbfgs"
  probe_max_iter: 1000
  probe_seeds: [0, 1, 2, 3, 4]
  backbone: "ResNet-50"
  feature_dim: 2048
  probe_train_split: "group-balanced validation subset"
  waterbirds_test_size: 5794
  celeba_test_size: 720
  bonferroni_n: 6
  bonferroni_alpha: 0.05
  min_diff_gate: 0.02

  simclr_hyperparams:
    learning_rate: 0.03
    batch_size: 256
    epochs: 50
    optimizer: "SGD (momentum=0.9, weight_decay=1e-4)"
    scheduler: "CosineAnnealingLR (T_max=50, eta_min=0)"
    temperature: 0.5
    projection_head: "2048->2048->128 (L2-normalized)"
    places365_pool_size: 10000

