figures:
  - id: "fig_1"
    original_name: "ratio_bar_waterbirds.png"
    source: "h-e1/figures/ratio_bar.png"
    target: "figures/ratio_bar_waterbirds.png"
    caption: "Mean spurious/task probe accuracy ratio per pretraining paradigm on Waterbirds. Error bars show ± 1 std across 5 seeds. Significant pairwise differences (Bonferroni-corrected) annotated. ERM shows highest ratio; MoCo-v3 lowest — opposite of augmentation-invariance prediction."
    section: "results"
    phase: "phase_4"

  - id: "fig_2"
    original_name: "ratio_violin_waterbirds.png"
    source: "h-e1/figures/ratio_violin.png"
    target: "figures/ratio_violin_waterbirds.png"
    caption: "Violin plot of spurious/task ratio distributions across 5 seeds per paradigm on Waterbirds. MoCo-v3 is clearly separated from ERM and DINO (Cohen's d=5.68)."
    section: "results"
    phase: "phase_4"

  - id: "fig_3"
    original_name: "cross_dataset_bar.png"
    source: "h-e2/figures/cross_dataset_bar.png"
    target: "figures/cross_dataset_bar.png"
    caption: "Cross-dataset comparison of spurious/task ratios on Waterbirds and CelebA. Paradigm ranking reverses across datasets (MoCo-v3 lowest on Waterbirds, highest on CelebA), revealing a spurious-attribute-type × pretraining-objective interaction."
    section: "results"
    phase: "phase_4"

  - id: "fig_4"
    original_name: "interaction_plot.png"
    source: "h-d1/figures/interaction_plot.png"
    target: "figures/interaction_plot.png"
    caption: "Interaction plot: all 4 paradigms × 2 datasets. Lines cross between datasets, confirming that no single paradigm consistently encodes the least spurious features across spurious attribute types."
    section: "discussion"
    phase: "phase_4"

  - id: "fig_5"
    original_name: "pvalue_matrix.png"
    source: "h-e1/figures/pvalue_matrix.png"
    target: "figures/pvalue_matrix.png"
    caption: "4×4 Bonferroni-corrected p-value matrix for all pairwise paradigm comparisons on Waterbirds. Two pairs achieve full gate criterion (ERM vs MoCo-v3: p=0.0001; MoCo-v3 vs DINO: p=0.0001)."
    section: "results"
    phase: "phase_4"

  - id: "fig_6"
    original_name: "acc_heatmap.png"
    source: "h-e1/figures/acc_heatmap.png"
    target: "figures/acc_heatmap.png"
    caption: "Heatmap of spurious and task probe accuracies (mean across seeds) per paradigm on Waterbirds. Both probe types contribute to ratio differences; ERM has the largest spurious accuracy gap."
    section: "results"
    phase: "phase_4"

  - id: "fig_7"
    original_name: "gate_metrics.png"
    source: "h-d1/figures/gate_metrics.png"
    target: "figures/gate_metrics.png"
    caption: "MoCo-v3 vs ERM ratio comparison on Waterbirds and CelebA (±1 SD). On Waterbirds ERM > MoCo-v3 (d=5.68, p<0.0001); on CelebA the difference is negligible (d=0.068, p=0.917), confirming dataset-type specificity."
    section: "discussion"
    phase: "phase_4"

