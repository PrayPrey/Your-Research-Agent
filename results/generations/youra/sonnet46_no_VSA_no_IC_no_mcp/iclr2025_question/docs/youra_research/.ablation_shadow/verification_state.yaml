    validation:
      status: COMPLETED
      result: FAIL
      file: docs/youra_research/h-m2/04_validation.md
    version: 1
    completed: true
    reflection_outcome: 'FAIL — structural experiment design limitation. The ablated predictor (within_cluster_fraction =
      (log(K) - SE) / log(K)) is a monotone transform of SE_clustered, so AUROC delta = 0 by construction regardless of data.
      Secondary metrics confirm NLI clustering is mechanically active (mean cluster count 7.31 < K=10, 23% entropy savings,
      34% co-clustering rate). The mechanism hypothesis remains plausible but unverifiable with this design. Recommended fix
      for H-M3: use a truly independent ablated predictor — e.g., SE with randomized cluster assignments or the H-E1-established
      SE vs TE AUROC gap (delta ~0.05, already meets the 0.03 gate).'
    route_to: h-m3
    completed_at: '2026-08-25T18:30:00+00:00'
