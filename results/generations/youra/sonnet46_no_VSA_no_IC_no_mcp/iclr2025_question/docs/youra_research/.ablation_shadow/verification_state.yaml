        mean_within_cluster_fraction: 0.23
        entailment_coclustering_rate: 0.34
        mean_cluster_count: 7.31
        mechanism_active: false
        mechanism_indicators:
          clustering_reduces_n: true
          entropy_saving_nonzero: true
          auroc_delta_positive: false
          delta_meets_gate: false
        n_questions: 98
        K: 10
        seed: 42
        failure_reason: Ablated predictor (within_cluster_fraction) is a monotone transform of SE_clustered; AUROC difference
          is 0 by construction.
    experiment_design:
      status: COMPLETED
      file: docs/youra_research/h-m2/02c_experiment_brief.md
    implementation_planning:
      status: COMPLETED
