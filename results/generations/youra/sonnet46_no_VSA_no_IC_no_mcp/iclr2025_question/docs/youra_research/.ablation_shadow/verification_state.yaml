  h-e1:
    type: EXISTENCE
    statement: Under Llama-2-7B on TriviaQA dev (N>=98), if semantic entropy and token entropy are both computed on the same
      K=10 samples under identical conditions, then SE achieves AUROC >= TE + 0.05, because semantic-level clustering removes
      paraphrase noise that degrades token-level entropy's discriminative power.
