    type: MECHANISM
    statement: Under Llama-2-7B on TriviaQA dev, if K=10 stochastic samples are generated for high- vs. low-uncertainty questions,
      then token entropy varies across semantically equivalent paraphrases (same meaning, different surface form), because
      TE aggregates over vocabulary distributions that encode surface variation, not semantic content.
    status: VALIDATED
