  h-m2:
    type: MECHANISM
    statement: Under Llama-2-7B on TriviaQA dev, if SE applies NLI clustering before computing entropy, then SE entropy is
      invariant to within-cluster paraphrase variation, because NLI entailment groups surface variants into single cluster
      nodes, removing their contribution to entropy.
    status: FAILED
    prerequisites:
