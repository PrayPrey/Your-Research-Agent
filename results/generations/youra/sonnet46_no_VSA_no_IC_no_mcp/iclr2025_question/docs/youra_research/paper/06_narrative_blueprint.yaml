    hook_strategy: "counterintuitive_finding — open with TriviaQA win then TruthfulQA reversal"
    opening_move: "State the reversal as the opening fact, then explain why it matters"
    contribution_framing: "Frame as story, not list: (1) four-way 7B comparison closes the gap, (2) mechanism measured, (3) scope condition identified"
    transition_to_related: "After contributions, position against prior work: 'These findings extend Kuhn 2023 to 7B scale and identify the task-structure scope condition their evaluation did not address'"

  related_work:
    narrative_purpose: "Show existing work is incomplete in exactly the way our paper fills"
    positioning_strategy: "Each prior paper is missing one or more of: 7B scale, all four methods together, mechanism measurement, cross-benchmark testing"
    key_comparison_points:
      - "Kuhn 2023: SE at 65B only; no TE comparison; no cross-benchmark; no mechanism"
      - "Huang 2023: TE vs. sampling-based but no SE; no 7B; no mechanism"
      - "Xiong 2023: VC analysis at multiple scales; no SE comparison; no mechanism"
      - "Manakul 2023: SCG on long-form text; short QA SCG behavior uncharacterized"
      - "Kadavath 2022: VC calibration; no comparative ranking with sampling methods"
    closing_move: "End with: 'No prior work provides all four methods, at 7B scale, with mechanism measurement and cross-benchmark validation — we close this gap'"

  methodology:
    narrative_purpose: "Show WHY this experimental design is the right one to test the claims"
    connection_to_insight: "The four-method head-to-head design directly measures the ranking; the intra-cluster variance analysis directly measures the mechanism"
    key_design_decisions:
      - "K=10 samples for all stochastic methods — matches Kuhn 2023 for comparability"
      - "NLI-based SE (nli-deberta-v3-large) — larger than h-c1 default; corrects for model size confound"
      - "Bootstrap 95% CI with negation convention — principled AUROC orientation"
      - "TriviaQA + TruthfulQA — chosen to contrast paraphrase-diverse vs. deterministic-wrong task types"
      - "N=98 pilot — designed for 80% power to detect gaps >= 0.05"
    figures_to_use: ["h-m1_fig4_nli_heatmap.png (show cluster structure)"]

  experiments:
    narrative_purpose: "Design section around the specific claims being tested, not around the implementation"
    experimental_questions:
      - "EQ1: Does SE outperform TE by >= 0.05 AUROC at 7B scale? (P1 test)"
      - "EQ2: Is the SE > TE gap explained by intra-cluster TE variance? (mechanism test)"
      - "EQ3: Does the SE > TE advantage generalize to TruthfulQA? (scope test)"
      - "EQ4: Is SCG equivalent to SE on short factual QA? (P2 test)"
      - "EQ5: Is VC miscalibrated at 7B scale? (P3 test)"
    organization: "Structure as sub-hypotheses tested, not chronological execution"

  results:
    narrative_purpose: "Present evidence in order of persuasiveness: primary gap → mechanism → reversal → secondary findings"
    primary_result: "SE AUROC = 0.717 vs TE = 0.562 on TriviaQA (gap = +0.155)"
    result_ordering:
      1: "Primary: SE vs TE AUROC gap (h-e1) — the existence result"
      2: "Mechanism: Intra-cluster TE variance (h-m1) — the WHY"
      3: "Scope: TruthfulQA reversal (h-c1) — the boundary condition"
      4: "SCG vs SE divergence (h-m3) — method-specific finding"
      5: "VC degeneracy (h-m4) — calibration finding"
    sign_convention_note: "Clearly state that AUROC uses negated uncertainty scores (higher uncertainty = higher AUROC). Note h-m3/h-m4 SE baseline of 0.286 is inverted — corrected SE AUROC = 0.714"
    key_figures:
      - "h-e1_fig1_auroc_bar.png — primary result bar chart"
      - "h-m1_fig2_violin_intra_var.png — mechanism distribution"
      - "h-c1_cross_benchmark_comparison.png — cross-benchmark reversal"
      - "h-m4_ece_calibration.png — VC calibration failure"

  discussion:
    narrative_purpose: "Interpret what the results mean, connect to key insight, acknowledge limits honestly"
    structure:
      1: "Why SE wins on TriviaQA (paraphrase-diversity mechanism, connected to H-M1 evidence)"
      2: "Why SE loses on TruthfulQA (deterministic-wrong hypothesis, rival explanations)"
      3: "Implications for method selection (task-structure condition as actionable principle)"
      4: "Honest limitations (N=98, sign convention, H-M2 design flaw, NLI model size confound in h-c1)"
    honest_limitations:
      - "N=98 pilot: TruthfulQA results directional, not definitively powered"
      - "Sign convention inconsistency across pipelines (documented)"
      - "H-M2 ablation invalidated by design — mechanistic evidence is from H-M1"
      - "H-C1 confounds NLI model size and task structure — follow-up needed"

  conclusion:
    narrative_purpose: "Callback to the hook (the reversal), synthesize the task-structure insight, open future"
    callback_to_hook: "Open with: 'The ordering reversal that opens this paper — SE wins on TriviaQA, loses on TruthfulQA — is not a failure of semantic entropy but a diagnostic signal'"
    synthesis_statement: "The task-structure condition we identify provides a principled basis for uncertainty method selection that benchmark-driven defaults cannot provide"
    future_vision: "A task-structure taxonomy for method selection; SelfCheckNLI as SCG replacement; scale-up to 13B/70B"

