# PART 8: TERMINOLOGY CONSISTENCY
# ═══════════════════════════════════════════════════════════════════════════════

terminology:
  primary_terms:
    - term: "Semantic Entropy (SE)"
      definition: "NLI-based clustering of K=10 samples; entropy over cluster distribution"
      abbreviation: "SE"

    - term: "Token Entropy (TE)"
      definition: "Mean per-token Shannon entropy over softmax distribution, averaged across generated sequence"
      abbreviation: "TE"

    - term: "SelfCheckGPT BERTScore (SCG)"
      definition: "Pairwise BERTScore consistency across K=10 samples; uncertainty = 1 - mean_agreement"
      abbreviation: "SCG"

    - term: "Verbalized Confidence (VC)"
      definition: "Self-reported 0-100% confidence from Llama-2-7B-Chat after answering"
      abbreviation: "VC"

    - term: "AUROC"
      definition: "Area under ROC curve for binary classification: uncertain (predicted) vs. incorrect (EM=0)"
      note: "Higher = better; scores negated before computation (higher uncertainty = higher AUROC)"

    - term: "paraphrase-rich incorrect outputs"
      definition: "Task structure where wrong model answers take diverse surface forms (TriviaQA characteristic)"

    - term: "deterministic-wrong outputs"
      definition: "Task structure where wrong model answers are consistent/identical across K samples (TruthfulQA characteristic)"

    - term: "intra-cluster TE variance"
      definition: "Variance of token entropy values within NLI-equivalent answer clusters; measures paraphrase noise in TE"

  key_numbers_reference:
    se_auroc_trivia: 0.717
    te_auroc_trivia: 0.562
    gap_trivia: 0.155
    se_auroc_truthful: 0.445
    te_auroc_truthful: 0.511
    gap_truthful: -0.066
    intra_cluster_variance: 7.152
    variance_threshold: 0.1
    variance_ratio: "71x"
    vc_ece: 0.430
    scg_auroc: 0.378
    se_auroc_corrected: 0.714
    scg_se_delta: 0.092
    n_trivia: 98
    n_truthful: 141
    k_samples: 10
