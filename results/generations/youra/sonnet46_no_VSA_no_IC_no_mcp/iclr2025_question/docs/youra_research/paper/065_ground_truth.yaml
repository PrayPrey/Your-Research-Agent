# ─────────────────────────────────────────────────────────────────────────────
# METHODOLOGY GROUND TRUTH
# ─────────────────────────────────────────────────────────────────────────────

methodology:
  model_base: "meta-llama/Llama-2-7b-hf"
  model_chat: "meta-llama/Llama-2-7b-chat-hf"
  nli_model_primary: "cross-encoder/nli-deberta-v3-large"
  nli_model_hc1: "cross-encoder/nli-deberta-v3-small"

  hyperparameters:
    K_samples: 10
    temperature: 0.7
    max_new_tokens: 50
    bootstrap_iterations: 1000
    bootstrap_seed: 42
    n_questions_primary: 98
    n_questions_truthfulqa: 141
    dataset_seed: 42

  auroc_convention: "negate_uncertainty_scores"
  em_normalization_trivia: "triviaqa_alias_list"
  em_normalization_truthful: "yes_no_prefix_matching"

  sign_convention_note: >
    H-E1 negates SE and TE scores before AUROC computation (higher uncertainty = higher score).
    H-M3 and H-M4 pipelines do NOT negate SE scores, producing SE AUROC = 0.286 (uninverted).
    Corrected SE AUROC = 1 - 0.286 = 0.714. All within-pipeline comparisons in H-M3/H-M4
    are internally consistent. The inconsistency affects only cross-pipeline SE comparison.

