    - "Llama-2-7B (meta-llama/Llama-2-7b-hf) — for TE, SE, SCG"
    - "Llama-2-7B-Chat (meta-llama/Llama-2-7b-chat-hf) — for verbalized confidence"
  datasets:
    - "TriviaQA dev (primary) — N=98 pilot (h-e2-v2 existing samples), extension to N=500 if pilot inconclusive"
    - "TruthfulQA (secondary) — N=100 sample for cross-benchmark validation"
  baselines:
    - "Token Entropy (TE) — cheapest, single forward pass"
    - "Random baseline — AUROC 0.5"
    - "Prior SE result from h-e2-v2 — AUROC 0.5419 on N=98"

measurement_plan:
  data_collection:
    - source: "Existing h-e2-v2 samples: 98 questions x K=10 samples already generated. Reuse for SE, SCG, TE computation."
    - source: "New VC inference: 98 questions through Llama-2-7B-Chat with confidence elicitation prompt (<1 GPU hour)"
    - source: "TruthfulQA secondary: 100 questions x K=10 new samples (~8 GPU hours if needed)"
  procedure:
    - step: "Load existing h-e2-v2 samples (generation.py output: 98 questions x K=10 completions)"
    - step: "Compute TE: load saved logits or run greedy decode with log-prob extraction; aggregate mean token entropy per question"
    - step: "Compute SCG: BERTScore pairwise across K=10 samples per question; uncertainty = 1 - mean_pairwise_score"
    - step: "Compute SE: run h-e2-v2 uncertainty.py (NLI clustering already validated); use existing AUROC = 0.5419 as anchor"
    - step: "Compute VC: run Llama-2-7B-Chat on 98 questions; extract reported confidence score; convert to uncertainty = 1 - confidence/100"
    - step: "Bootstrap AUROC (1000 iterations) for all four methods on same 98 questions"
    - step: "Pilot gate: if |SE-TE| < 0.03, extend to N=500 using generate_shard.py"
    - step: "Secondary: repeat on 100 TruthfulQA questions if pilot shows clear ranking"
  success_criteria:
    - "P1 confirmed: SE AUROC - TE AUROC >= 0.05, non-overlapping CIs"
    - "P2 confirmed: |SCG AUROC - SE AUROC| <= 0.03"
    - "P3 confirmed: VC AUROC < TE AUROC"
    - "Pilot gate not triggered: |SE-TE| >= 0.03 at N=98"

validation:
  internal_validity:
    - "Same 98-question sample for all four methods (controls for question difficulty distribution)"
    - "Same correctness labels (EM against TriviaQA gold) for all four methods"
    - "Bootstrap CIs for each AUROC estimate (accounts for sampling variance)"
    - "h-e2-v2 SE result (0.5419) pre-validated — use as anchor for comparison"
  external_validity:
    - "TruthfulQA secondary evaluation tests cross-domain generalization of ranking"
    - "N=500 extension tests stability of pilot result (if pilot gate triggered)"
    - "Llama-2-7B is a representative 7B open-source model used across the field"
    - "TriviaQA is a standard benchmark; results comparable to Kuhn 2023 and Xiong 2023"

discussion_synthesis:
  key_insights:
    - "h-e2-v2's failure at 0.75 gate is a positive calibration finding, not just a failure — it establishes 7B SE AUROC range (0.54-0.60)"
    - "The SE mechanism works at 7B (3.89 clusters, directional SE > TE gap) — the issue was threshold calibration, not mechanism validity"
    - "The new hypothesis asks the right question: does SE's NLI overhead buy anything over TE at 7B? This is answerable with existing samples at near-zero cost"
    - "SelfCheckGPT equivalence to SE would have major implications: SCG works on black-box APIs (no logit access), making it more deployable than SE"
    - "Verbalized confidence at 7B is a known weak baseline per Xiong 2023; including it establishes the lower bound and validates prior findings"
  breakthrough_moments:
    - "Dr. Sage (Exchange 3): Reframing h-e2-v2 failure as positive scale-calibration finding changed the hypothesis direction from 'prove SE works' to 'characterize where SE beats alternatives'"
    - "Prof. Pax (Exchange 4): Identifying that SelfCheckGPT and TE are computable from existing h-e2-v2 samples at near-zero cost made the four-way comparison immediately feasible"
    - "Prof. Rex (Exchange 6): Defining explicit pilot gate (extend if |gap| < 0.03) resolved the N=98 power concern cleanly"
  resolved_tensions:
    - "Absolute AUROC threshold (0.75) vs. relative comparison (SE-TE gap): resolved in favor of relative comparison — avoids repeating h-e2-v2 failure mode"
    - "Full scale experiment (N=500) vs. pilot reuse: resolved with gated approach — pilot first, extend only if inconclusive"
    - "Verbalized confidence model choice: resolved to Chat model (Llama-2-7B-Chat) with explicit limitation note"
