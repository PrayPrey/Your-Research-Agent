hypothesis_draft:
  title: "Four-Way Uncertainty Proxy Comparison at 7B Scale: Does Semantic Entropy's NLI Overhead Buy Meaningful AUROC Gain?"
  hypothesis_id: "H-SE4Way-v1"
  core_claim: |
    On Llama-2-7B applied to TriviaQA dev, semantic entropy achieves a practically
    meaningful AUROC advantage (>= 0.05) over single-pass token entropy, SelfCheckGPT
    achieves comparable AUROC to SE, and verbalized confidence underperforms both,
    establishing the first controlled four-way comparison at small-model scale and
    providing model-scale-calibrated guidance for uncertainty method selection.
  mechanism: |
    Semantic entropy and SelfCheckGPT both operate at the semantic level (NLI clustering
    and BERTScore consistency respectively), filtering paraphrase noise that degrades
    token-level entropy's discriminative power. Token entropy conflates surface variation
    with semantic uncertainty, reducing AUROC. Verbalized confidence requires large model
    scale (>=13B) for reliable self-calibration; at 7B it produces near-random uncertainty
    estimates.
  predictions:
    - P1: "SE AUROC - TE AUROC >= 0.05, non-overlapping bootstrap 95% CIs (primary)"
    - P2: "|SCG AUROC - SE AUROC| <= 0.03 (practical equivalence between SE and SelfCheckGPT)"
    - P3: "VC AUROC < TE AUROC < SE AUROC (verbalized confidence worst at 7B)"

variables_summary:
  independent: "Uncertainty proxy method: TE (single-pass token entropy), SCG (SelfCheckGPT BERTScore), SE (semantic entropy NLI), VC (verbalized confidence via Llama-2-7B-Chat)"
  dependent_primary: "AUROC against binary EM correctness labels on TriviaQA dev"
  controlled: "Model (Llama-2-7B), benchmark (TriviaQA dev), sample count K=10, correctness label (EM), evaluation metric (bootstrap AUROC)"

