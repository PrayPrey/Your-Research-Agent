predictions:
  - id: "P1"
    primary: true
    statement: "Semantic entropy achieves strictly higher AUROC than token entropy on TriviaQA dev at Llama-2-7B scale, with a gap of at least 0.05 (SE AUROC - TE AUROC >= 0.05)"
    test_method: "Bootstrap AUROC (1000 iterations) for SE and TE on same 98-question h-e2-v2 pilot (or N=500 extension). SE uses existing h-e2-v2 clustering; TE computed from saved logits or one greedy-decode pass."
    success_criterion: "SE AUROC - TE AUROC >= 0.05 AND lower bound of SE bootstrap 95% CI > upper bound of TE bootstrap 95% CI (non-overlapping CIs)"
    falsification: "SE AUROC - TE AUROC < 0.03 (below practical significance threshold) OR overlapping CIs after N=500 extension"
  - id: "P2"
    primary: false
    statement: "SelfCheckGPT (BERTScore consistency) achieves AUROC within 0.03 of semantic entropy on TriviaQA dev at 7B scale (similar performance, different mechanism)"
    test_method: "Bootstrap AUROC for SCG on same 98-question pilot. SCG computed from existing K=10 samples using BERTScore pairwise consistency (~7 minutes CPU)."
    success_criterion: "|SCG AUROC - SE AUROC| <= 0.03 (practical equivalence)"
    falsification: "|SCG AUROC - SE AUROC| > 0.05 in either direction"
  - id: "P3"
    primary: false
    statement: "Verbalized confidence achieves lower AUROC than both SE and TE on TriviaQA dev using Llama-2-7B-Chat, confirming scale-dependent verbalized calibration degradation"
    test_method: "Run Llama-2-7B-Chat on 98 TriviaQA questions with confidence elicitation prompt ('Rate your confidence 0-100%'). Compute AUROC of reported confidence against EM labels."
    success_criterion: "VC AUROC < TE AUROC AND VC AUROC < SE AUROC"
    falsification: "VC AUROC >= TE AUROC (verbalized confidence matches or beats entropy at 7B)"

