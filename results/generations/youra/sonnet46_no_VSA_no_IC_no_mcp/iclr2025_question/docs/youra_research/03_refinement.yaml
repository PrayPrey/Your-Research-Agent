# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The h-e2-v2 98-question TriviaQA pilot sample is representative enough to detect AUROC differences >= 0.05"
    supporting_evidence: "Bootstrap CI at N=98 is typically ±0.05; gaps >= 0.05 are detectable at ~80% power"
    consequence_if_violated: "Null result (no significant gap) even if true gap exists; extension to N=500 required"
  - id: "A2"
    assumption: "Llama-2-7B-Chat is a valid proxy for verbalized confidence at 7B scale (i.e., it follows the confidence elicitation prompt reliably)"
    supporting_evidence: "Xiong 2023 used instruction-tuned models for verbalized confidence evaluation; Chat variant is standard"
    consequence_if_violated: "VC AUROC measures prompt-following failure, not calibration — invalid comparison"
  - id: "A3"
    assumption: "BERTScore pairwise similarity is a valid consistency proxy for SelfCheckGPT at 7B scale on TriviaQA"
    supporting_evidence: "Manakul 2023 uses BERTScore for SelfCheckGPT consistency; works across model sizes"
    consequence_if_violated: "SCG AUROC underestimates actual consistency-based uncertainty discrimination"
  - id: "A4"
    assumption: "EM (Exact Match) labels on TriviaQA dev are reliable binary correctness indicators for all four uncertainty methods"
    supporting_evidence: "TriviaQA dev has verified gold answers; EM is standard evaluation metric in the field"
    consequence_if_violated: "AUROC is computed against noisy labels, degrading all four method estimates equally"
  - id: "A5"
    assumption: "The AUROC rank ordering found at N=98 (or N=500) generalizes to other questions in TriviaQA dev — i.e., the pilot is not cherry-picked"
    supporting_evidence: "h-e2-v2 used random sampling; same procedure should be maintained for extension"
    consequence_if_violated: "Results are pilot-specific; full 11,313-question evaluation required for definitive claims"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Llama-2-7B (base) and Llama-2-7B-Chat for verbalized confidence
    - TriviaQA dev set (trivia-style factual QA)
    - Open-ended generation tasks with K=10 stochastic samples
    - Binary correctness evaluation via Exact Match
    - Inference-time uncertainty estimation (no fine-tuning required)
  does_not_apply_to: |
    - Models larger than 7B (scale-up is future work / Phase 5)
    - Multiple-choice benchmarks (MMLU) — uncertainty framing differs for forced-choice
    - Tasks requiring free-form long-form generation (biography, summarization)
    - Fine-tuned or RLHF-aligned models beyond Llama-2-7B-Chat (verbalized confidence only)
    - Proprietary API-only models (logits unavailable for TE and SE)
  known_limitations: |
    - N=98 pilot may be underpowered for gaps < 0.05 — pilot gate defined (extend if |gap| < 0.03)
    - TriviaQA is trivia-domain only; TruthfulQA secondary evaluation needed for domain generalization
    - Verbalized confidence result may be Llama-2-7B-Chat-specific (does not generalize to base 7B)
    - SE NLI model (cross-encoder NLI) adds GPU overhead not captured in AUROC comparison alone

