# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SE4Way-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under Llama-2-7B scale on TriviaQA dev (N>=98, extendable to N=500),
    if all four major uncertainty proxy methods (single-pass token entropy [TE],
    SelfCheckGPT consistency [SCG], semantic entropy [SE], and verbalized confidence [VC])
    are applied under identical experimental conditions (same questions, same K=10 samples,
    same AUROC metric against binary EM correctness labels),
    then SE achieves a practically meaningful AUROC advantage over TE (SE-TE gap >= 0.05),
    SelfCheckGPT achieves comparable AUROC to SE (|SCG-SE| <= 0.03),
    and verbalized confidence underperforms both (VC < TE),
    because semantic-level clustering (SE) and consistency agreement (SelfCheckGPT) both
    filter paraphrase noise that degrades the discriminative power of token-level entropy,
    while verbalized confidence requires larger model scale (>= 13B) to achieve reliable calibration.
  alternative_hypothesis_h0: |
    There is no significant difference in AUROC among the four uncertainty proxy methods
    (TE, SE, SelfCheckGPT, verbalized confidence) on TriviaQA dev at Llama-2-7B scale.
    All pairwise AUROC gaps fall within bootstrap 95% CI half-width (< 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Uncertainty Proxy Method"
      type: "categorical"
      operationalization: "Which uncertainty estimation method is applied to Llama-2-7B outputs"
      levels:
        - "Token Entropy (TE): mean per-token Shannon entropy over softmax distribution, averaged across generated sequence"
        - "SelfCheckGPT (SCG): pairwise BERTScore consistency across K=10 samples; uncertainty = 1 - mean_agreement"
        - "Semantic Entropy (SE): NLI-based clustering of K=10 samples, entropy over cluster distribution (h-e2-v2 code)"
        - "Verbalized Confidence (VC): prompt Llama-2-7B-Chat to self-report 0-100% confidence after answering"
  dependent:
    - name: "AUROC (Hallucination Detection)"
      type: "continuous"
      operationalization: "Area under ROC curve for binary classification: uncertain (predicted) vs. incorrect (EM=0). Range [0,1]; 0.5=random. Higher=better uncertainty-correctness discrimination."
      primary: true
    - name: "ECE (Expected Calibration Error)"
      type: "continuous"
      operationalization: "Adaptive binning ECE across 10 bins; measures gap between stated confidence and empirical accuracy. Range [0,1]; 0=perfect calibration."
      primary: false
    - name: "Precision@20% Abstention"
      type: "continuous"
      operationalization: "Exact Match accuracy on the 80% of questions with lowest uncertainty score (most confident). Higher=better selective prediction."
      primary: false
  controlled:
    - name: "Base Model"
      operationalization: "Fixed at Llama-2-7B for TE/SE/SCG; Llama-2-7B-Chat for VC (required for instruction following)"
    - name: "Benchmark"
      operationalization: "TriviaQA dev set, same question sample (N=98 pilot, N=500 extension)"
    - name: "Number of Samples K"
      operationalization: "K=10 stochastic samples per question (temperature=0.7) for SE, SCG; K=1 for TE and VC"
    - name: "Correctness Label"
      operationalization: "Binary EM (Exact Match) against TriviaQA gold answers — same labeling for all four methods"
    - name: "Evaluation Metric"
      operationalization: "Bootstrap AUROC with 1000 iterations; 95% CI reported for each method"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM generates K=10 stochastic samples for each question (temperature sampling). High-uncertainty questions produce semantically diverse outputs; low-uncertainty questions produce near-identical outputs."
      evidence: "h-e2-v2 confirmed avg 3.89 semantic clusters on TriviaQA@7B, indicating genuine output diversity for uncertain questions"
      falsifier: "If all 10 samples are near-identical regardless of question difficulty, the diversity mechanism fails"
    - step: 2
      description: "Token-level entropy aggregates uncertainty over the vocabulary distribution at each token position, averaging across the sequence. This is sensitive to paraphrase variation — two correct answers ('Paris' vs 'the city of Paris') may have different token-level entropy despite identical semantics."
      evidence: "Standard NLG calibration literature; Huang et al. 2023 confirms single-pass entropy as baseline"
      falsifier: "If TE and SE produce identical AUROC, the paraphrase-noise mechanism is not operative"
    - step: 3
      description: "Semantic entropy (SE) and SelfCheckGPT (SCG) both operate at the semantic level. SE clusters NLI-equivalent outputs before computing entropy (filters paraphrase noise). SCG computes cross-sample BERTScore agreement (also semantic-level filtering). Both should achieve higher discrimination than TE by ignoring surface variation."
      evidence: "Kuhn et al. 2023: SE outperforms TE on Llama-65B. h-e2-v2: directional SE > TE gap confirmed at 7B (+0.029). SCG: Manakul 2023 demonstrates consistency > entropy for hallucination detection."
      falsifier: "If SE AUROC <= TE AUROC + 0.03 on the same questions, the semantic-level filtering mechanism does not improve discrimination at 7B"
    - step: 4
      description: "Verbalized confidence requires the model to meta-cognitively assess its own uncertainty. At 7B scale, Llama-2-7B-Chat lacks sufficient self-calibration for verbalized confidence to track actual accuracy. AUROC of VC should be lowest of the four methods at 7B scale."
      evidence: "Xiong et al. 2023: verbalized confidence poorly calibrated at 7B. Kadavath 2022: calibration improves with scale."
      falsifier: "If VC AUROC >= SE AUROC, the scale-dependent verbalized calibration mechanism is wrong"
  key_tension: "At 7B scale, SE's NLI-clustering overhead may not buy enough AUROC improvement over TE to justify the K×NLI compute cost. If the gap is < 0.03, practitioners should use TE (10× cheaper). The discussion did not resolve the magnitude of the gap — only the direction."
  evidence_summary: |
    Chain is supported by: (1) h-e2-v2 empirical confirmation of SE mechanism activation at 7B,
    (2) h-e2-v2 directional SE > TE gap (+0.029), (3) Kuhn 2023 showing larger SE > TE gap at 65B,
    (4) Xiong 2023 showing VC degradation at 7B scale. Chain Step 3 is the primary novel test.

