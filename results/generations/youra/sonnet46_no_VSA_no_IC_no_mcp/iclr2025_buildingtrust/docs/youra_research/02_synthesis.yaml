    - "meta-llama/Llama-2-13b-chat-hf (RLHF, larger)"
    - "mistralai/Mistral-7B-Instruct-v0.1 (instruction-tuned)"
  datasets:
    - "AdvGLUE (adversarial GLUE) — adversarial condition"
    - "GLUE (clean baseline for AdvGLUE)"
    - "facebook/anli (rounds R1, R2, R3) — adversarial condition"
    - "MultiNLI (clean baseline for ANLI)"
    - "lukaemon/bbh (MC subset) — adversarial condition"
    - "BIG-Bench (clean baseline for BBH)"
  baselines:
    - "Clean-split ECE (primary ECE baseline)"
    - "Temperature-scaled ECE (post-hoc calibration reference)"
    - "Random classifier ECE (upper bound reference)"

measurement_plan:
  data_collection:
    - source: "HuggingFace datasets hub: AdvGLUE, ANLI (R1/R2/R3), BBH, GLUE, MultiNLI"
    - source: "HuggingFace model hub: Llama-2, Mistral model checkpoints (4-bit quantized)"
  procedure:
    - step: "Load each (model, dataset, split) combination via lm-evaluation-harness"
    - step: "Extract logit distributions for multiple-choice answer tokens (A/B/C...)"
    - step: "Compute 15-bin ECE from logit probabilities vs. ground-truth accuracy per bin"
    - step: "Compute ΔECE = ECE(adversarial) − ECE(clean) for each model × task pair"
    - step: "Compute entropy H(p) = −Σ p_i log p_i per example; compute AUROC vs. error indicator"
    - step: "Stratify AdvGLUE results by human label-preservation confidence"
    - step: "Spearman correlation between per-model mean ΔECE and AUROC(entropy)"
  success_criteria:
    - "≥60% of model × task combinations show ΔECE > 0.05"
    - "Llama-2-7B-base ΔECE > Llama-2-7B-chat ΔECE (paired t-test p < 0.05)"
    - "Spearman r(ΔECE, AUROC) > 0.5 across models"

validation:
  internal_validity:
    - "Label preservation stratification to separate miscalibration from label noise confound"
    - "Base vs. instruction-tuned comparison controls for RLHF alignment effect"
    - "Consistent ECE computation protocol across all models and tasks"
    - "Sensitivity analysis: ECE with 10-bin and 20-bin variants"
  external_validity:
    - "Multiple adversarial benchmark types (AdvGLUE, ANLI) across different NLP task categories"
    - "Multiple model families (Llama-2, Mistral) to generalize beyond single architecture"
    - "Results scoped to open-weight models with logit access — explicit boundary condition"

discussion_synthesis:
  key_insights:
    - "The research gap is an intersection gap, not a methodology gap — no new tools required"
    - "ΔECE is a publishable signal regardless of direction (positive = overconfidence; null = adaptive uncertainty; negative = surprising robustness)"
    - "Including base vs. RLHF variants enables the alignment × calibration relationship study at minimal marginal cost"
    - "AdvGLUE label-preservation stratification converts a potential confound into an additional analytical contribution"
  breakthrough_moments:
    - "Prof. Pax confirmed technical feasibility: multiple-choice logit extraction is standard in lm-evaluation-harness, 4-8 GPU-hours total"
    - "Prof. Vera operationalized the falsification condition: ΔECE ≤ 0 is a compelling null finding, not just a failure"
    - "Dr. Nova reframed ΔECE as a 'calibration stress test' analogous to financial stress testing, resolving the deployment ECE gap concern"
  resolved_tensions:
    - "Label noise confound: resolved via label-preservation stratification and reporting"
    - "Multiple-choice ECE vs. deployment ECE: resolved by scoping claim to 'benchmark calibration stress test' with AUROC validation"
    - "Checkpoint specificity: resolved by including both Llama-2-7B-base and -chat for direct RLHF comparison"
