hypothesis_draft:
  title: "Calibration Collapse Under Adversarial Perturbation: Measuring ΔECE Across LLM Families on Existing NLP Benchmarks"
  hypothesis_id: "H-DeltaECE-v1"
  core_claim: |
    LLMs exhibit systematic calibration degradation (ΔECE > 0) when evaluated on adversarial NLP
    benchmark splits (AdvGLUE, ANLI) compared to clean counterparts (GLUE, MultiNLI), revealing
    overconfidence under adversarial inputs that clean-benchmark evaluation fails to detect.
    This ΔECE signal varies across model families and predicts entropy-based failure detection quality.
  mechanism: |
    Adversarial perturbations (lexical substitutions, paraphrases) preserve ground-truth labels
    while shifting input surface features that model representations depend on. Accurate models
    should reduce confidence under uncertainty — a well-calibrated model would show lower confidence
    on perturbed inputs where it is less likely to be correct. Overconfident models fail to
    reduce confidence proportionally to accuracy loss, producing ECE increase (ΔECE > 0).
    This mechanism predicts that RLHF-aligned models (trained with calibration-aware human feedback)
    will show lower ΔECE than base models.
  predictions:
    - P1: "ΔECE > 0.05 for ≥60% of model × task combinations across AdvGLUE, ANLI, BBH-MC"
    - P2: "Llama-2-7B-base ΔECE significantly higher than Llama-2-7B-chat (paired t-test p < 0.05)"
    - P3: "Per-model mean ΔECE correlates positively with AUROC(entropy failure predictor), Spearman r > 0.5"

variables_summary:
  independent: "Input perturbation condition (clean vs. adversarial split) × Model family (Llama-2-7B-base, -chat, -13B-chat; Mistral-7B-instruct) × Task type (NLI, adversarial classification, commonsense)"
  dependent_primary: "ΔECE = ECE(adversarial split) − ECE(clean split), 15-bin logit-based; positive = miscalibration increase"
  controlled: "ECE computation method (15-bin equal-width), evaluation protocol (lm-evaluation-harness), label quality (AdvGLUE human-verified, ANLI model-in-the-loop)"

null_hypothesis:
  h0_statement: |
    There is no significant increase in ECE between adversarial and clean NLP benchmark splits
    (ΔECE ≤ 0 for ≥60% of model × task combinations), indicating that open-weight LLMs
    appropriately reduce confidence under adversarial inputs.
  statistical_test: "One-sided paired t-test on ΔECE distributions per model; proportion test for ≥60% threshold"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First measurement of logit-based ECE on adversarial NLP benchmark splits for open-weight LLMs; first ΔECE computation as calibration stress test signal"
  differentiation_summary: |
    Prior calibration work (Guo 2017, Minderer 2021) is image-domain only. Prior LLM calibration
    work (Kadavath 2022, Xiong 2023) uses clean benchmarks and verbal elicitation. Adversarial
    NLP benchmarks (AdvGLUE, ANLI) have measured accuracy only (Wang et al. 2021). This study
    fills the intersection: ECE on adversarial NLP splits for open-weight LLMs via logit extraction.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

