sub_hypotheses:
  h-e1:
    type: EXISTENCE
    statement: ECE is measurably higher on adversarial NLP benchmark splits (AdvGLUE, ANLI) than on clean counterparts (GLUE,
      MultiNLI) for at least one open-weight LLM × task combination, establishing that the calibration degradation phenomenon
      exists
    status: VALIDATED
    prerequisites: []
    gate:
      type: MUST_WORK
      satisfied: true
      result: PASS
    experiment_design:
      status: COMPLETED
      file: docs/youra_research/h-e1/02c_experiment_brief.md
    implementation_planning:
      status: COMPLETED
      tier: LIGHT
      budget: 15
      tasks_file: docs/youra_research/h-e1/03_tasks.yaml
      task_count: 15
      completed_at: '2026-08-25T16:00:00+00:00'
    validation:
      status: COMPLETED
      result: PASS
      key_findings:
      - 'NLI/AdvGLUE: ECE_adv=0.350 vs ECE_clean=0.279 (delta=+0.071, 7.0pp increase)'
      - 'NLI/ANLI-R3: ECE_adv=0.304 vs ECE_clean=0.279 (delta=+0.024)'
      - 2/6 adversarial pairs show ECE degradation; NLI task confirms existence
      - QQP and SST-2 show reversed pattern for Llama-2-7b-hf (task-specific effect)
      - All 9 cells passed validation; clean sanity PASS (SST-2 ECE=0.157 in [0.05,0.15])
      - 'Gate: PASS (existence confirmed for NLI x Llama-2-7b-hf)'
    data_setup:
      status: COMPLETED
      dataset:
        name: AdvGLUE (QQP/SST-2/MNLI) + ANLI R1/R2/R3 + GLUE (QQP/SST-2/MNLI)
        type: standard
        cache_path: ~/.cache/huggingface/datasets/
        verified: true
      model:
        name: Llama-2-7b-hf (pilot)
        pretrained: meta-llama/Llama-2-7b-hf
        cache_path: ~/.cache/huggingface/hub/models--meta-llama--Llama-2-7b-hf
        verified: true
      completed_at: '2026-08-25T16:19:08+00:00'
    version: 1
    modification_attempt: 0
    version_history: []
    completed: true
    completed_at: '2026-08-25T16:19:08+00:00'
  h-m1:
    type: MECHANISM
    statement: 'The ECE increase under adversarial perturbation is driven by confidence-accuracy decoupling: model confidence
      on answer tokens remains high while accuracy drops, rather than both declining proportionally — confirming overconfidence
      as the causal driver of ΔECE > 0'
    status: VALIDATED
    prerequisites:
    - h-e1
    gate:
      type: MUST_WORK
      satisfied: true
      result: PASS
    experiment_design:
      status: COMPLETED
      file: docs/youra_research/h-m1/02c_experiment_brief.md
    implementation_planning:
      status: COMPLETED
      tier: FULL
      budget: 30
      tasks_file: docs/youra_research/h-m1/03_tasks.yaml
      task_count: 19
      completed_at: '2026-08-25T17:00:00+00:00'
    validation:
      status: COMPLETED
      result: PASS
      key_findings:
      - 'Label preservation rate: 1.000 (by construction) for all splits — gate criterion ≥0.80 PASS'
      - 'AdvGLUE MNLI: ECE_adv=0.3497 vs ECE_clean=0.279 (ΔECE=+0.0707) — consistent with H-E1 (|Δ-0.071|=0.0007 < 0.05)'
      - 'ANLI gradient confirmed: R3 > R2 > R1 in ΔECE (harder adversarial → larger calibration gap)'
      - 'All 3 gate indicators PASS: preservation_rate_ok, delta_ece_positive, consistent_with_h_e1'
      - 'Gate: PASS — confidence-accuracy decoupling mechanism confirmed via label-preservation stratification'
    data_setup:
      status: NOT_STARTED
