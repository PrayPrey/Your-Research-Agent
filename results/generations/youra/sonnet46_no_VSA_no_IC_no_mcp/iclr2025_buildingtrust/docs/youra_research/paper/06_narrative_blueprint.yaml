# ============================================================================
# PART 9: TITLE OPTIONS
# ============================================================================

title_options:
  primary: >
    When Adversarial Examples Improve Calibration: Construction-Method-Dependent
    Calibration Degradation in Open-Weight LLMs
  alternative_1: >
    Adversarial Calibration Audit: How Benchmark Construction Method Determines
    Whether RLHF Alignment Helps or Hurts
  alternative_2: >
    Not All Adversarial Benchmarks Stress-Test Calibration Equally:
    ΔECE Measurement Across AdvGLUE, ANLI, and RLHF Alignment

  recommended: "primary"
  reasoning: >
    Opens with the counterintuitive finding (hook strategy), immediately signals the
    conditional insight, and names the primary independent variable (construction method).
    Short enough for ICML format (10-word main title).
