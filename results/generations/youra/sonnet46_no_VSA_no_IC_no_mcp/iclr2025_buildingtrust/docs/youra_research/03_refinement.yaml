  model:
    name: "Llama-2-7B-base, Llama-2-7B-chat, Llama-2-13B-chat, Mistral-7B-instruct"
    type: "open-weight decoder-only transformer"
    source: "meta-llama/Llama-2-7b-hf, meta-llama/Llama-2-7b-chat-hf, meta-llama/Llama-2-13b-chat-hf, mistralai/Mistral-7B-Instruct-v0.1 (HuggingFace Hub)"
    hypothesis_fit: "Open-weight models allow logit extraction; base vs. chat variant comparison enables RLHF effect study (P2); Mistral-7B provides cross-architecture data point"
  baselines:
    - name: "Clean benchmark ECE"
      method: "ECE computed on GLUE / MultiNLI / BIG-Bench (non-adversarial splits) — primary baseline for ΔECE computation"
    - name: "Temperature-scaled calibration"
      method: "Post-hoc temperature scaling (Guo 2017) applied to clean-split logits as calibration floor reference"
    - name: "Random classifier ECE"
      method: "ECE of uniform random classifier on each task — upper bound reference for worst-case calibration"

