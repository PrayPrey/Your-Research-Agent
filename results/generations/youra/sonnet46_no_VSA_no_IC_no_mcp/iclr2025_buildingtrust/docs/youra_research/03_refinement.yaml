# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "ΔECE > 0.05 for ≥60% of model × task combinations across AdvGLUE, ANLI, and BBH-MC adversarial splits"
    test_method: "Compute 15-bin logit-based ECE for each (model, task, split) combination; calculate ΔECE = ECE(adversarial) − ECE(clean); count proportion exceeding 0.05 threshold"
    success_criterion: "≥60% of model × task combinations show ΔECE > 0.05; mean ΔECE across all combinations > 0"
    falsification: "ΔECE ≤ 0 for majority of combinations, or mean ΔECE ≤ 0 — indicates models are well-calibrated under adversarial stress"
  - id: "P2"
    primary: false
    statement: "Llama-2-7B-base shows significantly higher ΔECE than Llama-2-7B-chat, indicating RLHF alignment reduces calibration degradation under adversarial perturbation"
    test_method: "Paired comparison of ΔECE distributions for Llama-2-7B-base vs. Llama-2-7B-chat across same task × split combinations; paired t-test"
    success_criterion: "Llama-2-7B-base mean ΔECE significantly higher than Llama-2-7B-chat (p < 0.05, paired t-test)"
    falsification: "No significant difference between base and chat variants — RLHF does not affect calibration robustness"
  - id: "P3"
    primary: false
    statement: "Per-model mean ΔECE correlates positively with AUROC of entropy as failure predictor (Spearman r > 0.5)"
    test_method: "For each model: compute mean ΔECE across all tasks; compute AUROC of entropy H(p) against per-example error indicator from benchmark labels; Spearman correlation across models"
    success_criterion: "Spearman r > 0.5 between mean ΔECE and AUROC(entropy) across the 4 models"
    falsification: "No correlation (r < 0.3) — ΔECE does not predict entropy-based failure detection quality"

