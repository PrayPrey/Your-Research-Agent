# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "ECE measures the gap between predicted confidence and actual accuracy, formalized by Guo et al. 2017"
      status: "BUILD_ON"
      evidence: "Guo et al. 2017 (arXiv 1706.04599) — ECE + temperature scaling, ~4000 citations"
    - claim: "Modern neural networks are systematically overconfident despite high accuracy"
      status: "BUILD_ON"
      evidence: "Guo et al. 2017; Minderer et al. 2021 — established across image model families"
    - claim: "Distribution shift degrades calibration even when accuracy remains stable"
      status: "BUILD_ON"
      evidence: "Minderer et al. 2021 (arXiv 2106.07998) — demonstrated on ImageNet-C and ObjectNet"
    - claim: "Adversarial NLP benchmarks (AdvGLUE, ANLI) cause 15-30% accuracy drops in LLMs"
      status: "BUILD_ON"
      evidence: "Wang et al. 2021 (arXiv 2111.02840) AdvGLUE; Nie et al. 2020 (arXiv 1910.14599) ANLI"
    - claim: "ECE on adversarial NLP benchmark splits for open-weight LLMs has never been measured"
      status: "PROVE_NEW"
      evidence: "Systematic gap identified in Phase 1 — no published study combines ECE with AdvGLUE/ANLI"
    - claim: "ΔECE (perturbed ECE − clean ECE) as a deployment reliability signal is unvalidated"
      status: "PROVE_NEW"
      evidence: "No published AUROC validation of ΔECE against failure mode prediction"
  scope_reduction_percentage: 67
  phase2b_4_instructions: |
    Section 0 established facts (BUILD_ON) can be cited as prior work without re-verification.
    PROVE_NEW claims (ECE on adversarial NLP splits; ΔECE as reliability predictor) are the
    core experimental contributions. Phase 2B should focus verification protocols on these two
    novel claims. Temperature scaling (Guo 2017) is available as a post-hoc calibration baseline.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DeltaECE-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under adversarial text perturbation on existing NLP benchmarks (AdvGLUE, ANLI, BIG-Bench Hard MC),
    if open-weight LLMs (Llama-2-7B-base, Llama-2-7B-chat, Llama-2-13B-chat, Mistral-7B-instruct)
    are evaluated using logit-based 15-bin Expected Calibration Error on multiple-choice task formats,
    then ΔECE (ECE_adversarial − ECE_clean) will be positive (> 0.05) for ≥60% of model × task
    combinations, because adversarial perturbation preserves ground-truth labels while changing
    surface features in ways that trigger high model confidence on incorrect answers — exposing
    systematic overconfidence invisible in clean-benchmark evaluation.
  alternative_hypothesis_h0: |
    There is no significant increase in ECE between adversarial and clean benchmark splits
    (ΔECE ≤ 0 for ≥60% of model × task combinations), indicating LLMs appropriately reduce
    confidence under adversarial inputs (well-calibrated under distribution shift).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Input perturbation condition"
      type: "categorical"
      operationalization: "Clean vs. adversarial benchmark split (AdvGLUE vs. GLUE; ANLI vs. MultiNLI; BBH-MC vs. BIG-Bench)"
      levels: ["clean", "adversarial"]
    - name: "Model family and variant"
      type: "categorical"
      operationalization: "Specific HuggingFace model checkpoint"
      levels: ["Llama-2-7B-base", "Llama-2-7B-chat", "Llama-2-13B-chat", "Mistral-7B-instruct"]
    - name: "Task type"
      type: "categorical"
      operationalization: "NLP benchmark task category"
      levels: ["NLI (ANLI/MultiNLI)", "Adversarial classification (AdvGLUE/GLUE)", "Commonsense reasoning (BBH-MC)"]
  dependent:
    - name: "ΔECE (Delta Expected Calibration Error)"
      type: "continuous"
      operationalization: "ECE(adversarial split) − ECE(clean split); computed via 15-bin logit-based ECE; range [-1, 1]; positive = miscalibration increase"
      primary: true
    - name: "AUROC of entropy as failure predictor"
      type: "continuous"
      operationalization: "Area under ROC curve of entropy H(p) against ground-truth error indicator (wrong answer) per model × task; range [0.5, 1.0]"
      primary: false
    - name: "Accuracy delta (ΔAcc)"
      type: "continuous"
      operationalization: "Accuracy(adversarial) − Accuracy(clean); range [-1, 0]; control variable"
      primary: false
  controlled:
    - name: "ECE computation method"
      operationalization: "15-bin equal-width ECE on answer-token probability distribution; same implementation across all models and tasks"
    - name: "Evaluation protocol"
      operationalization: "lm-evaluation-harness with logit extraction; consistent prompt templates per task type"
    - name: "Benchmark label quality"
      operationalization: "AdvGLUE human-verified label preservation; ANLI model-in-the-loop adversarial construction; stratification by label preservation confidence"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Adversarial perturbation preserves semantic label while altering surface features (lexical substitutions, paraphrases, syntactic changes) that disrupt model input representations"
      evidence: "AdvGLUE human-verified label preservation (Wang et al. 2021); ANLI construction protocol (Nie et al. 2020)"
      falsifier: "If adversarial perturbations systematically alter ground truth labels (label noise), ΔECE reflects noise rather than miscalibration — testable via label-preservation stratified analysis"
    - step: 2
      description: "Perturbed inputs cause accuracy drops (model predicts wrong answers) while model confidence remains high — the model's softmax distribution does not appropriately flatten under uncertainty-inducing inputs"
      evidence: "Analogous finding in vision: Minderer et al. 2021 shows distribution shift degrades calibration even with stable accuracy; AdvGLUE accuracy drops 15-30% (Wang et al. 2021) without any calibration measurement"
      falsifier: "If models systematically lower confidence on perturbed inputs (ΔECE ≤ 0), the mechanism fails — models are adaptively uncertain, not overconfident"
    - step: 3
      description: "The gap between high confidence and low accuracy on adversarial examples manifests as elevated ECE, producing ΔECE > 0 — a measurable, reproducible signal of calibration failure under adversarial stress"
      evidence: "ECE definition (Guo 2017): ECE = Σ |acc(b) − conf(b)| × |b|/n; when acc drops but conf stays high, ECE increases"
      falsifier: "If ECE(adversarial) ≈ ECE(clean) despite accuracy drop, models adjust confidence proportionally — calibration mechanism is adaptive"
  key_tension: "Whether model miscalibration under adversarial inputs is a fundamental property (systematic ΔECE > 0) or depends on alignment training (RLHF-aligned models may show lower ΔECE than base models)"
  evidence_summary: |
    The causal mechanism relies on three established findings: (1) adversarial perturbations
    preserve labels while lowering accuracy [AdvGLUE, ANLI papers]; (2) distribution shift
    degrades calibration in vision models [Minderer 2021]; (3) ECE mathematically captures
    confidence-accuracy gap [Guo 2017]. The novel claim is that these three established facts
    combine to produce measurable ΔECE in LLMs on adversarial NLP benchmarks — a prediction
    that has not been tested.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Logit-based ECE on answer-token distributions for multiple-choice tasks is a valid calibration measure for LLMs"
    supporting_evidence: "Standard practice in LLM evaluation (Kadavath 2022 uses P(True) as calibration signal; lm-evaluation-harness outputs logits for MC tasks)"
    consequence_if_violated: "ECE measurements would not reflect true model calibration — results would be artifact of tokenization or prompt format rather than calibration"
  - id: "A2"
    assumption: "AdvGLUE and ANLI adversarial examples preserve ground-truth labels for the majority of instances"
    supporting_evidence: "AdvGLUE: human-verified label preservation; ANLI: model-in-the-loop construction with human validation"
    consequence_if_violated: "ΔECE increase may partially reflect label noise rather than miscalibration — addressed by label-preservation stratification"
  - id: "A3"
    assumption: "Clean benchmark counterparts (GLUE, MultiNLI) are appropriate baselines for adversarial calibration comparison"
    supporting_evidence: "AdvGLUE is explicitly derived from GLUE; ANLI is explicitly designed as adversarial MultiNLI — same task, different perturbation"
    consequence_if_violated: "ΔECE comparison would conflate task difficulty difference with calibration difference — controlled by restricting to same task categories"
  - id: "A4"
    assumption: "Public HuggingFace checkpoints for Llama-2-7B-base, Llama-2-7B-chat, Llama-2-13B-chat, Mistral-7B-instruct are representative of their respective model families"
    supporting_evidence: "These are official Meta/Mistral AI releases; widely used as reference points in academic evaluation"
    consequence_if_violated: "Results may not generalize to proprietary or fine-tuned model variants — explicitly scoped to open-weight models"
  - id: "A5"
    assumption: "15-bin equal-width ECE with logit-based confidence scores captures meaningful calibration signal across different task types"
    supporting_evidence: "15-bin ECE is standard (Guo 2017); sensitivity analysis with different bin counts is a robustness check"
    consequence_if_violated: "Results may depend on binning choice — mitigated by reporting both ECE and calibration reliability diagrams"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Open-weight LLMs evaluated on multiple-choice NLP benchmark tasks using logit extraction.
    Adversarial perturbation types in AdvGLUE (lexical substitution, paraphrase, syntactic) and ANLI
    (model-in-the-loop adversarial NLI). Tasks with clear answer-token probability distributions
    (binary or 3-class classification). Models accessible via HuggingFace Hub with logit output.
  does_not_apply_to: |
    Proprietary models without logit access (GPT-4, Claude-3) — verbal calibration elicitation
    would require different protocol. Open-ended generation tasks where confidence is diffuse.
    Domain-specific fine-tuned models (medical, legal) — scoped to general-purpose LLMs.
    Calibration under training-time interventions (temperature scaling) — this study measures
    intrinsic post-deployment calibration without post-hoc adjustment.
  known_limitations: |
    Multiple-choice ECE is a proxy for deployment calibration; real deployments involve free-text
    generation. Benchmarks are English-only. Adversarial perturbations in AdvGLUE/ANLI may not
    represent all real-world distribution shifts. Results on 4-bit quantized models may differ
    from full-precision inference.

