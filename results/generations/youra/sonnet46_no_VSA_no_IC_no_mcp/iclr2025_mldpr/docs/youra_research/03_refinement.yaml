# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchSat-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the condition that a benchmark has ≥ 50 leaderboard submissions in Papers With Code
    with date coverage from ≥ 2019, if we fit a logistic growth model to the score-over-time
    timeseries and compare it against linear and sub-linear alternatives via AIC,
    then the logistic model will be statistically preferred AND its detected saturation date
    (inflection point + asymptote exceedance) will match the community-recognized saturation event
    within ±6 months, because benchmark overfitting accumulates gradually as models are tuned
    against a fixed test set, producing a characteristic S-curve that the logistic model captures
    while linear models cannot.
  alternative_hypothesis_h0: |
    There is no significant difference in AIC between the logistic growth model and a linear trend
    model fitted to benchmark score-over-time timeseries; or, the logistic-detected saturation dates
    do not match community-recognized saturation events within ±6 months.

