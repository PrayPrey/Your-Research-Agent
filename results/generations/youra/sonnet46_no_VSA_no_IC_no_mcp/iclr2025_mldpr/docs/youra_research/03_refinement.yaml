variables:
  independent:
    - name: "Benchmark identity"
      type: "categorical"
      operationalization: "Papers With Code benchmark ID (e.g., 'glue', 'superglue', 'imagenet')"
      levels: ["GLUE", "SuperGLUE", "ImageNet", "SQuAD"]
    - name: "Time (t)"
      type: "continuous"
      operationalization: "Leaderboard submission date in months since benchmark release; derived from Papers With Code API result dates"
  dependent:
    - name: "AIC-preferred model type"
      type: "categorical"
      operationalization: "AIC comparison output: logistic | linear | sub-linear; logistic preferred = saturation-consistent"
      primary: true
    - name: "Detected saturation date"
      type: "continuous"
      operationalization: "Date at which top-3 models exceed fitted logistic asymptote K AND monthly gain rate < 5% of peak; in months since benchmark release"
      primary: false
    - name: "Saturation date error"
      type: "continuous"
      operationalization: "Absolute difference in months between detected saturation date and community ground truth date (successor benchmark publication date)"
      primary: false
    - name: "Prospective forecast error"
      type: "continuous"
      operationalization: "Absolute difference in months between saturation date forecasted from 6-months-early truncated data and actual saturation date"
      primary: false
  controlled:
    - name: "Minimum leaderboard entries"
      operationalization: "Restrict analysis to benchmarks with ≥ 50 Papers With Code entries"
    - name: "Date coverage"
      operationalization: "Restrict to benchmarks with submission dates resolvable to month-level precision from ≥ 2019"
    - name: "Metric standardization"
      operationalization: "Use single composite metric per benchmark (GLUE score, ImageNet top-1 accuracy, SQuAD F1)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Models are iteratively developed with awareness of benchmark test set performance (directly or through leakage from validation sets), causing gradual benchmark-specific overfitting"
      evidence: "Recht et al. 2019 — accuracy gap on independently-collected ImageNet-v2 documents this effect; Goodhart's Law theoretical framing"
      falsifier: "If models trained with zero access to benchmark feedback show the same score trajectory, Step 1 fails"
    - step: 2
      description: "Benchmark-specific overfitting accumulates nonlinearly — early models improve by genuine capability gains; later models increasingly optimize benchmark-specific features; gains slow as benchmark-exploitable signal is exhausted"
      evidence: "GLUE/SuperGLUE score trajectories show visible S-curve in temporal plots; logistic curve captures this nonlinearity"
      falsifier: "If score-over-time is linear or sub-linear (AIC favors non-logistic), Step 2 fails"
    - step: 3
      description: "The logistic growth model (score = K / (1 + exp(-r*(t-t0)))) captures this S-curve; parameters K (ceiling), r (growth rate), t0 (inflection point) encode the saturation dynamics; AIC comparison with linear model is the formal test"
      evidence: "Logistic model is the canonical S-curve model; scipy curve_fit implementation available; AIC model selection is standard"
      falsifier: "If AIC does not favor logistic over linear for GLUE/SuperGLUE data, Step 3 fails"
    - step: 4
      description: "The logistic inflection point (t0) + asymptote exceedance criterion identifies the saturation date; this date correlates with community-recognized saturation (successor benchmark creation date) within ±6 months"
      evidence: "GLUE saturation recognized Sept 2019 (SuperGLUE paper); SuperGLUE saturation recognized ~2021 (BIG-bench paper); both are hard dates"
      falsifier: "If detected saturation dates differ from ground truth by > 6 months for both benchmarks, Step 4 fails"
  key_tension: "Ceiling effects (accuracy naturally bounded at 100%) vs. overfitting-driven saturation produce visually similar S-curves; cross-benchmark divergence analysis is required to distinguish them"
  evidence_summary: |
    The causal chain rests on three empirical pillars: (1) Recht et al. 2019 documents benchmark
    overfitting as a real phenomenon with measurable accuracy gaps; (2) GLUE/SuperGLUE temporal
    data (available via Papers With Code API) shows S-curve progression; (3) logistic curve fitting
    is a standard statistical technique with established tooling. The novel claim is that the
    logistic model captures this mechanism formally enough to enable automated, benchmark-agnostic
    detection without new test set collection.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Papers With Code leaderboard submission dates are accurate to month-level precision for entries from ≥ 2019"
    supporting_evidence: "Papers With Code has been actively maintained since 2018; major benchmark submissions are linked to dated arXiv papers"
    consequence_if_violated: "Temporal resolution insufficient for logistic fitting; fallback to year-level granularity reduces statistical power"
  - id: "A2"
    assumption: "The community-recognized saturation date (successor benchmark publication date) is a valid independent ground truth for benchmark saturation"
    supporting_evidence: "SuperGLUE was explicitly created because GLUE saturated (stated in paper); BIG-bench created for similar reasons — these dates are documented"
    consequence_if_violated: "Circular validation risk (Prof. Rex's concern); mitigation: use paper publication date, not submission rate"
  - id: "A3"
    assumption: "Self-reporting selection bias (teams submit only when beating SOTA) biases K estimates upward but does not destroy the sigmoid structure"
    supporting_evidence: "Even with censoring, the growth phase and plateau phase remain observable in major benchmarks with many submissions"
    consequence_if_violated: "K overestimated; saturation detection may be triggered prematurely; sensitivity analysis required"
  - id: "A4"
    assumption: "The logistic model's three parameters (K, r, t0) are identifiable from the available leaderboard timeseries (i.e., data spans all three curve phases)"
    supporting_evidence: "GLUE has hundreds of entries spanning growth, inflection, and plateau phases; SuperGLUE similarly"
    consequence_if_violated: "Parameter non-identification for benchmarks with < 50 entries or no plateau phase data; scope restriction to ≥ 50 entries mitigates"
  - id: "A5"
    assumption: "Successor benchmark publication date is available for at least 2 target benchmarks (GLUE → SuperGLUE, SuperGLUE → BIG-bench) enabling ground truth validation"
    supporting_evidence: "SuperGLUE paper published Sept 2019; BIG-bench published 2021; both are documented public records"
    consequence_if_violated: "Cannot validate saturation date detection; hypothesis degrades to descriptive claim only"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    NLP and CV benchmarks hosted on Papers With Code with: (a) ≥ 50 leaderboard submissions,
    (b) submission dates resolvable to month-level precision from ≥ 2019, (c) a single primary
    composite metric (e.g., GLUE score, ImageNet top-1 accuracy, SQuAD F1). Primary targets:
    GLUE, SuperGLUE, ImageNet classification, SQuAD 1.1, SQuAD 2.0.
  does_not_apply_to: |
    Benchmarks with < 50 leaderboard entries; benchmarks without public leaderboard history
    in Papers With Code; benchmarks where the primary metric is not a scalar (e.g., human
    preference ratings, generation quality); benchmarks released after 2022 (insufficient
    leaderboard history for curve fitting); datasets not in Papers With Code ecosystem.
  known_limitations: |
    (1) Selection bias in self-reported leaderboard submissions biases K upward.
    (2) Date resolution degrades for pre-2019 entries (year-level only).
    (3) Method detects saturation in leaderboard scores, not necessarily in real-world capability —
    a benchmark can saturate while the underlying task remains unsolved in deployment.
    (4) Cross-benchmark divergence analysis is a secondary signal only; distinguishing
    ceiling effects from overfitting-driven saturation requires comparative analysis.

