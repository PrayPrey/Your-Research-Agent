    - claim: "SuperGLUE benchmark saturated within approximately 24 months of release (2019–2021)"
      status: "BUILD_ON"
      evidence: "Wang et al. 2019 (arXiv:1905.00537); successor benchmarks (BIG-bench, MMLU) released from 2021"
    - claim: "Benchmark overfitting is empirically real — models show accuracy drops on independently-collected test sets"
      status: "BUILD_ON"
      evidence: "Recht et al. 2019 (arXiv:1902.10811) — 11–14 pp accuracy drop on ImageNet-v2"
    - claim: "Papers With Code API provides historical leaderboard timeseries (model name, score, date) for major benchmarks"
      status: "BUILD_ON"
