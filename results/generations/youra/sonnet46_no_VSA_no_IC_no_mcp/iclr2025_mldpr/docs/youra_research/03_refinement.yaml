predictions:
  - id: "P1"
    primary: true
    statement: "A logistic growth model fitted to GLUE and SuperGLUE leaderboard timeseries will be statistically preferred over linear and sub-linear alternatives by AIC (ΔAIC > 4 vs. linear, i.e., substantially better fit)"
    test_method: "Retrieve GLUE and SuperGLUE historical leaderboard data from Papers With Code API; fit logistic (scipy curve_fit), linear (numpy polyfit), and sub-linear (power law) models; compute AIC for each; compare"
    success_criterion: "Logistic model has ΔAIC > 4 vs. linear for both GLUE and SuperGLUE (Burnham & Anderson substantial evidence threshold)"
    falsification: "If ΔAIC < 4 for either benchmark, logistic preference claim fails; if linear is preferred, saturation mechanism claim is unsupported"
  - id: "P2"
    primary: false
    statement: "Logistic-detected saturation dates for GLUE (~Sept 2019) and SuperGLUE (~2021) match community-recognized ground truth within ±6 months"
    test_method: "Apply saturation detection criterion (top-3 models exceed fitted K AND monthly gain rate < 5% of peak) to full historical timeseries; compare to successor benchmark publication dates"
    success_criterion: "Detected saturation date within ±6 months of SuperGLUE paper publication (Sept 2019 for GLUE) and BIG-bench announcement (~2021 for SuperGLUE)"
    falsification: "If detected dates differ from ground truth by > 6 months for both benchmarks, date validation fails"
  - id: "P3"
    primary: false
    statement: "Fitting the logistic model to truncated GLUE timeseries (data available 6 months before community saturation date) yields a saturation forecast within ±3 months of the actual date"
    test_method: "Truncate GLUE timeseries at Sept 2019 - 6 months (≈ March 2019); fit logistic; extrapolate to forecast saturation date; compare forecast to Sept 2019 ground truth"
    success_criterion: "Forecast date within ±3 months of Sept 2019"
    falsification: "If forecast error > 3 months for GLUE, prospective detection claim fails"

