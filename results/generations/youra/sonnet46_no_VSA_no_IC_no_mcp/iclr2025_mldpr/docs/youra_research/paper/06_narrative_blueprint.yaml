notes:
  creation_notes: |
    Hook strategy: "practical_failure + counterintuitive_finding" chosen over
    "surprising_statistic" because the GLUE→SuperGLUE concrete historical event
    is more resonant for the target audience (NLP/ML researchers) than an
    abstract statistic. The negative t0 finding provides the counterintuitive element.

    Key narrative tension: The paper reports one refuted prediction (P3) alongside
    two supported ones. The blueprint frames this as a credibility asset, not a weakness —
    honest reporting of P3 failure makes the P1/P2 validations more convincing.

    Paper title suggestion: "When Did GLUE Go Stale? Automated Benchmark Saturation
    Detection via Logistic Growth Model Fitting" — anchors to the concrete historical
    hook while signaling the technical approach.

    Alternative title: "Benchmarks Have a Logistic Lifecycle: Automated Saturation
    Detection from Leaderboard Timeseries"
