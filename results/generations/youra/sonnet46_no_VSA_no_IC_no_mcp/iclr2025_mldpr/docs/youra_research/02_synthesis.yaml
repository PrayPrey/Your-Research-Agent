hypothesis_draft:
  title: "Automated Temporal Benchmark Saturation Detection via Logistic Curve Fitting on Public Leaderboard Timeseries"
  hypothesis_id: "H-BenchSat-v1"
  core_claim: |
    For ML benchmarks with ≥ 50 leaderboard submissions in Papers With Code (date coverage ≥ 2019),
    a logistic growth model fitted to the score-over-time timeseries will be statistically preferred
    over linear alternatives (AIC) AND the model's saturation date criterion will match
    community-recognized saturation events within ±6 months, enabling prospective saturation
    forecasting from data available 6 months before community consensus.
  mechanism: |
    Benchmark overfitting accumulates as models are tuned against a fixed test set, producing an
    S-curve in leaderboard performance: slow initial gains (learning phase), rapid ascent
    (exploitation phase), plateau (saturation phase). The logistic growth model captures this
    S-curve via its three parameters (K=ceiling, r=growth rate, t0=inflection point). AIC model
    comparison formally tests whether the S-curve structure is warranted. The inflection point
    combined with asymptote exceedance criterion operationalizes the saturation event.
  predictions:
    - P1: "Logistic model AIC-preferred over linear for GLUE and SuperGLUE (ΔAIC > 4)"
    - P2: "Detected saturation dates match community ground truth (successor benchmark publication dates) within ±6 months"
    - P3: "Logistic fit to truncated GLUE data (6 months before saturation) forecasts actual saturation within ±3 months"

variables_summary:
  independent: "Benchmark identity (GLUE/SuperGLUE/ImageNet/SQuAD) and time (months since release, from Papers With Code API submission dates)"
  dependent_primary: "AIC-preferred model type (logistic vs. linear vs. sub-linear) — primary test of hypothesis"
  controlled: "Minimum 50 leaderboard entries, month-level date precision from ≥ 2019, single composite metric per benchmark"

null_hypothesis:
  h0_statement: |
    There is no significant difference in AIC between the logistic growth model and a linear trend
    model fitted to benchmark score-over-time timeseries (ΔAIC < 4); or, the logistic-detected
    saturation dates differ from community-recognized saturation events by > 6 months for at least
    one of GLUE or SuperGLUE.
  statistical_test: "AIC model comparison (Burnham & Anderson 2002 criteria: ΔAIC > 4 = substantial evidence)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First benchmark-agnostic automated saturation detection pipeline using Papers With Code API timeseries and formal logistic/linear AIC comparison — eliminates new test set collection requirement"
  differentiation_summary: |
    Prior work requires either: (a) a new independently-collected test set (Recht et al. 2019),
    or (b) human expert judgment (community consensus). This hypothesis operationalizes saturation
    detection as a fully automated statistical procedure over existing public data. The prospective
    forecasting capability (P3) is qualitatively novel — no prior work predicts saturation dates
    in advance from leaderboard curves.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Logistic growth model: K / (1 + exp(-r*(t-t0))) — fitted via scipy.optimize.curve_fit"
    - "Linear model: score = a*t + b — OLS via numpy.polyfit"
    - "Power law model: score = a * t^b — log-linear fitting"
  datasets:
    - "Papers With Code GLUE leaderboard (paperswithcode-client API)"
    - "Papers With Code SuperGLUE leaderboard"
    - "Papers With Code ImageNet classification leaderboard"
    - "Papers With Code SQuAD 1.1 and SQuAD 2.0 leaderboards"
  baselines:
    - "Recht et al. 2019 methodology (new test set) — reference comparison for saturation detection accuracy"
    - "Community expert judgment dates (successor benchmark publication dates) — ground truth"

measurement_plan:
  data_collection:
    - source: "Papers With Code API via paperswithcode-client: benchmark_results(benchmark_id) returns model name, score, date per submission"
    - source: "arXiv API for paper publication dates (fallback for pre-2019 submissions missing leaderboard dates)"
    - source: "Community ground truth: SuperGLUE paper (arXiv:1905.00537, Sept 2019), BIG-bench paper (2021)"
  procedure:
    - step: "1. Retrieve full historical leaderboard for each target benchmark via Papers With Code API"
    - step: "2. Clean data: standardize metric (composite score), convert dates to months-since-release, remove duplicate models (keep best score per model)"
    - step: "3. Fit three models (logistic, linear, power law) to (time, score) pairs using scipy/numpy"
    - step: "4. Compute AIC for each model; determine preferred model; compute ΔAIC(logistic - linear)"
    - step: "5. Apply saturation criterion to logistic fit: find date when top-3 scores exceed K AND monthly gain rate < 5% of peak rate"
    - step: "6. Compare detected saturation date to ground truth (successor benchmark publication date)"
    - step: "7. Prospective test: truncate GLUE at T_sat - 6 months; re-fit logistic; forecast saturation date; compare to T_sat"
  success_criteria:
    - "ΔAIC(logistic vs. linear) > 4 for both GLUE and SuperGLUE (P1)"
    - "Saturation date error < 6 months for both GLUE and SuperGLUE (P2)"
    - "Prospective forecast error < 3 months for GLUE (P3)"

validation:
  internal_validity:
    - "Ground truth independence: use successor benchmark publication dates (not submission rate) to avoid circular validation"
    - "Model selection rigor: AIC comparison across three alternatives, not just logistic fit quality"
    - "Parameter identifiability check: confirm curve_fit converges with R² > 0.9 for logistic before proceeding"
  external_validity:
    - "Test on multiple benchmarks (GLUE, SuperGLUE, ImageNet, SQuAD) — if pattern holds across domains, generalizability supported"
    - "Selection bias sensitivity analysis: report direction (K overestimated) and bound effect size"
    - "Tolerance sensitivity: report results at ±3, ±6, ±12 month windows for P2"

discussion_synthesis:
  key_insights:
    - "The logistic curve is the correct model because benchmark overfitting produces a genuine S-curve — not because scores happen to be bounded (ceiling effects produce similar-looking curves but fail the cross-benchmark divergence test)"
    - "Papers With Code API already contains all required data — no new data collection needed"
    - "GLUE→SuperGLUE and SuperGLUE→BIG-bench transitions are hard, documented saturation events that serve as ground truth without circularity"
    - "Prospective detection (P3) is the highest-impact framing — turns a retrospective audit into a forward-looking tool"
  breakthrough_moments:
    - "Exchange 2 (Prof. Vera): AIC model comparison requirement — without this, logistic fitting is vacuous"
    - "Exchange 4 (Prof. Pax): confirmed implementation feasibility with 3 existing libraries; estimated < 1 week"
    - "Exchange 6 (Prof. Rex): successor benchmark publication date as independent ground truth — avoids circular validation"
  resolved_tensions:
    - "Ceiling effects vs. overfitting-driven saturation: resolved by requiring cross-benchmark divergence as secondary analysis"
    - "Saturation operationalization: resolved by dual criterion (asymptote exceedance + rate threshold)"
    - "Ground truth circularity: resolved by using successor benchmark publication dates rather than submission rate decline"
