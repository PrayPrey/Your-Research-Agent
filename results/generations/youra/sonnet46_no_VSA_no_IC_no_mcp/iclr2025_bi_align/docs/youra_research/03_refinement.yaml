    primary: true
    statement: "The calibration-alignment divergence gap (normalized RM score minus gold preference rate) increases monotonically with RLHF optimization pressure (KL budget), with a significantly positive regression slope"
    test_method: "Digitize Coste et al. 2023 Figure X (KL budget vs. RM score and gold preference); normalize RM scores; compute gap at each KL level; fit linear regression gap ~ KL_budget; test β > 0"
    success_criterion: "β > 0, p < 0.05, R² > 0.5 in Coste et al. data"
    falsification: "β ≤ 0 (non-positive slope) or p > 0.05 in Coste et al. data"
  - id: "P2"
    primary: false
    statement: "The same positive divergence curve pattern replicates in Gao et al. 2023 (Scaling Laws for Reward Model Overoptimization, arXiv 2210.10760)"
    test_method: "Same digitization and regression procedure applied to Gao et al. KL-vs-preference figures"
    success_criterion: "β > 0, p < 0.05 in Gao et al. data (independent of Coste et al. result)"
    falsification: "Non-positive slope in Gao et al. — indicates Coste result is not generalizable"
  - id: "P3"
    primary: false
    statement: "AI→Human coverage ratio R > 0.90 in published alignment benchmark literature (2018-2024)"
    test_method: "Apply dual-axis classification schema to Phase 1 paper list; compute R = (AI2H_metrics) / (total_metrics) across TruthfulQA, BBQ, HELM, HHH-RLHF, WinoBias, InstructGPT, Constitutional AI, MACHIAVELLI, Sorensen 2024"
    success_criterion: "R > 0.90 (9 out of 10 or more metrics classified as AI→Human)"
    falsification: "R < 0.80 — suggests meaningful Human→AI measurement already exists in literature"

