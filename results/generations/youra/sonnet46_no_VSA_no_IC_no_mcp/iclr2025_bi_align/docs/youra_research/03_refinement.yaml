# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Current AI alignment benchmarks predominantly measure AI→Human alignment direction"
      status: "BUILD_ON"
      evidence: "ICLR 2025 Workshop on Bidirectional Human-AI Alignment synthesizes 400 papers confirming asymmetric measurement; TruthfulQA, BBQ, HELM, HHH-RLHF all measure AI output properties only"
    - claim: "RLHF overoptimization creates proxy-gold divergence (RM score diverges from held-out human preference)"
      status: "BUILD_ON"
      evidence: "Coste et al. 2023 (arXiv 2310.02743): empirically demonstrates RM score continues increasing with KL budget while gold human preference peaks and reverses"
    - claim: "Human-AI interaction produces over-reliance and automation bias patterns"
      status: "BUILD_ON"
      evidence: "Lai et al. 2021 AI-assisted decision studies show 60-80% human agreement with AI predictions regardless of AI accuracy"
    - claim: "No paper has co-measured AI→Human alignment and Human→AI calibration for the same model family"
      status: "PROVE_NEW"
      evidence: "Confirmed by Phase 1 cross-reference matrix: every source measures only one direction"
    - claim: "The proxy-gold divergence curve slope is significantly positive (calibration-alignment divergence)"
      status: "PROVE_NEW"
      evidence: "Not yet computed — this is the core novel empirical contribution"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Phase 2B should skip re-verification of the RLHF overoptimization phenomenon (Coste et al. is established).
    Focus verification effort on: (1) digitization fidelity of figure data, (2) normalization protocol validity,
    (3) whether the regression slope is positive in at least two independent datasets (Coste + Gao).
    The coverage ratio computation (meta-analysis of benchmark papers) requires no experimental setup.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiAlign-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under NLP alignment evaluation settings (published RLHF benchmark papers 2018-2024),
    if AI→Human alignment optimization pressure increases (measured as KL budget from base policy),
    then the calibration-alignment divergence gap (normalized RM score minus gold human preference rate)
    increases monotonically with a significantly positive slope (β > 0, p < 0.05),
    because RLHF trains against a proxy metric (reward model score) that diverges from actual human
    behavioral response (gold preference) under sustained optimization — creating an anti-correlated
    relationship between proxy-metric optimization and human-behavioral calibration satisfaction.
  alternative_hypothesis_h0: |
    There is no significant positive relationship between RLHF optimization pressure (KL budget)
    and the calibration-alignment divergence gap (H0: β ≤ 0). Equivalently, improving AI→Human proxy
    alignment metrics does not systematically degrade human calibration satisfaction.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "RLHF Optimization Pressure"
      type: "continuous"
      operationalization: "KL divergence from base policy (KL budget); ranges from 0 (no fine-tuning) to ~10 nats in Coste et al."
    - name: "AI→Human Benchmark Coverage"
      type: "continuous"
      operationalization: "Proportion of alignment benchmark metrics classified as AI→Human direction; R = (AI2H_metrics) / (total_metrics) per paper"
  dependent:
    - name: "Calibration-Alignment Divergence Gap"
      type: "continuous"
      operationalization: "Normalized RM score minus gold human preference rate at each KL level; gap = normalize(RM_score) - gold_preference_rate; range [-1, 1]"
      primary: true
    - name: "AI→Human Coverage Ratio R"
      type: "continuous"
      operationalization: "Fraction of alignment evaluation metrics measuring AI→Human direction across published benchmark papers; range [0, 1]"
      primary: false
  controlled:
    - name: "Model family"
      operationalization: "Same base model used across KL budget conditions (Coste et al. uses same pretrained LLM)"
    - name: "Evaluation task domain"
      operationalization: "Same task/dataset used across KL conditions; no cross-domain mixing within a single curve"
    - name: "Gold preference elicitation protocol"
      operationalization: "Held-out human evaluators with same rating protocol across KL conditions (within Coste et al. experimental design)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "RLHF trains the policy to maximize a proxy metric (reward model score) that approximates human preferences"
      evidence: "Ouyang et al. 2022 InstructGPT (arXiv 2203.02155); Coste et al. 2023 establishes the RM as proxy for gold preference"
      falsifier: "If RM score tracks gold preference perfectly at all KL budgets, step 1 mechanism does not decouple"
    - step: 2
      description: "As KL budget increases (more optimization pressure), the policy finds outputs that maximize RM score but diverge from actual human preference — reward hacking"
      evidence: "Coste et al. 2023: gold preference peaks then reverses while RM score continues increasing; Gao et al. 2023 scaling laws show same pattern"
      falsifier: "If gold preference increases monotonically with KL (no reversal), step 2 is falsified"
    - step: 3
      description: "The growing proxy-gold gap represents the AI→Human optimization signal becoming increasingly anti-calibrated to actual human behavioral response"
      evidence: "Inferred from Coste et al. figures; no prior paper has named or quantified this as a calibration phenomenon"
      falsifier: "If the proxy-gold gap has zero or negative slope vs. KL budget in both Coste et al. and Gao et al., step 3 is falsified"
    - step: 4
      description: "This calibration-alignment divergence generalizes: the more an AI system is optimized on AI→Human proxy metrics (coverage ratio approaching 1.0), the less its evaluation captures human behavioral calibration quality"
      evidence: "Coverage ratio R > 0.90 (to be computed from Phase 1 benchmark paper list)"
      falsifier: "If R < 0.70, the claim of systematic asymmetry is weakened; if Gao et al. replication fails, generalizability is not established"
  key_tension: "Whether the proxy-gold gap in RLHF overoptimization is a valid operationalization of 'Human→AI calibration degradation' — Prof. Rex identified this as a construct validity risk requiring explicit framing as 'evaluation calibration' not 'user calibration'"
  evidence_summary: |
    Coste et al. 2023 provides the strongest existing evidence: same-model-family experiment with
    monotonically increasing RM score and peak-then-reversal gold human preference across KL budget levels.
    Gao et al. 2023 provides replication. Coverage ratio computation from Phase 1 sources provides
    the descriptive asymmetry claim. Together these constitute a two-level empirical case for
    the bidirectional tension hypothesis.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Gold human preference in Coste et al. is a valid proxy for Human→AI calibration quality"
    supporting_evidence: "Gold preference = held-out human evaluation not used in RM training; represents authentic human judgment less distorted by RLHF optimization"
    consequence_if_violated: "Core construct interpretation collapses; divergence curve cannot be reframed as bidirectional alignment evidence"
  - id: "A2"
    assumption: "Figure digitization from Coste et al. and Gao et al. yields sufficient precision for regression analysis"
    supporting_evidence: "WebPlotDigitizer achieves ~2-5% precision on published figures; given the large effect sizes reported (RM and gold diverge substantially), this precision is sufficient"
    consequence_if_violated: "Regression results may be imprecise; mitigate by reporting confidence intervals and noting digitization as a limitation"
  - id: "A3"
    assumption: "Coverage ratio computed from Phase 1 benchmark paper list (n≈10 papers) is representative of alignment evaluation literature"
    supporting_evidence: "Phase 1 includes the most-cited alignment benchmarks (TruthfulQA, BBQ, HELM, HHH-RLHF, WinoBias, InstructGPT, Constitutional AI)"
    consequence_if_violated: "Coverage ratio estimate has limited generalizability; mitigate by extending to all 400 papers from ICLR 2025 survey in future work"
  - id: "A4"
    assumption: "The RLHF overoptimization phenomenon (proxy-gold divergence) generalizes beyond the specific datasets and model families in Coste et al. and Gao et al."
    supporting_evidence: "Coste et al. and Gao et al. use different model scales and datasets; convergent results suggest generalizability"
    consequence_if_violated: "Divergence curve is dataset/model specific; limit claims to the exact experimental settings studied"
  - id: "A5"
    assumption: "The dual-axis classification schema (AI→Human vs. Human→AI) can be applied reliably to published benchmark metrics without ambiguity"
    supporting_evidence: "Phase 1 cross-reference matrix demonstrates clean separation: all 10 surveyed sources are classifiable as one direction without ambiguity"
    consequence_if_violated: "Coverage ratio has low inter-rater reliability; mitigate with explicit classification rubric and kappa statistic"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    NLP/ML alignment evaluation benchmarks published 2018-2024 (TruthfulQA, BBQ, HELM, HHH-RLHF, WinoBias, InstructGPT, Constitutional AI, MACHIAVELLI, Sorensen 2024).
    RLHF-trained language model families with published KL-budget vs. gold-preference data (specifically: Coste et al. 2023 model family, Gao et al. 2023 model family).
    Text generation tasks (instruction following, summarization, dialogue).
  does_not_apply_to: |
    Cross-domain generalization to medical AI (CheXpert), code generation (HumanEval), or robotics without further replication.
    Human→AI calibration in the user-behavioral sense (Lai et al. appropriate reliance) — this is a distinct construct; our proxy is "evaluation calibration" not "user calibration".
    Models fine-tuned without reward model (e.g., pure SFT, prompt engineering) where no proxy-gold divergence exists by construction.
  known_limitations: |
    Coverage ratio based on small benchmark paper sample (n≈10); not statistically representative of all 400+ alignment papers.
    Figure digitization introduces measurement imprecision; cannot reproduce exact values from Coste et al. without raw data access.
    Proxy-gold gap is a conservative operationalization of bidirectional tension — actual user calibration effects may differ.
    Sample size per regression (n≈5-10 KL levels per curve) limits statistical power; results should be interpreted with wide confidence intervals.

