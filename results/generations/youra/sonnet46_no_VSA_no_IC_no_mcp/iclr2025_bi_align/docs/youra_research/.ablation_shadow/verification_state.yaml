  h-m1:
    type: MECHANISM
    statement: Under RLHF optimization on the same model family (Coste et al. 2023), if KL budget increases from 0 to high
      optimization pressure (~10 nats), then the RM score increases monotonically while gold human preference rate peaks (at
      intermediate KL) and reverses, because the reward model is trained to maximize a proxy that diverges from actual human
      judgment under sustained optimization.
    status: VALIDATED
    prerequisites:
