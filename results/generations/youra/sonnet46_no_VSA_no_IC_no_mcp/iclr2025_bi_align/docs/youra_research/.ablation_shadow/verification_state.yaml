    type: EXISTENCE
    statement: Under published RLHF experimental settings (Coste et al. 2023, Gao et al. 2023), if the experimental design
      tracks both reward model (RM) score and held-out gold human preference across varying KL budget levels for the same
      model family, then both signals co-exist as separable time-series in the same dataset, because the experimental protocols
      report both proxy and gold metrics at each KL checkpoint.
