  h-m2:
    type: MECHANISM
    statement: Under Coste et al. 2023 experimental data, if RM score is normalized to [0,1] range and gold preference rate
      is expressed as a fraction, then the calibration-alignment divergence gap (normalized RM score minus gold preference
      rate) is strictly positive at high KL levels and grows with increasing optimization pressure, because proxy-gold decoupling
      (confirmed in H-M1) creates a widening measurement gap.
    status: VALIDATED
