hypothesis_draft:
  title: "Calibration-Alignment Divergence: Empirical Evidence of Bidirectional Tension in RLHF Optimization"
  hypothesis_id: "H-BiAlign-v1"
  core_claim: |
    RLHF optimization pressure creates a measurable calibration-alignment divergence curve:
    as KL budget from the base policy increases, the gap between AI→Human proxy metrics
    (normalized reward model score) and Human→AI calibration proxies (gold human preference rate)
    increases monotonically with a significantly positive slope (β > 0, p < 0.05).
    This divergence is the first empirical quantification of bidirectional alignment tension
    in published RLHF evaluation data.
  mechanism: |
    RLHF trains against a proxy metric (reward model score) that initially tracks true human
    behavioral response but diverges under sustained optimization pressure (reward hacking).
    The proxy-gold gap operationalizes the tension between the AI→Human alignment optimization
    target and the actual Human→AI calibration quality: as the proxy metric improves, human
    evaluation calibration to the model's true quality degrades. This is Goodhart's Law applied
    to bidirectional alignment: "when a measure becomes a target, it ceases to be a good measure"
    of bidirectional human-AI calibration.
  predictions:
    - P1: "Positive linear slope (β > 0, p < 0.05, R² > 0.5) in Coste et al. 2023 KL-vs-gap regression"
    - P2: "Replication of positive slope in Gao et al. 2023 (arXiv 2210.10760) figure data"
    - P3: "AI→Human coverage ratio R > 0.90 across Phase 1 alignment benchmark paper sample"

variables_summary:
  independent: "RLHF optimization pressure (KL divergence from base policy, continuous)"
  dependent_primary: "Calibration-alignment divergence gap = normalize(RM_score) - gold_preference_rate (continuous, range [-1,1])"
  controlled: "Model family (same base model across KL conditions); evaluation task domain; gold preference elicitation protocol"

null_hypothesis:
  h0_statement: |
    There is no significant positive relationship between RLHF optimization pressure (KL budget)
    and the calibration-alignment divergence gap (H0: β ≤ 0, p ≥ 0.05).
    Equivalently: improving AI→Human proxy alignment metrics does not systematically degrade
    human evaluation calibration.
  statistical_test: "Linear regression: gap ~ KL_budget; one-sided t-test on β"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    First empirical quantification of the calibration-alignment divergence curve as a
    bidirectional alignment construct. Prior work (Coste et al. 2023, Gao et al. 2023)
    identified the proxy-gold divergence as a reward hacking problem; we reframe it as
    the first empirical evidence of bidirectional alignment tension and provide the
    first quantitative characterization of its slope as a function of optimization pressure.
  differentiation_summary: |
    ICLR 2025 survey: qualitative taxonomy, no quantitative coverage ratio or divergence curve.
    Coste/Gao 2023: reward hacking framing, not bidirectional alignment framing.
    Lai et al. 2021: user calibration measurement, different construct from evaluation calibration.
    Our contribution: novel dual-axis schema + coverage ratio (descriptive) + divergence curve slope (mechanistic).

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Reward model + base LLM from Coste et al. 2023 (RLHF overoptimization study)"
    - "Reward model + base LLM from Gao et al. 2023 (scaling laws study)"
    - "No new model training required — re-analysis of published experimental results"
  datasets:
    - "Coste et al. 2023 figure data (digitized using WebPlotDigitizer from arXiv 2310.02743)"
    - "Gao et al. 2023 figure data (digitized from arXiv 2210.10760)"
    - "Phase 1 alignment benchmark paper list (TruthfulQA, BBQ, HELM, HHH-RLHF, WinoBias, InstructGPT, CAI, MACHIAVELLI, Sorensen 2024)"
  baselines:
    - "No RLHF baseline (KL=0) from Coste et al."
    - "Perfect calibration baseline (gap=0 theoretical)"
    - "ICLR 2025 survey qualitative asymmetry claim"

measurement_plan:
  data_collection:
    - source: "Coste et al. 2023 (arXiv 2310.02743) — digitize Figure showing KL budget vs. RM score AND gold preference; extract (KL, RM_score, gold_pref) tuples using WebPlotDigitizer"
    - source: "Gao et al. 2023 (arXiv 2210.10760) — same digitization procedure for replication"
    - source: "Phase 1 benchmark papers — classify each evaluation metric as AI→Human or Human→AI using dual-axis schema"
  procedure:
    - step: "Digitize Coste et al. figures: extract n≈8-10 (KL, RM_score, gold_preference) data points per curve"
    - step: "Normalize RM scores to [0,1] range within each curve using min-max normalization"
    - step: "Compute divergence gap = RM_norm - gold_preference at each KL level"
    - step: "Fit linear regression: gap ~ KL_budget using scipy.stats.linregress"
    - step: "Report: β, SE, p-value (one-sided), R², 95% CI on β"
    - step: "Repeat exact procedure on Gao et al. data for replication"
    - step: "Apply dual-axis classification schema to Phase 1 benchmark papers; compute R = (AI2H) / (total)"
  success_criteria:
    - "P1: β > 0, p < 0.05, R² > 0.5 in Coste et al. regression"
    - "P2: β > 0, p < 0.05 in Gao et al. replication regression"
    - "P3: R > 0.90 in coverage ratio computation"

validation:
  internal_validity:
    - "Within-experiment design (same model family, varying KL) eliminates temporal and cross-system confounders"
    - "Normalization protocol ensures gap metric is commensurable across different RM score scales"
    - "Dual-curve pooling (Coste + Gao) increases effective sample size for regression"
  external_validity:
    - "Replication across two independent papers (Coste, Gao) with different model scales supports generalizability within RLHF text generation"
    - "Coverage ratio based on Phase 1 sample is limited; full generalizability requires extension to ICLR 2025 400-paper corpus"
    - "User calibration generalizability (Lai et al. domain) is deferred to future work"

discussion_synthesis:
  key_insights:
    - "Coste et al.'s proxy-gold divergence is the mechanistic seed of the bidirectional tension hypothesis — the key insight from Dr. Nova's opening exchange"
    - "Prof. Vera's within-experiment design requirement was the pivotal methodological constraint that shaped the final hypothesis around Coste et al. rather than cross-study correlation"
    - "Prof. Rex's distinction between 'evaluation calibration' (proxy-gold gap) and 'user calibration' (Lai et al.) is a critical construct validity point that must be maintained throughout Phase 2B"
  breakthrough_moments:
    - "Exchange 7 (Dr. Nova): Proposing the 'calibration-alignment divergence curve' as a novel empirical construct — resolved Prof. Rex's critique that coverage ratio alone is confirmatory"
    - "Exchange 8 (Prof. Vera): Formalizing the regression protocol and identifying Gao et al. as the replication dataset — gave the hypothesis statistical rigor"
    - "Exchange 6 (Prof. Rex): Distinguishing proxy-gold gap from user calibration — prevented a construct validity error that would have been caught in peer review"
  resolved_tensions:
    - "Temporal confounding (Prof. Vera) → Resolved by within-experiment KL-budget variation instead of cross-system time-series"
    - "Coverage ratio as confirmatory (Prof. Rex) → Resolved by reframing as 'first quantification with dual-axis schema' plus the divergence curve as the primary novel contribution"
    - "Data accessibility risk (Prof. Pax) → Resolved by scoping Lai et al. correlation as conditional/future work; main claims rely only on published figure digitization"
