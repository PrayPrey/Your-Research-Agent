# ═══════════════════════════════════════════════════════════════
# PRIMARY METRIC VALUES (from 04_validation.md files)
# ═══════════════════════════════════════════════════════════════

metrics:
  # H-M3: OLS Regression — Coste et al. 2023 (PRIMARY QUANTIFICATION)
  coste_regression:
    slope_beta: 0.1433  # nat^-1
    intercept_alpha: -0.4016
    r_squared: 0.9577
    pearson_r: 0.9786
    p_value: 8.89e-07
    t_statistic: 13.461
    f_statistic: 181.2
    n_observations: 10
    kl_range: [0.0, 8.0]  # nats
    parametric_ci_lower: 0.1188
    parametric_ci_upper: 0.1679
    bootstrap_ci_lower: 0.1170
    bootstrap_ci_upper: 0.1768
    bootstrap_iterations: 10000
    bootstrap_seed: 42
    confidence_level: HIGH  # both CIs strictly positive
    gate_type: MUST_WORK
    gate_result: PASS

  # H-M4: OLS Regression — Gao et al. 2023 (REPLICATION)
  gao_regression:
    slope_beta: 0.1599  # nat^-1
    intercept_alpha: -0.4960
    r_squared: 0.7008
    p_value: 2.515e-03
    n_observations: 10
    kl_range: [0.0, 7.5]  # nats
    parametric_ci_lower: 0.075
    parametric_ci_upper: 0.245
    bootstrap_ci_lower: -0.020
    bootstrap_ci_upper: 0.236
    bootstrap_iterations: 10000
    bootstrap_seed: 42
    confidence_level: MEDIUM  # parametric CI positive; bootstrap marginally overlaps zero
    gate_type: SHOULD_WORK
    gate_result: PASS

  # Cross-dataset comparison
  cross_dataset:
    beta_ratio_gao_over_coste: 1.116  # = 0.1599 / 0.1433
    slopes_within_percent: 12  # |ratio - 1| = 0.116 = 11.6%
    interpretation: "Near-identical slopes despite different model families and scales"

  # H-M1: Trajectory analysis
  trajectory:
    spearman_rho_kl_rm: 1.000  # perfect monotone rank correlation
    spearman_p_value: "<0.0001"
    gold_peak_value: 0.63
    gold_peak_kl: 2.0  # nats
    gold_final_value: 0.38
    gold_decline_pct: 40  # (0.63-0.38)/0.63 * 100 ≈ 40%
    divergence_final: 1.70  # raw units
    reversal_confirmed: true
    gate_type: MUST_WORK
    gate_result: PASS

  # H-M2: Gap positivity
  gap_positivity:
    n_positive_high_kl: 5
    total_high_kl: 5  # all 5 high-KL levels (KL > 3.5 nats)
    max_gap: 0.620  # at KL = 8.0 nats
    spearman_rho_gap_kl: 1.000  # within high-KL subset
    gap_range_full: [-0.52, 0.62]  # full series from H-M3 data
    gap_at_kl4: 0.277
    gap_at_kl5: 0.388
    gap_at_kl6: 0.484
    gap_at_kl7: 0.560
    gap_at_kl8: 0.620
    gate_type: MUST_WORK
    gate_result: PASS

  # H-E1: Signal co-existence
  signal_coexistence:
    coste_rm_variance: 1.96
    coste_gold_variance: 0.25
    coste_n_kl_levels: 10
    gao_rm_variance: 2.42
    gao_gold_variance: 0.31
    gao_n_kl_levels: 11
    both_signals_nonconstant: true
    both_signals_separable: true
    gate_type: MUST_WORK
    gate_result: PASS

# ═══════════════════════════════════════════════════════════════
# NORMALIZATION METHODOLOGY
# ═══════════════════════════════════════════════════════════════

methodology:
  normalization_method: min_max
  gap_formula: "rm_norm - gold_preference"
  gap_range: [-1.0, 1.0]  # theoretical
  normalization_rationale: >
    Min-max chosen over z-score: (1) preserves [0,1] interpretable range;
    (2) gold preference already in [0,1] as a rate;
    (3) preserves monotonicity for reward hacking detection

  regression_method: OLS
  implementations:
    - scipy.stats.linregress  # primary (parametric CI via t-distribution)
    - statsmodels.api.OLS     # secondary (F-statistic, residual diagnostics)

  data_source: "Figure digitization from published RLHF papers"
  digitization_uncertainty_pct: 2-5  # per data point

  key_hyperparameters:
    bootstrap_n: 10000
    bootstrap_seed: 42
    ci_level: 0.95
    significance_threshold: 0.05

# ═══════════════════════════════════════════════════════════════
# DATA SPECIFICATIONS
# ═══════════════════════════════════════════════════════════════

data:
  coste2023:
    rm_score_range: [0.12, 2.08]
    gold_preference_range: [0.38, 0.63]
    kl_range: [0.0, 8.0]
    n_kl_levels: 10
    peak_kl: 2.0  # gold preference peak
    zero_crossing_kl: null  # gap monotone (negative early, crosses zero implied near 0)

  gao2023:
    kl_range: [0.0, 7.5]
    n_kl_levels: 10
    zero_crossing_kl: ~3.5  # gap crosses zero here
    rm_model_size: "6B parameters (reward model)"
    note: "Gap non-monotone at low KL; linear model R²=0.70 reflects transition shape"

