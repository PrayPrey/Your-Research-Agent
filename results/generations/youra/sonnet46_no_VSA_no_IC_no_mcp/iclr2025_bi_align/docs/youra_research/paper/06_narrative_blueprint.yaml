# NARRATIVE COHERENCE CHECKLIST
# ═══════════════════════════════════════════════════════════════

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES — hook states β quantification; conclusion returns to same claim"

  - check: "Does each section naturally flow to the next?"
    status: "YES — Hook→Problem→Insight→Methods→Tests→Evidence→Interpretation→Close"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES — normalized gap + consistent β is the thread through all sections"

  - check: "Are all major claims supported by evidence?"
    status: "YES — P1 (H-M3, HIGH), P2 (H-M4, MEDIUM), mechanism (H-E1,H-M1,H-M2)"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES — if abstract leads with β=0.143, R²=0.958, p<10⁻⁶, and replication"

  - check: "Are limitations honestly disclosed (not buried)?"
    status: "YES — digitization, construct scope, P3, bootstrap CI all addressed"
