limitation_note: |
  h-m2: SHOULD_WORK gate PARTIAL — direction opposite to hypothesis on all benchmarks.
  Pythia-1B PoC shows dedup-Pile models have HIGHER min-k% scores than Pile models
  (differential = negative on all 4 benchmarks, p_corrected=1.0).
  Root cause: deduplication may reduce memorization of common n-grams (including
  benchmark-adjacent content), making Pile models produce LOWER logprob scores
  (more uncertain) rather than higher, contrary to the near-memorization hypothesis.
  No self-recovery possible — fundamental direction reversal, not a parameter issue.
  Pipeline continues to Phase 5 with this limitation noted.
