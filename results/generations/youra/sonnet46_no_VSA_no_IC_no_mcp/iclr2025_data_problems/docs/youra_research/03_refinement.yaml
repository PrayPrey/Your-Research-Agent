# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Deduplication of training data improves downstream benchmark performance on average"
      status: "BUILD_ON"
      evidence: "Lee et al. 2022 (arXiv 2107.06499) — showed dedup reduces memorization and improves GPT-2-scale models on multiple benchmarks"
    - claim: "Pythia and OLMo/Dolma model families release open checkpoints with documented curation choices"
      status: "BUILD_ON"
      evidence: "Biderman et al. 2023 (Pythia), Groeneveld et al. 2024 (OLMo), Soldaini et al. 2024 (Dolma)"
    - claim: "lm-evaluation-harness supports unified evaluation of Pythia and OLMo on MMLU, HellaSwag, ARC, WinoGrande"
      status: "BUILD_ON"
      evidence: "EleutherAI/lm-evaluation-harness — official evaluation tool for both model families"
    - claim: "Deduplication produces a per-benchmark contamination-correction signature (not uniform shift)"
      status: "PROVE_NEW"
      evidence: "Novel claim — prior work (Lee et al. 2022) reports aggregate effects; directional per-benchmark prediction tied to contamination estimates is new"
    - claim: "The direction of per-benchmark performance change correlates with n-gram contamination overlap between training corpus and benchmark test set"
      status: "PROVE_NEW"
      evidence: "Novel mechanistic prediction — not demonstrated in prior literature"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Phase 2B should treat the established BUILD_ON claims as background context requiring
    no new verification. Experimental effort should focus on the two PROVE_NEW claims:
    (1) per-benchmark differential effects from deduplication, and (2) correlation with
    contamination estimates. The BUILD_ON claims provide the experimental infrastructure
    (existing checkpoints, evaluation harness) but are not themselves experimental outcomes.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ContaminationCorrectionSignature-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the setting of existing open pretrained language model families (Pythia suite)
    trained on corpora with and without deduplication (Pile vs dedup-Pile),
    if training data deduplication removes repeated near-duplicate documents that overlap
    with standard benchmark test patterns,
    then the resulting benchmark performance profile will show a characteristic
    contamination-correction signature: benchmarks with higher Pile n-gram contamination
    will score lower in dedup-Pile models (memorization inflation removed), while benchmarks
    with lower contamination will show relatively stable or improved performance,
    because deduplication selectively removes the near-memorization advantage conferred by
    repeated training examples that partially overlap with benchmark test content.
  alternative_hypothesis_h0: |
    At token-count-matched checkpoints, Pythia dedup-Pile and Pile models show no
    statistically significant difference in few-shot performance on any of
    {MMLU, HellaSwag, ARC, WinoGrande}, using Bonferroni-corrected α = 0.0125 (0.05/4),
    and per-benchmark performance changes show no significant correlation with estimated
    n-gram overlap between Pile and each benchmark's test set.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training corpus deduplication"
      type: "categorical"
      operationalization: "Pile (no dedup) vs dedup-Pile (substring dedup, ~15% fewer tokens)"
      levels: ["Pile", "dedup-Pile"]
    - name: "Benchmark contamination level"
      type: "continuous"
      operationalization: "Estimated n-gram overlap (13-gram) between Pile training corpus and benchmark test set, and min-k% probability score per benchmark"
  dependent:
    - name: "Per-benchmark few-shot accuracy"
      type: "continuous"
      operationalization: "lm-evaluation-harness few-shot (0/5-shot) accuracy on MMLU, HellaSwag, ARC-Challenge, WinoGrande; range [0,1]"
      primary: true
    - name: "Benchmark performance profile vector"
      type: "continuous"
      operationalization: "4-dimensional vector of (dedup-Pile accuracy - Pile accuracy) per benchmark at token-count-matched checkpoint"
      primary: false
    - name: "Contamination-performance correlation"
      type: "continuous"
      operationalization: "Pearson/Spearman correlation between per-benchmark contamination estimate and per-benchmark accuracy differential"
      primary: false
  controlled:
    - name: "Model architecture"
      operationalization: "Same GPT-NeoX architecture across Pile and dedup-Pile Pythia variants"
    - name: "Model parameter count"
      operationalization: "Compared at identical parameter counts (e.g., 160M, 410M, 1B, 6.9B)"
    - name: "Training token count"
      operationalization: "Token-count matched using Pythia's 154 intermediate checkpoints; dedup-Pile final = ~207B tokens, matched to Pile checkpoint at ~207B tokens"
    - name: "Evaluation protocol"
      operationalization: "Identical lm-evaluation-harness version, identical few-shot prompt format, identical benchmark splits"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Pile contains repeated near-duplicate documents. Exact substring deduplication removes approximately 15% of Pile tokens, creating dedup-Pile."
      evidence: "Biderman et al. 2023 documented dedup-Pile construction via exact substring deduplication; corpus size reduction ~15%"
      falsifier: "If dedup-Pile and Pile have statistically identical document-level n-gram distributions (measured on random sample), Step 1 fails"
    - step: 2
      description: "Some removed repeated documents contain content that n-gram-overlaps with standard benchmark test patterns (MMLU, HellaSwag, ARC, WinoGrande test items)."
      evidence: "Shi et al. 2023 min-k% method detects pretraining data presence in LLMs; n-gram contamination detection established by multiple studies (GPT-4 TR, PaLM TR)"
      falsifier: "If estimated contamination overlap between dedup-removed documents and benchmark test sets is not statistically different from zero, Step 2 fails"
    - step: 3
      description: "Pile-trained models develop near-memorization of repeated training patterns that partially overlap with benchmark test content. This inflates benchmark performance on high-contamination benchmarks beyond what the model's generalizable knowledge would predict."
      evidence: "Lee et al. 2022 shows dedup reduces memorization; Shi et al. 2023 shows higher min-k% prob for pretraining data; memorization → benchmark inflation is established theoretical mechanism"
      falsifier: "If Pile and dedup-Pile models show identical accuracy profiles on synthetic benchmarks with zero contamination, Step 3 fails"
    - step: 4
      description: "Deduplication removes the repeated documents and thus the memorization advantage. The resulting per-benchmark accuracy change is proportional to the contamination level: high-contamination benchmarks see score decreases in dedup-Pile, low-contamination benchmarks see stable or increased scores (better generalization from cleaner corpus)."
      evidence: "Novel prediction — no prior work measures this correlation. Mechanistic derivation from Steps 1-3."
      falsifier: "If per-benchmark accuracy differential (dedup-Pile minus Pile) shows no significant Pearson correlation with estimated contamination overlap (r² < 0.5, p > 0.05 across 4 benchmarks), Step 4 fails and the mechanism is incorrect"
  key_tension: "The effective data volume reduction (~15% fewer tokens) in dedup-Pile is a plausible alternative explanation for any observed performance differences. Token-count matching via intermediate checkpoints controls for this but doesn't fully eliminate it if the checkpoint resolution is insufficient."
  evidence_summary: |
    The mechanism builds on three established findings (dedup reduces memorization, contamination
    is detectable in LLMs, repeated patterns inflate benchmark scores) and makes one novel
    prediction (the per-benchmark differential correlates with contamination magnitude).
    Steps 1-3 are well-supported; Step 4 is the novel empirical contribution.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pythia intermediate checkpoints have sufficient granularity for token-count matching between Pile and dedup-Pile training runs"
    supporting_evidence: "Biderman et al. 2023 releases 154 checkpoints per model, spaced at logarithmic intervals; dedup-Pile models train to ~207B tokens"
    consequence_if_violated: "Residual data-volume confound; reported as limitation with matched-step robustness check"
  - id: "A2"
    assumption: "N-gram contamination estimates (13-gram overlap and min-k% prob) reliably reflect the extent to which repeated Pile documents overlap with benchmark test content"
    supporting_evidence: "Shi et al. 2023 validated min-k% on multiple benchmarks; 13-gram overlap is standard (GPT-4 TR methodology)"
    consequence_if_violated: "Correlation test loses statistical power; use two independent estimators as robustness check"
  - id: "A3"
    assumption: "The deduplication-removed documents in Pile are representative of high-repetition content rather than uniquely informative documents"
    supporting_evidence: "Exact substring deduplication targets documents appearing multiple times — by definition high-repetition; unique informative documents not removed"
    consequence_if_violated: "If unique high-value documents are removed by dedup, performance drops could reflect data quality loss rather than contamination correction"
  - id: "A4"
    assumption: "Few-shot lm-evaluation-harness results are stable enough (low variance across runs) to detect the contamination signature signal above noise"
    supporting_evidence: "lm-evaluation-harness is deterministic for greedy decoding; variance comes from benchmark subset sampling — can be mitigated by using full benchmark test sets"
    consequence_if_violated: "Underpowered study; increase evaluation coverage or use all benchmark items"
  - id: "A5"
    assumption: "The Pythia Pile vs dedup-Pile comparison isolates deduplication as the sole curation variable (architecture, optimizer, context length are held constant)"
    supporting_evidence: "Biderman et al. 2023 explicitly designed Pile and dedup-Pile Pythia variants for controlled comparison"
    consequence_if_violated: "Identification fails; no within-family controlled comparison exists — study cannot proceed"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Decoder-only language models trained on English web text corpora
    - Models where training corpus and deduplication method are documented
    - Standard NLP benchmarks with publicly available test sets (for contamination estimation)
    - Specifically: Pythia model family (70M–12B), Pile vs dedup-Pile training corpora
    - Cross-family exploratory extension: Pythia vs OLMo on matched size classes
  does_not_apply_to: |
    - Encoder-only or encoder-decoder models (different benchmark evaluation protocols)
    - Models with undocumented or proprietary training data
    - Benchmarks without publicly available test sets (contamination estimation impossible)
    - Instruction-tuned or RLHF-finetuned models (curation signature may be overwritten)
    - Non-English benchmarks (Pile and Dolma are primarily English)
  known_limitations: |
    - Architecture confound in cross-family comparison (Pythia GPT-NeoX vs OLMo architecture)
    - Compute budget differences between Pythia and OLMo are not perfectly matched
    - Contamination estimates are proxies (n-gram overlap), not ground truth
    - Token-count matching is approximate given checkpoint granularity
    - Only 4 benchmarks studied — may not generalize to other benchmark categories
    - Cross-family comparison is exploratory/observational, not causal

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Pythia dedup-Pile models vs Pile models at token-count-matched checkpoints will show statistically significant performance differences on at least one benchmark in {MMLU, HellaSwag, ARC-Challenge, WinoGrande}, with Bonferroni-corrected significance threshold α = 0.0125"
    test_method: "Run lm-evaluation-harness on Pythia Pile and dedup-Pile checkpoints at token-count-matched points for model sizes 160M, 410M, 1B, 6.9B; compute pairwise benchmark accuracy differences and t-tests with Bonferroni correction"
    success_criterion: "At least one benchmark shows p < 0.0125 in pairwise comparison across ≥2 model sizes"
    falsification: "All 4 benchmarks show p > 0.0125 in all pairwise comparisons across all model sizes → null hypothesis supported, contamination-correction mechanism unsupported"
  - id: "P2"
    primary: false
    statement: "The direction and magnitude of per-benchmark performance change (dedup-Pile minus Pile accuracy) will positively correlate with estimated n-gram contamination overlap between Pile and each benchmark's test set (r ≥ 0.5)"
    test_method: "Estimate 13-gram overlap between Pile and MMLU/HellaSwag/ARC/WinoGrande test sets using suffix-array-based n-gram search; compute Pearson and Spearman correlation with the 4-dimensional accuracy differential vector across model sizes"
    success_criterion: "Pearson r ≥ 0.5 and Spearman ρ ≥ 0.5 between contamination estimate and accuracy differential, p < 0.05"
    falsification: "r < 0.3 across all contamination estimators → contamination is not the mechanism driving the signature; alternative explanation needed"
  - id: "P3"
    primary: false
    statement: "Dolma (OLMo training corpus) will show systematically lower estimated contamination overlap with the 4 benchmark test sets compared to Pile, consistent with Dolma's more aggressive quality filtering"
    test_method: "Apply identical n-gram overlap estimation to Dolma and Pile against all 4 benchmark test sets; compare contamination profiles using Mann-Whitney test"
    success_criterion: "Dolma shows significantly lower mean contamination across benchmarks (p < 0.05), consistent with the cross-family OLMo performance profile being less contamination-inflated than Pile-trained Pythia"
    falsification: "Dolma and Pile show similar contamination profiles → cross-family comparison cannot be interpreted through contamination-correction lens; architecture confound dominates"

