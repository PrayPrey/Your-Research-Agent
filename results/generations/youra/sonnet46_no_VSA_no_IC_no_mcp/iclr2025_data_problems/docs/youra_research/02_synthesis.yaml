hypothesis_draft:
  title: "Contamination-Correction Signature of Deduplication in Pretraining Benchmark Profiles"
  hypothesis_id: "H-ContaminationCorrectionSignature-v1"
  core_claim: |
    Deduplication of pretraining corpora produces a contamination-correction signature
    in downstream benchmark performance profiles: benchmarks with higher n-gram overlap
    between the training corpus (Pile) and their test sets will show decreased performance
    in dedup-Pile models (memorization inflation removed), while benchmarks with lower
    contamination will show stable or improved performance. This profile reordering —
    not a uniform shift — is the characteristic curation fingerprint of deduplication,
    measurable without retraining using Pythia's existing checkpoints.
  mechanism: |
    (1) Pile contains repeated near-duplicate documents that partially overlap with
    standard benchmark test patterns.
    (2) Exact substring deduplication removes ~15% of Pile tokens, disproportionately
    removing high-repetition documents including those with benchmark test overlap.
    (3) Pile-trained models develop near-memorization of repeated training patterns that
    overlap with benchmark test content, inflating scores on high-contamination benchmarks.
    (4) Dedup-Pile models lose this near-memorization advantage, producing lower scores
    on high-contamination benchmarks but higher or equivalent scores on low-contamination
    benchmarks where the dedup corpus trains better generalization.
  predictions:
    - P1: "Pythia dedup-Pile vs Pile at token-count-matched checkpoints shows significant pairwise difference on ≥1 benchmark (Bonferroni α=0.0125)"
    - P2: "Per-benchmark accuracy differential correlates with n-gram contamination overlap estimate (r ≥ 0.5)"
    - P3: "Dolma shows lower contamination overlap than Pile for the 4 target benchmarks (exploratory)"

variables_summary:
  independent: "Training corpus deduplication (categorical: Pile vs dedup-Pile) + per-benchmark contamination level (continuous: n-gram overlap)"
  dependent_primary: "Per-benchmark few-shot accuracy (lm-evaluation-harness, MMLU/HellaSwag/ARC/WinoGrande)"
  controlled: "Model architecture (GPT-NeoX), parameter count (160M/410M/1B/6.9B), token count (matched via intermediate checkpoints), evaluation protocol (identical harness version)"

null_hypothesis:
  h0_statement: |
    At token-count-matched checkpoints, Pythia dedup-Pile and Pile models show no
    statistically significant difference in few-shot performance on any of
    {MMLU, HellaSwag, ARC-Challenge, WinoGrande}, using Bonferroni-corrected α=0.0125,
    and per-benchmark performance changes show no significant positive correlation
    with estimated n-gram contamination overlap.
  statistical_test: "Paired t-test per benchmark across model sizes (160M, 410M, 1B, 6.9B) with Bonferroni correction; Pearson and Spearman correlation for P2"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Contamination-correction signature as a mechanistic framework for understanding deduplication effects — predicts per-benchmark directional changes from first principles using contamination estimates rather than reporting aggregate improvements post-hoc"
  differentiation_summary: |
    Prior deduplication work (Lee et al. 2022, Biderman et al. 2023) reports aggregate
    or tabulated benchmark effects without mechanistic prediction. Prior contamination work
    (Shi et al. 2023, GPT-4 TR) detects presence of test data in training but does not
    connect contamination magnitude to curation-driven performance differentials.
    This hypothesis bridges the two: using contamination estimates to predict the direction
    and magnitude of deduplication's benchmark effects, making the mechanism testable and falsifiable.

