measurement_plan:
  data_collection:
    - source: "HuggingFace: EleutherAI/pythia-* (Pile and deduped variants) — intermediate checkpoints via step= parameter"
    - source: "lm-evaluation-harness benchmark evaluation on MMLU, HellaSwag, ARC-Challenge, WinoGrande"
    - source: "Pile corpus subset for n-gram overlap estimation (available via EleutherAI)"
    - source: "Dolma corpus subset for cross-family contamination comparison (available via AllenAI)"
  procedure:
    - step: "1. Identify token-count matching points: load Pythia dedup-Pile final checkpoint metadata to get total token count; find Pile intermediate checkpoint with closest token count from the 154 available"
    - step: "2. Run lm-evaluation-harness few-shot evaluation on all 8 model variants (4 sizes × 2 corpus variants) at both step-matched and token-matched checkpoints"
    - step: "3. Estimate 13-gram contamination overlap between Pile training corpus and each of the 4 benchmark test sets using n-gram overlap tools"
    - step: "4. Compute per-benchmark accuracy differentials (dedup-Pile minus Pile) at token-matched checkpoints"
    - step: "5. Compute Pearson and Spearman correlation between contamination estimates and accuracy differentials across 4 benchmarks"
    - step: "6. Apply Bonferroni-corrected significance testing for P1; correlation test for P2"
    - step: "7. (Exploratory) Repeat contamination estimation for Dolma; compare profile with Pile (P3)"
  success_criteria:
    - "P1: ≥1 benchmark shows Bonferroni-corrected significant difference between dedup-Pile and Pile (α=0.0125) at ≥2 model sizes"
    - "P2: Contamination-differential correlation r ≥ 0.5, p < 0.05 (Pearson and Spearman consistent)"
    - "P3 (exploratory): Dolma shows lower mean contamination overlap than Pile across 4 benchmarks"

validation:
  internal_validity:
    - "Token-count matching controls for data volume confound (report both step-matched and token-matched as robustness check)"
    - "Within-family design (same architecture) controls for architecture confound"
    - "Pre-specified directional predictions (P2 direction pre-specified before seeing results)"
    - "Bonferroni correction controls for multiple comparison inflation"
    - "Dual contamination estimators (n-gram overlap + min-k% prob) for robustness"
  external_validity:
    - "Multiple model sizes (160M–6.9B) test whether effect holds across scales"
    - "Cross-family exploratory comparison (OLMo) tests consistency of contamination-profile framework beyond Pythia"
    - "4 benchmarks cover diverse capability dimensions (knowledge, commonsense, science, pronoun)"
    - "Limitation: results may not generalize to non-English benchmarks or instruction-tuned models"

discussion_synthesis:
  key_insights:
    - "Within-family comparison (Pile vs dedup-Pile, same architecture) is the only clean causal design — cross-family is observational"
    - "Deduplication produces profile reordering, not uniform improvement — some benchmarks may score LOWER in dedup models (the contamination-correction signature)"
    - "Token-count matching is essential: dedup-Pile has ~15% fewer tokens, confounding step-matched comparisons"
    - "The contamination-correction frame unifies deduplication and contamination detection into a single mechanistic prediction"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Identified mechanism direction confusion and data volume confound — forced critical refinement"
    - "Exchange 7 (Dr. Ally): Corrected direction to profile reordering + proposed token-count matching as confound solution"
    - "Exchange 8 (Prof. Vera): Formalized all convergence criteria and confirmed hypothesis is ready"
  resolved_tensions:
    - "Architecture confound: resolved by anchoring primary hypothesis on within-family (Pythia only)"
    - "Data volume confound: resolved by token-count matching via intermediate checkpoints"
    - "Mechanism direction: resolved — dedup causes profile reordering (not uniform improvement), with high-contamination benchmarks scoring lower"
    - "Null hypothesis precision: resolved with Bonferroni-corrected α=0.0125 across 4 benchmarks"
