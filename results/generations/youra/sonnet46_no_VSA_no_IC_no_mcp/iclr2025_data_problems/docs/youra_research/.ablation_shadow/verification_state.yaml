  h-m4:
    type: MECHANISM
    statement: Under the setting of comparing step-matched vs token-count-matched Pythia checkpoint pairs, if the ~15% token
      reduction in dedup-Pile is a confound for the contamination-correction signature, then step-matched comparisons will
      show larger accuracy differentials than token-count-matched comparisons, and the contamination-performance correlation
      will be weaker under step-matching, because the volume effect adds a uniform downward shift that competes with the contamination-correction
      signal.
    status: VALIDATED
    prerequisites:
    - h-m3
    gate:
      type: SHOULD_WORK
      satisfied: true
