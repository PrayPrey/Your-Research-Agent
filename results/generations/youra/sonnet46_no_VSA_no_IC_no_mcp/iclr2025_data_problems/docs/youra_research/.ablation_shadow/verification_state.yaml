  h-m2:
    type: MECHANISM
    statement: Under the setting of Pythia Pile and dedup-Pile models at token-count-matched checkpoints, if Pile training
      corpus contains repeated documents with benchmark n-gram overlap, then Pile-trained models will show detectably higher
      min-k% probability scores on benchmark test items compared to dedup-Pile models, because repeated exposure to near-duplicate
      content encoding benchmark test patterns drives near-memorization of those patterns.
