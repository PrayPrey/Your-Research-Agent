  h-m3:
    type: MECHANISM
    statement: Under the setting of Pythia dedup-Pile vs Pile benchmark accuracy differentials at token-count-matched checkpoints,
      if benchmarks vary in their estimated n-gram contamination overlap with the Pile corpus, then the per-benchmark accuracy
      differential (dedup-Pile minus Pile) will show positive correlation with contamination overlap estimate (Pearson r ≥
      0.5), because higher contamination means greater near-memorization advantage for Pile models and thus greater accuracy
      drop in dedup-Pile when that advantage is removed.
    status: VALIDATED
    prerequisites:
