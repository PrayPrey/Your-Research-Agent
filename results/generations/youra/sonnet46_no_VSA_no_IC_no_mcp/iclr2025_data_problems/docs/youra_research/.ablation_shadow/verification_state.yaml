sub_hypotheses:
  h-e1:
    type: EXISTENCE
    statement: Under the setting of Pythia Pile and dedup-Pile model variants at token-count-matched checkpoints, if training
      corpus deduplication removes repeated near-duplicate documents, then Pythia dedup-Pile models will show statistically
      significant per-benchmark performance differences compared to Pile models on at least one of {MMLU, HellaSwag, ARC-Challenge,
      WinoGrande} (Bonferroni-corrected α = 0.0125), because the presence or absence of repeated training documents with benchmark
      overlap produces a detectable signature in benchmark accuracy profiles.
    status: VALIDATED
    prerequisites: []
    gate:
      type: MUST_WORK
      satisfied: true
      result: PASS
    experiment_design:
      status: COMPLETED
      file: docs/youra_research/h-e1/02c_experiment_brief.md
    implementation_planning:
      status: COMPLETED
      tasks_file: docs/youra_research/h-e1/03_tasks.yaml
      task_breakdown:
        tier: LIGHT
        total_budget: 15
        total_tasks: 15
        setup_tasks: 1
        epic_tasks: 6
        subtasks: 8
        excluded: 1
      completed_at: '2026-08-25T12:35:00+00:00'
    validation:
      status: COMPLETED
      result: PASS
    version: 1
    completed: true
    completed_at: '2026-08-25T15:10:03+00:00'
  h-m1:
    type: MECHANISM
    statement: Under the setting of the Pile training corpus and its deduplicated variant, if exact substring deduplication
      is applied, then the removed documents will show measurably higher n-gram overlap with standard benchmark test sets
      than the retained documents, because exact substring deduplication by design targets repeatedly occurring content, and
      repeatedly occurring benchmark-adjacent content is a subset of such repetitions.
    status: VALIDATED
    prerequisites:
    - h-e1
    gate:
      type: MUST_WORK
      satisfied: true
      result: PASS
    experiment_design:
      status: COMPLETED
