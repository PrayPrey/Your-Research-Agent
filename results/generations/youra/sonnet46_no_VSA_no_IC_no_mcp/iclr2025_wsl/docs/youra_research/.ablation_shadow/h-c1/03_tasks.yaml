- complexity: 9
  description: 'Implement exact_majority_sign(weights) using torch.sign(weights.float()).sum(dim=1)
    → torch.sign().

    Implement canonicalize_sign_flip_m2(W1, W2) → (W1_canon, W2_canon, is_degenerate).

    Tie-breaking: majority[ties] = 1 (default +1).

    Diagonal matrix: D = torch.diag(majority.float()).

    Transforms: W1_canon = D @ W1, W2_canon = W2 @ D.

    Reuse H-M3 implementation where available; implement from spec otherwise.

    '
  epic: E2 — Sign-Flip Canonicalization Module
  feature_tag: model
  id: task-003
  priority: 98
  reference_files:
