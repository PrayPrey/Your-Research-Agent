  test_requirements: '## Test Requirements (MANDATORY)

    - Create tests/test_canonicalize.py

    - Test: canonicalize produces +1/-1 majority signs (no zeros in output after tie-breaking)

    - Test: idempotency — canon(canon(W)) == canon(W) on synthetic W

    - Test: sign-flip preserves function — W2_canon @ D == W2 (up to floating point)

    '
  title: Implement canonicalize.py — exact majority sign and M=2 canonicalization
