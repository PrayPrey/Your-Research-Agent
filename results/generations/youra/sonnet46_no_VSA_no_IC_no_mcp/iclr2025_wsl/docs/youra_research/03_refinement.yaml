# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Raw weights contain within-orbit variance from scaling/sign-flip symmetries — multiple weight configurations encode the same function but are geometrically distinct in weight space."
      evidence: "Navon et al. 2023 (DWSNets): formally characterizes scaling and sign-flip symmetry groups for MLP weight spaces. These orbits are non-trivial in size."
      falsifier: "If empirical orbit diameter (measured by within-orbit weight vector distance) is near zero for Schürholt zoo models, the premise fails."
    - step: 2
      description: "NFT's permutation-equivariant encoder must allocate representational capacity to learn implicit invariance to this within-orbit variance during training on the property prediction task."
      evidence: "Mechanistic inference: NFT has no explicit orbit-collapsing mechanism for scaling/sign-flip orbits, so capacity must be used implicitly."
      falsifier: "If NFT representations are already near-identical for weight vectors in the same orbit (measured by cosine similarity of NFT embeddings for oracle-constructed orbit pairs), this step fails."
    - step: 3
      description: "Explicit canonicalization collapses each orbit to a canonical representative, eliminating within-orbit variance before encoding. This concentrates property-relevant information in the remaining variance and frees NFT capacity for property-predictive features."
      evidence: "PCA concentration experiment (Condition G): if first k PCs of canonical weights explain more property-label variance than first k PCs of raw weights, the concentration claim is supported."
      falsifier: "If PCA concentration does not improve (R² similar for canonical vs raw), the mechanism is not supported even if ρ improves (suggesting a different causal pathway)."
  key_tension: "NFT baseline ρ=0.11 is low — the noise floor may be too high to detect Δρ=0.05. Bootstrap CIs must confirm statistical power before committing to the threshold."
  evidence_summary: |
    Theoretical evidence: Navon et al. 2023 characterizes scaling and sign-flip symmetry groups.
    Empirical baseline: NFT ρ~0.11 confirmed on Schürholt zoo (h-e1 Phase 4).
    Mechanism test: Condition G (PCA concentration) provides direct evidence for step 3.
    Specificity control: Condition E (random normalization) isolates symmetry effect from normalization artifact.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The Schürholt MNIST zoo models occupy diverse positions in weight space, not a degenerate cluster (sufficient orbit diversity for canonicalization to have effect)."
    supporting_evidence: "Zoo contains ~50k models trained from different random seeds with varying hyperparameters — diversity is likely."
    consequence_if_violated: "If models cluster in a small region of weight space, orbit variance may be negligible and canonicalization irrelevant."
  - id: "A2"
    assumption: "Scaling and sign-flip symmetries create non-negligible within-orbit variance in the Schürholt MNIST zoo (orbits are 'fat', not 'thin')."
    supporting_evidence: "MLP training from random init under gradient descent does not enforce any canonical form — scaling/sign-flip variance accumulates."
    consequence_if_violated: "If models happen to be nearly canonical already (e.g., due to weight decay or batch norm), canonicalization has no effect."
  - id: "A3"
    assumption: "NFT's capacity is a binding constraint — i.e., NFT is not already saturated on property-predictive features and has residual capacity spent on invariance learning."
    supporting_evidence: "NFT at ρ=0.11 is well below layer stats baseline (ρ~0.9), suggesting significant unexploited capacity or architectural mismatch."
    consequence_if_violated: "If NFT capacity is not the bottleneck, canonicalization will not help."
  - id: "A4"
    assumption: "Sign-flip canonicalization for M=2 (MNIST zoo: 2-layer MLP) is well-defined and implementable — the greedy simultaneous-flip algorithm produces a unique canonical form."
    supporting_evidence: "For M=2, only one consecutive layer pair exists — sign-flip is uniquely determined by majority sign of incoming weights."
    consequence_if_violated: "If the canonicalization is ambiguous or incorrect, Condition C/D results are invalid."
  - id: "A5"
    assumption: "The frozen-encoder sub-experiment isolates representation quality from optimization dynamics — NFT representations (trained on raw weights) can be re-used to evaluate canonicalized inputs."
    supporting_evidence: "Standard transfer learning practice; frozen encoder re-use is common in representation learning benchmarks."
    consequence_if_violated: "If NFT representations are highly sensitive to input distribution shift (raw vs. canonical), the frozen-encoder result may be unreliable."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - 2-layer MLP weight spaces (M=2) with ReLU activations
    - Schürholt MNIST model zoo (primary experimental setting)
    - Property prediction tasks: test accuracy, generalization gap, learning rate recovery
    - Permutation-equivariant encoders (NFT as primary; flat_mlp as agnostic baseline)
    - Encoder-agnostic preprocessing: canonicalization applies before any encoder
  does_not_apply_to: |
    - Networks with M>2 layers (sign-flip canonicalization is underdetermined — future work)
    - Non-MLP architectures (CNNs, ViTs, Transformers) — weight space structure differs
    - Tasks requiring gradient-based sensitivity (canonicalization removes gradient structure)
    - DWSNets encoder (incompatible with M=2 — confirmed failure in h-e1)
    - `dataset_clf` task on single-dataset zoos (degenerate)
  known_limitations: |
    - M=2 scope is narrow; generalization to deeper networks requires additional algorithm design
    - NFT baseline ρ=0.11 is low relative to layer stats (ρ~0.9); improvement may be modest in absolute terms
    - SVHN/CIFAR zoo availability unverified — P3 (cross-zoo generalization) is exploratory
    - Canonicalization may not preserve gradient information needed for fine-tuning-related tasks

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Condition D (scaling + sign-flip canonicalization → NFT) achieves Spearman ρ at least 0.05 higher than Condition A (raw weights → NFT) on at least 2 of 3 Schürholt MNIST zoo property prediction tasks."
    test_method: "Train NFT regressor on each condition independently; evaluate Spearman ρ on held-out split; compute bootstrap 95% CI; compare Condition D vs A."
    success_criterion: "Δρ ≥ 0.05 on primary task (accuracy) AND at least one additional task (gen_gap or lr_recovery); both comparisons outside 95% CI overlap."
    falsification: "If Δρ < 0.05 on accuracy task, or if only 1 of 3 tasks shows improvement, P1 fails. H0 not rejected."
  - id: "P2"
    primary: false
    statement: "Condition D (both canonicalizations) achieves higher Spearman ρ than Condition E (random normalization control) on at least 2 of 3 tasks, confirming the effect is symmetry-specific rather than a general normalization artifact."
    test_method: "Compare Condition D vs Condition E Spearman ρ with bootstrap CIs; Condition E applies random per-neuron scaling by N(1, 0.1) without orbit collapse."
    success_criterion: "ρ_D > ρ_E on at least 2 of 3 tasks with non-overlapping 95% CIs."
    falsification: "If ρ_D ≈ ρ_E (CIs overlap), the improvement is a normalization artifact, not symmetry-specific."
  - id: "P3"
    primary: false
    statement: "If SVHN or CIFAR model zoos (deeper networks) are available, the improvement from both-canonicalization (Δρ_D - Δρ_A) is at least as large as on the MNIST zoo, consistent with deeper networks having more symmetry dimensions."
    test_method: "Apply identical 7-condition experiment on SVHN/CIFAR zoo if available. Sign-flip canonicalization adapted for M>2 via greedy layer-by-layer (acknowledged as approximate)."
    success_criterion: "Δρ on deeper zoo ≥ Δρ on MNIST zoo; or at minimum Δρ > 0 on deeper zoo."
    falsification: "If SVHN/CIFAR zoo unavailable, P3 is untested (explicitly flagged as exploratory). If available and Δρ < 0, the cross-zoo generalization claim fails."

