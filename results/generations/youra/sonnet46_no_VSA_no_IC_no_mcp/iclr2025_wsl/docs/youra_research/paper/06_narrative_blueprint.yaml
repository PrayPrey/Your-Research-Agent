# Narrative Blueprint — Phase 6 Step 2
# Paper: Symmetry Orbits in Neural Network Weight Space: Characterization and Encoding Implications
# Generated: 2026-08-27
# Source: 045_validated_hypothesis.md (primary), 03_refinement.yaml, 01_targeted_research.md

# ============================================================================
# PAPER TITLE (working)
# ============================================================================
working_title: "Symmetry Orbits Are Geometrically Large in MLP Weight Spaces: Implications for Weight Space Encoding"
alternative_titles:
  - "The Geometry of Functional Equivalence: Measuring Scaling and Sign-Flip Orbits in Neural Network Weight Spaces"
  - "Quantifying Symmetry Orbit Diameters in Neural Network Weight Spaces and Their Impact on Equivariant Encoders"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_finding_plus_puzzle"
  opening_statement:
    content: |
      Two neural networks can compute the exact same function yet occupy nearly orthogonal positions
      in weight space — separated by a cosine distance of 1.07, as large as two random unrelated vectors.
    rationale: "The sign-flip orbit diameter (1.07 mean cosine distance, near theoretical max) is the strongest, most viscerally striking finding. 100% of oracle orbit pairs exceeded the significance threshold."

  why_reader_should_care:
    main_reason: "Any method that learns from raw neural network weights — property prediction, continual learning, model merging — must contend with this geometric chasm or risk wasting capacity tracking functional symmetries rather than semantic properties."
    concrete_example: "NFT, a state-of-the-art permutation-equivariant encoder, allocates representational capacity to tracking weight scale variation (gap=+0.024, CI=[0.023,0.024]) rather than functional properties — a measurable inefficiency."
    stakes: "Without understanding the geometry of symmetry orbits, weight space learning methods silently waste representational capacity. More importantly, naive canonicalization strategies to fix this can fail in unexpected ways."

  tension_setup: |
    The natural next step is to canonicalize — remove this geometric redundancy and let encoders focus on
    functional properties. But canonicalization at this architecture and scale reveals a surprising structural
    barrier: the majority-sign sign-flip algorithm fails for 85.6% of models in the Schürholt zoo due to
    an arithmetic property of even input dimension (d_in=784). The paper thus becomes not just a success
    story but a navigation chart — here is what we know, here is why the obvious fix doesn't yet work,
    and here is exactly what is needed.

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "Weight space learning methods process neural network weights directly to predict properties (accuracy, generalization gap) or enable operations (merging, editing). These methods must account for the symmetry structure of weight space."
    common_understanding: "Permutation symmetry is well-established (neuron relabeling) and handled by equivariant encoders (NFN, DWSNets, NFT). Most work focuses on permutation."

  deeper_problem:
    description: "Beyond permutation, MLP weight spaces contain scaling and sign-flip symmetries — ReLU-preserving transforms that produce functionally identical networks at geometrically distant positions. These symmetries are theoretically characterized (Navon et al. 2023) but have never been empirically measured or isolated for their impact on property prediction."
    why_overlooked: "The field focused on permutation equivariance as the dominant challenge. Scaling and sign-flip were acknowledged theoretically but treated as secondary. No empirical ablation existed."
    our_perspective: "How large are these orbits in practice? Does a state-of-the-art equivariant encoder naturally handle them? Does canonicalization help — and if so, which canonicalization?"

  gap_in_existing_work:
    description: "No prior work provides: (1) empirical measurement of scaling/sign-flip orbit diameters in a real model zoo, (2) quantification of NFT's non-invariance to these symmetries, (3) characterization of scaling-only vs. full canonicalization effects, or (4) analysis of the structural limitations of majority-sign algorithms."
    why_gap_exists: "The tools existed (Schürholt zoo, NFT), but the measurement protocol — oracle orbit construction, within-orbit vs. cross-orbit embedding comparison — had not been applied."
    why_gap_matters: "Without empirical orbit characterization, the argument for canonicalization-based preprocessing is purely theoretical. Our measurements provide the first data-grounded motivation."

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  insight_type: "observation_plus_connection"

  aha_moment:
    one_sentence: |
      NFT trained on raw MLP zoo weights is empirically non-invariant to scaling symmetry orbits — it
      embeds functionally identical networks (related by weight scale) at measurably different positions,
      wasting representational capacity that canonicalization could recover.
    expanded_explanation: |
      Scaling-orbit pairs (networks that compute the same function, related by per-layer L2-norm rescaling)
      produce NFT embeddings with within-orbit cosine similarity 0.971, significantly lower than cross-orbit
      same-property similarity 0.995 (gap=+0.024, 95% CI=[0.023,0.024]). This gap is small in absolute terms
      but statistically unambiguous — its CI is 24× narrower than the gap itself. By contrast, sign-flip orbit
      pairs produce near-identical embeddings (gap=-0.0007), suggesting NFT's row-level tokenization is
      inherently sign-agnostic, an emergent invariance not built by design.

  why_others_missed_it:
    common_assumptions: "Prior work assumed NFT's equivariant architecture would handle symmetries adequately, or that the benefit of explicit canonicalization was obvious and need not be measured."
    our_different_view: "We treat the question empirically: construct oracle orbit pairs, probe embedding similarity, and measure the gap directly. The asymmetry (scaling confirmed, sign-flip near-invariant) was not anticipated."
    enabling_factor: "Oracle orbit construction — constructing ground-truth functional equivalents by explicit transform application — provides a controlled probe unavailable to standard training/evaluation."

  what_makes_it_work:
    intuitive_explanation: "Two neural networks that output the same predictions on every input can look completely different in weight space. A good encoder should recognize them as similar. NFT partially does — but not for scale differences."
    key_mechanism: "NFT tokenizes each weight row as a vector; the attention mechanism processes these tokens. The scale of a row affects its magnitude statistics, which NFT's attention tracks. Sign patterns, being invariant to the magnitude statistics, are not tracked."

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: |
      Scaling and sign-flip symmetry orbits are geometrically large in real MLP model zoos, and NFT
      is empirically non-invariant to scaling but approximately invariant to sign-flip — providing the
      first data-grounded motivation for scaling canonicalization as a preprocessing step for equivariant
      weight space encoders.
    measurable_criteria:
      - "Scaling orbit diameter > 0.05 threshold for ≥90% of oracle pairs (achieved: 100%, mean=0.32)"
      - "Sign-flip orbit diameter > 0.05 threshold for ≥90% of oracle pairs (achieved: 100%, mean=1.07)"
      - "NFT embedding gap (within-orbit vs cross-orbit) significantly > 0 for scaling (achieved: +0.024, CI above 0)"
      - "NFT embedding gap approximately 0 for sign-flip (achieved: -0.0007, 34× smaller)"

  supporting_evidence:
    - id: "evidence_1"
      what: "Scaling orbit diameter: mean cosine distance 0.32 (100% of 2,500 oracle pairs exceed 0.05 threshold, CI=[0.3226,0.3238])"
      so_what: "Functionally identical networks at different scales are geometrically far apart in weight space — not a corner case but a universal property of the zoo."
      how_it_supports_claim: "Directly establishes that scaling orbits are 'fat' — the precondition for canonicalization to matter."
      figure: "fig_gate_metrics.png — bar chart, symmetry type vs distance vs threshold"

    - id: "evidence_2"
      what: "Sign-flip orbit diameter: mean cosine distance 1.07 (near theoretical maximum of 2.0 for cosine distance)"
      so_what: "Sign-flip functionally equivalent networks are near-orthogonal in weight space — as distant as random unrelated vectors."
      how_it_supports_claim: "Even stronger motivation: sign-flip orbits are geometrically enormous. Yet NFT already handles them (emergent invariance)."
      figure: "fig_orbit_distribution.png — cosine distance histograms"

    - id: "evidence_3"
      what: "NFT scaling gap: within-orbit cosine similarity 0.971 vs cross-orbit 0.995, gap=+0.024, 95% CI=[0.023,0.024]"
      so_what: "NFT encodes 'how are these weights scaled' rather than 'what function do they compute' — a measurable capacity waste."
      how_it_supports_claim: "Directly shows NFT is non-invariant to scaling; canonicalization removes the source of this non-invariance."
      figure: "fig_sim_distributions.png — within vs cross-orbit distribution panels"

    - id: "evidence_4"
      what: "NFT sign-flip gap: -0.0007 (34× smaller than scaling gap; within-orbit similarity slightly HIGHER than cross-orbit)"
      so_what: "NFT's tokenization is inherently approximately sign-flip invariant — the mechanism that would motivate sign-flip canonicalization doesn't apply."
      how_it_supports_claim: "Asymmetric result: scaling canonicalization is motivated by mechanism; sign-flip canonicalization may not be necessary for NFT."
      figure: "fig_embedding_pca_scaling.png / fig_embedding_pca_signflip.png — PCA panels"

    - id: "evidence_5"
      what: "Scaling canonicalization increases PCA EVR from 0.055 to 0.086 at k=20 principal components"
      so_what: "Canonicalization provably removes geometric redundancy — the top principal components explain 56% more variance post-canonicalization."
      how_it_supports_claim: "Confirms that canonicalization achieves its geometric goal; the remaining challenge is scale (N=500 insufficient for downstream improvement detection)."
      figure: "fig3_explained_variance.png — cumulative EVR curves"

    - id: "evidence_6"
      what: "Majority-sign sign-flip canonicalization: fraction_unique=0.144 (85.6% of zoo models have tied neurons)"
      so_what: "The standard sign-flip algorithm fails structurally for even-d_in architectures — not a training artifact but a combinatorial certainty (predicted 83% by binomial, observed 85.6%)."
      how_it_supports_claim: "Explains why H-M3 Condition D underperformed even random normalization: the non-unique canonicalization injected structured noise. Also a novel independent finding."
      figure: "tied_neuron_hist.png + gate_metric.png"

    - id: "evidence_7"
      what: "Δρ_D-A: test_acc=+0.058, gen_gap=+0.053, lr=+0.077 — all positive, all statistically non-significant at N=500 (CI width ≈0.6)"
      so_what: "The signal is directionally consistent across all 9 task×seed combinations but statistically invisible at this scale. The experiment establishes the measurement framework and quantifies the scale requirement (N≥5,000)."
      how_it_supports_claim: "Honest framing: we see the direction of the effect, cannot yet confirm its magnitude. This positions future work as immediately actionable rather than speculative."
      figure: "Δρ table with CIs and required N annotation"

  surprising_findings:
    - finding: "Random normalization control (Condition E) outperforms full canonicalization (Condition D) on all tasks"
      why_surprising: "Condition E applies a semantically meaningless random scale perturbation — it was designed as a null control. Finding E > D consistently (across 3 seeds) was not anticipated."
      our_interpretation: "Post-hoc analysis (H-C1) reveals that Condition D applied non-unique sign-flip canonicalization to 85.6% of models, likely injecting structured noise rather than removing symmetry variance. Condition E preserves sign structure and may benefit from implicit regularization."
      narrative_role: "Motivates the structural finding (H-C1) and underscores why naive full canonicalization can backfire — strengthening the paper's contribution as a cautionary + constructive analysis."

    - finding: "NFT is approximately sign-flip invariant by construction (gap=-0.0007)"
      why_surprising: "H-M1 predicted NFT would be non-invariant to BOTH scaling and sign-flip. The asymmetric result (one confirmed, one near-invariant) was not anticipated."
      our_interpretation: "NFT's row-level tokenization processes magnitude statistics; sign patterns do not affect magnitude statistics, making NFT inherently approximately sign-agnostic. This suggests focusing canonicalization efforts on scaling orbits for NFT-family encoders."
      narrative_role: "Key scientific contribution beyond the original hypothesis — an emergent property of NFT architecture revealed by the probe."

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First empirical characterization of scaling and sign-flip symmetry orbit diameters in a real MLP model zoo, revealing that NFT is non-invariant to scaling (gap=+0.024) but approximately invariant to sign-flip by construction — and that majority-sign canonicalization structurally fails for 85.6% of even-d_in architectures."
    why_significant: "Transforms a theoretical argument (canonicalization should help) into a measurement-grounded one, while identifying a previously unknown structural limitation of the standard algorithm and an emergent invariance property of NFT."

  implications:
    for_field: "Weight space learning researchers now have empirical orbit diameter measurements they can use to calibrate the importance of canonicalization; the NFT sign-flip invariance finding suggests architecture-specific analysis of which symmetries actually require canonicalization."
    for_practice: "Practitioners using NFT-family encoders for model zoo tasks should prioritize scaling canonicalization and may safely skip sign-flip canonicalization — saving algorithmic complexity while addressing the dominant source of geometric redundancy."

  future_possibilities:
    immediate_extensions: "Full Schürholt zoo (N≥5,000) to provide statistical power for property prediction improvement; scaling-only (Condition B) as clean primary treatment; odd d_in or alternative tie-breaking for valid sign-flip canonicalization."
    longer_term_vision: "Orbit characterization framework extended to deeper networks, transformers, CNNs; architecture-specific symmetry audit as standard practice before weight space encoder design."

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — orbit motivation, two key results, honest N=500 limitation, one forward-looking sentence"
    key_message: "Symmetry orbits are large; NFT is non-invariant to scaling but not sign-flip; canonicalization has a structural barrier at this scale; measurements provide foundation for adequately-powered follow-up."
    written_last: true

  introduction:
    narrative_purpose: "Hook → Orbit geometry problem → What we did → Three contributions → Paper map"
    hook_strategy: "counterintuitive_finding_plus_puzzle (orbit diameter 1.07 as opening)"
    opening_gambit: "Start with the sign-flip orbit finding, then reveal that canonicalization doesn't straightforwardly work — and that this paper is the diagnosis."
    contributions_framing: "Three contributions as a coherent story, not a list: (1) we measured, (2) we probed, (3) we discovered why the fix is harder than expected."
    transition_to_related: "The gap between theoretical symmetry characterization (Navon 2023) and empirical measurement motivates Related Work."

  related_work:
    narrative_purpose: "Permutation equivariance line → scaling/sign-flip theory (Navon) → model zoo benchmarks → our position as the empirical bridge"
    positioning_strategy: "We are not competing with NFN/DWSNets on performance — we are adding a measurement layer that all these methods need."
    key_comparison_points:
      - "Navon 2023: theoretical characterization → we provide empirical measurement"
      - "Zhou 2023 (NFT): architecture without explicit orbit invariance → we probe and quantify the gap"
      - "Schürholt 2022: benchmark zoo → we use as measurement substrate"
      - "Unterthiner 2020: layer stats baseline → contextualizes NFT's current ρ~0.11"
    tone: "Build on, don't attack. Position as complementary empirical analysis."

  methodology:
    narrative_purpose: "Oracle orbit construction protocol → embedding probe design → canonicalization implementation → uniqueness audit — WHY each design choice"
    connection_to_insight: "The oracle construction (controlled orbit pairs by explicit transform) is the key methodological innovation — it provides ground truth for symmetry analysis that natural zoo variation cannot."
    key_design_decisions:
      - "Oracle construction vs. natural zoo variation: oracle gives controlled ground truth"
      - "Within-orbit vs. cross-orbit comparison: separates symmetry sensitivity from property sensitivity"
      - "Five conditions (A-E) for canonicalization: isolates scaling, sign-flip, random-norm effects"
      - "CLS pooling for NFT: critical choice (mean pooling collapses embeddings)"
      - "Bootstrap CI for all comparisons: appropriate for small-N regime"
    note_on_scale: "Explicitly frame N=500 as a constraint, not a design choice — and explain why H-E1/H-M1 findings are robust to it (relative comparisons, tight CIs)."

  experiments:
    narrative_purpose: "Four experimental questions, each mapped to a hypothesis — set up evidence story"
    experimental_questions:
      - "EQ1: How large are scaling and sign-flip orbits in the Schürholt MNIST MLP zoo? (→ H-E1)"
      - "EQ2: Is NFT naturally invariant to these orbits? (→ H-M1)"
      - "EQ3: Does canonicalization concentrate geometric structure and improve downstream prediction? (→ H-M2, H-M3)"
      - "EQ4: Is sign-flip canonicalization well-defined for this architecture? (→ H-C1)"
    narrative_connection: "Questions are ordered to build the causal chain: orbits exist → NFT sees them → canonicalization should help → but here's the barrier."

  results:
    narrative_purpose: "Present evidence in the same order as experimental questions — build toward the structural finding as a turning point"
    main_result_highlight: "NFT scaling gap: +0.024 (CI=[0.023,0.024]) — first empirical quantification of equivariant encoder non-invariance to scaling."
    secondary_highlights:
      - "Orbit diameters: 0.32 (scaling), 1.07 (sign-flip) — 100% above threshold"
      - "EVR increase: 0.055→0.086 — geometric concentration confirmed"
      - "Δρ direction: consistent (+0.05–0.08) but statistically invisible at N=500"
    structural_finding_placement: "H-C1 result (fraction_unique=0.144) placed after property prediction results — as the explanation for why E > D"
    tone: "Honest about what N=500 can and cannot show. Distinguish tight results (H-E1, H-M1) from underpowered results (H-M2, H-M3)."

  discussion:
    narrative_purpose: "Interpret the asymmetric NFT invariance; explain E>D via H-C1; frame N=500 as a quantifiable limitation with a known fix"
    honest_limitations:
      - "N=500 statistical power (quantified: CI width ≈0.6, requires N≥5,000 for CI width <0.05)"
      - "Sign-flip non-uniqueness (structural: binomial tie rate, requires odd d_in or tie-breaking)"
      - "NFT sign-flip invariance probe used single-layer flip (not two-layer joint flip)"
    broader_impact: "Orbit characterization as a diagnostic tool — before building an encoder, measure the orbit structure it must handle."

  conclusion:
    narrative_purpose: "Callback to hook → three sentences of what we found → one paragraph of what comes next"
    callback_to_hook: "We opened with functionally identical networks being near-orthogonal in weight space (distance 1.07). We close by noting: NFT already handles this (sign-flip near-invariance) — but scaling orbits remain a live target. The path to improvement is clear: scaling-only canonicalization, adequate zoo scale."
    summary_arc: "We measured → we probed → we found a structural barrier → we identified the fix."
    future_framing: "Not speculative; grounded in specific quantitative requirements (N≥5,000, odd d_in)."

