  - check: "Does each section naturally flow to the next?"
    status: "YES — Intro → Related Work (theory → empirical bridge), Related → Methodology (what we measured → how), Methods → Experiments (protocol → results), Experiments → Results → Discussion (evidence → interpretation → limitation), Discussion → Conclusion (limits + path forward)"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES — NFT scaling non-invariance is the pivot: mentioned in Intro (contribution), Methodology (probe design), Results (main finding), Discussion (interpretation), Conclusion (actionable target)"

  - check: "Are all major claims supported by evidence?"
    status: "YES — H-E1 (orbit diameters), H-M1 (NFT gaps), H-M2 (EVR), H-M3 (Δρ direction), H-C1 (tie rate) all documented with specific numbers"

  - check: "Would a busy reviewer find Abstract compelling?"
