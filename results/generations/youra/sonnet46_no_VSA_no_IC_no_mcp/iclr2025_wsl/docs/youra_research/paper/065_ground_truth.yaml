# ============================================================

negative_results:
  - id: "neg_1"
    finding: "Δρ improvement not statistically detectable at N=500"
    reason: "n=50 test samples → CI width ≈0.6; Δρ=0.05 requires CI width <0.05"
    scale_requirement: "N≥5,000 models estimated"
    framing_in_paper: "Directional evidence with quantified scale requirement (not a failure)"

  - id: "neg_2"
    finding: "Sign-flip canonicalization non-unique for 85.6% of zoo models"
    reason: "d_in=784 (even) → binomial tie probability 2.8% per neuron, 83% per model"
    framing_in_paper: "Novel structural finding — explains E > D and is a contribution"

  - id: "neg_3"
    finding: "R² negative for all conditions at N=500"
    reason: "n=50 test samples with 20+ PCA components → overfitting"
    framing_in_paper: "Scale limitation, not algorithm failure; EVR improvement confirmed"

