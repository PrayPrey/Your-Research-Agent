    - "flat_mlp — permutation-agnostic baseline (Condition F)"
  datasets:
    - "Schürholt MNIST Model Zoo (~50k models, 2-layer MLPs, ground-truth: accuracy/gen_gap/lr_recovery)"
    - "SVHN/CIFAR Model Zoo (exploratory, conditional on availability)"
  baselines:
    - "Raw weights → NFT (Condition A — confirmed from h-e1)"
    - "Random normalization → NFT (Condition E — normalization artifact control)"
    - "Both canonicalizations → flat_mlp (Condition F — encoder-agnosticism test)"
    - "Layer-wise statistics (Unterthiner et al. 2020 — literature upper bound ρ~0.9)"

measurement_plan:
  data_collection:
    - source: "Schürholt MNIST model zoo weights — confirmed loadable from h-e1 unified data loader"
    - source: "Ground-truth labels: test accuracy, generalization gap, lr_recovery from zoo metadata"
  procedure:
    - step: "1. Bootstrap CI check on Condition A (raw NFT) baseline — verify statistical power for Δρ=0.05 detection"
    - step: "2. Implement scaling canonicalization (~20 lines PyTorch) — normalize each neuron's incoming weight vector to unit L2 norm; scale outgoing weights by same factor"
    - step: "3. Implement sign-flip canonicalization for M=2 (~30 lines PyTorch) — for each neuron, if majority of incoming weights negative, simultaneously flip incoming and outgoing weights"
    - step: "4. Run all 7 conditions (A-G) on Schürholt MNIST zoo; evaluate Spearman ρ on held-out split"
    - step: "5. Run frozen-encoder sub-experiment: use NFT trained on raw weights (Condition A), evaluate on canonicalized inputs (Conditions B-D) — final regressor only re-trained"
    - step: "6. Compute bootstrap 95% CIs for all Spearman ρ estimates"
    - step: "7. Run PCA experiment (Condition G): compute PCA on raw vs canonical weight vectors, regress on property labels, compare R²"
    - step: "8. If SVHN/CIFAR zoo available: repeat conditions A, D, E on deeper zoo for P3"
  success_criteria:
    - "Δρ ≥ 0.05 on accuracy task (P1, primary)"
    - "At least 2/3 tasks show Δρ ≥ 0.05 (P1, robustness)"
    - "ρ_D > ρ_E with non-overlapping 95% CIs (P2, symmetry-specificity)"
    - "PCA R² higher for canonical than raw weights on at least 2/3 tasks (Condition G, mechanism)"

validation:
  internal_validity:
    - "Condition E (random norm control) isolates symmetry effect from general normalization"
    - "Frozen-encoder sub-experiment isolates representation quality from optimization dynamics"
    - "Bootstrap CIs provide statistical validity on rank correlation estimates"
    - "Fixed random seed + identical train/test split across all conditions eliminates sampling variation"
  external_validity:
    - "Schürholt MNIST zoo is publicly available and widely used — results are reproducible by community"
    - "P3 (SVHN/CIFAR) provides cross-zoo generalization test if available"
    - "Encoder-agnostic framing (Condition F: flat_mlp + canon) tests generalization beyond NFT"

