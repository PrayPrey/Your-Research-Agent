hypothesis_draft:
  title: "SymCanon-WSL: Symmetry Canonicalization for Weight Space Property Prediction"
  hypothesis_id: "H-SymCanon-v1"
  core_claim: |
    Canonical preprocessing that removes scaling and sign-flip symmetry orbits from MLP weight
    vectors — before encoding with a permutation-equivariant encoder (NFT) — improves Spearman
    rank correlation with model properties (test accuracy, generalization gap, learning rate
    recovery) by Δρ ≥ 0.05 on the Schürholt MNIST model zoo, relative to raw weight encoding.
  mechanism: |
    (1) Raw weights contain within-orbit variance from scaling/sign-flip symmetries — functionally
    irrelevant but geometrically present in weight space.
    (2) NFT's permutation-equivariant encoder must allocate capacity to learn implicit invariance
    to this within-orbit variance, reducing capacity for property-predictive features.
    (3) Explicit canonicalization collapses each orbit to a canonical representative, concentrating
    property-relevant information and freeing encoder capacity for prediction.
  predictions:
    - P1: "Condition D (both canonicalizations → NFT) achieves Δρ ≥ 0.05 above Condition A (raw weights → NFT) on at least 2/3 Schürholt MNIST zoo tasks"
    - P2: "Condition D > Condition E (random normalization control) on at least 2/3 tasks — confirms symmetry-specific effect"
    - P3: "If SVHN/CIFAR zoos available, improvement from canonicalization ≥ MNIST improvement (exploratory)"

variables_summary:
  independent: "Canonicalization type (None / Scaling-only / Sign-flip-only / Both / Random-norm-control / flat_mlp+Both)"
  dependent_primary: "Spearman ρ between NFT predictions and ground-truth test accuracy on Schürholt MNIST zoo held-out split"
  controlled: "NFT architecture, training procedure, train/test split, random seed"

null_hypothesis:
  h0_statement: |
    There is no significant difference in Spearman ρ between canonicalized-weight NFT encoding
    and raw-weight NFT encoding on Schürholt MNIST zoo property prediction tasks (Δρ < 0.05
    or within noise floor).
  statistical_test: "Bootstrap Spearman ρ comparison with 95% confidence intervals"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical ablation of scaling/sign-flip symmetry contribution to property prediction accuracy via encoder-agnostic canonicalization preprocessing"
  differentiation_summary: |
    NFN (Zhou 2023) and DWSNets (Navon 2023) establish permutation equivariance theory/practice
    but do not empirically measure scaling/sign-flip contributions to property prediction.
    DWSNets incompatible with M=2 zoos (confirmed failure in h-e1).
    SymCanon-WSL: encoder-agnostic preprocessing, immediately testable on confirmed-working
    Schürholt zoo + NFT infrastructure from h-e1.

