# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training Method"
      type: "categorical"
      operationalization: "Post-training algorithm applied after base model initialization"
      levels:
        - "SFT (supervised fine-tuning on APPS solutions)"
        - "RLEF-Binary (GRPO with binary pass/fail reward on APPS tests)"
        - "RLEF-Fraction (GRPO with fraction-of-tests-passing reward on APPS tests)"
    - name: "Benchmark Difficulty Level"
      type: "categorical"
      operationalization: "Benchmark used for evaluation, ordered by problem difficulty"
      levels:
        - "HumanEval (easy; 164 problems)"
        - "MBPP (medium-easy; 374 problems)"
        - "LiveCodeBench-Easy (medium)"
        - "LiveCodeBench-Medium (medium-hard)"
        - "LiveCodeBench-Hard (hard)"
  dependent:
    - name: "pass@1"
      type: "continuous"
      operationalization: "Fraction of problems solved correctly on first generation attempt; range [0,1]; evaluated via bigcode-evaluation-harness correctness-only mode"
      primary: true
    - name: "Δ pass@1 (RLEF - SFT)"
      type: "continuous"
      operationalization: "Performance gap between RLEF variant and SFT at each benchmark; primary outcome for difficulty-scaling claim"
      primary: true
    - name: "pass@10"
      type: "continuous"
      operationalization: "Fraction of problems solved correctly in 10 generation attempts; secondary oracle metric"
      primary: false
    - name: "Non-zero reward fraction"
      type: "continuous"
      operationalization: "Fraction of RLEF training problems where at least 1 test is passed (non-zero reward); proxy for partial-success learning signal; tracked per difficulty bucket"
      primary: false
  controlled:
    - name: "Base model"
      operationalization: "DeepSeek-Coder-7B (primary) and DeepSeek-Coder-1.3B (sanity check); same checkpoint for all training methods"
    - name: "Training data"
      operationalization: "APPS dataset (train split); same problems and test cases for SFT, RLEF-Binary, RLEF-Fraction"
    - name: "Training compute"
      operationalization: "Matched number of gradient steps (or equivalent token budget) across all three training methods"
    - name: "Evaluation protocol"
      operationalization: "bigcode-evaluation-harness correctness-only mode (no time/memory limits); LiveCodeBench 2024-Q4 snapshot for reproducibility"
    - name: "Decoding parameters"
      operationalization: "Temperature=0.8, top-p=0.95 for pass@k; greedy for pass@1 baseline"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Training difficulty creates SFT signal void at hard problems"
      evidence: "At hard benchmark difficulty (CodeContests/LiveCodeBench-Hard level), APPS training data contains few or no fully-correct solution examples. SFT objective (next-token prediction on correct solutions) receives zero gradient from problems where no correct solution appears in training data."
      falsifier: "SFT trained on APPS achieves >60% pass@1 on LiveCodeBench-Hard (would mean APPS covers hard difficulty well; SFT signal not void)"
    - step: 2
      description: "RLEF with fraction reward maintains non-zero gradient at hard difficulty via partial success"
      evidence: "Even at high difficulty, a 7B model trained on APPS may generate partially-correct solutions (pass 2/5 tests). Fraction-of-tests reward assigns non-zero reward proportional to partial success. This provides gradient signal that SFT cannot provide for the same hard problems."
      falsifier: "Non-zero reward fraction during RLEF training on APPS Hard problems is < 10% (virtually no partial successes; RLEF also has signal void at hard difficulty)"
    - step: 3
      description: "Partial-success gradient signal at hard difficulty produces incrementally better solutions"
      evidence: "RLEF with fraction reward directly optimizes test-passing rate incrementally; the model learns to improve from 2/5 → 3/5 → 4/5 → 5/5 tests passing via policy gradient. This incremental improvement path is absent in SFT (all-or-nothing)."
      falsifier: "RLEF-Fraction and RLEF-Binary achieve identical Δ over SFT at hard benchmarks (would mean partial-success gradient adds no benefit over binary threshold)"
    - step: 4
      description: "RLEF's difficulty-scaling training signal advantage manifests as wider performance gap at hard benchmarks"
      evidence: "Steps 1-3 predict that RLEF's advantage (Δ = pass@1(RLEF) - pass@1(SFT)) grows with benchmark difficulty because SFT's signal void grows while RLEF's partial-success signal remains non-zero."
      falsifier: "Δ_LiveCodeBench ≤ 1.5× Δ_HumanEval (gap does not widen with difficulty)"
  key_tension: "The claim about SFT's 'signal void' at hard difficulty assumes APPS Hard problems are not adequately covered by APPS training data. If APPS is actually comprehensive at high difficulty, SFT may perform better than expected and narrow the gap. This is empirically testable."
  evidence_summary: |
    Supporting evidence from literature: RLEF-2024 (Gehring et al.) found partial > binary reward
    more at hard problems (non-reproducible but directionally strong). RLTF found coverage-based
    reward +7% over binary on HumanEval. PPOCoder and CodeRL established RLEF > SFT on easy
    benchmarks consistently. The mechanistic explanation (partial-success gradient at hard difficulty)
    is theoretically grounded but not yet directly tested in a controlled setting.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "APPS training data covers medium difficulty (HumanEval/MBPP-equivalent) adequately but has sparse or absent fully-correct examples at hard difficulty (LiveCodeBench-Hard equivalent)"
    supporting_evidence: "APPS was designed to span easy to competition-level problems; published results show SFT on APPS yields 10-25% on APPS Hard (suggesting most hard examples don't produce correct SFT outputs)"
    consequence_if_violated: "If APPS fully covers hard difficulty, SFT may not have a signal void; RLEF advantage may not scale with difficulty — gap remains constant rather than widening"
  - id: "A2"
    assumption: "DeepSeek-Coder-7B trained on APPS generates partially-correct solutions on hard problems at non-trivial rates (>10% of hard problems have at least 1 test passing)"
    supporting_evidence: "7B-scale models trained for code generation routinely generate partially-correct solutions; RLEF-2024 (Gehring et al.) reports non-zero reward on hard problems even with strong base models"
    consequence_if_violated: "If RLEF has virtual zero reward on hard problems, partial-success gradient advantage disappears; hypothesis reduces to RLEF = SFT at hard difficulty"
  - id: "A3"
    assumption: "bigcode-evaluation-harness correctly measures pass@1 for HumanEval, MBPP, and LiveCodeBench in correctness-only mode (no time limits)"
    supporting_evidence: "bigcode-harness is the standard evaluation tool used by the BigCode community; correctness-only mode is documented and validated"
    consequence_if_violated: "Measurement error in evaluation would corrupt Δ calculations and invalidate statistical comparisons"
  - id: "A4"
    assumption: "DeepSeek-Coder-7B SFT on HumanEval is not saturated (< 90% pass@1) so that RLEF has headroom to improve"
    supporting_evidence: "As of 2024, 7B-scale models (DeepSeek-Coder-7B-Instruct) achieve ~70-80% on HumanEval with instruction tuning; APPS SFT fine-tuning from base weights likely achieves lower"
    consequence_if_violated: "If SFT ceiling at HumanEval is ≥90%, RLEF has minimal improvement headroom; makes Δ_HumanEval artificially small, inflating the difficulty-scaling ratio"
  - id: "A5"
    assumption: "APPS training data problem types (Python algorithmic problems) are sufficiently representative of LiveCodeBench problem types to enable meaningful transfer"
    supporting_evidence: "Both APPS and LiveCodeBench draw from competitive programming; APPS covers dynamic programming, graph algorithms, combinatorics — overlapping with LiveCodeBench content"
    consequence_if_violated: "If APPS and LiveCodeBench problems are systematically different in type, the RLEF vs SFT comparison at LiveCodeBench may reflect domain mismatch rather than difficulty scaling"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - 7B-scale decoder-only LLMs fine-tuned for code generation (primary: DeepSeek-Coder-7B)
    - Training on function-level Python coding problems with unit test execution (APPS dataset)
    - Evaluation on function-level code benchmarks with correctness-only execution (HumanEval, MBPP, LiveCodeBench)
    - GRPO/PPO-based RLEF with execution reward (binary or fraction-of-tests)
    - Difficulty range: easy (HumanEval) to hard (LiveCodeBench-Hard / APPS Hard)
  does_not_apply_to: |
    - Repository-level coding tasks (SWE-bench) — not tested; different task structure
    - Models >13B parameters — excluded from primary experiment (computation scope)
    - Non-Python programming languages — APPS is Python-focused
    - Time-complexity-constrained evaluation (full competitive programming judge) — explicitly excluded to avoid time-limit confound
    - Instruction-following or general language tasks — hypothesis is specific to code generation via execution feedback
  known_limitations: |
    - APPS test quality varies per problem (1-20 tests/problem); this affects reward signal quality
    - LiveCodeBench "hard" problems may be difficulty-extrapolation beyond APPS training, not just difficulty-generalization
    - Reproducibility depends on exact APPS split, test case versions, and bigcode-harness snapshot
    - 1.3B sanity check may not achieve competitive pass@1 rates on hard benchmarks, limiting interpretability

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Under controlled conditions, Δ(Fraction-RLEF pass@1 - SFT pass@1) at LiveCodeBench-Medium/Hard is ≥ 1.5× Δ at HumanEval"
    test_method: "Train SFT, RLEF-Binary, RLEF-Fraction on APPS; evaluate all three on HumanEval and LiveCodeBench using bigcode-harness; compute Δ ratios with bootstrap 95% CIs"
    success_criterion: "Δ_LiveCodeBench / Δ_HumanEval ≥ 1.5 with p < 0.05 (bootstrap test)"
    falsification: "Δ_LiveCodeBench / Δ_HumanEval < 1.5 or not significantly different from 1.0"
  - id: "P2"
    primary: false
    statement: "Fraction-of-tests reward yields larger Δ over SFT than binary reward at hard difficulty (LiveCodeBench-Medium/Hard), with smaller or negligible difference at easy difficulty (HumanEval)"
    test_method: "Compare Δ(Fraction-RLEF, SFT) vs Δ(Binary-RLEF, SFT) at each benchmark level; compute interaction effect (difficulty × reward type)"
    success_criterion: "Δ_Fraction > Δ_Binary at LiveCodeBench-Hard (p < 0.05); Δ_Fraction ≈ Δ_Binary at HumanEval (p > 0.10)"
    falsification: "No significant interaction between reward type and benchmark difficulty; binary and fraction yield equal Δ across difficulty levels"
  - id: "P3"
    primary: false
    statement: "During RLEF training, the fraction of problems with non-zero reward (at least 1 test passing) is higher for hard-difficulty APPS problems than easy-difficulty APPS problems, while SFT training signal is uniform across difficulty"
    test_method: "Log per-batch non-zero reward fractions stratified by APPS problem difficulty during RLEF training; compare across easy/medium/hard problem buckets"
    success_criterion: "Non-zero reward fraction significantly higher for APPS Hard vs APPS Easy problems (p < 0.05); SFT training loss not significantly different by difficulty bucket"
    falsification: "Non-zero reward fraction is uniform across difficulty levels (RLEF has signal void at hard; partial-success mechanism doesn't hold)"
  - id: "P4"
    primary: false
    statement: "The directional pattern (RLEF gap widens with difficulty) holds for DeepSeek-Coder-1.3B as a sanity check, though absolute performance and gap sizes may differ from 7B"
    test_method: "Run same APPS training and bigcode-harness evaluation pipeline with DeepSeek-Coder-1.3B; report Δ values at HumanEval and LiveCodeBench"
    success_criterion: "Δ_LiveCodeBench / Δ_HumanEval ≥ 1.0 for 1.3B (directional, not necessarily ≥1.5×)"
    falsification: "Pattern inverts at 1.3B (Δ_LiveCodeBench < Δ_HumanEval); suggests model-scale-specific effect not generalizable"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "APPS (Automated Programming Progress Standard)"
    type: "standard"
    source: "Hendrycks et al., 2021; publicly available on HuggingFace (codeparrot/apps)"
    path: "codeparrot/apps"
    hypothesis_fit: "APPS provides 5000 Python programming problems with unit tests spanning easy-to-hard difficulty. Training on APPS provides both SFT targets (correct solutions) and RLEF execution signals (test pass/fail). The difficulty gradient within APPS (intro/interview/competition) creates natural difficulty variation in training signal quality."
  model:
    name: "DeepSeek-Coder-7B-base"
    type: "decoder-only transformer, code-specialized"
    source: "deepseek-ai/deepseek-coder-7b-base on HuggingFace"
    hypothesis_fit: "Public weights, strong code generation capability, not saturated on HumanEval from base weights. Available at 1.3B scale for sanity check. Used as SFT and RLEF starting point."
  baselines:
    - name: "SFT baseline"
      method: "Supervised fine-tuning on APPS correct solutions using standard cross-entropy next-token prediction; same gradient steps as RLEF variants"
    - name: "RLEF-Binary"
      method: "GRPO training on APPS with binary reward (1.0 if all tests pass, 0.0 otherwise); KL penalty from SFT reference; same training budget as SFT"
    - name: "RLEF-Fraction"
      method: "GRPO training on APPS with fraction-of-tests-passing reward (tests_passed / total_tests); KL penalty from SFT reference; same training budget as SFT"

