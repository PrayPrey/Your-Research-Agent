novelty:
  preserved_novelty: "First controlled multi-benchmark comparison of RLEF vs SFT across the full difficulty spectrum using a reproducible open-source pipeline; first direct test of the difficulty-scaling relationship; first mechanistic proxy test (non-zero reward fraction by difficulty)"
  key_innovation: "Difficulty-stratified analysis of RLEF's performance advantage — characterizing RLEF's benefit as a function of benchmark difficulty rather than a fixed improvement. Includes embedded reward formulation ablation (binary vs fraction) within the same controlled framework."
  differentiation:
    - prior_work: "CodeRL (Le et al., 2022)"
      difference: "CodeRL uses CodeT5 on APPS+HumanEval only, no MBPP/LiveCodeBench; our study uses DeepSeek-Coder-7B across full difficulty spectrum with difficulty-scaling analysis"
    - prior_work: "PPOCoder (Majeed et al., 2023)"
      difference: "PPOCoder uses HumanEval/MBPP only, no hard benchmarks; binary reward only; different base model (CodeGen); our study adds hard benchmark evaluation and reward formulation ablation"
    - prior_work: "RLEF (Gehring et al., 2024)"
      difference: "RLEF-2024 uses Meta's internal Code Llama variant — not publicly reproducible; our study uses public DeepSeek-Coder-7B with fully open pipeline; directly tests the non-reproducible findings"
    - prior_work: "RLTF (Liu et al., 2023)"
      difference: "RLTF compares binary vs coverage reward on CodeLlama/HumanEval only; our study extends reward ablation to hard benchmarks and tests difficulty-scaling interaction"

