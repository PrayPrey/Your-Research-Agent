# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "RLEF outperforms SFT on HumanEval and MBPP by 5-15% pass@1"
      status: "BUILD_ON"
      evidence: "Multiple independent replications: CodeRL (+4.3%), PPOCoder (+5-8%), RLTF (+7%), RLEF-2024 — all on different models/data but directionally consistent"
    - claim: "Partial (fraction-of-tests) reward outperforms binary reward, especially at harder problems"
      status: "BUILD_ON"
      evidence: "RLTF (2023) and RLEF (Gehring et al., 2024) both show partial > binary on harder problems; non-reproducible (Meta internal model) but directionally established"
    - claim: "No controlled multi-benchmark RLEF vs SFT comparison exists using same model, data, and protocol across full difficulty spectrum"
      status: "PROVE_NEW"
      evidence: "Gap analysis: CodeRL uses APPS/HumanEval only; PPOCoder uses HumanEval/MBPP only; RLEF-2024 uses internal model; no public reproducible study spans full difficulty"
    - claim: "RLEF advantage scales with benchmark difficulty (gap widens from easy to hard)"
      status: "PROVE_NEW"
      evidence: "Suggested by RLEF-2024 findings (partial > binary more at hard problems) but not directly tested in controlled conditions"
    - claim: "Partial-success learning signal is the mechanism (RLEF gets gradient from partially-correct solutions; SFT gets zero gradient from hard problems with no correct training examples)"
      status: "PROVE_NEW"
      evidence: "Mechanistic hypothesis derived from discussion; testable via training monitoring (non-zero reward fraction by difficulty)"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    BUILD_ON claims (established) do not require re-verification experiments — treat as background.
    PROVE_NEW claims (3) are the experimental targets. Phase 2B should design sub-hypotheses around:
    SH1 (existence): RLEF > SFT at hard difficulty with controlled setup
    SH2 (mechanism): Partial-success reward fraction correlates with difficulty and training benefit
    SH3 (comparison): Fraction reward > Binary reward > SFT at hard difficulty (defer to Phase 5 if resource-constrained)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DifficultyScaledRLEF-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under controlled fine-tuning conditions (fixed base model: DeepSeek-Coder-7B;
    fixed training data: APPS dataset; fixed evaluation: bigcode-evaluation-harness
    correctness-only), if a language model is trained with RLEF using
    fraction-of-tests-passing reward (versus SFT baseline), then the performance
    advantage of RLEF over SFT increases monotonically with benchmark difficulty
    from HumanEval (easy) → MBPP (medium-easy) → LiveCodeBench-Easy/Medium/Hard,
    because execution feedback enables non-zero gradient signal from partially-correct
    solutions at difficulty levels where SFT's fully-supervised objective receives
    zero gradient (no fully-correct training examples at that difficulty level).
  alternative_hypothesis_h0: |
    There is no significant difference in the RLEF-vs-SFT performance gap (Δ pass@1)
    across benchmark difficulty levels; Δ at LiveCodeBench is not significantly
    larger than Δ at HumanEval (Δ_LiveCodeBench ≤ 1.5 × Δ_HumanEval).

