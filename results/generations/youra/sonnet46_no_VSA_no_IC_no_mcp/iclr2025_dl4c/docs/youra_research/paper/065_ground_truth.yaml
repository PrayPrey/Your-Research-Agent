# ============================================================
# METHODOLOGY GROUND TRUTH
# ============================================================

methodology:
  base_model: "deepseek-ai/deepseek-coder-7b-base"
  training_data: "codeparrot/apps (HuggingFace)"
  evaluation_harness: "bigcode-evaluation-harness (correctness-only)"
  optimizer: "GRPO (custom SimpleGRPOTrainer, TRL 1.x compatible)"

  sft_hyperparameters:
    learning_rate: 2.0e-5
    num_epochs_full: 3
    num_epochs_smoke: 1
    batch_size_effective: 16
    gradient_accumulation_steps: 8
    max_length: 2048

  rlef_hyperparameters:
    learning_rate: 1.0e-6
    num_generations_smoke: 4
    num_generations_full: 8
    max_new_tokens: 512
    kl_penalty_beta: 0.04
    temperature: 0.8
    warmup_steps: 10
    logging_steps: 5
    seed: 42

  smoke_scale:
    apps_samples: 500
    grpo_steps: 62
    eval_n_per_benchmark: 50
    checkpoint_saved: false
    reason_not_saved: "Bash process timeout after training"

  hardware:
    gpu: "NVIDIA H100 NVL"
    gpu_count: 5
    vram_per_gpu_mib: 95830

