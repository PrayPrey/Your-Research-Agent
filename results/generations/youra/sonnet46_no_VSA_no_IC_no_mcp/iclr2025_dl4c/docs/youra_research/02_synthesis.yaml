hypothesis_draft:
  title: "Difficulty-Scaled RLEF: Execution Feedback Advantage Grows with Benchmark Difficulty"
  hypothesis_id: "H-DifficultyScaledRLEF-v1"
  core_claim: |
    Under controlled fine-tuning conditions (DeepSeek-Coder-7B base, APPS training data,
    bigcode-harness correctness-only evaluation), RLEF with fraction-of-tests-passing reward
    achieves a progressively larger performance advantage over SFT as benchmark difficulty
    increases from HumanEval (easy) through MBPP to LiveCodeBench Easy/Medium/Hard,
    because execution feedback enables non-zero gradient from partial-success solutions
    where SFT has zero signal.
  mechanism: |
    At easy benchmarks (HumanEval/MBPP), APPS training data covers problem types well;
    SFT has adequate correct-solution examples; RLEF adds marginal benefit.
    At hard benchmarks (LiveCodeBench-Hard), APPS correct-solution coverage is sparse;
    SFT receives near-zero gradient on hard problems; RLEF's fraction reward assigns
    non-zero gradient from partially-correct solutions (e.g., 3/5 tests passing).
    This partial-success gradient allows RLEF to iteratively improve toward full solutions
    via policy optimization — a path unavailable to SFT's all-or-nothing objective.
    Binary reward is intermediate: provides some signal beyond SFT but loses the
    incremental structure that fraction reward preserves.
  predictions:
    - P1: "Δ(Fraction-RLEF, SFT) at LiveCodeBench ≥ 1.5× Δ at HumanEval (primary, p<0.05)"
    - P2: "Δ(Fraction-RLEF, SFT) > Δ(Binary-RLEF, SFT) at hard benchmarks; not at easy benchmarks"
    - P3: "Non-zero reward fraction during RLEF training correlates positively with APPS problem difficulty"
    - P4: "Directional pattern (gap widens with difficulty) holds for DeepSeek-Coder-1.3B sanity check"

variables_summary:
  independent: "Training Method (SFT / RLEF-Binary / RLEF-Fraction) × Benchmark Difficulty (HumanEval / MBPP / LiveCodeBench-Easy/Medium/Hard)"
  dependent_primary: "pass@1 per benchmark; Δ(RLEF, SFT) = RLEF pass@1 - SFT pass@1 at each benchmark"
  controlled: "Base model (DeepSeek-Coder-7B), training data (APPS), eval protocol (bigcode-harness correctness-only, LiveCodeBench 2024-Q4 snapshot), matched gradient steps"

null_hypothesis:
  h0_statement: |
    There is no significant difference in Δ(RLEF, SFT) across benchmark difficulty levels.
    Formally: Δ_LiveCodeBench / Δ_HumanEval ≤ 1.5 (null: gap does not widen meaningfully).
  statistical_test: "Bootstrap two-sample test on Δ ratios; Bonferroni correction for multiple benchmark comparisons"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Difficulty-stratified controlled comparison of RLEF vs SFT; first reproducible open-source characterization of the difficulty-scaling relationship; embedded reward formulation ablation (binary vs fraction) in same framework"
  differentiation_summary: |
    Prior work (CodeRL, PPOCoder, RLTF) each evaluates RLEF vs SFT on subsets of benchmarks
    using different base models, training data, and protocols — making cross-study comparison
    impossible. RLEF-2024 (Gehring et al.) provides strongest evidence for difficulty-scaling
    but uses a non-reproducible Meta internal model. Our study provides the first reproducible,
    controlled, multi-benchmark study using public infrastructure (DeepSeek-Coder-7B, TRL, APPS,
    bigcode-harness). The mechanistic proxy test (P3: non-zero reward fraction by difficulty)
    is a novel empirical handle on the proposed causal mechanism.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
