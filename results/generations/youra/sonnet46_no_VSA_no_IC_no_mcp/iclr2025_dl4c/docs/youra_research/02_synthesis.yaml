experimental_scope:
  models:
    - "DeepSeek-Coder-7B-base (primary)"
    - "DeepSeek-Coder-1.3B-base (sanity check, P4)"
  datasets:
    - "APPS (training: ~5000 problems with unit tests)"
    - "HumanEval (evaluation: 164 problems)"
    - "MBPP (evaluation: 374 problems)"
    - "LiveCodeBench 2024-Q4 snapshot (evaluation: Easy/Medium/Hard splits)"
  baselines:
    - "SFT on APPS (DeepSeek-Coder-7B)"
    - "RLEF-Binary on APPS (GRPO, binary reward)"
    - "RLEF-Fraction on APPS (GRPO, fraction-of-tests reward)"

measurement_plan:
  data_collection:
    - source: "TRL GRPO training logs — non-zero reward fraction per batch, stratified by APPS difficulty bucket (P3)"
    - source: "bigcode-evaluation-harness pass@1 and pass@10 on all evaluation benchmarks for all 3 trained models"
    - source: "APPS and LiveCodeBench problem-type distribution statistics (supplementary; Prof. Rex's recommendation)"
  procedure:
    - step: "1. Check SFT ceiling: run DeepSeek-Coder-7B zero-shot on HumanEval; if ≥90%, switch primary to 1.3B"
    - step: "2. SFT fine-tuning: APPS train split, cross-entropy, matched gradient steps"
    - step: "3. RLEF-Binary fine-tuning: GRPO from same base, binary reward via APPS test executor (sandboxed)"
    - step: "4. RLEF-Fraction fine-tuning: GRPO from same base, fraction-of-tests reward via APPS test executor"
    - step: "5. Evaluation: bigcode-harness correctness-only on HumanEval, MBPP, LiveCodeBench-Q4 snapshot"
    - step: "6. Compute Δ ratios with bootstrap 95% CIs; Bonferroni correction"
    - step: "7. 1.3B sanity check: repeat steps 2-6 with DeepSeek-Coder-1.3B"
  success_criteria:
    - "P1 confirmed: Δ_LiveCodeBench/Δ_HumanEval ≥ 1.5, p < 0.05"
    - "P2 confirmed: significant interaction effect (reward type × difficulty) with fraction > binary at hard"
    - "P3 confirmed: monotonic positive correlation between APPS problem difficulty and non-zero RLEF reward fraction"
    - "P4 confirmed: directional pattern holds at 1.3B (Δ ratio ≥ 1.0)"

validation:
  internal_validity:
    - "Same base model checkpoint for all 3 training methods eliminates model-variation confound"
    - "Same APPS training data (same random split) eliminates data confound"
    - "Matched gradient steps eliminates compute confound"
    - "Correctness-only evaluation eliminates time-limit confound (Prof. Pax's concern)"
    - "LiveCodeBench 2024-Q4 snapshot eliminates temporal contamination confound"
  external_validity:
    - "Results may not generalize beyond 7B-scale models (explicitly scoped; 1.3B sanity check added)"
    - "Results may not generalize to non-Python or non-function-level coding tasks"
    - "APPS training coverage of LiveCodeBench-Hard may be limited (difficulty extrapolation concern)"
    - "Reproducibility depends on exact package versions (TRL, bigcode-harness) — pin versions in code release"

discussion_synthesis:
  key_insights:
    - "The difficulty-scaling relationship reframes RLEF not as 'universally better than SFT' but as 'increasingly better as difficulty increases' — a more precise and testable claim"
    - "Binary reward is an intermediate case: better than SFT but worse than fraction reward at high difficulty; the discussion revealed this is testable as a reward-difficulty interaction"
    - "The partial-success learning signal mechanism (P3) provides a novel empirical handle: training monitoring data can directly validate the mechanistic explanation without additional experiments"
    - "The 'SFT signal void at hard difficulty' concept is the central causal claim — its empirical test (APPS Hard coverage analysis + SFT ceiling check) is a prerequisite step"
  breakthrough_moments:
    - "Exchange 1 (Dr. Nova): reframe from 'does RLEF work?' to 'at what difficulty does execution feedback become irreplaceable?' — this unlocked the difficulty-scaling hypothesis"
    - "Exchange 4 (Prof. Pax): scope to correctness-only evaluation (no time limits) — critical scope reduction that makes the experiment clean and feasible"
    - "Exchange 5 (Dr. Ally): embed reward formulation ablation into same framework — one experiment answers both Gap 1 and Gap 2"
    - "Exchange 6 (Prof. Rex): distinguish 'difficulty generalization' from 'difficulty extrapolation' — deepened the mechanism understanding"
    - "Exchange 7 (Dr. Nova): solve SFT ceiling concern by adding 1.3B secondary model — elegant dual solution to two concerns"
  resolved_tensions:
    - "SFT ceiling at DeepSeek-Coder-7B: resolved by adding 1.3B secondary model with guaranteed headroom"
    - "Time-limit confound at hard benchmarks: resolved by scoping to correctness-only evaluation"
    - "Generalization vs extrapolation distinction: resolved by reframing mechanism as partial-success gradient (works for both)"
    - "N=1 model size concern: resolved by adding 1.3B sanity check as P4"
