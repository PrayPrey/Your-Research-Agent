model_name: "deepseek-ai/deepseek-coder-7b-base"
fallback_model_name: "deepseek-ai/deepseek-coder-1b3-base"
ceiling_check_threshold: 0.90

training:
  lr: 1.0e-5
  batch_size: 4
  grad_accum: 8
  epochs: 3
  max_length: 1024
  max_new_tokens: 512
  seed: 42
  precision: "bfloat16"
  grad_clip: 1.0
  warmup_steps: 100
  lr_schedule: "cosine"

grpo:
  num_generations: 8
  beta: 0.04
  temperature_rollout: 0.8

reward:
  timeout: 3.0
  temperature_eval: 0.2

paths:
  checkpoints_dir: "checkpoints"
  results_dir: "results/h-e1"
  logs_dir: "logs"
  figures_dir: "docs/youra_research/h-e1/figures"

logging:
  reward_monitoring: "logs/reward_monitoring.jsonl"
  config_dump: "logs/config_dump.json"

bootstrap:
  n_boot: 1000
  seed: 42
  ci_level: 0.95
  gate_ratio: 1.5

bigcode_harness:
  pinned_commit: "FILL_BEFORE_RUN"
