novelty:
  preserved_novelty: "First controlled ablation of token importance metric families for KV eviction under identical experimental conditions (same model, same benchmark, same eviction ratio)"
  key_innovation: "2×2 design (metric type × eviction timing) that disentangles the causal contributions of WHAT to score vs. WHEN to evict — a confound present in all prior KV eviction comparisons. Plus the task-conditional prediction (delta_F1(QA) > delta_F1(Summ)) as a mechanistic test of query-awareness."
  differentiation:
    - prior_work: "H2O (Zhang et al. 2023)"
      difference: "H2O proposes cumulative attention but does not compare it to other metric families. We implement H2O-at-prefill to isolate the metric from the timing confound."
    - prior_work: "SnapKV (Li et al. 2024)"
      difference: "SnapKV claims superiority over H2O but conflates metric type, eviction timing, and model type (instruct vs. base). We control all three."
    - prior_work: "ScissorHands (Liu et al. 2023)"
      difference: "ScissorHands focuses on the persistence property but does not benchmark warm-up attention against other query-aware metrics on LongBench QA tasks."
    - prior_work: "StreamingLLM (Xiao et al. 2023)"
      difference: "StreamingLLM evaluates static eviction on multiple architectures but does not test any query-aware metric. We use it as the lower-bound baseline."

