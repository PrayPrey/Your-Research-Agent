established_facts:
  claims:
    - claim: "Cumulative attention score (H2O) outperforms static sliding window (StreamingLLM) on WikiText-2 perplexity at 20% KV retention"
      status: "BUILD_ON"
      evidence: "Zhang et al. 2023 (H2O, arXiv 2306.14048) — reported <1 PPL degradation vs. 3-5 PPL for StreamingLLM"
    - claim: "SnapKV prefill-observation scoring outperforms H2O on LongBench at 40% KV retention (instruct models)"
      status: "BUILD_ON"
      evidence: "Li et al. 2024 (SnapKV, arXiv 2404.14469) — reported on LLaMA-2/3-chat; BUT evaluation is confounded by model type (instruct vs. base)"
    - claim: "Attention patterns exhibit persistence — importance at step K correlates with importance at step K+20 (Spearman r>0.85)"
      status: "BUILD_ON"
      evidence: "Liu et al. 2023 (ScissorHands, arXiv 2305.17118) — warm-up of 32 steps sufficient on OPT-6.7B"
    - claim: "No controlled ablation exists comparing cumulative attention vs. prefill observation vs. warm-up attention vs. entropy under identical conditions"
      status: "PROVE_NEW"
      evidence: "Gap analysis from Phase 1 — confirmed absence of cross-method controlled comparison"
    - claim: "Prefill-observation importance scoring achieves higher F1 than cumulative-attention scoring on QA tasks (task-conditional advantage)"
      status: "PROVE_NEW"
      evidence: "Novel claim — not tested in any existing paper; to be verified in Phase 4"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    Steps 1-2 (literature verification): BUILD_ON claims are established — skip re-verification.
    Focus verification effort on PROVE_NEW claims (task-conditional metric advantage).
    The timing-confound ablation (H2O-at-prefill vs. H2O-at-decode) is the primary mechanistic test.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-PrefixObs-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under long-context QA inference using LLaMA-2-7B-chat at 50% KV retention on LongBench
    (NarrativeQA, HotpotQA, 2WikiMQA, MuSiQue as QA tasks; GovReport and QMSum as summarization
    contrast), if we apply prefill-observation importance scoring (SnapKV-style query-conditioned
    window over the last W=16 query tokens) versus cumulative-attention scoring (H2O-style, both
    implemented with matched prefill-timing eviction) at matched KV retention budgets (50%),
    then prefill-observation achieves ≥2.0 F1 points higher macro-average than cumulative-attention
    on the 4-task QA subset, with a larger performance gap on QA than on summarization
    (delta_F1(QA) > delta_F1(Summ)), because query-conditioned observation windows selectively
    retain KV entries that are semantically aligned with the specific tokens of the question being
    answered, whereas cumulative attention retains globally-attended structural tokens (initial
    positions, sentence boundaries) that are less discriminative for specific query answering.
  alternative_hypothesis_h0: |
    There is no significant difference in LongBench macro-average F1 between prefill-observation
    scoring and cumulative-attention scoring at 50% KV retention on LLaMA-2-7B-chat (i.e.,
    the 95% bootstrap confidence intervals overlap on the 4-task QA subset).

