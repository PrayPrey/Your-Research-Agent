measurement_plan:
  data_collection:
    - source: "THUDM/LongBench via HuggingFace datasets"
    - source: "LLaMA-2-7B-chat-hf via HuggingFace Hub (meta-llama/Llama-2-7b-chat-hf)"
  procedure:
    - step: "Implement unified KV eviction codebase with pluggable score_fn interface in HuggingFace transformers"
    - step: "Implement M1-M5 as score_fn variants; M6 as positional mask"
    - step: "For each metric condition x KV budget x task: load 100 examples, run inference, compute F1/ROUGE-L"
