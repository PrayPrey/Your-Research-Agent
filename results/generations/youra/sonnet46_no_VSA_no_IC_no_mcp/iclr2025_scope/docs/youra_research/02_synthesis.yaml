    - "P3: H2O_at_prefill_F1 - H2O_at_decode_F1 >= 0.5 (QA tasks)"
    - "Floor: all query-aware metrics beat StreamingLLM by >= 5.0 F1 on QA subset at 50% retention"

validation:
  internal_validity:
    - "Unified codebase with pluggable score_fn — implementation confounds eliminated"
    - "Same model, same benchmark, same budget across all metric conditions"
    - "Fixed random seed for reproducibility"
    - "Bootstrap CI for statistical significance — avoids point-estimate-only reporting (h-m2 lesson)"
  external_validity:
    - "LLaMA-2-7B is widely deployed — results transfer to production systems using this model family"
    - "LongBench is the standard long-context benchmark — results are comparable to existing literature"
    - "Cross-architecture generalization is out of scope for this hypothesis (Gap 3 / Phase 5)"

discussion_synthesis:
  key_insights:
    - "The critical confound in all prior KV eviction comparisons is that metric type and eviction timing are always co-varied — H2O-at-prefill is the missing ablation point"
    - "Task-conditional metric advantage (QA vs summarization) provides a mechanistic falsification path beyond overall benchmark ranking"
    - "h-m2 failure teaches that extreme eviction (80%) on base models makes baseline comparison invalid — 50% retention on instruct models avoids this"
    - "Unified codebase with pluggable score_fn is both a practical contribution and a methodological necessity for fair comparison"
  breakthrough_moments:
    - "Prof. Rex's identification of the timing confound (Exchange 6) — transformed the design from a benchmark paper into a mechanistic study"
    - "Dr. Nova's 2x2 design proposal (Exchange 7) — the H2O-at-prefill ablation condition is the key novel experimental point"
    - "Dr. Sage's minimum sufficient experiment scoping (Exchange 3) — reduced from 250 GPU-hours to 6 GPU-hours without losing scientific value"
  resolved_tensions:
    - "Scope (tractable vs. comprehensive): resolved by 5-task LongBench subset + 100 examples/task"
    - "Statistical power (2.0 F1 gate vs. CI): resolved by requiring bootstrap 95% CI non-overlapping, not just point estimate"
    - "h-m2 failure mode: resolved by instruct model + 50% retention (not base + 80% eviction)"
    - "Metric vs. timing confound: resolved by 2x2 design with H2O-at-prefill as the decoupling condition"
