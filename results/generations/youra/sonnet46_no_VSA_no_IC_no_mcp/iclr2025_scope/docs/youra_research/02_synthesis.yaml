hypothesis_draft:
  title: "Query-Conditioned Prefill Observation Outperforms Cumulative Attention on Extractive QA under KV Compression"
  hypothesis_id: "H-PrefixObs-v1"
  core_claim: |
    Prefill-observation importance scoring (SnapKV-style query-conditioned window) achieves
    ≥2.0 F1 points higher macro-average than cumulative-attention scoring (H2O-style) on
    4-task LongBench QA subset (NarrativeQA, HotpotQA, 2WikiMQA, MuSiQue) at 50% KV retention
    with LLaMA-2-7B-chat, with the advantage being larger on QA than on summarization tasks.
  mechanism: |
    Query-conditioned observation windows selectively retain KV entries that are semantically
    aligned with the specific tokens of the question being answered (Step 1: prefill attention
    to query tokens identifies answer-relevant positions). This produces higher probability of
    preserving answer-relevant context in the compressed cache (Step 2: query-aligned retention
    improves extractive QA F1). Summarization tasks have diffuse query signals, reducing the
    advantage of query-conditioning over globally-salient cumulative attention (Step 3:
    task-conditional prediction). A 2x2 ablation (metric x timing) disentangles the metric
    effect from the timing effect (prefill vs decode eviction).
  predictions:
    - P1: "Prefixobs macro-F1(QA) - Cumulative_at_prefill macro-F1(QA) >= 2.0 at 50% KV retention, 95% CI non-overlapping"
    - P2: "delta_F1(QA) > delta_F1(Summ) by at least 1.0 percentage point (task-conditional advantage)"
    - P3: "H2O-at-prefill F1(QA) > H2O-at-decode F1(QA) by at least 0.5 points (timing effect exists)"

variables_summary:
  independent: "Importance metric type (6 conditions: prefixobs, cumulative-at-prefill, cumulative-at-decode, warm-up, entropy, static) x Eviction timing (prefill, decode) x KV retention budget (0.40, 0.50, 0.60)"
  dependent_primary: "LongBench macro-average F1 on 4-task QA subset (NarrativeQA, HotpotQA, 2WikiMQA, MuSiQue), 100 examples/task"
  controlled: "Model (LLaMA-2-7B-chat-hf), codebase (unified HuggingFace + pluggable score_fn), hardware (A100 40GB, FP16), sequence length cap (4096 tokens), random seed (42)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in LongBench macro-average F1 between prefill-observation
    scoring and cumulative-attention-at-prefill scoring at 50% KV retention on LLaMA-2-7B-chat
    (95% bootstrap CIs overlap on the 4-task QA subset).
  statistical_test: "Bootstrap confidence intervals (1000 resamples) on macro-average F1; 95% CI non-overlapping as significance criterion"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First 2x2 ablation (metric type x eviction timing) on identical model/benchmark/budget — disentangles what-to-score from when-to-evict. First task-conditional prediction for metric advantage (QA vs summarization)."
  differentiation_summary: |
    Prior comparisons (H2O vs SnapKV in SnapKV paper) conflate metric type, eviction timing,
    and model family. H2O uses base models + decode eviction; SnapKV uses instruct models +
    prefill eviction. No prior work implements both metrics on the same model at the same timing
    with the same benchmark. The H2O-at-prefill condition (M2) is a novel ablation point that
    does not exist in any published paper.

