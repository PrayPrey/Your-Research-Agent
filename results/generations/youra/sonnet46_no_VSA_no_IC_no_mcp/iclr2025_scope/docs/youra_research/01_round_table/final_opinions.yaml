final_opinions:
  perspective_novelty:
    agent: "Dr. Nova"
    icon: "🔭"
    assessment: |
      STRONG. The 2x2 metric×timing design isolates a mechanistic question no prior paper has
      asked. The task-conditional prediction (delta_F1(QA) > delta_F1(Summ)) is a genuinely
      novel testable claim that goes beyond "which method wins overall." This reframes the KV
      eviction literature around mechanism rather than benchmark ranking. The H2O-at-prefill
      ablation condition does not exist in any published paper — it is the key novel experimental
      point that enables causal attribution of metric type vs. eviction timing.
    key_points:
      - "2x2 design (metric x timing) enables causal attribution — no prior paper does this"
      - "Task-conditional prediction (delta_F1(QA) > delta_F1(Summ)) is mechanistically novel"
      - "H2O-at-prefill is an unpublished ablation condition that unlocks the timing effect test"
      - "Reframes KV eviction from benchmark ranking to mechanistic understanding"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      STRONG. All three predictions are binary-testable with quantitative thresholds (P1: ≥2.0 F1,
      95% CI non-overlapping; P2: delta_F1(QA) > delta_F1(Summ) by 1.0pp; P3: timing effect ≥0.5).
      The 2x2 design allows causal attribution of metric vs. timing. Null hypothesis is clearly
      defined (no significant metric difference at 50% retention, CIs overlap). Attention entropy
      formula is specified mathematically. Ready for Phase 2B experimental protocol design.
    key_points:
      - "P1 gate: prefixobs_F1 - cumulative_at_prefill_F1 >= 2.0, 95% CI non-overlapping"
      - "P2 gate: delta_F1(QA) > delta_F1(Summ) by >= 1.0pp — task-conditional test"
      - "P3 gate: H2O-at-prefill F1 > H2O-at-decode F1 by >= 0.5 — timing isolation test"
      - "Null hypothesis clearly defined — CIs overlap = no support for metric mechanism"
      - "Attention entropy formula specified: H(i) = -sum_h sum_t alpha * log(alpha + eps)"

  perspective_significance:
    agent: "Dr. Sage"
    icon: "🎯"
    assessment: |
      STRONG. Resolves the practitioners' metric-choice problem: currently every practitioner
      deploying KV eviction must choose H2O vs. SnapKV vs. ScissorHands without a principled
      basis (choices are confounded across different evaluation setups). A controlled ablation
      isolating the metric component provides direct, actionable guidance. Task-conditional
      metric selection (different metric for QA vs. summarization) is immediately actionable
      for multi-task deployment systems. Addresses a real gap in 2023-2024 literature with
      minimum sufficient experimental scope (~6 GPU-hours on A100).
    key_points:
      - "Resolves practitioners' metric-choice problem with controlled evidence"
      - "Task-conditional guidance (best metric is task-dependent) is immediately actionable"
      - "Minimum sufficient scope: 5-task LongBench subset, 100 examples/task, ~6 GPU-hours"
      - "Publication-worthy as controlled ablation study filling confirmed gap in literature"

  perspective_plausibility:
    agent: "Prof. Pax"
    icon: "⚙️"
    assessment: |
      STRONG. Implementation is highly feasible. SnapKV (FasterDecoding/SnapKV) and StreamingLLM
      (mit-han-lab/streaming-llm) have working HuggingFace-compatible repos. H2O and ScissorHands
      need ~50-80 lines each. Attention entropy is ~10 lines. The unified codebase with pluggable
      score_fn eliminates implementation confounds and is the right engineering approach. LLaMA-2-7B-chat-hf
      runs on single A100 40GB at FP16. LongBench is a standard HuggingFace dataset with existing
      eval scripts. Total compute: ~6 GPU-hours. No new infrastructure, no new datasets, no new models.
    key_points:
      - "Unified codebase with pluggable score_fn eliminates implementation confounds"
      - "SnapKV and StreamingLLM have working repos; H2O/ScissorHands need 50-80 lines each"
      - "LLaMA-2-7B-chat-hf + LongBench = standard stack, no new infrastructure"
      - "Approximately 6 GPU-hours on A100 — well within Phase 4 budget"
      - "All models and datasets publicly available without gating"

  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      The hypothesis that emerged is well-structured and avoids all known failure modes from h-m2.
      Core claim: prefill-observation importance scoring achieves ≥2.0 F1 higher than cumulative-attention
      (both at matched prefill timing) on 4-task LongBench QA subset at 50% KV retention with
      LLaMA-2-7B-chat, with the advantage being larger on QA than on summarization (delta_F1(QA) >
      delta_F1(Summ)). Mechanism: query-conditioned observation windows retain semantically query-aligned
      tokens, whereas cumulative attention retains globally-salient structural tokens — the query-conditioning
      advantage manifests specifically on extractive QA where the query tokens clearly identify relevant
      context spans. The 2x2 design (metric x timing) enables causal attribution. All h-m2 failure
      conditions are inverted: instruct model (not base), 50% retention (not 80% eviction), metric
      comparison (not LoRA interaction).
    key_points:
      - "Avoids h-m2 failure: instruct model + 50% retention + no LoRA interaction"
      - "2x2 design provides causal attribution of metric vs. timing effects"
      - "Task-conditional prediction (P2) provides mechanistic falsification path"
      - "All three predictions are independently falsifiable with quantitative thresholds"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      Three concerns raised, all mitigated in the final design. Remaining watch items for Phase 2B:
      (1) Attention entropy formula needs code-level precision before implementation.
      (2) The 2.0 F1 gate was calibrated from SnapKV paper numbers — bootstrap CI is essential, not
      optional, and the gate should be treated as target effect size for power analysis.
      (3) H2O-at-prefill changes the original H2O design (decode-timed) — Phase 2B should acknowledge
      this as a fair vs. unfair comparison debate and address it in the experimental design.
    key_points:
      - "Attention entropy: H(i) = -sum_h sum_t alpha_{h,t,i} * log(alpha_{h,t,i} + 1e-9), avg over heads"
      - "2.0 F1 gate: treat as target effect size, require bootstrap 95% CI non-overlapping"
      - "ScissorHands included as M4 — adds ~80 lines + 1.5 GPU-hours, worth it for completeness"
      - "H2O-at-prefill is a design modification from original H2O — acknowledge in Phase 2B write-up"

