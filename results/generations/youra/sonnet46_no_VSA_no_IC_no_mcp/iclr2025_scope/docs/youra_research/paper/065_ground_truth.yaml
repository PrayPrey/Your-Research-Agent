# ============================================================================
# METHODOLOGY (from 03_refinement.yaml, 02b_verification_plan.md, 03_prd.md)
# ============================================================================

methodology:
  model: "meta-llama/Llama-2-7b-chat-hf"
  model_type: "instruction-tuned, 7B decoder-only"
  dataset: "THUDM/LongBench"
  tasks_qa: ["narrativeqa", "hotpotqa", "2wikimqa", "musique"]

  key_hyperparameters:
    examples_per_task: 100
    seed: 42
    max_context_length: 4096
    retention_ratio: 0.50
    observation_window_W: 16
    max_new_tokens: 50
    torch_dtype: "float16"
    device_map: "auto"
    attn_implementation: "eager"

  score_fn_M1: "mean attention weight from last W=16 query tokens at prefill end (per-head, per-layer)"
  score_fn_M2: "cumulative sum of attention weights over all prefill steps (per-head, per-layer)"
  score_fn_correctness: "Both confirmed correct by code review; match SnapKV (M1) and H2O (M2) reference implementations"
  source: "h-e1/04_validation.md, 03_refinement.yaml"

  kv_shape_eviction:
    method: "top-k indexing and gather per attention head per layer"
    k_value: 2048
    full_seq_len: 4096
    confirmed_layers: "32/32 LLaMA-2 transformer layers"
    shape_log_confirmed: true
    source: "h-e1/04_validation.md — Mechanism Verification table"

# ============================================================================
# IMPLEMENTATION FAILURE FACTS
# ============================================================================

implementation_failure:
  root_cause: "DynamicCache reconstruction from raw (key, value) tensors is incompatible with transformers 5.x"
  api_used: "DynamicCache(ddp_cache_data=evicted_kv_tensors)"
  symptom: "F1=0.00 on all completed M1 tasks despite correct KV shapes"
  causally_attributed: true
  attribution_evidence: "M0 (identical pipeline, no reconstruction) = 0.0875; M1 (with reconstruction) = 0.00"
  corrected_approach: "LlamaAttention.forward() monkey-patching (SnapKV pattern)"
  corrected_approach_reference: "github.com/FasterDecoding/SnapKV — snapkv_utils.py:update_kv()"

