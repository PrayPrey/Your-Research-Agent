# Stage 3: End-to-End KD — 920M tokens, LR=1e-4
LOAD:
- MOHAWK_REPO/configs/Llama/8B/bases/teacher.yaml
- MOHAWK_REPO/configs/Llama/8B/bases/llama_mamba2.yaml
- MOHAWK_REPO/configs/Llama/8B/bases/optimizer.yaml
- MOHAWK_REPO/configs/Llama/8B/bases/train.yaml
- MOHAWK_REPO/configs/management.yaml

DistillConfig:
  name: h-e1-stage3
  type: supervised

ComponentsConfig:
  MixerModel:
    input: {d_model: 4096, n_layer: 32, lm_head_prenorm: rms, norm_epsilon: !!float 1e-5}

TeacherConfig:
  dir: meta-llama/Llama-3.1-8B
  model_dtype: bfloat16
  mixed_precision: true

TrainConfig:
  seed: 42
  n_tokens: !!float 9.2e8
  effective_batch_size: 256
  mixed_precision: true
  model_dtype: bfloat16
  activation_checkpointing: true
  tokenizer: meta-llama/Llama-3.1-8B

TrainDataConfig:
  loaders: [HFDataset, Tokenize, PackingDataLoader, TorchDataLoader]
  HFDataset:
    path: monology/pile-uncopyrighted
    
    streaming: true
    split: train
  Tokenize:
    tokenizer: meta-llama/Llama-3.1-8B
    collate_type: text
  PackingDataLoader:
    max_seq_len: 2048
  TorchDataLoader:
    num_workers: 4
    batch_size: 32

OptimizerConfig:
  optimizer: AdamW
  lr: 1.0e-04
  betas: [0.9, 0.999]
  weight_decay: 0.1
  scheduler:
    name: wsd
    warmup_steps: 500
    decay_steps: 0.1
    min_lr: 1.0e-8

ManagementConfig:
  wandb:
    project: "youra-h-e1"
    entity: "anonymous"
  paths:
    base_dir: H_E1_CHECKPOINT_DIR/mohawk
    save_dir: H_E1_CHECKPOINT_DIR/mohawk/stage3
    tmp_dir: H_E1_CHECKPOINT_DIR/mohawk/tmp_stage3
  env_vars:
    WANDB_MODE: "disabled"
    HF_TOKEN: ""
    LOGURU_LEVEL: "INFO"
    NCCL_DEBUG: "WARN"

LoadConfig:
  model:
    - path: STAGE2_CHECKPOINT
      strict: true
