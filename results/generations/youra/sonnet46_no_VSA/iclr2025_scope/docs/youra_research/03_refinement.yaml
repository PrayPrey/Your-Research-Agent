established_facts:
  claims:
    - claim: "MOHAWK 3-stage distillation pipeline converts transformers to SSM architecture with demonstrated accuracy retention at 1.3B scale [MOHAWK NeurIPS 2024]"
      status: "BUILD_ON"
      evidence: "Phi-1.5→Phi-Mamba achieves strong downstream retention on short-context tasks (Winogrande, ARC, HellaSwag) with 3B distillation tokens"
    - claim: "LAWCAT linear attention distillation achieves >90% passkey retrieval at 22K tokens from Mistral-7B with <1B distillation tokens [Liu et al., EMNLP 2025]"
      status: "BUILD_ON"
      evidence: "arxiv:2509.18467; S-NIAH and BABILong benchmarks; <0.1% pre-training token budget"
    - claim: "Scratch-trained SSMs (Falcon3-Mamba, RecurrentGemma, RWKV6) show systematic retrieval degradation vs. transformers on LongBench v2 multi-doc QA and synthetic categories [Overflow Prevention, 2025]"
      status: "BUILD_ON"
      evidence: "arxiv:2505.07793; Overflow Prevention paper evaluates recurrent models on LongBench v2 with category breakdown"
    - claim: "MOHAWK matrix approximation fidelity (Frobenius error) correlates with downstream accuracy — SSD ≈0.097, Toeplitz ≈12 at N=64 [MOHAWK, 2024 Tables 6-7]"
      status: "BUILD_ON"
      evidence: "MOHAWK ablation tables; correlation established at sequence length 512"
    - claim: "MOHAWK Hybrid-4 (retaining 4 attention layers) recovers 66.0 vs 67.2 teacher average across lm-eval tasks [MOHAWK, 2024 Table 2]"
      status: "BUILD_ON"
      evidence: "Establishes that 4 retained attention layers are near-sufficient for general tasks; full replacement at 8B scale is unverified"
    - claim: "Task-type × strategy interaction on LongBench v2 for converted models (MOHAWK vs LAWCAT) with fixed base model"
      status: "PROVE_NEW"
      evidence: "No prior paper evaluates both strategies on the same LongBench v2 task-category splits with the same base model"
    - claim: "LAWCAT Conv1D local dependency preservation produces shallower depth-degradation slope on retrieval vs. MOHAWK-SSM bounded state"
      status: "PROVE_NEW"
      evidence: "Mechanistic prediction; needle-depth sweep needed to confirm"
