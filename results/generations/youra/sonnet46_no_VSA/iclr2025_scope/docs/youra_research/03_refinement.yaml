variables:
  independent:
    - name: "Conversion Strategy"
      type: "categorical"
      operationalization: "Type of sub-quadratic conversion applied to LLaMA-3-8B"
      levels:
        - "MOHAWK-SSM (Stage 1+2: matrix alignment + hidden-state alignment)"
        - "LAWCAT-LinearAttention (Conv1D + normalized gated linear attention)"
        - "Hybrid-4 (MOHAWK Stage 3 only, retaining 4 middle attention layers)"
    - name: "Task Category"
      type: "categorical"
      operationalization: "LongBench v2 task category (6 categories)"
      levels:
        - "single-doc QA"
        - "multi-doc QA"
        - "summarization"
        - "few-shot"
        - "synthetic"
        - "code"
  dependent:
    - name: "Normalized Accuracy Degradation (Δ_norm)"
      type: "continuous"
      operationalization: "Δ_norm = (Acc_teacher − Acc_student) / Acc_teacher; per category, per strategy. Range [0,1] where 0=no degradation, 1=complete failure."
      primary: true
    - name: "Needle-Depth Accuracy Slope (β_depth)"
      type: "continuous"
      operationalization: "Logistic regression coefficient of accuracy on needle depth percentile within multi-doc QA and synthetic tasks. Negative slope = deeper needles harder to retrieve."
      primary: false
    - name: "Overall LongBench v2 Accuracy"
      type: "continuous"
      operationalization: "Macro-average accuracy across all 6 categories and 503 questions"
      primary: false
  controlled:
    - name: "Base Model"
      operationalization: "Fixed: LLaMA-3-8B (Meta); same weights used as teacher and starting point for all conversions"
    - name: "Distillation Token Budget"
      operationalization: "Fixed: ≤1B tokens from C4/RedPajama with 2048-token max sequence length"
    - name: "Evaluation Benchmark"
      operationalization: "Fixed: THUDM/LongBench v2 (503 questions, 6 categories, 8k–2M context)"
    - name: "Evaluation Framework"
      operationalization: "Fixed: EleutherAI/lm-evaluation-harness with LongBench v2 PR #3256"
    - name: "Parameter Count"
      operationalization: "~8B parameters for all converted models (approximate match)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "MOHAWK-SSM replaces attention layers with SSD structured mixer. The mixer approximates the attention matrix via semi-separable structure. At short ranges (N≤512), Frobenius error is low (≈0.097 for SSD [MOHAWK, 2024]). At long ranges (N>4k), approximation error may grow, but this is the first gate: if error grows sub-linearly, the architectural mechanism is viable."
      evidence: "MOHAWK Tables 6-7: SSD achieves lowest Frobenius error among mixer families at 512 tokens; stage complementarity confirmed (Stage 1+2 > Stage 3 alone, Table 3)"
      falsifier: "If log-log Frobenius slope > 0.5 or 90th percentile error > 0.3 at N=8k, the SSM approximation is too lossy for long-context claims"
    - step: 2
      description: "Bounded state in MOHAWK-SSM compresses context history into fixed-size state vectors. Exact needle retrieval (locating a specific token at position k among 30k tokens) requires the state to preserve positional identity of k. SSM state updates (h_t = A·h_{t-1} + B·x_t) cause exponential forgetting of early tokens. Multi-doc QA and synthetic tasks with needles at varying depths directly probe this. LAWCAT's causal Conv1D applies local attention in a sliding window before the linear attention layer, preserving recent-token identity for short-range retrieval hops."
      evidence: "Overflow Prevention paper [2505.07793]: scratch-trained SSMs show systematic degradation on LongBench v2 multi-doc QA and synthetic vs. transformers. LAWCAT paper: Conv1D enhances local dependency modeling [Liu et al., 2025]."
      falsifier: "If both MOHAWK and LAWCAT show identical depth-degradation slopes (|β_depth^SSM| < 2× |β_depth^LAWCAT|), the Conv1D local preservation mechanism is unsupported"
    - step: 3
      description: "Generation-heavy tasks (summarization, few-shot) tolerate lossy context compression. Summarization requires integrating semantics across the full document, which SSM state accumulation handles reasonably. Few-shot requires copying a pattern from a single example, which needs only shallow local attention. Both are more forgiving of exact-position forgetting than needle retrieval. Therefore, MOHAWK-SSM's degradation is disproportionately concentrated in retrieval categories, while generation categories retain more performance. LAWCAT's Conv1D advantage is less pronounced for generation tasks since global linear attention is sufficient."
      evidence: "Predicted from SSM theoretical properties; consistent with scratch-trained SSM LongBench patterns in Overflow Prevention [2505.07793]"
      falsifier: "If MOHAWK-SSM degrades uniformly across all 6 categories (no task-type interaction, p>0.01 in mixed-effects model), the causal chain is unsupported"
  key_tension: "Architectural limitation vs. distillation curriculum confound: retrieval degradation may reflect short-only distillation (no 32k sequences in training) rather than inherent SSM bounded-state limits. Resolution requires Stage 2 ablation (curriculum expansion), deferred to Phase 4."
  evidence_summary: |
    Three independent bodies of evidence support the causal chain:
    (1) MOHAWK NeurIPS 2024: matrix approximation fidelity × accuracy correlation established; stage complementarity confirmed
    (2) LAWCAT EMNLP 2025: Conv1D local dependency mechanism demonstrated; 22K retrieval at <1B token budget
    (3) Overflow Prevention 2025: scratch-trained SSM retrieval degradation on LongBench v2 directly (empirical baseline)
    Gap: no prior work applies (1)+(2) to same base model on (3)'s benchmark.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "MOHAWK matrix approximation quality at N=512 is representative of long-range (N≤8k) approximation quality (sub-linear error scaling)"
    supporting_evidence: "MOHAWK shows low Frobenius error at N=64/512; SSD theoretical expressivity analysis in MOHAWK paper"
    consequence_if_violated: "If Frobenius error scales super-linearly, retrieval degradation is attributable to approximation breakdown not architecture; hypothesis scope must be reframed as 'distillation failure' not 'architectural trade-off'"
  - id: "A2"
    assumption: "LAWCAT's causal Conv1D provides meaningful local attention within the first K tokens of any retrieval hop (K ≈ convolution width)"
    supporting_evidence: "LAWCAT paper: depth-separable Conv1D layer enhances local dependency modeling; competitive S-NIAH retrieval performance [Liu et al., 2025]"
    consequence_if_violated: "If depth-slope is identical for LAWCAT and MOHAWK, Conv1D mechanism does not differentiate retrieval profiles; secondary prediction P2 fails"
  - id: "A3"
    assumption: "LLaMA-3-8B distillation with ≤1B tokens achieves sufficient alignment (perplexity gap ≤5%, L2 ratio ≤0.15) for interpretable downstream comparison"
    supporting_evidence: "LAWCAT: <0.1% pre-training token budget for Mistral-7B; MOHAWK: 3B tokens for Phi-1.5 1.3B model; extrapolated to 8B requires verification"
    consequence_if_violated: "If alignment fails at 1B token budget, results reflect undertrained student not architectural limits; more tokens required (budget expansion)"
  - id: "A4"
    assumption: "LongBench v2's 6 task categories provide sufficient contrast between retrieval-heavy (multi-doc QA, synthetic) and generation-heavy (summarization, few-shot) tasks for the interaction test"
    supporting_evidence: "LongBench v2 paper: 503 diverse questions designed with explicit task-category diversity; Overflow Prevention confirms category-specific patterns"
    consequence_if_violated: "If categories are not sufficiently distinct in retrieval demand, the interaction test lacks statistical power; additional contrast measures needed"
  - id: "A5"
    assumption: "The Hybrid-4 baseline using middle-layer attention retention (MOHAWK's best hybrid) is the appropriate control for 'attention necessity'"
    supporting_evidence: "MOHAWK Table 2: Hybrid-4 (unspecified layers, likely middle) achieves 66.0 vs 67.2 teacher; represents current best-known hybrid"
    consequence_if_violated: "If only early or late layers matter, Hybrid-4's middle-layer choice is suboptimal; layer-localization ablation needed (Phase 4)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - LLaMA-3-8B class models (7-9B parameter decoder-only transformers)
    - Fixed-budget distillation (≤1B tokens) with short-context curriculum (≤2048 tokens)
    - LongBench v2 task categories as the evaluation domain
    - MOHAWK-SSM (Stage 1+2 with SSD mixer) and LAWCAT (Conv1D + gated linear attention) conversion strategies
    - Retrieval-heavy vs. generation-heavy task category contrast
  does_not_apply_to: |
    - KV cache eviction or compression approaches (H-M2 failure domain — excluded)
    - Scratch-trained SSM models without transformer prior (different hypothesis)
    - Models >30B parameters (computational scope)
    - Mixed-length distillation curriculum (distillation-curriculum interaction — Phase 4 extension)
    - Layer-localization specifics (early/middle/late hybrid — Phase 4 extension)
    - Cross-family capability comparisons without fixed base model (H-E1 failure domain — excluded)
  known_limitations: |
    - Architecture-vs-curriculum confound unresolved at Phase 2A: retrieval degradation may reflect short-only distillation, not SSM bounds
    - Layer attribution deferred: "some attention layers matter" but which ones requires 3 additional hybrid trains
    - Generalization to other base models (Mistral-7B, Phi-3) not tested in primary experiment
    - LongBench v2 (503 questions) may have limited statistical power for per-category interaction tests (need to check power analysis)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "MOHAWK-SSM converted LLaMA-3-8B shows ≥2× larger normalized accuracy degradation (Δ_norm) on retrieval-heavy LongBench v2 categories (multi-doc QA, synthetic) compared to generation-heavy categories (summarization, few-shot), with a statistically significant task-type × strategy interaction (p<0.01, mixed-effects model, Holm correction)"
    test_method: "Convert LLaMA-3-8B with MOHAWK Stage 1+2 (≤1B tokens, C4, 2048-token max). Evaluate on LongBench v2 full 503-question set. Compute Δ_norm per category. Fit mixed-effects model: Δ_norm ~ TaskType * Strategy + (1|Task). Test interaction term."
    success_criterion: "Δ_norm^SSM(retrieval) / Δ_norm^LAWCAT(retrieval) ≥ 2.0 with 95% bootstrap CI strictly above 1.0; interaction term p<0.01 after Holm correction"
    falsification: "If bootstrap CI includes or falls below 2.0, or if interaction term p≥0.01, H-Conv1D-v1 primary prediction fails"
  - id: "P2"
    primary: false
    statement: "LAWCAT-converted LLaMA-3-8B exhibits a significantly shallower needle-depth accuracy degradation slope than MOHAWK-SSM-converted, quantified as |β_depth^SSM| ≥ 2× |β_depth^LAWCAT| in logistic regression of accuracy on needle depth percentile"
    test_method: "Evaluate both models on LongBench v2 multi-doc QA and synthetic subsets with needle-depth logging. Fit per-model logistic regression: P(correct) ~ DepthPercentile + (1|Task). Compare β_depth coefficients."
    success_criterion: "|β_depth^SSM| ≥ 2× |β_depth^LAWCAT| with non-overlapping 95% CIs; at least one β_depth significantly < 0 (p<0.01, Holm)"
    falsification: "If β_depth slopes are statistically indistinguishable (overlapping CIs), Conv1D local-context mechanism does not produce differential retrieval profile"
  - id: "P3"
    primary: false
    statement: "Hybrid-4 (MOHAWK with 4 middle attention layers retained) shows ≤5% normalized degradation across all 6 LongBench v2 categories, compared to ≥10% for full MOHAWK-SSM replacement on at least one retrieval-heavy category"
    test_method: "Train Hybrid-4 with MOHAWK Stage 3 only (≤1B tokens, retaining 4 middle attention layers). Evaluate on LongBench v2 all categories. Compare normalized degradation vs. full MOHAWK-SSM."
    success_criterion: "max(Δ_norm^Hybrid4) ≤ 0.05 across all categories AND Δ_norm^MOHAWK-SSM ≥ 0.10 on at least one of {multi-doc QA, synthetic}"
    falsification: "If full MOHAWK-SSM matches Hybrid-4 within 5% on retrieval categories, full replacement is adequate and attention-layer necessity is not supported"

