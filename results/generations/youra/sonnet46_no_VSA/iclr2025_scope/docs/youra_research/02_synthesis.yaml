hypothesis_draft:
  title: "Task-Type × Conversion-Strategy Interaction in Sub-Quadratic Transformer Conversion (H-Conv1D-v1)"
  hypothesis_id: "H-Conv1D-v1"
  core_claim: |
    Under fixed-budget (≤1B tokens) short-context distillation, converting LLaMA-3-8B
    to MOHAWK-SSM vs. LAWCAT-linear-attention produces significantly different
    task-type accuracy profiles on LongBench v2: MOHAWK-SSM exhibits ≥2× larger
    normalized degradation on retrieval-heavy categories than generation-heavy categories,
    while LAWCAT exhibits a more uniform profile, due to MOHAWK's bounded state
    losing exact needle-token positions vs. LAWCAT's Conv1D preserving local context.
  mechanism: |
    Step 1: MOHAWK replaces attention with SSD structured mixer.
    Matrix approximation fidelity is established at short ranges (Frobenius ≈0.097 at N=64).

    Step 2: SSM bounded state (h_t = A·h_{t-1} + B·x_t) causes exponential forgetting of
    early token positions. Retrieval-heavy tasks require exact needle addresses;
    generation tasks tolerate lossy compression.

    Step 3: LAWCAT's causal Conv1D provides local attention in a sliding window,
    preserving short-range token identity for retrieval hops.
    This produces shallower depth-degradation slope than MOHAWK-SSM.
  predictions:
    - P1: "MOHAWK-SSM: Δ_norm(retrieval) / Δ_norm(generation) ≥ 2× with 95% bootstrap CI; significant task-type × strategy interaction p<0.01"
    - P2: "|β_depth^SSM| ≥ 2× |β_depth^LAWCAT| in needle-depth logistic regression on multi-doc QA and synthetic tasks"
    - P3: "Hybrid-4: ≤5% Δ_norm across all categories vs. MOHAWK full-replacement ≥10% on retrieval categories"

variables_summary:
  independent: "Conversion Strategy (3 levels: MOHAWK-SSM, LAWCAT-LinearAttention, Hybrid-4) × Task Category (6 LongBench v2 categories)"
  dependent_primary: "Normalized accuracy degradation Δ_norm = (Acc_teacher − Acc_student) / Acc_teacher per category"
  controlled: "Base model (LLaMA-3-8B fixed), distillation budget (≤1B tokens), evaluation benchmark (LongBench v2)"

null_hypothesis:
  h0_statement: |
    There is no significant task-type × conversion-strategy interaction:
    normalized accuracy degradation is uniform across LongBench v2 categories
    for both MOHAWK-SSM and LAWCAT-linear-attention conversions.
  statistical_test: "Mixed-effects model: Δ_norm ~ TaskType * Strategy + (1|Task)"
  significance_level: 0.01

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled within-subject comparison of MOHAWK-SSM vs. LAWCAT-linear-attention on LongBench v2 with fixed base model (LLaMA-3-8B) — eliminates capability confound that invalidated H-E1"
  differentiation_summary: |
    - MOHAWK paper: different base model, no LongBench v2, no cross-strategy comparison
    - LAWCAT paper: different base model, synthetic retrieval tasks only
    - Overflow Prevention: scratch-trained models (not converted); provides reusable baseline
    - H-E1 (failed): between-family capability gap dominated variance; fixed base model eliminates this
    - H-M2 (partial): KV eviction approach; no eviction mechanism in current hypothesis

