measurement_plan:
  data_collection:
    - source: "Day 0: Frobenius error at N ∈ {512, 1k, 2k, 4k, 8k} — matrix fitting gate (<1 GPU-day)"
    - source: "Days 1-7: LAWCAT LLaMA-3-8B distillation on C4 (2×A100, ~1B tokens)"
    - source: "Days 8-14: MOHAWK Stage 1+2 LLaMA-3-8B + Hybrid-4 Stage 3 (4×A100)"
    - source: "Day 15: LongBench v2 evaluation of all models (~6 hours per model on 1×A100)"
    - source: "Day 16: Needle-depth sweep logging (multi-doc QA and synthetic subsets, per-example depth logging)"
  procedure:
    - step: "Gate check: fit Frobenius error vs N, compute log-log slope; abort if slope > 0.5 or 90th pct error > 0.3 at N=8k"
    - step: "LAWCAT distillation with alignment ratio monitoring (pre-register ≤0.15 gate); perplexity gap check ≤5%"
    - step: "MOHAWK Stage 1+2 distillation with hidden-state L2 monitoring; Hybrid-4 Stage 3 only"
    - step: "LongBench v2 evaluation: per-example accuracy logging with depth metadata for multi-doc QA and synthetic"
    - step: "Statistical analysis: Δ_norm per category, mixed-effects model, bootstrap CIs, depth-slope regression, mediation analysis"
  success_criteria:
