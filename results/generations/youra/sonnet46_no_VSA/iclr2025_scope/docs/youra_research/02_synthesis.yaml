    - "LAWCAT LLaMA-3-8B (Conv1D + gated linear attention, ≤1B tokens)"
    - "Hybrid-4 LLaMA-3-8B (MOHAWK Stage 3 only, 4 middle attention layers retained)"
  datasets:
