final_opinions:
  perspective_novelty:
    agent: "Dr. Nova"
    icon: "🔭"
    assessment: |
      STRONG. H-Conv1D-v1 addresses a genuine gap — no prior work holds the base model constant
      across sub-quadratic conversion strategies while evaluating on LongBench v2 task categories.
      The task-type × strategy interaction prediction (MOHAWK-SSM retrieval degradation vs.
      LAWCAT uniform profile) is novel, tied to the Conv1D architectural distinction, and has
      not appeared in any prior paper. The controlled factorial design with existing infrastructure
      makes this immediately executable.
    key_points:
      - "First controlled within-subject comparison of MOHAWK-SSM vs. LAWCAT-linear-attention on LongBench v2"
      - "Task-type × strategy interaction as the novel scientific contribution, not just strategy ranking"
      - "Fixed base model (LLaMA-3-8B) design avoids H-E1's capability confound entirely"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      STRONG. Five independent disconfirmation pathways are pre-registered:
      (1) Δ_norm ratio < 2× with 95% bootstrap CI;
      (2) Frobenius error scaling > 0.5 log-log slope or > 0.3 at N=8k;
      (3) alignment ratio > 0.15 or perplexity gap > 5%;
      (4) β_depth slopes statistically indistinguishable after Holm correction;
      (5) Hybrid-4 matches full conversion on retrieval.
      Normalized degradation criterion is mathematically unambiguous.
    key_points:
      - "≥2× degradation ratio with bootstrap CI defined before experiment"
      - "Long-range stability gate (Frobenius at N=8k) prevents misattributing approximation breakdown as architecture"
      - "Mediation regression (Acc_retrieval ~ Strategy + Alignment + PPL_gap + MatrixError) isolates architectural effect"

  perspective_significance:
    agent: "Dr. Sage"
    icon: "🎯"
    assessment: |
      STRONG. The community currently lacks a controlled head-to-head of conversion strategies on
      LongBench v2. The finding — whichever way it goes — directly answers the practitioner question
      "when should I convert and for which tasks?" Anchoring against scratch-trained SSM baselines
      from Overflow Prevention [2505.07793] (directly reusable) positions this as completing an
      important triangle in the conversion literature. Venues: ICML, NeurIPS, EMNLP systems track.
    key_points:
      - "Closes a gap every subsequent conversion paper will need to cite"
      - "Actionable answer: convert for summarization/generation; keep attention/hybrid for retrieval"
      - "Overflow Prevention scratch-trained baseline reusable directly — no extra training needed"

  perspective_plausibility:
    agent: "Prof. Pax"
    icon: "⚙️"
    assessment: |
      STRONG. All pipeline components are runnable today. LAWCAT (≤1B tokens, ≤3 days on 2×A100),
      MOHAWK Stage 1+2 (≤4 days on 4×A100), Hybrid-4 (≤2 days on 2×A100), LongBench v2 eval
      (~6 hours per model). Day 0 gate check (Frobenius scaling, spectral norm) costs ~2 days and
      protects the downstream investment. Total: 2-week experiment on a DGX-equivalent cluster.
      Flash Linear Attention/FSDP compatibility is the one pre-check needed.
    key_points:
      - "Frobenius gate (<1 GPU-day) is cheapest possible insurance against 14 GPU-days of wasted distillation"
      - "All diagnostic tools (L2 tracking, needle-depth sweep, mediation regression) implementable in <10 hours of code"
      - "LAWCAT token budget (~1B not ~15B) is the key feasibility advantage at 8B scale"

  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      H-Conv1D-v1 emerged with five key properties: (1) novel (first controlled factorial, fixed base model);
      (2) feasible (2-week experiment, existing pipelines); (3) falsifiable (5 pre-registered disconfirmation
      pathways); (4) significant (closes practitioner-facing gap); (5) failure-avoiding (avoids H-E1 capability
      confound and H-M2 KV eviction entirely). The scope-bound design (layer-localization deferred to Phase 4)
      preserves the publishable primary claim while preventing scope creep. The hypothesis is Phase 2B-ready.
    key_points:
      - "Scope-bounded: primary claim (2-strategy comparison) is publishable independently of Phase 4 extensions"
      - "H-Conv1D-v1 naming highlights the LAWCAT architectural distinction (Conv1D) as the mechanistic basis"
      - "Architecture-vs-curriculum confound pre-registered for Phase 4 — not an omission but a deliberate deferral"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      Three open concerns remain appropriately acknowledged: (1) layer-localization deferred — hybrid-4 provides
      partial coverage but exact attribution requires Phase 4; (2) architecture-vs-curriculum confound unresolved —
      mixed-length distillation ablation deferred; (3) optimization instability at 8B scale is real — perplexity
      gate ≤5% must be strictly enforced. The mediation regression and long-range matrix stability gate address
      the strongest objections. The needle-depth slope falsifier (P2) is the sharpest test of the Conv1D mechanism.
    key_points:
      - "Perplexity gate ≤5% relative MUST be enforced before LongBench evaluation — non-negotiable"
      - "Curriculum confound remains open: if retrieval degradation disappears under mixed-length distillation, architectural claim weakens"
      - "Layer-localization (early/middle/late hybrid) is Phase 4 follow-up, not optionally deferred"

