# DEPTH-SLOPE ANALYSIS (H-M2) — PROXY DATA ONLY
# ============================================================

depth_slope_h_m2:
  status: "PROXY_DATA"
  actual_ratio: 1.0
  reason: "Identical LLaMA-3.1-8B weights used for both 'SSM' and 'LAWCAT' conditions due to port conflict (EADDRINUSE on port 29501) blocking H-E1 distillation"
  proxy_beta_depth: +0.1814
  sign_note: "Positive β_depth (depth_percentile=1 means answer near document start, not end). May reflect sign convention or teacher recency bias, not SSM forgetting."
  source: "h-m2/04_validation.md, 045_validated_hypothesis.md Section 4.2"
  adversary_note: "Paper should NOT claim H-M2 as evidence for or against the depth-slope hypothesis. The proxy result (ratio=1.0) is by construction, not a valid test."

# ============================================================
# METHODOLOGY — HYPERPARAMETERS
# ============================================================

methodology:
  teacher_model: "meta-llama/Llama-3.1-8B"
  teacher_dtype: "bfloat16"
  ssd_fitting_dtype: "float32"
  n_opt_steps: 500
  lr: 1.0e-3
  adam_betas: [0.9, 0.999]
  d_state: 64
  n_samples: 50  # at N=512; 5 at N=1024,2048
  target_lengths: [512, 1024, 2048]
  n_layers: 32
  d_model: 4096
  source: "h-m1/04_validation.md, Appendix"

  mohawk_stages:
    stage1: {n_tokens: "26M", lr: "1e-3", batch: 64, seq: 2048, seed: 42}
    stage2: {n_tokens: "52M", lr: "1e-4", batch: 64, seq: 2048}
    stage3: {n_tokens: "922M", lr: "1e-4", batch: 64, seq: 2048}

  lawcat_phases:
    phase1: {dataset: "alpaca_clean", mse_weight: 1000, lr: "1e-2", seed: 0}
    phase2: {lora_r: 16, targets: "q/k/v/o"}

  training_data: "monology/pile-uncopyrighted"
  eval_dataset: "THUDM/LongBench v2 (503 examples)"
  hardware: "4x H100 NVL 96GB"
  source: "h-e1/04_validation.md, Optimal Hyperparameters"

