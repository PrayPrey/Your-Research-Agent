# ============================================================
# ADVERSARY AGENT PRIORITY CHECKS
# ============================================================

adversary_priority_checks:
  - id: "AC1"
    check: "Does paper claim H-E1 behavioral gate as confirmed (numerically)?"
    expected: "NO — paper should present H-E1 as PoC-level, experiment running"
    if_fails: "Critical accuracy error — remove any language implying Δ_norm ratio is confirmed"

  - id: "AC2"
    check: "Does paper present H-M2 proxy result as evidence for/against depth-slope hypothesis?"
    expected: "NO — ratio=1.0 by construction; proxy data is explicitly invalid"
    if_fails: "Critical accuracy error — reframe H-M2 as 'infrastructure validated, hypothesis deferred'"

  - id: "AC3"
    check: "Is β=-0.368 correctly described as negative (error DECREASING with N)?"
    expected: "YES — negative slope means normalized error decreases as N grows"
    if_fails: "Sign error in core finding — correct immediately"

  - id: "AC4"
    check: "Is normalization (error/N) consistently applied and explained?"
    expected: "YES — raw slope is 0.63 (super-linear); normalized slope is -0.368 (sub-linear). Both correctly distinguished."
    if_fails: "Potential confusion between raw and normalized metrics"

  - id: "AC5"
    check: "Is the MOHAWK citation verifiable? (Scholar search returned no match)"
    expected: "FLAGGED — Bick et al. 2024 NeurIPS MOHAWK not found in Scholar under any tried query. Exact title/authors unverified."
    if_fails: "Add [UNVERIFIED] note; attempt alternate search before final submission"

  - id: "AC6"
    check: "Does paper acknowledge H-M1 scope limitation (N≤2048, not N=8k)?"
    expected: "YES — Section 6.3 explicitly notes N≤2048 and OOM reason"
    if_fails: "Add limitation statement"

  - id: "AC7"
    check: "Does paper claim the interpretation 'attention sparsity explains negative slope'?"
    expected: "STATED AS HYPOTHESIS, not confirmed — correct framing is 'we attribute this to...'"
    if_fails: "Soften language from claim to interpretation"

