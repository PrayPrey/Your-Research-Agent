gap_id: "gap-3"
gap_title: "Theoretical Direction of Diversity-Displacement Relationship (HR < 1 vs HR > 1)"
gap_description: |
  No prior empirical study has tested submitter diversity (unique paper count / total rows at
  benchmark introduction year) as a time-independent Cox predictor of plurality benchmark
  displacement hazard on Papers With Code. Two competing mechanisms exist:
  (A) Lock-in: broad community adoption creates switching costs → slower displacement (HR < 1)
  (B) Saturation signal: high diversity means overuse pressure → faster displacement (HR > 1)
  Both Koch 2021 and Ott 2022 provide partial support for both directions.
  Direction is empirically undetermined; must be resolved via CoxPHFitter on h-e2 panel.
