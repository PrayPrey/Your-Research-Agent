hypothesis_draft:
  title: "Benchmark Submitter Diversity Predicts Plurality Displacement Hazard (H-Diversity-v1)"
  hypothesis_id: "H-Diversity-v1"
  core_claim: |
    Under the h-e2 panel (87 tasks, 345 events, Papers With Code 2015-2023), benchmark submitter
    diversity at introduction year — measured as log_unique_paper_count_at_intro_z from
    pwc-archive/evaluation-tables — significantly predicts plurality benchmark displacement hazard
    in CoxPHFitter(penalizer=0.1) with |HR-1|≥0.10 and LRT p<0.05, conditional on passing a
    5-gate FAIL FAST pre-validation protocol. Effect direction is empirically determined: HR<1
    indicates lock-in (diversity → stakeholder entrenchment → slower displacement); HR>1 indicates
    saturation (diversity → overuse signal → faster community replacement).
  mechanism: |
    High benchmark submission diversity at introduction year reflects either:
    (H1 lock-in path) broad stakeholder community investment creating network effects that resist
    challenger benchmarks achieving plurality — teams continue submitting to the incumbent;
    (H2 saturation path) widespread adoption that signals benchmark ubiquity, prompting the
    community to seek harder, more discriminative alternatives — diversity accelerates replacement.
    The Cox hazard ratio empirically adjudicates which mechanism dominates in Papers With Code.
  predictions:
    - P1: "LRT p < 0.05 for log_unique_paper_count_at_intro_z in CoxPHFitter on h-e2 panel"
    - P2: "95% CI of HR does not contain 1.0 (CI_upper < 1.0 for H1, CI_lower > 1.0 for H2)"
    - P3: "KM curves for Q1 vs Q4 diversity show log-rank p < 0.05"

variables_summary:
  independent: "log_unique_paper_count_at_intro_z (primary); paper_diversity_ratio_at_intro_z (secondary, used if r<0.95 with primary)"
  dependent_primary: "displacement_hazard — time to plurality benchmark displacement event in h-e2 panel (87 tasks, 345 events)"
  controlled: "task_age, log_publication_volume, benchmark_introduction_year"

null_hypothesis:
  h0_statement: |
    There is no significant association between benchmark submitter diversity at introduction year
    (log_unique_paper_count_at_intro_z or paper_diversity_ratio_at_intro_z) and plurality benchmark
    displacement hazard. LRT p > 0.05 and |HR-1| < 0.10 after controlling for task_age,
    log_publication_volume, and benchmark_introduction_year, conditional on all 5 FAIL FAST gates
    passing. A clean null rules out the community-breadth class of predictors.
  statistical_test: "Likelihood Ratio Test (LRT) comparing M0 (controls only) vs M1 (M0 + diversity predictor)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: |
    paper_diversity_ratio = unique_paper_count / total_rows — normalized, time-independent proxy
    (inverse HHI analog) for community breadth at benchmark introduction year. Directly addresses
    Attempt 10's time-proxy collapse. Combined with 5-gate FAIL FAST pre-validation protocol
    creating pre-registration-equivalent rigor — first application to benchmark lifecycle research.
  differentiation_summary: |
    Ott 2022: cross-benchmark saturation dynamics, no survival model, no displacement event outcome.
    Koch 2021: population-level concentration trends, no benchmark-level displacement prediction.
    h-m1 runs 1-2: time-collinear proxy (partial_r²=0.0011) or time-varying model with 34.1% coverage.
    This hypothesis is first: time-independent diversity proxy + pre-validated panel (EPV=115) +
    5-gate FAIL FAST protocol + bidirectional interpretation protocol.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "CoxPHFitter(penalizer=0.1) — primary model"
    - "lifelines.statistics.logrank_test() — KM comparison (P3)"
  datasets:
    - "pwc-archive/evaluation-tables (HuggingFace, CC-BY-SA-4.0, 326k rows)"
    - "h-e2 survival panel (87 tasks, 345 events, 2015-2023, Papers With Code)"
  baselines:
    - "M0: CoxPHFitter controls-only (task_age + log_pub_vol + intro_year)"
    - "h-m1 Run 2: HR=0.871, p=0.565 (underpowered prior attempt — directional baseline)"

measurement_plan:
  data_collection:
    - source: "pwc-archive/evaluation-tables — load via load_dataset('pwc-archive/evaluation-tables', split='train')"
    - source: "h-e2 panel archive — load from pipeline archive (87 tasks, 345 events, pre-validated)"
  procedure:
    - step: "G0: Join evaluation-tables to h-e2 panel via task_path fuzzy matching; verify ≥80% coverage"
    - step: "Compute unique_paper_count_at_intro via df.groupby('task_path')['paper_url'].nunique() restricted to intro year window"
    - step: "Compute paper_diversity_ratio_at_intro = unique_count / total_rows per benchmark"
    - step: "log1p-transform unique_paper_count; z-standardize both predictors"
    - step: "G1-G2: partial_r² check for both predictors vs temporal controls"
    - step: "G3: std(diversity_ratio) > 0.10 check"
    - step: "Check predictor collinearity: r(log_count_z, diversity_ratio_z); if >0.95 use primary only"
    - step: "G4: VIF check for all covariates"
    - step: "Fit M0 (controls only) and M1 (M0 + primary predictor); compute LRT"
    - step: "Extract HR, 95% CI, LRT p; apply direction-interpretation protocol"
    - step: "Compute KM curves for Q1 vs Q4 diversity; log-rank test (P3)"
    - step: "Robustness checks R1 (diversity_ratio as primary), R2 (interaction term), R3 (Koch 133 subset)"
  success_criteria:
    - "G0-G4 all pass (prerequisite for any Cox analysis)"
    - "P1: LRT p < 0.05 AND |HR-1| ≥ 0.10"
    - "P2: 95% CI excludes 1.0"
    - "P3: KM Q1 vs Q4 log-rank p < 0.05"
    - "At least 2/3 robustness checks (R1-R3) consistent with primary result"

validation:
  internal_validity:
    - "5-gate FAIL FAST protocol prevents time-proxy collapse (G1-G2) and underpowered predictor (G3)"
    - "Pre-specified direction-interpretation protocol prevents HARKing"
    - "Predictor collinearity failsafe prevents overstating secondary predictor contribution"
    - "Proportional hazards assumption check via log(-log(S(t))) plot and Schoenfeld residuals"
    - "VIF check (G4) prevents multicollinearity from control set (h-m1 lesson: VIF=22.3)"
  external_validity:
    - "h-e2 panel covers 87 Koch 133 tasks across NLP, CV, and other domains (2015-2023)"
    - "pwc-archive is the authoritative Papers With Code data dump (Jul 2025 snapshot)"
    - "Results applicable to ML leaderboard community only; may not generalize to non-competitive benchmark settings"
    - "Temporal window 2015-2023 limits applicability to pre-LLM-saturation era of benchmark competition"

discussion_synthesis:
  key_insights:
    - "FAIL FAST gate design (G0-G4) is the core methodological contribution — prevents all prior failure modes from h-e1/h-m1 in a single pre-validation sequence"
    - "Bidirectional test framing is scientifically stronger than pre-committed direction: both lock-in and saturation are literature-supported and cannot be adjudicated a priori"
    - "paper_diversity_ratio is structurally an inverse HHI — connects benchmark lifecycle research to competition economics literature"
    - "Even a clean null result is publishable: rules out community-breadth class, narrowing the remaining predictor space for future Attempts"
    - "The design template (5-gate FAIL FAST + bidirectional protocol + pre-specified effect threshold) is reusable for future benchmark lifecycle research"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Added G3 variance gate — addressed underpowered-predictor risk not in original design"
    - "Exchange 7 (Dr. Nova): Rank-based predictor proposal + validated h-e2 slug reuse argument for join coverage"
    - "Exchange 8 (Prof. Vera): Formalized complete 5-gate FAIL FAST protocol with explicit success criteria for all gates"
    - "Exchange 12 (Prof. Rex): Added direction-interpretation protocol + predictor collinearity failsafe — prevents HARKing"
    - "Exchange 13 (Dr. Nova): Inverse HHI analogy and template-as-contribution framing"
  resolved_tensions:
    - "Mechanism direction (HR<1 vs HR>1): Resolved by bidirectional protocol — both directions pre-specified, empirical data adjudicates"
    - "Time-proxy risk: Resolved by G1-G2 partial_r² gates (inherited lesson from h-m1 Run 1)"
    - "Join coverage risk: Resolved by G0 gate as hard stop — routes to Attempt 12 if coverage <80%"
    - "VIF multicollinearity: Resolved by G4 gate extending beyond predictor to full control set (h-m1 lesson)"
    - "HARKing risk: Resolved by explicit direction-interpretation protocol added in Exchange 12"
