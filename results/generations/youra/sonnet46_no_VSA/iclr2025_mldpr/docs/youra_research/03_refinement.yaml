# ═══════════════════════════════════════════════════════════════
# FAIL FAST PROTOCOL (Phase 2B Implementation Reference)
# ═══════════════════════════════════════════════════════════════

fail_fast_protocol:
  gates:
    - id: "G0"
      name: "Join Coverage Gate"
      criterion: "≥80% of h-e2 benchmarks have non-null paper_url in pwc-archive/evaluation-tables after task_path join"
      fail_action: "ROUTE_TO_0 (Attempt 12)"
    - id: "G1"
      name: "Primary Predictor Independence Gate"
      criterion: "partial_r²(log_unique_paper_count_at_intro_z, [task_age, benchmark_introduction_year]) > 0.01"
      fail_action: "ROUTE_TO_0 (Attempt 12) — predictor is a time proxy"
    - id: "G2"
      name: "Secondary Predictor Independence Gate"
      criterion: "partial_r²(paper_diversity_ratio_at_intro_z, [task_age, benchmark_introduction_year]) > 0.01"
      fail_action: "ROUTE_TO_0 (Attempt 12) — ratio is still temporally confounded"
    - id: "G3"
      name: "Variance Gate"
      criterion: "std(paper_diversity_ratio_at_intro) > 0.10 across joined h-e2 benchmarks"
      fail_action: "ROUTE_TO_0 (Attempt 12) — insufficient predictor variance for detection"
    - id: "G4"
      name: "VIF Gate"
      criterion: "VIF < 10 for all covariates in Cox model (predictors + controls)"
      fail_action: "WARN and continue (VIF 5-10 is acceptable; VIF>10 triggers predictor exclusion)"
  predictor_collinearity_failsafe:
    condition: "Pearson r(log_unique_paper_count_at_intro_z, paper_diversity_ratio_at_intro_z) > 0.95"
    action: "Use primary predictor only (log_unique_paper_count_at_intro_z); drop paper_diversity_ratio_at_intro_z"
