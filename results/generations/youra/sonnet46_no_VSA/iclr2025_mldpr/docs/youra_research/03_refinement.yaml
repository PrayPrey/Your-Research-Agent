# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-Diversity-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the h-e2 panel (87 tasks, 345 plurality-benchmark displacement events, 2015-2023,
    Papers With Code), if log_unique_paper_count_at_intro_z (log-transformed, z-standardized
    count of distinct paper_url values per benchmark through plurality-introduction year from
    pwc-archive/evaluation-tables, joined to h-e2 panel via task_path fuzzy matching) passes
    a 5-gate FAIL FAST pre-validation protocol (G0: ≥80% join coverage; G1: partial_r²>0.01
    vs task_age+intro_year; G2: paper_diversity_ratio partial_r²>0.01; G3: std(diversity_ratio)>0.10;
    G4: VIF<10 for all covariates), then log_unique_paper_count_at_intro_z significantly predicts
    plurality benchmark displacement hazard in CoxPHFitter(penalizer=0.1) with |HR−1| ≥ 0.10
    and LRT p < 0.05, because benchmarks with broader community adoption at introduction year
    either resist displacement via stakeholder lock-in (HR<1) or accelerate displacement via
    saturation pressure (HR>1) — direction determined empirically.
  alternative_hypothesis_h0: |
    There is no significant association between benchmark submitter diversity at introduction year
    (log_unique_paper_count_at_intro_z or paper_diversity_ratio_at_intro_z) and plurality
    benchmark displacement hazard (LRT p > 0.05, |HR-1| < 0.10) after controlling for task_age,
    log_publication_volume, and benchmark_introduction_year, conditional on all 5 FAIL FAST
    gates passing.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "log_unique_paper_count_at_intro_z"
      type: "continuous"
      operationalization: |
        Count of distinct paper_url values in pwc-archive/evaluation-tables per benchmark
        (task_path) from dataset creation through plurality-introduction year, then
        log1p-transformed and z-standardized across h-e2 panel. Computed via pandas
        groupby('task_path')['paper_url'].nunique(). Primary predictor.
    - name: "paper_diversity_ratio_at_intro_z"
      type: "continuous"
      operationalization: |
        unique_paper_count_at_intro / total_evaluation_table_rows_at_intro per benchmark,
        then z-standardized. Normalized ratio that is time-independent by construction
        (denominates raw count by total rows, removing accumulation effect). Secondary predictor.
        Used only if Pearson r(log_unique_count_z, diversity_ratio_z) < 0.95.
  dependent:
    - name: "displacement_hazard"
      type: "continuous"
      operationalization: |
        Time-to-plurality-benchmark-displacement event in the h-e2 survival panel.
        Duration = number of years benchmark held plurality. Event = 1 if benchmark was
        displaced (different benchmark achieved plurality for same task), 0 if right-censored.
        Modeled via CoxPHFitter(penalizer=0.1).fit(panel_df, duration_col='duration', event_col='event').
      primary: true
  controlled:
    - name: "task_age"
      operationalization: "Age of parent task at benchmark introduction year (years since task first appeared in PWC)"
    - name: "log_publication_volume"
      operationalization: "Log of total paper count for parent task in h-e2 panel (controls for task popularity)"
    - name: "benchmark_introduction_year"
      operationalization: "Year benchmark first achieved plurality (2015-2023); temporal baseline control"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: |
        Benchmark is introduced and achieves plurality for its task. Teams across the community
        begin evaluating their models against it, contributing paper_url entries to evaluation-tables.
        The density and diversity of early adopters is captured by unique_paper_count_at_intro.
      evidence: "pwc-archive/evaluation-tables paper_url column (326k rows) records all evaluation submissions; Koch 2021 documents initial adoption patterns"
      falsifier: "If unique_paper_count_at_intro has zero variance across h-e2 benchmarks (all benchmarks equally diverse), mechanism has no traction"
    - step: 2
      description: |
        High diversity at introduction year (many distinct teams submitting) creates one of two
        downstream pressures: (H1 lock-in) the benchmark becomes a community focal point with
        broad stakeholder investment — teams continue submitting to the incumbent rather than
        migrating to challengers; OR (H2 saturation) the benchmark signals widespread adoption
        and rapid SOTA progress — community perceives it as 'solved', accelerating search for
        harder benchmarks.
      evidence: "Ott 2022 (breadth→longevity, H1); Koch 2021 (concentration→stagnation complement→H2); ICLR 2025 workshop overuse framing (H2)"
      falsifier: "If HR ≈ 1.0 (|HR-1| < 0.10) despite adequate power and passing FAIL FAST gates, neither mechanism dominates"
    - step: 3
      description: |
        Under H1 (lock-in): teams with early adoption continue updating leaderboard results on
        the incumbent benchmark even as alternatives emerge, preventing challengers from accumulating
        enough submission volume to achieve plurality. Displacement hazard is reduced (HR < 1).
        Under H2 (saturation): community consensus that the benchmark is adequately covered
        incentivizes new benchmark proposals and migrations; displacement hazard is elevated (HR > 1).
      evidence: "GLUE→SuperGLUE transition supports H2 (high diversity GLUE replaced after saturation); Rogers Diffusion of Innovations supports H1 (early adopters as opinion leaders creating lock-in)"
      falsifier: "H1 falsified if HR ≥ 1.0, CI_lower ≥ 1.0, p<0.05. H2 falsified if HR ≤ 1.0, CI_upper ≤ 1.0, p<0.05."
    - step: 4
      description: |
        Empirical outcome captured in Cox model: displacement event timing (plurality handover to
        different benchmark) is significantly associated with diversity predictor. Direction of HR
        distinguishes lock-in (HR<1) from saturation (HR>1). Null (HR≈1, p>0.05) rules out
        both mechanisms as operative in this dataset.
      evidence: "h-m1 Run 2: HR=0.871 directionally correct but underpowered (22 events vs 345 in h-e2). With 345 events and EPV=115, effect of this magnitude is detectable."
      falsifier: "If FAIL FAST gates G0-G4 all pass and LRT p>0.05, the null is accepted with adequate power. This rules out community-breadth class of predictors."
  key_tension: |
    The direction of the diversity-displacement relationship (HR<1 vs HR>1) is the primary
    unresolved theoretical question. Both lock-in and saturation mechanisms are literature-supported
    and cannot be resolved a priori. This empirical uncertainty is the core scientific motivation
    for the experiment.
  evidence_summary: |
    The causal chain is supported by: Ott 2022 breadth→longevity theory (H1); Koch 2021 concentration
    methodology providing the complement (H2); ICLR 2025 workshop overuse framing (H2); GLUE→SuperGLUE
    case study (H2); Rogers Diffusion of Innovations network effects (H1). Prior h-m1 empirical run
    showed directionally correct HR=0.871 but with insufficient power (22 events). EPV=115 in h-e2
    provides adequate power for effect sizes |HR-1|≥0.10.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "paper_url values in pwc-archive/evaluation-tables uniquely identify distinct submitting papers/teams at the benchmark level"
    supporting_evidence: "Exa verification: paper_url is a URL field confirmed in 326k-row dataset; felixleungsc pre-flattened version confirms schema. dedup_identity_change_pct=0.0% in h-e1 Run 2 confirms URL deduplication is clean."
    consequence_if_violated: "unique_paper_count_at_intro would be inflated by duplicate submissions, overestimating diversity. G0 gate (≥80% non-null) would still pass, but diversity measure would be noisy."
  - id: "A2"
    assumption: "task_path in pwc-archive/evaluation-tables can be joined to h-e2 panel task identifiers with ≥80% coverage via fuzzy matching"
    supporting_evidence: "h-e1 snapshot: 95.5% Koch 133 core tasks recovered via fuzzy matching on papers-with-abstracts. Same slug space expected for evaluation-tables task_path."
    consequence_if_violated: "If G0 gate fails (<80% coverage), hypothesis routes to Attempt 12. If coverage is 60-80%, EPV drops but Cox may still be viable."
  - id: "A3"
    assumption: "paper_diversity_ratio_at_intro is independent of temporal controls (task_age, benchmark_introduction_year) after partialing — i.e., normalized ratio removes time-accumulation confound"
    supporting_evidence: "Theoretical: unique_count / total_rows normalizes by scale, removing growth effect. Empirical verification required via G1-G2 partial_r² gates."
    consequence_if_violated: "G1 or G2 FAIL FAST gate fails; ratio collapses into time proxy like h-m1 C_t. Route to Attempt 12."
  - id: "A4"
    assumption: "Proportional hazards assumption holds for the diversity predictor in the h-e2 panel"
    supporting_evidence: "CoxPHFitter is validated on h-e2 panel (14/14 tests). Schoenfeld residuals test unavailable for CoxTimeVaryingFitter (h-m1 lesson) but applicable to CoxPHFitter. Alternative: stratified KM curves (P3 prediction)."
    consequence_if_violated: "Cox model misspecified; results would be unreliable. Mitigation: check log(-log(S(t))) plot; use stratified Cox as robustness check."
  - id: "A5"
    assumption: "Plurality displacement event definition in h-e2 panel is consistent across tasks and years (same benchmark achieving plurality = no spurious displacement events)"
    supporting_evidence: "h-e1 Run 2: dedup_identity_change_pct=0.0% confirms plurality stable through deduplication; h-e2 panel validated across Attempts 1-10."
    consequence_if_violated: "Noisy event labels → attenuated HR estimates → underpowered results. Already addressed by h-e2 panel validation."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Papers With Code evaluation-tables dataset (pwc-archive, CC-BY-SA-4.0, 326k rows, Jul 2025 snapshot).
    h-e2 panel: 87 parent tasks from Koch et al. 2021 taxonomy, 2015-2023 temporal window, 345
    plurality-benchmark displacement events. Benchmarks that achieved plurality status for their task
    in the observation window. Time-fixed predictor design (diversity measured at plurality introduction
    year, not time-varying).
  does_not_apply_to: |
    - Benchmarks that never achieved plurality status (not in h-e2 panel)
    - Tasks outside Koch 133 taxonomy (different task definition)
    - Time-varying diversity measures (this hypothesis uses time-fixed snapshot at introduction year)
    - CoxTimeVaryingFitter (explicitly excluded — 34.1% coverage ceiling, EPV<10 failure from h-m1)
    - Score-trajectory predictors (34.1% coverage ceiling — closed space)
    - Authorship-based diversity measures (Gini near-zero failure from h-e1 runs 1-2)
    - Domain-type moderators (NLP vs CV — null result in h-e2 Run 1)
  known_limitations: |
    - Join coverage (G0 gate) is unverified until runtime; if <80%, hypothesis fails
    - Mechanism interpretation is underdetermined from Cox output alone — association, not causation
    - If r(log_count_z, diversity_ratio_z) > 0.95, secondary predictor collapses into primary
    - 2015-2023 window may not capture pre-PWC benchmark displacement patterns
    - Saturation mechanism's transmission path (diversity → replacement) is theoretically plausible
      but not directly observable from this dataset alone

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: |
      log_unique_paper_count_at_intro_z significantly predicts plurality benchmark displacement
      hazard in CoxPHFitter(penalizer=0.1) on h-e2 panel with LRT p < 0.05 and |HR-1| ≥ 0.10.
    test_method: |
      1. Execute FAIL FAST gates G0-G4 in order (stop if any fails)
      2. Fit M0 (controls only: task_age + log_pub_vol + intro_year) and M1 (M0 + log_unique_paper_count_at_intro_z)
      3. LRT stat = -2*(M0_LL - M1_LL), df=1; p from chi2 distribution
      4. Extract HR = exp(coef) and 95% CI
    success_criterion: "LRT p < 0.05 AND |HR-1| ≥ 0.10"
    falsification: "LRT p ≥ 0.05 OR |HR-1| < 0.10 (conditional on G0-G4 passing)"
  - id: "P2"
    primary: false
    statement: |
      The 95% confidence interval of HR for log_unique_paper_count_at_intro_z does not contain 1.0.
    test_method: |
      Extract CI_lower and CI_upper from CoxPHFitter print_summary(). Check CI_lower > 1.0 (H2)
      or CI_upper < 1.0 (H1). Direction determines interpretation.
    success_criterion: "CI_lower > 1.0 (HR>1, saturation) OR CI_upper < 1.0 (HR<1, lock-in)"
    falsification: "CI_lower ≤ 1.0 ≤ CI_upper (confidence interval spans 1.0)"
  - id: "P3"
    primary: false
    statement: |
      Kaplan-Meier survival curves for Q1 (lowest diversity) vs Q4 (highest diversity) benchmarks
      show statistically significant difference (log-rank p < 0.05).
    test_method: |
      Stratify h-e2 benchmarks into quartiles by log_unique_paper_count_at_intro. Plot KM curves
      for Q1 vs Q4. Compute log-rank test using lifelines.statistics.logrank_test().
    success_criterion: "Log-rank p < 0.05 for Q1 vs Q4 comparison"
    falsification: "Log-rank p ≥ 0.05 (no separation between lowest and highest diversity quartiles)"

# ═══════════════════════════════════════════════════════════════
# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    name: "pwc-archive/evaluation-tables + h-e2 survival panel"
    type: "standard"
    source: "HuggingFace: pwc-archive/evaluation-tables (CC-BY-SA-4.0, 326k rows) + h-e2 panel archive"
    path: "pwc-archive/evaluation-tables (HuggingFace); h-e2 panel from prior pipeline archive"
    hypothesis_fit: |
      pwc-archive/evaluation-tables provides paper_url column enabling unique_paper_count_at_intro
      via pure groupby+nunique — no score data required, 100% coverage achievable.
      h-e2 panel (87 tasks, 345 events) provides the validated survival outcome with all temporal
      controls pre-computed. EPV=115 provides strong statistical power.
  model:
    name: "CoxPHFitter(penalizer=0.1)"
    type: "survival analysis / proportional hazards regression"
    source: "lifelines Python library (version ≥0.27, CamDavidsonPilon/lifelines)"
    hypothesis_fit: |
      Time-fixed Cox regression is the correct model for time-fixed predictors (diversity at
      introduction year) with time-to-event outcome (displacement). penalizer=0.1 achieves clean
      convergence as confirmed in 14/14 tests on h-e2 panel. Avoids CoxTimeVaryingFitter
      (34.1% coverage ceiling failure from h-m1).
  baselines:
    - name: "Null model (controls only)"
      method: "CoxPHFitter with task_age + log_publication_volume + benchmark_introduction_year only"
    - name: "h-m1 Run 2 model (Δscore_lag1_z)"
      method: "Prior Cox attempt with time-varying predictor; HR=0.871, p=0.565 (underpowered null)"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First empirical test of community-structure diversity (submitter count/ratio at introduction year)
    as a time-independent predictor of plurality benchmark displacement hazard on Papers With Code.
    First pre-validated survival analysis protocol (5-gate FAIL FAST) for benchmark lifecycle research.
  key_innovation: |
    paper_diversity_ratio = unique_paper_count / total_evaluation_table_rows — a normalized,
    time-independent proxy for community breadth at benchmark introduction year. Structurally
    equivalent to an inverse HHI (Herfindahl-Hirschman Index) in competition economics.
    Directly addresses Attempt 10's time-proxy collapse by normalizing by total rows.
    Combined with 5-gate pre-validation protocol that creates pre-registration-equivalent rigor.
  differentiation:
    - prior_work: "Ott et al. 2022 (Nature Comms, 3765 benchmarks, breadth→saturation dynamics)"
      difference: "Ott uses cross-benchmark population trends; we use individual benchmark survival model with displacement as the event outcome"
    - prior_work: "Koch et al. 2021 (180 citations, dataset concentration methodology)"
      difference: "Koch measures population-level concentration trends; we test benchmark-level diversity as a predictor of individual displacement timing"
    - prior_work: "h-m1 Runs 1-2 (this pipeline, Cox regression attempts)"
      difference: "h-m1 used time-collinear proxy (partial_r²=0.0011) or time-varying model with 34.1% coverage; this hypothesis uses time-fixed, time-independent ratio with FAIL FAST guard"
    - prior_work: "Paullada et al. 2021 (671 citations, dataset lifecycle governance)"
      difference: "Paullada is qualitative governance framework; this is quantitative survival analysis with pre-specified gates"

