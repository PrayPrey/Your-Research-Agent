narrative_blueprint:
  generated: "2026-08-03"
  paper_type: "principled_null_result"
  venue_target: "ML systems / benchmark lifecycle workshop (ICLR / NeurIPS track)"

  hook_strategy:
    type: "counterintuitive_null"
    headline: >
      We designed and ran the most statistically powered test to date of whether
      community breadth at benchmark introduction predicts displacement timing —
      and obtained a near-perfect null (HR=1.006, LRT p=0.9495, EPV≈86).
      A 5-gate pre-validation protocol rules out data quality as the explanation.
    tension: >
      Strong theory (lock-in AND saturation both predict non-null HR) meets
      optimal measurement (5-gate FAIL FAST all-pass) and finds nothing.
      The absence of effect under these conditions IS the contribution.
    why_compelling: >
      A marginal p=0.04 would be interesting. An HR=1.006 (|HR-1|=0.006) with
      adequate power (EPV≈86) definitively rules out the entire predictor class,
      not just a single test. The scientific value is in the definitive closure.

  problem_framing:
    level1_surface: >
      ML benchmarks on Papers With Code get displaced — a different benchmark
      achieves plurality for the same task. What predicts this?
    level2_mechanism: >
      Community breadth at introduction is theoretically motivated: broad adoption
      either locks in (too many stakeholders to migrate) or saturates (broadly
      covered → perceived as solved → community seeks harder benchmark).
    level3_contribution: >
      We operationalize breadth as paper-submission diversity (unique paper_url
      count per benchmark at plurality introduction year), validate it with a
      5-gate FAIL FAST protocol, test it with Cox proportional hazards on 258
      complete-case rows (EPV≈86), and obtain HR=1.006. Community breadth,
      as measured by submission count, is ruled out as a predictor class.

  key_insight: >
    Community breadth diversity at benchmark introduction year — measured as unique
    paper submission count, confirmed time-independent (partial_r²=0.605), and
    tested with adequate power (EPV≈86) — explains essentially zero variance in
    plurality benchmark displacement hazard (HR=1.006, LRT p=0.9495).
    The mechanism operates below any detectable threshold.

  evidence_structure:
    primary_finding:
      metric: "HR=1.006, 95% CI=[0.846, 1.196], LRT p=0.9495"
      figure: "h-m1/figures/forest_plot.png"
      message: "Near-perfect null; predictor class ruled out"
    methodological_contribution:
      metric: "G0=0.862, G1=0.605, G2=0.975, G3=0.246, G4=2.14"
      figure: "h-e1/figures/gate_metrics.png"
      message: "5-gate FAIL FAST separates data quality from hypothesis validity"
    power_demonstration:
      metric: "EPV≈86, 258 complete-case rows, concordance=0.7363"
      figure: "h-m1/figures/km_quartiles.png"
      message: "Model works; predictor adds nothing"
    prior_contrast:
      metric: "Prior HR=0.871 (22 events) vs current HR=1.006 (258 rows)"
      message: "10× power increase eliminates prior directional signal as noise"

  section_flow:
    - section: "Abstract"
      order: 0
      written_last: true
      key_claim: "Pre-validated null: community breadth does not predict displacement"
    - section: "Introduction"
      order: 1
      hook: "benchmark lifecycle as survival problem; breadth as candidate predictor"
      problem_statement: "Lock-in vs saturation: theory predicts non-null HR"
      contribution_bullets:
        - "First well-powered test (EPV≈86) of community breadth as displacement predictor"
        - "5-gate FAIL FAST pre-validation protocol (methodological contribution)"
        - "Clean null: HR=1.006 rules out submission-count breadth as predictor class"
    - section: "Related Work"
      order: 2
      clusters:
        - "Benchmark lifecycle & displacement dynamics (Ott 2022, Koch 2021, Paullada 2021)"
        - "Community adoption & lock-in theory (Rogers Diffusion of Innovations)"
        - "Benchmark overuse framing (ICLR 2025 workshop)"
        - "Survival analysis in bibliometrics"
    - section: "Methodology"
      order: 3
      subsections:
        - "h-e2 panel construction (87 tasks, 345 events, 2015-2023)"
        - "Diversity predictor construction (unique paper_url count at introduction year)"
        - "5-gate FAIL FAST protocol (G0-G4)"
        - "Cox proportional hazards specification (M0 vs M1 LRT)"
    - section: "Experiments"
      order: 4
      subsections:
        - "H-E1: Data pipeline & gate validation"
        - "H-M1: Cox regression on diversity predictor"
        - "Kaplan-Meier stratified analysis"
    - section: "Results"
      order: 5
      primary: "HR=1.006, p=0.9495 — near-perfect null"
      secondary: "Gate metrics all-pass (G0=0.862 through G4=2.14)"
    - section: "Discussion"
      order: 6
      topics:
        - "Interpretation of null: construct validity gap (submission count ≠ stakeholder depth)"
        - "Contrast with prior directional signal (h-m1 Run 2 HR=0.871, 22 events)"
        - "Implications: score trajectory may be the true predictor"
        - "Limitations: L1 construct, L2 missingness, L3 PH assumption, L4 scope"
    - section: "Conclusion"
      order: 7
      callbacks_to_hook: true
      message: "Best-powered test to date finds HR=1.006; breadth-class ruled out; FAIL FAST protocol reusable"

  figures_plan:
    - id: "fig1"
      source: "h-e1/figures/gate_metrics.png"
      caption: "5-gate FAIL FAST results: all gates pass by wide margins"
      section: "Methods / Results (H-E1)"
    - id: "fig2"
      source: "h-m1/figures/forest_plot.png"
      caption: "Forest plot: HR=1.006 (95% CI=[0.846, 1.196]) for diversity predictor"
      section: "Results (H-M1)"
    - id: "fig3"
      source: "h-m1/figures/km_quartiles.png"
      caption: "Kaplan-Meier Q1 vs Q4 diversity quartile — visual null"
      section: "Results"
    - id: "fig4"
      source: "h-e1/figures/partial_r2.png"
      caption: "Partial R² confirming time-independence of both diversity predictors"
      section: "Methods"
    - id: "fig_appendix1"
      source: "h-m1/figures/schoenfeld_residuals.png"
      caption: "Schoenfeld residuals: no gross PH violation detected"
      section: "Appendix"
    - id: "fig_appendix2"
      source: "h-e1/figures/coverage_heatmap.png"
      caption: "Coverage heatmap: 75/87 benchmarks matched in fuzzy join"
      section: "Appendix"
