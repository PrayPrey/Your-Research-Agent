# ═══════════════════════════════════════════════════════════════
# KEY CLAIMS (for adversarial review targeting)
# ═══════════════════════════════════════════════════════════════

key_claims:
  - id: "C1"
    section: "Methods/Results"
    claim: "All 5 FAIL FAST gates pass by wide margins"
    evidence: "G0=0.862, G1=0.605, G2=0.975, G3=0.246, G4=2.14"
    confidence: "HIGH"
    adversarial_target: "Are G1/G2 partial R² thresholds (0.01) too lenient? Does partial R²=0.605 guarantee time-independence under all confound structures?"

  - id: "C2"
    section: "Results"
    claim: "HR=1.006, LRT p=0.9495 — near-perfect null with EPV≈86"
    evidence: "H-M1 primary results; ΔlogL=0.0020"
    confidence: "HIGH"
    adversarial_target: "Is EPV≈86 actually adequate? Were all 258 rows truly independent? Does penalizer=0.1 bias HR toward null?"

  - id: "C3"
    section: "Methods"
    claim: "5-gate FAIL FAST protocol separates data quality from hypothesis validity"
    evidence: "H-E1 all-pass + H-M1 mechanism fail = interpretable null"
    confidence: "HIGH"
    adversarial_target: "Does passing all gates truly guarantee the null is not a data artifact? Could systematic bias in pwc-archive paper_url coverage produce null?"

  - id: "C4"
    section: "Discussion"
    claim: "Submission count breadth is ruled out as a predictor class"
    evidence: "HR=1.006, |HR-1|=0.006 (17× below pre-specified 0.10 threshold)"
    confidence: "HIGH (for this operationalization)"
    adversarial_target: "Construct validity gap (L1): does ruling out submission count rule out all breadth measures? Paper should be clearer about scope of null."

  - id: "C5"
    section: "Discussion"
    claim: "Prior HR=0.871 (22 events) was sampling noise; current null is more reliable"
    evidence: "Different predictor (score velocity vs submission count) + 10× more events"
    confidence: "MEDIUM"
    adversarial_target: "These are DIFFERENT PREDICTORS — prior result for score velocity is not superseded by current null for submission count. Framing may mislead."

  - id: "C6"
    section: "Methods"
    claim: "Proportional hazards assumption holds (no gross violation detected)"
    evidence: "Visual Schoenfeld residuals; check_assumptions() incomplete due to string covariate bug"
    confidence: "MEDIUM (visual only; automated check failed)"
    adversarial_target: "This is a meaningful gap. HR=1.006 is robust to PH misspecification, but the claim should not be stated as 'no violation detected' when only visual check available."

