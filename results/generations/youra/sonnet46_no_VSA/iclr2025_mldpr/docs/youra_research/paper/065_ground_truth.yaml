# ═══════════════════════════════════════════════════════════════
# PHASE 6.5 ADVERSARIAL REVIEW TARGETS (priority order)
# ═══════════════════════════════════════════════════════════════

adversarial_review_priorities:
  - priority: 1
    target: "C5 — prior vs current predictor conflation"
    issue: "Paper frames current null as superseding prior HR=0.871, but they test DIFFERENT constructs (score velocity vs submission count). This framing is potentially misleading and should be corrected."
    fix: "Separate the two clearly: prior result was for score velocity (untested at full power); current result is for submission count (definitive null). These are complementary, not contradictory."
  - priority: 2
    target: "L3 — PH assumption gap understated"
    issue: "Paper says 'no violation detected' but only visual inspection was done. Should say 'visual inspection suggested no gross violation; quantitative confirmation pending.'"
    fix: "Soften the PH claim; add to limitations the specific fix (integer-encode task_path before check_assumptions())."
  - priority: 3
    target: "Unverified references (Ott 2022, Paullada 2021)"
    issue: "Two key references could not be verified via Semantic Scholar. Must be verified before submission."
    fix: "Manually look up Ott et al. 2022 in Nature Communications and Paullada et al. 2021 (likely: Patterns journal). Add DOI and complete author list."
  - priority: 4
    target: "penalizer sensitivity"
    issue: "penalizer=0.1 was chosen for convergence, not optimized for effect estimation. In small samples (258 rows), L2 regularization can bias coefficients toward zero. No sensitivity analysis reported."
    fix: "Add penalizer sensitivity check: rerun with penalizer=0.0 (unpenalized) and penalizer=0.5. If HR remains ≈1.006 across all three, null is robust to regularization."
  - priority: 5
    target: "Log-rank p-value for P3 not reported"
    issue: "P3 (KM Q1 vs Q4) is described as 'visual null' but no numeric p-value is reported. This weakens the P3 evidence."
    fix: "Extract log-rank p-value from experiment.log or re-run if not available."
