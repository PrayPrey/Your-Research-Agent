# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "ContractEval's contracts are sound (reference implementations satisfy all contracts under high-budget PBT)"
    supporting_evidence: "ContractEval contracts written by domain experts to match reference implementations; Lim et al. 2025 (ACL 2026) paper implies manual validation"
    consequence_if_violated: "Oracle is unsound; contract failures may include false positives; cross-model comparisons are unreliable. Mitigation: pre-experiment soundness check with 100k examples / 2h wall-clock per task"
  - id: "A2"
    assumption: "icontract-hypothesis can infer valid Hypothesis strategies from ContractEval pre-conditions with acceptable filter rate (≥100 valid samples in fixed budget for ≥80% of tasks)"
    supporting_evidence: "icontract-hypothesis docs; plasma-umass/evidence demonstrates pattern; h-e1 worked on tractable subset suggesting pre-conditions are well-structured"
    consequence_if_violated: "Experiment B (adaptive PBT) has low effective sample size for high-filter tasks; per-task yield must be reported and low-yield tasks flagged"
  - id: "A3"
    assumption: "EvalPlus static inputs (764 tests/task) are available and map to ContractEval tasks (ContractEval is a strict subset of HumanEval+/MBPP+)"
    supporting_evidence: "ContractEval paper explicitly builds on HumanEval+/MBPP+; EvalPlus publishes all inputs as JSON; both benchmarks are public"
    consequence_if_violated: "Experiment A (oracle isolation) cannot run; fallback to synthetic matched inputs generated fresh"
  - id: "A4"
    assumption: "Model APIs (OpenAI, Anthropic) allow generation of n=10 samples per task for evaluation purposes without rate limiting at the required scale (364 tasks × 10 samples)"
    supporting_evidence: "evalplus/evalplus already supports OpenAI and Anthropic backends in production; standard API usage for benchmark evaluation"
    consequence_if_violated: "Reduce to n=5 samples; estimate cost impact; study proceeds with reduced statistical power"
  - id: "A5"
    assumption: "The contract-unique failure category (output-equal-to-gt but contract-failing) is non-empty: ≥5% of violations will fall into this category"
    supporting_evidence: "h-e1 confirmed violations exist; ContractEval contracts encode relational/quantified properties not reducible to equality; analogous to mutation testing finding bugs that equality-based tests miss"
    consequence_if_violated: "Oracle strength claim fails: contracts are redundant with dense differential testing. This would still be a negative result worth publishing — it would show contracts add no oracle strength beyond EvalPlus"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    ContractEval's 364 tasks (HumanEval+/MBPP+ subset with Python pre/post-condition contracts).
    LLM-generated code that passes base unit tests (test-passing programs only).
    Execution-based contract checking via Hypothesis PBT with icontract-hypothesis.
    Model families: GPT-4o-mini, Claude-3-haiku (closed); DeepSeek-Coder-V2-Lite, CodeLlama-13B/34B (open).
    Python 3.8+ programs; algorithmic tasks (sorting, string manipulation, mathematical operations).
  does_not_apply_to: |
    Programs that fail base unit tests (excluded — contract checking requires test-passing baseline).
    Non-Python languages (contracts are Python-native; CrossHair/Hypothesis are Python-only).
    Code outside ContractEval's scope (no pre/post-condition annotations).
    Z3/SMT-based verification (explicitly excluded per h-e1 failure lessons).
    Human evaluation or annotation (pipeline-enforced constraint).
    Tasks where ContractEval soundness check fails (quarantined and excluded).
  known_limitations: |
    Hypothesis coverage is probabilistic — cannot guarantee complete contract-space exploration.
    icontract-hypothesis strategy inference may fail for complex pre-conditions (reported per task).
    Closed model APIs introduce non-determinism at temperature > 0 (controlled via fixed seed).
    Results generalize to algorithmic tasks; may not extend to software engineering tasks (SWE-bench).
    Cross-model comparison is observational — cannot attribute gaps to specific training decisions.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "On EvalPlus's 764-test-per-task static inputs, the mean contract-failure rate for test-passing programs exceeds the differential-oracle failure rate by ≥10% absolute, with ≥5% absolute from contract-unique violations (output-equal-to-gt but contract-failing)"
    test_method: |
      Experiment A: Load EvalPlus HumanEval+/MBPP+ test inputs (JSON). For each LLM program
      passing base tests, evaluate each input under: (1) ground-truth equality oracle,
      (2) ContractEval pre/post-condition execution. Compute oracle-isolation gap = mean(C_pt) - mean(D_pt).
      Classify failures into contract-unique (output-equal, contract-fail) vs. redundant.
      Wilcoxon signed-rank test over tasks, Holm correction for multiple comparisons.
    success_criterion: |
      Mean oracle-isolation gap ≥ 0.10 (absolute), Wilcoxon p < 0.01 after Holm correction.
      Contract-unique failure mass ≥ 0.05 (absolute) with bootstrap 95% CI lower bound > 0.03.
    falsification: "Mean gap ≤ 0.02 or non-significant (p > 0.05 after correction)"
  - id: "P2"
    primary: false
    statement: "Model rankings on contract-satisfaction rate are orthogonal to HUMANEVAL+ pass@1⋆ rankings: Kendall τ ≤ 0.6 and partial ΔR² ≥ 0.10 in regression controlling for pass@1⋆"
    test_method: |
      Compute per-model mean contract-satisfaction rate (Experiment B adaptive PBT).
      Compute Kendall τ and Spearman ρ between contract-satisfaction and pass@1⋆.
      Fit regression: contract_rate ~ pass@1⋆ + log(model_size) + model_type.
      Compute ΔR² for model_identity fixed effects.
      Permutation test for τ significance.
    success_criterion: "Kendall τ ≤ 0.6 (permutation p < 0.05) AND ΔR² ≥ 0.10"
    falsification: "Kendall τ ≥ 0.8 OR ΔR² < 0.05 in full regression"
  - id: "P3"
    primary: false
    statement: "Contract-strength gap varies by ≥10% absolute between the highest and lowest performing model families on ContractEval, beyond what pass@k differences explain"
    test_method: |
      Compute per-model contract-strength gap = fraction of test-passing programs failing ≥1 contract
      under adaptive PBT (Experiment B). Compute range = max_model_gap - min_model_gap.
      Test significance of model family coefficient in mixed-effects model controlling for task difficulty.
    success_criterion: "Range ≥ 0.10 absolute, model family coefficient p < 0.05 controlling for pass@k"
    falsification: "Range < 0.05 or non-significant model family effect after pass@k control"

