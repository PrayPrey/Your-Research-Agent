# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLM generates code that satisfies finite test cases via pattern completion or memorization of training-distribution (task, solution) pairs"
      evidence: "ContractEval shows 75-82% pass@1 across 5 LLMs; EvalPlus demonstrates models can game sparse test suites"
      falsifier: "If contract-violating programs show no correlation with test-passing (random contract failures), then this step is wrong — violations are orthogonal to test success"
    - step: 2
      description: "ContractEval's pre/post-condition contracts encode universal properties (relational invariants, quantified conditions over all valid inputs) that the finite test suite cannot exhaustively check"
      evidence: "ContractEval contract structure uses list comprehensions, all/any quantification, structural predicates — richer than equality tests; h-e1 confirmed contracts catch test-passing violators (7.42% ratio)"
      falsifier: "If AST analysis shows most postconditions are simple equality to ground truth, the universal property mechanism is wrong"
    - step: 3
      description: "Hypothesis PBT with icontract-hypothesis strategy inference systematically explores input space beyond test coverage, finding inputs where the LLM implementation violates the universal property"
      evidence: "Bose 2025: PBT finds 18-32% additional failures; Maaz et al. 2025: Hypothesis finds real bugs in production code; h-e1: Z3 found violations in 7.42% tractable subset (now extended to 100%)"
      falsifier: "If contract-failure rate on static EvalPlus inputs (fixed oracle, matching density) equals adaptive PBT failure rate, then exploration is not the mechanism — oracle is"
    - step: 4
      description: "Cross-model variation in contract-strength gap reflects systematic differences in LLMs' ability to satisfy universal properties vs. finite-test correctness, not explained by model size or pass@k alone"
      evidence: "Liguori 2026: model size × data quality explains 83% of correctness variance; EvalPlus: ranking inversions exist even in dense testing — contracts expected to amplify divergence"
      falsifier: "If Kendall τ ≥ 0.8 between contract-satisfaction and pass@1⋆, or ΔR² < 0.05 in regression, then cross-model variation is monotonic with functional correctness"
  key_tension: "Distinguishing oracle strength (contracts are semantically richer than equality) from adaptive search advantage (Hypothesis explores better than mutation — making the gap an artifact of input strategy, not contract semantics). The dual-experiment design (static oracle isolation vs. adaptive PBT) directly resolves this tension."
  evidence_summary: |
    The causal chain is supported by: (1) h-e1's direct demonstration that ContractEval contracts
    catch test-passing violators at 7.42% on the tractable subset; (2) Bose 2025 showing PBT
    finds 18-32% additional failures vs. unit tests; (3) OpenAI Code Monitor 2026 confirming
    52.9% test-passing programs fail hidden checks at scale; (4) EvalPlus demonstrating that
    even dense testing (764 tests/task) leaves semantic gaps. The primary unresolved question
    is whether the gap is due to contract semantics (oracle strength) vs. Hypothesis's adaptive
    search strategy — addressed by Experiment A (static oracle isolation).

