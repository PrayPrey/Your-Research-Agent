# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ContractStrength-v2"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under ContractEval's 364 HumanEval+/MBPP+ tasks, if LLM-generated programs that pass all
    unit tests are evaluated via execution-based contract checking (Hypothesis PBT with
    icontract-hypothesis strategy inference), then (a) the mean contract-failure rate exceeds
    EvalPlus matched-input differential-oracle failure rate by ≥10% absolute (with ≥5% absolute
    from contract-unique violations: output-equal-to-gt but contract-failing), (b) model rankings
    on contract-satisfaction differ from pass@1⋆ rankings with Kendall τ ≤ 0.6, and (c)
    contract-strength gap varies by ≥10% absolute between best and worst model families,
    because contracts encode universal properties (relational invariants, quantified conditions)
    that finite test suites cannot exhaustively check, causing LLM code that memorizes or
    correctly computes test-distribution outputs to systematically fail on out-of-distribution
    inputs that contracts specify must also hold.
  alternative_hypothesis_h0: |
    Execution-based contract checking provides no statistically significant additional signal
    beyond dense differential testing (EvalPlus 764-test-per-task): mean oracle-isolation gap
    ≤ 2%, Kendall τ ≥ 0.8 with pass@1⋆, and contract-satisfaction rate is explained by
    pass@1⋆ and model size (R² ≥ 0.85).

