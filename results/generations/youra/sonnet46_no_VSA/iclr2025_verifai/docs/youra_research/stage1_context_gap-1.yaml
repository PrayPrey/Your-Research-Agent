gap_id: "gap-1"
gap_title: "No Execution-Based Contract-Strength Measurement Across LLM Families on ContractEval"
gap_description: |
  ContractEval (Lim et al. 2025, ACL 2026) establishes the benchmark (364 tasks, HumanEval+/MBPP+,
  pre/post-conditions) but uses SMT-based test synthesis — the exact bottleneck that caused h-e1 failure.
  No study has measured the contract-strength gap (test-pass-but-contract-fail rate) using Python-native
  execution checking across both open and closed model families including GPT-4o, Claude 3.5,
  DeepSeek-Coder, and CodeLlama variants at multiple sizes.
