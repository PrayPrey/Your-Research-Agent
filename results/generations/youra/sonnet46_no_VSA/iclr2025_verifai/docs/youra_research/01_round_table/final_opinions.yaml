      denominator for contract-strength gap measurement.
    key_points:
      - "First execution-based cross-model contract evaluation on ContractEval (5 models incl. closed)"
      - "Contract-unique failures (output-equal, contract-failing) are genuinely new evaluation signal"
      - "Phase transition from 25.82% → 100% tractability enables first complete measurement"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      STRONG. The hypothesis is now fully falsifiable with pre-registered, quantitative
      thresholds. P1: Wilcoxon p < 0.01, mean gap ≥ 0.10, contract-unique mass ≥ 0.05 (falsified
      by gap ≤ 0.02 or p > 0.05). P2: Kendall τ ≤ 0.6, ΔR² ≥ 0.10 (falsified by τ ≥ 0.8 and
      ΔR² < 0.05). P3: ≥10% model-family gap controlling for pass@k. Oracle soundness pre-check
