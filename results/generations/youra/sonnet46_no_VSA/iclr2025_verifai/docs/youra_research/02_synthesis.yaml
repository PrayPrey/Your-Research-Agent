    - "h-e1 Z3 baseline (25.82% tractable, 7.42% strength ratio — lower bound)"
    - "darshana-v/llmcodeprobe (CrossHair+Hypothesis on HumanEval/MBPP, unpublished)"

measurement_plan:
  data_collection:
    - source: "evalplus/evalplus backends: generate n=10 code samples per (model, task) pair"
    - source: "ContractEval repository: pre/post-condition contracts for all 364 tasks"
    - source: "EvalPlus published test inputs: 764 inputs/task for HumanEval+/MBPP+ (JSON)"
  procedure:
    - step: "Reference soundness check: run Hypothesis (100k examples, 2h) against ContractEval reference implementations; quarantine tasks with violations"
    - step: "Experiment A (oracle isolation): evaluate all test-passing LLM programs on EvalPlus static inputs under both differential and contract oracles; classify failures"
    - step: "Experiment B (adaptive PBT): run Hypothesis+icontract-hypothesis (5k examples, fixed seed, 60s) per (model, task, program) triple; record violation rate and filter rate"
    - step: "Contract richness audit: AST-parse ContractEval postconditions; categorize by quantification/relational/structural complexity"
    - step: "Statistical analysis: Wilcoxon paired test, Kendall τ, regression with ΔR², bootstrap CI"
    - step: "Oracle adequacy: greedy set cover reduction; measure preservation ≥90% total, ≥85% contract-unique"
  success_criteria:
    - "P1: mean oracle-isolation gap ≥ 0.10, Wilcoxon p < 0.01, contract-unique mass ≥ 0.05"
    - "P2: Kendall τ ≤ 0.6 (permutation p < 0.05), ΔR² ≥ 0.10"
    - "P3: best/worst model gap ≥ 0.10 absolute, p < 0.05 controlling for pass@k"

validation:
  internal_validity:
    - "Oracle isolation via static input matching (Experiment A) eliminates input distribution confound"
    - "Pre-registered thresholds prevent post-hoc threshold adjustment"
    - "Fixed seeds and budgets ensure reproducibility"
    - "Reference soundness check eliminates defective contract confound"
    - "Holm correction for multiple comparisons across tasks"
  external_validity:
    - "ContractEval covers both HumanEval+ and MBPP+ — two distinct benchmark distributions"
    - "5 model families (open/closed, small/large) — representative of production deployment choices"
    - "Limitation: results may not generalize beyond algorithmic/functional programming tasks"
    - "Limitation: Hypothesis coverage is probabilistic — upper bounds not guaranteed"

discussion_synthesis:
  key_insights:
    - "The oracle isolation design (Experiment A using EvalPlus static inputs) was the key breakthrough — it directly addresses the 'is this just more fuzzing?' objection without requiring new input generation"
    - "The contract-unique failure category (output-equal-to-gt but contract-failing) is the most scientifically interesting signal — it isolates cases where contracts encode semantics beyond functional equivalence"
    - "Prof. Pax's insight about measuring filter rates per task is critical for honest reporting of Hypothesis's effective coverage on ContractEval's complex pre-conditions"
    - "The h-e1 failure rate (7.42% on tractable subset) serves as a validated lower bound for the new experiment's expected violation rate"
  breakthrough_moments:
    - "Exchange 9 (Prof. Pax): realizing EvalPlus static inputs can be reused for oracle isolation without new data generation — eliminates the most expensive part of the experiment"
    - "Exchange 12 (Prof. Rex): classifying violations into contract-unique vs. redundant — this diagnostic distinguishes oracle strength from fuzzing amplification"
    - "Exchange 13 (Dr. Ally): connecting contract-unique violations to the h-e1 precedent (27 confirmed violations) — shows the mechanism is already empirically validated on the tractable subset"
  resolved_tensions:
    - "Oracle strength vs. adaptive search advantage: resolved by dual-experiment structure (A: static oracle isolation, B: adaptive PBT)"
    - "25% projection from h-e1 7.42% extrapolation: resolved by dropping the projection and using oracle-isolation gap (≥10% on static inputs) as primary criterion"
    - "Feasibility concern about model API costs: resolved at ~$50-100 for 5 models × 364 tasks × 10 samples"
    - "SMT vs. execution tractability: resolved by design — execution-based checking is 100% tractable by construction"
