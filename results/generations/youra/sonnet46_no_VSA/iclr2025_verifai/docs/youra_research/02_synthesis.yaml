hypothesis_draft:
  title: "Execution-Based Contract Strength Gap: A Cross-Model Measurement Study on ContractEval"
  hypothesis_id: "H-ContractStrength-v2"
  core_claim: |
    For LLM-generated programs that pass all unit tests on ContractEval's 364
    HumanEval+/MBPP+ tasks, Hypothesis PBT with icontract-hypothesis strategy inference
    reveals a contract-strength gap that exceeds dense differential testing (EvalPlus 764
    tests/task) by ≥10% absolute on the same static inputs (with ≥5% from contract-unique
    violations), and varies significantly across model families (Kendall τ ≤ 0.6 with
    pass@1⋆, ΔR² ≥ 0.10).
  mechanism: |
    LLM-generated code satisfies finite test cases via pattern completion on training-
    distribution inputs. ContractEval contracts encode universal properties (relational
    invariants, quantified conditions over all valid inputs) unreachable by finite test
    suites. Hypothesis PBT explores beyond test coverage via adaptive search guided by
    pre-conditions (icontract-hypothesis), finding inputs where the LLM implementation
    violates the universal property despite matching ground truth on provided tests.
    This is the mechanism h-e1 confirmed on the 25.82% Z3-tractable subset — now extended
    to 100% tractable coverage via Python-native execution.
  predictions:
    - P1: "Oracle strength: mean contract-failure on EvalPlus static inputs ≥10% above differential oracle (Wilcoxon p<0.01), with ≥5% contract-unique mass"
    - P2: "Ranking orthogonality: Kendall τ ≤ 0.6 with pass@1⋆, ΔR² ≥ 0.10 beyond pass@1⋆ in regression"
    - P3: "Cross-model variation: ≥10% absolute gap between best/worst model families, significant after pass@k control"

variables_summary:
  independent: "Verification method (differential baseline / static contract / adaptive PBT) × LLM model family (5 models) × model type (open/closed)"
  dependent_primary: "Contract-strength gap = fraction of test-passing programs failing ≥1 contract under Hypothesis PBT"
  controlled: "Input budget (5k examples, fixed seed), dataset (ContractEval 364 tasks), generation (n=10 samples/model/task)"

null_hypothesis:
  h0_statement: |
    Execution-based contract checking provides no statistically significant additional
    signal beyond EvalPlus dense differential testing: mean oracle-isolation gap ≤ 2%,
    Kendall τ ≥ 0.8 with pass@1⋆, and contract-satisfaction rate is fully explained
    by pass@1⋆ and model size (R² ≥ 0.85, ΔR² < 0.05).
  statistical_test: "Wilcoxon signed-rank (paired oracle comparison), Kendall τ permutation test, partial F-test for regression ΔR²"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Oracle isolation experiment using EvalPlus's published 764-test static inputs re-evaluated under contract oracle — cleanly separates oracle strength from adaptive search advantage without generating new data"
  differentiation_summary: |
    First execution-based (not SMT) cross-model contract-strength gap measurement on
    ContractEval. Extends ContractEval's own evaluation (SMT-only, 5 open models) by:
    (1) replacing Z3 with Python-native Hypothesis achieving 100% tractability vs. 25.82%;
    (2) adding closed models (GPT-4o-mini, Claude-3-haiku) for first open/closed comparison;
    (3) adding oracle isolation experiment absent from all prior work. Extends Bose 2025
    (PBT, 2 models) to 5 models with oracle controls. Builds directly on h-e1's confirmed
    result (7.42% violation rate) to scale from tractable subset to full 364 tasks.

