    - "Claude-3-haiku (closed, ~7B equiv)"
    - "DeepSeek-Coder-V2-Lite (open, 16B)"
    - "CodeLlama-13B (open)"
    - "CodeLlama-34B (open)"
  datasets:
    - "ContractEval 364 tasks (suhanmen/ContractEval, ACL 2026)"
    - "EvalPlus static inputs (evalplus/evalplus, NeurIPS 2023)"
  baselines:
