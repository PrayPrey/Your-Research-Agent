measurement_plan:
  data_collection:
    - source: "ModelZooDataset CIFAR10-GS (Zenodo 6620869) — same dataset as sh1/sh2"
    - source: "sh1 code artifacts: cise_encoder.py, permutation.py, evaluate.py, data_loader.py"
  procedure:
    - step: "PREREQUISITE: Audit sh1's apply_channel_permutation() — verify coupled row-column action (functional permutations)"
    - step: "Implement functional permutation validator: for N models, compute ||f_v(x) - f_{g·v}(x)||_∞ ≤ 1e-6"
    - step: "Compute OrbitVar for all 5 encoders (100 models × 50 permutations each)"
    - step: "Train LightGBM on each encoder's embeddings (5-fold CV, same HP search)"
    - step: "Compute MSE_perm for C1: K=50 orbit samples per model, E_v[Var_g(ŷ(g·v))]"
    - step: "Compute MSE_res = MSE_total - MSE_perm; verify mechanism closure ΔMSE = MSE_perm ± 10%"
    - step: "Matched linear head ablation: Ridge regression on frozen C2, C3 embeddings (isolate expressivity)"
    - step: "Distribution-shift robustness: evaluate trained predictors on CIFAR-10-C zoo if available"
  success_criteria:
    - "P1: OrbitVar(C2, C3) < 1e-6 (architectural invariance verified)"
    - "P2: R²(C1) < R²(C0) AND MSE_perm^C1 ≥ 0.10 × MSE_total^C1 (CISE noise non-negligible)"
    - "P3: R²(C2) ≥ R²(C0) AND |ΔMSE - MSE_perm^C1| / MSE_perm^C1 ≤ 0.10 (mechanism closure)"
    - "P4: R²(C3 linear) - R²(C2 linear) ≥ 0.01 (95% CI excludes 0, ≥5 seeds)"

