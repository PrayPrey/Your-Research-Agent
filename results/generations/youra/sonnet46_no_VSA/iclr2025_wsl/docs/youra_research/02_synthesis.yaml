hypothesis_draft:
  title: "Architectural Permutation-Invariance Improves ModelZoo Prediction by Eliminating Encoder Symmetry Noise"
  hypothesis_id: "H-InvEnc-v1"
  core_claim: |
    Under functionally valid S_16³ permutations (coupled row-column per DWSNet formalism),
    architecturally invariant weight encoders (DeepSets, NFN) achieve near-zero OrbitVar
    AND LightGBM R² at least matching simple per-layer statistics (R²≈0.984), while
    CISE underperforms both because its sinusoidal PE introduces non-negligible permutation-
    induced prediction variance (MSE_perm ≥ 10% of MSE_total).
  mechanism: |
    CISE's sinusoidal positional encoding sin(cπ/C), cos(cπ/C) assigns unique embeddings
    to each channel position, making the encoder sensitive to channel order. Under S_16³
    functional permutations (which preserve network function but change weight ordering),
    CISE produces different representations for functionally identical networks. This
    within-orbit variance (OrbitVar=0.010333) propagates to prediction-level variance
    (MSE_perm), which directly inflates expected squared prediction error. Architecturally
    invariant encoders (DeepSets: φ(w_c) summed over channels; NFN: parameter-sharing
    equivariant layers) guarantee OrbitVar→0 by construction, eliminating this noise source.
    The causal test: ΔMSE(C1→C2) = MSE_perm^C1 ± 10% (mechanism closure criterion).
  predictions:
    - P1: "DeepSets and NFN achieve OrbitVar < 1e-6 under functionally verified permutations"
    - P2: "CISE achieves R² < Ŵ_L baseline AND MSE_perm^C1 ≥ 10% of MSE_total^C1"
    - P3: "DeepSets achieves R² ≥ Ŵ_L; ΔMSE matches MSE_perm^C1 ± 10%"
    - P4: "NFN achieves R² > DeepSets under matched linear head (ΔR² ≥ 0.01, 95% CI)"

variables_summary:
  independent: "Weight encoder architecture (C0=Ŵ_L, C1=CISE, C2=DeepSets, C3=NFN, C4=HIE)"
  dependent_primary: "OrbitVar (encoder-level) + LightGBM R² (downstream) + MSE_perm (mechanistic)"
  controlled: "Train/test split, LightGBM HP, embedding dimensionality, random seeds (≥5)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in LightGBM R² between architecturally invariant
    encoders (C2, C3) and simple per-layer statistics (C0), indicating that LightGBM
    implicitly learns approximate permutation invariance regardless of encoder architecture.
    Equivalently: CISE R² ≥ Ŵ_L R², and MSE_perm^C1 < 1% of MSE_total^C1.
  statistical_test: "5-fold CV paired t-test on R²; one-sided test for R²(C2) ≥ R²(C0)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "MSE bias-variance decomposition over permutation orbits as causal diagnostic: E[(y-ŷ)²] = MSE_res + MSE_perm. First application of this decomposition to weight encoder selection."
  differentiation_summary: |
    NFN and DWSNet papers measure downstream performance improvements without OrbitVar or MSE_perm.
    Unterthiner 2020 establishes R² baseline without encoder symmetry analysis.
    This work is first to connect all three measurements (OrbitVar, MSE_perm, R²) in a
    closed causal loop, establishing OrbitVar as a diagnostic metric for encoder quality.

