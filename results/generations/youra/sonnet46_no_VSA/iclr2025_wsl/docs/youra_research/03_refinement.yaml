# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Encoder architectural design determines OrbitVar — the within-orbit representational variance under functional permutations"
      evidence: "Deep Sets Theorem 2 [Zaheer et al., 2017]: sum pooling guarantees OrbitVar=0 by construction. CISE PE breaks this symmetry, producing OrbitVar=0.010333 [sh1 PASS]."
      falsifier: "If DeepSets encoder achieves OrbitVar > 0.001 under correctly implemented functional permutations, architectural guarantee failed (implementation bug)."
    - step: 2
      description: "OrbitVar in encoder space propagates to prediction-level variance MSE_perm in trained predictor output"
      evidence: "Indirect: sh2 showed OrbitVar unchanged → R² unchanged (no reduction). Direct measurement of MSE_perm for CISE is the novel contribution."
      falsifier: "If CISE achieves MSE_perm < 1% of MSE_total, OrbitVar-based representation noise is negligible and cannot causally explain R² differences."
    - step: 3
      description: "Reduced MSE_perm → reduced expected squared error → higher R²"
      evidence: "Bias-variance decomposition: E[(y-ŷ)²] = MSE_res + MSE_perm. Mechanism closure test: ΔMSE(C1→C2) = MSE_perm^C1 ± 10%."
      falsifier: "If orbit-averaged C1 predictions match C2 performance AND ΔMSE ≈ MSE_perm^C1, invariance is the mechanism. If ΔMSE ≫ MSE_perm^C1, representation geometry (not noise) is the driver — separate hypothesis."
  key_tension: "R² ceiling effect (Unterthiner baseline at 0.984 leaves only 1.6% headroom); the maximum achievable gain from eliminating MSE_perm depends on how much MSE_perm contributes to residual error."
  evidence_summary: |
    Step 1 is theoretically proven (Deep Sets Theorem 2) and empirically confirmed for the non-invariant direction
    (sh1 PASS: CISE OrbitVar=0.010333). Step 2 is the key novel measurement (MSE_perm quantification). Step 3
    is testable via bias-variance decomposition with pre-registered closure criterion (±10%).

