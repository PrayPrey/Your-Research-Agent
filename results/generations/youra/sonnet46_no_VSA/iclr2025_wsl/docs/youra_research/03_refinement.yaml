key_assumptions:
  - id: "A1"
    assumption: "sh1's apply_channel_permutation() implements functional permutations (coupled row-column across adjacent layers per DWSNet Eq. 5)"
    supporting_evidence: "sh1 PASS established CISE OrbitVar=0.010333. If permutations were non-functional, the baseline must be re-run."
    consequence_if_violated: "OrbitVar = 0.010333 is measured under non-functional perturbations; CISE baseline invalid. All comparisons to sh1 baseline invalid."
  - id: "A2"
    assumption: "LightGBM does not implicitly learn perfect permutation invariance from CISE embeddings, preserving non-negligible MSE_perm"
    supporting_evidence: "Unterthiner [2020] reports permutation-invariance probe showing MAD~0.05 in predictions under permutations — partial robustness, not full invariance."
    consequence_if_violated: "MSE_perm^C1 ≈ 0, gap between C1 and C2 collapses, hypothesis cannot be tested."
  - id: "A3"
    assumption: "ModelZooDataset CIFAR10-GS (Zenodo 6620869) has enough prediction headroom above CISE baseline R² for measurable improvement"
    supporting_evidence: "Unterthiner's simple statistics achieve R²=0.984, leaving 1.6% headroom. CISE R² unknown but expected ≤ 0.984."
    consequence_if_violated: "R² ceiling effect prevents measuring gains; redirect to Kendall's τ as alternative metric."
  - id: "A4"
    assumption: "DeepSets encoder (C2) and NFN encoder (C3) can be implemented with matched embedding capacity to C0/C1 for fair comparison"
    supporting_evidence: "NFN pip-installable (AllanYangZhou/nfn, 93★). DeepSets pattern verified in Phase 1 code context."
    consequence_if_violated: "Capacity mismatch confounds R² comparison; must use matched linear head as isolation test."
  - id: "A5"
    assumption: "The CIFAR-10-C distribution shift provides a meaningfully different test distribution for robustness evaluation"
    supporting_evidence: "CIFAR-10-C (corrupted versions) is a standard benchmark; ModelZooDataset provides models trained on CIFAR-10 which generalize differently under corruptions."
    consequence_if_violated: "Distribution-shift test has no power; restrict claims to in-distribution R² comparison only."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    ModelZooDataset CIFAR10-GS (Zenodo 6620869), CNNs with 3 convolutional layers + 1 dense layer,
    channel permutation group S_16³ applied as functional coupled row-column permutations,
    LightGBM as downstream predictor for test accuracy prediction.
  does_not_apply_to: |
    - Encoders using order statistics (quantiles, sorted values, histograms) over channel dimension [h-m1 FAIL lesson]
    - Post-hoc cross-model alignment as OrbitVar reduction mechanism [sh2 FAIL lesson]
    - RNN weight spaces or transformer weight spaces (different symmetry groups)
    - Supervised fine-tuned encoders (all encoders here are unsupervised feature extractors)
    - Hyperparameter prediction tasks (only test accuracy prediction is evaluated)
  known_limitations: |
    - R² ceiling effect: only 1.6% headroom above Unterthiner's simple statistics baseline
    - Functional permutation audit required before experiments (A1 unverified)
    - Distribution-shift test requires CIFAR-10-C zoo (may need separate download/construction)
    - NFN designed for MLPs; adaptation for CNN weight spaces requires spatial dimension folding

