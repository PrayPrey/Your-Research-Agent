predictions:
  - id: "P1"
    primary: true
    statement: "DeepSets (C2) and NFN (C3) achieve mean OrbitVar < 1e-6 under functionally verified S_16³ permutations"
    test_method: "Compute OrbitVar for 100 models × 50 permutations using sh1 evaluate.py modified for C2/C3 encoders"
    success_criterion: "mean OrbitVar < 1e-6 AND max OrbitVar < 1e-4 for both C2 and C3"
    falsification: "Any encoder achieving OrbitVar > 1e-4 has implementation bug in symmetry enforcement"
  - id: "P2"
    primary: true
    statement: "CISE (C1) achieves LightGBM R² strictly below Ŵ_L statistics baseline (C0), and MSE_perm^C1 ≥ 10% of MSE_total^C1"
    test_method: "5-fold CV LightGBM on C0 and C1 embeddings; MSE decomposition via K=50 orbit-sampling"
    success_criterion: "R²(C1) < R²(C0) AND MSE_perm^C1 / MSE_total^C1 ≥ 0.10"
    falsification: "If R²(C1) ≥ R²(C0) or MSE_perm^C1 < 0.01 × MSE_total^C1, CISE's PE noise is not the driver"
  - id: "P3"
    primary: false
    statement: "DeepSets (C2) achieves R² ≥ R²(C0) and mechanism closure: ΔMSE(C1→C2) = MSE_perm^C1 ± 10%"
    test_method: "5-fold CV LightGBM on C2; compute ΔMSE and compare to MSE_perm^C1"
    success_criterion: "R²(C2) ≥ R²(C0) AND |ΔMSE - MSE_perm^C1| / MSE_perm^C1 ≤ 0.10"
    falsification: "If R²(C2) < R²(C0), architectural invariance hurts vs approximate invariance (expressivity collapse). If ΔMSE ≫ MSE_perm^C1, mechanism is representation geometry not noise."
  - id: "P4"
    primary: false
    statement: "NFN (C3) achieves R² > DeepSets (C2) under matched linear head (linear regressor, not LightGBM)"
    test_method: "Ridge regression on frozen C2 and C3 embeddings; paired t-test across ≥5 seeds"
    success_criterion: "R²(C3 linear) - R²(C2 linear) ≥ 0.01, 95% CI excludes 0"
    falsification: "If C3 ≈ C2 under linear head, structured equivariance adds no representational value beyond pooled invariance"

