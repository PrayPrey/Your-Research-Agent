    - name: "C3: NFN"
      method: "pip install nfn; NF-Layers with parameter sharing for permutation equivariance [Zhou et al., 2023]"
    - name: "C4: HIE (Hybrid Invariant Encoder)"
      method: "Concatenation of C0 (Ŵ_L moments) + C2 (DeepSets sum features)"

