    - claim: "The true functional symmetry group for CNNs requires coupled row-column permutations across adjacent layers, not independent per-layer permutations"
      status: "PROVE_NEW"
      evidence: "DWSNet formalism [Navon et al., 2023], Eq. (5). sh1/sh2 permutation implementation must be audited."
    - claim: "Architecturally invariant encoders (DeepSets, NFN) achieve OrbitVar < 0.001 on ModelZooDataset CIFAR10-GS"
      status: "PROVE_NEW"
