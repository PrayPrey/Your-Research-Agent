established_facts:
  claims:
    - claim: "Per-layer quantile encoders are provably permutation-invariant by construction (order statistics)"
      status: "BUILD_ON"
      evidence: "h-m1 FAIL: OrbitVar(C1) = 1.24e-33. Lesson: do not use order statistics for aliasing experiments."
    - claim: "CISE encoder with sinusoidal PE achieves mean OrbitVar = 0.010333 under S_16³ channel permutations on ModelZooDataset CIFAR10-GS"
      status: "BUILD_ON"
      evidence: "sh1 PASS: n_models=100, n_permutations=100, gate threshold 0.01, margin +3.3%"
    - claim: "Post-hoc cross-model alignment (Hungarian LAP) does not reduce within-orbit OrbitVar"
      status: "BUILD_ON"
      evidence: "sh2 FAIL: OrbitVar(CISE_aligned) = 0.010325, reduction ratio 1.0×. Root cause: within-orbit vs cross-model variance are orthogonal."
    - claim: "Deep Sets Theorem 2: any permutation-invariant function = ρ(Σφ(xᵢ)); sum/mean pooling guarantees OrbitVar=0"
      status: "BUILD_ON"
      evidence: "Zaheer et al. [2017], arXiv 1703.06114, 3096 citations. Proven theorem."
    - claim: "Simple per-layer weight statistics (Ŵ_L moments: mean, variance, spectral norms) achieve R² > 0.984 on CIFAR10-GS ModelZooDataset"
      status: "BUILD_ON"
