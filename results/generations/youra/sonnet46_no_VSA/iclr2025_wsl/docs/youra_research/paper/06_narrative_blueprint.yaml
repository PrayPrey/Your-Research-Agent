    one_sentence: "First empirical closure of the OrbitVar → MSE_perm → R² causal chain, providing a diagnostic framework for encoder design in weight-space learning."
    why_significant: "Establishes that architectural invariance is not optional for correct weight-space encoding — the MSE decomposition diagnostic provides a reusable tool for any model zoo application."

  implications:
    for_field: "Model zoo practitioners now have a principled encoder design criterion (OrbitVar < threshold) backed by causal evidence. The MSE decomposition diagnostic can be applied to any weight-space learning task."
    for_practice: "DeepSets doubly-invariant encoder (5 lines of PyTorch, zero additional training data) replaces non-invariant encoders with +6.4pp R² improvement. The encoder code is fully reusable."

  future_possibilities:
    immediate_extensions: "HIE (C0+C2 concatenation) for maximum R²; NFN downstream comparison (installation issue resolved); permutation-augmented CISE training to isolate implicit vs architectural invariance."
    longer_term_vision: "Generalization of the MSE decomposition diagnostic to other symmetry groups (ResNets, ViTs, transformers); distribution-shift robustness testing under CIFAR-10-C."

