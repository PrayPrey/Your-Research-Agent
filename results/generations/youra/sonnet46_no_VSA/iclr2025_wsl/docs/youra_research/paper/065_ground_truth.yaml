# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 0-5 artifacts and validated paper
# Used by Adversary Agent to verify paper accuracy

version: "1.0"
extracted_at: "2026-08-03T22:00:00Z"
paper_file: "paper/06_paper.md"

# ============================================================================
# METRICS — From Phase 4/5 validation reports
# ============================================================================

metrics:
  orbit_var:
    c1_cise: 0.010333
    c2_deepsets: 1.002e-14
    c3_nfn: 8.905e-08
    gap_c1_c2_orders_of_magnitude: 12.0
    gap_c1_c3_orders_of_magnitude: 5.1
    gate_threshold: 1e-6
    gate_pass: true
    source: "h-e1/04_validation.md, h-m1/04_validation.md"

  statistical_test:
    test: "Wilcoxon signed-rank"
    statistic: 5050
    p_value: 1.95e-18
    model_coverage: "100/100 (100%)"
    source: "h-m1/04_validation.md"

  mse_decomposition:
    mse_total_c1: 0.001834
    mse_perm_c1: 0.006137
    ratio_mse_perm_over_total: 3.3452
    ratio_gate_threshold: 0.10
    ratio_gate_pass: true
    r2_c1_standard: 0.8511
    r2_c1_orbit_averaged: -1.6288
    kendall_tau_c1: 0.7205
    kendall_tau_c1_avg: -0.2817
    source: "h-m2/04_validation.md"

  downstream_r2:
    c0_per_layer_stats: 0.7316  # testset; Unterthiner 2020 training-CV = 0.984
    c1_cise: 0.8511
    c2_deepsets: 0.9148
    c3_nfn_fallback_c2: 0.9148  # C3 used C2 fallback due to NFN install failure
    improvement_c1_to_c2_pp: 6.37  # 0.9148 - 0.8511
    kendall_tau_c2: 0.7651
    mse_total_c2: 0.001049
    mse_perm_c2: 0.000000  # essentially zero, OrbitVar(C2) = 1.16e-14
    source: "h-m3/04_validation.md"

  closure_analysis:
    delta_mse_c1_to_c2: 0.000785  # actual
    mse_perm_c1: 0.006137  # predicted
    closure_value: 0.8720  # |actual - predicted| / predicted
    closure_gate: 0.10  # tolerance
    closure_pass: false  # FAILS
    source: "h-m3/04_validation.md"

  linear_head_ablation:
    c2_lightgbm_r2: 0.9148
    c2_ridge_r2: -6.42  # not linearly separable
    source: "h-m3/04_validation.md"

  functional_audit:
    max_functional_diff: 1.91e-6  # ||f_v - f_{pi*v}||_inf
    tolerance: 1e-6
    note: "1.91e-6 is within float32 precision (eps ~ 1.2e-7 per element, 16-channel accumulation)"
    source: "h-e1/04_validation.md, h-m2/04_validation.md"

# ============================================================================
# METHODOLOGY — From h-*/03_prd.md and 03_architecture.md
# ============================================================================

methodology:
  permutation_type: "S_n^3 coupled row-column (DWSNet Eq. 5)"
  k_permutations: 50
  seed: 1
  n_models: 100
  cnn_architecture: "3-conv (C: 3→8→6→4), 1 FC, AdaptiveAvgPool2d"
  permutation_group: "S_8 × S_6 × S_4"

  deepsets_c2:
    pooling: "sum (doubly invariant)"
    phi_dims: "[input, 64, 64]"
    rho_dims: "[64, 128]"
    embed_dim: 128
    theoretic_orbitvar: "0 exactly (Deep Sets Theorem 2)"

  cise_c1:
    embed_dim: 64
    channels: 16
    total_dim: 1024
    positional_encoding: "sinusoidal per channel index"

  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    cv_folds: 5
    seed: 42

# ============================================================================
# CLAIMS — What the paper claims vs actual evidence
# ============================================================================

