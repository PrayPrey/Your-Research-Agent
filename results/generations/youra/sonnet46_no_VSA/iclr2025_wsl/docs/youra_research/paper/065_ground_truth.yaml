# ============================================================================
# HONEST LIMITATIONS — Must be preserved in adversarial review
# ============================================================================

honest_limitations:
  - id: "closure_failure"
    description: "Additive closure criterion ΔMSE ≈ MSE_perm^C1 ± 10% not met (closure=0.872)"
    magnitude: "87.2% deviation from prediction"
    acceptable_framing: "Reveals entanglement phenomenon (new finding) rather than invalidating causal direction"
    must_not_be_hidden: true

  - id: "nfn_downstream_missing"
    description: "NFN downstream R² vs DeepSets comparison unavailable (library install failure)"
    impact: "P4 prediction (NFN vs DeepSets R²) unevaluated"
    must_not_be_hidden: true

  - id: "single_dataset"
    description: "All experiments on ModelZooDataset CIFAR10-GS: 100 CNNs, 3-conv, CIFAR-10"
    impact: "Results specific to S_8 × S_6 × S_4 permutation group and this model family"
    must_not_be_hidden: true

  - id: "r2_reference_sensitivity"
    description: "R²(C0)=0.731 testset vs 0.984 Unterthiner training-CV — cannot directly compare"
    impact: "Absolute R² comparison with published baseline requires matched protocol"
    must_not_be_hidden: true

# ============================================================================
# PHASE 4/5 GATE SUMMARY
# ============================================================================

hypothesis_gates:
  h-e1:
    type: "MUST_WORK"
    condition: "OrbitVar(C2) < 1e-6 AND OrbitVar(C3) < 1e-6"
    result: "PASS (C2=1.002e-14, C3=8.905e-08)"

  h-m1:
    type: "MUST_WORK"
    condition: "OOM ratio ≥ 4, Wilcoxon p < 0.001"
    result: "PASS (12 OOM C2, 5.1 OOM C3; p=1.95e-18)"

  h-m2:
    type: "MUST_WORK"
    condition: "MSE_perm/MSE_total ≥ 0.10"
    result: "PASS (ratio=3.3452)"

  h-m3:
    type: "SHOULD_WORK"
    condition: "R²(C2) ≥ 0.984 AND closure ≤ 0.10"
    result: "EXPLORE (R²=0.9148 < 0.984; closure=0.872 >> 0.10; direction confirmed)"
