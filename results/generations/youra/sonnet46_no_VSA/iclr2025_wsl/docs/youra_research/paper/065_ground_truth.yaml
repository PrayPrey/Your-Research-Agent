    actual_value: 1.002e-14
    verified: true

  - claim: "NFN achieves OrbitVar = 8.905e-08"
    location: "Section 5.1, Table 1"
    supporting_evidence: "h-e1/04_validation.md: mean_orbitvar_c3 = 8.905e-08"
    actual_value: 8.905e-08
    verified: true

  - claim: "CISE OrbitVar = 0.010333"
    location: "Section 5.1, Table 1 and throughout"
    supporting_evidence: "h-m1/04_validation.md, h-m2/04_validation.md (verified within 20% tolerance)"
    actual_value: 0.010333
    verified: true

  - claim: "Gap spans 5-12 orders of magnitude"
    location: "Abstract, Section 5.1"
    supporting_evidence: "C2: 12 OOM (1.002e-14 vs 0.010333); C3: 5.1 OOM (8.905e-08 vs 0.010333)"
    verified: true

  - claim: "Wilcoxon p = 1.95e-18, 100% model coverage"
    location: "Section 5.1"
    supporting_evidence: "h-m1/04_validation.md: statistic=5050, p=1.95e-18"
    verified: true

  - claim: "MSE_perm/MSE_total = 3.35 (33× threshold)"
    location: "Section 5.2, Table 2"
    supporting_evidence: "h-m2/04_validation.md: ratio = 3.3452"
    actual_value: 3.3452
    verified: true

  - claim: "R²(C1_avg) = -1.63"
    location: "Section 5.2, Table 2"
    supporting_evidence: "h-m2/04_validation.md: R²(C1_avg) = -1.6288"
