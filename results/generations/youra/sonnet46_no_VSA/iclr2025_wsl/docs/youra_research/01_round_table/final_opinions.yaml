    key_points:
      - "Establishes OrbitVar's validity as encoder quality diagnostic — positive or negative result is valuable"
      - "Distribution-shift robustness makes small R² gains publishable"
      - "First empirical answer to: does architectural symmetry add beyond approximate invariance?"

