measurement_plan:
  data_collection:
    - source: "TriviaQA dev HuggingFace (mandarjoshi/trivia_qa): 2500 question-answer pairs"
    - source: "TruthfulQA MC (sylinrl/TruthfulQA): MC1/MC2 evaluation split"
    - source: "Llama-3.1-8B responses: greedy decode (for log-prob features) + N=5 temp=0.7 samples (for SE, SelfCheckNLI)"
    - source: "LM-as-a-judge correctness labels: cross-model judge (Qwen-2.5-7B or GPT-4o-mini)"
  procedure:
    - step: "1. Generate responses: 1 greedy + 5 temp=0.7 samples per TriviaQA dev prompt using Llama-3.1-8B (reuse h-e1 generate.py checkpoint if available; otherwise fresh generation)"
    - step: "2. Extract features: min_logprob (greedy), full_seq_var (greedy), SE_N5 (DeBERTa-MNLI clustering on 5 samples), SelfCheckNLI_N5 (NLI contradiction probability on 5 samples)"
    - step: "3. Pre-experiment diagnostics: Spearman correlation matrix (5 features × response_length × LM-judge_correctness); orthogonality zone slice (min_logprob ≥ 0.8 AND SE top quartile) error enrichment check"
    - step: "4. Conditional LR: fit logit(h=1) ~ min_logprob + SE + L + SE×min_logprob; compute partial R² for SE via LRT"
    - step: "5. Ensemble training: 5-fold nested CV (inner: L2 regularization tuning; outer: AUROC evaluation)"
    - step: "6. Length-matched AUROC: construct matched pairs (correct vs incorrect, ±1 token), evaluate ΔAUROC with 2000 question-level bootstrap samples"
    - step: "7. Correctness-function sweep: compute ΔAUROC under ROUGE-L(F1), BERTScore(F1), LM-as-a-judge; verify sign-stability"
    - step: "8. Cross-model transfer: generate Qwen-2.5-7B responses on TruthfulQA (N=5, temp=0.7); apply Llama-calibrated weights; compute AUROC gap"
  success_criteria:
    - "P1: AUROC ≥ 0.85 (LM-judge, TriviaQA dev) AND ΔAUROC ≥ 0.025 (95% CI lower bound > 0, length-matched subset)"
    - "P2: Partial R²(SE) ≥ 0.02 AND β₂(SE) significant at p < 0.05 in conditional LR"
    - "P3: Cross-model AUROC gap < 0.05 (Llama→Qwen, TruthfulQA)"
    - "Diagnostic: ρ(SE, LM-judge) < 0.4 (circularity check)"
    - "Diagnostic: orthogonality zone error enrichment ≥ 10pp above base rate"

validation:
  internal_validity:
    - "Nested CV with question-level bootstrap CIs to prevent overfitting in 500-sample LR training"
    - "Separate LM-judge model (cross-model) to avoid SE-judge shared NLI reasoning (circularity check)"
    - "Length-matched subset evaluation to eliminate mutual length bias"
    - "Conditional LR with interaction terms to test SE contribution beyond min_logprob and length"
    - "UQ-feature OLS residualization (Condition 2, h-m2 validated) — NOT correctness label residualization (h-m2 SUPERSEDED)"
  external_validity:
    - "Replication on Qwen-2.5-7B without weight refitting (cross-model transfer)"
    - "Correctness-function robustness sweep (ROUGE-L, BERTScore, LM-judge) — sign-stability required"
    - "Secondary benchmark: TruthfulQA in addition to TriviaQA dev"
    - "N-efficiency ablation (N=3 vs N=5) as secondary analysis"

discussion_synthesis:
  key_insights:
    - "SE and min_logprob are algebraically distinct (entropy over semantic class masses vs minimum token probability) — orthogonality is theoretically motivated, not just hoped for"
    - "The 'orthogonality zone' (high confidence + high semantic disagreement) is the key mechanistic test: enrichment for hallucinations here would empirically validate the mechanism"
    - "Length-bias-robust evaluation (LM-as-a-judge + length-matched AUROC) is essential — the Santilli 2025 warning makes lexical-only AUROC insufficient for this claim"
    - "The hypothesis is meaningful regardless of sign: positive = SE adds independent signal; negative = likelihood saturation on TriviaQA short-answer QA (equally publishable)"
    - "Prior failure avoidance: all three prohibited approaches (hidden-state SVD, POS filtering, EM label residualization) are explicitly excluded"
  breakthrough_moments:
    - "Exchange 6 (Prof. Rex): Length-matched subset demand sharpened from 'OLS residualization' to direct pair-matching — stronger causal control"
    - "Exchange 9 (Dr. Nova): Theoretical derivation of algebraic distinctness (SE = entropy over semantic class masses, not sequence probability) provides mechanistic foundation"
    - "Exchange 13 (Dr. Ally): Refined hypothesis statement with all quantitative criteria integrated into a single, pre-registered testable claim"
    - "Exchange 14 (Prof. Vera): Circularity test (ρ(SE, AlignScore)) identified as pre-experiment diagnostic before any ensemble fitting"
  resolved_tensions:
    - "Length bias concern: Resolved by combination of length-matched subset AUROC + LM-as-a-judge correctness + UQ-feature (not label) OLS residualization"
    - "Circularity concern: Resolved by using cross-model judge (separate model from generator) and pre-experiment ρ(SE, judge) diagnostic"
    - "Overfitting concern: Resolved by nested CV with question-level bootstrap CIs and parsimony test (2-feature model B vs 5-feature model D)"
    - "Feature redundancy concern: Resolved by requiring incremental nested CV LRT and parsimony stopping criterion"
    - "Cross-model generalizability: Resolved by explicit cross-model transfer test (train Llama, test Qwen without refitting)"
