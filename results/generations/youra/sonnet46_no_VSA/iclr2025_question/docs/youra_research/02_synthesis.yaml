hypothesis_draft:
  title: "Semantic Entropy Provides Conditionally Independent Uncertainty Signal Over Min Log-Probability on TriviaQA/TruthfulQA with Open-Weight LLMs"
  hypothesis_id: "H-SE-Ensemble-v1"
  core_claim: |
    Under Llama-3.1-8B (temperature=0.7, N=5 stochastic samples) on TriviaQA dev (2500 prompts, LM-as-a-judge correctness with a cross-model judge), adding Semantic Entropy (SE_N5, bidirectional DeBERTa-MNLI NLI clustering) to a min_logprob baseline ensemble achieves ΔAUROC ≥ 0.025 (95% CI lower bound > 0 on length-matched subset), because SE captures semantic disagreement across stochastic samples that is conditionally independent of token-level minimum log-probability — demonstrated by partial R² ≥ 0.02 for SE in a conditional logistic regression, with results replicated on Qwen-2.5-7B without refitting ensemble weights (AUROC gap < 0.05 on TruthfulQA).
  mechanism: |
    SE computes entropy over semantic equivalence classes (probability masses of NLI-cluster memberships across N=5 stochastic samples), while min_logprob captures the minimum token probability along a single greedy decoding path. These are algebraically distinct: SE marginalizes over semantic class masses, min_logprob finds the weakest prediction point in a single decode. The 'orthogonality zone' (high min_logprob, high SE) represents prompts where the model generates locally fluent but globally semantically inconsistent answers — each individual sample looks confident at the token level, but across N=5 samples the model anchors on different semantic clusters. This zone is enriched for factual hallucinations (predicted error rate ≥ baseline + 10pp). The ensemble exploits this complementarity by combining features from different layers of uncertainty: token-level prediction confidence (min_logprob) and sample-level semantic coherence (SE).
  predictions:
    - P1: "AUROC ≥ 0.85 on TriviaQA dev (LM-as-a-judge, cross-model judge), with ΔAUROC ≥ 0.025 over min_logprob on length-matched subset (95% CI lower bound > 0)"
    - P2: "Partial R² ≥ 0.02 for SE in conditional LR controlling for min_logprob, response length, and SE×min_logprob interaction"
    - P3: "Cross-model transfer: Llama-calibrated ensemble weights applied to Qwen-2.5-7B on TruthfulQA yields AUROC gap < 0.05"

variables_summary:
  independent: "UQ method (baseline min_logprob vs +SE_N5 vs full 5-feature ensemble); N samples (3/5/10); LLM model (Llama-3.1-8B primary, Qwen-2.5-7B transfer)"
  dependent_primary: "AUROC under LM-as-a-judge correctness (cross-model judge) on TriviaQA dev 2500 prompts; range [0,1], higher = better hallucination detection"
  controlled: "Response length (via length-matched subset + UQ-feature OLS residualization per Condition 2 from h-m2, NOT correctness label residualization); correctness function (primary: LM-judge; secondary robustness: ROUGE-L, BERTScore); temperature=0.7; ensemble weights via 5-fold nested CV"

null_hypothesis:
  h0_statement: |
    There is no significant difference in AUROC between the min_logprob baseline and the [min_logprob + SE_N5] ensemble on TriviaQA dev under LM-as-a-judge correctness (ΔAUROC = 0, 95% CI overlapping zero on length-matched subset). Equivalently, SE does not provide conditionally independent uncertainty signal beyond token-level likelihood (partial R² ≈ 0 in conditional LR). This would indicate likelihood saturation: min_logprob already captures the full epistemic uncertainty relevant to TriviaQA short-answer factual QA.
  statistical_test: "Stratified bootstrap CI on ΔAUROC (question-level resampling, N=2000 bootstrap samples); Likelihood-ratio test for partial R² of SE in conditional LR; Two-sided test."
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First length-bias-robust AUROC benchmark for consistency+log-prob ensemble on TriviaQA/TruthfulQA with open-weight LLMs (Llama-3.1-8B, Qwen-2.5-7B). Operationalizes Santilli 2025's call for LM-judge evaluation with cross-model judge, length-matching, and correctness-function robustness sweep. First mechanistic conditional independence test (partial R² in conditional LR) for SE vs min_logprob."
  differentiation_summary: |
    - Kuhn 2023 (SE standalone, 30B OPT, ROUGE-L correctness): we add log-prob combination + LM-judge + length controls
    - Manakul 2023 (SelfCheckGPT on WikiBio): we use factual QA benchmarks + log-prob combination
    - Raghuvanshi 2025 (SQuAD2.0 only, no public code): we benchmark TriviaQA/TruthfulQA, open-weight, public code
    - UQLM 2025 (GPT-4o/Gemini, 6 other benchmarks): we provide open-weight benchmark with mechanistic analysis
    - h-m1 baseline (log-prob only, ~0.825): we add SE for conditional independence test

