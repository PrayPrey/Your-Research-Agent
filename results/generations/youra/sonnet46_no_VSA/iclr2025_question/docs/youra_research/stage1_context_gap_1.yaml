gap_id: "gap_1"
gap_title: "No Direct Benchmark of Consistency+Log-Prob Ensemble on TriviaQA/TruthfulQA with Open-Weight Models"
gap_description: |
  No published AUROC for combined [consistency signals + min_logprob + full_sequence_variance]
  ensemble on TriviaQA dev or TruthfulQA using Llama-3.1-8B or Qwen-2.5-7B. SelfCheckGPT tests
  consistency alone on WikiBio. Semantic entropy tests SE alone on TriviaQA. The specific combination
  with log-prob features on TriviaQA/TruthfulQA is untested with open-weight models.
