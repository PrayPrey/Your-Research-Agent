narrative_blueprint:
  generated_at: "2026-08-03T00:00:00Z"
  workflow: "phase6-paper-writing"
  paper_title: "Near-Orthogonal Uncertainty Signals in LLMs: Empirical Independence of Semantic Entropy and Minimum Token Log-Probability on TriviaQA"

  hook_strategy:
    type: "surprising_statistic"
    anchor: "Pearson |r|(SE_N5, min_logprob) = 0.049"
    contrast: "First-token confidence vs. semantic agreement: r = 0.54–0.76 (arxiv 2605.05166). Our min_logprob vs. SE_N5: r = 0.049. The two most commonly used uncertainty proxies for LLMs are near-orthogonal."
    narrative_tension: "If log-probability already captures uncertainty optimally (AUROC ~0.975 in SNNE), why combine signals? Because the algebraic distinction between semantic-class entropy and token-level minimum confidence manifests as empirical near-orthogonality — a necessary condition for ensemble benefit."
    opening_sentence: "Two of the most commonly employed uncertainty signals for large language models — Semantic Entropy (SE) and minimum token log-probability — measure fundamentally different properties of a model's output, yet their practical independence has not been directly tested on open-weight models under length-bias-robust evaluation."

  problem_framing:
    level1_surface: "LLMs produce hallucinations that are hard to detect without ground truth."
    level2_mechanism: "Uncertainty quantification (UQ) methods exist — SE from stochastic sampling, log-prob from single forward pass — but their complementarity is unvalidated on open-weight models under length-bias-robust evaluation."
    level3_scientific: "Is the algebraic distinction between entropy over semantic-class masses (SE) and minimum token-prediction confidence (min_logprob) sufficient to produce statistically independent signals in practice? If yes, their combination as an ensemble is mechanistically justified."

  key_insight:
    statement: "SE_N5 and min_logprob are empirically near-orthogonal uncertainty representations (Pearson |r| = 0.049), confirming that their algebraic distinctness — entropy over NLI-cluster semantic class masses vs. weakest-link token confidence — translates to statistical independence on TriviaQA dev with Llama-3.1-8B-Instruct."
    evidence: "Pearson |r| = 0.049 at N=300 (PASS gate < 0.70); ABANDON threshold 0.85 not triggered; Spearman ρ(SE, correctness) = −0.081 (circularity OK); SE variance = 0.133 (non-degenerate); all mechanism reality checks pass."
    implication: "This independence empirically justifies combining SE and min_logprob as complementary ensemble features — they are not redundant reparameterizations of the same information source."

  evidence_structure:
    primary_claim:
      claim: "SE_N5 and min_logprob are near-orthogonal (Pearson |r| = 0.049)"
      strength: "HIGH — clean gate pass; ABANDON not triggered"
      figure: "scatter_se_vs_minlogprob.png + gate_metrics.png"
    secondary_claim:
      claim: "Low circularity: cross-model LM-judge design yields ρ(SE, correctness) = −0.081"
      strength: "HIGH at N=300"
      figure: "correlation_heatmap.png"
    pending_claim:
      claim: "Partial R² direction confirmed (0.0101), magnitude pending N=2500"
      strength: "MEDIUM — underpowered PoC, not refuted"
      figure: "lr_coefficients.png"
    inconclusive:
      - "Ensemble ΔAUROC ≥ 0.025 (not computed at PoC level)"
      - "Cross-model transfer Llama→Qwen (not tested)"

  section_plan:
    - section: "00_abstract.md"
      written_last: true
      content: "High-level summary with actual quantitative results; written after all sections done."
    - section: "01_introduction.md"
      content: "Hook (|r|=0.049 vs expected 0.54–0.76), problem framing (3 levels), gap, contributions."
    - section: "02_related_work.md"
      content: "SE (Kuhn 2023), min_logprob/SelfCheck (Manakul 2023), UQLM (Bouchard 2025), length-bias (Santilli 2025), first-token confidence (arxiv 2605.05166), ensemble UQ prior work."
    - section: "03_methodology.md"
      content: "Dataset (TriviaQA dev rc.nocontext, N=300 PoC / N=2500 target), models (Llama-3.1-8B generator, Qwen-2.5-7B judge, DeBERTa-MNLI NLI), SE_N5 computation, min_logprob, conditional LR, gate protocol, evaluation metrics."
    - section: "04_experiments.md"
      content: "Experimental setup details, PoC rationale (N=300 smoke test), gate criteria, mechanism reality checks, circularity diagnostic."
    - section: "05_results.md"
      content: "Main results table (Pearson |r|=0.049, partial R²=0.0101, ρ(SE,y)=−0.081, SE var=0.133), gate evaluation, mechanism checks, figures walkthrough."
    - section: "06_discussion.md"
      content: "Interpret near-orthogonality, connection to literature, unexpected findings (low circularity), limitations (PoC underpowering, scope), future work (N=2500, ensemble AUROC, transfer)."
