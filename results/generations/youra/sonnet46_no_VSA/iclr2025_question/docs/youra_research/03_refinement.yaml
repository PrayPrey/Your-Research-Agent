  key_innovation: "Length-bias-robust AUROC evaluation protocol combining: LM-as-a-judge with cross-model judge + length-matched subset AUROC + conditional logistic regression with partial R² + correctness-function robustness sweep. This protocol operationalizes the Santilli 2025 call for bias-robust UQ evaluation on the most widely used factual QA benchmarks."
  differentiation:
    - prior_work: "Kuhn et al. 2023 (Semantic Uncertainty, arXiv:2302.09664)"
      difference: "SE standalone on TriviaQA (30B OPT, LLaMA-2). Our work: SE combined with min_logprob ensemble, evaluated on Llama-3.1-8B/Qwen-2.5-7B, under LM-as-a-judge with length-bias controls."
    - prior_work: "Manakul et al. 2023 (SelfCheckGPT, arXiv:2303.08896)"
      difference: "SelfCheckGPT on WikiBio passage generation only. Our work: TriviaQA/TruthfulQA short-answer QA, combined with log-prob features."
    - prior_work: "Raghuvanshi et al. 2025 (token-log-prob + NLI + SE)"
      difference: "SQuAD2.0 only, AUC=0.818, no public code. Our work: TriviaQA dev + TruthfulQA, open-weight models, public code, length-bias-robust evaluation."
    - prior_work: "UQLM Bouchard et al. 2025 (arXiv:2504.19254)"
      difference: "GPT-4o/Gemini models, GSM8K/CSQA/NQ-Open benchmarks. Our work: open-weight Llama-3.1-8B/Qwen-2.5-7B, TriviaQA/TruthfulQA."

