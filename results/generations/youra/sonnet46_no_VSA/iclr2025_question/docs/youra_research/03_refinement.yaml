      type: "continuous"
      operationalization: "AUROC(ensemble) - AUROC(best individual feature = min_logprob or SE alone), 95% bootstrap CI computed over questions (not samples)"
      primary: false
    - name: "Partial R² of SE in conditional logistic regression"
      type: "continuous"
      operationalization: "Partial R² for SE in LR: logit(Pr(h=1)) = β₀ + β₁·min_logprob + β₂·SE + β₃·L + β₄·(SE×min_logprob). Computed on TriviaQA dev with LM-judge labels."
      primary: false
    - name: "Cross-model AUROC gap (Llama→Qwen transfer)"
      type: "continuous"
      operationalization: "AUROC(Qwen-2.5-7B with Llama-calibrated ensemble weights) - AUROC(Llama-3.1-8B on TruthfulQA). Target: gap < 0.05"
      primary: false
  controlled:
    - name: "Response length"
      operationalization: "Controlled via (a) OLS UQ-feature residualization (Condition 2 from h-m2 — residualize UQ features only, NOT correctness labels), and (b) length-matched subset evaluation (correct vs incorrect pairs within ±1 token)"
    - name: "Correctness function"
      operationalization: "Primary: LM-as-a-judge with cross-model judge. Secondary robustness check: ROUGE-L(F1), BERTScore(F1). Sign-stability of ΔAUROC required across all three."
    - name: "Temperature"
      operationalization: "Fixed at 0.7 for stochastic samples (validated in h-e1 snapshot: 0% degenerate)"
    - name: "Evaluation methodology"
      operationalization: "5-fold nested CV for ensemble weight tuning (inner loop); outer loop AUROC on untouched folds; question-level bootstrap for CIs"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "SE computes entropy over semantic equivalence classes (NLI-cluster membership) derived from N=5 stochastic samples. min_logprob computes the minimum token probability along a single greedy decoding path. These are algebraically distinct: SE marginalizes over semantic class probability masses (Eq. 3, Kuhn et al. 2023), while min_logprob captures the weakest link in token-level prediction confidence."
      evidence: "Kuhn et al. 2023 (arXiv:2302.09664): SE formulation p(C|x) = Σ_{s∈C} p(s|x), entropy computed over cluster masses. Distinct from sequence-level likelihood (Eq. 1 in Santilli et al. 2025)."
      falsifier: "If Pearson |r|(SE, min_logprob) > 0.85 on TriviaQA dev, then SE is a near-monotone reparameterization of log-prob and is not algebraically distinct in practice."
    - step: 2
      description: "The 'orthogonality zone' (high min_logprob ≥ 0.8 AND SE in top quartile) corresponds to prompts where the model generates individually fluent but semantically inconsistent answers across N=5 samples — the model is locally confident at each token step but globally anchored on different semantic clusters. These cases are enriched for factual hallucinations."
      evidence: "Mechanistic prediction from the algebraic distinction in Step 1. SelfCheckNLI (Manakul et al. 2023) captures the same phenomenon via bidirectional NLI contradiction detection across samples. UQLM (Bouchard et al. 2025): NLI-based scorers best black-box in 13/24 scenarios, particularly on short-answer factual QA."
      falsifier: "If the 'orthogonality zone' (min_logprob ≥ 0.8 + SE top quartile) error rate is NOT ≥ baseline + 10pp, then SE does not capture a failure mode missed by min_logprob — Step 2 fails."
    - step: 3
      description: "A logistic regression ensemble combining [min_logprob, SE_N5] achieves ΔAUROC ≥ 0.025 over min_logprob alone on TriviaQA dev under LM-as-a-judge correctness, because the SE feature contributes partial R² ≥ 0.02 conditionally independent of min_logprob and response length. Results replicate on Qwen-2.5-7B without weight refitting (AUROC gap < 0.05 on TruthfulQA)."
      evidence: "UQLM tunable ensemble best in 20/24 scenarios (Bouchard et al. 2025). Validated h-e1 SE pipeline (fraction_degenerate=0.000, SE_variance=0.1522) confirms SE is non-degenerate and variable on TriviaQA dev with Llama-3.1-8B."
      falsifier: "If partial R² for SE in the conditional LR is < 0.02, or ΔAUROC 95% CI overlaps zero on length-matched subset, Step 3 fails and H0 is not rejected."
  key_tension: "Whether SE provides genuinely independent uncertainty signal on TriviaQA short-answer QA, or whether the TPU AUROC=0.975 from h-e1 (log-prob captures SNNE almost perfectly) indicates that likelihood already saturates epistemic uncertainty in this domain, leaving SE as a noisy reparameterization."
  evidence_summary: |
    SE (AUROC=0.83 on TriviaQA, Kuhn 2023) and min_logprob (AUROC~0.825 on TriviaQA, h-m1 internal) are both individually strong predictors. The algebraic distinction (entropy over semantic class masses vs minimum token probability) suggests they capture different aspects of uncertainty. NLI-based consistency scorers are empirically strongest black-box methods (UQLM, 13/24 scenarios). The validated h-e1 SE pipeline confirms technical feasibility. The key empirical question is whether the additive gain survives length-bias control (Santilli 2025) — estimated at ΔAUROC ≥ 0.025 under LM-as-a-judge.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "SE and min_logprob are not strongly correlated on TriviaQA dev (Pearson |r| < 0.7), enabling them to provide partially independent predictions of correctness."
    supporting_evidence: "Algebraic distinctness (entropy over semantic class masses vs minimum token probability) argues for independence. UQLM shows NLI-based and likelihood-based scorers have complementary performance profiles."
    consequence_if_violated: "If |r| > 0.7, the ensemble is compressing correlated signals rather than combining independent sources. ΔAUROC would be near-zero and partial R² would collapse. H0 not rejected — meaningful null result."
  - id: "A2"
    assumption: "LM-as-a-judge correctness (using a cross-model judge separate from the generator) is not strongly correlated with SE/SelfCheckNLI (Spearman |ρ| < 0.4) — i.e., the judge does not share the same NLI-based reasoning as the SE computation."
    supporting_evidence: "Judge evaluates factual alignment of a single generated answer against the question; SE evaluates semantic consistency across N=5 stochastic samples. Functionally different operations."
    consequence_if_violated: "If ρ(SE, judge_correctness) > 0.6, ΔAUROC under LM-judge would be circular (SE tracks the judge's own NLI reasoning), not a genuine uncertainty measurement."
  - id: "A3"
    assumption: "Temperature=0.7 produces sufficient semantic diversity in N=5 samples to yield informative SE values on TriviaQA short-answer QA (not all samples are semantically identical)."
    supporting_evidence: "h-e1 snapshot: SE_variance=0.1522, fraction_degenerate=0.000, SE-SelfCheckNLI Pearson r=0.312 (modest correlation, confirms both signals are non-degenerate and partially distinct)."
    consequence_if_violated: "If SE_variance ≈ 0 (all samples semantically equivalent), SE provides no discriminative signal. Already validated as non-degenerate in h-e1."
  - id: "A4"
    assumption: "The ensemble generalizes from Llama-3.1-8B to Qwen-2.5-7B without weight refitting (AUROC gap < 0.05 on TruthfulQA), because the SE and min_logprob features capture model-agnostic uncertainty properties of factual QA."
    supporting_evidence: "CCUF (Zhou 2026) shows +5.2% vs GPT-4 on TruthfulQA using cross-model consistency — suggests consistency signals are not model-specific. UQLM results are consistent across GPT-4o and Gemini models of similar capability."
    consequence_if_violated: "If AUROC gap > 0.05 Llama→Qwen, the ensemble is model-specifically calibrated and requires per-model retuning — still useful, but not generalizable without recalibration."
  - id: "A5"
    assumption: "PROHIBITED approaches from prior failures are not inadvertently reintroduced: no hidden-state trajectory SVD (h-e1 FAIL), no POS-filtered variance (h-m1 LIMITATION), no OLS residualization of correctness labels/EM (h-m2 SUPERSEDED)."
    supporting_evidence: "All five features in proposed ensemble are either log-probability features (no hidden states) or black-box sampling-based features (SE, SelfCheckNLI via pip-installable packages). Length residualization applied only to UQ features, not to EM labels."
    consequence_if_violated: "Reintroduction of any prohibited approach would reproduce prior failures with known mechanism."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Short-answer factual QA benchmarks (TriviaQA dev 2500 prompts, TruthfulQA)
    - Open-weight LLMs at 7-8B scale: Llama-3.1-8B, Qwen-2.5-7B
    - Black-box uncertainty quantification (no hidden-state access required for primary ensemble)
    - Temperature=0.7 stochastic sampling with N=3-10 samples
    - English-language factual QA (trivia questions with short answers, 1-10 tokens)
    - LM-as-a-judge correctness evaluation with a cross-model judge
  does_not_apply_to: |
    - Long-form generation tasks (summarization, open-ended generation) — SE limitations for longer responses documented in SNNE paper (Nguyen 2025, arXiv:2506.00245)
    - White-box settings requiring hidden-state extraction (ruled out by h-e1 FAIL)
    - POS-filtered variance as a feature (ruled out by h-m1 LIMITATION)
    - OLS residualization of correctness labels (ruled out by h-m2 SUPERSEDED)
    - Tasks requiring human annotation or synthetic data
    - Models > 70B scale (resource constraints; inference cost for N=5 samples)
    - New benchmarks beyond TriviaQA dev and TruthfulQA
  known_limitations: |
    - TriviaQA short-answer QA may exhibit likelihood saturation (TPU AUROC=0.975 from h-e1 suggests log-prob is near-perfect predictor of SE-based target), potentially leaving minimal room for SE's independent contribution
    - N=5 may miss rare but informative semantic disagreements visible only at N≥10
    - Cross-model transfer (Llama→Qwen) uses different model-family priors; calibration slope check required
    - LM-as-a-judge is still an estimated correctness function subject to judge model errors

