  dependent:
    - name: "AUROC (LM-as-a-judge correctness)"
      type: "continuous"
      operationalization: "Area Under ROC Curve for predicting binary correctness labels from a cross-model LM-as-a-judge (not the same model as generator), evaluated on TriviaQA dev. Range [0,1], higher is better."
