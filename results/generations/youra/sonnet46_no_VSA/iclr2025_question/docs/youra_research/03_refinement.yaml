# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "The ensemble [min_logprob + SE_N5] achieves AUROC ≥ 0.85 on TriviaQA dev under LM-as-a-judge correctness (cross-model judge), with ΔAUROC ≥ 0.025 over min_logprob alone (95% CI lower bound > 0) on a length-matched subset."
    test_method: "Compute SE_N5 (bidirectional DeBERTa-MNLI, N=5, temp=0.7) and min_logprob (greedy decode) on TriviaQA dev 2500 prompts with Llama-3.1-8B. Fit logistic regression with 5-fold nested CV (inner loop: L2 tuning; outer loop: AUROC). Evaluate ΔAUROC on length-matched subset with question-level bootstrap CI."
    success_criterion: "AUROC(ensemble) ≥ 0.85 AND ΔAUROC(ensemble - min_logprob) ≥ 0.025 with 95% CI lower bound > 0 on length-matched subset."
    falsification: "AUROC(ensemble) < 0.85 on TriviaQA under LM-judge, OR ΔAUROC 95% CI overlapping zero on length-matched subset. Either falsifies P1."
  - id: "P2"
    primary: false
    statement: "SE_N5 has partial R² ≥ 0.02 in a conditional logistic regression of correctness on [min_logprob, SE_N5, response_length, SE×min_logprob] using LM-judge labels on TriviaQA dev, with coefficient β₂ (SE) significantly non-zero (p < 0.05) after conditioning on min_logprob and length."
    test_method: "Fit conditional LR on full TriviaQA dev (2500 samples, LM-judge binary labels). Compute partial R² for SE via Wald test or likelihood-ratio test comparing model with and without SE term."
    success_criterion: "Partial R²(SE) ≥ 0.02 AND β₂ (SE coefficient) significant at p < 0.05."
    falsification: "Partial R²(SE) < 0.01 or β₂ not significant after conditioning — indicates SE does not provide conditionally independent signal."
  - id: "P3"
    primary: false
    statement: "Cross-model transfer: ensemble LR weights trained on Llama-3.1-8B TriviaQA dev achieve AUROC within 0.05 of Llama baseline on Qwen-2.5-7B TruthfulQA without weight refitting."
    test_method: "Generate responses on TruthfulQA with Qwen-2.5-7B (temp=0.7, N=5). Compute SE and min_logprob features. Apply Llama-calibrated LR weights directly. Evaluate AUROC under LM-judge correctness. Compare to Llama-3.1-8B AUROC on same TruthfulQA split."
    success_criterion: "AUROC(Qwen, Llama-weights) ≥ AUROC(Llama, TruthfulQA) - 0.05. Calibration slope within ±0.1."
    falsification: "AUROC gap > 0.05 indicates the ensemble is model-specifically calibrated, requiring per-model retuning."

