  sh1_existence: "SE_N5 must produce non-degenerate signals on TriviaQA dev with Llama-3.1-8B at temp=0.7 (fraction_degenerate < 0.10, SE_variance > 0). ALREADY VALIDATED in h-e1 snapshot: fraction_degenerate=0.000, SE_variance=0.1522."
  sh2_mechanism: "Partial R² ≥ 0.02 for SE in conditional LR controlling for min_logprob and response length. This is the core mechanism test: does SE capture information about correctness that min_logprob does not? Must be demonstrated before interpreting ensemble AUROC gains as mechanistically meaningful."
  sh3_comparison: "ΔAUROC comparison (ensemble vs best single feature) on TriviaQA dev and TruthfulQA. Cross-model comparison (Llama-3.1-8B vs Qwen-2.5-7B). Correctness-function robustness comparison (ROUGE-L vs BERTScore vs LM-as-a-judge). Deferred to Phase 5 for full comparison against UQLM-reported baselines if Phase 4 positive."
  open_questions:
    - "Is the 'orthogonality zone' (min_logprob ≥ 0.8 + SE top quartile) actually enriched for errors (≥10pp above base rate) on TriviaQA dev? This is the key mechanistic diagnostic."
    - "Does the circularity concern (ρ(SE, LM-judge) > 0.4) materialize? Can be tested early before ensemble fitting."
    - "Does the 2-feature ensemble (min_logprob + SE) capture ≥95% of the full 5-feature ensemble gain? If so, parsimony wins."
    - "Is there a N-efficiency breakeven point (N=3 vs N=5) for TriviaQA short answers? Secondary analysis if Phase 4 positive."

