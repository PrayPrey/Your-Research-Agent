hypothesis_draft:
  title: "H-D1: Source-Alignment Hypothesis for Code SFT"
  hypothesis_id: "H-D1"
  core_claim: |
    Under controlled conditions (post-dedup, problem-count matched, token-budget equalized,
    supervision-format normalized), SFT training source identity produces statistically significant
    and directionally consistent differences in pass@1 on held-out HumanEval+ and MBPP+,
    because training-benchmark distributional alignment (measured by code-embedding cosine
    similarity) governs post-pretraining SFT specialization.
  mechanism: |
    Three-step causal chain:
    1. Different code sources (HumanEval-train, MBPP-train, LeetCode) define structurally distinct
       conditional distributions P_train(x,y) over problem-solution pairs.
    2. SFT gradient updates directionally bias pretrained weights toward P_train, producing
       stylistic and structural representational specialization.
    3. The trained model's pass@1 on evaluation benchmark B is higher when P_train is
       distributionally closer to P_test(B), because the fine-tuned weights align with the
       test distribution.
  predictions:
    - P1: "Source identity has statistically significant main effect on pass@1 (mixed-effects model p < 0.05, ≥2.0 pp effect) for at least one source-benchmark pair at 1.3B"
    - P2: "Cross-benchmark transfer asymmetry: HumanEval-only > MBPP-only on HumanEval+, MBPP-only > HumanEval-only on MBPP+ (inversion pattern), consistent across ≥2/3 seeds"
    - P3: "Spearman rank correlation between code-embedding distance (train-to-test) and pass@1 rank is statistically significant via permutation test (p < 0.05) for at least one model size"

variables_summary:
  independent: "SFT training source condition (categorical: HumanEval-only, MBPP-only, LeetCode-only, Equal-mix) and model size (1.3B, 7B)"
  dependent_primary: "pass@1 on HumanEval+ (164 problems, greedy decoding, EvalPlus)"
  controlled: "Total training tokens, unique-problem count × repetition rate, supervision format (standardized prompt template), deduplication threshold (cosine sim > 0.95, all-MiniLM-L6-v2), random seed (3 per condition)"

null_hypothesis:
  h0_statement: |
    All four source conditions (HumanEval-only, MBPP-only, LeetCode-only, Equal-mix) produce
    pass@1 within ±1.5 percentage points of each other on both HumanEval+ and MBPP+ at both
    1.3B and 7B model sizes, i.e., source identity is not practically significant for code SFT
    at this scale and token budget.
  statistical_test: "Linear mixed-effects model (pass@1 ~ source_condition + (1|problem) + covariates) with Holm-Bonferroni pairwise correction; problem-level paired bootstrap as supplementary"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled source-identity ablation for code SFT producing a 4-source × 2-benchmark × 2-model-size transfer matrix, combined with a distributional alignment mechanistic claim (P3) validated via permutation test."
  differentiation_summary: |
    DoReMi/DomainPilot/Chameleon: domain mixture optimization for general LLMs or pretraining — not code-specific SFT source-identity isolation.
    Lv et al. (2025): data selection/quality filtering within a single source — not source dataset identity ablation.
    Chen et al. (2024): atomic vs synthetic source types — not HumanEval vs MBPP vs LeetCode identity comparison.
    DeepSeek-Coder, WizardCoder, Magicoder: use mixed sources but never isolate single-source conditions for controlled measurement.
    No prior work produces a cross-benchmark transfer matrix under single-source controlled conditions.

