figures:
  - id: "fig_1"
    original_name: "similarity_heatmaps.png"
    source: "h-e1/figures/similarity_heatmaps.png"
    target: "figures/similarity_heatmaps.png"
    caption: "Dual-encoder similarity matrices. Left: CodeBERT cosine similarity (range 0.909–0.975). Right: MiniLM cosine similarity (range 0.247–0.311). Both encoders confirm measurably distinct distributions across the four SFT training sources."
    section: "methodology"
    phase: "phase_4"

  - id: "fig_2"
    original_name: "heatmap_pass1.png"
    source: "h-m1/figures/heatmap_pass1.png"
    target: "figures/heatmap_pass1.png"
    caption: "Transfer matrix: pass@1 (mean across seeds) for each SFT source condition on HumanEval+ and MBPP+ benchmarks at 1.3B scale. HumanEval-only achieves the highest pass@1 on both benchmarks."
    section: "results"
    phase: "phase_4"

  - id: "fig_3"
    original_name: "per_seed_inversion.png"
    source: "h-m1/figures/per_seed_inversion.png"
    target: "figures/per_seed_inversion.png"
    caption: "Per-seed pass@1 comparison between HumanEval-only and MBPP-only SFT on both benchmarks. HumanEval-only dominates on HumanEval+ in 2/3 seeds and on MBPP+ in all 3 seeds."
    section: "results"
    phase: "phase_4"

  - id: "fig_4"
    original_name: "fig1_rho_bar_chart.png"
    source: "h-m2/figures/fig1_rho_bar_chart.png"
    target: "figures/fig1_rho_bar_chart.png"
    caption: "Spearman ρ between embedding similarity rank and pass@1 rank per encoder and benchmark. CodeBERT achieves ρ=1.0 (p=0.042) on HumanEval+, with concordant MiniLM ρ=0.8."
    section: "results"
    phase: "phase_4"

  - id: "fig_5"
    original_name: "fig3_null_distribution.png"
    source: "h-m2/figures/fig3_null_distribution.png"
    target: "figures/fig3_null_distribution.png"
    caption: "Permutation null distribution for CodeBERT/HumanEval+ Spearman ρ (10,000 shuffles). The observed ρ=1.0 falls at the 95th percentile (p=0.042), confirming the rank alignment is unlikely under chance."
    section: "results"
    phase: "phase_4"

  - id: "fig_6"
    original_name: "pass1_by_condition_scale.png"
    source: "h-c1/figures/pass1_by_condition_scale.png"
    target: "figures/pass1_by_condition_scale.png"
    caption: "HumanEval+ pass@1 by SFT source condition at 1.3B and 7B scale. The rank order shifts at 7B (equal-mix rises to match HumanEval-only), while the absolute between-condition spread narrows dramatically (0.319→0.055 pp)."
    section: "results"
    phase: "phase_4"

