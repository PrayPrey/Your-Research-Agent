narrative_blueprint:
  version: "1.0"
  generated_at: "2026-08-03"
  paper_title: "What Does Code SFT Actually Teach? Source Identity Governs Benchmark Performance via Distributional Alignment"

  # ============================================================================
  # HOOK DESIGN
  # ============================================================================

  hook:
    strategy: "counterintuitive_finding"
    opening_statement:
      content: "We trained the same code language model on four different practice problem sets and found that practicing HumanEval-style algorithm completions made the model better at MBPP utility scripts than practicing MBPP scripts directly — by up to 1.5 percentage points, consistently across all three random seeds."
      rationale: "Violates the intuitive 'train on X → test on X' principle. Forces the reader to ask: why? The answer (distributional alignment) is the paper's mechanistic contribution."

    why_reader_should_care:
      main_reason: "Every practitioner choosing SFT training data implicitly makes a bet about which problems will improve their target benchmark. This paper shows those bets can be measured — and the measurements predict outcomes."
      concrete_example: "Under token-budget-equalized conditions, HumanEval-only training achieves 32.6% HumanEval+ pass@1 while LeetCode-only achieves 3.0% — a 29.6 percentage point gap for the same model trained on the same compute budget."
      stakes: "Without understanding source identity effects, practitioners waste compute on misaligned training data; researchers cannot interpret benchmark improvements without attributing them to source selection."

  # ============================================================================
  # PROBLEM FRAMING (THREE LEVELS)
  # ============================================================================

  problem_framing:
    surface_problem:
      description: "Code LLMs are trained on mixes of publicly available datasets (HumanEval-style problems, MBPP utility scripts, LeetCode algorithmic challenges), but the effect of source composition on benchmark performance is not well understood."
      common_understanding: "Practitioners assume that more data or more diverse data leads to better benchmark performance. Source selection is treated as an engineering detail, not a research question."

    deeper_problem:
      description: "No controlled study has isolated the causal effect of SFT source identity on code benchmark pass@1 — holding model architecture, token budget, training hyperparameters, and supervision format constant while varying only which dataset the model trains on."
      why_overlooked: "Prior work varies multiple dimensions simultaneously (data quality, quantity, format, model size). Source identity confounds with data size and style in all existing ablations."
      our_perspective: "Source identity is the primary causal driver of post-SFT benchmark performance — not dataset size, not diversity, not format. The effect is large enough (up to 29.6pp) to matter more than most architectural improvements."

    gap_in_existing_work:
      description: "No paper has measured the 4-source × 2-benchmark transfer matrix with token-budget equalization, nor tested whether code-embedding distributional alignment between training source and test benchmark predicts pass@1 rank order."
      why_gap_exists: "Domain mixture optimization literature (DoReMi, DomainPilot) addresses general LLM pretraining; code-specific source-identity ablation with execution-based evaluation requires a dedicated controlled experiment."
      why_gap_matters: "Without this measurement, data selection for code SFT is guesswork. With it, practitioners can predict performance rank from embedding similarity before training — saving compute and improving targeted benchmark performance."

  # ============================================================================
  # KEY INSIGHT
  # ============================================================================

  key_insight:
    aha_moment:
      one_sentence: "Code-embedding cosine similarity between the SFT training source and the test benchmark perfectly predicts the pass@1 rank order across all four training conditions — enabling principled source selection before any model training."
      expanded_explanation: "When we rank the four SFT sources (HumanEval-only, MBPP-only, Equal-mix, LeetCode-only) by their CodeBERT embedding similarity to HumanEval+, the order is HE > MB > EQ > LC. This exact rank matches the observed HumanEval+ pass@1 rank (Spearman ρ=1.0, permutation test p=0.042, n=10,000). The mechanism operates even when the expected same-source advantage breaks down: HumanEval-only's embedding proximity to both test benchmarks explains why it achieves the best MBPP+ performance too."

    why_others_missed_it:
      common_assumptions: "Prior work assumes that training on X specializes the model for X — the 'train-to-test alignment' principle. Mixed SFT datasets obscure source-specific effects, making causal attribution impossible."
      our_different_view: "By isolating sources under a controlled token budget, we reveal that embedding-space proximity — not surface similarity between training and test problem types — is the operative mechanism. HumanEval-style algorithmic problems are embedding-closer to both benchmarks than utility scripts."
      enabling_factor: "The combination of (1) token-budget equalization eliminating quantity confounds, (2) dual-encoder measurement (CodeBERT + MiniLM) confirming distributional distinctiveness, and (3) permutation testing with n=10,000 providing rigorous statistical validation."

    what_makes_it_work:
      intuitive_explanation: "HumanEval problems require writing functions that pass doctests — a general Python reasoning skill that transfers to any test-case-based evaluation. MBPP problems require utility scripts in a narrower style that doesn't develop the same generalizable competence."
      key_mechanism: "SFT gradient updates bias the model's weight space toward the training distribution. When the test benchmark's distribution is close (in embedding space) to the training distribution, the biased weights generalize well. This is the first permutation-tested evidence of this mechanism for code SFT."

  # ============================================================================
  # EVIDENCE NARRATIVE
  # ============================================================================

  evidence_narrative:
    main_claim:
      statement: "SFT source identity causes large, statistically significant differences in HumanEval+ pass@1 (up to 29.6pp at 1.3B scale), and this behavioral rank order is mechanistically predicted by code-embedding cosine similarity rank."
      measurable_criteria: "One-way ANOVA F=11.37, p=0.020; CodeBERT Spearman ρ=1.0, p=0.042; consistent across 3 seeds"

    supporting_evidence:
      - id: "evidence_1"
        what: "Source distributions are measurably distinct: MiniLM similarity range 0.247–0.311 (all 8 pairs below 0.95 threshold); CodeBERT confirms LeetCode most divergent (0.909, 0.946)"
        so_what: "The mechanism is testable — embedding space distinguishes training sources."
        how_it_supports_claim: "Establishes that source identity produces different representational starting points for SFT, enabling causal attribution."

      - id: "evidence_2"
        what: "HumanEval-only 32.6%, MBPP-only 27.7%, Equal-mix 9.8%, LeetCode-only 3.0% on HumanEval+ at 1.3B (ANOVA p=0.020, F=11.37)"
        so_what: "Source selection is a dominant driver of pass@1 — a 29.6pp gap under identical compute conditions exceeds most reported architectural improvements."
        how_it_supports_claim: "Direct causal evidence: the only variable is source identity; token budget, format, model, and hyperparameters are controlled."

      - id: "evidence_3"
        what: "CodeBERT embedding rank (HE > MB > EQ > LC) matches HumanEval+ pass@1 rank exactly (ρ=1.0, p=0.042, 10,000 permutations); MiniLM ρ=0.8 concordant"
        so_what: "Embedding similarity is a measurable, pre-training predictor of SFT performance rank — the mechanism is actionable."
        how_it_supports_claim: "Connects distributional alignment to behavioral outcomes, validating the causal chain."

      - id: "evidence_4"
        what: "HumanEval-only achieves highest MBPP+ pass@1 (~52%) vs MBPP-only (~50.5%) across all 3 seeds; Equal-mix (9.8% HumanEval+) underperforms both single-source conditions"
        so_what: "The 'train on X to test on X' intuition fails bidirectionally; algorithmic training quality, not benchmark proximity alone, drives transfer."
        how_it_supports_claim: "Reveals the asymmetric generalization phenomenon that motivates the algorithmic training quality interpretation."

      - id: "evidence_5"
        what: "At 7B: rank order preserved (near equal_mix ≈ humaneval_only at 38.6%/39.6%), absolute spread narrows to 5.5pp vs 31.9pp at 1.3B; seed variance collapses to near-zero"
        so_what: "Source identity effect persists at scale but becomes more deterministic; scale reduces sensitivity without eliminating the mechanism."
        how_it_supports_claim: "Shows robustness of the mechanism across model sizes while qualifying its magnitude."

    surprising_findings:
      - finding: "HumanEval-only training outperforms MBPP-only on the MBPP+ benchmark"
        why_surprising: "Direct violation of the 'train on X → best at X' principle. Prior intuition predicts MBPP-only should specialize for MBPP+."
        our_interpretation: "HumanEval-style algorithmic function completion develops more transferable Python reasoning than MBPP utility-script training. Both benchmarks evaluate test-case-passing — HumanEval's doctest-driven training is more directly aligned with this format."

      - finding: "Equal-mix training (9.8% HumanEval+) dramatically underperforms the best single-source condition (32.6%)"
        why_surprising: "Naive expectation: more diverse training should generalize better. Observed: source specificity dominates diversity at limited scale."
        our_interpretation: "At small token budgets, mixing dilutes specialization without providing coverage benefit. Equal-mix receives a smaller effective exposure to any benchmark-aligned patterns."

  # ============================================================================
  # BROADER IMPACT
  # ============================================================================

  takeaway:
    main_contribution:
      one_sentence: "SFT source selection is not a neutral engineering choice — it is the dominant factor governing code benchmark performance, and embedding-space distributional alignment provides a measurable pre-training predictor of performance rank."
      why_significant: "This reframes data selection from an art to a measurable science, with direct implications for reproducible benchmark evaluation and targeted SFT data curation."

    implications:
      for_field: "Benchmark comparisons should control for SFT source composition to enable valid comparisons. The current practice of mixing unspecified sources makes attribution impossible."
      for_practice: "Practitioners can use embedding similarity between their training candidates and target benchmarks to select training data — without running expensive training experiments."

    future_possibilities:
      immediate_extensions: "Embedding alignment as active SFT selection criterion — use cosine similarity to HumanEval+ to rank-select training problems from a mixed pool. Complete MBPP+ evaluation at both scales to close the data gap."
      longer_term_vision: "A general principle of source-alignment-mediated SFT specialization across code, math, and reasoning domains — with embedding proximity as the universal predictor."

  # ============================================================================
  # SECTION-LEVEL NARRATIVE GOALS
  # ============================================================================

  section_goals:
    abstract:
      narrative_purpose: "Compress the full story into ~150 words: the counterintuitive finding, the mechanism, the key numbers, the implication"
      key_message: "Source identity dominates code SFT outcomes; embedding alignment predicts performance rank; algorithmic training generalizes better than utility-script training"

    introduction:
      narrative_purpose: "Hook with the counterintuitive finding → escalate to 29.6pp gap → reveal the measurement gap → introduce the embedding alignment insight → preview contributions"
      hook_strategy: "counterintuitive_finding"
      transition_to_related: "This finding motivates a systematic look at how the field has approached data composition for code LLMs — and reveals why no prior work could have predicted it"

    related_work:
      narrative_purpose: "Show three bodies of work that approach but don't close the gap: domain mixture optimization (pretraining), code SFT papers (no source isolation), embedding alignment studies (general LLMs)"
      positioning_strategy: "Each prior thread is insufficient alone; our study synthesizes them into a controlled code-specific source-identity ablation with an embedding mechanism test"
      key_comparison_points:
        - "Domain mixture (DoReMi, DomainPilot): pretraining only; no code-specific execution-based eval; no source-identity isolation"
        - "Code SFT papers (WizardCoder, OSS-Instruct, Lv et al.): vary quality/style but not source dataset identity under controlled conditions"
        - "Alignment prediction (GRAPE): general instruction tuning; no code-specific source ablation; no cross-benchmark transfer matrix"

    methodology:
      narrative_purpose: "Connect to embedding alignment insight — show WHY the controlled design enables causal attribution, WHY deduplication and token-budget equalization matter, WHY we measure distributional alignment with two encoders"
      connection_to_insight: "The key design decision is token-budget equalization: without it, source effects confound with data quantity. With it, source identity is the only variable — enabling causal attribution."
      key_design_decisions:
        - "Token-budget equalization (unique problems × repetition rate matched): isolates source identity from quantity"
        - "Deduplication (MiniLM cosine > 0.95 vs test sets): prevents contamination confound"
        - "Dual-encoder measurement (CodeBERT + MiniLM): confirms distributional distinctiveness with complementary encoders"
        - "Permutation test (n=10,000): rigorous significance testing for n=4 rank correlation"
        - "Equal-mix condition as structural falsifier: tests diversity vs alignment"

    experiments:
      narrative_purpose: "Frame four research questions that map directly to the four claims; justify dataset and baseline choices with reasons, not just labels"
      experimental_questions:
        - "RQ1: Does SFT source identity produce statistically significant pass@1 differences at 1.3B scale? (P1)"
        - "RQ2: Does same-source training produce symmetric benchmark specialization? (P2)"
        - "RQ3: Does code-embedding alignment predict pass@1 rank? (P3)"
        - "RQ4: Do source effects persist at 7B scale?"

    results:
      narrative_purpose: "Present evidence supporting all four claims in order; interpret each result's meaning for the main claim; highlight the surprising findings"
      main_result_highlight: "29.6pp source identity effect (F=11.37, p=0.020) + perfect rank alignment (ρ=1.0, p=0.042) + HumanEval-only's cross-benchmark dominance"

    discussion:
      narrative_purpose: "Interpret the asymmetric generalization finding mechanistically; acknowledge MBPP+ data gap and n=4 fragility honestly; frame broader implications for benchmark practice"
      honest_limitations:
        - "MBPP+ evaluation incomplete in H-E2 and H-C1 (data gap); MBPP+ claims limited to H-M1 two-condition comparison"
        - "n=4 conditions makes Spearman p=0.042 the minimum achievable — marginal statistical significance"
        - "MBPP-train had only 120 samples (vs expected 374) — confounds P2 interpretation"

    conclusion:
      narrative_purpose: "Return to the opening counterintuitive finding — now explained. Reinforce the actionable insight. Open future with the embedding-alignment selection criterion."
      callback_to_hook: "We opened by observing that HumanEval training beat MBPP training on MBPP's own benchmark. The embedding alignment mechanism explains why — and suggests a general principle for source-driven SFT optimization."

  # ============================================================================
  # NARRATIVE COHERENCE CHECKLIST
  # ============================================================================

  narrative_coherence_checklist:
    - check: "Does Introduction hook connect to Conclusion ending?"
      status: "YES — both reference the HumanEval-over-MBPP-on-MBPP+ finding"
    - check: "Does each section naturally flow to the next?"
      status: "YES — hook→gap→insight→method→experiments→results→interpretation→closure"
    - check: "Is key insight consistently emphasized throughout?"
      status: "YES — embedding alignment as predictor appears in intro preview, methodology rationale, results interpretation, discussion implications"
    - check: "Are all major claims supported by evidence?"
      status: "YES — P1 by h-e2 ANOVA, P3 by h-m2 permutation, cross-benchmark finding by h-m1 per-seed analysis, scale by h-c1 absolute spread"
    - check: "Would a busy reviewer find Abstract compelling?"
      status: "YES — counterintuitive finding + specific numbers + mechanism + practical implication"
