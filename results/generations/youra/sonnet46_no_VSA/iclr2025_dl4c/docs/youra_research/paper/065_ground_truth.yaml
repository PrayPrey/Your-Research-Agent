      reason: "2026 preprint — not yet indexed in Semantic Scholar as of 2026-08-03"
      action_recommended: "Re-verify after August 2026 or drop from paper"

# ============================================================
# LIMITATIONS FOR ADVERSARIAL REVIEW
# ============================================================
known_limitations:
  mbpp_plus_incomplete:
    description: "Full 4-condition MBPP+ pass@1 not available — only 2-condition (HE-only vs MBPP-only)"
    impact: "Cannot complete full 2×4 transfer matrix or full mechanistic test on MBPP+"
    mitigant: "All 24 checkpoints preserved — re-evaluation possible"
  n4_fragility:
    description: "n=4 conditions; min Spearman p achievable = 1/24 = 0.042"
    impact: "One rank swap loses significance; claimed rho=1.0 is at minimum achievable p"
    mitigant: "Dual-encoder concordance (MiniLM rho=0.8) provides additional support"
  format_normalization:
    description: "MBPP native I/O format not tested — only standardized template"
    impact: "Might have disadvantaged MBPP-only SFT, partially explaining absent P2 inversion"
  mbpp_train_size:
    description: "MBPP sanitized split = 120 problems vs expected ~374 from full split"
    impact: "Smaller training set may have limited MBPP-only specialization"
  scale_H_C1_null:
    description: "H-C1 gate was NULL — scale comparison confounded by eta^2 artifact"
    impact: "Scale findings reported as exploratory with absolute spread as primary metric"
