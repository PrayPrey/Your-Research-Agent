# Ground Truth Metrics for Phase 6.5 Adversarial Review
# Source: Phase 4/5 validation reports
# DO NOT MODIFY — used as reference for adversarial review

hypothesis_id: "H-D1"
core_claim: "SFT training source identity governs code benchmark performance via distributional alignment"

# ============================================================
# PRIMARY EFFECT (H-E2 / P1)
# ============================================================
source_identity_effect:
  metric: "HumanEval+ pass@1"
  scale: "1.3B"
  model: "deepseek-ai/deepseek-coder-1.3b-base"
  anova_F: 11.37
  anova_p: 0.020
  max_pairwise_gap_pp: 29.6
  conditions:
    HumanEval_only:
      seed_42: 0.396
      seed_123: 0.256
      seed_777: 0.396
      mean: 0.350
    MBPP_only:
      seed_42: 0.293
      seed_123: 0.274
      seed_777: 0.262
      mean: 0.276
    LeetCode_only:
      seed_42: ~0.031
      seed_123: ~0.031
      seed_777: ~0.031
      mean: ~0.031
    Equal_mix:
      seed_42: 0.098
      seed_123: 0.104
      seed_777: 0.104
      mean: 0.102
  gate: "MUST_WORK"
  gate_status: "SATISFIED"

# ============================================================
# CROSS-BENCHMARK TRANSFER (H-M1 / P2)
# ============================================================
cross_benchmark:
  metric: "MBPP+ pass@1"
  scale: "1.3B"
  HumanEval_only_wins_on_MBPP_plus: true  # in ALL 3 seeds
  per_seed:
    seed_42:
      HE_only: 0.524
      MBPP_only: 0.505
    seed_123:
      HE_only: 0.519
      MBPP_only: 0.503
    seed_777:
      HE_only: 0.516
      MBPP_only: 0.508
  HE_only_mean_MBPP_plus: ~0.520
  MBPP_only_mean_MBPP_plus: ~0.505
  symmetric_specialization: false
  note: "P2 inverted — HE-only beats MBPP-only on MBPP+ in all seeds"
  gate: "SHOULD_WORK"
  gate_status: "FAILED (inverted)"

# ============================================================
# EMBEDDING DISTINCTIVENESS (H-E1)
# ============================================================
embedding_distinctiveness:
  MiniLM:
    range_min: 0.247
    range_max: 0.311
    below_0_95_threshold: "8/8 pairs"
    gate: "MUST_WORK"
    gate_status: "SATISFIED"
  CodeBERT:
    range_description: "0.909–0.975"
    below_0_95_threshold: "2/8 pairs"
    gate: "MUST_WORK"
    gate_status: "SATISFIED (partial)"
  HE_only_to_HE_plus_MiniLM: 0.311  # highest among conditions

# ============================================================
# MECHANISTIC ALIGNMENT (H-M2 / P3)
# ============================================================
mechanistic_alignment:
  CodeBERT_Spearman_rho: 1.000
  CodeBERT_permutation_p: 0.0417
  permutation_n: 10000
  permutation_alternative: "greater"
  MiniLM_Spearman_rho: 0.800
  dual_encoder_concordant: true
  rank_match:
    HumanEval_only: {sim_rank: 1, pass1_rank: 1}
    MBPP_only: {sim_rank: 2, pass1_rank: 2}
    Equal_mix: {sim_rank: 3, pass1_rank: 3}
    LeetCode_only: {sim_rank: 4, pass1_rank: 4}
  n_conditions: 4
  min_achievable_p: 0.0417  # 1/24
  gate: "SHOULD_WORK"
  gate_status: "SATISFIED"
  fragility_note: "n=4 — one rank swap loses significance; dual-encoder concordance provides additional support"

# ============================================================
# SCALE COMPARISON (H-C1)
# ============================================================
scale_comparison:
  scale_7B:
    model: "deepseek-ai/deepseek-coder-7b-base"
    conditions:
      HumanEval_only: {mean: 0.386, seed_variance: ~0.00000}
      MBPP_only: {mean: 0.374, seed_variance: ~0.00001}
      LeetCode_only: {mean: 0.341, seed_variance: ~0.00000}
      Equal_mix: {mean: 0.396, seed_variance: ~0.00000}
    absolute_spread_pp: 5.5
    eta_squared: 0.977
  scale_1B:
    absolute_spread_pp: 31.9
    eta_squared: 0.912
  eta_squared_artifact: true
  eta_squared_artifact_explanation: "Within-condition seed variance collapses at 7B, inflating denominator SS_total and artificially increasing eta^2"
  preferred_metric: "absolute_spread_pp"
  equal_mix_rank_shift: "Equal-mix rises to highest at 7B (39.6%) vs lowest single-source performer at 1.3B (10.2%)"
  gate: "SHOULD_WORK"
  gate_status: "NULL (metric artifact)"

# ============================================================
# PAPER STATISTICS
# ============================================================
paper_stats:
  total_sections: 8  # 00_abstract through 07_conclusion
  total_figures: 6
  total_tables: 4
  citations_total: 11
  citations_verified: 10
  citations_unverified: 1  # DomainPilot Zhang 2026 arXiv:2607.22769
  verification_rate: 0.909
  unverified_citations:
