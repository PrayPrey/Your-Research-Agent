final_opinions:
  perspective_novelty:
    agent: "Dr. Nova"
    icon: "🔭"
    assessment: |
      STRONG. The source-alignment hypothesis for code SFT is genuinely novel — no existing paper
      ablates source identity across HumanEval/MBPP/LeetCode/Equal-mix for code SFT pass@1.
      The "geometry-aware specialization" framing, cross-benchmark inversion prediction, and the
      structural equal-mix falsifier together constitute a conceptually fresh contribution.
      The reuse of all existing infrastructure makes this immediately executable.
    key_points:
      - "No prior work produces a 4-source × 2-benchmark × 2-model-size transfer matrix for code SFT"
      - "Distributional alignment as the governing mechanism (P3) elevates from empirical ablation to theory-of-transfer contribution"
      - "Cross-benchmark inversion prediction (LC vs MBPP swap) is the single most novelty-proving finding"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      STRONG. Pre-registered rank orderings, power-justified effect threshold (≥2.0 pp), mixed-effects
      model with problem-level random effects, and explicit null conditions (equal-mix dominance,
      rank inversion failure) give this study genuine falsifiability. The permutation test for P3
      and dual-encoder robustness check close the remaining statistical gaps. The explicit falsification
      criterion for each prediction — including the equal-mix dominance test and pretraining similarity
      vs SFT-similarity comparison — meets rigorous falsifiability standards.
    key_points:
      - "P1: mixed-effects model p < 0.05, ≥2.0 pp effect, directional consistency across scales"
      - "P2: cross-benchmark inversion of HE-only vs MBPP-only must hold across ≥2/3 seeds"
      - "P3: permutation test (10K shuffles) + dual-encoder robustness check required"
      - "Formal power analysis required pre-experiment to justify n=3 seeds"

  perspective_significance:
    agent: "Dr. Sage"
    icon: "🎯"
    assessment: |
      STRONG. This study directly challenges the assumption that SFT corpora are fungible if token
      counts match. The DL4C community explicitly needs practitioner-relevant data-centric guidance.
      Whether the result is positive (alignment governs specialization) or null (diversity dominates),
      the finding is actionable and publishable. The equal-mix dominance outcome (if it occurs) would
      establish a diversity-beats-alignment principle equally valuable for small-lab practitioners.
      The "SFT as geometry-aware specialization" framing has potential to reframe how the field
      thinks about multi-stage training pipeline design.
    key_points:
      - "Directly answers a practitioner question: which source to use for code SFT under fixed budget"
      - "DL4C 2025 'Data for Code' and 'Post-training and Alignment' tracks directly cover this study"
      - "Null result (all sources equivalent) is equally valuable — liberates practitioners from curation obsession"
      - "Transfer matrix (4×2×2) is a reusable empirical resource for future work"

  perspective_plausibility:
    agent: "Prof. Pax"
    icon: "⚙️"
    assessment: |
      STRONG. 24 SFT runs on 5× H100 is ~48 compute-hours. All infrastructure validated in prior runs
      (SFT training loop, dedup pipeline, EvalPlus harness). Supervision-format normalization adds no
      new code. Distributional distance measurement uses existing embedding models (all-MiniLM-L6-v2
      or CodeBERT). The gradient cosine diagnostic is optional and out-of-scope for main paper.
      The design is scientifically defensible with the required controls: post-dedup token-matched
      training sets, supervision format standardization, and problem-level mixed-effects model.
    key_points:
      - "~48 compute-hours on 5× H100 (available from prior runs)"
      - "All code infrastructure reusable from prior validated runs"
      - "Supervision-format normalization is the only new implementation requirement"
      - "CodeBERT (for P3) is publicly available on HuggingFace"

  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      The discussion converged on a fully specified, defensible hypothesis: H-D1 (Source-Alignment
      Hypothesis for Code SFT). Under controlled conditions (post-dedup, problem-count matched,
      token-budget equalized, supervision-format normalized), SFT training source identity produces
      statistically significant and directionally consistent differences in pass@1 on held-out
      HumanEval+ and MBPP+ for DeepSeek-Coder at both 1.3B and 7B scales, with the direction
      of transfer correlating with code-embedding distributional distance between training source
      and test benchmark. Three pre-registered predictions (P1/P2/P3) with explicit success
      criteria, null conditions, and falsifiers provide the necessary scientific rigor. The
      equal-mix negative control and 1.3B vs 7B scale comparison are the key structural elements
      that disambiguate alignment from diversity and pretraining co-exposure.
    key_points:
      - "H-D1 fully specified: post-dedup matched, format-normalized, mixed-effects model"
      - "P1 (MUST_WORK): source effect exists; P2 (SHOULD_WORK): cross-benchmark inversion; P3 (mechanistic): alignment → rank correlation"
      - "Equal-mix and scale comparison are the two key structural elements for mechanism disambiguation"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      Two remaining concerns that must be addressed in the experimental design. (1) Pretraining
      co-exposure: DeepSeek-Coder-1.3B/7B-Base was pretrained on GitHub code containing LeetCode
      solutions, potentially inflating LeetCode-only SFT gains via weight-space reinforcement rather
      than genuine SFT distributional alignment. Mitigation: 1.3B vs 7B scale comparison probes this;
      attenuated effects at 7B would support pretraining co-exposure hypothesis. (2) CodeContests
      language confound: C++/Java/Python mixture makes direct comparison to Python-only benchmarks
      problematic. Mitigation: restrict to Python-only subset or treat as supplementary condition.
      Both concerns are manageable within the proposed design. The pre-registered directional
      predictions (HE > LC > Mix > MBPP on HumanEval+; MBPP > Mix > LC > HE on MBPP+) provide
      the key falsifier for the alignment mechanism.
    key_points:
      - "Pretraining co-exposure for LeetCode — probe via 1.3B vs 7B scale comparison"
      - "CodeContests language confound — restrict to Python-only or treat as supplementary"
      - "Pre-registered rank ordering: (HE > LC > Mix > MBPP on HumanEval+) and (MBPP > Mix > LC > HE on MBPP+)"

