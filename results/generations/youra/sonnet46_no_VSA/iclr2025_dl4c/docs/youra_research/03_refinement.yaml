# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-D1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under controlled conditions (post-dedup, problem-count matched, token-budget equalized,
    supervision-format normalized across all sources), if SFT training source identity is varied
    (HumanEval-only vs MBPP-only vs LeetCode-only vs Equal-mix), then pass@1 on held-out
    HumanEval+ and MBPP+ will differ significantly across conditions for DeepSeek-Coder at both
    1.3B and 7B scales, because training-benchmark distributional alignment (measured by
    code-embedding cosine similarity) governs post-pretraining SFT specialization — i.e.,
    a model trained on problems whose distribution is closest to the evaluation benchmark will
    achieve the highest pass@1 on that benchmark.
  alternative_hypothesis_h0: |
    All four source conditions (HumanEval-only, MBPP-only, LeetCode-only, Equal-mix) produce
    pass@1 within ±1.5 percentage points of each other on both HumanEval+ and MBPP+ at both
    1.3B and 7B scales, i.e., source identity is not practically significant for code SFT at
    this scale and token budget.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "SFT training source condition"
      type: "categorical"
      operationalization: "Post-dedup, problem-count-matched, token-budget-equalized training set from one of four source conditions"
      levels:
        - "HumanEval-only: 164 training-eligible problems (post-dedup), ≥3 epochs to match token budget"
        - "MBPP-only: 374 training problems (post-dedup), epochs calibrated to match token budget"
        - "LeetCode-only: N problems subsampled to match unique-problem count × repetition rate"
        - "Equal-mix: equal proportion from HumanEval-train + MBPP-train + LeetCode subsampled"
    - name: "Model size"
      type: "categorical"
      operationalization: "DeepSeek-Coder-Base model parameter count"
      levels:
        - "1.3B: DeepSeek-Coder-1.3B-Base"
        - "7B: DeepSeek-Coder-7B-Base"
  dependent:
    - name: "pass@1 on HumanEval+"
      type: "continuous"
      operationalization: "Fraction of 164 HumanEval+ test problems solved by greedy decoding (temperature=0), evaluated via EvalPlus harness"
      primary: true
    - name: "pass@1 on MBPP+"
      type: "continuous"
      operationalization: "Fraction of 374 MBPP+ test problems solved by greedy decoding, evaluated via EvalPlus harness"
      primary: false
  controlled:
    - name: "Total SFT training tokens"
      operationalization: "Fixed token budget per condition (equalized across all source conditions)"
    - name: "Number of unique training problems × repetition rate"
      operationalization: "All conditions matched on unique-problem count and epoch repetition to eliminate exposure frequency confound"
    - name: "Training hyperparameters"
      operationalization: "Identical SFTConfig: learning rate, batch size, optimizer (AdamW), gradient clipping — same as prior validated runs"
    - name: "Supervision format"
      operationalization: "Standardized prompt template across all sources: identical instruction header, uniform output format, consistent inclusion/exclusion of I/O examples"
    - name: "Deduplication threshold"
      operationalization: "all-MiniLM-L6-v2, cosine sim > 0.95 vs HumanEval+ and MBPP+ test sets — applied before training set construction"
    - name: "Random seed"
      operationalization: "3 seeds per condition (minimum); Holm-Bonferroni correction for multiple comparisons"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "SFT training source defines a conditional distribution P_train(x,y) over problem-solution pairs that differs structurally across HumanEval-only, MBPP-only, LeetCode-only, and Equal-mix conditions."
      evidence: "Different structural properties: HumanEval (short, doctest-driven), MBPP (verbose, utility-oriented), LeetCode (competitive, algorithmic). Distribution shift is measurable via code-embedding cosine similarity."
      falsifier: "If all four source conditions produce statistically indistinguishable code-embedding distributions (pairwise cosine similarity > 0.95), the assumed distributional difference does not exist."
    - step: 2
      description: "SFT gradient updates fine-tune the pretrained model toward P_train(x,y), producing weight adjustments that directionally bias next-token prediction toward the training source's stylistic and structural patterns."
      evidence: "DomainPilot (2026): SFT domain mixture optimization produces +3.8% via loss-guided reweighting. Lv et al. (2025): 40% of OSS-Instruct outperforms 100% — source quality and style affect gradient direction. Established via prior h-e1 result: 1.3B produces 1.672× larger gradient magnitudes on Easy problems."
      falsifier: "If equal-mix SFT produces lower loss on all source distributions simultaneously, the specialization via biased gradient updates mechanism is unsupported — diversity dominates."
    - step: 3
      description: "The trained model's performance on evaluation benchmark B is higher when P_train is distributionally closer to P_test(B), because the fine-tuned weight adjustments align the model's internal representations with the test distribution."
      evidence: "GRAPE (Zhang et al. 2025): source distribution alignment outperforms 3× more data. DomainPilot: domain-level loss monitoring produces source-dependent benchmark gains. Alignment principle is well-established for pretraining; this hypothesis extends it to code-specific SFT."
      falsifier: "If pass@1 rank order does NOT correlate with code-embedding distributional distance between training source and test benchmark (Spearman ρ ≤ 0 or non-significant via permutation test), the distributional alignment mechanism is falsified."
  key_tension: "Pretraining co-exposure: DeepSeek-Coder was pretrained on GitHub code that likely already contains LeetCode-style solutions, potentially inflating LeetCode-only SFT gains via weight-space reinforcement rather than SFT-driven distributional alignment."
  evidence_summary: |
    The causal chain rests on three pillars: (1) source distributions differ measurably in code-embedding space; (2) SFT directionally biases weights toward P_train; (3) bias → benchmark alignment → pass@1 advantage. The pretraining confound (LeetCode already in pretrained weights) is addressed by comparing 1.3B vs 7B scale effects — larger models with richer pretraining coverage should show attenuated source effects if pretraining co-exposure is the driver.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Deduplication at cosine sim > 0.95 (all-MiniLM-L6-v2) sufficiently removes test-set contamination from training sources, such that pass@1 differences reflect generalization rather than memorization."
    supporting_evidence: "Validated dedup pipeline from prior runs. EvalPlus contamination methodology. Survey on Data Contamination (Cheng et al. 2025): cosine sim dedup is standard practice."
    consequence_if_violated: "LeetCode-only condition may show artificially inflated pass@1 on HumanEval due to surface-level n-gram leakage, producing false positive source identity effect. Diagnostic: compare results with and without AST-level dedup."
  - id: "A2"
    assumption: "Post-dedup problem-count matching (equalizing unique-problem count and repetition rate across all conditions) sufficiently isolates source identity from dataset size, entropy, and exposure frequency confounds."
    supporting_evidence: "Prof. Rex's analysis in discussion: token budget alone is insufficient; must match unique-problem count × repetition rate. Prof. Pax validated this concern about dataset entropy."
    consequence_if_violated: "If one condition sees dramatically more unique problems (e.g., LeetCode-only from 10K vs HumanEval-only from 164), the measured effect would reflect coverage breadth, not source identity. The 'source identity dominates' claim would collapse."
  - id: "A3"
    assumption: "Supervision format normalization (standardized prompt template across all sources) ensures that pass@1 differences are not driven by prompt scaffolding differences (presence/absence of I/O examples, instruction style)."
    supporting_evidence: "Prof. Pax's concern in discussion: MBPP naturally includes I/O examples while HumanEval uses docstrings. Without normalization, format becomes a hidden variable."
    consequence_if_violated: "If MBPP-only condition benefits from richer I/O scaffolding in training prompts, its performance advantage on MBPP+ may reflect prompt engineering rather than distributional alignment."
  - id: "A4"
    assumption: "all-MiniLM-L6-v2 (or a code-specialized encoder like CodeBERT/frozen DeepSeek embeddings) can detect meaningful distributional differences between code problem sources at the embedding level, such that cosine distance correlates with structural programming task differences."
    supporting_evidence: "all-MiniLM-L6-v2 validated for semantic similarity in prior dedup runs. Prof. Pax's concern: a code-specialized encoder is more appropriate for P3. CodeBERT is publicly available."
    consequence_if_violated: "If embedding-space distances are statistically indistinguishable across sources (all pairwise distances near 0 or near 1), the P3 correlation claim is unmeasurable and the mechanistic contribution collapses."
  - id: "A5"
    assumption: "3 seeds per condition provides sufficient statistical power to detect a ≥2.0 percentage point effect size in pass@1 via linear mixed-effects model with problem-level random effects."
    supporting_evidence: "HumanEval has 164 problems (binomial SE ~3.7% at p=0.35); between-seed variation expected ~1.2 pp based on prior run variance. Mixed-effects model with problem-level random effects increases sensitivity. Formal power calculation needed pre-experiment."
    consequence_if_violated: "If between-seed variance exceeds between-condition variance, a real source effect may be undetected (Type II error). Mitigation: report problem-level paired bootstrap as supplementary analysis."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Decoder-only code LLMs at 1.3B-7B parameter scale (specifically DeepSeek-Coder-Base)
    - SFT fine-tuning on existing public code datasets (not RL, not pretraining)
    - Execution-based binary evaluation (pass@1 via EvalPlus)
    - Python-only problem subsets from each source dataset
    - Token budgets achievable within a small research lab's compute (5× H100, <48 hours)
  does_not_apply_to: |
    - RL-based post-training (GRPO, PPO, RLHF) — explicitly excluded per prior failure modes
    - Gradient variance measurement or curriculum ordering — explicitly excluded per h-m1 failure
    - Models larger than 7B (scope limit; scaling law extrapolation is future work)
    - Instruction-tuned base models (applies only to base models without prior SFT)
    - Code generation benchmarks beyond HumanEval and MBPP (CodeContests is supplementary only)
    - Non-Python programming languages
    - Human annotation, subjective scoring, or new benchmark construction
  known_limitations: |
    - HumanEval training set has only 164 problems — low-diversity single-source condition
    - CodeContests has language mix (C++/Java/Python) — restricted to Python subset or treated as supplementary
    - Pretraining data composition of DeepSeek-Coder-1.3B/7B-Base is not fully documented — pretraining co-exposure remains a caveat
    - With n=4 source conditions, Spearman ρ for P3 is statistically fragile (rank swap can change significance) — requires permutation test
    - Equal-mix condition confounds source diversity with individual source alignment

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "SFT training source identity produces a statistically significant main effect on pass@1 for at least one source-benchmark pair at 1.3B scale."
    test_method: "Linear mixed-effects model: pass@1 ~ source_condition + (1|problem) + solution_length_covariate, evaluated per benchmark (HumanEval+ and MBPP+ separately). Pairwise contrasts with Holm-Bonferroni correction."
    success_criterion: "Fixed effect of source_condition: p < 0.05, minimum effect size ≥2.0 absolute percentage points for at least one pairwise contrast (e.g., HumanEval-only vs LeetCode-only on HumanEval+) at 1.3B scale, consistent in direction across ≥2/3 seeds."
    falsification: "All pairwise source contrasts within ±1.5 pp on both benchmarks at both model sizes across all seeds."
  - id: "P2"
    primary: false
    statement: "Cross-benchmark transfer is asymmetric: HumanEval-only outperforms MBPP-only on HumanEval+, and MBPP-only outperforms HumanEval-only on MBPP+, in a directional inversion consistent across ≥2/3 seeds and both model sizes."
    test_method: "Pairwise comparison: HumanEval-only vs MBPP-only on HumanEval+ and on MBPP+. Check whether the performance ranking inverts across the two benchmarks (same-source advantage on each benchmark's native distribution)."
    success_criterion: "HumanEval-only > MBPP-only on HumanEval+ AND MBPP-only > HumanEval-only on MBPP+, with consistent direction across ≥2/3 seeds at 1.3B scale. Additional check: LeetCode-only vs MBPP-only inversion (LC > MBPP on HumanEval, MBPP > LC on MBPP)."
    falsification: "One or both expected inversions fail to appear — e.g., LeetCode-only dominates on BOTH benchmarks, suggesting dataset size/diversity rather than alignment drives the effect."
  - id: "P3"
    primary: false
    statement: "Spearman rank correlation between training-source to test-benchmark code-embedding cosine distance (mean pairwise similarity between training source and test problem embeddings) and pass@1 rank order across source conditions is statistically significant via permutation test."
    test_method: "Compute code-embedding (CodeBERT or frozen DeepSeek embeddings) mean pairwise cosine similarity between each training source and each test benchmark. Rank conditions by similarity. Compare rank to pass@1 rank. Spearman ρ. Permutation test: randomly shuffle source-condition labels 10,000 times, compute ρ each time, check whether observed ρ exceeds 95th percentile of null distribution."
    success_criterion: "Spearman ρ > 0 and permutation test p < 0.05 for at least one benchmark at at least one model size. Monotonic rank match preferred but not required."
    falsification: "Observed ρ does not exceed 95th percentile of permutation null distribution for both benchmarks at both model sizes. Alternatively, pretraining-source similarity predicts pass@1 rank better than SFT-source similarity."

