hypothesis_draft:
  title: "Per-Sample Hessian Trace Trajectory as Annotation-Free DFR Proxy"
  hypothesis_id: "H-E3"
  core_claim: |
    Under ERM training on Waterbirds (ResNet-50, SGD, 50 epochs), per-sample last-fc Hessian
    trace (K=50 Hutchinson) exhibits a transient asymmetry: the trace ratio R(t) =
    mean_minority_trace(t) / mean_majority_trace(t) rises from ≈1.0 at epoch 0, peaks at t*
    (typically t*∈{1,5,10}), and AUROC at t* ≥ 0.85 for minority membership prediction
    with epoch-0 AUROC < 0.70 (ERM emergence, not pretrained artifact).
  mechanism: |
    ERM spurious feature exploitation (Phase I, LaBonte 2026) causes majority samples to gain
    confidence rapidly (p→1, low p(1-p)), while minority samples remain near the decision boundary
    (p≈0.5, high p(1-p)). Combined with minority feature diversity advantage (LaBonte 2024
    spectral imbalance: λ₁^min > λ₁^maj), the per-sample trace Tr(H_i^fc) ∝ ‖x_i‖² p_i(1-p_i)
    is systematically elevated for minority samples. This trace asymmetry peaks at t* when
    majority saturation is highest (Phase I) and declines as ERM drives minority to confident
    misclassification (Phase II onset).
  predictions:
    - P1: "AUROC(t*) ≥ 0.85, AUROC(epoch-0) < 0.70, Spearman ρ ≥ 0.8 in ≥4/5 seeds"
    - P2: "ΔAUROC ≥ 0.10 over loss-only within confidence bins (width 0.02), KS p < 0.01 in ≥4/5 seeds"
    - P3: "Trace-guided DFR WGA ≥ 85% AND > loss-guided DFR + 5% absolute in ≥4/5 seeds"

variables_summary:
  independent: "Training checkpoint t ∈ {0,1,5,10,20,50}; K=50 Hutchinson probes (fixed)"
  dependent_primary: "AUROC for minority membership prediction at t*; trace ratio R(t); WGA via DFR"
  controlled: "ResNet-50 (IMAGENET1K_V1), Waterbirds v1.0, SGD, last-fc layer only, 5 seeds"

null_hypothesis:
  h0_statement: |
    There is no significant difference in per-sample last-fc Hessian trace between minority
    and majority samples that is not fully explained by per-sample loss value and gradient norm.
    Specifically: (i) AUROC(t*) < 0.80, OR (ii) ΔAUROC within confidence bins < 0.05, OR
    (iii) epoch-0 AUROC ≥ 0.70 (pretrained artifact dominates ERM signal).
  statistical_test: "AUROC comparison, Spearman ρ, two-sided KS test within confidence bins (α=0.01)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First per-sample Hessian trace trajectory measurement across ERM training checkpoints for minority/majority discrimination; first annotation-free DFR proxy using second-order curvature (vs all existing proxies using first-order loss/gradient signals)"
  differentiation_summary: |
    Existing annotation-free DFR proxies (JTT, AFR, SELF, EVaLS) all use first-order signals
    (loss value, misclassification indicator, gradient norm). This work introduces the first
    second-order (curvature/Hessian trace) annotation-free proxy, grounded in the Phase I/II
    learning dynamics of LaBonte 2026 and the spectral imbalance mechanism of LaBonte 2024.
    Citation network gap confirmed: no paper measures per-sample Hessian trace trajectory
    across training epochs for spurious correlation detection.

