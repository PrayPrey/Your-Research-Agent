phase2b_readiness:
  status: "READY"
  sh1_existence: |
    H-E3: Per-sample last-fc Hessian trace (K=50) must exhibit AUROC ≥ 0.85 at t* for minority
    membership prediction, with epoch-0 AUROC < 0.70 (ERM emergence) and Spearman ρ ≥ 0.8
    (trajectory monotonicity). This is the existence gate.
  sh2_mechanism: |
    H-M3: Trace ratio R(t) trajectory must rise from ≈1.0, reach peak at t* (argmax_t R(t)),
    then decline as majority margins saturate. Mechanism test: ΔAUROC ≥ 0.10 within confidence bins
    (independence from loss/confidence), AND ≥75% trace gap collapse under background-swap
    (shortcut specificity). 50-epoch training with checkpoints t∈{0,1,5,10,20,50} required.
  sh3_comparison: |
    H-C3 (deferred to Phase 5): Trace-guided DFR vs. loss-guided DFR, gradient-norm-guided DFR,
    JTT, SELF, EVaLS, and oracle DFR on Waterbirds. Target: WGA ≥ 85% and ≥5% absolute WGA
    improvement over loss-guided DFR.
  open_questions:
    - "What is the epoch-0 Hessian trace AUROC? (Decisive gate: < 0.70 required to rule out pretrained artifact)"
    - "What is the peak epoch t* across 5 seeds? (Expected t*∈{1,5,10} based on h-e1 snapshot)"
    - "Does minority confidence remain in [0.3,0.7] at t*? (Mechanism contingency A1)"
    - "What k% maximizes WGA without group labels? (Expected 10-20% based on AUROC ~0.91 discriminability)"
    - "Does trace collapse under background-swap augmentation? (Shortcut specificity test)"

