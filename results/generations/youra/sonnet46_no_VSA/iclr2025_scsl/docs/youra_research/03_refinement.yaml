# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "ERM training exploits spurious correlation (background) as shortcut feature (Phase I, LaBonte 2026). Majority samples (correct background-label alignment) gain confidence rapidly: p_majority(t) → 1. Minority samples (misaligned background-label) fail to decrease loss via spurious feature."
      evidence: "LaBonte & Muthukumar 2026 (arXiv:2606.30444): SGD provably learns spurious feature first (exponential growth of w_sp). h-e2-k: K=50 AUROC=0.913 confirms minority/majority separation exists at specific checkpoint."
      falsifier: "If majority and minority confidence trajectories are indistinguishable across epochs, the shortcut exploitation mechanism fails. Epoch-0 AUROC ≥ 0.85 would indicate pretrained artifact rather than ERM-induced asymmetry."
    - step: 2
      description: "Differential confidence creates differential last-layer Hessian curvature. For linear softmax head: Tr(H_i^fc) ∝ ‖x_i‖² p_i(1-p_i). Minority samples remain near boundary (p≈0.4–0.6, high p(1-p)); majority samples approach saturation (p→0.95, low p(1-p)). Plus: minority has higher feature diversity ‖x_i‖² due to LaBonte 2024 spectral imbalance."
      evidence: "LaBonte et al. 2024 spectral imbalance: ρ(y) > 1 (minority covariance λ₁ > majority). Algebraic decomposition Tr(H_i^fc) ∝ ‖x_i‖² p_i(1-p_i) is exact for linear cross-entropy head."
      falsifier: "If ΔAUROC < 0.10 within confidence bins (width 0.02), trace signal is fully explained by confidence alone and feature diversity (‖x_i‖² channel) contributes nothing. This falsifies Step 2."
    - step: 3
      description: "Trace ratio R(t) = mean_minority/mean_majority rises during Phase I as differential confidence grows, reaches peak at t* (argmax R(t)), then declines during Phase II as ERM drives minority to confident misclassification (p_minority→0, p(1-p)→0 for both groups). The peak t* identifies the optimal DFR checkpoint."
      evidence: "Predicted by Phase I/II dynamics: h-e1 snapshot found t*∈{1,4} across seeds — early epochs. The AUROC signal must peak before convergence when minority samples enter confident misclassification regime."
      falsifier: "If R(t) does not reach a peak within t∈{0,1,5,10,20,50} (still rising at t=50), the Phase I→II transition is either absent or beyond 50 epochs. Spearman ρ < 0.8 across the rising segment falsifies monotonic growth claim."
    - step: 4
      description: "Top-k% highest-trace training samples at t* serve as annotation-free proxy for minority group membership. Replacing the balanced validation set in Kirichenko 2022 DFR with this proxy subset enables L1 logistic regression on ERM-trained features to achieve WGA ≥ 85%."
      evidence: "Kirichenko 2022: DFR with balanced validation → WGA ~88-90%. Annotation-free proxies (JTT AUROC ~80-84%) show that proxy quality determines WGA ceiling. K=50 trace AUROC=0.913 is higher than typical JTT proxy, predicting DFR WGA > JTT."
      falsifier: "If trace-guided DFR WGA < loss-guided DFR by ≥5% absolute, trace provides no DFR utility beyond first-order signals. If WGA < 85% in ≥2/5 seeds, the application claim fails."
  key_tension: "The fundamental mechanism contingency: for Tr(H_i^fc) to discriminate, minority samples must be near the decision boundary (p≈0.5), not confidently misclassified (p≈0). If Waterbirds 95% spuriosity drives minority to confident misclassification BEFORE the trace peak, the signal window collapses and the DFR proxy fails."
  evidence_summary: |
    The causal chain is supported by: (1) LaBonte 2026 Phase I/II theory predicting shortcut-first
    learning dynamics; (2) LaBonte 2024 spectral imbalance providing second-order mechanistic support;
    (3) Algebraic decomposition Tr ∝ ‖x_i‖² p_i(1-p_i) connecting differential confidence to trace;
    (4) h-e2-k confirming K=50 AUROC=0.913 at a specific checkpoint (the signal exists);
    (5) h-e1 snapshot confirming gradient norm AUROC=0.940 (related magnitude family works);
    (6) Kirichenko 2022 DFR demonstrating ERM features are sufficient for WGA ≥ 85%.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Minority samples remain near the decision boundary (mean confidence p∈[0.3,0.7]) during Phase I of ERM training (epochs 1-20), not confidently misclassified."
    supporting_evidence: "h-e1 snapshot found t*=1 for 3/5 seeds and t*=4 for 2/5 seeds, suggesting early-epoch signal. Gradient norm AUROC=0.940 at t* implies asymmetry before minority saturation."
    consequence_if_violated: "If minority confidence < 0.3 at early epochs (confidently wrong), p_minority(1-p_minority) → 0 and trace signal collapses. DFR proxy fails entirely. Route back to Phase 0."
  - id: "A2"
    assumption: "Epoch-0 Hessian trace AUROC < 0.70 (signal is ERM-induced, not pretrained artifact)."
    supporting_evidence: "h-e2 failure (AUROC=0.987 at epoch 0 for gradient direction) motivates this check. Hessian trace is a different signal family — may behave differently. No prior measurement of epoch-0 trace AUROC."
    consequence_if_violated: "If epoch-0 AUROC ≥ 0.70, signal is another pretrained artifact (like h-e2). The trajectory hypothesis collapses. Route back to Phase 0 for signal redesign."
  - id: "A3"
    assumption: "Feature diversity ‖x_i‖² is systematically higher for minority samples than majority within the same class (consistent with LaBonte 2024 spectral imbalance)."
    supporting_evidence: "LaBonte et al. 2024: minority covariance spectral norm > majority within class. This should manifest as higher per-sample feature norm for minority samples."
    consequence_if_violated: "If ‖x_i‖² is equal across groups, trace signal reduces purely to confidence p_i(1-p_i). The independence test (ΔAUROC within confidence bins) would fail. Signal becomes parasitic on confidence."
  - id: "A4"
    assumption: "K=50 Hutchinson estimator has CV ≤ 10% across probe resampling for last-fc layer of ResNet-50 on Waterbirds."
    supporting_evidence: "h-e2-k confirmed K=50 vs analytical gap=0.0059 < 0.05, suggesting K=50 achieves stable estimates. CV ≤ 10% is standard for Hutchinson at K=50 in similar-scale networks."
    consequence_if_violated: "If CV > 10%, Hutchinson noise dominates inter-group signal. Must increase K to 100+ or use alternative estimator (e.g., diagonal Fisher). DFR proxy becomes unreliable."
  - id: "A5"
    assumption: "Top-k% highest-trace training samples at t* are sufficiently group-balanced to serve as DFR proxy (minority representation > 5× their natural prevalence)."
    supporting_evidence: "h-e2-k AUROC=0.913 implies high trace correctly identifies minority samples at high rate. At AUROC=0.91, if threshold selects top-10%, minority should be ≥40-50% of selected samples vs natural 5%."
    consequence_if_violated: "If selected proxy subset is majority-dominated despite high AUROC (due to class imbalance), L1 logistic regression retraining will not balance groups and WGA will not improve. Adjust k% or use class-conditional selection."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Waterbirds dataset (95% spuriosity) at /home/PrayPrey/data/waterbirds_v1.0/
    - ResNet-50 (ImageNet pretrained, IMAGENET1K_V1)
    - SGD optimizer with standard hyperparameters
    - Last-fc-layer only Hutchinson trace (K=50)
    - ERM training (not DRO, not SAM, not other robust methods)
    - Binary spurious correlation setting (2 classes × 2 spurious attributes = 4 groups)
    - Training checkpoints at t∈{0,1,5,10,20,50} epochs
  does_not_apply_to: |
    - CelebA, MultiNLI, CivilComments (not tested; separate hypothesis needed)
    - Frozen pretrained features (proven insufficient by h-m4: WGA ceiling 62%)
    - Adam optimizer (dynamics may differ; not tested in this pipeline)
    - All-layer Hessian trace (only last-fc tested in this hypothesis; extension deferred)
    - Full Hessian (prohibitively expensive; only trace via Hutchinson)
    - Scenarios where minority confidence is < 0.3 throughout training (mechanism collapses)
  known_limitations: |
    - 95% spuriosity is the specific tested regime; lower spuriosity may weaken the signal
    - Hutchinson trace is stochastic; CV must be verified at K=50
    - k% threshold for DFR proxy selection requires tuning on unbalanced validation
    - Background-swap augmentation approximates "clean" condition using existing Waterbirds metadata
    - The Phase I/II framing from LaBonte 2026 (XOR model) may not transfer perfectly to ResNet-50

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "At epoch t* (argmax_t R(t) across checkpoints t∈{0,1,5,10,20,50}), per-sample last-fc Hessian trace achieves AUROC ≥ 0.85 for minority membership prediction; epoch-0 AUROC < 0.70; Spearman ρ ≥ 0.8 between epoch t and R(t) across the rising segment from t=0 to t*."
    test_method: "Train ResNet-50 on Waterbirds (5 seeds). At each checkpoint, compute per-sample trace via K=50 Hutchinson (vmap+vjp, last-fc only). Compute AUROC vs group labels. Compute R(t) ratio. Fit Spearman ρ over rising segment."
    success_criterion: "AUROC(t*) ≥ 0.85 AND AUROC(t=0) < 0.70 AND Spearman ρ ≥ 0.8, all in ≥4/5 seeds."
    falsification: "AUROC(t=0) ≥ 0.70 (pretrained artifact), OR AUROC(t*) < 0.80 in ≥2/5 seeds, OR Spearman ρ < 0.6."
  - id: "P2"
    primary: false
    statement: "Within narrow confidence bins (width 0.02), minority samples have systematically higher trace than majority (two-sided KS test p < 0.01), AND ΔAUROC ≥ 0.10 over loss-only baseline, in ≥4/5 seeds."
    test_method: "At t*, bin all training samples by predicted confidence p_i into bins of width 0.02. Within each occupied bin, apply KS test on trace distributions. Compute AUROC of trace vs group within confidence-matched pairs."
    success_criterion: "KS p < 0.01 for majority of bins AND ΔAUROC(trace, within-bin) ≥ 0.10 over loss-only AUROC, in ≥4/5 seeds."
    falsification: "KS test non-significant across all bins, OR ΔAUROC < 0.05. Implies trace = reparameterized confidence."
  - id: "P3"
    primary: false
    statement: "Top-k% highest-trace training samples at t* (k tuned on unbalanced validation accuracy) → DFR via L1 logistic regression on ERM features → test WGA ≥ 85% in ≥4/5 seeds; AND WGA > loss-guided DFR by ≥5% absolute."
    test_method: "Select top-k% by trace at t*. Tune k ∈ {5,10,15,20,25,30}% on unbalanced validation accuracy. Run izmailovpavel DFR pipeline (C_OPTIONS, REG='l1'). Evaluate test WGA. Compare to top-k% by loss."
    success_criterion: "WGA ≥ 85% in ≥4/5 seeds AND WGA_trace > WGA_loss + 5% absolute in mean."
    falsification: "WGA < 80% in ≥2/5 seeds, OR WGA_trace ≤ WGA_loss + 2% (trace adds no DFR utility)."

