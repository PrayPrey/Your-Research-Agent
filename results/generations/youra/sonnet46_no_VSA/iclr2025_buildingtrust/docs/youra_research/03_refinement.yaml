# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Architecture Family"
      type: "categorical"
      operationalization: "Architecture type assigned by attention topology: (1) encoder-only/bidirectional, (2) decoder-only/causal, (3) encoder-decoder/cross-attention"
      levels:
        - "encoder-only (BERT-base, RoBERTa-base, ELECTRA-base, ALBERT-base)"
        - "decoder-only (GPT-2 117M, OPT-125M)"
        - "encoder-decoder (T5-base, BART-base)"
    - name: "Attack Type"
      type: "categorical"
      operationalization: "AdvGLUE attack category (C1-C11) grouped into: (A) word-level automatic (C1-C5), (B) sentence-level automatic (C6-C7), (C) human-crafted (C8-C11: ANLI, StressTest, CheckList)"
      levels:
        - "word-level automatic (C1-C5)"
        - "sentence-level automatic (C6-C7)"
        - "human-crafted (C8-C11)"
  dependent:
    - name: "Normalized Vulnerability (Δ*)"
      type: "continuous"
      operationalization: "Δ* = (Acc_clean − Acc_adv) / Acc_clean, computed per model per attack type per task; aggregated at attack-type level"
      primary: true
    - name: "Architecture-Family Classification Accuracy"
      type: "continuous"
      operationalization: "Leave-one-model-out nearest-neighbor classification accuracy predicting architecture family from Δ*-vector; reported with 95% bootstrap CI"
      primary: false
    - name: "Attention Concentration ΔC"
      type: "continuous"
      operationalization: "Per-layer change in attention mass allocated to perturbed token spans: ΔC_ℓ = C_ℓ(adv, perturbed span) − C_ℓ(clean, same span); mean(ΔC) aggregated across layers"
      primary: false
  controlled:
    - name: "Model Scale"
      operationalization: "All models constrained to ~110-250M parameters (base scale): BERT-base 110M, GPT-2 117M, T5-base 248M, etc."
    - name: "Clean Accuracy"
      operationalization: "Included as fixed covariate in all mixed-effects models to control for baseline performance ceiling effects"
    - name: "Pretraining Objective"
      operationalization: "Fixed covariate in mixed-effects model: MLM (BERT, RoBERTa), RTD (ELECTRA), AR-LM (GPT-2, OPT), span-corruption (T5), denoising (BART)"
    - name: "Tokenizer Family"
      operationalization: "Fixed covariate: WordPiece (BERT), BPE (GPT-2, RoBERTa), SentencePiece (T5); enables tokenizer-sensitivity analysis"
    - name: "Fine-tuning Protocol"
      operationalization: "Standardized fine-tuning on GLUE training sets using identical hyperparameter ranges (learning rate 2e-5 to 5e-5, batch size 32, epochs 3-5)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Attention topology (bidirectional vs. causal vs. cross-attention) shapes how the model aggregates token representations during inference."
      evidence: "Structural property of BERT (bidirectional Transformer encoder), GPT-2 (causal decoder), T5 (encoder-decoder cross-attention); well-established in architecture literature."
      falsifier: "If removing attention mask differences (e.g., using decoder in bidirectional mode) eliminates the vulnerability difference, this step is falsified."
    - step: 2
      description: "When a local perturbation (word substitution, character noise) is applied, bidirectional attention globally redistributes attention to all positions including the perturbed token, amplifying its representational influence. Causal attention processes the perturbation locally in sequence without global redistribution."
      evidence: "Indirect: Zhang et al. [2026] — decoder LLMs show 73% lower explanation flip rates under perturbation, consistent with local processing. Li et al. [2026] — decoder models more robust to character/token noise. Predicted: ΔC test will show positive attention concentration increase in encoder lower layers, distributed shift in decoder higher layers."
      falsifier: "If ΔC analysis shows no systematic difference in attention redistribution patterns across architecture families under perturbation, this step is falsified."
    - step: 3
      description: "The attention redistribution pattern determines which features the model's classification head receives under perturbed inputs. Globally redistributed attention (encoder) creates a distinct clean vs. perturbed feature geometry. Locally bounded attention (decoder) preserves feature geometry more robustly under lexical perturbation but is more sensitive to global semantic inversions."
      evidence: "Mechanistic prediction supported by FLUKE [Otmakhova et al., 2025]: capability ≠ robustness implies representational processing under shift differs from capability in clean context. Reasoning LLMs (larger decoders) show decreased robustness on some tasks, consistent with stronger sequential pattern learning that fails on semantic inversion."
      falsifier: "If the Δ* vector clustering does not align with expected direction (decoder more robust to C1-C5, encoder potentially more robust to C8-C11 semantic), this step is falsified."
    - step: 4
      description: "The systematic difference in feature geometry under perturbation produces a characteristic Δ*-vector for each architecture family that is more similar within-family than between-family, enabling classification from robustness profiles."
      evidence: "Predicted by the hypothesis; testable via permutation MANOVA (between-family η² > 0.15 in ≥50% reliable categories) and leave-one-model-out classifier (≥60% accuracy)."
      falsifier: "If within-family variance ≥ between-family variance across attack categories, or if leave-one-model-out classification falls to chance (<40% accuracy, CI overlapping 33%), this step is falsified."
  key_tension: "Whether the observed Δ* clustering is driven by architecture topology vs. pretraining objective (MLM vs. AR-LM vs. RTD) — the ELECTRA vs. BERT contrast is the critical test. If ELECTRA (RTD objective, same encoder architecture) separates from BERT while clustering with other RTD models, objective dominates and the story must shift to 'pretraining signal bias' rather than 'architectural inductive bias.'"
  evidence_summary: |
    Convergent indirect evidence supports the causal chain:
    - Decoder > encoder robustness to local perturbations: Li et al. [2026] (retrieval domain), Zhang et al. [2026] (explanation domain)
    - Capability ≠ robustness: FLUKE [2025] — must measure directly on benchmarks
    - Robust training fails to close the gap: AdvGLUE [2021] +3-4 points only
    - Architecture comparison template exists: Yang et al. [2024] Llama/OPT/T5 classification comparison
    Direct evidence for the ΔC mediation chain requires new experiments.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Architecture family membership is the dominant driver of Δ*-vector clustering, not model scale, tokenizer, or pretraining objective."
    supporting_evidence: "Partial: decoder > encoder robustness trend is consistent across retrieval (Li et al.) and explanation (Zhang et al.) domains suggesting architecture topology matters. ELECTRA vs. BERT control can test this directly."
    consequence_if_violated: "If objective or tokenizer drives clustering, the contribution shifts from 'architectural inductive bias' to 'pretraining signal bias.' Still publishable but requires reframing. The study would still establish that Δ*-vector clustering exists; only the mechanistic attribution changes."
  - id: "A2"
    assumption: "AdvGLUE's curated adversarial examples (≥4/5 annotator agreement, ~10% retention) provide a sufficiently valid and diverse stimulus set to measure architecture-level differences in vulnerability."
    supporting_evidence: "AdvGLUE curation is the most rigorous existing adversarial NLP benchmark; Fleiss κ ~0.6 post-curation. Human-crafted subset (ANLI, StressTest, CheckList) provides surrogate-free validation."
    consequence_if_violated: "If the fingerprint only appears in automatic (surrogate-generated) examples and disappears on human-crafted ones, the effect is surrogate-induced. Cross-partition generalization test directly addresses this."
  - id: "A3"
    assumption: "Δ*-vector reliability (split-half r ≥ 0.7) is achievable for the majority of attack categories with ≥50 aggregated examples per architecture family."
    supporting_evidence: "AdvGLUE reports attack category sizes in Table 1; several categories have 200-500 examples. For base-scale models × 3 families × 5 tasks, aggregated cells likely meet threshold for major attack types. Borderline categories will be flagged and dropped."
    consequence_if_violated: "If fewer than 5 attack categories pass the reliability filter, the Δ*-vector dimensionality is too low to support meaningful clustering. This would constitute disconfirmation of the fingerprint approach as specified and require redesign."
  - id: "A4"
    assumption: "Attention concentration ΔC is a meaningful proxy for the feature geometry change mechanism, and is computable from standard HuggingFace attention outputs."
    supporting_evidence: "HuggingFace transformers support `output_attentions=True` for all target models. Perturbed token positions are identifiable from AdvGLUE attack metadata (word substitution positions, syntactic spans). ΔC = C(adv) − C(clean) is a standard computation."
    consequence_if_violated: "If attention concentration does not differ systematically across architecture families or fails to mediate Δ*, the mechanistic claim is unsupported. The descriptive (Δ*-vector clustering) and predictive (classification) claims can still stand independently."
  - id: "A5"
    assumption: "Seven base-scale models provide sufficient within-family variation to estimate intra-family Δ*-vector variance and test leave-one-model-out classification."
    supporting_evidence: "Encoder-only: 4 models (BERT-base, RoBERTa-base, ELECTRA-base, ALBERT-base); decoder-only: 2 models (GPT-2, OPT-125M); encoder-decoder: 2 models (T5-base, BART-base). Decoder-only family has only 2 models — the minimum. Leave-one-model-out with 2 members per family is degenerate (train on 1, test on 1). Mitigated by focusing primary classification on encoder-only vs. decoder-only contrast (4 vs. 2 models), or by adding OPT-350M as third decoder."
    consequence_if_violated: "If within-family variance is so high that 2 decoder-only models are not reliably similar in Δ*-profiles, the fingerprint concept requires a larger model set. This is not a logical flaw but an empirical boundary condition."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Base-scale (~110-250M parameter) transformer language models fine-tuned on GLUE classification tasks
    - Architecture families: encoder-only (bidirectional Transformer), decoder-only (causal Transformer), encoder-decoder (cross-attention Transformer)
    - Perturbation types in AdvGLUE, ANLI, and CheckList: word-level substitution, character-level noise, syntactic paraphrase, human adversarial
    - NLP classification tasks: sentiment analysis (SST-2), natural language inference (MNLI, SNLI), paraphrase detection (QQP), question-answering robustness (QNLI, AdvSQuAD-mapped)
  does_not_apply_to: |
    - Very large models (7B+ parameters): scale effects may overwhelm architectural differences
    - Non-transformer architectures (RNNs, CNNs): outside the scope
    - Vision-language models or multi-modal LLMs
    - Generation tasks (summarization, translation): hypotheses are about classification task robustness
    - Domain-specific fine-tuning beyond GLUE tasks (medical, legal, etc.)
    - Instruction-tuned or RLHF-trained variants: RLHF is known to decrease robustness (TREvaL), a confound
  known_limitations: |
    - AdvGLUE surrogate bias (encoder-family generation) requires cross-partition validation to rule out
    - Only 2 decoder-only models at base scale; leave-one-model-out classification is borderline feasible; may need OPT-350M addition
    - ELECTRA vs. BERT pretraining-objective contrast is imperfect (generator-discriminator training changes more than just the objective)
    - Attention concentration ΔC requires perturbed-token position metadata from AdvGLUE attack logs; availability must be confirmed
    - Results at base scale may not generalize to large models (1.3B+, 7B+) where architectural differences may be mediated by capacity

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Architecture × AttackType interaction in normalized vulnerability (Δ*) is statistically significant (p < 0.05, bootstrap CI excluding zero) in a mixed-effects model (Δ* ~ ArchitectureFamily × AttackType + Objective + Tokenizer + CleanAccuracy + (1|Model)), and this interaction replicates in ≥2 of 3 benchmark partitions (word-level auto, sentence-level auto, human-crafted)."
    test_method: "Fine-tune 7-8 base-scale models on GLUE; evaluate on AdvGLUE/ANLI/CheckList; compute Δ* per model × attack-type; fit mixed-effects model in Python (pymer4/statsmodels); bootstrap 1,000 iterations; stratify by attack partition."
    success_criterion: "p < 0.05 for Architecture × AttackType interaction term (bootstrap CI excludes zero) in the primary model; replication in ≥2/3 benchmark partitions; between-family η² > 0.15 in ≥50% of attack categories passing reliability filter (split-half r ≥ 0.7)."
    falsification: "Architecture × AttackType interaction p ≥ 0.05 after controlling for clean accuracy and objective, OR η² > 0.15 criterion met in fewer than 50% of reliable attack categories across all three benchmark partitions."
  - id: "P2"
    primary: false
    statement: "A Δ*-vector classifier trained on one benchmark partition predicts architecture family on a held-out partition with ≥60% leave-one-model-out accuracy (95% bootstrap CI entirely above 33% chance baseline for 3 families)."
    test_method: "Compute Δ*-vector (reliable attack categories only) per model; train nearest-neighbor or logistic classifier; evaluate cross-partition (train on automatic C1-C7, test on human-crafted C8-C11, and vice versa); run leave-one-model-out cross-validation; bootstrap 95% CI."
    success_criterion: "≥60% leave-one-model-out accuracy with 95% bootstrap CI lower bound > 33%."
    falsification: "Classification accuracy ≤ 40% or CI overlaps 33% baseline in cross-partition evaluation, indicating Δ*-vector is not predictive of architecture family beyond surrogate-aligned training."
  - id: "P3"
    primary: false
    statement: "Including mean attention concentration change mean(ΔC) as a fixed effect reduces the Architecture × WordLevel interaction coefficient magnitude by ≥30% (bootstrap CI excluding zero), supporting attention-topology-mediated vulnerability as the mechanism."
    test_method: "Extract attention weights via HuggingFace `output_attentions=True` for clean and perturbed inputs; compute ΔC_ℓ = C_ℓ(adv, perturbed span) − C_ℓ(clean, same span) per layer; aggregate mean(ΔC); compare full model (with mean(ΔC)) vs. base model (without) Architecture coefficient for word-level attack types."
    success_criterion: "Architecture × WordLevel coefficient reduction ≥30% when mean(ΔC) is added, with bootstrap CI for the reduction excluding zero (Sobel test or bootstrap mediation test)."
    falsification: "Architecture coefficient reduction <30% or CI includes zero when mean(ΔC) is added, indicating attention concentration is not the operative mechanistic pathway."

