experimental_scope:
  models:
    - "bert-base-uncased (110M, encoder-only, MLM, WordPiece)"
    - "roberta-base (125M, encoder-only, MLM, BPE)"
    - "google/electra-base-discriminator (110M, encoder-only, RTD, WordPiece)"
    - "albert-base-v2 (11M parameters, 125M effective, encoder-only, MLM, SentencePiece)"
    - "gpt2 (117M, decoder-only, AR-LM, BPE)"
    - "facebook/opt-125m (125M, decoder-only, AR-LM, GPT-2 BPE)"
    - "t5-base (250M, encoder-decoder, span-corruption, SentencePiece)"
    - "facebook/bart-base (140M, encoder-decoder, denoising, BPE)"
  datasets:
    - "AdvGLUE (4,978 curated adversarial cases; 5 tasks; 11 attack categories; adversarialglue.github.io)"
    - "ANLI-R3 (1,200 test examples per round; human-adversarial; allennlp.org/anli)"
    - "CheckList (template-based perturbations; surrogate-free; checklist.github.io)"
    - "GLUE (clean training/validation sets for fine-tuning; glue.benchmark.ai)"
  baselines:
    - "Random classifier: 33% accuracy for 3-class architecture-family classification"
    - "EMNLP 2023 BERT/GPT-2/T5 qualitative comparison (direct predecessor)"
    - "TrustLLM model-level robustness scores without architecture stratification"

measurement_plan:
  data_collection:
    - source: "AdvGLUE adversarial test set (download from official repository)"
    - source: "ANLI-R3 test set (download from AllenNLP)"
    - source: "CheckList perturbation templates (pip install checklist)"
    - source: "GLUE training/validation sets (HuggingFace datasets: glue)"
  procedure:
    - step: "Fine-tune 7-8 base-scale models on GLUE train split (SST-2, MNLI, QQP, QNLI, RTE) using standardized protocol (lr 2e-5–5e-5, batch 32, epochs 3)"
    - step: "Evaluate each fine-tuned model on GLUE dev split (clean accuracy baseline)"
    - step: "Evaluate each fine-tuned model on AdvGLUE test set by attack category (C1-C11); compute Δ* per model × attack-type × task"
    - step: "Compute split-half reliability r per attack category; retain only categories with r ≥ 0.7 and ≥50 aggregated examples"
    - step: "Aggregate Δ* at attack-type level (collapse tasks within attack category for reliability)"
    - step: "Decompose AdvGLUE into 3 partitions: A (C1-C5 auto word-level), B (C6-C7 auto sentence-level), C (C8-C11 human-crafted)"
    - step: "Evaluate on ANLI-R3 and CheckList as additional human-crafted/surrogate-free partitions"
    - step: "Fit mixed-effects model: Δ* ~ ArchFamily × AttackType + Objective + Tokenizer + CleanAccuracy + (1|Model)"
    - step: "Run permutation MANOVA: compute η² (between-family / total) per reliable attack category"
    - step: "Train Δ*-vector classifier; evaluate cross-partition (train A+B → test C; train C → test A+B); leave-one-model-out CV"
    - step: "Extract attention weights for clean+perturbed inputs; compute ΔC_ℓ per layer per model; run mediation model"
    - step: "Bootstrap all key statistics (1,000 iterations); compute 95% CIs"
  success_criteria:
    - "Architecture × AttackType interaction p < 0.05 (bootstrap CI excludes zero) in mixed-effects model"
    - "η² > 0.15 in ≥50% of reliable attack categories (between-family > within-family variance)"
    - "Cross-partition classification ≥60% leave-one-model-out accuracy with 95% CI entirely above 33%"
    - "ΔC mediation: Architecture coefficient reduction ≥30% when mean(ΔC) added (bootstrap CI excludes zero)"

validation:
  internal_validity:
    - "Scale control (all models ~110-250M parameters)"
    - "Standardized fine-tuning protocol (same hyperparameter ranges)"
    - "Clean accuracy as covariate in all models (prevents ceiling-effect confound)"
    - "Pretraining objective as fixed covariate (separates objective from attention topology)"
    - "Tokenizer family as sensitivity covariate"
    - "Split-half reliability filter (r ≥ 0.7) for Δ-vector dimensions"
    - "ELECTRA vs. BERT within-encoder objective contrast"
    - "Bootstrap CIs for all key statistics (1,000 iterations)"
  external_validity:
    - "Cross-benchmark replication (AdvGLUE + ANLI + CheckList)"
    - "Cross-partition generalization (surrogate-generated vs. human-crafted)"
    - "Leave-one-model-out validation (classification generalizes to unseen models within family)"
    - "Permutation-based significance testing (no parametric normality assumption)"
    - "Pre-registration of analysis decisions before data collection"

discussion_synthesis:
  key_insights:
    - "The core insight: architecture TOPOLOGY (attention direction) may define a characteristic perturbation vulnerability PROFILE, not just a scalar robustness level. This is qualitatively different from 'model X is more robust than model Y.'"
    - "AdvGLUE's semantic validity curation (~10% retention, ≥4/5 annotator agreement) ensures Δ* measures genuine comprehension failure, not noise sensitivity — strengthening what the fingerprint represents."
    - "The null correlation between robustness and robust training gains (+3-4 points only) suggests robustness is structurally determined. Architecture-family fingerprinting provides the structural explanation."
    - "Surrogate bias in AdvGLUE is real and must be controlled. The three-partition design (auto-word / auto-sentence / human-crafted) with cross-partition classifier generalization is the primary falsification test."
    - "Statistical power is the binding constraint at base scale. Aggregating at attack-type level (not attack-method level) and restricting to reliable coordinates resolves most power concerns."
  breakthrough_moments:
    - "Exchange 2 (Dr. Nova): Shift from 'which architecture is more robust' to 'what is the architecture-specific perturbation signature' — the fingerprinting framing that defines the novel contribution."
    - "Exchange 3 (Prof. Rex): Identification of AdvGLUE surrogate bias as the key threat to validity — led to the three-partition cross-generalization experimental design."
    - "Exchange 7 (Prof. Vera): Pre-registration protocol with explicit falsification thresholds (η² > 0.15, ≥60% classification accuracy) — transformed the hypothesis from exploratory to confirmatory."
    - "Exchange 9 (Prof. Rex): Specific attention concentration metric ΔC_ℓ = C_ℓ(adv, perturbed span) − C_ℓ(clean, same span) replacing vague 'attention entropy' — made the mechanistic test operationalizable."
    - "Exchange 14 (Dr. Sage): Contribution hierarchy (descriptive → replicative → mechanistic → predictive) — set the ambition at levels 3+4 and clarified publication venue target."
  resolved_tensions:
    - "Surrogate bias (Prof. Rex) vs. benchmark availability (Prof. Pax): RESOLVED by three-partition design + ANLI/CheckList as surrogate-free benchmarks."
    - "Statistical power (Prof. Rex) vs. feasibility (Prof. Pax): RESOLVED by aggregating at attack-type level, using reliability filter, and constraining to base-scale models."
    - "Architecture vs. objective confound (Prof. Rex) vs. clean experiment design: RESOLVED by including ELECTRA vs. BERT as within-encoder contrast and pretraining objective as statistical covariate."
    - "Descriptive vs. mechanistic ambition (Dr. Sage vs. Prof. Pax): RESOLVED by targeting levels 3+4 (mechanistic + predictive) while pre-registering fallback to level 2 (replicative) if ΔC fails."
