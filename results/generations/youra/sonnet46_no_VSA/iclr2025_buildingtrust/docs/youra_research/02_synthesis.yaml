hypothesis_draft:
  title: "Architecture-Family Robustness Fingerprinting in NLP: Attention Topology Predicts Perturbation Vulnerability Profiles"
  hypothesis_id: "H-ArchRobustFingerprint-v1"
  core_claim: |
    Scale-matched transformer language models exhibit architecture-family-specific perturbation
    vulnerability signatures — measurable as normalized Δ*-vectors across AdvGLUE/ANLI/CheckList
    attack categories — that replicate within architecture families across surrogate-diverse benchmark
    partitions and enable above-chance architecture-family classification from robustness profiles alone.
    The mechanism is that bidirectional attention (encoder-only) vs. causal attention (decoder-only) vs.
    cross-attention (encoder-decoder) constrains feature geometry differently under distribution shift.
  mechanism: |
    1. Attention topology (bidirectional/causal/cross-attention) shapes token representation aggregation.
    2. Under local perturbation: bidirectional attention globally redistributes to perturbed tokens
       (amplifying noise effect); causal attention processes perturbation locally in sequence.
    3. The redistribution pattern determines feature geometry at classification head under perturbed input.
    4. Systematic feature geometry difference produces characteristic Δ*-vector per family:
       encoder-only → more vulnerable to local lexical noise, potentially less to semantic inversions;
       decoder-only → more robust to lexical noise, potentially more vulnerable to global semantic shifts.
    Testable via attention concentration ΔC mediation analysis.
  predictions:
    - P1: "Architecture × AttackType interaction significant (p < 0.05, bootstrap) after controlling for clean accuracy and objective; replicates in ≥2/3 benchmark partitions"
    - P2: "Δ*-vector classifier achieves ≥60% leave-one-model-out accuracy (95% CI > 33%) in cross-partition evaluation"
    - P3: "mean(ΔC) reduces Architecture × WordLevel coefficient ≥30% (bootstrap CI excluding zero) in mediation test"

variables_summary:
  independent: "Architecture Family (encoder-only / decoder-only / encoder-decoder) × Attack Type (word-level auto / sentence-level auto / human-crafted)"
  dependent_primary: "Normalized vulnerability Δ* = (Acc_clean − Acc_adv) / Acc_clean, aggregated at attack-type level per model"
  controlled: "Model scale (~110-250M), clean accuracy (covariate), pretraining objective (covariate), tokenizer family (covariate), fine-tuning protocol (standardized)"

null_hypothesis:
  h0_statement: |
    There is no significant Architecture × AttackType interaction in normalized vulnerability (Δ*)
    after conditioning on clean accuracy and pretraining objective (p ≥ 0.05, bootstrap).
    Leave-one-model-out architecture classification does not exceed 33% chance baseline.
    Robustness degradation patterns are model-specific noise, not architecture-family properties.
  statistical_test: "Mixed-effects model F-test for Architecture × AttackType interaction (bootstrap); permutation MANOVA for between/within-family variance; binomial test for leave-one-model-out classification"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Architecture-family robustness fingerprinting — Δ*-vector profiles as architectural identity documents, with attention-topology-mediated mechanism and cross-benchmark generalization test"
  differentiation_summary: |
    No existing paper combines:
    (1) Scale-matched architecture-family stratification (encoder/decoder/encoder-decoder as primary IV)
    (2) Multi-dimensional Δ*-vector characterization across 11 attack categories
    (3) Cross-benchmark replication across surrogate-diverse partitions (AdvGLUE/ANLI/CheckList)
    (4) Formal leave-one-model-out classification test
    (5) Mechanistic mediation via attention concentration ΔC
    EMNLP 2023 had (1) partially but only 3 models on GLUE without (2-5).
    TrustLLM had diversity but not (1) as primary design choice.

