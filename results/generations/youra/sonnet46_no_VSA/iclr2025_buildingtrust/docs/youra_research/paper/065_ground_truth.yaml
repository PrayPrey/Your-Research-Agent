# ---------------------------------------------------------------------------
# POWER ANALYSIS
# ---------------------------------------------------------------------------
power_analysis:
  n_current: 9
  n_per_family_current: 3
  power_at_n9: 0.40
  n_required_80pct_power: 15
  n_per_family_required: 5
  alpha: 0.05
  effect_size: 0.293
  claimed_in_paper: "N=9 → ~40% power; N≥15 for 80% power"
  verified: true
  source: "045_validated_hypothesis.md Section 6.1"

# ---------------------------------------------------------------------------
# METHODOLOGY DETAILS
# ---------------------------------------------------------------------------
methodology:
  framework_name: "Δ*-vector fingerprinting"
  delta_star_formula: "(Acc_clean - Acc_adv) / Acc_clean"
  statistical_test: "Permutation MANOVA (1,000 permutations)"
  classification_method: "Leave-one-model-out (LOMO) cosine k=1 nearest-neighbor"
  reliability_filter: "r_SB ≥ 0.7, n ≥ 50"

  models:
    total: 9
    encoder_only: ["bert-base-uncased", "roberta-base", "google/electra-base-discriminator", "albert-base-v2"]
    decoder_only: ["gpt2", "facebook/opt-125m", "facebook/opt-350m"]
    enc_dec: ["t5-base", "facebook/bart-base"]

  hyperparameters:
    optimizer: "AdamW"
    learning_rate:
      encoder_only: 2.0e-5
      decoder_only: 5.0e-5
      enc_dec: 1.0e-4
    batch_size:
      encoder_only: 32
      decoder_only: 16
      enc_dec: 32
    seed: 42
    n_permutations: 1000
    n_bootstrap: 200
    reliability_min_r: 0.7
    reliability_min_n: 50

  pipeline_modules: 7
  pipeline_lines: 1788

