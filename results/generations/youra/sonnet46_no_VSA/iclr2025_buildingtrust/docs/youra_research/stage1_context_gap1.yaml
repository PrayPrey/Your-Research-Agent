gap_id: "gap1"
gap_title: "Lack of Controlled Architecture-Comparative Robustness Study Across Full NLP Benchmark Suite"
gap_description: |
  The closest existing work (EMNLP 2023) compared BERT, GPT-2, and T5 on 8 perturbations on GLUE
  but only 3 models, no AdvGLUE/ANLI/SuperGLUE, and without controlling for model scale or training data.
  TrustLLM (2024) covered 16 LLMs across 6 dimensions but did not isolate architecture family as
  the primary experimental variable. Missing piece: a controlled study grouping models by architecture
  family while controlling for scale, evaluating on the FULL suite (GLUE + AdvGLUE + ANLI + CheckList)
  with identical perturbation sets, testing whether robustness patterns are consistent within architecture family.
