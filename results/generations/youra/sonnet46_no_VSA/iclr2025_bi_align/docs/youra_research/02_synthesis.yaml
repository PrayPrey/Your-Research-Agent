hypothesis_draft:
  title: "Pairwise Partial Spearman Structure of Human→AI Alignment Benchmarks After MMLU Scale Control"
  hypothesis_id: "H-M1-V2"
  core_claim: |
    After controlling for MMLU as a model scale proxy via pingouin.partial_corr(method='spearman'),
    the pairwise partial Spearman rank-correlations of alignment-specific benchmarks
    (TruthfulQA MC2, BBQ accuracy, HarmBench refusal rate) across N≥30 open-weight LLMs
    characterize whether human→AI alignment is unidimensional (scale-driven co-movement)
    or multi-dimensional (independent constructs). The primary gate is a Fisher z difference
    test comparing raw Spearman to partial Spearman for each benchmark pair — a significant
    difference (p < 0.05) demonstrates that MMLU scale control changes the correlation structure.
  mechanism: |
    MMLU captures general model scale/capability (R²=0.32 confirmed vs AlpacaEval-LC). Raw
    cross-model benchmark correlations are inflated by scale confound (confirmed: raw
    rho=+0.661 for TruthfulQA×helpfulness). After partial Spearman removes the MMLU
    component from both benchmarks, the residual correlation reflects alignment-specific
    training choices. If partial_rho ≈ 0 for factuality×bias, these are independent
    alignment constructs. If partial_rho > 0, they co-move in scale-free space (coherent
    alignment). If partial_rho < 0, scale masks a genuine alignment tradeoff.
  predictions:
    - P1: "Fisher z difference test (raw vs partial Spearman) significant (p<0.05) — MMLU changes correlation structure"
    - P2: "Partial Spearman rho(TruthfulQA,BBQ|MMLU) characterizes one of: independent (<0.20), coherent (>0.40), or tradeoff (<-0.20)"
    - P3: "RLHF ΔBBQ sign test significant (Tier 3 OPTIONAL) — RLHF has systematic effect on social bias"

variables_summary:
  independent: "MMLU score (scale covariate) — continuous, 0-100, from LLM LB v1 CSV"
  dependent_primary: "Partial Spearman rho(TruthfulQA MC2, BBQ accuracy | MMLU) + Fisher z difference test"
  controlled: "Model family clustering (BCa bootstrap), open-weight filter, temporal cohort (LLM LB v1 era)"

null_hypothesis:
  h0_statement: |
    H₀: Raw Spearman rho = Partial Spearman rho for TruthfulQA × BBQ pair
    (Fisher z difference test NOT significant, p ≥ 0.05). MMLU scale control does not
    change the pairwise correlation structure of alignment-specific benchmarks.
    [Note: Failing to reject H₀ is also publishable — it means alignment co-movement
    is not scale-confounded, i.e., alignment is a coherent signal independent of capability.]
  statistical_test: "Fisher z difference test (two-tailed) + BCa bootstrap CI comparison"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: >
    Fisher z difference test (raw vs partial Spearman) applied to alignment-specific benchmark
    pairs for the first time. Extends clawrxiv:2603.00394 from general benchmark PCA to
    alignment-specific pairwise partial Spearman structure with directional CI.
  differentiation_summary: |
    Prior work (clawrxiv:2603.00394, BenchScope) characterizes general benchmark redundancy
    or dimensionality. This study is specifically about the alignment construct space
    (factuality, bias, safety as distinct sub-dimensions) and whether they are coherent
    or independent in the scale-free representation. No prior paper applies Fisher z
    difference test to alignment benchmark pairs.

