measurement_plan:
  data_collection:
    - source: "fboulnois/llm-leaderboard-csv GitHub — download llm.csv; extract model_name, TruthfulQA_MC2, MMLU columns"
    - source: "lighteval/bbq_helm HuggingFace — load_dataset('lighteval/bbq_helm'); group by model; mean BBQ accuracy"
    - source: "HarmBench arXiv:2402.04249 Table 2 — hardcode 33 model names + ASR values as Python dict"
  procedure:
    - step: "Pre-flight: requests.head() for each URL; validate download; count N per source"
    - step: "Fuzzy join: rapidfuzz WRatio threshold=75 for LLM LB v1 × BBQ model names"
    - step: "Pre-flight gate: assert N≥30 complete rows (TruthfulQA+BBQ+MMLU); if fail STOP"
    - step: "Check MMLU R² with TruthfulQA and BBQ in joint dataset (must be > 0.05)"
    - step: "Compute raw Spearman: scipy.stats.spearmanr(TruthfulQA, BBQ)"
    - step: "Compute partial Spearman: pg.partial_corr(df, x='TruthfulQA_MC2', y='BBQ_accuracy', covar=['MMLU'], method='spearman')"
    - step: "Fisher z difference test: raw_rho vs partial_rho; two-tailed p-value"
    - step: "BCa bootstrap CI (N_bootstrap=5000, clustered by model family) for both raw and partial rho"
    - step: "Family-weighted Fisher z as robustness check"
    - step: "Tier 2 (if N≥20 HarmBench match): repeat partial Spearman for TruthfulQA×HarmBench and BBQ×HarmBench"
    - step: "Tier 3 (OPTIONAL): sign test for ΔBBQ on 321 base/chat pairs"
  success_criteria:
    - "N≥30 complete rows (MUST_WORK gate passes)"
    - "Fisher z difference test computed and reported (regardless of p-value direction)"
    - "Partial Spearman rho + BCa CI for TruthfulQA×BBQ pair (primary result)"
    - "Interpretation assigned to one of 3 pre-specified scenarios (independent/coherent/tradeoff)"

