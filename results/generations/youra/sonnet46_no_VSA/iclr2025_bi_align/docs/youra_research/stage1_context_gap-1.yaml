gap_id: "gap-1"
gap_title: "Absence of scale-controlled pairwise correlation structure for Human→AI alignment benchmarks"
gap_description: >
  No existing study computes the pairwise partial Spearman rank-correlation matrix of
  {TruthfulQA MC2, BBQ accuracy, HarmBench/BeaverTails safety rate, HELM ECE} after
  controlling for MMLU as a scale proxy, across N≥40 open-weight LLMs. The clawrxiv:2603.00394
  precedent covers 6 general benchmarks (TruthfulQA = orthogonal PC2, 23.4% variance) but
  does NOT include BBQ bias or HarmBench/BeaverTails safety in the correlation matrix.
  This gap determines whether Human→AI alignment is unidimensional (scale-driven) or
  genuinely multi-dimensional (independent constructs requiring separate optimization).
