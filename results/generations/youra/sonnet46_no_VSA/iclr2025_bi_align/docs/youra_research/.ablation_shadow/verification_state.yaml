main_hypothesis:
  id: H-M1-V2
  title: Pairwise Partial Spearman Structure of Alignment Benchmarks After MMLU Scale Control
  statement: Under N≥30 open-weight LLMs scored on {TruthfulQA MC2, BBQ accuracy, MMLU}, if MMLU is controlled via pingouin.partial_corr(method='spearman'),
    then Fisher z difference test (raw vs partial Spearman rho for TruthfulQA × BBQ) yields p < 0.05 OR non-overlapping BCa
    95% CIs, because MMLU scale variation (R²=0.32 confirmed) inflates alignment benchmark co-movement.
  defined_in: 03_refinement.yaml
