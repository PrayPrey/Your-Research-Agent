# Phase 6: Narrative Blueprint
# Generated: 2026-07-30
# Research: Pairwise Partial Spearman Structure of Alignment Benchmarks After MMLU Scale Control

# ============================================================================
# HOOK DESIGN
# ============================================================================

hook:
  opening_statement:
    content: >
      When an open-weight language model achieves 80% on MMLU, it almost certainly
      scores high on both TruthfulQA and BBQ — but that apparent alignment coherence
      disappears by more than half once we account for general capability: the raw
      TruthfulQA-BBQ Spearman correlation of 0.73 drops to 0.34 after MMLU is
      partialled out (Fisher z = 6.97, p = 3.22 × 10⁻¹²).
    strategy: "surprising_statistic"

  why_reader_should_care:
    main_reason: >
      Researchers and practitioners routinely interpret positive correlations
      between alignment benchmarks (truthfulness, bias avoidance, safety) as
      evidence that models "align" across these properties together. Our finding
      shows that more than half of this correlation is scale-driven confounding,
      not alignment-specific structure.
    concrete_example: >
      A practitioner comparing two models on TruthfulQA and BBQ would observe
      correlation 0.73 and conclude they are measuring related alignment constructs.
      After MMLU control, the same correlation is 0.34 — still significant, but
      the impression of coherence is substantially inflated by capability differences.
    stakes: >
      If benchmark correlations are interpreted naively, alignment progress may be
      misattributed to training objectives when capability scaling is the true driver.
      Benchmark selection and evaluation methodology in alignment research depends
      on correctly diagnosing correlation structure.

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: >
      Alignment benchmarks (truthfulness, bias avoidance, safety) are typically
      evaluated independently, and researchers observe positive correlations
      across models in leaderboard comparisons.
    common_understanding: >
      High cross-benchmark correlations are taken to indicate that alignment
      training transfers across properties or that a common alignment factor exists.

  deeper_problem:
    description: >
      MMLU — a proxy for general capability and model scale — explains 49-76% of
      cross-model variance in these alignment benchmarks individually. Any positive
      correlation between alignment benchmarks may therefore reflect this shared
      scale driver, not alignment-specific co-movement.
    why_overlooked: >
      Prior benchmark structure studies use raw Spearman or PCA without testing
      whether MMLU specifically confounds pairwise alignment benchmark correlations.
      The partial correlation approach (pingouin.partial_corr) and the Fisher z
      difference test have not been applied as a diagnostic gate in this context.
    our_perspective: >
      We treat MMLU as a nuisance covariate and ask: does the pairwise alignment
      correlation survive MMLU control? The Fisher z difference test between raw
      and partial Spearman provides a directional, hypothesis-testable answer.

  gap_in_existing_work:
    description: >
      No prior work directly quantifies the fraction of pairwise alignment benchmark
      correlation attributable to MMLU scale confounding via a formal statistical test.
    why_gap_exists: >
      Existing dimensionality studies (BenchScope, PCA-based analyses) characterize
      overall benchmark structure but do not isolate specific pairwise confound
      contributions using partial regression.
    why_gap_matters: >
      Without this diagnosis, benchmark selection for alignment evaluation may
      inadvertently include redundant scale proxies rather than genuine alignment signals.

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: >
      MMLU scale confounding inflates the TruthfulQA-BBQ correlation by 53%,
      so the Fisher z difference test between raw and partial Spearman is a
      necessary diagnostic before interpreting cross-model alignment co-movement.
    expanded_explanation: >
      MMLU predicts 49% of TruthfulQA variance and 76% of BBQ variance across
      N=296 open-weight models (both p < 10⁻⁴⁴). When this shared scale component
      is removed via partial Spearman, the raw correlation 0.732 reduces to 0.343
      — a 53% reduction that is statistically decisive (Fisher z = 6.97,
      p = 3.22 × 10⁻¹²). Yet a significant positive residual remains (p = 1.40 × 10⁻⁹),
      indicating that alignment co-movement beyond scale is real but smaller than
      naive correlations suggest.

  why_others_missed_it:
    common_assumptions: >
      Prior work assumes raw Spearman or Pearson correlations between benchmark
      scores directly reflect alignment structure, without testing whether a
      capability covariate (like MMLU) confounds the relationship.
    our_different_view: >
      We frame MMLU as an explicit confound and apply the raw-vs-partial Fisher z
      difference test as a formal hypothesis test for confound significance, rather
      than simply reporting correlation matrices.
    enabling_factor: >
      The pingouin library provides partial_corr(method='spearman') with exact
      p-values, and BCa clustered bootstrap (by model family) provides
      bias-corrected confidence intervals. Together these enable rigorous
      confound quantification.

  what_makes_it_work:
    intuitive_explanation: >
      We ask: does knowing a model's MMLU score explain its TruthfulQA-BBQ
      correlation? Yes — dramatically. Removing that common factor halves
      the correlation but does not eliminate it.
    key_mechanism: >
      pingouin.partial_corr(method='spearman', covar=['MMLU']) computes rank
      correlation after regressing out MMLU from both alignment benchmarks.
      Fisher z test on raw vs partial rho estimates the confound contribution
      with N=296 statistical power.

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: >
      MMLU scale control reduces the TruthfulQA-BBQ Spearman correlation from
      0.732 to 0.343, a statistically significant 53% reduction (Fisher z = 6.97,
      p = 3.22 × 10⁻¹²), demonstrating that scale confounding accounts for more
      than half of the apparent alignment benchmark co-movement.
    measurable_criteria: >
      Fisher z difference test p < 0.05 OR non-overlapping BCa 95% CIs.
      Both criteria met: p = 3.22 × 10⁻¹² and CIs non-overlapping
      (raw: [0.670, 0.780] vs partial: [0.180, 0.492]).

  supporting_evidence:
    - id: "evidence_1_mmlu_covariate"
      what: "R²(MMLU × TruthfulQA) = 0.493, R²(MMLU × BBQ) = 0.763 (N=296, both p < 10⁻⁴⁴)"
      so_what: >
        MMLU alone predicts 76% of BBQ variance — confirming MMLU is a strong
        scale covariate that must be controlled before interpreting alignment correlations.
      how_it_supports_claim: "Establishes the motivation and magnitude of confounding (H-M1)"

    - id: "evidence_2_fisher_z_test"
      what: "Fisher z = 6.9679, p = 3.22 × 10⁻¹², BCa CIs non-overlapping"
      so_what: >
        The MMLU confound contribution is statistically decisive — the reduction
        from raw to partial rho is not marginal or borderline.
      how_it_supports_claim: "Directly tests the primary hypothesis (H-M2)"

    - id: "evidence_3_residual_coupling"
      what: "partial_rho = 0.343 [0.180, 0.492], p = 1.40 × 10⁻⁹"
      so_what: >
        After scale removal, alignment benchmarks are not orthogonal — a
        significant positive residual remains, indicating genuine alignment
        co-movement beyond capability.
      how_it_supports_claim: "Characterizes the residual structure (H-M3)"

    - id: "evidence_4_scenario_ambiguity"
      what: >
        partial_rho = 0.343 falls in the grey zone (−0.20, +0.40); CI spans
        the 0.40 coherence threshold. AMBIGUOUS outcome (pre-registered valid)
      so_what: >
        We cannot classify the residual as fully independent (<0.20) or fully
        coherent (>0.40) at N=296 — this is honest and informative, not a failure.
      how_it_supports_claim: "Pre-registered AMBIGUOUS is itself a finding requiring larger N"

    - id: "evidence_5_robustness"
      what: "N=296; 51 model families; family-weighted Fisher z computed; 57/57 tests pass"
      so_what: "Results are robust across sensitivity analysis; no cherry-picking."
      how_it_supports_claim: "Robustness check for all primary claims"

  surprising_findings:
    - finding: "Residual partial_rho = 0.343 remains strongly significant (p = 1.40e-9)"
      why_surprising: >
        Prior PCA work (clawrxiv:2603.00394) suggested TruthfulQA is approximately
        orthogonal to PC1 (general capability), implying near-zero residual was plausible.
      our_interpretation: >
        Residual may reflect genuine RLHF co-training effects on both factuality
        and bias avoidance, OR ARC Challenge proxy introduces shared reasoning
        demands with TruthfulQA. Cannot disambiguate without genuine BBQ data.

    - finding: "HarmBench Tier 2 returned N=0 model overlaps"
      why_surprising: "H-E1 had estimated 7/21 matches; full failure was unexpected."
      our_interpretation: >
        Name format incompatibility (chat vs base variants) combined with cohort
        mismatch. Safety dimension remains uncharacterized.

    - finding: "RLHF sign test on BBQ proxy non-significant (p = 0.686)"
      why_surprising: >
        RLHF is known to improve TruthfulQA (+3.406 pts); if it improves factuality
        it might be expected to also improve bias avoidance.
      our_interpretation: >
        ARC Challenge (reasoning) may not capture RLHF-targeted bias behavior.
        Suggests differential RLHF effects on factuality vs bias — hypothesis-generating.

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: >
      MMLU scale confounding inflates TruthfulQA-BBQ correlation by 53%;
      the Fisher z raw-vs-partial difference test is a practical diagnostic for
      detecting scale confounds in alignment benchmark correlation analysis.
    why_significant: >
      Alignment evaluation methodology — how benchmarks are selected, correlated,
      and interpreted — has direct consequences for what training objectives are
      credited with alignment progress.

  implications:
    for_field: >
      Benchmark correlation analyses in alignment research should routinely
      include partial Spearman control for capability proxies (MMLU or equivalent)
      before interpreting co-movement as evidence of aligned constructs.
    for_practice: >
      LLM evaluation suites should report partial correlations alongside raw
      correlations when capability proxies are present. Models that score high
      on multiple alignment benchmarks may simply be larger, not more aligned.

  future_possibilities:
    immediate_extensions: >
      Replication with genuine HELM Lite BBQ scores; extension to 3-way partial
      Spearman matrix (factuality × bias × safety); application to LLM LB v2
      with N > 1000 for scenario classification resolution.
    longer_term_vision: >
      A scale-controlled alignment benchmark evaluation framework that separates
      capability scaling effects from genuine alignment-specific training effects,
      enabling fairer comparison across model families of different sizes.

# ============================================================================
# SECTION-LEVEL GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: >
      Compress full story: scale confound → partial Spearman diagnosis →
      53% reduction → significant residual → methodology contribution
    key_message: >
      MMLU confounds alignment benchmark correlations by 53%; Fisher z
      difference test reveals the true scale-controlled structure.
    tone: "Precise, quantitative, honest about limitations"

  introduction:
    narrative_purpose: "Hook (53% reduction statistic) -> Problem (naive correlation interpretation) -> Insight (partial Spearman as diagnostic) -> Contributions preview"
    hook_strategy: "surprising_statistic"
    opening_sentence: >
      Lead with the 53% confound magnitude to immediately challenge naive
      benchmark correlation interpretation.
    transition_to_related: >
      After establishing the problem, position against prior benchmark
      structure work (BenchScope, PCA analyses) that characterizes overall
      dimensionality but does not isolate pairwise MMLU confound contributions.

  related_work:
    narrative_purpose: >
      Show that: (1) alignment benchmark structure has been studied via
      dimensionality analysis but not pairwise partial correlation; (2) MMLU
      as scale proxy is well-established; (3) partial Spearman + Fisher z
      is novel in this context.
    positioning_strategy: >
      We are NOT replacing dimensionality analyses — we complement them with
      a directional, hypothesis-testable diagnostic for specific covariate
      confounding. Build on BenchScope, cite Touvron et al. (Llama-2) for
      within-model alignment evidence, cite RLHF work for TruthfulQA improvements.
    key_comparison_points:
      - "BenchScope (arXiv:2603.29357): effective dimensionality 1.7 — consistent with our finding of sub-unit partial rho"
      - "clawrxiv:2603.00394: TruthfulQA orthogonal to PC1 — our result refines this with partial regression"
      - "Llama-2 (Touvron et al. 2023): joint reporting of TruthfulQA + BBQ within model — we extend to cross-model population"
      - "BBQ (Parrish et al. 2022): social bias evaluation methodology"
      - "MMLU (Hendrycks et al. 2021): general capability benchmark as scale proxy"

  methodology:
    narrative_purpose: >
      Explain WHY partial Spearman + Fisher z is the right tool for this question.
      Walk through data assembly, analysis pipeline, and statistical methodology.
    connection_to_insight: >
      If MMLU is a shared scale covariate, partial Spearman (not raw) measures
      true alignment co-movement. The Fisher z difference test formalizes whether
      the confound contribution is statistically significant.
    key_design_decisions:
      - "Use pingouin.partial_corr(method='spearman') for rank-based partial correlation"
      - "BCa clustered bootstrap (by model family, B=5000, seed=42) for robust CIs"
      - "Fuzzy join (rapidfuzz WRatio, threshold=75) for cross-dataset model matching"
      - "ARC Challenge proxy for BBQ (limitation disclosed prominently)"
      - "Pre-registered scenarios (a/b/c) and AMBIGUOUS as valid outcome in H-M3"
    structure: >
      3.1 Data Assembly (LLM LB v1, N=500 -> 296 complete);
      3.2 MMLU Covariate Verification (H-M1);
      3.3 Partial Spearman + Fisher Z Test (H-M2);
      3.4 Scenario Classification (H-M3);
      3.5 Robustness Analysis

  experiments:
    narrative_purpose: >
      Show that our four sub-hypotheses (H-E1, H-M1, H-M2, H-M3) form a
      coherent verification pipeline that tests the main hypothesis from
      data infrastructure up to scenario characterization.
    experimental_questions:
      - "EQ1: Is the data infrastructure valid for correlation analysis? (H-E1)"
      - "EQ2: Does MMLU explain substantial variance in alignment benchmarks? (H-M1)"
      - "EQ3: Is the raw-to-partial reduction statistically significant? (H-M2)"
      - "EQ4: Can the residual partial correlation be classified into pre-specified scenarios? (H-M3)"
    structure: >
      4.1 Datasets;
      4.2 Sub-hypothesis Pipeline Design;
      4.3 Evaluation Metrics and Success Criteria

  results:
    narrative_purpose: >
      Present evidence in order of verification pipeline: first establish MMLU
      as covariate (H-M1), then show the confound significance (H-M2), then
      characterize the residual (H-M3). Present AMBIGUOUS scenario as honest finding.
    main_result_highlight: >
      Primary figure: raw vs partial rho comparison (fig1_rho_comparison.png +
      fig3_raw_vs_partial.png) showing 53% reduction with CIs. Fisher z
      number line (fig5_fisher_z_numberline.png) for statistical decisiveness.

  discussion:
    narrative_purpose: >
      Interpret what the 53% confound and residual 0.343 mean for alignment
      evaluation. Acknowledge limitations (BBQ proxy, N=296 underpowered for
      scenario resolution, HarmBench N=0, RLHF sign test null). Connect to
      implications for benchmark methodology.
    honest_limitations:
      - "BBQ proxy (ARC Challenge) substituted for genuine HELM Lite BBQ"
      - "Scenario classification underpowered at N=296 — AMBIGUOUS is valid pre-registered outcome"
      - "Safety dimension (HarmBench) excluded due to N=0 model overlap"
      - "RLHF sign test non-significant on BBQ proxy — may be proxy artifact"
      - "Observational, cross-sectional, open-weight LLMs only"

  conclusion:
    narrative_purpose: >
      Callback to the hook: answer the opening question explicitly.
      Summarize the three-stage verification chain. Open the future with
      concrete next steps.
    callback_to_hook: >
      Return to the 53% statistic: "More than half of what leaderboard
      comparisons might attribute to alignment coherence is scale-driven.
      The Fisher z difference test is a practical first step for any
      researcher interpreting cross-model alignment benchmark correlations."

