    supporting_evidence: "Prior runs confirmed family extraction by string prefix splitting. 39 families identified in h-m1 dataset."
    consequence_if_violated: "Use independent bootstrap (not clustered); wider CIs; less conservative but still valid"

  - id: "A5"
