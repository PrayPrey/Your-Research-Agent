    - name: "Fisher z difference: raw rho vs partial rho (TruthfulQA × BBQ)"
      type: "continuous"
      operationalization: "Fisher z transformation of (raw_rho - partial_rho); two-tailed p-value; secondary output"
      primary: false

    - name: "Partial Spearman rho(TruthfulQA MC2, HarmBench refusal rate | MMLU)"
