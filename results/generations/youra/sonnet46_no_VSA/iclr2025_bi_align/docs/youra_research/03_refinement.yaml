              + HuggingFace datasets lighteval/bbq_helm (BBQ accuracy)
      Tier 2: HarmBench Table 2 hardcoded from arXiv:2402.04249 (33 models, ASR values)
      Tier 3: Existing h-m1 pairs dataset (321 base/chat pairs, TruthfulQA confirmed)
    hypothesis_fit: >
      Tier 1 provides TruthfulQA MC2 + MMLU for 300+ models (LLM LB v1) and BBQ accuracy
      (lighteval/bbq_helm HuggingFace) for alignment-specific analysis. Tier 2 adds safety
      dimension (HarmBench) via paper fallback — avoids infrastructure inaccessibility
      that failed h-e1. Tier 3 reuses confirmed 321-pair dataset.
  model:
    name: "Population of open-weight LLMs (not a training model)"
    type: "observational study — models are subjects, not trainers"
    source: "Open LLM Leaderboard v1 + BBQ + HarmBench cross-section"
    hypothesis_fit: "Observational cross-model study; no model training required"
  baselines:
    - name: "Raw Spearman correlation (uncontrolled)"
      method: "scipy.stats.spearmanr(TruthfulQA, BBQ) — no MMLU control"
    - name: "clawrxiv:2603.00394 precedent"
      method: "PCA-based orthogonality analysis for 6 general benchmarks, 40 models"
    - name: "BenchScope (arXiv:2603.29357)"
      method: "Effective Dimensionality diagnostic; Open LLM LB ED=1.7"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: >
    First study to (1) apply Fisher z difference test comparing raw vs MMLU-partial Spearman
    for alignment-specific benchmark pairs, (2) characterize the partial correlation structure
    of {TruthfulQA MC2, BBQ accuracy, HarmBench safety rate} as a set after scale control,
    and (3) demonstrate whether MMLU confounds alignment benchmark co-movement empirically.
  key_innovation: >
    The Fisher z difference test (raw vs partial Spearman) as the primary statistical gate.
    This moves beyond "what is the partial structure" to "does scale control CHANGE the structure" —
    a more precise and scientifically actionable question. clawrxiv:2603.00394 and BenchScope
    do not apply this test to alignment-specific benchmark pairs.
  differentiation:
    - prior_work: "clawrxiv:2603.00394 — 6 general benchmarks, PCA, TruthfulQA as one of many"
      difference: >
        We focus on the alignment-specific subset (TruthfulQA MC2, BBQ, HarmBench), apply
        pairwise partial Spearman (not PCA), and add Fisher z difference test (raw vs partial).
        We also extend to the RLHF training dimension (Tier 3).
    - prior_work: "BenchScope (arXiv:2603.29357) — Effective Dimensionality diagnostic"
      difference: >
        ED is a scalar summary; we compute pairwise partial correlations with directional
        interpretation and CI. ED=1.7 tells you ~2 axes exist; our study characterizes WHICH
        pairs are coupled and which are independent.
    - prior_work: "Llama-2 (Touvron et al.) — within-model TruthfulQA+BBQ+safety reported"
      difference: >
        They report within-model absolute scores; we analyze cross-model partial correlation
        structure in the scale-free space. Different question, different analysis.

