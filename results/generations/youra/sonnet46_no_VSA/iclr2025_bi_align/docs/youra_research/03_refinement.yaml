    consequence_if_violated: "Tier 2 fails (N<20); complete study with Tier 1 only (TruthfulQA×BBQ pairwise); report HarmBench data availability limitation"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Open-weight LLMs with publicly available scores on TruthfulQA MC2, BBQ accuracy, and MMLU
    from Open LLM Leaderboard v1 (fboulnois/llm-leaderboard-csv) and lighteval/bbq_helm
    (HuggingFace), approximately covering the 2022-2024 era of open-weight models.
    Analysis applies to cross-model population-level correlation structure, not within-model
    benchmark dynamics.
  does_not_apply_to: |
    Proprietary API models (GPT-4, Claude, Gemini Pro, etc.) — excluded by design.
    Open LLM Leaderboard v2 models (scope restricted to v1 for data consistency).
    Within-model benchmark dynamics (how a single model's scores change over training).
    Individual benchmark score prediction (this is a structural study, not a predictive one).
    BeaverTails safety data — excluded (preference pairs, not model eval scores; h-e1 lesson).
    AlpacaEval-LC as alignment metric (proprietary model contamination; h-e2 lesson).
  known_limitations: |
    LLM LB v1 temporal cutoff excludes post-2023 models. HarmBench Tier 2 N may be too small
    for reliable partial Spearman (N<20 would leave Tier 2 underpowered). Family-weighted Fisher z
    required because Llama-family dominance may inflate effective N. Pre-flight URL test is
    MANDATORY but has not been executed (Phase 3 responsibility). Analysis is observational
    (not causal) — partial Spearman removes statistical confound but not necessarily all
    confounding factors.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: >
      Fisher z difference test between raw Spearman rho(TruthfulQA, BBQ) and partial Spearman
      rho(TruthfulQA, BBQ | MMLU) will be statistically significant (two-tailed p < 0.05) OR
      the BCa 95% CIs will not overlap, indicating that MMLU scale control changes the
      correlation structure of alignment benchmarks.
    test_method: >
      (1) Compute raw_rho = scipy.stats.spearmanr(df['TruthfulQA_MC2'], df['BBQ_accuracy']).
      (2) Compute partial_rho = pg.partial_corr(df, x='TruthfulQA_MC2', y='BBQ_accuracy',
      covar=['MMLU'], method='spearman')['r'].
      (3) Fisher z difference: z = (arctanh(raw_rho) - arctanh(partial_rho)) / sqrt(1/(N-3) + 1/(N-3)).
      (4) Two-tailed p-value from normal distribution.
      (5) BCa bootstrap CI (N_bootstrap=5000, clustered by model family) for both raw and partial rho.
    success_criterion: >
      p < 0.05 (Fisher z difference test) OR non-overlapping BCa 95% CIs for raw vs partial rho.
      Either outcome is pre-specified as a valid finding.
    falsification: >
      p ≥ 0.05 AND overlapping BCa 95% CIs → MMLU does not confound TruthfulQA-BBQ relationship.
      Still publishable as "scale does not drive alignment benchmark co-movement."

  - id: "P2"
    primary: false
    statement: >
      The partial Spearman rho(TruthfulQA MC2, BBQ accuracy | MMLU) will characterize
      one of: (a) |partial_rho| < 0.20 (independent constructs), (b) partial_rho > 0.40
      (scale-free coherence), or (c) partial_rho < -0.20 (scale-masked tradeoff).
      Each outcome has a pre-specified scientific interpretation.
    test_method: >
      Direct output of pg.partial_corr(method='spearman'). BCa CI determines which scenario
      (a), (b), or (c) is supported. Family-weighted version as robustness check.
    success_criterion: >
      Any of (a), (b), (c) outcomes is valid. Report which scenario with CI and interpretation.
    falsification: >
      partial_rho CI overlaps 0 AND overlaps 0.40 simultaneously → ambiguous (underpowered).
      Report as "N insufficient for reliable characterization" if this occurs.

  - id: "P3"
    primary: false
    statement: >
      For base/chat model pairs (Tier 3, OPTIONAL): sign test of ΔBBQ accuracy (chat − base)
      will show proportion positive significantly different from 0.5 (BCa CI), revealing
      whether RLHF alignment training has a uniform or mixed effect on social bias.
    test_method: >
      For 321 base/chat pairs with BBQ scores: compute delta = chat_BBQ - base_BBQ.
      Sign test: scipy.stats.binomtest(n_positive, n_total, p=0.5, alternative='two-sided').
      BCa bootstrap CI (1000 iterations, same infrastructure as h-m1 confirmed).
    success_criterion: >
      binomtest p < 0.05 AND BCa 95% CI excludes 0.5 → RLHF has systematic effect on BBQ.
    falsification: >
      binomtest p ≥ 0.05 OR BCa 95% CI includes 0.5 → RLHF effect on BBQ is not reliably
      in one direction (null or heterogeneous). Tier 3 is OPTIONAL so this does not fail the study.

