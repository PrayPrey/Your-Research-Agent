# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-M1-V2"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under a population of N≥30 open-weight LLMs scored on {TruthfulQA MC2, BBQ accuracy,
    MMLU} from Open LLM Leaderboard v1 and lighteval/bbq_helm (HuggingFace), if MMLU is
    controlled via pingouin.partial_corr(method='spearman'), then the Fisher z difference
    test between raw Spearman rho and partial Spearman rho for the TruthfulQA × BBQ pair
    will yield a statistically detectable change (two-tailed p < 0.05 OR non-overlap of
    BCa 95% CIs), because MMLU captures general scale variation (R²=0.32 confirmed) that
    inflates the apparent co-movement of alignment benchmarks, and removing it reveals the
    true alignment-specific correlation structure (which may be near-zero, maintained, or
    sign-reversed relative to the raw correlation).
  alternative_hypothesis_h0: |
    H₀ (null): Raw Spearman rho = Partial Spearman rho (Fisher z difference test NOT
    significant, p ≥ 0.05) — MMLU scale control does not change the pairwise correlation
    structure of alignment benchmarks. Alignment co-movement is either purely scale-driven
    (no residual) or purely alignment-driven (scale does not contribute). Both outcomes
    of rejecting vs. failing-to-reject H₀ yield publishable characterizations.

