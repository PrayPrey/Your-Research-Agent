# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Model scale (proxied by MMLU) inflates raw cross-model correlations between alignment benchmarks because larger models perform better on ALL benchmarks simultaneously"
      evidence: "Confirmed: raw rho(AlpacaEval-LC, TruthfulQA) = +0.661 (sh2-corr). MMLU R²=0.32 (h-e1). General capability drives all metrics upward."
      falsifier: "If MMLU R² with TruthfulQA or BBQ is near 0 (R² < 0.05) in the joint dataset, MMLU is not a valid scale covariate — Tier 1 pre-flight check"

    - step: 2
      description: "After removing the MMLU scale component via partial Spearman, residual variation reflects alignment-specific training differences (RLHF objective, safety training type, fine-tuning data) rather than general capability"
      evidence: "pingouin.partial_corr inverse covariance method removes linear MMLU contribution from both benchmarks before computing rank correlation. Prior run confirmed API works correctly."
      falsifier: "If partial_rho = raw_rho (Fisher z difference test NOT significant), MMLU does not confound the benchmark relationship — MMLU and alignment variation are orthogonal"

    - step: 3
      description: "The residual partial Spearman structure characterizes whether factuality (TruthfulQA), bias (BBQ), and safety (HarmBench) are aligned (positive partial_rho) or independent (near-zero partial_rho) constructs in the scale-free space"
      evidence: "clawrxiv:2603.00394 finds TruthfulQA = orthogonal PC2 (23.4% variance). Extending to BBQ+HarmBench: independent constructs → multi-dimensional alignment; co-moving → unidimensional."
      falsifier: "If N < 30 after pre-flight join, analysis is underpowered and Tier 1 MUST_WORK gate fails"

  key_tension: >
    Whether MMLU is a valid scale covariate for alignment benchmarks (established for AlpacaEval-LC,
    but the alignment benchmark population differs from preference benchmarks). The pre-flight
    R² check must confirm MMLU correlates with TruthfulQA and BBQ in the joint dataset.
  evidence_summary: |
    Scale confound confirmed empirically (raw rho=+0.661, MMLU R²=0.32). Partial Spearman
    method confirmed (pingouin API verified). RLHF effects on TruthfulQA confirmed (+3.406).
    Prior literature (clawrxiv:2603.00394) provides PC2 anchor for novelty claim.

