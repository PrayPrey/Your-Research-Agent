    supporting_evidence: "HELM format uses HuggingFace model names (e.g. 'meta-llama/Llama-2-7b-hf'); LLM LB v1 uses similar format. rapidfuzz WRatio threshold=75 worked in prior runs."
    consequence_if_violated: "N < 30 after join; Tier 1 MUST_WORK gate fails; fallback to HELM Lite v1.9.0 directly"

