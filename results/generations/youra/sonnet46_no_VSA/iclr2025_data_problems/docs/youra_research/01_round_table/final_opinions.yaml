final_opinions:
  perspective_novelty:
    agent: "Dr. Nova"
    icon: "🔭"
    assessment: |
      STRONG. The hypothesis identifies a genuine and previously unmeasured gap: practitioner
      reuse of language-aware perplexity scores (CCNet/RedPajama-V2) with language-agnostic
      thresholds induces cross-language selection disparity. The four-condition design (including
      iso-retention z-score as disambiguation arm) provides novel mechanistic decomposition of
      whether the bias is scale-driven or shape-driven — an insight that extends beyond CCNet
      to any language-specific quality score reused out of context. The connection to Turki et al.
      [2026] classifier-based retention tuning provides the natural prior that makes this
      finding generalizable. Core novelty: first separation of language-aware SCORING from
      language-aware THRESHOLDING in perplexity-based multilingual corpus curation.
    key_points:
      - "First direct measurement of ΔCramér's V under global vs. per-language perplexity thresholding"
      - "Iso-retention z-score arm enables mechanistic decomposition (scale vs. shape) — novel diagnostic"
      - "Generalizable principle: language-aware scores + language-agnostic thresholds → retention disparity"
      - "CCNet cutoff.csv artifact (global bucket boundaries on per-language scores) is the specific target"

  perspective_falsifiability:
    agent: "Prof. Vera"
    icon: "🔬"
    assessment: |
      STRONG. Both success AND failure criteria are pre-registered with quantitative bounds.
      SUCCESS: ΔV ≥ 0.10 for ≥3/5 k AND max–min gap reduction ≥15pp at k=30 AND bootstrap CI
      excludes 0. FAILURE: gap remains >10pp AND V ≥ 0.20. Permutation control validates metric
      stability. Length-stratified Cramér's V (Mantel-Haenszel) guards against doc-length confound.
      CCNet-tercile negative control provides the strongest internal validity check — per-language
      terciles should yield V ≈ 0, directly confirming the artifact hypothesis. The iso-retention
      z-score condition enables mechanistic falsification: if z-score ≈ percentile in ΔV, shape
      effect is absent. Three independent falsification pathways are available: statistical (CI),
      operational (15pp gap), and mechanistic (z-score vs. percentile comparison).
    key_points:
      - "Pre-registered success (V ≤ 0.10, ΔV ≥ 0.10, ≥15pp gap) and failure (V ≥ 0.20, gap >10pp) bounds"
      - "Permutation control (randomized language labels → V → 0) validates metric measures true dependence"
      - "CCNet-tercile negative control (per-language tercile → V ≈ 0) directly tests artifact hypothesis"
      - "Iso-retention z-score: falsifies shape-effect claim if |ΔV_pct - ΔV_zscore| ≤ 0.02"
      - "Length-stratified Cramér's V (Mantel-Haenszel) closes doc-length confound"

  perspective_significance:
    agent: "Dr. Sage"
    icon: "🎯"
    assessment: |
      STRONG. RedPajama-V2 is explicitly designed for practitioner filtering using its 46 quality
      signals, and ccnet_perplexity is the most widely understood. If global thresholding on these
      scores induces V = 0.29–0.41 disparity (4x the desired ≤0.10), practitioners are
      systematically misrepresenting multilingual corpus composition — affecting what LLMs trained
      on filtered RedPajama-V2 can learn about different language communities. The 90th-percentile
      PPL quality proxy and practical ≥15pp gap criterion translate the finding into actionable
      guidance. The generalizability claim — language-aware scores reused with language-agnostic
      thresholds → retention disparity — extends to classifier logits, toxicity scores, and any
      language-specific quality metric, opening a new research direction for corpus curation norms.
      Target venue: DATA-FM Workshop @ ICLR (confirmed relevant — Turki et al. 2026 published there).
    key_points:
      - "Real-world scenario: practitioners routinely reuse exported RedPajama-V2 quality signals — this IS the target audience"
      - "Actionable finding: one-line pandas fix (groupby quantile) reduces V from 0.29–0.41 to ≤0.10 (if P1 confirmed)"
      - "Proxy quality check via other Parquet quality signals avoids GPU constraint while addressing equity-vs-quality concern"
      - "Generalizable principle extends beyond CCNet to any language-specific quality score reused at scale"

  perspective_plausibility:
    agent: "Prof. Pax"
    icon: "⚙️"
    assessment: |
      STRONG. Full feasibility confirmed. All four experimental conditions (global percentile,
      per-language percentile, iso-retention z-score, CCNet-tercile) are computable from static
      RedPajama-V2 Parquet files (208,263 rows). Core implementation: pandas groupby + scipy.stats
      + custom bootstrap. Additional diagnostics (90th-pct PPL, skewness/kurtosis/dip test,
      Mantel-Haenszel length stratification) are all scipy/numpy operations on the same DataFrame.
      Total implementation estimate: ~150 lines Python, <60 seconds CPU execution per condition.
      No GPU, no API, no model inference, no internet access required. The h-m1 pipeline
      infrastructure (data loading, statistical tests, figure generation) is preserved and reusable.
      The global-threshold baseline from h-m1 IS a valid comparison point — it applied single
      cross-language percentile to pre-computed CCNet scores, which is the practitioner-reuse scenario.
    key_points:
      - "Core code: df.groupby('language')['ccnet_perplexity'].transform('quantile', k/100) — 1 line pandas"
      - "All 4 conditions CPU-only, static Parquet, ~150 lines total (~60 seconds execution)"
      - "h-m1 infrastructure (data_pipeline.py, stat_tests.py) reusable — no rebuild from scratch"
      - "Iso-retention z-score: per-language μ_l, σ_l → z_l = (ppl_i - μ_l)/σ_l → retain z_l ≤ z* (iso-retain rate)"
      - "Bootstrap: 1000 resamples of 208,263-row DataFrame, <60 sec CPU; permutation: 1000 label shuffles, comparable cost"

  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      Consolidated Final Hypothesis (h-m1-v2 — Language-Adaptive Perplexity Threshold Equity):

      SCOPE: RedPajama-V2 CommonCrawl quality signal metadata (208,263-document sample,
      5 languages: en/de/fr/es/it), pre-computed ccnet_perplexity scores (static Parquet).

      CORE CLAIM: Per-language k-th percentile thresholding of ccnet_perplexity reduces
      language-group retention disparity (Cramér's V) by ΔV ≥ 0.10 for ≥3/5 k values
      relative to global k-th percentile baseline (Cramér's V = 0.29–0.41 from h-m1),
      with bootstrap 95% CI excluding zero, because global thresholding introduces spurious
      language-retention association due to cross-language scale and shape heterogeneity.

      4-CONDITION DESIGN: (1) Global k-th percentile [baseline, h-m1], (2) Per-language
      k-th percentile [primary], (3) Iso-retention per-language z-score [disambiguation],
      (4) CCNet-consistent per-language tercile [negative control, expect V ≈ 0].

      PRE-REGISTERED CRITERIA: SUCCESS = ΔV ≥ 0.10 for ≥3/5 k AND ≥15pp gap reduction at k=30
      AND CI excludes 0. FAILURE = gap >10pp AND V ≥ 0.20. QUALITY = 90th-pct PPL increase ≤10%.
      PERMUTATION = V → 0 under permuted labels. DIAGNOSTICS = skewness, kurtosis, dip test
      per language (pre-registered before running thresholding experiments).
    key_points:
      - "4-condition design subsumes all previous reviewer concerns: global (baseline), per-lang percentile (primary), z-score (mechanistic disambiguation), CCNet-tercile (negative control)"
      - "Pre-registered both success AND failure criteria — avoids post hoc interpretation"
      - "Practical effect size (≥15pp gap reduction at k=30) translates statistical result to operational terms"
      - "All criteria feasible from existing Parquet data with ~150 lines pandas/scipy"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      ENDORSES with documented limitations. The three-condition experiment has been properly
      strengthened into a four-condition design with pre-registered success/failure criteria,
      practical effect size, quality proxy, permutation control, and distributional diagnostics.
      Remaining concerns are appropriately documented as limitations, not fatal flaws.
    key_points:
      - "Length confound: Mantel-Haenszel length stratification mitigates but does not eliminate; document as limitation"
      - "Sample scope: 208,263 documents vs. 113.3B full corpus; explicit scope boundary in all claims"
      - "Z-score breakdown: pre-register kurtosis > 10 as heavy-tail condition warranting z-score caveat"
      - "MITIGATION: All three documented as Phase 6 paper limitations; no design changes needed"

