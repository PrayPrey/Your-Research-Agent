# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "The RedPajama-V2 208,263-document sample is sufficiently representative of per-language perplexity distributions in the full corpus for threshold calibration experiments"
    supporting_evidence: "h-m1 achieved Cramér's V = 0.29–0.41 with Holm p ≈ 0 — statistical power is adequate at n = 208,263"
    consequence_if_violated: "Results may not generalize to full 113.3B-document corpus; disparities could be larger or smaller at scale"
  - id: "A2"
    assumption: "Per-language k-th percentile calibration is the correct level of granularity (vs. sub-language, region, or domain-level calibration)"
    supporting_evidence: "CCNet uses language as the primary grouping variable; RedPajama-V2 provides language labels for 5 languages"
    consequence_if_violated: "If within-language domain variation dominates, language-level calibration is insufficient"
  - id: "A3"
    assumption: "The observed Cramér's V under global thresholding reflects threshold-calibration artifact rather than upstream LID/dedup pipeline asymmetries"
    supporting_evidence: "h-m1 pipeline documented; LID confidence consistent across conditions; CCNet-tercile negative control will test this"
    consequence_if_violated: "ΔV under adaptive threshold will be smaller than expected; negative control will show V > 0"
  - id: "A4"
    assumption: "Bootstrap CI with 1000 resamples on the 208,263-row dataset provides valid inference for ΔCramér's V from paired contingency tables"
    supporting_evidence: "Bootstrap is valid for plug-in statistics (Efron 1979; Bickel & Freedman 1981); same-dataset paired case handled by resampling documents (not rows)"
    consequence_if_violated: "CIs may be anti-conservative; permutation test provides backup non-parametric validation"
  - id: "A5"
    assumption: "The iso-retention z-score condition (retain z_l ≤ z* where z* matches global k retain rate) is a valid comparator for isolating scale vs. shape effects"
    supporting_evidence: "By construction: iso-retention ensures Cramér's V comparison is not confounded by different total retain rates between conditions"
    consequence_if_violated: "If any language has zero-variance perplexity distribution, z-score is undefined; kurtosis > 10 signals breakdown condition"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    RedPajama-V2 CommonCrawl quality signal metadata sample (208,263 documents, 5 languages:
    English, German, French, Spanish, Italian). Pre-computed ccnet_perplexity scores from
    Parquet files. Percentile-based thresholding strategies (global vs. per-language).
    CPU-only analysis, static Parquet files, no model inference.
  does_not_apply_to: |
    Full RedPajama-V2 corpus (113.3B documents) — sample-only results.
    Other quality signals (duplicate ratio, terminal punctuation fraction, etc.) — perplexity only.
    Downstream LLM quality/performance — no model training or evaluation in scope.
    Languages outside the 5 tested (en/de/fr/es/it).
    Other corpora (C4, Dolma, OSCAR) — results specific to RedPajama-V2 CCNet perplexity values.
    CCNet's original pipeline — we test practitioner reuse of exported scores, not CCNet re-execution.
  known_limitations: |
    1. Sample scope: 208,263-document sample vs. 113.3B full corpus.
    2. No downstream quality evaluation (CPU constraint; no GPU for LLM training).
    3. Z-score condition assumes finite variance; breaks down for languages with kurtosis > 10.
    4. Document-length confound partially controlled (Mantel-Haenszel stratification) but not fully eliminable.
    5. LID and dedup pipeline conditions for RedPajama-V2 scores must be documented but not controlled.
    6. CCNet negative control is per-language tercile (equal thirds), not exact CCNet cutoff.csv values.

