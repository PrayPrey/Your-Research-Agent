# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-M1-v2"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under the RedPajama-V2 CommonCrawl quality signal metadata (208,263-document sample,
    5 languages: en/de/fr/es/it), if per-language k-th percentile thresholding is applied
    to pre-computed ccnet_perplexity scores (instead of global k-th percentile), then
    language-group retention disparity (Cramér's V) is reduced by ΔCramér's V ≥ 0.10
    for ≥3 of 5 k values ∈ {10, 20, 30, 40, 50}, and max–min per-language retention gap
    is reduced by ≥15 percentage points at k=30, because global thresholding introduces
    spurious language-retention association due to cross-language scale and shape
    heterogeneity in CCNet perplexity distributions (per-language KenLM training on
    Wikipedia with language-specific SentencePiece tokenization produces incomparable
    cross-language perplexity scales).
  alternative_hypothesis_h0: |
    There is no significant difference in language-group retention disparity (Cramér's V)
    between global k-th percentile thresholding and per-language k-th percentile
    thresholding applied to ccnet_perplexity scores in the RedPajama-V2 sample
    (ΔCramér's V < 0.05 across all k values, OR bootstrap 95% CI for ΔCramér's V
    includes zero for ≥3/5 k values).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Thresholding strategy"
      type: "categorical"
      operationalization: "4 conditions: (1) global k-th percentile, (2) per-language k-th percentile, (3) iso-retention per-language z-score, (4) CCNet-consistent per-language tercile"
      levels: ["global_percentile", "per_language_percentile", "iso_retention_zscore", "ccnet_tercile"]
    - name: "Threshold level k"
      type: "categorical"
      operationalization: "k ∈ {10, 20, 30, 40, 50} — retain documents below k-th percentile of perplexity"
      levels: [10, 20, 30, 40, 50]
  dependent:
    - name: "Cramér's V (language × retained/removed)"
      type: "continuous"
      operationalization: "scipy.stats.contingency.association(ct, method='cramer') on 5×2 contingency table (5 languages × retained/removed). Range [0,1]; lower = less disparity."
      primary: true
    - name: "Max–min per-language retention gap"
      type: "continuous"
      operationalization: "max(retention_rate_l) - min(retention_rate_l) for l ∈ {en,de,fr,es,it}. Percentage points."
      primary: false
    - name: "ΔCramér's V"
      type: "continuous"
      operationalization: "V(global_k) - V(adaptive_k), bootstrap CI with 1000 resamples. Positive = reduction."
      primary: false
    - name: "90th-percentile retained PPL per language"
      type: "continuous"
      operationalization: "np.percentile(retained_docs['ccnet_perplexity'][lang_mask], 90) per language, pre and post adaptive thresholding. Quality dilution check."
      primary: false
  controlled:
    - name: "Dataset"
      operationalization: "Fixed: RedPajama-V2 sample subset, 208,263 documents, 5 languages"
    - name: "Perplexity scores"
      operationalization: "Fixed: pre-computed ccnet_perplexity from Parquet — no re-scoring"
    - name: "LID confidence"
      operationalization: "Document as-is from RedPajama-V2 metadata — note upstream filtering conditions"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "CCNet trains per-language KenLM LMs on Wikipedia with language-specific SentencePiece tokenization, producing perplexity scores that are not cross-linguistically commensurable in scale or shape"
      evidence: "Wenzek et al. [CCNet, 2019] — per-language 5-gram KenLM, per-language SentencePiece; different tokenization granularity affects per-token perplexity scale; English Wikipedia vs. Italian Wikipedia differ in size and domain diversity"
      falsifier: "If z-score iso-retention condition and percentile condition produce identical ΔV (|ΔV_pct - ΔV_zscore| ≤ 0.02), mechanism is pure scale artifact (z-score sufficient)"
    - step: 2
      description: "Global k-th percentile threshold applied to cross-language ccnet_perplexity pool sets a cutoff calibrated to the cross-language distribution, not within-language distributions"
      evidence: "h-m1 confirmed: applying global threshold to RedPajama-V2 Parquet ccnet_perplexity scores produces Cramér's V = 0.29–0.41 with English most excluded (3.7%–36.5% retention)"
      falsifier: "If CCNet-tercile negative control (per-language tercile) yields V > 0.10, upstream factors (LID, dedup) also contribute to disparity"
    - step: 3
      description: "English CommonCrawl web text has higher mean perplexity than Italian/other language web text (English is noisier, more domain-diverse, more informal relative to Wikipedia-trained KenLM expectations)"
      evidence: "h-m1 finding: English retained at 3.7%–36.5% (most excluded), Italian at 18.2%–88.1% (least excluded). Global threshold = English-heavy distribution → Italian documents systematically below cutoff → higher retention."
      falsifier: "If within-language PPL distributions have identical shapes (kurtosis/skew within ±0.5 of each other), the effect is purely scale-driven"
    - step: 4
      description: "Per-language percentile calibration removes scale AND shape confounds by comparing each document to its within-language distribution, equalizing selection probability across languages"
      evidence: "By construction: k-th percentile within language l → exactly k% of each language's documents retained → equal retention rates across languages → Cramér's V ≈ 0 (in absence of document length confound)"
      falsifier: "If Cramér's V does not drop below 0.10 under per-language percentile, then non-perplexity confounds (document length, LID confidence artifacts, dedup asymmetries) dominate"
  key_tension: "Whether the disparity is primarily calibration (threshold-fixable) vs. LM-training (requiring retraining KenLM with balanced multilingual corpus). The z-score iso-retention disambiguation arm directly tests this."
  evidence_summary: |
    Causal chain supported by: h-m1 empirical results (Cramér's V = 0.29–0.41 confirmed),
    CCNet methodology (per-language LMs, SentencePiece tokenization per language),
    Jansen et al. [2022] (KenLM distributions for web text exhibit language-specific tail behavior),
    Turki et al. [2026] (retention rate tuning necessary for multilingual quality filtering,
    even with cross-lingual classifier scores). The mechanism is plausible and internally coherent.

