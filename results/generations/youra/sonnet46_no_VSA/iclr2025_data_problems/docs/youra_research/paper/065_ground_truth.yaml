# ============================================================
# DATASET STATISTICS (from 04_validation.md)
# ============================================================

dataset:
  name: "RedPajama-V2 quality signal sample"
  n_rows: 208262
  languages: ["de", "en", "es", "fr", "it"]
  nan_rate: "< 0.01%"
  source: "redpajama_sample.parquet (cached)"
  partitions: "head and middle"

# ============================================================
# METHODOLOGY (from 02c_experiment_brief.md and code)
# ============================================================

methodology:
  algorithm_name: "Global k-th percentile thresholding + Cramér's V measurement"
  key_implementation:
    perplexity_field: "ccnet_perplexity"
    threshold_formula: "df['ccnet_perplexity'].quantile(k/100) across ALL languages"
    association_measure: "scipy.stats.contingency.association(method='cramer')"
    correction_method: "Holm-Bonferroni via statsmodels.stats.multitest.multipletests"
  k_values_tested: [10, 20, 30, 40, 50]
  global_thresholds_ppl:
    k10: 175.0
    k20: 224.0
    k30: 261.7
    k40: 295.1
    k50: 328.9
  runtime_seconds: ~35
  hardware: "CPU-only"
  random_state: 42

# ============================================================
# GATE EVALUATION (from gate_verdict.json)
# ============================================================

gate:
  type: "MUST_WORK"
  result: "PASS"
  satisfied: true
  gate_range_v: [0.40, 0.57]
  indicators:
    data_loaded: true
    five_languages: true
    no_nan_perplexity: true
    cramers_v_in_range: true
    holm_p_significant: true
  iterations_required: 3
  prior_estimate_range: [0.29, 0.41]
  actual_vs_prior_ratio: "25-40% larger"

