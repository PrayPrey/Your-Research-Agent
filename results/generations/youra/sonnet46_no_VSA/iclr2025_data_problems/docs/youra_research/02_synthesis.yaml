hypothesis_draft:
  title: "Language-Adaptive Perplexity Threshold Equity (h-m1-v2)"
  hypothesis_id: "H-M1-v2"
  core_claim: |
    When practitioners apply a global k-th percentile threshold to pre-computed CCNet
    perplexity scores from RedPajama-V2 (as in h-m1), they introduce spurious
    language-group retention disparity (Cramér's V = 0.29–0.41). Per-language k-th
    percentile thresholding reduces this disparity by ΔCramér's V ≥ 0.10 for ≥3 of 5
    k values ∈ {10,20,30,40,50}, with max–min per-language retention gap reduced by
    ≥15pp at k=30, because global thresholding conflates cross-language scale and shape
    heterogeneity in perplexity distributions.
  mechanism: |
    CCNet trains per-language KenLM LMs on Wikipedia with language-specific SentencePiece
    tokenization, producing perplexity scores with incomparable cross-language scales and
    distribution shapes. English CommonCrawl web text has higher mean perplexity than
    Italian/Romance web text (noisier, more domain-diverse relative to Wikipedia KenLM
    expectations). A global k-th percentile cutoff is effectively calibrated to the
    cross-language mixture distribution — which over-excludes English (most-represented,
    highest PPL) and under-excludes Italian (lower PPL due to domain homogeneity).
    Per-language percentile calibration compares each document to its within-language
    distribution, removing the scale+shape confound and equalizing selection probability.
  predictions:
    - P1: "ΔCramér's V ≥ 0.10 for ≥3/5 k values, bootstrap CI excludes 0 (primary)"
    - P2: "Max–min retention gap reduction ≥15pp at k=30; English retention rises from 36.5% baseline"
    - P3: "|ΔV_percentile - ΔV_zscore| > 0.02 for ≥2/5 k values (shape effect confirmed)"

variables_summary:
  independent: "Thresholding strategy (global k-th pct vs. per-lang k-th pct vs. iso-retention z-score vs. CCNet-tercile) × k level (10/20/30/40/50)"
  dependent_primary: "Cramér's V on language × retained/removed contingency table (scipy.stats.contingency.association)"
  controlled: "Dataset fixed (208,263-row RedPajama-V2 sample); pre-computed ccnet_perplexity scores (no re-scoring)"

null_hypothesis:
  h0_statement: |
    No significant difference in Cramér's V between global k-th percentile and per-language
    k-th percentile thresholding on RedPajama-V2 ccnet_perplexity scores
    (ΔCramér's V < 0.05 across all k, OR bootstrap 95% CI includes 0 for ≥3/5 k values).
  statistical_test: "Bootstrap CI on ΔCramér's V (1000 resamples, paired document-level resampling); supplementary permutation test (language-label randomization)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First direct measurement of ΔCramér's V under global vs. per-language perplexity thresholding on RedPajama-V2; first diagnostic decomposition into scale vs. shape components via iso-retention z-score arm"
  differentiation_summary: |
    No prior paper measures Cramér's V under both global and per-language percentile threshold
    conditions on the same corpus (confirmed via Phase 1 literature search — 14 papers reviewed,
    0 with this exact measurement). Closest prior: Turki et al. [2026] (classifier-based retention
    rate tuning, not perplexity; no Cramér's V measurement). Caswell et al. [2021] (audit of
    multilingual dataset quality — documents issues but provides no quantitative before/after
    Cramér's V with threshold calibration fix). The generalizability claim (language-aware scores
    + language-agnostic thresholds → retention disparity) extends to any language-specific
    quality metric — a broader principle not previously articulated.

