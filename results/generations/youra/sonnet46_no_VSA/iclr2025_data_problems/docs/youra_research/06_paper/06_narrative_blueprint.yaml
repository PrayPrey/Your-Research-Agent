narrative_blueprint:
  version: "1.0"
  generated: "2026-07-30"

  hook:
    type: counterintuitive_statistic
    statement: >
      A practitioner applying CCNet's standard quality filter to RedPajama-V2
      would retain 86% of Spanish documents but only 16% of English documents —
      not because English web text is lower quality, but because a single global
      percentile threshold applied to cross-language perplexity scores conflates
      quality with language identity.
    why_it_works: >
      NLP audience expects English to be over-represented in quality datasets.
      The dramatic under-retention of English (alongside German) vs. Spanish
      is immediately surprising and frames the mechanism explanation naturally.

  problem_framing:
    level_1_practitioner: >
      You want to filter your multilingual pretraining corpus by quality.
      You use CCNet perplexity scores because they ship pre-computed in
      RedPajama-V2. You set a global 30th-percentile threshold. Result:
      86% of Spanish documents pass; 14% of German documents pass.
    level_2_technical: >
      CCNet trains a separate KenLM language model per language on that
      language's Wikipedia dump. English Wikipedia (~6.7M articles) is ~10x
      larger than Italian Wikipedia (~1.7M articles), producing LMs with
      incomparable perplexity scales. A global cross-language percentile
      threshold is calibrated to a mixture of these incomparable scales,
      systematically mis-ranking documents by language of origin.
    level_3_empirical: >
      We measure this effect on 208,262 documents from RedPajama-V2
      (en/de/fr/es/it). Cramér's V = 0.40–0.57 across all 5 tested
      threshold levels (k=10–50); all Holm-corrected p-values ≈ 0.
      The effect is 25–40% larger than prior literature estimates suggest.

  key_insight: >
    Global k-th percentile thresholding on pre-computed CCNet perplexity scores
    produces a language-family retention divide — not a quality divide.
    At k=30: es=86%, fr=74%, it=58% vs. en=16%, de=14%.
    Cramér's V = 0.56. This is structural across all 5 threshold levels
    tested, meaning any practitioner using global percentile thresholding
    with ccnet_perplexity will encounter this bias.

  narrative_arc:
    - section: Introduction
      role: Hook → problem motivation → contribution preview
    - section: Related Work
      role: Position against CCNet, multilingual quality filtering, fairness in data curation
    - section: Methodology
      role: Dataset, metric (Cramér's V), experimental protocol, statistical rigor
    - section: Experiments
      role: Setup, implementation, reproducibility details
    - section: Results
      role: Main effect (V table), language breakdown (heatmap), effect size (gap curve)
    - section: Discussion
      role: Mechanism interpretation, prior estimate recalibration, limitations
    - section: Conclusion
      role: Callback to hook, contribution summary, future work pointer

  evidence_structure:
