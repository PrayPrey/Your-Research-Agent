    primary_figure: "Cramér's V bar chart (Figure 1)"
    secondary_figure: "Retention heatmap language × k (Figure 2)"
    tertiary_figure: "Max-min retention gap vs k (Figure 3)"
    mechanistic_figure: "ccnet_perplexity KDE per language (Figure 4)"

