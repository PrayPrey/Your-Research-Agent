ground_truth:
  version: "1.0"
  generated: "2026-07-30"
  paper_title: "Language-Group Retention Disparity in Global CCNet Perplexity Filtering: A Quantitative Baseline on RedPajama-V2"
  phase: "6"

  verified_claims:
    - id: C1
      claim: "Global k-th percentile thresholding on ccnet_perplexity produces Cramér's V = 0.40–0.57 across k ∈ {10,20,30,40,50} on RedPajama-V2 (n=208,262)"
      confidence: HIGH
      evidence_source: "h-e1-v3-v4/04_validation.md — Table 1; results.json"
      exact_values:
        k10: 0.4021
        k20: 0.5193
        k30: 0.5629
        k40: 0.5696
        k50: 0.5293
      statistical_test: "chi-squared, Holm-Bonferroni corrected"
      all_holm_p_approx_zero: true

    - id: C2
      claim: "Per-language retention ordering es > fr > it > en > de is consistent across all 5 k values"
      confidence: HIGH
      evidence_source: "h-e1-v3-v4/04_validation.md — Table 2"
      exact_values:
        k30:
          es: 0.864
          fr: 0.745
          it: 0.582
          en: 0.163
          de: 0.137
        k40:
          es: 1.000
          fr: 0.879
          it: 0.734
          en: 0.253
          de: 0.207

    - id: C3
      claim: "Max-min retention gap is 72.7pp at k=30 (es=86.4% vs de=13.7%)"
      confidence: HIGH
      evidence_source: "h-e1-v3-v4/04_validation.md; 045_validated_hypothesis.md §4.1"
      exact_value_pp: 72.7
      at_k: 30

    - id: C4
      claim: "Spanish retention reaches 100% at k=40 (saturation)"
      confidence: HIGH
      evidence_source: "h-e1-v3-v4/04_validation.md — Table 2"
      exact_value: 1.000
      at_k: 40

    - id: C5
      claim: "Prior V estimate (0.29–0.41) underestimates actual V (0.40–0.57) by 25–40%"
      confidence: HIGH
      evidence_source: "045_validated_hypothesis.md §3.4, §4.2; 3 gate iterations"
      prior_range: [0.29, 0.41]
      actual_range: [0.40, 0.57]

  inconclusive_claims:
    - id: IC1
      claim: "Per-language percentile calibration reduces ΔV ≥ 0.10 for ≥3/5 k values (P1)"
      reason: "h-m1 not executed in this pipeline run"
    - id: IC2
      claim: "Max-min gap reduced ≥15pp at k=30 under per-language calibration (P2)"
      reason: "h-m1/h-c2 not executed"
    - id: IC3
      claim: "Per-language percentile outperforms iso-retention z-score (P3)"
      reason: "h-m2 not executed"

  dataset:
    name: "RedPajama-V2 quality signal metadata"
    n_documents: 208262
    languages: [en, de, fr, es, it]
    partition: "head + middle (stratified)"
    quality_signal: "ccnet_perplexity (pre-computed KenLM)"
    cache_file: "docs/youra_research/redpajama_sample.parquet"
    nan_rate: "< 0.01%"
    random_seed: 42

  threshold_values:
    k10: 175.0
    k20: 224.0
    k30: 261.7
    k40: 295.1
    k50: 328.9

  figures:
