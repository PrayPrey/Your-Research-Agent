gap_id: "gap-1"
gap_title: "No Prior Direct Comparison of Global vs. Per-Language Percentile Perplexity Thresholds on Cramér's V Retention Equity"
gap_description: |
  No prior work compares global vs. per-language percentile thresholds on Cramér's V for
  multilingual dataset quality filtering. CCNet uses per-language KenLM LMs but applies global
  bucket cutoffs. RedPajama-V2 releases pre-computed CCNet perplexity scores as Parquet metadata.
  h-m1 confirmed Cramér's V = 0.29–0.41 under global threshold. This gap asks: does a
  per-language k-th percentile threshold reduce Cramér's V by ≥0.1 for ≥3 of 5 k values?
