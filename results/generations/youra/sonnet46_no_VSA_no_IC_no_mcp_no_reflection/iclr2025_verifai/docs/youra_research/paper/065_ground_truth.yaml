# ═══════════════════════════════════════════════════════════
# STATISTICAL SIGNIFICANCE — IMPORTANT FOR ADVERSARIAL REVIEW
# ═══════════════════════════════════════════════════════════

statistical_significance:
  feedback_volume_differences:
    method: "Kruskal-Wallis + Dunn post-hoc (Bonferroni)"
    H: 338.78
    p_value: 4.01e-73
    effect_size: 0.880
    significant: true
    note: "All pairwise significant EXCEPT mypy vs z3 (p=1.0)"

  repair_rate_differences:
    method: "Bootstrap CI, 1000 resamples, per category"
    significant: false
    note: "CRITICAL — confidence intervals OVERLAP across all categories. No individual pairwise repair-rate difference is significant. The finding rests on perfect MONOTONICITY across 4 categories, not on any single gap. The paper states this explicitly in Section 5.4."

  efficiency_ratio_gate:
    method: "Bootstrap BCa, 10000 resamples, best vs second-best"
    ci: [-1.101, 3.349]
    includes_zero: true
    significant: false
    note: "CRITICAL — static (6.637) vs type (5.336) is only 1.244x, below the 1.5x gate threshold, and the CI includes 0. Static and type checking are NOT distinguishable. Only the static-vs-execution separation is large and consistent. Paper states this in Section 5.5."

  overhead_differences:
    method: "Kruskal-Wallis + pairwise Mann-Whitney"
    significant: true
    note: "Mock mode data"

