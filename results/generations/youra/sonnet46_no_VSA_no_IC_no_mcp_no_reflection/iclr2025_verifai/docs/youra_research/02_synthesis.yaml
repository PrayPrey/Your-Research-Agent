hypothesis_draft:
  title: "Formal Feedback Category Efficiency and Bug-Type Coverage in LLM Code Generation"
  hypothesis_id: "H-FormalFeedbackComparison-v1"
  core_claim: |
    Among post-generation formal feedback categories (execution monitoring, static analysis,
    type checking, SMT solving) applied in a Generate→Verify→Repair loop for LLM code generation
    on HumanEval and MBPP, categories differ systematically in correctness-per-overhead efficiency
    and in which bug types they effectively repair, enabling a diagnostic routing recommendation.
  mechanism: |
    Feedback signal specificity trades off with computational overhead: execution monitoring is
    cheap and broad (pass/fail + error trace); static analysis is cheap and precise for structural
    type errors (Pyright JSON); SMT is expensive but provides exact counterexamples for logic
    violations. The dominant error types in HumanEval/MBPP (mostly type and runtime errors)
    predict that execution monitoring and static analysis will dominate efficiency metrics,
    while SMT will show highest per-error specificity on its feasible subset at higher overhead cost.
  predictions:
    - P1: "Execution monitoring achieves highest Δpass@1 / mean-wall-clock-seconds ratio on 538 problems (≥1.5× next-best category, p<0.05 bootstrap)"
    - P2: "Bug-type × feedback-category interaction significant (chi-squared p<0.05): static analysis best on type-error tasks, execution on runtime-error tasks, SMT on logic-error tasks"
    - P3: "Hard problems (baseline pass@1 <30%) show larger absolute Δpass@1 than easy problems, efficiency ordering preserved within difficulty strata"

variables_summary:
  independent: "Formal feedback category (4 levels: execution/static-analysis/type-checking/SMT)"
  dependent_primary: "Correctness-per-overhead efficiency ratio (Δpass@1 / mean wall-clock seconds per problem)"
  controlled: "GPT-4o-mini backbone, 3 repair iterations max, HumanEval+MBPP benchmark set, standardized prompt template"

null_hypothesis:
  h0_statement: |
    There is no significant difference in pass@1 improvement per unit wall-clock overhead
    between formal feedback categories (execution monitoring, static analysis, type checking,
    SMT solving) when applied to GPT-4o-mini on HumanEval + MBPP.
  statistical_test: "Bootstrap confidence intervals for efficiency ratio differences; chi-squared for bug-type interaction; ANOVA for difficulty stratification"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled cross-category formal feedback comparison with overhead normalization + bug-type coverage profiling enabling diagnostic routing recommendation"
  differentiation_summary: |
    All prior work (Self-Repair, Reflexion, CodeT, Grammar-Constrained Decoding) studies
    exactly one formal feedback category in isolation, on different LLMs, different benchmarks,
    without overhead normalization. This work is the first to hold LLM backbone and benchmark
    constant while varying only the verifier type, and the first to measure correctness-per-overhead
    efficiency ratio as the primary metric. The bug-type coverage profiling and routing
    recommendation are entirely novel contributions.

