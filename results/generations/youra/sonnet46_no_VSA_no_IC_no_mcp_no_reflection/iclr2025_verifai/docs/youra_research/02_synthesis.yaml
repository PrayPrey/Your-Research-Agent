measurement_plan:
  data_collection:
    - source: "HumanEval via openai/human-eval harness"
    - source: "MBPP via google-research/mbpp"
    - source: "OpenAI API for GPT-4o-mini generation and repair"
    - source: "Pyright CLI for static analysis feedback"
    - source: "mypy CLI for type checking feedback"
    - source: "Z3 Python API for SMT feedback"
    - source: "subprocess for execution monitoring"
  procedure:
    - step: "Pilot 20 HumanEval problems for SMT auto-extraction soundness validation"
    - step: "Generate initial solutions for all 538 problems with GPT-4o-mini (temperature 0.2)"
    - step: "Classify initial failures by bug type (type error / runtime error / logic error) from error traces"
    - step: "Run each of 4 feedback conditions independently: up to 3 repair iterations per problem"
    - step: "Record wall-clock time per problem per condition"
    - step: "Measure pass@1 after repair loop for each condition"
    - step: "Compute efficiency ratios; run statistical tests for P1, P2, P3"
  success_criteria:
    - "P1: Execution monitoring ratio ≥ 1.5× next-best (bootstrap CI p<0.05)"
    - "P2: Chi-squared test significant (p<0.05) for bug-type × category interaction"
    - "P3: Hard > easy absolute Δpass@1 (ANOVA p<0.05); ordering preserved in all strata"

validation:
  internal_validity:
    - "Same benchmark problems for all categories (eliminates task confound)"
    - "Same LLM backbone and generation parameters (eliminates model confound)"
    - "Standardized feedback injection prompt template (controls format confound)"
    - "Generated-test oracle for execution (avoids circularity with evaluation test suite)"
    - "SMT pilot before full run (validates soundness of auto-extracted constraints)"
  external_validity:
    - "HumanEval + MBPP cover diverse Python programming task types (string, math, list manipulation)"
    - "GPT-4o-mini is broadly accessible and representative of current capable API models"
    - "Limitation: findings may not generalize to repository-level tasks (SWE-bench) or other languages"

discussion_synthesis:
  key_insights:
    - "The 'apples-to-oranges' problem (different bug types caught) reframes as the core contribution — coverage profile taxonomy is the insight"
    - "SMT's higher per-iteration overhead may be offset by fewer iterations needed if counterexample feedback is more informative"
    - "Feedback format (JSON vs. natural language trace) is a confound that must be controlled by standardizing prompt templates"
    - "Execution oracle circularity is a real threat — using generated tests (CodeT-style) as oracle is the resolution"
  breakthrough_moments:
    - "Exchange 7 (Dr. Nova): Reframing from efficiency ranking to bug-type coverage profile taxonomy strengthened novelty significantly"
    - "Exchange 6 (Prof. Rex): Identifying the 40%-coverage SMT problem and proposing matched-subset + full-coverage dual reporting as solution"
    - "Exchange 4 (Prof. Pax): Confirming all 4 categories are implementable with existing tools within cost/time budget"
  resolved_tensions:
    - "Overhead metric: resolved to wall-clock seconds per problem (most interpretable for practitioners)"
    - "Execution circularity: resolved to generated-test oracle (CodeT-style)"
    - "SMT coverage gap: resolved to dual reporting (full 538 problems + SMT-feasible subset)"
    - "Apples-to-oranges: resolved by making it the contribution (taxonomy) rather than a limitation"
