generation:
  model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 512

timeouts:
  execution_timeout: 3.0
  static_timeout: 10.0
  type_timeout: 10.0
  smt_timeout: 10.0

smt_pilot:
  n_problems: 20
  seed: 1
  gate_threshold: 0.30

paths:
  results_dir: "results"
  figures_dir: "figures"
  completions_checkpoint: "results/completions.jsonl"
  smt_pilot_results: "results/smt_pilot_results.json"
  verifier_results: "results/verifier_results.jsonl"
  activation_stats: "results/activation_stats.json"

activation_threshold: 0.10
random_seed: 1
