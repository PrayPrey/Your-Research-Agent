novelty:
  preserved_novelty: "First systematic multi-benchmark evaluation of sampling-based NLI consistency as hallucination predictor across TriviaQA + NQ + HaluEval + TruthfulQA under identical controlled conditions. Includes N-efficiency analysis and cross-benchmark AUROC profile."
  key_innovation: "Semantic Mode Consistency (SMC) framing: positions the method as characterizing whether the LLM's output distribution is unimodal (factual) vs. multimodal (hallucinating). Compares NLI-based and embedding-based consistency in parallel, providing the first empirical assessment of which is more reliable for short factual QA."
  differentiation:
    - prior_work: "SelfCheckGPT (Manakul et al. 2023)"
      difference: "SelfCheckGPT evaluated only on WikiBio (open-ended generation) with GPT-3. This work evaluates on 4 factual QA benchmarks with a modern instruction-tuned model, includes N-ablation, and adds embedding consistency as alternative metric."
    - prior_work: "Semantic Uncertainty (Kuhn et al. 2023)"
      difference: "Semantic Uncertainty requires token log-probabilities for entropy weighting; this work is strictly black-box. Kuhn et al. did not evaluate on HaluEval or TruthfulQA, and did not compare against verbalized confidence baselines."
    - prior_work: "Self-Consistency (Wang et al. 2022)"
      difference: "Wang et al. focused on reasoning (CoT) tasks, not factual QA. No AUROC analysis; no hallucination classification task. N-plateau findings may not transfer to factual QA."

