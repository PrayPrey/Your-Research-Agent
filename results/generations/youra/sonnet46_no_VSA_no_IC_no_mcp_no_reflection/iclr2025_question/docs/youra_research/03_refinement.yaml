# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "SMC-NLI (N=10) achieves AUROC ≥ 0.70 on all four benchmarks: TriviaQA, NaturalQuestions, HaluEval, and TruthfulQA, using Llama-3-8B-Instruct."
    test_method: "Compute SMC-NLI score for 1000 questions per benchmark. Use ground truth labels (correct/hallucinated) to compute AUROC. HaluEval binary labels; TriviaQA/NQ: correct if exact match or F1 ≥ 0.5 with gold; TruthfulQA: use MC format labels."
    success_criterion: "AUROC ≥ 0.70 on all 4 benchmarks for SMC-NLI (N=10)"
    falsification: "AUROC < 0.65 on ≥ 2 benchmarks, OR AUROC < 0.60 on any single benchmark"
  - id: "P2"
    primary: false
    statement: "AUROC ordering across benchmarks follows HaluEval > TriviaQA ≈ NQ > TruthfulQA, with HaluEval being easiest and TruthfulQA hardest for SMC-NLI."
    test_method: "Compare AUROC values across 4 benchmarks; test ordering statistically using bootstrap confidence intervals."
    success_criterion: "AUROC(HaluEval) > AUROC(TruthfulQA) with non-overlapping 95% CIs"
    falsification: "TruthfulQA AUROC ≥ HaluEval AUROC, or ordering reversed from prediction"
  - id: "P3"
    primary: false
    statement: "N-efficiency elbow occurs at N ≤ 10: AUROC(N=10) ≥ 0.95 × AUROC(N=20) on TriviaQA, indicating diminishing returns from additional samples beyond N=10."
    test_method: "N-ablation experiment: 200 TriviaQA questions, N ∈ {1, 3, 5, 10, 20}. Plot AUROC vs N. Identify elbow."
    success_criterion: "AUROC(N=10) / AUROC(N=20) ≥ 0.95"
    falsification: "AUROC(N=20) > 1.05 × AUROC(N=10) (meaningful gain from N=10 to N=20)"

