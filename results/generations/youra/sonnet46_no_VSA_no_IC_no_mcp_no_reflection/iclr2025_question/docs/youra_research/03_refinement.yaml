experimental_setup:
  prerequisite:
    name: "N-ablation mini-experiment"
    description: "200 TriviaQA questions, N ∈ {1,3,5,10,20}, SMC-NLI only. Run first to validate N=10 choice before main experiment."
    estimated_time: "< 1 day"
  dataset:
    name: "HaluEval (primary) + TriviaQA + NaturalQuestions + TruthfulQA (secondary)"
    type: "standard"
    source: "HuggingFace datasets hub"
    path:
      HaluEval: "datasets: HaluEval/halueval_qa_samples.json (public)"
      TriviaQA: "datasets: trivia_qa (HuggingFace)"
      NaturalQuestions: "datasets: natural_questions (HuggingFace)"
      TruthfulQA: "github: sylinrl/TruthfulQA (MC format)"
    hypothesis_fit: "HaluEval has balanced binary hallucination labels (50/50) making it ideal as primary benchmark. TriviaQA/NQ provide open-domain factual QA with verifiable ground truth. TruthfulQA provides adversarial hard case. All four cover the spectrum from easy to hard for SMC signal."
  model:
    name: "Llama-3-8B-Instruct"
    type: "decoder-only autoregressive LLM"
    source: "HuggingFace: meta-llama/Meta-Llama-3-8B-Instruct"
    hypothesis_fit: "Fully local (no API cost), supports sampling with temperature control, achieves ~60-70% factual accuracy on TriviaQA (both hallucination and correct regimes populated)"
  nli_scorer:
    name: "cross-encoder/nli-deberta-v3-large"
    source: "HuggingFace sentence-transformers"
    role: "Primary consistency metric (SMC-NLI)"
  embedding_model:
    name: "sentence-transformers/all-mpnet-base-v2"
    source: "HuggingFace sentence-transformers"
    role: "Secondary consistency metric (SMC-Embed) — robustness check for NLI OOD concern"
  baselines:
    - name: "Verbalized confidence"
      method: "Prompt LLM to self-report confidence on 1-10 scale; use as hallucination predictor"
    - name: "Sample count = 1 (no consistency)"
      method: "Single sample + NLI self-consistency score with itself = trivially 1.0; AUROC = 0.50 baseline"
    - name: "SelfCheckGPT-NLI (replication)"
      method: "Exact replication of Manakul et al. 2023 NLI method for comparison"

