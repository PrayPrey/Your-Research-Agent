# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Sampling-based semantic consistency (NLI-based) correlates with factual accuracy on TriviaQA and NaturalQuestions"
      status: "BUILD_ON"
      evidence: "Kuhn et al. 2023 (Semantic Uncertainty, arXiv:2302.09664) demonstrated this; Manakul et al. 2023 (SelfCheckGPT) demonstrated on WikiBio"
    - claim: "SelfCheckGPT NLI consistency is effective for open-ended generation hallucination detection in black-box setting"
      status: "BUILD_ON"
      evidence: "Manakul et al. 2023 (arXiv:2303.08896) on WikiBio/GPT-3"
    - claim: "No controlled comparison of sampling-based consistency vs. token-probability baselines across TriviaQA + NQ + HaluEval + TruthfulQA exists"
      status: "PROVE_NEW"
      evidence: "Literature gap confirmed by Phase 1 analysis — each existing paper covers at most 2 benchmarks and uses different baselines"
    - claim: "AUROC is a valid metric for binary hallucination prediction"
      status: "BUILD_ON"
      evidence: "Standard metric in UQ evaluation literature (Xiong et al. 2023, Lin et al. 2024)"
    - claim: "DeBERTa-v3-large NLI scorer is out-of-distribution for very short factual answers"
      status: "PROVE_NEW"
      evidence: "Identified concern by Prof. Rex in discussion — requires empirical validation; NLI trained on SNLI/MultiNLI paragraph pairs"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    Build on established SelfCheckGPT/Semantic Uncertainty methodology.
    Main experimental contribution is the multi-benchmark comparison (PROVE_NEW).
    Do not re-prove that sampling-based consistency works in principle — only demonstrate
    it works across all four specified benchmarks under unified controlled conditions.
    The NLI OOD concern must be addressed empirically by running embedding-consistency
    in parallel and comparing both metrics.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SMC-v1"
  confidence_level: 0.78
  core_hypothesis_statement: |
    Under factual question-answering with black-box LLMs (no logit access),
    if we compute NLI-based Semantic Mode Consistency (SMC) across N=10 stochastic
    samples per question using a local DeBERTa-v3-large NLI scorer,
    then this consistency score will serve as a reliable hallucination predictor
    (AUROC ≥ 0.70) across all four existing factual QA benchmarks
    (TriviaQA, NaturalQuestions, HaluEval, TruthfulQA),
    because factually grounded answers produce semantically convergent sample
    distributions while hallucinated answers exhibit semantic divergence, reflecting
    the model's internal uncertainty manifesting as multimodal semantic output.
  alternative_hypothesis_h0: |
    There is no significant difference in hallucination prediction AUROC between
    NLI-based Semantic Mode Consistency (N=10 samples) and verbalized confidence
    baseline across TriviaQA, NaturalQuestions, HaluEval, and TruthfulQA.
    Equivalently: SMC AUROC < 0.65 on ≥ 2 of 4 benchmarks.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Uncertainty estimation method"
      type: "categorical"
      operationalization: "Method used to estimate hallucination probability per question"
      levels:
        - "SMC-NLI: NLI-based consistency across N=10 samples (DeBERTa-v3-large)"
        - "SMC-Embed: Embedding cosine similarity across N=10 samples (sentence-transformers/all-mpnet-base-v2)"
        - "Verbalized confidence: Self-reported confidence elicitation via prompt"
    - name: "Benchmark"
      type: "categorical"
      operationalization: "Factual QA benchmark dataset used for evaluation"
      levels:
        - "TriviaQA (open-domain factual QA)"
        - "NaturalQuestions (Wikipedia-grounded QA)"
        - "HaluEval (binary hallucination classification, balanced)"
        - "TruthfulQA (adversarial truthfulness, open-ended)"
    - name: "Sample count N"
      type: "continuous"
      operationalization: "Number of stochastic samples per question (temperature=0.7)"
      levels: [1, 3, 5, 10, 20]
  dependent:
    - name: "AUROC for hallucination prediction"
      type: "continuous"
      operationalization: "Area Under ROC Curve for binary hallucination classification (hallucinated vs. factual); range [0, 1]; higher = better predictor"
      primary: true
    - name: "AUPRC for hallucination prediction"
      type: "continuous"
      operationalization: "Area Under Precision-Recall Curve; reported alongside AUROC to handle class imbalance"
      primary: false
    - name: "N-efficiency ratio"
      type: "continuous"
      operationalization: "AUROC(N=k) / AUROC(N=20) for k ∈ {1,3,5,10}; identifies minimum sufficient N"
      primary: false
  controlled:
    - name: "LLM model"
      operationalization: "Fixed to Llama-3-8B-Instruct throughout; no cross-model variation in main study"
    - name: "Sampling temperature"
      operationalization: "Fixed to 0.7 for all stochastic sampling"
    - name: "NLI scorer"
      operationalization: "Fixed to cross-encoder/nli-deberta-v3-large for SMC-NLI condition"
    - name: "Embedding model"
      operationalization: "Fixed to sentence-transformers/all-mpnet-base-v2 for SMC-Embed condition"
    - name: "Questions per benchmark"
      operationalization: "1000 questions per benchmark (random sample, stratified by label if available)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Factual certainty → concentrated semantic probability mass. When an LLM has strong parametric knowledge about a fact, its conditional distribution over answer tokens concentrates around a narrow semantic cluster. Multiple stochastic samples at temperature 0.7 remain semantically equivalent (same entity, same claim)."
      evidence: "Wang et al. 2022 self-consistency: majority vote converges on correct CoT answers. Kuhn et al. 2023: semantic entropy is lower for correctly answered questions."
      falsifier: "If correctly answered questions show HIGH inter-sample NLI contradiction rate on TriviaQA, this step is falsified."
    - step: 2
      description: "Factual uncertainty / hallucination → multimodal semantic distribution. When the model lacks grounding (hallucination regime), the sampling distribution is spread across multiple incompatible semantic clusters. Different stochastic samples produce contradictory claims (e.g., different dates, different entities)."
      evidence: "Manakul et al. 2023: hallucinated biographical sentences are inconsistent across GPT-3 samples. Kuhn et al. 2023: semantic entropy is higher for incorrectly answered questions."
      falsifier: "If hallucinated answers show LOW inter-sample NLI contradiction rate (model confidently hallucinates the same wrong answer), this step is partially falsified — particularly on TruthfulQA where confident wrong answers are by design."
    - step: 3
      description: "NLI-based pairwise agreement → SMC score. For N=10 samples, compute pairwise NLI classifications (entailment / neutral / contradiction) across all C(10,2)=45 pairs. SMC = fraction of pairs classified as 'entailment' or 'neutral' (consistency fraction). High SMC → low hallucination probability."
      evidence: "Manakul et al. 2023 NLI consistency score formulation. Direct operationalization of Steps 1-2."
      falsifier: "If DeBERTa-NLI classifies short factual answer pairs as 'neutral' regardless of semantic equivalence (OOD behavior), SMC scores will be uniformly high and AUROC will collapse to ~0.50. Addressed by SMC-Embed parallel metric."
  key_tension: "TruthfulQA adversarial design: models produce confidently wrong answers with high inter-sample consistency (same wrong fact). This would suppress SMC signal specifically on TruthfulQA, potentially yielding AUROC < 0.70 there even if the mechanism is otherwise correct."
  evidence_summary: |
    Evidence for mechanism comes from Kuhn et al. 2023 (semantic entropy lower for correct answers)
    and Manakul et al. 2023 (NLI consistency higher for non-hallucinated sentences).
    Both support the directional claim. The key novel element is systematic validation
    across all four benchmarks under identical controlled conditions, which has not been done.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Hallucinated LLM outputs are semantically diverse across stochastic samples (the model does not consistently hallucinate the same wrong answer)."
    supporting_evidence: "Supported by Manakul et al. 2023 (WikiBio) and Kuhn et al. 2023 (TriviaQA/NQ). However, TruthfulQA adversarial questions may violate this — discussed in key_tension."
    consequence_if_violated: "SMC AUROC will be low specifically for confident, consistent hallucinations (TruthfulQA). Main study prediction explicitly accounts for this by predicting TruthfulQA as the hardest case."
  - id: "A2"
    assumption: "DeBERTa-v3-large NLI scorer provides meaningful contradiction/entailment signal for factual QA answer pairs, despite being trained on paragraph-level NLI."
    supporting_evidence: "Used in SelfCheckGPT (Manakul et al.) for sentence-level consistency. Short answer pairs may reduce signal quality."
    consequence_if_violated: "SMC-NLI scores become uninformative; SMC-Embed (embedding cosine similarity) serves as fallback metric and may still support hypothesis."
  - id: "A3"
    assumption: "1000 questions per benchmark is sufficient for reliable AUROC estimation (narrow confidence interval)."
    supporting_evidence: "Standard sample size for AUROC estimation in NLP evaluation; TriviaQA/NQ/HaluEval have thousands of questions available."
    consequence_if_violated: "AUROC confidence intervals will be wide; may need to increase to 2000+ questions."
  - id: "A4"
    assumption: "Temperature=0.7 produces sufficient semantic diversity to reveal hallucination uncertainty while not introducing excessive noise."
    supporting_evidence: "SelfCheckGPT used similar temperature range. Wang et al. 2022 used temperature 0.7 for self-consistency sampling."
    consequence_if_violated: "Temperature sensitivity analysis (0.5, 0.7, 1.0) can be added as supplementary; not required for main hypothesis."
  - id: "A5"
    assumption: "Llama-3-8B-Instruct is a suitable representative model — it both makes factual errors and has parametric knowledge, so both hallucination and correct-answer regimes are populated."
    supporting_evidence: "Llama-3-8B achieves ~60-70% factual accuracy on TriviaQA (estimated); both regimes present."
    consequence_if_violated: "If model is near-perfect or near-random, AUROC interpretation becomes harder. Use subset with balanced correct/incorrect ground truth."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Black-box LLMs accessible via sampling API (no logit access required)
    - Factual question-answering tasks with verifiable ground truth answers
    - Short-to-medium answer generation (1 sentence to 2 sentences)
    - Existing benchmarks: TriviaQA, NaturalQuestions, HaluEval, TruthfulQA
    - English language QA
  does_not_apply_to: |
    - Long-form generation tasks (summarization, story generation) — different mechanism
    - White-box models where token log-probabilities are available (better alternatives exist)
    - Tasks requiring factual consistency across multiple documents (RAG hallucination)
    - Multimodal models (addressed by Gap 3; out of scope for this hypothesis)
    - Cross-model generalization (addressed by Gap 3; main study uses single model)
  known_limitations: |
    - TruthfulQA adversarial questions may have high-consistency hallucinations that evade SMC detection
    - NLI scorer OOD for very short answers (<5 words); SMC-Embed mitigates
    - Sample cost: N=10 per question × 4000 questions = 40,000 inference calls (manageable locally)
    - Single model (Llama-3-8B) limits generalizability claim; cross-model study deferred to Gap 3 hypothesis

