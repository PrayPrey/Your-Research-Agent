# Phase 6 Narrative Design — Generated by Step 02
# Generated: 2026-08-31T08:10:00+00:00

metadata:
  hypothesis_id: "H-SMC-v1 / H-E1"
  paper_type: "negative_result_with_theoretical_contribution"
  target_venue: "ICML 2025"
  narrative_strategy: "counterintuitive_finding"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_finding"
  opening_statement:
    content: |
      A hallucination detector with perfect implementation — 14 unit tests passing,
      10,000 real LLM samples collected, 45,000 NLI pairs scored correctly —
      achieves AUROC = 0.49 on a structured factual QA benchmark:
      statistically indistinguishable from random guessing.
    rationale: >
      Subverts the standard narrative where failure = engineering error.
      Here the engineering is correct; the failure is conceptual, exposing
      a theoretical blind spot in the hallucination detection literature.

  why_reader_should_care:
    main_reason: >
      Sampling-based consistency (SelfCheckGPT, Semantic Uncertainty) is widely
      adopted for black-box LLM hallucination detection. If it fails on instruction-tuned
      models on structured QA, practitioners who deploy these methods are getting false
      confidence — and the field needs to know why.
    concrete_example: >
      A developer deploying SelfCheckGPT-NLI to flag Llama-3-8B hallucinations in a
      factual QA system would observe no improvement over random filtering.
    stakes: >
      Without understanding regime boundaries, hallucination detection methods will
      be deployed in settings where they are theoretically inapplicable, producing
      false assurance about model reliability.

# ============================================================================
# PROBLEM FRAMING (THREE LEVELS)
# ============================================================================

problem_framing:
  surface_problem:
    description: >
      Large language models hallucinate — generating factually incorrect outputs with
      high confidence — and this is a major obstacle to reliable deployment.
    common_understanding: >
      Standard approach: treat hallucination as stochastic uncertainty, use sampling-based
      methods (SelfCheckGPT, Semantic Uncertainty) to detect inconsistency across samples.

  deeper_problem:
    description: >
      Sampling-based consistency methods assume a "stochastic hallucination" regime:
      incorrect outputs arise from a broad, uncertain sampling distribution. This assumption
      was verified on GPT-3 open-ended generation (WikiBio), but is implicitly extended
      to instruction-tuned models on structured factual QA without empirical validation.
    why_overlooked: >
      Prior work (Manakul23, Kuhn23) focused on base or lightly-tuned models on
      open-ended generation tasks where the stochastic hallucination regime naturally
      holds. RLHF-fine-tuned instruction models were not the test case.
    our_perspective: >
      We operationalize the method identically to prior work (NLI-based pairwise consistency,
      N=10 samples, temperature=0.7) but on a representative instruction-tuned model
      (Llama-3-8B-Instruct) on structured factual QA (HaluEval), and measure whether
      the assumed regime actually holds.

  gap_in_existing_work:
    description: >
      No controlled evaluation of whether sampling-based consistency operates in the
      "stochastic hallucination" vs "systematic confabulation" regime for instruction-tuned
      models on structured factual QA tasks exists in the literature.
    why_gap_exists: >
      The theoretical foundations (Kuhn23, Manakul23) were developed on different models
      and task types. Regime boundary characterization was not the original experimental goal.
    why_gap_matters: >
      Practitioners and researchers extending these methods to instruction-tuned models
      and structured QA lack theoretical or empirical guidance on when the methods fail.

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  type: "observation_based"
  aha_moment:
    one_sentence: >
      RLHF fine-tuning produces "systematic confabulation" — instruction-tuned LLMs
      generate consistent outputs for both correct and wrong beliefs — rendering
      sampling-based consistency scores non-discriminative for hallucination detection.
    expanded_explanation: >
      When Llama-3-8B-Instruct generates N=10 samples per question at temperature=0.7,
      the mean NLI consistency score for correctly-labeled questions (0.6236) is
      essentially identical to hallucinated-labeled questions (0.6299), with a gap of
      only 0.006 — noise level over N=1000 questions. Both SMC-NLI (AUROC=0.4933)
      and SMC-Embed (AUROC=0.4859) fail at chance level.
      The model produces stable, confident outputs regardless of factual accuracy —
      a property that is desirable for deployment (consistency) but pathological for
      consistency-based hallucination detection (no discriminative signal).

  why_others_missed_it:
    common_assumptions: >
      Sampling-based consistency methods assume incorrect outputs arise from uncertainty —
      a model that doesn't know the answer samples across many possible answers, producing
      inconsistent outputs. This was validated empirically for GPT-3 on open-ended tasks.
    our_different_view: >
      RLHF fine-tuning changes the model's output distribution: even for factually incorrect
      beliefs, the model produces consistent (high-confidence) outputs because RLHF training
      reinforces specific answer patterns. The uncertainty is suppressed, not expressed.
    enabling_factor: >
      Using a dual-metric design (NLI + embedding) and a mechanism-level verification step
      (5-question local check + full-scale AUROC) allowed us to distinguish implementation
      failure from mechanism failure — critical for clean attribution of the negative result.

  what_makes_it_work:
    intuitive_explanation: >
      An instruction-tuned model is trained to be confident and consistent. When it's wrong,
      it's "confidently wrong" — every sample says the same incorrect thing. A detector
      looking for inconsistency finds none, regardless of whether the answer is right or wrong.
    key_mechanism: >
      RLHF sharpens the output distribution of instruction-tuned models, collapsing the
      semantic sampling distribution even for factually incorrect beliefs. This produces
      uniformly high SMC scores (consistent outputs) across both correct and hallucinated
      questions, eliminating the discriminative signal that sampling-based methods rely on.

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: >
      NLI-based sampling consistency (SMC-NLI, N=10 samples) achieves AUROC=0.4933 on
      HaluEval QA with Llama-3-8B-Instruct — indistinguishable from random. The failure
      is mechanism-level: the assumed hallucination regime (stochastic divergence) does
      not hold for this model-task combination.
    measurable_criteria: >
      AUROC < 0.55 for both SMC-NLI and SMC-Embed on N=1000 balanced questions;
      mean SMC score gap between correct/hallucinated < 0.01 (noise level);
      implementation correctness verified independently (14/14 tests pass).

  supporting_evidence:
    - id: "evidence_1"
      what: "SMC-NLI AUROC = 0.4933 (N=1000 balanced HaluEval questions)"
      so_what: "Below random (0.50) — not just failing to detect, actively slightly worse than guessing"
      how_it_supports_claim: "Primary metric failure demonstrates the detection mechanism produces no signal"
      figure: "auroc_comparison.png"

    - id: "evidence_2"
      what: "SMC-Embed AUROC = 0.4859 — independent embedding-based metric also fails"
      so_what: "Rules out NLI OOD as the explanation; the shared failure is in the underlying consistency assumption"
      how_it_supports_claim: "Dual metric failure makes the negative result more fundamental — it's not the scorer, it's the signal"
      figure: "auroc_comparison.png"

    - id: "evidence_3"
      what: "Mean SMC correct=0.6236, hallucinated=0.6299 (gap=0.006)"
      so_what: "Even a perfect classifier would achieve near-chance AUROC given these distributions overlap completely"
      how_it_supports_claim: "Mechanism verification: the assumed signal (high SMC for correct, low SMC for hallucinated) is empirically absent"
      figure: "smc_nli_distribution.png"

    - id: "evidence_4"
      what: "14/14 unit tests pass; 10,000 samples generated correctly; 45,000 NLI pairs scored"
      so_what: "Eliminates implementation error as a confound — the experiment is trustworthy"
      how_it_supports_claim: "Attribution: the failure belongs to the hypothesis, not the execution"

    - id: "evidence_5"
      what: "5-question mechanism verification passes; full-scale AUROC collapses to 0.49"
      so_what: "Local mechanism functions correctly; global discriminative power is absent"
      how_it_supports_claim: "Illustrates the distinction between 'score computation is valid' and 'scores predict labels'"
      figure: "roc_curves.png"

  surprising_findings:
    - finding: "Both NLI and embedding consistency fail equally at chance level"
      why_surprising: >
        Phase 2A predicted SMC-Embed as a fallback for NLI OOD failure. Both failing
        equally was not predicted — it forced a regime-level explanation rather than
        a scorer-specific fix.
      our_interpretation: >
        Both metrics measure the same underlying property (output consistency), and
        that property is uniformly high for Llama-3-8B-Instruct regardless of factual
        accuracy. The shared failure is mechanistic, not metric-specific.
      figure: "nli_vs_embed_scatter.png"

# ============================================================================
# BROADER IMPACT / TAKEAWAY
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: >
      We introduce the "stochastic hallucination" vs "systematic confabulation" regime
      distinction as a necessary prerequisite check for sampling-based hallucination
      detection, and demonstrate empirically that instruction-tuned LLMs on structured
      factual QA operate in the systematic confabulation regime where these methods fail.
    why_significant: >
      Provides the first regime-level characterization that explains when and why
      SelfCheckGPT-style methods fail — previously undocumented in the literature.

  implications:
    for_field: >
      Regime prerequisite checks should precede deployment of sampling-based detectors.
      Benchmark selection for hallucination detection evaluation matters: ChatGPT-label
      benchmarks (HaluEval) may not be valid for evaluating other models.
    for_practice: >
      Practitioners deploying SMC-style detectors on instruction-tuned models should
      first verify the model exhibits stochastic hallucination (open-ended generation
      tasks) rather than systematic confabulation (structured QA). Validated SMC
      infrastructure (LLMSampler, SMCNLIScorer, SMCEmbedScorer) is released for reuse.

  future_possibilities:
    immediate_extensions:
      - "Run SMC on WikiBio-style open-ended generation (Llama-3-8B) to verify stochastic hallucination regime holds there"
      - "Run SMC on TriviaQA with exact-match labels (model-agnostic) to isolate dataset-model mismatch effect"
      - "Temperature ablation (T ∈ 0.7–2.0) to test if higher T unlocks stochastic regime for instruction-tuned models"
    longer_term_vision: >
      A regime classification protocol that automatically determines whether a model-task
      combination exhibits stochastic or systematic hallucination, enabling practitioners
      to select appropriate detection methods.

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: infrastructure success + AUROC=0.49 + regime insight + implications"
    key_message: >
      SMC-NLI fails at chance level on instruction-tuned Llama-3-8B because RLHF
      produces systematic confabulation, not stochastic hallucination — revealing a
      fundamental regime boundary for sampling-based detection methods.
    tone: "confident, specific, theoretically grounded — this is a negative result with intellectual contribution"

  introduction:
    narrative_purpose: "Hook (counterintuitive finding) → Problem (regime assumption gap) → Insight (systematic confabulation) → Contributions preview"
    hook_strategy: "counterintuitive_finding"
    hook_sentence: >
      An NLI-based hallucination detector with a fully validated implementation —
      14 unit tests passing, 10,000 real LLM samples, 45,000 NLI pairs scored —
      achieves AUROC = 0.49 on a standard benchmark.
    transition_to_related: >
      Situate this finding against SelfCheckGPT (Manakul23) and Semantic Uncertainty
      (Kuhn23) to establish what was expected vs what was found.

  related_work:
    narrative_purpose: >
      Show prior work established stochastic hallucination regime validity for
      open-ended generation/base models → justify why our structured QA /
      instruction-tuned model setting is a critical unstudied gap.
    positioning_strategy: >
      We build on, not contradict, prior work — their findings hold in their regimes.
      Our contribution is characterizing where the regime assumption breaks.
    key_comparison_points:
      - "SelfCheckGPT (Manakul23): open-ended WikiBio, GPT-3 — stochastic hallucination regime"
      - "Semantic Uncertainty (Kuhn23): open-ended TriviaQA/NQ answers, smaller models — entropy signal holds"
      - "HaluEval (Li23): ChatGPT-generated labels — benchmark validity for cross-model evaluation"
      - "RLHF fine-tuning effects on LLM output distributions — instruction following vs uncertainty expression"

  methodology:
    narrative_purpose: >
      WHY this experimental design cleanly answers the research question:
      dual metric (NLI + embed), mechanism verification, implementation validation
    connection_to_insight: >
      Dual-metric design is the key methodological contribution: if NLI and embedding
      consistency both fail, the failure is mechanism-level (shared consistency assumption),
      not scorer-specific. This enables clean attribution.
    key_design_decisions:
      - "Dual metric (SMC-NLI + SMC-Embed): enables ruling out NLI OOD as explanation"
      - "Mechanism verification step (5-question local check): distinguishes 'broken code' from 'wrong hypothesis'"
      - "N=1000 balanced questions: sufficient statistical power for reliable AUROC"
      - "RLHF-fine-tuned instruction model (Llama-3-8B-Instruct): explicitly testing the practical deployment scenario"

  experiments:
    narrative_purpose: >
      Design tests that verify each layer of the research question:
      (1) does SMC work at all? (2) is the failure NLI-specific or regime-level?
      (3) is the implementation correct?
    experimental_questions:
      - "Q1: Does SMC-NLI achieve AUROC > 0.60 on HaluEval QA with Llama-3-8B-Instruct? (Existence check)"
      - "Q2: Does SMC-Embed achieve similar AUROC? (Rules out NLI OOD as confound)"
      - "Q3: Is the implementation correct? (Implementation validation)"
      - "Q4: What is the SMC score distribution by label? (Mechanism analysis)"

  results:
    narrative_purpose: >
      Present evidence layer by layer: primary metric failure → secondary metric failure →
      mechanism analysis → implementation validation
    main_result_highlight: >
      SMC-NLI AUROC=0.4933 and SMC-Embed AUROC=0.4859 — both at chance level
      despite correct implementation verified by 14/14 unit tests.
    narrative_order:
      - "Start with primary result (AUROC comparison bar chart)"
      - "Show ROC curves (near-diagonal — confirms chance-level, not just marginal)"
      - "Show SMC score distributions (overlapping histograms — mechanism falsified)"
      - "Show NLI vs Embed scatter (correlated failure — regime-level explanation)"
      - "Report implementation validation metrics (rules out confound)"

  discussion:
    narrative_purpose: >
      Interpret the finding theoretically (systematic confabulation regime), acknowledge
      limitations honestly (single model, HaluEval label mismatch), and scope implications.
    honest_limitations:
      - "Single model (Llama-3-8B-Instruct) — cannot generalize to all RLHF models"
      - "HaluEval labels may not match Llama's actual hallucination patterns (dataset-model mismatch)"
      - "Temperature ablation not run — whether T≥1.0 changes regime is unknown"
    key_interpretations:
      - "Systematic confabulation as RLHF artifact — consistent outputs even for wrong beliefs"
      - "Dataset-model mismatch as secondary confound — HaluEval labels are ChatGPT-specific"
      - "Regime classification as prerequisite for sampling-based methods"

  conclusion:
    narrative_purpose: "Callback to hook (perfect implementation, chance AUROC = deeper finding) + open future directions"
    callback_to_hook: >
      Return to the opening: the perfect implementation that failed is not a failure story —
      it is how we learned where the method's regime boundary lies. Future work inherits
      a validated infrastructure and a testable regime hypothesis.
    future_directions:
      - "SMC on open-ended generation (verify stochastic hallucination regime holds there)"
      - "TriviaQA with exact-match labels (isolate dataset-model mismatch)"
      - "Temperature ablation for instruction-tuned models"

