version: "1.0"
extracted_at: "2026-08-31T00:00:00+00:00"
paper_file: "06_paper.md"
hypothesis_id: "h-e1"
overall_result: "REFUTED — opposite direction, large effect"

# ============================================================
# PRIMARY METRICS (from 04_validation.md + 045_validated_hypothesis.md)
# ============================================================

metrics:
  primary:
    name: "MMLU/HellaSwag Generalization Balance Ratio"
    pythia_value: 0.565
    olmo_value: 0.538
    difference: -0.0265
    direction: "Pythia HIGHER (opposite to hypothesis)"
    ci_95: [-0.045, -0.007]
    p_value_one_sided: 0.004
    cohens_d: -2.732
    hypothesis_threshold: 0.02  # OLMo must exceed Pythia by this much
    result: "REFUTED"
    confidence: "HIGH"

  secondary:
    name: "ARC-Challenge/Easy Delta"
    pythia_delta: -0.334
    olmo_delta: -0.344
    direction: "Pythia less negative (opposite to hypothesis)"
    result: "REFUTED"
    confidence: "HIGH"

  individual_benchmarks:
    mmlu_5shot:
      pythia: 0.259
      olmo: 0.246
      winner: "Pythia"
    hellaswag_0shot:
      pythia: 0.458
      olmo: 0.458
      winner: "TIE (exact equality in fast eval)"
      note: "Structural finding — saturation at 300B tokens"
    arc_easy_25shot:
      pythia: 0.670
      olmo: 0.640
      winner: "Pythia"
    arc_challenge_25shot:
      pythia: 0.336
      olmo: 0.296
      winner: "Pythia"

# ============================================================
# METHODOLOGY GROUND TRUTH
# ============================================================

methodology:
  framework: "lm-evaluation-harness v0.4.12"
  evaluation_mode: "fast_eval (--limit 500)"
  hardware: "H100 NVL"
  bootstrap_iterations: 1000
  bootstrap_seed: 42
  token_match_tolerance: "0.5%"

  models:
    pythia:
      hf_id: "EleutherAI/pythia-6.9b"
      revision: "step143000"
      training_tokens_approx: "299.9B"
      deviation_from_300B: "-0.03%"
      architecture: "GPT-NeoX"
      corpus: "The Pile (minimal curation)"
    olmo:
      hf_id: "allenai/OLMo-7B"
      revision: "step68000-tokens301B"
      training_tokens_approx: "301B"
      deviation_from_300B: "+0.33%"
      architecture: "LLaMA-style"
      corpus: "Dolma (multi-stage curation)"

  evaluation_configs:
    mmlu: "5-shot, acc metric, 57 subjects"
    hellaswag: "0-shot, acc metric"
    arc_easy: "25-shot, acc metric"
    arc_challenge: "25-shot, acc_norm metric"

# ============================================================
# CLAIMS VERIFICATION
# ============================================================

claims:
  - claim: >
      At ~300B training tokens, Pythia-6.9B achieves a higher MMLU/HellaSwag ratio
      than OLMo-7B (0.565 vs 0.538, difference = −0.0265, 95% CI [−0.045, −0.007],
      Cohen's d = −2.732)
    location: "Abstract, Introduction, Results"
    verified: true
    source: "045_validated_hypothesis.md Section 2, 8.3"
    confidence: "HIGH"

  - claim: >
      Both models achieve identical HellaSwag 0-shot scores (0.458) at ~300B tokens
      regardless of corpus curation quality
    location: "Results (Section 5.3), Discussion, Abstract"
    verified: true
    source: "045_validated_hypothesis.md Section 4.2 Finding 1"
    confidence: "MEDIUM (fast eval; full evaluation recommended)"
    caveat: "500-sample limit; full evaluation may show small non-zero difference"

  - claim: >
      The direction of the ratio difference is opposite to the corpus-quality hypothesis
      prediction on ALL four individual benchmarks
    location: "Results Table 1"
    verified: true
    source: "045_validated_hypothesis.md Section 8.5 Evidence 4"
    confidence: "HIGH"

  - claim: >
      Per-subject MMLU heatmap shows Pythia's advantage is broadly distributed
      (inconsistent with domain-specific contamination)
    location: "Results Section 5.4"
    verified: "PLAUSIBLE"
    source: "figures/mmlu_heatmap.png — visual assessment"
    confidence: "MEDIUM"
    caveat: "Qualitative assessment only; Min-K% contamination analysis not performed"

  - claim: >
      Architecture confound (GPT-NeoX vs LLaMA-style) cannot be excluded as primary
      explanation
    location: "Discussion, Methodology, Introduction"
    verified: true
    source: "045_validated_hypothesis.md Section 6.1 L1, Section 4.2 Finding 2"
    confidence: "HIGH"

  - claim: >
      Fast evaluation (--limit 500) was used; full evaluation recommended to confirm magnitude
    location: "Methodology, Discussion L2"
    verified: true
    source: "045_validated_hypothesis.md Section 6.1 L2"
    confidence: "HIGH"

