# 06_narrative_blueprint.yaml
# Phase 6 Step 2: Narrative Design Blueprint
# Generated: 2026-08-31
# Research: Corpus Curation Quality → Generalization Balance

metadata:
  paper_type: "negative_result"
  target_venue: "ICML2025"
  hypothesis_id: "h-e1"
  overall_result: "REFUTED — opposite direction observed"
  narrative_strategy: "Counterintuitive finding — curated corpus model underperforms"

# ============================================================================
# HOOK
# ============================================================================

hook:
  strategy: "counterintuitive_finding"
  opening_statement:
    content: >
      We set out to measure whether better pre-training data produces more generalizable
      language models — and found the opposite: at 300 billion training tokens, OLMo-7B,
      trained on Dolma (one of the most carefully curated pre-training corpora to date),
      achieves a lower knowledge-to-commonsense ratio than Pythia-6.9B, trained on
      The Pile with minimal curation. More strikingly, both models converge to identical
      commonsense reasoning scores, suggesting that web-sourced commonsense knowledge
      saturates at similar levels regardless of curation quality at this training scale.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: >
      The assumption that better corpus curation produces better-generalized models drives
      enormous investment in data engineering across industry and academia — yet this
      assumption is rarely tested under controlled conditions.
    concrete_example: >
      OLMo-7B (Dolma) achieves MMLU/HellaSwag ratio = 0.538 vs Pythia-6.9B (The Pile)
      ratio = 0.565 (difference = −0.0265, 95% CI [−0.045, −0.007], Cohen's d = −2.732).
    stakes: >
      If curation quality does not produce detectable generalization advantages at intermediate
      training scales, then current evaluation practices — using single cross-architecture
      checkpoints — cannot validate the curation investment that dominates pre-training pipelines.

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: >
      Pre-training data quality is widely believed to determine model generalization —
      corpus curation, deduplication, and domain selection are among the most resource-intensive
      decisions in LLM development.
    common_understanding: >
      Better filtered, deduplicated, and quality-selected training data yields models
      with stronger benchmark performance and better generalization to unseen tasks.

  deeper_problem:
    description: >
      Despite widespread belief in curation benefits, no study has isolated curation
      quality effects from scale and architecture confounds at matched training token counts.
      Prior comparisons (RefinedWeb vs The Pile, Dolma ablations) conflate corpus quality
      with architecture choice, model size, and training duration.
    why_overlooked: >
      Cross-suite comparisons are convenient — models are publicly available — but they
      bundle architecture, tokenizer, and training recipe differences into a single comparison,
      making causal attribution impossible.
    our_perspective: >
      We ask: holding training scale constant (~300B tokens), does the MMLU/HellaSwag
      generalization balance ratio discriminate corpus curation quality in a cross-architecture
      comparison? The answer reveals not just a null result but a fundamental limitation
      of the metric and comparison methodology.

  gap_in_existing_work:
    description: >
      No prior work provides a matched-scale, published-checkpoint evaluation specifically
      testing whether MMLU/HellaSwag balance ratios track corpus curation quality.
    why_gap_exists: >
      The Pythia and OLMo model suites provide natural variation in documented data recipes,
      but they have not been compared at matched token counts for generalization balance metrics.
    why_gap_matters: >
      Without this test, the field cannot know whether current balance metrics are sensitive
      enough to detect curation effects — or whether cross-architecture comparisons can
      ever support causal claims about data quality.

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: >
      At ~300B training tokens, HellaSwag commonsense performance converges to identical
      values for both models (0.4580), collapsing the generalization balance ratio into
      a pure MMLU proxy that is itself architecture-confounded.
    expanded_explanation: >
      The MMLU/HellaSwag ratio was designed to measure generalization balance — whether a
      model's knowledge acquisition (MMLU) and commonsense reasoning (HellaSwag) grow in
      proportion. But when HellaSwag saturates identically at 300B tokens regardless of
      corpus quality, the ratio becomes purely a measure of MMLU differences — and MMLU
      differences between architecturally distinct models cannot be attributed to corpus quality.
      The metric's denominator ceased to discriminate at this scale.

  why_others_missed_it:
    common_assumptions: >
      That commonsense reasoning (HellaSwag) would remain differentiated across corpus
      qualities — prior work on Pythia-dedup showed small but nonzero HellaSwag gains
      from deduplication, implying HellaSwag does respond to corpus quality differences.
    our_different_view: >
      The deduplication gains in Pythia-dedup are within-architecture and small (< 0.02 absolute).
      Cross-architecture comparisons at 300B tokens may produce HellaSwag convergence that
      masks any corpus quality signal.
    enabling_factor: >
      Evaluating both models at matched training scales (~300B tokens) with the same
      evaluation protocol on the same hardware, revealing the exact-value convergence
      (0.4580 vs 0.4580) that would not be visible in cross-study comparisons.

  what_makes_it_work:
    intuitive_explanation: >
      By the time both 7B models have seen 300 billion tokens, they have both learned
      essentially the same commonsense reasoning — the web is the web, and web-sourced
      commonsense saturates early regardless of how carefully you filter it.
    key_mechanism: >
      HellaSwag commonsense performance reaches a scale-dependent ceiling for 6-8B models
      at ~300B tokens. At this ceiling, the ratio metric's discriminative power collapses;
      only MMLU (which continues to grow with scale and varies with architecture) drives
      ratio differences — making the ratio a poor proxy for curation quality in
      cross-architecture settings.

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: >
      At ~300B training tokens, Pythia-6.9B (The Pile, minimal curation) achieves a higher
      MMLU/HellaSwag ratio than OLMo-7B (Dolma, multi-stage curation), directly contradicting
      the corpus-quality → generalization-balance hypothesis.
    measurable_criteria: >
      ratio_diff = Pythia − OLMo = +0.0265; 95% CI [+0.007, +0.045] favoring Pythia;
      one-sided p=0.996 (against OLMo being higher); Cohen's d = −2.732 (large effect).

  supporting_evidence:
    - id: "evidence_1"
      what: "MMLU/HellaSwag ratio: Pythia=0.565, OLMo=0.538; difference=−0.0265, CI=[−0.045,−0.007]"
      so_what: >
        The primary metric used to test the hypothesis shows the opposite direction with
        high statistical confidence. This is not noise — it is a large, well-bounded effect.
      how_it_supports_claim: "Primary metric — directly falsifies P1"
      figure: "fig_2 (ratio_delta.png)"

    - id: "evidence_2"
      what: "HellaSwag: both models = 0.4580 (exact equality in fast eval)"
      so_what: >
        The denominator of the ratio metric has collapsed to a constant, revealing that
        the ratio cannot discriminate corpus quality via the commonsense pathway.
      how_it_supports_claim: "Structural explanation for why the ratio fails as a quality metric"
      figure: "fig_1 (absolute_scores.png)"

    - id: "evidence_3"
      what: "ARC-Challenge/Easy delta: Pythia=−0.334, OLMo=−0.344 (OLMo more negative)"
      so_what: >
        A second generalization balance metric also shows Pythia performing no worse than
        OLMo, confirming the directional refutation is not metric-specific.
      how_it_supports_claim: "Secondary metric — independently falsifies P2"
      figure: "fig_1 (absolute_scores.png)"

    - id: "evidence_4"
      what: "All four benchmark metrics favor Pythia: MMLU 0.259>0.246, HellaSwag tied, ARC-Easy 0.670>0.640, ARC-Challenge 0.336>0.296"
      so_what: >
        Consistent directional refutation across four independent benchmarks makes the
        result robust to choice of aggregation method.
      how_it_supports_claim: "Robustness check — falsification is not metric-specific"
      figure: "fig_1 (absolute_scores.png)"

    - id: "evidence_5"
      what: "Bootstrap distribution of ratio differences: 95% CI entirely negative (OLMo − Pythia)"
      so_what: >
        Statistical methodology is robust — the CI excludes zero, but in the wrong direction
        relative to the hypothesis. The bootstrap procedure confirms this is not sampling artifact.
      how_it_supports_claim: "Statistical validity of the falsification"
      figure: "fig_4 (bootstrap_dist.png)"

    - id: "evidence_6"
      what: "Per-subject MMLU heatmap: Pythia advantage is broad across 61 subjects, not concentrated in few domains"
      so_what: >
        If Pythia's MMLU advantage were concentrated in web-common domains, contamination
        would be a plausible explanation. Broad advantage makes contamination less likely.
      how_it_supports_claim: "Contamination control analysis"
      figure: "fig_3 (mmlu_heatmap.png)"

  surprising_findings:
    - finding: "HellaSwag scores are exactly identical (0.4580) for both models at ~300B tokens"
      why_surprising: >
        Prior work (Biderman et al. 2023) shows Pythia-dedup achieves small HellaSwag gains
        from deduplication, suggesting HellaSwag responds to corpus quality. Cross-architecture
        comparison at 300B produces zero discrimination.
      our_interpretation: >
        Commonsense reasoning (HellaSwag) reaches a scale-dependent saturation point for
        6-8B models at ~300B tokens, making it an unsuitable denominator for generalization
        balance ratios at this training scale.

    - finding: "Pythia outperforms OLMo on MMLU despite The Pile having lower documented curation"
      why_surprising: >
        Dolma includes S2ORC semantic scholar papers and Wikipedia explicitly intended to
        boost knowledge acquisition — yet OLMo achieves lower MMLU at 300B tokens.
      our_interpretation: >
        Architecture difference (GPT-NeoX vs LLaMA-style) likely dominates corpus quality
        effects at this training scale for few-shot multiple-choice tasks. Alternatively,
        300B tokens is insufficient for Dolma's academic content advantage to manifest.

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: >
      We demonstrate that the MMLU/HellaSwag generalization balance ratio does not
      discriminate corpus curation quality at ~300B tokens in cross-architecture comparisons,
      and establish the conditions (HellaSwag saturation, architecture confound) that
      explain this failure.
    why_significant: >
      Null results with clear scope conditions are rare but methodologically valuable —
      this result defines where current evaluation metrics and comparison designs break down,
      preventing future researchers from drawing causal claims from architecturally confounded
      single-checkpoint comparisons.

  implications:
    for_field: >
      Evaluation metric design for corpus quality claims must account for saturation effects
      in the denominator task; MMLU/HellaSwag ratios are unreliable quality discriminators
      at intermediate training scales. Cross-architecture comparisons require temporal trajectory
      analysis or architecture-matched designs before any causal attribution is valid.
    for_practice: >
      Practitioners using cross-suite model comparisons to justify curation choices should
      validate that their chosen metrics remain discriminative at their target training scale
      before drawing dataset-quality conclusions.

  future_possibilities:
    immediate_extensions: >
      (1) Temporal trajectory at 143B and 300B tokens to test whether gap is widening
      (quality-driven) or stable (architecture-driven); (2) Architecture-matched comparison
      using two LLaMA-style models trained on The Pile vs Dolma subsets at small scale (1-3B);
      (3) Alternative balance metrics (GSM8K/HellaSwag, MMLU/WinoGrande) to test metric specificity.
    longer_term_vision: >
      Design of generalization balance metrics that remain sensitive across training scales —
      either through dynamic task selection or through metrics that explicitly model the
      saturation curve of the denominator task.

# ============================================================================
# SECTION-LEVEL GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: counterintuitive result + scope-qualified null + insight + implications"
    key_message: >
      Better curation ≠ better generalization balance at 300B tokens — HellaSwag convergence
      reveals metric limitation, not just a null data quality effect.
    tone: "Scientifically precise, counterintuitive framing, honest about scope"

  introduction:
    narrative_purpose: "Hook → Problem → Insight preview → Contributions (as story)"
    hook_strategy: "counterintuitive_finding"
    opening: >
      Open with the counterintuitive empirical finding — the curated-corpus model performs
      worse on the metric designed to capture curation benefits.
    problem_arc: "Level 1 (curation investment) → Level 2 (no matched-scale test) → Level 3 (metric reliability gap)"
    insight_preview: "HellaSwag convergence as the structural explanation"
    contributions_framing: >
      Frame contributions as a set of empirical + methodological findings, not as claims
      of superiority. This is a paper about what we CANNOT conclude and why.
    transition_to_related: >
      After establishing the gap, pivot to showing prior work either used unmatched scales
      or different architectures — motivating exactly our matched-scale test.

  related_work:
    narrative_purpose: "Show three bodies of work → each insufficient → our contribution fills the gap"
    positioning_strategy: >
      Position against: (1) data curation studies (RefinedWeb, Dolma, Pythia-dedup) —
      all lack matched-scale cross-quality comparison; (2) benchmark evaluation work —
      established MMLU/HellaSwag as standard but didn't test ratio sensitivity to data quality;
      (3) data attribution methods (TRAK, DataInf) — don't address generalization balance directly.
    key_comparison_points:
      - "Biderman et al. 2023 (Pythia-dedup): small HellaSwag gains from deduplication — within-architecture only"
      - "Penedo et al. 2023 (RefinedWeb): filtering helps on average — no matched-scale test, different arch"
      - "Groeneveld et al. 2024 (OLMo/Dolma): academic content improves MMLU — full training only (2T tokens)"
      - "Muennighoff et al. 2023: data quality × token count interaction — supports our scale-specific null"
    tone: >
      Build-on, not tear-down. Prior work established important foundations; our study
      tests a specific combination that none of them addressed.

  methodology:
    narrative_purpose: "WHY this design isolates (or fails to isolate) the quality effect — honest from the start"
    connection_to_insight: >
      The matched-scale design was chosen to eliminate the most common confound (training duration);
      the architecture confound (GPT-NeoX vs LLaMA-style) is explicitly acknowledged as a
      limitation that temporal trajectory was intended to address.
    key_design_decisions:
      - "Model selection: Pythia-6.9B (step143000 ≈ 299.9B tokens) and OLMo-7B (step68000 ≈ 301B tokens)"
      - "Matched training tokens: both within 0.5% of 300B (verified from public training logs)"
      - "Evaluation: lm-evaluation-harness v0.4.12, standardized shots (MMLU 5-shot, HellaSwag 0-shot, ARC 25-shot)"
      - "Fast eval protocol: --limit 500 for rapid screening; implications for variance discussed"
      - "Statistical analysis: bootstrap CI (1000 iterations) on ratio difference; Cohen's d"
      - "Primary metric: MMLU/HellaSwag ratio; secondary: ARC-Challenge/Easy delta"
    subsections:
      - "Model Selection and Training Scale Matching"
      - "Evaluation Protocol"
      - "Statistical Analysis"
      - "Limitations of the Comparison Design"

  experiments:
    narrative_purpose: "Present the experimental questions, then show how each maps to a specific test"
    experimental_questions:
      - "EQ1: Does OLMo-7B achieve a higher MMLU/HellaSwag ratio than Pythia-6.9B at ~300B tokens? (Tests P1)"
      - "EQ2: Does OLMo-7B achieve a less-negative ARC-Challenge/Easy delta than Pythia-6.9B? (Tests P2)"
      - "EQ3: Are per-subject MMLU score patterns consistent with or against a contamination explanation?"
    subsections:
      - "Models and Checkpoints"
      - "Evaluation Tasks and Metrics"
      - "Statistical Analysis Protocol"
      - "Hardware and Reproducibility"

  results:
    narrative_purpose: "Lead with the surprising finding, then systematically support it from every angle"
    main_result_highlight: >
      Pythia-6.9B achieves higher MMLU/HellaSwag ratio than OLMo-7B (0.565 vs 0.538,
      difference = −0.0265, 95% CI [−0.045, −0.007], p=0.996, d=−2.732) — opposite to hypothesis.
    result_order:
      - "Primary: Ratio comparison with bootstrap CI (Figure 2 — ratio_delta.png)"
      - "Secondary: All four benchmark scores side-by-side (Figure 1 — absolute_scores.png)"
      - "Analysis: HellaSwag convergence highlighted — the metric insight"
      - "Analysis: Per-subject MMLU heatmap (Figure 3 — mmlu_heatmap.png)"
      - "Statistical: Bootstrap distribution (Figure 4 — bootstrap_dist.png)"
    tone: "Report honestly, interpret carefully — distinguish 'refuted' from 'curation doesn't matter'"

  discussion:
    narrative_purpose: "Interpret WHY — three competing explanations, honest limitations, broader implications"
    competing_explanations_order:
      - "Most likely: Architecture difference (GPT-NeoX efficiency advantage) — HIGH plausibility"
      - "Also plausible: Training scale insufficient at 300B for Dolma advantage — HIGH plausibility"
      - "Less likely: The Pile MMLU contamination inflating Pythia — LOW-MEDIUM plausibility"
    honest_limitations:
      - "L1: Architecture confound not bounded (temporal trajectory not executed)"
      - "L2: Fast evaluation (500-sample limit); full evaluation needed for magnitude claims"
      - "L3: Single training scale; results specific to ~300B tokens"
      - "L4: Corpus quality IV never directly measured (P3 not executed)"
    metric_design_implications: >
      Core insight: HellaSwag denominator saturation makes the ratio metric unreliable
      as a quality discriminator at this scale. Future metric design should verify
      denominator sensitivity before using ratios as quality proxies.
    transition_to_conclusion: >
      Despite the null result on the original hypothesis, the study reveals clear
      methodological guidance — and a tractable path to a definitive test.

  conclusion:
    narrative_purpose: "Callback to hook + crystallize the three-line takeaway + open future"
    callback_to_hook: >
      We set out to measure whether better data produces more generalizable models.
      The answer at 300B tokens, for this model pair and this metric, is: not detectably so —
      and now we understand why.
    three_line_takeaway:
      - "The MMLU/HellaSwag ratio does not discriminate corpus curation quality at ~300B tokens in cross-architecture settings."
      - "HellaSwag commonsense performance converges for 6-8B models at this scale, collapsing the ratio into a noisy MMLU proxy."
      - "Definitive tests require architecture-matched pairs or temporal trajectory analysis — not single cross-suite checkpoints."
    future_opening: >
      The path forward is clear: small-scale architecture-matched experiments (1-3B models,
      10B tokens, same architecture, different corpora) can test the corpus quality hypothesis
      without the confounds that limited this study.

