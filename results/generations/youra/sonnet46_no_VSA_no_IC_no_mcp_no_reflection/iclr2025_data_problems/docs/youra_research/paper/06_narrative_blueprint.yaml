  - check: "Each section flows naturally to the next"
    status: "VERIFIED — Intro establishes gap → Related frames prior insufficiency → Method explains design → Results shows refutation → Discussion interprets → Conclusion closes"
  - check: "Key insight (HellaSwag saturation) consistently emphasized throughout"
    status: "VERIFIED — appears in hook, insight section, Results, Discussion, Conclusion"
  - check: "All major claims supported by specific evidence with figures"
    status: "VERIFIED — each claim mapped to figure + statistical evidence"
