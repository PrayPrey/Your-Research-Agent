# ============================================================================
# FIGURE ASSIGNMENTS
# ============================================================================

figure_assignments:
  fig_1:
    file: "absolute_scores.png"
    section: "results"
    caption_draft: >
      Benchmark performance comparison between Pythia-6.9B (The Pile, ~300B tokens) and
      OLMo-7B (Dolma, ~300B tokens). Pythia achieves higher scores on MMLU, ARC-Easy,
      and ARC-Challenge; both models achieve identical HellaSwag scores (0.458).
      Error bars represent bootstrap 95% confidence intervals.
    placement: "Results — first figure"

  fig_2:
    file: "ratio_delta.png"
    section: "results"
    caption_draft: >
      MMLU/HellaSwag generalization balance ratio for Pythia-6.9B and OLMo-7B at ~300B
      training tokens. Pythia achieves ratio = 0.565; OLMo achieves ratio = 0.538.
      Difference = −0.0265 (95% CI [−0.045, −0.007], p=0.996, Cohen's d = −2.732).
      The direction is opposite to the corpus-quality hypothesis prediction.
    placement: "Results — primary metric figure"

  fig_3:
    file: "mmlu_heatmap.png"
    section: "results"
    caption_draft: >
      Per-subject MMLU accuracy heatmap across 61 MMLU subjects for Pythia-6.9B (left)
      and OLMo-7B (right). Pythia's advantage is broadly distributed across subjects,
      inconsistent with a domain-specific contamination explanation.
    placement: "Results — MMLU analysis"

  fig_4:
    file: "bootstrap_dist.png"
    section: "results"
    caption_draft: >
      Bootstrap distribution (1000 iterations) of the MMLU/HellaSwag ratio difference
      (OLMo − Pythia). The null hypothesis value (0, dashed) and the a priori threshold
      (+0.02, dotted) are shown. The 95% CI [−0.045, −0.007] lies entirely below zero,
      confirming the directional refutation.
    placement: "Results — statistical analysis"

