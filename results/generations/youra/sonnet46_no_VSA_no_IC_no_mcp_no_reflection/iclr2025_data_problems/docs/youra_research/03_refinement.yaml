    hypothesis_fit: >
      The Pile (The Pile, minimal curation, 825GB) provides the low-curation baseline.
      Dolma (3T tokens, multi-stage quality filtering across 7 documented sources) provides
      the high-curation comparison. Both are publicly available with documented recipes.
  model:
    name: "Pythia-6.9B (intermediate checkpoint ~300B tokens) and OLMo-7B (intermediate checkpoint ~300B tokens)"
    type: "decoder-only transformer"
    source: "EleutherAI/pythia-6.9b and allenai/OLMo-7B-hf on HuggingFace Hub"
    hypothesis_fit: >
      Pythia-6.9B and OLMo-7B are matched in parameter count; both release intermediate
      checkpoints enabling matched-token-count comparison. Both supported natively by
      lm-evaluation-harness.
  baselines:
    - name: "Pythia-6.9B (full training)"
      method: "Standard Pythia-6.9B at end of training (300B tokens); lm-evaluation-harness"
    - name: "Pythia-dedup-6.9B"
      method: "Pythia deduplicated variant — existing dedup ablation from Biderman et al. 2023"
    - name: "GPT-J-6B (same architecture family as Pythia, different scale)"
