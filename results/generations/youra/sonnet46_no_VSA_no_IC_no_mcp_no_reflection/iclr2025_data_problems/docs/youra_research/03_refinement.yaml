# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: >
    First study to compare Pythia and OLMo at matched training token count using intermediate
    checkpoints. First application of a multi-proxy corpus quality index to predict OOD
    generalization balance (MMLU/HellaSwag ratio, ARC-Challenge/Easy delta) rather than
    average benchmark performance. First temporal trajectory analysis to distinguish data
    quality effects from architecture effects in this comparison.
  key_innovation: >
    Reframing the Pythia model suite as a "corpus quality variation testbed" rather than a
    training dynamics suite, combined with matched-scale cross-suite comparison using
    intermediate checkpoints — enabling an archival experiment (no new training required)
    that tests the core curation quality → generalization balance hypothesis.
  differentiation:
    - prior_work: "Penedo et al. 2023 (RefinedWeb)"
      difference: "RefinedWeb uses Falcon architecture; no matched token count; no OOD/ID balance metric; no temporal trajectory"
    - prior_work: "Abbas et al. 2023 (D4)"
      difference: "D4 uses different architecture and benchmarks from Pythia; no cross-suite curation comparison"
    - prior_work: "Biderman et al. 2023 (Pythia dedup ablation)"
      difference: "Pythia dedup only varies one curation dimension; no cross-suite comparison; no quality proxy index"
    - prior_work: "Muennighoff et al. 2023 (Scaling Data-Constrained LMs)"
      difference: "Focuses on quantity-quality tradeoff at small scale; no multi-proxy quality index; no OLMo comparison"

