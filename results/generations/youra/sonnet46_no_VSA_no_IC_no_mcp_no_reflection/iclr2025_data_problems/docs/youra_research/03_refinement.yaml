# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Deduplication improves benchmark performance on some tasks (shown by Pythia-dedup vs Pythia comparison)"
      status: "BUILD_ON"
      evidence: "Biderman et al., 2023 (arXiv:2304.01373) — Pythia deduplication ablation"
    - claim: "Web data filtering outperforms unfiltered data on average benchmark performance"
      status: "BUILD_ON"
      evidence: "Penedo et al., 2023 (arXiv:2306.01116) — RefinedWeb vs The Pile on Falcon"
    - claim: "Domain mixing ratios affect benchmark performance profile"
      status: "BUILD_ON"
      evidence: "Groeneveld et al., 2024 (arXiv:2402.00838) — OLMo Dolma domain ablations"
    - claim: "No study has matched training token count when comparing curated vs. uncurated model suites"
      status: "PROVE_NEW"
      evidence: "Gap identified in Phase 1 literature survey — cross-study comparison confounded by scale"
    - claim: "Corpus quality predicts OOD/ID generalization balance at matched training scale"
      status: "PROVE_NEW"
      evidence: "Core hypothesis — untested in existing literature"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    The established facts (deduplication helps, filtering helps, domain mix matters) are
    BUILD_ON claims — do not re-verify these, use them as motivating context.
    The PROVE_NEW claims (matched-scale comparison, quality predicts generalization balance)
    are the core experimental contributions that Phase 2B must validate through execution.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-CorpusQualityGenBalance-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under a controlled matched-training-scale comparison (~300B tokens) between foundation
    models trained on corpora of differing curation quality, if corpus curation quality is
    higher (as measured by n-gram repetition rate, Flesch-Kincaid grade level, and language
    ID confidence applied to representative domain samples), then models will show better
    OOD-to-ID generalization balance (higher MMLU/HellaSwag performance ratio and higher
    ARC-Challenge/Easy performance delta), because higher-quality data contains less noise
    and fewer style-specific artifacts, allowing the model to learn more generalizable
    representations rather than domain-specific statistical patterns.
  alternative_hypothesis_h0: |
    There is no significant difference in MMLU/HellaSwag performance ratio or
    ARC-Challenge/Easy performance delta between Pythia-6.9B (The Pile, low curation)
    and OLMo-7B (Dolma, high curation) at approximately matched training token count
    (~300B tokens), after accounting for architecture differences via temporal trajectory
    analysis.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Corpus Curation Quality Level"
      type: "categorical"
      operationalization: "Training corpus identity: The Pile (low curation, Pythia) vs. Dolma (high curation, OLMo)"
      levels: ["Low curation (The Pile)", "High curation (Dolma)"]
    - name: "Corpus Quality Proxy Score"
      type: "continuous"
      operationalization: >
        Unweighted composite of three proxy metrics computed on 10K document samples
        per training corpus: (1) 1 - n-gram repetition rate (higher = less repetitive),
        (2) Flesch-Kincaid grade level normalized 0-1 (higher = more complex), (3) fastText
        language ID confidence (higher = cleaner language). Range: [0, 1].
  dependent:
    - name: "MMLU/HellaSwag Performance Ratio"
      type: "continuous"
      operationalization: >
        (MMLU 5-shot accuracy) / (HellaSwag 0-shot accuracy). Measures knowledge-to-commonsense
        balance. Range: typically 0.5-1.5 for 7B models. Higher = better OOD generalization balance.
      primary: true
    - name: "ARC-Challenge minus ARC-Easy Delta"
      type: "continuous"
      operationalization: >
        (ARC-Challenge 25-shot accuracy) - (ARC-Easy 25-shot accuracy). Negative values expected.
        Less negative = better maintenance of reasoning difficulty sensitivity.
      primary: false
    - name: "TruthfulQA mc2 accuracy"
      type: "continuous"
      operationalization: "TruthfulQA multiple-choice accuracy (mc2 metric), 0-shot, via lm-evaluation-harness"
      primary: false
  controlled:
    - name: "Training token count"
      operationalization: "Use intermediate checkpoints at ~300B tokens for both models; verify exact counts from checkpoint metadata"
    - name: "Evaluation framework"
      operationalization: "lm-evaluation-harness v0.4+ for all benchmark runs; identical prompt formats"
    - name: "Benchmark test sets"
      operationalization: "Standard HuggingFace dataset versions for MMLU, HellaSwag, ARC-E/C, WinoGrande, TruthfulQA"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: >
        Higher corpus curation quality reduces training noise: fewer repetitive n-grams, less
        boilerplate, more consistent language. This reduces the proportion of training signal
        that encodes domain-specific stylistic artifacts.
      evidence: "Penedo et al. 2023: aggressive filtering removed 88% of web tokens, retaining higher-quality signal"
      falsifier: "If high-quality corpus sub-domains show equal n-gram repetition rates to low-quality sub-domains, step 1 fails"
    - step: 2
      description: >
        Reduced training noise allows gradient updates to encode more generalizable semantic
        and syntactic patterns rather than domain-specific distributional shortcuts.
      evidence: "Theoretical: consistent with neural scaling law literature showing data quality × token count interaction"
      falsifier: "If intermediate Pythia checkpoints show no gradient variance reduction in high-quality sub-domain training batches vs. low-quality, step 2 fails"
    - step: 3
      description: >
        More generalizable representations produce better transfer from commonsense-heavy tasks
        (HellaSwag) to knowledge-intensive tasks (MMLU), yielding a higher MMLU/HellaSwag ratio.
      evidence: "OLMo Dolma domain ablations show higher academic paper ratio → higher MMLU; consistent with generalization claim"
      falsifier: "If MMLU improvement from Dolma curation is not accompanied by maintained HellaSwag performance, step 3 fails"
    - step: 4
      description: >
        The quality-induced generalization advantage accumulates with training tokens, producing
        a widening performance gap between curated and uncurated models as training progresses.
      evidence: "Temporal trajectory prediction: novel, tested by comparing Pythia vs. OLMo at 143B and 300B token checkpoints"
      falsifier: "If the Pythia vs. OLMo gap is constant or shrinking with token count, step 4 fails (architecture, not data, drives the effect)"
  key_tension: >
    Architecture confound (GPT-Neo vs. LLaMA-style) vs. data quality effect: the temporal
    trajectory analysis is the key distinguisher, but cannot fully eliminate architectural
    differences as a confound.
  evidence_summary: |
    The mechanism is supported by: (1) filtering quality literature showing noise reduction
    improves benchmark averages (Penedo 2023, Abbas 2023); (2) OLMo domain ablations showing
    academic content improves MMLU specifically (Groeneveld 2024); (3) theoretical consistency
    with scaling law interactions between data quality and training tokens (Muennighoff 2023).
    The temporal trajectory test is the primary novel evidence.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Intermediate checkpoints for Pythia-6.9B and OLMo-7B are available at approximately matched training token counts (~300B)"
    supporting_evidence: "Pythia releases 154 checkpoints; OLMo releases intermediate checkpoints — both on HuggingFace Hub"
    consequence_if_violated: "Primary matched-scale comparison (P1) is undermined; fallback to extrapolation with wider confidence intervals"
  - id: "A2"
    assumption: "n-gram repetition rate, Flesch-Kincaid grade level, and language ID confidence are valid proxies for curation quality relevant to downstream generalization"
    supporting_evidence: "Each proxy captures a distinct quality dimension: repetition (dedup quality), readability (syntactic complexity), language purity (noise reduction)"
    consequence_if_violated: "The quality index lacks construct validity; results could be attributed to proxy measurement error rather than true curation quality"
  - id: "A3"
    assumption: "The Pile sub-domain mixing ratios are identical across all Pythia model sizes"
    supporting_evidence: "Biderman et al. 2023 explicitly states same data order for all Pythia models"
    consequence_if_violated: "Within-Pythia P3 analysis is compromised; mixing ratio variation would add a confound"
  - id: "A4"
    assumption: "Architecture differences (GPT-Neo vs. LLaMA-style) can be bounded by temporal trajectory analysis without fully confounding the curation quality effect"
    supporting_evidence: "If architecture drives the effect, gap appears at minimal tokens; if data quality drives it, gap widens with tokens"
    consequence_if_violated: "Causal attribution to data quality is not possible; results can only be described as observational"
  - id: "A5"
    assumption: "Benchmark contamination rates differ between The Pile and Dolma in a direction that could inflate OLMo's apparent performance advantage"
    supporting_evidence: "Dolma explicitly filtered near-duplicate content including potentially benchmark test set content"
    consequence_if_violated: "Performance difference could be partially or wholly explained by contamination rather than generalization quality; mitigated by Min-K% secondary analysis"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    Foundation language models in the 6-8B parameter range trained for approximately 300B
    tokens on large web-scraped corpora. Comparison between corpora with documented, distinct
    curation philosophies (minimal filtering vs. multi-stage quality filtering). Evaluation on
    standard NLP benchmarks measurable via lm-evaluation-harness.
  does_not_apply_to: |
    Models below 1B parameters (different scaling dynamics); models trained for >1T tokens
    (scale may dominate quality effects); instruction-tuned or RLHF-trained models (alignment
    introduces additional confounds); benchmarks not in the standard lm-evaluation-harness suite;
    code-focused or domain-specific pre-training objectives.
  known_limitations: |
    (1) Only two corpora compared — cannot generalize to arbitrary curation levels without
    additional data points. (2) Architecture confound cannot be fully eliminated. (3) Token
    count matching is approximate (~300B) not exact. (4) Quality proxy index is unweighted —
    may not capture the most relevant quality dimensions for downstream generalization.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: >
      OLMo-7B at ~300B training tokens shows a higher MMLU/HellaSwag performance ratio
      than Pythia-6.9B at ~300B training tokens.
    test_method: >
      Run lm-evaluation-harness with MMLU (5-shot) and HellaSwag (0-shot) on both
      intermediate checkpoints. Compute ratio. Compare with unpaired t-test across 3 random
      prompt subsamples (bootstrap confidence intervals).
    success_criterion: "Ratio difference OLMo - Pythia > 0.02 absolute, Cohen's d > 0.2, p < 0.05"
    falsification: "Ratio difference ≤ 0.02 absolute, OR confidence intervals overlap at α = 0.05"
  - id: "P2"
    primary: false
    statement: >
      OLMo-7B shows higher ARC-Challenge minus ARC-Easy performance delta (less negative)
      than Pythia-6.9B at matched training token count.
    test_method: >
      Run ARC-Easy (25-shot) and ARC-Challenge (25-shot) on both checkpoints via lm-evaluation-harness.
      Compute delta. Compare directionally.
    success_criterion: "OLMo ARC delta > Pythia ARC delta (directional, p < 0.10)"
    falsification: "OLMo ARC delta ≤ Pythia ARC delta"
  - id: "P3"
    primary: false
    statement: >
      Across Pile sub-domains, composite quality proxy score (n-gram repetition rate +
      Flesch-Kincaid + language ID confidence) positively correlates with the Pythia-6.9B
      benchmark performance contribution from that sub-domain.
    test_method: >
      Compute quality proxy scores for 10K document samples from each of 22 Pile sub-domains.
      Use Pythia data indices to estimate per-sub-domain exposure. Regress sub-domain quality
      scores against Pythia-6.9B benchmark performance profile (estimated by sub-domain
      performance attribution via held-out sub-domain experiments if data indices allow).
    success_criterion: "Pearson r > 0.3, p < 0.05 across ≥3 of 5 benchmarks (MMLU, HellaSwag, ARC-E, ARC-C, TruthfulQA)"
    falsification: "r < 0.3 or p > 0.05 across all 5 benchmarks"

