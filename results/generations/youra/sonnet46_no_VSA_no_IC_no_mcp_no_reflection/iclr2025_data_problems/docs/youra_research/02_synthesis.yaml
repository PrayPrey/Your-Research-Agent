hypothesis_draft:
  title: "Corpus Quality as a Predictor of Generalization Balance: A Matched-Scale Analysis of Pythia and OLMo"
  hypothesis_id: "H-CorpusQualityGenBalance-v1"
  core_claim: |
    Within a controlled matched-training-scale comparison (~300B tokens), models trained on
    more curated corpora (OLMo-7B on Dolma) show better OOD-to-ID generalization balance —
    measured as higher MMLU/HellaSwag performance ratio and higher ARC-Challenge/Easy
    performance delta — than models trained on less curated corpora (Pythia-6.9B on The Pile),
    because higher-quality data produces less noisy gradient signal and more generalizable
    representations.
  mechanism: |
    (1) Higher corpus curation quality reduces training noise (less repetitive content,
    more syntactically complex text, higher language purity). (2) Reduced noise allows
    gradient updates to encode generalizable semantic/syntactic patterns rather than
    domain-specific shortcuts. (3) More generalizable representations produce better transfer
    across diverse task types (knowledge vs. commonsense vs. reasoning), yielding a higher
    MMLU/HellaSwag ratio and higher ARC-Challenge/Easy delta. (4) The advantage accumulates
    with training tokens, producing a widening gap (temporal trajectory signature).
  predictions:
    - P1: "OLMo-7B MMLU/HellaSwag ratio > Pythia-6.9B ratio at ~300B tokens (d > 0.2, p < 0.05)"
    - P2: "OLMo-7B ARC-Challenge minus ARC-Easy delta > Pythia-6.9B delta at matched token count (directional, p < 0.10)"
    - P3: "Pile sub-domain quality proxy scores correlate positively with Pythia-6.9B benchmark performance across ≥3/5 benchmarks (r > 0.3, p < 0.05)"

variables_summary:
  independent: "Corpus curation level (The Pile vs. Dolma) and composite quality proxy score (n-gram repetition rate + Flesch-Kincaid grade + language ID confidence)"
  dependent_primary: "MMLU/HellaSwag performance ratio (primary); ARC-Challenge/Easy delta (secondary); TruthfulQA mc2 accuracy (tertiary)"
  controlled: "Training token count (~300B via intermediate checkpoints), evaluation framework (lm-evaluation-harness), benchmark test set versions"

null_hypothesis:
  h0_statement: |
    There is no significant difference in MMLU/HellaSwag performance ratio or
    ARC-Challenge/Easy performance delta between Pythia-6.9B and OLMo-7B at approximately
    matched training token count (~300B tokens). Corpus curation quality level does not
    predict OOD-to-ID generalization balance when training scale is controlled.
  statistical_test: "Unpaired t-test with bootstrap confidence intervals (3 random prompt subsamples)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: >
    First matched-scale Pythia vs. OLMo comparison using intermediate checkpoints;
    first multi-proxy corpus quality index applied to OOD generalization balance metrics;
    first temporal trajectory analysis to distinguish data quality from architecture effects.
  differentiation_summary: |
    Prior work (RefinedWeb, D4, DSIR, Pythia dedup) studied curation effects in isolation
    with different architectures, benchmarks, and token counts — making cross-study
    comparison unreliable. This study introduces: (1) matched training scale, (2) a
    multi-proxy quality index applicable to any corpus, (3) OOD/ID balance metrics rather
    than average performance, and (4) temporal trajectory as a confound-bounding strategy.

