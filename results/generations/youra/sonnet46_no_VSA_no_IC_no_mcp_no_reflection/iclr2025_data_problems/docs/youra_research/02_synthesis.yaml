experimental_scope:
  models:
    - "Pythia-6.9B (EleutherAI/pythia-6.9b, intermediate checkpoint at ~300B tokens)"
    - "OLMo-7B (allenai/OLMo-7B-hf, intermediate checkpoint at ~300B tokens)"
    - "GPT-J-6B (architectural null baseline)"
    - "Pythia-6.9b-dedup (within-suite dedup ablation baseline)"
  datasets:
    - "The Pile (EleutherAI/pile) — 10K samples per sub-domain for quality proxy computation"
    - "Dolma (allenai/dolma) — 10K samples per source for quality proxy computation"
    - "MMLU, HellaSwag, ARC-Easy, ARC-Challenge, WinoGrande, TruthfulQA — via lm-evaluation-harness"
  baselines:
    - "Pythia-6.9B at full training (300B tokens)"
    - "Pythia-6.9b-dedup at full training"
    - "OLMo-7B at full training (2T tokens) — descriptive only, not matched"

measurement_plan:
  data_collection:
    - source: "HuggingFace Hub: EleutherAI/pythia-6.9b — download intermediate checkpoint at step corresponding to ~300B tokens"
    - source: "HuggingFace Hub: allenai/OLMo-7B-hf — identify and download intermediate checkpoint at ~300B tokens"
    - source: "EleutherAI/pile — sample 10K documents per sub-domain (22 sub-domains)"
    - source: "allenai/dolma — sample 10K documents per source (7 sources)"
  procedure:
    - step: "1. Verify Pythia and OLMo intermediate checkpoint token counts via checkpoint metadata"
    - step: "2. Compute quality proxy scores for Pile sub-domains (n-gram repetition rate, Flesch-Kincaid, fastText language ID)"
    - step: "3. Compute quality proxy scores for Dolma sources using same metrics"
    - step: "4. Run lm-evaluation-harness on Pythia-6.9B intermediate checkpoint: MMLU (5-shot), HellaSwag (0-shot), ARC-E/C (25-shot), WinoGrande (5-shot), TruthfulQA (0-shot, mc2)"
    - step: "5. Run lm-evaluation-harness on OLMo-7B intermediate checkpoint: same benchmarks"
    - step: "6. Compute MMLU/HellaSwag ratio and ARC-Challenge/Easy delta for both models"
    - step: "7. Statistical comparison: unpaired t-test with 3-subsample bootstrap; Cohen's d estimation"
    - step: "8. Temporal trajectory: repeat benchmark evaluation at 143B-token intermediate checkpoints for both models"
    - step: "9. Secondary: Min-K% Prob contamination audit on benchmark test sets for both models"
    - step: "10. Architectural null: run benchmarks on GPT-J-6B; compare MMLU/HellaSwag ratio with Pythia-6.9B"
  success_criteria:
    - "P1: OLMo MMLU/HellaSwag ratio > Pythia ratio by > 0.02, Cohen's d > 0.2, p < 0.05"
    - "P2: OLMo ARC delta > Pythia ARC delta (directional, p < 0.10)"
    - "P3: Quality proxy r > 0.3 with ≥3/5 benchmarks in Pile sub-domain regression"

validation:
  internal_validity:
    - "Matched token count controls the primary scale confound"
    - "Same lm-evaluation-harness version and prompt formats for all models"
    - "Pre-specified quality index weights (equal weighting) prevents post-hoc tuning"
    - "Bonferroni correction for P3 (5 benchmarks × multiple comparisons)"
  external_validity:
    - "Limited to 6-8B parameter models — generalization to other scales requires additional experiments"
    - "Only two corpora compared — cannot establish a continuous curation-performance curve"
    - "Architecture confound limits causal attribution to data quality alone"

discussion_synthesis:
  key_insights:
    - "Reframing Pythia as a corpus quality variation testbed rather than a training dynamics testbed reveals an unexploited experimental opportunity"
    - "The matched-token-count design (using intermediate checkpoints) is the methodological key — without it, all cross-suite comparisons are confounded by scale"
    - "OOD/ID generalization balance (MMLU/HellaSwag ratio) is a more meaningful dependent variable than average benchmark performance for studying curation effects"
    - "Architecture confound, while real, can be bounded (not eliminated) via temporal trajectory analysis — widening gap with tokens implicates data quality; constant gap implicates architecture"
    - "Contamination confound is a real threat; Min-K% Prob secondary analysis is necessary for valid causal interpretation"
  breakthrough_moments:
    - "Exchange 4 (Prof. Pax): Distinguishing 'applied curation stringency' from 'source-intrinsic quality' clarified the hypothesis and led to better operationalization"
    - "Exchange 6 (Prof. Rex): Identifying GPT-2-xl perplexity as a style proxy (not quality proxy) led to the superior n-gram + Flesch-Kincaid + language ID composite"
    - "Exchange 7 (Dr. Nova): Token-matched intermediate checkpoint comparison emerged as the methodological solution to the cross-suite confound"
    - "Exchange 11 (Dr. Ally): Temporal trajectory as an architecture confound bounding strategy — elegant solution that adds evidence without eliminating the limitation"
  resolved_tensions:
    - "Cross-suite confound (architecture + token count) — resolved by matched intermediate checkpoint comparison + temporal trajectory analysis"
    - "Quality proxy validity — resolved by replacing GPT-2-xl perplexity with domain-neutral proxies (n-gram, Flesch-Kincaid, language ID)"
    - "Dependent variable precision — resolved by replacing average benchmark performance with OOD/ID balance ratios"
