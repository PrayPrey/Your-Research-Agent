  h-m1:
    type: MECHANISM
    statement: 'Under convergence-regime conditions, if generalization gap is predicted from weight tensors, then the prediction
      error is lower when the encoder computes globally distributed statistics compared to locally position-indexed statistics,
      because overfitting signal is spread across the full weight tensor — no single neuron or layer localizes it.

      '
    status: VALIDATED
    prerequisites:
    - h-e1
    gate:
      type: MUST_WORK
      satisfied: true
      result: NFT Spearman(gap)=0.5752 > FlatMLP=0.5330; DWSNet=0.4881, GNN=0.3747. Gate satisfied by NFT.
