sub_hypotheses:
  h-e1:
    type: EXISTENCE
    statement: 'Under convergence-regime conditions in the Unterthiner CIFAR-10 CNN zoo, if weight encoders are trained to
      predict generalization gap (train_acc − test_acc), then at least one encoder type achieves Spearman r > 0.5 on the held-out
      test set, because generalization gap at convergence encodes a non-trivial learnable signal in the weight tensor.

      '
    status: VALIDATED
    prerequisites: []
