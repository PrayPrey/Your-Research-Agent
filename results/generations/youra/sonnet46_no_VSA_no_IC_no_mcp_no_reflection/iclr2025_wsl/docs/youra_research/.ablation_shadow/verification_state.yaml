      type: MUST_WORK
      satisfied: true
      result: FlatMLP test Spearman r=0.5567 > 0.5 threshold; DWSNet r=0.5104 > 0.5. Gate satisfied by FlatMLP. NFT/StatMLP
        incomplete (log truncated mid-run).
