    id: H-GenGapEquiv-v1
    title: Systematic Comparison of Equivariant vs. Non-Equivariant Encoders on Generalization Gap Prediction
    statement: 'Permutation-equivariant weight encoders (DWS, NFT, GNN) show a disproportionately larger Spearman correlation
      improvement over flat MLP on generalization gap prediction (train_acc − test_acc at convergence) compared to their improvement
      on test accuracy prediction, because architectural parameter sharing across neuron equivalence classes forces distributed
      weight statistics extraction — the type of signal that generalization gap encodes.

      '
    defined_in: 03_refinement.yaml
    controlled_variables:
      dataset: Unterthiner CIFAR-10 CNN zoo (~10K models)
      model: flat_MLP, DWS, NFT, GNN
      optimizer: 50-trial random search per encoder (pre-specified and locked)
      hyperparameters:
        search_budget: 50
        metric_for_selection: Spearman on validation set
        train_val_test_split: 80/10/10 stratified
