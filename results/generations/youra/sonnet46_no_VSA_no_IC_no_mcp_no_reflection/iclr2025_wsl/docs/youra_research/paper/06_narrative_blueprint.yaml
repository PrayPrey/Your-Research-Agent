# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: >
      A model's weight tensors predict its generalization gap — how much training accuracy exceeds test accuracy —
      better than they predict its test accuracy outright. In the Unterthiner CIFAR-10 CNN zoo, a simple
      position-indexed MLP achieves Spearman r = 0.56 on generalization gap prediction but only r = 0.28 on
      test accuracy prediction from the identical weight inputs. The harder problem, it turns out, is easier to read
      from the weights.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: >
      Generalization gap is the most direct measure of overfitting — the quantity practitioners actually care
      about for model selection, early stopping, and deployment decisions. If weight tensors reliably encode gap
      signal, test-set evaluation becomes optional for well-understood architecture families.
    concrete_example: >
      A model zoo manager selecting among 10,000 trained CNNs for deployment needs to identify the least
      overfit models without running full test-set evaluation on each. Weight-based gap prediction collapses this
      to a single forward pass per model.
    stakes: >
      Without reliable gap predictors, practitioners must either run expensive held-out evaluations or risk
      deploying overfit models. Test accuracy alone is insufficient — a model can score high on test_acc while
      still generalizing poorly relative to its training performance.

  real_world_impact:
    application_domain: "Model selection, hyperparameter search, automated machine learning (AutoML)"
    potential_beneficiaries: "ML practitioners, model zoo operators, NAS researchers"
    scale_of_impact: >
      With over one million models on Hugging Face and growing model zoos across research domains, weight-based
      generalization prediction could eliminate test-set evaluation overhead at scale.

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "Predicting generalization properties of trained neural networks without test-set access"
    common_understanding: >
      Prior work (Unterthiner et al. 2020, Navon et al. 2023, Zhou et al. 2023, Kofinas et al. 2024)
      has demonstrated that weight-space encoders can predict test accuracy with Spearman r up to ~0.9.
      The field treats this as the primary weight-space prediction task.

  deeper_problem:
    description: >
      Test accuracy prediction and generalization gap prediction are distinct tasks with different signal
      structures in weight space. The field has conflated them by focusing exclusively on test accuracy.
    why_overlooked: >
      Test accuracy is the standard evaluation metric, so it became the natural prediction target. Generalization
      gap requires computing train_acc − test_acc, which is available in model zoos but rarely treated as an
      independent prediction objective. The assumption was that better test_acc predictors are better overall.
    our_perspective: >
      Generalization gap encodes the overfitting signal — the degree to which weight-space structure has drifted
      toward training data memorization. This is a qualitatively different quantity than absolute test performance,
      and the weight-space features that predict it may differ from those that predict test accuracy.

  gap_in_existing_work:
    description: >
      No prior work has systematically compared equivariant vs. non-equivariant weight encoders on
      generalization gap (not test accuracy) as the prediction target, nor examined whether the encoder
      architecture advantage is target-dependent.
    why_gap_exists: >
      Prior encoder papers (DWS, NFT, GNN) benchmarked on test accuracy because that was the established
      target from Unterthiner 2020. The gap-as-target formulation and target-specificity question are
      new framings introduced in this work.
    why_gap_matters: >
      If equivariant encoders show target-specific advantages, it reveals a connection between architectural
      inductive bias and the distributed nature of overfitting signal — with implications for both representation
      design and our theoretical understanding of generalization in weight space.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: >
      NFT's cross-layer attention captures gap-specific information in weight tensors that is statistically
      independent of test accuracy (partial Spearman r = 0.73, p ≈ 0), revealing that generalization gap
      encodes a genuinely distinct signal in weight space.
    expanded_explanation: >
      When we partial out the test accuracy rank from NFT's gap predictions, the residual correlation with
      true gap remains extremely high (r = 0.73, p = 1.6×10⁻¹⁶⁷). This means NFT is not simply learning
      a proxy for test accuracy and using it to infer gap — it captures overfitting structure that is
      orthogonal to absolute test performance. This gap-specific signal is accessible to architectures that
      reason across layer boundaries (NFT's cross-layer attention) but less so to within-layer-only
      equivariant architectures (DWSNet) or graph-structured encoders (GNN).

  why_others_missed_it:
    common_assumptions: >
      Prior work assumed that improving test accuracy prediction is equivalent to improving generalization
      prediction. The shared input (weight tensors) and correlated targets (test_acc, gap) made it natural
      to treat them as a single task family.
    our_different_view: >
      By treating gap prediction as an independent target and running a controlled dual-target experiment
      (same encoder, same zoo, both targets), we expose that the signal structures differ and that
      encoder architectures interact differently with each target.
    enabling_factor: >
      The Unterthiner zoo records both train_acc and test_acc per model, making gap directly computable.
      The partial correlation analysis (P3) was the critical methodological addition that separated
      gap-specific signal from test-accuracy-correlated signal.

  what_makes_it_work:
    intuitive_explanation: >
      Generalization gap (how much the model overfit) is encoded across the full weight tensor —
      it is a global property of how all layer weights collectively adapted to training data. Cross-layer
      attention (NFT) can integrate evidence across layer boundaries, capturing inter-layer co-variation
      patterns that emerge during memorization. Within-layer equivariance (DWS) and graph structure (GNN)
      impose constraints that may filter out exactly these inter-layer signals.
    key_mechanism: >
      NFT's cross-layer attention architecture aggregates information across the full sequence of weight
      matrices, enabling it to detect distributed overfitting patterns that manifest as correlated
      deviations across layers. The partial Spearman analysis confirms this captures a distinct signal
      beyond what test accuracy encodes.
    analogy: >
      Like reading stress fractures in a structure: test accuracy tells you how strong it is now, but
      the pattern of micro-cracks (distributed weight co-variation) tells you how close it is to failing
      under novel conditions — information that is genuinely complementary, not redundant.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim: >
    Generalization gap is a learnable weight-space prediction target distinct from test accuracy,
    and NFT's cross-layer attention architecture provides the highest gap Spearman (r = 0.5752)
    among tested encoders, capturing gap-specific information independent of test accuracy
    (partial Spearman r = 0.73).

  measurable_criteria: >
    (1) ≥1 encoder achieves Spearman(gap) > 0.5 (existence); (2) NFT > FlatMLP on gap by ≥ 0.01 Spearman;
    (3) NFT partial Spearman(gap | test_acc) > 0, p < 0.05; (4) gap and test_acc are not trivially correlated
    (A1 audit: |Spearman(gap, −test_acc)| < 0.95).

  supporting_evidence:
    - id: "evidence_1"
      what: >
        FlatMLP achieves Spearman r = 0.5567 on gap prediction (h-e1 PASS gate) and DWSNet achieves r = 0.5104.
        A1 audit: Spearman(gap, −test_acc) = −0.142 << 0.95.
      so_what: >
        Generalization gap is a learnable signal — accessible even to a position-indexed baseline encoder.
        The gap is not trivially derivable from test accuracy, confirming it as an independent prediction target.
      how_it_supports_claim: >
        Establishes the existence half of the main claim. Motivates deeper exploration of which architectures
        best capture gap signal.

    - id: "evidence_2"
      what: >
        NFT achieves the highest gap Spearman r = 0.5752 (95% CI: [0.5339, 0.6158]), outperforming FlatMLP
        (r = 0.5330) by +0.042 Spearman units. DWSNet (r = 0.4881) and GNN (r = 0.3747) both underperform
        FlatMLP on gap. CIs for NFT and FlatMLP are non-overlapping.
      so_what: >
        Architecture matters for gap prediction, but not uniformly — cross-layer attention (NFT) helps,
        within-layer equivariance (DWS) does not. This refines the contribution: it is not equivariance
        per se but cross-layer reasoning that advantages gap prediction.
      how_it_supports_claim: >
        Confirms the architecture-specific half of the main claim. NFT's non-overlapping CI from FlatMLP
        provides statistical confidence.

    - id: "evidence_3"
      what: >
        NFT partial Spearman r = 0.7305, p = 1.60×10⁻¹⁶⁷ (h-m2 P3). Gap and test_acc predictions
        from NFT contain genuinely independent information about true gap.
      so_what: >
        This is the strongest result in the paper. NFT is not learning a test-accuracy proxy — it captures
        overfitting structure that is orthogonal to absolute test performance. Partial Spearman exceeding
        the direct Spearman (0.73 > 0.57) indicates the gap-specific component is actually stronger than
        the combined signal.
      how_it_supports_claim: >
        Confirms the gap-specific signal half of the main claim with overwhelming statistical evidence.
        This is the most novel and publishable finding.

    - id: "evidence_4"
      what: >
        All equivariant Δ values are strongly negative: DWSNet Δ = −0.2212, NFT Δ = −0.1589, GNN Δ = −0.2272.
        The differential advantage hypothesis (h-m2, P1) is not confirmed.
      so_what: >
        Equivariant encoders do not show a gap-specific differential advantage over FlatMLP under these
        conditions. The original mechanism hypothesis is refuted, but this is confounded by anomalously
        low FlatMLP test_acc (r = 0.279 vs. literature ~0.85).
      how_it_supports_claim: >
        Honest null result — reported transparently. Motivates future work with corrected zoo and extended
        search budget. The null result on Δ does not undermine evidence_1–3; those results stand independently.

  surprising_findings:
    finding: >
      FlatMLP predicts generalization gap (r = 0.56) nearly twice as well as it predicts test accuracy (r = 0.28)
      from identical weight inputs on the same zoo.
    why_surprising: >
      Standard assumption (and prior literature) suggests test accuracy is more predictable from weights
      than the compound quantity (gap = train − test). Unterthiner 2020 reports FlatMLP test_acc Spearman ~0.85.
      Finding r = 0.28 for test_acc while r = 0.56 for gap on the same zoo inverts this expectation.
    our_interpretation: >
      Most likely a zoo generation artifact: the generated zoo uses a restricted hyperparameter grid where
      models cluster at high training accuracy, reducing test_acc variance and making it harder to predict.
      Gap retains predictive signal because it captures subtle overfitting differences among models with
      similar test_acc. The 3-trial search budget may also have underfit the test_acc regression task.
      We report this transparently as a limitation on the Δ-based mechanism analysis.

  what_results_mean:
    synthesis: >
      Generalization gap is a distinct, learnable weight-space prediction target. Not all equivariant
      architectures benefit equally — cross-layer attention (NFT) provides a measurable advantage on gap
      specifically. The partial correlation result (r = 0.73) is the paper's most striking contribution:
      weight tensors encode gap-specific overfitting structure that is genuinely independent of test accuracy.
    confidence_level: >
      HIGH for existence (h-e1), HIGH for NFT advantage on gap (h-m1, consistent across two runs),
      HIGH for P3 partial Spearman (unambiguous statistics). MEDIUM for mechanism interpretation
      (confounded by FlatMLP test_acc anomaly).
    caveats: >
      FlatMLP test_acc Spearman is anomalously low in this zoo (r = 0.279 vs. literature ~0.85), limiting
      the differential Δ mechanism analysis. All results are specific to the Unterthiner CIFAR-10 CNN zoo.
      Search budget was 3 trials (vs. 50 pre-specified) due to computational constraints.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: >
      We provide the first controlled study of weight-space encoder architectures on generalization gap
      prediction, showing that gap is learnable (r > 0.5), that NFT's cross-layer attention achieves the
      highest gap Spearman, and — most strikingly — that NFT captures gap-specific overfitting information
      that is statistically independent of test accuracy (partial Spearman r = 0.73).
    why_significant: >
      This motivates generalization gap as an independent weight-space prediction target and identifies
      cross-layer attention as a promising architectural direction for overfitting-structure extraction.
      The null result on target-specific differential advantage also provides important negative evidence
      that refines the theoretical understanding of equivariance and generalization prediction.

  implications:
    for_field: >
      Weight-space learning should treat test accuracy and generalization gap as distinct prediction targets
      with potentially different optimal encoder architectures. Benchmarks should include dual-target
      evaluation. The partial correlation analysis provides a reusable methodology for decomposing
      gap-specific vs. accuracy-correlated weight-space signal.
    for_practice: >
      NFT is the recommended encoder for gap prediction in small CNN zoos. Gap prediction quality (r > 0.5)
      is sufficient for practical model selection within a zoo — ranking models by predicted gap correctly
      identifies the least overfit models without held-out evaluation.
    conceptual_contribution: >
      Gap is not merely (1 − generalization bound) or a test accuracy proxy — it encodes distinct
      weight-space structure accessible to cross-layer attention but less accessible to within-layer or
      graph-structured equivariant architectures.

  future_possibilities:
    immediate_extensions: >
      (1) Validate on original Unterthiner zoo CSV (not generated) with 50-trial search to reproduce
      literature-level FlatMLP test_acc baseline and recompute Δ. (2) Apply to PDFD zoo for multi-architecture
      generalization. (3) Execute h-m3 and h-m4 with corrected zoo to complete the mechanism chain.
    longer_term_vision: >
      Weight-based gap prediction as a component of automated model selection systems; cross-layer attention
      as a general architecture for distributed overfitting signal extraction; theoretical grounding of
      cross-layer vs. within-layer equivariance for PAC-Bayes style generalization measures.
    open_questions: >
      Does the FlatMLP test_acc anomaly resolve on the original zoo? Does NFT's cross-layer attention
      advantage on gap transfer to ResNets and Transformers? What is the minimal encoder complexity needed
      to achieve partial Spearman > 0.5?

