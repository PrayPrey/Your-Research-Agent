# PART 5: SECTION-LEVEL NARRATIVE GOALS
# ═══════════════════════════════════════════════════════════════════════════════

section_goals:

  abstract:
    narrative_purpose: "Compress the entire story into ~150 words — lead with counterintuitive finding"
    key_message: >
      Weight tensors predict generalization gap better than test accuracy, NFT's cross-layer attention
      captures gap-specific signal independent of test accuracy (r = 0.73), positioning gap as a distinct
      prediction target.
    structure_notes: |
      - Sentence 1-2: Hook — gap more predictable than test_acc from same weights; FlatMLP r=0.56 vs r=0.28
      - Sentence 3: Our approach — first controlled equivariant vs. non-equivariant comparison on gap target
      - Sentence 4: Main result — NFT r=0.5752, best among tested encoders; gap learnable at r>0.5
      - Sentence 5: Key finding — partial Spearman r=0.73 (p≈0), gap-specific signal independent of test_acc
      - Sentence 6: Significance — gap is distinct target; cross-layer attention advantages gap; null on Δ reported
    avoid:
      - "Citations in abstract"
      - "Vague claims without numbers"
      - "Undefined acronyms"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Solution preview"
    hook_strategy: "counterintuitive_finding — open with gap more predictable than test_acc asymmetry"
    problem_escalation: |
      1. Surface: weight-space encoders predict test accuracy — well established, r~0.9 for DWS/NFT/GNN
      2. Deeper: generalization gap (the overfitting quantity) has never been the primary prediction target
         in equivariant encoder literature — treated as secondary to test_acc
      3. Gap: no study tests whether encoder architecture advantage is target-specific (gap vs. test_acc)
         or whether gap and test_acc encode distinct weight-space signals
    insight_preview: >
      "We find that generalization gap carries a learnable, architecture-sensitive signal in weight space
      that is statistically independent of test accuracy — suggesting overfitting structure and absolute
      performance occupy distinct regions of the weight-space information landscape."
    contributions_framing: |
      Frame as outcomes of the dual-target experiment, not a disconnected list:
      "By running the first controlled comparison of encoder architectures on generalization gap as the primary
      prediction target, we establish: (1) gap is learnable at r>0.5; (2) NFT is best on gap; (3) gap-specific
      signal in NFT predictions is independent of test_acc; (4) equivariant encoders do not show gap-specific
      differential advantage under these conditions — a documented null result with identified confounders."
    transition_to_related_work: >
      "We next survey the weight-space encoder literature and generalization prediction literature to position
      our dual-target formulation against prior work."

  related_work:
    narrative_purpose: "Show why existing work is insufficient → justify dual-target formulation"
    positioning_strategy: >
      Organize around two threads: (A) weight-space encoders for test_acc prediction — well developed but
      gap-blind; (B) generalization gap prediction — complex measures literature, not weight-space based.
      Our work bridges these threads.
    key_comparison_points:
      - area: "Weight-space encoders (DWS, NFT, GNN)"
        limitation_to_highlight: "All benchmark exclusively on test accuracy; no systematic gap comparison"
        how_we_differ: "First to use gap as primary target and compare encoders on both targets simultaneously"
      - area: "Generalization measures (PAC-Bayes, sharpness, margin)"
        limitation_to_highlight: >
          Focus on theoretical bounds; limited to handcrafted measures; no comparison with learned
          weight-space encoders on raw gap prediction
        how_we_differ: >
          Use learned encoders directly on gap; partial correlation analysis tests independence from test_acc
      - area: "Unterthiner flat MLP baseline"
        limitation_to_highlight: >
          Original paper tests only test_acc; gap field in zoo CSV not used for prediction
        how_we_differ: "First to exploit gap field as prediction target in Unterthiner zoo"
    papers_to_discuss:
      - "Unterthiner et al. 2020 (2002.11448) — zoo + flat MLP baseline"
      - "Navon et al. 2023 (2301.12780) — DWS encoder"
      - "Zhou et al. 2023 (2305.13546) — NFT encoder"
      - "Kofinas et al. 2024 (2403.12143) — GNN encoder"
      - "Jiang et al. 2019 (ICLR) — Fantastic Generalizations; gap complexity measures"
      - "Eilertsen et al. 2020 (2002.05688) — weight statistics"
      - "Schürholt et al. 2022 (2110.15288) — PDFD zoo"

  methodology:
    narrative_purpose: "Explain WHY this design answers the dual-target question"
    connection_to_insight: >
      The dual-target design (same encoder, same zoo, both gap and test_acc targets) directly tests
      whether encoder architecture advantage is target-specific — the insight that gap and test_acc
      may encode distinct signals requires this controlled comparison to falsify.
    key_design_decisions:
      - decision: "Dual-target evaluation on identical zoo and split"
        rationale: "Controls for zoo-specific variance; isolates target-specificity from encoder-specificity"
        alternatives_considered: "Separate zoos per target — confounds zoo effects with target effects"
      - decision: "Partial Spearman analysis (P3) as primary gap-specificity test"
        rationale: >
          Directly tests statistical independence of gap predictions from test_acc — the most rigorous
          formulation of 'gap-specific signal' available without held-out gap/test_acc controlled splits
        alternatives_considered: "Raw Spearman comparison only — insufficient to prove independence"
      - decision: "A1 audit (Spearman(gap, −test_acc) < 0.95) as mandatory pre-check"
        rationale: >
          If gap and test_acc are nearly collinear in the zoo, the dual-target experiment conflates them.
          A1 = −0.142 confirms they are not collinear.
        alternatives_considered: "Proceed without audit — risks reporting results on trivially correlated targets"
      - decision: "Bootstrap CI (N=1000) for all Spearman estimates"
        rationale: "Small test set (N=1000) makes asymptotic CI assumptions unreliable; bootstrap is appropriate"
        alternatives_considered: "Asymptotic Fisher z CI — inadequate for n=1000 rank correlation"
    intuition_building: |
      Use Figure 2 (dual-target bar chart) early in methodology to illustrate the dual-target setup.
      Walk through the Δ formula intuitively before stating it formally.
      Use the partial correlation explanation with a residual scatter plot (fig4_partial_corr_scatter.png).

  experiments:
    narrative_purpose: "Design experiments that test three specific claims: existence, ranking, independence"
    experimental_questions:
      - question: "Is generalization gap learnable from weight tensors above r=0.5?"
        experiment: "Train FlatMLP and DWSNet on gap target; evaluate Spearman on held-out test split"
        expected_outcome: "≥1 encoder achieves r > 0.5 (h-e1 gate); A1 audit passes"
      - question: "Which encoder architecture achieves the highest gap Spearman?"
        experiment: "Train all 4 encoders (FlatMLP, DWS, NFT, GNN) on gap; bootstrap CI comparison"
        expected_outcome: "NFT has highest gap Spearman with non-overlapping CI from FlatMLP (h-m1)"
      - question: "Does NFT capture gap-specific signal independent of test_acc?"
        experiment: "Compute partial Spearman(NFT_gap_pred, true_gap | true_test_acc) via rank residuals"
        expected_outcome: "Partial Spearman > 0, p < 0.05 (h-m2 P3)"
      - question: "Do equivariant encoders show larger gap advantage than test_acc advantage (Δ > 0.02)?"
        experiment: "Dual-target training; compute Δ = gap_improvement − acc_improvement per encoder"
        expected_outcome: "Δ > 0.02 for ≥2 encoders (h-m2 P1) — NOT CONFIRMED; reported as null result"
    baseline_rationale: >
      FlatMLP (Unterthiner original) is the natural baseline — establishes existence and provides the
      non-equivariant comparison point. Eilertsen weight statistics and Jiang complexity measures were
      planned but not executed due to scope constraints.
    dataset_rationale: >
      Unterthiner CIFAR-10 CNN zoo: N=10,000 models, D=33,890 weights per model, standard benchmark
      for weight-space prediction. 80/10/10 split (seed=42). Gap = train_acc − test_acc (computed from
      existing zoo metadata — no new data collection).
    metric_rationale: >
      Spearman rank correlation: standard for ordinal predictive tasks where absolute scale matters less
      than relative ranking. MSE as secondary metric. Bootstrap CI (N=1000) for uncertainty quantification.
    fairness_considerations: |
      Same search budget (3 trials) for all encoders. Same train/val/test split. Same seed.
      Acknowledged limitation: 3-trial budget may underfit some encoders (especially FlatMLP test_acc).
      Report FlatMLP test_acc anomaly transparently.

  results:
    narrative_purpose: "Build evidence in order: existence → ranking → independence → null"
    main_result_highlight: >
      NFT partial Spearman r = 0.7305 (p = 1.60×10⁻¹⁶⁷) — gap-specific signal independent of test_acc.
      This is the most novel result. Lead the results section narrative toward it.
    result_presentation_order:
      - result: "Gap existence — FlatMLP r=0.5567, DWSNet r=0.5104; A1 audit r=−0.142"
        purpose: "Establish that gap IS learnable before showing which encoder is best"
      - result: "Encoder comparison on gap — NFT r=0.5752 > FlatMLP > DWS > GNN; CI non-overlapping"
        purpose: "Show ranking and confidence in NFT advantage"
      - result: "Dual-target comparison — gap vs. test_acc Spearman for all 4 encoders (fig2)"
        purpose: "Surface the counterintuitive gap > test_acc predictability for FlatMLP; show DWS/GNN flip"
      - result: "P3 partial Spearman r=0.7305 — the key finding"
        purpose: "Climax of the evidence arc — gap-specific signal is genuinely distinct"
      - result: "Δ null result — all Δ < 0, CIs entirely below zero"
        purpose: "Honest null; flag FlatMLP test_acc anomaly as confounder; avoid burying this"
    surprising_result_handling: >
      Address FlatMLP test_acc r=0.279 vs. literature ~0.85 directly in results, not hidden in discussion.
      Frame as zoo generation artifact with competing explanations — show this is identified, not ignored.
      The partial Spearman result should be highlighted as the most robust finding precisely because it
      does not depend on the FlatMLP test_acc baseline.

  discussion:
    narrative_purpose: "Interpret the mechanism, bound the claims, place in literature context"
    key_findings_interpretation: >
      NFT's cross-layer attention captures inter-layer weight co-variation that encodes overfitting structure
      orthogonal to test accuracy — the partial Spearman result is the most direct evidence for this. DWSNet's
      underperformance on gap despite equivariant architecture suggests within-layer equivariance is
      insufficient for gap signal extraction. GNN's poor gap performance suggests graph-structured weight
      connectivity is too rigid for distributed overfitting patterns. The Δ null result is confounded but
      reported; future work with corrected zoo is needed to resolve the mechanism question.
    honest_limitations:
      - limitation: "FlatMLP test_acc r=0.279 vs. literature ~0.85"
        why_acceptable: >
          Gap prediction results (h-e1, h-m1) are unaffected — they use gap target only. P3 partial
          Spearman is also robust. Only the Δ-based mechanism claim is confounded.
        future_mitigation: >
          Reproduce with original Unterthiner zoo CSV + 50-trial search; recompute Δ with corrected baseline.
      - limitation: "3-trial search budget (vs. 50 pre-specified)"
        why_acceptable: >
          Gap Spearman results are consistent across two independent runs (h-e1: FlatMLP=0.5567,
          h-m1: FlatMLP=0.5330). Existence and ranking claims are stable under this budget.
        future_mitigation: "Extended 50-trial search in follow-up experiments."
      - limitation: "Single zoo, single architecture family (CIFAR-10 small CNNs)"
        why_acceptable: >
          Unterthiner zoo is the standard benchmark for weight-space prediction. Establishes proof of concept.
        future_mitigation: "PDFD zoo (multi-architecture) and extended CNN/ResNet studies."
    broader_impact_statement: >
      Weight-based gap prediction reduces the need for held-out test-set evaluation in model selection,
      with potential efficiency gains for large model zoo management. The methodology (dual-target controlled
      comparison, partial Spearman independence test) is reusable for any weight-space prediction study.
      No direct harmful applications identified; broader risks of automated model selection without human
      oversight should be considered in deployment.

  conclusion:
    narrative_purpose: "Close the narrative loop — return to the counterintuitive opening, open future"
    callback_to_hook: >
      "We opened by noting that weight tensors predict generalization gap better than test accuracy — a
      result that inverts the standard assumption about which quantity is more legible from weights. Our
      experiments confirm and extend this: gap carries a distinct, learnable signal (r > 0.5), and NFT's
      cross-layer attention captures gap-specific overfitting structure that is independent of test accuracy
      (partial Spearman r = 0.73). The harder problem — predicting overfitting — is, in fact, the one
      that weight space is better equipped to answer."
    memorable_ending: >
      Weight tensors may be natural overfitting sensors — encoding the distributed signature of
      memorization across layer boundaries in a way that cross-layer attention architectures are
      well positioned to read.
    future_work_vision: >
      Resolving the confounded Δ mechanism question on corrected data; extending to PDFD multi-architecture
      zoo; theoretical grounding of cross-layer equivariance for PAC-Bayes gap measures; gap prediction
      as a component of deployment-time model selection systems.

