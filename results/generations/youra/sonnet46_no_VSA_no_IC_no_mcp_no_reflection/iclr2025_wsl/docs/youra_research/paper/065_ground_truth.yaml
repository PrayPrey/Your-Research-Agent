    verified: true

  - claim: "NFT partial Spearman (gap | test_acc) = 0.73, p ≈ 0"
    location: "Introduction, Results §5.3"
    supporting_evidence: "h-m2 P3: r=0.7305, p=1.60e-167"
    verified: true

  - claim: "All equivariant Δ values strongly negative (−0.16 to −0.23)"
    location: "Results §5.4"
    supporting_evidence: "h-m2: DWSNet Δ=−0.2212, NFT Δ=−0.1589, GNN Δ=−0.2272"
    verified: true

  - claim: "FlatMLP test_acc r=0.279 vs literature ~0.85"
    location: "Results §5.1, Discussion §5.2"
