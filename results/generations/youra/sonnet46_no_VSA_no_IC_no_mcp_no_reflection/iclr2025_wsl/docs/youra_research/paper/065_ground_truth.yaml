# ─────────────────────────────────────────────────────────────────────────────
# ZOO AND EXPERIMENTAL SETUP
# ─────────────────────────────────────────────────────────────────────────────

experimental_setup:
  zoo:
    name: "Unterthiner CIFAR-10 CNN zoo"
    n_models: 10000
    n_weights_per_model: 33890
    split: "80/10/10"
    seed: 42
    test_n: 1000
    source: "h-e1/04_validation.md, h-m1/04_validation.md"
    paper_claimed_n: 10000
    paper_claimed_d: 33890
    match: true

  training:
    optimizer: "Adam"
    lr_candidates: [0.0005, 0.001, 0.002]
    batch_size: 64
    epochs: 100
    n_trials: 3
    seed: 42
    source: "h-m2/03_architecture.md"
    paper_claimed_n_trials: 3
    match: true

  bootstrap:
    n_resamples: 1000
    seed: 42
    ci_type: "percentile"
    source: "h-m1/04_validation.md, h-m2/04_validation.md"
    paper_claimed_n_boot: 1000
    match: true

