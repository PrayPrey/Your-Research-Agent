synthesis_summary:
  core_insight: >
    The weight-space encoder literature has exclusively targeted test accuracy prediction.
    Generalization gap (train_acc − test_acc at convergence) is a fundamentally different
    prediction target that rewards encoders with strong inductive bias for distributed weight
    statistics. Permutation-equivariant encoders achieve this through parameter sharing across
    neuron equivalence classes — a property that architecturally forces extraction of
    orbit-averaged statistics. Flat MLPs, even when preprocessing canonicalizes permutations,
    remain free during training to fit sorting-dependent spurious features.

  differential_effect_hypothesis: >
    The improvement of equivariant encoders (DWS, NFT, GNN) over flat MLP is larger for
    generalization gap prediction than for test accuracy prediction. This is the primary
    empirically testable claim.

  mechanistic_story:
    step1: "Generalization gap at convergence encodes distributed overfitting signal across the full weight tensor."
    step2: "Equivariant encoders share parameters across all neurons in an equivalence class, forcing computation of orbit-averaged statistics."
    step3: "Orbit-averaged statistics capture the distributed gap signal more faithfully than position-indexed statistics (flat MLP)."
    step4: "Cross-layer attention (NFT) additionally captures inter-layer weight co-variation, providing a further advantage for gap vs. test_acc."

  novelty_statement: >
    First work to: (1) evaluate weight encoders on generalization gap as prediction target,
    (2) test whether equivariance advantage is target-dependent, (3) connect permutation
    equivariance inductive bias to PAC-Bayes generalization measures.

key_agreements:
  - "Unterthiner zoo is the primary experimental venue; Schürholt PDFD zoo is secondary/fallback."
  - "All four encoder types must be tuned with equal budget (50 random trials pre-specified)."
  - "Data audit must confirm gap has meaningful independent variance from test_acc before committing."
  - "Partial correlation analysis is mandatory, not optional."
  - "Hypothesis scoped to convergence-regime overfitting."

key_tensions_resolved:
  train_acc_ceiling:
    concern: "If all models have train_acc ≈ 1.0, gap ≈ 1 − test_acc and the experiment is uninformative."
    resolution: "Data audit check; PDFD zoo as fallback with richer training diversity."
  equipotency:
    concern: "Equivariant architectures may be inadvertently tuned for test_acc prediction."
    resolution: "Fixed search budget; sensitivity analysis across top-5 configurations."
  theoretical_coherence:
    concern: "Flat MLPs on sorted weights are also permutation-invariant."
    resolution: "Distinction between architectural invariance (enforced during training) vs. preprocessing invariance (spurious features still learnable during training)."

predictions_summary:
  P1_primary: "Δ Spearman(gap) > Δ Spearman(test_acc) for ≥2 of 3 equivariant encoders vs. flat MLP (threshold: Δ > 0.02)"
