# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "All published RLEF papers for code (CodeRL, PPOCoder, RLEF/Gehring) use binary pass/fail reward exclusively"
      status: "BUILD_ON"
      evidence: "CodeRL (2207.01780), PPOCoder (2301.13379), RLEF/Gehring (2410.02089) — all use binary reward. Confirmed by Phase 1 literature review across 18 inferred papers."
    - claim: "GRPO (Group Relative Policy Optimization) is superior to PPO for code LLM post-training in training stability and compute efficiency"
      status: "BUILD_ON"
      evidence: "DAPO (2503.14476): GRPO eliminates critic network, reduces training instability, 2-3x faster than PPO. Adopted as standard by DeepSeek-R1 style training."
    - claim: "RLEF outperforms SFT alone for code generation post-training"
      status: "BUILD_ON"
      evidence: "CodeRL: ~5pp HumanEval improvement over SFT. RLEF/Gehring: SWE-bench improvement over SFT at same data scale."
    - claim: "APPS dataset supports partial-credit evaluation natively (k/n test cases per problem)"
      status: "BUILD_ON"
      evidence: "APPS (2105.09938): 10,000 problems with multi-test-case structure. Hendrycks et al. report both strict pass@k and partial credit metrics."
    - claim: "No published work has conducted a controlled ablation of reward signal granularity in RLEF for code LLMs"
      status: "PROVE_NEW"
      evidence: "Phase 1 gap analysis: confirmed absence across CodeRL, PPOCoder, RLEF/Gehring, DAPO literature."
    - claim: "Ratio reward improves in-distribution performance (HumanEval/MBPP) vs. binary reward"
      status: "PROVE_NEW"
      evidence: "Hypothesized based on signal density argument (Prof. Vera) — no empirical evidence exists."
    - claim: "Reward-evaluation alignment affects cross-benchmark transfer in RLEF"
      status: "PROVE_NEW"
      evidence: "Novel mechanistic claim from discussion (Dr. Ally) — not established in prior work."
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    BUILD_ON claims (established facts): do not re-verify in Phase 4 experiments.
    Use as background context and motivation. PROVE_NEW claims are the experimental targets.
    Phase 4 experiments should directly test the three PROVE_NEW claims.
    Primary experiment: GRPO post-training on APPS with 3 reward variants (binary, ratio, similarity)
    on DeepSeek-Coder-6.7B, evaluated on HumanEval, MBPP, LiveCodeBench, SWE-bench-lite.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-RewardGranularity-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under RLEF post-training with GRPO on APPS training data for 7B-class code LLMs,
    if reward signal granularity is increased from binary (0/1) to ratio (k/n passing tests)
    to output-similarity (continuous token overlap), then in-distribution performance
    (HumanEval, MBPP) increases with granularity while out-of-distribution generalization
    (LiveCodeBench) shows a non-monotonic pattern and SWE-bench-lite transfer favors
    binary reward over ratio/similarity, because training-evaluation reward alignment —
    not just reward density — determines cross-benchmark generalization: models trained with
    misaligned reward (ratio training → binary test evaluation) learn partial-solution
    strategies that underperform the test metric compared to models whose training reward
    format directly matches the evaluation criterion.
  alternative_hypothesis_h0: |
    There is no significant difference in HumanEval pass@1, LiveCodeBench relative gain,
    or SWE-bench-lite resolve rate between models post-trained with binary, ratio, or
    output-similarity execution reward signals, after controlling for training steps,
    model scale, and training data.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Reward Signal Granularity"
      type: "categorical"
      operationalization: "Three conditions applied during GRPO post-training on APPS"
      levels:
        - "Binary: reward = 1 if all test cases pass, 0 otherwise"
        - "Ratio: reward = (# passing test cases) / (total test cases), capped at 10 test cases per problem"
        - "Similarity: reward = mean token-level F1 between generated output and expected output (computed per test case, averaged)"
  dependent:
    - name: "HumanEval pass@1"
      type: "continuous"
      operationalization: "pass@1 metric on HumanEval (164 problems), higher is better, range [0, 1]"
      primary: true
    - name: "MBPP pass@1"
      type: "continuous"
      operationalization: "pass@1 metric on MBPP (374 problems), higher is better, range [0, 1]"
      primary: false
    - name: "LiveCodeBench relative gain"
      type: "continuous"
      operationalization: "pass@1(RLEF) - pass@1(SFT baseline) on LiveCodeBench, controls for problem difficulty"
      primary: false
    - name: "SWE-bench-lite resolve rate"
      type: "continuous"
      operationalization: "Fraction of 300 SWE-bench-lite issues where patch passes all repository tests, measured at pass@3"
      primary: false
  controlled:
    - name: "Base model"
      operationalization: "DeepSeek-Coder-6.7B-instruct as primary; StarCoder2-7B as secondary validation"
    - name: "RL algorithm"
      operationalization: "GRPO via trl library, same hyperparameters across all reward conditions"
    - name: "Training data"
      operationalization: "APPS dataset (same problems, same split) for all three reward conditions"
    - name: "Training steps"
      operationalization: "1000 GRPO update steps per condition"
    - name: "APPS test case cap"
      operationalization: "Maximum 10 test cases per problem used for ratio reward computation (stability)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Reward signal density determines gradient flow quality in GRPO training"
      evidence: "DAPO (2503.14476): GRPO normalizes rewards within group; binary reward with all-failing group still produces gradients, but ratio reward provides relative signal across partially-correct completions. Signal density hypothesis: ratio reward differentiates better between 'close' and 'far' solutions."
      falsifier: "If gradient norms are equivalent between binary and ratio GRPO training (monitored per step), this mechanism step is falsified — GRPO normalization already solves the sparsity problem."
    - step: 2
      description: "Reward signal format shifts the optimal policy target from all-pass optimization to expected-coverage maximization"
      evidence: "Theoretical argument (Prof. Vera): Binary optimal policy = maximize P(all tests pass). Ratio optimal policy = maximize E[passing tests / total]. These diverge when partial solutions are common — ratio reward may incentivize models to reliably pass 8/10 tests without achieving 10/10."
      falsifier: "If ratio-trained models achieve equal or higher 10/10 pass rates (binary metric) compared to binary-trained models, then the policy target shift does not create a performance ceiling — mechanism step 2 is falsified."
    - step: 3
      description: "Training-evaluation reward alignment determines cross-benchmark generalization: when training reward format matches test-time binary evaluation, models generalize better to new binary-evaluated benchmarks"
      evidence: "Novel claim (Dr. Ally, Prof. Rex): LiveCodeBench uses binary pass/fail evaluation. If ratio-trained model learns partial-solution strategies (step 2), it underperforms on binary-evaluated LiveCodeBench and SWE-bench-lite vs. binary-trained model, even if absolute scores are higher on HumanEval."
      falsifier: "If ratio-trained models show equal or better LiveCodeBench relative gain vs. binary-trained models, the alignment mechanism is falsified — reward density helps generalization regardless of format mismatch."
  key_tension: "GRPO group normalization may already solve binary reward sparsity (Prof. Rex objection), which would remove the primary motivation for ratio reward — if GRPO makes binary reward dense enough, ratio reward's only effect is the policy target shift (Step 2), which may be neutral or negative."
  evidence_summary: |
    The causal chain connects reward format → gradient quality (Step 1) → policy target (Step 2) →
    generalization alignment (Step 3). The chain is theoretically coherent but Step 1 is empirically
    uncertain (GRPO normalization may neutralize the density advantage). Steps 2 and 3 are the
    more robust claims: even if gradient flow is equivalent, the policy target shift and
    training-evaluation alignment effects should be distinguishable in final benchmark performance.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "APPS test cases are sufficiently non-redundant to make ratio reward informative"
    supporting_evidence: "APPS problems from competitive programming sources typically have diverse test cases including edge cases (large inputs, boundary values, corner cases)"
    consequence_if_violated: "Ratio reward degenerates to binary reward in expectation (passing easy redundant tests inflates ratio without capturing true partial correctness); Study would underestimate ratio reward's true effect."
  - id: "A2"
    assumption: "DeepSeek-Coder-6.7B is representative of 7B-class code LLMs for RLEF post-training"
    supporting_evidence: "DeepSeek-Coder is a leading open-weight code model; findings should generalize to similar-scale models (StarCoder2-7B validation planned)"
    consequence_if_violated: "Findings may be model-architecture-specific; scale to other architectures requires additional experiments."
  - id: "A3"
    assumption: "LiveCodeBench's contamination resistance holds for APPS-trained models (APPS training data does not contain LiveCodeBench problems)"
    supporting_evidence: "LiveCodeBench uses post-2023 competitive programming problems; APPS was published 2021 from prior contest years"
    consequence_if_violated: "LiveCodeBench scores would reflect contamination rather than genuine generalization; the benchmark would fail to discriminate reward hacking."
  - id: "A4"
    assumption: "1000 GRPO training steps is sufficient to observe meaningful reward-granularity differences"
    supporting_evidence: "CodeRL showed ~5pp HumanEval improvement from binary RLEF; DAPO shows GRPO converges faster than PPO; 1000 steps should be adequate for differential effects to emerge"
    consequence_if_violated: "Null result may reflect insufficient training rather than true null effect; would need to extend to 2000-3000 steps."
  - id: "A5"
    assumption: "Output-similarity reward (token-level F1) provides meaningful signal for code correctness beyond binary"
    supporting_evidence: "Token F1 is commonly used in NLP evaluation; for code, token overlap to expected output captures structural similarity even for wrong answers"
    consequence_if_violated: "Similarity reward may be too noisy (code with different variable names but correct logic gets low token F1); third condition may not be informative."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - 7B-class open-weight code LLMs (DeepSeek-Coder-6.7B, StarCoder2-7B, similar architectures)
    - RLEF post-training using GRPO as the RL algorithm
    - Algorithmic programming tasks with test-suite-based evaluation (APPS training → HumanEval/MBPP/LiveCodeBench evaluation)
    - Binary-evaluated downstream benchmarks (pass@1 metrics)
  does_not_apply_to: |
    - Very small models (1B and below) — scale interaction not studied in primary experiment
    - Very large models (70B+) — compute infeasible; may have different generalization dynamics
    - Non-execution-based code evaluation (e.g., human preference, code style)
    - Multi-turn agentic code repair — reward signal dynamics differ fundamentally in multi-step settings
    - Languages other than Python — APPS and HumanEval are Python-centric
  known_limitations: |
    - Scale study is secondary (1B optional comparison); primary findings limited to 7B class
    - APPS test case quality varies; pre-screening for non-redundant test cases required
    - SWE-bench-lite (300 issues) provides limited statistical power; pass@3 and bootstrap CIs needed
    - All source papers are [INFERRED] from training knowledge; arXiv IDs need MCP verification

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Ratio reward achieves ≥3 percentage points higher HumanEval pass@1 than binary reward after 1000 GRPO training steps on APPS, using DeepSeek-Coder-6.7B"
    test_method: "GRPO post-training with binary and ratio reward conditions on APPS; evaluate HumanEval pass@1 at 1000 steps"
    success_criterion: "pass@1(ratio) - pass@1(binary) ≥ 0.03 (3pp), with 95% bootstrap CI excluding 0"
    falsification: "If pass@1(ratio) - pass@1(binary) < 0.03 or the difference is not statistically distinguishable, P1 is falsified — ratio reward does not improve in-distribution performance meaningfully"
  - id: "P2"
    primary: false
    statement: "The differential RLEF gain (RLEF improvement over SFT baseline) is larger on HumanEval than on LiveCodeBench for ratio-trained models, while binary-trained models show more uniform gains across both benchmarks"
    test_method: "Compute RLEF_gain = pass@1(RLEF) - pass@1(SFT) for both binary and ratio conditions on HumanEval and LiveCodeBench. Compare (HumanEval_gain - LiveCodeBench_gain) between conditions."
    success_criterion: "(HumanEval_gain - LiveCodeBench_gain)_ratio > (HumanEval_gain - LiveCodeBench_gain)_binary, indicating ratio reward overfits to training distribution"
    falsification: "If ratio-trained models show proportionally similar gains on HumanEval and LiveCodeBench (no widening gap), the overfitting mechanism is not operating — P2 falsified"
  - id: "P3"
    primary: false
    statement: "Binary reward shows equal or better SWE-bench-lite resolve rate than ratio and similarity reward, consistent with training-evaluation reward alignment"
    test_method: "Final evaluation (pass@3) on SWE-bench-lite for all three reward conditions; compare resolve rates with bootstrap confidence intervals"
    success_criterion: "resolve_rate(binary) ≥ resolve_rate(ratio) ≥ resolve_rate(similarity), with at least one comparison statistically distinguishable (95% bootstrap CI)"
    falsification: "If ratio or similarity reward achieves higher SWE-bench-lite resolve rate than binary reward, P3 is falsified — training-evaluation alignment does not predict SWE-bench-lite transfer"

