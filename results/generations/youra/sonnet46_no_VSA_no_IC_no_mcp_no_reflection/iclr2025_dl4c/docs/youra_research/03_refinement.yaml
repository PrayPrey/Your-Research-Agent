experimental_setup:
  dataset:
    name: "APPS (Automated Programming Progress Standard)"
    type: "standard"
    source: "Hendrycks et al. 2021 (arXiv: 2105.09938)"
    path: "https://github.com/hendrycks/apps (HuggingFace: codeparrot/apps)"
    hypothesis_fit: "APPS has native multi-test-case structure (k/n tests per problem) enabling ratio reward computation without dataset modification. 10,000 problems at mixed difficulty levels. Standard training data for RLEF code papers (CodeRL, PPOCoder)."
  model:
    name: "DeepSeek-Coder-6.7B-instruct"
    type: "Decoder-only transformer, code-specialized"
    source: "deepseek-ai/DeepSeek-Coder (HuggingFace)"
    hypothesis_fit: "7B-class open-weight code LLM with strong HumanEval/MBPP baselines; available weights and inference code; representative of current RLEF-capable models."
  baselines:
    - name: "SFT baseline"
      method: "DeepSeek-Coder-6.7B-instruct without RLEF post-training (or with SFT-only on APPS)"
    - name: "Binary RLEF (CodeRL-style)"
      method: "GRPO on APPS with binary reward (all-pass=1, otherwise=0)"
    - name: "Ratio RLEF"
      method: "GRPO on APPS with ratio reward (k/n, capped at 10 test cases)"
    - name: "Similarity RLEF"
      method: "GRPO on APPS with output-similarity reward (mean token-level F1 per test case)"

