theoretical_claims:
  - id: "T1"
    claim: >
      Binary reward produces zero advantage variance in any GRPO group where all
      k_i ∈ {0, n} (all completions all-fail or all-pass)
    type: "MATHEMATICAL_GUARANTEE"
    derivation: >
      When r_i = 0 for all i: group_mean = 0; A_i = r_i - mean = 0 for all i;
      Var(A) = 0. When r_i = 1 for all i: group_mean = 1; A_i = 0 for all i; Var(A) = 0.
    section_in_paper: "Methodology §3.2"

  - id: "T2"
    claim: >
      Ratio reward produces non-zero advantage variance whenever ∃i: 1 ≤ k_i < n
      and completions differ in pass count
    type: "MATHEMATICAL_GUARANTEE"
    derivation: >
      If completion c_j has k_j passes and completion c_k has k_k ≠ k_j passes,
      ratio rewards differ: r_j = k_j/n ≠ k_k/n = r_k. Group variance of {r_i}
      is non-zero when at least two rewards differ. Non-zero reward variance →
      non-zero advantage variance.
    section_in_paper: "Methodology §3.2"

