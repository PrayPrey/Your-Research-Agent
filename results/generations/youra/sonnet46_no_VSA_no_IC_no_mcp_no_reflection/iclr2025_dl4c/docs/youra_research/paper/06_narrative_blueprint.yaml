notes:
  creation_notes: |
    NARRATIVE FRAMING DECISION: This paper has an unusual structure — the main result
    (h-e1) is a mechanistic proof, and the follow-on experiment (h-m1) produced a
    principled null result. The narrative strategy chosen frames this as TWO contributions:
    (1) the positive mechanistic claim and (2) the characterization of the experimental
    prerequisite. This avoids the "failed experiment" framing and instead positions the
    paper as a methodological contribution to RLEF research design.

    HOOK CHOICE RATIONALE: The 98.7% statistic is the strongest opening because it is:
    (a) precise and verifiable, (b) counterintuitive (practitioners assume binary reward works),
    (c) immediately actionable (switch to ratio reward for hard datasets), and (d) consistent
    with the paper's mathematical contribution style.

    NULL RESULT STRATEGY: The h-m1 null result is framed throughout as a "precision
    characterization" (we know exactly WHY it was null) rather than a failure (experiment
    broken). This framing is scientifically accurate — h-m1 was not a failed experiment;
    it correctly identified that the prerequisite was unmet. This framing is also strategically
    stronger for ICML review.

    CLAIM CALIBRATION: The paper makes NO claim about HumanEval improvement (P1), APPS
    all-pass rate shift (P2), or cross-benchmark generalization (P3). Only the mechanistic
    claims from h-e1 are presented as results. This is the honest and correct scope.

