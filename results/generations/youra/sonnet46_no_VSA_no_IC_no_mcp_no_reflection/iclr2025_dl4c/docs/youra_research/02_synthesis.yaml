hypothesis_draft:
  title: "Reward Granularity vs. Generalization in RLEF for Code LLMs: The Training-Evaluation Alignment Hypothesis"
  hypothesis_id: "H-RewardGranularity-v1"
  core_claim: |
    Increasing reward signal granularity from binary to ratio to similarity in RLEF post-training
    improves in-distribution benchmark performance (HumanEval, MBPP) but degrades or does not
    improve out-of-distribution generalization (LiveCodeBench) and cross-task transfer
    (SWE-bench-lite), because training-evaluation reward alignment — not reward density alone —
    determines how well RLEF-trained models generalize to binary-evaluated downstream benchmarks.
  mechanism: |
    Three-step causal chain:
    1. Reward signal density → gradient flow quality in GRPO (ratio provides signal even for
       partially-correct solutions where binary gives 0; enables differentiation within all-failing groups)
    2. Reward format → optimal policy target shift (binary: maximize P(all-pass); ratio: maximize
       E[coverage]; these diverge when partial solutions are common, leading to different policy
       strategies at convergence)
    3. Policy strategy → cross-benchmark alignment (ratio-trained models learn partial-solution
       strategies that underperform on binary-evaluated benchmarks at test time; training-evaluation
       mismatch creates generalization penalty)
  predictions:
    - P1: "Ratio reward achieves ≥3pp higher HumanEval pass@1 than binary reward (in-distribution benefit)"
    - P2: "HumanEval gain - LiveCodeBench gain is larger for ratio-trained models than binary-trained (overfitting pattern)"
    - P3: "Binary reward achieves equal or better SWE-bench-lite resolve rate than ratio/similarity (alignment benefit)"

variables_summary:
  independent: "Reward signal granularity: binary (0/1), ratio (k/n, capped at 10), similarity (token F1)"
  dependent_primary: "HumanEval pass@1 (primary); MBPP pass@1, LiveCodeBench relative gain, SWE-bench-lite resolve rate (secondary)"
  controlled: "Model (DeepSeek-Coder-6.7B), algorithm (GRPO via trl), training data (APPS), steps (1000)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in HumanEval pass@1, LiveCodeBench relative gain,
    or SWE-bench-lite resolve rate between models post-trained with binary, ratio, or
    output-similarity execution reward signals, after controlling for training steps,
    model scale, and training data (DeepSeek-Coder-6.7B, APPS, 1000 GRPO steps).
  statistical_test: "Bootstrap confidence intervals on pass@1 differences; paired comparison across reward conditions"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Training-evaluation reward alignment principle: reward format should match downstream evaluation metric, not just maximize information density. First controlled ablation of reward granularity in RLEF for code LLMs."
  differentiation_summary: |
    All prior RLEF papers (CodeRL, PPOCoder, RLEF/Gehring, DAPO) use binary reward exclusively.
    The field assumes RLEF is the key variable (vs. SFT) but never asks whether reward formulation
    within RLEF matters. This work answers that question and proposes a mechanistic explanation
    (training-evaluation alignment) that generalizes beyond the specific reward comparison.
    The counter-intuitive prediction (ratio reward may hurt LiveCodeBench generalization) is
    the key novel contribution if confirmed.

