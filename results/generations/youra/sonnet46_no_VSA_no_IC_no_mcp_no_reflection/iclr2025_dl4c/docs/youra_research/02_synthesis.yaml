discussion_synthesis:
  key_insights:
    - "Training-evaluation reward alignment is the mechanistic key — not just reward density"
    - "GRPO's group normalization may partially solve binary reward sparsity, reducing ratio reward's advantage"
    - "APPS's native multi-test-case structure makes ratio reward directly computable without dataset modification"
    - "LiveCodeBench contamination resistance makes it the ideal OOD test for reward hacking detection"
    - "Output-similarity reward occupies a different niche (near-miss correction) — may help SWE-bench specifically"
  breakthrough_moments:
    - "Prof. Vera's distinction between signal density mechanism and policy target shift mechanism — these are separable predictions"
    - "Dr. Ally's synthesis of 'training-evaluation alignment' as the unifying principle — goes beyond density argument"
    - "Prof. Rex's GRPO group normalization objection — forces more careful mechanism claim"
  resolved_tensions:
    - "Tension: 'denser reward = better' vs. 'reward hacking risk' — resolved by training-evaluation alignment framing: density helps in-distribution, alignment determines OOD"
    - "Tension: include scale study or not — resolved by Prof. Pax's compute analysis: scale study is secondary, not primary"
    - "Tension: similarity reward as separate condition vs. omit — resolved: include as boundary condition to show where dense reward definitively breaks"
