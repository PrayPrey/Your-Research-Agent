gap_id: "gap-1"
gap_title: "No Simultaneous Bidirectional Alignment Measurement Framework"
gap_description: |
  Existing alignment evaluation frameworks (HELM, lm-evaluation-harness, reward-bench)
  exclusively measure AI-to-human alignment. The bidirectional survey by Shen et al.
  (2023/2024) defines both directions conceptually but provides no quantification
  methodology. Human-to-AI alignment is treated qualitatively without operationalized
  metrics. Missing: a protocol that operationalizes human-to-AI alignment as a
  computable proxy from existing behavioral metadata, computes AI-to-human alignment
  from existing benchmarks, and compares both to quantify asymmetry — without
  requiring new annotation or new benchmarks.
