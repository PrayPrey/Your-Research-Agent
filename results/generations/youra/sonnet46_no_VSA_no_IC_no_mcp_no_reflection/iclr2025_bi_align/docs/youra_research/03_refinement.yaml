# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "AI-to-human alignment is well-measured by existing benchmarks (HELM, TruthfulQA, BIG-Bench, lm-eval-harness)"
      status: "BUILD_ON"
      evidence: "Liang et al. 2022 HELM; Lin et al. 2022 TruthfulQA; Srivastava et al. 2022 BIG-Bench — all provide domain-stratified AI-to-human alignment scores"
    - claim: "Human-to-AI alignment has no existing operationalized measurement framework"
      status: "PROVE_NEW"
      evidence: "Shen et al. 2024 survey identifies both directions conceptually but provides no measurement methodology; confirmed by Phase 1 literature search"
    - claim: "WildChat-1M contains behavioral metadata (prompt text, timestamps, topic tags, turn counts) suitable for proxy extraction"
      status: "BUILD_ON"
      evidence: "Zhao et al. 2024 arXiv:2405.01470 — 1M ChatGPT conversations with timestamps, model version, topic categories"
    - claim: "LMSYS Chatbot Arena contains timestamped human preference votes across multiple model versions (2023-2024)"
      status: "BUILD_ON"
      evidence: "Zheng et al. 2023 arXiv:2306.05685 — ELO-based preference rankings with per-vote timestamps"
    - claim: "Human behavioral adaptation in AI interactions (deskilling, over-reliance) is documented qualitatively"
      status: "BUILD_ON"
      evidence: "Dell'Acqua et al. 2023 (deskilling in consulting); Perez et al. 2023 arXiv:2310.10899 (AI sycophancy); both treat signals anecdotally, not as validated metrics"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    Skip re-verification of AI-to-human benchmark existence and dataset availability.
    Focus verification on: (1) behavioral proxy construct validity — distinguishing expertise gain
    from agency loss in WildChat metadata; (2) LMSYS Arena temporal structure suitability
    (continuous timestamps, model label coverage); (3) HH-RLHF temporal granularity
    (acknowledged as likely underpowered, demoted to supplementary).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BAA-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under publicly available human-AI interaction datasets (WildChat-1M, LMSYS Chatbot Arena,
    HH-RLHF) spanning 2022-2024, if AI-to-human alignment improves (rising HELM domain scores
    and LMSYS ELO ratings), then human-to-AI behavioral alignment proxies decline (decreasing
    prompt complexity, reduced preference vote entropy, lower correction frequency within
    returning user cohorts), because AI quality improvement reduces user incentive to critically
    probe, challenge, or correct AI outputs — creating measurable Bidirectional Alignment
    Asymmetry (BAA) detectable computationally without new annotation.
  alternative_hypothesis_h0: |
    There is no significant association between AI-to-human alignment metric improvement and
    human behavioral engagement proxies (prompt complexity, preference vote entropy, correction
    frequency) in existing public datasets — i.e., the two alignment directions are independent
    or positively correlated, not asymmetric.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "AI-to-human alignment score"
      type: "continuous"
      operationalization: "HELM domain-stratified accuracy scores per model version; LMSYS ELO rating per model per monthly bin"
    - name: "Time / user tenure"
      type: "continuous"
      operationalization: "Calendar month (2023-01 to 2024-12) for temporal analysis; user session cohort month for within-cohort analysis"
  dependent:
    - name: "Human behavioral engagement composite (BAA proxy)"
      type: "continuous"
      operationalization: "Composite of: (a) mean prompt token count per monthly cohort bin in WildChat-1M, (b) Shannon entropy of win/lose/tie preference votes per monthly bin in LMSYS Arena, (c) correction/negation frequency per session in WildChat-1M. Higher composite = more critical engagement = lower human-to-AI alignment"
      primary: true
    - name: "Within-cohort prompt complexity trend"
      type: "continuous"
      operationalization: "Mann-Kendall τ computed on prompt token count time series for users appearing in ≥3 consecutive monthly bins in WildChat-1M"
      primary: false
    - name: "LMSYS preference vote entropy"
      type: "continuous"
      operationalization: "Shannon entropy H = -Σ p_i log p_i computed on win/lose/tie distribution per monthly bin per model pair"
      primary: false
  controlled:
    - name: "Topic/domain distribution"
      operationalization: "Stratify WildChat analyses by topic tag (coding, creative, medical/health); stratify HELM scores by corresponding scenario domain"
    - name: "Model version"
      operationalization: "Align WildChat temporal cohorts to specific model version deployment dates; use model label in LMSYS Arena for cross-model stratification"
    - name: "User cohort entry time"
      operationalization: "Between-cohort decomposition: compare early-joiner cohorts (Q1 2023) vs. late-joiner cohorts (Q3-Q4 2023) to test whether composition drift explains behavioral trends"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "AI-to-human alignment improvement — model produces higher-quality, more satisfying responses to surface-level user needs"
      evidence: "HELM and LMSYS ELO show consistent improvement across model generations (GPT-3.5 → GPT-4 → GPT-4o); corroborated by TruthfulQA score improvements"
      falsifier: "If AI-to-human alignment shows no consistent improvement trend in LMSYS ELO across the 2023-2024 observation window, Step 1 does not hold and the causal chain breaks"
    - step: 2
      description: "Higher response quality reduces user perceived need to probe, correct, or challenge AI outputs — the AI 'earns' user trust and reduces friction"
      evidence: "Dell'Acqua et al. 2023 shows task performance improved but critical engagement declined in consulting professionals; analogous mechanism in general ChatGPT use expected in WildChat"
      falsifier: "If within-cohort correction frequency does not decline as model quality improves (no negative correlation between LMSYS ELO and WildChat correction rate per session), Step 2 is not supported"
    - step: 3
      description: "Reduced critical engagement manifests as measurable behavioral convergence — shorter prompts, less follow-up, more first-answer acceptance — visible in interaction log metadata"
      evidence: "WildChat metadata includes prompt token count, turn count, session length — all sensitive to behavioral convergence. LMSYS Arena vote entropy is sensitive to preference homogenization"
      falsifier: "If prompt complexity trend within cohorts is not monotonically decreasing (Mann-Kendall τ not significantly negative) or LMSYS vote entropy does not decline over time, Step 3 is not supported"
  key_tension: "Reverse causality — user composition drift (less expert users joining later) could produce identical behavioral signals to genuine within-user behavioral adaptation. Addressed by within-cohort vs. between-cohort decomposition, but IP-hash anonymization in WildChat limits cohort precision."
  evidence_summary: |
    The causal chain is supported by indirect evidence from Dell'Acqua et al. 2023 (deskilling),
    Perez et al. 2023 (AI sycophancy), and Shen et al. 2024 (conceptual framework). Direct
    empirical evidence is absent — providing this is the primary contribution of the study.
    The mechanism is internally consistent and generates unique falsifiable predictions
    distinguishable from alternative explanations.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "WildChat prompt metadata (token count, turn count, topic tags) reflects genuine behavioral patterns rather than dataset artifacts from the collection procedure"
    supporting_evidence: "WildChat-1M is collected from real ChatGPT API users; Zhao et al. 2024 document collection methodology with minimal filtering"
    consequence_if_violated: "All WildChat-based analyses would be confounded; restrict analysis to LMSYS Arena as primary, downgrading WildChat to supplementary"
  - id: "A2"
    assumption: "LMSYS Arena preference votes represent genuine human judgment rather than strategic or gamified voting"
    supporting_evidence: "Zheng et al. 2023 describe quality controls; multiple rounds of voting per pair; ELO stability as quality indicator"
    consequence_if_violated: "Temporal preference vote entropy analysis would be invalid; would need to validate with non-Arena preference sources"
  - id: "A3"
    assumption: "Prompt token count decline within user cohorts reflects reduced critical engagement rather than expertise gain (efficiency without agency loss)"
    supporting_evidence: "The within-cohort + topic diversity combination test distinguishes expertise gain (shorter prompts + maintained diversity + maintained correction) from agency loss (shorter prompts + reduced diversity + reduced correction)"
    consequence_if_violated: "Primary behavioral proxy is invalid; would require a different proxy set or domain-specific validation study"
  - id: "A4"
    assumption: "HELM domain scores for specific model versions can be temporally aligned with WildChat conversation dates for those model versions"
    supporting_evidence: "HELM publication provides model version evaluation dates; WildChat metadata includes model version field; alignment is feasible but requires careful version mapping"
    consequence_if_violated: "H3 cross-sectional BAA correlation would be unreliable; demote H3 to exploratory analysis"
  - id: "A5"
    assumption: "The observed behavioral signals represent the human-to-AI alignment direction (not confounded by model capability changes affecting prompt strategy)"
    supporting_evidence: "The within-cohort design controls for model version effects by stratifying by model; residual trends within-model-version are attributable to behavioral adaptation"
    consequence_if_violated: "Confounding between model improvement and behavioral adaptation cannot be fully separated; results interpreted as correlational associations, not causal"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    English-language human-AI interactions on general-purpose LLM platforms (ChatGPT via
    WildChat, LMSYS Arena multi-model) during the 2023-2024 deployment period. Applies
    to analysis of publicly available interaction metadata without individual user tracking.
    Covers three topic domains: coding assistance, creative writing, medical/health queries
    (WildChat topic tags). Applies to multiple model families present in LMSYS Arena
    (GPT-4, Claude, Llama, Mistral series).
  does_not_apply_to: |
    Proprietary or closed interaction logs not publicly available. Human-AI interactions
    in specialized high-stakes settings (clinical decision support, legal AI) requiring
    dedicated study. Non-English language interactions (WildChat includes multilingual
    data but analysis requires language-stratified sub-analysis not in current scope).
    Future AI systems not yet deployed at time of analysis.
  known_limitations: |
    1. WildChat user anonymization (IP-hash) limits longitudinal cohort precision.
    2. HH-RLHF has coarse temporal structure (3-4 collection phases) — low power for temporal analysis.
    3. HELM provides cross-sectional AI-to-human scores, not a continuous time series — limits temporal causal analysis to correlational.
    4. User composition drift (expertise selection bias) partially confounds within-cohort analysis despite between-cohort decomposition.
    5. All sources from Phase 1 are [INFERRED] — paper IDs and dataset specifics require verification before Phase 3 implementation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Monthly Shannon entropy of LMSYS Arena preference votes (win/lose/tie distribution per model pair) decreases monotonically across the 2023-2024 observation window as LMSYS ELO ratings for top models improve"
    test_method: "Compute monthly vote entropy per top-5 model pairs in LMSYS Arena; apply Mann-Kendall trend test; compute Spearman correlation between monthly mean ELO and monthly mean entropy"
    success_criterion: "Mann-Kendall τ < 0 with p < 0.05 AND Spearman ρ < -0.4 between ELO and vote entropy"
    falsification: "τ not significantly negative (p > 0.05) or positive correlation between ELO and entropy"
  - id: "P2"
    primary: false
    statement: "Within WildChat-1M returning user cohorts (users present in ≥3 consecutive monthly bins), prompt token count declines monotonically over user tenure, and this decline is steeper for early-joiner cohorts (Q1 2023) than late-joiner cohorts (Q3 2023), ruling out composition drift as the sole explanation"
    test_method: "Construct monthly cohorts from WildChat IP-hash clustering; compute Mann-Kendall τ on prompt token count per cohort; compare τ magnitudes between early (Q1 2023) and late (Q3 2023) cohort entries using bootstrap confidence intervals"
    success_criterion: "Within-cohort Mann-Kendall τ significantly negative (p < 0.05) AND early-cohort τ magnitude significantly larger than late-cohort τ"
    falsification: "Non-significant within-cohort trend OR late-cohort shows equally strong decline as early-cohort (consistent with composition drift)"
  - id: "P3"
    primary: false
    statement: "Cross-sectional BAA (AI-to-human HELM domain score minus WildChat behavioral proxy mean per domain, per model version) exhibits significant negative Spearman correlation across the three test domains (coding, creative, medical)"
    test_method: "Compute HELM domain scores per model version per domain; compute WildChat behavioral proxy composite (prompt complexity + correction frequency) per model version per topic tag; Spearman correlation across (domain × model version) cells"
    success_criterion: "Spearman ρ < -0.3 with p < 0.05 across domain-model cells"
    falsification: "Non-significant or positive Spearman correlation between HELM domain score and behavioral proxy composite"

