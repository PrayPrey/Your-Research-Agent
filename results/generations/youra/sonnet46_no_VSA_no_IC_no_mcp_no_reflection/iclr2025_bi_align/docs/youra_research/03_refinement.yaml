  key_innovation: "Operationalizing human-to-AI alignment as a behavioral proxy composite (prompt complexity, preference entropy, correction frequency) extractable from existing interaction metadata — converting a qualitatively discussed phenomenon into a computationally measurable construct"
  differentiation:
    - prior_work: "Shen et al. 2024 'Towards Bidirectional Human-AI Alignment' (survey)"
      difference: "Shen et al. define both directions theoretically across 400+ papers but provide no measurement methodology. This work provides the first empirical quantification using existing data."
    - prior_work: "Dell'Acqua et al. 2023 (deskilling study)"
      difference: "Dell'Acqua studies deskilling in a single domain (consulting) via field experiment. This work uses observational data at scale across multiple domains and multiple model versions."
    - prior_work: "Perez et al. 2023 'Sycophancy to Subterfuge'"
      difference: "Perez measures AI sycophancy (AI-to-human direction). This work measures the counterpart: human behavioral convergence toward AI preferences (human-to-AI direction)."
    - prior_work: "HELM (Liang et al. 2022)"
      difference: "HELM measures only AI-to-human alignment. This work uses HELM scores as the AI-to-human anchor and introduces the human-to-AI proxy as the complementary measurement."

