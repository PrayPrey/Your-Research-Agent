  dataset:
    name: "LMSYS Chatbot Arena + WildChat-1M + HH-RLHF (multi-dataset)"
    type: "standard"
    source: "HuggingFace + FastChat GitHub + anthropics/hh-rlhf GitHub"
    path: "allenai/WildChat-1M (HuggingFace); lm-sys/FastChat (GitHub); anthropics/hh-rlhf (GitHub)"
    hypothesis_fit: "LMSYS Arena provides continuous timestamped preference votes for P1 temporal analysis. WildChat-1M provides behavioral metadata for P2 cohort analysis and P3 cross-domain BAA. HH-RLHF provides supplementary inter-annotator agreement test."
  model:
    name: "GPT-4/GPT-3.5/Claude/Llama models (as observed in existing datasets)"
    type: "Existing deployed models analyzed as data subjects — no new model training"
    source: "Model outputs already in WildChat and LMSYS Arena logs"
    hypothesis_fit: "Multiple model versions over time provide the AI-to-human alignment variation needed to test the negative association hypothesis"
  baselines:
    - name: "Null hypothesis baseline"
      method: "Mann-Kendall test of stationarity (H0: τ = 0) for all trend analyses"
    - name: "Composition drift alternative"
      method: "Between-cohort decomposition comparing early vs. late cohort entry to distinguish behavioral adaptation from selection bias"
    - name: "Expertise gain alternative"
      method: "Topic diversity + correction frequency control — expertise gain predicts shorter prompts but maintained diversity and correction; agency loss predicts shorter prompts with reduced diversity and correction"

