hypothesis_draft:
  title: "Bidirectional Alignment Asymmetry (BAA): Empirical Measurement from Existing Interaction Datasets"
  hypothesis_id: "H-BAA-v1"
  core_claim: |
    Bidirectional Human-AI Alignment exhibits measurable and statistically significant asymmetry
    in existing public datasets: AI-to-human alignment improvement (rising HELM domain scores,
    LMSYS ELO) is negatively associated with human-to-AI behavioral engagement (prompt complexity,
    preference vote entropy, correction frequency) — detectable computationally without new
    annotation, new benchmarks, or synthetic data.
  mechanism: |
    As AI models improve on AI-to-human metrics, higher-quality responses reduce user incentive
    to critically probe, challenge, or correct AI outputs. This creates measurable behavioral
    convergence toward AI-preferred interaction patterns (shorter prompts, more first-answer
    acceptance, more homogeneous preference votes) — a self-reinforcing divergence between the
    two alignment directions that current single-direction evaluation frameworks are blind to.
  predictions:
    - P1: "LMSYS preference vote entropy declines monotonically (Mann-Kendall τ < 0, p < 0.05) as LMSYS ELO rises across 2023-2024"
    - P2: "WildChat within-cohort prompt complexity declines monotonically (Mann-Kendall τ < 0) with early-cohort decline steeper than late-cohort (ruling out composition drift)"
    - P3: "Cross-sectional BAA (HELM domain score vs. WildChat behavioral proxy per domain) shows significant negative Spearman correlation (ρ < -0.3, p < 0.05)"

variables_summary:
  independent: "AI-to-human alignment score (HELM domain scores per model version; LMSYS ELO per monthly bin)"
  dependent_primary: "Human behavioral engagement composite: prompt token count trend + LMSYS vote Shannon entropy + WildChat correction/negation frequency"
  controlled: "Topic domain (coding/creative/medical), model version, user cohort entry time (between-cohort decomposition)"

null_hypothesis:
  h0_statement: |
    There is no significant negative association between AI-to-human alignment metrics and
    human behavioral engagement proxies in existing public datasets. The two alignment directions
    are statistically independent or positively correlated.
  statistical_test: "Mann-Kendall trend test (temporal analyses); Spearman rank correlation (cross-sectional BAA)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical quantification of BAA from existing public data using behavioral proxies — no annotation required"
  differentiation_summary: |
    Shen et al. 2024 (survey): theoretical framework only, no measurement.
    Dell'Acqua 2023: single-domain field experiment, no AI-to-human alignment comparison.
    Perez 2023: AI sycophancy only (AI-to-human direction), no counterpart human-to-AI measurement.
    HELM/lm-eval/reward-bench: AI-to-human only — no human behavioral direction.
    This work: simultaneous bidirectional measurement from existing metadata, at scale, across
    multiple domains and model versions.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "GPT-3.5-turbo (as observed in WildChat 2023)"
    - "GPT-4 variants (as observed in WildChat/LMSYS 2023-2024)"
    - "Claude series (as observed in LMSYS Arena)"
    - "Llama/Mistral series (as observed in LMSYS Arena)"
  datasets:
    - "WildChat-1M (allenai/WildChat-1M, HuggingFace)"
    - "LMSYS Chatbot Arena (lm-sys/FastChat, GitHub)"
    - "HH-RLHF (anthropics/hh-rlhf, GitHub) — supplementary"
    - "HELM benchmark results (stanford-crfm/helm, GitHub) — cross-sectional anchor"
  baselines:
    - "Null hypothesis (stationary trends)"
    - "Composition drift alternative (between-cohort decomposition)"
    - "Expertise gain alternative (topic diversity + correction frequency control)"

measurement_plan:
  data_collection:
    - source: "WildChat-1M: Download from HuggingFace, extract prompt_tokens, timestamp, topic_category, turn_count, model_version fields"
    - source: "LMSYS Arena: Download conversation logs from FastChat repo, extract model_a, model_b, winner, timestamp fields"
    - source: "HH-RLHF: Download from anthropics/hh-rlhf, extract annotator_id, timestamp, chosen/rejected preference labels"
    - source: "HELM: Extract published domain-stratified accuracy scores per model version from HELM results pages (no recomputation needed)"
  procedure:
    - step: "Construct WildChat monthly cohorts via IP-hash clustering; compute prompt token count mean per cohort per month"
    - step: "Compute Mann-Kendall τ on within-cohort prompt token count time series (≥3 data points per cohort)"
    - step: "Compute Shannon entropy of LMSYS win/lose/tie votes per monthly bin per top-5 model pair; compute Spearman ρ with monthly mean ELO"
    - step: "Align HELM domain scores with WildChat topic tags per model version; compute Spearman ρ across (domain × model version) cells"
    - step: "Between-cohort decomposition: compare Mann-Kendall τ for early (Q1 2023) vs. late (Q3 2023) WildChat cohorts via bootstrap CI"
  success_criteria:
    - "P1: Mann-Kendall τ < 0 (p < 0.05) on LMSYS vote entropy AND Spearman ρ < -0.4 with ELO"
    - "P2: Within-cohort τ significantly negative AND early-cohort |τ| > late-cohort |τ|"
    - "P3: Cross-domain Spearman ρ < -0.3 (p < 0.05)"

validation:
  internal_validity:
    - "Within-cohort design controls for user composition drift (each user serves as their own control)"
    - "Between-cohort decomposition provides direct test of composition drift alternative"
    - "Topic diversity + correction frequency combination distinguishes expertise gain from agency loss"
    - "Model version stratification controls for capability change confounds within domains"
  external_validity:
    - "LMSYS Arena covers multiple model families (GPT, Claude, Llama, Mistral) — cross-model generalization"
    - "Three topic domains (coding, creative, medical) — cross-domain replication"
    - "2023-2024 time range covers a major period of model improvement — ecologically valid"
    - "WildChat represents organic API usage; LMSYS represents structured evaluation — two sampling frames"

discussion_synthesis:
  key_insights:
    - "Human-to-AI alignment has been hiding in existing metadata, operationalizable without any new data collection"
    - "Behavioral proxy construct validity requires combining multiple signals (complexity + diversity + correction) to distinguish expertise gain from agency loss"
    - "LMSYS Arena preference vote entropy is a cleaner primary temporal signal than HH-RLHF inter-annotator agreement (better temporal resolution)"
    - "Reverse causality (composition drift) is addressable within existing data via within-cohort vs. between-cohort decomposition"
    - "Current AI evaluation creates a 'false positive risk': high HELM/ELO may coexist with human-to-AI misalignment undetected by existing frameworks"
  breakthrough_moments:
    - "Exchange 2 (Prof. Vera): Identified the expertise-vs-agency confound and proposed the testable within-cohort decomposition to distinguish them"
    - "Exchange 6 (Prof. Rex): Reframed H3 from Granger causality (requiring HELM time series) to cross-sectional BAA correlation (achievable with HELM as snapshot) — critical feasibility fix"
    - "Exchange 7 (Dr. Nova): Proposed LMSYS preference vote entropy as primary temporal signal — cleaner and more computable than inter-annotator agreement"
  resolved_tensions:
    - "HELM temporal limitation resolved: reframed as cross-sectional BAA rather than temporal Granger causality"
    - "HH-RLHF power limitation resolved: demoted to supplementary pilot test, LMSYS Arena promoted to primary"
    - "Reverse causality resolved: within-cohort + between-cohort decomposition design addresses the main alternative explanation"
