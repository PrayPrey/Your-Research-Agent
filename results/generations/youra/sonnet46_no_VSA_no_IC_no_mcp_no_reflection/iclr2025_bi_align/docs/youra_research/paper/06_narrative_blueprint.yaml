# Phase 6 Narrative Blueprint
# Generated: Step 02 — Narrative Design
# Research: Bidirectional Alignment Asymmetry (BAA) — Phase 4.5 Synthesis

metadata:
  hypothesis_id: "h-e1-v2"
  paper_title: "Do Better AI Models Make Us Intellectually Lazier? A Negative Result on Bidirectional Alignment Asymmetry in Large-Scale Interaction Logs"
  format: "ICML2025"
  primary_source: "045_validated_hypothesis.md"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_finding"
  opening_statement:
    content: "We set out to measure whether improving AI quality makes users intellectually lazier — and found the opposite: returning users of a large-scale AI interaction platform compose progressively longer, more elaborate prompts over 2023–2024, not shorter ones."
    rationale: "Directly contradicts the intuitive deskilling narrative (Dell'Acqua 2023); grabs reviewers who expect a positive BAA confirmation result."

  why_reader_should_care:
    main_reason: "If AI improvement were causing behavioral disengagement, this would be detectable from existing logs — no new annotation needed. A validated measurement framework for this would matter enormously for AI safety and deployment policy."
    concrete_example: "With LMSYS ELO ratings rising steadily and models like GPT-4 replacing GPT-3.5, do users ask simpler questions? The answer, for the users who keep returning, is: no — they ask more complex ones."
    stakes: "If BAA-driven disengagement is real but currently unmeasurable, safety evaluations that rely on user behavioral signals are blind to a systematic human adaptation effect."

  tension_introduced: "But is the prompt-growth finding a genuine behavioral adaptation signal, or merely an artifact of who returns — power users who would compose complex prompts regardless of AI quality? This paper cannot resolve that tension, but establishes it empirically and provides the tooling to test it."

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "AI alignment research focuses heavily on improving AI-to-human alignment (models that better serve human intent) but largely ignores the reverse: how humans adapt their behavior in response to AI quality changes."
    common_understanding: "Alignment = making AI safer, more helpful, less harmful. Human behavioral change in AI interactions is treated as a UX or HCI concern, not an alignment measurement challenge."

  deeper_problem:
    description: "As AI quality improves, users may reduce the critical engagement behaviors that historically served as quality signals — shorter prompts, less explicit correction, less discriminating preference voting. This creates a Bidirectional Alignment Asymmetry (BAA): AI improves on benchmarks while human behavioral engagement declines, making future AI training data systematically less informative."
    why_overlooked: "The BAA framework requires simultaneously measuring both alignment directions against time — a data infrastructure challenge that has kept the two literatures separate."
    our_perspective: "Behavioral proxy signals ARE computationally detectable from existing interaction metadata (WildChat-1M, LMSYS Arena) without new annotation — but the BAA directional prediction (declining engagement) is empirically incorrect for the most reliably measured proxy."

  gap_in_existing_work:
    description: "No prior work has empirically tested the directional BAA prediction — that improving AI quality leads to measurably declining human behavioral engagement in public interaction logs."
    why_gap_exists: "The measurement requires: (a) large-scale interaction logs with temporal coverage, (b) user-level behavioral tracking across time, (c) AI quality metrics that align temporally with the behavioral data. These have never been combined for hypothesis testing."
    why_gap_matters: "If declining behavioral engagement is undetected, RLHF-style training may be using progressively less informative feedback signals from increasingly disengaged users — a silent degradation in training data quality."

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  type: "observation_based"
  aha_moment:
    one_sentence: "Returning WildChat-1M users compose significantly longer prompts over 2023–2024 (τ=+0.744, p<0.001, Hamed-Rao corrected), directly contradicting the BAA disengagement prediction — but the returning-user cohort design that makes this signal detectable also introduces a selection bias that prevents causal attribution."
    expanded_explanation: >
      The experiment was designed to detect behavioral signals as a prerequisite before testing BAA directional claims.
      It succeeded in detecting a strong temporal trend — but the direction was positive (growing engagement), not negative (declining engagement).
      The methodology (returning-user cohort, Mann-Kendall with autocorrelation correction) is validated and reusable;
      the hypothesis's directional prediction is not.

  why_others_missed_it:
    common_assumptions: "Prior work assumed BAA disengagement would produce shorter, simpler prompts as users offload cognitive effort to AI. The deskilling analogy (Dell'Acqua 2023) motivated this direction."
    our_different_view: "We found that the 'returns to use AI repeatedly' self-selection filter dominates any disengagement effect. Power users — by definition — engage more, not less, over time."
    enabling_factor: "WildChat-1M's IP-hash pseudonymization enabled returning-user cohort construction at scale (n=27,902 users, 13 monthly bins) without IRB-sensitive individual tracking."

  what_makes_it_work:
    intuitive_explanation: "Users who keep coming back to an AI tool are not the ones who've given up on thinking — they're the ones who've gotten better at using it."
    key_mechanism: "Hamed-Rao Mann-Kendall test (handles autocorrelated time series) on monthly mean prompt token count for users appearing in ≥3 monthly bins. ACF lag-1=0.634 confirms the autocorrelation correction is necessary."

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Behavioral proxy signals from returning WildChat-1M users are computationally detectable and show a strong positive temporal trend in prompt length (τ=+0.744, p<0.001) — contradicting the BAA disengagement prediction."
    measurable_criteria: "Mann-Kendall τ ≠ 0 with p < 0.05; effect ≥ 0.2; Hamed-Rao correction for autocorrelation."

  supporting_evidence:
    - id: "evidence_1"
      what: "Prompt token count in returning WildChat cohorts (n=27,902 users, 13 monthly bins): τ=+0.744, p=0.0005, consistent across h-e1 (τ=+0.564, p=0.007) and h-e1-v2"
      so_what: "The strongest behavioral signal in returning users grows over time — two independent experiment rounds confirm direction and significance."
      how_it_supports_claim: "Establishes that behavioral proxies ARE trend-detectable; refutes the BAA decline direction for the most reliable proxy."
      figures: ["fig2_proxy_timeseries.png", "fig1_gate_summary.png"]

    - id: "evidence_2"
      what: "Correction/negation frequency: τ=0.051, p=0.855; monthly base rate ~0.05% of turns"
      so_what: "Explicit verbal corrections are too sparse for trend analysis; the proxy design is inadequate, not the hypothesis per se."
      how_it_supports_claim: "Motivates redesigned implicit correction proxies for future work; shows the measurement challenge is real."
      figures: ["fig1_gate_summary.png"]

    - id: "evidence_3"
      what: "LMSYS primary dataset (lmsys/chatbot_arena_conversations) is access-gated; fallback contains no timestamps"
      so_what: "Vote entropy — the primary cross-dataset BAA test — is infrastructurally blocked, not conceptually impossible."
      how_it_supports_claim: "Constrains the paper's scope to WildChat-based proxies; identifies the critical gap for future work."

    - id: "evidence_4"
      what: "Cohort funnel: all WildChat users → ≥1 monthly bin → ≥3 monthly bins (n=27,902 for analysis)"
      so_what: "The ≥3 bin filter is aggressive — retains high-engagement users who represent a non-representative slice of all AI users."
      how_it_supports_claim: "Honest account of selection bias as the primary competing explanation for the positive trend."
      figures: ["fig3_cohort_funnel.png"]

  surprising_findings:
    - finding: "Prompt length INCREASES strongly (τ=+0.744) rather than declining"
      why_surprising: "BAA theory and deskilling narratives predict declining engagement proxy as AI quality improves"
      our_interpretation: "Power-user self-selection (≥3 monthly bins = high-engagement filter) combined with genuine user expertise gain both predict increasing prompt length, independent of AI quality. BAA disengagement mechanism is not required to explain the data."

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "The first empirical negative result on the BAA disengagement prediction: returning AI users do NOT show declining behavioral engagement, and measuring whether any users do requires substantially more sophisticated cohort design and data access than current public resources allow."
    why_significant: "Constrains a theoretically motivated but empirically untested framework; provides a validated methodology and a clear research infrastructure roadmap."

  implications:
    for_field: "Bidirectional alignment measurement is harder than expected from public logs; returning-user cohort studies systematically sample high-engagement users; LMSYS Arena temporal data requires institutional access."
    for_practice: "AI deployment teams monitoring user behavioral signals should not assume that positive engagement trends indicate absence of BAA — the current result cannot distinguish adaptation from self-selection."

  future_possibilities:
    immediate_extensions: "Non-returning user comparison (difference-in-differences); LMSYS primary access for vote entropy; within-user vs. between-cohort variance decomposition."
    longer_term_vision: "A validated bidirectional alignment dashboard — tracking both AI benchmark scores and behavioral engagement proxies from returning users across major model versions — would provide early warning of disengagement-driven training data degradation."

# ============================================================================
# SECTION GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: BAA theory → measurement attempt → counterintuitive positive finding → selection bias problem → scope of contribution"
    key_message: "We tested BAA disengagement empirically and found the opposite — prompt length grows in returning users — but selection bias prevents causal interpretation; the measurement methodology is the contribution."
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook (counterintuitive finding) → Problem (BAA theory + measurement gap) → Insight (proxy detectability but wrong direction) → Preview contributions"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Having established the BAA framework as a theoretically motivated but empirically untested question, we review what prior work on human behavioral adaptation in AI interactions has and has not addressed."
    contributions_as_story: "Four contributions told as a narrative arc: (1) first BAA directional test, (2) validated measurement pipeline, (3) infrastructure finding about LMSYS access, (4) selection bias characterization."

  related_work:
    narrative_purpose: "Show existing work on AI deskilling, behavioral adaptation, and alignment measurement does not empirically test BAA — justify that this paper fills a gap"
    positioning_strategy: "Acknowledge Dell'Acqua 2023 (deskilling), Perez et al. 2023 (sycophancy), Shen et al. 2024 (BAA framework survey) — none test the directional BAA prediction at scale"
    key_comparison_points:
      - "Deskilling studies (consulting) use task assignment, not interaction logs"
      - "RLHF feedback quality literature does not track behavioral trends over time"
      - "WildChat analysis papers do not construct returning-user cohorts or test temporal trends"
      - "Shen et al. 2024 identifies BAA theoretically but provides no empirical measurement"

  methodology:
    narrative_purpose: "Explain WHY each design choice follows from the insight — returning-user filter makes proxy detectable, Hamed-Rao corrects for autocorrelation, proxy trio covers three behavioral dimensions"
    connection_to_insight: "The ≥3 monthly bin filter was designed to detect within-user behavioral change — but this same filter creates the selection bias that complicates causal interpretation."
    key_design_decisions:
      - "WildChat-1M: 1M conversations, IP-hash pseudonymization, temporal coverage, sufficient cohort size"
      - "Returning-user filter (≥3 bins, ≥50 users/bin): trades representativeness for trend detectability"
      - "Hamed-Rao Mann-Kendall: handles autocorrelated time series (ACF lag-1=0.634 would violate standard M-K assumptions)"
      - "Three proxy tier: prompt tokens (reliable), vote entropy (blocked), correction frequency (too sparse)"
      - "Bootstrap CI (B=1000) for proxy effect estimation"

  experiments:
    narrative_purpose: "Frame three experimental questions that each test a specific BAA sub-prediction; be honest about which could and could not be tested"
    experimental_questions:
      - "Q1: Does prompt complexity in returning WildChat cohorts decline over 2023-2024? (Testable)"
      - "Q2: Does preference vote entropy in LMSYS Arena decline as ELO improves? (Blocked by access)"
      - "Q3: Does correction frequency in returning WildChat cohorts decline over time? (Sparse signal)"

  results:
    narrative_purpose: "Lead with the strong unexpected result (τ=+0.744), then present the failures honestly, then show the cohort funnel to contextualize the selection issue"
    main_result_highlight: "Proxy 1 (prompt tokens): τ=+0.744, p<0.001 — strong, significant, POSITIVE trend. Gate criterion (τ < 0) not met."
    result_sequence: "gate_summary → proxy_1_timeseries → cohort_funnel → comparison_with_h-e1"

  discussion:
    narrative_purpose: "Interpret the positive trend (three competing explanations), acknowledge limitations honestly, frame the negative result as scientifically informative"
    honest_limitations:
      - "Returning-user selection bias may explain positive trend entirely"
      - "Vote entropy inaccessible — central BAA cross-dataset test untestable"
      - "Correction frequency proxy inadequate; BAA mechanism via correction unverifiable"
      - "No causal chain from AI quality to behavioral change verified"
    framing: "A negative result that constrains theory and provides a validated methodology is a contribution, not a failure."

  conclusion:
    narrative_purpose: "Callback to hook ('we found the opposite') → summary of what was established → open the future research agenda"
    callback_to_hook: "The answer to 'do better AI models make us intellectually lazier?' is, for returning users in 2023-2024: empirically, no — but the right comparison group has not yet been assembled."
    future_agenda: "Non-returning user comparison; LMSYS primary access; post-2024 cohorts; topic diversity as alternative engagement proxy"

# ============================================================================
# NARRATIVE COHERENCE CHECKLIST
# ============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES — hook ('found the opposite') closes with 'but right comparison group not yet assembled'"

  - check: "Does each section naturally flow to the next?"
    status: "YES — Intro (why it matters) → Related (gap) → Method (how we test) → Experiments (what we ran) → Results (what we found) → Discussion (what it means) → Conclusion (where next)"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES — strong positive trend + selection bias problem + methodology contribution thread through all sections"

  - check: "Are all major claims supported by evidence?"
    status: "YES — τ=+0.744 (two experiment rounds); LMSYS access failure (factual); correction sparsity (base rate); cohort n=27,902"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES — counterintuitive result (opposite of prediction) + clean negative result framing + methodology contribution"

