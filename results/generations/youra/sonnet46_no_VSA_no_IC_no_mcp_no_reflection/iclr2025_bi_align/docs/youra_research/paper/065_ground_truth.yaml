# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from Phase 4-4.5 artifacts and validated paper
# Used by Adversary Agent to verify paper accuracy

version: "1.0"
extracted_at: "2026-08-31T00:00:00+00:00"
hypothesis_id: "h-e1-v2"
paper_file: "06_paper.md"

# ============================================================================
# CORE METRICS (from h-e1-v2/04_validation.md)
# ============================================================================

metrics:
  proxy_1_prompt_tokens:
    name: "Mann-Kendall τ — monthly mean prompt token count"
    our_value: 0.744
    p_value: 0.0005
    ci_95: [0.415, 0.972]
    acf_lag1: 0.634
    method: "Hamed-Rao modification"
    direction: "POSITIVE (increasing)"
    baa_prediction: "NEGATIVE (decreasing)"
    gate_verdict: "FAIL — direction opposite to prediction"
    time_range: "April 2023 – April 2024 (13 monthly bins)"
    approximate_start_value: 180  # tokens, April 2023
    approximate_end_value: 832    # tokens, April 2024
    growth_factor: 4.6

  proxy_2_vote_entropy:
    name: "Shannon entropy of LMSYS preference vote distribution"
    status: "NOT_COMPUTED"
    reason: "lmsys/chatbot_arena_conversations access-gated; fallback has no timestamps"
    gate_verdict: "FAIL — no data"

  proxy_3_correction_freq:
    name: "Mann-Kendall τ — correction/negation frequency"
    our_value: 0.051
    p_value: 0.855
    ci_95: [-0.441, 0.536]
    acf_lag1: 0.168
    method: "Hamed-Rao modification"
    base_rate: "~0.05% of turns"
    gate_verdict: "FAIL — not significant, near-zero signal"

  gate:
    criterion: "≥2/3 proxies significant at |τ| ≥ 0.2, p < 0.05"
    n_significant: 1
    threshold: 2
    result: "FAILED"

# ============================================================================
# COHORT STATISTICS (from h-e1-v2/04_validation.md)
# ============================================================================

cohort:
  dataset: "allenai/WildChat-1M"
  date_range: "2023-01 to 2024-12"
  returning_user_criterion: "≥3 distinct monthly bins"
  min_cohort_size_per_bin: 50
  monthly_bins_obtained: 13
  effective_date_range: "April 2023 – April 2024"
  analysis_cohort_size: 27902  # returning users
  bootstrap_B: 1000
  bootstrap_seed: 42

# ============================================================================
# REPLICATION (from h-e1/04_validation.md)
# ============================================================================

replication:
  h_e1_proxy_1_tau: 0.564
  h_e1_proxy_1_p: 0.007
  h_e1_v2_proxy_1_tau: 0.744
  h_e1_v2_proxy_1_p: 0.0005
  direction_consistent: true
  significance_consistent: true

# ============================================================================
# METHODOLOGY (from 03_architecture.md, 03_prd.md)
# ============================================================================

methodology:
  tokenizer: "tiktoken cl100k_base"
  correction_regex: "r'\\b(no[,.]|actually[,.]|that\\'s wrong|please redo|i meant|wrong[,.])\\b'"
  acf_threshold: 0.1
  significance_threshold: 0.05
  effect_threshold: 0.2
  min_bins: 3
  min_cohort_size: 50

  modules:
    - "data_loader.py"
    - "cohort_builder.py"
    - "proxy_computer.py"
    - "stats_tester.py"
    - "visualizer.py"
    - "main.py"
    - "smoke_test.py"

