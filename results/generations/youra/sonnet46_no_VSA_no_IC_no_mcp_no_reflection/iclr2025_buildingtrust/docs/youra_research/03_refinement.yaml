# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "RLHF-aligned models score higher than SFT-only models on TruthfulQA"
      status: "BUILD_ON"
      evidence: "InstructGPT (Ouyang et al., 2022, arXiv:2203.02155) demonstrated this directly"
    - claim: "DPO achieves RLHF-comparable alignment quality on capability benchmarks (MT-Bench)"
      status: "BUILD_ON"
      evidence: "DPO paper (Rafailov et al., 2023, arXiv:2305.18290) showed DPO ≈ RLHF on MT-Bench/summarization"
    - claim: "Multi-dimensional trustworthiness benchmarks are not perfectly correlated"
      status: "BUILD_ON"
      evidence: "DecodingTrust (Wang et al., 2023, arXiv:2306.11698) showed GPT-4 is not uniformly more trustworthy than GPT-3.5 across 8 dimensions"
    - claim: "DPO vs SFT trustworthiness profile difference is detectable via benchmark suite"
      status: "PROVE_NEW"
      evidence: "No prior study has measured this — it is the research question itself"
    - claim: "Alignment strategy produces a classifiable fingerprint in 4D benchmark space"
      status: "PROVE_NEW"
      evidence: "No prior work applies classification/fingerprinting framing to alignment strategy detection"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    The three BUILD_ON claims can be treated as established baselines — do not re-verify them
    in Phase 2B. Build the experimental design on the assumption that RLHF improves TruthfulQA
    vs SFT (confirmed), DPO is comparable to RLHF on capability tasks (confirmed), and
    trustworthiness dimensions are partially independent (confirmed). The two PROVE_NEW claims
    are the experimental targets: (1) measure DPO vs SFT on unified benchmark suite; (2) test
    whether a k-NN classifier can distinguish alignment strategies from benchmark profiles.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-AlignFingerprint-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under inference-only evaluation of 7B-parameter language models fine-tuned on the same base
    model with matched data using DPO vs SFT alignment strategies, if we evaluate models on a
    4-benchmark trustworthiness suite (TruthfulQA MC2, BBQ, WinoGrande, WinoGender), then
    DPO-aligned models will exhibit a systematically different trustworthiness profile from
    SFT-aligned models — specifically higher fairness scores (BBQ, WinoGender) and
    neutral-to-lower truthfulness scores (TruthfulQA MC2) — and this profile difference will
    be detectable by a k-NN classifier with leave-one-out cross-validation (≥67% accuracy,
    permutation p≤0.05 across ≥6 matched model pairs), because DPO preference optimization
    rewards annotator-preferred responses that avoid bias-triggering patterns without explicitly
    rewarding factual accuracy.
  alternative_hypothesis_h0: |
    There is no significant difference in the 4D trustworthiness profile (TruthfulQA MC2,
    BBQ, WinoGrande, WinoGender scores) between DPO-aligned and SFT-aligned models trained
    on matched data; k-NN classifier accuracy is at or below chance (≤50%) and permutation
    test p > 0.05.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Alignment Strategy"
      type: "categorical"
      operationalization: "Training alignment method applied after pretraining: DPO (Direct Preference Optimization using preference pairs) vs SFT (Supervised Fine-Tuning on instruction-response data only)"
      levels:
        - "DPO"
        - "SFT"
  dependent:
    - name: "TruthfulQA MC2 Score"
      type: "continuous"
      operationalization: "Multiple-choice accuracy on TruthfulQA MC2 task via lm-evaluation-harness (--tasks truthfulqa_mc2); range [0,1]; higher = more truthful"
      primary: true
    - name: "BBQ Fairness Score"
      type: "continuous"
      operationalization: "Accuracy on BBQ task via lm-evaluation-harness (--tasks bbq); averaged across 9 social dimensions; range [0,1]; higher = less biased"
      primary: false
    - name: "WinoGrande Score"
      type: "continuous"
      operationalization: "Accuracy on WinoGrande commonsense robustness task via lm-evaluation-harness (--tasks winogrande); range [0,1]"
      primary: false
    - name: "WinoGender Score"
      type: "continuous"
      operationalization: "Gender-bias score on WinoGender coreference task (manual setup); range [0,1]; higher = less gender-biased"
      primary: false
    - name: "4D Profile Classification Accuracy"
      type: "continuous"
      operationalization: "k-NN (k=1) leave-one-out cross-validation accuracy over ≥6 DPO/SFT model pairs using 4D benchmark score vector as input; range [0,1]"
      primary: false
  controlled:
    - name: "Base Model Architecture"
      operationalization: "Use matched base model pairs (e.g., both from same base checkpoint); controlled via alignment-handbook SFT/DPO pairs from identical base"
    - name: "Model Size"
      operationalization: "7B parameter models only; exclude models >10B or <3B"
    - name: "Preference Data Source"
      operationalization: "Use alignment-handbook pairs with documented matched training data; report data source in model table for community variants"
    - name: "Evaluation Harness Version"
      operationalization: "Pin lm-evaluation-harness to specific commit hash; run same version for all models"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "DPO preference optimization learns from human preference pairs where annotators systematically favor responses that avoid bias-triggering language and stereotyped framings"
      evidence: "DPO paper (Rafailov et al., 2023) shows DPO implicitly learns from the reward signal encoded in human preferences; UltraFeedback and similar preference datasets disproportionately annotate bias avoidance as preferred"
      falsifier: "If DPO-trained models show no BBQ/WinoGender advantage over SFT models, annotator preference data does not encode sufficient bias-avoidance signal"
    - step: 2
      description: "DPO does not explicitly reward factual accuracy — its training objective maximizes preference likelihood, not truthfulness. SFT on instruction-following data often includes explicit factual Q&A pairs that reward accuracy directly."
      evidence: "DPO training data (preference pairs) is not primarily composed of factual verification tasks; TruthfulQA-type questions may not appear in DPO preference data, while SFT datasets (Alpaca, FLAN) include factual instruction-following. InstructGPT (Ouyang et al., 2022) shows RLHF with explicit truthfulness reward improves TruthfulQA — DPO lacks this explicit signal."
      falsifier: "If DPO models match SFT on TruthfulQA MC2, DPO's preference signal implicitly captures factual accuracy (not just bias avoidance)"
    - step: 3
      description: "The systematic bias-avoidance without factual-accuracy reward produces a characteristic 4D profile shape: relatively high fairness scores, relatively neutral-to-low truthfulness score, creating a detectable profile shift vs SFT"
      evidence: "DecodingTrust (Wang et al., 2023) shows trustworthiness dimensions are partially independent — so it is possible for DPO to improve on one dimension while not improving on another"
      falsifier: "If the 4D profile difference is too small for k-NN to detect above chance (permutation p>0.05), the fingerprint does not exist at this benchmark granularity"
  key_tension: "The mechanism claim cannot be verified without training data access; the study can detect the empirical pattern (fingerprint exists or not) but cannot confirm the DPO-preference-data causal chain without additional mechanistic experiments"
  evidence_summary: |
    The causal chain is plausible based on: (1) RLHF/DPO objective differences documented in training literature; (2) DecodingTrust showing trustworthiness dimensions are partially independent; (3) InstructGPT showing explicit truthfulness reward improves TruthfulQA. The mechanism is presented as a candidate explanation to be tested empirically, not as a verified causal claim. The primary test is empirical detection (fingerprint present/absent), not mechanistic verification.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "≥6 DPO/SFT matched model pairs with clear alignment documentation are identifiable on HuggingFace Hub"
    supporting_evidence: "alignment-handbook provides at least 1 clean pair (Zephyr-7B SFT/DPO); community models add more; 6 is a conservative estimate"
    consequence_if_violated: "Insufficient model pairs for permutation test significance; study becomes descriptive/pilot rather than confirmatory"
  - id: "A2"
    assumption: "lm-evaluation-harness correctly implements TruthfulQA MC2, BBQ, and WinoGrande such that scores reflect the intended trustworthiness constructs"
    supporting_evidence: "These are standard tasks in lm-evaluation-harness with extensive community testing; harness version will be pinned"
    consequence_if_violated: "Benchmark scores may not measure intended constructs; results may not replicate with other evaluation frameworks"
  - id: "A3"
    assumption: "The base model architecture and size are sufficiently controlled by selecting matched pairs (same base model checkpoint)"
    supporting_evidence: "alignment-handbook SFT/DPO pairs use identical base models; this is the strongest available control"
    consequence_if_violated: "Observed profile differences may be attributable to base model variation rather than alignment strategy"
  - id: "A4"
    assumption: "Human preference data used in DPO training encodes bias-avoidance signals at sufficient density to produce measurable BBQ/WinoGender effects"
    supporting_evidence: "UltraFeedback, OpenHermes, and similar DPO preference datasets include content safety and helpfulness ratings that penalize stereotyped responses"
    consequence_if_violated: "DPO fairness advantage may be absent; null result on BBQ/WinoGender dimensions"
  - id: "A5"
    assumption: "A k-NN classifier (k=1) in 4D Euclidean benchmark space is appropriate for detecting the alignment fingerprint given small n"
    supporting_evidence: "k-NN is non-parametric, requires no distributional assumptions, and LOO cross-validation is valid for small n; permutation test controls false positive rate"
    consequence_if_violated: "If 4D space is non-Euclidean or if k=1 is unstable, different distance metrics or k values may be needed; sensitivity analysis recommended"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    7B-parameter autoregressive language models fine-tuned from pretrained base models using
    DPO or SFT alignment strategies on English-language preference/instruction data. Models
    evaluated in zero-shot or few-shot inference mode (no additional fine-tuning after alignment).
    Benchmark suite: TruthfulQA MC2, BBQ, WinoGrande, WinoGender.
  does_not_apply_to: |
    Models larger than 10B or smaller than 3B parameters (scale effects may differ).
    RLHF (PPO-based) models — 3-way comparison is out of scope due to controlled-pair scarcity.
    Models with additional domain fine-tuning after alignment (robustness to downstream fine-tuning
    is a separate, secondary research question).
    Non-English models.
    Multimodal models.
  known_limitations: |
    Small model count (n≈6-10 pairs) limits statistical power — results are exploratory/confirmatory
    at pilot scale, not definitive at population scale. The mechanism claim (DPO preference data
    encodes bias-avoidance) cannot be verified without training data access. WinoGender is a small
    benchmark with binary gender framing — results on this dimension are exploratory. Community DPO
    models may have undocumented data differences not fully controlled.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "A k-NN (k=1) classifier using 4D benchmark scores (TruthfulQA MC2, BBQ, WinoGrande, WinoGender) achieves ≥67% leave-one-out accuracy over ≥6 matched DPO/SFT model pairs, with permutation test p≤0.05 (1000 permutations, random label shuffling)"
    test_method: "Collect benchmark scores for all model pairs via lm-evaluation-harness; construct n×4 score matrix; run sklearn k-NN LOO cross-validation; compute permutation test via sklearn permutation_test_score with 1000 permutations"
    success_criterion: "LOO accuracy ≥ 0.67 AND permutation p ≤ 0.05"
    falsification: "LOO accuracy < 0.50 (below chance) = fingerprint absent; 0.50 ≤ accuracy < 0.67 = fingerprint weak but present (inconclusive)"
  - id: "P2"
    primary: false
    statement: "TruthfulQA MC2 has the highest between-group variance relative to within-group variance (Fisher's criterion) among the 4 benchmark dimensions, making it the most discriminative single feature for DPO vs SFT classification"
    test_method: "Compute Fisher's criterion = (μ_DPO - μ_SFT)² / (σ²_DPO + σ²_SFT) for each of 4 benchmarks; rank by this criterion"
    success_criterion: "TruthfulQA MC2 ranks first among 4 benchmarks by Fisher's criterion"
    falsification: "Another benchmark (BBQ, WinoGrande, or WinoGender) ranks first by Fisher's criterion"
  - id: "P3"
    primary: false
    statement: "BBQ fairness score is higher for DPO models than matched SFT models in at least 4 of 6 model pairs (directional consistency)"
    test_method: "For each DPO/SFT matched pair, record sign of (BBQ_DPO - BBQ_SFT); count pairs where DPO > SFT; one-sided binomial sign test with n=6, k=4"
    success_criterion: "≥4/6 pairs show DPO > SFT on BBQ; binomial p ≤ 0.125 (one-sided)"
    falsification: "≤3/6 pairs show DPO > SFT on BBQ (directional pattern absent)"

