    hypothesis_fit: "All 4 benchmarks measure distinct trustworthiness dimensions (reliability, fairness, commonsense robustness, gender bias) and are available as standard tasks in lm-evaluation-harness, requiring no custom data collection"
  model:
    name: "HuggingFaceH4/zephyr-7b-sft-full + HuggingFaceH4/zephyr-7b-dpo-full (primary pair)"
    type: "7B autoregressive language model"
    source: "HuggingFace Hub — alignment-handbook official checkpoints"
    hypothesis_fit: "Best available controlled comparison: same base model (Mistral-7B), same training data, only alignment strategy differs (SFT vs DPO). Additional pairs sourced from community models with documented alignment."
  baselines:
    - name: "Majority-class classifier"
      method: "Always predict the majority alignment class in LOO CV — baseline for P1 accuracy comparison"
