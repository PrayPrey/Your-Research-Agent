# ============================================================================
# METHODOLOGY DETAILS
# ============================================================================

methodology:
  classifier: "k-NN (k=1, Euclidean distance)"
  cv_scheme: "LeaveOneOut"
  n_models: 12
  n_pairs: 6
  n_DPO: 6
  n_SFT: 6
  model_size: "7B"
  n_permutations: 1000
  random_seed: 42
  benchmarks:
    - name: "TruthfulQA MC2"
      task_key: "truthfulqa_mc2"
      metric: "acc,none"
    - name: "BBQ"
      task_key: "bbq"
      metric: "acc,none"
    - name: "WinoGrande"
      task_key: "winogrande"
      metric: "acc,none"
    - name: "WinoGender"
      task_key: "winograd_wsc"
      metric: "acc,none"
  evaluation_framework: "lm-evaluation-harness v0.4.3"
  batch_size: 8
  limit_per_task: 100
  dtype: "bfloat16"
  hardware: "5× NVIDIA H100 NVL"

