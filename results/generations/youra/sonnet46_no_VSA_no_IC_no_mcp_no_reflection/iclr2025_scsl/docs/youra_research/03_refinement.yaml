# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: >
        DNNs trained with ERM/SGD exhibit simplicity bias: spurious (simpler) features
        are learned before core (more complex) features.
      status: "BUILD_ON"
      evidence: "Shah et al. 2020 (formal proof); Geirhos et al. 2020 (~2000 citations); Arpit et al. 2017 (temporal learning dynamics)"

    - claim: >
        The spectral bias of gradient descent causes low-frequency components of the
        target function to be learned first.
      status: "BUILD_ON"
      evidence: "Rahaman et al. 2019 (~1000 citations); widely replicated"

    - claim: >
        ERM achieves poor worst-group accuracy on Waterbirds (~72%) and CelebA despite
        high average accuracy.
      status: "BUILD_ON"
      evidence: "Sagawa et al. 2020 Group DRO paper; reproducible with kohpangwei/group_DRO"

    - claim: >
        JTT (misclassification as proxy for minority) and LfF (high relative loss as proxy)
        improve worst-group accuracy without group labels but underperform DFR.
      status: "BUILD_ON"
      evidence: "Liu et al. 2021 (JTT); Nam et al. 2020 (LfF); Kirichenko et al. 2022 (DFR)"

    - claim: >
        Per-sample gradient alignment direction with batch mean differs between
        statistical minority and majority samples on spurious correlation benchmarks
        where spurious-minority = statistical minority.
      status: "PROVE_NEW"
      evidence: "Hypothesized from discussion; not demonstrated on Waterbirds/CelebA"

    - claim: >
        Online gradient-alignment-based upweighting improves worst-group accuracy
        over JTT in a single training run.
      status: "PROVE_NEW"
      evidence: "Proposed intervention; not experimentally validated"

  scope_reduction_percentage: 67  # 4 BUILD_ON / 6 total = 67% established
  phase2b_4_instructions: |
    BUILD_ON claims (1-4) need not be re-verified. Existing literature citations
    and public benchmark reproductions suffice. Focus experimental effort on
    PROVE_NEW claims (5-6): measure gradient alignment ROC-AUC vs. loss ROC-AUC
    (Experiment 1), then test the intervention worst-group accuracy (Experiment 2).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-GAD-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under standard ERM training on spurious correlation benchmarks (Waterbirds, CelebA,
    MultiNLI) with random mini-batch sampling, if we compute the cosine similarity between
    per-sample last-layer gradients and the batch-mean gradient at each training step and
    use the EMA-smoothed inverse alignment score as an online importance weight, then the
    trained model will achieve better worst-group accuracy than JTT and LfF baselines,
    because gradient alignment direction specifically captures spurious-minority membership
    (conflicting gradient direction with majority batch) in a way that magnitude-based proxies
    cannot distinguish from hard-but-spurious-majority samples.
  alternative_hypothesis_h0: |
    There is no significant difference in worst-group accuracy on Waterbirds and CelebA
    between ERM training with gradient-alignment-based online upweighting and JTT baseline
    training (two-sided test, significance level α = 0.05 across 3 random seeds).

