experimental_setup:
  dataset:
    name: "Waterbirds + CelebA (primary); MultiNLI (secondary)"
    type: "standard"
    source: "Sagawa et al. 2020 Group DRO paper; Koh et al. 2021 WILDS"
    path: "Available via kohpangwei/group_DRO repository (standard download scripts)"
    hypothesis_fit: >
      Waterbirds and CelebA are the canonical spurious correlation benchmarks with
      existing group annotations, enabling both annotation-free training and
      annotation-based evaluation. Worst-group accuracy metric is established
      and all comparison baselines report on these datasets.

  model:
    name: "ResNet-50 (vision); BERT-base (NLI)"
    type: "standard pretrained classifier"
    source: "torchvision.models.resnet50(pretrained=True); huggingface/bert-base-uncased"
    hypothesis_fit: >
      ResNet-50 is the standard backbone for Waterbirds/CelebA in all comparison papers.
      Last-layer (2048×2) and penultimate-layer (2048-dim) gradient computation is feasible
      with torch.func.vmap at batch_size=32. BERT-base is standard for MultiNLI.

  baselines:
    - name: "ERM"
      method: "Standard empirical risk minimization with uniform sample weights"
    - name: "JTT"
      method: "Two-stage: ERM first run for T_1 epochs, identify misclassified samples, retrain with upweighted misclassified set"
    - name: "LfF"
      method: "Two-model training: amplified-bias model generates high-loss samples; debiased model upweights them"
    - name: "ERM + L2 (ablation)"
      method: "ERM with stronger L2 regularization — controls for the hypothesis that GAD improves via implicit regularization"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: >
    No existing annotation-free debiasing method uses gradient cosine similarity
    (directional information) as a training-time proxy for spurious-minority membership.
    Existing methods (JTT, LfF) use magnitude-based signals (misclassification, high relative loss).
  key_innovation: >
    Gradient Alignment Debiasing (GAD): online importance weighting based on per-sample
    last-layer gradient cosine similarity with batch mean. Directional gradient information
    can correctly distinguish hard-but-spurious-majority samples (which have high loss but
    aligned gradients) from spurious-minority samples (which have conflicting gradients).
    Single-training-run (online), no second stage required.
  differentiation:
    - prior_work: "JTT (Liu et al. 2021)"
      difference: >
        JTT: binary misclassification proxy after full first-stage training run (2× compute).
        GAD: continuous directional gradient alignment, online during single training run.
        GAD can correctly handle samples that JTT misidentifies (hard spurious-majority samples).
    - prior_work: "LfF (Nam et al. 2020)"
      difference: >
        LfF: requires maintaining a parallel biased model throughout training (2× memory).
        GAD: requires only per-sample gradient tracking for last layer (~200MB for Waterbirds).
        GAD does not require a separate biased-model hyperparameter (q in GCE loss for LfF).
    - prior_work: "DFR (Kirichenko et al. 2022)"
      difference: >
        DFR: requires group-labeled held-out set for last-layer retraining.
        GAD: fully annotation-free during training; group annotations used only at evaluation.
        GAD targets the DFR performance gap but without any labeled data.

