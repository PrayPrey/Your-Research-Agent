    Gradient alignment signal must be predictive of spurious-minority membership
    (P1: ROC-AUC > per-sample loss) — this must be demonstrated before the
    intervention claim is meaningful.
  sh2_mechanism: >
    Online EMA-smoothed inverse gradient alignment upweighting during single ERM
    training run; last-layer and penultimate-layer variants; batch_size=32;
    β ∈ {0.9} primary, grid search ablation.
  sh3_comparison: >
    Compare against ERM, JTT, LfF on Waterbirds and CelebA worst-group accuracy;
    DFR as aspirational ceiling. (Baseline comparison deferred to Phase 5 for
    any further ablations beyond these core comparisons.)
  open_questions:
    - "Does penultimate-layer alignment provide strictly earlier signal than last-layer? (P3)"
    - "Is the alignment signal robust to class-balanced batching, or does it break? (A1)"
    - "Can the method scale to ViT-B with gradient checkpointing? (A2)"
    - "Does GAD with EMA β=0.9 achieve ≥ JTT on CelebA in addition to Waterbirds? (P2)"

