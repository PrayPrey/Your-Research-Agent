# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: >
        In early training, ERM with random batches is dominated by spurious-majority samples
        (~82% on Waterbirds). The batch-mean gradient predominantly encodes the direction
        that improves classification accuracy on spurious-majority samples — specifically,
        the gradient direction that encodes the spurious feature (background texture/color).
      evidence: >
        Sagawa et al. 2020 (group imbalance in Waterbirds);
        Arpit et al. 2017 (general patterns learned first — majority patterns dominate early gradients);
        Shah et al. 2020 (simplicity bias: simpler features dominate early ERM training)
      falsifier: >
        If Waterbirds training dynamics show equal gradient norm contributions from
        spurious-majority and spurious-minority samples in early epochs, step 1 fails.

    - step: 2
      description: >
        Spurious-minority samples (e.g., landbirds on water in Waterbirds) cannot be
        correctly classified via the spurious feature (background). Their gradient direction
        therefore conflicts with the batch-mean gradient — they push the model in a direction
        inconsistent with the majority spurious-feature signal. This produces low cosine
        similarity between their per-sample gradient and the batch-mean gradient.
      evidence: >
        Logical consequence of Step 1 + group structure of Waterbirds/CelebA;
        supported by DFR finding (Kirichenko 2022) that ERM features are good but
        classifier is spuriously biased toward majority signal
      falsifier: >
        If ROC-AUC of per-sample gradient alignment for predicting spurious-minority
        group membership ≤ 0.5 (no better than chance) on Waterbirds, Step 2 fails.

    - step: 3
      description: >
        The EMA-smoothed inverse alignment score (higher for low-alignment = spurious-minority
        samples) used as an online importance weight shifts the effective training distribution
        toward the spurious-minority group, preventing the model from fully committing to the
        spurious feature during the critical early training phase.
      evidence: >
        Theoretical: importance weighting shifts the effective training distribution;
        related to DFR's finding that last-layer reweighting toward minority samples restores
        worst-group accuracy without changing the feature extractor
      falsifier: >
        If training with GAD weights produces a loss landscape with the same
        Hessian dominant eigenvectors as ERM (no shift toward core feature direction),
        Step 3 fails. Practical falsifier: GAD worst-group accuracy ≤ ERM baseline.

    - step: 4
      description: >
        Because GAD upweighting is online and continuous (computed every batch, updated
        every step via EMA), the intervention occurs earlier in training and with richer
        signal than JTT (which requires a complete first-stage training run to identify
        misclassified samples). This enables better worst-group accuracy in a single training run.
      evidence: >
        Logical: online upweighting vs. JTT's two-stage approach;
        continuous gradient direction vs. binary misclassification signal
      falsifier: >
        If JTT (two-stage) achieves equal or higher worst-group accuracy despite
        the coarser binary signal, Step 4's efficiency claim fails.
        (Note: the mechanistic claim of Steps 1-3 can still hold even if Step 4 fails)

  key_tension: >
    The mechanism "low alignment = spurious-minority" relies on spurious-minority samples
    being the statistical minority in the batch. If class-balanced batching is used,
    the batch-mean gradient would be equalized, and the alignment signal would weaken.
    The method is specifically designed for standard random-sampling training, not balanced batching.
  evidence_summary: |
    The causal chain rests on three BUILD_ON foundations (simplicity bias, temporal learning order,
    group imbalance on benchmarks) and two PROVE_NEW links (gradient alignment predicts group membership,
    online upweighting improves worst-group accuracy). The chain is internally consistent and each
    step has a clear falsifier, enabling targeted debugging if any step fails.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: >
      Spurious-minority samples are the statistical minority in standard random mini-batches
      on Waterbirds and CelebA (i.e., spurious-minority group membership coincides with
      dataset-level minority).
    supporting_evidence: >
      Waterbirds: 82% majority, 18% minority. CelebA: ~94% majority blond-female and
      non-blond-male. Standard random sampling maintains these ratios in expectation.
    consequence_if_violated: >
      If class-balanced batching is used (or if the minority group is actually the majority
      in some subset of batches), the alignment signal loses its specificity for spurious-minority
      detection. The method would need to be reformulated for balanced-batch training.

  - id: "A2"
    assumption: >
      Last-layer and penultimate-layer gradient alignment signals are computationally
      feasible with torch.func.vmap on ResNet-50 with batch size ≤ 32.
    supporting_evidence: >
      ResNet-50 last layer: 2048 × 2 = 4096 params. At batch_size=32: 32 × 4096 = 131,072 floats.
      torch.func.vmap supports per-sample gradients efficiently for linear layers.
    consequence_if_violated: >
      If vmap OOMs on penultimate layer (2048-dim activations), must use gradient checkpointing
      or reduce to last-layer only. Mechanistic claim about temporal layer differences cannot be tested.

  - id: "A3"
    assumption: >
      EMA smoothing with β=0.9 provides sufficient temporal smoothing of the noisy per-batch
      alignment signal without introducing excessive lag (so the signal remains responsive to
      changes in the model's spurious feature reliance).
    supporting_evidence: >
      β=0.9 is standard for importance weight smoothing in online learning (effective window ≈ 10 steps).
      Related to EMA used in LfF for the biased model update.
    consequence_if_violated: >
      β too high (e.g., 0.99): signal lags behind model changes, intervention may be too late.
      β too low (e.g., 0.5): signal is too noisy, causes training instability.
      Mitigation: grid search over β ∈ {0.5, 0.9, 0.99} as hyperparameter.

  - id: "A4"
    assumption: >
      The per-sample last-layer gradient at training time is computable without access to
      group labels — only the cross-entropy loss gradient with respect to the (predicted) label is needed.
    supporting_evidence: >
      Cross-entropy loss gradient computation requires only the network's own prediction and the
      true class label (not group membership). The gradient alignment computation is annotation-free
      by construction.
    consequence_if_violated: >
      If the gradient alignment signal is only interpretable with group annotation knowledge
      (e.g., the sign of alignment is ambiguous without knowing majority/minority), the method
      is not truly annotation-free. Prof. Rex's Experiment 1 validates this assumption.

  - id: "A5"
    assumption: >
      The worst-group accuracy metric on standard Waterbirds and CelebA test splits
      (using existing group annotations) is a valid and sufficient evaluation criterion
      for determining whether the method succeeds.
    supporting_evidence: >
      Standard from Sagawa et al. 2020; used by all comparison methods (JTT, LfF, DFR);
      reflects the core goal of reducing spurious correlation reliance.
    consequence_if_violated: >
      If worst-group accuracy improvements are attributable to increased regularization
      (not the gradient alignment mechanism), the causal claim fails.
      Mitigation: compare GAD vs. ERM+L2 regularization as an additional ablation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Image classification benchmarks with spurious correlations where spurious-minority
      samples are the statistical minority in random mini-batches (Waterbirds, CelebA)
    - Text classification with spurious correlations (MultiNLI with hypothesis-only bias)
    - Training with standard random mini-batch sampling (no class-balanced batching)
    - Models where per-sample last-layer gradient computation is feasible (ResNet-50, BERT-base)
    - Settings where group annotations are available only at evaluation time (not annotation-free training)
  does_not_apply_to: |
    - Training regimes with class-balanced or group-balanced mini-batch sampling
    - Settings where spurious-minority group is numerically large (the alignment signal would be weak)
    - Very large models where per-sample gradient computation is prohibitively expensive
    - Self-supervised pre-training (no classification loss gradient available)
    - Settings requiring strict annotation-free evaluation (annotations used at evaluation is acceptable)
  known_limitations: |
    - Prof. Rex's confound: mechanism detects statistical minority in batch, not specifically
      the "spurious feature direction." On Waterbirds/CelebA these coincide, but the mechanistic
      claim is weaker than initially framed.
    - Batch size constraint: per-sample gradient computation requires batch_size ≤ 32 on ResNet-50;
      larger models require gradient checkpointing.
    - Hyperparameter sensitivity: EMA β and weight clipping threshold require tuning.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: >
      Per-sample last-layer gradient alignment (cosine similarity with batch mean) provides
      higher ROC-AUC for predicting spurious-minority group membership than per-sample loss
      magnitude at at least one training epoch on Waterbirds and CelebA, using existing
      group annotations as ground truth.
    test_method: >
      (1) Train ERM ResNet-50 on Waterbirds and CelebA with standard settings.
      (2) At epochs {1, 5, 10, 25, 50}, compute per-sample last-layer gradient alignment
          and per-sample loss for all training samples.
      (3) Use existing group annotations to label each sample as spurious-minority (1) or not (0).
      (4) Compute ROC-AUC of alignment score and loss score for predicting spurious-minority membership.
      (5) Compare ROC-AUC curves across epochs.
    success_criterion: >
      Gradient alignment ROC-AUC > per-sample loss ROC-AUC at ≥ 1 epoch
      on BOTH Waterbirds AND CelebA.
    falsification: >
      Gradient alignment ROC-AUC ≤ per-sample loss ROC-AUC at ALL epochs
      on EITHER Waterbirds OR CelebA.

  - id: "P2"
    primary: false
    statement: >
      Online gradient-alignment debiasing (GAD) with EMA-smoothed inverse alignment weights
      achieves worst-group accuracy ≥ JTT on Waterbirds and CelebA test sets (3 random seeds).
    test_method: >
      (1) Train GAD (ERM + online alignment upweighting, single training run) on Waterbirds and CelebA.
      (2) Train JTT baseline (from anniesch/jtt) on same datasets.
      (3) Report worst-group accuracy on standard test splits (mean ± std across 3 seeds).
    success_criterion: >
      GAD worst-group accuracy ≥ JTT worst-group accuracy on BOTH Waterbirds AND CelebA
      (within error bars, or statistically significant improvement).
    falsification: >
      GAD worst-group accuracy < JTT worst-group accuracy (outside error bars) on EITHER
      Waterbirds OR CelebA.

  - id: "P3"
    primary: false
    statement: >
      Penultimate-layer gradient alignment becomes predictive of spurious-minority membership
      (ROC-AUC > 0.6) at earlier training epochs than last-layer gradient alignment,
      revealing the temporal structure of spurious feature acquisition.
    test_method: >
      (1) Track both last-layer and penultimate-layer gradient alignment at epochs {1, 5, 10, 25, 50}.
      (2) For each layer, record the first epoch at which ROC-AUC > 0.6 for group membership prediction.
      (3) Compare the epoch of first-predictive-alignment between layers.
    success_criterion: >
      Penultimate-layer alignment achieves ROC-AUC > 0.6 at an earlier epoch than
      last-layer alignment on at least one of Waterbirds/CelebA.
    falsification: >
      Last-layer alignment becomes predictive at the same epoch or earlier than
      penultimate-layer alignment on both datasets.

