    - method: "DFR (Kirichenko et al. 2022)"
      performance: "91.8% worst-group accuracy on Waterbirds"
      dataset: "Waterbirds"
      why_insufficient: >
        Requires group-labeled held-out set (not fully annotation-free);
        represents the performance ceiling for our method to target

  best_baseline_performance: "JTT: 86.7% worst-group on Waterbirds (annotation-free); DFR: 91.8% (requires labels)"

