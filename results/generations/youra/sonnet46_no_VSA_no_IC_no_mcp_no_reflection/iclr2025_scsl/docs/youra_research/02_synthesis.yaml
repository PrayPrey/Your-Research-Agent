novelty_assessment:
  status: "VERIFIED"
  key_innovation: >
    First annotation-free debiasing method to use per-sample gradient cosine similarity
    (directional information) as a training-time spurious-minority proxy.
    Online single-pass (no two-stage training); handles hard-but-spurious-majority samples
    correctly where JTT fails.
  differentiation_summary: |
    JTT (Liu 2021): binary misclassification after full first-stage run → 2× compute, conflates hard examples.
    LfF (Nam 2020): parallel biased model → 2× memory, requires GCE loss hyperparameter.
    DFR (Kirichenko 2022): group-labeled held-out set required → not annotation-free.
    GAD: single training run, last-layer gradient tracking (~200MB), no labeled data.

