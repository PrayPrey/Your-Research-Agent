discussion_synthesis:
  key_insights:
    - "Directional vs. magnitude gradient signals: the key distinction enabling correct handling of hard-spurious-majority samples"
    - "Online single-pass training eliminates JTT's two-stage compute overhead"
    - "Last-layer gradient alignment is tractable (last layer only: ~200MB for Waterbirds); full gradient is not"
    - "The mechanism (statistical minority in batch → low alignment) coincides with spurious-minority on target benchmarks"
    - "Penultimate-layer temporal analysis provides a secondary mechanistic contribution on shortcut learning dynamics"
  breakthrough_moments:
    - "Exchange 4 (Prof. Pax): Identified that last-layer-only gradient tracking makes the method computationally feasible"
    - "Exchange 5 (Dr. Ally): Synthesized the directional vs. magnitude novelty claim and two-level validation structure"
    - "Exchange 7 (Dr. Nova): Articulated the hard-spurious-majority differentiating prediction that distinguishes GAD from JTT"
    - "Exchange 11 (Prof. Rex): Precision caveat — mechanism detects statistical minority, not spurious feature direction — clarifies scope"
  resolved_tensions:
    - "Annotation-free constraint vs. signal quality: resolved by using group annotations only for evaluation, not training"
    - "Computational feasibility vs. mechanistic richness: resolved by last-layer-only gradient tracking"
    - "Online vs. two-stage tradeoff: resolved by showing EMA smoothing stabilizes online upweighting"
    - "Directional signal timing concern (Prof. Vera): resolved by testing alignment at multiple epochs + penultimate layer"
