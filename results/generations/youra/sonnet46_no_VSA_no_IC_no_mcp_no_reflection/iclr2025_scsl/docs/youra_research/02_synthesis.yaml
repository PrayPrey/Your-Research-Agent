hypothesis_draft:
  title: "Gradient Alignment Debiasing (GAD): Online Annotation-Free Upweighting via Per-Sample Gradient Cosine Similarity"
  hypothesis_id: "H-GAD-v1"
  core_claim: |
    Under standard ERM training on spurious correlation benchmarks (Waterbirds, CelebA)
    with random mini-batch sampling, per-sample last-layer gradient cosine similarity with
    the batch-mean gradient is a reliable proxy for spurious-minority group membership.
    Using the EMA-smoothed inverse of this alignment score as an online importance weight
    achieves better worst-group accuracy than JTT and LfF baselines without group annotations,
    in a single training run, because directional gradient information distinguishes
    spurious-minority samples (conflicting gradients) from hard-but-spurious-majority samples
    (aligned gradients) in a way magnitude-based proxies cannot.
  mechanism: |
    (1) Spurious-majority samples dominate random mini-batches (~82% on Waterbirds).
    (2) The batch-mean gradient encodes the spurious feature direction.
    (3) Spurious-minority samples' gradients conflict with this direction → low cosine similarity.
    (4) Hard spurious-majority samples' gradients align with this direction → high cosine similarity.
    (5) Inverse alignment score upweights spurious-minority samples online during training.
    (6) Online upweighting prevents model from fully committing to spurious feature in early training.
  predictions:
    - P1: "Gradient alignment ROC-AUC > per-sample loss ROC-AUC for spurious-minority prediction on Waterbirds and CelebA"
    - P2: "GAD worst-group accuracy ≥ JTT on Waterbirds and CelebA (single training run)"
    - P3: "Penultimate-layer alignment becomes predictive (ROC-AUC > 0.6) at earlier epoch than last-layer alignment"

variables_summary:
