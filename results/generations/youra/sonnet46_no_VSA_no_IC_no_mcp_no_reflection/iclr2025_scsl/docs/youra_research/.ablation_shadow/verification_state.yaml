sub_hypotheses:
  h-e1:
    type: EXISTENCE
    statement: Under standard ERM training on Waterbirds and CelebA with random mini-batch sampling, per-sample last-layer
      gradient alignment ROC-AUC for predicting spurious-minority group membership exceeds per-sample loss ROC-AUC at ≥1 epoch
      on BOTH datasets.
