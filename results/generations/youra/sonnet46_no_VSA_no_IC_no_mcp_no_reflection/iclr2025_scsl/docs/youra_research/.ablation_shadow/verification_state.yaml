    validation:
      status: COMPLETED
      result: FAIL
      key_findings:
      - 'Waterbirds: alignment_roc_auc range 0.15–0.35 at epochs {1,5,10,25,50}; loss_roc_auc range 0.77–0.93. Alignment never
        wins.'
      - 'CelebA (16K subsample): alignment_roc_auc range 0.25–0.63 at epochs {1,5,10,25,50}; loss_roc_auc range 0.91–0.97.
        Alignment never wins.'
      - 'Per-batch mean gradient approximation suspected cause: within-batch mean dominated by majority samples, destroying
        alignment discrimination.'
      - Waterbirds alignment below 0.5 (near-random or anti-predictive) at all epochs — inverted signal.
      - 'All artifacts present: results.json, experiment_results.json, 9 figures, 04_validation.md.'
    version: 2
    completed: false
    completed_at: '2026-08-31T10:13:08+00:00'
    reflection_outcome: 'Hypothesis falsified. Per-batch gradient alignment is a weak spurious-minority predictor, consistently
      dominated by per-sample loss on both Waterbirds and CelebA. Root cause: within-batch mean gradient is dominated by majority
      samples each batch, making cosine alignment uninformative or inverted. On Waterbirds, alignment ROC-AUC is below random
      (0.15–0.35) suggesting the signal is anti-predictive. On CelebA, alignment peaks at 0.63 (epoch 50) but still loses
      to loss (0.91). MUST_WORK gate not satisfied — hypothesis H-E1 is falsified.'
    route_to: FAIL
