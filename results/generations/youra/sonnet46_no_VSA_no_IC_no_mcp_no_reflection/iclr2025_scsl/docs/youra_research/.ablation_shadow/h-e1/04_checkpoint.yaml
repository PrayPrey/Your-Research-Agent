reflection_outcome: 'Hypothesis falsified. Per-batch gradient alignment is a weak
  spurious-minority predictor, consistently dominated by per-sample loss on both Waterbirds
  and CelebA. Root cause: within-batch mean gradient is dominated by majority samples
  each batch, making cosine alignment uninformative or inverted. On Waterbirds, alignment
  ROC-AUC is below random (0.15–0.35) suggesting the signal is anti-predictive. On
  CelebA, alignment peaks at 0.63 (epoch 50) but still loses to loss (0.91). The per-batch
  approximation should be upgraded to a two-pass global mean, or an alternative signal
  (gradient variance, gradient norm) explored. MUST_WORK gate not satisfied — hypothesis
  H-E1 is falsified.'
