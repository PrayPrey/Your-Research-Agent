# Narrative Blueprint — Phase 6 Paper Writing
# Paper: Gradient Alignment as Spurious-Minority Detector: A Negative Result
# Generated: 2026-08-31
# Strategy: Honest negative result with novel mechanistic contribution

paper_type: "negative_result_with_positive_contribution"
paper_framing: >
  We set out to build a label-free debiasing method using gradient direction.
  We found it doesn't work — and explain precisely why, with novel empirical
  characterization and a clear path to a corrected method.

# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  strategy: "Counterintuitive Finding"
  opening_statement:
    content: >
      A model's gradient direction during training reveals which samples it
      finds surprising — yet we show that simply measuring how surprising a sample's
      gradient is, relative to its mini-batch peers, produces a signal that is
      actively anti-predictive of spurious-minority membership on Waterbirds
      (ROC-AUC = 0.15 at epoch 1, below chance), despite the intuition that conflicting
      gradient directions should expose such samples.
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: >
      Gradient-based minority detection is theoretically compelling and practically
      appealing: it requires no group labels and operates online during training.
      Understanding why within-batch cosine similarity fails prevents future
      researchers from repeating the same design error, and the identified fix
      (two-pass global mean reference) directly enables viable gradient-based debiasing.
    concrete_example: >
      Our experiments show per-sample loss ROC-AUC = 0.93 on Waterbirds (epoch 1)
      while gradient alignment ROC-AUC = 0.15 — a 0.78 gap. The gradient signal is
      not just weaker: it is inverted. Spurious-minority samples appear MORE aligned
      with the within-batch mean gradient than majority samples.
    stakes: >
      Without understanding this failure mode, gradient-based debiasing methods will
      be built on a broken foundation, waste compute, and report misleading results.

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: >
      Deep neural networks trained with ERM on spuriously-correlated data achieve
      high average accuracy but fail catastrophically on minority groups (worst-group
      accuracy as low as 72% on Waterbirds vs. 97% average accuracy).
    common_understanding: >
      Spurious correlations cause models to learn shortcuts; existing debiasing
      methods (JTT, LfF, GroupDRO) require either group labels or two-stage training.

  deeper_problem:
    description: >
      Even label-free methods like JTT rely on per-sample loss as a proxy for
      minority membership — a magnitude-based signal that cannot distinguish
      hard-majority samples (high loss because task is difficult) from spurious-minority
      samples (high loss because spurious feature conflicts with true label).
    why_overlooked: >
      The directional information in gradients — which samples push the model in
      conflicting directions — has been largely unexplored as a minority proxy.
    our_perspective: >
      If spurious-minority samples have gradients that conflict with the majority
      batch direction, cosine similarity with the batch mean should identify them
      without group labels and without the magnitude-conflation problem.

  gap_in_existing_work:
    description: >
      No prior work has directly measured the ROC-AUC of gradient cosine similarity
      with the within-batch mean as a spurious-minority detector on Waterbirds or CelebA.
    why_gap_exists: >
      Per-sample gradient computation was previously expensive; recent vmap/grad
      APIs make it tractable. The theoretical intuition was present but the empirical
      test was missing.
    why_gap_matters: >
      If gradient direction works, it unlocks annotation-free online debiasing.
      If it doesn't, understanding why is equally critical for the field.

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: >
      Spurious-minority samples, being high-loss outliers, disproportionately pull
      the within-batch mean gradient toward their own direction — making them appear
      MORE aligned with the batch mean rather than less, inverting the detection signal.
    expanded_explanation: >
      With batch size B=32 and ~5% minority prevalence (Waterbirds), 1–2 minority
      samples per batch carry much larger gradient magnitude than majority samples.
      The within-batch mean is therefore contaminated by the very samples it should
      distinguish. Measured cosine similarity of minority with batch mean is ~0.85
      (high alignment), the opposite of what the hypothesis predicted.
      This "batch contamination" effect is worst at early epochs (large gradient
      magnitudes) and on datasets with higher minority prevalence.

  why_others_missed_it:
    common_assumptions: >
      The gradient direction mechanism was assumed sound: majority samples dominate
      batch mean → batch mean encodes spurious direction → minority samples conflict.
    our_different_view: >
      The batch mean is NOT a stable representation of the majority gradient direction
      on a per-batch basis. High-loss minority samples dominate the mean computation
      despite being rare in expectation.
    enabling_factor: >
      Direct empirical measurement of alignment ROC-AUC at multiple epochs — only
      feasible with modern per-sample gradient APIs.

  what_makes_it_work:
    intuitive_explanation: >
      The proposed fix: use a two-pass global mean gradient (computed over the full
      training set), which is stable, majority-dominated, and not contaminated by
      per-batch minority gradient spikes. The annotation-free property is preserved.
    key_mechanism: >
      Two-pass mean averages out minority gradient magnitude spikes across thousands
      of batches; per-batch mean cannot, because minority samples appear 1–2 per batch
      with outsized gradient magnitude influence.

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: >
      Within-batch gradient cosine similarity with the per-batch mean gradient is NOT
      a viable spurious-minority membership detector: ROC-AUC ≤ 0.35 on Waterbirds
      and ≤ 0.63 on CelebA across epochs 1–50, consistently below per-sample loss
      (0.77–0.97).
    measurable_criteria: >
      alignment_roc_auc vs loss_roc_auc at epochs {1, 5, 10, 25, 50} on
      Waterbirds and CelebA under standard ERM training (ResNet-50, SGD).

  supporting_evidence:
    - id: "evidence_1"
      what: "Waterbirds: alignment_roc_auc = 0.15 at epoch 1 (below chance)"
      so_what: >
        The signal is actively anti-predictive, not merely weak. Negated cosine
        similarity fails even harder than using cosine similarity directly.
      how_it_supports_claim: "Establishes the inversion effect — primary negative result"

    - id: "evidence_2"
      what: "Waterbirds: loss_roc_auc = 0.93 at epoch 1"
      so_what: >
        Per-sample loss is an excellent spurious-minority predictor from the first epoch.
        The gap to alignment (0.78) is decisive and stable.
      how_it_supports_claim: >
        Establishes the baseline and makes the gap concrete for comparison.

    - id: "evidence_3"
      what: "CelebA: alignment_roc_auc reaches 0.63 at epoch 50 (loss: 0.91)"
      so_what: >
        Weak positive signal emerges on CelebA — consistent with the batch
        contamination hypothesis: more extreme minority prevalence (0.8% vs 5%)
        reduces contamination. But still well below loss.
      how_it_supports_claim: >
        Provides mechanistic validation: the inversion is prevalence-dependent,
        supporting batch contamination as root cause.

    - id: "evidence_4"
      what: "Gradient collapse at epoch 50: train loss → 0.0003 on Waterbirds"
      so_what: >
        As training converges, all gradients collapse toward near-zero,
        destroying any discriminative content in alignment scores regardless of
        reference direction.
      how_it_supports_claim: >
        Explains the late-epoch behavior and sets an upper bound on when gradient
        alignment can ever work.

  surprising_findings:
    - finding: "Alignment signal is inverted on Waterbirds at epoch 1 (ROC-AUC = 0.15)"
      why_surprising: >
        The hypothesis predicted spurious-minority gradients would CONFLICT with
        the batch mean (low cosine similarity). Instead they appear MORE aligned
        (high cosine similarity, inverted ROC-AUC).
      our_interpretation: >
        Batch contamination by high-magnitude minority gradients pulls the within-batch
        mean toward minority direction, paradoxically increasing measured alignment.

    - finding: "Raw cosine similarity of minority with batch mean ≈ 0.85 (very high)"
      why_surprising: >
        The assumption was that the batch mean represents the majority direction and
        minority samples conflict with it.
      our_interpretation: >
        When 1–2 high-loss minority samples appear in a batch of 32, their
        disproportionate gradient magnitude dominates the mean. They align with
        themselves in the average.

# =============================================================================
# BROADER IMPACT
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: >
      First direct empirical characterization of within-batch gradient alignment
      as spurious-minority detector, establishing its failure mode (batch contamination
      inversion) and the design principle required for viable gradient-based debiasing
      (two-pass global mean reference direction).
    why_significant: >
      Saves future researchers from a plausible but broken approach; provides an
      empirically grounded, actionable correction.

  implications:
    for_field: >
      Gradient-based minority detection methods must use stable, global reference
      directions. Any method using per-batch gradient statistics for minority
      identification should be re-examined for the batch contamination effect.
    for_practice: >
      Two-pass global mean gradient is computationally tractable (one extra forward
      pass per epoch) and preserves annotation-free property — a concrete next step
      for practitioners building label-free debiasing systems.

  future_possibilities:
    immediate_extensions: >
      (1) Two-pass global mean gradient experiment to test whether inversion disappears.
      (2) Penultimate-layer alignment (last-layer compression may destroy discriminative signal).
      (3) Minority prevalence synthetic experiment to quantify batch contamination threshold.
    longer_term_vision: >
      If global mean reference resolves the inversion, GAD (Gradient Alignment Debiasing)
      becomes a practical single-pass debiasing method competitive with JTT/LfF without
      the two-stage training overhead.

# =============================================================================
# SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story — problem, approach, finding, insight, fix direction"
    key_message: >
      Gradient alignment fails as minority detector due to batch contamination inversion;
      global mean reference is the principled fix.
    tone: "honest negative result with actionable insight"

  introduction:
    narrative_purpose: "Hook (inversion finding) → Problem (annotation-free debiasing) → Insight (batch contamination) → Preview"
    hook_strategy: "counterintuitive_finding"
    opening_element: "The ROC-AUC = 0.15 inversion on Waterbirds"
    transition_to_related: >
      After establishing the problem gap (label-free debiasing, gradient direction motivation),
      pivot to: what has been tried, and why gradient direction seemed promising.

  related_work:
    narrative_purpose: "Show spurious correlation literature → debiasing methods → gradient direction gap"
    positioning_strategy: >
      We build on JTT/LfF (loss-based) and extend to gradient direction (unexplored territory).
      We are NOT competing with DFR or GroupDRO (they use labels). We probe deeper
      into the signal quality of gradient-based proxies.
    key_comparison_points:
      - "JTT (misclassification proxy) vs our gradient alignment proxy"
      - "LfF (relative loss) vs cosine similarity signal"
      - "Bias Leaves a Gradient Trail (directional gradients) — different formulation"
      - "Simplicity bias literature — explains early-epoch gradient behavior"

  methodology:
    narrative_purpose: "Derive GAD from the insight → show how we test it → be clear about scope (existence test)"
    connection_to_insight: >
      The method follows directly from the theoretical intuition: if minority gradients
      conflict with the majority-dominated batch mean, negated cosine similarity is
      an annotation-free minority score.
    key_design_decisions:
      - "Last-layer only (Linear 2048→2): feasibility for PoC"
      - "vmap/grad for per-sample gradients (efficient, no loop)"
      - "Checkpoint epochs {1, 5, 10, 25, 50}: captures early/late training dynamics"
      - "EMA smoothing β=0.9: planned but not executed (blocked by P1 failure)"
      - "ROC-AUC as evaluation: measures raw discriminability without threshold"

  experiments:
    narrative_purpose: "Design the existence test cleanly — what does P1 falsification require?"
    experimental_questions:
      - "Does alignment_roc_auc exceed loss_roc_auc at any epoch on Waterbirds?"
      - "Does alignment_roc_auc exceed loss_roc_auc at any epoch on CelebA?"
      - "How does the alignment signal evolve across training epochs?"
    datasets_rationale: >
      Waterbirds (82% majority, 5% minority) and CelebA (94% majority, 0.8% minority)
      represent different imbalance regimes — key for testing the batch contamination
      hypothesis (prevalence-dependent).
    baselines_rationale: >
      Per-sample loss is the natural comparator: it is the signal JTT uses and the
      standard magnitude-based proxy.

  results:
    narrative_purpose: "Lead with the inversion finding → show epoch trends → interpret CelebA difference"
    main_result_highlight: >
      Waterbirds epoch 1: alignment_roc_auc = 0.15 (below chance), loss_roc_auc = 0.93.
      Gap = 0.78. Inversion is our primary empirical contribution.
    figure_strategy:
      - "fig_1 (roc_auc_vs_epoch.png): both datasets combined — main results figure"
      - "fig_2 (roc_auc_vs_epoch_waterbirds.png): Waterbirds detail"
      - "fig_3 (roc_auc_vs_epoch_celeba.png): CelebA detail — shows prevalence effect"
      - "figs 4-7: appendix (score distributions, ROC curves at best epoch)"

  discussion:
    narrative_purpose: "Diagnose root cause → connect to batch contamination → derive fix direction"
    honest_limitations:
      - "Single seed (PoC design; failure margin is decisive, replication-grade)"
      - "CelebA 16K subsample (minor scope change; conclusion unchanged)"
      - "Last-layer only (penultimate layer may have different properties — P3 untested)"
      - "Global mean gradient untested (identified fix, not validated)"
    key_interpretations:
      - "Batch contamination (primary): minority gradient magnitude dominates within-batch mean"
      - "Gradient collapse (epoch 50): training convergence destroys all gradient discriminability"
      - "CelebA 0.63 at epoch 50: consistent with prevalence-dependent contamination"

  conclusion:
    narrative_purpose: "Close the narrative loop — return to the inversion hook, open the global mean path"
    callback_to_hook: >
      The inversion we opened with is not a dead end — it is a precise diagnosis.
      Gradient direction does encode something useful; within-batch reference direction
      is the problem, not the concept.
    future_work_vision: >
      Two-pass global mean gradient, penultimate-layer alignment, and prevalence-adaptive
      batch contamination correction are immediate, concrete next steps with clear
      theoretical motivation.

