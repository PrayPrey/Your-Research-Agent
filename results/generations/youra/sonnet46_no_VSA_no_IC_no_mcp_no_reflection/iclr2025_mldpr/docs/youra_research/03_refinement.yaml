# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-MetaMisuse-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the condition of published ML papers from top venues (NeurIPS, ICML, ICLR, JMLR)
    that use standard benchmark datasets, if a paper relies on a dataset with lower
    documentation completeness (measured by HuggingFace dataset card field-presence score
    using the Datasheets for Datasets schema) and/or higher usage concentration (measured
    by Herfindahl-Hirschman Index over OpenML run counts filtered to pre-publication period),
    then that paper is more likely to fail independent reproducibility verification (as labeled
    by Raff 2019), because high concentration signals accumulated dataset-specific artifacts
    that models overfit to (underspecification; D'Amour et al. 2021), while low documentation
    completeness increases out-of-context application risk by failing to specify scope
    boundaries.
  alternative_hypothesis_h0: |
    There is no significant association between dataset-level metadata-observable misuse
    signals (documentation completeness score, HHI concentration) and binary reproducibility
    outcomes in Raff's 255-paper corpus, after controlling for paper-level quality features
    (equation count, pseudocode presence, hyperparameter reporting).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Documentation Completeness Score"
      type: "continuous"
      operationalization: "Count of present fields from set {intended_use, out_of_scope_use, limitations, license, task_categories, dataset_info, provenance} in HuggingFace dataset card. Score 0-7, normalized to [0,1]. Missing card = 0."
    - name: "Dataset Concentration (HHI)"
      type: "continuous"
      operationalization: "Herfindahl-Hirschman Index computed over OpenML run counts per dataset, filtered to runs with task creation timestamp before paper publication year. Normalized to [0,1]."
    - name: "Field-Level Presence Indicators (binary)"
      type: "categorical"
      operationalization: "Seven binary indicators (0/1) for each field in the completeness score: intended_use_present, out_of_scope_use_present, limitations_present, license_present, task_categories_present, dataset_info_present, provenance_present"
      levels: [0, 1]
  dependent:
    - name: "Reproducibility Outcome"
      type: "categorical"
      operationalization: "Binary label from Raff 2019: 1 = reproducible (results closely matched), 0 = not reproducible. Sourced from paper's published dataset."
      primary: true
  controlled:
    - name: "Paper Quality Features (Raff's original coding)"
      operationalization: "Equation count, pseudocode presence (binary), hyperparameter reporting (binary), reference implementation availability (binary) — as coded by Raff 2019 for each paper"
    - name: "Dataset Age"
      operationalization: "Years between dataset publication year and paper publication year. Controls for the confound that older datasets predate the datasheet standard and thus have structurally lower completeness scores"
    - name: "Number of Datasets Used per Paper"
      operationalization: "Count of distinct datasets used in the paper's main experiments. Papers using more datasets are averaged across dataset-level predictors"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Benchmark concentration (high HHI) → dataset artifact accumulation. When many papers train on the same benchmark, the research community implicitly selects for models that exploit dataset-specific artifacts (label imbalance, spurious correlations, annotation artifacts) rather than learning generalizable patterns."
      evidence: "D'Amour et al. (2021) demonstrate that benchmark-equivalent models differ substantially under distribution shift — the mechanism is dataset artifact overfitting. High OpenML run counts are the metadata-observable proxy for this artifact accumulation."
      falsifier: "If high-HHI datasets show no evidence of artifact accumulation (verified by comparing model performance on IID vs. OOD test splits), then concentration does not operate through this mechanism."
    - step: 2
      description: "Documentation incompleteness → out-of-context application → misuse. When dataset cards lack `intended_use` and `out_of_scope_use` fields, researchers have no standardized signal that they are applying the dataset outside its designed scope. This enables task-type mismatch without explicit awareness."
      evidence: "Gebru et al. (2021) design the Datasheets schema explicitly to prevent out-of-scope reuse by making intended use boundaries explicit. Absence of these fields removes the only scalable misuse warning mechanism available through repository metadata."
      falsifier: "If papers that use datasets without `intended_use` fields do not show higher rates of task-type mismatch (operationalized as using dataset in a category outside `task_categories`), then documentation incompleteness does not operate through this mechanism."
    - step: 3
      description: "Artifact overfitting + out-of-context application → reproducibility failure. Papers that use overfit-prone (high-concentration) datasets in out-of-context applications produce results that depend on dataset artifacts specific to the original training context. Independent replication in a slightly different setup breaks these artifact dependencies, causing failure."
      evidence: "Raff 2019 shows that 49.2% of top-venue papers fail independent reproduction. D'Amour et al. provide the theoretical mechanism. The linkage to metadata-observable signals is our novel contribution."
      falsifier: "If paper-quality controls (equations, pseudocode, hyperparameters) fully explain Raff's reproducibility outcomes with no residual variance attributable to dataset-level signals, hypothesis fails."
  key_tension: "Paper quality confound: well-written papers may both choose better-documented datasets AND reproduce better, making causal attribution between dataset misuse and failure ambiguous. Addressed by including Raff's paper-quality features as controls and testing incremental predictive power."
  evidence_summary: |
    The causal chain is grounded in D'Amour et al.'s underspecification theory (mechanism for
    Step 1) and Gebru et al.'s datasheets framework (mechanism for Step 2). The empirical
    linkage (Step 3) is untested and constitutes the novel contribution. Raff's corpus provides
    the dependent variable; HF Hub and OpenML APIs provide the independent variables.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "HuggingFace dataset cards for datasets in Raff's corpus (2013-2018 papers) are sufficiently populated to enable field-presence scoring for a meaningful subset of the 30-60 unique datasets"
    supporting_evidence: "HuggingFace Hub lists dataset cards for major benchmarks (MNIST, CIFAR-10, ImageNet, GLUE components, etc.) even for datasets predating HF's 2020 launch, as the community retroactively created cards for foundational datasets"
    consequence_if_violated: "If <50% of Raff's datasets have HF cards, missing data dominates and completeness=0 imputation may overwhelm the signal. Mitigation: use OpenML quality measures as complementary completeness source for datasets lacking HF cards"
  - id: "A2"
    assumption: "OpenML run counts with pre-publication temporal filtering provide a valid proxy for dataset concentration at time of paper writing"
    supporting_evidence: "OpenML stores task creation timestamps, enabling filtering. Datasets popular today were generally popular in 2013-2018 (MNIST, CIFAR, etc.) — rank order of concentration is likely stable even if absolute counts differ"
    consequence_if_violated: "Temporal confound attenuates the HHI effect toward zero. Mitigation: use dataset publication year gap as alternative proxy; run sensitivity analysis comparing both operationalizations"
  - id: "A3"
    assumption: "Raff's binary reproducibility label (one researcher's assessment) provides a valid ground truth that is generalizable beyond that single annotator's methodology"
    supporting_evidence: "Raff used consistent methodology across all 255 papers and reported inter-rater reliability checks on a subset. ML Reproducibility Challenge (Pineau et al.) provides an independent validation dataset for out-of-sample replication"
    consequence_if_violated: "Single-annotator bias means labels may not generalize. Mitigation: replicate key finding on ML Reproducibility Challenge data as secondary validation"
  - id: "A4"
    assumption: "Paper-level predictors (average dataset-level signals across papers using multiple datasets) are an adequate approximation of the dataset-level exposure that produced the paper's results"
    supporting_evidence: "Most Raff papers use 1-3 datasets; averaging is reasonable. Papers dominated by one dataset (>70% of experiments) could be coded for that dataset only as a robustness check"
    consequence_if_violated: "Averaging introduces measurement error that attenuates effects. Robustness check: weight by proportion of experiments per dataset"
  - id: "A5"
    assumption: "The relationship between dataset misuse signals and reproducibility failure is approximately linear on the log-odds scale (logistic regression assumption)"
    supporting_evidence: "No strong prior reason to expect non-linearity; sample size (N=255) is too small for non-parametric methods with adequate power"
    consequence_if_violated: "Non-linear effects missed; potential false negative if true relationship is threshold-based. Robustness check: Random Forest classification to detect non-linear patterns"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    ML papers published in top venues (NeurIPS, ICML, ICLR, JMLR) between approximately
    2013-2018 that use standard benchmark datasets available on OpenML or HuggingFace Hub.
    Results generalize to the broader phenomenon of benchmark dataset reuse in ML research
    insofar as top-venue papers are representative of the field's practices.
  does_not_apply_to: |
    - Papers using fully custom or proprietary datasets (no public metadata available)
    - Papers at workshop venues or preprint-only publications (outside Raff's corpus scope)
    - Datasets with no OpenML or HuggingFace presence (no metadata to extract)
    - Post-2020 papers (HF card completeness inflated relative to 2013-2018 baseline)
    - Papers in fields outside ML (Raff's corpus is ML-specific)
  known_limitations: |
    - Top-venue selection bias: Raff's corpus is range-restricted to high-quality papers;
      misuse effects may be larger or different in lower-quality venues
    - Temporal validity of HHI: OpenML run counts today approximate but do not equal
      concentration at time of paper writing
    - Single annotator (Raff): reproducibility labels from one researcher introduce
      annotator-specific bias
    - Missing metadata: datasets predating HF's 2020 launch may have incomplete or
      retroactively created cards with inflated completeness scores

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Documentation completeness score (HF card field-presence, 0-7 normalized) negatively predicts reproducibility outcome in logistic regression controlling for paper-quality features (equations, pseudocode, hyperparameter reporting) and dataset age"
    test_method: "Logistic regression (Model 1): outcome ~ completeness + paper_quality_features + dataset_age. Coefficient for completeness must be negative with p < 0.05 (Benjamini-Hochberg corrected)"
    success_criterion: "β_completeness < 0, p_BH < 0.05, effect size OR < 1.0 for one-unit increase in normalized completeness"
    falsification: "β_completeness ≥ 0 OR p_BH ≥ 0.05 — documentation completeness does not predict failure above paper-quality controls"
  - id: "P2"
    primary: false
    statement: "Dataset concentration (HHI, normalized) adds significant predictive power for reproducibility failure above documentation completeness and paper-quality controls"
    test_method: "Hierarchical logistic regression: Model 1 (completeness + controls) vs. Model 2 (completeness + HHI + controls). Likelihood ratio test between models, χ² p < 0.05"
    success_criterion: "LRT p < 0.05, β_HHI > 0 (positive: higher concentration = higher failure probability)"
    falsification: "LRT p ≥ 0.05 — concentration does not independently predict failure above completeness"
  - id: "P3"
    primary: false
    statement: "Among the seven individual completeness fields, intended_use_present and out_of_scope_use_present have larger absolute logistic regression coefficients than license_present and provenance_present"
    test_method: "Logistic regression with seven binary field indicators replacing composite completeness score. Compare coefficient magnitudes with bootstrapped 95% CIs"
    success_criterion: "|β_intended_use| > |β_license| AND |β_out_of_scope_use| > |β_provenance| with non-overlapping 95% CIs"
    falsification: "license or provenance coefficients exceed intended_use or out_of_scope_use — field specificity hypothesis fails"

