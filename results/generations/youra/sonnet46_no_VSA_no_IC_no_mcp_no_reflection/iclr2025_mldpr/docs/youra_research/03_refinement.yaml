# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "First empirical linkage between metadata-observable dataset misuse signals (documentation completeness, usage concentration) and labeled reproducibility failure outcomes. First use of Raff's corpus to test dataset-level (vs. paper-level) predictors of reproducibility."
  key_innovation: "Bridges two previously-separate literatures: dataset documentation (Gebru et al.) and ML reproducibility auditing (Raff), via programmatic metadata extraction from public APIs. Produces actionable field-level importance results for platform administrators."
  differentiation:
    - prior_work: "Gebru et al. 2021 — proposes datasheets schema"
      difference: "We provide empirical validation that specific fields (intended_use, out_of_scope_use) predict reproducibility failure — first empirical test of the schema's predictive utility"
    - prior_work: "Raff 2019 — identifies paper-level predictors of reproducibility"
      difference: "We add dataset-level predictors (completeness, concentration) not in Raff's original model, demonstrating that what dataset you choose matters above and beyond how well you describe your methods"
    - prior_work: "D'Amour et al. 2021 — theoretical underspecification mechanism"
      difference: "We operationalize the mechanism with metadata-observable proxies and test it against ground-truth reproducibility labels"

