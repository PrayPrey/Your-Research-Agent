experimental_setup:
  dataset:
    name: "Raff 2019 Reproducibility Corpus + HF Hub API + OpenML API"
    type: "standard"
    source: "Raff (2019) published dataset; HuggingFace Hub public API; OpenML Python API"
    path: "arXiv:1909.06674 supplementary data; huggingface_hub.list_datasets(); openml.datasets.list_datasets()"
    hypothesis_fit: "Raff's corpus provides binary reproducibility ground truth (DV). HF Hub API provides documentation completeness scores (IV1). OpenML API provides run counts for HHI (IV2). No new data collection required."
  model:
    name: "Logistic Regression (primary) + Random Forest (robustness)"
    type: "statistical classification"
    source: "scipy.stats, sklearn.linear_model.LogisticRegression, sklearn.ensemble.RandomForestClassifier"
    hypothesis_fit: "Binary outcome (reproducible/not) with continuous predictors; logistic regression is standard. Random Forest provides non-linearity robustness check."
  baselines:
    - name: "Paper-quality-only model (Raff's original features)"
      method: "Logistic regression with only Raff's paper-level quality features as predictors (no dataset-level signals). This is Model 1 against which we test incremental contribution of dataset-level signals."
    - name: "Intercept-only null model"
      method: "Predicts majority class (reproducible) for all papers. AUC = 0.5. Baseline for all model comparisons."

