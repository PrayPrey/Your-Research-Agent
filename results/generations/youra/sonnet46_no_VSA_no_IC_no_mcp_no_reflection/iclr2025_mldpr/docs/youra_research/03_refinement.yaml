# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Raff 2019 provides binary reproducibility labels for 255 ML papers from top venues (NeurIPS, ICML, ICLR, JMLR), with 50.8% reproducible"
      status: "BUILD_ON"
      evidence: "Raff, E. (2019). A Step Toward Quantifying Independently Reproducible ML Research. arXiv:1909.06674"
    - claim: "HuggingFace dataset cards follow the Datasheets for Datasets schema (Gebru et al. 2021) and expose structured metadata fields via public API"
      status: "BUILD_ON"
      evidence: "Gebru et al. (2021). Datasheets for Datasets. arXiv:1803.09010; HuggingFace Hub API documentation"
    - claim: "OpenML exposes per-dataset run counts and task creation timestamps via openml-python API"
      status: "BUILD_ON"
      evidence: "Vanschoren et al. (2014). OpenML: Networked Science in ML. arXiv:1407.7722"
    - claim: "Benchmark concentration (overuse of few datasets) causes models to overfit dataset-specific artifacts, producing underspecification and failure under distribution shift"
      status: "BUILD_ON"
      evidence: "D'Amour et al. (2021). Underspecification Presents Challenges for Credibility in ML. arXiv:2011.03395"
    - claim: "No prior study has linked metadata-observable dataset misuse signals to Raff's (or any other) labeled reproducibility outcomes at the paper-dataset level"
      status: "PROVE_NEW"
      evidence: "Gap confirmed by Phase 1 literature review; no matching papers found in Semantic Scholar search"
    - claim: "Documentation completeness score computed from HF card field presence predicts dataset misuse likelihood"
      status: "PROVE_NEW"
      evidence: "Proposed in Phase 1 Gap 3; not yet empirically validated"
    - claim: "Dataset concentration (HHI) independently predicts reproducibility failure above documentation completeness"
      status: "PROVE_NEW"
      evidence: "Novel claim emerging from discussion; mechanism grounded in D'Amour et al. but linkage to Raff's labels is untested"
  scope_reduction_percentage: 57
  phase2b_4_instructions: |
    Three claims are BUILD_ON (established infrastructure and theory) — Phase 2B need not re-verify
    that Raff's dataset exists, that HF Hub API works, or that underspecification theory holds.
    Focus verification effort on the three PROVE_NEW claims: (1) documentation completeness
