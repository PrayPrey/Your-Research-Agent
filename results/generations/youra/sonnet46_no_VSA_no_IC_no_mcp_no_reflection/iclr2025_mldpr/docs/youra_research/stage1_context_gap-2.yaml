gap_id: "gap-2"
gap_title: "Absence of Empirical Linkage Between Metadata-Observable Dataset Misuse and Reproducibility Failure Outcomes"
gap_description: |
  No study has connected metadata-observable dataset misuse signals (task-type drift,
  out-of-context usage flags, documentation incompleteness) with labeled reproducibility
  failure outcomes at the paper-dataset level. The novel contribution requires: a matched
  dataset of (paper, dataset) pairs from reproducibility studies linked to metadata-observable
  misuse signals from repository APIs, plus a statistical test (Spearman correlation,
  logistic regression) measuring whether misuse signals predict failure.
