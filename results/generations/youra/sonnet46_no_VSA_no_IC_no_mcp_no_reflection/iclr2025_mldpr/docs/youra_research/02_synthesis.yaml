hypothesis_draft:
  title: "Metadata-Observable Dataset Misuse Predicts ML Reproducibility Failure"
  hypothesis_id: "H-MetaMisuse-v1"
  core_claim: |
    Among top-venue ML papers in Raff's 255-paper reproducibility audit corpus,
    papers that use benchmark datasets with lower documentation completeness (HF card
    field-presence score) and higher usage concentration (HHI over OpenML run counts
    filtered to pre-publication period) are significantly more likely to fail independent
    reproducibility verification, above and beyond paper-level quality features already
    established in Raff's original study.
  mechanism: |
    High concentration → dataset artifact accumulation (models overfit artifacts instead
    of learning generalizable patterns; D'Amour et al. 2021 underspecification theory).
    Low documentation completeness → out-of-context application risk (no scope boundary
    signals available to researchers; Gebru et al. 2021).
    Both mechanisms converge on reproducibility failure: artifact-overfit results break
    under independent replication conditions.
  predictions:
    - P1: "Documentation completeness negatively predicts failure (β < 0, p_BH < 0.05) in logistic regression controlling for paper-quality features and dataset age"
    - P2: "Dataset concentration (HHI) adds significant predictive power above completeness (LRT p < 0.05, Model 1 vs. Model 2)"
    - P3: "intended_use and out_of_scope_use field indicators have larger absolute coefficients than license and provenance in field-level logistic regression"

variables_summary:
  independent: "Documentation completeness score (0-7 normalized, HF card field presence); Dataset concentration HHI (normalized, OpenML pre-publication run counts); Seven binary field-level indicators for P3"
  dependent_primary: "Binary reproducibility label from Raff 2019 (1=reproducible, 0=not)"
  controlled: "Paper-quality features (equations, pseudocode, hyperparameters, reference implementation — all from Raff's original coding); dataset age (years between dataset publication and paper publication); number of datasets per paper"

null_hypothesis:
  h0_statement: |
    After controlling for paper-level quality features (equations, pseudocode, hyperparameter
    reporting, reference implementation), dataset-level metadata-observable misuse signals
    (documentation completeness, HHI concentration) show no significant association with
    binary reproducibility outcomes in Raff's 255-paper corpus.
  statistical_test: "Logistic regression with likelihood ratio test (LRT) for nested model comparison; Benjamini-Hochberg correction for P1 individual coefficients"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First empirical linkage between metadata-observable dataset misuse signals and labeled ML reproducibility failure outcomes, using existing public APIs and Raff's published ground-truth corpus — no new data collection, annotation, or benchmarks required"
  differentiation_summary: |
    Extends Raff 2019 by adding dataset-level predictors to an existing paper-level reproducibility
    model. Provides empirical validation for Gebru et al.'s datasheets schema. Operationalizes
    D'Amour et al.'s underspecification mechanism with metadata-observable proxies. Novel linkage
    between three previously-separate research threads.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Logistic Regression (sklearn.linear_model.LogisticRegression)"
    - "Random Forest (sklearn.ensemble.RandomForestClassifier) — robustness check"
  datasets:
    - "Raff 2019 reproducibility corpus (N=255 papers, ~30-60 unique benchmark datasets)"
    - "ML Reproducibility Challenge 2021 (Papers with Code) — secondary validation"
  baselines:
    - "Paper-quality-only logistic regression (Raff's original features, no dataset-level signals)"
    - "Intercept-only null model (majority class)"

measurement_plan:
  data_collection:
    - source: "Raff 2019 supplementary data (arXiv:1909.06674) — paper list, reproducibility labels, quality features"
    - source: "HuggingFace Hub API (huggingface_hub.list_datasets(full=True)) — dataset card field presence for each unique dataset in corpus"
    - source: "OpenML Python API (openml.datasets.list_datasets()) — run counts with task creation timestamps for temporal filtering"
  procedure:
    - step: "1. Extract unique datasets from Raff corpus; map to HF Hub slugs and OpenML dataset IDs"
    - step: "2. Query HF Hub API for each dataset card; score field presence (0-7)"
    - step: "3. Query OpenML API for run counts per dataset; filter to pre-publication year; compute HHI"
    - step: "4. Merge dataset-level features (completeness, HHI) into Raff's paper-level dataset (average across datasets per paper)"
    - step: "5. Fit Model 1 (paper-quality controls + completeness); fit Model 2 (+ HHI); fit Model 3 (field-level indicators)"
    - step: "6. LRT Model 1 vs. Model 2 (P2); BH-corrected coefficients for P1; bootstrapped CIs for P3"
  success_criteria:
    - "P1: β_completeness < 0, p_BH < 0.05"
    - "P2: LRT χ² p < 0.05, β_HHI > 0"
    - "P3: |β_intended_use| > |β_license|, non-overlapping 95% CIs"
    - "Secondary: Effect replicated in direction (if not magnitude) on ML Reproducibility Challenge data"

validation:
  internal_validity:
    - "Include Raff's paper-quality features as controls to rule out paper-quality confound"
    - "Include dataset age as control to rule out temporal confound in completeness scores"
    - "Pre-register analysis plan (OSF/AsPredicted) before data pull to prevent HARKing"
    - "Robustness check: Random Forest non-linearity test; remove papers where dataset-quality correlation r>0.3"
  external_validity:
    - "Replicate directional finding on ML Reproducibility Challenge 2021 data (Papers with Code) as out-of-sample validation"
    - "Acknowledge top-venue selection bias as scope limitation"
    - "Note temporal generalizability caveat: post-2020 papers have structurally different HF card completeness"

discussion_synthesis:
  key_insights:
    - "The paper-quality confound is the key threat to validity — Raff already coded the control variables we need (equations, pseudocode, hyperparameters), making this confound addressable without new annotation"
    - "Documentation completeness operationalized as field-presence score is a stronger design than task-type drift because it requires no paper-text NLP — fully automatable from HF Hub API"
    - "Concentration as independent predictor (P2) is the highest-impact novel claim: shows that structural benchmark monoculture is a reproducibility risk, not just documentation quality"
    - "Field-level importance (P3) is the most actionable result for platform administrators: identifies which specific fields to prioritize in dataset card enforcement"
  breakthrough_moments:
    - "Exchange 3 (Dr. Sage): Framing concentration as independent predictor 'above and beyond documentation quality' — this is what makes P2 novel vs. just replicating Gebru et al."
    - "Exchange 4 (Prof. Pax): Clarifying that paper-level modeling (N=255) is feasible and provides adequate power — resolved the sample size concern about dataset-level analysis"
    - "Exchange 6 (Prof. Rex): Identifying that Raff already coded paper-quality control variables — this transforms the confound from a blocking problem into a solvable design choice"
  resolved_tensions:
    - "Task-type drift (Angle A) vs. documentation completeness (Angle B): resolved in favor of completeness as primary (no NLP needed); drift preserved as secondary via task_categories field"
    - "Paper-level vs. dataset-level modeling: resolved as paper-level (N=255) with dataset-level covariates — sufficient power, cleaner design"
    - "Temporal validity of HHI: resolved via OpenML task timestamp filtering as primary approach, dataset age proxy as fallback"
