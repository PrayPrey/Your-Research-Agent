# ============================================================================
# METHODOLOGY FACTS
# ============================================================================

methodology:
  pipeline_name: "H-E1 Data Acquisition Pipeline"
  modules:
    - "RaffParser"
    - "HFCoverageChecker"
    - "OpenMLTemporalChecker"
    - "MetricsAggregator"
    - "Visualizer"
  key_parameters:
    hf_rate_limit_sleep_s: 1.0
    hf_field_set:
      - intended_use
      - out_of_scope_use
      - limitations
      - license
      - task_categories
      - dataset_info
      - provenance
    hf_fields_count: 7
    hf_coverage_threshold: 0.50
    openml_threshold: 0.70
    n_unique_datasets: 50
    openml_query_mode: "bulk_fetch (openml.datasets.list_datasets(output_format='dataframe'))"
    temporal_filter: "upload_date_year < paper_publication_year"
  source: "h-e1/03_architecture.md; 045_validated_hypothesis Section 5.3"

