# ============================================================================
# CORE METRICS (from live API experiment)
# ============================================================================

metrics:
  hf_coverage_rate:
    name: "HuggingFace Hub dataset card coverage rate"
    our_value: 0.30
    threshold: 0.50
    gate_result: "FAIL"
    n_found: 15
    n_queried: 50
    source: "h-e1/04_validation.md + 045_validated_hypothesis.md Section 5.3"

  openml_temporal_filter_success_rate:
    name: "OpenML pre-publication temporal filter success rate"
    our_value: 0.22
    threshold: 0.70
    gate_result: "FAIL"
    n_valid: 11
    n_queried: 50
    source: "h-e1/04_validation.md + 045_validated_hypothesis.md Section 5.3"

  hf_mean_field_score:
    name: "Mean field-presence score for found HF cards"
    our_value: 0.41
    n_datasets: 15
    n_fields: 7
    source: "045_validated_hypothesis.md Section 4.2 Finding 3"

  raff_corpus_size:
    name: "Number of papers in Raff 2019 corpus"
    our_value: 255
    reproducibility_rate: 0.508
    source: "h-e1/04_validation.md; Raff 2019 paper"

  pipeline_runtime_seconds:
    name: "Total pipeline runtime (live API)"
    our_value: 88.84
    source: "045_validated_hypothesis.md Section 5.3"

  test_suite:
    name: "Pytest test results"
    pass_count: 18
    fail_count: 0
    source: "h-e1/04_validation.md"

# ============================================================================
# GATE LOGIC
# ============================================================================

gate:
  type: "MUST_WORK"
  logic: "AND"
  criteria:
    - metric: "hf_coverage_rate"
      threshold: 0.50
      result: 0.30
      passed: false
    - metric: "openml_temporal_filter_success_rate"
      threshold: 0.70
      result: 0.22
      passed: false
  overall_gate_result: "FAIL"
  downstream_blocked: ["H-M1", "H-M2", "H-M3"]

# ============================================================================
# DOMAIN PATTERN (must be consistent in paper)
# ============================================================================

domain_pattern:
  hf_found_domains:
    - "NLP/text classification (all 15 found datasets)"
    - "Examples: IMDB, SST-2, AG News, SQuAD, GLUE components"
  hf_not_found_domains:
    - "DL vision (CIFAR-10, ImageNet, COCO, Pascal VOC, KITTI, Caltech-101/256)"
    - "Speech/audio (LibriSpeech, TIMIT, Wall Street Journal)"
    - "Graph (Cora, Citeseer)"
  openml_found_domains:
    - "Classical tabular/UCI (iris, wine, adult, covertype, diabetes, breast_cancer)"
    - "MNIST (1 entry)"
  openml_not_found_domains:
    - "All DL benchmarks (CIFAR, ImageNet, COCO)"
    - "Speech datasets"
    - "Graph datasets"
  source: "045_validated_hypothesis.md Section 4.2"

