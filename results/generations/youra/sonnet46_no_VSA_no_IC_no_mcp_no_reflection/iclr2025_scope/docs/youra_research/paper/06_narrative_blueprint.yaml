# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      "We applied LoRA to Mamba-130m exactly as we would to any transformer —
      correct target modules, correct parameter counts, 1.14% trainable weights —
      and watched SST-2 accuracy sit at 50.9% for three consecutive training epochs,
      indistinguishable from the zero-shot baseline of 49.1%."
    strategy: "counterintuitive_finding"
    elaboration: |
      The hook works because it names the exact failure with exact numbers.
      LoRA is one of the most successful PEFT methods in NLP. The reader
      expects fine-tuning to do *something*. Three identical epochs of
      majority-class accuracy is the clearest possible failure signal —
      and it is genuinely surprising to the PEFT community.

  why_reader_should_care:
    main_reason: |
      Mamba SSMs are positioned as the leading transformer-alternative for
      long-context modeling. If standard PEFT methods do not transfer, every
      practitioner who wants to adapt a Mamba model to a downstream task
      needs to know this NOW — before investing compute in a strategy that
      silently produces no learning.
    concrete_example: |
      A practitioner reading the MambaPEFT repository sees "90-92% SST-2 with
      LoRA r=8" and applies the same configuration. Our result — 50.9% after
      3 epochs — is what they will observe if the training recipe details differ
      from the reference in any undocumented way. The failure is silent: LoRA
      installs, training runs, loss logs appear, but no learning occurs.
    stakes: |
      Without a clear characterization of when and why LoRA fails on Mamba,
      practitioners face invisible wall failures. The field is actively building
      Mamba-based models (Jamba, Zamba, Falcon-Mamba); PEFT compatibility
      cannot be assumed from transformer experience.

  real_world_impact:
    application_domain: |
      Parameter-efficient fine-tuning of state-space sequence models for NLP
      classification, sentiment analysis, and natural language inference tasks.
    potential_beneficiaries: |
      ML practitioners adapting pretrained Mamba models to downstream tasks;
      researchers designing PEFT methods for non-transformer architectures;
      teams evaluating Mamba as a transformer replacement for production NLP.
    scale_of_impact: |
      Mamba models are increasingly deployed in open-source (state-spaces/
      mamba-*-hf) and commercial contexts. Any team using LoRA on pure Mamba
      SSMs for classification would encounter this failure. The documented
      zero-shot baselines and failure diagnostics are immediately reusable.

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING (Three Levels)
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: |
      Fine-tuning large pretrained models for downstream tasks is expensive.
      Parameter-efficient fine-tuning methods like LoRA reduce this cost by
      training only a small adapter while keeping the base model frozen.
    common_understanding: |
      The PEFT/LoRA community treats these methods as broadly architecture-agnostic:
      if a layer is nn.Linear, LoRA can be applied. Mamba projection layers
      (in_proj, out_proj, x_proj) are nn.Linear — therefore LoRA should work.

  deeper_problem:
    description: |
      The gradient path from classification loss to LoRA weight matrices is NOT
      a function of whether a layer is nn.Linear. It is a function of what
      computation lies BETWEEN the classification head and the adapter layers.
      In Mamba, the SSM scan — a custom CUDA parallel associative scan — sits
      between the classification head and the projection-layer LoRA weights.
    why_overlooked: |
      The PEFT community's mental model was built on transformers, where the
      attention mechanism is fully differentiable via standard autograd. The
      assumption that gradient flows cleanly through any forward-pass computation
      is valid for attention but has not been verified for SSM scan kernels.
      The LoRA API installing successfully creates a false sense of correctness:
      "LoRA is applied" is conflated with "LoRA will receive gradients."
    our_perspective: |
      API compatibility ≠ gradient compatibility. The existence of LoRA keys
      in the model state_dict and a non-zero trainable parameter count are
      necessary but not sufficient conditions for PEFT to produce learning.
      The SSM scan kernel is the silent wall: it permits forward inference
      but does not effectively propagate classification-discriminative gradients.

  gap_in_existing_work:
    description: |
      No prior work provides a controlled, negative-result characterization of
      projection-only LoRA failure on pure Mamba SSMs for classification tasks,
      with a mechanistic explanation of the failure mode and a diagnostic signature
      for practitioners to recognize it.
    why_gap_exists: |
      Negative results are underreported. The MambaPEFT repository reports
      90-92% SST-2 without fully documenting the training recipe (base vs.
      instruction-tuned checkpoint, classification head design, epoch count,
      tokenization, LR schedule). Practitioners cannot distinguish "LoRA works"
      from "LoRA works with specific undocumented setup choices."
    why_gap_matters: |
      Without a clear failure characterization, the field will repeatedly
      rediscover this failure independently, wasting compute. A documented
      negative result with a diagnostic signature (loss oscillation + flat
      accuracy for 3+ epochs) is a direct contribution to reproducible science
      and practitioner efficiency.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: |
      Standard projection-only LoRA installs correctly on Mamba but fails to
      produce classification learning because the SSM scan CUDA kernel acts as
      a gradient barrier between the classification head and the LoRA weight matrices.
    expanded_explanation: |
      Mamba's core computation — the selective state space scan h_t = A_bar·h_{t-1} + B_bar·x_t —
      is implemented as a custom CUDA parallel associative scan kernel. This kernel
      is not a standard autograd-differentiable operation in the same sense as
      nn.Linear or softmax. When a classification head is placed atop a pretrained
      causal Mamba model, the classification loss gradient must flow backward through
      this SSM kernel to reach the LoRA weight matrices in in_proj, out_proj, and x_proj.
      Our experiments demonstrate this gradient path is ineffective: 3 epochs of
      training produce zero improvement over zero-shot accuracy on SST-2 (50.9% vs 49.1%
      zero-shot), and active degradation on MNLI (32.3% epoch 2 vs 34.6% zero-shot).
      The insight is: gradient path is an architectural property, not a configuration
      property, and must be verified empirically, not assumed from API inspection.

  why_others_missed_it:
    common_assumptions: |
      1. If LoRA keys appear in state_dict, training is proceeding correctly.
      2. Mamba projection layers are nn.Linear → LoRA behaves as with transformers.
      3. Loss values > 0 during training imply gradient is flowing somewhere.
      4. MambaPEFT literature reporting high SST-2 implies LoRA is straightforwardly applicable.
    our_different_view: |
      We treated "does LoRA actually learn?" as an empirical question requiring
      a gate criterion (SST-2 > 0.70), not an assumed property derivable from
      the PEFT API. By measuring per-epoch accuracy alongside loss, we separated
      "training runs" from "training learns." The 3-epoch accuracy plateau at
      majority-class level — with loss oscillating, not decreasing — is the
      signature of gradient barrier failure, not slow convergence.
    enabling_factor: |
      The hypothesis pipeline required a MUST_WORK gate with explicit pass/fail
      criterion (SST-2 > 0.70). This forced collection of per-epoch accuracy
      data rather than relying on loss curves alone. Loss curves can look
      "plausible" (oscillating between 0.65-0.73) while accuracy reveals
      complete learning failure.

  what_makes_it_work:
    intuitive_explanation: |
      Think of the SSM scan as a one-way valve. Information flows forward through
      it easily (inference works perfectly — Mamba achieves near-random zero-shot
      SST-2 just as expected for a causal LM without instruction tuning). But
      gradient — the "feedback signal" that tells LoRA weights how to change —
      cannot effectively flow backward through this valve for classification tasks.
      The valve was designed for next-token prediction; classification loss speaks
      a different language that the valve cannot translate.
    key_mechanism: |
      The selective SSM scan computes state trajectories via CUDA parallel associative
      scan. This computation's gradient involves the associative scan gradient, which
      is implemented in custom CUDA (not standard PyTorch autograd). For the causal
      language modeling task the model was pretrained on, this gradient path is
      well-exercised. For a randomly-initialized classification head placed on the
      final hidden state, the gradient is novel and apparently ineffective — producing
      near-zero updates to the LoRA weight matrices despite non-zero loss.
    analogy: |
      Analogy: Imagine training a sommelier to predict wine region by attaching
      a classification head to their tongue neurons — but the feedback pathway
      between "wine region prediction" and "tongue neuron adjustment" only works
      for flavor intensity training (the original task). The classification signal
      exists but cannot reach the relevant neurons through the biological wiring.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 3: EVIDENCE STORY
# ═══════════════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: |
      Standard projection-only LoRA (in_proj, out_proj, x_proj; r=8, α=16) does
      not produce meaningful classification task learning on Mamba-130m, even after
      correct installation confirmed by parameter counts and API validation.
    measurable_criteria: |
      Primary: SST-2 accuracy after 3 epochs ≤ zero-shot + small noise (observed: +1.84pp,
      compared to target > 20pp improvement to reach gate of 70%).
      Secondary: MNLI accuracy trend monotonically non-increasing (observed: degrading from
      34.6% zero-shot to 32.3% by epoch 2).
      Tertiary: Loss curve non-monotonic (oscillating 0.65–0.73, not converging).

  supporting_evidence:
    - id: "evidence_1"
      what: |
        SST-2 accuracy: zero-shot 0.4908, epoch 1: 0.5092, epoch 2: 0.5092,
        epoch 3: 0.5092. Three consecutive identical accuracy values.
      so_what: |
        Three epochs of identical accuracy is the clearest possible indicator
        of zero learning. This is not slow convergence — if learning were occurring,
        any stochastic variation in predictions would produce different accuracy
        values across epochs. The consistency points to a model locked in a fixed
        prediction regime (near-majority-class).
      how_it_supports_claim: |
        Direct measurement of the primary gate criterion. SST-2 at 50.9% is 19.1pp
        below the conservative gate of 70%, and only 1.84pp above zero-shot —
        within noise. The claim that LoRA produces no meaningful learning is
        directly evidenced by 3 flat identical measurements.

    - id: "evidence_2"
      what: |
        MNLI accuracy: zero-shot 0.3463, epoch 1: 0.3326 (−1.4pp),
        epoch 2: 0.3234 (−2.3pp). Active degradation below zero-shot baseline.
      so_what: |
        Active degradation — not just failure to improve — rules out the
        "needs more epochs" explanation. The model is not stuck; it is moving
        in the wrong direction. This is the signature of the classifier head being
        trained into a degenerate prediction mode (likely collapsing to predict
        a single NLI class) without learning the task.
      how_it_supports_claim: |
        Establishes that the failure is cross-task, not SST-2-specific. Both
        binary sentiment (SST-2) and three-class NLI (MNLI) show the same
        fundamental failure, with MNLI additionally showing negative transfer.
        The claim "no meaningful learning" is supported across two distinct tasks.

    - id: "evidence_3"
      what: |
        LoRA installation confirmed: 1.14% trainable parameters (PEFT report),
        LoRA keys present in model state_dict, LoRA target modules applied to
        in_proj, out_proj, x_proj across all Mamba blocks.
      so_what: |
        This evidence establishes that the failure is NOT a configuration error
        or beginner mistake. The LoRA adapter is installed exactly as specified.
        The failure occurs downstream of correct installation — in the gradient
        path from classification loss through the SSM scan to the LoRA matrices.
      how_it_supports_claim: |
        Eliminates the "LoRA wasn't applied" alternative explanation. Combined
        with flat accuracy, this proves API compatibility ≠ gradient compatibility:
        the LoRA matrices exist and are nominally trainable, but do not receive
        effective classification gradients.

    - id: "evidence_4"
      what: |
        Loss curve oscillates between 0.65–0.73 across training batches,
        with no monotonic decrease trend across 3 epochs.
      so_what: |
        Non-monotonic loss with no downward trend is the second diagnostic
        signature of gradient barrier failure, independent of accuracy measurement.
        Meaningful gradient flow produces directional (even if slow) loss decrease.
        Oscillation indicates updates that are not coherently directed by task signal.
      how_it_supports_claim: |
        Provides a training-time diagnostic signature that practitioners can
        detect without waiting for full epoch accuracy evaluation. Loss oscillation
        without trend is a practical early-stopping signal for this failure mode.

  surprising_findings:
    finding: |
      Zero-shot QQP accuracy: 0.0000. Mamba-130m predicts the "not paraphrase"
      class for every QQP sample in zero-shot evaluation, achieving 0% accuracy
      despite QQP having ~63% positive pairs (suggesting majority class should be ~0.37,
      not 0.00).
    why_surprising: |
      Even random guessing on QQP would yield ~50% accuracy. Majority-class
      prediction would yield ~63%. 0.0000 indicates the model is systematically
      predicting the minority class label, suggesting Mamba-130m's output token
      generation is misaligned with the lm-eval-harness QQP evaluation protocol
      in a consistent but wrong direction.
    our_interpretation: |
      This is not a core finding of the paper but is documented in the zero-shot
      baselines table. It suggests Mamba-130m's response to QQP prompt templates
      is systematically biased toward the "not paraphrase" token, likely a
      tokenization or prompt-format incompatibility with lm-eval-harness.
      Included in paper for reproducibility; not over-interpreted.

  what_results_mean:
    synthesis: |
      The experimental data collectively demonstrate that standard projection-only
      LoRA on Mamba-130m produces a training process that appears to run (loss exists,
      gradients nominally computed, LoRA adapter installed) but produces zero
      classification learning. The SSM scan gradient barrier hypothesis explains
      all three patterns: flat SST-2 accuracy, MNLI degradation, and non-monotonic
      loss. PEFT compatibility with Mamba requires either (a) adapting parameters
      inside the SSM kernel (dt/B/C direct), (b) bypassing the scan entirely
      (prefix tuning), or (c) a training recipe that successfully propagates
      classification gradients through the scan (exact replication of MambaPEFT
      needed to identify what this recipe is).
    confidence_level: |
      HIGH for the primary finding (LoRA produces no meaningful learning on
      Mamba-130m for classification). MEDIUM for the mechanistic interpretation
      (SSM scan gradient barrier) — this is the most parsimonious explanation
      but requires gradient magnitude logging and transformer control to confirm.
    caveats: |
      1. Single model scale (130M only); mechanism likely scale-independent but unverified.
      2. Single seed (seed=42); architectural failures are not seed-sensitive.
      3. Only SST-2 and MNLI evaluated; QNLI/QQP not reached due to GPU contention.
      4. No transformer control experiment (GPT-2 + identical setup) to confirm SSM-specificity.
      5. MambaPEFT literature discrepancy (90-92% reported vs. 50.9% observed) unresolved.

# ═══════════════════════════════════════════════════════════════════════════════
# PART 4: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: |
      We provide the first systematic empirical evidence that projection-only LoRA
      fails for classification fine-tuning of Mamba-130m, characterize the SSM scan
      gradient barrier as the mechanism, document zero-shot GLUE baselines, and
      provide a diagnostic signature (loss oscillation + flat per-epoch accuracy)
      for practitioners to recognize this failure mode.
    why_significant: |
      The SSM model family (Mamba, Falcon-Mamba, Jamba, Zamba) is rapidly gaining
      adoption as a transformer alternative. The PEFT community needs to know that
      architecture-agnostic assumptions about LoRA do not hold for pure SSMs.
      This negative result, properly documented, saves future researchers and
      practitioners from repeating this experiment and sets a clear design
      constraint: Mamba PEFT requires gradient-path-aware adaptation strategies.

  implications:
    for_field: |
      1. PEFT researchers designing methods for non-transformer architectures must
         verify gradient flow, not merely API compatibility.
      2. The SSM gradient barrier is a new design constraint for state-space PEFT:
         methods must either (a) operate inside the SSM kernel or (b) bypass it.
      3. The MambaPEFT literature gap (90-92% vs. 50.9%) is an open reproducibility
         problem that the field should resolve, as it implies underdocumented
         training recipe sensitivity.
    for_practice: |
      1. Practitioners should NOT apply projection-only LoRA to pure Mamba models
         for classification without verifying gradient flow (use diagnostic signature:
         loss oscillation + flat accuracy across epochs).
      2. Zero-shot GLUE baselines for Mamba-130m are now documented (SST-2=0.4908,
         MNLI=0.3463, QNLI=0.5056, QQP=0.0000) for use as reference in future experiments.
      3. For Mamba classification adaptation, prefer: dt_proj LoRA (SSM-adjacent),
         prefix tuning, or full fine-tuning of the classification head with frozen SSM.
    conceptual_contribution: |
      The distinction between "PEFT API compatibility" and "PEFT gradient compatibility"
      is a new conceptual lens for evaluating adaptation methods on architectures with
      non-standard computation graphs. The paper proposes making gradient-path analysis
      a first-class evaluation criterion alongside parameter count and accuracy.

  future_possibilities:
    immediate_extensions: |
      1. [HIGH PRIORITY] Exact replication of MambaPEFT (alxndrTL/mamba-peft) to
         identify the enabling variable producing 90-92% SST-2. If replication succeeds,
         SSM gradient barrier interpretation is revised to a training recipe issue.
      2. [HIGH PRIORITY] dt_proj LoRA or direct B/C parameter adaptation — operates
         inside the SSM computation rather than in the projection layers feeding it.
      3. [MEDIUM] Prefix tuning for Mamba — bypasses SSM scan entirely by operating
         at input embedding level; low engineering overhead.
      4. [MEDIUM] Gradient magnitude logging per layer during backprop — would directly
         confirm or refute the SSM scan gradient barrier hypothesis.
    longer_term_vision: |
      A unified theory of PEFT compatibility for non-transformer architectures, where
      gradient-path analysis informs method design. The SSM case is the first data
      point; recurrent models (LSTMs with custom CUDA), sparse attention variants,
      and retrieval-augmented architectures may present similar gradient barrier patterns.
      Architecture-aware PEFT — where the adapter placement is determined by gradient
      path analysis rather than nn.Linear detection — is the longer-term direction.
    open_questions: |
      1. Does the SSM gradient barrier disappear at larger model scales (Mamba-370M, 2.8B)?
      2. Is the barrier task-specific (classification only) or does it affect all
         non-causal-LM fine-tuning targets?
      3. What exactly does MambaPEFT's training recipe do differently to achieve 90-92%?
      4. Does Mamba-2's different SSM parameterization exhibit the same barrier?
      5. Would a Mamba model instruction-tuned before LoRA classification fine-tuning
         avoid the barrier (instruction tuning aligns gradient path for task-following)?

