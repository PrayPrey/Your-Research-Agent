# NOTES
# ═══════════════════════════════════════════════════════════════════════════════

notes:
  creation_notes: |
    This blueprint is designed for a negative/null result paper. The narrative
    strategy differs from a positive result paper in several key ways:
    1. The "contribution" is the failure characterization, not a performance improvement.
    2. Honest framing is both ethically required and strategically optimal —
       reviewers will spot minimization of the failure, which damages credibility.
    3. The MambaPEFT discrepancy is treated as an open question, not a conflict,
       to maintain academic integrity and avoid unfair claims about unreplicated work.
    4. The forward directions (exact replication, dt_proj LoRA, prefix tuning) are
       grounded in the failure analysis, making the paper feel forward-looking despite
       the negative result.
    5. Phase 5 baseline comparison was not run (h-e1 FAILED before reaching this phase).
       The paper does not use Phase 5 results; the zero-shot baselines from h-e1 serve
       as the comparative reference.

    Venue recommendation: EMNLP Findings (negative results track if available) or
    venues explicitly welcoming null results (ML Reproducibility Challenge, ReScience).
    ICML is possible but tougher without a positive result story to anchor the narrative.

  revision_history: []
