# ===========================================================================
# QUALITATIVE CLAIMS — interpretations asserted in paper
# ===========================================================================

qualitative_claims:

  - claim: "Three consecutive identical SST-2 accuracy values indicate zero learning, not slow convergence"
    location: "Section 5.2 (Results)"
    reasoning: "If any learning occurred, stochastic batch variation would produce different values across epochs"
    verified: true
    confidence: "HIGH"

  - claim: "MNLI degradation indicates negative transfer, not just absence of learning"
    location: "Section 5.3 (Results)"
    reasoning: "A model receiving no gradient signal would plateau; one receiving noise gradient in wrong direction degrades"
    verified: true
    confidence: "HIGH"

  - claim: "The SSM selective scan acts as a gradient barrier for classification"
    location: "Abstract, Section 1.4, Section 6.1"
    reasoning: "Custom CUDA parallel associative scan sits between classification head and LoRA matrices; backward path is novel for classification"
    verified: "MEDIUM — mechanistic interpretation, not directly measured; consistent with all observed patterns"
    confidence: "MEDIUM"
    caveats:
      - "Gradient magnitudes not directly logged per layer"
      - "No transformer control experiment to confirm SSM-specificity"
      - "Single model scale (130M); scale-independence unverified"

  - claim: "API compatibility with nn.Linear is not sufficient for LoRA gradient compatibility"
    location: "Abstract, Section 1.4, Section 6.1, Section 7"
    reasoning: "LoRA installs correctly (verified), weights updated (verified), but no learning occurs (verified)"
    verified: true
    confidence: "HIGH"

  - claim: "Loss oscillation without monotonic decrease is diagnostic of gradient barrier failure"
    location: "Section 5.5, Section 6.1"
    reasoning: "Observed 0.65-0.73 oscillation with no downward trend across 375 gradient steps"
    verified: true
    confidence: "HIGH"

  - claim: "40 percentage-point gap with MambaPEFT is not a contradiction but an open reproducibility problem"
    location: "Section 5.6, Section 6.2"
    reasoning: "Different training setups can produce different results; MambaPEFT recipe underdocumented"
    verified: "PLAUSIBLE — cannot fully verify without MambaPEFT replication"
    confidence: "MEDIUM"

  - claim: "QQP 0.0000 is due to tokenization/prompt-format incompatibility, not a training artifact"
    location: "Section 5.1"
    reasoning: "Zero-shot (pre-training) result; model predicts minority class systematically"
    verified: "PLAUSIBLE — most parsimonious explanation; not over-interpreted in paper"
    confidence: "MEDIUM"

  - claim: "Prefix tuning bypasses the gradient barrier by operating upstream of SSM scan"
    location: "Section 2.4, Section 6.3"
    reasoning: "Prefix parameters at input embedding level; gradient path from task loss to prefix does not pass through SSM scan"
    verified: true
    confidence: "HIGH — follows from architecture analysis"

  - claim: "dt_proj LoRA operates inside/adjacent to SSM computation and may avoid the barrier"
    location: "Section 6.3"
    reasoning: "dt_proj controls SSM discretization, is closer to scan than in_proj/out_proj/x_proj"
    verified: "PLAUSIBLE — not empirically tested; theoretically motivated"
    confidence: "MEDIUM"

