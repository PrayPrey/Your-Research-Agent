# ===========================================================================
# KEY NARRATIVE CLAIMS
# ===========================================================================

narrative_claims:

  gradient_barrier_hypothesis:
    claim: "The Mamba selective SSM scan (selective_scan_cuda) acts as a gradient barrier between classification head and LoRA weight matrices"
    evidence:
      - "SST-2 flat at 0.5092 across 3 epochs (primary)"
      - "MNLI degrades from 0.3463 to 0.3234 (secondary)"
      - "Loss oscillates 0.65-0.73 without convergence (tertiary)"
      - "LoRA installation verified correct — eliminates alternative explanation"
    confidence: "MEDIUM-HIGH (three converging patterns; mechanism not directly measured)"
    falsification_path: "Gradient magnitude logging per layer would confirm or refute; transformer control would establish SSM-specificity"

  api_vs_gradient_compatibility:
    claim: "API compatibility (nn.Linear target) is necessary but not sufficient for LoRA gradient compatibility"
    evidence:
      - "LoRA keys present in state_dict (Table 4)"
      - "1.14% trainable parameters confirmed"
      - "Weights non-zero post-training (gradients computed)"
      - "Zero classification learning despite correct installation"
    confidence: "HIGH"

  zero_learning_signature:
    claim: "Three identical consecutive accuracy values = zero learning, not slow convergence"
    evidence:
      - "0.5092 / 0.5092 / 0.5092 on 872-sample validation set"
      - "Any learning would produce stochastic variation"
    confidence: "HIGH"

  negative_transfer_interpretation:
    claim: "MNLI degradation is classifier head degeneracy, not task-specific artifact"
    evidence:
      - "Active degradation below zero-shot (not just plateau)"
      - "Consistent with head collapsing to single NLI class"
      - "Cross-task failure rules out SST-2-specific explanation"
    confidence: "MEDIUM (most plausible interpretation; not directly verified)"

  mambapeft_discrepancy:
    claim: "40pp gap between our 50.9% and MambaPEFT 90-92% is open reproducibility problem, not contradiction"
    position: "Both results can be accurate under different training setups"
    unresolved_variables:
      - "Base vs. instruction-tuned checkpoint"
      - "Classification head design and initialization"
      - "Prompt format and tokenization"
      - "Training sample count and epoch count"
      - "Learning rate schedule details"
    priority: "Highest-priority future work"

