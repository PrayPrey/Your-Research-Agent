# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "LoRA on nn.Linear layers is architecture-agnostic and applies to Mamba projection layers (in_proj, out_proj, x_proj, dt_proj) without modification"
      status: "BUILD_ON"
      evidence: "LoRA [Hu et al., 2022] validated on multiple architectures; Mamba projection layers are standard nn.Linear"
    - claim: "Mamba-1 A_log bias adaptation preserves recurrent stability automatically because A = -exp(A_log) is always negative regardless of bias magnitude"
      status: "BUILD_ON"
      evidence: "Mathematical derivation in discussion: A_bar = exp(Δ·A) ∈ (0,1) for A < 0, Δ > 0 — guaranteed stable"
    - claim: "Mamba-2 scalar A per SSM head enables IA³-style multiplicative state adaptation with O(num_heads) parameter overhead"
      status: "BUILD_ON"
      evidence: "Mamba-2 [Dao & Gu, 2024]: SSD layer uses scalar-times-identity A; num_heads typically 16-64"
    - claim: "State-aware PEFT (A-adaptation) is non-redundant with projection-layer LoRA: A controls unconditional base decay rate; projections control input-dependent state read/write"
      status: "PROVE_NEW"
      evidence: "Mathematical argument in discussion (Exchange 7); empirical validation is the contribution"
    - claim: "State-aware PEFT outperforms naive projection-only LoRA on NLP benchmarks"
      status: "PROVE_NEW"
      evidence: "No prior empirical study; this is the primary hypothesis to validate"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims (stability math, architecture-agnosticism) do not require re-derivation.
    PROVE_NEW claims require empirical validation: run 4-condition ablation on GLUE + LongBench
    at Mamba-130m and Mamba-370m scales. Primary success criterion: GLUE average ≥1% gain
    or LongBench ≥2% gain for state-aware conditions vs. projection-only baseline.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-SA-LoRA-v1"
  confidence_level: 0.72
  core_hypothesis_statement: |
    Under fine-tuning of Mamba SSMs (Mamba-1 130m/370m; Mamba-2 if checkpoint available)
    on NLP classification and long-context tasks (GLUE + LongBench subset), if we adapt
    the recurrent state decay parameters (A_log bias for Mamba-1; scalar A multiplier for
    Mamba-2) in addition to standard LoRA on projection layers (in_proj, out_proj, x_proj,
    dt_proj), then downstream task accuracy improves beyond projection-only LoRA
    (GLUE average ≥1%, LongBench ≥2%), because A-adaptation modifies task-specific memory
    horizons (base forgetting rate) in a way that projection-layer LoRA cannot replicate,
    with gain magnitude positively correlated with task sequence length requirements.
  alternative_hypothesis_h0: |
    There is no statistically significant difference in downstream NLP accuracy (GLUE average,
    LongBench) between State-Aware LoRA (projection LoRA + A-adaptation) and projection-only
    LoRA at matched or lower trainable parameter count on Mamba-130m and Mamba-370m.

