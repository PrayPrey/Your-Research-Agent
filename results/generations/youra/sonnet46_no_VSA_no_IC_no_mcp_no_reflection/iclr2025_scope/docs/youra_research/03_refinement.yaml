# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "State-Aware LoRA (condition D: projection LoRA + dt_proj LoRA + A_log bias) achieves higher GLUE average accuracy than projection-only LoRA (condition A) by ≥1 percentage point on Mamba-130m"
    test_method: "4-condition ablation on GLUE (SST-2, MNLI, QNLI, QQP) using lm-evaluation-harness; 3 seeds; compare condition D vs. condition A mean accuracy"
    success_criterion: "Mean GLUE accuracy of condition D > condition A by ≥1.0 pp (p<0.05, paired t-test across 3 seeds)"
    falsification: "If condition D GLUE accuracy ≤ condition A + 0.5pp (within noise), P1 is falsified and H₀ is supported"
  - id: "P2"
    primary: false
    statement: "The accuracy gain from state-aware conditions (C and D vs. A) is larger on longer-range tasks (LongBench 2WikiMultihopQA) than on short-range tasks (SST-2), consistent with the memory-horizon mechanism"
    test_method: "Compare delta accuracy (condition C - condition A) on SST-2 vs. LongBench 2WikiMultihopQA; test whether LongBench delta > SST-2 delta"
    success_criterion: "LongBench accuracy gain for condition C vs. A exceeds SST-2 accuracy gain by ≥1 pp"
    falsification: "If SST-2 shows equal or larger gain than LongBench under state-aware conditions, the memory-horizon mechanism is not task-length-sensitive"
  - id: "P3"
    primary: false
    statement: "Learned A_log bias magnitudes differ systematically across GLUE tasks: tasks requiring longer-range context (MNLI multi-sentence) show larger bias magnitude than local-context tasks (SST-2 single sentence)"
    test_method: "After fine-tuning on each GLUE task, compute mean |δ_A_log| per channel; compare across tasks"
    success_criterion: "Mean |δ| for MNLI > mean |δ| for SST-2 (directional, no significance threshold — diagnostic)"
    falsification: "If all tasks produce |δ| < 0.01 (near-zero), the A_log prior is already task-optimal and adaptation is unnecessary"

