novelty:
  preserved_novelty: "First PEFT method to explicitly adapt SSM state decay parameters (A_log/scalar A) as a distinct adaptation target separate from projection layers"
  key_innovation: "Memory-horizon adaptation — treating the SSM decay parameter as a task-specific prior over information persistence, analogous to but distinct from attention span adaptation in transformers"
  differentiation:
    - prior_work: "Standard LoRA on Mamba (projection-only)"
      difference: "SA-LoRA additionally adapts the recurrent state dynamics (A), which controls how long information persists — a fundamentally different operation from adapting what enters/exits state"
    - prior_work: "IA³ (multiplicative rescaling of activations)"
      difference: "SA-LoRA targets the state transition parameter (A_log) rather than activations; the decay parameter controls temporal dynamics across time steps, not single-step activation scaling"
    - prior_work: "AdaLoRA (adaptive rank allocation)"
      difference: "AdaLoRA optimizes rank budget across existing LoRA targets; SA-LoRA introduces a new target category (state parameters) that AdaLoRA cannot discover since A_log is not nn.Linear"

