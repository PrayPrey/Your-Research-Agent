# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "LoRA on projection layers (in_proj, out_proj, x_proj) adapts what information enters and exits the SSM recurrent state — modifying the input-to-state (B) and state-to-output (C) effective mappings without changing how state evolves over time"
      evidence: "LoRA [Hu et al., 2022]: rank decomposition of nn.Linear layers; Mamba [Gu & Dao, 2023]: in_proj generates B and x which feed into state update"
      falsifier: "If projection LoRA alone achieves within 0.5% of full fine-tuning on all tasks, Step 1 is sufficient and Steps 2-3 are unnecessary"
    - step: 2
      description: "A_log bias adaptation shifts the base state decay rate per channel (Mamba-1) or per head (Mamba-2), allowing the model to retain information for task-appropriate temporal horizons — longer retention for tasks requiring multi-step reasoning, shorter for local-context tasks"
      evidence: "Mamba [Gu & Dao, 2023]: A controls exponential decay of hidden state; initialized via HiPPO for general sequences; task-specific timescales differ. Mamba-2 [Dao & Gu, 2024]: scalar A per head provides clean per-head memory horizon"
      falsifier: "If learned A_log biases are near-zero (|δ| < 0.01) across all tasks after training, Step 2 contributes no adaptation and the mechanism fails"
    - step: 3
      description: "The combination of projection LoRA (Steps 1, channel adaptation) and A-bias (Step 2, temporal adaptation) is complementary and non-redundant: projection LoRA cannot compensate for mismatched memory horizons because it only changes what is stored/read, not how long information persists"
      evidence: "Mathematical argument: y_t = C_t·h_t; h_t = α·h_{t-1} + B_t·x_t. Adapting C (output) and B (input) leaves α (decay) unchanged. Only A-adaptation changes α."
      falsifier: "If conditions B (dt_proj LoRA) and C (A_log bias) show equal accuracy gains vs. A (baseline), then indirect decay adaptation via Δ is sufficient and direct A-adaptation is redundant"
  key_tension: "dt_proj LoRA (condition B) provides indirect decay adaptation via Δ modulation; A_log bias (condition C) provides direct decay adaptation. Whether these are sufficiently distinct in effect size is the key empirical uncertainty."
  evidence_summary: |
    The causal chain is mathematically grounded in the Mamba state update equation.
    All three steps are distinct operations on different components of the SSM computation.
    The chain predicts that gain from state-aware adaptation is larger on longer-range tasks,
    which is the key empirical signature distinguishing it from a generic fine-tuning improvement.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Pretrained Mamba A_log initialization (HiPPO-based) is suboptimal for specific downstream tasks, leaving room for task-specific decay rate adaptation"
    supporting_evidence: "HiPPO initialization optimizes for memorizing continuous functions — a general prior. Task-specific tasks (sentiment vs. multi-hop QA) have different temporal structure."
    consequence_if_violated: "If HiPPO initialization is already optimal for all tasks, A_log bias will train to zero and state-aware PEFT provides no benefit"
  - id: "A2"
    assumption: "GLUE and LongBench tasks are sufficiently diverse in required temporal depth to reveal memory-horizon effects"
    supporting_evidence: "SST-2 avg length ~20 tokens; MNLI ~100 tokens; 2WikiMultihopQA ~5000 tokens — three orders of magnitude difference in context length"
    consequence_if_violated: "If all tasks require similar temporal depths, memory-horizon adaptation provides uniform (and possibly negligible) benefit"
  - id: "A3"
    assumption: "Mamba-130m and 370m pretrained checkpoints are available and loadable via HuggingFace transformers"
    supporting_evidence: "state-spaces/mamba-130m-hf and state-spaces/mamba-370m-hf are listed on HuggingFace Hub"
    consequence_if_violated: "Experiment requires alternative checkpoint source or Mamba-2 variants"
  - id: "A4"
    assumption: "EleutherAI lm-evaluation-harness supports Mamba for both classification (GLUE) and generation (LongBench) evaluation"
    supporting_evidence: "lm-eval-harness has Mamba integration per Phase 1 research; GLUE classification is standard; LongBench generation needs verification"
    consequence_if_violated: "LongBench evaluation may require custom evaluation code; fallback to SCROLLS or just GLUE+MMLU"
  - id: "A5"
    assumption: "HuggingFace PEFT library's get_peft_model() can be extended to handle nn.Parameter targets (A_log, B, C) via a custom LoRA-like wrapper, or A_log bias can be added manually before calling get_peft_model()"
    supporting_evidence: "A_log bias is simpler than LoRA — just register a trainable nn.Parameter δ and add it to A_log in forward(); no custom PEFT extension needed"
    consequence_if_violated: "Custom training loop needed; adds engineering complexity but does not block the experiment"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Mamba-1 architecture (130m, 370m parameter scales)
    - Mamba-2 (SSD) architecture if pretrained checkpoints available
    - Standard NLP fine-tuning tasks: classification (GLUE), long-context QA (LongBench)
    - LoRA-family PEFT methods (rank-decomposition on projection layers)
    - Tasks with diverse sequence length requirements (short to long)
  does_not_apply_to: |
    - Transformer architectures (no A_log parameter; different inductive bias)
    - RWKV (different state parameterization — WKV operator; different adaptation needed)
    - RetNet (retention decay γ is a different parameter with different update rule)
    - Mamba variants with fundamentally different A parameterizations not covered by A_log bias
    - Tasks requiring generation length > Mamba's practical sequence limit
    - Full fine-tuning comparison at very large scale (>1.3B parameters — out of scope for Phase 4)
  known_limitations: |
    - Results at 130m/370m may not generalize to larger scales without additional experiments
    - A_log bias is a simpler adaptation than LoRA (bias only, not full rank decomposition);
      a full LoRA on A_log (if A were nn.Linear) would be stronger but inapplicable
    - LongBench evaluation validity for Mamba generation tasks unverified at Phase 2A stage
    - No RWKV or RetNet comparison in Phase 4 (would require separate implementation)

