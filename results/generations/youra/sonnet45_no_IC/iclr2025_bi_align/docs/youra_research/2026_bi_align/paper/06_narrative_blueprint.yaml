# ═══════════════════════════════════════════════════════════════════════════════
# PART 1: HOOK & MOTIVATION
# ═══════════════════════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: |
      Aligning language models to both general human preferences (AI-to-Human) and user-specific controls (Human-to-AI) simultaneously has remained an open challenge. Prior work treats these as sequential stages—first training on preferences via Direct Preference Optimization (DPO), then fine-tuning for attribute conditioning—risking catastrophic forgetting where the second objective degrades the first. We demonstrate that joint multi-task optimization can achieve bidirectional alignment in a single training run without catastrophic objective interference.
    strategy: "counterintuitive_finding"
    # AVOID: "Aligning LLMs is important..." (generic)
    # PREFER: Specific technical challenge + surprising solution

  why_reader_should_care:
    main_reason: "Enables a new class of LLM systems that simultaneously respect global human values AND respond to individual user preferences, avoiding the multi-stage training overhead and forgetting risk of sequential approaches."
    concrete_example: "A conversational AI that maintains high-quality, helpful responses (DPO-optimized) while allowing users to steer verbosity, creativity, and formality to their preferences (attribute-conditioned) without degrading either dimension."
    stakes: "If bidirectional alignment remains confined to sequential training, we face a tradeoff: either lock in global preferences (losing user control) or risk catastrophic forgetting when adding attribute conditioning. Joint training offers a potential resolution."

  real_world_impact:
    application_domain: "Personalized AI assistants, content generation systems, dialogue agents requiring both safety alignment and user customization"
    potential_beneficiaries: "AI practitioners needing both preference alignment and user control, researchers exploring multi-objective LLM training, users demanding personalized AI behavior"
    scale_of_impact: "Millions of LLM deployments globally that currently choose between fixed preferences or fragile sequential training"

# ─────────────────────────────────────────────────────────────────────────────
# PROBLEM FRAMING
# ─────────────────────────────────────────────────────────────────────────────

problem_framing:
  surface_problem:
    description: "LLM alignment typically optimizes a single objective (e.g., DPO for preferences) but fails to accommodate diverse user preferences for style, verbosity, or creativity."
    common_understanding: "The field treats preference alignment (DPO, RLHF) and controllable generation (SteerLM, attribute conditioning) as separate paradigms with separate training stages."

  deeper_problem:
    description: "Sequential training (DPO first, then attribute fine-tuning) suffers from catastrophic forgetting—the second objective can degrade the first, requiring careful hyperparameter tuning and risking instability."
    why_overlooked: "Prior work assumes multi-task interference is inevitable when combining implicit reward modeling (DPO) with explicit attribute conditioning, leading to the default sequential training approach."
    our_perspective: "We hypothesize that DPO and attribute objectives are mathematically compatible (gradient angles <120°), enabling joint optimization without catastrophic interference—a claim requiring gradient-level validation."

  gap_in_existing_work:
    description: "No prior work has demonstrated that joint DPO + attribute training can match sequential training performance while avoiding forgetting, nor quantified the gradient compatibility between these objectives."
    why_gap_exists: "Technical barrier: measuring gradient angles between DPO (implicit reward) and attribute (explicit conditioning) losses requires careful instrumentation. Conceptual barrier: multi-task learning literature hasn't addressed this specific combination."
    why_gap_matters: "Without understanding gradient compatibility, practitioners default to sequential training (slower, fragile) or avoid user-specific controls entirely (limiting personalization)."

# ═══════════════════════════════════════════════════════════════════════════════
# PART 2: THE INSIGHT
# ═══════════════════════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "DPO preference optimization and attribute conditioning are gradient-compatible objectives (mean angle 78.5°) that can be jointly trained without catastrophic interference, enabling bidirectional alignment in a single training run."
    expanded_explanation: |
      Our experiments reveal that the gradients from DPO's implicit reward modeling and attribute conditioning's explicit user control align at a mean angle of 78.5° (±12.8°), well below the 120° catastrophic interference threshold established in multi-task learning literature. This gradient compatibility means joint optimization can simultaneously satisfy both objectives without one degrading the other—a form of multi-objective Pareto improvement previously unexplored for this specific LLM alignment combination.

  why_others_missed_it:
    common_assumptions: "Multi-task LLM alignment requires sequential stages (DPO → attributes) due to assumed objective incompatibility; joint training would cause interference."
    our_different_view: "We hypothesized that DPO and attribute objectives share complementary structure (both optimize response quality, but along different dimensions), making them compatible rather than conflicting."
    enabling_factor: "Gradient monitoring instrumentation across 100 training steps, sampling 10 random batches to directly measure DPO ∇L_DPO and attribute ∇L_attr angles—a measurement not reported in prior DPO or SteerLM work."

  what_makes_it_work:
    intuitive_explanation: "DPO optimizes 'what makes a response preferred' (quality), while attribute conditioning optimizes 'how to match user-requested style' (controllability). These are orthogonal goals—like a car's speed (performance) and color (user preference)—so their gradients naturally align rather than conflict."
    key_mechanism: "Weighted loss formulation L_total = 0.7·L_DPO + 0.3·L_attr implicitly solves a Nash bargaining game between tasks. The α=0.7 weight balances preference retention (primary) with steering capability (secondary), producing gradient vectors that align at <90° (positive cosine similarity) and enable Pareto improvement."
    analogy: "Like tuning a radio: DPO finds the 'best station' (quality), attributes adjust the 'volume and bass' (user control). These are independent knobs, not conflicting dials."

