main_hypothesis:
  id: H-BD1-v1
  title: Bidirectional Alignment via Joint DPO + Attribute Training
  confidence: 0.8
  core_statement: "Joint optimization of DPO and attribute-conditioned generation\
    \ achieves bidirectional alignment with\n(1) AI-to-Human via preference win rate\
    \ \u226595% of DPO baseline,\n(2) Human-to-AI via attribute steering accuracy\
    \ \u226580%,\n(3) Emergent disentanglement (\u03C1 \u22640.3) outperforming sequential\
    \ training by \u22655% on both dimensions.\n"
  alternative_h0: "Joint training performs NO BETTER than sequential (DPO \u2192 Attr)\
    \ on at least ONE dimension,\nwith difference \u22645% on preference OR steering\
    \ OR disentanglement.\n"
