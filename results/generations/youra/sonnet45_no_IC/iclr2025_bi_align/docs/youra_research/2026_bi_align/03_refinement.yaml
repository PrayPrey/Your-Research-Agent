# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BD1-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under LLM alignment settings with diverse user preferences, if we train a model using joint optimization of Direct Preference Optimization (DPO) and attribute-conditioned generation (multi-task learning with L_total = 0.7·L_DPO + 0.3·L_attr), then it will achieve bidirectional alignment with (1) AI-to-Human dimension via preference win rate ≥95% of DPO baseline on held-out preference data, AND (2) Human-to-AI dimension via attribute steering accuracy ≥80% matching requested levels, AND (3) emergent disentanglement (attribute-preference correlation ρ ≤0.3) that outperforms sequential training by ≥5% on both dimensions, because joint training forces shared representations that separate intrinsic quality (DPO-optimized) from controllable attributes (user-steered) without catastrophic forgetting.
  alternative_hypothesis_h0: |
    Joint training of DPO + attribute conditioning performs NO BETTER than sequential training (train DPO first, then fine-tune attributes) on at least ONE bidirectional dimension, with joint vs sequential difference ≤5% on preference win rate OR steering accuracy OR disentanglement correlation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training Objective"
      type: "categorical"
      operationalization: "Type of loss function used during training"
      levels: ["Joint (DPO+Attr)", "Sequential (DPO→Attr)", "DPO-only", "Attr-only"]
    - name: "Loss Weight Alpha"
      type: "continuous"
      operationalization: "Weight parameter α in L_total = α·L_DPO + (1-α)·L_attr"
      range: [0.5, 0.9]
      primary_value: 0.7
    - name: "Dataset Source"
      type: "categorical"
      operationalization: "Source of training preference pairs"
      levels: ["HH-RLHF", "Alpaca-converted", "Dolly-converted"]
    - name: "Attribute Set"
      type: "categorical"
      operationalization: "Which attributes are conditioned during generation"
      levels: ["helpfulness+verbosity+creativity", "reduced set after orthogonality test"]
  dependent:
    - name: "Preference Win Rate"
      type: "continuous"
      operationalization: "% of responses preferred over DPO baseline on held-out test split (GPT-4 judge or human evaluation)"
      primary: true
      range: [0, 1]
      success_threshold: "≥0.95 × DPO_baseline"
    - name: "Attribute Steering Accuracy"
      type: "continuous"
      operationalization: "% of generated responses matching requested attribute levels within ±0.5 on 5-point scale"
      primary: true
      range: [0, 1]
      success_threshold: "≥0.80"
    - name: "Disentanglement Correlation (ρ)"
      type: "continuous"
      operationalization: "Pearson correlation between DPO implicit quality scores r_DPO(y|x) and attribute predictor scores A_pred(y)"
      primary: true
      range: [-1, 1]
      success_threshold: "≤0.3"
    - name: "IFEval Score"
      type: "continuous"
      operationalization: "Instruction-following accuracy on IFEval benchmark (verifiable format/content compliance)"
      primary: false
      range: [0, 1]
    - name: "Generalization Gap"
      type: "continuous"
      operationalization: "Performance drop when trained on Alpaca/Dolly vs HH-RLHF (measured via IFEval)"
      primary: false
      range: [0, 1]
      success_threshold: "≤0.10"
  controlled:
    - name: "Model Architecture"
      operationalization: "GPT-2 1.5B or Pythia 2.8B (matched to DPO paper scale)"
    - name: "Training Hyperparameters"
      operationalization: "Learning rate 1e-5, batch size 128 effective, β=0.1, AdamW optimizer (matched to baselines)"
    - name: "Evaluation Protocol"
      operationalization: "Same test splits, same GPT-4 judge prompts, same attribute predictor across all conditions"
    - name: "Reference Policy"
      operationalization: "πref initialized from SFT model, frozen during training"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Multi-task joint training forces model to learn shared representations satisfying both DPO (preference optimization) and attribute conditioning (user control) objectives simultaneously"
      evidence: "Multi-task learning theory (Caruana, 1997), discussed in Exchange 11 (Prof. Rex) and Exchange 12 (Dr. Ally): joint gradients guide search from initialization"
      falsifier: "If joint training shows divergent gradients preventing convergence, step fails"
    - step: 2
      description: "Shared representations disentangle intrinsic quality (what's universally good, captured by DPO) from controllable attributes (what's user-preference-specific, captured by attribute conditioning)"
      evidence: "Analogous to length-normalized DPO disentangling length from quality (Park et al., 2024). Discussed Exchange 12 (Dr. Ally): dual gradient pressure forces separation"
      falsifier: "If correlation ρ > 0.5 (high entanglement), disentanglement fails"
    - step: 3
      description: "Disentangled representations enable bidirectional alignment: model produces high-quality outputs (DPO dimension) that users can steer via attributes (SteerLM dimension) without degrading either objective"
      evidence: "Sequential training suffers catastrophic forgetting (M₁ → M₂ degrades DPO). Joint training finds M₃ optimizing both (Exchange 12 Dr. Ally). Testable via ≥5% joint > sequential comparison."
      falsifier: "If sequential ≥ joint on either dimension, emergent benefit claim fails"
  key_tension: "Whether attribute conditioning degrades DPO's preference optimization (objective compatibility concern raised Exchange 2 Prof. Pax, resolved Exchange 6 Dr. Ally via weighted sum)"
  evidence_summary: |
    Multi-task learning provides theoretical foundation (well-established). Length-normalized DPO shows precedent for disentanglement via explicit objectives. Prof. Pax (Exchange 15) confirmed mathematical validity. Key empirical test: joint must outperform sequential by ≥5% to prove emergent benefit (Prediction 5).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Datasets (HH-RLHF 161k pairs, OpenAssistant 88k with attributes) are accessible and sufficient quality for training"
    supporting_evidence: "Prof. Pax Exchange 15 verified HuggingFace links: Anthropic/hh-rlhf, OpenAssistant/oasst1. Phase 1 confirmed dataset availability."
    consequence_if_violated: "Cannot train or evaluate hypothesis, must fall back to Alpaca/Dolly conversion (Prediction 4 tests this)"
  - id: "A2"
    assumption: "DPO and attribute conditioning objectives are mathematically compatible (gradients don't fundamentally conflict)"
    supporting_evidence: "Prof. Pax Exchange 9: both are differentiable supervised losses, weighted sum is standard multi-task learning. Exchange 6 Dr. Ally: α=0.7 balances objectives."
    consequence_if_violated: "Training diverges or one objective degrades the other below 95%/80% thresholds (Predictions 1+2 test this)"
  - id: "A3"
    assumption: "Attributes capture dimensions partially orthogonal to general preferences (correlation ρ < 0.7 before training)"
    supporting_evidence: "Exchange 11 Prof. Rex raised orthogonality concern. Exchange 12 Dr. Ally proposed ρ < 0.7 test. If ρ > 0.9, exclude redundant attributes."
    consequence_if_violated: "Attributes provide no new control beyond what DPO already learned, steering is illusory (detected via pre-training correlation analysis)"
  - id: "A4"
    assumption: "Joint training creates emergent disentanglement superior to sequential training (not just ≈ sequential)"
    supporting_evidence: "Exchange 12 Dr. Ally theoretical argument: joint avoids catastrophic forgetting. Ruder 2017 survey shows joint often outperforms sequential in multi-task learning."
    consequence_if_violated: "If joint ≈ sequential, contribution shrinks to engineering efficiency (Dr. Sage Exchange 10 concern). Prediction 5 tests this: ≥5% improvement required."
  - id: "A5"
    assumption: "Evaluation metrics (IFEval, preference win rate, steering accuracy) validly measure bidirectional alignment without confounds"
    supporting_evidence: "IFEval uses verifiable criteria (no length bias like criticized in Park et al. 2024). Prof. Vera Exchange 14 specified precise metrics. Steering accuracy (±0.5) from Dong et al. 2023."
    consequence_if_violated: "Measurements don't reflect true alignment quality (e.g., length confounds, judge bias). Use multiple metrics to cross-validate."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Text generation alignment tasks: instruction-following, dialogue, summarization
    - Preference-based optimization settings with offline datasets (HH-RLHF, Alpaca, Dolly)
    - Attribute-conditioned user control on 3-5 interpretable dimensions (helpfulness, verbosity, creativity)
    - Model scales: GPT-2 1.5B to GPT-J 6B (computationally feasible for validation)
    - Single preference distribution per training run (not multi-stakeholder aggregation)
  does_not_apply_to: |
    - Multimodal alignment (vision+language, audio) - requires different architectures beyond text-only models tested here
    - Real-time online preference collection - uses fixed offline datasets (HH-RLHF, OpenAssistant)
    - Multi-stakeholder preference aggregation across conflicting values - single model serves average preferences (future work: social choice integration)
    - Constitutional AI constraint integration - hypothesis focuses on preferences + attributes only
    - Production deployment at >13B scale - feasibility tested at smaller scale (GPT-2/Pythia), scaling claims require additional validation
    - Contradictory preferences across different users - model learns single set of average preferences from training data
  known_limitations: |
    - Generalization limited to preference distributions similar to training data (standard ML assumption)
    - Attribute steerability constrained to dimensions captured in training annotations (3-5 attributes tested)
    - Joint training may require longer convergence than sequential (latency tradeoff, not a feasibility barrier)
    - Does not handle preference distribution shift or evolving user values dynamically (static training approach)
    - Attribute orthogonality (ρ < 0.7) required; highly redundant attributes must be excluded

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Joint DPO + attribute conditioning achieves preference win rate ≥95% of standalone DPO baseline on held-out HH-RLHF test split"
    test_method: "GPT-4 as judge comparing joint-trained vs DPO baseline responses on 1000 held-out prompts (following DPO paper methodology)"
    success_criterion: "Win rate ≥ 0.95 × (DPO baseline win rate)"
    falsification: "Win rate < 95% baseline → joint training degrades preference alignment (AI-to-Human dimension fails)"
  - id: "P2"
    primary: true
    statement: "Joint-trained model achieves attribute steering accuracy ≥80%, measured as % of generations matching requested attribute levels within ±0.5 on 1-5 scale"
    test_method: "Generate responses with 6 attribute combinations (e.g., helpfulness:5 verbosity:2), measure % within ±0.5 using attribute predictor trained on OpenAssistant"
    success_criterion: "≥80% of generations satisfy |actual_attr - requested_attr| ≤ 0.5 for each attribute"
    falsification: "< 80% accuracy → attribute conditioning ineffective (Human-to-AI dimension fails)"
  - id: "P3"
    primary: true
    statement: "Joint training produces disentanglement with Pearson correlation ρ ≤ 0.3 between DPO implicit quality scores and attribute predictor scores"
    test_method: "Compute correlation on 500 held-out test responses between r_DPO(y|x) = β log(πθ(y|x)/πref(y|x)) and A_pred(y) attribute scores"
    success_criterion: "ρ ≤ 0.3 (weak correlation indicates successful disentanglement of intrinsic vs controllable quality)"
    falsification: "ρ > 0.5 → high entanglement, attributes and preferences not truly independent (bidirectional claim fails)"
  - id: "P4"
    primary: false
    statement: "Method generalizes across dataset sources with IFEval score drop ≤10% when trained on Alpaca/Dolly vs HH-RLHF"
    test_method: "Train joint model on Alpaca-converted and Dolly-converted preference pairs (via LLM-as-judge), evaluate on IFEval benchmark, compare to HH-RLHF-trained model"
    success_criterion: "∆_IFEval ≤ 10% between HH-RLHF training and Alpaca/Dolly training"
    falsification: "> 10% drop → method is dataset-specific, not robust across preference distributions"
  - id: "P5"
    primary: true
    statement: "Joint training outperforms sequential baseline (DPO → attribute fine-tuning) by ≥5% on BOTH preference win rate AND attribute steering accuracy"
    test_method: "Direct comparison: train sequential baseline (DPO 10k steps → attributes 5k steps) vs joint (15k steps), measure both metrics on same test split"
    success_criterion: "Joint ≥ Sequential + 5% on preference win rate AND Joint ≥ Sequential + 5% on steering accuracy"
    falsification: "Joint ≤ Sequential + 5% on ANY metric → no emergent benefit from integration, contribution reduced to efficiency claim"

