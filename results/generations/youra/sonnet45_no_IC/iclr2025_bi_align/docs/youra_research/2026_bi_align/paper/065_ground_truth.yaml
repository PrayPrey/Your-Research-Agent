quantitative_claims:
  # PRIMARY FINDING (most robust, architecture-agnostic)
  gradient_compatibility:
    claim: "Mean gradient angle 78.5° ± 12.8° between DPO and attribute objectives"
    source: "045_validated_hypothesis.md Section 5.1 (h-e1 validation)"
    evidence_file: "h-e1/04_validation.md"
    verification_method: "GradientMonitor class sampling 10 random batches per 100-step training"
    threshold: "<120° for no catastrophic interference"
    status: "VERIFIED"
    confidence: "HIGH"
    robustness: "Architecture-agnostic, independent of training duration"

  # DUAL LOSS CONVERGENCE
  loss_decrease:
    dpo_loss:
      claim: "L_DPO decreased 5.8% over 100 steps (monotonic)"
      source: "045_validated_hypothesis.md Section 5.5"
      evidence_file: "h-e1/04_validation.md"
      status: "VERIFIED"

    attribute_loss:
      claim: "L_attr decreased 21.3% over 100 steps (monotonic)"
      source: "045_validated_hypothesis.md Section 5.5"
      evidence_file: "h-e1/04_validation.md"
      status: "VERIFIED"

  # BIDIRECTIONAL PERFORMANCE
  preference_win_rate:
    claim: "54.07% preference win rate (~94% of DPO baseline 57.5%)"
    source: "045_validated_hypothesis.md Section 5.1"
    evidence_file: "h-e1/04_validation.md"
    poc_threshold: "≥50% (better than random)"
    full_target: "≥54.6% (95% of 57.5% baseline)"
    gap: "0.5% short of full target"
    explanation: "PoC scale (100 vs 15k steps); loss curves show continued decrease"
    status: "PARTIALLY_VERIFIED (PoC threshold met, full target missed by 0.5%)"

  steering_accuracy:
    claim: "65.14% attribute steering accuracy"
    source: "045_validated_hypothesis.md Section 5.1"
    evidence_file: "h-e1/04_validation.md"
    poc_threshold: "≥60% (better than 20% random chance)"
    full_target: "≥80%"
    gap: "15% short of full target"
    explanation: "Loss weight α=0.3 may under-emphasize attributes; PoC scale limitation"
    status: "PARTIALLY_VERIFIED (PoC threshold met, full target missed by 15%)"

  # REPRESENTATION LEARNING
  preference_probing_accuracy:
    claim: "100% linear probing accuracy on preference classification"
    source: "045_validated_hypothesis.md Section 5.1 (h-m1 validation)"
    evidence_file: "h-m1/04_validation.md"
    threshold: "≥70%"
    status: "VERIFIED"
    note: "Exceeded threshold by 30 points, confirms preference encoding in joint model"

