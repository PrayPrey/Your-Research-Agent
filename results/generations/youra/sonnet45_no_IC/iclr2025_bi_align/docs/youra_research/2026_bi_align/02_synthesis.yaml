hypothesis_draft:
  title: "Bidirectional Alignment via Joint DPO + Attribute Training"
  hypothesis_id: "H-BD1-v1"
  core_claim: |
    Joint optimization of DPO and attribute-conditioned generation achieves bidirectional alignment:
    (1) AI-to-Human via preference win rate ≥95% of DPO baseline,
    (2) Human-to-AI via steering accuracy ≥80%,
    (3) Emergent disentanglement (ρ ≤0.3) outperforming sequential training by ≥5%.
  mechanism: |
    Multi-task learning (L_total = 0.7·L_DPO + 0.3·L_attr) forces shared representations
    separating intrinsic quality (DPO) from controllable attributes (user-steered).
    Joint training avoids catastrophic forgetting of sequential approach.
  predictions:
    - P1: "Preference win rate ≥95% DPO baseline"
    - P2: "Attribute steering accuracy ≥80%"
    - P3: "Disentanglement correlation ρ ≤0.3"
    - P4: "Generalization gap ≤10% across datasets"
    - P5: "Joint outperforms Sequential by ≥5% on both dimensions"

measurement_plan:
  primary_metrics:
    - metric: "Preference Win Rate"
      measurement: "GPT-4 judge on 1000 held-out prompts"
      threshold: "≥0.95 × DPO_baseline"
    - metric: "Attribute Steering Accuracy"
      measurement: "% within ±0.5 on 6 attribute combinations"
      threshold: "≥80%"
    - metric: "Disentanglement Correlation ρ"
      measurement: "Pearson correlation on 500 test responses"
      threshold: "≤0.3"
  secondary_metrics:
    - metric: "IFEval Score"
      measurement: "Instruction-following benchmark"
      threshold: "Comparable to DPO baseline"
    - metric: "Generalization Gap"
      measurement: "IFEval drop when trained on Alpaca/Dolly"
      threshold: "≤10%"

validation_strategy:
  baseline_validation:
    - name: "DPO Standalone"
      purpose: "Reproduce paper results, establish AI-to-Human baseline"
    - name: "SteerLM Standalone"
      purpose: "Establish Human-to-AI steering baseline"
    - name: "Sequential (DPO → Attr)"
      purpose: "Test emergent benefit of joint vs sequential"
  ablation_studies:
    - parameter: "Loss weight α"
      values: [0.5, 0.7, 0.9]
      purpose: "Validate robustness to objective balancing"
    - parameter: "Attribute orthogonality"
      test: "Pre-training correlation ρ analysis"
      purpose: "Exclude redundant attributes (ρ > 0.9)"
  risk_mitigation:
    - risk: "Dataset inaccessibility"
