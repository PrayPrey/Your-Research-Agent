qualitative_claims:
  - claim_id: "C1"
    statement: "Refined claim: Layers 1-2 validated, Layer 3 requires redesign"
    source: "045_validated_hypothesis.md Section 3.2"
    original_claim: "Three-layer framework achieves ≥70% recall and ≥80% precision"
    refined_claim: "Two-layer validated (syntactic + semantic extraction), Layer 3 (constraint inference) requires methodological redesign"
    paper_occurrences:
      - section: "abstract"
        required: true
        context: "Layers 1-2 are validated... Layer 3 constraint inference via semantic similarity matching failed"
      - section: "introduction"
        required: true
        context: "two-layer framework (syntactic validation + semantic extraction) is empirically validated... constraint inference via semantic similarity requires methodological redesign"
      - section: "conclusion"
        required: true
        context: "two layers validated, one requires methodological improvement"
    verification_rule: "Must NOT claim 'framework achieves 70%/80%' (original hypothesis). Must use refined claim."
    adversarial_check: "Flag if paper over-claims or uses original unverified hypothesis"

  - claim_id: "C2"
    statement: "Semantic similarity insufficient for contradiction detection"
    source: "045_validated_hypothesis.md Section 4.2 Finding 2"
    explanation: "Sentence embeddings optimize for topic similarity (paraphrase detection), not logical contradiction. Contradictory statements have HIGH similarity (same entities/concepts) with opposite polarity."
    paper_occurrences:
      - section: "abstract"
        required: true
        context: "sentence embeddings optimize for topic relatedness, not logical contradiction"
      - section: "introduction"
        required: true
        context: "sentence embeddings optimize for topic similarity (paraphrase detection), not logical contradiction"
      - section: "results"
        required: true
        context: "semantic similarity optimizes for topic similarity, NOT contradiction detection"
      - section: "discussion"
        required: true
        context: "cosine similarity on sentence embeddings optimizes for topic relatedness (paraphrase detection), not logical contradiction"
    verification_rule: "Must explain WHY (topic similarity vs logical contradiction), not just state failure"
    adversarial_check: "Flag if explanation missing or incorrect (e.g., 'low quality embeddings')"

  - claim_id: "C3"
    statement: "Research domain bias: 97.48% NL presence not universal MCP property"
    source: "045_validated_hypothesis.md Section 6.2 Limitation 2"
    scope_condition: "Results validated on research pipelines; production pipelines may have lower NL content"
    paper_occurrences:
      - section: "introduction"
        required: true
        context: "research pipelines are inherently NL-rich because queries are hypothesis-driven"
      - section: "discussion"
        required: true
        context: "Our results are validated on research pipelines where natural language content is prevalent. Production MCP use cases with structured data processing may exhibit lower NL content"
      - section: "conclusion"
        required: true
        context: "Our results are validated on research pipelines where natural language content is prevalent"
    verification_rule: "Must scope results to research pipelines, not claim universal MCP validation"
    adversarial_check: "Flag if generalization beyond research pipelines claimed without caveat"

  - claim_id: "C4"
    statement: "Zero-annotation feasibility: partial (Layers 1-2 yes, Layer 3 no)"
    source: "045_validated_hypothesis.md Section 1"
    nuance: "Zero-annotation semantic extraction validated for Layers 1-2 (82.7%/86.3%). Layer 3 constraint inference requires redesign, limiting full zero-annotation feasibility."
    paper_occurrences:
      - section: "abstract"
        required: true
        context: "zero-shot LLM prompting without manual annotation... This partial validation demonstrates zero-annotation semantic analysis is achievable"
      - section: "introduction"
        required: true
        context: "without requiring labeled training data or fine-tuning"
      - section: "conclusion"
        required: true
        context: "zero-annotation semantic extraction feasibility through Layers 1-2"
    verification_rule: "Must acknowledge 'partial' feasibility (Layers 1-2 only), not full framework"
    adversarial_check: "Flag if claims full zero-annotation validation without Layer 3 caveat"

# ═══════════════════════════════════════════════════════════════
# LIMITATIONS (must be acknowledged in Discussion)
# ═══════════════════════════════════════════════════════════════

required_limitations:
  - limitation_id: "L1"
    title: "Constraint inference method failure (0% recall)"
    source: "045_validated_hypothesis.md Section 6.1 Limitation 1"
    description: "Semantic similarity approach (cosine distance on sentence-transformer embeddings with threshold <0.3) failed to detect assumption-evidence contradictions, achieving 0% recall."
    why_acceptable: "This is a valuable negative result with scientific value. It establishes that a plausible-seeming approach (semantic similarity) is insufficient, narrowing the solution space for future work. The failure is clean (0% recall), not marginal."
    paper_section: "discussion"
    required_elements:
      - "Acknowledge 0% recall explicitly"
      - "Explain root cause (semantic similarity vs entailment)"
      - "Provide alternative path (entailment models or LLM-based detection)"
      - "Frame as valuable negative result, not framework flaw"
    adversarial_check: "Flag if euphemized, omitted, or framed as implementation gap vs methodological issue"

  - limitation_id: "L2"
    title: "Test data scope (research pipelines only)"
    source: "045_validated_hypothesis.md Section 6.1 Limitation 2"
    description: "All 20 MCP traces come from YouRA research pipelines (hypothesis generation, literature search, experiment design). NL presence rate (97.48%) may not generalize to non-research MCP use cases."
    why_acceptable: "The hypothesis explicitly scopes to 'research pipelines' (Phase 2A scope definition). If applying to production pipelines, h-m1 validation should be re-run on domain-specific traces."
    paper_section: "discussion"
    required_elements:
      - "State results validated on research pipelines"
      - "Acknowledge production pipelines may have lower NL content"
      - "Note: within-scope per original hypothesis"
    adversarial_check: "Flag if claims universal MCP validation without domain caveat"

  - limitation_id: "L3"
    title: "Small ground truth sample (N=1 known failure)"
    source: "045_validated_hypothesis.md Section 6.1 Limitation 3"
    description: "h-m3 validation used only 1 known failure case (h-m1 effective rank contradiction) as ground truth for constraint inference."
    why_acceptable: "The h-m3 validation report shows that even with threshold tuning (0.2-0.4), zero pairs out of 1,200 fell below the contradiction threshold. This suggests the issue is not ground truth sample size but fundamental method mismatch."
    paper_section: "discussion"
    required_elements:
      - "Acknowledge N=1 ground truth limitation"
      - "Justify with threshold tuning across 1,200 pairs"
      - "Explain systematic method mismatch vs insufficient data"
    adversarial_check: "Flag if omits N=1 or claims strong statistical evidence"

  - limitation_id: "L4"
    title: "No end-to-end validation (h-m4 blocked)"
    source: "045_validated_hypothesis.md Section 6.1 Limitation 4"
    description: "h-m4 (violation-failure correlation, DETERMINES_SUCCESS gate) was not executed because it depends on h-m3 (constraint inference) passing its SHOULD_WORK gate."
    why_acceptable: "The dependency was intentional (Phase 2B design). If Layer 3 fails, Layer 4 is moot. The pipeline correctly blocked forward progress rather than producing misleading results from broken intermediate layers."
    paper_section: "discussion"
    required_elements:
      - "Acknowledge full framework unverified (≥70% recall, ≥80% precision)"
      - "Explain dependency structure (h-m4 requires h-m3 outputs)"
      - "Note: can unblock after fixing Layer 3"
    adversarial_check: "Flag if claims end-to-end validation complete or implies full framework tested"

