  refiner_advocate:
    agent: "Dr. Ally"
    icon: "🛡️"
    assessment: |
      We propose a novel zero-training validation framework for MCP-based research pipelines
      that automatically detects failures by analyzing execution traces across three layers.
      Layer 1 performs syntactic structure validation (type checking, schema matching) catching
      30-50% of failures. Layer 2 applies semantic NLP to tool query parameters to extract
      implicit assumptions. Layer 3 applies semantic NLP to tool result content to extract
      empirical claims. Constraint violations are detected by comparing assumptions from early
      phases against evidence from later phases. The framework addresses both data quality
      failures (h-e1) and reasoning failures (h-m1) by treating MCP traces as rich semantic
      artifacts encoding reasoning, not just tool calls. Success demonstrated through ≥70%
      recall, ≥80% precision on 20 pipeline traces with zero manual annotation.
    key_points:
      - "Three-layer validation covers syntactic + semantic failure modes"
      - "Constraint inference from trace text (no manual specification)"
      - "Addresses both h-e1 (data quality) and h-m1 (reasoning) failure types"

  refiner_critic:
    agent: "Prof. Rex"
    icon: "🔍"
    assessment: |
      Remaining concerns: (1) NLP extraction reliability - LLMs may hallucinate or
      misinterpret assumptions/claims from query/result text, leading to false positives
      or false negatives in violation detection. (2) Assumption-claim matching requires
      semantic similarity detection, not exact string matching, which adds complexity and
      potential error sources. (3) MCP trace completeness dependency - framework assumes
      all relevant reasoning is captured in tool parameters/results, but some implicit
      assumptions may not be logged. Mitigation: Validate NLP extraction on held-out
      annotation set, use multi-vote consistency checking, design MCP wrappers that
      encourage explicit assumption logging, report extraction-layer metrics separately.
    key_points:
      - "NLP hallucination risk (mitigate with multi-vote consistency)"
      - "Semantic matching complexity (validate on held-out set)"
      - "Trace completeness dependency (improve logging wrappers)"

