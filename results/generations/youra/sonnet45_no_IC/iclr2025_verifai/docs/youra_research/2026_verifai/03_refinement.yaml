variables:
  independent:
    - name: "Validation Method"
      type: "categorical"
      operationalization: "Method applied to pipeline trace: (1) No validation (control), (2) Layer 1 only (syntactic), (3) Layer 1+2 (syntactic + query-NLP), (4) All three layers (full framework)"
      levels:
        - "Control (no validation)"
        - "Layer 1: Syntactic structure"
        - "Layer 1+2: + Semantic-query NLP"
        - "Layer 1+2+3: Full framework"
  dependent:
    - name: "Failure Detection Recall"
      type: "continuous"
      operationalization: "True Positives / Total Actual Failures, range [0, 1], unit: proportion"
      primary: true
    - name: "Failure Detection Precision"
      type: "continuous"
      operationalization: "True Positives / (True Positives + False Positives), range [0, 1], unit: proportion"
      primary: false
    - name: "F1 Score"
      type: "continuous"
      operationalization: "Harmonic mean of precision and recall, range [0, 1]"
      primary: false
  controlled:
    - name: "Pipeline Trace Source"
      operationalization: "Use same 20 pipeline executions (10 successful, 10 failed) across all validation methods"
    - name: "MCP Trace Logging Granularity"
      operationalization: "All traces include tool name, parameters (including text queries), results (including text content)"
    - name: "NLP Model for Layers 2/3"
      operationalization: "Use same LLM API (e.g., GPT-4 or Claude) with identical prompts across all semantic analysis runs"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "MCP tool call traces capture both explicit structure (tool names, parameter types, result schemas) and implicit reasoning (natural language in query parameters and result content)"
      evidence: "Exchange 12 - Dr. Ally identified that query strings like 'pruning effective rank reduction' encode assumptions, and result text contains empirical claims"
      falsifier: "If MCP traces only contain function names and JSON types without any natural language content, Layer 2/3 would fail"
    - step: 2
      description: "Layer 1 syntactic validation detects explicit type/schema mismatches (30-50% of failures), while Layers 2/3 semantic NLP extract implicit assumptions (query text) and claims (result text) to detect the remaining 50-70%"
      evidence: "Exchange 14 - Prof. Pax confirmed Layer 1 is standard tech (high confidence), Layers 2/3 require LLM-based NLP (medium-high confidence)"
      falsifier: "If semantic failures are NOT encoded in text content (e.g., failures arise from runtime conditions invisible in traces), Layers 2/3 would add no value"
    - step: 3
      description: "Constraint inference compares assumptions extracted from early-phase queries against evidence extracted from later-phase results to detect assumption-evidence mismatches (e.g., Phase 3 assumes 'effective rank decreases', Phase 4 measures 'effective rank increased')"
      evidence: "Exchange 12 - Dr. Ally demonstrated h-m1 failure would be detectable via assumption-evidence mismatch between Phase 3 query and Phase 4 result"
      falsifier: "If assumptions and evidence use completely different terminologies/ontologies with no semantic overlap, NLP-based matching would fail"
    - step: 4
      description: "Detected constraint violations correlate with actual pipeline failures at ≥70% recall (catches most failures) and ≥80% precision (low false alarm rate) because the three-layer approach covers both syntactic (Layer 1) and semantic (Layers 2/3) failure modes"
      evidence: "Exchange 13 - Prof. Vera set testable thresholds based on Neutatz et al.'s constraint enforcement framework achieving similar precision in multi-constraint optimization"
      falsifier: "If constraint violations are too noisy (low precision) or too rare (low recall), the framework would not meet ≥70%/≥80% thresholds"
  key_tension: "NLP extraction reliability (Layers 2/3) - LLMs may hallucinate or misinterpret assumptions/claims from text, introducing false positives/negatives"
  evidence_summary: |
    Step 1: Verified by Prof. Pax (Exchange 14) - MCP traces DO contain text (established).
    Step 2: Scoped by Prof. Pax (Exchange 9) - Layer 1 catches 30-50%, Layers 2/3 target remaining.
    Step 3: Demonstrated by Dr. Ally (Exchange 12) - h-m1 failure is detectable via this mechanism.
    Step 4: Threshold set by Prof. Vera (Exchange 13) - 70%/80% based on related constraint work.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "MCP trace completeness - All relevant reasoning is captured in tool parameters (query text) and results (returned content), not in external logs or implicit execution state"
    supporting_evidence: "Exchange 14 - Prof. Pax noted 'We control trace logging granularity (can ensure text is captured)' - assumption is controllable"
    consequence_if_violated: "If critical assumptions are never logged in trace text, Layers 2/3 cannot extract them, reducing recall below 70% threshold"
  - id: "A2"
    assumption: "NLP extraction accuracy - LLM-based assumption/claim extraction from text achieves sufficient precision (low hallucination) and recall (catches key phrases) to enable meaningful constraint inference"
    supporting_evidence: "Exchange 14 - Prof. Pax assessed Layer 2/3 as 'medium-high confidence' based on pre-trained LLM capabilities, with prompt engineering as mitigation strategy"
    consequence_if_violated: "If LLM hallucination rate is high or key assumptions are missed, precision/recall would drop below 80%/70% thresholds"
  - id: "A3"
    assumption: "Semantic similarity matching - Assumptions from early phases and claims from later phases share enough terminological/ontological overlap that NLP-based matching can detect contradictions"
    supporting_evidence: "Exchange 12 - Dr. Ally demonstrated h-m1 case where 'effective rank reduction' (assumption) vs 'effective rank increased' (claim) have clear semantic mismatch"
    consequence_if_violated: "If phase vocabulary is completely disjoint (e.g., Phase 3 uses mathematical notation, Phase 4 uses natural language), matching would fail"
  - id: "A4"
    assumption: "Constraint violation predictiveness - Detected assumption-evidence mismatches correlate with actual pipeline failures (not just documentation inconsistencies that don't affect execution)"
    supporting_evidence: "Exchange 13 - Prof. Vera designed experiment with ground truth pipeline outcomes (10 success, 10 fail) to validate this empirically"
    consequence_if_violated: "If many constraint violations are benign (false positives), precision would drop below 80%"
  - id: "A5"
    assumption: "Three-layer coverage - The combination of syntactic (Layer 1) + semantic-query (Layer 2) + semantic-result (Layer 3) analysis covers the majority of research pipeline failure modes"
    supporting_evidence: "Exchange 12 - Dr. Ally argued this addresses both Prof. Vera's syntactic gap (Layer 1) AND Prof. Rex's semantic gap (Layers 2/3)"
    consequence_if_violated: "If significant failure modes arise from runtime conditions not visible in any trace layer, recall would drop below 70%"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Research pipelines using Model Context Protocol (MCP) for tool-calling architecture
    - Multi-phase workflows where phases communicate via MCP tool calls (e.g., Phase 1→2→3)
    - Pipelines with natural language content in tool parameters (queries) and results (documents, reports)
    - Validation scenarios requiring automated failure detection without manual test writing
    - Post-execution trace analysis (not real-time monitoring)
  does_not_apply_to: |
    - Pipelines NOT using MCP (no trace data to analyze)
    - Single-phase workflows (no phase boundaries to validate)
    - Pipelines with purely structured data (no natural language for NLP analysis)
    - Real-time validation requirements (framework analyzes complete traces post-execution)
    - Failure modes invisible in execution traces (e.g., hardware faults, network outages)
  known_limitations: |
    - Requires MCP trace logging to include query text and result content (not just types)
    - NLP extraction reliability depends on LLM quality (may require prompt engineering)
    - Assumption-claim matching limited by terminological overlap between phases
    - Framework detects failures AFTER execution (not predictive before completion)
    - Precision/recall targets (70%/80%) are estimates - may vary by pipeline domain

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Three-layer MCP trace analysis achieves ≥70% recall (detects ≥70% of actual pipeline failures) when applied to 20 research pipeline executions (10 successful, 10 failed)"
    test_method: "Collect MCP traces from 20 pipelines with known outcomes. Run three-layer constraint inference. Compare detected violations against ground truth failures. Compute recall = TP / (TP + FN)."
    success_criterion: "Recall ≥ 0.70 with statistical significance (Fisher's exact test, p < 0.05)"
    falsification: "If recall < 0.70 OR p ≥ 0.05, hypothesis is rejected (framework fails to catch enough failures)"
  - id: "P2"
    primary: false
    statement: "Three-layer analysis achieves ≥80% precision (≥80% of detected violations correspond to actual failures) with low false alarm rate"
    test_method: "From same 20 pipeline dataset, compute precision = TP / (TP + FP). False positive occurs when violation detected but pipeline succeeded."
    success_criterion: "Precision ≥ 0.80 with statistical significance (p < 0.05)"
    falsification: "If precision < 0.80 OR p ≥ 0.05, framework produces too many false alarms to be practical"
  - id: "P3"
    primary: false
    statement: "The framework detects both data quality failures (h-e1: synthetic vs real data) AND reasoning failures (h-m1: mechanistic assumption contradicted by experiment) from the failure history"
    test_method: "Apply framework to h-e1 and h-m1 MCP traces. For h-e1: check if Layer 2/3 detect assumption 'real benchmark data' vs evidence 'synthetic data generated'. For h-m1: check if Layer 2/3 detect assumption 'effective rank decreases' vs evidence 'effective rank increased 6.02%'."
    success_criterion: "Both h-e1 and h-m1 failures detected (constraint violations found in traces) - qualitative validation"
    falsification: "If framework fails to detect EITHER h-e1 OR h-m1, it does not address the failure modes it claims to solve"

