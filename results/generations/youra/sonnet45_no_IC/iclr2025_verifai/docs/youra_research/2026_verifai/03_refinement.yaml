experimental_setup:
  dataset:
    name: "YouRA Research Pipeline Execution Traces"
    type: "custom"
    source: "Real MCP trace logs from YouRA research pipeline (this pipeline) executions"
    path: "{research_folder}/mcp_traces/*.jsonl"
    hypothesis_fit: |
      Uses actual research pipeline traces including two known failures (h-e1, h-m1) from
      the failure history. Provides ground truth outcomes (success/fail) and real MCP tool
      calls with natural language queries and results. Satisfies feasibility constraint
      (existing real data, no synthetic generation, no human annotation needed).
      Dataset size: 20 executions (10 success, 10 fail) provides statistical power for
      Fisher's exact test while remaining manually traceable for validation.
  model:
    name: "Pre-trained LLM for NLP Analysis"
    type: "Commercial API (GPT-4 or Claude Sonnet)"
    source: "OpenAI API / Anthropic API"
    hypothesis_fit: |
      Layers 2/3 require semantic NLP to extract assumptions (from query text) and claims
      (from result text). Pre-trained LLMs are established for this task (no custom training
      required, satisfying zero-training constraint from Ahn et al. approach). Model choice
      is controlled variable - same LLM + prompts across all analysis runs.
  baselines:
    - name: "No Validation (Control)"
      method: "Random prediction baseline - 50% precision/recall expected for 10/10 success/fail split"
    - name: "Layer 1 Only (Syntactic)"
      method: "JSON Schema validation + type checking (established technology baseline)"
    - name: "Manual Test Suite"
      method: "Traditional approach - human-written tests for comparison (if available from h-e1/h-m1 artifacts)"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: |
    First validation framework specifically designed for MCP-based research pipelines.
    Three-layer semantic trace analysis (syntactic + query-NLP + result-NLP) is a novel
    combination not present in prior work. Treats MCP traces as rich semantic artifacts
    encoding reasoning (not just tool calls), enabling validation-as-inference rather than
    validation-as-specification.
  key_innovation: |
    Using natural language content in MCP tool parameters (query text) and results (returned
    text) to extract implicit assumptions and evidence, then comparing them across phases to
    detect semantic constraint violations. This goes beyond schema-based validation (Layer 1)
    to address reasoning failures that pass type checks but fail empirically.
  differentiation:
    - prior_work: "Ahn et al. 2025 - MCP framework for medical concept standardization"
      difference: "Ahn validates medical concepts (structured domain), we validate research pipelines (messier boundaries). Ahn uses MCP for tool composition, we use MCP TRACES as validation artifacts."
    - prior_work: "Fu et al. 2025 - Agent-driven benchmark construction (PRDBench)"
      difference: "Fu reduces annotation cost via agent-driven generation, we achieve zero annotation via trace analysis. Fu builds benchmarks, we validate pipelines."
    - prior_work: "Neutatz et al. 2021 - Declarative constraint enforcement for ML"
      difference: "Neutatz uses declarative feature selection for constraint satisfaction, we infer constraints from execution traces (no manual declaration needed)."
    - prior_work: "Traditional pipeline validation (MLflow, DVC, Great Expectations)"
      difference: "Traditional approaches require manual test writing, we infer validation criteria from MCP traces automatically. They are MCP-agnostic, we are MCP-native."

