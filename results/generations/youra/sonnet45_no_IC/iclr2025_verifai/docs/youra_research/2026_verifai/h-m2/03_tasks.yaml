# Data Preparation Tasks (Priority 1)
data_preparation:
  - id: D-1
    title: "Validate h-m1 MCP Trace Dataset"
    description: "Verify that h-m1 MCP traces (596 tool calls, 20 pipelines) are accessible and meet NL content threshold (≥10 words)"
    type: data_prep
    priority: 1
    complexity: 4
    estimated_effort: "30 minutes"
    reference_files:
      - "03_prd.md#Data Requirements → Primary Dataset"
      - "03_architecture.md#External Dependencies → h-m1 traces"
    dependencies: []
    acceptance_criteria:
      - "Trace folder exists: {research_folder}/mcp_traces/"
      - "596 tool calls confirmed via TraceParser.load_all_traces()"
      - "≥90% of calls have ≥10 NL words (h-m1 validated threshold)"
    implementation_notes: |
      # Reuse h-m1 TraceParser and NLContentValidator
      from src.trace_parser import TraceParser
      from src.nl_content_validator import NLContentValidator

      parser = TraceParser(Path("docs/youra_research/mcp_traces"))
      validator = NLContentValidator(min_word_count=10)
      traces = parser.load_all_traces()

      # Verify count and NL threshold
      assert len([call for trace in traces for call in trace["tool_calls"]]) == 596

