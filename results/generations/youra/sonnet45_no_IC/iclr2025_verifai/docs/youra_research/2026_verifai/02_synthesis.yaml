hypothesis_draft:
  title: "Zero-Training Pipeline Validation via Multi-Layer MCP Trace Analysis"
  hypothesis_id: "H-MCPTraceValidation-v1"
  core_claim: |
    A three-layer MCP trace analysis framework (syntactic structure + semantic query-NLP +
    semantic result-NLP) detects ≥70% of research pipeline failures with ≥80% precision,
    requiring zero manual annotation, by treating MCP traces as semantic artifacts encoding
    both explicit structure and implicit reasoning.
  mechanism: |
    MCP tool calls capture assumptions in query parameters ("pruning effective rank reduction")
    and evidence in result content ("effective rank increased 6.02%"). Three-layer analysis
    extracts both via: (1) Schema validation for types (30-50% coverage), (2) Query-NLP for
    assumptions, (3) Result-NLP for claims. Constraint violations detected by comparing
    early-phase assumptions against later-phase evidence (e.g., Phase 3 assumes X, Phase 4
    disproves X).
  predictions:
    - P1: "Recall ≥ 70% on 20 pipeline traces (10 success, 10 fail)"
    - P2: "Precision ≥ 80% with statistical significance (p < 0.05)"
    - P3: "Detects both h-e1 (data quality) and h-m1 (reasoning) failures from history"

variables_summary:
  independent: "Validation Method (categorical: No validation, Layer 1 only, Layer 1+2, Full framework)"
  dependent_primary: "Failure Detection Recall (proportion, range [0,1])"
  controlled: "Pipeline trace source (same 20 executions), NLP model (same LLM API), trace logging granularity"

null_hypothesis:
  h0_statement: |
    MCP three-layer trace analysis has no predictive power for pipeline failures
    (precision/recall ≤ 50%, p ≥ 0.05).
  statistical_test: "Fisher's exact test"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Using natural language in MCP tool parameters/results to extract implicit assumptions and evidence, enabling semantic validation beyond type checking"
  differentiation_summary: |
    First MCP-native research pipeline validator. Combines Ahn et al.'s zero-training
    approach + Fu et al.'s agent-driven quality + Neutatz et al.'s constraint enforcement
    in novel three-layer architecture. Treats traces as rich semantic artifacts (not just
    function calls), enabling validation-as-inference rather than manual test specification.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "Pre-trained LLM (GPT-4 or Claude Sonnet) for Layers 2/3 NLP analysis"
  datasets:
    - "YouRA Pipeline MCP Traces: 20 executions (10 success, 10 fail including h-e1, h-m1)"
  baselines:
    - "No validation (random prediction)"
    - "Layer 1 only (JSON Schema)"
    - "Manual test suites (if available)"

measurement_plan:
  data_collection:
    - source: "MCP trace logs from YouRA research pipeline executions (JSONL format)"
    - source: "Ground truth pipeline outcomes (success/fail labels)"
    - source: "h-e1 and h-m1 failure trace archives"
  procedure:
    - step: "Load 20 MCP trace files with tool calls, parameters, results"
    - step: "Run Layer 1 analysis: JSON Schema validation, type checking → violations_L1"
    - step: "Run Layer 2 analysis: LLM-based NLP on query parameters → extract assumptions"
    - step: "Run Layer 3 analysis: LLM-based NLP on result content → extract claims"
    - step: "Constraint inference: Compare assumptions (early phases) vs claims (later phases) → violations_L2_L3"
    - step: "Combine: violations_total = violations_L1 ∪ violations_L2_L3"
    - step: "Validate against ground truth: Compute TP, FP, FN, TN"
    - step: "Calculate metrics: Recall = TP/(TP+FN), Precision = TP/(TP+FP), F1 = 2PR/(P+R)"
    - step: "Statistical test: Fisher's exact test for significance (p < 0.05)"
  success_criteria:
    - "Recall ≥ 0.70 (catches at least 7 out of 10 failures)"
    - "Precision ≥ 0.80 (at most 2 false alarms per 10 detections)"
    - "p < 0.05 (statistically significant, not random)"
    - "h-e1 detected (synthetic data assumption violated)"
    - "h-m1 detected (mechanistic assumption contradicted)"

validation:
  internal_validity:
    - "Use same 20 traces across all validation methods (controlled comparison)"
    - "Same LLM model + prompts for all Layers 2/3 runs (eliminate model variance)"
    - "Ground truth outcomes verified (10 success, 10 fail from actual pipeline history)"
    - "Blind analysis (constraint inference runs without knowledge of ground truth labels)"
  external_validity:
    - "Use real research pipeline traces (not toy examples or synthetic data)"
    - "Include diverse failure modes (h-e1 data quality, h-m1 reasoning error)"
    - "MCP traces from actual YouRA workflow (generalizes to MCP-based pipelines)"
    - "Framework designed for post-execution analysis (scope limited to trace-based validation)"

