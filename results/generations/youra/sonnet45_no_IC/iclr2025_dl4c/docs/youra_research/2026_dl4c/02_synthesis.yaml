hypothesis_draft:
  title: "Tri-Modal Alignment for Code Generation via Dynamic Feedback Integration"
  hypothesis_id: "H-TriModal-v1"
  core_claim: |
    Tri-modal RL framework with dynamic weight scheduling across execution, human, and AI feedback
    achieves ≥3% harmonic mean improvement (pass@1 × quality) over best single-feedback baseline.
  mechanism: |
    Three-phase sequential capability building:
    - Phase 1 (0-30%): Execution-heavy → establishes correctness foundation
    - Phase 2 (30-70%): AI feedback-heavy → enables scalable quality refinement
    - Phase 3 (70-100%): Human feedback-heavy → fine-tunes edge cases, corrects AI biases
  predictions:
    - P1: "≥3% harmonic mean improvement with p<0.05"
    - P2: "Weight pattern shows systematic phase progression (execution early, AI mid, human late)"
    - P3: "Conflict cases resolve to intermediate scores (0.1-0.4), not extreme collapse"

variables_summary:
  independent: "Feedback integration strategy (5 levels: execution-only, human-only, AI-only, tri-modal-static, tri-modal-dynamic)"
  dependent_primary: "Harmonic mean of pass@1 correctness and human preference quality"
  controlled: "Model architecture (1.5B params), dataset (HumanEval+MBPP), RL algorithm (PPO), evaluation protocol (N=200 held-out, independent annotators)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in harmonic mean performance between tri-modal dynamic model
    and best single-feedback baseline (execution-only OR human-only OR AI-only).
  statistical_test: "Independent samples t-test, two-tailed"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Online integration of heterogeneous feedback signals during RL with dynamic weight scheduling"
  differentiation_summary: |
    PPOCoder: Single-feedback (execution) → We add human+AI with dynamic integration
    Curriculum-RLAIF: Single-feedback (AI) with task curriculum → We add execution+human with feedback curriculum
    Themis: Multi-criteria offline → We do multi-modal online with dynamic weights
    Process-Supervised RL: Process-level execution → We add human+AI for quality beyond correctness

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["1.5B parameter code LLM (Codex-style transformer decoder)"]
  datasets: ["HumanEval (164 problems)", "MBPP (500 problems)"]
  baselines: ["execution-only PPO", "human-only PPO", "AI-only PPO", "tri-modal static weights"]

measurement_plan:
  data_collection:
    - source: "Automated test execution (execution feedback) - coverage.py or similar sandbox"
    - source: "Human quality annotation (human feedback) - 500 validation samples, pairwise preferences, 3 annotators per pair"
    - source: "AI reward model inference (AI feedback) - trained on execution+human data, used online during RL"
  procedure:
    - step: "Stage 1: Collect execution feedback on training set (automated, 664 problems × 70% = ~460 training samples)"
    - step: "Stage 2: Collect human feedback on validation set (500 samples, pairwise comparisons, Bradley-Terry model)"
    - step: "Stage 3: Train AI reward model on combined execution+human data (offline training, then used online)"
    - step: "Stage 4: RL training with tri-modal feedback (PPO algorithm, dynamic weight schedule)"
    - step: "Stage 5: Evaluation on held-out test set (N=200, independent human annotators for quality scores)"
  success_criteria:
    - "Primary: Harmonic mean improvement ≥3% with p<0.05 vs best baseline"
    - "Secondary: Weight pattern shows phase structure (execution early, AI mid, human late)"
    - "Tertiary: Conflict cases show intermediate behavior (0.1-0.4 preference range)"

validation:
  internal_validity:
    - "Staged feedback collection prevents measurement interference (execution → human → AI → RL training)"
    - "Held-out test set (200 samples) prevents overfitting to validation data"
    - "Independent human annotators for final evaluation (different from training annotators)"
    - "Controlled model architecture, dataset, RL algorithm across all conditions"
  external_validity:
    - "Benchmark datasets (HumanEval, MBPP) are standard in code generation research"
    - "Competitive programming tasks generalize to algorithm implementation (limited to single-file solutions)"
    - "Does NOT generalize to production software engineering (multi-file projects, API integration)"
    - "Human feedback collection protocol (pairwise preferences) is standard in RLHF literature"

discussion_synthesis:
  key_insights:
    - "Current research silos feedback types (execution OR human OR AI) - integration enables multi-objective optimization"
    - "Dynamic scheduling addresses sequential capability building (correctness foundation → quality refinement → edge case precision)"
    - "Feasibility confirmed: ~5000 GPU-hours, all components have existing implementations, no fundamental technical barriers"
    - "Novelty defensible: Differentiated from all prior work (PPOCoder, Themis, Curriculum-RLAIF, Process-RL)"
  breakthrough_moments:
    - "Exchange 5 (Dr. Ally): Staged feedback collection + percentile transformation solves measurement interference and scaling problems"
    - "Exchange 8 (Prof. Vera): Three-stage experimental design (baselines → static → dynamic) provides publishable results even if full hypothesis partially fails"
    - "Exchange 11 (Dr. Ally): Convergence on core hypothesis with refined mechanism (3-phase weight schedule with specific roles)"
  resolved_tensions:
    - "Multi-objective vs weighted aggregation: Weighted aggregation IS the deployment decision for Pareto frontiers (not avoiding multi-objective)"
    - "Dynamic vs static weights: Staged validation (static first, dynamic second) mitigates risk and isolates contribution"
    - "Feasibility concerns: Measurement interference, reward scaling, training stability all addressed with existing techniques"
