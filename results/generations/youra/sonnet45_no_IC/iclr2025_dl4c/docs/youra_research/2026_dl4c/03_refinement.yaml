    - name: "Evaluation Protocol"
      operationalization: "Held-out 200 test samples, independent human annotators (blind to condition)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Phase 1 (0-30% training): Execution-heavy weighting establishes basic correctness foundation"
      evidence: "PPOCoder [Shojaee et al., 2023] shows execution feedback enables functional code generation. Must achieve correctness before optimizing quality (can't refine non-functional code)."
      falsifier: "If execution weight is NOT highest in Phase 1, or if correctness metrics do NOT improve fastest in early training, mechanism fails."
    - step: 2
      description: "Phase 2 (30-70% training): AI feedback weighting enables scalable quality refinement"
      evidence: "Themis [Paul et al., 2026] demonstrates multi-criteria reward models can capture quality signals. AI feedback scales human preferences without per-sample annotation cost."
      falsifier: "If AI feedback weight does NOT peak in Phase 2, or if quality metrics do NOT improve during mid-training, mechanism fails."
    - step: 3
      description: "Phase 3 (70-100% training): Human feedback weighting fine-tunes edge cases and corrects AI biases"
      evidence: "RLHF paradigm shows human feedback addresses model misalignment. Late-stage human feedback prevents AI reward model from propagating systematic biases to final model."
      falsifier: "If human feedback weight does NOT increase in Phase 3, or if edge case performance does NOT improve in late training, mechanism fails."
  key_tension: "Trade-off between feedback scalability (execution/AI) and quality precision (human). Dynamic scheduling attempts to optimize across training stages rather than forcing static compromise."
  evidence_summary: |
    Mechanism builds on established single-feedback results (PPOCoder for execution, Themis for multi-criteria,
    RLHF for human alignment) but extends to dynamic multi-modal integration. Each phase addresses specific
    training objective: correctness foundation → scalable quality → edge case precision.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Execution feedback, human feedback, and AI feedback capture orthogonal quality dimensions"
    supporting_evidence: "Execution tests correctness (objective), human rates quality (subjective), AI approximates human preferences (learned). Different measurement modalities suggest orthogonality."
    consequence_if_violated: "If feedback types are highly correlated (redundant information), tri-modal integration provides no benefit over single-feedback (Occam's razor favors simpler model)."
  - id: "A2"
    assumption: "Sequential capability building holds (correctness prerequisite for quality optimization)"
    supporting_evidence: "Intuitive reasoning: Can't optimize code quality if code doesn't execute. Needs empirical validation."
    consequence_if_violated: "If quality can be optimized independently of correctness, dynamic scheduling is unnecessary (static weights or parallel optimization suffice)."
  - id: "A3"
    assumption: "Weight schedule parameterization (9 parameters) is expressive enough to capture optimal trajectories"
    supporting_evidence: "Curriculum learning schedules use similar parameterizations (task difficulty over time) - empirically successful."
    consequence_if_violated: "If optimal schedule requires more complex patterns (e.g., oscillations, non-monotonic), constrained parameterization may limit performance."
  - id: "A4"
    assumption: "Human feedback annotation quality is sufficient (inter-annotator agreement ≥ 0.6 Krippendorff's α)"
    supporting_evidence: "Code review studies show moderate agreement on quality ratings. Using pairwise preferences (easier than absolute scoring) + majority vote mitigates inconsistency."
    consequence_if_violated: "If human feedback is too noisy (α < 0.5), AI feedback trained on this data propagates noise, degrading tri-modal performance."
  - id: "A5"
    assumption: "Reward signal distributions can be normalized compatibly (percentile rank transformation)"
    supporting_evidence: "Process-supervised RL [Ye et al., 2025] uses percentile normalization successfully. Statistical transformation handles distributional differences."
    consequence_if_violated: "If percentile transformation loses critical information (e.g., long-tail rare events), aggregated reward may miss important signals."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Code generation tasks with automated test cases (execution feedback available)
    - Domains where human quality preferences are measurable (code review, style guides)
    - Training regimes with sufficient data for AI reward model (≥500 human-annotated samples)
    - RL-based training frameworks (PPO or similar policy gradient methods)
    - Benchmark datasets: HumanEval, MBPP (competitive programming style tasks)
  does_not_apply_to: |
    - Tasks without automated evaluation (creative writing, open-ended generation)
    - Domains where human preferences are undefined or inconsistent (exploratory code, research prototypes)
    - Small-data regimes (< 500 samples insufficient for reward model training)
    - Non-RL training methods (supervised fine-tuning, in-context learning)
    - Real-world software engineering tasks (multi-file projects, API integration) - hypothesis targets competitive programming benchmarks
  known_limitations: |
    - Hypothesis tests competitive programming tasks (single-file solutions), not production codebases
    - Human feedback cost (~$5-10K for 500 annotations) limits large-scale deployment
    - Dynamic weight schedule requires hyperparameter search (9 parameters vs 3 for static weights)
    - Assumes feedback types are orthogonal (A1) - needs empirical validation

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Tri-modal dynamic model achieves ≥3% absolute improvement in harmonic mean (pass@1 × human preference) vs. best single-feedback baseline"
    test_method: "Independent samples t-test on N=200 held-out test samples, α=0.05, two-tailed"
    success_criterion: "p < 0.05 AND effect size ≥ 3% absolute improvement (e.g., 0.70 → 0.73)"
    falsification: "If p ≥ 0.05 OR improvement < 3%, hypothesis fails (tri-modal does not outperform single-feedback)"
  - id: "P2"
    primary: false
    statement: "Weight coefficients show systematic phase-based pattern: execution weight highest in 0-30% training, AI weight peaks 30-70%, human weight increases 70-100%"
    test_method: "Correlation analysis: Pearson ρ between (execution weight, training step) should be negative (ρ < -0.6), AI weight argmax in middle third, human weight positive correlation in final third"
    success_criterion: "Execution ρ < -0.6, AI weight argmax ∈ [0.3, 0.7] training progress, Human weight increases in [0.7, 1.0]"
    falsification: "If weight patterns are random (no systematic phase structure) or static (weights constant across training), dynamic scheduling mechanism is not supported"
  - id: "P3"
    primary: false
    statement: "Conflict cases (code correct but low-quality) show intermediate preference scores (0.1-0.4 range), not extreme collapse to execution-only behavior"
    test_method: "Analyze 50 conflict cases (pass@1 = 1.0, human_preference < 0.3). Measure tri-modal model preference scores. Compare distribution to single-feedback baselines."
    success_criterion: "Tri-modal preference scores: median ∈ [0.1, 0.4], not collapsed to [0.0, 0.1] (execution-only collapse)"
    falsification: "If tri-modal behaves identically to execution-only baseline on conflict cases (preference < 0.1), integration failed - model ignores human/AI feedback"

