    - name: "Feedback Integration Strategy"
      type: "categorical"
      operationalization: "Model training configuration"
      levels: ["execution-only", "human-only", "AI-only", "tri-modal-static", "tri-modal-dynamic"]
    - name: "Weight Schedule Parameters"
      type: "continuous"
      operationalization: "9 parameters (3 per signal: initial weight, peak timestep, decay rate)"
      # Only applies to tri-modal-dynamic condition
  dependent:
