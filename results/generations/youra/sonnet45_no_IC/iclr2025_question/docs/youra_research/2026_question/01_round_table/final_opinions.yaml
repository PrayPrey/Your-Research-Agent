    The hierarchical Bayesian calibration framework is genuinely novel—no prior work formalizes
    mutual calibration between consistency-based and statistical UQ methods. The meta-uncertainty
    extension (using disagreement for OOD detection) elevates this beyond incremental improvement
    to a paradigm shift in how we think about complementary uncertainty signals. The theoretical
    grounding (distributional shift → disagreement) transforms an empirical observation into a
    principled framework.
  key_contributions:
