    The hypothesis is exceptionally well-specified with five testable predictions (P1-P5), clear
    statistical tests (two-tailed t-test for P1, two-proportion z-test for P4, Pearson correlation
    for P5), and explicit falsification criteria (ρ > 0.8, ECE gain < 0.01, etc.). The experimental
