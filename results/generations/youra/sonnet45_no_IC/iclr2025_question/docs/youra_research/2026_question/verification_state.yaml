  h-m-integrated:
    type: Mechanism
    statement: 'Under foundation model uncertainty quantification settings, if we apply hierarchical Bayesian calibration
      (HBC) where consistency priors C(x) inform conformal calibration and statistical validation results update consistency
      thresholds (mutual calibration), then we achieve Expected Calibration Error (ECE) < 0.05 with 30-50% computational cost
      reduction vs. COIN-only while maintaining coverage ≥ 90%, because the three-step causal mechanism operates: (Step 1)
      Consistency sampling measures epistemic uncertainty producing prior C(x), (Step 2) Conformal prediction provides aleatoric
      bounds producing interval I(x), (Step 3) Hierarchical Bayesian updating creates co-calibration exploiting complementarity
      (0.3 < ρ < 0.7), where mutual calibration improves both signals beyond independent application.'
    status: COMPLETED
