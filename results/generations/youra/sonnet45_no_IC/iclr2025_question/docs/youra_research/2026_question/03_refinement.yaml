# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "HBC achieves Expected Calibration Error (ECE) < 0.05, significantly lower than SelfCheckGPT-only, COIN-only, and independent cascade baselines"
    test_method: "4-way comparison on TruthfulQA, HH-RLHF, SQuAD; two-tailed t-test comparing HBC vs. each baseline"
    success_criterion: "p < 0.05 for all three pairwise comparisons (HBC vs. each baseline), AND absolute ECE < 0.05 for HBC"
    falsification: "If ECE improvement < 0.01 vs. independent cascade OR p > 0.05 for any comparison, calibration claim is invalid"
  - id: "P2"
    primary: false
    statement: "HBC computational cost is 30-50% lower than COIN-only while maintaining coverage guarantees (≥90%)"
    test_method: "Measure forward passes per 1000 queries; measure coverage on held-out test set"
    success_criterion: "Cost reduction ≥30% vs. COIN-only AND coverage ≥90% maintained"
    falsification: "If cost reduction < 20% OR coverage drops below 85%, efficiency claim is invalid"
  - id: "P3"
    primary: false
    statement: "Correlation ρ between consistency violations and conformal prediction failures is 0.3 < ρ < 0.7, indicating non-redundant complementary information"
    test_method: "Compute Pearson correlation between C(x) scores and whether y ∈ I(x) on validation set"
    success_criterion: "0.3 ≤ ρ ≤ 0.7 across all three datasets (TruthfulQA, HH-RLHF, SQuAD)"
    falsification: "If ρ > 0.8 on any dataset: methods redundant. If ρ < 0.2 on any dataset: methods independent, mutual calibration invalid"
  - id: "P4"
    primary: false
    statement: "On domain shift (calibrate TruthfulQA, test medical QA), disagreement rate increases by >50% compared to in-distribution"
    test_method: "Compute disagreement rate D on in-distribution (TruthfulQA test) vs. OOD (medical QA); two-proportion z-test"
    success_criterion: "D_OOD - D_ID > 0.5 AND p < 0.05 (two-proportion z-test)"
    falsification: "If D_OOD - D_ID < 0.2 OR p > 0.05, OOD detection claim is invalid"
  - id: "P5"
    primary: false
    statement: "Disagreement rate correlates with actual ECE degradation (Pearson r > 0.7), enabling meta-calibration awareness"
    test_method: "Compute Pearson correlation r(D, ECE) across multiple domain shift experiments (TruthfulQA→medical, TruthfulQA→legal)"
    success_criterion: "r > 0.7 with p < 0.05 (Fisher transformation test)"
    falsification: "If r < 0.5, disagreement is not a reliable meta-calibration signal"

