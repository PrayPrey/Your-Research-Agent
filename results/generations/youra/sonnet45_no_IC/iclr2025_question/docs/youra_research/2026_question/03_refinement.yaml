# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-HBC-v1"
  confidence_level: 0.80 # Based on 4 STRONG verdicts from personas
  core_hypothesis_statement: |
    Under foundation model uncertainty quantification settings, if we apply hierarchical Bayesian
    calibration (HBC) that jointly optimizes consistency-based priors (from SelfCheckGPT-style sampling)
    and statistical conformal prediction bounds, then we achieve superior calibration quality (ECE < 0.05)
    with computational efficiency (30-50% cost reduction vs. COIN-only), because consistency and conformal
    methods capture complementary information sources—consistency reveals epistemic uncertainty structure
    while conformal provides aleatoric bounds—and their Bayesian integration enables mutual calibration
    that improves both signals.
  alternative_hypothesis_h0: |
    There is no significant difference in Expected Calibration Error (ECE) between hierarchical Bayesian
    calibration (HBC) and independent application of consistency-based or conformal prediction methods.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Calibration Method"
      type: "categorical"
      operationalization: "UQ method applied to foundation model outputs"
      levels:
        - "SelfCheckGPT-only (consistency threshold tuned on validation set)"
        - "COIN-only (conformal prediction with standard calibration)"
        - "Independent Cascade (SelfCheckGPT → COIN, separately tuned)"
        - "HBC (hierarchical Bayesian co-calibration)"
    - name: "Dataset Type"
      type: "categorical"
      operationalization: "Uncertainty characteristic of evaluation dataset"
      levels:
        - "High Epistemic (out-of-distribution, e.g., domain-shifted medical QA)"
        - "High Aleatoric (inherently ambiguous, e.g., HH-RLHF value alignment)"
        - "Mixed (realistic deployment, e.g., SQuAD with diverse query types)"
  dependent:
    - name: "Expected Calibration Error (ECE)"
      type: "continuous"
      operationalization: "Standard ECE metric computed over validation set predictions, range [0,1], lower is better"
      primary: true
    - name: "Computational Cost"
      type: "continuous"
      operationalization: "Number of forward passes required (consistency samples + conformal calibration), measured per 1000 queries"
      primary: false
    - name: "Disagreement Rate"
      type: "continuous"
      operationalization: "Fraction of queries where consistency and conformal methods disagree (C(x) high but y ∉ I(x), or vice versa), range [0,1]"
      primary: false
    - name: "Coverage"
      type: "continuous"
      operationalization: "Fraction of ground truth labels within conformal prediction intervals, range [0,1], target ≥0.9"
      primary: false
  controlled:
    - name: "Foundation Model"
      operationalization: "Fixed to Llama-2-7B across all experiments for reproducibility"
    - name: "Consistency Metric"
      operationalization: "Fixed to weighted ensemble of NLI + BERTScore (SelfCheckGPT standard)"
    - name: "Conformal Coverage Target"
      operationalization: "Fixed to 90% coverage for all conformal prediction baselines"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Consistency-based sampling (SelfCheckGPT-style) measures epistemic uncertainty by detecting generative inconsistency across multiple forward passes, producing a consistency prior C(x)"
      evidence: "Exchange 1: Dr. Nova's reframing—SelfCheckGPT detects consistency violations, not absolute truth; Exchange 13: operates in prediction space, not representation space"
      falsifier: "If consistency scores do NOT correlate with epistemic uncertainty (measured via model confidence on known vs. unknown facts), this step fails"
    - step: 2
      description: "Statistical conformal prediction provides calibrated uncertainty bounds that primarily capture aleatoric uncertainty (inherent data ambiguity) via held-out validation set, producing interval I(x)"
      evidence: "Exchange 2: COIN provides FDR control via conformal prediction; Exchange 15: conformal methods provide aleatoric bounds"
      falsifier: "If conformal intervals do NOT maintain coverage guarantees (≥90%) or do NOT capture aleatoric uncertainty, this step fails"
    - step: 3
      description: "Hierarchical Bayesian updating uses consistency prior C(x) to inform conformal calibration, while statistical validation results update consistency threshold, creating co-calibration that exploits complementarity (0.3 < ρ < 0.7)"
      evidence: "Exchange 7-8: Hierarchical Bayesian framework where consistency informs prior, statistical validation updates posterior; Exchange 17: joint calibration exploits non-redundant signals"
      falsifier: "If correlation ρ(C,I) > 0.8 (redundant) or ρ < 0.2 (independent), mutual calibration provides no advantage; or if ECE improvement < 0.01 vs. independent cascade"
  key_tension: "Whether epistemic and aleatoric uncertainty can be disentangled in generative models (Exchange 4: Prof. Pax raised fundamental entanglement concern)"
  evidence_summary: |
    Theoretical basis: Distributional shift causes P_OOD(C,I) ≠ P_ID(C,I), formally implying disagreement change (Exchange 16: provable).
    Empirical validation required: Direction (increase vs. decrease) and magnitude of disagreement on OOD (Exchange 16: empirical component).
    Risk-managed: Even if OOD predictions (P4-P5) fail, core calibration contribution (P1-P3) survives.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Consistency-based and conformal methods measure distinct (non-redundant) aspects of uncertainty, with correlation 0.3 < ρ < 0.7"
    supporting_evidence: "Exchange 15: sweet spot assumption; Exchange 17: theoretical justification via distinct information sources (epistemic vs. aleatoric)"
    consequence_if_violated: "If ρ > 0.8: methods redundant, joint calibration adds no value. If ρ < 0.2: methods independent, mutual calibration ineffective. Both → hypothesis collapses to independent cascade baseline."
  - id: "A2"
    assumption: "Bayesian calibration converges within reasonable training time on standard validation sets"
    supporting_evidence: "Exchange 10: Phase 2 timeline 8 months for full HBC validation, deemed feasible with existing tools"
    consequence_if_violated: "If convergence requires >10K labeled examples or >100 GPU-hours: deployment barrier too high for practitioner adoption"
  - id: "A3"
    assumption: "Ground truth labels available for calibration set (standard UQ requirement)"
    supporting_evidence: "Exchange 10: ground truth requirements met by existing benchmarks (TruthfulQA, FActScore, etc.)"
    consequence_if_violated: "Without labeled validation data, neither consistency threshold tuning nor conformal calibration is possible—standard limitation for all UQ methods"
  - id: "A4"
    assumption: "Distributional shift affects P(C,I) correlation structure, causing detectable disagreement"
    supporting_evidence: "Exchange 16: provable that distributional shift → disagreement change; Exchange 15: P_OOD(C,I) ≠ P_ID(C,I) is theoretical foundation"
    consequence_if_violated: "If correlation ρ remains stable under OOD: disagreement-based OOD detection (P4-P5) fails, but core calibration (P1-P3) unaffected"
  - id: "A5"
    assumption: "Transfer degradation is measurable via ECE increase on domain shift (>0.1 threshold)"
    supporting_evidence: "Exchange 12: Prof. Rex proposed transfer experiments (calibrate Domain A, test Domain B); Exchange 14: ECE degradation metric"
    consequence_if_violated: "If ECE degrades by <0.05 on domain shift: HBC is over-calibrated on in-distribution, under-sensitive to OOD; if >0.2: calibration does not transfer, requires per-domain re-calibration"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Foundation models (LLMs) with autoregressive generation where multiple samples can be drawn
    - Tasks with available ground truth validation sets (factuality benchmarks, QA datasets)
    - In-distribution deployment where calibration set representative of target distribution
    - Domains where computational cost of sampling is acceptable (non-latency-critical applications)
  does_not_apply_to: |
    - Models without sampling capability (deterministic greedy decoders only)
    - Zero-shot deployment with no validation data available
    - Latency-critical applications where multiple forward passes prohibitive
    - Adversarially-crafted inputs designed to fool consistency checks
  known_limitations: |
    - Requires labeled validation set for both consistency threshold and conformal calibration (A3)
    - Domain adaptation may require re-calibration with domain-specific validation data (Exchange 12: Prof. Rex's deployment gap concern)
    - Sweet spot assumption (0.3 < ρ < 0.7) is empirical—if violated, degrades to baseline performance
    - High-consistency systematic errors (confident but wrong) can bypass validation in cascade variant (Exchange 6: Prof. Rex's false negative trap)

