    - risk: "ECE improvement < 0.01 vs. independent cascade"
      impact: "High - core calibration claim fails, hypothesis reduced to complexity without benefit"
      mitigation: "PoC phase measures preliminary ECE; pivot early if improvement minimal"
      likelihood: "Low - theoretical justification strong, Bayesian updating should improve calibration"

  moderate_risks:
    - risk: "Disagreement doesn't correlate with ECE degradation (P5 fails)"
      impact: "Medium - OOD detection claim fails, but core calibration (P1-P3) survives"
      mitigation: "Frame OOD detection as secondary contribution; theoretical core (distributional shift → disagreement) still publishable"
      likelihood: "Medium - direction provable, magnitude empirical"

    - risk: "Domain adaptation requires >1000 labeled examples per domain"
      impact: "Medium - deployment barrier for novel domains without large validation sets"
      mitigation: "Explore meta-learning for few-shot calibration; provide guidance on minimum sample sizes"
      likelihood: "Medium - standard UQ limitation, not HBC-specific"

  low_risks:
    - risk: "Bayesian calibration doesn't converge within reasonable time"
      impact: "Low - implementation challenge, not theoretical flaw"
      mitigation: "Use standard Bayesian optimization tools (PyMC3, Stan); convergence criteria from literature"
      likelihood: "Low - Bayesian calibration well-studied, existing tools mature"

