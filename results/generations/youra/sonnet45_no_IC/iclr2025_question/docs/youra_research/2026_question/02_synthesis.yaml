tensions:
  - tension: "Impossibility result (absolute hallucination detection impossible) vs. empirical success (SelfCheckGPT works)"
    raised_by: "Dr. Nova (Exchange 1)"
    resolution: "Consistency methods measure epistemic structure, not absolute truth. Different quantities → no contradiction."
    evidence: "Exchanges 1-3, 15: reframing from truth detection to consistency measurement"

  - tension: "Joint calibration complexity (two interdependent calibrations) vs. simplicity needed for practitioner adoption"
    raised_by: "Prof. Rex (Exchange 6)"
    resolution: "Complexity is the contribution (mutual calibration improves both signals). Provide HBC-Lite heuristic for practitioners."
    evidence: "Exchanges 7, 9: full Bayesian framework (research contribution) + simplified heuristic (deployment path)"

  - tension: "Epistemic vs. aleatoric uncertainty disentanglement (fundamentally entangled in generative models)"
    raised_by: "Prof. Pax (Exchange 4)"
    resolution: "Approximate attribution via correlation sweet spot (0.3 < ρ < 0.7). Not perfect separation, but useful complementarity."
    evidence: "Exchanges 15-17: complementarity claim (non-redundant) rather than perfect disentanglement"

  - tension: "Deployment gap (works on benchmarks with ground truth, fails on novel domains without labels)"
    raised_by: "Prof. Rex (Exchange 12)"
    resolution: "Meta-uncertainty via disagreement: HBC detects when it's out-of-calibration. OOD extension (P4-P5) addresses deployment robustness."
    evidence: "Exchanges 13-14: disagreement rate as OOD detector, validated via domain shift experiments"

