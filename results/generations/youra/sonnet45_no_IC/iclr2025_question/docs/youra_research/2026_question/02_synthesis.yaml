# HYPOTHESIS EVOLUTION TRAJECTORY
# ═══════════════════════════════════════════════════════════════

evolution:
  initial_insight:
    exchange: 1
    persona: "Dr. Nova"
    content: "Reframe impossibility paradox: SelfCheckGPT detects 'generative inconsistency' not absolute hallucination. Consistency violations = epistemic uncertainty signal."

  key_refinements:
    - exchange: 2
