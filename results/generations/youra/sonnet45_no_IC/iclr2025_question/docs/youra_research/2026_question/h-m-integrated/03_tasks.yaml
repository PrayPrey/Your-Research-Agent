    title: HBC Core Implementation
    description: |
      Implement hierarchical Bayesian calibrator with three-step mechanism:
      1. Consistency prior generation (C(x) via SelfCheckGPT)
      2. Weighted conformal prediction (score / (1 + C(x)))
      3. Mutual calibration (Bayesian threshold updating)
    category: implementation
    priority: 2
    complexity: 15
    complexity_breakdown:
      module_size: 4
      dependencies: 3
      algorithm: 5
      integration: 3
    dependencies: [DATA-1, DATA-2, DATA-3, ENV-1]
    reference_files:
      - file: 03_architecture.md
        section: "## Epic Tasks > | M-1"
      - file: 03_logic.md
        section: "### 1. HierarchicalBayesianCalibrator"
      - file: 03_config.md
        section: "## 4. HBC Configuration (M-1)"
    subtasks:
      - id: M-1-1
        title: Calibration Method Implementation
        description: Three-step calibration on labeled validation set
        reference: "03_logic.md#Subtask-1.1"
        complexity: high
      - id: M-1-2
        title: Prediction with Uncertainty
        description: Co-calibrated inference with epistemic-informed bounds
        reference: "03_logic.md#Subtask-1.2"
        complexity: high
      - id: M-1-3
