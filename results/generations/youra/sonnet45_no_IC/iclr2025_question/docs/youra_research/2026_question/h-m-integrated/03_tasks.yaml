        description: Epistemic-informed nonconformity scoring
        reference: "03_logic.md#Subtask-1.3"
        complexity: medium
      - id: M-1-4
        title: Mutual Calibration Update
        description: Bayesian threshold updating based on coverage
        reference: "03_logic.md#Subtask-1.4"
        complexity: high
    acceptance_criteria:
      - HBC calibrate() method completes on calibration set
      - Mutual calibration converges in ≤ 3 iterations
      - predict_with_uncertainty() returns prediction + interval + consistency
      - Weighted nonconformity correctly penalizes inconsistent samples

