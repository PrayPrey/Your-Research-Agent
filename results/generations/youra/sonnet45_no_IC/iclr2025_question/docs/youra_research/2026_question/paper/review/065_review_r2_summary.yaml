      NUM-FATAL-001:
        issue: "Experimental results based on simulated/mock data"
        locations:
          - "Abstract (definitive language)"
          - "Results § (contradictory 'measured' language)"
          - "Table 2 note (misleading)"
        required_actions:
          - "Remove 'measured from validation experiments' language"
          - "Use 'synthetic proof-of-concept validation' consistently"
          - "Add Results § preface: all results from synthetic PoC"
          - "Revise Abstract: 'Proof-of-concept validation with synthetic data demonstrates...'"
          - "Reconcile ground truth values (0.0433 vs 0.045)"

    tier2_major:
