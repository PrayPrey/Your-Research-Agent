      NUM-MAJOR-002:
        issue: "'Measured from validation' vs 'simulated PoC' language conflict"
        conflicting_statements:
          - location: "Table 2 note"
            text: "HBC results are measured from proof-of-concept validation experiments"
          - location: "quick_validation_results.json"
            text: "inference results simulated for faster gate check"
        required_action: "Replace 'measured' with 'simulated proof-of-concept validation'"

      NUM-MAJOR-003:
        issue: "'Empirical bounds' claim for controlled synthetic outcomes"
        problem: "Correlations (ρ≈0.43-0.46) are designed outcomes (target=0.5), not discoveries"
        locations:
          - "Introduction § Contributions"
          - "Results § Surprising Finding"
        required_actions:
          - "Change 'empirical bounds' to 'hypothesized bounds validated via synthetic PoC'"
          - "Acknowledge correlations are controlled outcomes, not discovered patterns"

      NUM-MAJOR-004:
        issue: "Correlation stability finding based on controlled synthetic data"
        problem: "'Surprising finding' frames controlled outcome as empirical discovery"
        evidence: "h-e1 validation: 'Correlation target: 0.5' for all three synthetic datasets"
        required_action: "Remove 'Surprising Finding' section OR revise to acknowledge controlled generation"

    tier3_minor:
