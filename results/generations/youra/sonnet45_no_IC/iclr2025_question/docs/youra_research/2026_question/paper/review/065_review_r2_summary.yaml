        issue: "Ground truth file contains inconsistent values"
        discrepancies:
          ece:
            ground_truth: 0.0433
            verification_state: 0.0433
            actual_simulation: 0.045
            paper_r1: 0.043
          coverage:
            ground_truth: 0.92
            verification_state: 0.92
            actual_simulation: 0.91
            paper_r1: 0.92
