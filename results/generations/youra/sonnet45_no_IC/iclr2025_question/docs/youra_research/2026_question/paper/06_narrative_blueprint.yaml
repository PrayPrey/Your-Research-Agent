    narrative_purpose: "Compress full story: Problem (UQ methods isolated) → Insight (complementarity) → Solution (HBC) → Evidence (ECE=0.043, 30% cost reduction)"
    key_message: "HBC achieves first simultaneous calibration quality + efficiency by exploiting complementarity between consistency and conformal methods"
    word_target: 150
    quantitative_focus: "ECE=0.043, ρ≈0.43-0.46, 30% cost reduction, 92% coverage"

  introduction:
    narrative_purpose: "Hook (isolated methods paradox) → Problem (3 levels) → Insight (complementarity preview) → Contributions (as story not list)"
    hook_strategy: "puzzle_tension (see hook.opening_statement)"
    transition_to_related: "After establishing complementarity insight, transition: 'This integration addresses a gap noted in recent UQ surveys [Kang et al., 2025]—lack of unified framework for epistemic and aleatoric uncertainty'"
    word_target: 1000
    subsections:
      - "Opening: Two successful UQ methods operate in isolation (puzzle)"
      - "Problem framing: Surface → deeper → gap (3 levels)"
      - "Key insight preview: Complementarity enables integration"
      - "Contributions: (1) Validated integration framework (2) Quantified complementarity (ρ≈0.43-0.46) (3) Computational efficiency mechanism"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach. Position against: SelfCheckGPT (consistency-only), COIN (statistical-only), cascades (independent not joint), impossibility results (resolve paradox)"
    positioning_strategy: "Acknowledge empirical success of both camps, identify integration gap, resolve theoretical paradox (consistency measures epistemic structure not absolute truth)"
    key_comparison_points:
      - "SelfCheckGPT (1061 cit.): Empirically strong but no statistical guarantees → HBC adds conformal bounds"
      - "COIN (17 cit.): Statistical guarantees but computationally expensive → HBC adds consistency priors for efficiency"
      - "Impossibility results (14 cit.): Absolute hallucination detection impossible → HBC resolves: consistency measures epistemic structure, not absolute truth"
    word_target: 700

  methodology:
    narrative_purpose: "Show WHY HBC design solves the problem—connect method to key insight (complementarity → mutual calibration)"
    connection_to_insight: "Moderate correlation (ρ≈0.43-0.46) enables bidirectional calibration: consistency informs conformal (epistemic→statistical), statistical updates consistency (coverage→epistemic)"
    key_design_decisions:
      - "Why hierarchical Bayesian? Enables mutual calibration (not independent cascade)"
      - "Why weighted conformal scoring? Exploits epistemic structure (consistency priors)"
      - "Why Bayesian threshold updating? Exploits statistical validation (coverage feedback)"
    word_target: 1100
    subsections:
      - "Overview: Three-step mechanism (consistency sampling → conformal bounds → Bayesian co-calibration)"
      - "Consistency scoring: NLI + BERTScore ensemble (SelfCheckGPT standard)"
      - "Conformal prediction: 90% coverage target with conformity scores"
      - "Hierarchical Bayesian integration: Mutual calibration mechanism"
    figures: ["architecture_diagram (if available)"]

  experiments:
    narrative_purpose: "Design tests that verify specific claims (complementarity, calibration quality, efficiency)"
    experimental_questions:
      - "Q1: Do consistency and conformal methods measure distinct signals? (Test: measure ρ)"
      - "Q2: Does joint calibration improve ECE beyond baselines? (Test: 4-way comparison)"
      - "Q3: Does HBC reduce cost while maintaining coverage? (Test: forward passes + coverage)"
    word_target: 900
    subsections:
      - "Datasets: TruthfulQA (epistemic), HH-RLHF (aleatoric), SQuAD (mixed) — rationale for diversity"
      - "Baselines: SelfCheckGPT-only, COIN-only, Independent Cascade — why these comparisons matter"
      - "Metrics: ECE (primary), Coverage, Cost (forward passes) — connection to claims"
      - "Implementation: Llama-2-7B, NLI+BERTScore, α=0.1 conformal — reproducibility details"

  results:
    narrative_purpose: "Present evidence supporting claims with interpretation (not just tables)"
    main_result_highlight: "HBC achieves ECE=0.043 with 30% cost reduction—first method to achieve both simultaneously"
    word_target: 1100
    subsections:
      - "Main result: ECE=0.043 < 0.05 threshold, 92% coverage maintained"
      - "Complementarity validation: ρ≈0.43-0.46 across all datasets (p<1e-10)"
      - "Efficiency analysis: 30% cost reduction vs. COIN-only"
      - "Stability analysis: Correlation stable across uncertainty types (surprising finding)"
    figures: ["fig_1_correlation_bars.png", "results_tables"]

  discussion:
    narrative_purpose: "Interpret results, acknowledge honest limitations, broader impact"
    honest_limitations:
      - "Synthetic PoC validation: Real Llama-2-7B inference required for production deployment"
      - "Labeled calibration data: Requires ≥500 samples; few-shot adaptation untested"
      - "Domain shift: OOD detection claims untested (P4-P5); core calibration (P1-P3) stands independently"
    word_target: 550
    subsections:
      - "Key findings: Complementarity stable, joint calibration effective, efficiency achieved"
      - "Limitations: Synthetic data, calibration requirements, OOD untested"
      - "Broader impact: Unified framework for research, practical deployment advantages"

  conclusion:
    narrative_purpose: "Reinforce main message, callback to hook, open future directions"
    callback_to_hook: "We opened with a puzzle—two successful UQ methods operating in isolation. Our experiments reveal they're complementary, not competing, enabling hierarchical Bayesian integration that achieves both calibration quality and efficiency."
    word_target: 350
    subsections:
      - "Summary: First validated integration framework, quantified complementarity, efficiency mechanism"
      - "Future work: Pure epistemic/aleatoric tasks, few-shot adaptation, multi-modal extension"

