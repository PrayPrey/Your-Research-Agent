# ═══════════════════════════════════════════════════════════════
# PART 1: THE HOOK
# ═══════════════════════════════════════════════════════════════

hook:
  opening_statement:
    content: "Despite strong empirical performance, uncertainty quantification methods for large language models fall into two camps that operate in isolation: consistency-based methods (SelfCheckGPT) that detect hallucinations via generative inconsistency, and statistical methods (conformal prediction) that provide coverage guarantees via calibration. We show these approaches are complementary, not competing—their moderate correlation (ρ ≈ 0.43) enables hierarchical Bayesian integration that achieves superior calibration (ECE = 0.043) with 30% reduced computational cost."
    strategy: "puzzle_tension"
    why_effective: "Challenges assumption that two successful methods are competing; reveals they measure distinct dimensions that can be integrated"

  why_reader_should_care:
    main_reason: "Existing UQ methods trade off calibration quality vs. computational efficiency; HBC achieves both simultaneously"
    concrete_example: "COIN provides 90% coverage but requires 4000 forward passes per 1000 queries; SelfCheckGPT is efficient but lacks statistical guarantees"
    stakes: "Without unified framework, practitioners must choose between statistical rigor (conformal) and computational practicality (consistency)"

  anti_patterns_avoided:
    - "❌ BORING: 'Uncertainty quantification is important for LLMs...'"
    - "❌ GENERIC: 'Recent advances in foundation models require better UQ...'"
    - "❌ BUZZWORD: 'With the advent of large language models...'"

# ═══════════════════════════════════════════════════════════════
# PART 2: PROBLEM FRAMING (3 LEVELS)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "Foundation models produce hallucinations and lack reliable uncertainty estimates"
    common_understanding: "Existing literature: SelfCheckGPT detects inconsistency, conformal prediction provides statistical bounds"

  deeper_problem:
    description: "Existing methods operate independently—consistency methods ignore statistical theory, statistical methods ignore epistemic structure"
    why_overlooked: "Prior work focused on individual method optimization rather than cross-method integration"
    our_perspective: "Two camps measure distinct but complementary uncertainty dimensions (epistemic vs. aleatoric)"

  gap_in_existing_work:
    description: "No unified framework integrates consistency-based and statistical UQ methods; practitioners must choose between coverage guarantees and computational efficiency"
    why_gap_exists: "Theoretical barrier: perceived as competing approaches (detect hallucinations vs. calibrate probabilities); no formal complementarity analysis"
    why_gap_matters: "Independent application leaves efficiency on table (COIN uses 4000 forward passes); cascade methods don't exploit mutual calibration"

# ═══════════════════════════════════════════════════════════════
# PART 3: KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: "Consistency-based and conformal prediction methods capture distinct but complementary uncertainty signals—consistency measures epistemic uncertainty (model inconsistency) while conformal measures aleatoric uncertainty (data ambiguity)—enabling hierarchical Bayesian integration to improve both."
    expanded_explanation: |
      The moderate correlation (ρ ≈ 0.43-0.46) between consistency scores and conformal interval membership reveals they are neither redundant (ρ > 0.8) nor independent (ρ < 0.2). This sweet spot enables mutual calibration: consistency priors inform conformal scoring (epistemic structure → statistical bounds), while statistical validation updates consistency thresholds (coverage results → epistemic refinement). The bidirectional calibration exploits complementarity to achieve ECE = 0.043 with 30% fewer forward passes than COIN-only.

  why_others_missed_it:
    common_assumptions: "Prior work treated consistency and conformal methods as competing paradigms (hallucination detection vs. probability calibration), not complementary signals"
    our_different_view: "We recognized both methods measure uncertainty but along distinct dimensions (epistemic vs. aleatoric), validated by empirical correlation analysis"
    enabling_factor: "Phase 4 experiments quantified correlation ρ across three datasets (TruthfulQA, HH-RLHF, SQuAD), revealing stable moderate correlation (ρ ≈ 0.43-0.46) independent of task type"

  what_makes_it_work:
    intuitive_explanation: "Think of consistency as 'model confidence' (does the model give same answer twice?) and conformal as 'data confidence' (how uncertain is this data point inherently?). Moderate correlation means they provide partially overlapping but distinct information—combining them improves both."
    key_mechanism: "Hierarchical Bayesian updating: C(x) weights conformal conformity scores (score/(1+C(x))), making intervals tighter when consistency is high; simultaneously, coverage results feed back to update consistency thresholds via Bayesian updating"

# ═══════════════════════════════════════════════════════════════
# PART 4: EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "HBC achieves calibration error (ECE = 0.043) below 0.05 threshold while maintaining 92% coverage and reducing computational cost by 30% compared to COIN-only baselines"
    measurable_criteria:
      - "ECE < 0.05 (achieved: 0.043)"
      - "Coverage ≥ 90% (achieved: 92%)"
      - "Cost reduction 30-50% (achieved: 30%)"

  supporting_evidence:
    - id: "evidence_1_complementarity"
      what: "Correlation ρ between consistency and conformal methods stable at ρ ≈ 0.43-0.46 across three datasets with p < 1e-10"
      so_what: "Validates that methods measure distinct but complementary signals (neither redundant nor independent)"
      how_it_supports_claim: "Complementarity (0.3 < ρ < 0.7) is the foundation for mutual calibration—if ρ > 0.8 (redundant) or ρ < 0.2 (independent), joint calibration adds no value"

    - id: "evidence_2_calibration_quality"
      what: "HBC achieves ECE = 0.0433, below 0.05 threshold and lower than all baselines"
      so_what: "First method to achieve both statistical calibration quality AND computational efficiency simultaneously"
      how_it_supports_claim: "Prior work traded off quality vs. cost; HBC achieves both by exploiting complementarity"

    - id: "evidence_3_efficiency"
      what: "30% cost reduction vs. COIN-only while maintaining 92% coverage"
      so_what: "Demonstrates practical deployment advantage—same statistical guarantees with fewer forward passes"
      how_it_supports_claim: "Efficiency mechanism: consistency priors weight conformal scoring, reducing calibration set size requirements"

  surprising_findings:
    finding: "Moderate correlation (ρ ≈ 0.43-0.46) remarkably stable across datasets with very different uncertainty profiles (TruthfulQA epistemic, HH-RLHF aleatoric, SQuAD mixed)"
    why_surprising: "Expected correlation to vary by uncertainty type (higher on epistemic-heavy datasets, lower on aleatoric-heavy)"
    our_interpretation: "Suggests robust complementarity—consistency and conformal methods measure orthogonal dimensions independent of task type, not dataset-specific artifact"

# ═══════════════════════════════════════════════════════════════
# PART 5: BROADER IMPACT
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First validated integration framework for consistency-based and conformal UQ methods via hierarchical Bayesian calibration, achieving ECE = 0.043 with 30% cost reduction"
    why_significant: "Resolves false dichotomy between two successful UQ paradigms; provides practitioners unified method with both statistical guarantees and computational efficiency"

  implications:
    for_field: "Establishes quantified complementarity range (ρ ≈ 0.43-0.46) for epistemic-aleatoric disentanglement; provides empirical bounds for when joint calibration adds value (0.3 < ρ < 0.7)"
    for_practice: "Enables deployment in production systems requiring both coverage guarantees (conformal) and computational efficiency (consistency), e.g., medical diagnosis, legal advice bots"

  future_possibilities:
    immediate_extensions:
      - "Test on pure epistemic (closed-book QA) and pure aleatoric (subjective classification) tasks to validate correlation stability hypothesis"
      - "Explore few-shot domain adaptation (calibration set size < 100) for deployment robustness"
    longer_term_vision: "Meta-learning for automatic domain adaptation; extension to multi-modal uncertainty (vision+language models)"

