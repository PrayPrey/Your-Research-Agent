hypothesis_draft:
  title: "Cross-Architecture Parameterized Encoder (CAPE)"
  hypothesis_id: "H-CAPE-v1"
  core_claim: |
    Cross-architecture weight-space property inference achieves ρ ≥ 0.65 via modular operation
    encoders (conv/attention/MLP-specific) with contrastive task alignment and architecture-residual
    graph embeddings, closing 35% of the performance gap toward within-architecture capability.
  mechanism: |
    Three-component encoder: (1) Operation-specific encoders respect mathematical structure
    differences (SANE tokenization for conv, UNF equivariance for attention, standard for MLP),
    (2) Contrastive projection aligns heterogeneous embeddings via shared task objectives
    (InfoNCE pulls ImageNet classifiers together), (3) Architecture GNN residual adds graph
    topology signal (or degrades to zero if GNN fails to generalize).
  predictions:
    - "P1: Full CAPE achieves ρ ≥ 0.65 on ResNet→ViT (vs SNE baseline ρ=0.54)"
    - "P2: Embedding distance predicts transfer difficulty (ρ ≥ 0.7 correlation)"
    - "P3: Triangle inequality violations < 15% across architecture triplets"

variables_summary:
  independent: "Embedding method (4 levels: SNE-Baseline, Modular-Only, Contrastive-Aligned, Full-CAPE)"
  dependent_primary: "Cross-architecture property prediction correlation (Spearman ρ on ResNet→ViT ImageNet accuracy inference)"
  controlled: "Model zoo size (100 per architecture), ground truth (ImageNet top-1 from HF model cards), train/test split (70/30 stratified), contrastive hyperparameters (τ=0.07, d_z=256)"

