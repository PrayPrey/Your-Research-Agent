# ═══════════════════════════════════════════════════════════════
# EXPERIMENTAL SETUP
# ═══════════════════════════════════════════════════════════════

experimental_setup:
  dataset:
    scale: "PoC"
    total_models: 100
    architectures:
      - name: "ResNet-50"
        count: 50
      - name: "ViT-Base"
        count: 50
    task: "ImageNet classification"
    ground_truth_property: "Top-1 accuracy"
    note: "Synthetic labels in PoC, real labels in Phase 5"

  training:
    epochs: 10
    batch_size: 16
    learning_rate: 0.0001
    optimizer: "AdamW"
    weight_decay: 0.0001
    scheduler: "Cosine annealing with warmup"
    warmup_percent: 0.10

  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    stratification: "By accuracy quantiles"

  cross_architecture_transfer:
    train_on: ["ResNet-50"]
    test_on: ["ViT-Base"]
    metric: "Spearman correlation (ρ)"

# ═══════════════════════════════════════════════════════════════
# HYPERPARAMETERS (Validated Optimal)
# ═══════════════================================================================

hyperparameters:
  contrastive_projection:
    temperature_tau: 0.07
    projection_dim: 256
    note: "SENSITIVE: stay in [0.05, 0.1] range"

  architecture_gnn:
    layers: 3
    hidden_dim: 64
    pooling: "global_mean"
    initial_alpha: 0.5
    converged_alpha: 0.42

  loss_weights:
    lambda_contrast: 1.0
    lambda_property: 0.5

