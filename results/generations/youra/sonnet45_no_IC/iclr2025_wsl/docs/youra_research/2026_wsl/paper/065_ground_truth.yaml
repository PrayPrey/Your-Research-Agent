# ABLATION STUDY RESULTS
# ═══════════════════════════════════════════════════════════════

ablation_results:
  sne_baseline:
    rho: 0.54
    description: "Set-encoding baseline (architecture-invariant)"
    source: "Andreis et al. 2023, reproduced in h-m-integrated"

  operation_only:
    rho: 0.58
    delta: 0.04
    description: "Operation-specific encoders without contrastive alignment"
    contribution_percentage: 31  # 0.04/0.13 = 31%

  operation_contrastive:
    rho: 0.63
    delta: 0.05
    cumulative_delta: 0.09
    description: "Operation encoders + contrastive projection (no GNN)"
    contribution_percentage: 38  # 0.05/0.13 = 38%
    note: "Achieves 69% of total improvement (0.09/0.13)"

  full_cape:
    rho: 0.67
    delta: 0.04
    cumulative_delta: 0.13
    description: "Full CAPE with GNN residual"
    contribution_percentage: 31  # 0.04/0.13 = 31%

  validation:
    all_components_contribute: true
    no_component_degrades: true
    source: "h-m-integrated/04_validation.md Table 1, Results Section 5.3"

