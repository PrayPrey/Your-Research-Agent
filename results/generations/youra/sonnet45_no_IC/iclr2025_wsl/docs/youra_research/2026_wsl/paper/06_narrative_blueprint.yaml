# FIGURE PLACEMENT STRATEGY
# ═══════════════════════════════════════════════════════════════════════

figure_strategy:
  principles:
    - "Figures support narrative, not decorative: Each figure answers specific question"
    - "First reference placement: Figure appears at top of page after first textual reference"
    - "Standalone clarity: Caption + figure should be understandable without main text"

  key_figures:
    - id: "fig_1_main_result"
      content: "Gate comparison bar chart (SNE 0.54 vs CAPE 0.67 vs threshold 0.65)"
      section: "results"
      narrative_role: "Visual proof of ceiling-breaking—immediate impact"
      caption_strategy: "Start with 'CAPE achieves ρ=0.67...', explain bars (SNE baseline, threshold, CAPE), mention statistical significance"

    - id: "fig_2_ablation"
      content: "Ablation bar chart (SNE → Op → Op+Contrast → Full CAPE)"
      section: "results"
      narrative_role: "Shows all components contribute independently"
      caption_strategy: "Emphasize +0.04, +0.05, +0.04 incremental gains, proving modular decomposition"

    - id: "fig_3_statistical"
      content: "Permutation test distribution (p=0.032)"
      section: "results"
      narrative_role: "Statistical rigor—improvement is real, not random"
      caption_strategy: "Explain permutation test, highlight p-value, show observed Δρ vs null distribution"

    - id: "fig_4_diagnostic"
      content: "Diagnostic metrics summary (table or radar chart)"
      section: "results"
