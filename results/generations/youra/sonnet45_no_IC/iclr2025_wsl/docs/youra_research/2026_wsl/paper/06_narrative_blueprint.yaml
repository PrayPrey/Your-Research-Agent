# ═══════════════════════════════════════════════════════════════════════
# WRITING GUIDELINES: Style & Tone
# ═══════════════════════════════════════════════════════════════════════

writing_guidelines:
  style:
    - "Active voice: 'CAPE achieves ρ=0.67' not 'ρ=0.67 was achieved by CAPE'"
    - "Concrete over abstract: 'Binary classifier distinguishes ResNet from ViT with 100% accuracy' not 'Signal existence was validated'"
    - "Numbers tell story: 'ρ=0.67 (24% improvement, p=0.032)' not 'significant improvement'"
    - "Short sentences for key claims: 'CAPE breaks the ceiling.' not 'Our results demonstrate...'"

  tone:
    - "Confident but not arrogant: 'First statistically significant improvement' (fact) not 'dramatically superior method' (hyperbole)"
    - "Honest limitations: State PoC-scale and synthetic labels transparently, frame as mechanism validation not final empirical proof"
    - "Build-on, not tear-down: 'SNE establishes baseline, SANE proves operation-specific signals, UNF provides equivariance—CAPE integrates these' not 'prior work fails'"

  avoid:
    - "Hedging: 'seems to suggest', 'appears to indicate', 'might potentially'"
    - "Generic openings: 'Deep learning has achieved', 'X is important', 'Recent advances'"
    - "Unexplained jargon: Define operation encoders, contrastive projection, GNN residual on first use"
    - "Result-only statements: Every result needs 'so what' interpretation"

