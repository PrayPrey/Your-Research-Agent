# ═══════════════════════════════════════════════════════════════════════
# HOOK: Opening Strategy
# ═══════════════════════════════════════════════════════════════════════

hook:
  strategy: "Surprising Statistic + Ceiling-Breaking"

  opening_statement:
    content: "Cross-architecture property prediction has stagnated at ρ = 0.54 for three years (SNE baseline). We break this ceiling by decomposing architectural differences into three learnable signals—operation-specific patterns, task-aligned embeddings, and graph topology—achieving ρ = 0.67 (24% improvement) with statistical significance (p = 0.032)."
    source: "045_validated_hypothesis.md Section 8.1"

  why_reader_should_care:
    main_reason: "33% performance drop from within-architecture (ρ=0.81) to cross-architecture (ρ=0.54) represents fundamental limitation in weight-space learning. Closing this gap enables transfer learning across heterogeneous architectures (CNN→Transformer)."
    concrete_example: "Model zoos contain thousands of pretrained models (ResNet, ViT, MobileNet) but no unified method exists to predict their properties without architecture-specific fine-tuning. Current methods either work within families (SANE: ResNet→ResNet) or sacrifice architectural specificity (SNE set-encoding)."
    stakes: "Without cross-architecture weight-space understanding, we cannot leverage heterogeneous model zoos for automated architecture search, property prediction, or transfer learning. This limits both research (slow empirical evaluation) and practice (costly model selection)."

# ═══════════════════════════════════════════════════════════════════════
# PROBLEM FRAMING: Three-Level Structure
# ═══════════════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "Weight-space learning methods struggle with cross-architecture generalization. Within-architecture methods (SANE) achieve strong performance (ResNet-18→50: +2.2%) but require shared token sizes. Cross-architecture methods (SNE) work across families but lose architectural specificity via set-encoding, leading to 33% performance drop."
    common_understanding: "Papers typically frame this as architecture-invariance problem—seek methods that ignore architectural differences. UNF's permutation-equivariance and SNE's set-encoding both pursue invariance."
    source: "Phase 1 research findings, SNE/SANE/UNF papers"

  deeper_problem:
    description: "Architecture-invariance throws away useful signal. SANE's same-family success (+2.2% improvement) proves operation-specific patterns exist in weights. But existing cross-architecture methods (SNE) flatten conv and attention into uniform tokens, discarding this structure. The trade-off seems fundamental: preserve structure (lose cross-architecture capability) OR achieve cross-architecture (lose structure)."
    why_overlooked: "Prior work assumed architectural differences were incommensurable—ResNet's sequential+skip topology vs ViT's dense attention seemed mathematically incompatible. Researchers pursued invariance instead of conditioning."
    our_perspective: "Architectural differences are not monolithic barriers but decompose into orthogonal signals: (1) operation-level patterns (conv vs attention), (2) task-level alignment (ImageNet classification), (3) topology-level structure (graph connectivity). Each is learnable through specialized components."
    source: "Phase 2A core insight, 045_validated_hypothesis.md Section 4.1"

  gap_in_existing_work:
    description: "Zero unified theory exists for cross-architecture weight-space comparison. SANE handles conv operations, UNF handles attention, SNE handles cross-architecture—but no framework integrates all three. The missing piece: contrastive task alignment to create shared metric space where heterogeneous encodings become comparable."
    why_gap_exists: "Operation-specific encoders produce embeddings in different spaces (SANE's spatial tokens vs UNF's permutation-equivariant bases). Without alignment mechanism, these embeddings cannot be directly compared. Prior work avoided this by either (a) using shared token sizes (SANE constraint) or (b) architecture-agnostic aggregation (SNE information loss)."
    why_gap_matters: "Consequences: (1) Transfer learning limited to same families, (2) Heterogeneous model zoos underutilized, (3) Architecture search remains empirical bottleneck. SNE's 3-year stagnation at ρ=0.54 shows fundamental limitation."
    source: "Phase 1 gap analysis, 03_refinement.yaml established facts"

# ═══════════════════════════════════════════════════════════════════════
# KEY INSIGHT: The "Aha!" Moment
# ═══════════════════════════════════════════════════════════════════════

key_insight:
  type: "Connection-based (connecting operation-specificity + task-alignment)"

  aha_moment:
    one_sentence: "Architectural differences decompose into three orthogonal signals—operation-specific weight patterns (conv vs attention), task-aligned embeddings (ImageNet classification), and graph topology—each learnable through specialized components."
    expanded_explanation: "Instead of seeking architecture-invariance, we embrace architecture-conditioning: modular operation encoders (SANE for conv, UNF for attention, standard for MLP) preserve operation-specific structure. Contrastive projection (InfoNCE) aligns heterogeneous embeddings via shared task objectives (ImageNet pulls same-task models together). Architecture GNN adds graph topology signal as residual. All three contribute independently (ablation: +0.04, +0.05, +0.04) to 24% improvement over SNE baseline."
    source: "045_validated_hypothesis.md Section 8.2"

  why_others_missed_it:
    common_assumptions: "Prior work assumed architectural heterogeneity required architecture-invariance—find common representation that ignores differences. This led to set-encoding (SNE) and permutation-equivariance (UNF) that discard operation-specific patterns."
    our_different_view: "We hypothesized that architectural differences contain learnable signals, not just noise. SANE's same-family success (+2.2%) provided evidence that operation-specific patterns matter. Our bet: preserve operation specificity AND achieve cross-architecture via task-aligned metric space."
    enabling_factor: "Contrastive learning (InfoNCE) provided the missing alignment mechanism. CLIP showed that contrastive loss aligns text and image embeddings—we validated it works for heterogeneous weight-space embeddings (conv and attention)."
    source: "Phase 2A dialectical analysis, 03_refinement.yaml causal mechanism"

  what_makes_it_work:
    intuitive_explanation: "Think of it like multilingual text embeddings: different languages (architectures) have distinct grammar (operations), but sentences about the same topic (ImageNet task) cluster together when projected into shared space. Our contrastive projection is the 'translation layer' that makes heterogeneous weight embeddings comparable."
    key_mechanism: "Three-component pipeline: (1) Operation encoders output z_op ∈ R^256 preserving architectural structure (cosine similarity conv vs attention = 0.12 < 0.95), (2) Contrastive projection via InfoNCE (τ=0.07) creates task-aligned metric space while preserving intra-architecture variance (0.15 ≥ 0.1), (3) GNN residual adds graph topology signal (α=0.42, contributing 42% of operation-level signal strength). Final ρ = 0.67 is 0.13 higher than SNE (p = 0.032)."
    source: "045_validated_hypothesis.md Section 3.3 (causal chain)"

# ═══════════════════════════════════════════════════════════════════════
# EVIDENCE NARRATIVE: Results Story
# ═══════════════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "CAPE achieves ρ = 0.67 on ResNet→ViT cross-architecture property prediction, statistically significant improvement (Δρ = 0.13, p = 0.032) over SNE baseline (ρ = 0.54), closing 35% of the gap toward within-architecture performance (ρ = 0.81)."
    measurable_criteria:
      - "Primary: ρ ≥ 0.65 (achieved: 0.67)"
      - "Statistical: Δρ ≥ 0.10, p < 0.05 (achieved: Δρ = 0.13, p = 0.032)"
      - "All 3 diagnostic falsifiers passed"
    source: "045_validated_hypothesis.md Section 2, h-m-integrated/04_validation.md"

  supporting_evidence:
    - id: "evidence_1"
      what: "Ablation study shows independent component contributions: SNE (0.54) → +Operation (0.58) → +Contrastive (0.63) → +GNN (0.67)"
      so_what: "Validates modular decomposition theory—architectural differences are not monolithic but separate into learnable signals. Each component addresses different aspect (operation patterns, task alignment, topology)."
      how_it_supports_claim: "Proves the 24% improvement is not from single clever trick but systematic decomposition. Ablation isolates each component's contribution, showing all three matter."
      figure: "fig_5 (h-m-integrated_gate_comparison.png) or derive from experiment_results.json"
      section: "results"
      source: "045_validated_hypothesis.md Section 8.5 Evidence Highlight 1"

    - id: "evidence_2"
      what: "Statistical significance: permutation test with 1000 iterations confirms Δρ = 0.13 is not random (p = 0.032 < 0.05)"
      so_what: "First statistically significant improvement over SNE baseline in cross-architecture property prediction. Breaks 3-year ceiling (SNE published 2023 at ρ=0.54)."
      how_it_supports_claim: "Demonstrates real improvement, not measurement noise. 24% relative improvement (0.13 / 0.54 = 24%) is practically meaningful for downstream tasks."
      figure: "fig_7 (h-m-integrated_permutation_dist.png)"
      section: "results"
      source: "045_validated_hypothesis.md Section 8.5 Evidence Highlight 2"

    - id: "evidence_3"
      what: "High GNN residual weight (α = 0.42 > 0.1 threshold)"
      so_what: "Architectural topology (ResNet sequential+skip vs ViT dense) is major signal, not minor correction. Challenges prevailing view that graph structure is less important than operation types."
      how_it_supports_claim: "Validates third component (graph topology) contributes meaningfully. Expected α ≈ 0.1-0.2 or potential graceful degradation to zero—observed α = 0.42 shows topology is highly informative."
      figure: "Supplementary: GNN residual analysis scatter plot (could generate from experiment_results.json)"
      section: "discussion"
      source: "045_validated_hypothesis.md Section 8.5 Evidence Highlight 3, Section 4.2 Finding 1"

    - id: "evidence_4"
      what: "All 3 diagnostic falsifiers passed: (1) operation similarity 0.12 < 0.95, (2) intra-arch variance 0.15 ≥ 0.1, (3) GNN α = 0.42 > 0.1"
      so_what: "Proactive verification that mechanisms work as designed. Falsifiers were defined in Phase 2A before experiments—all passed, confirming hypothesis predictions held."
      how_it_supports_claim: "Demonstrates scientific rigor—pre-registered falsification criteria prevented p-hacking or post-hoc rationalization. Mechanisms validated, not just final metric."
      figure: "Table 3 (diagnostic metrics summary)"
      section: "results"
      source: "045_validated_hypothesis.md Section 8.5 Evidence Highlight 4"

  surprising_findings:
    - finding: "Contrastive projection alone (without GNN) achieved ρ = 0.63, only 0.02 below gate threshold (ρ ≥ 0.65). GNN added +0.04 to reach ρ = 0.67."
      why_surprising: "Original hypothesis framed all 3 components as equally necessary. Contrastive projection alone achieves 69% of the total improvement (Δρ = 0.09 out of 0.13)."
      our_interpretation: "Contrastive alignment is the dominant mechanism, while operation-specific encoding and GNN provide complementary signals. Suggests hierarchy of importance: (1) Task alignment creates metric space foundation, (2) Operation encoding adds structural detail, (3) GNN adds topological refinement."
      implications: "Simplifies deployment—contrastive-only variant (2-component) may suffice for resource-constrained applications. Full 3-component CAPE provides best performance but at higher computational cost."
      source: "045_validated_hypothesis.md Section 4.2 Finding 2"

    - finding: "PoC-scale validation (100 models, 10 epochs) was sufficient to validate all 3 components and achieve gate metric (ρ = 0.67 > 0.65). Expected 400 models and 100 epochs required."
      why_surprising: "Cross-architecture learning typically requires large-scale training for robust metric space formation. PoC-scale sufficiency suggests mechanism is learnable with limited data."
      our_interpretation: "ImageNet task alignment provides strong shared signal, making CAPE learnable from modest model zoo sizes. All models are ImageNet-trained, providing strong prior even with limited model zoo. This is positive finding for practical applicability—CAPE doesn't require massive model zoos to work."
      implications: "Lower barrier to entry for researchers. Can validate cross-architecture methods with hundreds of models, not thousands. Phase 5 full-scale (400 models, 100 epochs) will test whether findings generalize."
      source: "045_validated_hypothesis.md Section 4.2 Finding 3"

