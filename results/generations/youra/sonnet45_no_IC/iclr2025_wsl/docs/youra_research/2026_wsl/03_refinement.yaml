# SECTION 2: Experimental Setup Selection
# ═══════════════════════════════════════════════════════════════
experimental_setup:
  dataset:
    name: "HuggingFace Model Hub - ImageNet Vision Models"
    type: "standard"
    source: "HuggingFace (huggingface.co/models), filtered for ImageNet-1K trained models"
    path: "4 architecture families: ResNet-50 (100 models), ViT-Base (100 models), MobileNetV2 (100 models), EfficientNet-B0 (100 models). Total: 400 models."
    hypothesis_fit: "Provides required architectural diversity (CNN vs Transformer vs efficient) and model count (100 per family) for robust cross-architecture learning. ImageNet top-1 accuracy from model cards serves as continuous ground truth property."

  model:
    name: "CAPE - Cross-Architecture Parameterized Encoder"
    type: "Modular weight-space encoder with 3 components: (1) Operation-specific encoders (conv: SANE tokenization, attention: UNF equivariance, MLP: standard), (2) Contrastive projection (InfoNCE, d_z=256), (3) Architecture GNN residual (z_arch ∈ R^64)"
    source: "Custom implementation combining UNF Algorithm 1, SANE window-based tokenization, SNE Set Transformers, standard contrastive learning"
    hypothesis_fit: "Decomposes architectural differences into learnable components (operation-specific + graph topology), addresses Prof. Pax's incommensurability via modular design, Prof. Vera's falsifiability via ablation, Prof. Rex's alignment via contrastive projection."

  baselines:
    - name: "SNE Set-Encoding Baseline"
      method: "Hierarchical set encoding (chunk → layer → network) via Set Transformers, Logit Invariance for symmetry learning, chunking to c=256"
      performance: "ResNet→ViT: ρ=0.54 (published result from Andreis et al. 2023)"

    - name: "SANE Tokenization Baseline"
      method: "Window-based sequential encoding, 3D positional encoding, contrastive learning on same-family models only"
      performance: "ResNet-18→ResNet-50: +2.2% over scratch (same-family transfer), cross-family capability unknown"

    - name: "Operation-Agnostic Statistics"
      method: "Layer-wise mean, std, spectral norms (Unterthiner et al. approach)"
      performance: "Expected ρ < 0.40 cross-architecture (weak baseline per SNE paper)"

# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════
novelty:
  preserved_novelty: "First architecture-parameterized weight-space learning framework - treats architectural differences as learnable signals, not noise to be invariant to. Paradigm shift from architecture-invariance to architecture-conditioning."

  key_innovation: "Modular operation encoders with contrastive task alignment: Respects mathematical operation differences (conv vs attention) while creating unified embedding space via shared task objectives. Combines UNF's theoretical equivariance, SNE's cross-architecture empirics, SANE's scalability into single framework."

  differentiation:
    - prior_work: "UNF (Zhou et al. 2024)"
      difference: "UNF provides permutation-equivariance construction (Algorithm 1) but no empirical cross-architecture validation. CAPE applies UNF's equivariance to attention encoders while adding conv/MLP branches + contrastive alignment for practical cross-family transfer."

    - prior_work: "SNE (Andreis et al. 2023)"
      difference: "SNE uses set-encoding that loses architectural specificity via chunking. CAPE uses modular encoders that preserve operation-specific structure (conv tokenization, attention equivariance) while achieving cross-architecture capability via contrastive alignment."

    - prior_work: "SANE (Schürholt et al. 2024)"
      difference: "SANE demonstrates same-family transfer (ResNet-18→50) but requires shared token size d_t for cross-architecture. CAPE removes this constraint via operation-specific encoders + contrastive projection to shared space, enabling true cross-family transfer (ResNet→ViT)."

