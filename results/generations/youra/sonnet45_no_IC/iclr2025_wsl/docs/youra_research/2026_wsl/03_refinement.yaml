# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════
established_facts:
  claims:
    - claim: "UNF's permutation-equivariance is architecture-agnostic by construction (Theorem 3.2)"
      status: "BUILD_ON"
      evidence: "Zhou et al. 2024, Algorithm 1 constructs equivariant bases for any weight space"
    - claim: "SNE achieves ρ=0.54 for ResNet→ViT cross-architecture property prediction"
      status: "BUILD_ON"
      evidence: "Andreis et al. 2023, first empirical validation of CNN→Transformer transfer"
    - claim: "SANE demonstrates same-family transfer (ResNet-18→50: +2.2% over scratch)"
      status: "BUILD_ON"
      evidence: "Schürholt et al. 2024, proves weight statistics encode architecture-specific information"
    - claim: "Cross-architecture performance degrades 33% (ρ=0.81 within → ρ=0.54 cross)"
      status: "PROVE_NEW"
      evidence: "SNE paper establishes baseline; improvement to ρ ≥ 0.65 is NEW claim"
    - claim: "Architectural signal exists in weights beyond task information"
      status: "PROVE_NEW"
      evidence: "Inferred from SANE same-family transfer; requires explicit signal-existence test (Prof. Rex's binary classifier)"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    Build on established UNF/SNE/SANE components (don't re-prove equivariance or set encoding).
    Focus validation on NEW claims: (1) modular encoding improves over SNE baseline,
    (2) contrastive alignment creates metric space, (3) architectural signal is learnable.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════
core_statement:
  hypothesis_id: "H-CAPE-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under HuggingFace model zoos (ResNet, ViT, MobileNet, EfficientNet trained on ImageNet),
    if we apply modular operation encoders (conv/attention/MLP-specific) with contrastive
    task alignment (InfoNCE, project to shared d_z=256 space) and architecture-residual
    graph embeddings (GNN on computation graph added as residual),
    then cross-architecture property prediction correlation will reach ρ ≥ 0.65
    (35% gap closure toward within-architecture ρ=0.81),
    because architectural structure decomposes into operation-specific signals (conv vs attention
    weight statistics) and graph topology, which are alignable via shared task objectives
    (ImageNet classification pulls same-task models together in embedding space).
  alternative_hypothesis_h0: |
    There is no significant difference in cross-architecture property prediction correlation
    between the modular architecture-parameterized encoder (H-CAPE) and the SNE set-encoding
    baseline (H0: ρ_CAPE - ρ_SNE ≤ 0.05, i.e., improvement is negligible).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════
variables:
  independent:
    - name: "Embedding Method"
      type: "categorical"
      operationalization: "4 levels: (1) Baseline (SNE set-encoding), (2) Modular-Only (op-specific encoders, no alignment), (3) Contrastive-Aligned (op-encoders + InfoNCE projection), (4) Full CAPE (modular + contrastive + GNN residual)"
      levels: ["SNE-Baseline", "Modular-Only", "Contrastive-Aligned", "Full-CAPE"]
  dependent:
    - name: "Cross-Architecture Property Prediction Correlation"
      type: "continuous"
      operationalization: "Spearman ρ between predicted and actual ImageNet top-1 accuracy on held-out test set (30% of each architecture family), measured on ResNet→ViT, ResNet→MobileNet, ViT→EfficientNet transfer pairs"
      primary: true
    - name: "Embedding Distance vs Transfer Difficulty Correlation"
      type: "continuous"
      operationalization: "Spearman ρ between embedding L2 distance and cross-architecture transfer performance degradation (measured across 6 architecture pairs)"
      primary: false
    - name: "Triangle Inequality Violation Rate"
      type: "continuous"
      operationalization: "Percentage of architecture triplets where d(A,C) > d(A,B) + d(B,C) + 0.15·max(d) (15% tolerance threshold)"
      primary: false
  controlled:
    - name: "Model Zoo Size"
      operationalization: "Fixed at 100 models per architecture (ResNet-50, ViT-Base, MobileNetV2, EfficientNet-B0)"
    - name: "Ground Truth Property"
      operationalization: "ImageNet top-1 accuracy from published HuggingFace model cards"
    - name: "Train/Test Split"
      operationalization: "70% training, 30% held-out test per architecture, stratified by accuracy quantiles"
    - name: "Contrastive Loss Hyperparameters"
      operationalization: "InfoNCE temperature τ=0.07, projection dimensionality d_z=256 (per SANE)"
    - name: "Architecture Graph Encoding"
      operationalization: "GCN with 3 layers, final embedding z_arch ∈ R^64, added as residual"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Operation-specific encoders extract architecture-aware weight representations: Conv weights → SANE tokenization (reshape to R^(c_out × c_r), chunk to d_t=256, window-based encoding), Attention weights → UNF permutation-equivariant encoding (Algorithm 1 valid partition enumeration), MLP weights → standard equivariant encoding. Each encoder produces operation embedding z_op ∈ R^h."
      evidence: "SANE demonstrates tokenization scales to ResNet-101 (Exchange 9 cites 44M params). UNF Theorem 3.2 proves constructed layer is equivariant and spans all S-equivariant linear maps. SNE shows chunking handles mixed architectures (Exchange 3 challenges, Exchange 5 addresses with separate branches)."
      falsifier: "If operation encoders produce identical embeddings for conv vs attention weights from same-task models (cosine similarity > 0.95), operation-specific structure is not captured."

    - step: 2
      description: "Contrastive task alignment projects operation embeddings into shared metric space: All z_op → linear projection → shared d_z=256 space. InfoNCE loss (τ=0.07) pulls same-task models together (ImageNet classifiers) and pushes different-task apart, forcing projection to learn task-aligned space where operation type becomes meaningful perturbation."
      evidence: "Dr. Nova's proposal (Exchange 7): contrastive projection addresses Prof. Rex's alignment problem (Exchange 6). SANE uses NTXent contrastive loss successfully. SNE's insight: mixed-architecture training improves generalization."
      falsifier: "If contrastive-aligned embeddings collapse (intra-architecture variance < 0.1 while inter-task variance > 0.5), projection loses architectural information despite task alignment."

    - step: 3
      description: "Architecture graph residual adds topological information: Computation graph (nodes=operations, edges=data flow) → GCN (3 layers) → z_arch ∈ R^64. Added as residual to contrastive-aligned embeddings: z_final = z_contrastive + α·z_arch (α learnable). If GNN fails to generalize (out-of-distribution graph structures), residual degrades to zero, preserving contrastive-only model."
      evidence: "Prof. Pax's concern (Exchange 3): ResNet sequential graphs vs ViT dense graphs are incommensurable. Solution (Exchange 5+7): position GNN as non-critical residual. If GNN generalizes, it adds graph topology signal; if not, model gracefully degrades."
      falsifier: "If GNN residual α → 0 during training OR adding z_arch decreases performance vs contrastive-only baseline, architecture graph encoding is useless."

  key_tension: "Operation-specific encoding vs cross-operation alignment: Modular branches respect mathematical structure differences (Prof. Pax's feasibility requirement), but require contrastive projection to align heterogeneous embeddings (Prof. Rex's challenge). Resolution: shared task objective (ImageNet classification) provides alignment signal."

  evidence_summary: |
    Mechanism builds on three validated components: (1) SANE tokenization (Exchange 9: scales to 44M params),
    (2) UNF equivariance (Exchange 2: Theorem 3.2 proves completeness), (3) SNE cross-architecture
    capability (Exchange 4: ρ=0.54 baseline establishes feasibility). Contrastive alignment (Exchange 7)
    resolves the alignment gap. 4-level ablation (Exchange 8) isolates each component's contribution.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════
key_assumptions:
  - id: "A1"
    assumption: "Operation-specific weight signals exist and are distinguishable beyond tensor dimensions (conv vs attention statistics differ systematically across ImageNet-trained models)"
    supporting_evidence: "SANE same-family transfer (ResNet-18→50: +2.2%) proves weight statistics encode architecture-specific information beyond task. Prof. Rex's signal-existence test (Exchange 9): binary classifier should achieve ≥ 80% accuracy distinguishing ResNet vs ViT from operation-agnostic statistics."
    consequence_if_violated: "If signal doesn't exist (classifier < 70%), modular encoding reduces to SNE set-encoding, and hypothesis collapses to baseline performance (no improvement)."

  - id: "A2"
    assumption: "Contrastive task alignment creates a metric space where embedding distance reflects architectural similarity (not just task similarity)"
    supporting_evidence: "InfoNCE loss with same-task attraction + different-task repulsion (SANE's validated approach). SNE's mixed-architecture training insight: training on ResNet+MobileNet improves ViT transfer."
    consequence_if_violated: "If contrastive space collapses (all ImageNet models cluster to single point) OR distance doesn't correlate with transfer difficulty (P2 fails: ρ < 0.5), architectural structure is not preserved in alignment."

  - id: "A3"
    assumption: "Architecture graph topology (computation graph structure) contains learnable information beyond operation-level weight statistics"
    supporting_evidence: "ResNet's sequential+skip topology vs ViT's dense intra-layer attention creates fundamentally different data flow patterns. GNN as residual provides graceful degradation if assumption fails."
    consequence_if_violated: "If GNN residual α → 0 OR adding z_arch decreases performance, simplify to contrastive-only model (2-component instead of 3-component encoder)."

  - id: "A4"
    assumption: "HuggingFace model hub provides sufficient architectural diversity (4 families: ResNet, ViT, MobileNet, EfficientNet) and model count (100 per family) for robust cross-architecture learning"
    supporting_evidence: "SNE paper uses similar model zoo sizes for cross-architecture evaluation. SANE trains on 100-model zoos successfully."
    consequence_if_violated: "If 400 models insufficient (high variance in ρ estimates, wide confidence intervals > ±0.1), expand to larger model sets (Timm library provides 1000+ models)."

  - id: "A5"
    assumption: "ImageNet top-1 accuracy from published model cards is accurate and unbiased ground truth for property prediction task"
    supporting_evidence: "HuggingFace model cards are community-validated, SNE paper uses same ground truth source"
    consequence_if_violated: "If model card accuracies are noisy (measurement error > 2% absolute), switch to re-evaluated accuracies on standardized ImageNet validation set."

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════
scope:
  applies_to: |
    - Image classification architectures (ResNet, ViT, MobileNet, EfficientNet) trained on ImageNet
    - Model zoos with 25M-100M parameter models (SANE's validated range)
    - Property prediction tasks with continuous ground truth (accuracy, loss, performance metrics)
    - Architectures decomposable into conv/attention/MLP operations (covers 90%+ of HuggingFace vision models)

  does_not_apply_to: |
    - Non-vision domains (NLP, speech) without validating operation encoders for those modalities
    - Architectures with exotic operations (capsule networks, neural ODEs) not in the conv/attention/MLP vocabulary
    - Model zoos < 50 models per architecture (insufficient for robust contrastive learning)
    - Discrete property prediction (architecture family labels) - hypothesis focuses on continuous regression
    - Billion-parameter models (>1B params) - SANE's largest validation is ResNet-101 (44M params)

  known_limitations: |
    - Cross-architecture validation limited to vision domain (ResNet/ViT/MobileNet empirics only)
    - GNN generalization to unseen graph topologies uncertain (mitigated by residual positioning)
    - Contrastive collapse risk if all same-task models cluster (mitigated by diversity loss monitoring)
    - Operation vocabulary is hand-coded (conv/attention/MLP) - not learned from data

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════
predictions:
  - id: "P1"
    primary: true
    statement: "Full CAPE model (modular + contrastive + GNN residual) achieves Spearman ρ ≥ 0.65 on ResNet→ViT cross-architecture property prediction, compared to SNE baseline ρ=0.54"
    test_method: "Train CAPE on 70% of ResNet-50+ViT-Base+MobileNetV2+EfficientNet-B0 models (280 models total, mixed-architecture training). Test on held-out 30% ViT-Base models (30 models). Measure Spearman correlation between predicted and actual ImageNet top-1 accuracy."
    success_criterion: "ρ_CAPE ≥ 0.65 AND ρ_CAPE - ρ_SNE ≥ 0.10 (improvement is statistically significant, p < 0.05 via permutation test)"
    falsification: "If ρ_CAPE < 0.60 OR ρ_CAPE - ρ_SNE < 0.05, modular architecture-parameterized encoding provides no meaningful improvement over set-based baseline."

  - id: "P2"
    primary: false
    statement: "Embedding L2 distance in CAPE space predicts cross-architecture transfer difficulty: architectures with larger embedding distance show greater transfer performance degradation"
    test_method: "Compute embedding centroids for each architecture family (ResNet, ViT, MobileNet, EfficientNet) on training set. Measure pairwise L2 distances. Measure transfer performance degradation for all 6 architecture pairs (train on A's training set, test on B's test set, compute ρ_transfer). Correlate embedding distance with (ρ_within - ρ_transfer)."
    success_criterion: "Spearman correlation between embedding distance and transfer degradation: ρ ≥ 0.7"
    falsification: "If ρ < 0.5, embedding distance does not reflect architectural similarity - metric space interpretation invalid."

  - id: "P3"
    primary: false
    statement: "CAPE embedding space satisfies approximate metric properties: triangle inequality violations are rare (< 15% of architecture triplets)"
    test_method: "For all architecture triplets (A, B, C) from {ResNet, ViT, MobileNet, EfficientNet}, compute embedding centroid distances d(A,B), d(B,C), d(A,C). Count violations: d(A,C) > d(A,B) + d(B,C) + 0.15·max(d(A,B), d(B,C), d(A,C)). 4 architectures → 4 triplets total."
    success_criterion: "Violation rate ≤ 15% (≤ 1 violation out of 4 triplets)"
    falsification: "If violation rate > 30%, embedding space lacks metric structure - architectural distance is not well-defined."

