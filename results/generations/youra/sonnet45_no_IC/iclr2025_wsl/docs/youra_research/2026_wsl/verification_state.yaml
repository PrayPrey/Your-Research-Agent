hypotheses:
- id: H-E1
  title: Operation-Specific Weight Signal Existence
  type: EXISTENCE
  statement: Under ImageNet-trained model zoos (ResNet-50 vs ViT-Base), if operation-specific weight signals exist beyond
    tensor dimensions, then a binary classifier trained on operation-agnostic statistics (layer norms, spectral norms) will
    achieve ≥80% accuracy distinguishing ResNet from ViT.
  gate_type: MUST_WORK
  status: TODO
  prerequisites: []
  success_criteria: &id001
    primary: Binary classifier test accuracy ≥80%
    secondary: Norms+spectral accuracy > norms-only by ≥5%
    statistical: p < 0.05 vs random baseline (50%)
  fail_action: ABANDON modular encoder approach, fall back to SNE set-encoding baseline
  source: Phase 2A Section 1.4 (Assumption A1), Section 5 (SH1)
- id: H-M-Integrated
  title: Full CAPE Mechanism Validation
  type: MECHANISM
  statement: Under HuggingFace model zoos (400 models), if we implement the 3-component CAPE encoder (operation-specific encoders
    → contrastive projection → GNN residual), then cross-architecture property prediction correlation will reach ρ ≥0.65 on
    ResNet→ViT transfer.
  gate_type: MUST_WORK
  status: TODO
  prerequisites:
  - H-E1
  success_criteria: &id002
    primary: Full-CAPE achieves ρ ≥0.65 on ResNet→ViT
    statistical: ρ_CAPE - ρ_SNE ≥0.10 with p < 0.05
    diagnostic_1: Operation embedding similarity <0.95
    diagnostic_2: Intra-architecture variance ≥0.1
    diagnostic_3: GNN residual α >0.1 OR performance with GNN ≥ without GNN
  fail_action: PIVOT to simpler encoder (Contrastive-Aligned without GNN)
  partial_action: EXPLORE hyperparameter tuning or larger model zoo
  source: Phase 2A Section 1.3 (Causal Mechanism), Section 1.6 (Prediction P1)
  component_falsifiers: &id003
  - component: Operation Encoders
    falsifier: Cosine similarity conv vs attention >0.95
    action: Modular encoding fails
  - component: Contrastive Alignment
    falsifier: Intra-architecture variance <0.1 OR distance-transfer correlation ρ<0.5
    action: Alignment fails to preserve architectural structure
  - component: GNN Residual
    falsifier: α→0 OR adding z_arch decreases performance
    action: Degrade to Contrastive-Aligned variant
dependencies:
  execution_order:
