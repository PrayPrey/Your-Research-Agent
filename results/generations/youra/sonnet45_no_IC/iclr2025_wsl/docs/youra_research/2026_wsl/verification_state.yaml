experimental_setup:
  dataset:
    name: HuggingFace Model Hub - ImageNet Vision Models
    type: standard
    source: HuggingFace (huggingface.co/models), filtered for ImageNet-1K
    path: 4 architectures × 100 models = 400 total
    architectures:
    - ResNet-50
    - ViT-Base
    - MobileNetV2
    - EfficientNet-B0
  model:
    name: CAPE - Cross-Architecture Parameterized Encoder
    type: Modular weight-space encoder (3 components)
    components:
    - 'Operation-specific encoders (conv: SANE tokenization, attention: UNF equivariance, MLP: standard)'
    - Contrastive projection (InfoNCE, τ=0.07, d_z=256)
    - Architecture GNN residual (3-layer GCN, z_arch∈R^64)
  baselines:
  - name: SNE Set-Encoding
    performance: 'ResNet→ViT: ρ=0.54'
  - name: SANE Tokenization
    performance: 'ResNet-18→50: +2.2% (same-family)'
  - name: UNF Permutation-Equivariance
    performance: 10-15% improvement over non-equivariant
key_assumptions:
- id: A1
  assumption: Operation-specific weight signals exist and are distinguishable
  tested_by: H-E1
- id: A2
  assumption: Contrastive task alignment creates metric space
  tested_by: H-M-Integrated (Diagnostic 2)
- id: A3
  assumption: Architecture graph topology contains learnable information
  tested_by: H-M-Integrated (Diagnostic 3)
- id: A4
  assumption: HuggingFace provides sufficient architectural diversity
  tested_by: H-M-Integrated (variance check)
- id: A5
  assumption: ImageNet top-1 accuracy from model cards is accurate
  tested_by: All hypotheses (ground truth)
scope_reduction:
  percentage: 40
  build_on_claims:
  - UNF's permutation-equivariance is architecture-agnostic (Theorem 3.2)
  - SNE achieves ρ=0.54 for ResNet→ViT cross-architecture prediction
  prove_new_claims:
  - Modular encoding improves over SNE baseline
  - Contrastive alignment creates metric space
  - Architectural signal is learnable
