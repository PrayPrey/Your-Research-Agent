hypothesis_draft:
  title: "RAG-Specific Corpus Curation via Retrieval-Quality Classifiers"
  hypothesis_id: "H-RAGCuration-v1"
  core_claim: |
    Retrieval-optimal corpus curation measurably diverges from pretraining-optimal curation.
    A factorized ensemble of specialist retrieval-quality classifiers (trained on stratified BEIR
    success examples) produces corpora that achieve ≥3% higher Recall@10 on factoid QA compared
    to perplexity-based filtering, demonstrating that task-specific quality dimensions (factual
    density, entity coverage) improve retrieval utility independent of pretraining fluency.
  mechanism: |
    (1) Retrieval-quality classifier learns factual density/entity coverage via positive examples
    (successful BEIR retrievals stratified by low educational score) vs negative examples (failed retrievals);
    (2) High-density documents improve semantic query retrieval (+4% vs +1% lexical) because they
    contain information in multiple phrasings; (3) Factorized multi-classifier approach preserves
    diversity (pairwise similarity <0.6); (4) Retrieval-optimal diverges from pretraining-optimal
    (overlap <60%, divergent subset contributes ≥2% Recall gain).
  predictions:
    - P1: "≥3% Recall@10 improvement (retrieval filter vs perplexity baseline, 1M doc corpus)"
    - P2: "<60% overlap with educational filter, divergent subset contributes ≥2% Recall gain"
    - P3: "+4% semantic query gain vs +1% lexical query gain (differential quality signal)"

variables_summary:
  independent: "Filtering Strategy (Perplexity | Educational | Retrieval-Quality)"
  dependent_primary: "Recall@10 on BEIR Natural Questions (10K queries, DPR indexing)"
  controlled: "Corpus Size (1M docs), Common Crawl source (100K sample), Retrieval Model (DPR)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in Recall@10 between retrieval-quality filtered and
    perplexity-filtered corpora when corpus size is held constant at 1M documents.
  statistical_test: "Two-tailed t-test (α=0.05, power=0.80, 3-5 replications)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Factorized specialist classifier ensemble targeting retrieval-specific quality dimensions independent of pretraining quality, validated via stratified training"
  differentiation_summary: |
    Extends DataComp-LM/FineWeb methodology to retrieval-specific context. Demonstrates data quality
    is task-specific and multi-dimensional. Provides meta-contribution: systematic characterization
    framework for RAG filtering strategies (analogous to DataComp-LM's benchmark role for pretraining).

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "DPR (Dense Passage Retriever) for indexing and retrieval"
    - "GPT-2 for perplexity baseline computation"
    - "FastText for retrieval-quality classifier (bigram model)"
  datasets:
    - "BEIR Natural Questions (test set, ~3.5K queries)"
    - "Common Crawl (100K document held-out sample for filtering)"
  baselines:
    - "Perplexity-based filtering (GPT-2 threshold)"
    - "FineWeb-Edu style educational quality filtering"
    - "Unfiltered random sample"

measurement_plan:
  data_collection:
    - source: "Common Crawl 100K document sample"
    - source: "BEIR Natural Questions test queries"
    - source: "BEIR relevance annotations for classifier training"
  procedure:
    - step: "Train retrieval-quality classifier on stratified BEIR examples (oversample low-educational, high-BEIR)"
    - step: "Apply three filtering methods to Common Crawl sample (Perplexity, Educational, Retrieval)"
    - step: "Index each 1M-document corpus with DPR"
    - step: "Measure Recall@10 on Natural Questions test set"
    - step: "Compute corpus divergence (overlap between top-50K selections)"
    - step: "Split queries by BM25 success (lexical vs semantic) and measure differential gains"
    - step: "Measure diversity (average pairwise SBERT similarity)"
    - step: "Statistical test: 3-5 replications, two-tailed t-test, α=0.05"
  success_criteria:
    - "P1: Recall@10_retrieval ≥ Recall@10_perplexity + 0.03, p<0.05"
    - "P2: Overlap <60% AND divergent subset Recall gain ≥0.02"
    - "P3: Δ semantic ≥0.04 AND Δ lexical ≤0.01"

validation:
  internal_validity:
    - "Control corpus size (1M docs) across all conditions to isolate filtering effect"
    - "Use same Common Crawl sample for all filters to eliminate source variation"
    - "Fix DPR architecture to control for retrieval model effects"
    - "Measure BM25 baseline scores to control for retrieval difficulty confound"
    - "Verify coverage vs quality failures via answer string search (avoid coverage gap confound)"
  external_validity:
    - "Natural Questions derived from Wikipedia, well-covered in Common Crawl (addresses coverage assumption)"
    - "Factoid QA is common RAG use case (entity lookup, knowledge retrieval)"
    - "DPR is standard dense retrieval architecture used in production RAG systems"
    - "Scope limited to factoid QA; generalization to other retrieval modes requires further validation"

discussion_synthesis:
  key_insights:
    - "Data quality is task-specific and multi-dimensional, not monolithic (quality/coverage/diversity)"
    - "Retrieval utility values factual density/entity coverage over narrative fluency (pretraining utility)"
    - "Stratified training (oversample low-educational, high-retrieval examples) explicitly targets divergence"
    - "Factorized multi-classifier approach balances quality optimization with diversity preservation"
  breakthrough_moments:
