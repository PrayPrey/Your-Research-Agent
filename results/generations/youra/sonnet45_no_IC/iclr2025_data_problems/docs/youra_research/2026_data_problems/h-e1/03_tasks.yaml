# Implementation Tasks for h-e1
# Generated: 2026-07-12
# Hypothesis: h-e1 (EXISTENCE)
# Tier: LIGHT (≤15 tasks)
# Epic Tasks: 6 | Subtasks: 5 | Total: 11

metadata:
  hypothesis_id: h-e1
  hypothesis_type: EXISTENCE
  tier: LIGHT
  budget_max: 15
  total_tasks: 11
  generated_date: "2026-07-12"
  source_documents:
    - 03_prd.md
    - 03_architecture.md
    - 03_logic.md
    - 03_config.md

# Task Priority Groups (execution order)
task_groups:
  - name: data_preparation
    priority: 1
    tasks: [T-DATA-1]
  - name: environment_setup
    priority: 2
    tasks: [T-ENV-1]
  - name: implementation
    priority: 3
    tasks: [T-A1, T-A2, T-A3, T-A4, T-A5, T-A6]
  - name: subtasks
    priority: 4
    tasks: [T-A1-1, T-A3-1, T-A5-1, T-A5-2]

tasks:
  # ============================================
  # Data Preparation Tasks
  # ============================================

  T-DATA-1:
    id: T-DATA-1
    type: data_preparation
    priority: 100
    title: "Download BEIR Natural Questions and Sample Common Crawl"
    description: |
      Download evaluation dataset and corpus source:
      1. BEIR Natural Questions test split (~3,500 queries)
      2. Sample 100K documents from Common Crawl CC-MAIN-2024-10

    acceptance_criteria:
      - BEIR NQ downloaded to data/beir/nq/
      - Common Crawl sample saved to data/cc_sample/
      - Total size: ~600MB

    reference_files:
      - file: 03_prd.md
        sections: ["FR-1: Dataset Acquisition and Preprocessing"]
      - file: 03_logic.md
        sections: ["Module 1: Data Loader"]

    estimated_effort: "2 hours"
    depends_on: []
    blocks: [T-A1]

  # ============================================
  # Environment Setup Tasks
  # ============================================

  T-ENV-1:
    id: T-ENV-1
    type: environment_setup
    priority: 95
    title: "Setup Python Environment with Dependencies"
    description: |
      Install required packages:
      - transformers (DPR, GPT-2)
      - beir (evaluation framework)
      - fasttext (classifier)
      - faiss-cpu or faiss-gpu (dense retrieval)
      - warcio (Common Crawl parsing)
      - matplotlib, seaborn (visualization)

    acceptance_criteria:
      - requirements.txt created
      - All packages installed successfully
      - Import tests pass

    reference_files:
      - file: 03_prd.md
        sections: ["Dependencies and Integration"]
      - file: 03_config.md
        sections: ["Python Environment"]

    estimated_effort: "1 hour"
    depends_on: []
    blocks: [T-A1, T-A2, T-A3, T-A4, T-A5, T-A6]

  # ============================================
  # Epic Implementation Tasks
  # ============================================

  T-A1:
    id: T-A1
    epic_id: A-1
    type: implementation
    priority: 90
    title: "Data Acquisition Module"
    description: |
      Implement BEIR loader and Common Crawl sampler.

      Components:
      - BEIRLoader class (download, load corpus/queries/qrels)
      - CommonCrawlSampler class (sample, preprocess)
      - Stratified training data extraction for classifier

    acceptance_criteria:
      - BEIR NQ corpus, queries, qrels loaded
      - Common Crawl 100K documents sampled
      - Preprocessing pipeline (HTML→text, dedup, filters) implemented
      - Stratified training data (10K positive, 10K negative) extracted

    complexity: 10

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-1: Data Acquisition (Complexity: 10)"]
      - file: 03_logic.md
        sections: ["Module 1: Data Loader"]
      - file: 03_config.md
        sections: ["Task A-1: Data Acquisition Configuration"]

    estimated_effort: "4 hours"
    depends_on: [T-DATA-1, T-ENV-1]
    blocks: [T-A2, T-A3]

  T-A1-1:
    id: T-A1-1
    parent_epic: A-1
    type: subtask
    priority: 89
    title: "Stratified Training Data Extraction"
    description: |
      Extract stratified training examples from BEIR corpus:
      - Positive: High BEIR relevance (score >= 1)
      - Negative: Low BEIR relevance (score == 0)
      - Stratification: Oversample low-perplexity positives (2:1 ratio)

    acceptance_criteria:
      - 10K positive examples extracted
      - 10K negative examples extracted
      - Stratification ratio verified
      - FastText format file created

    reference_files:
      - file: 03_logic.md
        sections: ["1.1 BEIR Loader - extract_stratified_training_data"]

    estimated_effort: "2 hours"
    depends_on: [T-A1]
    blocks: [T-A3]

  T-A2:
    id: T-A2
    epic_id: A-2
    type: implementation
    priority: 85
    title: "Baseline Corpus (Perplexity Filtering)"
    description: |
      Implement perplexity-based baseline corpus creation.

      Components:
      - PerplexityBaseline class
      - GPT-2 perplexity computation
      - Top-1M document selection

    acceptance_criteria:
      - GPT-2 model loaded
      - Perplexity scores computed for all 100K documents
      - Top 1M documents selected (lowest perplexity)
      - Baseline corpus saved to data/baseline_corpus/

    complexity: 9

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-2: Baseline Corpus (Complexity: 9)"]
      - file: 03_logic.md
        sections: ["Module 2: Perplexity Filter"]
      - file: 03_config.md
        sections: ["Task A-2: Baseline Corpus Configuration"]

    estimated_effort: "3 hours"
    depends_on: [T-A1, T-ENV-1]
    blocks: [T-A5]

  T-A3:
    id: T-A3
    epic_id: A-3
    type: implementation
    priority: 80
    title: "Retrieval-Quality Classifier Training"
    description: |
      Train FastText classifier on stratified BEIR examples.

      Components:
      - RetrievalQualityClassifier class
      - FastText training (dim=100, lr=0.1, epoch=25)
      - Model saving

    acceptance_criteria:
      - Training data prepared (FastText format)
      - Classifier trained successfully
      - Validation accuracy > 0.7
      - Model saved to models/retrieval_quality_classifier.bin

    complexity: 11

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-3: Classifier Training (Complexity: 11)"]
      - file: 03_logic.md
        sections: ["Module 3: Retrieval-Quality Classifier"]
      - file: 03_config.md
        sections: ["Task A-3: Classifier Training Configuration"]

    estimated_effort: "4 hours"
    depends_on: [T-A1-1, T-ENV-1]
    blocks: [T-A4]

  T-A3-1:
    id: T-A3-1
    parent_epic: A-3
    type: subtask
    priority: 79
    title: "FastText Model Training and Validation"
    description: |
      Execute FastText training and validate model performance:
      - Train with stratified data
      - Validate on held-out BEIR examples
      - Ensure accuracy > 0.7

    acceptance_criteria:
      - Model training completes without errors
      - Validation accuracy computed
      - Model achieves > 0.7 accuracy

    reference_files:
      - file: 03_logic.md
        sections: ["RetrievalQualityClassifier.train()"]

    estimated_effort: "1.5 hours"
    depends_on: [T-A3]
    blocks: [T-A4]

  T-A4:
    id: T-A4
    epic_id: A-4
    type: implementation
    priority: 75
    title: "Proposed Corpus (Retrieval-Quality Filtering)"
    description: |
      Apply trained classifier to create retrieval-quality filtered corpus.

      Components:
      - Quality score prediction for all documents
      - Threshold calibration for 1M corpus
      - Top-1M document selection

    acceptance_criteria:
      - Quality scores computed for 100K documents
      - Threshold determined for 1M target
      - Proposed corpus saved to data/proposed_corpus/
      - 1M documents selected

    complexity: 8

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-4: Proposed Corpus (Complexity: 8)"]
      - file: 03_logic.md
        sections: ["RetrievalQualityClassifier.filter_corpus"]
      - file: 03_config.md
        sections: ["Task A-4: Proposed Corpus Configuration"]

    estimated_effort: "3 hours"
    depends_on: [T-A3-1, T-ENV-1]
    blocks: [T-A5]

  T-A5:
    id: T-A5
    epic_id: A-5
    type: implementation
    priority: 70
    title: "Retrieval Evaluation (DPR + Recall@10)"
    description: |
      Evaluate both corpora using DPR and compute Recall@10.

      Components:
      - DPRRetriever class (question/context encoders)
      - FAISS index building
      - RecallEvaluator class
      - Recall@10 computation for both corpora

    acceptance_criteria:
      - DPR encoders loaded
      - Both corpora indexed with FAISS
      - Recall@10 computed for baseline corpus
      - Recall@10 computed for proposed corpus
      - Comparison results saved to results/recall_comparison.json

    complexity: 12

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-5: Retrieval Evaluation (Complexity: 12)"]
      - file: 03_logic.md
        sections: ["Module 4: Retrieval Evaluator"]
      - file: 03_config.md
        sections: ["Task A-5: Retrieval Evaluation Configuration"]

    estimated_effort: "5 hours"
    depends_on: [T-A2, T-A4, T-ENV-1]
    blocks: [T-A6]

  T-A5-1:
    id: T-A5-1
    parent_epic: A-5
    type: subtask
    priority: 69
    title: "DPR Encoding and FAISS Indexing"
    description: |
      Encode both corpora and build FAISS indices:
      - Encode baseline corpus (1M docs → 768-dim embeddings)
      - Encode proposed corpus (1M docs → 768-dim embeddings)
      - Build FAISS cosine similarity indices

    acceptance_criteria:
      - Both corpora encoded successfully
      - FAISS indices created and saved
      - Index sizes verified (~2GB total)

    reference_files:
      - file: 03_logic.md
        sections: ["DPRRetriever.encode_corpus", "DPRRetriever.build_index"]

    estimated_effort: "2 hours"
    depends_on: [T-A5]
    blocks: [T-A5-2]

  T-A5-2:
    id: T-A5-2
    parent_epic: A-5
    type: subtask
    priority: 68
    title: "Recall@10 Computation and Gate Validation"
    description: |
      Compute Recall@10 for both methods and check gate:
      - Retrieve top-10 for all test queries (both corpora)
      - Compute Recall@10 metric
      - Compare against gate threshold (+0.03)

    acceptance_criteria:
      - Recall@10 computed for both methods
      - Delta calculated (proposed - baseline)
      - Gate condition checked (≥ +0.03)
      - PoC pass verified (proposed > baseline)

    reference_files:
      - file: 03_logic.md
        sections: ["RecallEvaluator.compute_recall_at_k", "RecallEvaluator.compare_methods"]

    estimated_effort: "2 hours"
    depends_on: [T-A5-1]
    blocks: [T-A6]

  T-A6:
    id: T-A6
    epic_id: A-6
    type: implementation
    priority: 65
    title: "Visualization and Reporting"
    description: |
      Generate 4 required figures and metrics report.

      Components:
      - ExperimentVisualizer class
      - Figure 1: Recall comparison bar chart
      - Figure 2: Quality score distribution
      - Figure 3: Corpus statistics comparison
      - Figure 4: Query-level performance scatter

    acceptance_criteria:
      - All 4 figures generated
      - Saved to figures/ in PNG and PDF (300 DPI)
      - Metrics summary report created

    complexity: 8

    reference_files:
      - file: 03_architecture.md
        sections: ["### A-6: Visualization (Complexity: 8)"]
      - file: 03_logic.md
        sections: ["Module 5: Visualization"]
      - file: 03_config.md
        sections: ["Task A-6: Visualization Configuration"]

    estimated_effort: "3 hours"
    depends_on: [T-A5-2, T-ENV-1]
    blocks: []

