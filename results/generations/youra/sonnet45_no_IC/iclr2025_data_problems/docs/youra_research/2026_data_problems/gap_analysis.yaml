gaps:
  - id: gap-1-rag-curation
    title: "RAG-Specific Data Curation"
    priority: HIGH
    relevance: PRIMARY
    description: |
      Pretraining curation well-researched (DataComp-LM, FineWeb), but RAG-specific
      strategies underexplored. How do filtering/mixing strategies differ for RAG
      retrieval corpora vs. pretraining? Optimal quality metrics for inference-time retrieval?
    impact: HIGH
    evidence:
      scholar_papers: 5
      archon_kb_entries: 2
    hypothesis_direction: |
      Compare filtering strategies (perplexity, quality classifiers, diversity metrics)
      for RAG corpus construction using existing datasets (e.g., BEIR benchmark).
    related_papers:
      - title: "DataComp-LM"
        arxiv_id: "2406.11794"
        citations: 368
        year: 2024
      - title: "FineWeb Datasets"
        arxiv_id: "2406.17557"
        citations: 1001
        year: 2024
    github_repos: []
    archon_queries:
      - "RAG corpus quality"
      - "retrieval augmented generation data"
      - "document filtering for RAG"
    exa_search_terms:
      - "RAG data curation strategies"
      - "retrieval corpus quality metrics"
      - "BEIR benchmark evaluation"

  - id: gap-2-economic-legal
    title: "Economic and Legal Frameworks for Data Pricing/Copyright"
    priority: MEDIUM
    relevance: SECONDARY
    description: |
      Technical unlearning methods exist (MUSE, second-order approaches), but economic
      models and legal frameworks absent. Formal models for data valuation, pricing
      mechanisms, copyright enforcement. How do economic incentives affect curation quality?
    impact: MEDIUM-HIGH
    evidence:
      scholar_papers: 3
      archon_kb_entries: 0
    hypothesis_direction: |
      May require interdisciplinary approach beyond pure ML scope.
    related_papers:
