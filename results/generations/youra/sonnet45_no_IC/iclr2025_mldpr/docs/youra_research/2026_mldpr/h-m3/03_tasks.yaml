# Gate Conditions
gate_conditions:
  type: SHOULD_WORK
  primary_metrics:
    - name: mann_whitney_p
      threshold: 0.05
      direction: less_than
    - name: cohens_d
      threshold: 0.5
      direction: greater_than
  secondary_metrics:
    - name: spearman_rho
      threshold: -0.3
      direction: less_than
    - name: spearman_p
      threshold: 0.05
      direction: less_than
  gate_logic: "(mann_whitney_p < 0.05) AND (cohens_d > 0.5)"
  if_fail: "EXPLORE alternative explanations (venue prestige, author reputation)"

