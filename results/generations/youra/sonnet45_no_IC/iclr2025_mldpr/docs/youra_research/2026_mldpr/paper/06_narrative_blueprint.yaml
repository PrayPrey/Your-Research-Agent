      - "Kapoor & Narayanan 2023 (data leakage, 712 citations)"
      - "Semmelrock et al. 2024 (reproducibility barriers, 101 citations)"
    purpose: "Establish reproducibility crisis (Level 1 problem)"

  related_work:
    key_citations:
      - "Semmelrock et al. 2024 (barriers framework)"
      - "Kapoor & Narayanan 2023 (leakage taxonomy)"
      - "Koch et al. 2021 (dataset reuse, 176 citations)"
      - "Jain et al. 2024 (Croissant-RAI, 10 citations)"
      - "Gim et al. 2025 (FAIR compliance)"
    purpose: "Position our work vs existing literature"

  methodology:
    key_citations: []
    purpose: "Methods are standard (Mann-Whitney, Cohen's d), no special citations needed"

  discussion:
    key_citations:
      - "Semmelrock et al. 2024 (CONFIRMS documentation barrier)"
      - "Kapoor & Narayanan 2023 (EXTENDS leakage work)"
      - "Gim et al. 2025 (REPLICATES low-quality finding)"
    purpose: "Connect findings to existing literature"

