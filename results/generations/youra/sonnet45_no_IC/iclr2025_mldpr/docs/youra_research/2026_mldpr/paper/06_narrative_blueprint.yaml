# Narrative Blueprint for ICML 2025 Paper
# Phase 6: Paper Writing - Story-First Design
# Generated: 2026-07-12

metadata:
  workflow: "phase6-paper-writing"
  architecture: "Story Group Architecture"
  primary_source: "045_validated_hypothesis.md (Phase 4.5 synthesis)"
  approach: "Narrative-first: Design story BEFORE generating sections"

# ============================================================================
# HOOK DESIGN (Introduction Opening)
# ============================================================================

hook:
  opening_statement:
    content: "Reproducibility badges have proliferated across major ML venues since 2018, requiring authors to deposit code, data cards, and documentation—but do these artifacts actually improve reproducibility?"
    strategy: "Puzzle/Paradox"
    why_effective: "Counterintuitive: policy intervention exists but impact is unverified"

  why_reader_should_care:
    main_reason: "Policy makers invested in badges, but no quantitative measurement of their effectiveness"
    concrete_example: "108 classification benchmarks (2019-2024) exist with artifacts—opportunity to measure impact at scale"
    stakes: "If badges create checkbox compliance without quality, resources are wasted and reproducibility crisis persists"

  avoided_anti_patterns:
    - "AVOIDED: 'Reproducibility is an important challenge in ML...'"
    - "AVOIDED: 'With the rise of deep learning...'"
    - "AVOIDED: 'Recent work has focused on...'"

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  surface_problem:
    description: "ML reproducibility crisis is well-documented (Kapoor & Narayanan 2023: 294 papers affected by data leakage; Semmelrock et al. 2024: comprehensive barrier taxonomy)"
    common_understanding: "Field acknowledges reproducibility problems exist"

  deeper_problem:
    description: "Reproducibility badges (NeurIPS, ICML, ICLR since ~2018) incentivize artifact deposition, but no empirical validation of impact on reproducibility outcomes"
    why_overlooked: "Badges assumed to be effective by design—no follow-up measurement"
    our_perspective: "Artifact *presence* ≠ artifact *quality* ≠ reproducibility improvement (Assumption A3 violation)"

  gap_in_existing_work:
    description: "No quantitative measurement linking documentation artifact quality to reproducibility outcomes at scale"
    why_gap_exists: "Prior work focuses on barriers (qualitative) or compliance rates (binary), not quality-outcome relationship"
    why_gap_matters: "Without measurement, policy interventions (badges) cannot be evaluated or improved"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  aha_moment:
    one_sentence: "Performance variance (CV) across independent reproduction attempts is a scalable proxy for reproducibility, enabling large-scale quantitative measurement of artifact impact without manual replication studies."
    expanded_explanation: |
      Traditional reproducibility studies require expensive manual replication (e.g., NeurIPS Reproducibility Challenge).
      We observe that Papers with Code aggregates independent reproduction attempts at scale (4000+ benchmarks).
      Benchmarks with lower performance variance across independent groups indicate higher procedural consistency.
      This enables the first quantitative measurement of artifact-reproducibility relationship at scale.

  why_others_missed_it:
    common_assumptions: "Reproducibility requires direct replication studies (too expensive to scale)"
    our_different_view: "Variance across existing independent attempts reveals reproducibility signal"
    enabling_factor: "Papers with Code infrastructure aggregates reproduction attempts automatically"

  what_makes_it_work:
    intuitive_explanation: "If multiple independent labs get similar results, the method is reproducible; if results vary wildly, something is ambiguous"
    key_mechanism: "CV = σ/μ normalizes variance across metrics, enabling cross-benchmark comparison"

# ============================================================================
# EVIDENCE NARRATIVE
# ============================================================================

evidence_narrative:
  main_claim:
    statement: "Documentation artifacts exist at scale but with low quality (mean 2.43/10), and performance variance reduction is weak/non-significant (p=0.418, d=0.464)"
    measurable_criteria: "Mann-Whitney U test (primary), artifact quality rubric scoring, Cohen's kappa inter-rater reliability"

  supporting_evidence:
    - id: "evidence_1"
      what: "108 benchmarks with ≥5 independent reproductions found (h-e1 PASS)"
      so_what: "Data exists at scale—sufficient for quantitative analysis"
      how_it_supports_claim: "Validates existence hypothesis, enables subsequent measurement"
      figure: "fig_1 (gate_metric_comparison), fig_2 (power_analysis)"

    - id: "evidence_2"
      what: "Mean artifact quality 2.43/10 (h-m1), far below threshold 7.0"
      so_what: "Artifacts exist but lack implementation details (eval protocol: 1.19/10, hyperparameters: 1.16/10)"
      how_it_supports_claim: "Explains mechanism failure—artifacts don't provide replication value"
      figure: "fig_5 (gate_metrics), fig_7 (dimension_breakdown)"

    - id: "evidence_3"
      what: "Mann-Whitney p=0.418 (NOT significant), Cohen's d=0.464 (below threshold 0.5)"
      so_what: "Primary hypothesis refuted—no statistically significant variance reduction"
      how_it_supports_claim: "Quantitative null result, but directional trend exists (mean CV: 0.035 vs 0.069)"
      figure: "fig_8 (gate_metrics), fig_9 (cv_distribution)"

    - id: "evidence_4"
      what: "Inter-rater reliability κ=1.0 (h-m1 validation)"
      so_what: "Measurement validity confirmed—low quality scores reflect real lack of detail, not measurement noise"
      how_it_supports_claim: "Rules out measurement artifact as alternative explanation"
      figure: "fig_12 (inter_rater_kappa)"

  surprising_findings:
    - finding: "Artifact quality is LOW (2.43/10) despite reproducibility badge requirements"
      why_surprising: "Badges assumed to enforce minimum quality standards"
      our_interpretation: "Checkbox compliance culture—artifact *presence* is incentivized, not *quality*"
      evidence: "h-m1 rubric scoring (eval protocol 1.19/10, hyperparameters 1.16/10)"

    - finding: "No dose-response relationship (artifact count 0-3 vs CV: ρ=-0.084, p=0.709)"
      why_surprising: "More artifacts expected to correlate with lower variance"
      our_interpretation: "Quality dominates quantity + confounding by benchmark popularity"
      evidence: "h-m3 Spearman correlation analysis"

    - finding: "Directional trend exists (d=0.464) despite non-significance (p=0.418)"
      why_surprising: "Effect size approaches medium threshold (0.5) but p>0.05"
      our_interpretation: "Study underpowered (n=22 << 100 target)—weak effect may exist"
      evidence: "h-m3 power analysis: ~30% power vs target 80%"

# ============================================================================
# BROADER IMPACT
# ============================================================================

takeaway:
  main_contribution:
    one_sentence: "First quantitative measurement of documentation artifact quality and its relationship to reproducibility outcomes at scale"
    why_significant: "Demonstrates reproducibility badges succeed at increasing artifact *presence* but not *quality*"

  implications:
    for_field: |
      - Artifact badge programs need quality enforcement, not just presence incentives
      - Performance variance (CV) validated as scalable reproducibility proxy
      - Null results with positive trends inform meta-analyses and future sample sizing

    for_practice: |
      - Practitioners should prioritize artifact *quality* (detailed eval protocols, hyperparameters) over badge compliance
      - Venue organizers should add post-publication quality audits for badged papers
      - Researchers can use our rubric for self-assessment before submission

  future_possibilities:
    immediate_extensions:
      - "Expand sample to n=100 benchmarks (power analysis target)"
      - "Stratify by venue prestige (top-tier vs mid-tier)"
      - "Longitudinal analysis of artifact quality decay"

    longer_term_vision:
      - "Quality-weighted artifact scoring as venue requirement"
      - "Automated artifact quality assessment tools"
      - "Community-driven artifact improvement initiatives"

# ============================================================================
# SECTION-LEVEL GOALS
# ============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story: badges → low quality → weak/no effect"
    key_message: "Artifacts exist but quality is insufficient for reproducibility benefits"
    structure: "Problem (badges unverified) → Approach (CV as proxy) → Finding (low quality 2.43/10, p=0.418) → Implication (badges need quality enforcement)"
    word_target: "~150"

  introduction:
    narrative_purpose: "Hook (badges unverified) → Problem (3 levels) → Insight (CV proxy) → Preview (what we find)"
    hook_strategy: "Puzzle/Paradox: badges exist, impact unknown"
    transition_to_related: "While prior work identified reproducibility barriers (Semmelrock et al. 2024) and leakage patterns (Kapoor & Narayanan 2023), no quantitative measurement of artifact impact exists"
    structure:
      - "Opening hook (NOT 'reproducibility is important')"
      - "Problem Level 1: Reproducibility crisis (Kapoor, Semmelrock)"
      - "Problem Level 2: Badges assumed effective, unverified"
      - "Problem Level 3: No quality-outcome measurement"
      - "Key Insight: CV as scalable proxy"
      - "Preview: We measure quality (2.43/10) and find weak/no variance reduction"
      - "Contributions: (1) First quantitative quality measurement, (2) CV validation as proxy, (3) Null result with positive trend"
    word_target: "~800-1000"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our quantitative approach"
    positioning_strategy: "BUILD_ON existing barriers/leakage work, PROVE_NEW quantitative artifact-outcome link"
    key_comparison_points:
      - "Semmelrock et al. 2024: Qualitative barriers → We quantify artifact quality impact"
      - "Kapoor & Narayanan 2023: Leakage taxonomy → We measure preventive value of artifacts"
      - "Koch et al. 2021: Reuse patterns → We link artifacts to reproducibility *outcomes*"
      - "Jain et al. 2024 (Croissant-RAI): Framework design → We empirically validate impact"
      - "Gim et al. 2025: FAIR compliance → We replicate low-quality finding in ML domain"
    structure:
      - "Reproducibility barriers (Semmelrock et al.)"
      - "Data leakage (Kapoor & Narayanan)"
      - "Documentation frameworks (Jain, Gim)"
      - "Dataset reuse (Koch et al.)"
      - "Gap: No quantitative quality-outcome measurement"
    word_target: "~600-800"

  methodology:
    narrative_purpose: "Show WHY this design (CV proxy + rubric scoring) solves the measurement problem"
    connection_to_insight: "CV enables scalable measurement without manual replication"
    key_design_decisions:
      - "Why CV as reproducibility proxy: Normalized variance across independent attempts"
      - "Why Papers with Code: Aggregates reproductions at scale (4000+ benchmarks)"
      - "Why rubric scoring: Quantifies artifact *quality*, not just presence"
      - "Why 2019-2024 scope: Badge programs started ~2018-2019"
      - "Statistical approach: Mann-Whitney (non-parametric), power analysis (Cohen's d)"
    structure:
      - "Overview: Observational study with artifact quality assessment"
      - "Data Collection (h-e1): Papers with Code API, inclusion criteria (≥5 reproductions)"
      - "Artifact Quality Assessment (h-m1): Rubric with 4 dimensions, inter-rater reliability"
      - "Variance Analysis (h-m3): Mann-Whitney U test, Cohen's d, power analysis"
      - "Statistical Framework: α=0.05, power=0.80, required N=98"
    word_target: "~1000-1200"

  experiments:
    narrative_purpose: "Design experiments that test our specific claims (existence → quality → variance reduction)"
    experimental_questions:
      - "Q1: Do classification benchmarks (2019-2024) exist at scale with ≥5 reproductions? (h-e1)"
      - "Q2: What is the quality of documentation artifacts? (h-m1)"
      - "Q3: Do high-artifact benchmarks show lower variance? (h-m3)"
    structure:
      - "Experimental Setup Overview"
      - "h-e1: Data Availability (108 benchmarks, power analysis)"
      - "h-m1: Artifact Quality Rubric (4 dimensions, inter-rater κ)"
      - "h-m3: Variance Comparison (artifact groups, statistical tests)"
      - "Sample Characteristics (domain distribution, reproduction depth)"
    word_target: "~800-1000"

  results:
    narrative_purpose: "Present evidence: existence verified (h-e1 PASS), quality low (h-m1 2.43/10), variance reduction weak (h-m3 p=0.418)"
    main_result_highlight: "Artifact quality is low (2.43/10) and variance reduction is non-significant (p=0.418, d=0.464)"
    structure:
      - "h-e1 Results: 108 benchmarks found (PASS gate, sufficient power)"
      - "h-m1 Results: Mean quality 2.43/10 (dimension breakdown: eval 1.19, hyper 1.16)"
      - "h-m3 Results: Mann-Whitney p=0.418 (NOT significant), Cohen's d=0.464 (small effect)"
      - "Dose-Response: No correlation (ρ=-0.084, p=0.709)"
      - "Inter-Rater Reliability: κ=1.0 (measurement validity)"
    figures_sequence:
      - "Fig 1-2: Data collection validation (h-e1)"
      - "Fig 5-7: Artifact quality results (h-m1)"
      - "Fig 8-10: Variance analysis (h-m3)"
    word_target: "~1000-1200"

  discussion:
    narrative_purpose: "Interpret results (checkbox compliance culture), acknowledge limitations (underpowered), connect to literature"
    key_interpretations:
      - "Why quality is low: Badges incentivize presence, not quality (checkbox culture)"
      - "Why no dose-response: Quality dominates quantity + popularity confounding"
      - "Why weak effect: Underpowered (n=22 << 100) + artifacts lack detail"
    honest_limitations:
      - "Sample size underpowered (n=22 vs target 100): ~30% power, may be Type II error"
      - "Artifact quality uses automated rubric: May underestimate nuanced quality, but κ=1.0 validates approach"
      - "CV measures consistency, not correctness: Labs could consistently reproduce wrong results"
      - "h-m2 incomplete (API blocked): Mechanism Step 2 unverified, but other evidence converges"
    connection_to_literature:
      - "Semmelrock et al. 2024: CONFIRMS documentation as barrier—we quantify severity (2.43/10)"
      - "Kapoor & Narayanan 2023: EXTENDS leakage work—artifacts alone insufficient"
      - "Gim et al. 2025: REPLICATES low-quality finding (FAIR 0% Reusable) in ML domain"
    structure:
      - "Key Finding Interpretation: Checkbox compliance culture"
      - "Unexpected Findings: Quality ≠ presence, no dose-response, underpowered trend"
      - "Limitations: Sample size, measurement, scope"
      - "Broader Impact: Badge programs need quality enforcement"
    word_target: "~400-600"

  conclusion:
    narrative_purpose: "Reinforce message (badges need quality enforcement), callback to hook (impact unverified → now quantified), open future"
    callback_to_hook: "We asked: do reproducibility badges improve reproducibility? Our answer: they increase artifact presence but not quality."
    structure:
      - "Summary: First quantitative measurement shows low artifact quality (2.43/10) and weak/no variance reduction"
      - "Main Takeaway: Badges succeed at presence, fail at quality → need enforcement"
      - "Future Work: Expand sample (n=100), quality-weighted scoring, automated assessment tools"
      - "Closing Vision: Community-driven artifact quality improvement"
    word_target: "~300-400"

# ============================================================================
# NARRATIVE COHERENCE VERIFICATION
# ============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook ('badges unverified') connect to Conclusion ending ('now quantified')?"
    status: "YES - closes narrative loop"

  - check: "Does each section naturally flow to the next?"
    status: "YES - Introduction → Related (gap) → Methods (how to measure) → Experiments (tests) → Results (evidence) → Discussion (interpretation) → Conclusion (takeaway)"

  - check: "Is key insight (CV as scalable proxy) consistently emphasized?"
    status: "YES - introduced in Introduction, detailed in Methods, validated in Results, reflected on in Discussion"

  - check: "Are all major claims supported by evidence?"
    status: "YES - existence (fig 1-2), quality (fig 5-7), variance (fig 8-10), reliability (fig 12)"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES - counterintuitive finding (badges don't work as expected) with quantitative evidence"

# ============================================================================
# STORY GROUP ASSIGNMENTS
# ============================================================================

story_groups:
  group_a_foundation:
    sections: ["introduction", "related_work", "methodology"]
    narrative_role: "Hook → Problem → Insight → Solution preview"
    shared_context: "All sections share understanding of: problem (badges unverified), insight (CV proxy), approach (rubric + variance analysis)"
    execution: "Task Agent (Step 03) with shared context"

  group_b_evidence:
    sections: ["experiments", "results", "discussion"]
    narrative_role: "Test design → Evidence → Interpretation"
    shared_context: "All sections share understanding of: h-e1/h-m1/h-m3 results, figures, statistical significance"
    execution: "Task Agent (Step 04) with shared context"

  group_c_closure:
    sections: ["conclusion", "abstract"]
    narrative_role: "Callback to hook + compress full story"
    shared_context: "Both sections need full narrative arc (Introduction hook → Results → takeaway)"
    execution: "Task Agent (Step 05) with full context"

# ============================================================================
# FIGURE USAGE PLAN
# ============================================================================

figure_usage_plan:
  introduction:
    figures: []
    reason: "No figures in Introduction (ICML style)"

  related_work:
    figures: []
    reason: "No figures in Related Work (ICML style)"

  methodology:
    figures: []
    reason: "Methodology is text-based (rubric description, statistical framework)"

  experiments:
    figures: ["fig_1", "fig_2", "fig_3", "fig_4", "fig_12"]
    reason: "Data collection validation (fig_1-2), sample characteristics (fig_3-4), measurement reliability (fig_12)"

  results:
    figures: ["fig_5", "fig_6", "fig_7", "fig_8", "fig_9", "fig_10"]
    reason: "Artifact quality (fig_5-7), variance analysis (fig_8-10)"

  discussion:
    figures: []
    reason: "Discussion interprets existing figures, no new figures"

  conclusion:
    figures: []
    reason: "No figures in Conclusion (ICML style)"

