    - "Null model (no relationship between artifacts and variance)"

measurement_plan:
  data_collection:
    - source: "Papers with Code API: Sample 100 classification benchmarks (2019-2024) with ≥5 reported results"
    - source: "Semantic Scholar API: Validate sampling coverage (check for bias toward well-documented papers)"
  procedure:
    - step: "Extract artifact metadata: GitHub repo presence, dataset card link, reproducibility badge (NeurIPS/ICML)"
    - step: "Compute performance CV for each benchmark from aggregated result reports"
    - step: "Code artifacts via two independent raters (inter-rater reliability: Cohen's kappa >0.8)"
    - step: "Apply propensity score weighting if sampling bias detected (coverage difference >10%)"
    - step: "Run Mann-Whitney U test + Spearman correlation + stratified domain analysis"
  success_criteria:
    - "Primary: p<0.05 with Cohen's d >0.5 for Mann-Whitney test"
    - "Secondary: ρ<-0.3 for dose-response correlation"
    - "Exploratory: d_CV >0.6 AND d_NLP >0.3 for domain heterogeneity"

validation:
  internal_validity:
    - "Control for benchmark age, task domain, metric type via stratified analysis"
    - "Inter-rater reliability check for artifact coding (kappa >0.8)"
    - "Pre-registration of analysis plan to prevent p-hacking"
    - "Outlier handling: Winsorize CV at 95th percentile"
  external_validity:
    - "Generalizability: Findings apply to classification benchmarks 2019+, not generative tasks"
    - "Sampling validation: Compare Papers with Code coverage rate for high vs low artifact papers"
    - "Temporal validity: Account for COVID-19 confound (2020 policy changes coincide with cultural shifts)"

