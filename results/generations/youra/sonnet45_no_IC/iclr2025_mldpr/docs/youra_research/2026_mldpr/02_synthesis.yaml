hypothesis_draft:
  title: "Quantifying Documentation Artifact Impact on ML Benchmark Reproducibility via Performance Variance Analysis"
  hypothesis_id: "H-DocArtifactVariance-v1"
  core_claim: |
    ML classification benchmarks from papers with ≥2 documentation artifacts (GitHub repository, dataset card, reproducibility badge)
    exhibit 30-50% lower performance variance (coefficient of variation) across independent reproduction attempts
    compared to benchmarks with <2 artifacts, due to reduced implementation ambiguity.
  mechanism: |
    Documentation artifacts → provide implementation details and usage specifications →
    reduce interpretation ambiguity across research groups → enable precise replication →
    lower cross-lab performance variance (measured as CV of reported metrics).
  predictions:
    - P1: "Mann-Whitney U test shows p<0.05 with Cohen's d >0.5 for CV difference between high vs low artifact groups"
    - P2: "Spearman correlation ρ<-0.3 between artifact count (0-3) and performance variance (dose-response)"
    - P3: "Effect size larger in CV (d>0.6) than NLP (d>0.3), indicating domain heterogeneity"

variables_summary:
  independent: "Documentation artifact count, binarized as ≥2 vs <2 (GitHub repo, dataset card, badge)"
  dependent_primary: "Performance variance (CV = σ/μ) from ≥5 independent result reports per benchmark"
  controlled: "Benchmark age (years since publication), task domain (CV/NLP), metric type (accuracy/F1)"

null_hypothesis:
  h0_statement: |
    There is no statistically significant difference in performance variance (CV) between benchmarks
    with ≥2 documentation artifacts and benchmarks with <2 artifacts.
  statistical_test: "Mann-Whitney U test (non-parametric, two-tailed)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Performance variance as scalable reproducibility proxy—bypasses sparsity of direct replication studies (typically <100 papers) by leveraging 4000+ benchmarks in Papers with Code"
  differentiation_summary: |
    - vs Semmelrock 2024: Quantifies effect size (d>0.5) rather than qualitatively cataloging barriers
    - vs Koch 2021: Links documentation to reproducibility OUTCOMES, not just reuse patterns
    - vs Kapoor 2023: Preventive measurement (artifact impact) vs retrospective leakage detection

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
