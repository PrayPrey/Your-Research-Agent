# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-DocArtifactVariance-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the scope of ML classification benchmarks published 2019-2024 in Papers with Code,
    if a benchmark's original paper includes ≥2 documentation artifacts (GitHub repository, dataset card, reproducibility badge),
    then the benchmark exhibits 30-50% lower performance variance (coefficient of variation) across independent reproduction attempts,
    because documentation artifacts enable precise replication by reducing implementation ambiguity across research groups.
  alternative_hypothesis_h0: |
    There is no statistically significant difference in performance variance (CV) between benchmarks
    with ≥2 documentation artifacts and benchmarks with <2 artifacts (Mann-Whitney U test, p>0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Documentation Artifact Count"
      type: "categorical"
      operationalization: "Binary: ≥2 artifacts (GitHub repo + dataset card + badge) vs <2 artifacts"
      levels: ["Low (<2 artifacts)", "High (≥2 artifacts)"]
  dependent:
    - name: "Performance Variance"
      type: "continuous"
      operationalization: "Coefficient of variation (CV = σ/μ) of reported metrics across ≥5 independent reproduction attempts per benchmark"
      primary: true
    - name: "Metric Consistency Score"
      type: "continuous"
      operationalization: "Standard deviation of reported metrics normalized by task difficulty"
      primary: false
  controlled:
    - name: "Benchmark Age"
      operationalization: "Years since original publication (control for temporal confounding)"
    - name: "Task Domain"
      operationalization: "Computer Vision vs NLP (domain-specific analysis)"
    - name: "Metric Type"
      operationalization: "Accuracy vs F1 vs other (standardization control)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Documentation artifacts (GitHub repos, dataset cards, badges) provide implementation details and usage specifications"
      evidence: "Prof. Pax Exchange 14: GitHub repo contains code, dataset card specifies data collection/splits/intended use"
      falsifier: "If artifacts exist but provide no implementation details (empty repos, boilerplate cards), mechanism fails"
    - step: 2
      description: "Implementation details reduce interpretation ambiguity across independent research groups attempting reproduction"
      evidence: "Dr. Ally Exchange 12: Artifacts enable precise replication of preprocessing, splits, evaluation protocols"
      falsifier: "If groups with access to artifacts still show high variance (CV>0.4), ambiguity reduction fails"
    - step: 3
      description: "Reduced ambiguity leads to lower cross-lab performance variance (higher reproducibility)"
      evidence: "Performance variance (CV) as reproducibility proxy—lower variance indicates more consistent reproduction"
      falsifier: "If high-artifact benchmarks show HIGHER variance than low-artifact ones, causal mechanism is disproven"
  key_tension: "Performance variance measures consistency, not correctness—labs could consistently reproduce WRONG results (Prof. Rex Exchange 11)"
  evidence_summary: |
    Causal chain supported by:
    - Semmelrock et al. 2024: Documentation identified as reproducibility barrier
    - Kapoor & Narayanan 2023: Lack of specifications enables leakage (inverse evidence)
    - Papers with Code infrastructure: Aggregates independent reproduction attempts at scale

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Papers with Code includes benchmarks representatively (not biased toward well-documented ones)"
    supporting_evidence: "Papers with Code covers 4000+ benchmarks across domains, but coverage validation required"
    consequence_if_violated: "Sampling bias inflates effect size—high-artifact papers overrepresented"
  - id: "A2"
    assumption: "Performance variance (CV) is a valid reproducibility proxy"
    supporting_evidence: "Lower variance across independent attempts indicates procedural consistency"
    consequence_if_violated: "Variance measures noise, not reproducibility—findings don't generalize to actual replication success"
  - id: "A3"
    assumption: "Artifact presence indicates artifact QUALITY (not just checkbox compliance)"
    supporting_evidence: "Inter-rater reliability check (Prof. Vera Exchange 13) validates artifact coding"
    consequence_if_violated: "Empty GitHub repos or boilerplate dataset cards provide no replication value"
  - id: "A4"
    assumption: "Independent groups report results honestly (no selective reporting of favorable outcomes)"
    supporting_evidence: "Papers with Code aggregates peer-reviewed results, reducing publication bias"
    consequence_if_violated: "Reported variance underestimates true reproduction difficulty"
  - id: "A5"
    assumption: "Classification tasks have standardized metrics (accuracy, F1) enabling fair comparison"
    supporting_evidence: "Scope restricted to classification tasks (Prof. Pax Exchange 14)"
    consequence_if_violated: "Metric heterogeneity (accuracy vs balanced accuracy) inflates variance artificially"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - ML classification benchmarks published 2019-2024
    - Benchmarks with ≥5 independent result reports in Papers with Code
    - Tasks with standardized accuracy-based metrics
    - Papers from venues with artifact badge programs (NeurIPS, ICML, ICLR)
  does_not_apply_to: |
    - Generative tasks (image synthesis, language generation) with heterogeneous metrics (FID, IS, BLEU)
    - Regression or ranking tasks without standardized evaluation protocols
    - Papers pre-2019 (artifact badges not available)
    - Benchmarks with <5 reported results (variance not reliably estimable)
  known_limitations: |
    - Performance variance ≠ absolute correctness (measures consistency, not validity)
    - Sampling bias if Papers with Code coverage differs by artifact presence
    - Metric heterogeneity even within classification (accuracy variants)
    - Temporal confounding (older benchmarks have more time for documentation improvement)

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Benchmarks with ≥2 artifacts show statistically significantly lower performance variance (CV) than benchmarks with <2 artifacts"
    test_method: "Mann-Whitney U test comparing CV distributions between high-artifact and low-artifact groups"
    success_criterion: "p<0.05 (two-tailed) with Cohen's d >0.5 (medium effect size)"
    falsification: "p>0.05 OR Cohen's d <0.3 (small/negligible effect)"
  - id: "P2"
    primary: false
    statement: "Artifact count (0-3) shows negative dose-response relationship with performance variance"
    test_method: "Spearman rank correlation between artifact count and CV"
    success_criterion: "ρ<-0.3 (moderate negative correlation), p<0.05"
    falsification: "ρ>-0.1 (weak/no correlation) OR p>0.05"
  - id: "P3"
    primary: false
    statement: "Documentation artifact effect size is larger in computer vision than NLP (domain heterogeneity)"
    test_method: "Stratified analysis computing Cohen's d separately for CV and NLP benchmarks"
    success_criterion: "d_CV >0.6 AND d_NLP >0.3 AND d_CV - d_NLP >0.2"
    falsification: "No significant difference between domains (d_CV ≈ d_NLP within 0.1)"

