      1. __init__(base_url, rate_limit, max_retries)
      2. fetch_benchmarks(task, start_year, end_year) -> DataFrame
      3. fetch_results_count(benchmark_id) -> int
      4. collect_with_retry(url, params, retries) -> dict

      Apply exponential backoff pattern from Archon KB.
    acceptance_criteria:
      - Successfully queries Papers with Code API without errors
      - Respects rate limit (1 request/second)
      - Retries failed requests 3 times with backoff
      - Returns DataFrame with columns: benchmark_id, name, task, publication_year, result_count
