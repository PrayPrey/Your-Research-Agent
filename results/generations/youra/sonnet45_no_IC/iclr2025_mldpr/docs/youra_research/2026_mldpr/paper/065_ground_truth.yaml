# ============================================================================
# METHODOLOGICAL CHOICES (Design decisions that could be challenged)
# ============================================================================

methodological_choices:

  - choice_id: "MC-01"
    decision: "Used coefficient of variation (CV = σ/μ) as reproducibility proxy"
    section: "methodology"
    rationale: "CV normalizes variance across metrics with different scales; lower CV indicates higher procedural consistency"
    alternative_rejected: "Absolute variance (σ²) does not enable cross-benchmark comparison"
    vulnerability: "CV measures consistency, not correctness—labs could consistently reproduce wrong results"
    defense: "Consistency is necessary (but not sufficient) for reproducibility"
    source: "h-m3/02c_experiment_brief.md"

  - choice_id: "MC-02"
    decision: "Binary artifact grouping: ≥2 artifacts (high) vs <2 artifacts (low)"
    section: "methodology"
    rationale: "Threshold of 2 ensures meaningful documentation presence"
    alternative_rejected: "Continuous artifact count (0-3) showed no dose-response (ρ=-0.084)"
    vulnerability: "Arbitrary threshold; why not ≥1 or ≥3?"
    defense: "Single artifact (e.g., GitHub alone) may be incomplete; tested continuous count as secondary analysis"
    source: "h-m3/02c_experiment_brief.md"

  - choice_id: "MC-03"
    decision: "Used Mann-Whitney U test (non-parametric) instead of t-test"
    section: "methodology"
    rationale: "Shapiro-Wilk normality tests indicated non-normal CV distributions"
    alternative_rejected: "t-test assumes normality"
    vulnerability: "Mann-Whitney has lower power than t-test for normal data"
    defense: "Robustness to non-normality outweighs power loss; CV distributions are right-skewed (expected for variance metrics)"
    source: "h-m3/02c_experiment_brief.md"

  - choice_id: "MC-04"
    decision: "Artifact quality threshold: 7.0/10"
    section: "methodology"
    rationale: "Conservative threshold—requires at least partial specification (5-10 average) across all dimensions"
    alternative_rejected: "Lower threshold (e.g., 5.0) would be too lenient"
    vulnerability: "Arbitrary threshold; why not 6.0 or 8.0?"
    defense: "Threshold represents artifacts providing 'sufficient implementation detail for precise replication'; validated against real content"
    source: "h-m1/02c_experiment_brief.md"

  - choice_id: "MC-05"
    decision: "Automated rubric scoring instead of expert human raters"
    section: "methodology"
    rationale: "Enables rapid iteration; keyword-based scoring validated with κ=1.0 inter-rater reliability"
    alternative_rejected: "Manual expert coding would require 1-2 weeks"
    vulnerability: "Automated scoring may miss nuanced quality if artifacts use non-standard terminology"
    defense: "κ=1.0 confirms measurement validity; rubric applied to real artifact content (not random)"
    source: "h-m1/02c_experiment_brief.md"

  - choice_id: "MC-06"
    decision: "Classification tasks only (excluded regression, generation)"
    section: "methodology"
    rationale: "Standardized metrics (accuracy, F1) enable fair comparison"
    alternative_rejected: "Generative tasks have heterogeneous metrics (FID, IS, BLEU)"
    vulnerability: "Results may not generalize to generative modeling"
    defense: "Scope limitation acknowledged; classification covers 67.6% of ML benchmarks in Papers with Code"
    source: "h-e1/02c_experiment_brief.md"

  - choice_id: "MC-07"
    decision: "Inclusion criterion: ≥5 independent results per benchmark"
    section: "methodology"
    rationale: "Minimum sample size for variance estimation (CV calculation)"
    alternative_rejected: "≥3 results would increase sample size but reduce variance estimate reliability"
    vulnerability: "Excludes young benchmarks with <5 reproductions"
    defense: "Trade-off between sample size and measurement reliability; 5 is conventional minimum for CV"
    source: "h-e1/02c_experiment_brief.md"

  - choice_id: "MC-08"
    decision: "Publication period: 2019-2024"
    section: "methodology"
    rationale: "Aligns with reproducibility badge adoption at major venues (NeurIPS, ICML, ICLR ~2018-2019)"
    alternative_rejected: "Pre-2019 benchmarks had fewer badges"
    vulnerability: "Excludes older influential benchmarks (e.g., MNIST, CIFAR-10 from pre-2019)"
    defense: "Study focuses on badge era; older benchmarks would confound analysis"
    source: "h-e1/02c_experiment_brief.md"

