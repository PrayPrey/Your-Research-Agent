# LIMITATIONS (Acknowledged in paper)
# ============================================================================

limitations:

  - limitation_id: "LIM-01"
    statement: "Sample size underpowered: n=22 (actual) vs n=100 (target)"
    section: "discussion"
    impact: "~30% statistical power (vs target 80%); may be Type II error"
    mitigation: "Directional trend observed (d=0.464 approaches 0.5); effect size reported for meta-analysis"
    acknowledged: true
    severity: "HIGH"

  - limitation_id: "LIM-02"
    statement: "Automated artifact quality measurement may underestimate quality"
    section: "discussion"
    impact: "Keyword-based rubric may miss non-standard terminology"
    mitigation: "κ=1.0 inter-rater reliability validates approach; rubric applied to real content"
    acknowledged: true
    severity: "MEDIUM"

  - limitation_id: "LIM-03"
    statement: "CV measures consistency, not correctness"
    section: "discussion"
    impact: "Labs could consistently reproduce wrong results (e.g., all using same wrong preprocessing)"
    mitigation: "Consistency is necessary (but not sufficient) for reproducibility"
    acknowledged: true
    severity: "MEDIUM"

  - limitation_id: "LIM-04"
    statement: "h-m2 (protocol consistency analysis) incomplete due to API rate limiting"
    section: "discussion"
    impact: "Mechanism Step 2 (artifacts reduce ambiguity) unverified"
    mitigation: "Convergence of h-m1 (low quality) + h-m3 (no variance reduction) provides indirect evidence"
    acknowledged: true
    severity: "LOW"

  - limitation_id: "LIM-05"
    statement: "Observational design cannot establish causality"
    section: "methodology"
    impact: "Confounding by benchmark popularity, maturity, or task difficulty"
    mitigation: "Recorded confounds (age, domain, metric type); recommended propensity score weighting"
    acknowledged: true
    severity: "MEDIUM"

  - limitation_id: "LIM-06"
    statement: "Classification tasks only—may not generalize to generation"
    section: "methodology"
    impact: "Results apply to classification (67.6% of ML), not generative modeling"
    mitigation: "Scope limitation; future work should extend to generative tasks"
    acknowledged: true
    severity: "LOW"

