hypothesis_id: "h-lr1"
synthesis_date: "2026-07-13"
phase: "2A-Dialogue"

core_claim: "Logistic Regression achieves ≥75% accuracy for repository maintenance classification using basic GitHub metadata"

mechanism:
  type: "linear_classification"
  description: "Repository maintenance determined by linear combination of log-scaled GitHub metadata features"
  key_components:
    - "Feature extraction: stars, forks, commits, contributors, issues, last_commit_date"
    - "Feature transformation: log1p for long-tail distributions"
    - "Normalization: StandardScaler (zero mean, unit variance)"
    - "Classification: L2-regularized logistic loss with balanced class weights"

  causal_pathway: "Maintained repositories exhibit higher recent activity (low days_since_last_commit), higher community engagement (stars, forks, contributors), and higher development velocity (commit_frequency). These patterns are linearly separable in feature space."

variables:
  independent:
    - name: "stars_log"
      type: "continuous"
      transform: "log1p"
      rationale: "Popularity metric, long-tail distribution"

    - name: "forks_log"
      type: "continuous"
      transform: "log1p"
      rationale: "Community engagement, long-tail distribution"

    - name: "contributors_log"
      type: "continuous"
      transform: "log1p"
      rationale: "Development breadth, long-tail distribution"

    - name: "total_commits_log"
      type: "continuous"
      transform: "log1p"
      rationale: "Development activity, long-tail distribution"

    - name: "open_issues_log"
      type: "continuous"
      transform: "log1p"
      rationale: "Community activity, long-tail distribution"

    - name: "days_since_last_commit"
      type: "continuous"
      transform: "raw"
      rationale: "Recency metric, directly interpretable"

    - name: "commit_frequency_median_weekly"
      type: "continuous"
      transform: "median_aggregation"
      rationale: "Development velocity, outlier-robust (Adejumo & Johnson 2025)"

    - name: "issue_resolution_rate"
      type: "continuous"
      transform: "ratio"
      rationale: "Maintenance efficiency, bounded [0,1]"

  dependent:
    name: "maintenance_status"
    type: "binary"
    values: "[0, 1]"
    definition: "1 if days_since_last_commit < 180, else 0"
    validation: "High-confidence subset: last_commit <90 days & recent activity OR archived/keywords"

  control:
    - name: "temporal_period"
      values: "['2020-2022', '2023-2024']"
      purpose: "Temporal generalization test"

    - name: "repository_type"
      values: "benchmark repositories from Papers with Code"
      purpose: "Domain specification"

    - name: "minimum_popularity"
      values: "stars ≥32"
      purpose: "Filter trivial projects (He et al. 2024 criterion)"

predictions:
  prediction1:
    claim: "LR ≥75% accuracy (IID split)"
    pass: "accuracy ≥0.75 AND f1 ≥0.73"
    fail: "accuracy <0.70 OR f1 <0.68"

  prediction2:
    claim: "LR exceeds majority by ≥10%, matches CSI within 3%"
    pass: "delta_majority ≥0.10 AND |delta_csi| ≤0.03"
    fail: "delta_majority <0.08"

  prediction3:
    claim: "LR generalizes temporally (≥70% on 2023-2024)"
    pass: "lr_temporal ≥0.70 AND |lr_drop| ≤ |gb_drop| + 0.05"
    fail: "lr_temporal <0.65 OR lr_drop > gb_drop + 0.10"

assumptions:
  - id: "linear_separability"
    statement: "Repository maintenance is linearly separable in log-scaled feature space"
    testable: true
    test: "If LR ≥75%, assumption confirmed. If LR <70%, assumption rejected."

  - id: "timestamp_proxy"
    statement: "last_commit <180 days is valid proxy for 'maintained' status"
    validation: "High-confidence subset comparison, validated by He et al. 2024 approach"

  - id: "feature_sufficiency"
    statement: "Basic GitHub metadata captures maintenance signal without network analysis"
    testable: true
    test: "If LR matches CSI (aggregation) within 3%, basic features sufficient"

  - id: "temporal_stationarity"
    statement: "Models trained on 2020-2022 generalize to 2023-2024"
    testable: true
    test: "Temporal split evaluation, KS test for distribution shifts"

  - id: "class_balance"
    statement: "Majority baseline accuracy ~60% (more repos maintained than abandoned)"
    verifiable: true
    verification: "Report actual class distribution in dataset"

null_hypothesis: "Logistic Regression achieves <70% accuracy, confirming non-linear methods necessary"

novelty:
  methodological: "First controlled three-way comparison (CSI vs LR vs GB) with temporal validation"
  theoretical: "Tests linear separability hypothesis for repository maintenance"
  practical: "Quantifies complexity-accuracy-compute trade-offs for practitioner guidance"

scope:
  included:
    - "Binary maintenance classification (maintained vs abandoned)"
    - "Benchmark repositories from Papers with Code"
    - "GitHub REST API metadata (2020-2024)"
    - "Basic features only (no HITS centrality, no network analysis)"

  excluded:
    - "Continuous lifespan prediction (survival analysis)"
    - "Multi-dimensional classification (data provenance, evaluation, metrics)"
    - "Non-benchmark general OSS repositories"
    - "Real-time streaming prediction"

boundaries:
  dataset_size: "2000 repos (1.7% of Li et al. 2026 scale, 10-20× Adejumo & Johnson scale)"
  feature_complexity: "Basic metadata only, no graph algorithms"
  task_complexity: "Binary classification, not multi-class or regression"
  domain_specificity: "Benchmark repos may not generalize to all OSS projects"

success_criteria:
  strong_success:
    - "LR ≥75% accuracy"
    - "LR within 3% of CSI"
    - "LR generalizes better than GB temporally"
    interpretation: "Simple methods suffice, complex unnecessary"

  moderate_success:
    - "LR 70-74% accuracy"
    - "LR > majority + 10%"
    interpretation: "Simple provides moderate baseline, complex offers incremental gains"

  failure:
    - "LR <70% accuracy"
    interpretation: "Non-linear methods necessary, analyze feature interactions"

adaptive_outcomes: "All results (success/moderate/failure) yield scientific findings about complexity requirements"

established_facts:
  - "GitHub metadata predicts repository health (He et al. 2024, Adejumo & Johnson 2025, 5+ papers)"
  - "Simple aggregation (CSI) achieves F1 0.80 (Adejumo & Johnson 2025)"
  - "Complex methods (GB + HITS) achieve C-Index 0.810 (He et al. 2024)"
  - "Large-scale GitHub extraction (100K+ repos) feasible (Li et al. 2026)"
  - "Median-based statistics outperform mean for GitHub metrics (Adejumo & Johnson 2025)"
  - "Log-transformation handles long-tail GitHub distributions (He et al. 2024)"

phase2b_readiness:
  research_design: "Three-way comparison framework reusable"
  feature_engineering: "sklearn implementation code provided"
  validation_protocol: "Temporal stability + label noise checks specified"
  outcome_framework: "Adaptive interpretation for all results"
