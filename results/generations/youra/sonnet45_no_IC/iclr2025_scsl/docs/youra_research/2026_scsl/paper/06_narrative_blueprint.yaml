# SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  abstract:
    narrative_purpose: "Compress full story into ~150 words — prioritize storytelling over numerical detail, use actual quantitative results from experiments"
    key_message: "Simple logistic regression achieves 95-100% accuracy on benchmark repository maintenance, challenging complexity assumptions"
    structure:
      - "Hook: Complex methods vs surprising simple baseline result"
      - "Problem: No controlled simple-vs-complex comparison"
      - "Method: LR on 6 GitHub metadata features, 120 Papers with Code repos"
      - "Results: 95-100% accuracy, staleness dominates (coefficient -3.05), GB only 4.2% better"
      - "Impact: Simplicity baseline for future work, questions complexity necessity"

  introduction:
    narrative_purpose: "Hook → Problem → Insight → Preview"
    hook_strategy: "counterintuitive_finding"
    flow:
      - "P1: Open with complexity vs simplicity tension (Hook)"
      - "P2: Repository maintenance matters (dependencies, supply chain)"
      - "P3: Prior work used complex methods without simple baseline"
      - "P4: Gap: No controlled LR vs CSI vs GB comparison"
      - "P5: Our approach: Test simplicity hypothesis first"
      - "P6: Key insight: Two-tier signal hierarchy (staleness primary)"
      - "P7: Results preview: 95-100% accuracy, 4.2% LR-GB gap"
      - "P8: Contributions (numbered list, as story not bullets)"
    transition_to_related: "Having established the motivation, we now review existing approaches..."
    contributions:
      - "Empirical: LR achieves 95-100% accuracy on 120 real benchmark repos, establishing simplicity baseline"
      - "Methodological: Two-tier signal hierarchy (staleness primary, engagement secondary) with mild non-linear threshold effect"
      - "Practical: 6 core GitHub API features sufficient, no network analysis needed"
      - "Domain-specific: Benchmark repos exhibit cleaner patterns than general open-source"

  related_work:
    narrative_purpose: "Show existing work insufficient → justify our approach"
    positioning_strategy: "respectful_contrast"
    structure:
      - "Subsection: Repository Maintenance Prediction"
      - "Subsection: Composite Metrics vs Classification"
      - "Subsection: Simple vs Complex Methods"
      - "Subsection: Gap Summary → Our Contribution"
    key_comparison_points:
      - "He et al. 2024: GB + HITS (C-Index 0.810 on 103K repos) — complex, no simple baseline"
      - "Adejumo & Johnson 2025: CSI aggregation (F1 0.80 on 100 repos) — no classifier comparison"
      - "Li et al. 2026: Large-scale extraction (116K repos) — infrastructure, no prediction"
    our_positioning: "We fill the gap: controlled LR vs CSI vs GB comparison with explicit simplicity test"

  methodology:
    narrative_purpose: "Show WHY this design solves the problem (connection to key insight)"
    connection_to_insight: "Since our hypothesis is that simple suffices, we test LR first (simplest) before GB (complex), with explicit gate criteria (≥75% accuracy)"
    structure:
      - "Subsection: Dataset (Papers with Code benchmark repos, why this domain)"
      - "Subsection: Features (6 core GitHub API features, log-scaling rationale)"
      - "Subsection: Models (LR: simplicity test, GB: complexity comparison)"
      - "Subsection: Evaluation (stratified split, gate criteria)"
    key_design_decisions:
      - "Decision: LR before GB (test simplicity hypothesis explicitly)"
      - "Rationale: If LR ≥75%, complex methods must justify added value"
      - "Decision: 6 metadata features only (no graph centrality)"
      - "Rationale: Test whether basic features suffice without expensive network analysis"
      - "Decision: Binary threshold 180 days (He et al. 2024)"
      - "Rationale: Standard definition, enables comparison with prior work"
      - "Decision: Balanced class weights (82.5% maintained vs 17.5% abandoned)"
      - "Rationale: Handle imbalance without oversampling/undersampling"
    figure_placement: "fig_5 (decision_boundary_pca.png) — visualize linear separability"

  experiments:
    narrative_purpose: "Design tests that verify our specific claims (P1: absolute, P2: relative, P3: temporal)"
    experimental_questions:
      - "Q1: Does LR achieve ≥75% accuracy? (P1: absolute performance)"
      - "Q2: How much better is GB? (complexity value quantification)"
      - "Q3: Which features matter? (mechanism understanding)"
    structure:
      - "Subsection: Experimental Setup (H-E1: EXISTENCE, H-M1: MECHANISM)"
      - "Subsection: Evaluation Metrics (accuracy, F1, coefficients, feature importance)"
      - "Subsection: Baselines (note: majority/CSI not implemented, limitation acknowledged)"
    gate_criteria:
      - "H-E1: Accuracy ≥75% AND F1 ≥73% → PASS if met"
      - "H-M1: Coefficient signs correct + LR-GB gap ≤5% + Feature overlap ≥2/3 → PASS if 3/3"

  results:
    narrative_purpose: "Present evidence supporting claims (organized by experimental question)"
    main_result_highlight: "H-E1 achieved 100% accuracy (perfect classification), far exceeding 75% target"
    structure:
      - "Subsection: Existence Validation (H-E1 results)"
      - "Paragraph: Perfect classification (Table 1: metrics, Figure 1: confusion matrix)"
      - "Subsection: Mechanism Analysis (H-M1 results)"
      - "Paragraph: Coefficient hierarchy (Figure 2: coefficient bar chart)"
      - "Paragraph: Feature importance divergence (Figure 3: LR vs GB comparison)"
      - "Paragraph: Performance gap (Figure 4: LR 95.8% vs GB 100%)"
    figure_sequence:
      - "Table 1: Metrics comparison (LR vs target: Accuracy 1.0 vs 0.75, F1 1.0 vs 0.73)"
      - "Figure 1: Confusion matrix (perfect 24/24, no errors)"
      - "Figure 2: Coefficient bar chart (days_since_last: -3.05 dominant)"
      - "Figure 3: Feature importance comparison (GB exclusive vs LR distributed)"
      - "Figure 4: Performance comparison (LR 95.8%, GB 100%, gap 4.2%)"
    narrative_flow:
      - "Lead with strongest result (perfect 100% accuracy)"
      - "Then mechanism (why it works: staleness dominance)"
      - "Then comparison (when complexity helps: 4.2% gap for threshold capture)"
      - "End with interpretation (two-tier hierarchy, mild non-linearity)"

  discussion:
    narrative_purpose: "Interpret results, acknowledge limits, position contribution"
    structure:
      - "Subsection: Key Findings"
      - "Paragraph: Simple methods competitive (95-100% accuracy)"
      - "Paragraph: Two-tier signal hierarchy (staleness primary, engagement secondary)"
      - "Paragraph: Domain specificity (benchmark repos cleaner than general open-source)"
      - "Subsection: Limitations"
      - "Paragraph: Domain scope (Papers with Code ML benchmarks, not general repos)"
      - "Paragraph: Sample size (120 repos, wide confidence intervals)"
      - "Paragraph: Temporal stability untested (IID split only)"
      - "Paragraph: Approximate linear separability (4.2% gap shows mild non-linearity)"
      - "Subsection: Implications"
      - "Paragraph: For research (test simple baselines first)"
      - "Paragraph: For practice (deploy lightweight classifiers)"
    honest_limitations:
      - "Domain-specific (Papers with Code ML/benchmark repos only) — generalization to non-ML domains untested"
      - "Small sample (120 repos, 24-sample test set) — confidence intervals wide [86%, 100%]"
      - "Temporal stability untested (IID split only, no train 2020-2022 / test 2023-2024)"
      - "Linear separability approximate, not perfect (LR 95.8% vs GB 100%)"
    positioning_against_prior_work:
      - "He et al. 2024: Our LR (95-100%) exceeds their GB+HITS (C-Index 0.810 ≈ 80-85%) on benchmark repos, suggesting graph features unnecessary for this domain"
      - "Adejumo & Johnson 2025: Our LR likely matches their CSI (F1 0.80) though explicit comparison not implemented (acknowledged limitation)"

  conclusion:
    narrative_purpose: "Reinforce message, open future (callback to hook)"
    callback_to_hook: "We opened by questioning complexity necessity. Our experiments show: simple logistic regression achieves 95-100% accuracy, challenging assumptions that repository maintenance requires sophisticated modeling."
    structure:
      - "P1: Restate key finding (simple suffices for benchmark repos)"
      - "P2: Mechanistic insight (two-tier hierarchy, staleness dominates)"
      - "P3: Practical impact (simplicity baseline for future work)"
      - "P4: Honest scope (domain-specific, temporal untested)"
      - "P5: Future vision (domain generalization, temporal validation, integration)"
      - "P6: Closing (Every complexity claim must now justify against our simple baseline)"
    future_work_preview:
      - "HIGH priority: Test on general open-source repos (web, CLI tools)"
      - "HIGH priority: Temporal validation (train 2020-2022, test 2023-2024)"
      - "MEDIUM priority: Baseline comparisons (majority, CSI)"
      - "MEDIUM priority: Threshold sensitivity (90, 120, 180, 270 days)"

# =============================================================================
# NARRATIVE COHERENCE CHECKS
# =============================================================================

narrative_coherence_checklist:
  - check: "Does Introduction hook connect to Conclusion ending?"
    status: "YES — both emphasize complexity vs simplicity, close loop on 'complexity necessity questioned'"

  - check: "Does each section naturally flow to the next?"
    status: "YES — Intro motivates → Related shows gap → Methods tests hypothesis → Experiments design tests → Results present evidence → Discussion interprets → Conclusion reinforces"

  - check: "Is key insight consistently emphasized throughout?"
    status: "YES — Two-tier hierarchy (staleness primary) appears in: Intro preview, Methods rationale, Results interpretation, Discussion findings, Conclusion summary"

  - check: "Are all major claims supported by evidence?"
    status: "YES — Every claim in Section 8.3 (strongest_claims) maps to specific figure/table in Results"

  - check: "Would a busy reviewer find Abstract compelling?"
    status: "YES — Hook (complexity vs simplicity), concrete numbers (95-100%, 4.2% gap), clear implication (simplicity baseline)"

# =============================================================================
# WRITING TONE & STYLE GUIDELINES
# =============================================================================

writing_guidelines:
  tone: "confident_but_honest"
  voice: "active_voice_preferred"
  tense: "past_for_methods_results_present_for_interpretation"

  specific_instructions:
    - "Emphasize 'simple methods are competitive' not 'complex methods unnecessary' (nuanced, not dismissive)"
    - "Acknowledge 4.2% LR-GB gap honestly — ensemble does provide value, though small"
    - "Frame limitations as scope boundaries, not flaws (domain-specific is a finding, not failure)"
    - "Use actual quantitative results (100% accuracy, 95.8%, -3.05 coefficient) not vague 'high' or 'strong'"
    - "Connect every result to mechanistic interpretation (don't just report numbers)"
    - "Respect prior work (He et al., Adejumo) — we fill gap, not criticize their approaches"

  avoid:
    - "Generic openings ('X is important...', 'Deep learning has achieved...')"
    - "Overclaiming ('always', 'never', 'all repositories')"
    - "Dismissing prior work ('previous methods failed', 'existing approaches inadequate')"
    - "Vague quantifiers ('significant improvement', 'substantial gain' without numbers)"
    - "Passive voice when active is clearer ('model was trained' → 'we trained')"

