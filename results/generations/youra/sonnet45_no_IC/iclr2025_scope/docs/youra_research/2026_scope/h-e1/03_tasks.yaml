tasks:
  # ===============================================
  # PRIORITY 1: Data Preparation (100-95)
  # ===============================================

  - id: data-01
    title: "Prepare Manual Data Extraction Files"
    description: |
      Download Champneys NLSI and Zhou Medical FL papers (PDFs).
      Manually extract benchmark result tables and save as CSV files.
      Create manual_data/ folder with champneys_benchmarks.csv and zhou_benchmarks.csv.
    type: data-preparation
    status: todo
    priority: 100
    complexity: medium
    estimated_effort: "2-3 hours"
    dependencies: []
    acceptance_criteria:
      - "manual_data/champneys_benchmarks.csv exists with 5 benchmarks"
      - "manual_data/zhou_benchmarks.csv exists with 9 benchmarks"
      - "CSV files follow standardized schema (benchmark_id, dataset_name, domain, method_rankings)"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-4"
      - "docs/youra_research/h-e1/03_architecture.md#ManualCollector"
      - "docs/youra_research/h-e1/03_config.md#manual-extraction-schema"
    notes: |
      MANUAL EXTRACTION REQUIRED - Cannot automate PDF table extraction.
      User must perform this task before automated collection begins.

  # ===============================================
  # PRIORITY 2: Environment Setup (94)
  # ===============================================

  - id: setup-01
    title: "Install Dependencies and Setup Project"
    description: |
      Install all required Python libraries for data collection:
      - ogb>=1.3.0 (OGB dataset access)
      - requests>=2.28.0 (HTTP API calls)
      - pandas>=1.5.0 (data aggregation)
      - beautifulsoup4>=4.11.0 (HTML parsing)
      - matplotlib>=3.6.0 (visualization)
      - seaborn>=0.12.0 (statistical plots)

      Create project folder structure:
      - code/collectors/
      - code/processing/
      - code/validation/
      - code/orchestration/
      - code/visualization/
      - manual_data/
      - output/
    type: setup
    status: todo
    priority: 94
    complexity: low
    estimated_effort: "30 min"
    dependencies: []
    acceptance_criteria:
      - "All 6 packages installed successfully"
      - "Folder structure created"
      - "requirements.txt file exists"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#Dependencies"
      - "docs/youra_research/h-e1/03_architecture.md#File-Structure"

  # ===============================================
  # PRIORITY 3: Epic Implementation Tasks (93-50)
  # ===============================================

  - id: epic-01
    title: "E1-2: Implement OGB Collection"
    description: |
      Implement OGBCollector class to extract graph benchmark data from OGB using official library.
      Target: 15 graph datasets (ogbn-arxiv, ogbn-products, ogbn-proteins, etc.)
    type: data-pipeline
    status: todo
    priority: 93
    complexity: 8
    complexity_breakdown:
      module_size: 2
      dependencies: 2
      algorithm: 2
      integration: 2
    estimated_effort: "3-4 hours"
    dependencies: ["setup-01"]
    acceptance_criteria:
      - "OGBCollector class implemented in collectors/ogb_collector.py"
      - "collect() method returns list of benchmark records"
      - "_extract_metadata() and _extract_rankings() methods functional"
      - "Successfully collects ≥10 OGB graph datasets"
      - "Method families classified correctly"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-1"
      - "docs/youra_research/h-e1/03_architecture.md#OGBCollector"
      - "docs/youra_research/h-e1/03_logic.md#OGBCollector-API"
    feature: "data-collection"

  - id: epic-02
    title: "E1-3: Implement GitHub Collection"
    description: |
      Implement GitHubCollector for parsing FedML/LEAF/pFL-Bench repositories.
      Target: 19 federated learning benchmarks total.

      LOGIC SUBTASKS (Priority 49-48):
      - Parse README tables with format detection (FedML vs LEAF vs pFL-Bench)
      - Extract result tables with BeautifulSoup for HTML, regex for markdown
    type: data-pipeline
    status: todo
    priority: 92
    complexity: 10
    complexity_breakdown:
      module_size: 3
      dependencies: 2
      algorithm: 3
      integration: 2
    estimated_effort: "4-5 hours"
    dependencies: ["setup-01"]
    acceptance_criteria:
      - "GitHubCollector class implemented in collectors/github_collector.py"
      - "_parse_readme() extracts tables from all 3 repo formats"
      - "_extract_results_table() handles HTML and markdown tables"
      - "Format detection identifies FedML/LEAF/pFL-Bench automatically"
      - "Successfully collects ≥15 FL benchmarks"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-2"
      - "docs/youra_research/h-e1/03_architecture.md#GitHubCollector"
      - "docs/youra_research/h-e1/03_logic.md#E1-3-GitHub-Parsing-Logic"
      - "docs/youra_research/h-e1/03_logic.md#_parse_readme-pseudo-code"
    feature: "data-collection"

  - id: epic-03
    title: "E1-4: Implement Papers with Code Collection"
    description: |
      Implement PapersWithCodeCollector using Papers with Code API.
      Query leaderboards filtered by domains: vision, nlp, graph.
      Target: ≥10 additional benchmarks.
    type: data-pipeline
    status: todo
    priority: 91
    complexity: 7
    complexity_breakdown:
      module_size: 2
      dependencies: 1
      algorithm: 2
      integration: 2
    estimated_effort: "2-3 hours"
    dependencies: ["setup-01"]
    acceptance_criteria:
      - "PapersWithCodeCollector class implemented in collectors/pwc_collector.py"
      - "API authentication configured (if required)"
      - "_query_api() fetches leaderboards by domain"
      - "_parse_leaderboard() extracts method rankings"
      - "Successfully collects ≥8 benchmarks from PWC"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-3"
      - "docs/youra_research/h-e1/03_architecture.md#PapersWithCodeCollector"
      - "docs/youra_research/h-e1/03_logic.md#PapersWithCodeCollector-API"
    feature: "data-collection"

  - id: epic-04
    title: "E1-5: Implement Manual Collector"
    description: |
      Implement ManualCollector to load pre-extracted CSV files from manual_data/.
      Reads champneys_benchmarks.csv and zhou_benchmarks.csv.

      CONFIG SUBTASKS (Priority 47-46):
      - CSV schema validation rules
      - Data source parameters (file paths, required columns)
    type: data-pipeline
    status: todo
    priority: 90
    complexity: 9
    complexity_breakdown:
      module_size: 2
      dependencies: 1
      algorithm: 4
      integration: 2
    estimated_effort: "2 hours"
    dependencies: ["setup-01", "data-01"]
    acceptance_criteria:
      - "ManualCollector class implemented in collectors/manual_collector.py"
      - "_load_csv() reads CSV files correctly"
      - "Schema validation applied to manual data"
      - "Successfully loads 14 benchmarks (5 Champneys + 9 Zhou)"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-4"
      - "docs/youra_research/h-e1/03_architecture.md#ManualCollector"
      - "docs/youra_research/h-e1/03_logic.md#ManualCollector-API"
      - "docs/youra_research/h-e1/03_config.md#C-5-1-manual-extraction-schema"
    feature: "data-collection"

  - id: epic-05
    title: "E1-6: Implement Data Standardization"
    description: |
      Implement SchemaStandardizer to transform all collected data into unified schema.
      Handles source-specific transformations (OGB, GitHub, PWC, Manual formats).
    type: data-pipeline
    status: todo
    priority: 89
    complexity: 8
    complexity_breakdown:
      module_size: 2
      dependencies: 2
      algorithm: 2
      integration: 2
    estimated_effort: "2-3 hours"
    dependencies: ["epic-01", "epic-02", "epic-03", "epic-04"]
    acceptance_criteria:
      - "SchemaStandardizer class implemented in processing/standardizer.py"
      - "standardize() method transforms all source formats"
      - "_validate_schema() checks required fields"
      - "Source-specific transformers (_transform_ogb_format, etc.) functional"
      - "Output follows unified benchmark record schema"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-5"
      - "docs/youra_research/h-e1/03_architecture.md#SchemaStandardizer"
      - "docs/youra_research/h-e1/03_logic.md#SchemaStandardizer-API"
    feature: "data-processing"

  - id: epic-06
    title: "E1-7: Implement Validation and Orchestration"
    description: |
      Implement DataValidator (success criteria validation) and CollectionOrchestrator (main workflow).

      LOGIC SUBTASKS (Priority 49-48):
      - CollectionOrchestrator.run() with sequential collection + partial failure handling
      - DataValidator with domain diversity checks
    type: orchestration
    status: todo
    priority: 88
    complexity: 11
    complexity_breakdown:
      module_size: 3
      dependencies: 3
      algorithm: 2
      integration: 3
    estimated_effort: "3-4 hours"
    dependencies: ["epic-05"]
    acceptance_criteria:
      - "DataValidator class implemented in validation/validator.py"
      - "validate() checks: total≥50, domains≥3, completeness=100%"
      - "CollectionOrchestrator class implemented in orchestration/orchestrator.py"
      - "run() workflow: collect → standardize → validate"
      - "_safe_collect() with exponential backoff retry (1s, 2s, 4s)"
      - "Partial failure handling (continue on source failure)"
      - "Gate decision logic (PASS/PARTIAL/FAIL)"
    reference_files:
      - "docs/youra_research/h-e1/03_prd.md#FR-6"
      - "docs/youra_research/h-e1/03_architecture.md#DataValidator"
      - "docs/youra_research/h-e1/03_architecture.md#CollectionOrchestrator"
      - "docs/youra_research/h-e1/03_logic.md#E1-7-Orchestration-Logic"
      - "docs/youra_research/h-e1/03_logic.md#CollectionOrchestrator-pseudo-code"
      - "docs/youra_research/h-e1/03_config.md#collection-thresholds"
    feature: "orchestration"

  - id: epic-07
    title: "E1-8: Implement Visualization Generation"
    description: |
      Implement visualizer to generate 4 required plots:
      1. Bar chart: Benchmark count by domain
      2. Pie chart: Benchmark sources breakdown
      3. Stacked bar: Method family distribution
      4. Heatmap: Data completeness by source
    type: evaluation
    status: todo
    priority: 87
    complexity: 6
    complexity_breakdown:
