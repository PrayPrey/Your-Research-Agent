metadata:
  generated_at: '2026-07-13T07:39:49'
  workflow: phase2a-dialogue
  architecture: Self-Play Loop (Claude-only, IC-ablation)
  schema_version: 10.0.0
  gap_id: GAP-1
  gap_title: No Single Optimal Method Across Dataset Diversity
  execution_mode: UNATTENDED
  discussion_exchanges: 7
  convergence_reason: All 6 criteria met after 7 exchanges
established_facts:
  claims:
  - claim: 'Method rankings vary across datasets (Zhou 2025: 9 medical datasets, no single algorithm optimal)'
    status: BUILD_ON
    evidence: Zhou et al. Table V, Champneys et al. Table with 5 benchmarks
  - claim: Small datasets benefit from augmentation (TB 668 samples +17pp vs ColonPath 10K +0.3pp)
    status: BUILD_ON
    evidence: Zhou et al. DDPM+LS results
  - claim: 'Structured problems favor polynomial bases (W-H saturation: NARX-Poly 0.032 vs LSTM 0.126)'
    status: BUILD_ON
    evidence: Champneys et al. Table
  - claim: 50-60 published benchmarks exist with baseline comparisons (OGB, FedML, LEAF, pFL-Bench)
    status: PROVE_NEW
    evidence: Claimed in discussion Exchange 7, needs verification
  scope_reduction_percentage: 25
  phase2b_4_instructions: 'Focus verification on meta-classifier prediction accuracy and feature sufficiency. Skip re-verification
    of Zhou/Champneys benchmark results (already published). Verify: (1) 50+ benchmarks collectible, (2) Tier 1+2 features
    computable in <1 min, (3) Cross-validation achieves >45% top-30% accuracy.'
core_statement:
  hypothesis_id: H-MetaMethodSelector-v1
  confidence_level: 0.7
  core_hypothesis_statement: Under supervised learning settings with existing benchmark datasets, if a meta-classifier is
    trained on aggregated benchmark results (50-60 datasets) using fast-to-compute dataset features (sample size, dimensionality,
    class imbalance, signal statistics), then it will predict method families (Linear/Polynomial/RNN/Augmentation) that achieve
    top-30% ranking performance on held-out datasets with >50% success rate, because systematic performance patterns correlate
    dataset characteristics with method strengths.
  alternative_hypothesis_h0: "There is no significant difference in top-30% ranking accuracy between meta-classifier predictions\
    \ and random method selection (\u226435% vs. 30% random baseline, p > 0.05)."
variables:
  independent:
  - name: Dataset Characteristics (Features)
    type: continuous
    operationalization: 'Tier 1: sample_size, dimensionality, class_imbalance (Gini), signal_noise_ratio. Tier 2: autocorrelation
      (time-series), edge_density (vision), correlation_rank (tabular)'
    levels: null
  dependent:
  - name: Predicted Method Ranking Percentile
    type: continuous
    operationalization: "Percentile ranking (0-100%) of meta-classifier's recommended method on held-out benchmark. Target:\
      \ \u226430% (top-30%)"
    primary: true
  - name: Cross-Validation Success Rate
    type: continuous
    operationalization: 'Percentage of held-out benchmarks where predicted method achieves top-30% ranking. Range: 0-100%'
    primary: false
  controlled:
  - name: Training/Test Split
    operationalization: Leave-5-out cross-validation (train on 55, test on 5), stratified by domain if possible
  - name: Method Representative Selection
    operationalization: 'Each family uses canonical representative: LSTM (RNN), NARX-Poly (Polynomial), ARX (Linear), DDPM+LS
      (Augmentation)'
  - name: Feature Computation Budget
    operationalization: Tier 1+2 features must complete in <1 min per dataset
causal_mechanism:
  causal_chain_count: 4
  steps:
  - step: 1
    description: Dataset characteristics (sample size, dimensionality, signal properties) determine which method families
      have structural advantages
    evidence: 'Zhou: small datasets (TB 668) benefit from augmentation (+17pp), Champneys: structured problems (W-H saturation)
      favor polynomial bases'
    falsifier: "If simple features (variance, sample size) show zero correlation with method rankings (Spearman \u03C1 \u2248\
      \ 0, p > 0.1)"
  - step: 2
    description: Aggregated benchmark results from literature provide sufficient training examples (50-60 datasets) to learn
      feature-method relationships
    evidence: 'Exchange 7 expansion: OGB (15), FedML (6), LEAF (5), pFL-Bench (8), Champneys (5), Zhou (9) = 48+ total'
    falsifier: If <30 benchmarks collectible, or collected benchmarks lack diversity (all same domain/size range)
  - step: 3
    description: Random Forest meta-classifier trained on features extracts generalizable patterns (not domain folklore)
    evidence: 'Exchange 7 ablation test: removing domain labels reduces accuracy <5%, indicating features are predictive independent
      of domain encoding'
    falsifier: If ablation shows >20% accuracy drop without domain labels, predictions are spurious domain correlations
  - step: 4
    description: Predicted method family achieves competitive performance (top-30%) on new datasets without exhaustive search
    evidence: 'Exchange 5: ''Practitioner value - informed starting point reduces wasted compute vs. trying everything'''
    falsifier: If predicted methods rank >70th percentile (bottom 30%) on majority of held-out datasets, predictor adds no
      value
  key_tension: 'Trade-off between feature simplicity (fast computation, Tier 1 only) and predictive power (may need Tier 2
    domain-specific features). Exchange 6 identified: simple features may be insufficient for structured problems like W-H
    saturation detection.'
  evidence_summary: 'Mechanism supported by: (1) Zhou/Champneys empirical evidence of dataset-method correlations, (2) 50+
    benchmark availability from literature, (3) Random Forest''s proven ability to learn nonlinear feature-target relationships
    from tabular data.'
key_assumptions:
- id: A1
  assumption: "Published benchmark results aggregate enough datapoints (\u226550) to learn robust relationships"
  supporting_evidence: 'Exchange 7 mining plan: OGB+FedML+LEAF+pFL-Bench+Champneys+Zhou = 48-60 total'
  consequence_if_violated: 'If <30 benchmarks collectible, meta-classifier overfits (Exchange 6: 14 samples insufficient per
    Prof. Rex)'
- id: A2
  assumption: Fast features (Tier 1+2) capture sufficient dataset characteristics to differentiate method performance
  supporting_evidence: 'Exchange 3 (Prof. Pax): sample size, variance, dimensionality trivial to compute. Exchange 7: Tier
    2 adds autocorrelation/edge density for domain-specific patterns'
  consequence_if_violated: If Tier 1+2 features achieve <40% accuracy (no better than domain folklore baseline), need expensive
    Tier 3 probing that violates feasibility
- id: A3
  assumption: Method families exhibit consistent behavior across similar datasets (generalization)
  supporting_evidence: 'Champneys: RNN family wins 3/5 benchmarks, Zhou: DDPM+LS wins 7/9. Not random variation'
  consequence_if_violated: If method rankings are chaotic (no feature correlation), meta-learning is impossible
- id: A4
  assumption: Cross-validation on published benchmarks approximates zero-shot generalization to new datasets
  supporting_evidence: 'Exchange 5 (Dr. Sage): temporal generalization test - train on pre-2024, test on 2024+ benchmarks'
  consequence_if_violated: If CV accuracy high but new-benchmark accuracy low, meta-classifier learned benchmark-specific
    artifacts not generalizable features
- id: A5
  assumption: Top-30% ranking threshold represents useful guidance for practitioners
  supporting_evidence: 'Exchange 5: ''Top-30% is useful starting point vs. top-1% unrealistic perfection or >70% avoid catastrophic
    failure'''
  consequence_if_violated: If practitioners demand >90% accuracy to trust predictions (measured via user survey), adoption
    unlikely
scope:
  applies_to: "Supervised learning benchmarks (classification, regression) across vision, time-series, and tabular domains\
    \ where: (1) existing baseline method comparisons published in literature, (2) sample size n \u2208 [100, 100K], (3) datasets\
    \ amenable to feature extraction in <1 min."
  does_not_apply_to: Unsupervised learning, reinforcement learning, generative models (insufficient published baseline comparisons
    per Exchange 5). Real-time systems with hard latency constraints (<1 sec) where feature computation time prohibitive.
    Extreme-scale datasets (n > 1M) where feature computation slow. Novel domains with <10 published benchmarks (insufficient
    training data).
  known_limitations: Feature engineering is semi-manual (Tier 1 universal, Tier 2 domain-conditional). May fail on datasets
    with hidden structure not captured by simple statistics (e.g., W-H saturation detection per Exchange 6). Temporal drift
    possible (methods popular in 2020 may not win 2024 benchmarks due to algorithmic progress).
predictions:
- id: P1
  primary: true
  statement: "On 5 held-out benchmarks from leave-5-out CV, meta-classifier's recommended method family M achieves top-30%\
    \ ranking in \u22653/5 cases (60% success rate)"
  test_method: Train Random Forest on 55 published benchmarks, predict on 5 held-out, evaluate predicted method's ranking
    percentile
  success_criterion: ">50% success rate (\u22653/5 correct predictions), Chi-square test p < 0.05 vs. 30% random baseline"
  falsification: "If success rate \u226440% (\u22642/5 correct) or p > 0.05, meta-classifier no better than random"
- id: P2
  primary: false
  statement: "Removing domain labels from features reduces accuracy by <5% (e.g., 55% \u2192 52%), indicating features are\
    \ predictive independent of domain folklore"
  test_method: 'Ablation study: train meta-classifier WITH domain one-hot, then WITHOUT domain, compare CV accuracy'
  success_criterion: Accuracy drop <5%, SHAP feature importance shows domain weight <0.2
  falsification: If accuracy drops >20% without domain, OR domain has SHAP importance >0.5, predictions driven by domain encoding
    not features
- id: P3
  primary: false
  statement: "Meta-classifier trained on pre-2024 benchmarks predicts method rankings on post-2024 benchmarks with \u2265\
    40% top-30% accuracy (temporal generalization)"
  test_method: 'Temporal zero-shot test: train on OGB+FedML+Champneys (pre-2024), test on newly published 2024+ benchmarks
    from Papers with Code'
  success_criterion: "\u226540% top-30% accuracy on new benchmarks, demonstrating temporal stability of feature-method relationships"
  falsification: If <30% accuracy (no better than random), feature-method correlations are era-specific artifacts not stable
    patterns
experimental_setup:
  dataset:
    name: Aggregated Benchmark Collection
    type: standard
    source: 'Literature mining: OGB (15 graph datasets), FedML (6), LEAF (5), pFL-Bench (8), Champneys NLSI (5), Zhou medical
      FL (9), Papers with Code leaderboards (10+)'
    path: To be collected from public repositories and published papers
    hypothesis_fit: Collection spans vision/time-series/tabular domains with documented baseline comparisons, providing diverse
      training examples for meta-learning
  model:
    name: Random Forest Meta-Classifier
    type: Ensemble tree-based classifier
    source: scikit-learn RandomForestClassifier(n_estimators=100, max_depth=10)
    hypothesis_fit: Interpretable (feature importance via SHAP), handles nonlinear feature relationships, robust to small
      sample sizes, proven for tabular data
  baselines:
  - name: Random Selection
    method: Uniformly sample method family from {Linear, Polynomial, RNN, Augmentation}, expected 30% top-30% accuracy
  - name: Domain Folklore
    method: "Predict based on domain only (vision\u2192CNN, time-series\u2192RNN), expected 40-50% accuracy per Exchange 7"
  - name: Majority Class
    method: Always predict most frequent winner in training set (degeneracy check), expected 30-40% accuracy
novelty:
  preserved_novelty: First work to frame dataset-to-method selection as a trainable meta-learning problem, transforming descriptive
    observations into actionable guidance
  key_innovation: Predictive model using fast-to-compute dataset fingerprints (vs. manual domain expertise or exhaustive trial-and-error).
    Tiered feature approach balances feasibility (Tier 1 universal, 1 sec) with predictive power (Tier 2 domain-specific,
    5-15 sec)
  differentiation:
  - prior_work: Afkanpour et al. 2024 systematic review
    difference: Qualitative guidance only ('consider data structure'), no predictive model
  - prior_work: Liao et al. 2025 heterogeneity challenges
    difference: Descriptive problem statement, no decision framework
  - prior_work: Zhou et al. 2025 FL benchmark
    difference: Reports method rankings on 9 datasets but provides no predictor for NEW datasets
  - prior_work: Champneys et al. 2024 NLSI baselines
    difference: Establishes baseline comparisons but no meta-analysis of what dataset features predict winners
phase2b_inputs:
  verification_protocol: Train meta-classifier on OGB+FedML+Champneys benchmarks (30 total), predict on Zhou's 9 medical datasets
    (held-out), check if predicted methods rank top-30%. If yes, proceed to full 50-60 benchmark training.
  implementation_constraints: 'Feature extraction must complete in <1 min for largest benchmark (OGB 100M nodes). Use scikit-learn
    only (no custom implementations). Random Forest hyperparameters: n_estimators=100, max_depth=10 (prevent overfitting on
    small training set).'
  success_thresholds:
    SUCCESS: '>50% top-30% accuracy on held-out benchmarks, p < 0.05'
    PARTIAL: 40-50% accuracy - investigate feature sufficiency, try Tier 3 or increase benchmark collection
    FAIL: <40% accuracy - reject hypothesis, features insufficient or method rankings too chaotic
