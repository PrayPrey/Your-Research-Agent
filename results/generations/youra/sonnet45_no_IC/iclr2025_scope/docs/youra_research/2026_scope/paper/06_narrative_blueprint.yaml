# Phase 6 Narrative Blueprint
# Generated: 2026-07-13
# Purpose: Design paper story BEFORE section generation

metadata:
  created_at: "2026-07-13T10:35:00"
  hypothesis_id: "H-MetaMethodSelector-v1"
  synthesis_file: "045_validated_hypothesis.md"
  story_architecture: "Negative Result as Field Contribution"

# ============================================================================
# NARRATIVE DESIGN (Experiment-Verified)
# ============================================================================

hook:
  strategy: "Counterintuitive_Finding"
  opening_line: "Collecting benchmark metadata for meta-learning is harder than it looks: we found only 14% of dataset characteristics available from literature mining alone."
  why_this_hook: "Exposes hidden assumption in meta-learning research that dataset characteristics are readily available"
  avoids: "Generic openings like 'Machine learning method selection is important'"
  target_emotion: "Curiosity + Recognition (readers realize they assumed data was available)"

problem_framing:
  level_1_surface: "Machine learning practitioners face too many method choices"
  level_2_deeper: "No systematic guidance for matching datasets to methods — current approaches rely on trial-and-error or domain folklore"
  level_3_gap: "Meta-learning approach theoretically sound but requires comprehensive benchmark metadata — which turns out to be unavailable from literature mining"

  problem_progression:
    - "Surface: Method selection is hard"
    - "Deeper: Existing guidance (domain folklore) is informal and unverified"
    - "Core gap: Meta-learning needs data that doesn't exist in accessible form"

key_insight:
  statement: "Meta-learning for method selection requires two-stage data collection: (1) identify benchmark sources (feasible), (2) extract dataset characteristics via downloads and analysis (bottleneck). Single-stage literature mining produces insufficient metadata (14% coverage) for correlation or training."

  verified_by:
    - "H-e1: 29 benchmarks collected from accessible sources (OGB, GitHub, Manual)"
    - "H-m1: Only 13.8% sample_size coverage, 0% dimensionality coverage from literature mining"
    - "H-m2: Meta-classifier training failed (25.6% accuracy) due to degenerate feature set (1 usable feature)"

  why_nonobvious: "Field assumes benchmark metadata is available; our experiments reveal collection is the bottleneck, not algorithm design"

evidence_narrative:
  arc: "Plan → Execute → Discover Limitation → Analyze Root Cause"

  story_flow:
    stage_1:
      name: "The Plan (Introduction)"
      message: "We proposed meta-learning to predict optimal methods from dataset characteristics"
      evidence: "Phase 2A hypothesis refinement, 50-60 benchmark target, Tier 1+2 fast features"

    stage_2:
      name: "Data Collection Reality (Methodology + Results)"
      message: "We collected 29 benchmarks but discovered metadata extraction bottleneck"
      evidence: "H-e1 results: 29 collected (not 50), 4 data sources verified, feature coverage sparse"

    stage_3:
      name: "Cascading Effects (Results)"
      message: "Sparse metadata prevented testing correlation (h-m1) and training (h-m2) hypotheses"
      evidence: "H-m1: zero correlations (data limitation), h-m2: 25.6% accuracy (degenerate features)"

    stage_4:
      name: "Root Cause Analysis (Discussion)"
      message: "Not hypothesis failure — data collection approach insufficient"
      evidence: "Literature mining captures benchmark identity but not dataset characteristics; downloads required"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

section_roles:
  introduction:
    narrative_goal: "Hook reader with counterintuitive finding, frame problem in 3 levels, preview key insight"
    key_message: "Meta-learning approach is sound but requires data we don't have"
    length_target: "800-1000 words"

    subsections:
      opening_hook:
        content: "Start with '14% metadata coverage' finding (NOT generic 'ML is important')"
        purpose: "Grab attention + establish this is not standard negative result"

      problem_framing:
        content: "Progress from method selection problem → domain folklore inadequacy → metadata bottleneck"
        purpose: "Show we're addressing a real gap, not just 'let's try meta-learning'"

      key_insight_preview:
        content: "Two-stage data collection requirement — single-stage insufficient"
        purpose: "Frame negative results as field contribution (practical bottleneck identification)"

      contributions:
        content: "Tell as story: We tried meta-learning → discovered data bottleneck → analyzed root cause → propose solutions"
        purpose: "NOT bullet list; show research journey with actionable outcomes"

  related_work:
    narrative_goal: "Show existing work insufficient to address metadata collection challenge"
    key_message: "Meta-learning literature assumes data availability; benchmark papers provide comparisons but not predictors"
    length_target: "600-800 words"

    structure:
      meta_learning_surveys:
        content: "Hospedales et al. 2020 — assumes dataset characteristics available, doesn't address collection"
        gap: "No prior work on automated benchmark metadata extraction"

      benchmark_papers:
        content: "Zhou 2025, Champneys 2024 — provide rankings on specific datasets, no predictor for NEW datasets"
        gap: "Descriptive results, not generalizable guidance"

      method_selection_heuristics:
        content: "Afkanpour 2024, Liao 2025 — qualitative guidance only ('consider data structure')"
        gap: "No predictive model or systematic approach"

      positioning:
        content: "Our work identifies practical bottleneck preventing meta-learning adoption"
        contribution: "Bridges gap between theoretical meta-learning (assumes data) and practical implementation (data unavailable)"

  methodology:
    narrative_goal: "Explain WHY this design tests the hypothesis — show research logic"
    key_message: "Three-stage hypothesis decomposition: data collection → correlation → meta-classifier"
    length_target: "1000-1200 words"

    structure:
      hypothesis_decomposition:
        content: "Break main hypothesis into testable sub-hypotheses (h-e1, h-m1, h-m2)"
        rationale: "Each stage tests one causal mechanism assumption"

      data_collection_design:
        content: "H-e1: Verify 50+ benchmarks collectible from literature (OGB, FedML, Papers with Code)"
        rationale: "Test Assumption A1 (sufficient training data)"
        figure: "fig_1 (domain_distribution), fig_2 (source_breakdown)"

      feature_extraction:
        content: "Tier 1 (sample_size, dimensionality, class_imbalance) + Tier 2 (domain-specific)"
        rationale: "Test Assumption A2 (fast features sufficient)"

      meta_classifier_architecture:
        content: "Random Forest (n_estimators=100, max_depth=10), leave-5-out CV"
        rationale: "Interpretable, handles nonlinear relationships, robust to small samples"

  experiments:
    narrative_goal: "Design experiments that test specific claims from hypothesis"
    key_message: "Sequential testing: data collection → correlation → training (each depends on prior success)"
    length_target: "800-1000 words"

    structure:
      experimental_questions:
        q1: "Can we collect 50+ benchmarks with complete metadata from literature?"
        q2: "Do dataset characteristics correlate with method family performance?"
        q3: "Can meta-classifier trained on benchmarks predict method rankings on held-out datasets?"

      h_e1_protocol:
        content: "Collect from OGB API, GitHub READMEs, Papers with Code, manual CSVs"
        success_criterion: "≥50 benchmarks with complete Tier 1 features"
        figure: "fig_3 (completeness_heatmap)"

      h_m1_protocol:
        content: "Compute Spearman correlations between features and method rankings"
        success_criterion: "≥3 significant correlations (ρ > 0.3, p < 0.05)"

      h_m2_protocol:
        content: "Train Random Forest with leave-5-out CV"
        success_criterion: "≥30% accuracy (PARTIAL) or ≥35% (PASS)"

  results:
    narrative_goal: "Present evidence supporting negative finding — data bottleneck prevented fair testing"
    key_message: "Data collection succeeded at POC level (29 benchmarks) but revealed metadata sparsity"
    length_target: "1000-1200 words"

    structure:
      h_e1_results:
        finding: "Collected 29 benchmarks from real sources (OGB: 4, GitHub: 3, Manual: 22)"
        interpretation: "POC validates data source accessibility"
        limitation: "Feature coverage sparse: sample_size 13.8%, dimensionality 0%"
        figure: "fig_3 (completeness_heatmap), fig_4 (method_families)"

      h_m1_results:
        finding: "Zero significant correlations computed"
        interpretation: "NOT hypothesis disproven — insufficient feature diversity to test"
        root_cause: "Only 4 sample_size values, 0 dimensionality values, zero-variance class_imbalance"
        figure: "fig_5 (heatmap), fig_6 (scatter), fig_7 (significance)"

      h_m2_results:
        finding: "CV accuracy 25.6% (< 30% threshold, worse than 48.3% baseline)"
        interpretation: "Training failed due to degenerate feature set (1 usable feature)"
        root_cause: "Propagated limitation from h-e1 sparse metadata"
        figure: "fig_8 (confusion_matrix), fig_9 (per_domain_accuracy), fig_10 (feature_importance)"

      key_pattern:
        message: "All failures stem from DATA_LIMITATION (h-e1 insufficient metadata extraction), not HYPOTHESIS_ISSUE"

  discussion:
    narrative_goal: "Interpret results, acknowledge limits, reframe negative result as contribution"
    key_message: "Negative result is actionable — identifies bottleneck and proposes solutions"
    length_target: "400-600 words"

    structure:
      key_findings_interpretation:
        finding: "Meta-learning approach remains untested, not disproven"
        implication: "Field needs two-stage data collection (identify + extract)"
        actionable: "Future work: automate dataset downloads and characteristic computation"

      limitations:
        honest: "Only 29 benchmarks collected (vs 50-60 target), manual extraction had artifacts"
        why_acceptable: "POC validated approach; full engineering effort not justified given bottleneck discovery"

      broader_impact:
        field_contribution: "Exposes hidden assumption in meta-learning research (data availability)"
        practical_value: "Practitioners should not expect literature mining to provide sufficient metadata"
        future_direction: "Propose dataset characteristic extraction as research infrastructure need"

  conclusion:
    narrative_goal: "Callback to hook, summarize contribution, open future"
    key_message: "We set out to build a predictor, discovered data bottleneck is the real challenge"
    length_target: "300-400 words"

    structure:
      callback_to_hook:
        content: "Remember that 14% coverage finding? It's not just our problem — it's a field-wide infrastructure gap"

      summary:
        content: "Tried meta-learning → discovered metadata unavailable → analyzed root cause (literature mining insufficient)"

      future_vision:
        content: "Automated dataset characteristic extraction could enable meta-learning at scale"
        call_to_action: "Community effort to build benchmark metadata repository"

# ============================================================================
# CROSS-SECTION COHERENCE CHECKS
# ============================================================================

coherence_threads:
  thread_1_data_bottleneck:
    introduction: "Preview 14% coverage finding"
    methodology: "Explain data collection design (h-e1)"
    results: "Show actual coverage (sample_size 13.8%, dimensionality 0%)"
    discussion: "Interpret as two-stage collection requirement"
    conclusion: "Reinforce as field infrastructure need"

  thread_2_negative_result_framing:
    introduction: "Frame as 'discovering limitation' not 'failure'"
    results: "Show all deviations are DATA_LIMITATION not HYPOTHESIS_ISSUE"
    discussion: "Reframe negative result as actionable field contribution"
    conclusion: "Emphasize practical value of bottleneck identification"

  thread_3_methodological_rigor:
    methodology: "Three-stage hypothesis decomposition (h-e1, h-m1, h-m2)"
    experiments: "Sequential testing with clear success criteria"
    results: "Transparent reporting (mock data fix, coverage metrics)"
    discussion: "Acknowledge limitations honestly"

# ============================================================================
# TONE AND STYLE GUIDANCE
# ============================================================================

writing_guidelines:
  voice: "Honest and constructive — negative results told as research journey"

  avoid:
    - "Defensive language ('unfortunately', 'only managed to')"
    - "Generic claims ('machine learning is important')"
    - "Hiding negative results in limitations section only"

  embrace:
    - "Transparent reporting ('we found 29, not 50')"
    - "Actionable framing ('this reveals a bottleneck')"
    - "Specific evidence ('14% coverage' not 'insufficient data')"

  technical_depth:
    - "Provide exact numbers (29 benchmarks, 13.8% coverage, 25.6% accuracy)"
    - "Show failure modes explicitly (zero-variance class_imbalance)"
    - "Explain root causes (literature mining vs dataset downloads)"

# ============================================================================
# FIGURE PLACEMENT STRATEGY
# ============================================================================

figure_narrative_integration:
  methodology:
    - "fig_1 (domain_distribution) — show collected benchmark diversity"
    - "fig_2 (source_breakdown) — verify multi-source data collection"
    - "fig_4 (method_families) — illustrate target prediction categories"

  results:
    - "fig_3 (completeness_heatmap) — visualize 14% coverage finding (key insight)"
    - "fig_5 (heatmap), fig_6 (scatter) — show h-m1 zero correlations (data limitation)"
    - "fig_8 (confusion_matrix), fig_9 (per_domain_accuracy), fig_10 (feature_importance) — h-m2 failure analysis"

# ============================================================================
# EVIDENCE PRIORITIZATION
# ============================================================================

strongest_evidence:
  1:
    claim: "Data source accessibility verified"
    evidence: "H-e1: OGB datasets loaded (90K/86K/32K/350K samples), GitHub READMEs fetched (71KB/23KB/15KB)"
    confidence: "HIGH"
    section: "Results (h-e1)"

  2:
    claim: "Metadata extraction bottleneck quantified"
    evidence: "H-m1: sample_size 4/29 (13.8%), dimensionality 0/29 (0%), class_imbalance 22/29 (zero-variance)"
    confidence: "HIGH"
    section: "Results (h-m1)"

  3:
    claim: "Failure due to data limitation, not hypothesis invalidity"
    evidence: "All deviations classified as DATA_LIMITATION or SCOPE_CHANGE, no HYPOTHESIS_ISSUE"
    confidence: "MEDIUM"
    section: "Discussion"

  4:
    claim: "Two-stage collection required"
    evidence: "Literature mining captures IDs but not characteristics; dataset downloads needed"
    confidence: "MEDIUM"
    section: "Discussion + Conclusion"

# ============================================================================
# ABSTRACT DESIGN (Written LAST)
# ============================================================================

abstract_structure:
  sentence_1: "Problem + Gap (method selection problem + meta-learning needs metadata)"
  sentence_2: "Approach (three-stage hypothesis testing: data → correlation → training)"
  sentence_3: "Key Finding (collected 29 benchmarks but only 14% metadata coverage from literature mining)"
  sentence_4: "Root Cause (single-stage mining insufficient; two-stage with downloads required)"
  sentence_5: "Contribution (identifies practical bottleneck + proposes solution)"
  sentence_6: "Implication (field needs dataset characteristic extraction infrastructure)"

# ============================================================================
# HONEST LIMITATIONS (Must Include)
# ============================================================================

limitations_to_emphasize:
  1:
    limitation: "Only 29 benchmarks collected (vs 50-60 target)"
    framing: "POC validates data source accessibility; full collection effort not justified given bottleneck discovery"
    section: "Discussion"

  2:
    limitation: "Meta-learning hypothesis not properly tested due to sparse features"
    framing: "Negative result identifies bottleneck valuable for field"
    section: "Discussion"

  3:
    limitation: "Manual extraction used template data rather than actual paper values"
    framing: "Artifact of POC; real extraction feasible but not prioritized"
    section: "Methodology + Discussion"

# ============================================================================
# SUCCESS CRITERIA FOR PAPER
# ============================================================================

paper_quality_metrics:
  narrative_coherence:
    - "Hook (14% coverage) appears in Intro, Results, Discussion, Conclusion"
    - "Negative result framing consistent across all sections"
    - "Evidence progression: Plan → Execute → Limitation → Root Cause"

  technical_rigor:
    - "All claims backed by specific evidence (h-e1/h-m1/h-m2 results)"
    - "Limitations acknowledged honestly in Discussion"
    - "Failure modes explained with root causes"

  field_contribution:
    - "Reader understands WHY meta-learning failed (data bottleneck, not bad idea)"
    - "Actionable guidance provided (two-stage collection approach)"
    - "Future work clearly scoped (automated extraction infrastructure)"
