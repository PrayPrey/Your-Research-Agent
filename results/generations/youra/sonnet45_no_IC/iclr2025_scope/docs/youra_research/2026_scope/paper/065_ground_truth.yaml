  hallucination_checks:
    - "Check if paper claims exist in source artifacts (no invented results)"
    - "Verify coverage percentages computed correctly (13.8% = 4/29, 0% = 0/29)"
    - "Confirm 'two-stage collection' interpretation supported by h-e1 findings"
    - "Check if 'DATA_LIMITATION' classification justified by evidence"

  overstatement_checks:
    - "Does paper claim 'meta-learning disproven'? (Should be 'untested', not 'disproven')"
    - "Does paper claim 'comprehensive benchmark collection'? (Should be '29 POC-level')"
    - "Does paper claim 'correlations don't exist'? (Should be 'correlations untestable due to sparse data')"
    - "Does paper claim 'novel meta-learning algorithm'? (Should be 'procedural contribution: infrastructure gap identification')"

  internal_consistency_checks:
    - "Does abstract match results (29 benchmarks, 14% coverage, 25.6% accuracy)?"
    - "Does introduction hook (14%) appear in results, discussion, conclusion?"
    - "Are all quantitative claims in introduction/discussion supported by results section?"
    - "Do limitations section claims match deviation analysis in synthesis?"

