      - count_significant_pairs(): Count pairs with rho>0.3, p<0.05
      - get_top_correlations(n=5): Top N by |rho|
      - check_inverse_correlations(): Find rho<-0.3, p<0.05
      - generate_summary_stats(): mean_rho, median_p, etc.
