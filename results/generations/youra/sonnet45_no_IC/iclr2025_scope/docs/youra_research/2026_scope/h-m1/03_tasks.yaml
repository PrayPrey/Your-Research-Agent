      - Handles missing values (NaN)
      - Dimensionality correctly parses [H, W, C] format

  - id: M1-4
    title: Implement Tier 2 Feature Computation
    description: |
      Implement Tier2FeatureComputer with domain-specific features:
      - Vision: image_resolution (H*W), channel_count (C)
      - Graph: edge_density, avg_degree (placeholder)
      - Tabular: feature_variance, categorical_ratio (placeholder)
      - NLP: sequence_length, vocabulary_size (placeholder)
      Include 2 subtasks for domain logic.
    category: implementation
    priority: 3
