    description: |
      Implement SpearmanCorrelator class:
      - compute_correlation_matrix(): All (feature, method) pairs
      - Use scipy.stats.spearmanr for correlation
      - Filter by rho_threshold=0.3, alpha=0.05
      - Output: Dict with {pair_name: {rho, p_value, significant}}
    category: implementation
    priority: 3
