  - id: M1-3
    title: Implement Tier 1 Feature Computation
    description: |
      Implement Tier1FeatureComputer class with 4 universal features:
      - sample_size: Extract from benchmark metadata
      - dimensionality: Handle int or list [H, W, C] → product
      - num_classes: Parse string or int
      - class_imbalance: Gini coefficient from ranking variance
