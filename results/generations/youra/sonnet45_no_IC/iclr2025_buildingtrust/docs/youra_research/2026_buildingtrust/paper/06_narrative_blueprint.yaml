# SECTION 8: FIGURE-CONTENT MAPPING
# ═══════════════════════════════════════════════════════════════

figure_content_mapping:
  fig_1:
    section: "methodology"
    narrative_role: "Validate variance assumption (σ>0.2 for all dimensions)"
    caption_guidance: "Variance validation showing all three trustworthiness dimensions (reliability, robustness, fairness) exceed σ=0.2 threshold on TruthfulQA with Llama-2-7b. Error bars: 95% CI. Validates methodological foundation for correlation analysis."

  fig_2:
    section: "results"
    narrative_role: "Show memorization mechanism (r=0.72 on factual stratum)"
    caption_guidance: "Reliability-robustness correlation on factual prompts (n=343). Pearson r=0.7233, p<0.001, 95% CI [0.67, 0.77]. Strong positive coupling indicates shared memorization mechanism enabling both factual correctness and consistent paraphrase retrieval."

  fig_3:
    section: "results"
    narrative_role: "Show mechanism specificity (factual r=0.72 vs misinformation r=0.28)"
    caption_guidance: "Mechanism specificity: Factual stratum shows r=0.72 vs misinformation stratum r=0.28. Contrast |Δr|=0.44 validates that memorization mechanism is specific to factual content, not universal."

  fig_4:
    section: "results"
    narrative_role: "Quantify alignment tax (r=-0.25 negative correlation)"
    caption_guidance: "Fairness-reliability negative correlation on full TruthfulQA (n=817). Pearson r=-0.2450, p=0.000100, 95% CI [-0.31, -0.18]. First quantitative estimate of alignment tax: RLHF safety tuning creates ~25% negative correlation between fairness and factual accuracy."

  fig_5:
    section: "discussion"
    narrative_role: "Show h-m3 limitation (overlapping CIs due to small n=10)"
    caption_guidance: "Prompt-type moderation test (h-m3): Fisher z-test forest plot showing factual (r=-0.33, 95% CI [-0.79, 0.38]) vs misinformation (r=-0.19, 95% CI [-0.73, 0.50]) strata. Overlapping CIs indicate underpowered test (n=10 per stratum); requires n≥100 for conclusive result."

