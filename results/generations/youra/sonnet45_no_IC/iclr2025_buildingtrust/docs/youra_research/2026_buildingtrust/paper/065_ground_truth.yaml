# SECTION 7: PHASE 6.5 ADVERSARIAL REVIEW INSTRUCTIONS
# ═══════════════════════════════════════════════════════════════

phase_6_5_instructions:
  objective: "Adversarially validate all empirical claims, detect overstatements, verify numerical accuracy"

  verification_protocol:
    step_1: "Read 06_paper.md and extract all empirical claims"
    step_2: "For each claim, verify against ground truth files (h-*/04_validation.md, verification_state.yaml)"
    step_3: "Check numerical accuracy (r, CI, p-values, n) within ±0.01 tolerance"
    step_4: "Verify honest limitation acknowledgment (h-m3 PARTIAL, A1/A5 unverified)"
    step_5: "Test attack vectors (overstatement, generalization, assumption claims)"
    step_6: "Report findings with evidence from ground truth files"

  expected_outcomes:
    core_claims_validated:
      - "h-e1: All σ>0.2 (PASS)"
      - "h-m1: r=0.72 on factual (PASS)"
      - "h-m2: r=-0.25 overall (PASS)"
      - "h-m3: Inconclusive (PARTIAL, n=10 underpowered)"

    limitations_acknowledged:
      - "h-m3 underpowered (n=10 vs required n≥85)"
      - "Llama-2-7b only; cross-architecture generalization unknown"
      - "GPT-4-as-judge A1 unverified"
      - "Scale generalization A5 unverified for h-m2/h-m3"

    numerical_accuracy:
      - "All correlation values match 04_validation.md within ±0.01"
      - "All confidence intervals match exactly"
      - "All p-values match (or correctly reported as p<threshold)"
      - "All sample sizes match verification_state.yaml"

  pass_criteria:
    - "No overstatements detected (h-m3 correctly labeled inconclusive)"
    - "All limitations honestly acknowledged in Discussion"
    - "Numerical accuracy ≥99% (max 1 rounding error in 100 values)"
    - "Mechanistic claims use suggestive (not definitive) language"
    - "Scope correctly bounded to Llama-2-7b with stated generation parameters"

