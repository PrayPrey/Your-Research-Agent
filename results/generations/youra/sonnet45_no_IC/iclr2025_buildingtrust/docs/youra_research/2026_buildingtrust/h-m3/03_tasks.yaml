    subtasks:
      - id: C-2.1
        title: "Implement Fisher z-transformation"
        description: "Transform correlations using arctanh"
        estimated_hours: 0.05
      - id: C-2.2
        title: "Compute standard error of difference"
        description: "Calculate se_diff = sqrt(1/(n1-3) + 1/(n2-3))"
        estimated_hours: 0.05
      - id: C-2.3
        title: "Calculate z-test statistic"
        description: "Compute z_stat = (z1 - z2) / se_diff"
        estimated_hours: 0.05
      - id: C-2.4
        title: "Compute two-tailed p-value"
        description: "Get p-value from standard normal distribution"
        estimated_hours: 0.05
      - id: C-2.5
        title: "Integration tests with known correlation pairs"
        description: "Test with known r values to validate implementation"
        estimated_hours: 0.10
    acceptance_criteria:
      - "FisherZTest class implemented with alpha parameter"
      - "compare_correlations() returns z_stat, p_value, significant, delta_r"
      - "compute_z_statistic() correctly applies Fisher transformation"
      - "p-value computation matches scipy.stats.norm.cdf"
      - "All subtasks completed"

