hypothesis_draft:
  title: "Cross-Dimensional Trustworthiness Correlations Under Synchronized Evaluation"
  hypothesis_id: "H-TrustCorr-v1"
  core_claim: |
    When trustworthiness dimensions (reliability, robustness, fairness) are measured synchronously
    on the same LLM outputs (same checkpoint, same prompts, same generation parameters), correlations
    emerge following one of three patterns: independence (|r|<0.2), positive coupling (r>0.3), or
    negative coupling (r<-0.3).
  mechanism: |
    Correlations arise from shared training dynamics (memorized facts support both reliability and
    robustness), optimization trade-offs (RLHF alignment taxes factual accuracy for fairness), or
    architectural constraints. Moderation by prompt type: factual prompts show stronger coupling
    than reasoning prompts due to different retrieval vs. computation mechanisms.
  predictions:
    - P1: "Reliability-robustness correlation r>0.3 (p<0.05) on factual prompts"
    - P2: "Fairness-reliability correlation r<-0.2 (p<0.05) overall (alignment tax)"
    - P3: "Correlation magnitude differs between factual vs. misinformation prompts (Fisher z p<0.05)"

variables_summary:
  independent: "Prompt Type (factual vs. misinformation), Model Scale (7B, 13B, 70B)"
  dependent_primary: "Pearson correlation coefficient (r) between dimension pairs"
  controlled: "Generation parameters (temp=0.7, top-p=0.9, seed fixed), Model architecture (Llama-2)"

null_hypothesis:
  h0_statement: |
    There is no significant correlation (r≈0, p>0.05) between any pair of trustworthiness dimensions
    (reliability-robustness, reliability-fairness, robustness-fairness) when measured on the same
    model outputs.
  statistical_test: "Pearson correlation test with two-tailed p-value; Fisher z-test for moderation"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First systematic measurement of cross-dimensional correlations using synchronized evaluation; treats evaluation logs as latent correlation datasets"
  differentiation_summary: |
    Existing work (TrustVis, MLLMGuard, BOLD) evaluates dimensions separately or sequentially with
    perturbations. We explicitly analyze correlations on natural inputs without perturbation,
    providing statistical framework for dimensional coupling vs. independence.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["Llama-2-7B-chat", "Llama-2-13B-chat", "Llama-2-70B-chat"]
  datasets: ["TruthfulQA (817 prompts, stratified factual vs. misinformation)"]
  baselines: ["Independence (r=0)", "Random ablation (permutation test)"]

measurement_plan:
  data_collection:
    - source: "TruthfulQA HuggingFace dataset (truthful_qa/generation)"
    - source: "Model outputs generated with fixed parameters (temp=0.7, top-p=0.9, max_tokens=256, seed per prompt)"
    - source: "Paraphrases via back-translation (English→French→English using Google Translate)"
    - source: "Demographic-augmented prompts for fairness signal ('A Black doctor...' vs. 'An Asian doctor...')"
  procedure:
    - step: "1. Load TruthfulQA dataset, stratify into factual (n≈400) and misinformation (n≈400) based on question type"
    - step: "2. Generate 3 paraphrases per prompt via back-translation"
    - step: "3. Run Llama-2 (7B, 13B, 70B) on original + paraphrased prompts with fixed generation parameters"
    - step: "4. Score reliability: GPT-4-as-judge against TruthfulQA ground truth (validate on n=100 sample)"
    - step: "5. Score robustness: Sentence-BERT cosine similarity between original and paraphrased outputs, average over 3 paraphrases"
    - step: "6. Score fairness: HONEST lexical bias score on demographic-augmented prompt outputs (validate variance on n=50 pilot)"
    - step: "7. Compute Pearson correlations for each dimension pair (reliability-robustness, reliability-fairness, robustness-fairness) per model"
    - step: "8. Test correlations against r=0 (two-tailed, α=0.05)"
    - step: "9. Classify outcomes: independence (|r|<0.2), weak coupling (0.2≤|r|<0.3), moderate coupling (0.3≤|r|<0.5), strong coupling (|r|≥0.5)"
    - step: "10. Test moderation: Fisher z-test comparing correlations between factual vs. misinformation strata (α=0.05)"
  success_criteria:
    - "At least one dimension pair shows |r|>0.2 with p<0.05 (coupling detected)"
    - "OR all dimension pairs show |r|<0.2 with p>0.05 (independence confirmed)"
    - "Outcome-independent: any result fills knowledge gap and is publishable"

validation:
  internal_validity:
    - "GPT-4-as-judge validated against human annotations on n≥100 TruthfulQA samples (target agreement ≥90%)"
    - "HONEST score variance confirmed on n≥50 demographic-augmented prompts (target variance ≥0.2)"
    - "Back-translation semantic preservation confirmed via pilot study (n=20 prompts, expert review)"
    - "Permutation test (n=1000 shuffles) confirms observed correlations exceed chance (p<0.05)"
  external_validity:
    - "Results generalize to Llama-2 family (7B, 13B, 70B scales tested)"
    - "Limited generalization to other architectures (GPT, Claude, Gemini) - future work"
    - "Limited generalization to other languages (English-only study) - future work"

discussion_synthesis:
  key_insights:
    - "Evaluation logs as latent datasets: existing benchmarks already produce multi-dimensional measurements, but correlations are discarded"
    - "Outcome-independent publishability: independence, positive coupling, and negative coupling all provide actionable guidance"
    - "Moderation hypothesis: correlations may be conditional on prompt type (factual vs. reasoning), revealing mechanistic structure"
  breakthrough_moments:
    - "Exchange 1 (Dr. Nova): Treating evaluation logs as multi-dimensional correlation datasets"
    - "Exchange 12 (Dr. Ally): Three mutually exclusive hypotheses ensuring publishability regardless of outcome"
    - "Exchange 13 (Prof. Vera): Complete methodological specification with preregistered analytical plan"
  resolved_tensions:
    - "Feasibility vs. ambition: 38-category subgroup analysis rejected, 2-way stratification (factual vs. misinformation) accepted as compromise"
    - "Novelty vs. conservatism: Aggregate correlations provide clean result, moderation test adds mechanistic insight"
    - "Independence as failure: Reframed as legitimate publishable outcome (dimensions are orthogonal)"
