main_hypothesis:
  id: H-TrustCorr-v1
  title: Cross-Dimensional Trustworthiness Correlations Under Synchronized Evaluation
  statement: 'Under synchronized evaluation (same model checkpoint, same prompts, same generation parameters),

    if trustworthiness dimensions (reliability, robustness, fairness) are measured on the same LLM outputs,

    then measurable correlations emerge following one of three patterns: independence (|r|<0.2),

    positive coupling (r>0.3), or negative coupling (r<-0.3),

    because dimensions share training dynamics, architectural constraints, or optimization trade-offs.

    '
  defined_in: 03_refinement.yaml
  controlled_variables:
    dataset: TruthfulQA
    model: Llama-2-chat (7B, 13B, 70B)
    optimizer: null
    hyperparameters:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 256
      seed_per_prompt: true
