# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Current trustworthiness benchmarks (TruthfulQA, BOLD, AdvGLUE) evaluate dimensions independently without synchronized multi-dimensional measurements"
      status: "BUILD_ON"
      evidence: "Phase 1 Gap Analysis, confirmed by TrustVis/MLLMGuard paper review"
    - claim: "Evaluation frameworks like TrustVis/MLLMGuard perform multi-dimensional evaluation on same outputs but do not analyze cross-dimensional correlations"
      status: "BUILD_ON"
      evidence: "Exchange 1 observation from paper summaries"
    - claim: "Correlation analysis requires synchronized measurement: same checkpoint, same inputs, same generation parameters"
      status: "PROVE_NEW"
      evidence: "Exchange 2 - Prof. Vera specification, needs empirical validation"
  scope_reduction_percentage: 33  # (3 total - 1 PROVE_NEW) / 3 * 100
  phase2b_4_instructions: |
    Build on established fact that existing benchmarks lack cross-dimensional correlation data.
    Prove new claim that synchronized evaluation enables correlation discovery by implementing
    TruthfulQA + 3 models + 3 dimensions with statistical testing.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-TrustCorr-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under synchronized evaluation (same model checkpoint, same prompts, same generation parameters),
    if trustworthiness dimensions (reliability, robustness, fairness) are measured on the same LLM outputs,
    then measurable correlations emerge following one of three patterns: independence (|r|<0.2),
    positive coupling (r>0.3), or negative coupling (r<-0.3),
    because dimensions share training dynamics, architectural constraints, or optimization trade-offs.
  alternative_hypothesis_h0: |
    There is no significant correlation (r≈0, p>0.05) between any pair of trustworthiness dimensions
    when measured synchronously on the same model outputs.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Prompt Type"
      type: "categorical"
      operationalization: "TruthfulQA question category: Factual vs. Misinformation"
      levels: ["factual", "misinformation"]
    - name: "Model Scale"
      type: "categorical"
      operationalization: "Llama-2 parameter count"
      levels: ["7B", "13B", "70B"]
  dependent:
    - name: "Reliability Score"
      type: "continuous"
      operationalization: "Accuracy against TruthfulQA ground truth (0-1), measured via GPT-4-as-judge"
      primary: true
    - name: "Robustness Score"
      type: "continuous"
      operationalization: "Paraphrase consistency via sentence-BERT cosine similarity (0-1), averaged over 3 paraphrases"
      primary: false
    - name: "Fairness Score"
      type: "continuous"
      operationalization: "HONEST lexical bias score (0-1, inverted so higher=fairer) on demographic-augmented prompts"
      primary: false
    - name: "Correlation Coefficient (r)"
      type: "continuous"
      operationalization: "Pearson r between dimension pairs (e.g., reliability-robustness), range [-1, 1]"
      primary: true
  controlled:
    - name: "Generation Parameters"
      operationalization: "Temperature=0.7, top-p=0.9, max_tokens=256, fixed seed per prompt"
    - name: "Model Architecture"
      operationalization: "All Llama-2-chat models (same architecture family, varying scale only)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "Shared training dynamics: Pre-training on internet text creates correlations between factual correctness (reliability) and consistent retrieval (robustness) for memorized content"
      evidence: "Exchange 7 - Dr. Nova mechanism prediction; Exchange 12 - Dr. Ally synthesis"
      falsifier: "If reliability-robustness correlation r<0.1 on factual prompts where memorization is expected, mechanism fails"
    - step: 2
      description: "Alignment tax: RLHF fine-tuning prioritizes fairness/safety over factual accuracy, creating negative correlation between fairness and reliability on social-content questions"
      evidence: "Exchange 3 - Prof. Pax alignment tax claim; Exchange 10 - Dr. Sage actionable finding"
      falsifier: "If fairness-reliability correlation r>-0.1 overall or r>0 on social prompts, alignment tax mechanism fails"
    - step: 3
      description: "Moderation by prompt type: Factual prompts show stronger reliability-robustness coupling (r>0.4) than reasoning/misinformation prompts (r<0.3) because facts are either memorized or not, while reasoning admits multiple paths"
      evidence: "Exchange 7 - Dr. Nova moderation prediction; Exchange 9 - Prof. Vera stratification design"
      falsifier: "If Fisher z-test comparing correlations across prompt types yields p>0.05, moderation mechanism fails"
  key_tension: "Independence (H0) vs. coupling (H1/H2) - dimensions may be orthogonal by construction"
  evidence_summary: |
    Mechanism draws on training dynamics literature (memorization enables robustness), alignment
    tax folklore (RLHF trades accuracy for safety), and cognitive science (factual vs. reasoning tasks).
    Testable via stratified correlation analysis with moderation test.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "GPT-4-as-judge achieves ≥90% agreement with human ground truth on TruthfulQA reliability scoring"
    supporting_evidence: "Exchange 14 - Prof. Pax validation requirement; standard practice in LLM evaluation"
    consequence_if_violated: "Reliability metric has >10% noise, attenuating observed correlations and reducing power"

  - id: "A2"
    assumption: "Back-translation (English→French→English) preserves semantic content while changing surface form, enabling valid robustness measurement"
    supporting_evidence: "Exchange 14 - Prof. Pax deterministic paraphrasing solution"
    consequence_if_violated: "Paraphrases may alter meaning, making robustness metric confound semantic drift with model consistency"

  - id: "A3"
    assumption: "Demographic augmentation (adding 'A Black doctor...' vs. 'An Asian doctor...') creates sufficient fairness signal on TruthfulQA prompts for HONEST score variance >0.2"
    supporting_evidence: "Exchange 14 - Prof. Pax fairness metric adjustment; Final Assessments - Prof. Rex concern"
    consequence_if_violated: "Floor effect: all fairness scores near 1.0, no variance for correlation analysis"

  - id: "A4"
    assumption: "Sample size n=817 prompts × 3 models = 2,451 provides 80% power to detect Pearson r≥0.18 at α=0.05"
    supporting_evidence: "Exchange 9 - Prof. Vera power analysis; confirmed by standard correlation power tables"
    consequence_if_violated: "Underpowered study: true correlations of r=0.2-0.3 may appear non-significant"

  - id: "A5"
    assumption: "Correlation patterns generalize across Llama-2 model scales (7B, 13B, 70B) and are not confounded by scale-specific effects"
    supporting_evidence: "Exchange 13 - Prof. Vera design; Final Assessments - Prof. Rex concern about confounding"
    consequence_if_violated: "Observed correlations may reflect scale artifacts rather than dimensional coupling; requires separate analysis per model size"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Llama-2-chat models (7B, 13B, 70B parameter scales)
    - TruthfulQA prompts (factual and misinformation questions in English)
    - Output-based evaluation metrics (no white-box model access required)
    - Synchronous evaluation: same checkpoint, same prompts, same generation parameters
  does_not_apply_to: |
    - Other model families (GPT-4, Claude, Gemini) - architecture differences may change correlation patterns
    - Other languages - correlation structure may be language-dependent
    - White-box metrics (attention entropy, gradient attribution) - not measured in this study
    - Non-text modalities (vision, audio) - multimodal trustworthiness correlations are out of scope
  known_limitations: |
    - Fairness metric requires demographic augmentation (not natural to TruthfulQA)
    - GPT-4-as-judge introduces external model dependency (validation required)
    - Back-translation paraphrasing may not cover full linguistic variation space
    - Llama-2-only scope limits generalization claims to other architectures

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Reliability-robustness correlation r>0.3 (p<0.05) on factual prompts subset (n≈400)"
    test_method: "Pearson correlation test on reliability scores vs. robustness scores for factual stratum"
    success_criterion: "Pearson r>0.3, two-tailed p<0.05, 95% CI lower bound >0.2"
    falsification: "If 95% CI includes or is below 0.2, prediction fails"

  - id: "P2"
    primary: false
    statement: "Fairness-reliability correlation r<-0.2 (p<0.05) overall across all 817 prompts"
    test_method: "Pearson correlation test on fairness scores vs. reliability scores for full dataset"
    success_criterion: "Pearson r<-0.2, two-tailed p<0.05, 95% CI upper bound <-0.1"
    falsification: "If 95% CI includes or is above -0.1, prediction fails"

  - id: "P3"
    primary: false
    statement: "Correlation magnitude differs between factual vs. misinformation prompts (Fisher z-test p<0.05)"
    test_method: "Fisher z-test comparing reliability-robustness correlation in factual stratum vs. misinformation stratum"
    success_criterion: "Fisher z-test p<0.05, indicating significant moderation effect"
    falsification: "If Fisher z-test p≥0.05, moderation prediction fails (correlations homogeneous across prompt types)"

