    type: "decoder-only transformer"
    source: "HuggingFace (meta-llama/Llama-2-7b-chat-hf, meta-llama/Llama-2-13b-chat-hf, meta-llama/Llama-2-70B-chat-hf)"
    hypothesis_fit: "Open-source models with consistent architecture across scales; enables testing scale as moderator; widely used in trustworthiness research"
  baselines:
    - name: "Independence baseline (r=0)"
      method: "Null hypothesis: no correlation between dimensions. Test via two-tailed p-value against r=0."
    - name: "Random ablation"
      method: "Permutation test: shuffle dimension scores and recompute correlations 1000 times. Observed r must exceed 95th percentile of permuted distribution."

