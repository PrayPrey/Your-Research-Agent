hypothesis_draft:
  title: "Conditional Transfer of Uncertainty-Based Hallucination Detectors"
  hypothesis_id: "H-ConditionalTransfer-v1"
  core_claim: |
    Semantic entropy-based hallucination detectors transfer successfully between benchmarks
    with similar uncertainty distributions (within-cluster), but fail across dissimilar
    distributions (cross-cluster). Benchmark families emerge empirically from JS-divergence
    clustering, not a priori assumptions.
  mechanism: |
    1. LLMs generate uncertainty signals reflecting error-generation processes
    2. Similar processes produce similar uncertainty distributions (low JS-divergence)
    3. Calibration thresholds transfer within similar distributions
    4. Dissimilar distributions require recalibration
  predictions:
    - P1: "Benchmarks cluster meaningfully (silhouette > 0.5)"
    - P2: "Within-cluster transfer: AUROC degradation ≤ 0.08"
    - P3: "Cross-cluster transfer: AUROC degradation > 0.15"
    - P4: "Clustering beats random baseline (p < 0.05)"
    - P5: "Clusters align with error types (ARI > 0.6)"

variables_summary:
  independent: "Benchmark pair relationship (within-cluster vs. cross-cluster); JS-divergence between distributions"
  dependent_primary: "AUROC degradation when applying source-calibrated threshold to target benchmark"
  controlled: "Model family, sampling temperature (0.7), generation count (10), train/test split (70/30)"

null_hypothesis:
  h0_statement: |
    There is no significant difference in AUROC degradation between within-cluster
    and cross-cluster benchmark transfers. Benchmark clustering does not predict
    transfer success.
  statistical_test: "Two-sample t-test (within-cluster degradation vs. cross-cluster degradation) + permutation test for clustering validity"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Empirical benchmark taxonomy via distribution clustering; first systematic cross-benchmark transfer study"
  differentiation_summary: |
    Prior work (Kuhn 2023, Manakul 2023) evaluated detectors on individual benchmarks.
    We provide the first systematic cross-benchmark transfer analysis, discovering
    benchmark families empirically rather than assuming them a priori.

clarity:
