    - source: "LLM generations via jlko/semantic_uncertainty pipeline"
    - source: "Entailment labels via DeBERTa-v3-large"
  procedure:
    - step: "Generate 10 completions per query on 1,000 queries per benchmark"
    - step: "Cluster generations via bidirectional entailment"
    - step: "Compute semantic entropy per query"
