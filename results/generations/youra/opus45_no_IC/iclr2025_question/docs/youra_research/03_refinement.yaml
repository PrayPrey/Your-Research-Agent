    primary: false
    statement: "Benchmarks cluster into 2-4 meaningful groups based on uncertainty distribution similarity"
    test_method: "Hierarchical agglomerative clustering on JS-divergence matrix with Ward linkage"
    success_criterion: "Silhouette score > 0.5"
    falsification: "Silhouette score < 0.3 (no meaningful structure)"
  - id: "P2"
    primary: true
