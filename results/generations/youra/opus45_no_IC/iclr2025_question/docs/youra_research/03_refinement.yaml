# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Semantic entropy detects hallucinations with ~0.85 AUROC in-distribution"
      status: "BUILD_ON"
      evidence: "Kuhn et al. 2023 (Nature, 859 citations)"
    - claim: "Model calibration (P(True)) improves with model scale"
      status: "BUILD_ON"
      evidence: "Kadavath et al. 2022 (Anthropic, 1856 citations)"
    - claim: "Bidirectional entailment reliably clusters semantic equivalence"
      status: "BUILD_ON"
      evidence: "Kuhn et al. 2023; standard NLI methodology"
    - claim: "Cross-benchmark transfer of uncertainty thresholds has not been systematically studied"
      status: "PROVE_NEW"
      evidence: "Literature review found no systematic transfer evaluation"
    - claim: "Benchmarks cluster into families based on uncertainty distribution similarity"
      status: "PROVE_NEW"
      evidence: "Novel contribution of this hypothesis"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    Use established in-distribution AUROC results (BUILD_ON claims) as baseline.
    Focus verification on PROVE_NEW claims: cross-benchmark transfer and benchmark clustering.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-ConditionalTransfer-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the scope of factual QA and claim verification benchmarks,
    if a semantic entropy-based hallucination detector is calibrated on one benchmark and tested on another,
    then transfer success (AUROC degradation ≤ 0.08) depends on uncertainty distribution similarity between benchmarks,
    because similar error-generation processes produce similar uncertainty distributions, and thresholds calibrated on one distribution remain effective on statistically similar distributions.
  alternative_hypothesis_h0: |
    There is no significant difference in AUROC degradation between within-cluster and cross-cluster benchmark transfers (i.e., benchmark clustering does not predict transfer success).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Benchmark pair relationship"
      type: "categorical"
      operationalization: "Within-cluster vs. cross-cluster, determined by JS-divergence clustering"
      levels: ["within-cluster", "cross-cluster"]
    - name: "JS-divergence between uncertainty distributions"
      type: "continuous"
      operationalization: "Jensen-Shannon divergence between KDEs of semantic entropy distributions"
  dependent:
    - name: "AUROC degradation"
      type: "continuous"
      operationalization: "AUROC(source benchmark) - AUROC(target benchmark) when applying source-calibrated threshold"
      primary: true
    - name: "Silhouette score"
      type: "continuous"
      operationalization: "Cluster quality metric for benchmark groupings"
      primary: false
    - name: "Adjusted Rand Index"
      type: "continuous"
      operationalization: "Alignment between discovered clusters and intuited error-type families"
      primary: false
  controlled:
    - name: "Model family"
      operationalization: "Same model (Llama-2-7B or Mistral-7B) across all benchmarks in a run"
    - name: "Sampling temperature"
      operationalization: "Fixed at 0.7 for all generations"
    - name: "Generation count"
      operationalization: "10 generations per query for all benchmarks"
    - name: "Train/test split"
      operationalization: "70% train (clustering), 30% test (AUROC evaluation)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "LLMs generate uncertainty signals reflecting specific error-generation processes"
      evidence: "Kuhn 2023 shows semantic entropy captures meaning-level uncertainty; Kadavath 2022 shows models have calibrated self-knowledge"
      falsifier: "If uncertainty signals are random noise with no error-process correlation"
    - step: 2
      description: "Benchmarks testing similar error processes exhibit similar uncertainty distributions"
      evidence: "TriviaQA and NQ both test factual recall; expected to show similar distributions"
      falsifier: "If benchmarks with intuited-similar error types show highly divergent distributions (JS-div > 0.3)"
    - step: 3
      description: "Calibration thresholds effective for one distribution transfer to similar distributions"
      evidence: "Standard calibration theory; domain adaptation literature shows in-distribution transfer works"
      falsifier: "If within-cluster degradation exceeds 0.15 despite distribution similarity"
    - step: 4
      description: "Dissimilar distributions (high JS-divergence) require recalibration"
      evidence: "Domain shift literature; expected from distribution mismatch theory"
      falsifier: "If cross-cluster transfer shows < 0.08 degradation despite distribution dissimilarity"
  key_tension: "Whether 'error type' is the primary factor, or other confounds (question length, domain vocabulary) drive distribution differences"
  evidence_summary: |
    The mechanism is grounded in semantic entropy theory (Kuhn 2023) and calibration literature (Kadavath 2022).
    The novel claim is that distribution similarity, operationalized via JS-divergence, predicts transfer success.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Semantic entropy is a valid proxy for model uncertainty about factual correctness"
    supporting_evidence: "Kuhn 2023 achieves ~0.85 AUROC; method peer-reviewed in Nature"
    consequence_if_violated: "Entire uncertainty-based detection paradigm breaks down"
  - id: "A2"
    assumption: "Bidirectional entailment reliably clusters semantically equivalent generations"
    supporting_evidence: "Standard NLI methodology; DeBERTa-v3-large achieves ~90% accuracy on MNLI"
    consequence_if_violated: "Semantic entropy computation becomes unreliable"
  - id: "A3"
    assumption: "10 generations per query adequately samples the uncertainty distribution"
    supporting_evidence: "Kuhn 2023 uses 5-20 generations; 10 is within standard range"
    consequence_if_violated: "Distribution estimates become noisy; clustering unreliable"
  - id: "A4"
    assumption: "KDE accurately represents the uncertainty distribution for JS-divergence computation"
    supporting_evidence: "Standard nonparametric density estimation; robust to distributional assumptions"
    consequence_if_violated: "JS-divergence values may not reflect true distribution differences"
  - id: "A5"
    assumption: "AUROC is an appropriate metric for hallucination detection performance"
    supporting_evidence: "Standard in detection literature; threshold-agnostic ranking metric"
    consequence_if_violated: "Results may not generalize to precision/recall-based deployment criteria"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Factual QA benchmarks (TriviaQA, NQ, PopQA, SQuAD)
    - Claim verification benchmarks (FEVER)
    - Hallucination detection benchmarks (HaluEval-QA)
    - Short-form generation (< 100 tokens)
    - Open-weight 7B-scale models (Llama-2, Mistral)
    - English-language benchmarks
  does_not_apply_to: |
    - Long-form summarization (HaluEval-Summarization excluded from core experiment)
    - Multi-turn dialogue
    - Creative writing / open-ended generation
    - API-only models (GPT-4, Claude) requiring different UQ methods
    - Non-English benchmarks
  known_limitations: |
    - Single-turn QA setting only; multi-turn context effects not studied
    - 7B-scale models; larger models may show different calibration properties
    - Semantic entropy requires model logits; not applicable to black-box APIs
    - Benchmark sample sizes adequate but not exhaustive (1,000 queries per benchmark)

