    test_method: "Calibrate threshold on source benchmark (70% train), apply to target benchmark (30% test), measure AUROC"
    success_criterion: "AUROC degradation ≤ 0.08 for within-cluster pairs"
    falsification: "AUROC degradation > 0.15 for within-cluster pairs"
  - id: "P3"
    primary: true
    statement: "Cross-cluster benchmark pairs show failed threshold transfer"
    test_method: "Same as P2, applied to cross-cluster pairs"
    success_criterion: "AUROC degradation > 0.15 for cross-cluster pairs"
    falsification: "AUROC degradation < 0.08 for cross-cluster pairs"
  - id: "P4"
    primary: false
    statement: "Discovered clustering significantly outperforms random baseline"
    test_method: "Permutation test: compare within/cross degradation difference for discovered vs. 100 random cluster assignments"
    success_criterion: "p < 0.05"
    falsification: "p > 0.10"
  - id: "P5"
    primary: false
    statement: "Discovered clusters align with intuited error-type families (Recall/Reasoning/Generation)"
    test_method: "Adjusted Rand Index between discovered clusters and pre-specified error-type assignments"
    success_criterion: "ARI > 0.6"
    falsification: "ARI < 0.3"

