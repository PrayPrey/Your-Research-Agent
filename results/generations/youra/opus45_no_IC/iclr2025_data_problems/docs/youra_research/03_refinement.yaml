  - id: "P1"
    primary: true
    statement: "Spearman correlation r > 0.5 between cumulative 13-gram exposure and MMLU inflation residual"
    test_method: "Correlate checkpoint-level overlap percentage with (observed - predicted) score across Pythia models"
    success_criterion: "r > 0.5 with p < 0.05"
    falsification: "r < 0.2 with 95% CI upper bound < 0.35"
  - id: "P2"
    primary: false
    statement: "Effect size of at least 3% benchmark inflation at 10% contamination level"
    test_method: "Fit regression: inflation ~ contamination, extract coefficient"
    success_criterion: "Predicted inflation at 10% contamination ≥ 3 percentage points"
    falsification: "Effect size < 1% at 10% contamination"
  - id: "P3"
    primary: false
    statement: "Exact-match benchmarks show higher inflation than generation benchmarks"
    test_method: "Compare ARC (exact-match) vs HellaSwag (generation) inflation magnitudes"
    success_criterion: "ARC inflation coefficient > HellaSwag inflation coefficient"
    falsification: "HellaSwag shows equal or greater inflation than ARC"

