# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-ContamInflation-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under the condition of language models trained on documented corpora with
    measurable n-gram overlap, if we increase cumulative benchmark-relevant
    exposure during training, then benchmark scores will show positive inflation
    residuals after capability detrending, because progressive memorization
    encodes benchmark content proportionally to exposure frequency.
  alternative_hypothesis_h0: |
    There is no significant correlation (Spearman r < 0.2, 95% CI upper bound < 0.35)
    between n-gram contamination exposure and benchmark score inflation after
    capability detrending.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "Cumulative 13-gram benchmark overlap"
      type: "continuous"
      operationalization: "Percentage of benchmark test set 13-grams present in training tokens seen by checkpoint"
      levels: null
  dependent:
    - name: "Benchmark score inflation residual"
      type: "continuous"
      operationalization: "Observed benchmark score minus capability-predicted score (via perplexity regression)"
      primary: true
    - name: "Raw benchmark accuracy"
      type: "continuous"
      operationalization: "Standard accuracy on MMLU/ARC/HellaSwag/WinoGrande"
      primary: false
  controlled:
    - name: "Model architecture"
      operationalization: "Fixed within Pythia family (same architecture, different sizes)"
    - name: "Training corpus"
      operationalization: "Fixed as The Pile for all models"
    - name: "Evaluation protocol"
      operationalization: "Standard lm-eval-harness settings"
    - name: "Checkpoint selection"
      operationalization: "Predetermined: 0%, 10%, 20%, ..., 100% of training"

# Section 1.3: Causal Mechanism
causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Training corpus contains benchmark-relevant content as n-gram sequences"
      evidence: "Yang et al. (2023) found 8-18% overlap in RedPajama"
      falsifier: "If no measurable overlap exists between Pile and benchmarks"
    - step: 2
      description: "Repeated exposure during training leads to memorization of benchmark sequences"
      evidence: "MIA literature shows models memorize training content (MIMIR)"
      falsifier: "If exposure frequency doesn't correlate with memorization strength"
    - step: 3
      description: "At inference, memorized content enables correct answers independent of generalization"
      evidence: "Verbatim completion studies (Oren et al., 2024)"
      falsifier: "If models with high overlap don't show verbatim completion"
    - step: 4
      description: "This produces score inflation proportional to contamination level"
      evidence: "To be demonstrated (PROVE_NEW)"
      falsifier: "If inflation is uniform regardless of exposure level"
  key_tension: "Distinguishing memorization-based inflation from legitimate learning of benchmark content"
  evidence_summary: |
    Prior work establishes contamination exists and memorization occurs. The novel
    claim is proportional inflation, tested via checkpoint-level correlation.

# Section 1.4: Key Assumptions
key_assumptions:
  - id: "A1"
    assumption: "13-gram overlap is a valid proxy for memorizable benchmark content"
    supporting_evidence: "GPT-3 Appendix C established 13-gram as decontamination standard"
    consequence_if_violated: "Need alternative contamination measure (semantic embedding similarity)"
  - id: "A2"
    assumption: "WikiText-103 perplexity measures capability without contamination"
    supporting_evidence: "WikiText-103 is separate corpus from The Pile"
    consequence_if_violated: "Use alternative OOD corpus for capability measurement"
  - id: "A3"
    assumption: "Pythia checkpoints provide sufficient contamination gradient"
    supporting_evidence: "Checkpoints at 0-100% training see different cumulative content"
    consequence_if_violated: "Gradient may be too narrow; need synthetic contamination injection"
  - id: "A4"
    assumption: "Inflation effect is proportional to exposure, not threshold-based"
    supporting_evidence: "Tested as P1 prediction"
    consequence_if_violated: "Revise to piecewise model with threshold detection"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Open-weight models with documented, accessible training corpora
    - Specifically: Pythia model family (410M to 12B) on The Pile
    - Benchmarks with text-based questions: MMLU, ARC, HellaSwag, WinoGrande
    - Verbatim (n-gram) contamination
  does_not_apply_to: |
    - Proprietary models with undocumented training data (GPT-4, Claude)
    - Semantic-only contamination (paraphrased content)
    - Non-text benchmarks (image, code execution)
    - Models trained on corpora without checkpoint availability
  known_limitations: |
    - Single model family (Pythia) limits generalizability claims
    - 13-gram may miss paraphrased contamination (Yang et al. showed bypass)
    - Transfer function may need recalibration for different architectures
    - Does not distinguish beneficial learning from memorization

# Section 1.6: Testable Predictions
