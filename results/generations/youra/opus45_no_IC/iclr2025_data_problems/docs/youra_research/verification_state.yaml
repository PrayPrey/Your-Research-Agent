main_hypothesis:
  id: H-ContamInflation-v1
  confidence: 0.8
  statement: 'Under the condition of language models trained on documented corpora with

    measurable n-gram overlap, if we increase cumulative benchmark-relevant

    exposure during training, then benchmark scores will show positive inflation

    residuals after capability detrending, because progressive memorization

    encodes benchmark content proportionally to exposure frequency.

    '
  h0: 'There is no significant correlation (Spearman r < 0.2, 95% CI upper bound < 0.35)

    between n-gram contamination exposure and benchmark score inflation after

    capability detrending.

    '
