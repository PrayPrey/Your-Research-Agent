hypothesis_draft:
  title: "Contamination-Performance Transfer Function for LLM Benchmarks"
  hypothesis_id: "H-ContamInflation-v1"
  core_claim: |
    Cumulative benchmark-relevant n-gram exposure during LLM training produces
    measurable, proportional benchmark score inflation that can be quantified
    via a transfer function derived from checkpoint-level analysis.
  mechanism: |
    Progressive memorization during training encodes benchmark content into
    model weights proportionally to exposure frequency. At inference time,
    this memorized content enables correct responses independent of true
    generalization capability, inflating benchmark scores beyond what
    capability alone would predict.
  predictions:
    - P1: "Spearman r > 0.5 correlation between cumulative 13-gram exposure and MMLU inflation residual"
    - P2: "Effect size ≥3% inflation at 10% contamination level"
    - P3: "Exact-match benchmarks (ARC) show higher inflation than generation benchmarks (HellaSwag)"

variables_summary:
  independent: "Cumulative 13-gram benchmark overlap percentage (0-100%)"
  dependent_primary: "Benchmark score inflation residual (observed - capability-predicted)"
  controlled: "Model architecture (Pythia), training corpus (The Pile), checkpoint selection (predetermined)"

null_hypothesis:
  h0_statement: |
    There is no significant correlation (Spearman r < 0.2, 95% CI upper bound < 0.35)
    between n-gram contamination exposure and benchmark score inflation after
    capability detrending using WikiText-103 perplexity.
  statistical_test: "Spearman correlation with one-tailed test"
  significance_level: 0.05

novelty_assessment:
