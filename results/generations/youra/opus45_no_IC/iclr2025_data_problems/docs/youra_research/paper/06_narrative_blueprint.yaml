# Narrative Blueprint for ICML Paper
# Phase 6 Step 02 Output
# Generated: 2026-08-10

metadata:
  paper_title: "Quantifying Benchmark Contamination: A Transfer Function Approach"
  target_venue: "ICML 2025"
  generated_at: "2026-08-10T06:15:00Z"
  primary_source: "045_validated_hypothesis.md"

# =============================================================================
# SECTION 1: HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "While n-gram contamination in LLM training data has been extensively documented, no prior work has quantified how this contamination translates to benchmark score inflation."
    strategy: "puzzle_paradox"
    first_sentence_draft: "Large language models trained on The Pile achieve impressive benchmark scores, but how much of this performance reflects contamination rather than capability?"

  why_reader_should_care:
    main_reason: "Benchmark scores guide model selection, research direction, and deployment decisions — if contamination inflates scores unpredictably, the entire evaluation paradigm is compromised"
    concrete_example: "A model appearing 5% better on MMLU may simply have seen more test questions during training"
    stakes: "Without contamination-performance correlation, we cannot trust comparative evaluations"

  anti_patterns_avoided:
    - "NOT starting with 'Deep learning has achieved remarkable success...'"
    - "NOT starting with 'Language models are important...'"
    - "INSTEAD: Opening with specific quantitative question"

# =============================================================================
# SECTION 2: PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Test set contamination exists in LLM training corpora"
    common_understanding: "Prior work (Sainz et al., Yang et al.) documents 8-18% n-gram overlap"
    source: "01_targeted_research.md - Gap analysis"

  deeper_problem:
    description: "Detection methods exist but do not quantify performance impact"
    why_overlooked: "Focus has been on contamination presence, not magnitude of effect"
    our_perspective: "The question is not 'is there contamination?' but 'how much does it inflate scores?'"
    source: "03_refinement.yaml - novelty section"

  gap_in_existing_work:
    description: "No quantitative model maps contamination levels to score inflation"
    why_gap_exists: "Requires checkpoint-level analysis with contamination gradient — most studies use final models only"
    why_gap_matters: "Cannot correct benchmark scores or compare models fairly without transfer function"
    source: "01_targeted_research.md - Gap 1: Quantitative Contamination-Performance Correlation"

# =============================================================================
# SECTION 3: KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Model checkpoints during training provide a natural contamination gradient, enabling correlation analysis without clean baseline models"
    expanded_explanation: |
      By comparing Pythia checkpoints at different training stages, we observe varying
      levels of cumulative benchmark exposure. This checkpoint-gradient methodology
      bypasses the need for contamination-free baseline models (which don't exist)
      and enables direct correlation between exposure and inflation.
    source: "045_validated_hypothesis.md - Section 4.4: Theoretical Contributions"

  why_others_missed_it:
    common_assumptions: "Contamination studies typically compare contaminated vs. decontaminated models or use synthetic injection"
    our_different_view: "Training checkpoints ARE the natural experiment — no intervention needed"
    enabling_factor: "Pythia's documented training on The Pile with available checkpoints"

  what_makes_it_work:
    intuitive_explanation: "Early checkpoints have seen less of the training corpus, thus less benchmark content, enabling natural contamination gradient"
    key_mechanism: "Capability detrending via WikiText-103 perplexity isolates inflation residual from legitimate learning"

# =============================================================================
# SECTION 4: EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "Contamination-inflation correlation exists at moderate strength (Spearman r ≈ 0.3)"
    measurable_criteria: "Spearman r > 0.2 with p < 0.05 across checkpoint-benchmark pairs"
    source: "045_validated_hypothesis.md - Section 5.1, h-e1 PASS"

  supporting_evidence:
    - id: "evidence_1"
      what: "Spearman r = 0.326, p = 0.003 across 80 checkpoint-benchmark pairs"
      so_what: "Establishes existence of contamination-inflation relationship"
      how_it_supports_claim: "Exceeds r > 0.2 threshold with strong statistical significance"
      figure: "fig_1 (gate_scatter.png)"
      source: "h-e1/04_validation.md"

    - id: "evidence_2"
      what: "17.4% maximum individual item overlap in MMLU"
      so_what: "Confirms n-gram contamination mechanism is detectable"
      how_it_supports_claim: "High individual overlaps validate detection approach"
      figure: "fig_6 (overlap_by_benchmark.png)"
      source: "h-m1/04_validation.md"

    - id: "evidence_3"
      what: "Capability detrending successfully separates learning from inflation"
      so_what: "Methodology contribution — residuals are interpretable"
      how_it_supports_claim: "WikiText-103 regression isolates contamination effect"
      figure: "fig_2 (capability_detrending.png)"
      source: "h-e1 methodology"

  surprising_findings:
    - finding: "Correlation weaker than expected (r=0.326 vs. predicted r>0.5)"
      why_surprising: "Prior work suggesting 8-18% overlap implied stronger effect"
      our_interpretation: |
        Three competing explanations: (1) Measurement noise from limited corpus coverage,
        (2) Threshold effects where contamination only matters above certain level,
        (3) Some overlap represents legitimate learning, not memorization
      source: "045_validated_hypothesis.md - Section 4.2: Unexpected Findings"

    - finding: "H-m1 gate failed despite working mechanism"
      why_surprising: "Only 0.0035% mean overlap but 17.4% max individual — mechanism works but coverage insufficient"
      our_interpretation: "50k document subset (0.006% of Pile) too small for corpus-wide statistics"
      source: "h-m1/04_validation.md"

# =============================================================================
# SECTION 5: HONEST LIMITATIONS (Must Include)
# =============================================================================

honest_limitations:
  - limitation: "Preliminary results from PoC validation"
    why_acceptable: "Methodology validated; awaiting computational resources for full experiment"
    suggested_framing: "Initial findings suggest... Full validation pending"
    source: "045_validated_hypothesis.md - Section 6.1"

  - limitation: "Single model family (Pythia)"
    why_acceptable: "Standard practice in contamination studies; Pythia chosen for training transparency"
    suggested_framing: "We focus on Pythia for training transparency; generalization TBD"

  - limitation: "Corpus coverage insufficient for definitive overlap statistics"
    why_acceptable: "Individual high-overlap items confirm mechanism; prior work provides context"
    suggested_framing: "Consistent with Yang et al. (2023) who found 8-18% on full corpus"

  - limitation: "Middle causal chain unverified (h-m2, h-m3 not started)"
    why_acceptable: "Correlation established; mechanistic explanation is standard interpretation"
    suggested_framing: "We demonstrate correlation; full causal path requires further investigation"

# =============================================================================
# SECTION 6: BROADER IMPACT / TAKEAWAY
# =============================================================================

takeaway:
  main_contribution:
    one_sentence: "First empirically-validated method for correlating contamination levels with benchmark score inflation"
    why_significant: "Enables contamination-aware model evaluation and benchmark reliability scoring"

  implications:
    for_field: "Establishes that contamination impact is quantifiable, not just detectable"
    for_practice: "Practitioners can estimate contamination effect when comparing models"

  future_possibilities:
    immediate_extensions:
      - "Multi-model family validation (OPT, BLOOM)"
      - "Full Pile indexing for definitive overlap statistics"
      - "Semantic contamination detection via embeddings"
    longer_term_vision: "Contamination-adjusted benchmark scores as standard evaluation practice"

