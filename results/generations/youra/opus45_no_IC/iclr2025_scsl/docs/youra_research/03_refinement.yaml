# ═══════════════════════════════════════════════════════════════
# SECTION 3: Novelty & Innovation
# ═══════════════════════════════════════════════════════════════

novelty:
  preserved_novelty: "Adaptive Single-Run (ASR) paradigm - per-sample adaptive detection within single training run"
  key_innovation: |
    Unlike JTT (two-stage), SPARE (fixed epoch threshold), or LA-SSL (aggregate speed),
    we propose using continuous onset delay as a discriminative signal with per-sample
    adaptive detection. This enables intervention during training without a separate
    identification phase.
  differentiation:
    - prior_work: "JTT (Liu et al., 2021)"
      difference: "JTT uses binary misclassification after T_id epochs; we use continuous onset delay observable earlier"
    - prior_work: "SPARE (Yang et al., 2023)"
      difference: "SPARE uses fixed early-epoch threshold; we use per-sample onset delay (adaptive)"
    - prior_work: "LA-SSL (Zhu et al., 2023)"
      difference: "LA-SSL uses aggregate learning speed; we use multi-dimensional trajectory features"

