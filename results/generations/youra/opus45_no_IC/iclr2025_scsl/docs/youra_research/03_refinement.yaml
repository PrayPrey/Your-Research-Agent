# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Simplicity bias causes spurious features to be learned early in training"
      status: "BUILD_ON"
      evidence: "SPARE [Yang et al., 2023] demonstrates early detection via simplicity bias, +21.1% WGA improvement"
    - claim: "Minority samples learn slower than majority samples overall"
      status: "BUILD_ON"
      evidence: "LA-SSL [Zhu et al., 2023] shows learning speed inversely correlates with spurious reliance"
    - claim: "ERM learns good features; the problem is the classifier head"
      status: "BUILD_ON"
      evidence: "DFR [Izmailov et al., 2022] achieves 97% WGA with last-layer retraining"
    - claim: "Binary misclassification identifies minority samples"
      status: "BUILD_ON"
      evidence: "JTT [Liu et al., 2021] closes 75% gap to group DRO using ERM errors"
    - claim: "Onset delay (trajectory shape) discriminates minority from majority samples"
      status: "PROVE_NEW"
      evidence: "Novel claim to be tested - extends binary signal to continuous trajectory"
  scope_reduction_percentage: 80
  phase2b_4_instructions: |
    Focus verification on PROVE_NEW claim: onset delay as discriminative signal.
    BUILD_ON claims are established by prior work - cite but don't re-verify.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-LT1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under standard ERM training of image classifiers on datasets with spurious correlations,
    if onset delay d_i (epochs until 10% loss reduction) exceeds the early detection threshold
    T_early (20% of total training), then the sample is enriched for minority-group membership,
    because simplicity bias causes majority-group samples to converge first on easily-learned
    spurious correlations, delaying meaningful learning on minority samples.
  alternative_hypothesis_h0: |
    Onset delay d_i is uniformly distributed across minority and majority groups.
    Threshold-based selection using d_i performs no better than random sampling
    for identifying minority-group samples.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Training Regime"
      type: "categorical"
      operationalization: "Standard ERM vs. ERM with onset-delay upweighting"
      levels: ["ERM_baseline", "ERM_with_upweighting"]
  dependent:
    - name: "Minority Group Detection Precision"
      type: "continuous"
      operationalization: "Precision of onset delay threshold for identifying minority-group samples"
      primary: true
    - name: "Minority Group Detection Recall"
      type: "continuous"
      operationalization: "Recall of onset delay threshold for identifying minority-group samples"
      primary: false
    - name: "Worst-Group Accuracy (WGA)"
      type: "continuous"
      operationalization: "Accuracy on worst-performing demographic group (waterbird on land)"
      primary: false
  controlled:
    - name: "Architecture"
      operationalization: "ResNet-18 with ImageNet pretrained weights"
    - name: "Optimizer"
      operationalization: "SGD with lr=0.001, momentum=0.9, weight_decay=1e-4"
    - name: "Dataset"
      operationalization: "Waterbirds (primary), CelebA (transfer validation)"
    - name: "Training epochs"
      operationalization: "100 total, detection phase 1-20, intervention phase 21-100"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "Simplicity bias causes models to learn 'easy' patterns first"
      evidence: "SPARE [Yang et al., 2023] demonstrates early learning of simple features"
      falsifier: "If models learn complex features before simple ones in controlled setting"
    - step: 2
      description: "Spurious features (e.g., background) are easier to learn than core features (e.g., bird shape)"
      evidence: "Spurious correlations provide strong, consistent signal with less variation"
      falsifier: "If core features show faster learning rate than spurious features"
    - step: 3
      description: "Majority-group samples have redundant cues (both spurious and core features predict label)"
      evidence: "Waterbirds dataset structure: waterbirds on water have both background and bird cues"
      falsifier: "If majority samples show same learning dynamics as minority samples"
    - step: 4
      description: "Minority-group samples lack spurious cues, requiring core feature learning"
      evidence: "Waterbirds: waterbirds on land lack background correlation"
      falsifier: "If minority samples converge as fast as majority samples"
    - step: 5
      description: "Therefore: Majority samples show fast loss reduction; minority samples show delayed onset"
      evidence: "Novel prediction to be tested; supported by LA-SSL learning speed findings"
      falsifier: "If onset delay does not correlate with minority-group membership"
  key_tension: "Onset delay might correlate with general difficulty rather than specifically minority-group membership"
  evidence_summary: |
    SPARE shows simplicity bias causes early spurious feature learning. LA-SSL shows minority
    samples learn slower. DFR shows ERM learns good features but classifier fails on minorities.
    The mechanism extends these findings: trajectory SHAPE (onset delay) captures minority status.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Simplicity bias operates consistently across samples within a dataset"
    supporting_evidence: "SPARE demonstrates consistent early learning of spurious features across Waterbirds, CelebA, MultiNLI"
    consequence_if_violated: "Onset delay would not systematically differ between majority/minority groups"
  - id: "A2"
    assumption: "Onset delay is observable by 20% of training epochs"
    supporting_evidence: "SPARE identifies spurious correlations in first 20% of training"
    consequence_if_violated: "Detection phase would be too short for reliable measurement"
  - id: "A3"
    assumption: "Minority/majority differences manifest in trajectory shape, not just final loss"
    supporting_evidence: "LA-SSL shows learning SPEED differs; we extend to trajectory SHAPE"
    consequence_if_violated: "Binary misclassification status would contain same information as trajectory"
  - id: "A4"
    assumption: "Upweighting detected samples improves worst-group accuracy"
    supporting_evidence: "JTT demonstrates upweighting ERM errors improves WGA by 75% gap closure"
    consequence_if_violated: "The detection signal would be useful for analysis but not intervention"
  - id: "A5"
    assumption: "Threshold transfers across datasets with similar spurious correlation structure"
    supporting_evidence: "JTT transfers across Waterbirds, CelebA, MultiNLI"
    consequence_if_violated: "Per-dataset threshold tuning would be required"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Image classification tasks with known spurious correlations
    - Standard ERM training from pretrained models
    - Datasets with clear majority/minority group structure
    - Spurious correlations based on co-occurring features (background, color)
  does_not_apply_to: |
    - NLP tasks (different trajectory dynamics, discrete tokens)
    - Training from scratch (initialization effects dominate)
    - Datasets without clear majority/minority structure
    - Spurious correlations based on label noise (different mechanism)
  known_limitations: |
    - Requires ground-truth group labels for evaluation (not for training)
    - Detection threshold T_early may need dataset-specific tuning
    - Effect size may be modest (1-3% WGA improvement)
    - More complex than JTT's simple two-stage approach

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "At epoch T_early=20, samples with onset delay d_i > T_early have minority-group precision > 0.5 and recall > 0.3"
    test_method: "Log per-sample losses, compute onset delay, threshold at T_early, measure precision/recall vs ground-truth groups"
    success_criterion: "Precision > 0.5 AND Recall > 0.3"
    falsification: "Precision ≤ 0.5 OR Recall ≤ 0.3"
  - id: "P2"
    primary: false
    statement: "Training with 2x weight on samples with d_i > T_early improves WGA by ≥3% over ERM, achieving ≥50% of JTT's improvement"
    test_method: "Compare WGA: ERM baseline vs. ERM with onset-delay upweighting vs. JTT"
    success_criterion: "WGA improvement ≥ 3% over ERM AND ≥ 50% of (JTT - ERM) improvement"
    falsification: "WGA improvement < 3% OR < 50% of JTT improvement"
  - id: "P3"
    primary: false
    statement: "Onset delay threshold transfers: trained on Waterbirds, achieves minority precision > 0.4 on CelebA"
    test_method: "Learn threshold on Waterbirds, apply to CelebA without retuning"
    success_criterion: "CelebA minority precision > 0.4"
    falsification: "CelebA minority precision ≤ 0.4"
  - id: "P4"
    primary: false
    statement: "Onset delay correlates more strongly with group membership (r > 0.4) than with sample difficulty/confidence (r < 0.3)"
    test_method: "Compute correlation of d_i with group indicator vs. correlation with ERM confidence"
    success_criterion: "r(d_i, group) > 0.4 AND r(d_i, confidence) < 0.3"
    falsification: "r(d_i, group) ≤ 0.4 OR r(d_i, confidence) ≥ r(d_i, group)"

