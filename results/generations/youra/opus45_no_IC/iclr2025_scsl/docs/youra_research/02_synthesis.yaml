metadata:
  generated_at: "2026-08-12T14:30:00Z"
  workflow: "phase2a-dialogue"
  architecture: "Self-Play Loop (Claude-only, IC-ablation)"
  schema_version: "10.0.0"
  gap_id: "gap-1-loss-trajectory"

hypothesis_draft:
  title: "Loss Trajectory Onset Delay for Spurious Detection (H-LT1)"
  hypothesis_id: "H-LT1"
  core_claim: |
    Samples with delayed onset of loss reduction (d_i > T_early) during ERM training
    are enriched for minority-group membership, because simplicity bias causes
    majority samples to converge first on easily-learned spurious correlations.
  mechanism: |
    1. Simplicity bias prioritizes easy patterns
    2. Spurious features are easier than core features
    3. Majority samples have redundant cues (spurious + core)
    4. Minority samples require core features (no spurious shortcut)
    5. Result: Majority = fast loss drop; Minority = delayed onset
  predictions:
    - P1: "Onset delay detector achieves minority precision > 0.5, recall > 0.3"
    - P2: "Upweighting improves WGA ≥ 3%, achieving ≥ 50% of JTT improvement"
    - P3: "Threshold transfers across datasets (Waterbirds → CelebA)"
    - P4: "Onset delay correlates more with group than with difficulty"

variables_summary:
  independent: "Training regime (ERM vs. ERM with onset-delay upweighting)"
  dependent_primary: "Minority group detection precision and recall"
  controlled: "ResNet-18, SGD optimizer, Waterbirds dataset, 100 epochs"

null_hypothesis:
  h0_statement: |
    Onset delay d_i is uniformly distributed across minority and majority groups.
    Threshold-based selection performs no better than random for minority identification.
  statistical_test: "Chi-square test for independence between high-d_i group and minority status"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "Adaptive Single-Run (ASR) paradigm - per-sample adaptive detection within single training run"
  differentiation_summary: |
    JTT: binary misclassification, two-stage → We use continuous onset delay, single run
    SPARE: fixed epoch threshold → We use per-sample adaptive onset detection
    LA-SSL: aggregate learning speed → We use multi-dimensional trajectory shape

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "ResNet-18 (ImageNet pretrained)"
  datasets:
    - "Waterbirds (primary)"
    - "CelebA (transfer validation)"
    - "MultiNLI (stretch goal)"
  baselines:
    - "ERM"
    - "JTT"
    - "SPARE"

measurement_plan:
  data_collection:
    - source: "Per-sample losses logged at each epoch during training"
    - source: "Ground-truth group labels for evaluation (from dataset metadata)"
    - source: "Model predictions at T_early and final epoch"
  procedure:
    - step: "Train ResNet-18 on Waterbirds with standard ERM, logging per-sample losses"
    - step: "Compute onset delay d_i = min{t : L_i(t) < 0.9 * L_i(0)} for each sample"
    - step: "At T_early=20, threshold samples by d_i > T_early"
    - step: "Measure precision/recall vs ground-truth minority-group membership"
    - step: "Train second model with 2x upweighting on detected samples"
    - step: "Measure WGA improvement vs ERM baseline and JTT"
  success_criteria:
    - "P1: precision > 0.5 AND recall > 0.3"
    - "P2: WGA improvement ≥ 3% over ERM AND ≥ 50% of JTT improvement"
    - "P3: CelebA transfer precision > 0.4"
    - "P4: r(d_i, group) > 0.4 AND r(d_i, confidence) < r(d_i, group)"

validation:
  internal_validity:
    - "Multiple random seeds (5) to control for initialization effects"
    - "Controlled confounds: same architecture, optimizer, hyperparameters across conditions"
    - "P4 explicitly tests group vs difficulty correlation to rule out alternative explanation"
  external_validity:
    - "P3 tests transfer to CelebA (different spurious correlation: hair color vs background)"
    - "MultiNLI stretch goal would test generalization to NLP"

discussion_synthesis:
  key_insights:
    - "Loss trajectory SHAPE is distinct from loss landscape GEOMETRY (avoids H-M1 failure mode)"
    - "Onset delay captures timing of learning, not just whether learning occurs"
    - "Single-run paradigm is more efficient than two-stage methods"
  breakthrough_moments:
    - "Exchange 6: Distinguishing 'delayed onset' from 'slow throughout' resolved LA-SSL contradiction"
    - "Exchange 12: Two-phase single-run design (detect then intervene) addressed intervention confound"
    - "Exchange 15: Connection to bandit literature opened theoretical grounding"
  resolved_tensions:
    - "Tension: LA-SSL shows minority slow, but spurious = fast convergence. Resolution: It's ONSET delay (flat → decrease) not overall speed"
    - "Tension: Intervention changes trajectories. Resolution: Split into detection phase (no intervention) + intervention phase"
    - "Tension: Effect size uncertainty. Resolution: Anchor to ≥50% of JTT improvement, not absolute threshold"
