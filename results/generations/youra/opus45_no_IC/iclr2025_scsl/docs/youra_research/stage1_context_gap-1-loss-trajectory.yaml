# Stage 1 Context for Phase 2A Discussion
gap_id: "gap-1-loss-trajectory"
gap_title: "Per-Sample Loss Trajectory Analysis for Spurious Detection"
gap_description: |
  Current methods (JTT, SPARE) use binary ERM misclassification or early-training errors
  to identify minority samples. No method systematically characterizes the SHAPE of
  per-sample loss curves (fast convergence vs slow convergence patterns) as a
  discriminative signal for spurious vs. core feature reliance.

