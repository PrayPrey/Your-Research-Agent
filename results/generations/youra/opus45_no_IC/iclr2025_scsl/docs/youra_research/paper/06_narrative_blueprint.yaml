# Phase 6 Narrative Blueprint
# Generated: 2026-08-12
# Purpose: Design paper narrative BEFORE section generation

metadata:
  generated_at: "2026-08-12T16:00:00Z"
  workflow: "phase6-paper-writing"
  primary_source: "045_validated_hypothesis.md"

# =============================================================================
# OPENING HOOK STRATEGY
# =============================================================================

hook:
  strategy: "Quantitative surprise + practical value"
  opening_line: |
    Simplicity bias creates a detectable signature in training dynamics:
    minority-group samples exhibit 8× higher loss at just 5% of training epochs,
    enabling automatic detection without group labels.

  why_this_works:
    - "8× is memorable, quantitative, and verified"
    - "'Without group labels' addresses practical ML constraint"
    - "Connects to established simplicity bias theory"
    - "Reveals mechanism (not just correlation)"

  avoid:
    - "Generic 'spurious correlations are important' opening"
    - "Pure definition/background statements"
    - "Overpromising intervention effectiveness"

# =============================================================================
# PROBLEM FRAMING (THREE LEVELS)
# =============================================================================

problem_framing:
  level_1_surface:
    statement: "Models learn spurious correlations, failing on minority groups"
    known_from: "Group DRO (Sagawa 2019), JTT (Liu 2021)"
    role: "Establish baseline problem"

  level_2_deeper:
    statement: "Existing detection methods require group labels or two-stage training"
    critique: "JTT needs misclassification signal post-training; SPARE uses fixed epoch thresholds"
    role: "Show current solutions are incomplete"

  level_3_gap:
    statement: |
      No method exploits per-sample loss trajectory SHAPE as continuous signal
      for minority detection during single-run training
    our_contribution: "First characterization of loss magnitude gap as minority detection signal"
    role: "Position our specific contribution"

# =============================================================================
# KEY INSIGHT (EXPERIMENT-VERIFIED)
# =============================================================================

key_insight:
  one_sentence: |
    Simplicity bias manifests as a ~10% accuracy gap between spurious and core
    feature encoding throughout training, causing minority samples to exhibit
    8× higher early-epoch loss than majority samples.

  why_novel:
    - "Shows magnitude gap rather than timing gap (with pretrained features)"
    - "Quantifies effect size (8× loss difference, 10% probe gap)"
    - "Detectable at 5% of training (vs SPARE's 20%)"

  verification_evidence:
    h_e1: "Mann-Whitney p < 10⁻¹⁴ for loss distribution separation"
    h_m1: "Spurious probe 91.2% vs core 80.5% at epoch 5"
    h_m2: "10% gap persists across all 100 epochs"

# =============================================================================
# EVIDENCE NARRATIVE STRUCTURE
# =============================================================================

evidence_structure:
  main_claim: "Loss trajectory reveals minority-group membership"

  supporting_claims:
    claim_1:
      statement: "Minority samples have systematically higher early loss"
      evidence: "8× loss difference at epoch 5"
      figure: "loss_trajectories.png"
      section: "Results"

    claim_2:
      statement: "This is caused by simplicity bias favoring spurious features"
      evidence: "Spurious probe 91.2% > core 80.5% throughout training"
      figure: "probe_accuracy.png"
      section: "Results (Mechanism)"

    claim_3:
      statement: "Detection significantly outperforms random baseline"
      evidence: "33% precision vs 5% random = 6.6× improvement"
      figure: "pr_curve.png"
      section: "Results"

  honest_limitations:
    - claim: "Individual precision limited by base rate"
      framing: "Mathematical constraint, not method failure"
      evidence: "5% minority → max ~33% precision at matched rate"

    - claim: "Timing hypothesis not supported with pretrained features"
      framing: "Magnitude gap still supports detection; timing may hold from scratch"
      evidence: "H-M2: both peaks at epoch 81"

    - claim: "Single dataset validation"
      framing: "Canonical benchmark; transfer is explicit future work"
      evidence: "Waterbirds only; CelebA/MultiNLI deferred"

# =============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# =============================================================================

section_goals:
  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    must_contain:
      - "8× quantitative hook"
      - "Three-level problem framing"
      - "Key insight preview"
      - "Contributions (detection signal, mechanism analysis, base-rate characterization)"
    must_avoid:
      - "Generic 'spurious correlations matter' opening"
      - "Exhaustive related work in intro"

  related_work:
    narrative_role: "Show existing work insufficient → justify our approach"
    must_contain:
      - "JTT, SPARE, DFR as key comparisons"
      - "Gap: no method uses continuous trajectory as signal"
      - "Our positioning vs each"
    must_avoid:
      - "Pure enumeration without critical analysis"
      - "Overstating novelty"

  methodology:
    narrative_role: "WHY this design solves the problem"
    must_contain:
      - "Loss trajectory tracking rationale"
      - "Detection threshold selection"
      - "Statistical testing approach"
      - "Linear probe methodology (H-M1/M2)"
    must_avoid:
      - "Implementation details without rationale"
      - "Pure hyperparameter listing"

  experiments:
    narrative_role: "Design experiments that test our specific claims"
    must_contain:
      - "Research questions → experiments mapping"
      - "Waterbirds dataset rationale"
      - "Baseline rationale (ERM, random)"
      - "Metrics rationale (precision, recall, statistical tests)"
    must_avoid:
      - "Disconnected experiment descriptions"

  results:
    narrative_role: "Present evidence supporting claims"
    must_contain:
      - "8× loss difference visualization"
      - "Mann-Whitney significance"
      - "PR curve analysis"
      - "Probe accuracy comparison"
    must_avoid:
      - "Cherry-picking positive results"
      - "Hiding H-M2 timing failure"

  discussion:
    narrative_role: "Interpret results, acknowledge limits"
    must_contain:
      - "Base rate precision ceiling explanation"
      - "Timing vs magnitude interpretation"
      - "Pretrained vs from-scratch implications"
    must_avoid:
      - "Defensive tone about limitations"
      - "Scope creep into future work"

  conclusion:
    narrative_role: "Callback to hook, open future"
    must_contain:
      - "Echo '8× higher loss' quantification"
      - "Core contribution summary"
      - "Future: from-scratch, transfer, intervention"
    must_avoid:
      - "Repetition of results section"
      - "New information"

  abstract:
    narrative_role: "Compress full story"
    must_contain:
      - "Problem (1 sentence)"
      - "Method (1 sentence)"
      - "Key result (1-2 sentences)"
      - "Implication (1 sentence)"
    structure: "4-6 sentences, ~150 words"

# =============================================================================
# FIGURE PLACEMENT PLAN
# =============================================================================

figures:
  fig_1:
    file: "loss_trajectories.png"
    section: "Results"
    caption: "Per-sample loss trajectories colored by group membership. Minority samples (orange) show systematically higher loss at early epochs."
    narrative_role: "Visual proof of 8× claim"

  fig_2:
    file: "onset_histogram.png"
    section: "Results"
    caption: "Distribution of onset delay d_i by group. Clear separation between minority and majority distributions."
    narrative_role: "Statistical separation visualization"

  fig_3:
    file: "probe_accuracy.png"
    section: "Results"
    caption: "Linear probe accuracy for spurious (background) vs core (bird) features across training epochs."
    narrative_role: "Mechanism evidence (simplicity bias)"

  fig_4:
    file: "learning_curves.png"
    section: "Discussion"
    caption: "100-epoch probe learning curves showing magnitude gap persists (peaks at same epoch)."
    narrative_role: "Timing limitation evidence"

  fig_5:
    file: "pr_curve.png"
    section: "Results"
    caption: "Precision-recall curve for minority detection vs loss percentile threshold."
    narrative_role: "Detection performance characterization"

# =============================================================================
# CITATION ANCHORS
# =============================================================================

key_citations:
  must_cite:
    - "JTT (Liu et al., 2021) - binary misclassification baseline"
    - "SPARE (Yang et al., 2023) - early detection via simplicity bias"
    - "DFR (Izmailov et al., 2022) - ERM learns good features"
    - "Group DRO (Sagawa et al., 2019) - Waterbirds benchmark"
    - "LA-SSL (Zhu et al., 2023) - learning speed correlation"

  for_comparison:
    - "JTT: closes 75% gap to Group DRO"
    - "SPARE: +21.1% WGA improvement, 12× faster"
    - "DFR: 97% WGA with last-layer retraining"

  our_contribution_vs:
    vs_jtt: "Continuous loss trajectory vs binary misclassification"
    vs_spare: "Per-sample analysis vs fixed epoch threshold"
    vs_dfr: "Detection signal vs intervention method"
