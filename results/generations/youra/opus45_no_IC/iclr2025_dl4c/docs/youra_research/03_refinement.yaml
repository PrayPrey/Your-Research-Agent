# Section 0: Established Facts & Claim Scope
established_facts:
  claims:
    - claim: "Execution feedback (test pass rates, compiler errors) improves code generation RL"
      status: "BUILD_ON"
      evidence: "PPOCoder, StepCoder, RLPF, InterCode all demonstrate execution feedback effectiveness"
    - claim: "FGO (Fine-Grained Optimization) masks non-executed tokens to improve learning"
      status: "BUILD_ON"
      evidence: "StepCoder (2024) introduces FGO with CCCS curriculum"
    - claim: "Different feedback types carry orthogonal information about code correctness"
      status: "PROVE_NEW"
      evidence: "No controlled study exists; current work uses single types"
    - claim: "Granularity mechanism (FGO) provides larger gains than content variation"
      status: "PROVE_NEW"
      evidence: "Hypothesis to be tested; StepCoder conflates content and granularity"
  scope_reduction_percentage: 50
  phase2b_4_instructions: |
    Build on established effectiveness of execution feedback. Focus verification on
    the novel content vs. granularity disentanglement claim.

# Section 1.1: Core Statement
core_statement:
  hypothesis_id: "H-ContentGranularity-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under controlled PPO training on code generation benchmarks (HumanEval, MBPP),
    if we independently vary feedback content (compile, test, combined) and granularity
    mechanism (standard PPO vs. FGO token masking), then we observe that (1) granularity
    provides larger performance gains than content variation, (2) combined content with
    FGO achieves best overall performance, and (3) FGO transfers trace information
    benefit without explicit trace reward, because FGO enables precise credit assignment
    by masking non-executed code, addressing the sparse reward problem regardless of
    feedback content.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@k performance between conditions,
    or observed differences are explained by training signal density confounds
    rather than content or granularity factors.

# Section 1.2: Variables Table
variables:
  independent:
    - name: "Feedback Content"
      type: "categorical"
      operationalization: "Type of execution feedback signal used for RL reward"
      levels: ["Compile-only", "Test-only", "Compile+Test"]
    - name: "Granularity Mechanism"
      type: "categorical"
      operationalization: "Credit assignment method for policy gradient"
      levels: ["Standard (episode reward)", "FGO (token masking)"]
  dependent:
    - name: "pass@1"
