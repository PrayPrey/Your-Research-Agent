    primary: true
    statement: "FGO improves performance across ALL feedback content types"
    test_method: "Compare FGO vs. standard PPO within each content condition"
    success_criterion: "Paired t-test p<0.05 for each comparison; effect size eta-squared > 0.3"
    falsification: "FGO fails to improve for any content type (p>0.05 or negative effect)"
  - id: "P2"
    primary: false
    statement: "Combining compile and test feedback outperforms single types"
    test_method: "ANOVA with post-hoc Tukey HSD across content conditions"
    success_criterion: "Combined > Compile-only AND Combined > Test-only (p<0.05)"
    falsification: "No significant difference between combined and single types"
  - id: "P3"
    primary: false
    statement: "FGO effect size exceeds Content effect size (granularity dominates)"
    test_method: "Compare eta-squared values for main effects in 2x3 ANOVA"
    success_criterion: "eta-squared(FGO) > eta-squared(Content)"
    falsification: "Content effect size equals or exceeds FGO effect size"

