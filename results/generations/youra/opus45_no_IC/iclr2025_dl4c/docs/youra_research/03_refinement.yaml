  key_innovation: |
    Recognizing that prior work (StepCoder) conflates two factors: WHAT feedback is provided
    (content) and HOW credit is assigned (granularity/FGO). Our factorial design separates
    these factors, enabling principled understanding of which matters more.
  differentiation:
