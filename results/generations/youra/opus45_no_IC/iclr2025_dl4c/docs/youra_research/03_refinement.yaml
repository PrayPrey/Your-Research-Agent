    - name: "Base Model"
      operationalization: "CodeLlama-7B with frozen architecture"
    - name: "Training Protocol"
      operationalization: "PPO with 10k steps, fixed hyperparameters"
    - name: "Random Seeds"
      operationalization: "3 seeds per condition for variance estimation"
    - name: "Evaluation Protocol"
      operationalization: "Greedy decoding for pass@1, sampling for pass@10"

# Section 1.3: Causal Mechanism (DYNAMIC)
causal_mechanism:
  causal_chain_count: 3
  steps:
    - step: 1
      description: "FGO collects execution traces during test evaluation"
      evidence: "StepCoder implementation shows trace-based masking"
      falsifier: "FGO without trace collection would fail to identify executable tokens"
    - step: 2
      description: "FGO masks tokens that were never executed, excluding them from gradient updates"
      evidence: "StepCoder FGO masks unexecuted code segments"
      falsifier: "Random masking would not improve performance (ablation test)"
    - step: 3
      description: "Dense token-level credit assignment enables faster, more precise policy learning"
      evidence: "Sparse reward problem is well-known in RL; dense rewards improve sample efficiency"
      falsifier: "If FGO provides no improvement over standard PPO, mechanism is invalid"
  key_tension: "Whether FGO benefit is from credit assignment precision or implicit curriculum effect"
  evidence_summary: |
    The credit assignment mechanism is supported by RL theory (sparse vs. dense rewards) and
    empirical evidence from StepCoder. The key innovation is recognizing that execution traces
    provide masking information, not just reward signal.

# Section 1.4: Key Assumptions (A1-A5)
key_assumptions:
  - id: "A1"
    assumption: "Test pass/fail provides sufficient signal for RL learning"
    supporting_evidence: "PPOCoder, CodeRL achieve strong results with test-only feedback"
    consequence_if_violated: "Test-only baseline would fail, invalidating comparison baseline"
  - id: "A2"
    assumption: "FGO implementation from StepCoder is correct and transferable"
    supporting_evidence: "StepCoder codebase is public and peer-reviewed (ACL 2024)"
    consequence_if_violated: "Would need to re-implement FGO, adding implementation confound"
  - id: "A3"
    assumption: "CodeLlama-7B is representative of code generation models"
    supporting_evidence: "Widely used baseline in code generation research"
    consequence_if_violated: "Results may not generalize to other model families"
  - id: "A4"
    assumption: "HumanEval/MBPP provide sufficient problem diversity"
    supporting_evidence: "Standard benchmarks used in PPOCoder, StepCoder, EG-CFG"
    consequence_if_violated: "May miss domain-specific effects (e.g., type-heavy vs. runtime-only)"
  - id: "A5"
    assumption: "Execution trace collection overhead does not affect training dynamics"
    supporting_evidence: "10-20x slowdown in execution is acceptable for small benchmarks"
    consequence_if_violated: "Would need to account for timing differences in analysis"

# Section 1.5: Scope & Boundaries
scope:
  applies_to: |
    - Python code generation tasks
    - Function-level completion benchmarks (HumanEval, MBPP)
    - 7B-scale instruction-tuned code models
    - RL-based alignment (PPO with execution feedback)
  does_not_apply_to: |
    - Repository-level code generation (SWE-bench)
    - Non-Python languages (may require different trace tools)
    - Inference-time execution guidance (EG-CFG approach)
    - Models smaller than 3B or larger than 13B (untested scale)
  known_limitations: |
    - HumanEval near-saturation may limit pass@1 improvement visibility
    - FGO masking threshold sensitivity not characterized
    - Transfer to complex benchmarks (SWE-bench) is future work

# Section 1.6: Testable Predictions
