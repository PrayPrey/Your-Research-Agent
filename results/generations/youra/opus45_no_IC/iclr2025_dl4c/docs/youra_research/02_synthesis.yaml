hypothesis_draft:
  title: "Content-Granularity Disentanglement for Execution Feedback in Code RL"
  hypothesis_id: "H-ContentGranularity-v1"
  core_claim: |
    The effectiveness of execution feedback in code generation RL is determined by two
    separable factors: (1) feedback CONTENT (compile, test, trace) and (2) feedback
    GRANULARITY (standard episode reward vs. FGO token masking). Granularity (FGO)
    provides larger gains than content variation, but combining both achieves optimal.
  mechanism: |
    FGO converts sparse episode rewards into dense token-level credit by masking tokens
    that were never executed during test runs. This addresses the credit assignment
    problem in RL—the model receives gradient signal only for code that actually ran.
    Content variation provides complementary error types, but without fine-grained
    credit assignment, this benefit is limited.
  predictions:
    - P1: "FGO improves performance across ALL feedback content types (eta-squared > 0.3)"
    - P2: "Combining compile and test feedback outperforms single types (p < 0.05)"
    - P3: "FGO effect size exceeds Content effect size (granularity dominates content)"

variables_summary:
  independent: "Feedback Content (3 levels) x Granularity Mechanism (2 levels)"
  dependent_primary: "pass@1 on HumanEval/MBPP held-out test set"
  controlled: "CodeLlama-7B, PPO hyperparameters, random seeds (3), evaluation protocol"

null_hypothesis:
  h0_statement: |
    There is no significant difference in pass@k performance between conditions,
    or observed differences are explained by training signal density confounds
    rather than content or granularity factors.
  statistical_test: "2x3 factorial ANOVA with interaction effects"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First controlled disentanglement of content vs. granularity effects in code RL"
  differentiation_summary: |
    Prior work (StepCoder) conflates compile content with FGO granularity. Our factorial
    design separates these factors, enabling principled understanding. PPOCoder uses only
    test feedback; RLPF uses staged rewards—neither isolates the granularity factor.

