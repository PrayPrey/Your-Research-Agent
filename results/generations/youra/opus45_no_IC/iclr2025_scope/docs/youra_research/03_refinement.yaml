predictions:
  - id: "P1"
    primary: true
    statement: "Gap statistic identifies k* > 1 clusters in task compression response profiles"
    test_method: "Compute gap statistic on 21 × 6 response matrix; compare to null distribution"
    success_criterion: "k* > 1 with gap > standard error"
    falsification: "k* = 1 (all tasks respond identically to compression)"
  - id: "P2"
    primary: true
    statement: "Attention-probe router achieves ≥5% AUPC improvement over best single strategy"
    test_method: "3-fold CV on LongBench; compare AUPC(router) vs AUPC(best-single) on held-out tasks"
    success_criterion: "Mean AUPC(router) > 1.05 × AUPC(best-single)"
    falsification: "AUPC(router) ≤ AUPC(best-single) on held-out data"
  - id: "P3"
    primary: false
    statement: "Attention entropy correlates with cluster membership"
    test_method: "Compute Spearman correlation between first-100-token entropy and discovered cluster labels"
    success_criterion: "ρ > 0.5"
    falsification: "ρ ≤ 0.3 (weak or no correlation)"

