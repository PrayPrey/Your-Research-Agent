# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Heavy-hitter eviction (H2O) achieves <2% accuracy drop at 20% retention"
      status: "BUILD_ON"
      evidence: "Zhang et al., 2023 - arXiv:2306.14048, 864 citations"
    - claim: "Attention sinks require initial token retention for window attention"
      status: "BUILD_ON"
      evidence: "Xiao et al., 2023 - arXiv:2309.17453, 2239 citations"
    - claim: "LongBench provides standardized 6-category task taxonomy"
      status: "BUILD_ON"
      evidence: "Bai et al., 2023 - arXiv:2308.14508, 1538 citations"
    - claim: "Quantization (INT4/INT8) achieves 4-8x memory reduction"
      status: "BUILD_ON"
      evidence: "BitsAndBytes integration, HuggingFace docs"
    - claim: "Task-dependent optimal compression strategies exist"
      status: "PROVE_NEW"
      evidence: "Gap in literature; EvolKV hints but no systematic study"
    - claim: "Attention features predict compression preference"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis from discussion"
  scope_reduction_percentage: 40
  phase2b_4_instructions: |
    Build on established eviction/quantization methods. Focus verification on:
    (1) Task-dependent Pareto frontiers exist, (2) Attention probe predicts optimal strategy.
    Do not re-verify H2O accuracy claims or quantization compression ratios.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-AttnProbeRouter-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under the constraint of fixed memory budget and LongBench benchmark,
    if we characterize KV compression response profiles across eviction and quantization strategies per task,
    then an attention-probe-based router will select task-appropriate configurations achieving ≥5% AUPC improvement over best single strategy,
    because early attention patterns encode task structure that correlates with compression tolerance.
  alternative_hypothesis_h0: |
    There is no task-dependent structure in compression response (k* = 1) OR
    attention features do not predict optimal compression (AUPC(router) ≤ AUPC(best-single)).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "compression_strategy"
      type: "categorical"
      operationalization: "Combination of eviction ratio and quantization level"
      levels:
        - "evict_40_fp16"
        - "evict_40_int8"
        - "evict_40_int4"
        - "evict_80_fp16"
        - "evict_80_int8"
        - "evict_80_int4"
  dependent:
    - name: "accuracy_retention"
      type: "continuous"
      operationalization: "Task accuracy with compression / baseline accuracy, range [0,1]"
      primary: true
    - name: "memory_usage_ratio"
      type: "continuous"
      operationalization: "KV cache memory / full cache memory, range [0,1]"
      primary: false
    - name: "aupc"
      type: "continuous"
      operationalization: "Area Under Pareto Curve for (memory, accuracy) space"
      primary: false
  controlled:
    - name: "model_architecture"
      operationalization: "Llama-2-7B, frozen weights, same inference code"
    - name: "benchmark"
      operationalization: "LongBench 21 tasks, fixed evaluation scripts"
    - name: "hardware"
      operationalization: "Single A100 GPU, consistent batch size"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Early attention entropy reflects task structure"
      evidence: "Attention patterns in first 100 tokens encode whether task requires broad integration (low entropy) or precise retrieval (high entropy)"
      falsifier: "Attention entropy shows no variance across tasks or no correlation with task type"
    - step: 2
      description: "High-entropy tasks tolerate eviction better"
      evidence: "When many tokens contribute equally (high entropy), removing some doesn't lose critical information"
      falsifier: "High-entropy tasks show worse accuracy under eviction than low-entropy tasks"
    - step: 3
      description: "Low-entropy tasks tolerate quantization better"
      evidence: "When few tokens are critical, preserving their precision matters more than keeping all tokens"
      falsifier: "Low-entropy tasks show no quantization advantage over high-entropy tasks"
    - step: 4
      description: "Router uses attention features to select optimal config"
      evidence: "Lightweight classifier (logistic regression) maps attention features to predicted cluster/config"
      falsifier: "Router AUPC ≤ best-single AUPC (routing adds no value)"
  key_tension: "Whether attention patterns stabilize within first 100 tokens for all task types"
  evidence_summary: |
    Mechanism links task structure (visible in attention) to compression tolerance (eviction vs quantization).
    Heavy-hitter literature (H2O) shows attention scores predict token importance; we extend this to
    predict task-level compression preference rather than token-level eviction decision.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Attention patterns stabilize within first 100 tokens"
    supporting_evidence: "StreamingLLM shows initial tokens have special role; attention structure forms early"
    consequence_if_violated: "Probe may capture incomplete task representation; need longer probe window"
  - id: "A2"
    assumption: "LongBench tasks adequately represent deployment workloads"
    supporting_evidence: "21 datasets across 6 categories; widely used in long-context literature"
    consequence_if_violated: "Findings may not generalize to production tasks"
  - id: "A3"
    assumption: "Compression effects are model-dependent but probe features generalize within architecture family"
    supporting_evidence: "Llama-2 family shares attention patterns; LoRA shows transfer within families"
    consequence_if_violated: "Need per-model router training"
  - id: "A4"
    assumption: "AUPC captures deployment-relevant trade-offs"
    supporting_evidence: "Standard metric in multi-objective optimization; covers full Pareto frontier"
    consequence_if_violated: "May miss specific operating points important for certain deployments"
  - id: "A5"
    assumption: "Lightweight router (logistic regression) is sufficient"
    supporting_evidence: "If clusters are well-separated, simple classifier suffices"
    consequence_if_violated: "Need more complex classifier; adds inference latency"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Transformer-based LLMs with standard self-attention (Llama-2 family)
    - Autoregressive generation with KV cache
    - Text-only tasks (QA, summarization, code, few-shot)
    - Memory-constrained deployment scenarios
  does_not_apply_to: |
    - Non-attention architectures (Mamba, RWKV)
    - Vision-language models (requires separate multimodal study)
    - Training-time optimization (inference-only)
    - Real-time latency-critical applications (probe adds ~10ms)
  known_limitations: |
    - Single model architecture (Llama-2-7B); cross-model generalization is future work
    - English-primary benchmark; multilingual generalization untested
    - Static strategy selection at inference start; no mid-generation switching

