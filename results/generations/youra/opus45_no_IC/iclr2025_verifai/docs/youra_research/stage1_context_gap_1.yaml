gap_id: "gap_1"
gap_title: "No Unified Comparative Study Across All Three Strategies"
gap_description: |
  Each strategy (grammar constraints, static analysis, SMT-guided repair) is studied in isolation
  with different benchmarks, metrics, and baselines. No published work compares all three strategies
  on identical benchmarks (HumanEval, MBPP, CodeContests) using consistent metrics.
