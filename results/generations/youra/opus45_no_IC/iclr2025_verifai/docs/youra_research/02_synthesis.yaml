hypothesis_draft:
  title: "Verification Pipeline for LLM Code Generation: Error Class Independence Framework"
  hypothesis_id: "H-VerifPipeline-v1"
  core_claim: |
    Formal verification strategies (grammar constraints, static analysis, SMT-guided repair)
    target largely independent error classes. When combined in a pipeline ordered by abstraction
    level, their combined effectiveness exceeds individual strategy improvements through
    multiplicative error reduction.
  mechanism: |
    Each stage operates at a different abstraction level:
    1. Grammar constraints → syntactic validity (compilation errors)
    2. Static analysis → semantic patterns (security, reliability)
    3. SMT repair → specification satisfaction (formal correctness)

    Because these error classes are largely independent (< 30% overlap), each stage
    presents "cleaner" code to the next, enabling downstream stages to focus on
    their specific error class without noise from upstream issues.
  predictions:
    - P1: "Error overlap between grammar and static analysis < 30% (Jaccard index)"
    - P2: "Each pipeline stage contributes > 5% marginal improvement on remaining errors"
    - P3: "Synergy coefficient S between 0.8-1.2 confirms independence; outside indicates interaction"

variables_summary:
  independent: "Verification pipeline configuration (baseline, grammar, grammar+static, full pipeline)"
  dependent_primary: "pass@k improvement over baseline"
  controlled: "LLM model, benchmark dataset, generation temperature, sample count"

null_hypothesis:
  h0_statement: |
    The synergy coefficient S = 1.0 (±0.2), indicating that combining verification strategies
    produces purely additive effects with no interaction. The combined pipeline improvement
    equals the arithmetic sum of individual strategy improvements.
  statistical_test: "t-test for S ≠ 1.0 with Bonferroni correction for multiple comparisons"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First unified comparison of all three verification strategies on identical benchmarks with error-class-independence framework"
  differentiation_summary: |
    Prior work (Mundler et al., Blyth et al., ContractEval) tested strategies in isolation.
    No existing work measures: (1) error overlap between strategies, (2) marginal contribution
    in a pipeline, (3) synergy vs. independence effects. This fills Gap 1 from Phase 1.

