    - source: "Bandit/Pylint reports for semantic analysis"
    - source: "Z3/Verus verification outputs for spec satisfaction"
  procedure:
    - step: "Generate n=10 samples per problem with baseline LLM"
    - step: "Apply grammar-constrained generation, record pass@k"
    - step: "Apply static analysis feedback, record pass@k"
    - step: "Apply SMT-guided repair (spec-annotated subset), record pass@k"
    - step: "Compute error overlap, marginal improvements, synergy coefficient"
  success_criteria:
