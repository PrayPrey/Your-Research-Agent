# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Standard code generation benchmarks (HumanEval, MBPP, HumanEval-Verus)
    - Python function generation (single-function scope)
    - Autoregressive LLM code generation
    - Problems with test-based correctness evaluation
  does_not_apply_to: |
    - Real codebase generation (multi-file, complex dependencies)
    - Long-context code generation (>500 lines)
    - Non-Python programming languages (though extensible)
    - Code editing/modification tasks (only generation)
  known_limitations: |
    - SMT stage limited to 23 spec-annotated problems (14% of HumanEval)
    - Short function scope may not capture integration-level errors
    - Benchmark problems may not reflect production code complexity

