# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Grammar constraints enforce syntactic validity via token-level logit masking during generation"
      evidence: "Mundler et al. 2025: prefix automata reduce compilation errors >50%"
      falsifier: "Grammar constraints cause no reduction in compilation errors compared to baseline"
    - step: 2
      description: "Static analysis identifies semantic patterns (security, reliability) in syntactically valid code"
      evidence: "Blyth et al. 2025: security issues reduced from 40% to 13%"
      falsifier: "Static analysis catches same errors as grammar constraints (high overlap)"
    - step: 3
      description: "SMT-guided repair enforces formal specification satisfaction on semantically-filtered code"
      evidence: "ContractEval 2025: 75-82% pass@1 with SMT pipeline"
      falsifier: "SMT repair provides no additional improvement after static analysis"
    - step: 4
      description: "Each stage operates on different error class, reducing noise for downstream stages"
      evidence: "Error classes defined by tool categories: compilation (syntax), Bandit (security), Z3 (specs)"
      falsifier: "Error overlap > 50%, indicating significant redundancy between stages"
  key_tension: "Whether error classes are truly independent or share common root causes (e.g., type error causing security vulnerability)"
  evidence_summary: |
    Each strategy has demonstrated effectiveness in isolation. The mechanism predicts
    that combining them in sequence yields multiplicative (not merely additive) improvements
    because each stage filters a distinct error class, presenting cleaner code to the next stage.

