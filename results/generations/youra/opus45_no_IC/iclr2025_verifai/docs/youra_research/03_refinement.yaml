# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-VerifPipeline-v1"
  confidence_level: 0.80
  core_hypothesis_statement: |
    Under standard code generation benchmarks (HumanEval, MBPP), if formal verification
    strategies are combined in a pipeline ordered by abstraction level (grammar constraints
    → static analysis → SMT-guided repair), then the combined pass@k improvement exceeds
    individual strategy improvements, because each strategy targets largely independent
    error classes (syntax, semantics, specifications) enabling multiplicative error reduction.
  alternative_hypothesis_h0: |
    There is no significant difference in pass@k between the combined verification pipeline
    and the arithmetic sum of individual strategy improvements. The synergy coefficient
    S = 1.0 (±0.2), indicating purely additive effects with no interaction.

