# ═══════════════════════════════════════════════════════════════
# HOOK DESIGN
# ═══════════════════════════════════════════════════════════════

hook:
  strategy: "counterintuitive_finding"

  opening_statement:
    content: |
      Combining formal verification strategies for LLM code generation appears straightforward—
      stack grammar constraints, static analysis, and SMT-guided repair for multiplicative gains.
      But our experiments reveal a critical prerequisite: detection is model-agnostic, while repair is not.
    why_effective: "Sets up expectation (stacking works) then subverts it (model capability matters)"

  why_reader_should_care:
    main_reason: "Practitioners deploying verification pipelines may get worse results with wrong model choice"
    concrete_example: "A completion model given static analysis feedback increased security issues 600%"
    stakes: "Without this insight, teams might invest in verification infrastructure that degrades output"

# ═══════════════════════════════════════════════════════════════
# PROBLEM FRAMING (Three Levels)
# ═══════════════════════════════════════════════════════════════

problem_framing:
  surface_problem:
    description: "LLM-generated code contains syntax errors, security vulnerabilities, and specification violations"
    common_understanding: "Different verification strategies target different error types"

  deeper_problem:
    description: "No unified comparison exists across grammar constraints, static analysis, and SMT-guided repair"
    why_overlooked: "Each strategy studied in isolation with different benchmarks and metrics"
    our_perspective: "Pipeline composition requires understanding error class independence"

  gap_in_existing_work:
    description: "Unknown whether error classes are truly independent (enabling multiplicative gains) or overlapping (diminishing returns)"
    why_gap_exists: "No prior work measured pairwise Jaccard between improvement sets"
    why_gap_matters: "Without this, practitioners cannot predict combined pipeline effectiveness"

# ═══════════════════════════════════════════════════════════════
# KEY INSIGHT
# ═══════════════════════════════════════════════════════════════

key_insight:
  aha_moment:
    one_sentence: |
      Error classes targeted by grammar constraints, static analysis, and SMT verification
      are largely independent (mean Jaccard 0.0752), validating layered verification—but
      translating detection into repair requires instruction-tuned models.
    expanded_explanation: |
      We measured pairwise Jaccard indices across 164 HumanEval problems: grammar vs static (0.20),
      grammar vs SMT (0.02), static vs SMT (0.00). This near-independence validates the theoretical
      foundation for layered pipelines. However, when we tested static analysis feedback loops with
      a completion model (StarCoder2-3b), security issues increased 600%. The model treated feedback
      as context to complete, not instructions to repair.

  why_others_missed_it:
    common_assumptions: "Any LLM can use verification feedback productively"
    our_different_view: "Detection is tool-based (model-agnostic); repair is LLM-based (capability-dependent)"
    enabling_factor: "Systematic pipeline testing revealed the failure mode"

  what_makes_it_work:
    intuitive_explanation: "Grammar constraints work during generation (token-level); feedback loops need models that understand repair instructions"
    key_mechanism: "Error class independence enables layered detection; model capability gates repair effectiveness"

# ═══════════════════════════════════════════════════════════════
# EVIDENCE NARRATIVE
# ═══════════════════════════════════════════════════════════════

evidence_narrative:
  main_claim:
    statement: "Error class independence enables layered verification, but repair stages require capability-matched models"
    measurable_criteria:
      - "All pairwise Jaccard < 0.30 (confirmed: mean 0.0752)"
      - "Grammar constraints reduce syntax errors (confirmed: 40% reduction)"
      - "Repair with wrong model degrades output (confirmed: +600% security issues)"

  supporting_evidence:
    - id: "ev_independence"
      what: "Jaccard(grammar,static)=0.20, Jaccard(grammar,smt)=0.02, Jaccard(static,smt)=0.00"
      so_what: "Three verification strategies target genuinely independent error classes"
      how_it_supports_claim: "Validates theoretical foundation for multiplicative error reduction"

    - id: "ev_grammar_works"
      what: "Grammar-constrained decoding reduced syntax errors 100% → 60% (40% reduction)"
      so_what: "Token-level logit masking via DFA produces measurable improvement"
      how_it_supports_claim: "Stage 1 of pipeline works as theorized"

    - id: "ev_repair_fails"
      what: "Static analysis feedback with StarCoder2-3b: security issues 1 → 7 (+600%)"
      so_what: "Completion models cannot use feedback for repair; they generate more problematic code"
      how_it_supports_claim: "Identifies critical model capability prerequisite"

  surprising_findings:
    - finding: "Model generated mostly clean baseline code (6/8 prompts had 0 security issues initially)"
      why_surprising: "Expected security-sensitive prompts to induce vulnerable code"
      our_interpretation: "Modern code LLMs (StarCoder2) trained on filtered data produce cleaner baselines"

    - finding: "Feedback iteration made code WORSE, not better"
      why_surprising: "Prior work (Blyth et al. 2025) reported 40%→13% security reduction"
      our_interpretation: "That work used instruction-tuned models; completion models lack repair capability"

# ═══════════════════════════════════════════════════════════════
# CONTRIBUTIONS & IMPACT
# ═══════════════════════════════════════════════════════════════

takeaway:
  main_contribution:
    one_sentence: "First quantitative evidence that formal verification error classes are independent, plus identification of model capability as prerequisite for feedback-based repair"
    why_significant: "Enables principled pipeline design; prevents deployment failures from model mismatch"

  implications:
    for_field: "Error-class-independence framework provides foundation for predicting synergy vs. redundancy"
    for_practice: "Practitioners must verify model repair capability before deploying feedback loops"

  future_possibilities:
    immediate_extensions: "Retest H-M2 with instruction-tuned models (Llama-3-8B-Instruct)"
    longer_term_vision: "Complete 4-stage pipeline with capability-matched models at each stage"

# ═══════════════════════════════════════════════════════════════
# SECTION-LEVEL GOALS
# ═══════════════════════════════════════════════════════════════

section_goals:
  abstract:
    narrative_purpose: "Compress full story: independence validated, grammar works, repair needs instruction-tuning"
    key_message: "Error class independence enables layered verification, but model capability gates repair"
    word_target: 150

  introduction:
    narrative_purpose: "Hook (stacking seems obvious) → Problem (no unified comparison) → Insight (independence + model prerequisite) → Contributions"
    hook_strategy: "counterintuitive_finding"
    transition_to_related: "Prior work studied strategies in isolation; we compare and reveal interaction effects"
    word_target: 900

  related_work:
    narrative_purpose: "Show three strategy streams exist; none compared on same benchmark; gap is unified comparison"
    positioning_strategy: "We build on (not compete with) prior work by testing combination"
    key_comparison_points:
      - "Grammar-constrained decoding (Mundler et al. 2025, SynCode)"
      - "Static analysis feedback (Blyth et al. 2025)"
      - "SMT-guided repair (ContractEval 2025, Holey)"
    word_target: 700

  methodology:
    narrative_purpose: "Explain Jaccard measurement, pipeline architecture, evaluation protocol"
    connection_to_insight: "Jaccard index chosen because it directly measures independence claim"
    key_design_decisions:
      - "Pairwise Jaccard on improvement sets (not raw error counts)"
      - "Sequential pipeline: grammar → static → SMT"
      - "HumanEval + HumanEval-Verus for full coverage"
    word_target: 1100

  experiments:
    narrative_purpose: "Three hypotheses tested: H-E1 (independence), H-M1 (grammar), H-M2 (static feedback)"
    experimental_questions:
      - "Are error classes independent (Jaccard < 0.30)?"
      - "Does grammar-constrained decoding reduce syntax errors?"
      - "Does static analysis feedback reduce semantic issues?"
    word_target: 900

  results:
    narrative_purpose: "H-E1 PASS (independence confirmed), H-M1 PASS (grammar works), H-M2 FAIL (model mismatch)"
    main_result_highlight: "Mean Jaccard 0.0752 (well below 0.30 threshold)"
    word_target: 1100

  discussion:
    narrative_purpose: "Interpret H-M2 failure as positive finding (identifies prerequisite); honest limitations"
    honest_limitations:
      - "PoC-level validation (5-8 prompts, not full benchmark)"
      - "Pipeline incomplete (H-M3, H-M4 blocked by H-M2 failure)"
      - "Model-specific failure (StarCoder2-3b not instruction-tuned)"
    word_target: 500

  conclusion:
    narrative_purpose: "Callback to hook (stacking works IF model matches); future work (complete pipeline)"
    callback_to_hook: "Layered verification is viable—error classes are independent—but model capability is the hidden gate"
    word_target: 350

