hypothesis_draft:
  title: "Category-Specific Calibration for LLM Truthfulness"
  hypothesis_id: "H-ClusterCal-v1"
  core_claim: |
    LLM calibration on truthfulness benchmarks is heterogeneous across semantic category
    clusters. Cluster-specific temperature scaling achieves lower Expected Calibration Error
    than global temperature scaling because category membership captures systematic variation
    in model confidence behavior.
  mechanism: |
    Different semantic categories evoke different confidence distributions in LLMs, potentially
    reflecting training data characteristics (e.g., confident rhetoric in misconception-prone
    topics vs. hedged language in scientific topics). Temperature scaling with separate
    parameters per cluster can capture this variation, leading to better calibration than
    a single global temperature.
  predictions:
    - P1: "Cluster-specific T achieves lower ECE than global T (paired t-test p<0.05, d>0.3)"
    - P2: "Per-cluster ECE values differ significantly (ANOVA p<0.05)"
    - P3: "Calibration improvement transfers to FACTOR benchmark"

variables_summary:
  independent: "Calibration method (global vs cluster-specific temperature scaling)"
  dependent_primary: "Expected Calibration Error (ECE) with bootstrap CI"
  controlled: "Model architecture, cluster assignments, evaluation protocol"

null_hypothesis:
  h0_statement: |
    There is no significant difference in Expected Calibration Error between cluster-specific
    temperature scaling and global temperature scaling. Semantic category membership does not
    provide useful calibration information beyond a single global temperature parameter.
  statistical_test: "Paired t-test on 5-fold cross-validation ECE"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First per-category calibration disaggregation on TruthfulQA with pre-registered clusters"
  differentiation_summary: |
    Prior calibration work (Guo et al., 2017; Xiong et al., 2023) computes global metrics.
    TruthfulQA (Lin et al., 2022) provides 38 categories but calibration was not analyzed
    per-category. This study bridges the gap by applying cluster-specific temperature scaling
    with explicit semantic groupings and rigorous cross-validation.

