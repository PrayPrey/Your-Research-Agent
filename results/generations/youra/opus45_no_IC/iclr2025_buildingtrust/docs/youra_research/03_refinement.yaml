    - step: 2
      description: "Different confidence distributions require different temperature parameters for optimal calibration"
      evidence: "Mathematical: if P(correct|confidence) relationship varies, optimal T varies"
      falsifier: "Optimal T values are identical across clusters"
    - step: 3
      description: "Cluster-specific temperatures achieve better calibration than global temperature"
      evidence: "More parameters fit data better; generalization tested via cross-validation"
      falsifier: "Cluster-T does not outperform global-T on held-out folds"
