# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Open-weight LLMs with logit access (Llama-2, Mistral families)
    - Truthfulness/factuality benchmarks with category labels
    - Post-hoc calibration scenarios (no fine-tuning)
    - English language factual claims
  does_not_apply_to: |
    - Closed API models without logit access (GPT-4, Claude)
    - Open-ended generation tasks (not multiple-choice/answerable)
    - Domain-specific benchmarks without category structure
    - Languages other than English
  known_limitations: |
    - Small per-cluster n limits statistical power
    - Category clusters are expert-defined, not empirically validated
    - Temperature scaling is a simple linear calibration method
    - Does not explain *why* calibration varies — pattern detection only

