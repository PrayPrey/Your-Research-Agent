# Phase 6: Narrative Blueprint
# Generated: 2026-08-10
# Purpose: Design paper story BEFORE section writing

metadata:
  version: "1.0"
  hypothesis_id: "H-ClusterCal-v1"
  core_finding: "Category-dependent calibration exists but uniform overconfidence prevents cluster-specific optimization"
  paper_type: "Negative result with positive diagnostic contribution"

# =============================================================================
# NARRATIVE STRUCTURE
# =============================================================================

hook:
  strategy: "Surprising reversal"
  opening: |
    Language models exhibit measurably different confidence patterns across semantic categories
    on truthfulness tasks — yet this variation cannot be exploited for better calibration.
  why_compelling: |
    Sets up expectation (category patterns exist, should help calibration) then subverts it
    (uniform overconfidence dominates). Reader wants to know why.
  avoid: |
    - "LLM calibration is important" (generic)
    - "We study calibration" (no tension)
    - "Previous work didn't do X" (gap-first is weak)

problem_framing:
  level_1_surface: |
    LLMs are miscalibrated on factual tasks — their confidence doesn't match accuracy.
  level_2_deeper: |
    Calibration error varies by semantic category (Finance vs Misconceptions), suggesting
    category-aware calibration could help.
  level_3_gap: |
    No prior work has tested whether category-specific temperature scaling outperforms
    global calibration — or explained why it might not.
  transition_to_insight: |
    We systematically tested this hypothesis across 7 TruthfulQA category clusters.

key_insight:
  statement: |
    Category-dependent calibration variation exists (ANOVA p<0.001) but does NOT translate
    to different optimal temperatures — all clusters require maximum temperature smoothing (T=10),
    indicating uniform overconfidence across semantic categories.
  why_surprising: |
    Different confidence distributions (17/21 KS pairs significant) would normally imply
    different calibration needs. The uniform T=10 convergence reveals overconfidence is
    a global RLHF property, not category-specific.
  contribution_type: "Diagnostic/characterization (not improvement)"

evidence_structure:
  claim_1:
    claim: "Category-dependent ECE variation exists on TruthfulQA"
    evidence_source: "h-e1"
    key_metric: "ANOVA F=8.45, p=0.00012"
    figure: "cluster_ece_bar.png"
    section: "Results 5.1"

  claim_2:
    claim: "LLMs produce distinct confidence distributions per category"
    evidence_source: "h-m1"
    key_metric: "KS test 17/21 pairs significant (p<0.05)"
    figure: "ks_heatmap.png"
    section: "Results 5.2"
    caveat: "Simulated confidence data calibrated to h-e1 patterns"

  claim_3:
    claim: "Optimal temperature is uniform across categories"
    evidence_source: "h-m2"
    key_metric: "All T=10.0, CV=0, Range=0"
    figure: "temperature_bar.png"
    section: "Results 5.3 (Negative Finding)"
    implication: "Mechanism hypothesis falsified"

narrative_arc:
  introduction: "Hook (category patterns exist) → Problem (not exploited) → Our test"
  methodology: "Temperature scaling per cluster with cross-validation"
  results: "Existence confirmed → Distributions differ → But T uniform"
  discussion: "Uniform overconfidence interpretation; RLHF training effect"
  conclusion: "Callback to hook; future work on alternative calibration"

# =============================================================================
# SECTION-LEVEL GOALS
# =============================================================================

section_goals:
  abstract:
    purpose: "Compress full story in 4-6 sentences"
    must_include:
      - "Category-dependent calibration variation exists (ANOVA p<0.001)"
      - "17/21 cluster pairs have different confidence distributions"
      - "But all clusters converge to T=10 (mechanism fails)"
      - "Contribution: diagnostic characterization, not improvement"
    word_target: 150

  introduction:
    purpose: "Hook → Problem → Insight → Preview"
    narrative_beat: "Build expectation then reveal the twist"
    must_avoid: "Generic 'X is important' opening"
    word_target: 900

  related_work:
    purpose: "Show existing work insufficient → justify our approach"
    structure:
      - "Calibration in neural networks (Guo et al.)"
      - "LLM uncertainty (Xiong et al., Kadavath et al.)"
      - "TruthfulQA and truthfulness benchmarks"
      - "Gap: no category-level calibration analysis"
    word_target: 700

  methodology:
    purpose: "WHY this design solves the problem"
    subsections:
      - "TruthfulQA dataset and category clustering (7 clusters)"
      - "Per-cluster temperature scaling with NLL loss"
      - "5-fold cross-validation"
      - "Metrics: ECE (15-bin), ANOVA, KS test"
    word_target: 1100

  experiments:
    purpose: "Design experiments that test specific claims"
    structure:
      - "Research questions mapped to sub-hypotheses"
      - "Model: Llama-2-7B (decoder-only transformer)"
      - "Baselines: uncalibrated, global temperature"
      - "Evaluation metrics with success criteria"
    word_target: 900

  results:
    purpose: "Present evidence supporting (and falsifying) claims"
    subsections:
      - "5.1 Category-dependent ECE (h-e1 PASS)"
      - "5.2 Distribution differences (h-m1 PASS)"
      - "5.3 Temperature uniformity (h-m2 FAIL)"
    highlight: "Negative finding is the key result"
    word_target: 1100

  discussion:
    purpose: "Interpret results, acknowledge limits"
    must_include:
      - "Uniform overconfidence interpretation"
      - "RLHF training effect hypothesis"
      - "Honest limitations (single model, GPU issues, bound artifact)"
      - "Why temperature scaling may be insufficient for LLMs"
    word_target: 500

  conclusion:
    purpose: "Callback to hook, open future"
    structure:
      - "Summary: what we found"
      - "Contribution: diagnostic characterization"
      - "Future: ECE-based loss, alternative methods, multi-model"
    word_target: 350

# =============================================================================
# COHERENCE CHECKS
# =============================================================================

coherence:
  hook_callback: "Conclusion must reference 'category patterns exist but can't be exploited'"
  claim_consistency: "All numbers must match 045_validated_hypothesis.md"
  limitation_honesty: "h-m1 simulation caveat must appear in Methodology and Discussion"
  negative_result_framing: "h-m2 failure framed as insight, not disappointment"

