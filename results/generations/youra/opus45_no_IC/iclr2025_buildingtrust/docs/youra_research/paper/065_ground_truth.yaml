  mechanism_falsification:
    claim: "Category-specific T cannot outperform global T"
    evidence: "h-m2 failure blocks h-m3 test; all T identical"
    interpretation: "Different distributions do not require different temperatures"
    status: "Hypothesis falsified"

  contribution_type:
    claim: "Diagnostic/characterization contribution, not improvement"
    evidence: "Negative result on calibration improvement"
    interpretation: "Paper pivots from improvement to characterization"
    status: "Honest framing"

