metadata:
  generated_at: "2026-08-10T00:00:00Z"
  workflow: "phase2a-dialogue"
  architecture: "Self-Play Loop (Claude-only, IC-ablation)"
  schema_version: "10.0.0"
  gap_id: "gap_1_lmsys_coverage"

hypothesis_draft:
  title: "Bidirectional Formality Accommodation Predicts Conversation Length in Human-AI Dialogue"
  hypothesis_id: "H-BiAcc-v1"
  core_claim: |
    In LMSYS-Chat-1M multi-turn conversations, early bidirectional formality accommodation
    (measured via DeBERTa at turns 1-2) predicts conversation continuation, with
    distinguishable effects by direction (AI→Human vs Human→AI).
  mechanism: |
    1. AI reads human's first message and adjusts formality level (accommodation)
    2. Lower |formality(AI_2) - formality(Human_1)| indicates stronger accommodation
    3. Accommodation signals attentiveness, increasing user engagement
    4. User continuation (or termination) is observed as conversation length
  predictions:
    - P1: "AI→Human accommodation correlates with length (r < -0.15)"
    - P2: "Human→AI effect differs from AI→Human (|Δr| > 0.10 or different sign)"
    - P3: "Observed accommodation > shuffled baseline (Cohen's d > 0.3)"

variables_summary:
  independent: "AI→H accommodation (|formality_delta|), Human→AI accommodation (|formality_delta|)"
  dependent_primary: "Conversation length (turn pairs)"
  controlled: "Model ID, Initial formality level"

null_hypothesis:
  h0_statement: |
    There is no significant correlation between early formality accommodation and
    conversation length in LMSYS-Chat-1M (all |r| < 0.10).
  statistical_test: "Pearson correlation with Fisher z-transformation for comparison"
  significance_level: 0.001

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First test of accommodation→outcome in human-AI; bidirectional decomposition; 25+ LLM comparison"
  differentiation_summary: |
    Prior work (Chen et al. 2026) showed accommodation EXISTS in human-AI.
    We test whether accommodation PREDICTS outcomes — a causal-flavored claim.
    Additionally, 25+ model comparison at this scale is unprecedented.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models:
    - "DeBERTa formality ranker (s-nlp/deberta-large-formality-ranker)"
  datasets:
    - "LMSYS-Chat-1M (lmsys/lmsys-chat-1m on HuggingFace)"
  baselines:
    - "Within-conversation shuffle (breaks accommodation, keeps topic)"
    - "Cross-conversation shuffle (breaks both)"

measurement_plan:
  data_collection:
    - source: "LMSYS-Chat-1M from HuggingFace"
    - source: "DeBERTa formality scores for all conversation turns"
  procedure:
    - step: "1. Download LMSYS-Chat-1M and filter to ≥2 turns per side"
    - step: "2. Extract formality scores for all turns using DeBERTa"
    - step: "3. Compute early accommodation deltas (turns 1-2)"
    - step: "4. Correlate with total conversation length"
    - step: "5. Stratify by model ID for cross-model analysis"
    - step: "6. Compute shuffled baselines and effect sizes"
  success_criteria:
    - "Coverage ≥ 50% of conversations with ≥2 turns per side"
    - "AI→Human correlation r < -0.15 (p < 0.001)"
    - "Directional difference |Δr| > 0.10 or opposite signs"
    - "Baseline contrast Cohen's d > 0.3"

validation:
  internal_validity:
    - "Early accommodation avoids circularity (predicting from beginning, not full conversation)"
    - "Shuffled baseline isolates accommodation from random variation"
    - "Cross-model stratification controls for model-specific effects"
  external_validity:
    - "LMSYS-Chat-1M is large-scale real-world data (1M conversations, 210K IPs)"
    - "25+ LLMs represent diversity of current model landscape"
    - "Results should generalize to similar human-AI conversation settings"

discussion_synthesis:
  key_insights:
    - "H-M1 failure taught us: measure natural signals, don't inject artificial ones"
    - "Bidirectional decomposition (AI→H vs H→AI) may reveal opposing effects"
    - "Early accommodation (turns 1-2) captures intent before topic dominates"
  breakthrough_moments:
    - "Exchange 7: Reframing as two competing hypotheses (H1a vs H1b)"
    - "Exchange 12: Prof. Rex's circularity fix — use early accommodation only"
    - "Exchange 13: Two-level shuffled baseline design"
  resolved_tensions:
    - "Circularity concern → early accommodation measurement"
    - "Confound concerns → cross-model stratification, shuffled baselines"
    - "Operationalization vagueness → DeBERTa formality with specific thresholds"
