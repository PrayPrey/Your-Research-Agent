# ═══════════════════════════════════════════════════════════════
# SECTION 0: Established Facts & Claim Scope
# ═══════════════════════════════════════════════════════════════

established_facts:
  claims:
    - claim: "Bidirectional accommodation exists in human-AI conversations"
      status: "BUILD_ON"
      evidence: "Chen et al. (2026) measured bidirectional linguistic accommodation in 1319 GPT-4o conversations"
    - claim: "LMSYS-Chat-1M contains 1M+ real conversations with 25+ LLMs"
      status: "BUILD_ON"
      evidence: "Zheng et al. (2023), 497 citations, dataset publicly available"
    - claim: "DeBERTa formality detection achieves 87.8% accuracy"
      status: "BUILD_ON"
      evidence: "s-nlp/deberta-large-formality-ranker on HuggingFace"
    - claim: "Early formality accommodation predicts conversation continuation"
      status: "PROVE_NEW"
      evidence: "Novel hypothesis; not tested in prior work"
    - claim: "AI→Human and Human→AI accommodation have distinguishable effects"
      status: "PROVE_NEW"
      evidence: "Novel decomposition; Chen et al. didn't test directional differences on outcomes"
  scope_reduction_percentage: 60
  phase2b_4_instructions: |
    BUILD_ON claims (accommodation existence, dataset, tools) can be cited without re-verification.
    PROVE_NEW claims (early accommodation → continuation, directional effects) require experimental validation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BiAcc-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under multi-turn human-AI conversation settings (LMSYS-Chat-1M, ≥2 turns per side),
    if AI and human formality levels converge in early turns (accommodation),
    then conversation length increases (engagement),
    because accommodation signals attentiveness and understanding, motivating continuation.
  alternative_hypothesis_h0: |
    There is no significant correlation between early formality accommodation and
    conversation length in LMSYS-Chat-1M conversations (all |r| < 0.10).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "AI→Human Accommodation"
      type: "continuous"
      operationalization: "|formality(AI_turn_2) - formality(Human_turn_1)|; lower = stronger accommodation"
    - name: "Human→AI Accommodation"
      type: "continuous"
      operationalization: "|formality(Human_turn_2) - formality(AI_turn_1)|; lower = stronger accommodation"
  dependent:
    - name: "Conversation Length"
      type: "continuous"
      operationalization: "Total number of turn pairs in conversation"
      primary: true
  controlled:
    - name: "Model ID"
      operationalization: "Categorical identifier of LLM (25+ models in LMSYS)"
    - name: "Initial Formality Level"
      operationalization: "formality(Human_turn_1) — controls for baseline formality"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 4
  steps:
    - step: 1
      description: "Human sends initial message with certain formality level"
      evidence: "Observed in all multi-turn conversations"
      falsifier: "N/A — observational step"
    - step: 2
      description: "AI responds with formality level that may match or diverge from human"
      evidence: "DeBERTa can measure formality; Chen et al. showed models adapt"
      falsifier: "AI formality variance = 0 (no adaptation)"
    - step: 3
      description: "Lower formality delta signals accommodation/attentiveness"
      evidence: "Communication Accommodation Theory (Giles, 1973); Niederhoffer & Pennebaker (2002)"
      falsifier: "No correlation between delta and perceived attentiveness in human evaluation"
    - step: 4
      description: "Perceived attentiveness increases user engagement, leading to continuation"
      evidence: "Hypothesis to be tested; accommodation → length correlation"
      falsifier: "r < 0.10 for all model subsets"
  key_tension: "Does human→AI accommodation increase or decrease length? Competing predictions."
  evidence_summary: |
    CAT theory predicts accommodation signals rapport. Prior human-human work (Niederhoffer & Pennebaker)
    shows r ~ 0.3 for style matching and relationship quality. Hypothesis extends to human-AI.

# ═══════════════════════════════════════════════════════════════
# SECTION 1.4: Key Assumptions (A1-A5)
# ═══════════════════════════════════════════════════════════════

key_assumptions:
  - id: "A1"
    assumption: "Formality accommodation generalizes from human-human to human-AI settings"
    supporting_evidence: "Chen et al. (2026) showed accommodation exists in human-AI; generalization to outcomes untested"
    consequence_if_violated: "Hypothesis fails; accommodation may exist but not predict outcomes in human-AI"
  - id: "A2"
    assumption: "DeBERTa formality scores are valid proxies for perceived formality"
    supporting_evidence: "87.8% accuracy on formality classification task; standard in NLP"
    consequence_if_violated: "Measurement noise reduces effect sizes; may need alternative operationalization"
  - id: "A3"
    assumption: "Conversation length is a meaningful proxy for engagement/success"
    supporting_evidence: "Common proxy in dialogue research; longer = more engagement (all else equal)"
    consequence_if_violated: "Length may reflect verbosity or user patience, not engagement; need alternative DV"
  - id: "A4"
    assumption: "Early turns (1-2) capture accommodation intent before topic complexity dominates"
    supporting_evidence: "Chen et al. found model accommodation front-loaded in turn 1"
    consequence_if_violated: "Need to expand window to turns 1-3 or use full-conversation measure (but circularity risk)"
  - id: "A5"
    assumption: "LMSYS-Chat-1M conversations are representative of real human-AI interaction"
    supporting_evidence: "1M conversations, 210K unique IPs, diverse topics; standard dataset"
    consequence_if_violated: "Results may not generalize to other platforms or user populations"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Multi-turn conversations (≥2 turns per participant) in LMSYS-Chat-1M
    - English-language conversations (formality model trained on English)
    - All 25+ LLMs in LMSYS dataset (cross-model analysis)
  does_not_apply_to: |
    - Single-turn Q&A (no accommodation to measure)
    - Code-only conversations (formality concept unclear)
    - Non-English conversations (formality model limitation)
  known_limitations: |
    - User intent confound: some users want quick answers, others want discussion
    - Model verbosity variation: some models naturally produce longer responses
    - Topic distribution: different topics may have different accommodation baselines

# ═══════════════════════════════════════════════════════════════
# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "AI→Human formality accommodation correlates positively with conversation length"
    test_method: "Pearson correlation between |formality(AI_2) - formality(Human_1)| and length"
    success_criterion: "r < -0.15, p < 0.001, N > 100,000 (negative r = smaller delta = more accommodation = longer)"
    falsification: "r ≥ -0.10 or p ≥ 0.05 or N < 100,000"
  - id: "P2"
    primary: false
    statement: "Human→AI accommodation has effect distinguishable from AI→Human"
    test_method: "Compare correlation coefficients for AI→H vs H→AI"
    success_criterion: "Different sign OR |Δr| > 0.10"
    falsification: "|Δr| < 0.05 and same sign"
  - id: "P3"
    primary: false
    statement: "Observed accommodation exceeds shuffled baseline"
    test_method: "Compare real |formality_delta| to shuffled (randomized turn pairing)"
    success_criterion: "Cohen's d > 0.3 (observed < shuffled)"
    falsification: "d < 0.1 or observed ≥ shuffled"

