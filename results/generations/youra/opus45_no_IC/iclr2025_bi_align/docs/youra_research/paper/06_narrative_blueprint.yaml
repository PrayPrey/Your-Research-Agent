      value: "r=0.152"
      p_value: "<0.001"
      n: 111039
      source: "H-M2"

    - claim: "Sample size for BCS analysis"
      value: "n=26,395"
      source: "H-E1"

    - claim: "BCS standard deviation"
      value: "0.569"
      target: ">0.15"
      source: "H-E1"

    - claim: "Tercile T1 (low delta) continuation rate"
      value: "65.9%"
      source: "H-M3"

    - claim: "Tercile T2 (mid delta) continuation rate"
      value: "71.4%"
      source: "H-M3"

    - claim: "Tercile T3 (high delta) continuation rate"
      value: "60.9%"
      source: "H-M3"

    - claim: "Human→AI adaptation correlation"
      value: "r=0.0134"
      p_value: "0.00113"
      n: 26405
      source: "H-M1"

  qualitative:
    - claim: "Inverted-U relationship (Goldilocks zone)"
      evidence: "T2 > T1 > T3 pattern"
      source: "H-M3"

    - claim: "AI accommodates more than humans (asymmetric)"
      evidence: "11× effect size ratio"
      source: "H-M1, H-M2 comparison"
