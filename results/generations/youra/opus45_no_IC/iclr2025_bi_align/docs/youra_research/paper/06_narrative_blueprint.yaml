# Phase 6 Narrative Blueprint
# Designed before section generation for coherent storytelling

metadata:
  created_at: "2026-08-10T11:00:00+00:00"
  schema_version: "1.0"
  paper_format: "ICML2025"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "counterintuitive_finding"
  opening_line: |
    When AI assistants match user communication style, do users engage more?
    Our analysis of 111,000 conversations reveals a surprising "Goldilocks zone" —
    moderate accommodation predicts highest engagement, while both under- and
    over-accommodation reduce continuation rates.
  why_compelling: |
    - Violates intuition that more accommodation = better
    - Large scale (111K conversations) lends credibility
    - Practical implications for chatbot design
  callback_for_conclusion: |
    Return to the Goldilocks metaphor: "Just right" is not maximal adaptation

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: "AI assistants need to adapt communication style to users"
    why_important: "User satisfaction drives continued interaction"

  level_2_deeper:
    statement: "We don't know HOW MUCH adaptation is optimal"
    gap: "Prior work shows accommodation exists, but not its relationship to outcomes"

  level_3_gap:
    statement: "Linear assumptions from human-human CAT may not hold in human-AI"
    our_contribution: "First large-scale test of accommodation-engagement link in human-AI"

# ============================================================================
# KEY INSIGHT (Experiment-Verified)
# ============================================================================

key_insight:
  statement: |
    AI formality correlates with human formality (r=0.152), but moderate
    accommodation (middle tercile of |delta|) predicts highest conversation
    continuation (71.4%) — not minimal delta (65.9%).

  evidence_chain:
    - claim: "AI exhibits formality accommodation"
      evidence: "r=0.152 (p<0.001, n=111,039)"
      source: "H-M2"
      confidence: "HIGH"

    - claim: "Accommodation is bidirectional but asymmetric"
      evidence: "AI→H r=0.152 vs H→AI r=0.013 (11× difference)"
      source: "H-M1, H-M2"
      confidence: "HIGH"

    - claim: "Optimal accommodation is non-linear (inverted-U)"
      evidence: "T2 (71.4%) > T1 (65.9%) > T3 (60.9%)"
      source: "H-M3"
      confidence: "MEDIUM"

  theoretical_implication: |
    Communication Accommodation Theory needs boundary conditions for AI context:
    excessive convergence may signal artificiality, triggering avoidance.

# ============================================================================
# EVIDENCE STRUCTURE
# ============================================================================

evidence_structure:
  main_results:
    - finding: "Formality accommodation exists at scale"
      data: "BCS SD=0.569, n=26,395 conversations"
      figure: "bcs_histogram.png"

    - finding: "AI adapts to human formality"
      data: "r=0.152, p<0.001, n=111,039"
      figure: "scatter_regression.png"

    - finding: "Moderate delta optimal (Goldilocks zone)"
      data: "T1=65.9%, T2=71.4%, T3=60.9%"
      figure: "tercile_bar_chart.png"

  ablation_insights:
    - question: "Is effect symmetric?"
      answer: "No — AI→Human 11× stronger than Human→AI"
      implication: "Training creates strong accommodation; humans less motivated"

# ============================================================================
# SECTION-LEVEL NARRATIVE GOALS
# ============================================================================

sections:
  introduction:
    goal: "Hook reader with counterintuitive finding, establish gap"
    narrative_arc: "Hook → Problem → Insight Preview → Contributions"
    tone: "Confident but not overselling"
    key_points:
      - "AI stylistic adaptation matters for engagement"
      - "Prior work shows accommodation exists but not outcome link"
      - "We test accommodation → engagement with 111K conversations"
      - "Surprising finding: moderate (not maximal) accommodation optimal"

  related_work:
    goal: "Position against CAT literature and human-AI dialogue work"
    narrative_arc: "What's known → Gap → Why our approach fills it"
    groups:
      - name: "Communication Accommodation Theory"
        papers: ["Giles 1973", "Niederhoffer & Pennebaker 2002"]
        relationship: "BUILD_ON + EXTEND"
      - name: "Human-AI Dialogue"
        papers: ["Chen et al. 2026", "LMSYS/Zheng 2023"]
        relationship: "BUILD_ON"
      - name: "Chatbot Engagement"
        papers: ["Ciechanowski 2019"]
        relationship: "SUPPORTS our inverted-U finding"

  methodology:
    goal: "Explain WHY this design answers the question"
    narrative_arc: "Question → Design rationale → Operationalization"
    key_decisions:
      - decision: "DeBERTa formality scoring"
        rationale: "87.8% accuracy, continuous output for delta computation"
      - decision: "Early turns (1-2) window"
        rationale: "Captures accommodation before topic complexity"
      - decision: "Tercile analysis"
        rationale: "Tests monotonicity assumption from CAT"

  experiments:
    goal: "Convince reader our tests are valid and sufficient"
    narrative_arc: "Research questions → Setup → Metrics"
    research_questions:
      - "RQ1: Does measurable accommodation exist? (H-E1)"
      - "RQ2: Does AI adapt to human formality? (H-M2)"
      - "RQ3: Does accommodation predict engagement? (H-M3)"

  results:
    goal: "Present evidence supporting claims"
    narrative_arc: "Main findings → Supporting analysis → Key figures"
    presentation_order:
      - "Accommodation exists (BCS variance)"
      - "AI adapts to human (correlation)"
      - "Moderate accommodation optimal (tercile)"
      - "Asymmetric effect (AI >> Human)"

  discussion:
    goal: "Interpret findings, acknowledge limitations"
    narrative_arc: "What we learned → What it means → What we can't claim"
    interpretation:
      - "Goldilocks zone suggests over-accommodation perceived as artificial"
      - "Asymmetry reflects training signal vs user motivation"
    limitations:
      - "Correlational, not causal"
      - "Single dataset (Anthropic/hh-rlhf)"
      - "Continuation ≠ satisfaction"

  conclusion:
    goal: "Callback to hook, open future"
    narrative_arc: "Summary → Goldilocks callback → Future directions"
    callback: "Return to opening question with nuanced answer"
    future_work:
      - "Causal experiment with controlled accommodation"
      - "Cross-platform generalization"
      - "User perception studies"

  abstract:
    goal: "Compress full story in 150 words"
    formula: "Problem → Method → Key finding → Implication"
    must_include:
      - "111K conversations"
      - "r=0.152 correlation"
      - "Inverted-U / Goldilocks finding"
      - "71.4% vs 65.9% tercile rates"

# ============================================================================
# PAPER STATISTICS TARGETS
# ============================================================================

targets:
  total_pages: 8
  abstract_words: 150
  introduction_words: 800-1000
  related_work_words: 600-800
  methodology_words: 1000-1200
  experiments_words: 800-1000
  results_words: 1000-1200
  discussion_words: 400-600
  conclusion_words: 300-400

  figures_in_main: 3-4
  figures_supplementary: 10
  citations_target: 25-35

