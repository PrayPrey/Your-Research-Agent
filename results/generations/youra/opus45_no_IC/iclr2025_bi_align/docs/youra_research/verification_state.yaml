risks:
  high:
  - id: R1
    description: Formality accommodation may not generalize from human-human to human-AI
    affected:
    - h-m3
    - h-m4
    mitigation: Compare effect sizes to Niederhoffer & Pennebaker r ~ 0.3
  medium:
  - id: R2
    description: DeBERTa formality scores may not capture perceptually-relevant differences
    affected:
    - h-m1
    - h-m2
    - h-m3
    - h-m4
    mitigation: Use well-validated model with 87.8% accuracy; check distributions
  - id: R3
    description: Conversation length may reflect verbosity, not engagement
    affected:
    - h-m4
    mitigation: Acknowledge limitation; explore alternative DVs if available
  - id: R4
    description: Early turns (1-2) may be insufficient window
    affected:
    - h-m3
    - h-m4
    mitigation: Expand to turns 1-3 if signal too weak
  low:
  - id: R5
    description: LMSYS-Chat-1M may not be representative
    affected:
    - all
    mitigation: Standard dataset; 1M conversations, 210K IPs
