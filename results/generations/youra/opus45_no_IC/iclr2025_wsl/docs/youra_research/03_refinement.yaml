# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Homogeneous architecture model zoos (single architecture family)
    - CNN models trained on image classification (CIFAR-10 scale)
    - Property prediction tasks (accuracy, potentially loss/epochs)
    - Data scales from hundreds to tens of thousands of models
  does_not_apply_to: |
    - Heterogeneous (mixed architecture) model collections
    - Transformer-based models (different permutation structure)
    - Models trained on different tasks (NLP, RL)
    - Very large models (scaling to ViT-scale untested)
  known_limitations: |
    - Results specific to CIFAR-10 CNN zoos; generalization uncertain
    - Crossover threshold T may vary with model complexity
    - Does not address generation tasks (only property prediction)

