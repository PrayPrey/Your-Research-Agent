# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "At N=1K, NFN R² > MLP-Matched R² + 0.05"
    test_method: "One-sided paired t-test across 10 random seeds"
    success_criterion: "p < 0.05, mean difference > 0.05"
    falsification: "p >= 0.05 OR mean difference <= 0.05 → equivariance doesn't help at small scale"
  - id: "P2"
    primary: true
    statement: "At N=1K, NFN R² > NFN-Scrambled R² + 0.05"
    test_method: "One-sided paired t-test across 10 random seeds"
    success_criterion: "p < 0.05, mean difference > 0.05"
    falsification: "p >= 0.05 → benefit is structural (any constraint helps), not symmetry-specific"
  - id: "P3"
    primary: true
    statement: "At N=50K (or max available), |NFN R² - MLP R²| < 0.02"
    test_method: "Two one-sided tests (TOST) equivalence procedure"
    success_criterion: "90% CI for difference within [-0.02, +0.02]"
    falsification: "Difference outside bounds → equivariance benefit persists at scale"
  - id: "P4"
    primary: false
    statement: "MLP probe invariance increases with N; at N=50K, invariance > 0.8"
    test_method: "Compute mean correlation of outputs across 10 random permutations; report 95% CI"
    success_criterion: "95% CI lower bound > 0.8 at N=50K"
    falsification: "Invariance stays low → MLP succeeds via different mechanism"

