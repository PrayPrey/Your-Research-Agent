# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "NFN's equivariant layers encode permutation group structure"
      evidence: "NFN paper [Zhou et al., 2023] - NPLinear, HNPPool layers"
      falsifier: "NFN fails to maintain equivariance under weight permutation (test via output stability)"
    - step: 2
      description: "Built-in equivariance makes NFN predictions invariant to weight ordering"
      evidence: "Architectural property from equivariant design"
      falsifier: "NFN outputs change under weight permutation (would indicate broken implementation)"
    - step: 3
      description: "MLP has no built-in permutation awareness - must learn from data"
      evidence: "Standard MLP architecture has no symmetry constraints"
      falsifier: "MLP trained on N=0 already shows permutation invariance (would indicate data leakage)"
    - step: 4
      description: "At small N, MLP sees insufficient variation in weight orderings"
      evidence: "100 models failed in H-E1; data diversity insufficient"
      falsifier: "MLP achieves high probe invariance at N=1K (would indicate instant learning)"
    - step: 5
      description: "At large N, diversity of orderings provides equivalent symmetry information"
      evidence: "To be tested - MLP probe invariance should increase with N"
      falsifier: "MLP probe invariance stays low at N=50K despite matching R² (alternative mechanism)"
  key_tension: "Whether MLP's success at large scale comes from learned invariance or memorization of order-sensitive statistics"
  evidence_summary: |
    The mechanism predicts a joint trajectory: as N increases, MLP R² approaches NFN R²
    AND MLP probe invariance increases. If R² converges but probe invariance stays low,
    MLP is succeeding via a different mechanism (memorization), not learned symmetry.

