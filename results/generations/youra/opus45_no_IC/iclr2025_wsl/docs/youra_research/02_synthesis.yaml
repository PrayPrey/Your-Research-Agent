hypothesis_draft:
  title: "Sample Efficiency of Permutation Equivariance in Weight Space Learning"
  hypothesis_id: "H-EquivScale-v1"
  core_claim: |
    Permutation equivariance provides sample efficiency benefits in weight space learning
    that diminish as data scale increases. At small scales (<5K models), equivariant
    architectures (NFN) significantly outperform matched-capacity non-equivariant
    alternatives (MLP). At large scales (>25K models), the advantage diminishes as
    MLPs learn permutation-robust features from data diversity.
  mechanism: |
    Equivariant architectures bake in knowledge of the permutation symmetry group,
    making predictions invariant to weight ordering without learning. MLPs must
    discover this invariance from data. With enough models, the natural variation
    in weight orderings across different trained models provides sufficient signal
    for MLPs to learn permutation-robust features, achieving similar representations
    and performance to explicitly equivariant methods.
  predictions:
    - P1: "N=1K: NFN R² > MLP R² + 0.05 (p<0.05)"
    - P2: "N=1K: NFN R² > NFN-Scrambled R² + 0.05 (symmetry-specific)"
    - P3: "N=50K: |NFN - MLP| < 0.02 (equivalence)"
    - P4: "MLP probe invariance > 0.8 at N=50K (learned symmetry)"

variables_summary:
  independent: "Architecture (NFN/MLP/Scrambled), Data Scale (1K-50K)"
  dependent_primary: "R² on accuracy prediction"
  controlled: "Single architecture family, training protocol, test set"

null_hypothesis:
  h0_statement: |
    H0: There is no significant difference in accuracy prediction R² between
    NFN and MLP-Matched at any data scale (equivariance provides no benefit),
    OR the NFN advantage remains constant across scales (no diminishing returns).
  statistical_test: "One-sided t-test (P1, P2), TOST equivalence (P3)"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First scale study of equivariance in weight space; novel claim that MLPs learn permutation invariance from data"
  differentiation_summary: |
    Unlike NFN (focused on generation) or Hyper-Representations (attention-based),
    this work directly tests whether equivariance is necessary or merely convenient.
    Connects weight space learning to broader inductive bias debate in deep learning.

