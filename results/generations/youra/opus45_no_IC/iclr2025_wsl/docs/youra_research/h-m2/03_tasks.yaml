tasks:
  - id: P-1
    name: sys.path + imports setup
    description: Wire H_M1_CODE_DIR/H_E1_CODE_DIR constants, import reused functions
    complexity: 3
    complexity_breakdown: "1+2+0+0"
    category: infrastructure
    dependencies: []
    files:
      - h-m2/code/test_predictions.py

  - id: P-2
    name: Load NFN + network_spec
    description: Reuse load_nfn_model, get_network_spec_from_sample, checkpoint from H-E1
    complexity: 4
    complexity_breakdown: "1+2+0+1"
    category: model_loading
    dependencies: [P-1]
    files:
      - h-m2/code/test_predictions.py

  - id: P-3
    name: Test MLP generation
    description: Call generate_test_mlp(seed=42), reuse H-M1 defaults unchanged
    complexity: 2
    complexity_breakdown: "1+1+0+0"
    category: data_prep
    dependencies: [P-1]
    files:
      - h-m2/code/test_predictions.py

  - id: P-4
    name: Prediction invariance loop
    description: Run original + 10 permuted predictions via state_dict_to_wsfeat + NFN forward
    complexity: 6
    complexity_breakdown: "2+2+1+1"
    category: core_experiment
    dependencies: [P-2, P-3]
    files:
      - h-m2/code/test_predictions.py

  - id: P-5
    name: Gate evaluation
    description: Apply gate_passed(metrics, dev_threshold=1e-5), write results.json
    complexity: 3
    complexity_breakdown: "1+1+0+1"
    category: evaluation
    dependencies: [P-4]
    files:
      - h-m2/code/test_predictions.py
      - h-m2/results.json

  - id: P-6
    name: Visualization
    description: Call reused plot_predictions_bar + plot_deviation_heatmap + plot_prediction_histogram
    complexity: 3
    complexity_breakdown: "1+2+0+0"
    category: visualization
    dependencies: [P-4]
    files:
      - h-m2/figures/predictions_bar.png
      - h-m2/figures/deviation_heatmap.png
      - h-m2/figures/prediction_histogram.png

  - id: P-7
    name: Orchestration (main)
    description: Wire P-2..P-6 into single main() entrypoint, error handling
    complexity: 3
    complexity_breakdown: "1+1+0+1"
    category: orchestration
    dependencies: [P-5, P-6]
    files:
      - h-m2/code/test_predictions.py

