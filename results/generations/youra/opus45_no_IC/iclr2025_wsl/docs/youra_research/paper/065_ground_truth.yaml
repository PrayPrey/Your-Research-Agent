# Ground Truth for Phase 6.5 Adversarial Review
# Extracted from validated experiments (Phase 4.5)
# Used to verify paper claims match experimental evidence

metadata:
  extracted_from: "045_validated_hypothesis.md"
  extraction_date: "2026-08-12"
  paper_file: "06_paper.md"

# =============================================================================
# QUANTITATIVE CLAIMS (must match exactly)
# =============================================================================

quantitative_claims:
  # H-E1: Main existence result
  h_e1_nfn_r2:
    value: 0.9524
    source: "h-e1/04_validation.md"
    paper_section: "Results"
    claim: "NFN achieves R²=0.95"

  h_e1_mlp_r2:
    value: 0.3529
    source: "h-e1/04_validation.md"
    paper_section: "Results"
    claim: "MLP achieves R²=0.35"

  h_e1_difference:
    value: 0.5995
    source: "h-e1/04_validation.md"
    paper_section: "Results, Abstract"
    claim: "60 percentage point advantage"

  # H-M1/M2: NFN invariance
  nfn_max_deviation:
    value: 1.19e-07
    source: "h-m1/04_validation.md"
    paper_section: "Results, Abstract"
    claim: "deviation < 1.19e-07"

  nfn_invariance_correlation:
    value: 0.99999986
    source: "h-m1/04_validation.md"
    paper_section: "Results"
    claim: "mathematically perfect invariance"

  # H-M3: MLP negative control
  mlp_untrained_cv:
    value: 0.194
    source: "h-m3/04_validation.md"
    paper_section: "Results"
    claim: "CV=0.194 confirms no built-in invariance"

  # H-M5: Critical failure result
  h_m5_mlp_r2:
    value: 0.986
    source: "h-m5/04_validation.md"
    paper_section: "Results, Abstract"
    claim: "R²=0.986 at N=40K"

  h_m5_mlp_invariance:
    value: 0.6265
    source: "h-m5/04_validation.md"
    paper_section: "Results, Abstract"
    claim: "invariance=0.63"

  invariance_threshold:
    value: 0.8
    source: "02b_verification_plan.md"
    paper_section: "Results"
    claim: "0.63 < 0.8 threshold"

# =============================================================================
# QUALITATIVE CLAIMS (interpretations to verify)
# =============================================================================

qualitative_claims:
  main_thesis:
    claim: "Permutation invariance cannot be learned from data regardless of scale"
    evidence:
      - "H-M5: R²=0.986 coexists with invariance=0.63"
      - "H-M1/M2: NFN invariance is mathematical (1.19e-07)"
    paper_section: "Abstract, Introduction, Discussion, Conclusion"

  dissociation:
    claim: "Task performance and representation quality are separable"
    evidence: "MLP achieves high R² (0.986) but low invariance (0.63)"
    paper_section: "Abstract, Discussion"

  position_sensitivity:
    claim: "MLPs exploit position-sensitive statistics rather than semantic structure"
    evidence: "Inferred from dissociation; not directly measured"
    strength: "INTERPRETATION"
    paper_section: "Discussion"

# =============================================================================
# GATE RESULTS (verification status)
# =============================================================================

gate_results:
  h_e1:
    gate_type: "MUST_WORK"
    passed: true
    threshold: "> 0.05"
    actual: "0.5995"

  h_m1:
    gate_type: "MUST_WORK"
    passed: true
    threshold: "< 1e-5"
    actual: "1.19e-07"

  h_m2:
    gate_type: "SHOULD_WORK"
    passed: true
    threshold: "> 0.99"
    actual: "0.9999999"

  h_m3:
    gate_type: "SHOULD_WORK"
    passed: true
    threshold: "> 0.1"
    actual: "0.194"

  h_m4:
    gate_type: "SHOULD_WORK"
    passed: true
    note: "Mechanism confirmed via R² analysis despite metric failure"

  h_m5:
    gate_type: "SHOULD_WORK"
    passed: false
    threshold: "> 0.8"
    actual: "0.627"
    significance: "FALSIFIES original hypothesis - key scientific result"

# =============================================================================
# LIMITATIONS (must be acknowledged in paper)
# =============================================================================

required_limitations:
  - id: "synthetic_data"
    description: "H-E1 used synthetic MLP weights"
    mitigation: "H-M4/H-M5 use real Model Zoo data"
    paper_section: "Discussion"

  - id: "single_architecture"
    description: "Only CIFAR-10 CNNs tested"
    mitigation: "Establishes principle; generalization is future work"
    paper_section: "Discussion"

  - id: "limited_seeds"
    description: "Some experiments used 1-3 seeds"
    mitigation: "Effect sizes large (60pp gap)"
    paper_section: "Discussion"

  - id: "missing_scrambled"
    description: "NFN-Scrambled baseline not implemented"
    mitigation: "Focus on NFN vs MLP; ablating symmetry group is future work"
    paper_section: "Discussion"

# =============================================================================
# ADVERSARIAL REVIEW CHECKPOINTS
# =============================================================================

adversarial_checkpoints:
  - check: "Abstract claims match ground truth values"
    values_to_verify: ["60pp gap", "R²=0.95 vs 0.35", "1.19e-07", "R²=0.99", "0.63"]

  - check: "No overclaims beyond evidence"
    risks:
      - "Claiming generalization beyond CNNs"
      - "Claiming MLP 'cannot' learn (vs 'did not' with 40K)"

  - check: "Limitations section complete"
    required: ["synthetic_data", "single_architecture", "limited_seeds", "missing_scrambled"]

  - check: "H-M5 failure framed correctly"
    framing: "Scientific insight, not methodology failure"
