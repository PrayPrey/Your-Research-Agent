# =============================================================================
# HOOK DESIGN
# =============================================================================

hook:
  opening_statement:
    content: "A neural network that achieves 99% predictive accuracy can fundamentally misunderstand the structure of its input — learning the right answers through the wrong mechanism."
    strategy: "counterintuitive_finding"

  why_reader_should_care:
    main_reason: "Architectural inductive biases cannot be replaced by data quantity"
    concrete_example: "MLPs trained on 40K models achieve R²=0.99 but only 63% permutation invariance"
    stakes: "Without correct symmetry encoding, models exploit dataset-specific correlations rather than semantic structure"

# =============================================================================
# PROBLEM FRAMING (Three Levels)
# =============================================================================

problem_framing:
  surface_problem:
    description: "Weight-space learning requires handling permutation symmetries in neural network weights"
    common_understanding: "Papers acknowledge permutation symmetry but assume sufficient data diversity can teach it"

  deeper_problem:
    description: "The conventional wisdom that 'more data teaches invariance' is untested for weight-space learning"
    why_overlooked: "Prior work focused on absolute performance, not mechanism verification"
    our_perspective: "Sample efficiency and learned invariance are separable — high R² doesn't imply correct mechanism"

  gap_in_existing_work:
    description: "No systematic study of whether equivariance benefits persist or diminish at scale"
    why_gap_exists: "Requires large-scale controlled experiments comparing equivariant vs non-equivariant architectures"
    why_gap_matters: "Determines whether architectural constraints are necessary or merely convenient"

# =============================================================================
# KEY INSIGHT
# =============================================================================

key_insight:
  aha_moment:
    one_sentence: "Permutation invariance must be built in architecturally — it cannot be learned from data regardless of scale."
    expanded_explanation: "We find that MLPs trained on 40K+ models achieve near-perfect accuracy (R²=0.99) but fail to develop permutation invariance (0.63 vs 1.0 for NFN). This dissociates task performance from mechanism: high accuracy can coexist with fundamentally wrong representations."

  why_others_missed_it:
    common_assumptions: "More diverse data teaches implicit symmetries"
    our_different_view: "Symmetries require architectural encoding; data teaches correlations, not structure"
    enabling_factor: "Explicit mechanism verification via probe invariance tests alongside R² evaluation"

  what_makes_it_work:
    intuitive_explanation: "NFN's HNPPool layer mathematically guarantees permutation-invariant representations"
    key_mechanism: "Equivariant layers (NPLinear) → Invariant pooling (HNPPool) → Symmetry-preserving features"

# =============================================================================
# EVIDENCE NARRATIVE
# =============================================================================

evidence_narrative:
  main_claim:
    statement: "NFN provides 60 percentage point R² advantage at N=1K due to architectural permutation equivariance"
    measurable_criteria: "R² difference > 0.05 with p < 0.05"

  supporting_evidence:
    - id: "evidence_1"
      what: "NFN R²=0.95, MLP R²=0.35 at N=1K"
      so_what: "60pp gap far exceeds 0.05 threshold — effect is massive, not marginal"
      how_it_supports_claim: "Directly validates existence of equivariance benefit"

    - id: "evidence_2"
      what: "NFN prediction deviation < 1.19e-07 across 10 permutations"
      so_what: "NFN invariance is mathematically perfect, not approximate"
      how_it_supports_claim: "Confirms mechanism — benefit comes from correct symmetry encoding"

    - id: "evidence_3"
      what: "MLP R²=0.986 but invariance=0.63 at N=40K"
      so_what: "High accuracy without invariance proves dissociation"
      how_it_supports_claim: "MLP learns position-sensitive statistics, not semantic structure"

  surprising_findings:
    finding: "MLP achieves near-perfect R² without learning invariance"
    why_surprising: "Expected that good predictions require correct representations"
    our_interpretation: "MLPs exploit dataset-specific position-accuracy correlations rather than weight semantics"

