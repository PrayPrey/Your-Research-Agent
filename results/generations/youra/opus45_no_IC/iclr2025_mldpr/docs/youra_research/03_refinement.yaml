# ═══════════════════════════════════════════════════════════════
# SECTION 1.5: Scope & Boundaries
# ═══════════════════════════════════════════════════════════════

scope:
  applies_to: |
    - Empirical ML papers with dataset evaluations
    - Major general-purpose ML venues: NeurIPS, ICML, ICLR
    - Time period: 2018-2024
    - Papers indexed in Papers With Code
  does_not_apply_to: |
    - Theoretical papers without empirical evaluation
    - Workshop papers and extended abstracts
    - Domain-specific venues (CVPR, ACL, etc.)
    - Papers before 2018 (limited PWC coverage)
  known_limitations: |
    - Tests upstream mechanism (concentration → diversity) not final outcome (→ reproducibility)
    - Cannot establish experimental causation (observational data only)
    - Publication bias may hide diversity attempts that were rejected
    - Papers With Code coverage is ~80%, not complete

