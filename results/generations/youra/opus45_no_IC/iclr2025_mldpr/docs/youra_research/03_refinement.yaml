# ═══════════════════════════════════════════════════════════════
# SECTION 1.1: Core Statement
# ═══════════════════════════════════════════════════════════════

core_statement:
  hypothesis_id: "H-BenchmarkConcentration-v1"
  confidence_level: 0.75
  core_hypothesis_statement: |
    Under conditions of high benchmark dataset concentration (HHI > venue median) in major ML venues (NeurIPS, ICML, ICLR),
    if HHI increases year-over-year,
    then evaluation diversity (normalized entropy) decreases in the subsequent year,
    because researchers collectively optimize for established benchmarks and reduce exploration of alternative evaluation paths.
  alternative_hypothesis_h0: |
    There is no significant relationship between year-over-year HHI changes and subsequent year evaluation entropy changes (β = 0, p > 0.05).

# ═══════════════════════════════════════════════════════════════
# SECTION 1.2: Variables Table
# ═══════════════════════════════════════════════════════════════

variables:
  independent:
    - name: "Benchmark Concentration (HHI)"
      type: "continuous"
      operationalization: "HHI_t = Σ s_d² where s_d = share of papers using dataset d in venue-year t"
      range: "[0, 1] where 0 = perfect diversity, 1 = complete concentration"
    - name: "Year-over-year HHI change"
      type: "continuous"
      operationalization: "ΔHHI_t = HHI_t - HHI_{t-1}"
  dependent:
    - name: "Evaluation Diversity (Entropy)"
      type: "continuous"
      operationalization: "Entropy_t = -Σ p(d) log p(d) where p(d) = proportion of papers using dataset d"
      primary: true
    - name: "Year-over-year Entropy change"
      type: "continuous"
      operationalization: "ΔEntropy_t = Entropy_t - Entropy_{t-1}"
      primary: false
    - name: "New dataset adoption speed"
      type: "continuous"
      operationalization: "Time (in years) for new dataset to reach 10% usage in venue"
      primary: false
  controlled:
    - name: "Venue"
      operationalization: "Fixed effects for NeurIPS, ICML, ICLR"
    - name: "Year"
      operationalization: "Fixed effects for 2018-2024"
    - name: "Paper count"
      operationalization: "Total papers in venue-year (controls for venue size)"

# ═══════════════════════════════════════════════════════════════
# SECTION 1.3: Causal Mechanism (DYNAMIC)
# ═══════════════════════════════════════════════════════════════

causal_mechanism:
  causal_chain_count: 5
  steps:
    - step: 1
      description: "High HHI indicates community convergence on few datasets"
      evidence: "Direct measurement from dataset usage distribution"
      falsifier: "If HHI calculation shows uniform usage, step 1 fails"
    - step: 2
      description: "Convergence creates implicit standards for 'acceptable' evaluation"
      evidence: "Social norm theory; publication acceptance correlates with standard benchmarks"
      falsifier: "If non-standard benchmarks have equal acceptance rates, implicit standards don't exist"
    - step: 3
      description: "New papers follow existing standards to ensure comparability"
      evidence: "Citation network analysis would show benchmark-following behavior"
      falsifier: "If new papers systematically use novel datasets regardless of concentration"
    - step: 4
      description: "Reduced diversity prevents discovery of benchmark-specific overfitting"
      evidence: "Lack of OOD evaluation means overfitting goes undetected"
      falsifier: "If diverse evaluation occurs despite high concentration"
    - step: 5
      description: "The cycle reinforces itself (positive feedback loop)"
      evidence: "Temporal autocorrelation in concentration patterns"
      falsifier: "If concentration naturally decreases without intervention"
  key_tension: "Whether concentration is pathological (lock-in) vs natural (field maturity)"
  evidence_summary: |
    The mechanism proposes that benchmark concentration creates self-reinforcing epistemic lock-in.
    Prior work (Engdahl 2024) documents alignment processes in benchmark construction but not usage patterns.
    This hypothesis tests whether usage concentration predicts diversity decline.

