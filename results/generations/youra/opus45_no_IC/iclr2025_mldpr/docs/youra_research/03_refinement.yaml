# SECTION 1.6: Testable Predictions
# ═══════════════════════════════════════════════════════════════

predictions:
  - id: "P1"
    primary: true
    statement: "Year-over-year HHI increases predict subsequent year entropy decreases"
    test_method: "Panel regression: Entropy_t ~ HHI_{t-1} + venue FE + year FE"
    success_criterion: "β(HHI_{t-1}) < 0 with p < 0.05"
    falsification: "β(HHI_{t-1}) ≥ 0 or p > 0.05"
  - id: "P2"
    primary: false
    statement: "HHI Granger-causes entropy but not the reverse"
    test_method: "Granger causality test with 1-2 year lags"
    success_criterion: "HHI → Entropy significant; Entropy → HHI not significant"
    falsification: "Reverse causality (Entropy → HHI significant)"
  - id: "P3"
    primary: false
    statement: "Papers using high-HHI datasets evaluate on fewer unique datasets"
    test_method: "Paper-level regression: unique_datasets ~ paper_primary_dataset_HHI + controls"
    success_criterion: "Negative coefficient with p < 0.05"
    falsification: "No significant relationship or positive coefficient"

