# H-M3 Implementation Tasks
# Generated: 2026-08-10
# Tier: FULL (max 30 tasks)
# Actual: 9 Epic tasks (all Low complexity)

hypothesis:
  id: h-m3
  type: MECHANISM
  statement: "Papers follow standards for comparability - citation drives benchmark homogeneity"
  gate:
    type: SHOULD_WORK
    conditions:
      - "Mann-Whitney U p < 0.01"
      - "Cohen's d > 0.3"
      - "N citation pairs >= 1000"

budget:
  tier: FULL
  max_tasks: 30
  epic_tasks: 9
  subtasks: 0
  total: 9

tasks:
  - id: A-1
    title: "PWC data loading"
    description: "Load papers-with-abstracts from HuggingFace, filter to NeurIPS/ICML/ICLR 2018-2024, extract dataset tags"
    complexity: 5
    complexity_breakdown: "2+1+1+1 (Module_Size + Dependencies + Algorithm + Integration)"
    status: todo
    module: data_loader.py
    functions:
      - load_papers

  - id: A-2
    title: "S2 citation fetch + cache"
    description: "Query Semantic Scholar API for paper citations, implement exponential backoff, cache responses to JSON"
    complexity: 8
    complexity_breakdown: "2+3+1+2"
    status: todo
    module: data_loader.py
    functions:
      - fetch_citations
    dependencies:
      - S2_API_KEY environment variable

  - id: A-3
    title: "Citation pair construction"
    description: "Build citing-cited pairs where both papers are in scope with non-empty dataset tags"
    complexity: 6
    complexity_breakdown: "2+2+1+1"
    status: todo
    module: data_loader.py
    functions:
      - build_citation_pairs
    depends_on:
      - A-1
      - A-2

  - id: A-4
    title: "Jaccard overlap computation"
    description: "Implement and validate Jaccard similarity function for dataset sets"
    complexity: 3
    complexity_breakdown: "1+0+1+1"
    status: todo
    module: overlap.py
    functions:
      - jaccard_similarity

  - id: A-5
    title: "Random pair baseline"
    description: "Sample matched-N random pairs per venue-year with reproducible seed"
    complexity: 4
    complexity_breakdown: "1+1+1+1"
    status: todo
    module: overlap.py
    functions:
      - sample_random_pairs

  - id: A-6
    title: "Overlap distribution pipeline"
    description: "Compute Jaccard overlap for citing pairs and random pairs across all venue-years"
    complexity: 6
    complexity_breakdown: "2+2+1+1"
    status: todo
    module: overlap.py
    functions:
      - compute_citation_dataset_overlap
    depends_on:
      - A-3
      - A-4
      - A-5

  - id: A-7
    title: "Statistical test"
    description: "Mann-Whitney U test (alternative='greater') + Cohen's d effect size + gate_check"
    complexity: 5
    complexity_breakdown: "1+1+2+1"
    status: todo
    module: analyze.py
    functions:
      - run_statistical_test
      - gate_check
    depends_on:
      - A-6

  - id: A-8
    title: "Visualization"
    description: "Generate 3 figures: gate metrics bar chart, overlap histograms, venue-year heatmap"
    complexity: 7
    complexity_breakdown: "3+1+1+2"
    status: todo
    module: visualize.py
    functions:
      - plot_gate_metrics
      - plot_overlap_distribution
      - plot_venue_year_heatmap
      - generate_all
    depends_on:
      - A-7

  - id: A-9
    title: "Pipeline integration"
    description: "Wire main() entrypoint, save results.json, run end-to-end validation"
    complexity: 5
    complexity_breakdown: "1+2+1+1"
    status: todo
    module: analyze.py
    functions:
      - main
    depends_on:
      - A-1
      - A-2
      - A-3
      - A-6
      - A-7
      - A-8

