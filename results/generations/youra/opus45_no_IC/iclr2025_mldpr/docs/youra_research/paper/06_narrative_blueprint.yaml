# Narrative Blueprint - Phase 6 Paper
# ICML 2025 Submission

metadata:
  generated: "2026-08-10"
  workflow: "Phase 6 Paper Writing"
  target: "ICML 2025"

# ============================================================================
# HOOK STRATEGY
# ============================================================================

hook:
  strategy: "Contrast expectation with finding"
  opening: |
    The machine learning community has worried about 'epistemic lock-in' —
    that benchmark concentration creates self-reinforcing cycles limiting
    research diversity. We find something more nuanced: citation networks
    propagate benchmark standards (24× overlap in citing pairs), but there
    is no evidence of causal feedback. The field co-evolves without being trapped.

  avoid:
    - "ML research is important"
    - "Benchmarks are widely used"
    - Generic importance statements

# ============================================================================
# PROBLEM FRAMING (Three Levels)
# ============================================================================

problem_framing:
  level_1_surface:
    statement: "ML papers increasingly use the same benchmarks"
    evidence: "HHI ranges 0.007-0.046 across venue-years; top-5 datasets account for 15-23% of evaluations"

  level_2_deeper:
    statement: "This concentration may create implicit standards that constrain research directions"
    evidence: "Papers in high-HHI venues are significantly more likely to adopt 'standard' benchmarks (β=56.75, p<0.001)"

  level_3_gap:
    statement: "But is this a self-reinforcing trap (lock-in) or natural co-evolution?"
    evidence: "Prior work (Engdahl 2024) documented alignment qualitatively; no quantitative test of temporal dynamics"

# ============================================================================
# KEY INSIGHT
# ============================================================================

key_insight:
  statement: |
    Papers that cite each other share benchmarks at 24× the rate of random pairs
    (Jaccard 0.318 vs 0.014; Cohen's d=1.93). Benchmark standards propagate through
    citation networks. However, concentration in year t-1 does NOT predict diversity
    decline in year t (β=+1.60, p=0.098). The 'lock-in' hypothesis is falsified.

  mechanism_verified:
    - "Concentration measurable (H-E1): HHI valid for 21/21 venue-years"
    - "Concentration reflects convergence (H-M1): ρ=0.90 with top-5 share"
    - "Prior HHI predicts standard adoption (H-M2): OR=4.4e24"
    - "Citation propagates benchmarks (H-M3): d=1.93"

  mechanism_refuted:
    - "Temporal feedback loop (H-M5): β positive, no Granger causality"

# ============================================================================
# EVIDENCE STRUCTURE
# ============================================================================

evidence_structure:
  main_results:
    - claim: "Benchmark concentration is measurable and varies"
      evidence: "HHI [0.007, 0.046] across 21 venue-years"
      figure: fig_1

    - claim: "HHI correctly captures convergence"
      evidence: "Mann-Whitney p<0.001; ρ=0.90 with top-5 share"
      figure: fig_2

    - claim: "Prior concentration predicts standard adoption"
      evidence: "β=56.75, p<0.001, OR=4.4e24"
      figure: fig_5

    - claim: "Citation networks drive benchmark homogeneity"
      evidence: "Jaccard 24× higher; Cohen's d=1.93"
      figure: fig_4

    - claim: "No temporal lock-in"
      evidence: "β(HHI_{t-1})=+1.60, p=0.098; 0 Granger tests significant"
      figure: fig_7

  negative_results:
    - claim: "Temporal precedence not demonstrated"
      evidence: "H-M5 failed: positive β, no Granger causality"
    - claim: "Diversity-breadth correlation not robust"
      evidence: "H-M4: ρ=-0.332, p=0.166 overall; only ICML significant"

# ============================================================================
# SECTION NARRATIVE GOALS
# ============================================================================

section_goals:
  introduction:
    narrative_role: "Hook → Problem → Insight → Preview"
    key_points:
      - Open with lock-in contrast (not generic importance)
      - Frame problem in three levels
      - Preview finding: co-evolution not lock-in
      - State contributions as story
    word_target: 800-1000

  related_work:
    narrative_role: "Show existing work insufficient"
    key_points:
      - Engdahl 2024: qualitative only, no temporal test
      - Olszewski 2023: reproducibility, not concentration mechanism
      - HPO-B: benchmark creation, not usage patterns
      - Gap: no quantitative concentration-diversity analysis
    word_target: 600-800

  methodology:
    narrative_role: "WHY this design solves the problem"
    key_points:
      - PWC data: 12,600 papers, 80%+ coverage
      - HHI operationalization and validation
      - Panel regression with fixed effects
      - Six sub-hypotheses testing mechanism chain
    word_target: 1000-1200
    figures: [fig_1, fig_2]

  experiments:
    narrative_role: "Design tests for specific claims"
    key_points:
      - Questions: concentration measurable? → standard propagation? → temporal lock-in?
      - Datasets: NeurIPS/ICML/ICLR 2018-2024 via PWC
      - Baselines: null model, cross-sectional only
      - Metrics: HHI, entropy, Jaccard overlap, β coefficients
    word_target: 800-1000

  results:
    narrative_role: "Present evidence"
    key_points:
      - H-E1: HHI valid (21/21 venue-years)
      - H-M1: HHI captures convergence (ρ=0.90)
      - H-M2: Prior HHI predicts adoption (β=56.75)
      - H-M3: Citation propagates benchmarks (d=1.93)
      - H-M4: Weak diversity-breadth correlation
      - H-M5: No temporal lock-in (β positive)
    word_target: 1000-1200
    figures: [fig_3, fig_4, fig_5, fig_6]

  discussion:
    narrative_role: "Interpret + acknowledge limits"
    key_points:
      - Key finding: standard propagation without lock-in
      - Theoretical contribution: co-evolution model
      - Limitations: small N (21), task proxy, observational
      - Broader impact: challenges deterministic lock-in narrative
    word_target: 400-600
    figures: [fig_7, fig_8]

  conclusion:
    narrative_role: "Callback to hook + future"
    key_points:
      - Echo: "co-evolves without being trapped"
      - Summary: what we showed
      - Future: longer time series, fine-grained datasets
    word_target: 300-400

  abstract:
    narrative_role: "Compress full story"
    key_points:
      - Problem: benchmark concentration in ML
      - Method: HHI + panel regression on PWC data
      - Finding: propagation without lock-in
      - Quantitative: d=1.93, β=+1.60
    word_target: 150

# ============================================================================
# CONTRIBUTIONS
# ============================================================================

contributions:
  - "First quantitative application of HHI to ML benchmark usage patterns"
  - "Evidence that citation networks propagate benchmark standards (d=1.93)"
  - "Falsification of temporal lock-in hypothesis (no Granger causality)"
  - "Documentation of venue heterogeneity in concentration-diversity dynamics"
