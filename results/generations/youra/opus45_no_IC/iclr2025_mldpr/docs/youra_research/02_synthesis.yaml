hypothesis_draft:
  title: "Benchmark Concentration and Epistemic Lock-in in ML Research"
  hypothesis_id: "H-BenchmarkConcentration-v1"
  core_claim: |
    In major ML venues (NeurIPS, ICML, ICLR), high benchmark dataset concentration
    (measured by Herfindahl-Hirschman Index) predicts reduced evaluation diversity
    (normalized entropy), with concentration changes temporally preceding diversity
    changes, indicating epistemic lock-in.
  mechanism: |
    1. High HHI indicates community convergence on few datasets
    2. Convergence creates implicit standards for "acceptable" evaluation
    3. New papers follow existing standards to ensure comparability
    4. Reduced diversity prevents discovery of benchmark-specific overfitting
    5. The cycle reinforces itself (positive feedback loop)
  predictions:
    - P1: "Negative correlation between ΔHHI_t and ΔEntropy_{t+1} (β < 0, p < 0.05)"
    - P2: "HHI Granger-causes entropy (but not reverse)"
    - P3: "Papers using high-HHI datasets evaluate on fewer unique datasets"

variables_summary:
  independent: "Benchmark concentration (HHI) and year-over-year HHI change"
  dependent_primary: "Evaluation diversity (normalized entropy) and year-over-year entropy change"
  controlled: "Venue fixed effects, year fixed effects, paper count"

null_hypothesis:
  h0_statement: |
    There is no significant relationship between year-over-year HHI changes
    and subsequent year evaluation entropy changes (β = 0).
  statistical_test: "Panel regression with lagged IV and fixed effects"
  significance_level: 0.05

novelty_assessment:
  status: "VERIFIED"
  key_innovation: "First quantitative HHI measurement of ML benchmark concentration with temporal-causal design"
  differentiation_summary: |
    Prior work (Engdahl 2024) analyzed benchmark construction qualitatively through ethnographic methods.
    Prior work (Olszewski 2023) measured reproducibility but didn't link to dataset practices.
    This hypothesis provides the first quantitative, longitudinal test of concentration effects on evaluation diversity.

clarity:
  overall_level: "HIGH"
  clarity_verified: true
  improvements_needed: []

experimental_scope:
  models: ["Panel regression with fixed effects", "Granger causality test"]
  datasets: ["Papers With Code dataset-paper links (2018-2024)"]
  baselines: ["No-effect model (venue + year effects only)", "Cross-sectional correlation"]

measurement_plan:
  data_collection:
    - source: "Papers With Code API"
      description: "Extract paper-dataset links for NeurIPS, ICML, ICLR (2018-2024)"
    - source: "Publication metadata"
