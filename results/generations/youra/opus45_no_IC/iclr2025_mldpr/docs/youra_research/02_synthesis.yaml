  procedure:
    - step: "Extract all papers from target venues via PWC"
    - step: "Parse dataset tags for each paper"
    - step: "Compute HHI per venue-year: HHI_t = Σ s_d²"
    - step: "Compute entropy per venue-year: Entropy_t = -Σ p(d) log p(d)"
    - step: "Construct panel dataset with venue-year observations"
    - step: "Run lagged panel regression with fixed effects"
    - step: "Run Granger causality tests"
  success_criteria:
    - "β(HHI_{t-1}) < 0 with p < 0.05"
    - "HHI Granger-causes entropy"
    - "Effect size interpretable (standardized β for practical significance)"

